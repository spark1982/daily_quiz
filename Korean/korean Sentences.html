<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->

// Remove duplicate 모르겠어 (keep only one) and 창난이야→장난이야
// Actually keep all 120 as-is; the two 모르겠어 entries are in different groups, both valid.

const TOTAL = ALL_QUESTIONS.length;

const ORDER_KEY = STORAGE_KEY + '_order_v1';
function identityOrder(){const a=[];for(let i=0;i<TOTAL;i++)a.push(i);return a;}
function isValidOrder(o){if(!Array.isArray(o)||o.length!==TOTAL)return false;const seen={};for(let i=0;i<o.length;i++){if(typeof o[i]!=='number'||o[i]<0||o[i]>=TOTAL||seen[o[i]])return false;seen[o[i]]=true;}return true;}
function loadOrder(){try{const o=JSON.parse(localStorage.getItem(ORDER_KEY)||'null');return isValidOrder(o)?o:null;}catch(e){return null;}}
function saveOrder(o){localStorage.setItem(ORDER_KEY,JSON.stringify(o));}
function randomOrder(){const a=identityOrder();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));const t=a[k];a[k]=a[j];a[j]=t;}return a;}
let currentOrder=loadOrder()||identityOrder();saveOrder(currentOrder);
let pendingFreshMode='original';

function defaultState(){
  const shuffles = {};
  ALL_QUESTIONS.forEach((_,i)=>{
    const arr = ALL_QUESTIONS[i].opts.map((_,j)=>j);
    for(let k=arr.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[arr[k],arr[r]]=[arr[r],arr[k]];}
    shuffles[i]=arr;
  });
  return {cur:0, answers:{}, shuffles, showResults:false, retryMode:false, retryList:[]};
}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const s = JSON.parse(raw);
    const bound = (s.retryMode) ? ((s.retryList||[]).length) : TOTAL;
    if(typeof s.cur !== 'number' || s.cur < 0 || s.cur >= bound) throw new Error();
    if(typeof s.answers !== 'object' || typeof s.shuffles !== 'object') throw new Error();
    return s;
  }catch(e){
    localStorage.removeItem(STORAGE_KEY);
    return defaultState();
  }
}

function getAttempts(){
  try{return parseInt(localStorage.getItem(ATT_KEY)||'0');}catch(e){return 0;}
}
function incAttempts(){
  try{localStorage.setItem(ATT_KEY, String(getAttempts()+1));}catch(e){}
}

let state = loadState();
let dotsOpen = false;
let retryMode = !!state.retryMode;
let retryList = state.retryList || [];
let retryIndex = retryMode ? (state.cur||0) : 0;
let retryAnswers = {};

function syncRetryToState(){
  state.retryMode = retryMode;
  state.retryList = retryList;
  if(retryMode) state.cur = retryIndex;
}

function updateAttDisplay(){
  const el = document.getElementById('att-display');
  if(el) el.textContent = 'Korean Sentences | Total Attempts: ' + getAttempts();
}

function render(){
  updateAttDisplay();
  const qa = document.getElementById('quiz-area');
  const rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  const qIdx = retryMode ? retryList[retryIndex] : currentOrder[state.cur];
  const q = ALL_QUESTIONS[qIdx];
  const total = retryMode ? retryList.length : TOTAL;
  const cur = retryMode ? retryIndex : state.cur;

  document.getElementById('q-num').textContent = 'Q' + (cur+1) + ' / ' + total;
  document.getElementById('q-text').textContent = q.k;
  document.getElementById('tts-btn').setAttribute('data-korean', q.k);

  const shuffle = state.shuffles[qIdx] || q.opts.map((_,i)=>i);
  const answered = state.answers[qIdx];
  const correctIdx = q.opts.indexOf(q.e);

  const optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  shuffle.forEach((origIdx, pos)=>{
    const btn = document.createElement('button');
    btn.className='opt-btn';
    btn.textContent = q.opts[origIdx];
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(origIdx === correctIdx) btn.classList.add(answered === origIdx ? 'correct' : 'revealed');
      else if(answered === origIdx) btn.classList.add('wrong');
    }
    btn.onclick = () => window.chooseAnswer(origIdx);
    optDiv.appendChild(btn);
  });

  const expDiv = document.getElementById('explanation');
  if(answered !== undefined && answered !== correctIdx){
    expDiv.style.display='block';
    expDiv.textContent = 'The correct answer is: ' + q.e;
  } else {
    expDiv.style.display='none';
  }

  const nextBtn = document.getElementById('next-btn');
  if(cur === total-1) nextBtn.textContent = 'See Results →';
  else nextBtn.textContent = 'Next';

  updateProgress();
  updateDots();
}

function updateProgress(){
  const list = retryMode ? retryList : currentOrder;
  let answered = 0;
  for(let k=0;k<list.length;k++){ if(state.answers[list[k]] !== undefined) answered++; }
  document.getElementById('prog-label').textContent = answered + ' / ' + list.length;
  document.getElementById('prog-fill').style.width = (answered/list.length*100)+'%';
}

function updateDots(){
  const panel = document.getElementById('dot-panel');
  panel.innerHTML='';
  const list = retryMode ? retryList : currentOrder;
  for(let pos=0;pos<list.length;pos++){
    const qi = list[pos];
    const dot = document.createElement('button');
    dot.className='dot';
    dot.textContent = pos+1;
    if(state.answers[qi] !== undefined){
      const q = ALL_QUESTIONS[qi];
      const correctIdx = q.opts.indexOf(q.e);
      dot.classList.add(state.answers[qi]===correctIdx?'correct':'wrong');
    }
    const curPos = retryMode ? retryIndex : state.cur;
    if(pos===curPos) dot.classList.add('current');
    dot.onclick=()=>window.jumpTo(pos);
    panel.appendChild(dot);
  }
  let doneCount = 0;
  for(let k=0;k<list.length;k++){ if(state.answers[list[k]] !== undefined) doneCount++; }
  if(doneCount === list.length){
    const pill = document.createElement('button');
    pill.className='results-pill';
    pill.textContent='Results';
    pill.onclick=()=>{state.showResults=true;syncRetryToState();saveState();render();};
    panel.appendChild(pill);
  }
}

window.toggleDots = function(){
  dotsOpen=!dotsOpen;
  const panel=document.getElementById('dot-panel');
  const btn = document.querySelector('.jump-btn');
  if(dotsOpen){panel.classList.add('open');btn.textContent='Hide';}
  else{panel.classList.remove('open');btn.textContent='Jump';}
};

window.jumpTo = function(pos){
  if(retryMode){
    retryIndex = pos;
    syncRetryToState();
    saveState();
    render();
    return;
  }
  state.cur=pos;
  saveState();
  render();
};

window.chooseAnswer = function(origIdx){
  const qIdx = retryMode ? retryList[retryIndex] : currentOrder[state.cur];
  if(state.answers[qIdx]!==undefined) return;
  state.answers[qIdx]=origIdx;
  syncRetryToState();
  saveState();
  render();
};

window.goPrev = function(){
  if(retryMode){
    if(retryIndex>0){retryIndex--;syncRetryToState();saveState();render();}
    return;
  }
  if(state.cur>0){state.cur--;saveState();render();}
};

window.goNext = function(){
  if(retryMode){
    if(retryIndex<retryList.length-1){retryIndex++;syncRetryToState();saveState();render();}
    else{showRetryResults();}
    return;
  }
  const total = TOTAL;
  if(state.cur<total-1){state.cur++;saveState();render();}
  else{
    state.showResults=true;
    incAttempts();
    saveState();
    render();
  }
};

window.speakKorean = function(){
  const btn = document.getElementById('tts-btn');
  const txt = btn.getAttribute('data-korean');
  if(!txt) return;
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang='ko-KR';
    window.speechSynthesis.speak(u);
  }
};

function renderResults(){
  const list = retryMode ? retryList : currentOrder;
  let correct=0, wrong=0, skipped=0;
  for(let pos=0;pos<list.length;pos++){
    const qi = list[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    const correctIdx = ALL_QUESTIONS[qi].opts.indexOf(ALL_QUESTIONS[qi].e);
    if(state.answers[qi]===correctIdx) correct++; else wrong++;
  }
  const heading = document.querySelector('.results-heading');
  if(heading) heading.textContent = retryMode ? 'Retry Results' : 'Results';
  document.getElementById('results-score').textContent = correct + ' correct, ' + wrong + ' wrong, ' + skipped + ' skipped — out of ' + list.length;

  const grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(let pos=0;pos<list.length;pos++){
    const qi = list[pos];
    const card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.innerHTML='<div class="r-card-q">Q'+(pos+1)+'</div>Skipped';
    } else {
      const correctIdx=ALL_QUESTIONS[qi].opts.indexOf(ALL_QUESTIONS[qi].e);
      const ok = state.answers[qi]===correctIdx;
      card.className='r-card '+(ok?'correct':'wrong');
      card.innerHTML='<div class="r-card-q">Q'+(pos+1)+'</div>'+(ok?'Correct':'Wrong');
    }
    card.onclick=()=>window.jumpFromResults(pos);
    grid.appendChild(card);
  }
}

window.jumpFromResults = function(pos){
  state.showResults=false;
  if(retryMode){
    retryIndex = pos;
    syncRetryToState();
  } else {
    state.cur=pos;
  }
  saveState();
  render();
};

window.retryWrong = function(){
  const list = retryMode ? retryList : currentOrder;
  const wrong = [];
  for(let k=0;k<list.length;k++){
    const i = list[k];
    if(state.answers[i]!==undefined && state.answers[i]!==ALL_QUESTIONS[i].opts.indexOf(ALL_QUESTIONS[i].e)){
      wrong.push(i);
    }
  }
  if(wrong.length===0){alert('No wrong answers to retry!');return;}
  retryMode=true;
  retryList=wrong;
  retryIndex=0;
  retryAnswers={};
  wrong.forEach(i=>{ delete state.answers[i]; });
  state.cur=0;
  state.showResults=false;
  syncRetryToState();
  saveState();
  render();
};

function showRetryResults(){
  const correct = retryList.filter(i=>state.answers[i]===ALL_QUESTIONS[i].opts.indexOf(ALL_QUESTIONS[i].e)).length;
  alert('Retry done! ' + correct + ' / ' + retryList.length + ' correct.');
  state.showResults=true;
  syncRetryToState();
  saveState();
  render();
}

window.copyResults = function(){
  const list = retryMode ? retryList : currentOrder;
  const lines = ['Korean-English Quiz Results'];
  for(let pos=0;pos<list.length;pos++){
    const qi = list[pos];
    let s='Q'+(pos+1)+': ';
    if(state.answers[qi]===undefined) s+='Skipped';
    else{
      const correctIdx=ALL_QUESTIONS[qi].opts.indexOf(ALL_QUESTIONS[qi].e);
      s+=(state.answers[qi]===correctIdx?'Correct':'Wrong');
    }
    lines.push(s);
  }
  const text=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(text).catch(()=>{});}
  else{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
};

window.startFresh = function(mode){
  pendingFreshMode = mode;
  const title = document.getElementById('modalTitle');
  const text = document.getElementById('modalText');
  if(mode==='random'){
    title.textContent='Start Fresh (Random Order)?';
    text.textContent='Questions will be reshuffled into a new random order, and all progress will be reset.';
  }else{
    title.textContent='Start Fresh (Original Order)?';
    text.textContent='Questions will return to their original order, and all progress will be reset.';
  }
  document.getElementById('fresh-modal').classList.add('show');
};
window.cancelFresh = function(){
  document.getElementById('fresh-modal').classList.remove('show');
};
window.confirmFresh = function(){
  document.getElementById('fresh-modal').classList.remove('show');
  currentOrder = (pendingFreshMode==='random') ? randomOrder() : identityOrder();
  saveOrder(currentOrder);
  localStorage.removeItem(STORAGE_KEY);
  retryMode=false;
  retryList=[];
  retryIndex=0;
  state=defaultState();
  saveState();
  render();
};

// init
if(state.showResults){
  render();
} else {
  document.getElementById('quiz-area').style.display='block';
  render();
}
})();
</script>
