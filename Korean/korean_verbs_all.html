<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->

: ["to fix", "to mix", "to change", "to cut"], "ci": 2, "exp": "\"바꾸다\" means \"to change\" or \"to exchange.\""}, {"stem": "놀다", "opts": ["to work", "to play", "to study", "to rest"], "ci": 1, "exp": "\"놀다\" means \"to play.\""}, {"stem": "모으다", "opts": ["to gather", "to throw away", "to divide", "to cut"], "ci": 0, "exp": "\"모으다\" means \"to gather\" or \"to collect.\""}, {"stem": "얼다", "opts": ["to melt", "to boil", "to flow", "to freeze"], "ci": 3, "exp": "\"얼다\" means \"to freeze.\""}, {"stem": "섞다", "opts": ["to cut", "to divide", "to mix", "to attach"], "ci": 2, "exp": "\"섞다\" means \"to mix.\""}, {"stem": "공부하다", "opts": ["to play", "to study", "to rest", "to teach"], "ci": 1, "exp": "\"공부하다\" means \"to study.\""}, {"stem": "그리다", "opts": ["to draw", "to write", "to read", "to take a photo"], "ci": 0, "exp": "\"그리다\" means \"to draw.\""}, {"stem": "흐르다", "opts": ["to freeze", "to dry", "to boil", "to flow"], "ci": 3, "exp": "\"흐르다\" means \"to flow.\""}, {"stem": "자르다", "opts": ["to attach", "to mix", "to cut", "to fix"], "ci": 2, "exp": "\"자르다\" means \"to cut.\""}, {"stem": "일하다", "opts": ["to play", "to work", "to rest", "to study"], "ci": 1, "exp": "\"일하다\" means \"to work.\""}, {"stem": "만들다", "opts": ["to make", "to fix", "to draw", "to decorate"], "ci": 0, "exp": "\"만들다\" means \"to make.\""}, {"stem": "타다", "opts": ["to melt", "to boil", "to freeze", "to burn"], "ci": 3, "exp": "\"타다\" here means \"to burn.\" (It can also mean \"to ride.\")"}, {"stem": "붙이다", "opts": ["to cut", "to throw", "to attach", "to fix"], "ci": 2, "exp": "\"붙이다\" means \"to attach\" or \"to stick.\""}, {"stem": "준비하다", "opts": ["to wait", "to prepare", "to help", "to study"], "ci": 1, "exp": "\"준비하다\" means \"to prepare\" or \"to get ready.\""}, {"stem": "찍다", "opts": ["to take a photo", "to draw", "to write", "to read"], "ci": 0, "exp": "\"찍다\" means \"to take a photo\" (or \"to stamp\")."}, {"stem": "식다", "opts": ["to boil", "to freeze", "to dry", "to cool down"], "ci": 3, "exp": "\"식다\" means \"to cool down\" or \"to get cold.\""}, {"stem": "던지다", "opts": ["to catch", "to lift", "to throw", "to put down"], "ci": 2, "exp": "\"던지다\" means \"to throw.\""}, {"stem": "기다리다", "opts": ["to follow", "to wait", "to leave", "to prepare"], "ci": 1, "exp": "\"기다리다\" means \"to wait.\""}, {"stem": "치다", "opts": ["to hit", "to throw", "to catch", "to lift"], "ci": 0, "exp": "\"치다\" means \"to hit\" or \"to strike.\""}, {"stem": "끓다", "opts": ["to freeze", "to melt", "to cool down", "to boil"], "ci": 3, "exp": "\"끓다\" means \"to boil.\""}, {"stem": "도와주다", "opts": ["to wait", "to prepare", "to help", "to follow"], "ci": 2, "exp": "\"도와주다\" means \"to help.\""}, {"stem": "마르다", "opts": ["to get wet", "to dry", "to freeze", "to flow"], "ci": 1, "exp": "\"마르다\" means \"to dry\" or \"to become dry.\""}, {"stem": "나누다", "opts": ["to divide", "to gather", "to mix", "to attach"], "ci": 0, "exp": "\"나누다\" means \"to divide\" or \"to share.\""}, {"stem": "젖다", "opts": ["to dry", "to freeze", "to melt", "to get wet"], "ci": 3, "exp": "\"젖다\" means \"to get wet.\""}, {"stem": "빛나다", "opts": ["to burn", "to melt", "to shine", "to flow"], "ci": 2, "exp": "\"빛나다\" means \"to shine\" or \"to sparkle.\""}, {"stem": "떨다", "opts": ["to hide", "to tremble", "to shine", "to flow"], "ci": 1, "exp": "\"떨다\" means \"to tremble\" or \"to shiver.\""}, {"stem": "숨다", "opts": ["to hide", "to tremble", "to shine", "to flow"], "ci": 0, "exp": "\"숨다\" means \"to hide.\""}];
var TOTAL=qs.length;
var ORDER_KEY=QUIZ_KEY+'_order_v1';
function identityOrder(){var a=[];for(var i=0;i<TOTAL;i++)a.push(i);return a;}
function isValidOrder(o){if(!Array.isArray(o)||o.length!==TOTAL)return false;var seen={};for(var i=0;i<o.length;i++){if(typeof o[i]!=='number'||o[i]<0||o[i]>=TOTAL||seen[o[i]])return false;seen[o[i]]=true;}return true;}
function loadOrder(){try{var o=JSON.parse(localStorage.getItem(ORDER_KEY)||'null');return isValidOrder(o)?o:null;}catch(e){return null;}}
function saveOrder(o){localStorage.setItem(ORDER_KEY,JSON.stringify(o));}
function randomOrder(){var a=identityOrder();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
var currentOrder=loadOrder()||identityOrder();saveOrder(currentOrder);
var pendingFreshMode='original';
var state={};
function loadState(){try{var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');var bound=(s&&s.retryMode)?((s.retryList||[]).length):qs.length;if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<bound&&s.answers&&typeof s.answers==='object'&&s.shuffles&&typeof s.shuffles==='object'){state=s;if(!state.retryList)state.retryList=[];if(typeof state.retryMode!=='boolean')state.retryMode=false;}else{resetState();}}catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}}
function resetState(){state={cur:0,answers:{},shuffles:{},showResults:false,retryMode:false,retryList:[]};}
function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}
function getList(){return state.retryMode?state.retryList:identityOrder();}
function getShuffle(i){if(!state.shuffles[i]){var a=[0,1,2,3];for(var k=3;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}state.shuffles[i]=a;}return state.shuffles[i];}
function getCSI(i){var qi=currentOrder[i];return getShuffle(i).indexOf(qs[qi].ci);}
function loadAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0',10);}
function updateNav(){var list=getList();var ans=0;for(var k=0;k<list.length;k++){if(state.answers[list[k]]!==undefined)ans++;}document.getElementById('nav-count').textContent=ans+' / '+list.length;document.getElementById('prog-fill').style.width=(ans/list.length*100).toFixed(1)+'%';renderDots();}
function toggleJump(){var p=document.getElementById('dot-panel');var b=document.getElementById('jump-btn');if(p.style.display==='none'||p.style.display===''){p.style.display='block';b.innerHTML='Hide &#9652;';renderDots();}else{p.style.display='none';b.innerHTML='Jump &#9662;';}}
function renderDots(){var p=document.getElementById('dot-panel');if(p.style.display==='none'||p.style.display==='')return;var list=getList();var h='';for(var pos=0;pos<list.length;pos++){var i=list[pos];var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===getCSI(i)?'#1D9E75':'#E24B4A');h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</span>';}var doneCount=0;for(var k2=0;k2<list.length;k2++){if(state.answers[list[k2]]!==undefined)doneCount++;}if(doneCount===list.length){h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';}p.innerHTML=h;}
function goToQ(pos){state.cur=pos;state.showResults=false;saveState();render();document.getElementById('dot-panel').style.display='none';document.getElementById('jump-btn').innerHTML='Jump &#9662;';}
function showResults(){state.showResults=true;if(!state.retryMode){localStorage.setItem(ATT_KEY,loadAttempts()+1);}saveState();render();}
function speakWord(){var list=getList();var i=list[state.cur];var w=qs[currentOrder[i]].stem;var u=new SpeechSynthesisUtterance(w);u.lang='ko-KR';window.speechSynthesis.speak(u);}
function render(){
  document.getElementById('att-display').textContent=SUBTITLE+' | Total Attempts: '+loadAttempts();
  if(state.showResults){renderResults();return;}
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var list=getList();var pos=state.cur;var i=list[pos];var qi=currentOrder[i];var q=qs[qi];
  document.getElementById('q-num').textContent='Question '+(pos+1)+' of '+list.length;
  document.getElementById('q-word').textContent=q.stem;
  var sh=getShuffle(i);var ans=state.answers[i];var csi=getCSI(i);
  var html='';
  for(var s=0;s<4;s++){var oi=sh[s];var cls='opt-btn';var dis='';if(ans!==undefined){dis='disabled';if(s===csi)cls+=' correct';else if(s===ans)cls+=' wrong';}html+='<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+escHtml(q.opts[oi])+'</button>';}
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');if(ans!==undefined&&ans!==csi){eb.style.display='block';eb.textContent=q.exp;}else{eb.style.display='none';}
  document.getElementById('next-btn').textContent=(pos===list.length-1)?'See Results \u2192':'Next';
  document.querySelector('.prev-btn').disabled=(pos===0);
}
function renderResults(){
  document.getElementById('quizArea').style.display='none';document.getElementById('resultsArea').style.display='block';updateNav();
  var list=getList();
  var c=0,w=0,sk=0;for(var pos=0;pos<list.length;pos++){var i=list[pos];if(state.answers[i]===undefined)sk++;else if(state.answers[i]===getCSI(i))c++;else w++;}
  document.getElementById('results-summary').innerHTML='<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';for(var pos=0;pos<list.length;pos++){var i=list[pos];var qi=currentOrder[i];var a=state.answers[i];var label,bg,tc;if(a===undefined){label='Skipped';bg='#d7dde6';tc='#555';}else if(a===getCSI(i)){label='Correct';bg='#E1F5EE';tc='#085041';}else{label='Wrong';bg='#FCEBEB';tc='#501313';}html+='<div class="results-card" onclick="goToQ('+pos+')"><span style="font-size:1rem;font-weight:600;color:#333;">'+escHtml(qs[qi].stem)+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';}
  document.getElementById('results-cards').innerHTML=html;
}
function pick(qi,si){if(state.answers[qi]!==undefined)return;state.answers[qi]=si;saveState();render();}
function go(dir){var list=getList();if(dir===1&&state.cur===list.length-1){showResults();return;}state.cur=Math.max(0,Math.min(list.length-1,state.cur+dir));saveState();render();}
function retryWrong(){var list=getList();var wrong=[];for(var k=0;k<list.length;k++){var i=list[k];if(state.answers[i]!==undefined&&state.answers[i]!==getCSI(i)){wrong.push(i);}}if(wrong.length===0)return;wrong.forEach(function(i){delete state.answers[i];});state.retryMode=true;state.retryList=wrong;state.cur=0;state.showResults=false;saveState();render();}
function copyRes(){var list=getList();var lines=['Korean Verbs (All 102) - Results'];for(var pos=0;pos<list.length;pos++){var i=list[pos];var qi=currentOrder[i];var a=state.answers[i];lines.push('Q'+(pos+1)+' '+qs[qi].stem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));}var txt=lines.join('\n');if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fb(txt);});}else{fb(txt);}}
function fb(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function openFreshModal(mode){pendingFreshMode=mode;var title=document.getElementById('modalTitle');var text=document.getElementById('modalText');if(mode==='random'){title.textContent='Start Fresh (Random Order)?';text.textContent='Questions will be reshuffled into a new random order, and all progress will be reset.';}else{title.textContent='Start Fresh (Original Order)?';text.textContent='Questions will return to their original order, and all progress will be reset.';}document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){document.getElementById('freshModal').style.display='none';currentOrder=(pendingFreshMode==='random')?randomOrder():identityOrder();saveOrder(currentOrder);localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
window.pick=pick;window.go=go;window.goToQ=goToQ;window.toggleJump=toggleJump;window.speakWord=speakWord;
window.retryWrong=retryWrong;window.copyRes=copyRes;window.openFreshModal=openFreshModal;window.confirmFresh=confirmFresh;window.showResults=showResults;
loadState();saveState();render();
})();
</script>
