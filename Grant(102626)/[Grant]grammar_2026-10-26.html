var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261026";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["has been", "have being", "had be", "NO CHANGE"], "ci": 3, "exp": "Use <i>have</i> + past participle for something that started in the past and is still true. <i>You</i> takes <i>have</i>: <i>You <b>have been</b> such a kind neighbor ever since we moved here</i> is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Thank-You Note to Mrs. Kim</strong><br><b>(1)</b> Dear Mrs. Kim, thank you for feeding our cat, Biscuit, while we were in Florida last week. <b>(2)</b> You <u>have been</u> such a kind neighbor ever since we moved here. <b>(3)</b> Mom told my sister and <u>I</u> that Biscuit purred the whole time you visited. <b>(4)</b> When we got home Biscuit ran straight to the window to look for you. <b>(5)</b> She seems <u>more happier</u> now that she has a new friend. <b>(6)</b> We brought you a bag of oranges from Florida as a small thank-you gift."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["me", "mine", "myself", "NO CHANGE"], "ci": 0, "exp": "After a verb like <i>told</i>, use the object pronoun <i>me</i>. Try it alone: <i>Mom told <b>me</b></i> (not <i>Mom told I</i>). So: <i>Mom told my sister and <b>me</b>.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Thank-You Note to Mrs. Kim</strong><br><b>(1)</b> Dear Mrs. Kim, thank you for feeding our cat, Biscuit, while we were in Florida last week. <b>(2)</b> You <u>have been</u> such a kind neighbor ever since we moved here. <b>(3)</b> Mom told my sister and <u>I</u> that Biscuit purred the whole time you visited. <b>(4)</b> When we got home Biscuit ran straight to the window to look for you. <b>(5)</b> She seems <u>more happier</u> now that she has a new friend. <b>(6)</b> We brought you a bag of oranges from Florida as a small thank-you gift."}, {"stem": "Where should a comma be added in sentence 4?", "opts": ["When we got home, Biscuit ran straight to the window to look for you.", "When we got home Biscuit ran straight, to the window to look for you.", "When, we got home Biscuit ran straight to the window to look for you.", "When we got home Biscuit ran straight to the window, to look for you."], "ci": 0, "exp": "Put a comma after an opening part that tells <i>when</i>: <i>When we got home<b>,</b> Biscuit ran straight to the window.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Thank-You Note to Mrs. Kim</strong><br><b>(1)</b> Dear Mrs. Kim, thank you for feeding our cat, Biscuit, while we were in Florida last week. <b>(2)</b> You <u>have been</u> such a kind neighbor ever since we moved here. <b>(3)</b> Mom told my sister and <u>I</u> that Biscuit purred the whole time you visited. <b>(4)</b> When we got home Biscuit ran straight to the window to look for you. <b>(5)</b> She seems <u>more happier</u> now that she has a new friend. <b>(6)</b> We brought you a bag of oranges from Florida as a small thank-you gift."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["more happily", "most happier", "NO CHANGE", "happier"], "ci": 3, "exp": "Don’t use <i>more</i> with an <i>-er</i> word — that is a double comparison. Use just <i>happier</i>: <i>She seems <b>happier</b> now.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Thank-You Note to Mrs. Kim</strong><br><b>(1)</b> Dear Mrs. Kim, thank you for feeding our cat, Biscuit, while we were in Florida last week. <b>(2)</b> You <u>have been</u> such a kind neighbor ever since we moved here. <b>(3)</b> Mom told my sister and <u>I</u> that Biscuit purred the whole time you visited. <b>(4)</b> When we got home Biscuit ran straight to the window to look for you. <b>(5)</b> She seems <u>more happier</u> now that she has a new friend. <b>(6)</b> We brought you a bag of oranges from Florida as a small thank-you gift."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "was", "have", "is having"], "ci": 2, "exp": "The subject is <i>animals</i> (plural), not <i>tide pool</i>. A plural subject takes <i>have</i>: <i>The animals in a tide pool <b>have</b> to survive big changes.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: Life in a Tide Pool</strong><br><b>(1)</b> A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide. <b>(2)</b> The animals in a tide pool <u>has</u> to survive big changes every day. <b>(3)</b> Hermit crabs live in tide pools. <b>(4)</b> Hermit crabs borrow empty shells from snails. <b>(5)</b> When the tide comes back in, fresh seawater <u>washed</u> over the pool and brings new food. <b>(6)</b> Visitors should never pull a sea star off a rock because its tube feet can tear. <b>(7)</b> Many visitors say they could of stayed for hours watching the crabs."}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["Hermit crabs, who’s borrow empty shells from snails, live in tide pools.", "Hermit crabs live in tide pools, which borrow empty shells from snails.", "Hermit crabs, which borrow empty shells from snails, live in tide pools.", "Hermit crabs live in tide pools, they borrow empty shells from snails."], "ci": 2, "exp": "Use <i>which</i> right after the noun it describes: <i>Hermit crabs<b>, which</b> borrow empty shells from snails<b>,</b> live in tide pools.</i> Putting <i>which</i> after <i>tide pools</i> makes it sound like the tide pools borrow shells.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: Life in a Tide Pool</strong><br><b>(1)</b> A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide. <b>(2)</b> The animals in a tide pool <u>has</u> to survive big changes every day. <b>(3)</b> Hermit crabs live in tide pools. <b>(4)</b> Hermit crabs borrow empty shells from snails. <b>(5)</b> When the tide comes back in, fresh seawater <u>washed</u> over the pool and brings new food. <b>(6)</b> Visitors should never pull a sea star off a rock because its tube feet can tear. <b>(7)</b> Many visitors say they could of stayed for hours watching the crabs."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["had washed", "washes", "will wash", "NO CHANGE"], "ci": 1, "exp": "The rest of the sentence is in the present (<i>comes</i>, <i>brings</i>), so keep the same tense: <i>fresh seawater <b>washes</b> over the pool and brings new food.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Report: Life in a Tide Pool</strong><br><b>(1)</b> A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide. <b>(2)</b> The animals in a tide pool <u>has</u> to survive big changes every day. <b>(3)</b> Hermit crabs live in tide pools. <b>(4)</b> Hermit crabs borrow empty shells from snails. <b>(5)</b> When the tide comes back in, fresh seawater <u>washed</u> over the pool and brings new food. <b>(6)</b> Visitors should never pull a sea star off a rock because its tube feet can tear. <b>(7)</b> Many visitors say they could of stayed for hours watching the crabs."}, {"stem": "Which sentence contains an error?", "opts": ["Visitors should never pull a sea star off a rock because its tube feet can tear.", "Hermit crabs live in tide pools.", "Many visitors say they could of stayed for hours watching the crabs.", "A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide."], "ci": 2, "exp": "<i>Could of</i> is never correct — it only sounds like <i>could’ve</i>. Write <i>could have</i>: <i>they <b>could have</b> stayed for hours.</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Report: Life in a Tide Pool</strong><br><b>(1)</b> A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide. <b>(2)</b> The animals in a tide pool <u>has</u> to survive big changes every day. <b>(3)</b> Hermit crabs live in tide pools. <b>(4)</b> Hermit crabs borrow empty shells from snails. <b>(5)</b> When the tide comes back in, fresh seawater <u>washed</u> over the pool and brings new food. <b>(6)</b> Visitors should never pull a sea star off a rock because its tube feet can tear. <b>(7)</b> Many visitors say they could of stayed for hours watching the crabs."}, {"stem": "Where should a comma be added in sentence 2?", "opts": ["“I brought your, favorite cake” Nate said proudly.", "“I brought your favorite cake” Nate, said proudly.", "“I brought your favorite cake,” Nate said proudly.", "“I brought, your favorite cake” Nate said proudly."], "ci": 2, "exp": "When a quote comes before <i>he said</i>, put a comma at the end of the quote, inside the quotation marks: <i>“I brought your favorite cake<b>,</b>” Nate said proudly.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>The Wrong Cake</strong><br><b>(1)</b> On Saturday morning, Nate carried a big white box into Grandma’s kitchen. <b>(2)</b> “I brought your favorite cake” Nate said proudly. <b>(3)</b> Grandma <u>has baked</u> her own birthday cake every year since she was a girl, so she smiled in surprise. <b>(4)</b> When she lifted the lid, they both saw that the bakery had written someone <u>elses</u> name on top. <b>(5)</b> Nate groaned. <b>(6)</b> Grandma laughed. <b>(7)</b> “Frank won’t mind sharing,” she said, and she cut two big slices."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["has baken", "NO CHANGE", "has bake", "have baked"], "ci": 1, "exp": "<i>Has</i> + past participle (<i>baked</i>) with <i>since</i> shows something that started long ago and still happens. One person, Grandma, takes <i>has</i>, so <i>Grandma <b>has baked</b></i> is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>The Wrong Cake</strong><br><b>(1)</b> On Saturday morning, Nate carried a big white box into Grandma’s kitchen. <b>(2)</b> “I brought your favorite cake” Nate said proudly. <b>(3)</b> Grandma <u>has baked</u> her own birthday cake every year since she was a girl, so she smiled in surprise. <b>(4)</b> When she lifted the lid, they both saw that the bakery had written someone <u>elses</u> name on top. <b>(5)</b> Nate groaned. <b>(6)</b> Grandma laughed. <b>(7)</b> “Frank won’t mind sharing,” she said, and she cut two big slices."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["elses’", "NO CHANGE", "else’s", "else is"], "ci": 2, "exp": "The name belongs to someone else, so add <i>’s</i> to show ownership: <i>someone <b>else’s</b> name.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>The Wrong Cake</strong><br><b>(1)</b> On Saturday morning, Nate carried a big white box into Grandma’s kitchen. <b>(2)</b> “I brought your favorite cake” Nate said proudly. <b>(3)</b> Grandma <u>has baked</u> her own birthday cake every year since she was a girl, so she smiled in surprise. <b>(4)</b> When she lifted the lid, they both saw that the bakery had written someone <u>elses</u> name on top. <b>(5)</b> Nate groaned. <b>(6)</b> Grandma laughed. <b>(7)</b> “Frank won’t mind sharing,” she said, and she cut two big slices."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Nate groaned, Grandma laughed.", "Nate groaned because Grandma laughed.", "Nate groaned but, Grandma laughed.", "Nate groaned, but Grandma laughed."], "ci": 3, "exp": "The two people react in opposite ways, so join them with a comma and <i>but</i>: <i>Nate groaned<b>, but</b> Grandma laughed.</i> Using <i>because</i> changes the meaning; a comma alone makes a run-on.", "tag": "C var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
