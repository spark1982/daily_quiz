<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Advanced Vocabulary</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Grant] Advanced Vocabulary</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>

    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>

</div>

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261026";
var RAW_QUESTIONS = [{"stem": "After many complaints about long lunch lines, the principal promised to _____ the way the cafeteria worked. Which word best completes the sentence?", "opts": ["reform", "evacuate", "conceal", "inherit"], "ci": 0, "exp": "<i><b>reform</b></i> (v.) to change something in order to make it better. <i>The city wants to <b>reform</b> its bus system.</i> Family: reformer (n.) The complaints show that the cafeteria needed to be improved.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "With dark clouds rolling in and the thunder getting louder, a storm seemed <b>inevitable</b>. Which word means the <b>OPPOSITE</b> of <b>inevitable</b> as it is used in the sentence?", "opts": ["sudden", "avoidable", "certain", "dangerous"], "ci": 1, "exp": "<i><b>inevitable</b></i> (adj.) sure to happen; impossible to stop. <i>Getting wet was <b>inevitable</b> once we forgot the umbrellas.</i> The opposite is <i>avoidable</i>. “Certain” means nearly the same thing. Family: inevitably (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The lighthouse keeper lived a <b>solitary</b> life on the rocky island; for months at a time, the only voices he heard came from his radio. What does <b>solitary</b> mean in this sentence?", "opts": ["full of hard, tiring work every day", "following strict rules and schedules", "living or being alone, without other people around", "calm, peaceful, and relaxing"], "ci": 2, "exp": "<i><b>solitary</b></i> (adj.) alone; without other people. <i>A <b>solitary</b> tree stood in the middle of the field.</i> Family: solitude (n.) The clue is that the only voices he heard came from a radio — no people were with him.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The argument over the last slice of pizza began to <b>escalate</b>: first the twins whispered, then they shouted, and soon both of them were crying. What does <b>escalate</b> mean in this sentence?", "opts": ["to grow bigger, stronger, or more serious", "to be repeated over and over", "to turn into a joke", "to be settled by a grown-up"], "ci": 0, "exp": "<i><b>escalate</b></i> (v.) to become bigger or more serious, step by step. <i>The small fire <b>escalated</b> when the wind picked up.</i> Family: escalation (n.) Whispering, then shouting, then crying shows the fight getting worse step by step.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The class voted to _____ half of the bake-sale money to the animal shelter and the other half to new library books. Which word best completes the sentence?", "opts": ["exaggerate", "examine", "allocate", "abandon"], "ci": 2, "exp": "<i><b>allocate</b></i> (v.) to give a share of something for a certain purpose. <i>The school <b>allocated</b> two hours a week for art.</i> Family: allocation (n.) The class decided which part of the money would go where.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The book had a <b>profound</b> effect on Marcus; after reading it, he decided to become a doctor. Which word means the <b>OPPOSITE</b> of <b>profound</b> as it is used in the sentence?", "opts": ["deep", "slight", "powerful", "lasting"], "ci": 1, "exp": "<i><b>profound</b></i> (adj.) very deep or strong. <i>The music had a <b>profound</b> effect on the crowd.</i> The opposite is <i>slight</i> (very small). “Deep” and “powerful” mean nearly the same as <i>profound</i>.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "To <b>eliminate</b> the musty smell in the basement, Dad threw out the old carpet and ran a fan all week. What does <b>eliminate</b> mean in this sentence?", "opts": ["to cover something up so no one notices", "to get rid of something completely", "to find out where something comes from", "to make something smaller for a short time"], "ci": 1, "exp": "<i><b>eliminate</b></i> (v.) to remove something completely. <i>Washing your hands helps <b>eliminate</b> germs.</i> Family: elimination (n.) Throwing out the carpet removed the cause of the smell, not just hid it.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The pilot’s calm voice <b>assured</b> the passengers that the bumpy ride was normal and nothing to worry about. What does <b>assure</b> mean in this sentence?", "opts": ["told someone something firmly so they would stop worrying", "warned someone that trouble was coming", "reminded someone to follow a rule", "asked someone a question politely"], "ci": 0, "exp": "<i><b>assure</b></i> (v.) to tell someone something with confidence so they feel less worried. <i>Mom <b>assured</b> me that the shot would only sting for a second.</i> Family: assurance (n.) The words “nothing to worry about” are the clue.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "This orange juice is made from <b>concentrate</b>, so you mix it with three cans of water before you drink it. Which meaning of <b>concentrate</b> is used in this sentence?", "opts": ["to bring many people or things together in one place", "a strong liquid that has had most of its water taken out", "to mix two liquids together evenly", "to focus all your attention on one thing"], "ci": 1, "exp": "<i><b>concentrate</b></i> has several meanings. Here it is a noun: a strong liquid with most of the water removed — that is why you add water back. <i>I need quiet so I can <b>concentrate</b> on my homework</i> uses the “focus your attention” meaning. Family: concentration (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "It was never my _____ to hurt your feelings; I was only trying to help. Which word best completes the sentence?", "opts": ["obstacle", "terrain", "intention", "heritage"], "ci": 2, "exp": "<i><b>intention</b></i> (n.) what you mean or plan to do. <i>Her <b>intention</b> was to finish the puzzle before dinner.</i> Family: intend (v.), intentional (adj.) “Trying to help” tells what the speaker meant to do.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Moved by <b>compassion</b> for the families who had lost their homes in the flood, the students collected blankets and canned food. What does <b>compassion</b> mean in this sentence?", "opts": ["a feeling of caring about others who are suffering and wanting to help", "a strong wish to win a contest", "a feeling of worry about your own safety", "a feeling of pride in a job well done"], "ci": 0, "exp": "<i><b>compassion</b></i> (n.) caring about someone who is hurting and wanting to help. <i>The nurse treated every patient with <b>compassion</b>.</i> Family: compassionate (adj.) The students helped families who had lost their homes.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Even after her kite crashed three times, Lena showed great _____ and kept fixing it until it flew. Which form of the word best completes the sentence?", "opts": ["perseverance", "persevering", "persevered", "persevere"], "ci": 0, "exp": "After “showed great,” the sentence needs a noun. <i><b>perseverance</b></i> (n.) the quality of not giving up. <i>With <b>perseverance</b>, he finally learned to ride a bike.</i> Family: persevere (v.), persevering (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Before the museum would display the old letter, it asked for <b>documentation</b> proving where the letter came from and who had owned it. What does <b>documentation</b> mean in this sentence?", "opts": ["a short speech about history", "a promise made out loud", "written records or papers that prove something is true", "a careful drawing of an object"], "ci": 2, "exp": "<i><b>documentation</b></i> (n.) papers or records that show proof. <i>You need <b>documentation</b> of your birth date to get a passport.</i> Family: document (n./v.), documentary (n.) The museum wanted proof, and proof like this is written down.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Maria finally <b>convinced</b> her parents that a pet hamster would not be much work. Which word means the <b>SAME</b> or nearly the same as <b>convince</b>?", "opts": ["persuade", "warn", "remind", "discourage"], "ci": 0, "exp": "<i><b>convince</b></i> (v.) to make someone believe or agree with something. <i>He <b>convinced</b> me to try sushi.</i> <i>Persuade</i> means nearly the same. “Discourage” is the opposite. Family: convincing (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Taking care of the large garden all summer became a <b>burden</b> for Mr. Lee after he hurt his back. Which word means the <b>SAME</b> or nearly the same as <b>burden</b>?", "opts": ["relief", "hobby", "reward", "hardship"], "ci": 3, "exp": "<i><b>burden</b></i> (n.) something heavy or hard that you have to carry or deal with. <i>Homework felt like a <b>burden</b> during the busy week.</i> <i>Hardship</i> is closest. “Relief” is the opposite. Family: burdensome (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Engineers designed the new bridge to <b>withstand</b> winds of more than 100 miles per hour. What does <b>withstand</b> mean in this sentence?", "opts": ["to hold up against something without being damaged", "to warn people that danger is coming", "to measure how strong something is", "to make something move faster"], "ci": 0, "exp": "<i><b>withstand</b></i> (v.) to stay strong against a force without breaking. <i>These boots can <b>withstand</b> deep snow.</i> Family: withstood (past tense) A bridge built for strong winds must not break in them.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The _____ rain kept falling for six days, and the river rose higher each morning. Which form of the word best completes the sentence?", "opts": ["persistent", "persisted", "persistence", "persist"], "ci": 0, "exp": "Before the noun “rain,” the sentence needs an adjective. <i><b>persistent</b></i> (adj.) continuing for a long time without stopping. <i>A <b>persistent</b> cough kept her home all week.</i> Family: persist (v.), persistence (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "At the science fair, Ben’s volcano was placed in the Earth Science _____, next to projects about rocks and earthquakes. Which word best completes the sentence?", "opts": ["fortune", "hazard", "category", "summit"], "ci": 2, "exp": "<i><b>category</b></i> (n.) a group of things that are alike in some way. <i>Apples and pears belong in the fruit <b>category</b>.</i> Family: categorize (v.) The volcano was grouped with other Earth Science projects.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "When Ana’s cousin offered her a ride to school, she politely <b>declined</b> because she wanted to walk with her friends. Which meaning of <b>decline</b> is used in this sentence?", "opts": ["to become fewer or smaller in number", "to slowly get worse in health or quality", "to say no to an offer or invitation", "to slope or slant downward"], "ci": 2, "exp": "<i><b>decline</b></i> can mean “become smaller or weaker,” but here it means to say no politely. Ana chose to walk instead, so she turned down the ride. <i>The number of bees has <b>declined</b></i> uses the “become fewer” meaning.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "To <b>illustrate</b> how a volcano erupts, Mr. Ortiz poured vinegar into a clay mountain filled with baking soda. What does <b>illustrate</b> mean in this sentence?", "opts": ["to prove that an idea is wrong", "to show or explain something by giving an example", "to measure something very exactly", "to draw pictures for a book or magazine"], "ci": 1, "exp": "<i><b>illustrate</b></i> (v.) to make an idea clear by showing an example. <i>The coach drew a play on the board to <b>illustrate</b> his plan.</i> Family: illustration (n.), illustrator (n.) <i>Illustrate</i> can also mean “draw pictures for a book,” but Mr. Ortiz did not draw anything — he showed an example.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
