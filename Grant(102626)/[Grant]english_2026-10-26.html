<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261026";
var RAW_QUESTIONS = [{"stem": "According to the passage, about how many people lost their homes in the fire?", "opts": ["about 30,000", "about 10,000", "about 300", "about 100,000"], "ci": 3, "exp": "The third paragraph states that “about 100,000 lost their homes.” The number 300 is how many people died, not how many lost homes.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["In 1871 a huge fire destroyed much of dry, wooden Chicago, but the people rebuilt their city with stronger materials.", "In 1871 Chicago’s firefighters did not have enough equipment because they had already fought many fires.", "In 1871 a fire started in a barn owned by Patrick and Catherine O’Leary on the southwest side of Chicago.", "After 1871 architects from other places came to Chicago and designed the world’s first skyscrapers."], "ci": 0, "exp": "The passage explains why the city burned, how the fire spread, and how Chicago was rebuilt. The barn, the tired firefighters, and the architects are true details, but each covers only one part of the passage.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>"}, {"stem": "According to the passage, which event happened right after burning embers leaped across the Chicago River?", "opts": ["The city’s waterworks caught fire.", "Rain helped put out the flames.", "Strong winds pushed the flames toward downtown.", "A fire broke out in the O’Leary barn."], "ci": 0, "exp": "The passage says embers “leaped across the Chicago River, and soon the city’s waterworks caught fire.” The barn fire and the winds came before the embers crossed the river; the rain came last, on October 10.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>"}, {"stem": "Read this sentence from the first paragraph: “Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city <b>parched</b>.” What does <b>parched</b> mean in this sentence?", "opts": ["badly damaged", "nearly empty", "extremely dry", "very crowded"], "ci": 2, "exp": "A drought is a long time without rain, and the dry wood is why the fire spread so fast. So <i>parched</i> means extremely dry. The city was crowded, but a drought does not make a city crowded.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>"}, {"stem": "Read this sentence from the second paragraph: “Although a single strand looks <b>fragile</b>, spider silk is remarkably tough.” Which word means the <b>OPPOSITE</b> of <b>fragile</b> as it is used in the sentence?", "opts": ["slender", "sturdy", "delicate", "shiny"], "ci": 1, "exp": "<i>Fragile</i> means easily broken. The opposite is <i>sturdy</i> (strong and hard to break). <i>Delicate</i> means nearly the same as <i>fragile</i>, so it is a synonym, not an opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Threads Stronger Than Steel</strong><br><p style=\"margin:0 0 8px;\">A spider’s silk begins as a liquid stored in glands inside its abdomen. As the spider draws the liquid out through its spinnerets, the proteins in it line up and harden into a solid thread. Many spiders can produce several different kinds of silk, each suited to a particular job. One kind forms the sturdy spokes of a web, while another, coated with sticky droplets, spirals around the spokes to snare insects.</p><p style=\"margin:0 0 8px;\">Although a single strand looks fragile, spider silk is remarkably tough. Pound for pound, some silk is stronger than steel, and it can stretch well beyond its original length without snapping. Because the threads are so elastic, a web can absorb the force of a fast-flying insect instead of tearing apart.</p><p style=\"margin:0 0 8px;\">Scientists have long hoped to manufacture silk for products such as lightweight ropes and medical stitches. Farming spiders, however, has proved impractical, because spiders that are crowded together tend to attack one another. Instead, researchers are experimenting with bacteria and other organisms that can be engineered to produce silk proteins.</p>"}, {"stem": "According to the passage, why has farming spiders for silk proved impractical?", "opts": ["Spider silk is too weak to be used for ropes or stitches.", "Spiders that are kept close together tend to attack one another.", "Bacteria in spider farms destroy the silk proteins.", "Spiders can make only one kind of silk at a time."], "ci": 1, "exp": "The third paragraph says farming spiders is impractical “because spiders that are crowded together tend to attack one another.” Bacteria are being tested as a way to make silk proteins, not as a problem on spider farms.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Threads Stronger Than Steel</strong><br><p style=\"margin:0 0 8px;\">A spider’s silk begins as a liquid stored in glands inside its abdomen. As the spider draws the liquid out through its spinnerets, the proteins in it line up and harden into a solid thread. Many spiders can produce several different kinds of silk, each suited to a particular job. One kind forms the sturdy spokes of a web, while another, coated with sticky droplets, spirals around the spokes to snare insects.</p><p style=\"margin:0 0 8px;\">Although a single strand looks fragile, spider silk is remarkably tough. Pound for pound, some silk is stronger than steel, and it can stretch well beyond its original length without snapping. Because the threads are so elastic, a web can absorb the force of a fast-flying insect instead of tearing apart.</p><p style=\"margin:0 0 8px;\">Scientists have long hoped to manufacture silk for products such as lightweight ropes and medical stitches. Farming spiders, however, has proved impractical, because spiders that are crowded together tend to attack one another. Instead, researchers are experimenting with bacteria and other organisms that can be engineered to produce silk proteins.</p>"}, {"stem": "Why does the author compare spider silk to steel?", "opts": ["to show that scientists now make ropes and stitches out of steel and silk", "to suggest that spider webs are as heavy as metal objects of the same size", "to explain the steps a spider follows to turn a liquid into a solid thread", "to help the reader understand how strong spider silk is by comparing it with a familiar material"], "ci": 3, "exp": "The comparison comes right after the author says silk is “remarkably tough.” Saying it is “stronger than steel” “pound for pound” shows its strength using something readers already know. The passage does not say silk is heavy.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Threads Stronger Than Steel</strong><br><p style=\"margin:0 0 8px;\">A spider’s silk begins as a liquid stored in glands inside its abdomen. As the spider draws the liquid out through its spinnerets, the proteins in it line up and harden into a solid thread. Many spiders can produce several different kinds of silk, each suited to a particular job. One kind forms the sturdy spokes of a web, while another, coated with sticky droplets, spirals around the spokes to snare insects.</p><p style=\"margin:0 0 8px;\">Although a single strand looks fragile, spider silk is remarkably tough. Pound for pound, some silk is stronger than steel, and it can stretch well beyond its original length without snapping. Because the threads are so elastic, a web can absorb the force of a fast-flying insect instead of tearing apart.</p><p style=\"margin:0 0 8px;\">Scientists have long hoped to manufacture silk for products such as lightweight ropes and medical stitches. Farming spiders, however, has proved impractical, because spiders that are crowded together tend to attack one another. Instead, researchers are experimenting with bacteria and other organisms that can be engineered to produce silk proteins.</p>"}, {"stem": "The word <b>impractical</b> is made of the prefix <i>im-</i> and the word <i>practical</i>. What does <b>impractical</b> most likely mean in the third paragraph?", "opts": ["too expensive to try", "done over and over again", "not sensible or workable", "done ahead of time"], "ci": 2, "exp": "The prefix <i>im-</i> means “not,” as in <i>impossible</i>. So <i>impractical</i> means not practical — not a sensible or workable plan. Cost is not mentioned; the problem is that the spiders attack each other.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Threads Stronger Than Steel</strong><br><p style=\"margin:0 0 8px;\">A spider’s silk begins as a liquid stored in glands inside its abdomen. As the spider draws the liquid out through its spinnerets, the proteins in it line up and harden into a solid thread. Many spiders can produce several different kinds of silk, each suited to a particular job. One kind forms the sturdy spokes of a web, while another, coated with sticky droplets, spirals around the spokes to snare insects.</p><p style=\"margin:0 0 8px;\">Although a single strand looks fragile, spider silk is remarkably tough. Pound for pound, some silk is stronger than steel, and it can stretch well beyond its original length without snapping. Because the threads are so elastic, a web can absorb the force of a fast-flying insect instead of tearing apart.</p><p style=\"margin:0 0 8px;\">Scientists have long hoped to manufacture silk for products such as lightweight ropes and medical stitches. Farming spiders, however, has proved impractical, because spiders that are crowded together tend to attack one another. Instead, researchers are experimenting with bacteria and other organisms that can be engineered to produce silk proteins.</p>"}, {"stem": "Read this sentence: “Then, to Kenji’s <b>astonishment</b>, she grinned and reached across to shake his hand.” Which word means the <b>SAME</b> or nearly the same as <b>astonishment</b>?", "opts": ["relief", "disappointment", "amazement", "annoyance"], "ci": 2, "exp": "<i>Astonishment</i> is great surprise. Kenji did not expect Ava to grin after losing her queen, so he was amazed. He was not disappointed or annoyed by her reaction.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Last Move</strong><br><p style=\"margin:0 0 8px;\">Kenji had practiced for weeks, but when the tournament director posted the final pairings, his stomach dropped. His opponent in the championship round was Ava, his best friend and the person who had taught him the game.</p><p style=\"margin:0 0 8px;\">“We don’t have to make this weird,” Ava said, sliding into the chair across from him. “Just play your best.”</p><p style=\"margin:0 0 8px;\">Kenji nodded, though his hands were trembling. For forty minutes the two of them traded pieces in near silence. Then Ava leaned back and frowned. Kenji glanced at the board and saw it: if he moved his kni var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
