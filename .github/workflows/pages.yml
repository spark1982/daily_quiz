name: Deploy Quiz Site to GitHub Pages

on:
  push:
    branches: [ "quiz-content" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# 2026-11-24: split into build + deploy jobs (GitHub's starter layout).
# Uploading and deploying in the same job intermittently failed with
# 'No artifacts named "github-pages" were found' (actions/deploy-pages#451).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quiz-content
        uses: actions/checkout@v4
        with:
          ref: quiz-content

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
