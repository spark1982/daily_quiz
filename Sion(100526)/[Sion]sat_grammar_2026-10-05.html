var RAW_QUESTIONS = [{"context": "The museum&rsquo;s collection of Navajo textiles includes three rare examples of early &ldquo;chief&rsquo;s ______ a style recognized by its bold horizontal stripes and, later, its distinctive diamond patterns.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["blankets,&rdquo;", "blankets&rdquo;;", "blankets.&rdquo;", "blankets&rdquo; and"], "ci": 0, "exp": "What follows is an appositive phrase that describes the blankets, not an independent clause, so it should be set off by a comma (placed inside the closing quotation mark in American usage). A semicolon or period would leave a fragment.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; Ida B. Wells was a journalist born in Mississippi in 1862.<br>&bull; In 1892, she published <i>Southern Horrors</i>, a pamphlet exposing lynching in the United States.<br>&bull; She gathered evidence from newspapers, interviews, and court records.<br>&bull; Her careful use of data made her reporting hard for critics to dismiss.", "stem": "The student wants to emphasize how Wells&rsquo;s research methods strengthened her work. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Ida B. Wells, a journalist born in Mississippi in 1862, published <i>Southern Horrors</i> in 1892.", "By gathering evidence from newspapers, interviews, and court records, Ida B. Wells produced reporting that critics found hard to dismiss.", "Ida B. Wells was a journalist who wrote about lynching in the United States.", "In 1892, Ida B. Wells published a pamphlet called <i>Southern Horrors</i>."], "ci": 1, "exp": "Only this choice connects her methods (newspapers, interviews, court records) to their effect (reporting that was hard to dismiss).", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "The two ______ findings surprised the team: the older sample contained more pollen than the newer one, even though it had been buried far deeper.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["samples&rsquo;s", "samples", "samples&rsquo;", "sample&rsquo;s"], "ci": 2, "exp": "The findings belong to two samples, so the plural possessive &ldquo;samples&rsquo;&rdquo; is correct. &ldquo;Sample&rsquo;s&rdquo; is singular possessive, and &ldquo;samples&rdquo; has no possessive mark.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "The Harlem Renaissance writer Zora Neale Hurston did more than write ______ she also traveled through the American South and the Caribbean as a trained anthropologist, recording songs, stories, and folk practices.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["novels, she", "novels,", "novels", "novels:"], "ci": 3, "exp": "The second clause explains what &ldquo;more than write novels&rdquo; means, so a colon correctly joins the two independent clauses. A comma alone makes a comma splice and no punctuation makes a run-on.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Having studied the migration of Arctic terns for over a decade, ______ that some of the birds travel more than 90,000 kilometers in a single year.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["it was discovered by researcher Carsten Egevang", "the discovery by researcher Carsten Egevang was", "researcher Carsten Egevang&rsquo;s discovery was", "researcher Carsten Egevang discovered"], "ci": 3, "exp": "The introductory phrase &ldquo;Having studied &hellip; for over a decade&rdquo; must describe the person who did the studying. Only &ldquo;researcher Carsten Egevang&rdquo; can be the one who studied; a discovery or &ldquo;it&rdquo; cannot study anything.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; The Mojave Desert receives less than 6 inches of rain per year.<br>&bull; The Olympic Peninsula rain forest in Washington State receives up to 140 inches of rain per year.<br>&bull; Both are located in the western United States.<br>&bull; The rain forest is home to giant Sitka spruce trees; the desert is home to Joshua trees.", "stem": "The student wants to contrast the amount of rainfall in the two regions. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Mojave Desert, home to Joshua trees, receives less than 6 inches of rain per year.", "Both the Mojave Desert and the Olympic Peninsula rain forest are located in the western United States.", "While the Mojave Desert receives less than 6 inches of rain per year, the Olympic Peninsula rain forest receives up to 140 inches.", "The Olympic Peninsula rain forest, which is in Washington State, is home to giant Sitka spruce trees."], "ci": 2, "exp": "The goal is a contrast in rainfall. Only this choice gives the rainfall of both regions and links them with the contrasting word &ldquo;While.&rdquo;", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "Unlike most spiders, which build webs to trap their prey, the jumping spider relies on its keen ______ two large forward-facing eyes give it vision sharp enough to judge distance precisely before it leaps.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["eyesight, it&rsquo;s", "eyesight, its", "eyesight; its", "eyesight its"], "ci": 2, "exp": "Both sides are complete sentences, so a semicolon is needed. A comma alone is a comma splice, no punctuation is a run-on, and &ldquo;it&rsquo;s&rdquo; means &ldquo;it is,&rdquo; not the possessive &ldquo;its.&rdquo;", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; Mary Anning (1799&ndash;1847) was a fossil collector in Lyme Regis, England.<br>&bull; At about age 12, she and her brother found the first complete ichthyosaur skeleton to be identified.<br>&bull; She later discovered the first complete plesiosaur skeleton.<br>&bull; As a woman, she was not allowed to join the Geological Society of London.", "stem": "The student wants to present Anning&rsquo;s achievements to an audience unfamiliar with her. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["At about age 12, Anning and her brother made a discovery in Lyme Regis, England.", "As a woman, Mary Anning was not allowed to join the Geological Society of London.", "Anning found an ichthyosaur and a plesiosaur.", "Mary Anning, a fossil collector from Lyme Regis, England, helped find the first complete ichthyosaur skeleton to be identified and later discovered the first complete plesiosaur skeleton."], "ci": 3, "exp": "An unfamiliar audience needs to know who Anning was and what she achieved. Only this choice introduces her (a fossil collector from Lyme Regis) and names both of her major discoveries.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "After decades of debate, paleontologists now agree that many dinosaurs had feathers. Fossils from China&rsquo;s Liaoning Province, in particular, ______ impressions of downy filaments on several small meat-eating species.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is preserving", "has preserved", "preserves", "preserve"], "ci": 3, "exp": "The subject &ldquo;Fossils&rdquo; is plural, so it needs the plural verb &ldquo;preserve.&rdquo; The phrase &ldquo;in particular&rdquo; does not change the subject.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "The ______ which was designed by engineer Joseph Strauss and architect Irving Morrow, opened to traffic in 1937 after four years of construction.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Golden Gate Bridge", "Golden Gate Bridge;", "Golden Gate Bridge,", "Golden Gate Bridge:"], "ci": 2, "exp": "The clause &ldquo;which was designed by &hellip; Irving Morrow&rdquo; is nonessential and is already closed by a comma, so it must also be opened by a comma. A semicolon or colon cannot separate a subject from its verb.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "When the Hubble Space Telescope first sent back images in 1990, astronomers were dismayed to find that ______ were blurry because its main mirror had been ground to slightly the wrong shape.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["they", "it", "its", "this"], "ci": 0, "exp": "The pronoun refers to the plural noun &ldquo;images,&rdquo; so the plural pronoun &ldquo;they&rdquo; is required. &ldquo;It&rdquo; and &ldquo;this&rdquo; are singular, and &ldquo;its&rdquo; is possessive.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Honeybees are not native to the Americas; European colonists brought them across the Atlantic in the 1600s. ______ many of the most important pollinators of native North American plants are wild bees, such as bumblebees and mason bees.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "Consequently,", "For instance,", "Likewise,"], "ci": 1, "exp": "Because honeybees arrived only recently, it follows that native plants depend on native wild bees. &ldquo;Consequently&rdquo; shows this cause-and-effect relationship.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "The first transatlantic telegraph cable, completed in 1858, allowed messages to cross the ocean in minutes rather than weeks. The cable failed after only three weeks of service. ______ a far more durable cable laid in 1866 worked for years and made fast communication between continents permanent.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Eventually,", "Similarly,", "As a result,", "In other words,"], "ci": 0, "exp": "The final sentence describes a later success that followed the earlier failure, so a time-sequence transition, &ldquo;Eventually,&rdquo; is logical. The 1866 cable was not a result of the failure, a restatement, or a similar event.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "Glaciologist Lonnie Thompson has hauled ice cores from some of the highest peaks on Earth, including Peru&rsquo;s Quelccaya Ice ______ the layers in these cores preserve a year-by-year record of tropical climate stretching back more than 1,500 years.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Cap,", "Cap, and,", "Cap", "Cap;"], "ci": 3, "exp": "Two independent clauses must be joined by a semicolon (or a period, or a comma plus a conjunction). A comma alone creates a comma splice, no punctuation creates a run-on, and &ldquo;and,&rdquo; with a comma after it is incorrect.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "According to marine biologist ______ the decline of sea otters along the Pacific coast in the 1990s allowed sea urchin populations to explode, which in turn devastated the region&rsquo;s kelp forests.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["James, Estes,", "James Estes,", "James Estes;", "James Estes"], "ci": 1, "exp": "The introductory phrase &ldquo;According to marine biologist James Estes&rdquo; must be set off from the main clause with a comma. No comma belongs between the first and last name, and a semicolon cannot follow a phrase that is not an independent clause.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; The Svalbard-style seed vault model has been copied by other countries.<br>&bull; The Millennium Seed Bank is located in Sussex, England.<br>&bull; It is run by the Royal Botanic Gardens, Kew.<br>&bull; It stores seeds from more than 40,000 wild plant species.<br>&bull; Its goal is to protect plants that may become extinct in the wild.", "stem": "The student wants to explain the purpose of the Millennium Seed Bank. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Millennium Seed Bank, which is located in Sussex, England, is run by the Royal Botanic Gardens, Kew.", "The Millennium Seed Bank stores seeds from more than 40,000 wild plant species in order to protect plants that may become extinct in the wild.", "The Millennium Seed Bank is in Sussex, England, and it holds seeds from many species.", "Other countries have copied the seed vault model."], "ci": 1, "exp": "The goal is to explain the bank&rsquo;s purpose. Only this choice states why the bank stores seeds: to protect plants that may become extinct in the wild.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "Most rocks sink in water. Pumice, ______ often floats: it forms when gas-filled lava cools so quickly that tiny bubbles are trapped inside the stone.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["by contrast,", "for this reason,", "as a result,", "in addition,"], "ci": 0, "exp": "Pumice behaves differently from most rocks, so the contrasting transition &ldquo;by contrast&rdquo; is logical.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "By the time the transcontinental railroad was completed in 1869, workers ______ more than 1,900 miles of track across mountains, deserts, and plains.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["have laid", "lay", "will have laid", "had laid"], "ci": 3, "exp": "&ldquo;By the time&rdquo; plus a past event (1869) signals an action completed before another past action, which calls for the past perfect &ldquo;had laid.&rdquo;", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "For years, engineers assumed that adding more lanes to a highway would reduce traffic. Studies of cities such as Houston, ______ have shown that new lanes often fill up within a few years as more people choose to drive.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["similarly,", "therefore,", "however,", "for example,"], "ci": 2, "exp": "The studies contradict what engineers assumed, so a contrasting transition, &ldquo;however,&rdquo; is logical.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "The collection of field notebooks that naturalist John Muir kept during his walk from Indiana to Florida ______ now housed at the University of the Pacific in Stockton, California.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "were", "have been"], "ci": 0, "exp": "The subject is the singular noun &ldquo;collection,&rdquo; not &ldquo;notebooks,&rdquo; which is part of a prepositional phrase. A singular subject needs the singular verb &ldquo;is.&rdquo;", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
