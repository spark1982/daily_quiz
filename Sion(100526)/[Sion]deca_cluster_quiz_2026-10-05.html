<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261005";
var RAW_QUESTIONS = [{"stem": "A U.S. retirement fund invests part of its money in Japanese and German company stocks, and a bank in Singapore lends to a factory in Mexico. These examples best illustrate which trend?", "opts": ["Financial globalization &mdash; money flowing across national borders", "Barter &mdash; trading goods without money", "Deflation &mdash; a general fall in prices", "Financial regulation &mdash; government rules limiting investment"], "ci": 0, "exp": "Financial globalization is the growing connection of financial markets and institutions around the world, so investors and lenders move money across borders."}, {"stem": "After a trade agreement among the United States, Mexico, and Canada lowered tariffs on auto parts, an Ohio parts maker began selling more to Canadian carmakers. What effect of the trade alliance does this show?", "opts": ["Prices of auto parts were set by the government", "Lower trade barriers opened larger markets for member-country businesses", "The alliance made it illegal to sell outside North America", "Tariffs on all goods worldwide were removed"], "ci": 1, "exp": "Trade alliances lower tariffs and other barriers among members, which gives businesses easier access to customers in partner countries."}, {"stem": "A sporting-goods chain notices that sales of snow shovels triple in the week after a winter storm warning, even though prices stay the same. Which factor is most influencing customer buying behavior?", "opts": ["A cultural factor &mdash; long-held family traditions", "A social factor &mdash; advice from a celebrity", "A psychological factor &mdash; loyalty to the store&rsquo;s brand", "A situational factor &mdash; the immediate need created by the weather"], "ci": 3, "exp": "Situational influences are temporary conditions at the time of purchase, such as weather or time pressure. The storm warning creates an immediate need that drives sales."}, {"stem": "A U.S. bank is opening a branch in a neighborhood where many customers speak mainly Spanish or Vietnamese. What is the best way to communicate with these customers?", "opts": ["Use as much banking slang as possible to seem friendly", "Offer materials and staff in customers&rsquo; languages and be aware of cultural customs", "Avoid explaining fees so customers do not get confused", "Speak English slowly and loudly so everyone understands"], "ci": 1, "exp": "Communicating across languages and cultures means providing information in customers&rsquo; preferred languages and respecting cultural norms, which builds trust and understanding."}, {"stem": "A city government needs to borrow $5 million for 60 days to cover payroll until tax revenue arrives. In which financial market would it most likely raise this short-term money?", "opts": ["The insurance market", "The commodities market", "The money market", "The capital market"], "ci": 2, "exp": "The money market handles short-term borrowing and lending, usually for one year or less. The capital market is for long-term funds such as bonds and stocks."}, {"stem": "Rosa, a high school junior, enjoys working with numbers, is detail-oriented, and likes helping people plan for the future. Which careers best match her interests and skills?", "opts": ["Long-haul truck driver or pilot", "Professional athlete or stunt performer", "Fashion model or actor", "Financial planner or accountant"], "ci": 3, "exp": "Matching careers to personal interests and skills leads to success. Working with numbers, attention to detail, and helping people plan point toward financial planning or accounting."}, {"stem": "At an insurance agency, five agents each sell their own policies and meet weekly only to share news. A second set of five agents shares one sales target and depends on each other to reach it. How is the second set different from the first?", "opts": ["It is identical to the first set, since both have five members", "It is a group, because members work toward individual goals", "It is a team, because members share a common goal and are mutually accountable", "It is a committee, because it has no goal"], "ci": 2, "exp": "A group is people who share information but work toward individual goals. A team shares a common goal and holds members accountable to one another."}, {"stem": "A regional bank keeps loan, deposit, and customer tables in one relational database. A manager wants a single report showing every customer who has both a mortgage and a savings account. What database feature makes this possible?", "opts": ["A query that joins the tables on a shared customer ID", "Sorting one table alphabetically by last name", "Printing each table and comparing them by hand", "Changing the font size of the report"], "ci": 0, "exp": "A relational database links tables through a common key, such as customer ID. A join query pulls matching records from several tables into one result."}, {"stem": "Priya, an assistant at a credit union branch, has four tasks on Monday morning: a loan file due to the manager at noon, a quarterly newsletter draft due Friday, filing last week&rsquo;s receipts, and returning a member&rsquo;s urgent call about a frozen debit card. Which task should she handle first?", "opts": ["File last week&rsquo;s receipts because they are the oldest", "Work on whichever task she enjoys most", "Return the member&rsquo;s call about the frozen debit card", "Start the newsletter draft because it is the longest task"], "ci": 2, "exp": "Prioritizing means ranking tasks by urgency and importance. A member who cannot use a debit card needs help right away, and the call is quick, so it comes first; the noon loan file comes next."}, {"stem": "Kevin, a junior accountant, makes the same errors when reconciling accounts each month. Which change would best show systematic behavior?", "opts": ["Doing the steps in whatever order he remembers", "Following a written step-by-step checklist every time he reconciles", "Waiting for his manager to point out each mistake", "Working faster so he has more time left over"], "ci": 1, "exp": "Systematic behavior means using an organized, consistent method. A checklist makes sure every step is done in the same order each time, which reduces errors."}, {"stem": "Marcus, a new teller, sees a coworker he likes slip a few dollars from the cash drawer &ldquo;until payday.&rdquo; Marcus feels torn about whether to report it. What mainly creates this ethical dilemma?", "opts": ["The bank&rsquo;s policy being written in unclear language", "A disagreement about the teller&rsquo;s work schedule", "A conflict between loyalty to a friend and the duty to be honest with the employer", "A lack of training on how to count cash"], "ci": 2, "exp": "An ethical dilemma arises when two values pull in different directions. Here, personal loyalty conflicts with honesty and responsibility to the employer."}, {"stem": "Before recommending an investment to a client, a licensed financial advisor learns the client is 78 and needs steady income. The advisor would earn a large commission on a risky stock. Which legal duty should guide the recommendation?", "opts": ["A fiduciary duty to act in the client&rsquo;s best interest", "A duty to choose the newest investment available", "A duty to maximize the advisor&rsquo;s commission", "No duty, since the client makes the final decision"], "ci": 0, "exp": "Many finance professionals have a legal fiduciary or best-interest obligation: they must put the client&rsquo;s interests ahead of their own commissions."}, {"stem": "Why does Brightwater Bakery keep organized business records such as receipts, invoices, and payroll reports?", "opts": ["Because records are only needed if the business closes", "To decorate the office with paperwork", "To track financial activity, prepare taxes, and support decisions", "To keep customers from knowing the prices"], "ci": 2, "exp": "Business records document transactions. They help owners track income and expenses, file accurate taxes, meet legal requirements, and make informed decisions."}, {"stem": "Tasha, an account manager, receives a client e-mail asking for a revised budget by Thursday. She is busy now but does not want to forget the request. Which e-mail program feature is most useful?", "opts": ["Changing the e-mail&rsquo;s background color", "Flagging the message for follow-up with a due date", "Forwarding the message to every coworker", "Deleting the message after reading it"], "ci": 1, "exp": "Flagging marks a message for follow-up and can add a reminder or due date, so important requests are not lost in a busy inbox."}, {"stem": "Elena gets $50 for her birthday and keeps it in a drawer for six months so she can buy concert tickets later. Which function of money does this show?", "opts": ["Store of value", "Unit of account", "Medium of exchange", "Standard of deferred payment"], "ci": 0, "exp": "Money is a store of value when it holds purchasing power over time so it can be spent later. A medium of exchange is money used in a trade right now."}, {"stem": "Jordan deposits his paychecks in a savings account, and the bank uses those deposits to make a loan to a family buying a home. Which role of financial institutions does this show?", "opts": ["Acting as an intermediary that moves money from savers to borrowers", "Guaranteeing that every investment earns a profit", "Printing new currency for the economy", "Setting the national tax rate"], "ci": 0, "exp": "Financial institutions act as intermediaries: they collect funds from savers and lend them to borrowers, helping money flow through the economy."}, {"stem": "A company&rsquo;s sales were lower than expected this quarter. A manager asks the accountant to record next quarter&rsquo;s orders as this quarter&rsquo;s sales. What should the accountant do?", "opts": ["Record half of the orders as a compromise", "Refuse, because recording sales early would misstate the financial records", "Agree, since the sales will happen eventually anyway", "Agree, as long as no one outside the company finds out"], "ci": 1, "exp": "Accounting ethics require honest, accurate records. Counting future orders as current sales misleads investors, lenders, and others who rely on the statements."}, {"stem": "Which item would appear as a liability on the balance sheet of Greenleaf Landscaping?", "opts": ["A $12,000 bank loan the company must repay next year", "$8,500 of cash in the company checking account", "A pickup truck the company owns", "$3,200 that customers owe the company"], "ci": 0, "exp": "A liability is something the business owes to others. A bank loan is a debt, while cash, owned equipment, and money customers owe the company are assets."}, {"stem": "A financial planner must explain a new retirement plan to two audiences: the company&rsquo;s board of directors and a group of new hourly employees. What is the best approach?", "opts": ["Skip the employee meeting because they will not understand", "Give the employees less accurate information to keep it short", "Use the exact same technical slides for both groups", "Adjust the vocabulary, detail, and examples to fit each audience"], "ci": 3, "exp": "Effective communicators adapt their style to the audience. The board may want financial detail, while new employees need plain language and practical examples."}, {"stem": "The audit team at Lakeshore Outfitters, which works inside the company, reviews whether cash-handling procedures in its 12 stores are being followed. What is the main value of this internal audit?", "opts": ["It guarantees that no employee will ever make a mistake", "It is required so the company can set its own prices", "It helps management find weaknesses in controls and fix them before losses grow", "It replaces the need for any outside financial statement audit"], "ci": 2, "exp": "An internal audit is an independent review run within the company. Its value is spotting control weaknesses, errors, or fraud early so managers can correct them."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
