<script>var TITLE = "[Sion] Algebra 2";var QUIZ_KEY = "quiz_sionalgebra2_10_20260826_v1";var ATT_KEY = "quiz_sionalgebra2_10_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "Find the equation of an ellipse centered at the origin with a horizontal major axis of length 10 and a minor axis of length 6.<br><svg width=\"220\" height=\"160\" viewBox=\"0 0 220 160\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"80\" x2=\"210\" y2=\"80\" stroke=\"#999\" stroke-width=\"1\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"150\" stroke=\"#999\" stroke-width=\"1\"/><ellipse cx=\"110\" cy=\"80\" rx=\"70\" ry=\"42\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.5\"/><text x=\"182\" y=\"75\" font-size=\"11\" fill=\"#333\">(5,0)</text><text x=\"112\" y=\"35\" font-size=\"11\" fill=\"#333\">(0,3)</text></svg>", "opts": ["x&sup2;/5 + y&sup2;/3 = 1", "x&sup2;/100 + y&sup2;/36 = 1", "x&sup2;/25 + y&sup2;/9 = 1", "x&sup2;/9 + y&sup2;/25 = 1"], "ci": 2, "exp": "A major axis of length 10 means the semi-major axis is a = 5, so a&sup2; = 25. A minor axis of length 6 means the semi-minor axis is b = 3, so b&sup2; = 9. Since the major axis is horizontal, a&sup2; goes under x&sup2;, giving x&sup2;/25 + y&sup2;/9 = 1.", "tag": "Ellipses - Equation & Classification", "tagcolor": "#185FA5"}, {"stem": "Classify the conic section given by 4x&sup2; + 9y&sup2; = 36.", "opts": ["Ellipse", "Circle", "Parabola", "Hyperbola"], "ci": 0, "exp": "Dividing both sides by 36 gives x&sup2;/9 + y&sup2;/4 = 1. Both x&sup2; and y&sup2; terms are positive and added together, but their denominators (9 and 4) are different, which is the standard form of an ellipse rather than a circle (which would need equal denominators).", "tag": "Conic Classification", "tagcolor": "#185FA5"}, {"stem": "Solve for x: (x + 2) &divide; (x &minus; 1) = 3", "opts": ["x = 5", "x = &minus;5/2", "x = 5/2", "x = 1"], "ci": 2, "exp": "Multiplying both sides by (x &minus; 1) gives x + 2 = 3(x &minus; 1) = 3x &minus; 3. So 2 + 3 = 3x &minus; x, meaning 5 = 2x, so x = 5/2. (x = 1 is excluded since it makes the original denominator zero.)", "tag": "Rational Equations - Solving", "tagcolor": "#185FA5"}, {"stem": "Solve for X, given that <table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">2</td><td style=\"padding:2px 8px;text-align:center;\">0</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">0</td><td style=\"padding:2px 8px;text-align:center;\">2</td></tr></table>X = <table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">6</td><td style=\"padding:2px 8px;text-align:center;\">4</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">8</td><td style=\"padding:2px 8px;text-align:center;\">10</td></tr></table>", "opts": ["<table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">6</td><td style=\"padding:2px 8px;text-align:center;\">4</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">8</td><td style=\"padding:2px 8px;text-align:center;\">10</td></tr></table>", "<table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">3</td><td style=\"padding:2px 8px;text-align:center;\">2</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">4</td><td style=\"padding:2px 8px;text-align:center;\">4</td></tr></table>", "<table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">3</td><td style=\"padding:2px 8px;text-align:center;\">2</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">4</td><td style=\"padding:2px 8px;text-align:center;\">5</td></tr></table>", "<table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">12</td><td style=\"padding:2px 8px;text-align:center;\">8</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">16</td><td style=\"padding:2px 8px;text-align:center;\">20</td></tr></table>"], "ci": 2, "exp": "Since <table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">2</td><td style=\"padding:2px 8px;text-align:center;\">0</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">0</td><td style=\"padding:2px 8px;text-align:center;\">2</td></tr></table> = 2 times the identity matrix, dividing both sides by 2 gives X = <table style=\"display:inline-table;vertical-align:middle;border-left:2px solid #333;border-right:2px solid #333;border-collapse:collapse;margin:0 4px;\"><tr><td style=\"padding:2px 8px;text-align:center;\">3</td><td style=\"padding:2px 8px;text-align:center;\">2</td></tr><tr><td style=\"padding:2px 8px;text-align:center;\">4</td><td style=\"padding:2px 8px;text-align:center;\">5</td></tr></table> (each entry of the right-hand matrix divided by 2).", "tag": "Matrices - Solving Matrix Equations", "tagcolor": "#185FA5"}, {"stem": "Solve for x: log&#8322;(x + 3) = 4", "opts": ["x = 13", "x = 5", "x = 19", "x = 8"], "ci": 0, "exp": "The equation log&#8322;(x + 3) = 4 means x + 3 = 2&#8308; = 16. Solving gives x = 16 &minus; 3 = 13.", "tag": "Logarithmic Equations - Solving", "tagcolor": "#185FA5"}, {"stem": "Find the sum of the first 6 terms of the geometric series 3 + 6 + 12 + 24 + &hellip;", "opts": ["189", "192", "186", "96"], "ci": 0, "exp": "This series has first term a = 3 and common ratio r = 2. The sum of n terms of a geometric series is S = a(r&#8319; &minus; 1) &divide; (r &minus; 1) = 3(2&#8310; &minus; 1) &divide; (2 &minus; 1) = 3(63) = 189.", "tag": "Sequences & Series - Geometric", "tagcolor": "#185FA5"}, {"stem": "Convert 150&deg; to radians.", "opts": ["5&pi;/6", "2&pi;/3", "5&pi;/3", "7&pi;/6"], "ci": 0, "exp": "To convert degrees to radians, multiply by &pi;/180: 150 &times; (&pi;/180) = 150&pi;/180 = 5&pi;/6.", "tag": "Radian & Degree Conversion", "tagcolor": "#185FA5"}, {"stem": "If f(x) = 3x &minus; 6, find f&#8315;&#185;(x).<br><svg width=\"220\" height=\"220\" viewBox=\"0 0 220 220\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"110\" x2=\"210\" y2=\"110\" stroke=\"#999\" stroke-width=\"1\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"210\" stroke=\"#999\" stroke-width=\"1\"/><line x1=\"10\" y1=\"210\" x2=\"210\" y2=\"10\" stroke=\"#bbb\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><line x1=\"70\" y1=\"200\" x2=\"200\" y2=\"20\" stroke=\"#185FA5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"200\" x2=\"200\" y2=\"70\" stroke=\"#E24B4A\" stroke-width=\"2.5\"/><text x=\"185\" y=\"30\" font-size=\"12\" fill=\"#185FA5\">f(x)</text><text x=\"185\" y=\"85\" font-size=\"12\" fill=\"#E24B4A\">f&#8315;&#185;(x)</text></svg>", "opts": ["3x + 6", "(x &minus; 6) &divide; 3", "(x + 6) &divide; 3", "(x + 6) &divide; (&minus;3)"], "ci": 2, "exp": "Set y = 3x &minus; 6, then swap x and y to get x = 3y &minus; 6. Solving for y: x + 6 = 3y, so y = (x + 6) &divide; 3. This is f&#8315;&#185;(x).", "tag": "Inverse Functions", "tagcolor": "#185FA5"}, {"stem": "Solve the system: 2x + y = 7 and x &minus; y = 2.<br><svg width=\"220\" height=\"220\" viewBox=\"0 0 220 220\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"110\" x2=\"210\" y2=\"110\" stroke=\"#999\" stroke-width=\"1\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"210\" stroke=\"#999\" stroke-width=\"1\"/><line x1=\"30\" y1=\"190\" x2=\"190\" y2=\"30\" stroke=\"#185FA5\" stroke-width=\"2.5\"/><line x1=\"30\" y1=\"150\" x2=\"190\" y2=\"70\" stroke=\"#E24B4A\" stroke-width=\"2.5\"/><circle cx=\"110\" cy=\"70\" r=\"4\" fill=\"#1D9E75\"/><text x=\"118\" y=\"65\" font-size=\"12\" fill=\"#1D9E75\">(3, 1)</text></svg>", "opts": ["(2, 3)", "(3, &minus;1)", "(3, 1)", "(1, 3)"], "ci": 2, "exp": "Adding the two equations eliminates y: (2x + y) + (x &minus; y) = 7 + 2, so 3x = 9 and x = 3. Substituting into x &minus; y = 2 gives 3 &minus; y = 2, so y = 1. The solution is (3, 1).", "tag": "Systems of Linear Equations", "tagcolor": "#185FA5"}, {"stem": "If f(x) = x&sup2; + 1 and g(x) = 2x &minus; 3, find (f &minus; g)(x).", "opts": ["x&sup2; + 2x &minus; 2", "x&sup2; + 2x + 4", "x&sup2; &minus; 2x &minus; 2", "x&sup2; &minus; 2x + 4"], "ci": 3, "exp": "(f &minus; g)(x) = f(x) &minus; g(x) = (x&sup2; + 1) &minus; (2x &minus; 3) = x&sup2; + 1 &minus; 2x + 3 = x&sup2; &minus; 2x + 4.", "tag": "Function Operations", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
