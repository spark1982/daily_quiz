<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_satgrammar_20_20260826_v1";var ATT_KEY = "quiz_satgrammar_20_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "Due to the fact that the bridge was closed for repairs, commuters had to <u>find an alternate route so that they could get to work</u>.", "opts": ["find an alternate route in order to be able to get to work", "find an alternate route for the purpose of getting to work", "find an alternate route to work", "find an alternate route so that they could get to work"], "ci": 2, "exp": "\"find an alternate route to work\" conveys the same idea as the other choices but without unnecessary words. \"find an alternate route so that they could get to work\" adds a wordy clause that repeats information already implied. \"find an alternate route in order to be able to get to work\" stacks two redundant phrases (\"in order to\" and \"be able to\"). \"find an alternate route for the purpose of getting to work\" replaces a simple infinitive with an unnecessarily formal, wordy phrase."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "<u>Having sat in storage for nearly fifty years, the archivist finally restored</u> the water-damaged painting.", "opts": ["Sitting in storage for nearly fifty years, the archivist finally restored", "Having sat in storage for nearly fifty years, the painting was finally restored by the archivist", "Having sat in storage for nearly fifty years, the archivist finally restored", "Having sat in storage for nearly fifty years, the archivist's restoration of"], "ci": 1, "exp": "The introductory phrase \"Having sat in storage for nearly fifty years\" must describe the noun that immediately follows it; logically, it was the painting, not the archivist, that sat in storage. \"the painting was finally restored by the archivist\" places \"the painting\" right after the modifier, so the description attaches correctly. \"the archivist finally restored\" and \"the archivist's restoration of\" both leave the modifier illogically describing the archivist. \"Sitting in storage\" changes the verb form but keeps the same dangling-modifier problem."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The lab's new imaging equipment produces sharper scans in half the time of the old machine. <u>In addition</u>, it requires extensive staff retraining and a costly software upgrade.", "opts": ["However", "In addition", "Similarly", "Furthermore"], "ci": 0, "exp": "The sentence about staff retraining and software costs introduces a drawback that offsets the benefit described in the sentence about sharper, faster scans, so a contrast word is needed. \"However\" correctly signals that shift from benefit to drawback. \"In addition\" and \"Furthermore\" both signal that another similar, supporting point is coming, not a contrasting one. \"Similarly\" incorrectly suggests the retraining sentence restates the scan-quality idea."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "Neither the coach nor the players believed <u>they</u> could finish the tournament without a single loss.", "opts": ["he", "it", "he or she", "they"], "ci": 3, "exp": "With \"neither...nor,\" the pronoun should agree with the closer of the two subjects, which here is the plural \"the players,\" so the plural pronoun \"they\" is correct. \"he\" and \"he or she\" incorrectly treat the closer subject as singular. \"it\" doesn't agree with a group of people at all."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "During the internship, Mara learned to draft legal memos, <u>to conduct client interviews, and analyzing</u> case law.", "opts": ["conducting client interviews, and to analyze", "to conduct client interviews, and to analyze", "to conduct client interviews, and analyze", "to conduct client interviews, and analyzing"], "ci": 1, "exp": "All three items in the list must share the same grammatical form as \"to draft.\" \"to conduct client interviews, and to analyze\" keeps every item in the infinitive form (\"to draft,\" \"to conduct,\" \"to analyze\"). \"to conduct client interviews, and analyzing\" shifts the final item to a gerund. \"conducting client interviews, and to analyze\" shifts the middle item to a gerund instead. \"to conduct client interviews, and analyze\" drops the \"to\" from the final item, breaking the parallel infinitive pattern."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The lecture hall was nearly full, <u>students had arrived early to secure seats near the front</u>.", "opts": ["students had arrived early, to secure seats near the front", "students had arrived early to secure seats near the front", "students, had arrived early to secure seats near the front", "students had arrived; early to secure seats near the front"], "ci": 1, "exp": "The sentence has two independent clauses joined only by a comma, which is a comma splice; adding a coordinating word or fixing the punctuation between them is required. Since the underlined portion is the second clause itself, the fix must occur where the clauses meet (before \"students\"), so the version that keeps the clause \"students had arrived early to secure seats near the front\" intact, without inserting stray internal punctuation, is correct once paired with a semicolon before it. \"students had arrived early, to secure seats near the front\" inserts an unnecessary comma inside the clause. \"students, had arrived early to secure seats near the front\" wrongly separates the subject from its verb. \"students had arrived; early to secure seats near the front\" places a semicolon in the middle of the clause, breaking it apart illogically."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The report's final conclusion at the end summarized <u>the various different findings that had been discovered</u> during the study.", "opts": ["the different various findings discovered", "the findings", "the various different findings that had been discovered", "the numerous various findings that were found"], "ci": 1, "exp": "\"the findings\" conveys the same information without redundant modifiers. \"the various different findings that had been discovered\" stacks near-synonyms (\"various,\" \"different\") and adds an unnecessary clause. \"the different various findings discovered\" repeats the same redundant pairing in a different order. \"the numerous various findings that were found\" piles on yet another redundant modifier and restates \"discovered\" as \"were found.\""}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "By the time the inspectors arrived, the construction crew <u>already finishes</u> pouring the foundation.", "opts": ["already finished", "had already finished", "already finishes", "has already finished"], "ci": 1, "exp": "Because one past action (finishing the foundation) was completed before another past action (the inspectors' arrival), the past perfect tense is required. \"had already finished\" correctly shows that the finishing happened before the arrival. \"already finishes\" uses the present tense, which doesn't fit a sentence set in the past. \"already finished\" uses the simple past, which doesn't clarify that the finishing preceded the arrival. \"has already finished\" uses the present perfect, which is reserved for actions connected to the present, not to another past event."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The chef's signature dish requires just three ingredients: <u>fresh basil, aged parmesan, and, hand rolled pasta</u>.", "opts": ["fresh basil, aged parmesan and hand rolled, pasta", "fresh basil aged parmesan, and hand-rolled pasta", "fresh basil, aged parmesan, and, hand rolled pasta", "fresh basil, aged parmesan, and hand-rolled pasta"], "ci": 3, "exp": "In a list of three items joined by \"and,\" no comma belongs immediately after \"and,\" and the compound modifier \"hand-rolled\" should be hyphenated. \"fresh basil, aged parmesan, and hand-rolled pasta\" fixes both issues. \"fresh basil, aged parmesan, and, hand rolled pasta\" adds a stray comma after \"and\" and leaves \"hand rolled\" unhyphenated. \"fresh basil, aged parmesan and hand rolled, pasta\" drops the necessary comma before \"and\" and misplaces a comma between \"rolled\" and \"pasta.\" \"fresh basil aged parmesan, and hand-rolled pasta\" drops the comma needed after the first item in the list."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The scholarship committee requires that every applicant <u>submits</u> a personal statement along with two letters of recommendation.", "opts": ["submits", "is submitting", "will submit", "submit"], "ci": 3, "exp": "After a verb like \"requires\" that expresses a demand or requirement, the subjunctive mood calls for the base form of the verb, regardless of the subject. \"submit\" correctly uses that base form. \"submits\" wrongly adds the third-person singular ending. \"will submit\" and \"is submitting\" both use tensed verb forms where the subjunctive base form is required."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "<u>Each of the interns in the marketing department are</u> required to present a final project to the team.", "opts": ["All of the interns in the marketing department is", "Each of the interns in the marketing department are", "Each of the interns in the marketing department were", "Each of the interns in the marketing department is"], "ci": 3, "exp": "\"Each\" is a singular indefinite pronoun regardless of the plural noun that follows it in the prepositional phrase, so it takes the singular verb \"is.\" \"Each of the interns...are\" and \"Each of the interns...were\" both incorrectly pair \"each\" with a plural verb. \"All of the interns...is\" switches to the plural pronoun \"All\" but keeps a singular verb, creating a new agreement error."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The novel, <u>which took the author nearly a decade to complete</u> was praised by critics for its intricate plot.", "opts": ["that took the author nearly a decade to complete,", "which took the author nearly a decade to complete,", "which took the author nearly a decade to complete;", "which took the author nearly a decade to complete"], "ci": 1, "exp": "The clause \"which took the author nearly a decade to complete\" adds extra, nonessential information about the novel and must be set off by commas on both sides. \"which took the author nearly a decade to complete,\" supplies the needed closing comma to match the one already after \"novel.\" Leaving out the comma creates a run-on. A semicolon cannot be used to close a clause that opened with only a comma. \"that\" is generally reserved for restrictive (essential) clauses, but this clause is nonessential, since the sentence already identifies a specific novel."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The <u>collection of rare manuscripts, donated by three separate families over the past decade, remain</u> largely uncatalogued.", "opts": ["collection of rare manuscripts, donated by three separate families over the past decade, remains", "collection of rare manuscripts, having been donated by three separate families over the past decade, remain", "collection of rare manuscripts, donated by three separate families over the past decade, remain", "collections of rare manuscripts, donated by three separate families over the past decade, remain"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"collection,\" not the plural object of the intervening phrase \"of rare manuscripts,\" so it needs the singular verb \"remains.\" \"collection of rare manuscripts...remain\" incorrectly pairs a singular subject with a plural verb. \"collections of rare manuscripts...remain\" changes the subject to plural, altering the sentence's meaning rather than fixing the agreement error. \"having been donated...remain\" keeps the same singular-subject/plural-verb mismatch."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "Each department submitted <u>it's</u> budget proposal a week before the deadline, and the finance team reviewed every one of the proposal's line items.", "opts": ["its", "their", "its'", "it's"], "ci": 0, "exp": "The possessive form of \"it\" never takes an apostrophe, so \"its\" is correct here, referring back to the singular noun \"department.\" \"it's\" is the contraction of \"it is,\" which does not make sense in context. \"its'\" is not a standard English word. \"their\" would incorrectly treat the singular \"department\" as plural."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The festival organizers had promised a rain date, <u>however the forecast for that weekend was equally uncertain</u>.", "opts": ["however: the forecast for that weekend was equally uncertain", "however, the forecast for that weekend was equally uncertain", "however; the forecast for that weekend was equally uncertain", "however the forecast for that weekend was equally uncertain"], "ci": 1, "exp": "When \"however\" joins two independent clauses, it must be preceded by a semicolon and followed by a comma. Since the semicolon before \"however\" would need to replace the existing comma after \"rain date,\" the underlined portion itself must supply the comma right after \"however\": \"however, the forecast for that weekend was equally uncertain.\" Leaving out that comma, as in \"however the forecast...,\" fails to set the transition word off from the clause. Placing a semicolon or colon directly after \"however\" incorrectly punctuates the word itself rather than the junction between clauses."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The award for outstanding service was shared between the head chef and <u>I</u>, since we had both worked every holiday shift that year.", "opts": ["me", "myself", "I", "the both of us"], "ci": 0, "exp": "As the object of the preposition \"between,\" the pronoun must be in the objective case, so \"me\" is correct. \"I\" is a subject pronoun and cannot serve as the object of a preposition. \"myself\" is a reflexive pronoun and needs an earlier \"I\" in the same clause to refer back to, which isn't present here. \"the both of us\" is an informal, redundant phrase that doesn't fit the structure \"between the head chef and ___.\""}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "When the museum's curators met with the city council members, <u>they</u> proposed a plan to relocate the exhibit before winter.", "opts": ["it was proposed", "they proposed a plan", "those officials proposed a plan", "the curators proposed a plan"], "ci": 3, "exp": "\"they\" could refer to either \"the museum's curators\" or \"the city council members,\" so the sentence needs a specific noun. \"the curators proposed a plan\" removes the ambiguity by naming exactly who made the proposal. \"they\" leaves the ambiguous pronoun in place. \"those officials\" is still vague, since both groups could be described as officials. \"it was proposed\" drops the actor entirely, which loses information the sentence needs."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The committee <u>only reviewed</u> three of the fifteen grant applications before the funding deadline passed.", "opts": ["had only been reviewing", "reviewed only", "only had reviewed", "only reviewed"], "ci": 1, "exp": "The limiting word \"only\" should sit directly before the word or phrase it limits, which here is \"three of the fifteen grant applications,\" not the verb \"reviewed.\" \"reviewed only\" correctly places \"only\" right before the quantity it restricts. \"only reviewed\" suggests reviewing was the sole action taken, which isn't the intended meaning. \"only had reviewed\" and \"had only been reviewing\" both keep \"only\" attached to the verb phrase instead of the quantity, and also introduce unnecessary shifts in verb form."}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The proposal not only <u>reduces energy costs but also it will improve</u> air quality throughout the facility.", "opts": ["reduces energy costs but also improves", "will reduce energy costs but also improves", "reduces energy costs but also it will improve", "reduces energy costs but also will be improving"], "ci": 0, "exp": "With \"not only...but also,\" the two things being paired must match grammatically. \"reduces energy costs but also improves\" keeps both verbs in the same present-tense form. \"reduces energy costs but also it will improve\" inserts an extra subject, \"it,\" and shifts to future tense. \"will reduce energy costs but also improves\" mismatches the tense of the two verbs. \"reduces energy costs but also will be improving\" shifts unnecessarily into a future progressive form that doesn't match \"reduces.\""}, {"stem": "Which choice completes the text with the most logically and grammatically sound version of the underlined portion?", "context": "The city's new recycling program reduced landfill waste by nearly a third in its first year. <u>However</u>, participation remains highest in neighborhoods that received in-person outreach.", "opts": ["On the other hand", "However", "In contrast", "Notably"], "ci": 3, "exp": "The sentence about neighborhood participation doesn't contradict the sentence about the drop in landfill waste; it adds a related detail about which neighborhoods drove the improvement, so a word signaling an additional, noteworthy point is needed. \"Notably\" correctly introduces that supporting detail. \"However,\" \"On the other hand,\" and \"In contrast\" all wrongly signal a contrast that doesn't exist between the two ideas."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
