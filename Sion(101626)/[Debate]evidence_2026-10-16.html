  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }

<script>
var TITLE = "[Debate] Evidence";
var QUIZ_KEY = "sionpfevid_8";
var INSTRUCTION = "Read each card or situation and choose the best answer about using evidence. Evidence marked (practice card) was written for this drill. Do not quote it in a real round.";
var TODAY_STR = "20261016";
var RAW_QUESTIONS = [{"stem": "Which statement describes this change accurately?", "opts": ["The share rose by 1.5 percentage points.", "The share rose by 60 percent.", "The share rose by 20 percent.", "The share rose by 20 percentage points, which is a 50 percent increase."], "ci": 3, "exp": "Going from 40 percent to 60 percent is a change of 60 &minus; 40 = 20 <i>percentage points</i>. As a percent of the starting value, 20/40 = 0.5, or a 50 percent increase. Saying &ldquo;20 percent&rdquo; mixes up the two ideas, and a judge who knows the difference will notice.", "contextLabel": "A card says:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Okafor, Global Grid Watch, 2025 (practice card): &ldquo;The share of new data-center power contracts that were for wind or solar rose from 40 percent in 2022 to 60 percent in 2024.&rdquo;</span>", "tag": "Using Evidence", "tagcolor": "#E24B4A"}, {"stem": "What is the best response?", "opts": ["&ldquo;Let me read you a long card about electricity instead.&rdquo;", "&ldquo;Water use doesn&rsquo;t matter in this round.&rdquo;", "&ldquo;Which experts, and from what year? Without an author and date, the judge can&rsquo;t weigh that as evidence.&rdquo;", "&ldquo;I agree, since experts are usually right about water.&rdquo;"], "ci": 2, "exp": "&ldquo;Experts agree&rdquo; is an unsourced claim, so the best crossfire move is a short question that exposes the missing author and date. Agreeing gives away the point, dismissing water is a weak claim you would have to defend, and crossfire is for questions and answers, not reading new cards.", "contextLabel": "In crossfire, your opponent says:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Experts agree that one hyperscale data center uses as much water as a small city.&rdquo;</span>", "tag": "Citation", "tagcolor": "#1D9E75"}, {"stem": "Con&rsquo;s second contention says that a moratorium would just push data center construction to other countries with dirtier power grids. As Pro, which piece of evidence would most directly answer this claim?", "opts": ["A card showing that electricity rates rose in some counties near data centers.", "A card showing that artificial intelligence could be risky for society.", "A card showing that most hyperscale demand comes from U.S. customers who need fast connections, and that surveyed operators planned to expand existing U.S. sites rather than build abroad.", "A card showing that data centers use large amounts of water for cooling."], "ci": 2, "exp": "The best answer evidence attacks the exact warrant: the assumption that construction simply moves overseas. Evidence about U.S. customers needing low <i>latency</i> (delay when data travels far) and operators expanding at home answers that directly. Water, electricity rates, and AI risk are other Pro arguments, but they do not respond to this one.", "tag": "Using Evidence", "tagcolor": "#E24B4A"}, {"stem": "Which citation gives the judge enough information to read aloud before a card in a Public Forum round? Choose the best spoken citation.", "opts": ["&ldquo;According to Global Grid Watch&hellip;&rdquo;", "&ldquo;Okafor of Global Grid Watch, 2025, finds&hellip;&rdquo;", "&ldquo;A recent study finds&hellip;&rdquo;", "&ldquo;Okafor, a researcher, finds&hellip;&rdquo;"], "ci": 1, "exp": "NSDA rules expect debaters to say at least the author&rsquo;s name and the year out loud, and the written card should carry the full source. &ldquo;Okafor of Global Grid Watch, 2025&rdquo; gives author, source, and date. &ldquo;A recent study&rdquo; gives none of them, and the other two leave out the year or the source.", "tag": "Citation", "tagcolor": "#1D9E75"}, {"stem": "Your opponent reads a 2019 card saying total data-center electricity use in the United States stayed nearly flat for a decade. You have a 2025 practice card saying demand rose sharply after companies began training large AI models. What is the best way to use your card against theirs?", "opts": ["Tell the judge that any card older than five years is automatically false.", "Ignore their card and hope the judge forgets it.", "Point out that your evidence is newer and explain what changed after 2019, so your card better describes the situation today.", "Say the two cards cancel each other out, so nobody wins the point."], "ci": 2, "exp": "When cards conflict, compare them. A newer card wins only if you explain <i>why</i> the date matters &mdash; here, AI training changed demand after 2019. Old evidence is not automatically false, ignoring a card concedes it, and &ldquo;they cancel out&rdquo; gives the judge no reason to prefer your side.", "tag": "Using Evidence", "tagcolor": "#E24B4A"}, {"stem": "Which response best challenges the link between the card and the tag?", "opts": ["The card is not evidence because it comes from an institute instead of a university.", "The card should have been read in the opponent&rsquo;s rebuttal instead of the constructive.", "Eighteen percent is too small a number to matter in a debate round.", "The card shows sales rose at the same time as construction, but it does not rule out other causes, such as a regional economic recovery during those years."], "ci": 3, "exp": "The tag claims <i>causation</i>, but the card shows only that two things happened at the same time (<i>correlation</i>). Asking what else could explain the rise is the strongest challenge. An institute can be a fine source, and 18 percent is a meaningful increase.", "contextLabel": "Your opponent (Con) reads:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\"><b>Tag:</b> &ldquo;Data center construction causes local businesses to boom.&rdquo;<br><b>Card:</b> Delgado, Rural Futures Institute, 2025 (practice card): &ldquo;In the eight towns we tracked, restaurant and hotel sales rose an average of 18 percent during the two years that nearby campuses were under construction.&rdquo;</span>", "tag": "Card vs. Tag", "tagcolor": "#185FA5"}, {"stem": "Which tag most accurately represents this card?", "opts": ["Every county with a hyperscale data center saw its electricity rates rise.", "In some of the counties studied, home electricity rates rose faster after a data center connected to the grid.", "Data centers raised electricity rates by 12 percent in all five counties studied.", "Data centers double household electricity bills across the country."], "ci": 1, "exp": "Only two of five counties saw the 9&ndash;12 percent rise, and the other three did not, so an honest tag says &ldquo;some counties.&rdquo; The other tags claim more than the card proves (nationwide, every county, all five). An over-tagged card is easy for your opponent to attack in crossfire.", "contextLabel": "You (Pro) want to read this card:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Whitcomb, Prairie Utility Journal, 2026 (practice card): &ldquo;In two of the five counties we studied, residential electricity rates rose 9 to 12 percent within three years of a hyperscale campus connecting to the grid. In the other three, rates rose no faster than the state average.&rdquo;</span>", "tag": "Card vs. Tag", "tagcolor": "#185FA5"}, {"stem": "What is the biggest problem with how this card is tagged?", "opts": ["The tag overstates the card: the card describes one county and its ten largest employers, not every business in every rural county.", "The card is too old to be used in a round about the current topic.", "The tag is too short to explain what the card says.", "The card does not name an author, so it cannot be used."], "ci": 0, "exp": "A tag must match what the card actually proves. The card is about <i>one</i> county (Linden) and compares the campus only to the next ten employers, so &ldquo;every other business in any rural county&rdquo; stretches the scope. The card is from 2025 and names Harmon, so those are not the problems. (Notice too: the abatement line is something a Pro debater could use against it.)", "contextLabel": "Your opponent (Con) reads this card:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\"><b>Tag:</b> &ldquo;Data centers pay more in taxes than every other business in any rural county.&rdquo;<br><b>Card:</b> Harmon, Midwest Energy Review, 2025 (practice card): &ldquo;In Linden County, the new data campus paid $14 million in property taxes in its first year, more than the county&rsquo;s next ten largest employers combined. The county had granted a 15-year tax abatement on the equipment, so the payment covered only the land and buildings.&rdquo;</span>", "tag": "Card vs. Tag", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    else if(TITLE.indexOf('[Debate]')===0) childName='Sion'; // 2026-10-13: [Debate] quizzes are Sion's
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
