  .hint-box.show { display:block; }

<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261017";
var RAW_QUESTIONS = [{"stem": "A company that prints checks for banks pulls a few checks off the line every hour and examines them for smudges and misprinted numbers. This process is called", "opts": ["market research", "inventory control", "outsourcing", "quality control"], "ci": 3, "exp": "<b>Quality control</b> means checking products during or after production to make sure they meet standards before they reach customers."}, {"stem": "A new teller&rsquo;s first two days at Riverbend Bank include a tour, training on the cash system, and meetings with team members. The main purpose of this process is to", "opts": ["help the new employee learn the job and fit into the workplace", "decide whether the employee should be promoted", "measure the employee&rsquo;s performance for the year", "reduce the employee&rsquo;s starting pay"], "ci": 0, "exp": "<b>Orientation (onboarding)</b> introduces new employees to their duties, coworkers, and company culture so they can succeed quickly."}, {"stem": "<i>Role-play skill: the judge&rsquo;s follow-up question.</i> You presented a plan to open a new branch. The judge (bank president) asks, &ldquo;What would you do if the branch is not profitable after the first year?&rdquo; Which response is best?", "opts": ["&ldquo;I&rsquo;m confident it will be profitable, so that won&rsquo;t happen.&rdquo;", "&ldquo;I&rsquo;d review the branch&rsquo;s monthly results against our goals, find what is not working, and adjust, for example by changing hours or adding services, before deciding to close it.&rdquo;", "&ldquo;We would close it right away to stop losing money.&rdquo;", "&ldquo;I would ask the employees what they think and let them decide.&rdquo;"], "ci": 1, "exp": "Judges look for <b>evaluation and contingency planning</b>: measuring results, finding causes, and adjusting. Denying the risk or reacting without analysis are weak answers."}, {"stem": "Devon tells his neighbor, &ldquo;I&rsquo;ll mow your lawn every Saturday this summer,&rdquo; and the neighbor agrees, but neither one mentions any payment or anything in return. Which element of a valid contract is missing?", "opts": ["offer", "consideration", "acceptance", "legal purpose"], "ci": 1, "exp": "A valid contract needs an offer, acceptance, <b>consideration</b> (something of value exchanged by each side), capacity, and a legal purpose. Here there is an offer and acceptance, but the neighbor gives nothing in return."}, {"stem": "A credit union member mentions that she is saving for her daughter&rsquo;s college tuition. A week later, the teller calls her to share information about a new education savings account. This action best shows", "opts": ["a pushy sales technique that should be avoided", "a customer-service mindset that builds a long-term relationship", "a violation of the member&rsquo;s privacy rights", "a way to reduce the credit union&rsquo;s expenses"], "ci": 1, "exp": "Remembering a customer&rsquo;s goals and following up with useful help shows a <b>customer-service mindset</b>, which builds loyalty. The teller is offering a relevant service the member asked about, not pressuring her."}, {"stem": "A credit union decides to offer its new student savings account through a mobile app and at a small branch inside the local high school. Which of the four Ps of marketing is this decision mainly about?", "opts": ["price", "place", "product", "promotion"], "ci": 1, "exp": "<b>Place</b> (distribution) is about how and where customers get a product. Choosing the app and the school branch decides where students can open the account."}, {"stem": "After an interview for an internship at an investment firm, what is the most professional next step?", "opts": ["Call the interviewer every day until a decision is made", "Send a short thank-you message to the interviewer within a day", "Post about the interview on social media", "Wait silently and never contact the company again"], "ci": 1, "exp": "A brief <b>thank-you note</b> shows good manners, reminds the interviewer of your interest, and is a standard professional practice."}, {"stem": "<i>Role-play skill: addressing a performance indicator.</i> A judge&rsquo;s performance indicator is &ldquo;Explain the nature of effective verbal communications.&rdquo; You are a loan officer explaining a car loan to a nervous first-time borrower. Which statement would best address this indicator?", "opts": ["&ldquo;Verbal communication is the process of sending messages with spoken words.&rdquo;", "&ldquo;Clear speaking means using simple words, checking for understanding, and listening, so I&rsquo;ll explain the monthly payment in plain terms and then ask what questions you have.&rdquo;", "&ldquo;Our bank offers the lowest car loan rates in the entire state this month.&rdquo;", "&ldquo;I&rsquo;ll give you the 20-page loan agreement so you can read every detail at home.&rdquo;"], "ci": 1, "exp": "Strong role-play answers <b>explain the concept and apply it to the situation</b>. Only reciting a definition shows memorization, not understanding, and the other choices do not address verbal communication at all."}, {"stem": "Over the past year, the general price level in the economy rose 6 percent, but Carla&rsquo;s paycheck stayed exactly the same. What happened to Carla&rsquo;s purchasing power?", "opts": ["It decreased, because her same pay buys fewer goods and services", "It increased, because prices are rising", "It stayed the same, because her paycheck did not change", "It doubled, because inflation helps workers"], "ci": 0, "exp": "<b>Inflation</b> is a general rise in prices. When prices rise and income stays the same, each dollar buys less, so <b>purchasing power falls</b>."}, {"stem": "Pinecrest Savings designs a pine-tree logo and registers it with the U.S. Patent and Trademark Office so no other bank can use it. What legal protection has the bank obtained?", "opts": ["a trademark", "a patent", "a copyright", "a business license"], "ci": 0, "exp": "A <b>trademark</b> protects names, logos, and symbols that identify a company&rsquo;s brand. A patent protects inventions, and a copyright protects creative works such as books and music."}, {"stem": "<i>Role-play skill: the judge&rsquo;s follow-up question.</i> You presented a plan for a new low-cost car insurance policy. The judge (marketing director) asks, &ldquo;How would you reach teen drivers with this?&rdquo; Which response is best?", "opts": ["&ldquo;Teens are hard to reach, so I would focus on their parents instead.&rdquo;", "&ldquo;I&rsquo;d partner with local driving schools and run short videos on the social media apps teens use most, then track how many sign-ups come from each.&rdquo;", "&ldquo;We can advertise everywhere so everyone sees it.&rdquo;", "&ldquo;I&rsquo;d have to research that more before I could answer.&rdquo;"], "ci": 1, "exp": "A strong answer to a judge&rsquo;s question is <b>specific, tied to the situation, and confident</b>, with a way to measure results. Vague or avoiding answers lose points."}, {"stem": "An employee at a tax office receives an email that looks like it is from the company&rsquo;s bank, asking her to click a link and type in the office&rsquo;s account password. What should she do?", "opts": ["Click the link quickly so the account is not closed", "Reply to the email with the password", "Not click the link, and report the email to her manager or IT team", "Forward the email to all coworkers so they can respond"], "ci": 2, "exp": "This is a likely <b>phishing</b> scam. Protecting information means never sharing passwords by email and reporting suspicious messages so others are warned."}, {"stem": "During a job interview for an accounting clerk position, which question should the interviewer avoid because it could lead to illegal discrimination?", "opts": ["&ldquo;Can you describe your experience with spreadsheets?&rdquo;", "&ldquo;How old are you, and when do you plan to retire?&rdquo;", "&ldquo;Are you able to work the scheduled hours of this job?&rdquo;", "&ldquo;Tell me about a time you found an error in a report.&rdquo;"], "ci": 1, "exp": "U.S. <b>equal employment opportunity</b> laws prohibit hiring decisions based on age (40 and older), race, religion, sex, and other protected traits, so questions about age should be avoided. The other questions relate to the job."}, {"stem": "A regional bank lists its strengths, weaknesses, opportunities, and threats. Which item belongs in the <b>threats</b> section?", "opts": ["The bank&rsquo;s tellers are known for friendly service", "A new online bank is offering higher savings rates in the same area", "The bank&rsquo;s mobile app is outdated", "A new neighborhood of homes is being built nearby"], "ci": 1, "exp": "In a <b>SWOT analysis</b>, threats are <i>external</i> factors that could hurt the business, such as new competitors. Friendly service is a strength, an outdated app is a weakness, and new homes are an opportunity."}, {"stem": "Ana is writing her first r&eacute;sum&eacute; to apply for a part-time job at a bank. Which item belongs on her r&eacute;sum&eacute;?", "opts": ["her experience as treasurer of the school business club", "her height and her favorite movie", "her Social Security number", "a list of her friends&rsquo; phone numbers"], "ci": 0, "exp": "A <b>r&eacute;sum&eacute;</b> summarizes skills, education, and experience related to the job. Personal details like Social Security numbers should never be included."}, {"stem": "Lena starts an online tutoring business using only her own savings and puts all of her early profits back into the business instead of borrowing money or taking investors. This approach is called", "opts": ["venture capital financing", "crowdfunding", "franchising", "bootstrapping"], "ci": 3, "exp": "<b>Bootstrapping</b> means starting and growing a business with personal funds and reinvested profits. Venture capital and crowdfunding both use other people&rsquo;s money."}, {"stem": "A coworker at an insurance agency seems upset after a difficult phone call with a client. Which response best shows empathy?", "opts": ["&ldquo;Everyone gets hard calls. You&rsquo;ll get used to it.&rdquo;", "&ldquo;You should have handled the client better.&rdquo;", "&ldquo;Let&rsquo;s not talk about work problems during the day.&rdquo;", "&ldquo;That call sounded tough. Do you want to talk about it or take a short break?&rdquo;"], "ci": 3, "exp": "<b>Empathy</b> means recognizing and responding to another person&rsquo;s feelings. Naming the feeling and offering support shows empathy; brushing it off or blaming does not."}, {"stem": "<i>Role-play skill: addressing a performance indicator.</i> A judge&rsquo;s performance indicator is &ldquo;Explain the purpose of a budget.&rdquo; You are a financial advisor helping a young couple who keep running out of money before payday. Which statement would best address this indicator?", "opts": ["&ldquo;A budget is a financial document that lists income and expenses.&rdquo;", "&ldquo;A budget is a plan for your money; by listing your income and expenses each month, you can see where your money goes and set aside some for savings before payday.&rdquo;", "&ldquo;You should open a credit card so you never run out of money again.&rdquo;", "&ldquo;Most families your age spend too much money on eating out.&rdquo;"], "ci": 1, "exp": "The best answer <b>explains the purpose</b> of a budget and <b>connects it to the clients&rsquo; problem</b>. A bare definition misses the application, and the credit card advice could make their problem worse."}, {"stem": "A bank branch reviews its records and finds that the lobby is busiest from 11:30 a.m. to 1:30 p.m. Which operations decision makes the best use of this information?", "opts": ["Schedule more tellers to work during the lunch-hour rush", "Close the lobby during lunch so tellers can eat", "Hire more tellers for the early morning hours", "Ask customers to visit only on weekends"], "ci": 0, "exp": "Operations managers use data to <b>match staffing to demand</b>. Adding tellers at the busiest time shortens wait lines without wasting staff hours."}, {"stem": "A small accounting firm wants to track each month&rsquo;s office expenses, automatically add up totals, and make a chart comparing months. Which tool is best for this job?", "opts": ["word-processing software", "presentation software", "spreadsheet software", "an email program"], "ci": 2, "exp": "<b>Spreadsheet software</b> organizes numbers in rows and columns, calculates totals with formulas, and creates charts."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
