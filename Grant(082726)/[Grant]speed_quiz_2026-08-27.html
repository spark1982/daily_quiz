<body><div class="quiz-title">[Grant] Speed Quiz</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Choose the correct answer for each problem before time runs out.</div><div id="nav-bar"><span id="nav-count">0 / 30</span><div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div><button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button></div><div id="dot-panel"></div>

<script>var TITLE = "[Grant] Speed Quiz";var QUIZ_KEY = "quiz_grantspeedquiz_30_20260826_v1";var ATT_KEY = "quiz_grantspeedquiz_30_att_20260826_v1";var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};var RAW_QUESTIONS = [{"stem": "Joe puts 5 matchsticks on a table. Each matchstick is 10 cm away from another. How far is the fifth matchstick away from the first one?", "opts": ["45 cm", "50 cm", "40 cm", "30 cm"], "ci": 2, "exp": "From the 1st to the 5th matchstick there are 5 &minus; 1 = 4 intervals. Distance = 4 &times; 10 cm = 40 cm.", "tag": "Intervals"}, {"stem": "Six points A, B, C, D, E, F lie on a line at unequal intervals, so that every pair of points is a different distance apart. How many different lengths of line segments are there altogether?<br><svg width=\"240\" height=\"60\" viewBox=\"0 0 240 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"230\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"20\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"60\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"60\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"100\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"100\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"140\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"140\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"180\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"180\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"220\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"220\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>", "opts": ["15", "12", "18", "10"], "ci": 0, "exp": "With 6 points, the number of segments is C(6,2) = 6 &times; 5 &divide; 2 = 15. Since all intervals are unequal, all 15 segments have different lengths.", "tag": "Geometry"}, {"stem": "Compute the following.<br>63 &times; 11 =", "opts": ["703", "663", "693", "683"], "ci": 2, "exp": "For a two-digit number times 11, add the two digits and place the sum between them: 6 and 3 sum to 9, giving 693.", "tag": "Multiply"}, {"stem": "Seven points A, B, C, D, E, F, G lie on a line at unequal intervals, so that every pair of points is a different distance apart. How many different lengths of line segments are there altogether?<br><svg width=\"260\" height=\"60\" viewBox=\"0 0 260 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"20\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"55\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"55\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"90\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"90\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"125\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"125\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"160\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"160\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"195\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"195\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">F</text><circle cx=\"230\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"230\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">G</text></svg>", "opts": ["21", "14", "24", "20"], "ci": 0, "exp": "With 7 points, the number of segments is C(7,2) = 7 &times; 6 &divide; 2 = 21. Since all intervals are unequal, all 21 segments have different lengths.", "tag": "Geometry"}, {"stem": "Compute the following.<br>24 &times; 25 =", "opts": ["550", "600", "500", "650"], "ci": 1, "exp": "24 &times; 25 = 24 &times; 100 &divide; 4 = 2,400 &divide; 4 = 600.", "tag": "Multiply"}, {"stem": "Compute the following.<br>16 &times; 25 =", "opts": ["350", "300", "400", "450"], "ci": 2, "exp": "16 &times; 25 = 16 &times; 100 &divide; 4 = 1,600 &divide; 4 = 400.", "tag": "Multiply"}, {"stem": "How many squares are there altogether in the figure below, which shows a 3-by-2 grid?<br><svg width=\"150\" height=\"100\" viewBox=\"0 0 150 100\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"130\" height=\"80\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"53\" y1=\"10\" x2=\"53\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"96\" y1=\"10\" x2=\"96\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"50\" x2=\"140\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["9", "8", "6", "7"], "ci": 1, "exp": "Count by size: there are 6 of the smallest (1&times;1) squares, and 2 of the next size up (2&times;2) squares that fit inside the grid. Total = 6 + 2 = 8.", "tag": "Geometry"}, {"stem": "25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?", "opts": ["125 m", "120 m", "100 m", "115 m"], "ci": 1, "exp": "With trees at both ends, the number of intervals is one less than the number of trees: 25 &minus; 1 = 24 intervals. Length = 24 &times; 5 m = 120 m.", "tag": "Intervals"}, {"stem": "How many rectangles are there altogether in the figure below, which shows a 3-by-3 grid?<br><svg width=\"140\" height=\"140\" viewBox=\"0 0 140 140\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"120\" height=\"120\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"130\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"130\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"50\" x2=\"130\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"90\" x2=\"130\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["27", "36", "18", "30"], "ci": 1, "exp": "In an m-by-n grid, the number of rectangles is C(m+1,2) &times; C(n+1,2). Here m = n = 3, so C(4,2) &times; C(4,2) = 6 &times; 6 = 36.", "tag": "Geometry"}, {"stem": "Compute the following series.<br>1 + 3 + 5 + 7 + 9 + 11", "opts": ["36", "35", "42", "30"], "ci": 0, "exp": "The sum of the first n odd numbers equals n&sup2;. Here there are 6 odd numbers, so the sum is 6&sup2; = 36.", "tag": "Gauss"}, {"stem": "Compute the following. (See Example 6.)<br>738 &minus; (238 + 162) =", "opts": ["338", "328", "348", "340"], "ci": 0, "exp": "238 + 162 = 400, and 738 &minus; 400 = 338.", "tag": "Add & Subtract"}, {"stem": "Compute the following series.<br>4 + 6 + 8 + 10 + 12 + 14", "opts": ["48", "60", "56", "54"], "ci": 3, "exp": "This is an arithmetic series from 4 to 14 (6 terms, common difference 2). Sum = (4 + 14) &times; 6 &divide; 2 = 54.", "tag": "Gauss"}, {"stem": "Compute the following series.<br>6 + 7 + 8 + 9 + 10 + 11", "opts": ["48", "54", "51", "50"], "ci": 2, "exp": "This is an arithmetic series from 6 to 11 (6 terms). Sum = (6 + 11) &times; 6 &divide; 2 = 51.", "tag": "Gauss"}, {"stem": "Pots of flowers are used to decorate the edges of a square garden. The distance between every two pots of flowers is 3 m. One side of the square garden is 24 m. How many pots of flowers are needed?", "opts": ["36 pots", "32 pots", "24 pots", "28 pots"], "ci": 1, "exp": "Each side has 24 &divide; 3 = 8 intervals. Around the full square (a closed loop), the total number of intervals is 8 &times; 4 = 32, and since the path is a closed loop, the number of pots equals the number of intervals: 32 pots.", "tag": "Intervals"}, {"stem": "John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?", "opts": ["90 coins", "100 coins", "105 coins", "95 coins"], "ci": 3, "exp": "The weekly amounts form the arithmetic series 5, 6, 7, ..., 14 (10 terms). Sum = (5 + 14) &times; 10 &divide; 2 = 95 coins.", "tag": "Gauss"}, {"stem": "Compute the following.<br>86 + 34 + 14 =", "opts": ["134", "144", "124", "130"], "ci": 0, "exp": "86 + 34 + 14 = 120 + 14 = 134.", "tag": "Add & Subtract"}, {"stem": "Compute the following. (See Example 6.)<br>438 &minus; 132 &minus; 206 =", "opts": ["110", "106", "94", "100"], "ci": 3, "exp": "438 &minus; 132 = 306, and 306 &minus; 206 = 100.", "tag": "Add & Subtract"}, {"stem": "Compute the following.<br>78 + 52 + 22 =", "opts": ["152", "150", "162", "142"], "ci": 0, "exp": "78 + 52 + 22 = 130 + 22 = 152.", "tag": "Add & Subtract"}, {"stem": "Compute the following series.<br>1 + 2 + 3 + 4 + &hellip; + 48 + 49 + 50", "opts": ["1,300", "1,250", "1,275", "1,225"], "ci": 2, "exp": "This is the sum of the first 50 whole numbers. Sum = (1 + 50) &times; 50 &divide; 2 = 1,275.", "tag": "Gauss"}, {"stem": "Melvin lives on the 5th floor of an apartment building. Nick lives on the next floor. The staircases leading to Melvin's apartment have 80 steps. How many steps have the staircases leading to Nick's apartment?", "opts": ["96 steps", "80 steps", "90 steps", "100 steps"], "ci": 3, "exp": "Reaching the 5th floor from the ground floor requires 5 &minus; 1 = 4 flights of stairs, so each flight has 80 &divide; 4 = 20 steps. Nick's floor (the 6th) is 6 &minus; 1 = 5 flights up, so it has 5 &times; 20 = 100 steps.", "tag": "Intervals"}, {"stem": "Compute the following.<br>24 + 55 + 76 =", "opts": ["165", "150", "155", "145"], "ci": 2, "exp": "24 + 55 + 76 = 79 + 76 = 155.", "tag": "Add & Subtract"}, {"stem": "Compute the following.<br>56 + 66 + 44 =", "opts": ["160", "166", "156", "176"], "ci": 1, "exp": "56 + 66 + 44 = 122 + 44 = 166.", "tag": "Add & Subtract"}, {"stem": "It takes Uncle Sam 50 seconds to bike from the first lamp post to the eleventh lamp post. How many lamp posts would he bike past after 80 seconds (counting the lamp post he ends at)?", "opts": ["the 16th lamp post", "the 15th lamp post", "the 17th lamp post", "the 18th lamp post"], "ci": 2, "exp": "From the 1st to the 11th lamp post is 11 &minus; 1 = 10 intervals in 50 seconds, so each interval takes 50 &divide; 10 = 5 seconds. In 80 seconds, he covers 80 &divide; 5 = 16 intervals starting from the 1st lamp post, reaching the 1 + 16 = 17th lamp post.", "tag": "Intervals"}, {"stem": "Compute the following series.<br>2 + 3 + 4 + 5 + 6 + 7 + 8", "opts": ["36", "35", "33", "42"], "ci": 1, "exp": "This is an arithmetic series from 2 to 8 (7 terms). Sum = (first + last) &times; number of terms &divide; 2 = (2 + 8) &times; 7 &divide; 2 = 35.", "tag": "Gauss"}, {"stem": "How many rectangles are there altogether in the figure below, which shows a single row of 7 equal cells?<br><svg width=\"280\" height=\"50\" viewBox=\"0 0 280 50\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"260\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"47.14\" y1=\"10\" x2=\"47.14\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"84.28\" y1=\"10\" x2=\"84.28\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"121.42\" y1=\"10\" x2=\"121.42\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"158.56\" y1=\"10\" x2=\"158.56\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"195.7\" y1=\"10\" x2=\"195.7\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.2\"/><line x1=\"232.84\" y1=\"10\" x2=\"232.84\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.2\"/></svg>", "opts": ["24", "28", "21", "14"], "ci": 1, "exp": "For a 1-row, 7-column strip, the number of rectangles is C(8,2) &times; C(2,2) = 28 &times; 1 = 28.", "tag": "Geometry"}, {"stem": "A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?", "opts": ["100 trees", "99 trees", "102 trees", "101 trees"], "ci": 3, "exp": "Number of intervals = 500 &divide; 5 = 100. Since both ends are planted, the number of trees is one more than the number of intervals: 100 + 1 = 101 trees.", "tag": "Intervals"}, {"stem": "Five points A, B, C, D, E lie on a line at unequal intervals, so that every pair of points is a different distance apart. How many different lengths of line segments are there altogether?<br><svg width=\"220\" height=\"60\" viewBox=\"0 0 220 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"210\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"20\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"70\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"70\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"110\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"110\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"150\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"150\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"200\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"200\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>", "opts": ["9", "20", "10", "8"], "ci": 2, "exp": "With 5 points, the number of segments is the number of ways to choose 2 points: C(5,2) = 5 &times; 4 &divide; 2 = 10. Since all intervals are unequal, all 10 segments have different lengths.", "tag": "Geometry"}, {"stem": "Compute the following.<br>27 &times; 11 =", "opts": ["287", "307", "277", "297"], "ci": 3, "exp": "For a two-digit number times 11, add the two digits and place the sum between them: 2 and 7 sum to 9, giving 297.", "tag": "Multiply"}, {"stem": "Compute the following.<br>36 &times; 25 =", "opts": ["800", "950", "850", "900"], "ci": 3, "exp": "36 &times; 25 = 36 &times; 100 &divide; 4 = 3,600 &divide; 4 = 900.", "tag": "Multiply"}, {"stem": "Compute the following.<br>28 &times; 25 =", "opts": ["700", "650", "600", "750"], "ci": 0, "exp": "28 &times; 25 = 28 &times; 100 &divide; 4 = 2,800 &divide; 4 = 700.", "tag": "Multiply"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + "_order_v1";
var Q_TIME = 40;

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<N;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultTimerState(){ return { remainingAtStart: Q_TIME, startedAt: null, running: false, timedOut: false }; }
function defaultState(){
  var timers = {};
  for(var i=0;i<N;i++) timers[i] = defaultTimerState();
  return { cur:0, answers:{}, timers: timers, showResults:false };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.timers !== 'object' || s.timers===null) s.timers = {};
    for(var i=0;i<N;i++){ if(!s.timers[i]) s.timers[i] = defaultTimerState(); }
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var tickInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function getRemaining(qi){
  var t = state.timers[qi];
  if(!t) return Q_TIME;
  if(t.running && t.startedAt){
    var elapsed = (Date.now()-t.startedAt)/1000;
    return Math.max(0, t.remainingAtStart - elapsed);
  }
  return t.remainingAtStart;
}
function freezeTimer(qi){
  var t = state.timers[qi];
  if(t && t.running){
    t.remainingAtStart = getRemaining(qi);
    t.running = false;
    t.startedAt = null;
  }
}
function startTimerFor(qi){
  var t = state.timers[qi];
  if(!t) { t = defaultTimerState(); state.timers[qi] = t; }
  if(t.timedOut) return;
  if(state.answers[qi] !== undefined) return;
  if(!t.running){
    t.startedAt = Date.now();
    t.running = true;
  }
}
function stopTickInterval(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }
function startTickInterval(){ stopTickInterval(); tickInterval = setInterval(tickRender, 250); }

function tickRender(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var disp = document.getElementById('qTimerDisplay');
  var pauseBtn = document.getElementById('pauseBtn');
  if(!t) return;
  var remaining = getRemaining(qi);
  disp.classList.remove('warn','danger');
  if(remaining <= 0){
    if(t.running){
      t.running = false;
      t.startedAt = null;
      t.remainingAtStart = 0;
      t.timedOut = true;
      saveState();
      renderOptionsLockState();
    }
    disp.textContent = "0:00";
    disp.classList.add('danger');
    document.getElementById('timeout-box').style.display = (state.answers[qi]===undefined) ? 'block' : 'none';
    pauseBtn.disabled = true;
    return;
  }
  pauseBtn.disabled = false;
  disp.textContent = formatTime(remaining);
  if(remaining <= Q_TIME*0.1) disp.classList.add('danger');
  else if(remaining <= Q_TIME*0.25) disp.classList.add('warn');
  pauseBtn.textContent = t.running ? 'Pause' : 'Resume';
}

function renderOptionsLockState(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var answered = state.answers[qi];
  var btns = document.querySelectorAll('#options .opt-btn');
  btns.forEach(function(btn){
    if(answered !== undefined || (t && t.timedOut)) btn.disabled = true;
  });
}

function togglePause(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(!t || t.timedOut || state.answers[qi]!==undefined) return;
  if(t.running){ freezeTimer(qi); }
  else { startTimerFor(qi); }
  saveState();
  tickRender();
}
window.togglePause = togglePause;

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  var timerBar = document.querySelector('.q-timer-bar');
  if(state.showResults){
    qa.style.display='none';
    timerBar.style.display='none';
    rs.classList.add('show');
    stopTickInterval();
    renderResults();
    return;
  }
  qa.style.display='block';
  timerBar.style.display='flex';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  badge.textContent = q.tag;
  badge.style.background = TAG_COLORS[q.tag] || '#185FA5';

  document.getElementById('q-text').innerHTML = q.stem;

  startTimerFor(qi);

  var answered = state.answers[qi];
  var t = state.timers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = (answered !== undefined) || (t && t.timedOut);
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var timeoutBox = document.getElementById('timeout-box');
  timeoutBox.style.display = (t && t.timedOut && answered===undefined) ? 'block' : 'none';

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
  tickRender();
  startTickInterval();
}

function updateNav(){
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi = order[k];
    if(state.answers[qi]!==undefined || (state.timers[qi] && state.timers[qi].timedOut)) done++;
  }
  document.getElementById('nav-count').textContent = done + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (done/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg;
    if(state.answers[qi]===undefined){
      bg = (state.timers[qi] && state.timers[qi].timedOut) ? '#f5a623' : '#d7dde6';
    } else {
      bg = state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A';
    }
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi2 = order[k];
    if(state.answers[qi2]!==undefined || (state.timers[qi2] && state.timers[qi2].timedOut)) done++;
  }
  if(done===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  freezeTimer(order[state.cur]);
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  freezeTimer(order[state.cur]);
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(state.answers[qi] !== undefined) return;
  if(t && t.timedOut) return;
  state.answers[qi] = idx;
  freezeTimer(qi);
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ freezeTimer(order[state.cur]); state.cur--; saveState(); render(); }
}
function goNext(){
  freezeTimer(order[state.cur]);
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0, timedout=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a===undefined){
      if(t && t.timedOut) timedout++; else skipped++;
      continue;
    }
    if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+timedout+' timed out, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var card = document.createElement('div');
    if(a===undefined){
      if(t && t.timedOut){ card.className='r-card timedout'; card.textContent='Q'+(pos+1)+' Time'; }
      else { card.className='r-card skipped'; card.textContent='Q'+(pos+1)+' Skip'; }
    } else {
      var ok = a===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var isWrong = (a!==undefined && a!==RAW_QUESTIONS[qi].ci);
    var isTimedOut = (a===undefined && t && t.timedOut);
    if(isWrong || isTimedOut) wrong.push(qi);
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){
    delete state.answers[qi];
    state.timers[qi] = defaultTimerState();
  });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s += (t && t.timedOut) ? 'Timed Out' : 'Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    } else if(a===undefined && t && t.timedOut){
      var q2 = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q2.stem, yourAnswer: '(timed out)', correctAnswer: q2.opts[q2.ci], explanation: q2.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
</script>
