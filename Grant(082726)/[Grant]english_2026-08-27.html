<script>var TITLE = "[Grant] English";var QUIZ_KEY = "quiz_grantenglish_25_20260826_v1";var ATT_KEY = "quiz_grantenglish_25_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "What is the main idea of the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1941, a Swiss engineer named George de Mestral returned from a hike in the Alps with his dog, both covered in stubborn burrs from the wild burdock plants along the trail. Rather than simply picking off the burrs and forgetting about them, as most hikers would have, de Mestral grew curious about why the tiny seed pods clung so tightly to fur and fabric.<br><br>He placed a single burr under a microscope and discovered that its surface was covered in hundreds of tiny hooks, each one shaped to snag the small loops woven into fabric or curled in animal fur. De Mestral immediately imagined a fastener built on the same principle: one strip covered in hooks, another covered in loops, pressed together to grip and pulled apart to release.<br><br>Turning the idea into a working product took far longer than de Mestral expected. Textile manufacturers he approached doubted that any machine could weave the tiny hooks with enough precision, and early prototypes fell apart after only a few uses. It took nearly eight years of trial and error, along with the invention of a special loom, before de Mestral could reliably produce a durable version of his hook-and-loop fastener. He combined the French words velours and crochet, meaning velvet and hook, to name his invention Velcro.<br><br>At first, the fashion industry showed little interest, dismissing Velcro as a cheap-looking substitute for buttons and zippers. The turning point came in the 1960s, when NASA engineers adopted Velcro to hold objects in place inside spacecraft, where floating tools posed a genuine danger in zero gravity. Astronauts used it to secure equipment, food packets, and even sleeping bags.<br><br>Once the public learned that Velcro had proven itself reliable enough for space travel, everyday demand followed quickly. Today, the fastener de Mestral first imagined while picking burrs from his dog's fur appears on shoes, jackets, medical devices, and countless products around the world, a lasting reminder that careful observation of an ordinary annoyance can lead to an extraordinary invention.", "opts": ["NASA invented Velcro specifically to solve problems with floating tools in spacecraft.", "De Mestral's dog was the main character whose adventures the passage describes.", "George de Mestral turned his curiosity about clinging burrs into Velcro, an invention that eventually proved useful both in space and in everyday life.", "Textile manufacturers were the first to successfully produce Velcro in large quantities."], "ci": 2, "exp": "The passage traces how de Mestral's curiosity about clinging burrs led him to invent Velcro, which later proved useful in both space travel and everyday life, an idea every paragraph builds toward. NASA is only one part of the story, not the inventor. Textile manufacturers doubted the idea rather than produced it first. The dog is mentioned briefly as background, not as the passage's focus."}, {"stem": "Which detail from the passage best supports the idea that early experts doubted de Mestral's invention could work?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1941, a Swiss engineer named George de Mestral returned from a hike in the Alps with his dog, both covered in stubborn burrs from the wild burdock plants along the trail. Rather than simply picking off the burrs and forgetting about them, as most hikers would have, de Mestral grew curious about why the tiny seed pods clung so tightly to fur and fabric.<br><br>He placed a single burr under a microscope and discovered that its surface was covered in hundreds of tiny hooks, each one shaped to snag the small loops woven into fabric or curled in animal fur. De Mestral immedia ong with the invention of a special loom, before de Mestral could reliably produce a durable version of his hook-and-loop fastener. He combined the French words velours and crochet, meaning velvet and hook, to name his invention Velcro.<br><br>At first, the fashion industry showed little interest, dismissing Velcro as a cheap-looking substitute for buttons and zippers. The turning point came in the 1960s, when NASA engineers adopted Velcro to hold objects in place inside spacecraft, where floating tools posed a genuine danger in zero gravity. Astronauts used it to secure equipment, food packets, and even sleeping bags.<br><br>Once the public learned that Velcro had proven itself reliable enough for space travel, everyday demand followed quickly. Today, the fastener de Mestral first imagined while picking burrs from his dog's fur appears on shoes, jackets, medical devices, and countless products around the world, a lasting reminder that careful observation of an ordinary annoyance can lead to an extraordinary invention.", "opts": ["scientific instruments used to measure weight", "early test versions of an invention", "final products ready for sale", "marketing advertisements for a product"], "ci": 1, "exp": "\"Early prototypes fell apart after only a few uses\" describes test versions that failed before a reliable design was reached, matching \"early test versions of an invention.\" The passage says these versions failed, so they weren't final products ready for sale. Nothing in the passage connects them to measuring instruments or advertisements."}, {"stem": "Based on the passage, what can be inferred about George de Mestral's personality from his reaction to the burrs?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1941, a Swiss engineer named George de Mestral returned from a hike in the Alps with his dog, both covered in stubborn burrs from the wild burdock plants along the trail. Rather than simply picking off the burrs and forgetting about them, as most hikers would have, de Mestral grew curious about why the tiny seed pods clung so tightly to fur and fabric.<br><br>He placed a single burr under a microscope and discovered that its surface was covered in hundreds of tiny hooks, each one shaped to snag the small loops woven into fabric or curled in animal fur. De Mestral immediately imagined a fastener built on the same principle: one strip covered in hooks, another covered in loops, pressed together to grip and pulled apart to release.<br><br>Turning the idea into a working product took far longer than de Mestral expected. Textile manufacturers he approached doubted that any machine could weave the tiny hooks with enough precision, and early prototypes fell apart after only a few uses. It took nearly eight years of trial and error, along with the invention of a special loom, before de Mestral could reliably produce a durable version of his hook-and-loop fastener. He combined the French words velours and crochet, meaning velvet and hook, to name his invention Velcro.<br><br>At first, the fashion industry showed little interest, dismissing Velcro as a cheap-looking substitute for buttons and zippers. The turning point came in the 1960s, when NASA engineers adopted Velcro to hold objects in place inside spacecraft, where floating tools posed a genuine danger in zero gravity. Astronauts used it to secure equipment, food packets, and even sleeping bags.<br><br>Once the public learned that Velcro had proven itself reliable enough for space travel, everyday demand followed quickly. Today, the fastener de Mestral first imagined while picking burrs from his dog's fur appears on shoes, jackets, medical devices, and countless products around the world, a lasting reminder that careful observation of an ordinary annoyance can lead to an extraordinary invention.", "opts": ["He was primarily interested in becoming famous quickly.", "He had no interest in science or how things worked.", "He disliked hik     var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
