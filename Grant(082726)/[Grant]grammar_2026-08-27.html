<style>
*{box-sizing:border-box;margin:0;padding:0}

</style>

<body><div class="quiz-title">[Grant] Grammar</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Choose the best answer to complete each sentence.</div>

<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_20_20260826_v1";var ATT_KEY = "quiz_grantgrammar_20_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "Which sentence uses the comma correctly?", "opts": ["We wanted to go hiking but, the trail was closed for repairs.", "We wanted to go hiking, but, the trail was closed for repairs.", "We wanted to go hiking, but the trail was closed for repairs.", "We wanted to go hiking but the trail, was closed for repairs."], "ci": 2, "exp": "In a compound sentence joining two complete ideas with \"but,\" the comma belongs directly before \"but.\" The other options place the comma in the wrong spot or add an extra, unnecessary comma.", "tag": "Comma Usage in Compound Sentences", "tagcolor": "#185FA5"}, {"stem": "Which word best completes the sentence? _____ the storm passed, the power finally came back on.", "opts": ["So", "But", "And", "After"], "ci": 3, "exp": "\"After\" correctly introduces a dependent clause showing the order of events (the storm passing, then the power returning). \"And,\" \"But,\" and \"So\" are coordinating conjunctions and don't fit this sentence structure, which needs a subordinating conjunction to begin the sentence.", "tag": "Subordinating Conjunctions", "tagcolor": "#185FA5"}, {"stem": "Which sentence punctuates the quotation correctly?", "opts": ["\"Watch out for the wet paint\" the painter warned.", "\"Watch out for the wet paint,\" the painter warned.", "Watch out for the wet paint, the painter warned.", "\"Watch out for the wet paint,\" The painter warned."], "ci": 1, "exp": "The correct sentence places quotation marks around the exact spoken words and a comma before the closing quotation mark, with the tag \"the painter warned\" left lowercase since it continues the sentence. The other choices are missing quotation marks, missing the comma, or wrongly capitalize \"The.\"", "tag": "Quotation Marks", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses capitalization correctly?", "opts": ["We celebrate Thanksgiving with Aunt Carol every November.", "We celebrate Thanksgiving with aunt Carol every november.", "we celebrate Thanksgiving with Aunt Carol every November.", "We celebrate thanksgiving with Aunt Carol every November."], "ci": 0, "exp": "\"We celebrate Thanksgiving with Aunt Carol every November.\" correctly capitalizes the holiday \"Thanksgiving,\" the name \"Aunt Carol,\" and the month \"November.\" The other choices lowercase one of these proper nouns or the sentence's first word.", "tag": "Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which word in the sentence is an abstract noun? \"Her courage impressed everyone at the meeting.\"", "opts": ["courage", "impressed", "everyone", "meeting"], "ci": 0, "exp": "\"courage\" names a quality that cannot be seen or touched, making it an abstract noun. \"meeting\" is a concrete noun (a place/event you can point to). \"everyone\" is a pronoun. \"impressed\" is a verb.", "tag": "Abstract Nouns", "tagcolor": "#185FA5"}, {"stem": "Choose the correct word to complete the sentence: Of all three trails, this one is the _____.", "opts": ["more steep", "steeper", "most steepest", "steepest"], "ci": 3, "exp": "When comparing three or more things, the superlative form is used: \"steepest.\" \"steeper\" is the comparative form, used for comparing only two things. \"more steep\" and \"most steepest\" incorrectly double up on comparison words.", "tag": "Comparative and Superlative Adjectives", "tagcolor": "#185FA5"}, {"stem": "Choose the correct pronoun: The coach gave the trophy to Marcus and _____.", "opts": ["myself", "me", "I", "mine"], "ci": 1, "exp": "\"me\" is an object pronoun, needed here because it receives the action of \"gave... to.\" \"I\" is a subject pronoun and cannot be an object. \"myself\" is reflexive and needs an earlier \"I\" to refer back to. \"mine\" is possessive and doesn't fit.", "tag": "Pronoun Case", "tagcolor": "#185FA5"}, {"stem": "Which word is the helping verb in the sentence? \"They had finished dinner before the movie started.\"", "opts": ["finished", "had", "started", "before"], "ci": 1, "exp": "\"had\" helps the main verb \"finished\" form the past-perfect tense, making it a helping verb. \"finished\" and \"started\" are the main verbs. \"before\" is a preposition here.", "tag": "Helping (Auxiliary) Verbs", "tagcolor": "#185FA5"}, {"stem": "Which of these is a complete sentence rather than a fragment?", "opts": ["The picnic that we moved indoors.", "Because it started raining, we moved the picnic indoors.", "Because it started raining during the picnic.", "Moved the picnic indoors during the storm."], "ci": 1, "exp": "\"Because it started raining, we moved the picnic indoors.\" has both a dependent clause and an independent clause with a subject and verb, making it complete. The other choices are fragments missing an independent clause.", "tag": "Sentence Fragments", "tagcolor": "#185FA5"}, {"stem": "Which word in the sentence is an adverb? \"The old bridge creaked nervously as we crossed it.\"", "opts": ["creaked", "crossed", "bridge", "nervously"], "ci": 3, "exp": "\"nervously\" describes how the bridge creaked, making it an adverb. \"bridge\" is a noun. \"creaked\" and \"crossed\" are verbs, not the words being modified.", "tag": "Adverbs", "tagcolor": "#185FA5"}, {"stem": "Which word is the linking verb in the sentence? \"The soup smells delicious tonight.\"", "opts": ["tonight", "soup", "delicious", "smells"], "ci": 3, "exp": "\"smells\" links the subject \"soup\" to the description \"delicious,\" making it a linking verb here rather than an action verb. \"soup\" is the subject, \"delicious\" is the adjective it links to, and \"tonight\" is an adverb of time.", "tag": "Linking Verbs", "tagcolor": "#185FA5"}, {"stem": "Choose the correct verb form to complete the sentence: Next weekend, our family _____ to the lake house.", "opts": ["will drive", "driven", "drove", "drives"], "ci": 0, "exp": "\"will drive\" correctly expresses an action that will happen in the future, signaled by \"next weekend.\" \"drove\" is past tense. \"driven\" needs a helping verb like \"have.\" \"drives\" is present tense.", "tag": "Verb Tense (Future)", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the correct plural form?", "opts": ["Two mices ran across the kitchen floor.", "Two mice ran across the kitchen floor.", "Two mouses ran across the kitchen floor.", "Two mouse ran across the kitchen floor."], "ci": 1, "exp": "\"mice\" is the correct irregular plural of \"mouse.\" \"mouses,\" \"mices,\" and the unchanged \"mouse\" are all incorrect plural forms.", "tag": "Irregular Plural Nouns", "tagcolor": "#185FA5"}, {"stem": "Which word in the sentence is a preposition? \"The cat hid beneath the porch during the storm.\"", "opts": ["storm", "hid", "cat", "beneath"], "ci": 3, "exp": "\"beneath\" shows the relationship between \"hid\" and \"the porch,\" making it a preposition. \"cat\" and \"storm\" are nouns, and \"hid\" is the verb.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Choose the verb that correctly completes the sentence: A box of crayons _____ under the couch.", "opts": ["were", "have", "is", "are"], "ci": 2, "exp": "The subject is the singular noun \"box,\" not the plural \"crayons\" inside the prepositional phrase, so the singular verb \"is\" is correct. \"are\" and \"were\" are plural forms. \"have\" doesn't match the meaning of this sentence.", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which word is the correct contraction for \"should not\"?", "opts": ["shouldn't", "shouldnt", "shoudn't", "should'nt"], "ci": 0, "exp": "\"shouldn't\" correctly places the apostrophe where the letter \"o\" in \"not\" is dropped. The other spellings either misplace the apostrophe or leave it out entirely.", "tag": "Contractions", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive apostrophe correctly?", "opts": ["The childrens playground needs new swings.", "The children's playground needs new swings.", "The childrens' playground needs new swings.", "The children playground's needs new swings."], "ci": 1, "exp": "Since \"children\" is already plural without an \"s,\" its possessive form adds apostrophe + s: \"children's.\" The other options either place the apostrophe incorrectly or leave it out.", "tag": "Possessive Nouns", "tagcolor": "#185FA5"}, {"stem": "What type of sentence is this? \"Did you finish your homework yet?\"", "opts": ["imperative", "declarative", "exclamatory", "interrogative"], "ci": 3, "exp": "An interrogative sentence asks a question, which is exactly what this sentence does and why it ends with a question mark. A declarative sentence states a fact. An imperative sentence gives a command. An exclamatory sentence expresses strong emotion.", "tag": "Sentence Types", "tagcolor": "#185FA5"}, {"stem": "Which coordinating conjunction best completes the sentence? I wanted pizza for dinner, _____ my brother wanted tacos.", "opts": ["so", "or", "but", "for"], "ci": 2, "exp": "\"but\" correctly shows the contrast between the two different dinner preferences. \"so\" would suggest a result, which doesn't fit. \"for\" suggests a reason. \"or\" presents a choice, not a contrast.", "tag": "Coordinating Conjunctions", "tagcolor": "#185FA5"}, {"stem": "Choose the correct past-tense form to complete the sentence: Last winter, the lake _____ completely.", "opts": ["freezed", "froze", "freeze", "frozen"], "ci": 1, "exp": "\"froze\" is the correct simple past-tense form of \"freeze.\" \"freezed\" is not a real word. \"frozen\" is the past-participle form, used with a helping verb such as \"had.\" \"freeze\" is the present-tense form.", "tag": "Irregular Verbs", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
