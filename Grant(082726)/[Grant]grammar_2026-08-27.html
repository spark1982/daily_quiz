<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_48_20260826_v1";var ATT_KEY = "quiz_grantgrammar_48_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The teacher <b>explains</b> the lesson.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The lesson ______ by the teacher.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["are explained", "is explained", "is explaining", "is explain"], "ci": 1, "exp": "The new subject \"the lesson\" is singular and the action is in the present, so use is + the past participle \"explained\": is explained.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["She is <b>swimming</b> in the pool right now.", "<b>Swimming</b> is her favorite hobby.", "They were <b>swimming</b> when it started to rain.", "He will be <b>swimming</b> at the meet tomorrow."], "ci": 1, "exp": "In \"Swimming is her favorite hobby,\" \"swimming\" acts as the subject of the sentence - a noun - which makes it a gerund. In the other three sentences, \"swimming\" follows a form of \"be\" (is / were / will be) and is part of the progressive verb tense, describing an action in progress.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["I am <b>reading</b> a mystery novel.", "She was <b>reading</b> when the phone rang.", "<b>Reading</b> books helps you learn new words.", "We will be <b>reading</b> the next chapter tomorrow."], "ci": 2, "exp": "In \"Reading books helps you learn new words,\" \"reading\" is the subject of the sentence, functioning as a noun - a gerund. In the other three sentences, \"reading\" follows \"am / was / will be\" and describes an action happening at a specific time, so it is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>woman</b>?", "opts": ["womans", "womens", "women", "womenans"], "ci": 2, "exp": "woman → women (the 'a' in 'woman' changes to 'e')", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "He is <u>write</u> a letter to his friend.", "opts": ["writing", "writeing", "writting", "writeing"], "ci": 0, "exp": "write → writing (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "When the guests finally arrived, she <span style=\"text-decoration:underline;\">______</span> a wonderful dinner.", "opts": ["had prepared", "has prepared", "will have prepared", "prepared"], "ci": 0, "exp": "\"had prepared\" is past perfect — the dinner was ready before the guests arrived.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "They made him a leader.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["a leader", "him"], "ci": 0, "exp": "\"A leader\" is the objective complement — it describes what \"him\" became. \"Him\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "She gave me a book.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["a book", "me"], "ci": 0, "exp": "\"A book\" is the direct object (what was given). \"Me\" is the indirect object (who received it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "good<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["better / best", "gooder / goodest", "more good / most good", "beter / bets"], "ci": 0, "exp": "good → better / best (completely irregular — must be memorized)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">I have rarely eaten at such a fancy restaurant.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Rarely I have eaten at such a fancy restaurant.", "Rarely had I eaten at such a fancy restaurant.", "Rarely have I eaten at such a fancy restaurant.", "Rarely have I ate at such a fancy restaurant."], "ci": 2, "exp": "\"Rarely\" triggers inversion: \"Rarely + have + I + eaten...\". The tense is present perfect, so \"have\" stays (not \"had\"). The past participle \"eaten\" follows. The correct form is: Rarely have I eaten at such a fancy restaurant.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The dog is <b>barking</b> at the mail carrier.", "The dog was <b>barking</b> all night.", "The <b>barking</b> dog woke up the whole neighborhood.", "His constant <b>barking</b> annoyed the neighbors."], "ci": 2, "exp": "In \"The barking dog woke up the whole neighborhood,\" \"barking\" comes directly before the noun \"dog\" and describes what the dog is doing - this adjective use of an -ing word is a present participle. In \"The dog is barking at the mail carrier\" and \"The dog was barking all night,\" \"barking\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"His constant barking annoyed the neighbors,\" \"barking\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Because she was late to school.", "The dog barked loudly at the mailman.", "Running down the hill as fast as possible.", "After the long summer vacation ended."], "ci": 1, "exp": "\"The dog barked loudly at the mailman.\" is a complete sentence — subject: 'The dog', predicate: 'barked'. The other three are fragments: a 'Because' dependent clause, an -ing phrase with no subject, and an 'After' dependent clause.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "She gave me a book.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["me", "a book"], "ci": 0, "exp": "\"Me\" is the indirect object (who received it). \"A book\" is the direct object (what was given).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The dog wagged it's tail happily.", "My sisters car is parked outside.", "The cat licked its paw slowly.", "Those books are their's to keep."], "ci": 2, "exp": "<strong>\"its\"</strong> (no apostrophe) is the correct possessive pronoun.<br>• <em>it's</em> = <em>it is</em> (contraction, not possessive).<br>• <em>sisters car</em> is missing the apostrophe — should be <em>sister's</em> or <em>sisters'</em>.<br>• <em>their's</em> does not exist; the correct form is <em>theirs</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "She finished her homework _____ dinner so she could watch a movie afterward.", "opts": ["during", "before", "beneath", "among"], "ci": 1, "exp": "\"Before\" shows that finishing homework happened earlier in time than dinner. \"During\" would mean she did homework at the same time as eating, which changes the meaning. \"Beneath\" and \"among\" do not relate to time.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "She _____ already finished her homework, so she can play now.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" (has) is correct. The result affects the present moment — she can play now. Present perfect connects a past action to the present.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "Look at the dining table! She <span style=\"text-decoration:underline;\">______</span> a wonderful dinner just now.", "opts": ["had prepared", "has prepared", "will have prepared", "was preparing"], "ci": 1, "exp": "\"has prepared\" is present perfect — the action just happened with a visible result now.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["\"Look out!\" she screamed, \"the bridge is going to collapse!\"", "\"Look out!\" She screamed, \"the bridge is going to collapse!\"", "\"Look out!\" she screamed. \"The bridge is going to collapse!\"", "\"Look out\"! she screamed. \"The bridge is going to collapse!\""], "ci": 2, "exp": "After a complete exclamatory quote, the dialogue tag begins with a lowercase letter (\"she screamed\"). A period ends the tag, and the next quoted sentence starts with a capital letter. The exclamation mark goes inside the closing quotation mark.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "She is <u>make</u> a birthday cake right now.", "opts": ["making", "makeing", "makking", "maked"], "ci": 0, "exp": "make → making (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The students in the front row raises their hands every time.", "The teacher, along with her assistants, prepare the lab materials.", "Each of the boys on the soccer team practices every afternoon.", "Many of the answers on the test was incorrect."], "ci": 2, "exp": "\"Each\" is singular, so \"practices\" is correct. \"Students\" is plural — \"raises\" should be \"raise.\" \"Teacher\" is singular but \"prepare\" is plural — should be \"prepares.\" \"Answers\" is plural — \"was\" should be \"were.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>fall</b> &rsaquo; Past: <b>fell</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["falled", "fell", "falling", "fallen"], "ci": 3, "exp": "'fall' is an irregular verb. Its past participle is 'fallen'. Past perfect: had fallen.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The childrens' playground is closed today.", "I borrowed my friend's bicycle yesterday.", "The mens' locker room is on the left.", "Please put the books back in there place."], "ci": 1, "exp": "<strong>\"friend's\"</strong> correctly adds <em>'s</em> to a singular noun.<br>• <em>childrens'</em> is wrong — <em>children</em> is already plural; the possessive is <em>children's</em>.<br>• <em>mens'</em> is wrong — <em>men</em> is already plural; the possessive is <em>men's</em>.<br>• <em>there</em> is a location word; the possessive adjective is <em>their</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "I drink <u>water</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Water\" receives the action of \"drink.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["pretty little blue bag", "little pretty blue bag", "blue pretty little bag", "little blue pretty bag"], "ci": 0, "exp": "Correct order: opinion (pretty) → size (little) → color (blue) → noun\n✔ pretty little blue bag", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "I ________ a movie last night.", "opts": ["watched", "have watched"], "ci": 0, "exp": "Last night is a finished past time, so use simple past: watched.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "The happy dog runs quickly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the NOUNS in this sentence, and only the nouns?</span>", "opts": ["dog", "dog, runs", "(none of these)", "dog, happy"], "ci": 0, "exp": "'Dog' is a noun - a person, place, or thing.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "The students gathered _____ the gymnasium to watch the annual science fair presentations.", "opts": ["inside", "at", "between", "below"], "ci": 0, "exp": "\"Inside\" means within the space of a building or container. The students are gathered within the gymnasium, so \"inside\" is the most precise preposition here. \"At\" is too vague, and the others do not fit the context.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "The dog barked loudly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["The dog", "loudly", "barked", "dog"], "ci": 2, "exp": "See the correct answer highlighted above.", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "She reads <u>books</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Books\" receives the action of \"reads.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["My teacher, Mrs. johnson, assigned us a project on the american revolution.", "My teacher, Mrs. Johnson, assigned us a project on the American Revolution.", "My Teacher, Mrs. Johnson, assigned us a project on the American Revolution.", "My teacher, mrs. Johnson, assigned us a project on the American revolution."], "ci": 1, "exp": "\"Mrs. Johnson\" is a title with a proper name — both words are capitalized. \"American Revolution\" is a proper noun and must be capitalized. \"teacher\" at the start is a common noun and stays lowercase.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Waiting for the bus in the rain.", "Although the test was very difficult.", "She finished her homework before dinner.", "The tall boy with curly hair."], "ci": 2, "exp": "\"She finished her homework before dinner.\" is a complete sentence — subject: 'She', predicate: 'finished'. The others are fragments: an -ing phrase, an 'Although' clause, and a noun phrase with no verb.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>go</b> &rsaquo; Past: <b>went</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["goed", "went", "going", "gone"], "ci": 3, "exp": "'go' is an irregular verb. Its past participle is 'gone'. Past perfect: had gone.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "bad<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["worse / worst", "badder / baddest", "more bad / most bad", "worser / worsest"], "ci": 0, "exp": "bad → worse / worst (completely irregular — must be memorized)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The <b>flying</b> kite got tangled in the tree.", "She is <b>flying</b> to Chicago tomorrow.", "<b>Flying</b> makes her nervous.", "They were <b>flying</b> kites at the beach yesterday."], "ci": 0, "exp": "In \"The flying kite got tangled in the tree,\" \"flying\" comes directly before the noun \"kite\" and describes what the kite is doing - this adjective use of an -ing word is a present participle. In \"She is flying to Chicago tomorrow\" and \"They were flying kites at the beach yesterday,\" \"flying\" is the main verb paired with \"is / were,\" making it part of the progressive tense. In \"Flying makes her nervous,\" \"flying\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "I ________ that movie before.", "opts": ["saw", "have seen"], "ci": 1, "exp": "Before with no specific time = experience up to now, so use present perfect: have seen.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["three small French windows", "French three small windows", "small French three windows", "three French small windows"], "ci": 0, "exp": "Correct order: number (three) → size (small) → origin (French) → noun\n✔ three small French windows", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "I _____ never tried sushi before, but I want to someday.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. This is a life experience that continues up to now. Present perfect (have + past participle) is used for experiences with no specific past time.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "The happy dog runs quickly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADJECTIVES in this sentence, and only the adjectives?</span>", "opts": ["happy", "happy, dog", "happy, quickly", "(none of these)"], "ci": 0, "exp": "'Happy' is an adjective - it describes the dog.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>man</b>?", "opts": ["mans", "men", "manes", "mense"], "ci": 1, "exp": "man → men (vowel changes: a → e)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>cut</b>?", "opts": ["cut", "cutted", "cuted", "cutt"], "ci": 0, "exp": "The past tense of <b>cut</b> is <b>cut</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>King Sejong <b>invented</b> Hangeul.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>Hangeul ______ by King Sejong.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was invented", "were invented", "was inventing", "was invent"], "ci": 0, "exp": "The new subject \"Hangeul\" is singular and the action is in the past, so use was + the past participle \"invented\": was invented.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>put</b>?", "opts": ["put", "putted", "puted", "putt"], "ci": 0, "exp": "The past tense of <b>put</b> is <b>put</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The box of chocolates were left on the counter.", "Neither the cat nor the dogs eats from the same bowl.", "The crowd of fans cheer loudly after every goal.", "Both of the windows in the bedroom face the backyard."], "ci": 3, "exp": "\"Both\" is plural, so \"face\" is correct. \"Box\" is singular — use \"was,\" not \"were.\" With neither...nor, the verb matches the closer subject (\"dogs\" is plural) — use \"eat.\" \"Crowd\" is singular — use \"cheers.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">She has never seen such a beautiful sunset.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Never has she seen such a beautiful sunset.", "Never she has seen such a beautiful sunset.", "Never has she such a beautiful sunset seen.", "Has never she seen such a beautiful sunset."], "ci": 0, "exp": "\"Never\" is a negative adverb. When it starts a sentence, the subject and auxiliary must invert: \"Never + has + she + seen...\". The correct form is: Never has she seen such a beautiful sunset.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "The dog barked loudly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["The dog", "loudly", "barked", "dog"], "ci": 0, "exp": "See the correct answer highlighted above.", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "She <u>have</u> a big dog.", "opts": ["has", "haves", "have", "haved"], "ci": 0, "exp": "have → has (irregular; the only correct 3rd-person singular form)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "They made him a leader.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["him", "a leader"], "ci": 0, "exp": "\"Him\" is the object (who was affected). \"A leader\" is the objective complement (what he became).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "He <u>be</u> very happy today.", "opts": ["is", "bes", "be", "beis"], "ci": 0, "exp": "be → is (irregular; 'is' is the 3rd-person singular present form of 'be')", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
