var RAW_QUESTIONS = [{"q": "Solve for <i>a</i> and <i>b</i>: <table class=\"matrix-table\"><tbody><tr><td>2a</td><td>-1</td></tr><tr><td>3</td><td>b-4</td></tr></tbody></table> = <table class=\"matrix-table\"><tbody><tr><td>10</td><td>-1</td></tr><tr><td>3</td><td>6</td></tr></tbody></table>", "opts": ["a = 5, b = 10", "a = 10, b = 6", "a = 5, b = 6", "a = 10, b = 10"], "ci": 0, "exp": "Matching entries gives 2<i>a</i> = 10, so <i>a</i> = 5, and <i>b</i> &minus; 4 = 6, so <i>b</i> = 10. \"a = 10, b = 6\" uses the right-hand values directly without solving the equations. \"a = 5, b = 6\" solves for <i>a</i> correctly but treats <i>b</i> &minus; 4 = 6 as if it meant <i>b</i> = 6. \"a = 10, b = 10\" solves for <i>b</i> correctly but forgets to divide by 2 when solving 2<i>a</i> = 10."}, {"q": "Compute: 4<table class=\"matrix-table\"><tbody><tr><td>3</td><td>-2</td></tr><tr><td>5</td><td>0</td></tr></tbody></table> + <table class=\"matrix-table\"><tbody><tr><td>-6</td><td>7</td></tr><tr><td>-9</td><td>4</td></tr></tbody></table>", "opts": ["<table class=\"matrix-table\"><tbody><tr><td>6</td><td>-1</td></tr><tr><td>11</td><td>4</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>6</td><td>-1</td></tr><tr><td>-4</td><td>4</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>-12</td><td>20</td></tr><tr><td>-16</td><td>16</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>6</td><td>-1</td></tr><tr><td>11</td><td>-4</td></tr></tbody></table>"], "ci": 0, "exp": "First scale every entry of the first matrix by 4: <table class=\"matrix-table\"><tbody><tr><td>12</td><td>-8</td></tr><tr><td>20</td><td>0</td></tr></tbody></table>, then add the second matrix entry by entry to get <table class=\"matrix-table\"><tbody><tr><td>6</td><td>-1</td></tr><tr><td>11</td><td>4</td></tr></tbody></table>. The matrix with bottom row -4, 4 only scaled the top row by 4 and left the bottom row unscaled. The matrix with top row -12, 20 mistakenly added the two matrices first and then multiplied the sum by 4."}, {"q": "Add the matrices: <table class=\"matrix-table\"><tbody><tr><td>4</td><td>-2</td><td>7</td></tr><tr><td>0</td><td>5</td><td>-3</td></tr></tbody></table> + <table class=\"matrix-table\"><tbody><tr><td>-6</td><td>3</td><td>1</td></tr><tr><td>8</td><td>-4</td><td>2</td></tr></tbody></table>", "opts": ["<table class=\"matrix-table\"><tbody><tr><td>-2</td><td>1</td><td>8</td></tr><tr><td>8</td><td>1</td><td>-1</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>10</td><td>-5</td><td>6</td></tr><tr><td>-8</td><td>9</td><td>-5</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>-2</td><td>1</td><td>8</td></tr><tr><td>8</td><td>1</td><td>1</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>-2</td><td>1</td><td>8</td></tr><tr><td>8</td><td>-1</td><td>-1</td></tr></tbody></table>"], "ci": 0, "exp": "Add each pair of corresponding entries: 4+(-6)=-2, -2+3=1, 7+1=8, 0+8=8, 5+(-4)=1, -3+2=-1, giving <table class=\"matrix-table\"><tbody><tr><td>-2</td><td>1</td><td>8</td></tr><tr><td>8</td><td>1</td><td>-1</td></tr></tbody></table>. The matrix with top row 10, -5, 6 is the result of subtracting instead of adding. The other two options each have a single sign error in the bottom row."}, {"q": "Evaluate the determinant of <table class=\"matrix-table\"><tbody><tr><td>6</td><td>-3</td></tr><tr><td>2</td><td>4</td></tr></tbody></table>", "opts": ["30", "18", "24", "6"], "ci": 0, "exp": "For <table class=\"matrix-table\"><tbody><tr><td>a</td><td>b</td></tr><tr><td>c</td><td>d</td></tr></tbody></table>, the determinant is <i>ad</i> &minus; <i>bc</i>. Here that's (6)(4) &minus; (-3)(2) = 24 &minus; (-6) = 30. \"18\" comes from adding the two products instead of subtracting (24 + (-6)). \"24\" and \"6\" each use only one of the two products."}, {"q": "Evaluate the determinant of <table class=\"matrix-table\"><tbody><tr><td>2</td><td>0</td><td>-1</td></tr><tr><td>3</td><td>1</td><td>4</td></tr><tr><td>-2</td><td>5</td><td>1</td></tr></tbody></table>", "opts": ["-55", "-19", "55", "-11"], "ci": 0, "exp": "Expanding along the top row: 2[(1)(1)-(4)(5)] - 0[(3)(1)-(4)(-2)] + (-1)[(3)(5)-(1)(-2)] = 2(-19) - 0(11) + (-1)(17) = -38 - 0 - 17 = -55. \"55\" has the correct magnitude but the wrong sign. \"-19\" is only the value of the first cofactor, not the full expansion. \"-11\" comes from a sign error inside one of the 2&times;2 cofactor determinants."}, {"q": "Find the inverse of <table class=\"matrix-table\"><tbody><tr><td>4</td><td>7</td></tr><tr><td>1</td><td>2</td></tr></tbody></table>", "opts": ["<table class=\"matrix-table\"><tbody><tr><td>2</td><td>-7</td></tr><tr><td>-1</td><td>4</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>4</td><td>-7</td></tr><tr><td>-1</td><td>2</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>2</td><td>7</td></tr><tr><td>1</td><td>4</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>-2</td><td>7</td></tr><tr><td>1</td><td>-4</td></tr></tbody></table>"], "ci": 0, "exp": "The determinant is (4)(2) &minus; (7)(1) = 1. For <table class=\"matrix-table\"><tbody><tr><td>a</td><td>b</td></tr><tr><td>c</td><td>d</td></tr></tbody></table>, the inverse is (1/det)&middot;<table class=\"matrix-table\"><tbody><tr><td>d</td><td>-b</td></tr><tr><td>-c</td><td>a</td></tr></tbody></table>, which swaps the diagonal entries and negates the off-diagonal entries, giving <table class=\"matrix-table\"><tbody><tr><td>2</td><td>-7</td></tr><tr><td>-1</td><td>4</td></tr></tbody></table>. The matrix starting with 4, -7 forgot to swap the diagonal entries. The matrix starting with 2, 7 forgot to negate the off-diagonal entries."}, {"q": "What are the values of <i>x</i> and <i>y</i> in this system?<br><br>4<i>x</i> + <i>y</i> = 11<br>2<i>x</i> &minus; 3<i>y</i> = &minus;5", "opts": ["x = 2, y = 3", "x = 3, y = 2", "x = 2, y = -3", "x = -2, y = 3"], "ci": 0, "exp": "From the first equation, <i>y</i> = 11 &minus; 4<i>x</i>. Substituting into the second: 2<i>x</i> &minus; 3(11 &minus; 4<i>x</i>) = -5, which gives 14<i>x</i> = 28, so <i>x</i> = 2 and <i>y</i> = 11 &minus; 8 = 3. Check: 4(2)+3=11 and 2(2)-3(3)=-5, both true. \"x = 3, y = 2\" swaps the two values, which does not satisfy either equation. The other two options each have a sign error in <i>y</i> or <i>x</i>."}, {"q": "Subtract the matrices: <table class=\"matrix-table\"><tbody><tr><td>9</td><td>-3</td></tr><tr><td>6</td><td>1</td></tr></tbody></table> &minus; <table class=\"matrix-table\"><tbody><tr><td>-2</td><td>5</td></tr><tr><td>4</td><td>-8</td></tr></tbody></table>", "opts": ["<table class=\"matrix-table\"><tbody><tr><td>11</td><td>-8</td></tr><tr><td>2</td><td>9</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>7</td><td>2</td></tr><tr><td>10</td><td>-7</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>11</td><td>-8</td></tr><tr><td>2</td><td>-7</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>-11</td><td>8</td></tr><tr><td>-2</td><td>-9</td></tr></tbody></table>"], "ci": 0, "exp": "Subtract each pair of corresponding entries: 9-(-2)=11, -3-5=-8, 6-4=2, 1-(-8)=9, giving <table class=\"matrix-table\"><tbody><tr><td>11</td><td>-8</td></tr><tr><td>2</td><td>9</td></tr></tbody></table>. The matrix with top row 7, 2 is the result of adding instead of subtracting. The matrix with bottom row -2, -9 is the subtraction performed in the reverse order (second matrix minus first)."}, {"q": "Compute: 5<table class=\"matrix-table\"><tbody><tr><td>2</td><td>-1</td></tr><tr><td>3</td><td>4</td></tr></tbody></table> &minus; <table class=\"matrix-table\"><tbody><tr><td>7</td><td>-8</td></tr><tr><td>9</td><td>2</td></tr></tbody></table>", "opts": ["<table class=\"matrix-table\"><tbody><tr><td>3</td><td>3</td></tr><tr><td>6</td><td>18</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>3</td><td>3</td></tr><tr><td>-6</td><td>2</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>17</td><td>-13</td></tr><tr><td>24</td><td>22</td></tr></tbody></table>", "<table class=\"matrix-table\"><tbody><tr><td>3</td><td>-3</td></tr><tr><td>6</td><td>18</td></tr></tbody></table>"], "ci": 0, "exp": "First scale every entry of the first matrix by 5: <table class=\"matrix-table\"><tbody><tr><td>10</td><td>-5</td></tr><tr><td>15</td><td>20</td></tr></tbody></table>, then subtract the second matrix entry by entry to get <table class=\"matrix-table\"><tbody><tr><td>3</td><td>3</td></tr><tr><td>6</td><td>18</td></tr></tbody></table>. The matrix with bottom row -6, 2 only scaled the top row by 5 and left the bottom row unscaled. The matrix with top row 17, -13 mistakenly added the two matrices instead of subtracting."}, {"q": "Solve for <i>x</i> and <i>y</i>: <table class=\"matrix-table\"><tbody><tr><td>3x</td><td>5</td></tr><tr><td>y</td><td>-2</td></tr></tbody></table> &minus; <table class=\"matrix-table\"><tbody><tr><td>1</td><td>5</td></tr><tr><td>4</td><td>3</td></tr></tbody></table> = <table class=\"matrix-table\"><tbody><tr><td>11</td><td>0</td></tr><tr><td>6</td><td>-5</td></tr></tbody></table>", "opts": ["x = 4, y = 10", "x = 4, y = 2", "x = 12, y = 10", "x = 4, y = -2"], "ci": 0, "exp": "The top-left entries give 3<i>x</i> &minus; 1 = 11, so 3<i>x</i> = 12 and <i>x</i> = 4. The bottom-left entries give <i>y</i> &minus; 4 = 6, so <i>y</i> = 10. (The other entries, 5-5=0 and -2-3=-5, already match the right side and confirm the equation is consistent.) \"x = 4, y = 2\" solves for <i>x</i> correctly but mishandles <i>y</i> &minus; 4 = 6. \"x = 12, y = 10\" solves for <i>y</i> correctly but forgets to divide 3<i>x</i> = 12 by 3."}];

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};

function loadState() {
  try {
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) {
      state = s;
    } else {
      resetState();
    }
  } catch(e) {
    localStorage.removeItem(QUIZ_KEY);
    resetState();
  }
}
function resetState() {
  state = { cur: 0, answers: {}, shuffles: {}, showResults: false, timerTotalSec: null, timerStartedAt: null };
}
function saveState() {
  localStorage.setItem(QUIZ_KEY, JSON.stringify(state));
}

function getShuffle(i) {
  if (!state.shuffles[i]) {
    var a = [0, 1, 2, 3];
    for (var k = 3; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var t = a[k]; a[k] = a[j]; a[j] = t;
    }
    state.shuffles[i] = a;
  }
  return state.shuffles[i];
}
function getCSI(i) {
  return getShuffle(i).indexOf(qs[i].ci);
}

function loadAttempts() {
  return parseInt(localStorage.getItem(ATT_KEY) || '0', 10);
}
function renderAttempts(){
  document.getElementById('qzAttemptsCount').textContent = loadAttempts();
}

var timerInterval = null;
function formatTime(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function renderTimer() {
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if (!state.timerStartedAt) { setupEl.style.display = 'flex'; runningEl.style.display = 'none'; return; }
  setupEl.style.display = 'none'; runningEl.style.display = 'flex';
  var elapsed = (Date.now() - state.timerStartedAt) / 1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn', 'danger');
  if (remaining <= 0) { displayEl.textContent = "Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if (remaining <= state.timerTotalSec * 0.1) displayEl.classList.add('danger');
  else if (remaining <= state.timerTotalSec * 0.25) displayEl.classList.add('warn');
}
function startTimer() {
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if (!minutes || minutes <= 0) minutes = 20;
  state.timerTotalSec = Math.round(minutes * 60);
  state.timerStartedAt = Date.now();
  saveState();
  renderTimer();
  startTimerInterval();
}
function startTimerInterval() { stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
function resetTimerForRestart(){
  state.timerTotalSec = null;
  state.timerStartedAt = null;
  stopTimerInterval();
}

function updateNav() {
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans / qs.length * 100).toFixed(1) + '%';
  renderDots();
}
function toggleJump() {
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'none' || !p.style.display) {
    p.style.display = 'block'; b.innerHTML = 'Hide &#9652;'; renderDots();
  } else {
    p.style.display = 'none'; b.innerHTML = 'Jump &#9662;';
  }
}
function renderDots() {
  var p = document.getElementById('dot-panel');
  if (p.style.display !== 'block') return;
  var h = '';
  for (var i = 0; i < qs.length; i++) {
    var bg = state.answers[i] === undefined ? '#d7dde6'
           : (state.answers[i] === getCSI(i) ? '#185FA5' : '#E24B4A');
    h += '<span class="dot" style="background:' + bg + ';" onclick="goToQ(' + i + ')">' + (i + 1) + '</span>';
  }
  if (Object.keys(state.answers).length === qs.length) {
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i) {
  state.cur = i; state.showResults = false; saveState(); render();
  document.getElementById('dot-panel').style.display = 'none';
  document.getElementById('jump-btn').innerHTML = 'Jump &#9662;';
}

function showResults() {
  state.showResults = true;
  localStorage.setItem(ATT_KEY, loadAttempts() + 1);
  saveState(); render();
}

function render() {
  if (state.showResults) { renderResults(); renderAttempts(); renderTimer(); return; }
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  updateNav();

  var i = state.cur;
  var q = qs[i];
  var isLast = (i === qs.length - 1);

  document.getElementById('q-num').textContent = 'Question ' + (i + 1) + ' of ' + qs.length;

  var tagEl = document.getElementById('q-tag-label');
  if (q.tag) { tagEl.style.display='inline-block'; tagEl.textContent = q.tag; tagEl.style.background = q.tagColor || '#1D9E75'; } else { tagEl.style.display='none'; }

  var pb = document.getElementById('passage-box');
  if (q.passage) { pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; }

  var cb = document.getElementById('context-box');
  if (q.context) { cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.q;

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html = '';
  for (var s = 0; s < 4; s++) {
    var oi = sh[s];
    var cls = 'opt-btn';
    var dis = '';
    if (ans !== undefined) {
      dis = 'disabled';
      if (s === csi) cls += ' correct';
      else if (s === ans) cls += ' wrong';
    }
    html += '<button class="' + cls + '" ' + dis + ' onclick="pick(' + i + ',' + s + ')">' + q.opts[oi] + '</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if (ans !== undefined && ans !== csi) {
    eb.style.display = 'block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display = 'none';
  }

  document.getElementById('next-btn').textContent = isLast ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (i === 0);
  renderAttempts();
  renderTimer();
}

function renderResults() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  updateNav();

  var c = 0, w = 0, sk = 0;
  for (var i = 0; i < qs.length; i++) {
    if (state.answers[i] === undefined) sk++;
    else if (state.answers[i] === getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">' + c + '</span> correct &nbsp;' +
    '<span style="color:#E24B4A;font-weight:700;">' + w + '</span> wrong &nbsp;' +
    '<span style="color:#888;font-weight:700;">' + sk + '</span> skipped';

  var html = '';
  for (var i = 0; i < qs.length; i++) {
    var a = state.answers[i];
    var label, bg, tc;
    if (a === undefined)              { label = 'Skipped'; bg = '#d7dde6'; tc = '#555'; }
    else if (a === getCSI(i))         { label = 'Correct'; bg = '#E1F5EE'; tc = '#085041'; }
    else                              { label = 'Wrong';   bg = '#FCEBEB'; tc = '#501313'; }
    html += '<div class="results-card" onclick="goToQ(' + i + ')">' +
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q' + (i+1) + '</span>' +
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:' + bg + ';color:' + tc + ';">' + label + '</span>' +
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si) {
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = si;
  saveState(); render();
}
function go(dir) {
  if (dir === 1 && state.cur === qs.length - 1) { showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length - 1, state.cur + dir));
  saveState(); render();
}
function retryWrong() {
  var first = -1;
  for (var i = 0; i < qs.length; i++) {
    if (state.answers[i] !== undefined && state.answers[i] !== getCSI(i)) {
      if (first === -1) first = i;
      delete state.answers[i];
    }
  }
  resetTimerForRestart();
  if (first !== -1) {
    state.cur = first; state.showResults = false; saveState(); render();
  } else {
    saveState(); render();
  }
}
function copyRes() {
  var lines = [QUIZ_LABEL];
  for (var i = 0; i < qs.length; i++) {
    var a = state.answers[i];
    lines.push('Q' + (i + 1) + ': ' +
      (a === undefined ? 'Skipped' : a === getCSI(i) ? 'Correct' : 'Wrong'));
  }
  var txt = lines.join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).catch(function() { fallbackCopy(txt); });
  } else {
    fallbackCopy(txt);
  }
}
function fallbackCopy(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  resetState();
  resetTimerForRestart();
  saveState();
  closeFreshModal();
  render();
}

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;
window.copyRes = copyRes;
window.openFreshModalOriginal = openFreshModalOriginal;
window.openFreshModalRandom = openFreshModalRandom;
window.closeFreshModal = closeFreshModal;
window.confirmFresh = confirmFresh;
window.showResults = showResults;
window.startTimer = startTimer;

loadState(); saveState(); render(); renderTimer(); renderAttempts();
if (state.timerStartedAt) startTimerInterval();

})();
</script>
</body>
</html>
