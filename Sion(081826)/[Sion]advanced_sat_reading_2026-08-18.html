<script>
(function(){

var QUIZ_KEY = "quiz_sionadvsatreading_12_20260817_v1";
var ATT_KEY = "quiz_sionadvsatreading_20260817_att_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Sion] Advanced SAT Reading";
var TAG_COLORS = {"Command of Evidence \u2014 \"If True\"": "#185FA5", "Central Ideas and Details": "#1D9E75", "Command of Evidence \u2014 Textual Evidence": "#7D3C98", "Inferences": "#E67E22", "Cross-Text Connections": "#C0392B", "Transitions": "#2874A6"};
var TIMER_DEFAULT_MIN = 20;

var RAW_QUESTIONS = [{"tag": "Command of Evidence \u2014 \"If True\"", "box": "<svg viewBox=\"0 0 280 200\" width=\"100%\" style=\"max-width:280px;display:block;margin:8px auto;\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"30\" y1=\"160\" x2=\"260\" y2=\"160\" stroke=\"#888\" stroke-width=\"1.5\"/><rect x=\"60\" y=\"67.6\" width=\"70\" height=\"92.4\" fill=\"#185FA5\"/><rect x=\"170\" y=\"116.0\" width=\"70\" height=\"44.0\" fill=\"#1D9E75\"/><text x=\"95.0\" y=\"176\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\">Before</text><text x=\"205.0\" y=\"176\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\">After</text><text x=\"95.0\" y=\"61.6\" font-size=\"11\" fill=\"#185FA5\" text-anchor=\"middle\">11:42 PM</text><text x=\"205.0\" y=\"110.0\" font-size=\"11\" fill=\"#1D9E75\" text-anchor=\"middle\">11:20 PM</text><text x=\"140.0\" y=\"18\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\" font-weight=\"bold\">Average Bedtime, Long-Term Users</text></svg><br>A team of sleep researchers hypothesizes that a fitness tracker's new nightly \u201csleep score\u201d feature causes users to go to bed earlier, specifically by making poor sleep visible and motivating a change in behavior. Comparing six months of data before and after the feature launched, the researchers found that average bedtime among long-term users shifted from 11:42 PM to 11:20 PM, as shown above.", "stem": "Which finding, if true, would most seriously undermine the researchers' hypothesis that seeing the sleep score is the specific mechanism causing users to go to bed earlier?", "opts": ["Users who had the sleep-score feature disabled for the entire six months showed the same 22-minute earlier shift in bedtime.", "Users who checked their sleep score every morning reported feeling more informed about their sleep habits.", "The sleep score was calculated using data from a wrist-worn heart-rate sensor.", "Younger users were more likely to enable notifications for the sleep-score feature."], "ci": 0, "exp": "If bedtime shifted earlier by the same amount even for users who never saw the score, the score cannot be the mechanism causing the change, which directly undermines the hypothesis. Feeling more informed describes a plausible reaction to the feature but does not test whether removing the score removes the effect, so it does not actually attack the claimed causal mechanism. How the score is calculated and who enables notifications are details about the feature that do not bear on whether seeing the score is what drives the behavior change."}, {"tag": "Command of Evidence \u2014 \"If True\"", "box": "A workplace researcher hypothesizes that a company's shift to standing desks caused a rise in afternoon output specifically because standing reduces the post-lunch drowsiness behind the usual mid-afternoon productivity dip, rather than because the desk change happened to coincide with a new product launch that increased motivation. Output logs show afternoon productivity rose 12% after the desks were installed.", "stem": "Which finding, if true, would most strongly support the researcher's hypothesis that the standing desks, rather than the product launch, drove the productivity increase?", "opts": ["A separate team that received standing desks but was not involved in the product launch saw a comparable 12% rise in afternoon output.", "Employees said they enjoyed being able to adjust their desk height throughout the day.", "Standing desks were more expensive than the traditional desks they replaced.", "The product launch received positive press coverage in trade publications."], "ci": 0, "exp": "If a team with standing desks but no connection to the product launch still saw the same productivity rise, that isolates the desks themselves as the cause, directly supporting the hypothesis. Employees enjoying adjustable desks describes a reaction to the desks but does not test whether the desks specifically, versus the launch, drove the output increase. The desks' cost and the launch's press coverage are details unrelated to which factor actually caused the productivity change."}, {"tag": "Central Ideas and Details", "box": "It is not the tempest that undoes the mariner, but the false calm that precedes it; for in the tempest he is wary, every sense alert to peril, whereas in the calm he grows careless and stows his charts, and it is then, when vigilance is laid aside as needless, that the reef finds him unprepared.", "stem": "Which choice best states the central claim of the text?", "opts": ["Complacency during apparent safety, rather than danger itself, is what most often leads to disaster.", "Mariners are more skilled at navigating storms than calm waters.", "Tempests are less dangerous than commonly believed.", "Sailors should never let down their guard even during storms."], "ci": 0, "exp": "The passage's claim is that the calm before the storm, not the storm itself, undoes the mariner, because he lays aside vigilance when danger seems absent. It does not compare skill in storms versus calm waters, does not claim storms are less dangerous than believed, and its point is specifically about vigilance during calm, not about maintaining guard during storms themselves."}, {"tag": "Central Ideas and Details", "box": "Men speak much of Fortune's wheel, as though she alone raised up the great and cast down the mighty; but I have marked that those she casts down had commonly ceased, long before her turning, to tend the labor by which they first ascended, and so it is less her wheel that undoes them than their own neglect, dressed up as her cruelty.", "stem": "Which choice best describes the main idea of the text?", "opts": ["People often blame misfortune for downfalls that were actually caused by their own neglect.", "Fortune's wheel is a reliable predictor of who will succeed or fail.", "The great and powerful are treated unfairly by fate.", "Hard work guarantees permanent success regardless of circumstances."], "ci": 0, "exp": "The passage argues that people who fall were already neglecting the effort that raised them, and blame \u201cFortune\u201d rather than their own neglect \u2014 matching the first choice exactly. It does not claim Fortune's wheel reliably predicts outcomes, it argues against (not for) fate treating the powerful unfairly, and it never claims hard work guarantees permanent success, only that neglect explains the downfall."}, {"tag": "Command of Evidence \u2014 Textual Evidence", "box": "She had been taught, as all young women of her circle were taught, that to want visibly is a kind of vulgarity; and so she perfected the art of wanting in silence, arranging her face into an expression of contentment so practiced that even she, on certain evenings, half believed it.", "stem": "Which quotation from the text most strongly supports the idea that the woman's calm outward appearance concealed genuine, unfulfilled desire?", "opts": ["\u201cperfected the art of wanting in silence, arranging her face into an expression of contentment so practiced that even she, on certain evenings, half believed it\u201d", "\u201ctaught, as all young women of her circle were taught\u201d", "\u201cto want visibly is a kind of vulgarity\u201d", "\u201ca kind of vulgarity\u201d"], "ci": 0, "exp": "This quotation shows she continued to want, only silently, and that her contentment was a practiced performance she herself nearly believed, which is direct evidence of concealed, ongoing desire. The other quotations describe the social rule she was taught or a fragment of it, not evidence of her private feelings."}, {"tag": "Command of Evidence \u2014 Textual Evidence", "box": "The old orchard had not been pruned in a decade, and its branches, grown wild and crossing one another, bore less fruit each year; yet the farmer would not cut a single limb, for his father had planted the trees, and to prune felt, to him, indistinguishable from forgetting.", "stem": "Which quotation from the text most strongly supports the idea that the farmer's neglect of the orchard was rooted in emotional attachment rather than practical judgment?", "opts": ["\u201cto prune felt, to him, indistinguishable from forgetting\u201d", "\u201cbore less fruit each year\u201d", "\u201chad not been pruned in a decade\u201d", "\u201cbranches, grown wild and crossing one another\u201d"], "ci": 0, "exp": "This quotation directly reveals his internal reasoning: pruning felt equivalent to forgetting his father, which is an emotional motivation, not a practical one. The other quotations describe the orchard's physical condition and its consequences, not the farmer's underlying reason for neglecting it."}, {"tag": "Inferences", "box": "A researcher tracked two groups of language learners: one studied new vocabulary using flashcards alone, and the other studied the same words embedded in short example sentences. On a surprise test one month later, the sentence group recalled significantly more words, even though both groups spent equal total study time and reported similarly high confidence during initial study sessions. Because the sentence group's advantage appeared only on the delayed test and not on a quiz given immediately after studying, the researcher concluded that ______.", "stem": "Which choice most logically completes the text?", "opts": ["embedding new words in sentences may strengthen long-term retention specifically, without necessarily improving how well the words are learned in the short term", "students should always study new information using full sentences instead of flashcards", "the sentence group recalled significantly more words on the test given one month later", "confidence during initial study is the best predictor of long-term recall"], "ci": 0, "exp": "Because the advantage showed up only on the delayed test and not the immediate one, the most logical conclusion is that the sentence method specifically strengthens long-term retention rather than short-term learning. The \u201calways use sentences\u201d choice overgeneralizes a single study into a universal study rule the passage cannot support. The \u201crecalled more words on the later test\u201d choice merely restates a fact already stated in the passage rather than drawing the further conclusion the blank asks for. Confidence during study is never shown to predict recall in the passage \u2014 it is only mentioned as similarly high in both groups."}, {"tag": "Inferences", "box": "A team studying call centers found that agents who took a scheduled five-minute break every hour resolved slightly fewer calls per hour than agents working without scheduled breaks, but customers of the break-taking agents rated their service satisfaction noticeably higher, and the break-taking agents were far less likely to quit within the following year. Because the difference emerged specifically in satisfaction and retention rather than in raw call volume, the researchers concluded that ______.", "stem": "Which choice most logically completes the text?", "opts": ["brief scheduled breaks may improve the quality of an agent's interactions and job endurance even when they do not increase, or slightly reduce, raw output", "all call centers should immediately adopt mandatory hourly breaks for every employee", "break-taking agents were far less likely to quit within the following year", "customers can always tell when an agent has recently taken a break"], "ci": 0, "exp": "The passage's specific pattern \u2014 lower call volume alongside higher satisfaction and retention \u2014 supports the conclusion that breaks affect interaction quality and endurance rather than raw output. The \u201cadopt mandatory breaks everywhere\u201d choice turns a single study into a sweeping policy recommendation the passage cannot support. The \u201cless likely to quit\u201d choice merely restates a finding already given rather than drawing the inference the blank calls for. Whether customers can consciously detect a recent break is never addressed by the passage's data on satisfaction ratings."}, {"tag": "Cross-Text Connections", "box": "Text 1: Advocates of four-day work weeks point to pilot programs in which companies moved employees to four eight-hour days without reducing pay, and observed steady or even increased output alongside notable drops in employee-reported burnout.<br><br>Text 2: Skeptics note that most four-day-week pilots have been voluntary and concentrated in white-collar, knowledge-based industries; it remains unclear whether similar output gains would hold in sectors like manufacturing or healthcare, where staffing a shorter week without reducing total service hours is far more logistically constrained.", "stem": "Which choice best describes how the author of Text 2 relates to the claim in Text 1?", "opts": ["Text 2 does not dispute Text 1's findings but limits how broadly those findings can be applied", "Text 2 completely rejects Text 1's claim that output can be maintained under a four-day week", "Text 2 fully endorses Text 1's claim and extends it to every industry", "Text 2 applies Text 1's reasoning to argue for a three-day work week"], "ci": 0, "exp": "Text 2 never disputes the pilot data itself; it narrows the scope of what that data can support by raising industry-specific staffing constraints, which is a scope limitation rather than a rejection. \u201cCompletely rejects\u201d overstates Text 2's actual, narrower objection. \u201cFully endorses...every industry\u201d is the opposite of Text 2's point, which specifically questions generalizing beyond the industries studied. A three-day work week is never mentioned in either text."}, {"tag": "Cross-Text Connections", "box": "Text 1: A team of urban ecologists found that installing green roofs across a city center measurably lowered local air temperatures during summer heat waves, and recommended wider adoption as a heat-mitigation strategy.<br><br>Text 2: A separate cost analysis of the same green-roof program found that installation and maintenance costs were, per building, roughly triple those of reflective white-roof coatings, which produced a smaller but still meaningful cooling effect at a fraction of the price.", "stem": "Which choice best describes how the author of Text 2 relates to the claim in Text 1?", "opts": ["Text 2 does not dispute Text 1's finding but complicates Text 1's recommendation by introducing a cost tradeoff", "Text 2 completely disputes Text 1's finding that green roofs lower temperatures", "Text 2 fully agrees with Text 1's recommendation without qualification", "Text 2 applies Text 1's cooling data to argue for banning white-roof coatings"], "ci": 0, "exp": "Text 2 accepts that green roofs cool the surrounding area \u2014 it simply shows a cheaper alternative achieves a smaller but meaningful effect \u2014 so it complicates rather than disputes Text 1's recommendation. \u201cCompletely disputes\u201d misstates Text 2 as denying the cooling effect itself. \u201cFully agrees without qualification\u201d ignores the cost tradeoff Text 2 raises. Text 2 actually favors white-roof coatings as the cost-effective option, so an argument to ban them runs backward from Text 2's actual position."}, {"tag": "Transitions", "box": "Critics predicted that requiring restaurants to post calorie counts on menus would backfire, driving customers toward the very high-calorie items being flagged, out of curiosity or defiance. ______, the restaurants that adopted calorie labeling saw average calories ordered per customer decline by 11% over the following year.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Contrary to that prediction", "Fittingly", "Granted", "Alternatively"], "ci": 0, "exp": "The actual outcome \u2014 calories ordered went down \u2014 directly contradicts the critics' prediction that labeling would backfire, so a transition explicitly marking that contradiction is required. \u201cFittingly\u201d would incorrectly suggest the outcome matched the prediction. \u201cGranted\u201d is used to concede a point before pivoting to a related but separate point, not to report a contradicting outcome. \u201cAlternatively\u201d introduces a different option or possibility rather than an actual result that contradicts what came before."}, {"tag": "Transitions", "box": "Proponents of the merger argued it would eliminate redundant overhead and lower prices for consumers within a year. ______, prices at the merged company's stores rose an average of 6% in the first year, as reduced competition allowed the larger firm to raise margins with little fear of losing customers to rivals.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["In practice, however", "Correspondingly", "Granted", "Fittingly"], "ci": 0, "exp": "The actual result \u2014 prices rose because of reduced competition \u2014 directly contradicts the proponents' prediction that prices would fall, so a transition marking both a real-world outcome and a contrast is needed. \u201cCorrespondingly\u201d would incorrectly suggest the result matched the prediction. \u201cGranted\u201d is used to concede a prior point before qualifying it, not to report a contradicting outcome. \u201cFittingly\u201d would incorrectly suggest the result was expected rather than contrary to what proponents argued."}];

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}
function R(idx,inner){var i=idx?'<span class="radical-index">'+idx+'</span>':'';return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>';}


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(tagEl){
    if(q.tag){
      tagEl.style.display='inline-block';
      tagEl.textContent = q.tag;
      tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
    } else {
      tagEl.style.display='none';
    }
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi && q.exp){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
