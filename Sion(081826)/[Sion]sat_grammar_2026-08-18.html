<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
html{margin:0 auto;}
.wrap{max-width:700px;margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.sub-hd{text-align:center;font-size:0.82rem;color:#555;margin-bottom:6px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
.q-tag{display:inline-block;background:#1D9E75;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.word-text{font-size:1.15rem;font-weight:800;color:#111;line-height:1.5;}

.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}

.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;white-space:pre-line;}
.box-ctx{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.9rem;color:#222;line-height:1.6;}

.prev-btn:disabled{opacity:0.5;cursor:default;}
.next-btn{background:#1D9E75;color:#fff;}

<script>
(function(){

var QUIZ_KEY = "quiz_sionsatgrammar_20_20260817_v1";
var ATT_KEY = "quiz_sionsatgrammar_20260817_att_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Sion] SAT Grammar - Results";
var TAG_COLORS = {"Subject-Verb Agreement": "#607d8b", "Pronoun Reference": "#0aa0a0", "Modifier Placement": "#7b61ff", "Parallel Structure": "#f5a623", "Punctuation": "#5d4037", "Verb Tense": "#1D9E75", "Transitions": "#8e44ad", "Apostrophes": "#E24B4A", "Concision": "#185FA5", "Pronoun-Antecedent Agreement": "#c2185b", "Pronoun Case": "#4527a0", "Diction": "#009688", "Faulty Comparison": "#3949ab", "Comma Splices": "#d84315", "Subjunctive Mood": "#6d4c41", "Idiomatic Preposition": "#00838f", "Number Agreement": "#ad1457", "Colon Usage": "#558b2f", "Redundancy": "#ef6c00", "Verb Form After Preposition": "#303f9f"};
var TIMER_DEFAULT_MIN = 20;

var RAW_QUESTIONS = [{"tag": "Subject-Verb Agreement", "box": "A collection of handwritten letters, donated last spring by a family whose ancestors corresponded regularly with the poet, _____ now the centerpiece of the museum's new exhibit.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "have been", "were"], "ci": 0, "exp": "The subject is the singular noun 'collection'; the phrase 'of handwritten letters' and the nonessential clause about the donating family are modifiers that do not change the subject's number, so the singular verb 'is' is correct. 'are', 'have been', and 'were' incorrectly treat the subject as plural."}, {"tag": "Pronoun Reference", "box": "When the translators revised the opening chapter after the editors had already approved the closing chapter, _____ struck early readers as inconsistent in tone.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the two chapters", "it", "the editors", "they"], "ci": 0, "exp": "'the two chapters' removes the ambiguity created by a pronoun that could grammatically point to the translators, the editors, or either chapter, and it matches the logical meaning that both chapters, taken together, struck readers as inconsistent. 'it' and 'the editors' point to the wrong noun or are unclear, and 'they' lacks a clear plural antecedent."}, {"tag": "Modifier Placement", "box": "Overshadowed for decades by a more famous rival institution across town, <span class=\"ul\">the founders finally saw their small college earn national recognition</span>.", "stem": "Which choice best revises the underlined portion to correct the dangling modifier?", "opts": ["the small college its founders had built finally earned national recognition", "the founders' small college finally earned, national recognition", "national recognition finally arrived for the founders of the small college itself", "the founders finally saw, their small college earning national recognition"], "ci": 0, "exp": "The opening modifier 'Overshadowed for decades by a more famous rival institution across town' logically describes the college, not the founders, so the noun immediately following the comma must refer to the college. Only 'the small college its founders had built finally earned national recognition' places the college right after the modifier in a complete, logical sentence. The other choices keep 'founders' as the modified noun, misplace a comma, or leave the sentence structurally incomplete."}, {"tag": "Parallel Structure", "box": "The grant requires applicants not only to document their research methods in detail but also _____.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["to disclose any potential conflicts of interest", "disclosing any potential conflicts of interest", "the disclosure of any potential conflicts of interest", "that potential conflicts of interest must be disclosed"], "ci": 0, "exp": "The correlative construction 'not only...but also' requires both halves to share the same grammatical form; 'to document' sets the infinitive pattern, so the second half must also be 'to' plus a base verb. Only 'to disclose any potential conflicts of interest' maintains that parallel structure. The other choices shift to a gerund, a noun phrase, or a subordinate clause."}, {"tag": "Punctuation", "box": "The observatory's oldest telescope, restored twice since its installation in 1911, remains in active use for undergraduate astronomy courses.", "stem": "Which choice best revises the sentence to correct a punctuation error?", "opts": ["No change is needed.", "telescope restored twice since its installation in 1911, remains", "telescope, restored twice since its installation in 1911 remains", "telescope, restored, twice since its installation in 1911, remains"], "ci": 0, "exp": "The nonessential phrase 'restored twice since its installation in 1911' is correctly set off by a pair of commas before the verb 'remains', so no change is needed. The other choices drop one comma, leave the phrase and verb unseparated, or insert an extra comma that breaks the phrase apart from its natural boundaries."}, {"tag": "Verb Tense", "box": "By the time the auditors finally reviewed the accounts, the firm's new director _____ most of the outdated procedures the previous management had left in place.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had already replaced", "already replaced", "has already replaced", "was already replacing"], "ci": 0, "exp": "The past perfect 'had already replaced' correctly shows that the replacing was finished before another past event, the auditors' review. 'already replaced' and 'was already replacing' fail to clearly establish that sequence, and 'has already replaced' incorrectly uses the present perfect in a narrative set entirely in the past."}, {"tag": "Transitions", "box": "The committee's new proposal addressed nearly every concern raised at the public forum, including funding sources and construction timelines. _____, several residents remained unconvinced that the project would actually reduce traffic congestion.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Even so", "As a result", "In the same way", "Specifically"], "ci": 0, "exp": "'Even so' correctly signals the contrast between the proposal's thoroughness and the residents' continuing doubts. 'As a result' would incorrectly suggest the doubts followed logically from the thorough proposal, 'In the same way' implies similarity rather than contrast, and 'Specifically' would incorrectly suggest the doubts are an example illustrating the proposal's thoroughness."}, {"tag": "Apostrophes", "box": "Each of the three research teams submitted _____ findings a week before the conference, though only one team's data was ultimately published.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["its", "their", "it's", "its'"], "ci": 0, "exp": "'Each' functions as a singular subject referring to one team at a time, so the singular possessive pronoun 'its' is required. 'their' incorrectly treats the antecedent as plural, 'it's' is a contraction of 'it is', and 'its'' is not a standard possessive form."}, {"tag": "Concision", "box": "<span class=\"ul\">Due to the fact that there was a shortage of</span> qualified inspectors, the agency postponed the scheduled audit.", "stem": "Which choice most effectively revises the underlined portion while keeping the sentence's meaning?", "opts": ["Because of a shortage of", "In light of the circumstance that there was a shortage of", "Owing to the fact that there existed a shortage of", "On account of the fact of a shortage of"], "ci": 0, "exp": "'Because of a shortage of' conveys the same causal relationship as the wordy original phrase in far fewer words. The other choices are all needlessly wordy substitutes that add no meaning beyond what 'Because of a shortage of' already conveys."}, {"tag": "Pronoun-Antecedent Agreement", "box": "Neither the lead engineer nor her two assistants had submitted _____ final report before the funding deadline passed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["their", "her", "its", "her or their"], "ci": 0, "exp": "In a 'neither...nor' construction, the pronoun agrees with the noun closer to it, which here is the plural 'assistants', so the plural possessive 'their' is correct. 'her' and 'her or their' incorrectly treat the closer noun as singular, and 'its' is used for non-personal antecedents."}, {"tag": "Pronoun Case", "box": "The scholarship committee ultimately favored an applicant with considerably less field experience than _____, a decision that puzzled several faculty members.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["he", "him", "himself", "his"], "ci": 0, "exp": "The comparison implies the omitted clause 'than he had field experience', so the pronoun functions as the subject of that understood clause and must take the subjective case 'he'. 'him' is the objective case, 'himself' is a reflexive pronoun with no clear role here, and 'his' is a possessive pronoun that does not fit the comparison."}, {"tag": "Diction", "box": "The new zoning ordinance is expected to _____ small businesses more than large corporations, since compliance costs fall disproportionately on operations with fewer resources.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["affect", "effect", "affects", "affected"], "ci": 0, "exp": "'affect' functions here as a verb meaning 'to influence', which fits the context of the ordinance influencing small businesses, and the base form is required after 'to'. 'effect' is ordinarily a noun meaning 'a result' or a verb meaning 'to bring about', neither of which fits this context, and 'affects' and 'affected' do not use the base form required after the infinitive marker 'to'."}, {"tag": "Faulty Comparison", "box": "The migration patterns of the coastal population differ sharply from _____.", "stem": "Which choice completes the text with a logically and grammatically correct comparison?", "opts": ["those of the inland population", "the inland population", "the inland population's migration", "how the inland population migrates differently"], "ci": 0, "exp": "Because the sentence compares 'the migration patterns of the coastal population' to something, the comparison must be to other migration patterns, not to an entire population; 'those of the inland population' stands in for 'the migration patterns of the inland population' and completes the comparison logically. 'the inland population' illogically compares patterns to a population, 'the inland population's migration' awkwardly shifts the comparison's structure, and 'how the inland population migrates differently' cannot grammatically follow 'differ sharply from'."}, {"tag": "Comma Splices", "box": "The initial survey results seemed promising, the follow-up study told a very different story.", "stem": "Which choice best revises the sentence to correct a punctuation error?", "opts": ["promising; the follow-up study told", "promising, and, the follow-up study told", "promising the follow-up study told", "promising; and the follow-up study told"], "ci": 0, "exp": "Two independent clauses with no coordinating conjunction between them require a semicolon rather than a comma, so 'promising; the follow-up study told' correctly separates them. The other choices insert an unnecessary comma before 'and', remove all punctuation and create a run-on, or pair a semicolon with a coordinating conjunction, which is redundant."}, {"tag": "Subjunctive Mood", "box": "If the museum's board _____ more transparent about its acquisition budget, the controversy over the disputed sculpture might never have arisen.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had been", "was", "were", "would be"], "ci": 0, "exp": "This sentence describes a hypothetical past condition contrary to fact, which requires the past perfect 'had been' paired with 'might never have arisen'. 'was' and 'were' do not form the correct past hypothetical construction here, and 'would be' incorrectly shifts the conditional into the present or future."}, {"tag": "Idiomatic Preposition", "box": "The committee's final recommendation was strikingly different _____ the draft proposal it had circulated only a month earlier.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["from", "than", "of", "to"], "ci": 0, "exp": "Standard written English idiom pairs 'different' with 'from' when introducing the thing being compared. 'than' is commonly used in speech but is considered nonstandard here, and 'of' and 'to' are not idiomatic with 'different' in this construction."}, {"tag": "Number Agreement", "box": "Despite renovations, the annex still has _____ study rooms than the main library building, which frustrates students during exam season.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["fewer", "less", "lesser", "a fewer amount of"], "ci": 0, "exp": "'study rooms' is a countable plural noun, and countable nouns require 'fewer' rather than 'less'. 'less' and 'lesser' are used for uncountable quantities or degree, and 'a fewer amount of' incorrectly combines 'fewer' with the uncountable-quantity phrase 'amount of'."}, {"tag": "Colon Usage", "box": "The archaeologists reached a single, unavoidable conclusion _____ the settlement had been abandoned suddenly, not gradually.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": [": ", ", ", "; ", " and "], "ci": 0, "exp": "A colon may follow a complete independent clause to introduce an explanation or elaboration, and 'The archaeologists reached a single, unavoidable conclusion' is a complete clause introducing exactly what that conclusion was. A comma is too weak to introduce this kind of explanation, a semicolon must join two independent clauses but what follows is not independent, and 'and' would illogically present the explanation as a separate, coordinate idea rather than a restatement."}, {"tag": "Redundancy", "box": "The new policy will <span class=\"ul\">completely eliminate entirely</span> the backlog of unprocessed applications by the end of the fiscal year.", "stem": "Which choice most effectively revises the underlined portion while keeping the sentence's meaning?", "opts": ["eliminate", "completely eliminate", "eliminate entirely and completely", "fully eliminate entirely"], "ci": 0, "exp": "'eliminate' already means to remove something completely, so pairing it with 'completely' or 'entirely' is redundant. The other choices all retain at least one unnecessary intensifier that repeats a meaning already built into 'eliminate'."}, {"tag": "Verb Form After Preposition", "box": "The technicians were responsible for _____ the equipment before every shift, a requirement that some new hires initially overlooked.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["calibrating", "calibrate", "to calibrate", "having calibrated"], "ci": 0, "exp": "The preposition 'for' must be followed by a gerund, not a base verb or infinitive, so 'calibrating' is correct. 'calibrate' and 'to calibrate' cannot directly follow a preposition, and 'having calibrated' illogically suggests the calibrating was already complete before the shift began, which contradicts the sentence's meaning."}];

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}
function R(idx,inner){var i=idx?'<span class="radical-index">'+idx+'</span>':'';return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>';}


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(tagEl){
    if(q.tag){
      tagEl.style.display='inline-block';
      tagEl.textContent = q.tag;
      tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
    } else {
      tagEl.style.display='none';
    }
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi && q.exp){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
