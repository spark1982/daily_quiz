<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Trigonometry Formula Mastery Quiz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #111111;
  }
  #timerBar {
    position: sticky; top: 0; z-index: 50;
    background: #f5f7fa;
    border-bottom: 1px solid #d7dde6;
    padding: 8px 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }
  #timerSetup { display: flex; align-items: center; gap: 8px; }
  #timerSetup input {
    width: 60px; padding: 6px; border-radius: 8px; border: 1px solid #d7dde6; font-size: 0.9rem;
  }
  .tbtn {
    border: none; border-radius: 8px; padding: 7px 14px; font-size: 0.85rem; font-weight: 600;
    cursor: pointer; color: #ffffff;
  }
  .tbtn-start { background: #1D9E75; }
  .tbtn-pause { background: #f5a623; }
  .tbtn-reset { background: #e2e8f0; color: #333333; }
  #timerRunning { display: none; align-items: center; gap: 10px; }
  #timeLeftDisplay {
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 1.05rem; font-weight: 700; color: #1D9E75; min-width: 60px; text-align: center;
  }
  .timeOrange { color: #f5a623 !important; }
  .timeRed { color: #E24B4A !important; }

  #appWrap { max-width: 720px; margin: 0 auto; padding: 14px 14px 40px; }
  h1.title {
    color: #1D9E75; text-align: center; font-size: 1.4rem; margin: 10px 0 2px;
  }
  #att-display {
    text-align: center; color: #555555; font-size: 0.85rem; margin-bottom: 10px;
  }
  .instruction {
    text-align: center; font-size: 0.88rem; color: #555555; background: #ffffff;
    margin-bottom: 12px; line-height: 1.4;
  }

  #navBar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: nowrap;
  }
  #qCount { font-size: 0.85rem; color: #333333; white-space: nowrap; }
  #progTrack {
    flex: 1; height: 8px; background: #d7dde6; border-radius: 6px; overflow: hidden;
  }
  #progFill { height: 100%; width: 0%; background: #1D9E75; transition: width 0.2s; }
  #jumpToggle {
    border: 1px solid #1D9E75; color: #1D9E75; background: #ffffff; border-radius: 8px;
    padding: 6px 10px; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
  }

  #dotPanel {
    display: none; max-height: 170px; overflow-y: auto; background: #f5f7fa;
    border-radius: 10px; padding: 8px; margin-bottom: 14px;
  }
  #dotGrid { display: flex; flex-wrap: wrap; gap: 6px; }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 0.7rem; color: #ffffff; cursor: pointer; border: none;
    background: #d7dde6; color: #333333;
  }
  .dot.correct { background: #1D9E75; color: #ffffff; }
  .dot.wrong { background: #E24B4A; color: #ffffff; }
  .resultsPill {
    width: auto; border-radius: 14px; padding: 0 12px; height: 26px; background: #1D9E75;
    color: #ffffff; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  #quizArea { display: none; }
  .qBox {
    background: #ffffff; border: 1px solid #e8edf4; border-radius: 12px; padding: 22px 18px;
    margin-bottom: 16px; font-size: 1.08rem; line-height: 2.2; text-align: center;
  }
  .opt {
    display: block; width: 100%; text-align: left; background: #e8edf4; color: #111111;
    border: 2px solid transparent; border-radius: 10px; padding: 18px 16px; margin-bottom: 12px;
    font-size: 1rem; cursor: pointer; line-height: 2.1;
  }
  .opt .katex, .qBox .katex, .explBox .katex { padding: 4px 0; display: inline-block; }
  .opt .katex-display { margin: 0; }
  .opt.correct { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .opt.wrong { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
  .opt:disabled { cursor: default; }

  .explBox {
    display: none; background: #f5f7fa; border-left: 4px solid #1D9E75; border-radius: 8px;
    padding: 16px 18px; margin-top: 6px; font-size: 0.95rem; color: #222222; line-height: 2.0;
  }

  #bottom-nav {
    display: flex; justify-content: space-between; margin-top: 6px;
  }
  .navBtn {
    border: none; border-radius: 10px; padding: 12px 20px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; min-width: 90px;
  }
  #prevBtn { background: #e8edf4; color: #333333; }
  #prevBtn:disabled { opacity: 0.4; cursor: default; }
  #nextBtn { background: #1D9E75; color: #ffffff; }

  #resultsScreen { display: none; }
  #resultsScreen.show { display: block; }
  h2.resTitle { color: #1D9E75; text-align: center; font-size: 1.3rem; margin-bottom: 6px; }
  .scoreLine { text-align: center; font-size: 1rem; color: #333333; margin-bottom: 16px; }
  #summaryGrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px;
    margin-bottom: 20px;
  }
  .sumCard {
    background: #f5f7fa; border-radius: 8px; padding: 8px 4px; text-align: center;
    font-size: 0.72rem; cursor: pointer; border: 2px solid transparent;
  }
  .sumCard.correct { border-color: #1D9E75; background: #E1F5EE; }
  .sumCard.wrong { border-color: #E24B4A; background: #FCEBEB; }
  .sumCard.skipped { border-color: #d7dde6; }
  .resBtn {
    display: block; width: 100%; border: none; border-radius: 10px; padding: 13px;
    font-size: 0.98rem; font-weight: 600; color: #ffffff; margin-bottom: 10px; cursor: pointer;
  }
  #retryBtn { background: #1D9E75; }
  #copyBtn { background: #185FA5; }
  #freshBtn { background: #e8edf4; color: #333333; }

  #modalOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  #modalOverlay.show { display: flex; }
  #modalBox {
    background: #ffffff; border-radius: 14px; padding: 22px; max-width: 340px; width: 100%;
    text-align: center;
  }
  #modalBox p { font-size: 0.98rem; color: #222222; margin-bottom: 18px; }
  .modalBtns { display: flex; gap: 10px; }
  .modalBtn { flex: 1; border: none; border-radius: 10px; padding: 11px; font-weight: 600; cursor: pointer; color: #ffffff; }
  #modalConfirm { background: #E24B4A; }
  #modalCancel { background: #e8edf4; color: #333333; }

  /* KaTeX sizing tweaks for readability on tablets */
  .katex { font-size: 1.08em; }
</style>
</head>
<body>

<div id="timerBar">
  <div id="timerSetup">
    <label for="timerMinInput" style="color:#333;">Timer (min):</label>
    <input type="number" id="timerMinInput" value="20" min="1">
    <button class="tbtn tbtn-start" onclick="window.qzStartTimer()">Start Timer</button>
  </div>
  <div id="timerRunning">
    <span style="color:#333;">Time Left:</span>
    <span id="timeLeftDisplay">20:00</span>
    <button class="tbtn tbtn-pause" id="pauseBtn" onclick="window.qzPauseTimer()">Pause</button>
    <button class="tbtn tbtn-reset" onclick="window.qzTimerReset()">Reset</button>
  </div>
</div>

<div id="appWrap">
  <h1 class="title">Trigonometry Formula Mastery Quiz</h1>
  <div id="att-display">Formula Recall Practice</div>
  <div class="instruction">Study the formula fragment shown, then choose the exact matching piece. No hints are given.</div>

  <div id="navBar">
    <span id="qCount">1 / 114</span>
    <div id="progTrack"><div id="progFill"></div></div>
    <button id="jumpToggle" onclick="window.qzToggleJump()">Jump</button>
  </div>

  <div id="dotPanel">
    <div id="dotGrid"></div>
  </div>

  <div id="quizArea">
    <div class="qBox" id="qText"></div>
    <div id="optsWrap"></div>
    <div class="explBox" id="explBox"></div>
    <div id="bottom-nav">
      <button class="navBtn" id="prevBtn" onclick="window.qzPrev()">Prev</button>
      <button class="navBtn" id="nextBtn" onclick="window.qzNext()">Next</button>
    </div>
  </div>

  <div id="resultsScreen">
    <h2 class="resTitle">Results</h2>
    <div class="scoreLine" id="scoreLine"></div>
    <div id="summaryGrid"></div>
    <button class="resBtn" id="retryBtn" onclick="window.qzRetryWrong()">Retry Wrong Ones</button>
    <button class="resBtn" id="copyBtn" onclick="window.qzCopyResults()">Copy All Results</button>
    <button class="resBtn" id="freshBtn" onclick="window.qzStartFreshConfirm()">Start Fresh</button>
  </div>
</div>

<div id="modalOverlay">
  <div id="modalBox">
    <p>Are you sure you want to start fresh? All progress and attempt history will be permanently erased.</p>
    <div class="modalBtns">
      <button class="modalBtn" id="modalConfirm" onclick="window.qzStartFreshDo()">Start Fresh</button>
      <button class="modalBtn" id="modalCancel" onclick="window.qzModalCancel()">Cancel</button>
    </div>
  </div>
</div>

      s.answers.push(null);
      var perm = [0, 1, 2, 3];
      for (var j = perm.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var tmp = perm[j]; perm[j] = perm[k]; perm[k] = tmp;

      s.shuffles.push(perm);
    }
    return s;
  }

  function loadState() {

      var raw = localStorage.getItem(STORE_KEY);

      if (typeof parsed.cur !== "number" || parsed.cur < 0 || parsed.cur >= TOTAL) throw new Error("bad cur");
      if (!Array.isArray(parsed.answers) || parsed.answers.length !== TOTAL) throw new Error("bad answers");
      if (!Array.isArray(parsed.shuffles) || parsed.shuffles.length !== TOTAL) throw new Error("bad shuffles");
      for (var i = 0; i < TOTAL; i++) {
        if (!Array.isArray(parsed.shuffles[i]) || parsed.shuffles[i].length !== 4) throw new Error("bad perm");
      }
      if (typeof parsed.showResults !== "boolean") parsed.showResults = false;
      return parsed;
    } catch (e) {
      try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
      return freshState();
    }

    } catch (e) { return 0; }

      "Formula Recall Practice | Total Attempts: " + getAttempts();

    try {

        document.getElementById("quizArea").style.display = "none";
        document.getElementById("resultsScreen").classList.add("show");
        renderResults();
        return;
      } else {
        document.getElementById("resultsScreen").classList.remove("show");
        document.getElementById("quizArea").style.display = "block";
      }

      var i = state.cur;
      var q = QUESTIONS[i];
      document.getElementById("qCount").textContent = (i + 1) + " / " + TOTAL;
      document.getElementById("progFill").style.width = Math.round(((i + 1) / TOTAL) * 100) + "%";
      var qTextEl = document.getElementById("qText");

      var correctIdx = correctDisplayIndex(i);

      var wrap = document.getElementById("optsWrap");
      wrap.innerHTML = "";
      opts.forEach(function(optHtml, idx) {
        var btn = document.createElement("button");
        btn.className = "opt";

        if (chosen !== null) {
          if (idx === correctIdx) btn.className = "opt correct";
          else if (idx === chosen) btn.className = "opt wrong";
        }
        btn.onclick = function() { window.qzAnswer(idx); };

  function renderDots() {

    for (var i = 0; i < TOTAL; i++) {
      var d = document.createElement("button");
      d.className = "dot";
      var a = state.answers[i];
      if (a !== null) {
        var isCorrect = (a === correctDisplayIndex(i));
        d.className += isCorrect ? " correct" : " wrong";

      grid.appendChild(d);

      pill.className = "dot resultsPill";
      pill.textContent = "Results";
      pill.onclick = function() { window.qzGoResults(); };
      grid.appendChild(pill);
    }
  }

  function renderResults() {
    try {

      var rows = [];

        var a = state.answers[i];
        if (a === null) { skipped++; rows.push({ i: i, status: "skipped" }); continue; }
        var isCorrect = (a === correctDisplayIndex(i));
        if (isCorrect) correct++; else wrong++;
        rows.push({ i: i, status: isCorrect ? "correct" : "wrong" });
      }
      document.getElementById("scoreLine").textContent =
        "Correct: " + correct + " | Wrong: " + wrong + " | Skipped: " + skipped + " (out of " + TOTAL + ")";

      grid.innerHTML = "";
      rows.forEach(function(r) {
        var c = document.createElement("div");
        c.className = "sumCard " + r.status;

      document.getElementById("resultsScreen").innerHTML =

      console.error(err);

  window.qzAnswer = function(displayIdx) {
    if (state.answers[state.cur] !== null) return;
    state.answers[state.cur] = displayIdx;
    saveState();
    render();
  };

  window.qzNext = function() {
    if (state.cur === TOTAL - 1) { window.qzGoResults(); return; }
    state.cur++;
    saveState();
    render();
  };

  window.qzPrev = function() {
    if (state.cur === 0) return;
    state.cur--;
    saveState();
    render();
  };

  window.qzJump = function(idx) {
    state.cur = idx;

    render();
  };

  window.qzJumpFromResults = function(idx) {
    state.cur = idx;
    state.showResults = false;
    saveState();
    render();
  };

    saveState();
    bumpAttempts();

      var a = state.answers[i];

        if (firstWrong === -1) firstWrong = i;

    for (var i = 0; i < TOTAL; i++) {
      var a = state.answers[i];
      if (a === null) skipped++;
      else if (a === correctDisplayIndex(i)) correct++;

    }

      var ta = document.createElement("textarea");

      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = "Copied!";
        setTimeout(function() { btn.textContent = "Copy All Results"; }, 1500);

    if (timerState.remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add("timeRed");
    } else if (pct <= 0.10) {
      disp.classList.add("timeRed");
    } else if (pct <= 0.25) {
      disp.classList.add("timeOrange");
    }

    }

    document.getElementById("pauseBtn").textContent = timerState.paused ? "Resume" : "Pause";
    saveTimer();
  };

  window.qzTimerReset = function() {
    clearInterval(timerInterval);
    timerState.running = false;
    timerState.paused = false;
    document.getElementById("timerSetup").style.display = "flex";
    document.getElementById("timerRunning").style.display = "none";
    document.getElementById("pauseBtn").textContent = "Pause";
    var mins = parseInt(document.getElementById("timerMinInput").value, 10);
    if (isNaN(mins) || mins <= 0) mins = 20;
    timerState.totalSeconds = mins * 60;
    timerState.remaining = mins * 60;
    saveTimer();
  };

  function init() {
    state = loadState();
    saveState();
    renderAttDisplay();
    loadTimer();
    if (timerState.running && !timerState.paused && timerState.remaining > 0) {
      document.getElementById("timerSetup").style.display = "none";
      document.getElementById("timerRunning").style.display = "flex";
      document.getElementById("pauseBtn").textContent = "Pause";
      updateTimerDisplay();
      clearInterval(timerInterval);
      timerInterval = setInterval(tick, 1000);
    } else if (timerState.running && timerState.paused) {
      document.getElementById("timerSetup").style.display = "none";
      document.getElementById("timerRunning").style.display = "flex";
      document.getElementById("pauseBtn").textContent = "Resume";
      updateTimerDisplay();
    } else {
      updateTimerDisplay();
    }
    render();
  }

  window.addEventListener("load", init);
})();
</script>
</body>
</html>
