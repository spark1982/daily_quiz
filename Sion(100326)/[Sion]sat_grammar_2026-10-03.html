<script>
var TITLE = "[Sion] SAT Grammar";

var INSTRUCTION = "Read each text and choose the answer that best completes or revises it.";
var TODAY_STR = "20261003";
var RAW_QUESTIONS = [{"context": "The city expected its new bike-share program to be used mostly by tourists. ______ ridership data from the first year showed that more than 70 percent of trips were made by residents commuting to work.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["In addition,", "Likewise,", "However,", "For this reason,"], "ci": 2, "exp": "The data show a result different from what the city expected, so a contrasting transition such as &ldquo;However&rdquo; is logical.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; Honeybees communicate the location of food through the &ldquo;waggle dance.&rdquo;<br>&bull; The angle of the dance shows the direction of the food relative to the sun.<br>&bull; The length of the waggle shows the distance.<br>&bull; Austrian scientist Karl von Frisch decoded the dance and won a Nobel Prize in 1973.<br><br>The student wants to explain how the waggle dance communicates information to an audience unfamiliar with it.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The waggle dance, which earned a scientist a Nobel Prize, is performed by honeybees.", "Karl von Frisch, an Austrian scientist, won a Nobel Prize in 1973.", "In a honeybee&rsquo;s waggle dance, the angle of the dance indicates the direction of food relative to the sun, while the length of the waggle indicates its distance.", "Honeybees communicate through a behavior that Karl von Frisch decoded."], "ci": 2, "exp": "To explain how the dance communicates, the sentence must describe what the angle and the length of the waggle show. The other choices mention the dance or the scientist but never explain how it works.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; The Underground Railroad was a network of secret routes and safe houses.<br>&bull; It helped enslaved people escape to free states and Canada in the 1800s.<br>&bull; Harriet Tubman made about 13 missions and guided roughly 70 people to freedom.<br>&bull; She never lost a single passenger.<br><br>The student wants to highlight Tubman&rsquo;s success as a guide.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Underground Railroad was a network of secret routes and safe houses used in the 1800s.", "Harriet Tubman was involved with the Underground Railroad, a network of secret routes.", "The Underground Railroad helped enslaved people escape to free states and Canada.", "Over about 13 missions on the Underground Railroad, Harriet Tubman guided roughly 70 people to freedom without ever losing a passenger."], "ci": 3, "exp": "Only this choice uses the specific details that show Tubman&rsquo;s success: the number of missions, the number of people she guided, and that she never lost a passenger.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "In 1932, aviator Amelia Earhart became the first woman to fly solo across the Atlantic ______ her flight from Newfoundland to Northern Ireland lasted nearly fifteen hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Ocean, and,", "Ocean,", "Ocean", "Ocean;"], "ci": 3, "exp": "Both parts of the sentence are independent clauses, so they must be joined by a semicolon (or a period). A comma alone creates a comma splice, no punctuation creates a run-on, and &ldquo;, and,&rdquo; adds an incorrect comma after the conjunction.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Chemist Percy Julian developed a way to produce cortisone, a medicine used to treat ______ from soybeans, a plant that was inexpensive and widely available.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["arthritis;", "arthritis,", "arthritis", "arthritis:"], "ci": 1, "exp": "&ldquo;A medicine used to treat arthritis&rdquo; is an appositive that describes cortisone; it opened with a comma, so it must close with a comma before &ldquo;from soybeans.&rdquo;", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Each of the paintings in the gallery&rsquo;s new collection ______ been restored by a team of conservators over the past three years.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["has", "have", "were", "are"], "ci": 0, "exp": "The subject is &ldquo;Each,&rdquo; which is singular, so it takes the singular verb &ldquo;has.&rdquo; The plural noun &ldquo;paintings&rdquo; is inside a prepositional phrase and is not the subject.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Monarch butterflies cannot survive freezing temperatures. ______ each fall, millions of them migrate up to 3,000 miles from Canada and the United States to forests in central Mexico.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nonetheless,", "In comparison,", "Consequently,", "Specifically,"], "ci": 2, "exp": "The migration happens because the butterflies cannot survive freezing temperatures, so a cause-and-effect transition like &ldquo;Consequently&rdquo; is logical.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "Early cartographers often filled the unexplored parts of their maps with drawings of sea monsters and imaginary islands. ______ by the eighteenth century, mapmakers increasingly left unknown regions blank, signaling a new commitment to recording only what had been observed.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["For instance,", "Similarly,", "As a result,", "By contrast,"], "ci": 3, "exp": "The sentence that follows the blank describes the opposite practice (leaving regions blank instead of filling them with imaginary things), so a contrasting transition is needed.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "Of the two proposals submitted to the school board, the plan to extend library hours was clearly the ______ expensive.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["lesser", "less", "least", "most less"], "ci": 1, "exp": "When comparing exactly two things, use the comparative form &ldquo;less,&rdquo; not the superlative &ldquo;least.&rdquo; &ldquo;Lesser&rdquo; is not used before &ldquo;expensive,&rdquo; and &ldquo;most less&rdquo; is not standard.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Ancient Egyptian builders moved limestone blocks weighing more than two tons; researchers believe the workers wet the sand in front of their sledges, which ______ the friction enough to make dragging possible.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["reducing", "reduced", "reduce", "have reduced"], "ci": 1, "exp": "The verb must be in the past tense to match &ldquo;moved&rdquo; and &ldquo;wet,&rdquo; and it must be a finite verb for the clause &ldquo;which ___ the friction.&rdquo; &ldquo;Reducing&rdquo; is not a finite verb, and &ldquo;reduce&rdquo; and &ldquo;have reduced&rdquo; do not fit the past time frame.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; The Atacama Desert in Chile is one of the driest places on Earth.<br>&bull; Some weather stations there have never recorded rain.<br>&bull; The Sahara Desert receives about 25 millimeters of rain per year.<br>&bull; The Atacama receives about 1 millimeter per year on average.<br><br>The student wants to compare the amount of rainfall in the two deserts.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Atacama Desert in Chile is one of the driest places on Earth.", "While the Sahara receives about 25 millimeters of rain each year, the Atacama averages only about 1 millimeter.", "Some weather stations in the Atacama Desert have never recorded any rain.", "The Sahara Desert receives about 25 millimeters of rain per year."], "ci": 1, "exp": "A comparison needs rainfall amounts for both deserts. Only this choice gives both figures and contrasts them.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "The findings from the twin Voyager spacecraft, which were launched in 1977, ______ astronomers to revise many long-held assumptions about the outer planets.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["have allowed", "has allowed", "allows", "was allowing"], "ci": 0, "exp": "The subject is the plural noun &ldquo;findings&rdquo;, and the context describes results continuing to the present, so &ldquo;have allowed&rdquo; is correct. The prepositional phrase and the clause about the spacecraft do not change the subject.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Many desert plants store water in thick, waxy ______ the saguaro cactus, for instance, can absorb up to 200 gallons during a single rainstorm.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["tissues;", "tissues", "tissues, so,", "tissues,"], "ci": 0, "exp": "The second part is an independent clause (with &ldquo;for instance&rdquo; set off by commas), so the two clauses must be separated by a semicolon. A comma alone creates a comma splice.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "The museum&rsquo;s new exhibit features three rarely seen ______ a 2,000-year-old Roman helmet, a Ming dynasty vase, and a Mayan jade mask.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["artifacts, which", "artifacts;", "artifacts:", "artifacts, such as:"], "ci": 2, "exp": "A colon correctly introduces a list after a complete independent clause. A semicolon must join two independent clauses, &ldquo;which&rdquo; creates an incomplete clause, and a colon should not follow &ldquo;such as.&rdquo;", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Octopuses have about 500 million neurons, a number comparable to that of dogs. ______ roughly two-thirds of those neurons are located not in the brain but in the arms, allowing each arm to respond to touch and taste with remarkable independence.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "Moreover,", "Therefore,", "Instead,"], "ci": 1, "exp": "The sentence that follows the blank adds a further surprising fact about the octopus&rsquo;s neurons; it does not contrast with, replace, or result from the first sentence. &ldquo;Moreover&rdquo; signals added information.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "Determined to prove that the Kon-Tiki voyage was possible, ______ across the Pacific Ocean on a balsa-wood raft in 1947.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Thor Heyerdahl&rsquo;s balsa raft carried five crew members 4,300 miles", "Thor Heyerdahl and five crew members sailed 4,300 miles", "a 4,300-mile journey was made by Thor Heyerdahl and five crew members", "the Pacific Ocean was crossed 4,300 miles by Thor Heyerdahl"], "ci": 1, "exp": "The introductory phrase &ldquo;Determined to prove&hellip;&rdquo; must describe the people who were determined, so the subject right after the comma must be &ldquo;Thor Heyerdahl and five crew members.&rdquo; A journey, an ocean, or a raft cannot be determined.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "The Great Barrier Reef, which stretches more than 2,300 kilometers along Australia&rsquo;s ______ is visible from low Earth orbit.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["coast&mdash;", "coast,", "coast", "coast;"], "ci": 1, "exp": "The nonessential clause &ldquo;which stretches &hellip; coast&rdquo; began with a comma, so it must close with a matching comma. A semicolon or dash would not match the opening comma, and no punctuation leaves the clause unclosed.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Biologist Rachel Carson&rsquo;s 1962 book <i>Silent Spring</i> documented the harmful effects of the pesticide ______ the book&rsquo;s publication helped lead to a nationwide ban on the chemical a decade later.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["DDT, and", "DDT", "DDT, and,", "DDT and,"], "ci": 0, "exp": "Two independent clauses joined by a coordinating conjunction need a comma before the conjunction: &ldquo;DDT, and the book&rsquo;s publication&hellip;&rdquo; The other options create a run-on or misplace commas.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "When the two rival bakeries finally agreed to share a supplier, ______ costs dropped by nearly 20 percent within six months.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["they&rsquo;re", "there", "its", "their"], "ci": 3, "exp": "The possessive &ldquo;their&rdquo; refers to the two bakeries (plural). &ldquo;They&rsquo;re&rdquo; means &ldquo;they are,&rdquo; &ldquo;there&rdquo; refers to a place, and &ldquo;its&rdquo; is singular.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; Mae Jemison was born in 1956 in Alabama.<br>&bull; She earned a medical degree from Cornell University.<br>&bull; In 1992, she flew aboard the space shuttle <i>Endeavour</i>.<br>&bull; She was the first African American woman to travel into space.<br><br>The student wants to emphasize Jemison&rsquo;s historic achievement.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["In 1992, Mae Jemison became the first African American woman to travel into space when she flew aboard the space shuttle <i>Endeavour</i>.", "Born in Alabama in 1956, Mae Jemison later attended Cornell University.", "Mae Jemison, who was born in 1956 in Alabama, earned a medical degree from Cornell University.", "Mae Jemison earned a medical degree before she flew aboard a space shuttle."], "ci": 0, "exp": "Only this choice states what made Jemison&rsquo;s achievement historic: she was the first African American woman in space. The other choices describe her background without emphasizing the achievement.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
