  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261003";
var RAW_QUESTIONS = [{"stem": "Sam, 16, wants to buy a $600 used laptop in 10 months. Which is the best example of a SMART financial goal?", "opts": ["&ldquo;I will save $60 from each monthly paycheck for 10 months to buy a $600 laptop.&rdquo;", "&ldquo;I will buy a laptop when I have enough money.&rdquo;", "&ldquo;I want to be rich someday.&rdquo;", "&ldquo;I will try to save some money soon.&rdquo;"], "ci": 0, "exp": "A SMART goal is specific, measurable, achievable, relevant, and time-bound. Saving $60 a month for 10 months clearly reaches $600 by a set date."}, {"stem": "A bank installs software that automatically flags unusually large or frequent cash transactions for review. How does this technology mainly help the bank?", "opts": ["It approves every loan application automatically", "It helps the bank detect possible money laundering and meet compliance requirements", "It increases the interest rate paid to customers", "It eliminates the need for bank employees"], "ci": 1, "exp": "Compliance technology monitors transactions for suspicious patterns so the bank can investigate and report them as required by anti-money-laundering laws."}, {"stem": "Green Valley Farms grows apples, and Crisp Co. buys the apples to turn them into packaged applesauce. Which type of business activity does Crisp Co. mainly perform?", "opts": ["Extracting natural resources", "Manufacturing (processing raw materials into finished goods)", "Retailing to final consumers", "Providing financial services"], "ci": 1, "exp": "Crisp Co. changes a raw material (apples) into a new product (applesauce), which is a manufacturing or processing activity. Green Valley Farms performs extraction or production of raw materials."}, {"stem": "Two regional banks merge into one larger bank, and the new bank also begins offering insurance and investment services. This is an example of what trend in the finance industry?", "opts": ["Consolidation and convergence of financial services", "Decentralization of banking", "Deregulation of the stock market", "Decline in the use of credit"], "ci": 0, "exp": "Consolidation happens when financial firms merge, and convergence happens when one firm offers banking, insurance, and investment services together."}, {"stem": "A customer slips on a freshly mopped floor at Hilltop Grocery because no warning sign was posted, and she breaks her wrist. Which type of tort is the customer most likely to claim?", "opts": ["Trademark infringement", "Negligence", "Breach of contract", "Defamation"], "ci": 1, "exp": "Negligence is a tort that occurs when a business fails to use reasonable care, such as not warning customers about a wet floor, and someone is injured as a result."}, {"stem": "An insurance agent realizes she could earn a larger commission by selling a client a policy that costs more than the client actually needs. What is the ethical action?", "opts": ["Recommend the policy that best fits the client&rsquo;s needs, even if the commission is smaller", "Sell the more expensive policy without explaining the difference", "Tell the client that only the expensive policy is available", "Ask the client to decide without any advice"], "ci": 0, "exp": "Ethics in risk management means putting the client&rsquo;s interests first and giving honest advice, which builds trust and reduces legal risk for the firm."}, {"stem": "A small bakery budgeted $1,200 for flour in March but actually spent $1,500. What is the variance, and what does it mean?", "opts": ["An unfavorable variance of $1,500, because all spending is a loss", "An unfavorable variance of $300, because actual spending was higher than planned", "A favorable variance of $300, because more flour was bought", "No variance, because flour is a necessary expense"], "ci": 1, "exp": "A budget variance is the difference between budgeted and actual amounts: $1,500 &minus; $1,200 = $300. Spending more than budgeted on an expense is unfavorable."}, {"stem": "A mid-sized accounting department replaces its paper ledgers with cloud-based accounting software that updates records in real time. What is the most likely benefit for managers?", "opts": ["They can ignore accounting standards", "They can access up-to-date financial information quickly to make decisions", "They no longer need any internal controls", "Their company will never be audited again"], "ci": 1, "exp": "Technology in financial-information management mainly improves the speed and accuracy of information. It does not remove the need for controls, audits, or accounting standards."}, {"stem": "A ski resort asks all customers to sign a waiver before renting equipment. Which legal purpose does the waiver mainly serve in the resort&rsquo;s risk management?", "opts": ["It guarantees that no customer will ever be injured", "It transfers ownership of the skis to the customer", "It limits the resort&rsquo;s liability for injuries from the normal risks of skiing", "It replaces the need for any insurance"], "ci": 2, "exp": "A waiver is a legal tool that reduces the business&rsquo;s liability for ordinary risks a customer knowingly accepts. It does not prevent injuries or replace insurance."}, {"stem": "Bluewater Outfitters shares one warehouse among its three product lines. The accountant divides the warehouse rent among the product lines based on how many square feet each one uses. What is the accountant doing?", "opts": ["Recording a direct cost for a single product", "Allocating an indirect cost using a reasonable cost driver", "Depreciating the warehouse building", "Calculating the company&rsquo;s net profit margin"], "ci": 1, "exp": "Rent for a shared space is an indirect cost. Cost allocation assigns such shared costs to departments or products using a cost driver, here square footage."}, {"stem": "Shareholders of Northfield Corp. want assurance that the company&rsquo;s financial statements are accurate. Which governance practice best provides this assurance?", "opts": ["Letting the CEO approve her own expense reports", "Hiring an independent external auditor to review the financial statements", "Keeping board meeting results secret", "Allowing managers to choose which numbers to report"], "ci": 1, "exp": "An independent external audit checks the accuracy of financial reports, which supports transparency, a key part of good corporate governance."}, {"stem": "A finance intern wants search results that contain the exact phrase <i>municipal bond default rates</i>, not pages that mention the words separately. What should she type?", "opts": ["municipal bond default rates (with no punctuation)", "&ldquo;municipal bond default rates&rdquo; (with quotation marks)", "municipal OR bond OR default OR rates", "&minus;municipal &minus;bond &minus;default &minus;rates"], "ci": 1, "exp": "Putting a phrase in quotation marks tells most search engines to return results containing those exact words in that order. OR broadens the search, and the minus sign removes words."}, {"stem": "Priya, 28, wants life insurance that will protect her young children for the next 20 years at the lowest possible premium. She does not need the policy to build cash value. Which type of policy best fits her needs?", "opts": ["Universal life insurance", "Whole life insurance with a savings component", "Term life insurance", "Variable life insurance invested in stock funds"], "ci": 2, "exp": "Term life insurance covers a set period, such as 20 years, and usually has the lowest premiums because it does not build cash value. Universal, whole, and variable life policies are permanent and cost more because they include a savings or investment feature."}, {"stem": "A software team finished its new mobile banking app two weeks early and under budget, but customers rated it poorly because key features were missing. How should the project be evaluated?", "opts": ["It cannot be evaluated until five years have passed", "It was fully successful, because it was early and under budget", "It was only partly successful, because it did not meet the quality and user goals", "It was successful, because the team worked hard"], "ci": 2, "exp": "Project success is measured against all objectives, including scope and quality, not just time and cost. Missing key features means the project fell short."}, {"stem": "After a presentation, Jordan&rsquo;s manager tells him that his slides were clear but that he spoke too quickly. What is the best way for Jordan to use this feedback?", "opts": ["Ignore the comment because the slides were good", "Stop volunteering to give presentations", "Argue that the audience understood him anyway", "Thank the manager and practice speaking more slowly before his next presentation"], "ci": 3, "exp": "Feedback supports personal growth when a person accepts it openly and turns it into a specific action plan, such as practicing a slower pace."}, {"stem": "Nadia works as an investment analyst and wants a professional credential that shows advanced knowledge of investment analysis and portfolio management. Which certification is most appropriate?", "opts": ["Project Management Professional (PMP)", "Certified Public Accountant (CPA) for tax preparation only", "Chartered Financial Analyst (CFA)", "Certified Information Systems Security Professional (CISSP)"], "ci": 2, "exp": "The CFA designation focuses on investment analysis and portfolio management. The other certifications focus on accounting, project management, or cybersecurity."}, {"stem": "A brokerage firm creates a department whose job is to make sure employees follow securities laws and the firm&rsquo;s own rules. What is this department called?", "opts": ["The facilities department", "The compliance department", "The product design department", "The marketing department"], "ci": 1, "exp": "Compliance ensures that a financial firm and its employees obey laws, regulations, and internal policies, which helps the firm avoid fines and protect customers."}, {"stem": "Elena is applying for her first car loan and wants to make sure there are no errors on her credit report. What should she do first?", "opts": ["Close all of her credit card accounts immediately", "Apply for several new credit cards at once", "Ask the car dealer to fix her credit score", "Request her free credit reports from the major credit bureaus and check them for mistakes"], "ci": 3, "exp": "Consumers can obtain free credit reports from the major credit bureaus and dispute any errors. Closing accounts or opening many new ones can actually lower a credit score."}, {"stem": "While a coworker is away from her desk, Tyler notices her open email and reads her messages about a medical appointment. How should Tyler&rsquo;s behavior be described?", "opts": ["A violation of his coworker&rsquo;s privacy", "Helpful, because he can now cover for her", "A normal part of teamwork", "Acceptable, because the email was already open"], "ci": 0, "exp": "Reading a coworker&rsquo;s personal messages without permission violates her privacy, even if the screen was left open."}, {"stem": "During a job interview at a regional bank, Marcus is asked, &ldquo;Tell me about a time you made a mistake at work.&rdquo; Which response is most effective?", "opts": ["Change the subject to his strongest skills", "Briefly describe a real mistake, explain what he did to fix it, and share what he learned", "Say that he has never made a mistake at work", "Blame a former coworker for the problem"], "ci": 1, "exp": "Interviewers ask this to see honesty and the ability to learn. A short, real example that shows responsibility and improvement makes the best impression."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
