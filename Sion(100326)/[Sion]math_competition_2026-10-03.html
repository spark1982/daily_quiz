<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>[Sion] Math Competition</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }
</style>
</head>

<div class="quiz-wrap">

      <span id="nav-count">0/0</span>

  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. Two problems are drawn from each of five chapters.";
var TODAY_STR = "20261003";
var RAW_QUESTIONS = [{"stem": "Suppose that a and <i>b</i> are integers such that <i>x</i><sup>2</sup> &minus; <i>x</i> &minus; 1 is a factor of <i>ax</i><sup>3</sup> + <i>bx</i><sup>2</sup> + 1. What is <i>b</i>? (AHSME)", "opts": ["-1", "1", "2", "-2"], "ci": 3, "exp": "Let &phi; be a root of <i>x</i><sup>2</sup>&minus;<i>x</i>&minus;1=0, so &phi;<sup>2</sup>=&phi;+1 and &phi;<sup>3</sup>=&phi;&middot;&phi;<sup>2</sup>=&phi;(&phi;+1)=2&phi;+1. Substituting into <i>a</i>&phi;<sup>3</sup>+<i>b</i>&phi;<sup>2</sup>+1=0 gives <i>a</i>(2&phi;+1)+<i>b</i>(&phi;+1)+1=0, or (2<i>a</i>+<i>b</i>)&phi;+(<i>a</i>+<i>b</i>+1)=0. Since &phi; is irrational, both coefficients must vanish: 2<i>a</i>+<i>b</i>=0 and <i>a</i>+<i>b</i>+1=0. Solving gives <i>a</i>=1 and <i>b</i>=&minus;2.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "The numbers in the sequence 1, 6, 15, 28, 45, &hellip; are called the hexagonal numbers.<div style=\"text-align:center;margin:14px 0;\"><svg style=\"max-width:460px;width:100%;\" viewBox=\"0 0 480 170\"><circle cx=\"60\" cy=\"85\" r=\"5\" fill=\"#111\"/><text x=\"60\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8321; = 1</text><polygon points=\"200,45 234.6,65 234.6,105 200,125 165.4,105 165.4,65\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"200\" cy=\"45\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"65\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"200\" cy=\"125\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"65\" r=\"4\" fill=\"#111\"/><text x=\"200\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8322; = 6</text><polygon points=\"380,30 427.6,57.5 427.6,112.5 380,140 332.4,112.5 332.4,57.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><polygon points=\"380,58 403.4,71.5 403.4,98.5 380,112 356.6,98.5 356.6,71.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"30\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"140\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><circle cx=\"380\" cy=\"85\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"30\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"140\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"58\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"380\" cy=\"112\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><text x=\"380\" y=\"158\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8323; = 15</text></svg></div>What is the 11<sup>th</sup> hexagonal number?", "opts": ["242", "210", "231", "225"], "ci": 2, "exp": "The nth hexagonal number is given by <i>H</i><sub><i>n</i></sub> = <i>n</i>(2<i>n</i>&minus;1). Checking: <i>H</i><sub>1</sub>=1, <i>H</i><sub>2</sub>=6, <i>H</i><sub>3</sub>=15, <i>H</i><sub>4</sub>=28, <i>H</i><sub>5</sub>=45, matching the given sequence. So <i>H</i><sub>11</sub> = 11(2&middot;11&minus;1) = 11&middot;21 = 231.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "The combined weight of two airline passengers' checked luggage is 105 kilograms. The airline's checked-luggage policy allows each passenger a maximum weight at no charge, and charges a constant, per-kilogram rate for any extra weight. One passenger pays $12.00 for the total extra weight of her luggage, and the other passenger pays $18.00 for the total extra weight of his luggage. If all of the luggage had belonged to one of the passengers, the over-weight charge would have been $78.00. How many kilograms of luggage is one person permitted without charge by the airline? (MathCounts)", "opts": ["40 kg", "45 kg", "25 kg", "30 kg"], "ci": 0, "exp": "The answer is 40 kg.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Of 101 coins, 50 are counterfeit, and differ from the genuine coins in weight by 1 gram. Dmitri has a balance scale which shows the difference in weights between the objects placed in each pan. He chooses one coin, and wants to find out in one weighing whether it is counterfeit or not. Can he do this? (Russia)", "opts": ["he cannot", "he can"], "ci": 1, "exp": "Dmitri places 50 coins on each side, keeping his chosen coin aside. If the chosen coin is genuine, the 50 counterfeits are distributed between the two pans; if counterfeit, 49 counterfeits are on one side. The difference in readings between these two cases reveals whether the coin is counterfeit.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "A computer system considers a string of decimal digits a valid codeword if it contains an even number of 0<i>s</i>. Find a closed form for <i>a</i><sub><i>n</i></sub>, the number of valid <i>n</i>-digit codewords.", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>"], "ci": 1, "exp": "Let <i>a</i><sub><i>n</i></sub> count <i>n</i>-digit strings (digits 0&ndash;9) with an even number of 0<i>s</i>, and let <i>b</i><sub><i>n</i></sub> count those with an odd number of 0<i>s</i>, so <i>a</i><sub><i>n</i></sub>+<i>b</i><sub><i>n</i></sub>=10<sup><i>n</i></sup>. Each string either starts with a nonzero digit (9 choices, keeping the parity of 0<i>s</i> the same as an (<i>n</i>&minus;1)-digit string) or a 0 (flipping the parity). This gives <i>a</i><sub><i>n</i></sub>&minus;<i>b</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup> (this can be seen by tracking the difference <i>d</i><sub><i>n</i></sub>=<i>a</i><sub><i>n</i></sub>&minus;<i>b</i><sub><i>n</i></sub>, which satisfies <i>d</i><sub><i>n</i></sub>=8&middot;<i>d</i><sub><i>n</i>&minus;1</sub> since 8 of the 10 digit choices preserve the sign of the difference and the other 2 choices for digit 0 cancel, starting from <i>d</i><sub>0</sub>=1, so <i>d</i><sub><i>n</i></sub>=8<sup><i>n</i></sup>). Solving <i>a</i><sub><i>n</i></sub>+<i>b</i><sub><i>n</i></sub>=10<sup><i>n</i></sup> and <i>a</i><sub><i>n</i></sub>&minus;<i>b</i><sub><i>n</i></sub>=8<sup><i>n</i></sup> together gives <i>a</i><sub><i>n</i></sub> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>)(8<sup><i>n</i></sup>+10<sup><i>n</i></sup>).", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "There are 100 soldiers in a detachment, and every evening three of them are on duty. Can it happen that after a certain period of time each soldier has shared duty with every other soldier exactly once? (Russia)", "opts": ["no", "yes"], "ci": 0, "exp": "Each soldier must share duty with 99 others, and each duty night creates 3 pairs. So the number of duty nights for one soldier is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>99</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, which is not an integer. Therefore it is impossible.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "Alice, Betty, and Carol took the same series of exams. For each exam there was one score of <i>x</i>, one score of <i>y</i>, and one score of <i>z</i>, where <i>x</i>, <i>y</i>, and <i>z</i> are distinct positive integers. The total of the scores obtained by each of the girls was: Alice 20, Betty 10, and Carol 9. If Betty placed first in the algebra exam, who placed second in the geometry exam?", "opts": ["Cannot be determined", "Alice", "Betty", "Carol"], "ci": 3, "exp": "The answer is Carol.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "What is the sum of all real values of <i>x</i> that are solutions to the equation <br>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span><i>x</i><sup>2</sup> &minus; <i>x</i> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)<sup>(<i>x</i><sup>2</sup>&minus;9<i>x</i>+20)</sup> = 1?", "opts": ["10", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>21</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "12", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>23</span><span style=\"border-top:1.4px solid #111;\">2</span></span>"], "ci": 3, "exp": "The expression equals 1 when the exponent is 0, the base is 1, or the base is &minus;1 with an even exponent. Solving each case and summing valid solutions gives <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>23</span><span style=\"border-top:1.4px solid #111;\">2</span></span>.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "If <i>P</i>(<i>x</i>) is a polynomial in <i>x</i>, and<br><br><i>x</i><sup>23</sup> + 23<i>x</i><sup>17</sup> &minus; 18<i>x</i><sup>16</sup> &minus; 24<i>x</i><sup>15</sup> + 108<i>x</i><sup>14</sup> = (<i>x</i><sup>4</sup> &minus; 3<i>x</i><sup>2</sup> &minus; 2<i>x</i> + 9) &middot; <i>P</i>(<i>x</i>)<br><br>for all values of <i>x</i>, compute the sum of the coefficients of <i>P</i>(<i>x</i>). (ARML)", "opts": ["450", "5", "18", "90"], "ci": 2, "exp": "The sum of the coefficients of <i>P</i>(<i>x</i>) equals <i>P</i>(1). Substituting <i>x</i>=1 into the identity: 1+23&minus;18&minus;24+108=90 on the left, and (1&minus;3&minus;2+9)&middot;<i>P</i>(1)=5&middot;<i>P</i>(1) on the right. So 5<i>P</i>(1)=90, giving <i>P</i>(1)=18.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "If <i>f</i>(<i>x</i>)+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>&middot;<i>f</i>(&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>) = 3, what is the value of <i>f</i>(2)? (MathCounts)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "3", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>"], "ci": 3, "exp": "Replace <i>x</i> with &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> to get a second equation. Solving the system: 2<i>f</i>(<i>x</i>)=3&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>, so <i>f</i>(2)=<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>=<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
