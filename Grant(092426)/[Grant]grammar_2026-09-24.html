<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20260924";
var RAW_QUESTIONS = [
 {
  "stem": "Which sentence correctly matches the verb with the subject?",
  "opts": [
   "The police is investigating the report that was filed last Tuesday.",
   "The police are investigating the report that was filed last Tuesday.",
   "The staff at every school works alone to support each individual student.",
   "The police was called to the scene after the fire alarm went off."
  ],
  "ci": 1,
  "exp": "\"The police\" is always plural in English, so \"are\" is correct. \"Is\" and \"was\" are singular — both wrong with \"the police.\" \"Staff\" here is used as a collective singular — \"works\" is acceptable, but \"the police\" rule is absolute and fixed.",
  "tag": "Subject-Verb Agreement",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Which sentence uses the possessive form CORRECTLY?",
  "opts": [
   "The volcano revealed it's lava flows.",
   "The senators speech drew a large crowd.",
   "The twins' birthday party was a huge success.",
   "Ours neighborhood is the safest in town."
  ],
  "ci": 2,
  "exp": "<strong>\"twins'\"</strong> correctly places the apostrophe after the plural noun.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>senators</em> is missing the apostrophe — should be <em>senator's</em>.<br>• <em>Ours</em> is a standalone pronoun; it cannot precede a noun. Use <em>our neighborhood</em>.",
  "tag": "Possessives",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Which sentence uses punctuation and capitalization correctly?",
  "opts": [
   "Emma who sits next to me in class is my best friend.",
   "Emma, who sits next to me in class, is my best friend.",
   "Emma who sits next to me in class, is my best friend.",
   "Emma, who sits next to me in class is my best friend."
  ],
  "ci": 1,
  "exp": "When a relative clause follows a specific name (like Emma), it provides extra information about an already-identified person. This makes it a nonessential clause, which must be set off with commas on both sides.",
  "tag": "Punctuation & Capitalization",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "The committee unanimously declared the young scientist the winner of the national award.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>",
  "opts": [
   "the winner of the national award",
   "the young scientist"
  ],
  "ci": 0,
  "exp": "\"The winner of the national award\" is the objective complement — it names the title assigned to \"the young scientist.\" \"The young scientist\" is the object.",
  "tag": "Objective Complement",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "He _____ eaten at that restaurant several times this month.",
  "opts": [
   "have",
   "had"
  ],
  "ci": 0,
  "exp": "\"Have\" (has) is correct. This month is still in progress.",
  "tag": "Have vs Had",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">I have never felt so proud of my work.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>",
  "opts": [
   "Never I have felt so proud of my work.",
   "Never did I feel so proud of my work.",
   "Never felt have I so proud of my work.",
   "Never have I felt so proud of my work."
  ],
  "ci": 3,
  "exp": "\"Never\" triggers inversion with present perfect: \"Never + have + I + felt...\". The past participle \"felt\" follows. The correct form is: Never have I felt so proud of my work.",
  "tag": "Inversion",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "The elderly professor quietly entered the crowded lecture hall and immediately began his fascinating presentation.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the NOUNS in this sentence, and only the nouns?</span>",
  "opts": [
   "professor, hall, presentation",
   "professor, presentation",
   "professor, hall, presentation, quietly",
   "hall, presentation"
  ],
  "ci": 0,
  "exp": "'Professor', 'hall', and 'presentation' are all nouns.",
  "tag": "Parts of Speech",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Despite the freezing temperatures outside, the hikers continued their journey toward the snow-covered mountain peak.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>",
  "opts": [
   "continued",
   "freezing",
   "covered",
   "reached"
  ],
  "ci": 0,
  "exp": "",
  "tag": "Subject & Verb Identification",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?",
  "opts": [
   "The pipe is <b>leaking</b> under the sink.",
   "The roof was <b>leaking</b> during the storm.",
   "<b>Leaking</b> information to reporters got him fired.",
   "The <b>leaking</b> pipe caused water damage in the basement."
  ],
  "ci": 3,
  "exp": "In \"The leaking pipe caused water damage in the basement,\" \"leaking\" comes directly before the noun \"pipe\" and describes what the pipe is doing - this adjective use of an -ing word is a present participle. In \"The pipe is leaking under the sink\" and \"The roof was leaking during the storm,\" \"leaking\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Leaking information to reporters got him fired,\" \"leaking\" (with \"information\") is the subject of the sentence, functioning as a noun, so it is a gerund.",
  "tag": "Present Participle",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "wise<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>",
  "opts": [
   "wiser / wisest",
   "wiseer / wiseest",
   "more wise / most wise",
   "wisere / wiseste"
  ],
  "ci": 0,
  "exp": "wise → wiser / wisest (silent -e: drop -e, add -er/-est)",
  "tag": "Comparative / Superlative",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "He is <u>tall</u>.",
  "opts": [
   "Object",
   "Complement"
  ],
  "ci": 1,
  "exp": "\"Tall\" follows the linking verb \"is\" and describes the subject. It is a subject complement.",
  "tag": "Object vs Complement",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "<div>Present: <b>look</b> &rsaquo; Past: <b>looked</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>",
  "opts": [
   "look",
   "looking",
   "lookd",
   "looked"
  ],
  "ci": 3,
  "exp": "'look' is a regular verb. Its past participle is 'looked' (base + -ed). Past perfect: had looked.",
  "tag": "Past Perfect",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Look at this beautiful structure! They <span style=\"text-decoration:underline;\">______</span> a new house recently.",
  "opts": [
   "had built",
   "have built",
   "will have built",
   "were building"
  ],
  "ci": 1,
  "exp": "\"have built\" is present perfect — the house was recently completed and we can see it now.",
  "tag": "Perfect Tense",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Which of the following is a COMPLETE sentence?",
  "opts": [
   "Since the bus was running late today.",
   "The twins celebrated their birthday together.",
   "Tripping over the loose rug in the hallway.",
   "A worn-out pair of old leather boots."
  ],
  "ci": 1,
  "exp": "\"The twins celebrated their birthday together.\" is a complete sentence — subject: 'The twins', predicate: 'celebrated'. The others are fragments: a 'Since' clause, an -ing phrase, and a noun phrase.",
  "tag": "Complete Sentences",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "What is the past tense of <b>spring</b>?",
  "opts": [
   "sprang",
   "springed",
   "sprung",
   "sprangen"
  ],
  "ci": 0,
  "exp": "The past tense of <b>spring</b> is <b>sprang</b>.",
  "tag": "Irregular Verbs (Past Tense)",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?",
  "opts": [
   "He is <b>cleaning</b> his room right now.",
   "They were <b>cleaning</b> the garage all day.",
   "She will be <b>cleaning</b> the kitchen after dinner.",
   "<b>Cleaning</b> the whole house took all weekend."
  ],
  "ci": 3,
  "exp": "In \"Cleaning the whole house took all weekend,\" \"cleaning\" is the subject of the sentence - a noun - which makes it a gerund. In the other three sentences, \"cleaning\" follows \"is / were / will be\" and describes an action in progress, so it is part of the progressive tense.",
  "tag": "Gerund vs Participle",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "He is <u>swim</u> in the ocean.",
  "opts": [
   "swimming",
   "swiming",
   "swimm",
   "swimmed"
  ],
  "ci": 0,
  "exp": "swim → swimming (short vowel + single consonant: double the -m, then add -ing)",
  "tag": "Present Progressive",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "He ________ sick since Monday.",
  "opts": [
   "was",
   "has been"
  ],
  "ci": 1,
  "exp": "Since Monday connects past to the present moment, so use present perfect: has been.",
  "tag": "Past vs Present Perfect",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "She gave me a book.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>",
  "opts": [
   "a book",
   "me"
  ],
  "ci": 0,
  "exp": "\"A book\" is the direct object (what was given). \"Me\" is the indirect object (who received it).",
  "tag": "Indirect / Direct Object",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "The hikers stopped to rest _____ the shade of a large tree before continuing up the mountain trail.",
  "opts": [
   "in",
   "under",
   "beside",
   "within"
  ],
  "ci": 0,
  "exp": "\"In the shade\" is a fixed English expression meaning within the shaded area. \"Under\" also works, but \"in the shade\" is the standard idiomatic phrase.",
  "tag": "Prepositions",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "She <u>apply</u> for a new job every week.",
  "opts": [
   "applies",
   "applys",
   "apples",
   "applyes"
  ],
  "ci": 0,
  "exp": "apply → applies (consonant + y: drop -y, add -ies)",
  "tag": "3rd Person Singular",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Which group of adjectives is in the correct order?",
  "opts": [
   "three small French windows",
   "French three small windows",
   "small French three windows",
   "three French small windows"
  ],
  "ci": 0,
  "exp": "Correct order: number (three) → size (small) → origin (French) → noun\n✔ three small French windows",
  "tag": "Adjective Order",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The company <b>hired</b> new workers.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>New workers ______ by the company.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>",
  "opts": [
   "was hired",
   "were hired",
   "were hiring",
   "were hire"
  ],
  "ci": 1,
  "exp": "The new subject \"new workers\" is plural and the action is in the past, so use were + the past participle \"hired\": were hired.",
  "tag": "Passive Voice",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "What is the plural of <b>wolf</b>?",
  "opts": [
   "wolfs",
   "wolfes",
   "wolvs",
   "wolves"
  ],
  "ci": 3,
  "exp": "wolf → wolves (-f changes to -ves)",
  "tag": "Irregular Plurals",
  "tagcolor": "#185FA5"
 }
];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); }
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(',')
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
