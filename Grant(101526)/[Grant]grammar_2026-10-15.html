var TITLE = "[Grant] Grammar";

var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261015";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "have come", "have coming", "has come"], "ci": 1, "exp": "After <i>have</i>, use the past participle. The past participle of <i>come</i> is <i>come</i>: <i>My parents <b>have come</b> to every one of my shows.</i> (<i>Has</i> goes with one person, not <i>parents</i>.)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>An Email to My Cousin</strong><br><i>Dear Ava,</i><br><b>(1)</b> Our class performed the play <i>Charlotte&rsquo;s Web</i> last night, and I played Wilbur the pig. <b>(2)</b> My parents <u>have came</u> to every one of my shows since kindergarten. <b>(3)</b> At the end, the audience <u>stood</u> up and clapped for a long time. <b>(4)</b> Grandma brought roses for Mia and <u>I</u>. <b>(5)</b> After the show ended we all went out for ice cream. <b>(6)</b> I wish you could have been there!<br><i>Love, Sam</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["will stand", "NO CHANGE", "stands", "is standing"], "ci": 1, "exp": "The play happened last night, so the past tense <i>stood</i> is already correct and matches <i>performed</i> and <i>clapped</i>.", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>An Email to My Cousin</strong><br><i>Dear Ava,</i><br><b>(1)</b> Our class performed the play <i>Charlotte&rsquo;s Web</i> last night, and I played Wilbur the pig. <b>(2)</b> My parents <u>have came</u> to every one of my shows since kindergarten. <b>(3)</b> At the end, the audience <u>stood</u> up and clapped for a long time. <b>(4)</b> Grandma brought roses for Mia and <u>I</u>. <b>(5)</b> After the show ended we all went out for ice cream. <b>(6)</b> I wish you could have been there!<br><i>Love, Sam</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["mine", "myself", "NO CHANGE", "me"], "ci": 3, "exp": "After a word like <i>for</i>, use <i>me</i>, not <i>I</i>. Test it by dropping Mia: <i>Grandma brought roses for <b>me</b>.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>An Email to My Cousin</strong><br><i>Dear Ava,</i><br><b>(1)</b> Our class performed the play <i>Charlotte&rsquo;s Web</i> last night, and I played Wilbur the pig. <b>(2)</b> My parents <u>have came</u> to every one of my shows since kindergarten. <b>(3)</b> At the end, the audience <u>stood</u> up and clapped for a long time. <b>(4)</b> Grandma brought roses for Mia and <u>I</u>. <b>(5)</b> After the show ended we all went out for ice cream. <b>(6)</b> I wish you could have been there!<br><i>Love, Sam</i>"}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["After the show ended, we all went out for ice cream.", "After the show ended we all went out, for ice cream.", "After the show, ended we all went out for ice cream.", "After, the show ended we all went out for ice cream."], "ci": 0, "exp": "Put a comma after an introductory part that starts with a word like <i>after</i>, <i>when</i>, or <i>because</i>: <i>After the show ended<b>,</b> we all went out for ice cream.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>An Email to My Cousin</strong><br><i>Dear Ava,</i><br><b>(1)</b> Our class performed the play <i>Charlotte&rsquo;s Web</i> last night, and I played Wilbur the pig. <b>(2)</b> My parents <u>have came</u> to every one of my shows since kindergarten. <b>(3)</b> At the end, the audience <u>stood</u> up and clapped for a long time. <b>(4)</b> Grandma brought roses for Mia and <u>I</u>. <b>(5)</b> After the show ended we all went out for ice cream. <b>(6)</b> I wish you could have been there!<br><i>Love, Sam</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["are weighing", "NO CHANGE", "have weighed", "weigh"], "ci": 1, "exp": "The subject is <i>bucket</i> (one bucket), not <i>sap</i>, so the singular verb <i>weighs</i> is already correct: <i>A bucket &hellip; <b>weighs</b> about twenty pounds.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>How Maple Syrup Is Made</strong><br><b>(1)</b> Maple syrup comes from the sap of sugar maple trees. <b>(2)</b> Each spring, farmers drill small holes into the trunks. <b>(3)</b> A bucket full of the clear sap <u>weighs</u> about twenty pounds. <b>(4)</b> The farmers pour the sap into a large pan. <b>(5)</b> The pan sits over a hot fire. <b>(6)</b> By the time the water boils away, forty gallons of sap <u>have became</u> just one gallon of syrup. <b>(7)</b> Pancakes topped with the warm syrup tastes delicious."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["have become", "NO CHANGE", "has become", "have becomed"], "ci": 0, "exp": "After <i>have</i>, use the past participle <i>become</i> (not <i>became</i>). The subject <i>forty gallons</i> is plural, so use <i>have</i>: <i>forty gallons of sap <b>have become</b> one gallon of syrup.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>How Maple Syrup Is Made</strong><br><b>(1)</b> Maple syrup comes from the sap of sugar maple trees. <b>(2)</b> Each spring, farmers drill small holes into the trunks. <b>(3)</b> A bucket full of the clear sap <u>weighs</u> about twenty pounds. <b>(4)</b> The farmers pour the sap into a large pan. <b>(5)</b> The pan sits over a hot fire. <b>(6)</b> By the time the water boils away, forty gallons of sap <u>have became</u> just one gallon of syrup. <b>(7)</b> Pancakes topped with the warm syrup tastes delicious."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["The farmers pour the sap into a large pan and sits over a hot fire.", "The farmers pour the sap into a large pan, who sits over a hot fire.", "The farmers pour the sap into a large pan that sits over a hot fire.", "The farmers pour the sap into a large pan, it sits over a hot fire."], "ci": 2, "exp": "Use <i>that</i> or <i>which</i> for things and <i>who</i> for people: <i>a large pan <b>that</b> sits over a hot fire.</i> Joining with only a comma makes a run-on, and &ldquo;and sits&rdquo; makes it sound like the farmers sit over the fire.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>How Maple Syrup Is Made</strong><br><b>(1)</b> Maple syrup comes from the sap of sugar maple trees. <b>(2)</b> Each spring, farmers drill small holes into the trunks. <b>(3)</b> A bucket full of the clear sap <u>weighs</u> about twenty pounds. <b>(4)</b> The farmers pour the sap into a large pan. <b>(5)</b> The pan sits over a hot fire. <b>(6)</b> By the time the water boils away, forty gallons of sap <u>have became</u> just one gallon of syrup. <b>(7)</b> Pancakes topped with the warm syrup tastes delicious."}, {"stem": "Which sentence contains an error?", "opts": ["The pan sits over a hot fire.", "Each spring, farmers drill small holes into the trunks.", "Maple syrup comes from the sap of sugar maple trees.", "Pancakes topped with the warm syrup tastes delicious."], "ci": 3, "exp": "The subject <i>Pancakes</i> is plural, so the verb must be <i>taste</i>: <i>Pancakes topped with the warm syrup <b>taste</b> delicious.</i> Do not match the verb to <i>syrup</i>, which is just part of the describing phrase.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>How Maple Syrup Is Made</strong><br><b>(1)</b> Maple syrup comes from the sap of sugar maple trees. <b>(2)</b> Each spring, farmers drill small holes into the trunks. <b>(3)</b> A bucket full of the clear sap <u>weighs</u> about twenty pounds. <b>(4)</b> The farmers pour the sap into a large pan. <b>(5)</b> The pan sits over a hot fire. <b>(6)</b> By the time the water boils away, forty gallons of sap <u>have became</u> just one gallon of syrup. <b>(7)</b> Pancakes topped with the warm syrup tastes delicious."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["will see", "have seen", "NO CHANGE", "saw"], "ci": 3, "exp": "The diary tells about something that already happened (<i>walked</i>), so keep the past tense: <i>When I walked into the gym, I <b>saw</b> twenty other kids.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>My Basketball Diary</strong><br><i>Dear Diary,</i><br><b>(1)</b> Today was the first day of basketball tryouts at the rec center. <b>(2)</b> When I walked into the gym, I <u>see</u> twenty other kids warming up. <b>(3)</b> Coach Dana said we <u>should</u> drink water between every drill. <b>(4)</b> Unfortunately, I <u>had forgot</u> my water bottle at home. <b>(5)</b> Luckily, my friend Leo shared his water with me. <b>(6)</b> Because he had brought two bottles. <b>(7)</b> I can&rsquo;t wait to find out who made the team!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["should to", "should of", "NO CHANGE", "shoulds"], "ci": 2, "exp": "<i>Should</i> is followed by the plain verb: <i>we <b>should</b> drink water.</i> &ldquo;Should of&rdquo; is a common mistake for <i>should have</i>.", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>My Basketball Diary</strong><br><i>Dear Diary,</i><br><b>(1)</b> Today was the first day of basketball tryouts at the rec center. <b>(2)</b> When I walked into the gym, I <u>see</u> twenty other kids warming up. <b>(3)</b> Coach Dana said we <u>should</u> drink water between every drill. <b>(4)</b> Unfortunately, I <u>had forgot</u> my water bottle at home. <b>(5)</b> Luckily, my friend Leo shared his water with me. <b>(6)</b> Because he had brought two bottles. <b>(7)</b> I can&rsquo;t wait to find out who made the team!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "had forgetted", "had forgotten", "have forgot"], "ci": 2, "exp": "After <i>had</i>, use the past participle. The past participle of <i>forget</i> is <i>forgotten</i>: <i>I <b>had forgotten</b> my water bottle at home.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>My Basketball Diary</strong><br><i>Dear Diary,</i><br><b>(1)</b> Today was the first day of basketball tryouts at the rec center. <b>(2)</b> When I walked into the gym, I <u>see</u> twenty other kids warming up. <b>(3)</b> Coach Dana said we <u>should</u> drink water between every drill. <b>(4)</b> Unfortunately, I <u>had forgot</u> my water bottle at home. <b>(5)</b> Luckily, my friend Leo shared his water with me. <b>(6)</b> Because he had brought two bottles. <b>(7)</b> I can&rsquo;t wait to find out who made the team!"}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Luckily, my friend Leo shared his water with me, he had brought two bottles.", "Luckily, my friend Leo shared his water with me because he had brought two bottles.", "Luckily, my friend Leo shared his water with me, because of he had brought two bottles.", "Luckily, my friend Leo shared his water with me. Because he had brought two bottles."], "ci": 1, "exp": "Sentence 6 is a fragment, because a part that starts with <i>because</i> cannot stand alone. Attach it to the sentence before: <i>&hellip;shared his water with me <b>because</b> he had brought two bottles.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>My Basketball Diary</strong><br><i>Dear Diary,</i><br><b>(1)</b> Today was the first day of basketball tryouts at the rec center. <b>(2)</b> When I walked into the gym, I <u>see</u> twenty other kids warming up. <b>(3)</b> Coach Dana said we <u>should</u> drink water between every drill. <b>(4)</b> Unfortunately, I <u>had forgot</u> my water bottle at home. <b>(5)</b> Luckily, my friend Leo shared his water with me. <b>(6)</b> Because he had brought two bottles. <b>(7)</b> I can&rsquo;t wait to find out who made the team!"}, {"s  every class at Maple Grove Elementary can join the Recycling Challenge. <b>(2)</b> Each class will collect cans, plastic bottles, and old newspapers in a special blue bin near the classroom door. <b>(3)</b> <u>The class with the most recycling by Friday.</u> <b>(4)</b> Please bring empty bottles from home. <b>(5)</b> Rinse them out first. <b>(6)</b> Mrs. Kim will check each <u>classes</u> bin every afternoon. <b>(7)</b> Its going to be a fun way to help our planet!"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["classs", "NO CHANGE", "class&rsquo;s", "classes&rsquo;"], "ci": 2, "exp": "To show that the bin belongs to one class, add <i>&rsquo;s</i>: <i>each <b>class&rsquo;s</b> bin.</i> <i>Each</i> tells us there is only one class at a time, so the plural <i>classes&rsquo;</i> does not fit.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Join the Recycling Challenge!</strong><br><b>(1)</b> Starting next Monday, every class at Maple Grove Elementary can join the Recycling Challenge. <b>(2)</b> Each class will collect cans, plastic bottles, and old newspapers in a special blue bin near the classroom door. <b>(3)</b> <u>The class with the most recycling by Friday.</u> <b>(4)</b> Please bring empty bottles from home. <b>(5)</b> Rinse them out first. <b>(6)</b> Mrs. Kim will check each <u>classes</u> bin every afternoon. <b>(7)</b> Its going to be a fun way to help our planet!"}, {"stem": "Which sentence contains an error?", "opts": ["Starting next Monday, every class at Maple Grove Elementary can join the Recycling Challenge.", "Each class will collect cans, plastic bottles, and old newspapers in a special blue bin near the classroom door.", "Its going to be a fun way to help our planet!", "Please bring empty bottles from home."], "ci": 2, "exp": "<i>It&rsquo;s</i> is short for <i>it is</i>. <i>Its</i> (no apostrophe) shows belonging. The sentence means &ldquo;It is going to be fun,&rdquo; var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
