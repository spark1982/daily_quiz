ent to make it part of the Constitution. The amendment declared that no citizen could be denied the right to vote because of sex. Anthony had died fourteen years earlier, but her persistence helped make the victory possible."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Anthony refused to pay the fine she was given.", "The Wyoming Territory allowed women to vote before 1920.", "About three hundred people attended the meeting at Seneca Falls.", "Susan B. Anthony lived to see the Nineteenth Amendment ratified."], "ci": 3, "exp": "The last paragraph says &ldquo;Anthony had died fourteen years earlier,&rdquo; so she did not live to see the 1920 victory. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Votes for Women</strong><br>For most of the nation&rsquo;s early history, American women could not vote in national elections. They paid taxes and obeyed laws, yet they had no voice in choosing the leaders who wrote those laws. In 1848, about three hundred people gathered in Seneca Falls, New York, for the first convention devoted to women&rsquo;s rights. There, Elizabeth Cady Stanton read a bold declaration insisting that &ldquo;all men and women are created equal.&rdquo;<br><br>The struggle that followed was long and often discouraging. Activists such as Susan B. Anthony made frequent journeys from town to town, delivering speeches and collecting signatures on petitions. In 1872, Anthony was arrested for casting a ballot in Rochester, New York, and she was fined one hundred dollars, a penalty she refused to pay. Progress came first in the West: the Wyoming Territory granted women the vote in 1869, and several western states soon followed.<br><br>Finally, in 1920, enough states ratified the Nineteenth Amendment to make it part of the Constitution. The amendment declared that no citizen could be denied the right to vote because of sex. Anthony had died fourteen years earlier, but her persistence helped make the victory possible."}, {"stem": "In the last paragraph, what does the word &ldquo;persistence&rdquo; most likely mean?", "opts": ["refusing to give up even when things are hard", "a willingness to break unfair laws", "skill at organizing large meetings", "the ability to give exciting speeches"], "ci": 0, "exp": "The passage calls the struggle &ldquo;long and often discouraging&rdquo; and says Anthony kept traveling and even refused to pay her fine, so <i>persistence</i> means continuing without giving up. She did give speeches, but that is not what the word means.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Votes for Women</strong><br>For most of the nation&rsquo;s early history, American women could not vote in national elections. They paid taxes and obeyed laws, yet they had no voice in choosing the leaders who wrote those laws. In 1848, about three hundred people gathered in Seneca Falls, New York, for the first convention devoted to women&rsquo;s rights. There, Elizabeth Cady Stanton read a bold declaration insisting that &ldquo;all men and women are created equal.&rdquo;<br><br>The struggle that followed was long and often discouraging. Activists such as Susan B. Anthony made frequent journeys from town to town, delivering speeches and collecting signatures on petitions. In 1872, Anthony was arrested for casting a ballot in Rochester, New York, and she was fined one hundred dollars, a penalty she refused to pay. Progress came first in the West: the Wyoming Territory granted women the vote in 1869, and several western states soon followed.<br><br>Finally, in 1920, enough states ratified the Nineteenth Amendment to make it part of the Constitution. The amendment declared that no citizen could be denied the right to vote because of sex. Anthony had died fourteen years earlier, but her persistence helped make the victory possible."}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Western states were the first places where women were allowed to vote.", "American women won the right to vote only after decades of determined effort.", "Susan B. Anthony was arrested for voting in Rochester in 1872.", "The Seneca Falls convention was the largest meeting of its time."], "ci": 1, "exp": "The passage traces the whole struggle from 1848 to 1920. Anthony&rsquo;s arrest and the western states are details that support this idea, and the passage never says Seneca Falls was the largest meeting.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Votes for Women</strong><br>For most of the nation&rsquo;s early history, American women could not vote in national elections. They paid taxes and obeyed laws, yet they had no voice in choosing the leaders who wrote those laws. In 1848, about three hundred people gathered in Seneca Falls, New York, for the first convention devoted to women&rsquo;s rights. There, Elizabeth Cady Stanton read a bold declaration insisting that &ldquo;all men and women are created equal.&rdquo;<br><br>The struggle that followed was long and often discouraging. Activists such as Susan B. Anthony made frequent journeys from town to town, delivering speeches and collecting signatures on petitions. In 1872, Anthony was arrested for casting a ballot in Rochester, New York, and she was fined one hundred dollars, a penalty she refused to pay. Progress came first in the West: the Wyoming Territory granted women the vote in 1869, and several western states soon followed.<br><br>Finally, in 1920, enough states ratified the Nineteenth Amendment to make it part of the Constitution. The amendment declared that no citizen could be denied the right to vote because of sex. Anthony had died fourteen years earlier, but her persistence helped make the victory possible."}, {"stem": "Based on the passage, why would a coral reef be unlikely to grow in very deep, dark water?", "opts": ["The algae living inside the coral need sunlight to make food.", "Most ocean species stay away from deep water.", "Polyps are too small to swim down to the bottom.", "Limestone cannot form in water that is very deep."], "ci": 0, "exp": "The passage says the algae &ldquo;use sunlight to make food&rdquo; and that reefs grow where &ldquo;sunlight can easily reach them.&rdquo; Dark water would not give the algae the light they need, so the coral would go hungry.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Cities Built by Tiny Animals</strong><br>A coral reef may look like a garden of colorful rocks, but it is actually built by animals. Each coral polyp is a soft creature no bigger than a pencil eraser. To protect its delicate body, a polyp pulls minerals from seawater and constructs a hard cup of limestone around itself. When the polyp dies, its skeleton remains, and new polyps grow on top. Over thousands of years, billions of these skeletons pile up into enormous reefs.<br><br>Polyps could not survive alone, however. Tiny algae live inside their tissues and use sunlight to make food, sharing much of it with the coral. In return, the coral gives the algae shelter. This partnership explains why most reefs grow in shallow, clear water, where sunlight can easily reach them.<br><br>The relationship is fragile. When ocean water becomes too warm, stressed corals push out their algae and turn ghostly white. If the water cools quickly, the algae can return. If high temperatures persist for weeks, however, the corals may starve. Because reefs shelter about a quarter of all ocean species, scientists monitor them closely and search for ways to help them adapt."}, {"stem": "Which word means the <b>OPPOSITE</b> of &ldquo;fragile&rdquo; as it is used in the third paragraph?", "opts": ["sturdy", "delicate", "colorful", "ancient"], "ci": 0, "exp": "A <i>fragile</i> relationship is one that can break easily, so the opposite is <i>sturdy</i> (strong and hard to break). <i>Delicate</i> means a ocks, but it is actually built by animals. Each coral polyp is a soft creature no bigger than a pencil eraser. To protect its delicate body, a polyp pulls minerals from seawater and constructs a hard cup of limestone around itself. When the polyp dies, its skeleton remains, and new polyps grow on top. Over thousands of years, billions of these skeletons pile up into enormous reefs.<br><br>Polyps could not survive alone, however. Tiny algae live inside their tissues and use sunlight to make food, sharing much of it with the coral. In return, the coral gives the algae shelter. This partnership explains why most reefs grow in shallow, clear water, where sunlight can easily reach them.<br><br>The relationship is fragile. When ocean water becomes too warm, stressed corals push out their algae and turn ghostly white. If the water cools quickly, the algae can return. If high temperatures persist for weeks, however, the corals may starve. Because reefs shelter about a quarter of all ocean species, scientists monitor them closely and search for ways to help them adapt."}, {"stem": "According to the passage, what do the algae give the coral?", "opts": ["protection from warm water", "shelter from ocean predators", "minerals for building limestone cups", "food that they make using sunlight"], "ci": 3, "exp": "The second paragraph says the algae &ldquo;use sunlight to make food, sharing much of it with the coral.&rdquo; Shelter is what the coral gives the algae, not the other way around.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Cities Built by Tiny Animals</strong><br>A coral reef may look like a garden of colorful rocks, but it is actually built by animals. Each coral polyp is a soft creature no bigger than a pencil eraser. To protect its delicate body, a polyp pulls minerals from seawater and constructs a hard cup of limestone around itself. When the polyp dies, its skeleton remains, and new polyps grow on top. Over thousands of years, billions of these skeletons pile up into enormous reefs.<br><br>Polyps could not survive alone, however. Tiny algae live inside their tissues and use sunlight to make food, sharing much of it with the coral. In return, the coral gives the algae shelter. This partnership explains why most reefs grow in shallow, clear water, where sunlight can easily reach them.<br><br>The relationship is fragile. When ocean water becomes too warm, stressed corals push out their algae and turn ghostly white. If the water cools quickly, the algae can return. If high temperatures persist for weeks, however, the corals may starve. Because reefs shelter about a quarter of all ocean species, scientists monitor them closely and search for ways to help them adapt."}, {"stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;crammed&rdquo; in the last paragraph?", "opts": ["packed", "smudged", "decorated", "scattered"], "ci": 0, "exp": "Nora&rsquo;s notebook was &ldquo;crammed with stories,&rdquo; meaning it was completely full, or <i>packed</i>. <i>Scattered</i> appears earlier in the story but means spread out, which does not fit.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Man Behind the Mop</strong><br>Nora had been on the staff of the <i>Westbrook Weekly</i> for exactly two days when Ms. Patel handed her the assignment nobody wanted.<br><br>&ldquo;Interview Mr. Haskins,&rdquo; the editor said. &ldquo;He has worked here for thirty years, and nobody has ever written about him.&rdquo;<br><br>Nora groaned silently. Mr. Haskins, the school custodian, was famous for his scowl. He grumbled whenever students tracked mud down the hallway, and the younger kids scattered when his squeaky cart rolled by.<br><br>She found him after school, scrubbing a scuff mark outside the gym. &ldquo;Um, Mr. Haskins? Could I ask you a few questions for the paper?&rdquo;<br><br>He squinted at her for a long moment. Then, unexpectedly, he set down his brush. &ldquo;Nobody&rsquo;s asked me a q var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
