<style>

body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}

var TIMER_DEFAULT_MIN = 20;

var RAW_QUESTIONS = [{"tag": "Subject-Verb Agreement", "box": "The committee, along with its three subcommittees, _____ scheduled to present its findings at the annual conference next month.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "have been", "were"], "ci": 0, "exp": "The subject is the singular noun 'committee'; the phrase 'along with its three subcommittees' is a modifier that does not change the number of the subject. 'are', 'have been', and 'were' incorrectly treat the subject as plural."}, {"tag": "Pronoun Reference", "box": "Although the interns revised the proposal after the directors rejected the budget outline, _____ still contained several unresolved inconsistencies.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the revised proposal", "it", "the outline", "they"], "ci": 0, "exp": "'the revised proposal' removes the ambiguity created by a pronoun that could grammatically refer to either 'proposal' or 'budget outline', and it matches the logical meaning, since the proposal is what still had issues. 'it' and 'the outline' are ambiguous or point to the wrong noun. 'they' incorrectly uses a plural pronoun for a singular antecedent."}, {"tag": "Modifier Placement", "box": "Having been restored by conservators using techniques developed only within the past decade, <span class=\"ul\">museum visitors can now view the fresco in its original vibrant colors</span>.", "stem": "Which choice best revises the underlined portion to correct the dangling modifier?", "opts": ["visitors to the museum can now view the fresco in its original vibrant colors", "the fresco can now be viewed by museum visitors in its original vibrant colors", "museum visitors can now view the fresco, which is in its original vibrant colors", "the fresco, having been restored, can now be viewed by museum visitors"], "ci": 1, "exp": "The opening modifier 'Having been restored by conservators...' logically describes the fresco, not the visitors, so the noun immediately following the comma must be 'the fresco'. Only 'the fresco can now be viewed by museum visitors in its original vibrant colors' places 'the fresco' right after the modifier. The other options leave 'visitors' or an ambiguous structure right after the modifier, implying visitors were restored."}, {"tag": "Parallel Structure", "box": "The grant requires applicants to outline their research goals, to describe their methodology in detail, and _____.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["to justify their requested budget", "justifying their requested budget", "that they justify their requested budget", "their requested budget should be justified"], "ci": 0, "exp": "The sentence lists three infinitive actions joined by 'to outline', 'to describe', and a third item; only 'to justify their requested budget' maintains the same infinitive form. The other choices break parallelism by switching to a gerund, a subordinate clause, or a passive construction."}, {"tag": "Punctuation", "box": "The archivist discovered three previously uncatalogued letters, each written in a different hand, tucked inside the back cover of the ledger.", "stem": "Which choice best revises the sentence to correct a punctuation error?", "opts": ["No change is needed.", "letters each written in a different hand, tucked", "letters, each written in a different hand tucked", "letters each, written in a different hand tucked,"], "ci": 0, "exp": "The nonessential appositive phrase 'each written in a different hand' is correctly set off by a pair of commas, and the sentence is otherwise properly punctuated, so no change is needed. The other choices remove one comma of the pair or misplace the commas, breaking the nonessential phrase apart from its boundaries."}, {"tag": "Verb Tense", "box": "By the time the auditors finally reviewed the ledgers, the accountant _____ the discrepancies for nearly a year.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had been concealing", "concealed", "has concealed", "was concealing"], "ci": 0, "exp": "The past perfect progressive 'had been concealing' correctly shows an ongoing action that had continued for a duration ('for nearly a year') before another past event (the auditors reviewing the ledgers). 'concealed' and 'was concealing' do not clearly establish that the action was completed before the later past event, and 'has concealed' incorrectly uses the present perfect."}, {"tag": "Transitions", "box": "The city council approved funding for the new transit line only after three separate feasibility studies confirmed its long-term cost savings. _____, several residents continued to argue that the project would disrupt local businesses during construction.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless", "As a result", "Similarly", "For example"], "ci": 0, "exp": "'Nevertheless' correctly signals the contrast between the council's approval, based on confirmed cost savings, and the residents' continued opposition despite that approval. 'As a result' would incorrectly suggest the residents' concern follows logically from the approval, 'Similarly' implies the two ideas are alike rather than contrasting, and 'For example' would incorrectly frame the second sentence as an illustration of the first."}, {"tag": "Apostrophes", "box": "The two companies' merger, finalized after months of negotiation, ultimately preserved both firms _____ distinct branding.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["firms'", "firms", "firm's", "firms's"], "ci": 0, "exp": "The sentence requires a plural possessive to show that the branding belongs to both firms, so the plural noun 'firms' takes an apostrophe after the final s: 'firms''. 'firms' alone is not possessive, 'firm's' incorrectly treats the noun as singular, and 'firms's' is not a standard possessive form."}, {"tag": "Concision", "box": "<span class=\"ul\">Due to the fact that</span> the bridge had not been inspected in over a decade, engineers recommended an immediate structural assessment.", "stem": "Which choice most effectively revises the underlined portion while keeping the sentence's meaning?", "opts": ["Because", "Owing to the fact that", "In light of the fact that", "Given that it was true that"], "ci": 0, "exp": "'Because' conveys the same causal relationship as the wordy original phrase in the most concise way. 'Owing to the fact that', 'In light of the fact that', and 'Given that it was true that' are all needlessly wordy substitutes that add no meaning beyond what 'Because' already conveys."}, {"tag": "Pronoun-Antecedent Agreement", "box": "Neither the lead researcher nor her two graduate assistants had submitted _____ portion of the report by the deadline.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["their", "her", "its", "his or her"], "ci": 0, "exp": "In a 'neither...nor' construction, the pronoun agrees with the noun closer to it, which here is the plural 'graduate assistants', so the plural possessive 'their' is correct. 'her' and 'his or her' incorrectly treat the closer noun as singular, and 'its' is used for non-personal antecedents."}, {"tag": "Subject-Verb Agreement", "box": "A significant portion of the manuscripts recovered from the flooded archive _____ too deteriorated to be digitized.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "were", "have been"], "ci": 0, "exp": "The subject of the sentence is the singular noun phrase 'a significant portion', and 'of the manuscripts...' is a prepositional phrase modifying it rather than a plural subject, so the singular verb 'is' is correct. 'are', 'were', and 'have been' incorrectly treat 'manuscripts' as the grammatical subject."}, {"tag": "Pronoun Case", "box": "The scholarship committee ultimately could not decide between _____ and the other two finalists, both of whom had submitted equally compelling essays.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["her", "she", "herself", "hers"], "ci": 0, "exp": "The pronoun follows the preposition 'between' and functions as its object, so the objective case 'her' is required. 'she' is the subjective case, 'herself' is a reflexive pronoun with no clear antecedent role here, and 'hers' is a possessive pronoun that does not fit the sentence's structure."}, {"tag": "Modifier Placement", "box": "Skimming quickly through the dense legal contract, <span class=\"ul\">several ambiguous clauses caught the paralegal's attention almost immediately</span>.", "stem": "Which choice best revises the underlined portion to correct the dangling modifier?", "opts": ["the paralegal noticed several ambiguous clauses almost immediately", "several ambiguous clauses were noticed by the paralegal almost immediately", "almost immediately, several ambiguous clauses caught the paralegal's attention", "the paralegal's attention was caught by several ambiguous clauses almost immediately"], "ci": 0, "exp": "The opening modifier 'Skimming quickly through the dense legal contract' logically describes the paralegal, who is doing the skimming, so the noun immediately following the comma must be 'the paralegal'. Only 'the paralegal noticed several ambiguous clauses almost immediately' places 'the paralegal' right after the modifier; the other choices keep 'clauses' or 'attention' as the subject, implying the clauses or the attention itself were skimming the contract."}, {"tag": "Punctuation", "box": "The novel's final chapter, widely regarded by critics as its weakest, nevertheless resolves the central conflict with unexpected emotional force.", "stem": "Which choice best revises the sentence to correct a punctuation error?", "opts": ["No change is needed.", "chapter widely regarded by critics as its weakest nevertheless resolves", "chapter, widely regarded by critics as its weakest nevertheless, resolves", "chapter widely regarded, by critics as its weakest, nevertheless resolves"], "ci": 0, "exp": "The nonessential appositive 'widely regarded by critics as its weakest' is correctly enclosed by a pair of commas before the main verb 'resolves', so no change is needed. The other choices either remove both commas, misplace the second comma so it splits 'weakest nevertheless' from the verb, or insert an unnecessary comma inside the appositive itself."}, {"tag": "Verb Tense", "box": "The negotiators announced that an agreement _____ reached only after both delegations agreed to reconsider their original demands.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had been", "was", "has been", "would be"], "ci": 0, "exp": "Because the agreement being reached happened before the announcement, which is itself in the past, the past perfect 'had been' is needed to clearly sequence the two past events. 'was' fails to show that the reaching of the agreement preceded the announcement, 'has been' incorrectly uses the present perfect, and 'would be' incorrectly suggests a future possibility relative to the past announcement."}, {"tag": "Concision", "box": "<span class=\"ul\">In spite of the fact that</span> the survey results were inconclusive, the marketing team proceeded with the campaign as originally planned.", "stem": "Which choice most effectively revises the underlined portion while keeping the sentence's meaning?", "opts": ["Although", "Despite the fact of", "Notwithstanding the fact that", "Regardless of how"], "ci": 0, "exp": "'Although' conveys the same concessive relationship as the wordy original phrase in the fewest words. 'Despite the fact of' and 'Notwithstanding the fact that' are needlessly wordy, and 'Regardless of how' changes the intended meaning by suggesting a manner rather than a concession."}, {"tag": "Transitions", "box": "Early drafts of the treaty included provisions for joint military exercises between the two nations. _____, the final version, signed after additional rounds of negotiation, omitted any mention of military cooperation.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["By contrast", "Consequently", "In addition", "Specifically"], "ci": 0, "exp": "'By contrast' correctly signals the shift between the early drafts, which included military provisions, and the final version, which omitted them entirely. 'Consequently' would incorrectly suggest the omission was a result of the earlier inclusion, 'In addition' implies the second sentence adds to rather than contradicts the first, and 'Specifically' implies the second sentence narrows or clarifies the first rather than opposing it."}, {"tag": "Pronoun Reference", "box": "When the editors compared the original manuscript to the printed edition, _____ revealed dozens of unauthorized changes made without the author's knowledge.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the comparison", "it", "the edition", "they"], "ci": 0, "exp": "'the comparison' removes the ambiguity created by a pronoun that could grammatically refer to either 'manuscript' or 'printed edition', and it accurately identifies what actually revealed the changes, which is the act of comparing the two texts. 'it' and 'the edition' are ambiguous or point to the wrong noun, and 'they' incorrectly uses a plural pronoun for singular antecedents."}, {"tag": "Subject-Verb Agreement", "box": "Every one of the proposals submitted by the rival architectural firms _____ strict adherence to the city's new environmental guidelines.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["demonstrates", "demonstrate", "have demonstrated", "were demonstrating"], "ci": 0, "exp": "The subject is the singular pronoun 'every one', and 'of the proposals submitted by the rival architectural firms' is a prepositional phrase that does not change the number of the subject, so the singular verb 'demonstrates' is correct. 'demonstrate', 'have demonstrated', and 'were demonstrating' incorrectly treat the subject as plural."}, {"tag": "Parallel Structure", "box": "The internship program is designed to help students build professional networks, gain hands-on laboratory experience, and _____.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["develop confidence in public speaking", "developing confidence in public speaking", "confidence in public speaking should be developed", "that confidence in public speaking is developed"], "ci": 0, "exp": "The sentence lists three parallel infinitive actions after 'designed to help students'; 'build', 'gain', and the missing third verb must all share the same base form. Only 'develop confidence in public speaking' maintains that parallel structure. The other choices shift to a gerund, a passive construction, or a subordinate clause."}];

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}
function R(idx,inner){var i=idx?'<span class="radical-index">'+idx+'</span>':'';return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>';}


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(tagEl){
    if(q.tag){
      tagEl.style.display='inline-block';
      tagEl.textContent = q.tag;
      tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
    } else {
      tagEl.style.display='none';
    }
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi && q.exp){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
