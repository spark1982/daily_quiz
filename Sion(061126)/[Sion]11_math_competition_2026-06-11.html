<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Math Competition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}
.date-label{font-size:2rem;font-weight:800;text-align:center;color:#185FA5;background:#fff;padding:10px 0 2px}
.title{text-align:center;font-size:1.4rem;font-weight:700;color:#185FA5;background:#fff;padding:2px 0 4px}
.attempts{text-align:center;font-size:0.9rem;color:#555;background:#fff;padding:2px 0 10px}
.container{max-width:700px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden}
.dot-nav{display:flex;flex-wrap:wrap;gap:5px;padding:12px 14px;background:#f7f9fc;border-bottom:1px solid #e0e6ef;justify-content:center}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;cursor:pointer;border:2px solid #c5d2e0;background:#e8edf4;color:#333}
.dot.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.dot.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.dot.active{border-color:#185FA5;background:#d0e4f7;color:#185FA5}
.results-pill{background:#185FA5;color:#fff;border-radius:20px;padding:4px 14px;font-size:0.8rem;font-weight:600}
#quizArea{display:none;padding:20px 20px 10px}
.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:0.75rem;font-weight:600;margin-bottom:10px}
.q-counter{font-size:0.85rem;color:#666;margin-bottom:6px}
.q-text{font-size:1.05rem;line-height:1.75;color:#111;margin-bottom:16px}
.options{display:grid;gap:10px}
.opt-btn{width:100%;text-align:left;padding:12px 16px;border-radius:8px;border:2px solid transparent;background:#e8edf4;color:#111111;font-size:0.97rem;cursor:pointer;transition:.15s;line-height:1.55}
.opt-btn:hover{border-color:#185FA5}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.opt-btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.explain{margin-top:14px;padding:12px;background:#f0f5ff;border-left:4px solid #185FA5;border-radius:4px;font-size:0.9rem;color:#222;line-height:1.6}
.nav-btns{display:flex;gap:10px;margin-top:18px;padding-bottom:10px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer}
.btn-blue{background:#185FA5;color:#fff}.btn-gray{background:#e8edf4;color:#333}
#resultsArea{display:none;padding:20px}
.res-header{font-size:1.2rem;font-weight:700;color:#185FA5;margin-bottom:14px;text-align:center}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin-bottom:18px}
.res-card{padding:8px;border-radius:8px;background:#f0f4f8;cursor:pointer;text-align:center;font-size:0.82rem;font-weight:600;border:2px solid transparent}
.res-card.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.res-card.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.res-card.skipped{background:#fff3cd;border-color:#e6a817;color:#7a5500}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:28px;max-width:340px;width:90%;text-align:center}
.modal h3{margin-bottom:10px;color:#185FA5}.modal p{margin-bottom:18px;color:#444;font-size:.95rem}
.modal-btns{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<div class="container">
<div class="date-label">2026-06-11</div>
<div class="title">[Sion] Math Competition</div>
<div class="attempts" id="attemptsLabel">Total Attempts: 0</div>
<div class="dot-nav" id="dotNav"></div>
<div id="quizArea"></div>
<div id="resultsArea"></div>
</div>
<div class="modal-overlay" id="freshModal">
<div class="modal"><h3>Start Fresh</h3><p>This will reset all progress.</p>
<div class="modal-btns"><button class="btn btn-blue" onclick="doFresh()">Reset</button><button class="btn btn-gray" onclick="closeFreshModal()">Cancel</button></div></div>
</div>
<script>
(function(){
const KEY='quiz_sionmathcomp_7_20260611_v1';
const ATT_KEY='quiz_sionmathcomp_attempts_20260611_v1';
var qs=[
// Q1: Invariant - parity
{tag:'Invariant',
 q:'The integers 1, 2, 3, ..., 2025 are written on a blackboard. In each move, two numbers <em>a</em> and <em>b</em> are erased and |<em>a</em> &minus; <em>b</em>| is written in their place. After 2024 moves, exactly one number remains. Which of the following values is <strong>IMPOSSIBLE</strong> as the final result?',
 opts:['3','0','1','5'],ci:1,
 exp:'The sum 1+2+&hellip;+2025 = 2025&times;1013 = 2,051,325, which is odd. Each move replaces (a, b) with |a&minus;b|, changing the total sum by &minus;2&middot;min(a,b) &mdash; an even change. So the parity of the sum is invariant: it stays odd throughout. The last remaining number must therefore be odd. Since 0 is even, it is impossible.'},
// Q2: Invariant - mod 3
{tag:'Invariant',
 q:'Starting from the number 2, a player may repeatedly apply one of two operations: (i) double the current number, or (ii) add 3. Can the player ever reach <strong>9</strong> using any sequence of operations?',
 opts:['Yes','Yes, with the right sequence of operations','No','Cannot be determined'],ci:2,
 exp:'Check residues mod 3. Start: 2 &equiv; 2. Doubling: 2&times;2=4&equiv;1, 2&times;1=2. Adding 3 keeps the residue unchanged. So reachable residues cycle between 1 and 2 only; residue 0 is never reachable. Since 9 &equiv; 0 (mod 3), we can never reach 9.'},
// Q3: Parity
{tag:'Parity',
 q:'A class has 30 students. Each student belongs to exactly 1, 2, or 3 clubs. The total number of (student, club) memberships is 53. Is it possible that <strong>exactly 10</strong> students each belong to exactly 2 clubs?',
 opts:['No','Yes','Yes, if the clubs have the right sizes','Cannot be determined'],ci:0,
 exp:'Let a, b, c = students in 1, 2, 3 clubs. Then a+b+c=30 and a+2b+3c=53. Subtracting: b+2c=23. If b=10, then 2c=13, so c=6.5 &mdash; not an integer. There is no valid integer assignment with exactly 10 students in 2 clubs.'},
// Q4: Pigeonhole 1
{tag:'Pigeonhole',
 q:'A drawer contains socks in 9 different colors. What is the <strong>minimum</strong> number of socks you must draw (without looking) to <strong>guarantee</strong> that at least two socks are the same color?',
 opts:['5','9','18','10'],ci:3,
 exp:'By the Pigeonhole Principle: if you draw 9 socks, it is possible (in the worst case) to have exactly one sock of each color. Drawing one more &mdash; the 10th sock &mdash; guarantees that at least two must share a color. Minimum: 10.'},
// Q5: Pigeonhole 2
{tag:'Pigeonhole',
 q:'A math test has integer scores from 0 to 100 (101 distinct possible scores). What is the <strong>minimum</strong> number of students who must take the test to guarantee that at least 3 students received the <strong>exact same</strong> score?',
 opts:['101','203','102','202'],ci:1,
 exp:'By the generalized Pigeonhole Principle: with 101 possible scores and at most 2 students per score, at most 2&times;101=202 students can all have distinct or paired scores. The 203rd student must share a score with 2 others. Minimum: 203.'},
// Q6: Extremal - subset counting
{tag:'Extremal',
 q:'How many subsets of {1, 2, 3, 4, 5, 6} contain <strong>no two consecutive integers</strong>? (Include the empty set.)',
 opts:['18','20','16','21'],ci:3,
 exp:'Let f(n) = number of subsets of {1,...,n} with no two consecutive elements. f(1)=2, f(2)=3, and f(n)=f(n&minus;1)+f(n&minus;2) (either n is not in the subset, or n is in and n&minus;1 is not). This gives: f(3)=5, f(4)=8, f(5)=13, f(6)=21. These are Fibonacci numbers! Answer: 21.'},
// Q7: Game Theory - Nim
{tag:'Game Theory',
 q:'Alice and Bob alternate removing stones from a pile of 23. Each turn, a player may remove <strong>1, 2, or 3</strong> stones. The player who takes the <strong>last</strong> stone <strong>wins</strong>. Alice goes first. With optimal play, who wins, and what should Alice\'s first move be?',
 opts:['Bob wins','Alice wins, but only if she takes 1 stone first','Alice wins','Neither player has a guaranteed winning strategy'],ci:2,
 exp:'Losing positions are multiples of 4 (0, 4, 8, 12, ..., 20). Since 23 = 4&times;5 + 3, Alice should take 3 stones, leaving 20 (a multiple of 4). From any multiple of 4, whatever Bob takes (1, 2, or 3), Alice takes (3, 2, or 1) to restore the next multiple of 4. The sequence: 20 &rarr; 16 &rarr; 12 &rarr; 8 &rarr; 4 &rarr; 0. Bob faces 0 stones and loses.'}
];

var state={cur:0,answers:{},shuffles:{},showResults:false};
function loadState(){try{var s=localStorage.getItem(KEY);if(!s)return;var p=JSON.parse(s);if(typeof p.cur!=='number'||typeof p.answers!=='object'||typeof p.shuffles!=='object')throw 0;if(p.cur<0||p.cur>=qs.length)p.cur=0;state=p;}catch(e){localStorage.removeItem(KEY);}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
function getAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
function incAttempts(){localStorage.setItem(ATT_KEY,String(getAttempts()+1));}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function getShuffled(qi){if(!state.shuffles[qi]){state.shuffles[qi]=shuffle([0,1,2,3]);saveState();}return state.shuffles[qi];}
function render(){document.getElementById('attemptsLabel').textContent='Total Attempts: '+getAttempts();buildDots();if(state.showResults){showResults();return;}showQuestion();}
function buildDots(){var nav=document.getElementById('dotNav');var html='';for(var i=0;i<qs.length;i++){var cls='dot';if(state.answers[i]===undefined){}else if(state.answers[i]===qs[i].ci)cls+=' correct';else cls+=' wrong';if(i===state.cur&&!state.showResults)cls+=' active';html+='<div class="'+cls+'" onclick="goToQ('+i+')">'+(i+1)+'</div>';}if(state.showResults)html+='<span class="results-pill">Results</span>';nav.innerHTML=html;}
function showQuestion(){var qa=document.getElementById('quizArea');document.getElementById('resultsArea').style.display='none';qa.style.display='block';var i=state.cur,q=qs[i];var order=getShuffled(i);var ans=state.answers[i];var answered=(ans!==undefined);
var html='<div class="tag-badge">'+q.tag+'</div><div class="q-counter">'+(i+1)+' / '+qs.length+'</div><div class="q-text">'+q.q+'</div><div class="options">';
for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="pick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';
if(answered&&ans!==q.ci)html+='<div class="explain"><strong>Solution:</strong> '+q.exp+'</div>';
html+='<div class="nav-btns">';if(i>0)html+='<button class="btn btn-gray" onclick="go(-1)">Prev</button>';if(i<qs.length-1)html+='<button class="btn btn-blue" onclick="go(1)">Next</button>';else html+='<button class="btn btn-blue" onclick="finishQuiz()">See Results &#8594;</button>';html+='</div>';
qa.innerHTML=html;}
function pick(oi){var i=state.cur;if(state.answers[i]!==undefined)return;state.answers[i]=oi;saveState();showQuestion();}
function go(d){state.cur+=d;if(state.cur<0)state.cur=0;if(state.cur>=qs.length)state.cur=qs.length-1;saveState();showQuestion();}
function goToQ(i){if(state.showResults){state.showResults=false;state.cur=i;saveState();render();return;}state.cur=i;saveState();showQuestion();buildDots();}
function finishQuiz(){incAttempts();state.showResults=true;saveState();render();}
function showResults(){var qa=document.getElementById('quizArea');var ra=document.getElementById('resultsArea');qa.style.display='none';ra.style.display='block';var c=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===qs[i].ci)c++;}var html='<div class="res-header">Results: '+c+' / '+qs.length+'</div><div class="res-grid">';for(var i=0;i<qs.length;i++){var a=state.answers[i];var cls='res-card ';var lbl='';if(a===undefined){cls+='skipped';lbl='Skipped';}else if(a===qs[i].ci){cls+='correct';lbl='Correct';}else{cls+='wrong';lbl='Wrong';}html+='<div class="'+cls+'" onclick="goToQ('+i+')">Q'+(i+1)+': '+lbl+'</div>';}html+='</div><div class="res-actions"><button class="btn btn-blue" onclick="startRetry()">Retry Wrong Questions</button><button class="btn btn-gray" onclick="copyRes()">Copy All Results</button><button class="btn btn-gray" onclick="confirmFresh()">Start Fresh</button></div>';ra.innerHTML=html;buildDots();}
var retryList=[],retryIdx=0,retryAnswers={};
function startRetry(){retryList=[];for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==qs[i].ci)retryList.push(i);}if(!retryList.length){alert('No wrong questions!');return;}retryIdx=0;retryAnswers={};showRetry();}
function showRetry(){var el=document.getElementById('retryArea');if(!el){el=document.createElement('div');el.id='retryArea';el.style.cssText='padding:20px';document.querySelector('.container').appendChild(el);}document.getElementById('quizArea').style.display='none';document.getElementById('resultsArea').style.display='none';el.style.display='block';if(retryIdx>=retryList.length){var c=0;for(var x=0;x<retryList.length;x++){if(retryAnswers[x]===qs[retryList[x]].ci)c++;}el.innerHTML='<div style="font-weight:700;color:#185FA5;margin-bottom:14px">Retry Complete: '+c+'/'+retryList.length+' correct</div><button class="btn btn-blue" onclick="backToResults()">Back to Results</button>';return;}var qi=retryList[retryIdx],q=qs[qi];var order=getShuffled(qi);var ans=retryAnswers[retryIdx];var answered=(ans!==undefined);
var html='<div style="font-weight:700;color:#185FA5;margin-bottom:10px">Retry '+(retryIdx+1)+'/'+retryList.length+'</div><div class="tag-badge">'+q.tag+'</div><div class="q-text">'+q.q+'</div><div class="options">';for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="retryPick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';if(answered&&ans!==q.ci)html+='<div class="explain">'+q.exp+'</div>';html+='<div class="nav-btns"><button class="btn btn-blue" onclick="retryNext()">'+(retryIdx<retryList.length-1?'Next':'Finish Retry')+'</button></div>';el.innerHTML=html;}
function retryPick(oi){if(retryAnswers[retryIdx]!==undefined)return;retryAnswers[retryIdx]=oi;showRetry();}
function retryNext(){retryIdx++;showRetry();}
function backToResults(){var r=document.getElementById('retryArea');if(r)r.style.display='none';state.showResults=true;saveState();render();}
function copyRes(){var lines=['[Sion] Math Competition 2026-06-11'];var c=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===undefined){lines.push('Q'+(i+1)+': Skipped');}else if(a===qs[i].ci){c++;lines.push('Q'+(i+1)+': Correct');}else{lines.push('Q'+(i+1)+': Wrong');}}lines.splice(1,0,'Score: '+c+'/'+qs.length);var txt=lines.join('\n');if(navigator.clipboard)navigator.clipboard.writeText(txt);else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
function confirmFresh(){document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function doFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false};closeFreshModal();render();}
window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;
window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;
window.closeFreshModal=closeFreshModal;window.doFresh=doFresh;
window.retryPick=retryPick;window.retryNext=retryNext;window.backToResults=backToResults;
loadState();render();
})();
</script>
</body>
</html>
