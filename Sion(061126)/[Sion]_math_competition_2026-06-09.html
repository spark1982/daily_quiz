<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>[Sion] Math Competition</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}.container{max-width:800px;margin:0 auto}.date-header{text-align:center;font-size:2rem;font-weight:800;color:#185FA5;background:#fff;padding:12px 20px 4px;border-radius:12px 12px 0 0}.quiz-title{text-align:center;font-size:1.3rem;font-weight:700;color:#185FA5;background:#fff;padding:4px 20px 8px}.attempts-bar{text-align:center;font-size:.9rem;color:#555;background:#fff;padding:4px 20px 12px;border-radius:0 0 12px 12px;margin-bottom:12px}.nav-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;padding:12px;background:#fff;border-radius:12px}.dot{width:34px;height:34px;border-radius:50%;border:2px solid #185FA5;background:#e8edf4;color:#185FA5;font-weight:700;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}.dot.correct{background:#1D9E75;border-color:#1D9E75;color:#fff}.dot.wrong{background:#E24B4A;border-color:#E24B4A;color:#fff}.dot.current{border-width:3px}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px}.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;margin-bottom:10px}.qnum{font-size:.85rem;color:#888;margin-bottom:6px}.qtext{font-size:1.05rem;line-height:1.6;color:#111;margin-bottom:16px}.options{display:flex;flex-direction:column;gap:8px}.opt-btn{background:#e8edf4;color:#111111;border:2px solid transparent;border-radius:8px;padding:10px 14px;font-size:.95rem;cursor:pointer;text-align:left;transition:all .15s;line-height:1.4}.opt-btn:hover:not(:disabled){border-color:#185FA5}.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}.opt-btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#085041}.explain-box{margin-top:12px;background:#f8f0e8;border-left:4px solid #185FA5;border-radius:6px;padding:10px 14px;font-size:.9rem;color:#333;line-height:1.5;display:none}.nav-btns{display:flex;gap:10px;justify-content:space-between;margin-top:16px}.nav-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:.95rem;font-weight:600;cursor:pointer}.nav-btn:disabled{background:#ccc;cursor:not-allowed}.results-card{background:#fff;border-radius:12px;padding:20px}.results-title{font-size:1.4rem;font-weight:800;color:#185FA5;margin-bottom:16px;text-align:center}.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}.res-item{border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.85rem}.res-item.correct{background:#E1F5EE;border:1.5px solid #1D9E75;color:#085041}.res-item.wrong{background:#FCEBEB;border:1.5px solid #E24B4A;color:#501313}.res-item.skipped{background:#f5f5f5;border:1.5px solid #aaa;color:#555}.action-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.9rem;font-weight:600;cursor:pointer;margin:4px}.action-btn.secondary{background:#e8edf4;color:#185FA5}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:340px;width:90%;text-align:center}.modal-box p{margin-bottom:16px;font-size:1rem}@media(max-width:600px){.qtext{font-size:.97rem}.opt-btn{font-size:.9rem}}</style>
</head>
<body>
<div class="container">
  <div class="date-header">2026-06-09</div>
  <div class="quiz-title">[Sion] Math Competition</div>
  <div class="attempts-bar" id="attBar">Total Attempts: 0</div>
  <div class="nav-dots" id="navDots"></div>
  <div id="quizArea" style="display:none;"></div>
  <div id="resultsArea" style="display:none;"></div>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box"><p>Start fresh and reset all progress?</p>
  <button class="action-btn" onclick="confirmFresh()">Yes, Start Fresh</button>
  <button class="action-btn secondary" onclick="document.getElementById('freshModal').classList.remove('show')">Cancel</button>
  </div>
</div>
<script>
(function(){
  try{
    var QUESTIONS=[
      {
        "tag":"Invariant",
        "q":"Three piles contain <b>5, 9, and 22</b> stones. You may repeatedly choose two piles and move one stone from each of those two piles to the third pile. Is it possible to reach a state where all three piles contain <b>12 stones</b>?",
        "options":[
          "No",
          "Yes",
          "Yes, after exactly 5 operations",
          "No, because the total stone count changes"
        ],
        "correct":0,
        "explain":"<b>Invariant.</b> Each operation subtracts 1 from two piles and adds 2 to one pile, changing residues mod 3 by (−1, −1, +2) ≡ (2, 2, 2) mod 3. Starting residues: {5, 9, 22} mod 3 = {2, 0, 1}. Any operation permutes this multiset among {0,1,2} — it never becomes {0,0,0}. Since (12,12,12) has residues {0,0,0}, it is unreachable. (The total 5+9+22=36 is already correct, ruling out option D.)"
      },
      {
        "tag":"Parity",
        "q":"A frog jumps along a number line. Its 1st jump is 1 cm, its 2nd jump is 2 cm, ..., its 14th jump is 14 cm. Each jump can go left or right. Can the frog return to its starting point after exactly <b>14 jumps</b>?",
        "options":[
          "No",
          "Yes",
          "Yes, since 14 is even",
          "Cannot be determined"
        ],
        "correct":0,
        "explain":"<b>Parity.</b> To return to start, assign + or − to each jump so the signed sum equals 0. This requires splitting {1, 2, ..., 14} into two subsets of equal sum. The total is 1+2+...+14 = 105, which is odd — it cannot be divided into two equal integer halves. Therefore return is impossible. (For 15 jumps the total is 120, which is even, and return is possible.)"
      },
      {
        "tag":"Pigeonhole",
        "q":"What is the <b>smallest</b> number of integers you must choose from {1, 2, 3, ..., 10} to <b>guarantee</b> that some two of them sum to 11?",
        "options":[
          "5",
          "6",
          "7",
          "4"
        ],
        "correct":1,
        "explain":"<b>Pigeonhole.</b> The pairs that sum to 11 are {1,10}, {2,9}, {3,8}, {4,7}, {5,6} — five disjoint pairs covering all 10 numbers. Choosing at most one number from each pair avoids any sum-11 pair; this allows up to 5 numbers (e.g. {6,7,8,9,10}). With 6 choices, by pigeonhole at least two must come from the same pair, and those two sum to 11. Answer: 6."
      },
      {
        "tag":"Extremal",
        "q":"The ages of 10 students sum to 143. Is it <b>guaranteed</b> that at least one student is older than 14?",
        "options":[
          "Yes",
          "No",
          "No, a counterexample exists",
          "Yes, exactly 3 students must be over 14"
        ],
        "correct":0,
        "explain":"<b>Extremal (averaging).</b> Suppose every student is at most 14 years old. Then the sum of all ages is at most 10 × 14 = 140. But the actual sum is 143 > 140 — contradiction. Therefore at least one student must be older than 14. (Option D is wrong: we cannot determine exactly how many are above 14 without more information.)"
      },
      {
        "tag":"Game Theory",
        "q":"A box contains <b>23 matches</b>. Two players alternate turns; on each turn a player takes 1, 2, 3, or 4 matches. The player who takes the <b>last match wins</b>. Which player can guarantee a win, and what is their winning first move?",
        "options":[
          "First player wins",
          "Second player wins",
          "First player wins, but only if they take 1 first",
          "Second player wins, with the right strategy"
        ],
        "correct":0,
        "explain":"<b>Game Theory.</b> Losing positions (for the player to move) are multiples of 5: 0, 5, 10, 15, 20. Since 23 mod 5 = 3, position 23 is a winning position. First player takes 3, leaving 20 (a losing position for the opponent). Then: whatever k the opponent takes (1–4), the first player takes 5−k, keeping the running total at multiples of 5 until 0 is reached. First player wins."
      },
      {
        "tag":"Invariant",
        "q":"The integers 1–9 are placed in a 3×3 grid (row 1: 1,2,3; row 2: 4,5,6; row 3: 7,8,9). You may add 1 to every number in any <b>row</b>, or subtract 1 from every number in any <b>column</b>. Can you make all 9 numbers equal?",
        "options":[
          "Yes",
          "No",
          "No, row differences are invariant",
          "Yes, but only if the target value is 5"
        ],
        "correct":0,
        "explain":"<b>Invariant (constructive).</b> After applying row additions r₁, r₂, r₃ and column subtractions c₁, c₂, c₃, entry (i,j) becomes original(i,j) + rᵢ − cⱼ. For all entries to equal k, we need rᵢ − cⱼ = k − original(i,j). Since consecutive row differences (−3) and column differences (−1) are constant throughout the grid, a consistent integer solution always exists. For k = 5: r = (+4, +1, −2), c = (0, +1, +2). Option D is wrong — other values of k also work."
      },
      {
        "tag":"Pigeonhole",
        "q":"Five points are placed inside (or on the boundary of) a <b>2×2 square</b>. Is it guaranteed that at least two of the five points are within distance <b>√2</b> of each other?",
        "options":[
          "Yes",
          "No",
          "Yes, by the triangle inequality",
          "No, it depends on placement"
        ],
        "correct":0,
        "explain":"<b>Pigeonhole.</b> Partition the 2×2 square into four 1×1 unit squares. With 5 points and 4 boxes, by the Pigeonhole Principle at least one unit square contains 2 or more points. The maximum distance between two points in a 1×1 square is its diagonal = √(1²+1²) = √2. So those two points are within distance √2. (Option B is wrong: the four corners of a 2×2 square are distance 2 apart, and the center is distance √2 from each corner — so the center and any corner are exactly √2, not more.)"
      }
    ];
    var KEY='quiz_sion_mathcomp_7_v1',ATT_KEY='quiz_sion_mathcomp_attempts_v1';
    var state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};
    function loadState(){try{var r=localStorage.getItem(KEY);if(!r)return;var s=JSON.parse(r);if(typeof s.cur!=='number'||s.cur<0||s.cur>=QUESTIONS.length){localStorage.removeItem(KEY);return;}if(typeof s.answers!=='object'||Array.isArray(s.answers)){localStorage.removeItem(KEY);return;}if(typeof s.shuffles!=='object'||Array.isArray(s.shuffles)){localStorage.removeItem(KEY);return;}state=s;}catch(e){localStorage.removeItem(KEY);}}
    function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
    function getAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
    function incAtt(){localStorage.setItem(ATT_KEY,getAtt()+1);}
    function updAtt(){document.getElementById('attBar').textContent='Total Attempts: '+getAtt();}
    function getShuffle(qi){if(!state.shuffles[qi]){var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.shuffles[qi]=arr;saveState();}return state.shuffles[qi];}
    function getRetryShuffle(pos){if(!state.retry.shuffles[pos]){var qi=state.retry.indices[pos];var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.retry.shuffles[pos]=arr;saveState();}return state.retry.shuffles[pos];}
    function aAns(){return(state.mode==='retry'&&state.retry)?state.retry.answers:state.answers;}
    function aShuf(pos,qi){return(state.mode==='retry'&&state.retry)?getRetryShuffle(pos):getShuffle(qi);}
    function buildDots(){var nd=document.getElementById('navDots');nd.innerHTML='';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var label=state.showResults?'Results':(state.cur+1)+' / '+total;var pill=document.createElement('span');pill.style.cssText='background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;align-self:center;';pill.textContent=label;nd.appendChild(pill);var ans=aAns();indices.forEach(function(qi,pos){var d=document.createElement('button');d.className='dot';d.textContent=pos+1;var a=ans[pos];if(a!==undefined&&a!==null){d.className+=(QUESTIONS[qi].correct===a)?' correct':' wrong';}if(!state.showResults&&pos===state.cur)d.className+=' current';d.onclick=(function(p){return function(){state.cur=p;state.showResults=false;saveState();render();};})(pos);nd.appendChild(d);});}
    function render(){try{buildDots();if(state.showResults){showResults();return;}document.getElementById('resultsArea').style.display='none';var qa=document.getElementById('quizArea');qa.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var pos=state.cur;var qi=indices[pos];var q=QUESTIONS[qi];var shuffle=aShuf(pos,qi);var ans=aAns();var chosen=ans[pos];var answered=chosen!==undefined&&chosen!==null;var html='<div class="card">';html+='<span class="tag-badge">'+q.tag+'</span>';html+='<div class="qnum">Question '+(pos+1)+' of '+total+'</div>';html+='<div class="qtext">'+q.q+'</div>';html+='<div class="options">';shuffle.forEach(function(oi){var opt=q.options[oi];var cls='opt-btn';if(answered){if(oi===q.correct)cls+=' reveal';if(oi===chosen&&chosen!==q.correct)cls+=' wrong';}html+='<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="pick('+pos+','+oi+')">'+opt+'</button>';});html+='</div>';if(answered&&chosen!==q.correct){html+='<div class="explain-box" style="display:block;">'+q.explain+'</div>';}html+='<div class="nav-btns">';html+='<button class="nav-btn" onclick="go(-1)"'+(pos===0?' disabled':'')+'>Prev</button>';if(pos<total-1){html+='<button class="nav-btn" onclick="go(1)">Next</button>';}else{html+='<button class="nav-btn" onclick="finishQuiz()">See Results &rarr;</button>';}html+='</div></div>';qa.innerHTML=html;}catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red;">Render error: '+e.message+'</p></div>';}}
    function pick(pos,oi){var ans=aAns();if(ans[pos]!==undefined)return;ans[pos]=oi;saveState();render();}
    function go(dir){var total=state.mode==='retry'?state.retry.indices.length:QUESTIONS.length;state.cur=Math.max(0,Math.min(total-1,state.cur+dir));saveState();render();}
    function finishQuiz(){state.showResults=true;incAtt();updAtt();saveState();render();}
    function showResults(){document.getElementById('quizArea').style.display='none';var ra=document.getElementById('resultsArea');ra.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var c=0,w=0,s=0;indices.forEach(function(qi,pos){var a=ans[pos];if(a===undefined||a===null)s++;else if(QUESTIONS[qi].correct===a)c++;else w++;});var html='<div class="results-card"><div class="results-title">Results</div>';html+='<p style="text-align:center;margin-bottom:12px;font-size:1rem;">Correct: <b style="color:#1D9E75;">'+c+'</b> / '+indices.length+' &nbsp; Wrong: <b style="color:#E24B4A;">'+w+'</b> &nbsp; Skipped: <b style="color:#888;">'+s+'</b></p>';html+='<div class="results-grid">';indices.forEach(function(qi,pos){var a=ans[pos];var cls=(a===undefined||a===null)?'skipped':(QUESTIONS[qi].correct===a?'correct':'wrong');var lbl=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');html+='<div class="res-item '+cls+'" onclick="goToQ('+pos+')">Q'+(pos+1)+': '+lbl+'</div>';});html+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">';if(w>0)html+='<button class="action-btn" onclick="startRetry()">Retry Wrong Questions</button>';html+='<button class="action-btn secondary" onclick="copyRes()">Copy All Results</button>';html+='<button class="action-btn secondary" onclick="document.getElementById(\'freshModal\').classList.add(\'show\')">Start Fresh</button>';html+='</div></div>';ra.innerHTML=html;}
    function goToQ(pos){state.cur=pos;state.showResults=false;saveState();render();}
    function startRetry(){var wrong=[];state.answers&&Object.keys(state.answers).forEach(function(p){var pos=parseInt(p);var qi=QUESTIONS.map(function(_,i){return i;})[pos];var a=state.answers[pos];if(a!==undefined&&a!==null&&QUESTIONS[qi].correct!==a)wrong.push(qi);});if(!wrong.length)return;state.mode='retry';state.retry={indices:wrong,answers:{},shuffles:{}};state.cur=0;state.showResults=false;saveState();render();}
    function copyRes(){var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var lines=['[Sion] Math Competition — 2026-06-09'];indices.forEach(function(qi,pos){var a=ans[pos];var st=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');lines.push('Q'+(pos+1)+': '+st);});var text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
    function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
    function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};document.getElementById('freshModal').classList.remove('show');saveState();render();}
    loadState();updAtt();render();
  }catch(e){document.body.innerHTML+='<div style="color:red;padding:20px;">Fatal error: '+e.message+'</div>';}
})();
</script>
</body></html>
