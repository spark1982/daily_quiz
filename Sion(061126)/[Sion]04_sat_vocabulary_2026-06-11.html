<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Vocabulary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}
.date-label{font-size:2rem;font-weight:800;text-align:center;color:#185FA5;background:#fff;padding:10px 0 2px}
.title{text-align:center;font-size:1.4rem;font-weight:700;color:#185FA5;background:#fff;padding:2px 0 4px}
.attempts{text-align:center;font-size:0.9rem;color:#555;background:#fff;padding:2px 0 10px}
.container{max-width:680px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden}
.dot-nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px;background:#f7f9fc;border-bottom:1px solid #e0e6ef;justify-content:center}
.dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;cursor:pointer;border:2px solid #c5d2e0;background:#e8edf4;color:#333}
.dot.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.dot.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.dot.active{border-color:#185FA5;background:#d0e4f7;color:#185FA5}
.results-pill{background:#185FA5;color:#fff;border-radius:20px;padding:4px 14px;font-size:0.8rem;font-weight:600}
#quizArea{display:none;padding:20px 20px 10px}
.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:0.75rem;font-weight:600;margin-bottom:10px}
.q-counter{font-size:0.85rem;color:#666;margin-bottom:6px}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.word-text{font-size:1.8rem;font-weight:800;color:#185FA5;font-style:italic}
.speak-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:0.9rem;cursor:pointer;flex-shrink:0}
.options{display:grid;gap:10px}
.opt-btn{width:100%;text-align:left;padding:12px 16px;border-radius:8px;border:2px solid transparent;background:#e8edf4;color:#111111;font-size:0.97rem;cursor:pointer;transition:.15s}
.opt-btn:hover{border-color:#185FA5}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.opt-btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.explain{margin-top:14px;padding:12px;background:#f0f5ff;border-left:4px solid #185FA5;border-radius:4px;font-size:0.9rem;color:#222}
.nav-btns{display:flex;gap:10px;margin-top:18px;padding-bottom:10px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer}
.btn-blue{background:#185FA5;color:#fff}.btn-gray{background:#e8edf4;color:#333}
#resultsArea{display:none;padding:20px}
.res-header{font-size:1.2rem;font-weight:700;color:#185FA5;margin-bottom:14px;text-align:center}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:18px}
.res-card{padding:10px;border-radius:8px;background:#f0f4f8;cursor:pointer;text-align:center;font-size:0.85rem;font-weight:600;border:2px solid transparent}
.res-card.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.res-card.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.res-card.skipped{background:#fff3cd;border-color:#e6a817;color:#7a5500}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:28px;max-width:340px;width:90%;text-align:center}
.modal h3{margin-bottom:10px;color:#185FA5}.modal p{margin-bottom:18px;color:#444;font-size:.95rem}
.modal-btns{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<div class="container">
<div class="date-label">2026-06-11</div>
<div class="title">[Sion] SAT Vocabulary</div>
<div class="attempts" id="attemptsLabel">Total Attempts: 0</div>
<div class="dot-nav" id="dotNav"></div>
<div id="quizArea"></div>
<div id="resultsArea"></div>
</div>
<div class="modal-overlay" id="freshModal">
<div class="modal"><h3>Start Fresh</h3><p>This will reset all progress.</p>
<div class="modal-btns"><button class="btn btn-blue" onclick="doFresh()">Reset</button><button class="btn btn-gray" onclick="closeFreshModal()">Cancel</button></div></div>
</div>
<script>
(function(){
const KEY='quiz_satvocab_15_v1';
const ATT_KEY='quiz_satvocab_attempts_v1';
var qs=[
{w:'abstain',opts:['to refrain voluntarily from doing something','to make a bad situation better','to pacify someone with concessions','to diminish fear or anxiety'],ci:0,exp:'"Abstain" means to voluntarily restrain oneself from doing something, especially indulging in something. Example: She abstained from voting on the issue.'},
{w:'allay',opts:['enthusiastically energetic and cheerful','to relieve or put fears to rest','deceitful and untrustworthy','mental sharpness and quickness'],ci:1,exp:'"Allay" means to diminish or put to rest (fear, suspicion, concern). Example: His calm words allayed her fears.'},
{w:'ameliorate',opts:['to restrain oneself from action','friendly and easy to talk to','to make something bad or unsatisfactory better','a deep-seated feeling of dislike'],ci:2,exp:'"Ameliorate" means to make something bad or unsatisfactory better. Example: The medicine ameliorated his symptoms.'},
{w:'anachronistic',opts:['great enthusiasm or passion','the ability to make quick judgments','generously forgiving and noble','out of place in time; belonging to a different era'],ci:3,exp:'"Anachronistic" describes something that is out of its proper historical or chronological order. Example: Using a quill pen today would be anachronistic.'},
{w:'antipathy',opts:['a strong aversion or deep dislike','to pacify or satisfy someone','lacking energy; slow and relaxed','comfort or consolation in grief'],ci:0,exp:'"Antipathy" is a strong feeling of dislike or aversion. Example: She felt a deep antipathy toward dishonesty.'},
{w:'appease',opts:['treacherous and deceitful','to pacify or placate someone by satisfying demands','based on random choice or whim','to voluntarily refrain from something'],ci:1,exp:'"Appease" means to pacify or placate someone, often by satisfying their demands. Example: He tried to appease his critics by making changes.'},
{w:'arbitrary',opts:['mental sharpness; keen judgment','belonging to the wrong time period','based on random choice rather than reason; capricious','great enthusiasm or passion'],ci:2,exp:'"Arbitrary" describes a decision or action based on personal whim rather than logical reasoning. Example: The rule seemed arbitrary and unfair.'},
{w:'ardor',opts:['friendly and warm in manner','to make a situation better','to relieve anxiety or worry','great enthusiasm, passion, or zeal'],ci:3,exp:'"Ardor" means intense enthusiasm or passion. Example: She pursued her studies with ardor.'},
{w:'acumen',opts:['to restrain oneself voluntarily','the ability to make sharp, quick judgments; shrewdness','a strong, deep-seated dislike','to diminish fear or suspicion'],ci:1,exp:'"Acumen" means the ability to make good judgments and quick decisions. Example: His business acumen helped the company grow.'},
{w:'affable',opts:['outdated; belonging to the wrong era','to pacify or satisfy','friendly, warm, and easy to talk to','lacking energy; slow-moving'],ci:2,exp:'"Affable" describes someone who is friendly, easy to approach, and pleasant to talk to. Example: The affable teacher was loved by all students.'},
{w:'ebullient',opts:['enthusiastically energetic and cheerful; exuberant','to voluntarily restrain oneself','based on whim or randomness','treacherous and untrustworthy'],ci:0,exp:'"Ebullient" means cheerful and full of energy. Example: The ebullient crowd cheered loudly at the concert.'},
{w:'languid',opts:['comfort or consolation in distress','great enthusiasm and zeal','the ability to make sharp decisions','lacking energy; slow and relaxed; sluggish'],ci:3,exp:'"Languid" means displaying a disinclination for physical exertion; slow and relaxed. Example: She spent a languid afternoon by the pool.'},
{w:'magnanimous',opts:['to make a bad situation better','generous in forgiving; nobly generous and unselfish','a deep-seated dislike or aversion','to pacify or placate'],ci:1,exp:'"Magnanimous" means generously forgiving or nobly generous, especially toward an enemy. Example: The magnanimous victor offered fair terms to the defeated side.'},
{w:'perfidious',opts:['deceitful and untrustworthy; treacherous','friendly and easy to talk to','based on random choice without reason','to voluntarily refrain from action'],ci:0,exp:'"Perfidious" means deceitful, untrustworthy, or guilty of betrayal. Example: The perfidious spy sold secrets to the enemy.'},
{w:'solace',opts:['outdated; out of proper time period','to relieve or put to rest','comfort or consolation in a time of distress','enthusiastically cheerful and energetic'],ci:2,exp:'"Solace" means comfort or consolation in a time of grief or distress. Example: She found solace in music after her loss.'}
];

var state={cur:0,answers:{},shuffles:{},showResults:false};
function loadState(){try{var s=localStorage.getItem(KEY);if(!s)return;var p=JSON.parse(s);if(typeof p.cur!=='number'||typeof p.answers!=='object'||typeof p.shuffles!=='object')throw 0;if(p.cur<0||p.cur>=qs.length)p.cur=0;state=p;}catch(e){localStorage.removeItem(KEY);}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
function getAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
function incAttempts(){localStorage.setItem(ATT_KEY,String(getAttempts()+1));}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function getShuffled(qi){if(!state.shuffles[qi]){state.shuffles[qi]=shuffle([0,1,2,3]);saveState();}return state.shuffles[qi];}
function speak(w){if(!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u);}
function render(){document.getElementById('attemptsLabel').textContent='Total Attempts: '+getAttempts();buildDots();if(state.showResults){showResults();return;}showQuestion();}
function buildDots(){var nav=document.getElementById('dotNav');var html='';for(var i=0;i<qs.length;i++){var cls='dot';if(state.answers[i]===undefined){}else if(state.answers[i]===qs[i].ci)cls+=' correct';else cls+=' wrong';if(i===state.cur&&!state.showResults)cls+=' active';html+='<div class="'+cls+'" onclick="goToQ('+i+')">'+(i+1)+'</div>';}if(state.showResults)html+='<span class="results-pill">Results</span>';nav.innerHTML=html;}
function showQuestion(){var qa=document.getElementById('quizArea');document.getElementById('resultsArea').style.display='none';qa.style.display='block';var i=state.cur,q=qs[i];var order=getShuffled(i);var ans=state.answers[i];var answered=(ans!==undefined);var html='<div class="tag-badge">SAT Vocabulary</div><div class="q-counter">'+(i+1)+' / '+qs.length+'</div>';html+='<div class="word-row"><div class="word-text">'+q.w+'</div><button class="speak-btn" onclick="speak(\''+q.w+'\')">Listen</button></div>';html+='<div class="options">';for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="pick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';if(answered&&ans!==q.ci)html+='<div class="explain"><strong>Explanation:</strong> '+q.exp+'</div>';html+='<div class="nav-btns">';if(i>0)html+='<button class="btn btn-gray" onclick="go(-1)">Prev</button>';if(i<qs.length-1)html+='<button class="btn btn-blue" onclick="go(1)">Next</button>';else html+='<button class="btn btn-blue" onclick="finishQuiz()">See Results &#8594;</button>';html+='</div>';qa.innerHTML=html;}
function pick(oi){var i=state.cur;if(state.answers[i]!==undefined)return;state.answers[i]=oi;saveState();showQuestion();}
function go(d){state.cur+=d;if(state.cur<0)state.cur=0;if(state.cur>=qs.length)state.cur=qs.length-1;saveState();showQuestion();}
function goToQ(i){if(state.showResults){state.showResults=false;state.cur=i;saveState();render();return;}state.cur=i;saveState();showQuestion();buildDots();}
function finishQuiz(){incAttempts();state.showResults=true;saveState();render();}
function showResults(){var qa=document.getElementById('quizArea');var ra=document.getElementById('resultsArea');qa.style.display='none';ra.style.display='block';var c=0,w=0,s=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===undefined)s++;else if(a===qs[i].ci)c++;else w++;}var html='<div class="res-header">Results: '+c+' / '+qs.length+'</div><div class="res-grid">';for(var i=0;i<qs.length;i++){var a=state.answers[i];var cls='res-card ',lbl='';if(a===undefined){cls+='skipped';lbl='Skipped';}else if(a===qs[i].ci){cls+='correct';lbl='Correct';}else{cls+='wrong';lbl='Wrong';}html+='<div class="'+cls+'" onclick="goToQ('+i+')">Q'+(i+1)+': '+lbl+'</div>';}html+='</div><div class="res-actions"><button class="btn btn-blue" onclick="startRetry()">Retry Wrong Questions</button><button class="btn btn-gray" onclick="copyRes()">Copy All Results</button><button class="btn btn-gray" onclick="confirmFresh()">Start Fresh</button></div>';ra.innerHTML=html;buildDots();}
var retryList=[],retryIdx=0,retryAnswers={};
function startRetry(){retryList=[];for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==qs[i].ci)retryList.push(i);}if(!retryList.length){alert('No wrong questions!');return;}retryIdx=0;retryAnswers={};showRetry();}
function showRetry(){var el=document.getElementById('retryArea');if(!el){el=document.createElement('div');el.id='retryArea';el.style.cssText='padding:20px';document.querySelector('.container').appendChild(el);}document.getElementById('quizArea').style.display='none';document.getElementById('resultsArea').style.display='none';el.style.display='block';if(retryIdx>=retryList.length){var c=0;for(var x=0;x<retryList.length;x++){if(retryAnswers[x]===qs[retryList[x]].ci)c++;}el.innerHTML='<div style="font-weight:700;color:#185FA5;margin-bottom:14px">Retry Complete: '+c+'/'+retryList.length+' correct</div><button class="btn btn-blue" onclick="backToResults()">Back to Results</button>';return;}var qi=retryList[retryIdx],q=qs[qi];var order=getShuffled(qi);var ans=retryAnswers[retryIdx];var answered=(ans!==undefined);var html='<div style="font-weight:700;color:#185FA5;margin-bottom:10px">Retry '+(retryIdx+1)+'/'+retryList.length+'</div><div class="word-row"><div class="word-text">'+q.w+'</div><button class="speak-btn" onclick="speak(\''+q.w+'\')">Listen</button></div><div class="options">';for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="retryPick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';if(answered&&ans!==q.ci)html+='<div class="explain">'+q.exp+'</div>';html+='<div class="nav-btns"><button class="btn btn-blue" onclick="retryNext()">'+(retryIdx<retryList.length-1?'Next':'Finish Retry')+'</button></div>';el.innerHTML=html;}
function retryPick(oi){if(retryAnswers[retryIdx]!==undefined)return;retryAnswers[retryIdx]=oi;showRetry();}
function retryNext(){retryIdx++;showRetry();}
function backToResults(){var r=document.getElementById('retryArea');if(r)r.style.display='none';state.showResults=true;saveState();render();}
function copyRes(){var lines=['[Sion] SAT Vocabulary 2026-06-11'];var c=0,w=0,s=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===undefined){s++;lines.push('Q'+(i+1)+': Skipped ('+qs[i].w+')');}else if(a===qs[i].ci){c++;lines.push('Q'+(i+1)+': Correct ('+qs[i].w+')');}else{w++;lines.push('Q'+(i+1)+': Wrong ('+qs[i].w+')');}}lines.splice(1,0,'Score: '+c+'/'+qs.length);var txt=lines.join('\n');if(navigator.clipboard)navigator.clipboard.writeText(txt);else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
function confirmFresh(){document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function doFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false};closeFreshModal();render();}
window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;
window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;
window.closeFreshModal=closeFreshModal;window.doFresh=doFresh;
window.retryPick=retryPick;window.retryNext=retryNext;window.backToResults=backToResults;window.speak=speak;
loadState();render();
})();
</script>
</body>
</html>
