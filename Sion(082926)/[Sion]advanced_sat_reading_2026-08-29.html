<title>[Sion] Advanced SAT Reading</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}
.subtitle{text-align:center;font-size:0.85rem;color:#555;background:#fff;padding:2px 0 4px}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:2px 12px 10px}
.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}
.timer-setup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
.timer-setup label { font-weight: 700; }
.timer-setup input[type="number"] { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
.timer-start-btn { background: #185FA5; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.timer-running { display: flex; align-items: center; gap: 8px; }
.timer-label { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.02em; }
.timer-display { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
.timer-display.warn { color: #f5a623; }
.timer-display.danger { color: #E24B4A; }
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0;background:#fff;padding:8px 12px;border-radius:10px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;border:none;}
.results-pill{display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;border:none;}
.quiz-area{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.q-num{font-size:0.82rem;color:#888;}
.tag-badge{font-size:0.75rem;padding:2px 10px;border-radius:10px;background:#185FA5;color:#fff;font-weight:600;}
.passage-box,.context-box{background:#f5f7fa;border-left:3px solid #185FA5;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.92rem;color:#333;line-height:1.5;}
.q-text{font-size:1.08rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{background:#e8edf4;color:#111;border:2px solid transparent;border-radius:9px;padding:11px 14px;font-size:0.95rem;text-align:left;cursor:pointer;line-height:1.4;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn:disabled{cursor:default;}
.exp-box{margin-top:12px;padding:10px 12px;background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;font-size:0.88rem;color:#333;display:none;}
.nav-btns{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
.prev-btn,.next-btn{padding:9px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;}
.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}
.r-card.correct{background:#E1F5EE;color:#085041;}
.r-card.wrong{background:#FCEBEB;color:#501313;}
.r-card.skipped{background:#f5f7fa;color:#555;}
.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}
.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}
</style>
</head>
<body><div class="quiz-title">[Sion] Advanced SAT Reading</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Read each passage, then choose the best answer.</div>

<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_20260828_v1";var ATT_KEY = "quiz_sionadvreading_12_att_20260828_v1";var RAW_QUESTIONS = [{"stem": "Based on the two texts, how would the researchers in Text 2 most likely respond to the claim in Text 1 that homework builds valuable study habits in young children?", "passage": "Text 1: Some education researchers argue that assigning regular homework in elementary school reinforces classroom lessons and builds independent study habits that benefit students throughout their academic careers.<br><br>Text 2: Other researchers contend that for young children, homework provides little measurable academic benefit and instead reduces valuable time for play, family interaction, and rest, all of which are equally important for healthy development.", "opts": ["They would likely argue that older students should never be assigned homework under any circumstances.", "They would likely agree completely, since both texts support assigning more homework to young children.", "They would likely argue that any academic benefits of homework for young children are outweighed by the loss of time for play, family, and rest.", "They would likely argue that elementary schools should eliminate classroom lessons entirely."], "ci": 2, "exp": "Text 2's claim that homework \"provides little measurable academic benefit\" while reducing time for play, family, and rest directly challenges Text 1's emphasis on study-habit benefits, supporting the correct choice. The two texts disagree, so they would not likely agree completely. Text 2 never argues against classroom lessons, only against homework's value for young children. Text 2 discusses young children specifically and says nothing about older students.", "tag": "Cross-Text Connections", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the text with the most logical and precise word?", "passage": "Although the intern's initial report contained several factual errors, her supervisor praised the ______ way she acknowledged each mistake and immediately proposed corrections rather than becoming defensive.", "opts": ["resentful", "evasive", "forthright", "indifferent"], "ci": 2, "exp": "Openly acknowledging mistakes and proposing corrections rather than becoming defensive reflects direct, honest behavior, matching \"forthright.\" \"evasive\" suggests avoiding the issue, contradicting the direct acknowledgment described. \"resentful\" suggests bitterness, which contradicts calmly proposing corrections. \"indifferent\" suggests not caring, which contradicts actively proposing corrections.", "tag": "Words in Context", "tagcolor": "#185FA5"}, {"stem": "The student wants to emphasize that the bridge's completion overcame significant doubt from experts. Which choice most effectively uses the given information to accomplish this goal?", "passage": "- Engineer Joseph Strauss proposed building a bridge across the Golden Gate strait in the 1920s.<br>- Many experts at the time doubted a bridge could withstand the strait's strong currents and frequent fog.<br>- The Golden Gate Bridge opened in 1937 and has withstood decades of use since.", "opts": ["Despite many experts doubting that a bridge could withstand the Golden Gate strait's strong currents and frequent fog, Joseph Strauss's proposed bridge opened in 1937 and has withstood decades of use since.", "Many experts at the time doubted a bridge could withstand the strait's strong currents and frequent fog.", "Engineer Joseph Strauss proposed building a bridge across the Golden Gate strait in the 1920s.", "The Golden Gate Bridge opened in 1937 and has withstood decades of use since."], "ci": 0, "exp": "Only the correct choice explicitly connects the experts' doubt to the bridge's successful completion and lasting use, which is exactly the point the student wants to emphasize. The other choices each describe only the proposal, only the doubt, or only the completion, so none of them shows the connection between the doubt and the eventual achievement.", "tag": "Rhetorical Synthesis", "tagcolor": "#185FA5"}, {"stem": "The student wants to highlight that Velcro's invention was inspired by a natural observation. Which choice most effectively combines the relevant information to accomplish this goal?", "passage": "- Swiss engineer George de Mestral noticed burrs sticking to his dog's fur after a hike in the 1940s.<br>- Examining the burrs under a microscope, he found tiny hooks that caught on fabric loops.<br>- He spent nearly a decade developing a synthetic version of this hook-and-loop system, which he named Velcro.", "opts": ["He spent nearly a decade developing a synthetic version of this hook-and-loop system, which he named Velcro.", "After noticing burrs with tiny hooks sticking to his dog's fur while hiking in the 1940s, Swiss engineer George de Mestral spent nearly a decade developing a synthetic hook-and-loop system he named Velcro.", "Examining the burrs under a microscope, he found tiny hooks that caught on fabric loops.", "Swiss engineer George de Mestral noticed burrs sticking to his dog's fur after a hike in the 1940s."], "ci": 1, "exp": "The correct choice connects the natural observation of burrs on the dog's fur directly to the eventual invention of Velcro, creating the link the student wants to highlight. The other choices each present only the initial observation, only the microscope examination, or only the years of development, not the full connection between nature and invention.", "tag": "Rhetorical Synthesis", "tagcolor": "#185FA5"}, {"stem": "Which choice best describes the relationship between the two texts?", "passage": "Text 1: Urban planners note that planting trees along city streets can reduce summer temperatures by providing shade and releasing moisture into the air through transpiration.<br><br>Text 2: However, some arborists caution that if the wrong tree species are planted, their roots can damage sidewalks and underground pipes, creating costly infrastructure repairs within a few decades.", "opts": ["Text 2 raises a potential drawback that complicates the cooling benefit Text 1 describes.", "Text 1 and Text 2 both focus mainly on the cost of planting new trees.", "Text 1 responds directly to the infrastructure concerns raised in Text 2.", "Text 2 provides additional research supporting the claim made in Text 1."], "ci": 0, "exp": "Text 1 emphasizes a cooling benefit, while Text 2 raises an infrastructure-damage drawback, making the correct choice accurate. Text 2 challenges rather than supports Text 1's claim. Neither text focuses mainly on planting costs. Text 1 is presented independently and does not respond to Text 2's concerns.", "tag": "Cross-Text Connections", "tagcolor": "#185FA5"}, {"stem": "Which finding would most strongly support the researcher's claim?", "passage": "A researcher claims that a new fertilizer blend allows corn crops to thrive with significantly less irrigation.", "opts": ["The fertilizer blend was manufactured using recycled packaging materials.", "Fields treated with the fertilizer blend required 20 percent less irrigation water to produce the same crop yield as untreated fields.", "Farmers said the fertilizer blend was easy to spread evenly across their fields.", "The fertilizer blend had a milder scent than other fertilizers on the market."], "ci": 1, "exp": "Since the claim is specifically about reduced irrigation needs, a controlled comparison of water used per equal crop yield most strongly supports it. Scent doesn't measure irrigation needs. Recycled packaging is unrelated to how much water crops require. Ease of spreading doesn't demonstrate any change in irrigation needs.", "tag": "Command of Evidence", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the text with the most logical and precise word?", "passage": "The negotiations remained ______ for weeks, with neither side willing to offer any concessions or even schedule a follow-up meeting.", "opts": ["amicable", "productive", "stalled", "concluded"], "ci": 2, "exp": "Neither side offering concessions or scheduling further meetings describes negotiations that have come to a halt, matching \"stalled.\" \"productive\" suggests progress was being made, contradicting the lack of concessions or meetings. \"amicable\" describes a friendly tone, which the text never mentions either way. \"concluded\" would mean the negotiations had ended, but the text describes them continuing without progress, not ending.", "tag": "Words in Context", "tagcolor": "#185FA5"}, {"stem": "Which choice best states the main idea of the text?", "passage": "Contrary to the popular saying that someone is \"blind as a bat,\" most bat species actually have functional eyesight capable of detecting motion and shapes in dim light. However, many bats rely primarily on echolocation, emitting rapid ultrasonic clicks and interpreting the returning echoes, because this method allows them to build a detailed three-dimensional map of their surroundings in complete darkness, where vision alone would be far less reliable for catching fast-moving insects.", "opts": ["Bats are completely blind and depend entirely on echolocation for survival.", "Echolocation is generally less effective than eyesight for hunting insects in the dark.", "Most bat species have lost the ability to hear ultrasonic frequencies over time.", "Although bats can see, many rely mainly on echolocation because it provides more reliable navigation and hunting information in total darkness than eyesight alone."], "ci": 3, "exp": "The text explains that bats have working eyesight but rely mainly on echolocation because it works better in total darkness, matching the correct choice. The text states bats have functional eyesight, not that they are completely blind. It describes echolocation as more reliable than vision in darkness, not less effective. It never suggests bats have lost the ability to hear ultrasonic frequencies.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}, {"stem": "Which finding, if true, would most directly support the engineer's claim?", "passage": "A city engineer claims that a new adaptive traffic-light timing algorithm reduces average commute times during rush hour.", "opts": ["Drivers reported that the new traffic lights looked more visually modern.", "Average rush-hour commute times measured on streets using the new algorithm were 15 percent shorter than on comparable streets still using the old fixed-timing system.", "The city held a public event to introduce the new algorithm to residents.", "The new algorithm was less expensive to install than the previous traffic-light system."], "ci": 1, "exp": "Since the claim is specifically about reduced commute times, a direct, controlled comparison of measured commute times most directly supports it. Visual appearance doesn't measure commute time. Installation cost is unrelated to how long commutes take. A public event describes an announcement, not evidence of an effect on commute times.", "tag": "Command of Evidence", "tagcolor": "#185FA5"}, {"stem": "Which choice best states the main purpose of the text?", "passage": "Archaeologists have discovered pots of honey in ancient Egyptian tombs that remain edible thousands of years later. This remarkable preservation results from honey's unique chemistry: its low moisture content and high acidity create an environment hostile to the bacteria and fungi that typically cause food to spoil, and bees further reduce the water content by fanning the nectar with their wings before capping it in wax cells.", "opts": ["To explain the chemical properties that allow honey to remain edible for thousands of years.", "To compare the taste of honey to other foods found in ancient tombs.", "To describe how ancient Egyptians constructed their burial tombs.", "To argue that bee populations should be protected from extinction."], "ci": 0, "exp": "The text focuses on honey's low moisture and high acidity, explaining why it resists spoilage for so long, matching the correct choice. Tomb construction is only mentioned as the location where the honey was found, not the text's focus. The text never argues for protecting bee populations. It never compares honey's taste to other foods.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}, {"stem": "Which choice most logically completes the text?", "passage": "Ornithologists tracking migratory songbirds have found that species relying primarily on day length to trigger their spring migration often arrive at breeding grounds before the peak emergence of the insects they depend on for food, since insect emergence is now triggered mainly by rising temperatures that shift earlier as the climate warms, while day length remains fixed from year to year. If a species of songbird were found to rely on day length rather than temperature to time its migration, researchers would most likely predict that this species would ______.", "opts": ["increasingly arrive too early to take full advantage of the earlier insect emergence", "begin using temperature instead of day length to time its migration immediately", "consistently arrive at exactly the same time as peak insect emergence every year", "stop migrating to its breeding grounds altogether within a few years"], "ci": 0, "exp": "Since day length stays fixed while insect emergence shifts earlier with warming temperatures, a day-length-triggered species would increasingly arrive too early relative to peak insect emergence, matching the correct choice. The passage describes a growing mismatch, not consistent alignment. Nothing in the passage suggests the species would stop migrating entirely. The passage describes day length as the species' fixed cue, giving no evidence it would immediately switch to temperature.", "tag": "Inferences", "tagcolor": "#185FA5"}, {"stem": "Which choice most logically completes the text?", "passage": "Dendrochronologists studying tree rings have found that trees generally produce wider growth rings during years with abundant rainfall and narrower rings during years of drought, since water availability directly affects how much new wood a tree can produce each growing season. If researchers examined a cross-section of an ancient tree and found an unusually narrow ring corresponding to a particular year, they would most likely conclude that the region experienced ______.", "opts": ["a wildfire that damaged the tree's outer bark", "an infestation of insects that ate the tree's leaves", "a period of unusually low rainfall that year", "an unusually cold winter with heavy snowfall"], "ci": 2, "exp": "Since narrow rings are directly linked to reduced water availability, an unusually narrow ring would most logically indicate a year of low rainfall, matching the correct choice. The passage connects ring width to rainfall specifically, not winter temperature or snowfall. It never connects ring width to bark damage from fire. It never connects ring width to insect damage on leaves.", "tag": "Inferences", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
