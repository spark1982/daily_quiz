<script>var TITLE = "[Sion] Algebra 2";var QUIZ_KEY = "quiz_sionalgebra2_10_20260828_v1";var ATT_KEY = "quiz_sionalgebra2_10_att_20260828_v1";var RAW_QUESTIONS = [{"stem": "Multiply: (3 + 2i)(4 &minus; i)", "opts": ["14 + 5i", "14 &minus; 5i", "6 + 5i", "10 + 5i"], "ci": 0, "exp": "Using FOIL: (3)(4) + (3)(&minus;i) + (2i)(4) + (2i)(&minus;i) = 12 &minus; 3i + 8i &minus; 2i&sup2;. Since i&sup2; = &minus;1, &minus;2i&sup2; = 2, giving 12 + 5i + 2 = 14 + 5i.", "tag": "Complex Numbers - Multiplication", "tagcolor": "#185FA5"}, {"stem": "What are the coordinates of the foci of the ellipse <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">25</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">9</span></span> = 1?", "opts": ["(3, 0) and (&minus;3, 0)", "(0, 4) and (0, &minus;4)", "(5, 0) and (&minus;5, 0)", "(4, 0) and (&minus;4, 0)"], "ci": 3, "exp": "Here a&sup2; = 25 and b&sup2; = 9, so c&sup2; = a&sup2; &minus; b&sup2; = 25 &minus; 9 = 16, giving c = 4. Since the larger denominator is under x&sup2;, the major axis is horizontal, so the foci are at (4, 0) and (&minus;4, 0).", "tag": "Ellipses - Equation & Classification", "tagcolor": "#185FA5"}, {"stem": "What are the coordinates of the foci of the hyperbola <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">16</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">9</span></span> = 1?", "opts": ["(4, 0) and (&minus;4, 0)", "(5, 0) and (&minus;5, 0)", "(0, 5) and (0, &minus;5)", "(3, 0) and (&minus;3, 0)"], "ci": 1, "exp": "Here a&sup2; = 16 and b&sup2; = 9, and for a hyperbola c&sup2; = a&sup2; + b&sup2; = 16 + 9 = 25, giving c = 5. Since the x&sup2; term is positive, the transverse axis is horizontal, so the foci are at (5, 0) and (&minus;5, 0).", "tag": "Hyperbolas - Equation & Classification", "tagcolor": "#185FA5"}, {"stem": "In the right triangle below, the side opposite angle A measures 8, and the hypotenuse measures 17. What is cos(A)?<br><svg width=\"220\" height=\"160\" viewBox=\"0 0 220 160\" style=\"display:block;margin:10px auto;\"><polygon points=\"20,140 190,140 190,20\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"205\" y=\"85\" font-size=\"12\" fill=\"#333\" text-anchor=\"middle\">8</text><text x=\"95\" y=\"72\" font-size=\"12\" fill=\"#185FA5\" text-anchor=\"middle\">17</text><text x=\"27\" y=\"132\" font-size=\"13\" fill=\"#E24B4A\" font-weight=\"bold\">A</text><rect x=\"176\" y=\"128\" width=\"14\" height=\"12\" fill=\"none\" stroke=\"#333\"/></svg>", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">17</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>8</span><span style=\"border-top:1.4px solid #111;\">15</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>17</span><span style=\"border-top:1.4px solid #111;\">15</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>8</span><span style=\"border-top:1.4px solid #111;\">17</span></span>"], "ci": 0, "exp": "First find the adjacent side using the Pythagorean theorem: adjacent = &radic;(17&sup2; &minus; 8&sup2;) = &radic;(289 &minus; 64) = &radic;(225) = 15. Then cos(A) = adjacent &divide; hypotenuse = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">17</span></span>.", "tag": "Trigonometric Ratios - Right Triangle", "tagcolor": "#185FA5"}, {"stem": "A ball's height in feet is modeled by h(t) = &minus;16t&sup2; + 64t + 5, where t is time in seconds. What is the ball's maximum height?<br><svg width=\"220\" height=\"150\" viewBox=\"0 0 220 150\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"130\" x2=\"210\" y2=\"130\" stroke=\"#999\" stroke-width=\"1\"/><path d=\"M 20 125 Q 110 10 200 125\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"2.5\"/><circle cx=\"110\" cy=\"18\" r=\"4\" fill=\"#E24B4A\"/><text x=\"110\" y=\"10\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\">max height</text><text x=\"20\" y=\"145\" font-size=\"10\" fill=\"#333\" text-anchor=\"middle\">t=0</text><text x=\"200\" y=\"145\" font-size=\"10\" fill=\"#333\" text-anchor=\"middle\">t</text></svg>", "opts": ["128 feet", "69 feet", "64 feet", "5 feet"], "ci": 1, "exp": "The maximum occurs at the vertex, where t = &minus;b &divide; 2a = &minus;64 &divide; (2 &times; &minus;16) = 2 seconds. Substituting t = 2: h(2) = &minus;16(4) + 64(2) + 5 = &minus;64 + 128 + 5 = 69 feet.", "tag": "Quadratic Functions - Optimization", "tagcolor": "#185FA5"}, {"stem": "Write the standard form equation of a circle with center (3, &minus;2) and radius 5.<br><svg width=\"180\" height=\"180\" viewBox=\"0 0 180 180\" style=\"display:block;margin:10px auto;\"><circle cx=\"90\" cy=\"90\" r=\"60\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.5\"/><circle cx=\"90\" cy=\"90\" r=\"3\" fill=\"#E24B4A\"/><line x1=\"90\" y1=\"90\" x2=\"150\" y2=\"90\" stroke=\"#E24B4A\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><text x=\"120\" y=\"84\" font-size=\"11\" fill=\"#E24B4A\" text-anchor=\"middle\">r = 5</text><text x=\"90\" y=\"108\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\">(3, &minus;2)</text></svg>", "opts": ["(x &minus; 3)&sup2; &minus; (y + 2)&sup2; = 25", "(x &minus; 3)&sup2; + (y + 2)&sup2; = 25", "(x &minus; 3)&sup2; + (y + 2)&sup2; = 5", "(x + 3)&sup2; + (y &minus; 2)&sup2; = 25"], "ci": 1, "exp": "The standard form of a circle is (x &minus; h)&sup2; + (y &minus; k)&sup2; = r&sup2;, where (h, k) is the center. With center (3, &minus;2), h = 3 and k = &minus;2, so the equation uses (x &minus; 3)&sup2; + (y + 2)&sup2;. The radius is 5, so r&sup2; = 25, giving (x &minus; 3)&sup2; + (y + 2)&sup2; = 25.", "tag": "Circles - Standard Form Equation", "tagcolor": "#185FA5"}, {"stem": "Simplify: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2; &minus; 9</span><span style=\"border-top:1.4px solid #111;\">x&sup2; + x &minus; 6</span></span>", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x + 3</span><span style=\"border-top:1.4px solid #111;\">x &minus; 2</span></span>", "x &minus; 3", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x &minus; 3</span><span style=\"border-top:1.4px solid #111;\">x + 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x &minus; 3</span><span style=\"border-top:1.4px solid #111;\">x &minus; 2</span></span>"], "ci": 3, "exp": "Factor both parts: the numerator x&sup2; &minus; 9 = (x &minus; 3)(x + 3), and the denominator x&sup2; + x &minus; 6 = (x + 3)(x &minus; 2). The common factor (x + 3) cancels, leaving <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x &minus; 3</span><span style=\"border-top:1.4px solid #111;\">x &minus; 2</span></span> (with x &ne; &minus;3 and x &ne; 2).", "tag": "Rational Expressions - Simplifying", "tagcolor": "#185FA5"}, {"stem": "Solve for x: 3<sup>2x &minus; 1</sup> = 27", "opts": ["x = 4", "x = 1", "x = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "x = 2"], "ci": 3, "exp": "Rewrite 27 as a power of 3: 27 = 3&sup3;. Since the bases match, set the exponents equal: 2x &minus; 1 = 3, so 2x = 4, giving x = 2.", "tag": "Exponential Equations - Solving", "tagcolor": "#185FA5"}, {"stem": "Find the zeros of f(x) = x&sup3; &minus; 4x&sup2; &minus; 11x + 30.", "opts": ["x = 2, x = &minus;5, and x = 3", "x = 2, x = 5, and x = &minus;3", "x = &minus;2, x = &minus;5, and x = 3", "x = 3, x = 5, and x = &minus;2"], "ci": 1, "exp": "Testing x = 2 shows it is a root: 8 &minus; 16 &minus; 22 + 30 = 0. Dividing gives x&sup3; &minus; 4x&sup2; &minus; 11x + 30 = (x &minus; 2)(x&sup2; &minus; 2x &minus; 15) = (x &minus; 2)(x &minus; 5)(x + 3). Setting each factor to zero gives x = 2, x = 5, and x = &minus;3.", "tag": "Polynomial Functions - Zeros", "tagcolor": "#185FA5"}, {"stem": "What is the domain of f(x) = &radic;(2x &minus; 6)?", "opts": ["x &ge; 3", "x &le; 3", "x &gt; 3", "x &ge; 6"], "ci": 0, "exp": "Since the expression under a square root cannot be negative, we need 2x &minus; 6 &ge; 0. Solving gives 2x &ge; 6, so x &ge; 3.", "tag": "Radical Functions - Domain & Range", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';

  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
