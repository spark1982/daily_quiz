</style>

<script>var TITLE = "[Sion] SAT Vocabulary";var QUIZ_KEY = "quiz_satvocab_20_20260828_v1";var ATT_KEY = "quiz_satvocab_20_att_20260828_v1";var RAW_QUESTIONS = [{"stem": "Which is the best definition of \"<b>equivocal</b>\"?", "opts": ["to change from a liquid into a thickened or solid mass; to clot", "open to more than one interpretation; deliberately ambiguous or misleading", "to expose the falseness of a belief, claim, or myth", "shining brightly; radiant"], "ci": 1, "exp": "\"equivocal\" means: open to more than one interpretation; deliberately ambiguous or misleading.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>monotony</b>\"?", "opts": ["happening in a way that is contrary to what would normally be expected", "a person who flatters someone powerful in order to gain personal advantage", "tedious repetition or a lack of variety; wearisome sameness", "to expose the falseness of a belief, claim, or myth"], "ci": 2, "exp": "\"monotony\" means: tedious repetition or a lack of variety; wearisome sameness.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>arbitration</b>\"?", "opts": ["the process of settling a dispute by referring it to an impartial third party for a binding decision", "favorable; giving a good indication of a successful outcome", "to expose the falseness of a belief, claim, or myth", "shining brightly; radiant"], "ci": 0, "exp": "\"arbitration\" means: the process of settling a dispute by referring it to an impartial third party for a binding decision.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>effulgent</b>\"?", "opts": ["shining brightly; radiant", "an authoritative warning or order; a court order that restrains a specific action", "a strong inclination or prejudice for or against something, often in an unfair way", "open to more than one interpretation; deliberately ambiguous or misleading"], "ci": 0, "exp": "\"effulgent\" means: shining brightly; radiant.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>propitious</b>\"?", "opts": ["open to more than one interpretation; deliberately ambiguous or misleading", "a strong inclination or prejudice for or against something, often in an unfair way", "tedious repetition or a lack of variety; wearisome sameness", "favorable; giving a good indication of a successful outcome"], "ci": 3, "exp": "\"propitious\" means: favorable; giving a good indication of a successful outcome.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>ironic</b>\"?", "opts": ["to expose the falseness of a belief, claim, or myth", "happening in a way that is contrary to what would normally be expected", "favorable; giving a good indication of a successful outcome", "complete with regard to every detail; not superficial or partial"], "ci": 1, "exp": "\"ironic\" means: happening in a way that is contrary to what would normally be expected.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>furtive</b>\"?", "opts": ["to free someone or something from a constraint, difficulty, or entanglement", "to expose the falseness of a belief, claim, or myth", "attempting to avoid notice or attention, typically because of guilt; secretive", "the quality of being open, honest, and straightforward in speech"], "ci": 2, "exp": "\"furtive\" means: attempting to avoid notice or attention, typically because of guilt; secretive.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>extricate</b>\"?", "opts": ["an excessive or overabundant amount of something", "to free someone or something from a constraint, difficulty, or entanglement", "open to more than one interpretation; deliberately ambiguous or misleading", "an authoritative warning or order; a court order that restrains a specific action"], "ci": 1, "exp": "\"extricate\" means: to free someone or something from a constraint, difficulty, or entanglement.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>coagulate</b>\"?", "opts": ["an authoritative warning or order; a court order that restrains a specific action", "happening in a way that is contrary to what would normally be expected", "a person who flatters someone powerful in order to gain personal advantage", "to change from a liquid into a thickened or solid mass; to clot"], "ci": 3, "exp": "\"coagulate\" means: to change from a liquid into a thickened or solid mass; to clot.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>injunction</b>\"?", "opts": ["to free someone or something from a constraint, difficulty, or entanglement", "friendly, pleasant, and easy to get along with", "attempting to avoid notice or attention, typically because of guilt; secretive", "an authoritative warning or order; a court order that restrains a specific action"], "ci": 3, "exp": "\"injunction\" means: an authoritative warning or order; a court order that restrains a specific action.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>plethora</b>\"?", "opts": ["the process of settling a dispute by referring it to an impartial third party for a binding decision", "friendly, pleasant, and easy to get along with", "severe or strict in manner or appearance; plain and without luxury", "an excessive or overabundant amount of something"], "ci": 3, "exp": "\"plethora\" means: an excessive or overabundant amount of something.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>debunk</b>\"?", "opts": ["open to more than one interpretation; deliberately ambiguous or misleading", "complete with regard to every detail; not superficial or partial", "tending to obstruct or harm; unfriendly or hostile in nature", "to expose the falseness of a belief, claim, or myth"], "ci": 3, "exp": "\"debunk\" means: to expose the falseness of a belief, claim, or myth.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>candor</b>\"?", "opts": ["the quality of being open, honest, and straightforward in speech", "attempting to avoid notice or attention, typically because of guilt; secretive", "unnecessary, especially because there is already more than enough", "tending to obstruct or harm; unfriendly or hostile in nature"], "ci": 0, "exp": "\"candor\" means: the quality of being open, honest, and straightforward in speech.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>sycophant</b>\"?", "opts": ["attempting to avoid notice or attention, typically because of guilt; secretive", "favorable; giving a good indication of a successful outcome", "the quality of being open, honest, and straightforward in speech", "a person who flatters someone powerful in order to gain personal advantage"], "ci": 3, "exp": "\"sycophant\" means: a person who flatters someone powerful in order to gain personal advantage.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>inimical</b>\"?", "opts": ["a person who flatters someone powerful in order to gain personal advantage", "unnecessary, especially because there is already more than enough", "favorable; giving a good indication of a successful outcome", "tending to obstruct or harm; unfriendly or hostile in nature"], "ci": 3, "exp": "\"inimical\" means: tending to obstruct or harm; unfriendly or hostile in nature.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>superfluous</b>\"?", "opts": ["attempting to avoid notice or attention, typically because of guilt; secretive", "to change from a liquid into a thickened or solid mass; to clot", "unnecessary, especially because there is already more than enough", "severe or strict in manner or appearance; plain and without luxury"], "ci": 2, "exp": "\"superfluous\" means: unnecessary, especially because there is already more than enough.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>austere</b>\"?", "opts": ["friendly, pleasant, and easy to get along with", "severe or strict in manner or appearance; plain and without luxury", "a strong inclination or prejudice for or against something, often in an unfair way", "the quality of being open, honest, and straightforward in speech"], "ci": 1, "exp": "\"austere\" means: severe or strict in manner or appearance; plain and without luxury.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>bias</b>\"?", "opts": ["to free someone or something from a constraint, difficulty, or entanglement", "favorable; giving a good indication of a successful outcome", "to expose the falseness of a belief, claim, or myth", "a strong inclination or prejudice for or against something, often in an unfair way"], "ci": 3, "exp": "\"bias\" means: a strong inclination or prejudice for or against something, often in an unfair way.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>amiable</b>\"?", "opts": ["unnecessary, especially because there is already more than enough", "to change from a liquid into a thickened or solid mass; to clot", "an excessive or overabundant amount of something", "friendly, pleasant, and easy to get along with"], "ci": 3, "exp": "\"amiable\" means: friendly, pleasant, and easy to get along with.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>thorough</b>\"?", "opts": ["tedious repetition or a lack of variety; wearisome sameness", "attempting to avoid notice or attention, typically because of guilt; secretive", "complete with regard to every detail; not superficial or partial", "an excessive or overabundant amount of something"], "ci": 2, "exp": "\"thorough\" means: complete with regard to every detail; not superficial or partial.", "tag": "Review", "tagcolor": "#f5a623"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }

function render(){

  qa.style.display='block';

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];

  var expDiv = document.getElementById('exp-box');

    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
