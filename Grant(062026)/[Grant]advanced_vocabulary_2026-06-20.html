<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Advanced Vocabulary</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#f0f3f7; margin:0; padding:0; color:#222; }
  .wrap { max-width:640px; margin:0 auto; padding:18px 14px 60px; }
  h1 { font-size:1.25rem; text-align:center; color:#1D9E75; margin:6px 0 2px; }
  .date { text-align:center; font-size:0.82rem; color:#888; margin-bottom:6px; }
  .instruction { text-align:center; font-size:0.88rem; color:#555; padding:6px 12px 10px; background:#f0f3f7; }
  #nav-bar { display:flex; align-items:center; gap:8px; margin:12px 0; }
  #nav-count { font-size:13px; white-space:nowrap; color:#555; }
  .prog-track { background:#d7dde6; border-radius:3px; height:6px; flex:1; margin:0 10px; }
  .prog-fill { background:#1D9E75; border-radius:3px; height:6px; width:0%; transition:width 0.2s; }
  #jump-btn { font-size:12px; padding:4px 10px; border:1px solid #1D9E75; border-radius:14px; background:#fff; color:#1D9E75; cursor:pointer; white-space:nowrap; }
  #dot-panel { display:none; max-height:170px; overflow-y:auto; padding:8px; background:#fff; border-radius:8px; margin-bottom:8px; }
  .card { background:#fff; border-radius:14px; padding:18px 16px; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:14px; }
  .word-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .word-text { font-size:1.5rem; font-weight:700; color:#1D9E75; }
  .tag-badge { display:inline-block; font-size:0.7rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-left:6px; vertical-align:middle; }
  .speak-btn { border:none; background:#e5f6ef; color:#1D9E75; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:0.95rem; }
  .q-context { font-style:italic; background:#f3faf6; border-left:3px solid #1D9E75; padding:10px 12px; border-radius:6px; margin-bottom:14px; font-size:0.95rem; color:#333; }
  .q-prompt { font-size:0.92rem; color:#555; margin-bottom:10px; }
  .opt-btn { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px; border:1.5px solid #d7dde6; border-radius:9px; background:#fff; font-size:0.95rem; cursor:pointer; }
  .opt-btn.correct { background:#E1F5EE; border-color:#1D9E75; color:#0c5132; font-weight:600; }
  .opt-btn.wrong { background:#FBE9E7; border-color:#E24B4A; color:#7a1d1c; font-weight:600; }
  .opt-btn.disabledbtn { cursor:default; }
  .exp-box { margin-top:6px; padding:11px 13px; background:#fff7e6; border-left:3px solid #f5a623; border-radius:6px; font-size:0.88rem; color:#5a4310; line-height:1.5; }
  .nav-btns { display:flex; gap:10px; margin-top:14px; }
  .nav-btns button { flex:1; padding:11px; border:none; border-radius:9px; background:#1D9E75; color:#fff; font-size:0.95rem; cursor:pointer; }
  .nav-btns button:disabled { background:#b9c6d4; cursor:default; }
  .results-card { text-align:center; }
  .score-big { font-size:2.4rem; font-weight:800; color:#1D9E75; margin:8px 0; }
  #retryWrongBtn { display:block; width:100%; padding:13px; background:#1D9E75; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .res-btn-copy { display:block; width:100%; padding:13px; background:#7b61ff; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .res-btn-fresh { display:block; width:100%; padding:13px; background:#888; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; }
  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; z-index:50; }
  .modal-box { background:#fff; border-radius:14px; padding:22px; max-width:300px; text-align:center; }
  .modal-box p { font-size:0.95rem; color:#333; margin-bottom:18px; }
  .modal-btns { display:flex; gap:10px; }
  .modal-btns button { flex:1; padding:10px; border:none; border-radius:8px; font-size:0.9rem; cursor:pointer; }
  .modal-btn-cancel { background:#e5e8ec; color:#333; }
  .modal-btn-confirm { background:#E24B4A; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>[Grant] Advanced Vocabulary</h1>
  <div class="date">2026-06-20</div>
  <div class="instruction">Choose the best meaning of each word based on its context.</div>

  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>

  <div id="quiz-area"></div>
  <div id="results-area" style="display:none;"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <p>Are you sure you want to clear all progress and start fresh?</p>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="closeFreshModal()">Cancel</button>
      <button class="modal-btn-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>

<script>
(function(){
  var DATE_GEN = '20260619';
  var QUIZ_KEY = 'quiz_grantadvvocab_20_' + DATE_GEN + '_v1';
  var ATT_KEY  = 'quiz_grantadvvocab_att_' + DATE_GEN + '_v1';

  var qs = [
    { tag:'New', stem:'amendment', sent:"Congress passed an amendment to the original law after several citizens raised concerns about it.",
      opts:['a complete and total rejection of a law','a formal change or addition made to a law or document','a yearly report on government spending','a private meeting between two officials'], ci:1,
      exp:"An amendment is a formal change or addition made to a law or document, matching Congress changing the original law." },
    { tag:'New', stem:'universal', sent:"Clean water is considered a universal need, no matter where people live.",
      opts:['found only in a single country or region','true for a short period of time only','agreed upon by a small group of experts','true or applicable everywhere, without exception'], ci:3,
      exp:"Universal means true or applicable everywhere, matching the need for clean water no matter where people live." },
    { tag:'New', stem:'conflict', sent:"The conflict between the two neighboring countries lasted for nearly a decade.",
      opts:['a serious disagreement or struggle','a friendly agreement between two parties','a detailed plan for the future','a formal celebration of a shared goal'], ci:0,
      exp:"A conflict is a serious disagreement or struggle, matching the long dispute between the two countries." },
    { tag:'New', stem:'approximate', sent:"The scientist gave an approximate count of the population, since an exact number was impossible to find.",
      opts:['completely exact and verified','based entirely on guessing with no data','close to exact, but not completely precise; estimated','measured using outdated tools'], ci:2,
      exp:"Approximate means close to exact but not completely precise, matching the estimated count when an exact number was not possible." },
    { tag:'New', stem:'mandate', sent:"The new law gave the agency a clear mandate to reduce pollution in the river.",
      opts:['a friendly suggestion with no requirement to follow it','an official order or authority to take action','a record of past decisions','a public apology for a mistake'], ci:1,
      exp:"A mandate is an official order or authority to act, matching the law giving the agency authority to reduce pollution." },
    { tag:'New', stem:'affirmative', sent:"When asked if she would help, she gave an affirmative answer right away.",
      opts:['expressing strong disagreement','showing confusion about a question','asking for more time to decide','expressing agreement or a yes response'], ci:3,
      exp:"Affirmative means expressing agreement, matching her quick yes answer when asked for help." },
    { tag:'Review', stem:'mechanism', sent:"The clock's mechanism includes dozens of tiny gears that work together to keep accurate time.",
      opts:['a written set of rules for a game','a single tool used for one specific task','a system of parts that work together, or the process by which something happens','a building used to store machines'], ci:2,
      exp:"A mechanism is a system of parts working together, matching the dozens of gears that work together inside the clock." },
    { tag:'New', stem:'allegiance', sent:"Every soldier swears an oath of allegiance to defend the country.",
      opts:['loyalty or commitment to a person, group, or cause','a formal complaint filed against someone','a temporary agreement that can be broken anytime','a payment made in exchange for service'], ci:0,
      exp:"Allegiance is loyalty or commitment to a cause, matching the soldier's oath to defend the country." },
    { tag:'Review', stem:'flourish', sent:"The small business began to flourish once it started selling products online.",
      opts:['to shrink in size or importance','to grow or develop successfully; to thrive','to remain exactly the same over time','to fail despite repeated efforts'], ci:1,
      exp:"To flourish means to grow or thrive successfully, matching the small business doing well after selling online." },
    { tag:'New', stem:'advantage', sent:"Her years of experience gave her a clear advantage over the other job candidates.",
      opts:['a disadvantage that must be overcome','a rule that applies equally to everyone','a financial cost that must be paid','a favorable condition that gives someone an edge over others'], ci:3,
      exp:"An advantage is a favorable condition that gives someone an edge, matching her experience helping her stand out among candidates." },
    { tag:'New', stem:'allocation', sent:"The city council debated the allocation of funds for new school playgrounds.",
      opts:['the act of distributing resources for a specific purpose','the total amount of money a business earns in a year','a written agreement between two companies','the process of collecting taxes from citizens'], ci:0,
      exp:"Allocation is the act of distributing resources for a purpose, matching the council deciding how to distribute funds for playgrounds." },
    { tag:'New', stem:'accurate', sent:"The weather forecast turned out to be accurate, since it rained exactly when predicted.",
      opts:['based on a rough guess rather than facts','written in a clear and simple style','free from errors; exactly correct','shared widely among many people'], ci:2,
      exp:"Accurate means free from errors and exactly correct, matching the forecast that rained exactly as predicted." },
    { tag:'New', stem:'apparatus', sent:"The lab apparatus included tubes, beakers, and a small burner for the experiment.",
      opts:['a written report describing an experiment','a group of scientists working on a project','a building where experiments take place','a set of equipment or materials used for a particular purpose'], ci:3,
      exp:"Apparatus is a set of equipment used for a purpose, matching the tubes, beakers, and burner used in the lab." },
    { tag:'Review', stem:'sustainability', sent:"The farm's focus on sustainability meant using methods that would not exhaust the soil for future generations.",
      opts:['the speed at which a resource can be used up completely','the ability to meet needs without depleting resources for the future','a one-time donation toward an environmental cause','the cost of producing a single item'], ci:1,
      exp:"Sustainability is the ability to meet needs without depleting future resources, matching the farm's methods that protect the soil for the future." },
    { tag:'New', stem:'analyze', sent:"Scientists analyzed the soil samples to determine why the crops were failing.",
      opts:['to examine something carefully in order to understand it','to ignore the details of a problem entirely','to guess an answer without checking the evidence','to copy results that another person already published'], ci:0,
      exp:"To analyze means to examine something carefully to understand it, matching the scientists studying the soil samples." },
    { tag:'New', stem:'biodiversity', sent:"The rainforest is known for its incredible biodiversity, home to thousands of unique species.",
      opts:['the total weight of all living things in an area','a single species that dominates an ecosystem','the variety of plant and animal life in a habitat','the chemical makeup of soil and rock'], ci:2,
      exp:"Biodiversity is the variety of plant and animal life in a habitat, matching the rainforest's thousands of unique species." },
    { tag:'New', stem:'adaptation', sent:"The thick fur of the arctic fox is an adaptation that helps it survive freezing temperatures.",
      opts:['a sudden and permanent injury to an organism','a behavior learned only through training by humans','a disease that spreads quickly between species','a change that helps an organism survive in its environment'], ci:3,
      exp:"An adaptation is a change that helps an organism survive, matching the arctic fox's thick fur helping it survive the cold." },
    { tag:'Review', stem:'abolish', sent:"Reformers worked for decades before the unjust law was finally abolished.",
      opts:['to formally put an end to a law or system','to gradually improve a law over many years','to temporarily pause a system for review','to create a brand new law from scratch'], ci:0,
      exp:"To abolish means to formally put an end to a law, matching the reformers finally ending the unjust law." },
    { tag:'New', stem:'aesthetic', sent:"The architect chose materials based on both their strength and their aesthetic appeal.",
      opts:['relating to the cost of building materials','relating to beauty or the appreciation of beauty','relating to the safety of a structure','relating to the speed of construction'], ci:1,
      exp:"Aesthetic relates to beauty or the appreciation of beauty, matching the architect considering how the materials would look." },
    { tag:'Review', stem:'extinction', sent:"Hunting and habitat loss pushed the species to the edge of extinction.",
      opts:['a temporary drop in the population of a species','the process of a species moving to a new habitat','the complete disappearance of a species','a sudden increase in the population of a species'], ci:2,
      exp:"Extinction is the complete disappearance of a species, matching the species being pushed to that point by hunting and habitat loss." }
  ];

  var state = { idx:0, answers:{} };
  function loadState(){
    try {
      var raw = localStorage.getItem(QUIZ_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.idx = parsed.idx || 0;
        state.answers = parsed.answers || {};
      }
    } catch(e){}
  }
  function saveState(){
    try { localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); } catch(e){}
  }
  function bumpAttempt(){
    try {
      var n = parseInt(localStorage.getItem(ATT_KEY) || '0', 10);
      localStorage.setItem(ATT_KEY, String(n+1));
    } catch(e){}
  }

  function speak(word){
    try {
      if ('speechSynthesis' in window) {
        var u = new SpeechSynthesisUtterance(word);
        window.speechSynthesis.speak(u);
      }
    } catch(e){}
  }

  function answered(){ return Object.keys(state.answers).length; }

  function updateNav(){
    var a = answered();
    document.getElementById('nav-count').textContent = a + ' / ' + qs.length;
    document.getElementById('prog-fill').style.width = (a/qs.length*100).toFixed(1)+'%';
    renderDots();
  }

  function renderDots(){
    var panel = document.getElementById('dot-panel');
    var html = '';
    qs.forEach(function(q,i){
      var picked = state.answers[i];
      var bg = picked===undefined ? '#d7dde6' : (picked===q.ci ? '#1D9E75' : '#E24B4A');
      html += '<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
    });
    panel.innerHTML = html;
  }

  function toggleJump(){
    var panel = document.getElementById('dot-panel');
    var btn = document.getElementById('jump-btn');
    if (panel.style.display === 'none' || !panel.style.display) {
      panel.style.display = 'block'; btn.textContent = 'Hide ▴'; renderDots();
    } else {
      panel.style.display = 'none'; btn.textContent = 'Jump ▾';
    }
  }

  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(){
    if (answered() >= qs.length && state.showResults) { renderResults(); return; }
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('results-area').style.display = 'none';
    var i = state.idx;
    var q = qs[i];
    var picked = state.answers[i];
    var tagColor = q.tag === 'Review' ? '#f5a623' : '#1D9E75';
    var html = '<div class="card">';
    html += '<div class="word-row"><span class="word-text">'+escHtml(q.stem)+'</span>';
    html += '<button class="speak-btn" onclick="speak(\''+q.stem.replace(/'/g,"\\'")+'\')">&#128266;</button>';
    html += '<span class="tag-badge" style="background:'+tagColor+'">'+q.tag+'</span></div>';
    html += '<div class="q-prompt">Question '+(i+1)+' of '+qs.length+'. What does this word mean in context?</div>';
    html += '<div class="q-context">'+escHtml(q.sent)+'</div>';
    q.opts.forEach(function(opt, oi){
      var cls = 'opt-btn';
      if (picked !== undefined) {
        cls += ' disabledbtn';
        if (oi === q.ci) cls += ' correct';
        else if (oi === picked) cls += ' wrong';
      }
      html += '<button class="'+cls+'" onclick="pick('+oi+')" '+(picked!==undefined?'disabled':'')+'>'+escHtml(opt)+'</button>';
    });
    if (picked !== undefined && picked !== q.ci) {
      html += '<div class="exp-box">'+escHtml(q.exp)+'</div>';
    }
    html += '</div>';
    html += '<div class="nav-btns">';
    html += '<button onclick="go(-1)" '+(i===0?'disabled':'')+'>Prev</button>';
    if (i === qs.length-1) {
      html += '<button onclick="finishQuiz()">See Results &rarr;</button>';
    } else {
      html += '<button onclick="go(1)">Next</button>';
    }
    html += '</div>';
    document.getElementById('quiz-area').innerHTML = html;
    updateNav();
  }

  function pick(oi){
    var i = state.idx;
    if (state.answers[i] !== undefined) return;
    state.answers[i] = oi;
    saveState();
    render();
  }
  function go(dir){
    var ni = state.idx + dir;
    if (ni < 0 || ni > qs.length-1) return;
    state.idx = ni;
    saveState();
    render();
  }
  function goToQ(i){
    state.idx = i;
    state.showResults = false;
    saveState();
    render();
  }
  function finishQuiz(){
    state.showResults = true;
    saveState();
    bumpAttempt();
    renderResults();
  }

  function renderResults(){
    document.getElementById('quiz-area').style.display = 'none';
    var area = document.getElementById('results-area');
    area.style.display = 'block';
    var correct = 0;
    qs.forEach(function(q,i){ if (state.answers[i] === q.ci) correct++; });
    var html = '<div class="card results-card">';
    html += '<div>Your Score</div>';
    html += '<div class="score-big">'+correct+' / '+qs.length+'</div>';
    html += '<div style="margin-bottom:16px;color:#888;font-size:0.85rem;">Advanced Vocabulary &middot; 2026-06-20</div>';
    html += '<button id="retryWrongBtn" onclick="retryWrong()">Retry Wrong Ones</button>';
    html += '<button class="res-btn-copy" onclick="copyRes()">Copy All Results</button>';
    html += '<button class="res-btn-fresh" onclick="openFreshModal()">Start Fresh</button>';
    html += '</div>';
    area.innerHTML = html;
    updateNav();
  }

  function retryWrong(){
    var wrong = [];
    qs.forEach(function(q,i){
      if (state.answers[i] !== undefined && state.answers[i] !== q.ci) wrong.push(i);
    });
    wrong.forEach(function(i){ delete state.answers[i]; });
    if (wrong.length > 0) {
      state.idx = wrong[0];
      state.showResults = false;
      saveState();
      render();
    }
  }

  function copyRes(){
    var lines = ['[Grant] Advanced Vocabulary - 2026-06-20'];
    var correct = 0;
    qs.forEach(function(q,i){
      var ok = state.answers[i] === q.ci;
      if (ok) correct++;
      lines.push((i+1)+'. '+q.stem+' ['+q.tag+'] - '+(ok?'Correct':'Incorrect'));
    });
    lines.push('Score: '+correct+' / '+qs.length);
    var text = lines.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){
        alert('Results copied to clipboard.');
      }).catch(function(){ alert(text); });
    } else {
      alert(text);
    }
  }

  function openFreshModal(){
    document.getElementById('modal-overlay').style.display = 'flex';
  }
  function closeFreshModal(){
    document.getElementById('modal-overlay').style.display = 'none';
  }
  function confirmFresh(){
    state = { idx:0, answers:{}, showResults:false };
    saveState();
    closeFreshModal();
    render();
  }

  window.pick = pick;
  window.go = go;
  window.goToQ = goToQ;
  window.finishQuiz = finishQuiz;
  window.retryWrong = retryWrong;
  window.copyRes = copyRes;
  window.openFreshModal = openFreshModal;
  window.closeFreshModal = closeFreshModal;
  window.confirmFresh = confirmFresh;
  window.toggleJump = toggleJump;
  window.speak = speak;

  loadState();
  render();
})();
</script>
</body>
</html>
