  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_24";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20261012";
var RAW_QUESTIONS = [{"stem": "What is the past tense of <b>send</b>?", "opts": ["sent", "sended", "senten", "sendt"], "ci": 0, "exp": "The past tense of <b>send</b> is <b>sent</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "heavy<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["heavier / heaviest", "heavyer / heavyest", "more heavy / most heavy", "heavir / heavist"], "ci": 0, "exp": "heavy → heavier / heaviest (consonant + y: change -y to -i, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "She looked _____ the window and noticed that dark clouds were gathering on the horizon.", "opts": ["out of", "through", "over", "past"], "ci": 0, "exp": "\"Look out of the window\" is the standard English phrase for looking from the inside to the outside through a window opening. \"Through\" also works but is less idiomatic here.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>build</b> &rsaquo; Past: <b>built</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["builded", "build", "building", "built"], "ci": 3, "exp": "'build' is an irregular verb. Its past participle is 'built'. Past perfect: had built.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["She is <b>listening</b> to music right now.", "They were <b>listening</b> to the radio during the drive.", "He enjoys <b>listening</b> to podcasts on his commute.", "We will be <b>listening</b> to the lecture tomorrow."], "ci": 2, "exp": "In \"He enjoys listening to podcasts on his commute,\" \"listening\" is the object of the verb \"enjoys\" - a noun role - which makes it a gerund. In the other three sentences, \"listening\" follows \"is / were / will be\" and describes an action in progress, so it is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "She <span style=\"text-decoration:underline;\">______</span> from a prestigious university before she turned twenty.", "opts": ["had graduated", "has graduated", "will have graduated", "graduated"], "ci": 0, "exp": "\"had graduated\" is past perfect — she graduated before turning twenty.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "I am <u>glad</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Glad\" follows the linking verb \"am\" and describes the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["A series of meetings were held to discuss the new school schedule.", "A pair of gloves were left in the lost and found box after gym class.", "A series of meetings was held to discuss the new school schedule.", "A series of important events have been scheduled for the coming month."], "ci": 2, "exp": "\"A series of\" is singular, so \"was held\" is correct. \"Were held\" is plural — wrong. \"A pair of gloves\" is singular (\"a pair\" is one unit) — use \"was.\" \"A series of events\" is singular — use \"has been.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "She nervously handed the carefully written letter to her strict but fair supervisor.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADJECTIVES in this sentence, and only the adjectives?</span>", "opts": ["written, strict, fair", "written, strict", "strict, fair", "nervously, written, strict, fair"], "ci": 0, "exp": "'Written', 'strict', and 'fair' are all adjectives.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The vine is <b>climbing</b> up the fence.", "Ivy was <b>climbing</b> along the brick wall.", "<b>Climbing</b> is her favorite way to challenge herself outdoors.", "The <b>climbing</b> vine wrapped around the trellis."], "ci": 3, "exp": "In \"The climbing vine wrapped around the trellis,\" \"climbing\" comes directly before the noun \"vine\" and describes what the vine is doing - this adjective use of an -ing word is a present participle. In \"The vine is climbing up the fence\" and \"Ivy was climbing along the brick wall,\" \"climbing\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Climbing is her favorite way to challenge herself outdoors,\" \"climbing\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The thief <b>stole</b> the jewelry.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The jewelry ______ by the thief.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was stolen", "were stolen", "was stealing", "was steal"], "ci": 0, "exp": "The new subject \"the jewelry\" is singular and the action is in the past, so use was + the past participle \"stolen\": was stolen.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "The citizens of the small town elected the retired schoolteacher their new mayor by a landslide.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["their new mayor", "the retired schoolteacher"], "ci": 0, "exp": "\"Their new mayor\" is the objective complement — it names the role the town gave to \"the retired schoolteacher.\" \"The retired schoolteacher\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "The dog is <u>dig</u> a hole in the garden.", "opts": ["digging", "diging", "digg", "digged"], "ci": 0, "exp": "dig → digging (short vowel + single consonant: double the -g, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "He taught her math.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["math", "her"], "ci": 0, "exp": "\"Math\" is the direct object (what was taught). \"Her\" is the indirect object (who was taught).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">He did not say a word even after he was blamed.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Not even after he was blamed he said a word.", "Not even after he was blamed did he say a word.", "Not even after he was blamed had he said a word.", "Not even after he was blamed did he said a word."], "ci": 1, "exp": "With \"Not even after + clause\", the main clause inverts: \"Not even after he was blamed + did + he + say...\". The base form \"say\" (not \"said\") follows \"did\". The correct form is: Not even after he was blamed did he say a word.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>self</b>?", "opts": ["selfs", "selfes", "selvs", "selves"], "ci": 3, "exp": "self → selves (-f changes to -ves), as in 'themselves' or 'yourselves'", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The river overflowed it's banks after the storm.", "The responsibility was ours' to handle.", "The astronaut's helmet visor cracked on reentry.", "The tree's in the park were planted long ago."], "ci": 2, "exp": "<strong>\"astronaut's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>ours'</em> does not exist; the correct form is <em>ours</em>.<br>• <em>tree's</em> incorrectly adds an apostrophe to a simple plural noun.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["small red Italian sports car", "red small Italian sports car", "Italian small red sports car", "small Italian red sports car"], "ci": 0, "exp": "Correct order: size (small) → color (red) → origin (Italian) → noun\n✔ small red Italian sports car", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["When the tide comes in at dawn.", "Buried beneath layers of sand and rock.", "A flock of geese heading south for winter.", "The journalist published a front-page article."], "ci": 3, "exp": "\"The journalist published a front-page article.\" is a complete sentence — subject: 'The journalist', predicate: 'published'. The others are fragments: a 'When' clause, a participial phrase, and a noun phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "I ________ this book twice and I love it.", "opts": ["read", "have read"], "ci": 1, "exp": "No specific past time given - counting experience up to now, so use present perfect: have read.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["We studied the Civil War, the reconstruction era, and the Gilded Age.", "We studied the civil war, the Reconstruction Era, and the Gilded Age.", "We studied the Civil War, the Reconstruction Era, and the Gilded Age.", "We studied the Civil War, the Reconstruction Era and the Gilded Age."], "ci": 2, "exp": "\"Civil War,\" \"Reconstruction Era,\" and \"Gilded Age\" are all names of specific historical periods and are proper nouns — all words in each name are capitalized. A serial comma is required before \"and\" in a list of three items.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "The children _____ grown so much since last year.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. The growth connects the past to the present.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "She always <u>say</u> thank you.", "opts": ["says", "sayes", "sais", "sies"], "ci": 0, "exp": "say → says (vowel + y: just add -s)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "The colorful autumn leaves, scattered across the quiet neighborhood sidewalks, created a stunning natural carpet.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["created", "scattered", "stunning", "covered"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
