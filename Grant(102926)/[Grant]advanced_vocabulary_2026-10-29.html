<style>

  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261029";
var RAW_QUESTIONS = [{"stem": "The team practiced the trick play all week, and on Saturday they <b>executed</b> it perfectly to score the winning goal.<br><br>What does <b>execute</b> mean in this sentence?", "opts": ["forgot about", "carried out or performed", "explained in words", "changed at the last minute"], "ci": 1, "exp": "<i>execute</i> (v.) to carry out a plan or perform an action. They did the play perfectly in the game. <i>The gymnast <b>executed</b> a flawless flip.</i> Family: execution (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The recipe gave ______ directions: “Bake at 350 degrees for exactly 25 minutes.” Nobody had to guess.<br><br>Which word best completes the sentence?", "opts": ["ominous", "fragile", "vague", "explicit"], "ci": 3, "exp": "<i>explicit</i> (adj.) stated clearly and exactly, leaving nothing unclear. The recipe gave an exact temperature and time. <i>Vague</i> means the opposite. Family: explicitly (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Maya’s essay argued for a longer recess. To make it stronger, her teacher told her to add a ______ — one reason someone might disagree — and then explain why that reason does not work.<br><br>Which word best completes the sentence?", "opts": ["counterargument", "hypothesis", "benchmark", "heritage"], "ci": 0, "exp": "<i>counterargument</i> (n.) a reason someone might give against your idea. Strong writers answer it. <i>Ben answered the <b>counterargument</b> that recess wastes class time.</i> A <i>hypothesis</i> is a guess you test in science.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "“Lions are the <b>dominant</b> animals on the grassland; few other animals dare to challenge them.”<br><br>Which choice means the <b>SAME</b> or nearly the same as <b>dominant</b> as it is used in the sentence?", "opts": ["fastest", "most curious", "weakest", "most powerful"], "ci": 3, "exp": "<i>dominant</i> (adj.) strongest or most in control. Few animals dare to challenge lions because they are the most powerful. <i>Weakest</i> is the opposite. Family: dominate (v.), dominance (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Joining the beach cleanup was ______; no one had to come, but forty students showed up anyway.<br><br>Which word best completes the sentence?", "opts": ["hostile", "compulsory", "permanent", "voluntary"], "ci": 3, "exp": "<i>voluntary</i> (adj.) done because you choose to, not because you must. “No one had to come” is the clue. <i>Compulsory</i> means required — the opposite. Family: volunteer (n./v.), voluntarily (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Each winter, waves <b>erode</b> the sandy cliff a little more, and now the old path is only a foot from the edge.<br><br>What does <b>erode</b> mean in this sentence?", "opts": ["to freeze solid", "to build up higher", "to protect from damage", "to slowly wear away"], "ci": 3, "exp": "<i>erode</i> (v.) to slowly wear away land or rock by water, wind, or ice. The cliff keeps getting closer to the path. <i>Rain can <b>erode</b> a hillside.</i> Family: erosion (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Senator Ruiz strongly ______ the new tax, so she voted against it.<br><br>Which word correctly completes the sentence?", "opts": ["opposing", "opposed", "opposition", "opponent"], "ci": 1, "exp": "The sentence needs a past-tense verb: <i>oppose</i> → <i>opposed</i>. <i>Opponent</i> (a person on the other side) and <i>opposition</i> (the act of disagreeing) are nouns. Family: oppose (v.), opponent (n.), opposition (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "“The builders used steel bars to <b>reinforce</b> the old bridge so it could hold heavy trucks.”<br><br>Which word means the <b>OPPOSITE</b> of <b>reinforce</b> as it is used in the sentence?", "opts": ["weaken", "repair", "decorate", "strengthen"], "ci": 0, "exp": "<i>reinforce</i> (v.) to make stronger. The opposite is <i>weaken</i>. <i>Strengthen</i> is a synonym, not an opposite. Family: reinforcement (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The class textbook had only two maps, so Ms. Ortiz handed out a ______ with ten more maps of the Great Lakes.<br><br>Which word best completes the sentence?", "opts": ["supplement", "surplus", "apparatus", "remedy"], "ci": 0, "exp": "<i>supplement</i> (n.) something added to make a thing more complete. The extra maps were added to the book. <i>Vitamin <b>supplements</b> add to what we eat.</i> A <i>surplus</i> is an extra amount left over, not a handout added to a book. Family: supplementary (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Nora ______ left the last cookie on the plate so her little brother could have it.<br><br>Which word correctly completes the sentence?", "opts": ["deliberate", "deliberation", "deliberated", "deliberately"], "ci": 3, "exp": "The blank describes how she left it, so it needs an adverb: <i>deliberately</i> (on purpose). <i>Deliberate</i> is the adjective (a <i>deliberate</i> choice). Family: deliberate (adj./v.), deliberation (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Only the park ranger has the <b>authority</b> to close the trail; volunteers can only report problems.<br><br>What does <b>authority</b> mean in this sentence?", "opts": ["the power or right to make decisions and give orders", "the skill needed to fix broken things", "a written map of an area", "the strength to carry heavy loads"], "ci": 0, "exp": "<i>authority</i> (n.) the power or right to make rules or decisions. The ranger can close the trail; volunteers cannot. <i>The principal has the <b>authority</b> to cancel recess.</i> Family: authorize (v.), authoritative (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The <b>enormous</b> whale was longer than two school buses parked end to end.<br><br>What does <b>enormous</b> mean in this sentence?", "opts": ["extremely large", "extremely old", "extremely rare", "extremely fast"], "ci": 0, "exp": "<i>enormous</i> (adj.) very, very big. Longer than two buses is huge. <i>An <b>enormous</b> crowd filled the stadium.</i> Family: enormously (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "“Coach says Lena has the <b>potential</b> to be a great swimmer if she keeps practicing.”<br><br>Which word means the <b>SAME</b> or nearly the same as <b>potential</b> as it is used in the sentence?", "opts": ["fear", "history", "certainty", "possibility"], "ci": 3, "exp": "<i>potential</i> (n.) a possibility or ability that could develop in the future. “If she keeps practicing” shows it has not happened yet. <i>Certainty</i> would mean it is already sure. Family: potentially (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "“Our classroom is <b>adjacent</b> to the library, so we can hear the librarian reading aloud.”<br><br>Which word means the <b>OPPOSITE</b> of <b>adjacent</b> as it is used in the sentence?", "opts": ["crowded", "neighboring", "quiet", "distant"], "ci": 3, "exp": "<i>adjacent</i> (adj.) right next to. The opposite is <i>distant</i> (far away). <i>Neighboring</i> means the same as adjacent, so it is not the opposite. Family: adjacency (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The word <b>elevation</b> has more than one meaning. Which meaning is used in this sentence?<br><br>“The town of Leadville, Colorado, sits at an <b>elevation</b> of over 10,000 feet, so visitors often get out of breath.”", "opts": ["a drawing of one side of a building", "height above sea level", "a move to a more important job", "the act of lifting an object up"], "ci": 1, "exp": "<i>elevation</i> can mean height above sea level, a promotion to a higher job, or a building drawing. “10,000 feet” and getting out of breath point to height above sea level. Family: elevate (v.), elevator (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "As the storm moved out to sea, the wind began to <b>diminish</b>, and by evening the trees stood still.<br><br>What does <b>diminish</b> mean in this sentence?", "opts": ["to change direction", "to grow stronger", "to make a loud noise", "to become smaller or weaker"], "ci": 3, "exp": "<i>diminish</i> (v.) to become or make smaller, weaker, or less. The trees stood still because the wind got weaker. <i>The crowd's cheers began to <b>diminish</b> after the game.</i> Family: diminished (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "To <b>facilitate</b> the move, our neighbors lent us a truck and three strong helpers, and everything was done before lunch.<br><br>What does <b>facilitate</b> mean in this sentence?", "opts": ["to make something slower and harder", "to make something easier", "to plan something in secret", "to pay for something"], "ci": 1, "exp": "<i>facilitate</i> (v.) to make an action or process easier. The truck and helpers made the move go quickly. <i>A map will <b>facilitate</b> your search.</i> Family: facilitator (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The <b>swift</b> river carried our leaf boats out of sight in just a few seconds.<br><br>What does <b>swift</b> mean in this sentence?", "opts": ["calm and shallow", "muddy and wide", "very deep and cold", "moving very fast"], "ci": 3, "exp": "<i>swift</i> (adj.) very fast. The boats disappeared in seconds, so the water moved fast. <i>The cheetah is a <b>swift</b> runner.</i> Family: swiftly (adv.), swiftness (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The deer stayed <b>wary</b>, lifting its head at every snap of a twig before it took another bite of grass.<br><br>What does <b>wary</b> mean in this sentence?", "opts": ["curious and friendly", "careful and watchful for danger", "calm and completely relaxed", "hungry and impatient"], "ci": 1, "exp": "<i>wary</i> (adj.) careful because something might be dangerous. The deer kept checking for danger. <i>Be <b>wary</b> of dogs you don't know.</i> Family: warily (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The word <b>construct</b> has more than one meaning. Which meaning is used in this sentence?<br><br>“In math class, we used a ruler and a compass to <b>construct</b> a triangle with three equal sides.”", "opts": ["to build a large structure such as a bridge", "to put words together into a sentence or argument", "an idea that people have made up (noun)", "to draw a shape exactly, using tools"], "ci": 3, "exp": "<i>construct</i> can mean to build a structure, to put ideas or words together, or (in math) to draw a figure exactly with tools. A ruler, a compass, and a triangle show the math meaning. Family: construction (n.), constructive (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
