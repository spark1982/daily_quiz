var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261029";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have never went", "NO CHANGE", "had never going", "had never gone"], "ci": 3, "exp": "After <i>had</i>, use the past participle. <i>Go</i> is irregular: go → went → gone. So: <i>we <b>had never gone</b> through a real corn maze.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Letter to Grandma</strong><br><b>(1)</b> Dear Grandma, last Saturday my class visited Miller Farm for our fall field trip. <b>(2)</b> Before that day, we <u>had never went</u> through a real corn maze. <b>(3)</b> My friend Jake and <u>me</u> got lost twice among the tall, dry stalks. <b>(4)</b> After a while, each of the paths <u>look</u> exactly the same. <b>(5)</b> Finally, a farmer standing on a wooden tower pointed us toward the exit. <b>(6)</b> When you visit next month, we <u>can</u> look at all my photos together. <b>(7)</b> Love, Marco"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["I", "myself", "us", "NO CHANGE"], "ci": 0, "exp": "Jake and the writer are doing the action (the subject), so use <i>I</i>. Test it by removing Jake: <i>I got lost</i>, not <i>me got lost</i>. So: <i>My friend Jake and <b>I</b> got lost.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Letter to Grandma</strong><br><b>(1)</b> Dear Grandma, last Saturday my class visited Miller Farm for our fall field trip. <b>(2)</b> Before that day, we <u>had never went</u> through a real corn maze. <b>(3)</b> My friend Jake and <u>me</u> got lost twice among the tall, dry stalks. <b>(4)</b> After a while, each of the paths <u>look</u> exactly the same. <b>(5)</b> Finally, a farmer standing on a wooden tower pointed us toward the exit. <b>(6)</b> When you visit next month, we <u>can</u> look at all my photos together. <b>(7)</b> Love, Marco"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "have looked", "looks", "are looking"], "ci": 2, "exp": "The subject is <i>each</i>, which is always singular, not <i>paths</i>. So: <i>each of the paths <b>looks</b> exactly the same.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Letter to Grandma</strong><br><b>(1)</b> Dear Grandma, last Saturday my class visited Miller Farm for our fall field trip. <b>(2)</b> Before that day, we <u>had never went</u> through a real corn maze. <b>(3)</b> My friend Jake and <u>me</u> got lost twice among the tall, dry stalks. <b>(4)</b> After a while, each of the paths <u>look</u> exactly the same. <b>(5)</b> Finally, a farmer standing on a wooden tower pointed us toward the exit. <b>(6)</b> When you visit next month, we <u>can</u> look at all my photos together. <b>(7)</b> Love, Marco"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["NO CHANGE", "can to", "could of", "cans"], "ci": 0, "exp": "It is already correct. <i>Can</i> + a base verb shows something that is possible: <i>we <b>can</b> look at all my photos.</i> <i>Could of</i> is never correct (say <i>could have</i>).", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Letter to Grandma</strong><br><b>(1)</b> Dear Grandma, last Saturday my class visited Miller Farm for our fall field trip. <b>(2)</b> Before that day, we <u>had never went</u> through a real corn maze. <b>(3)</b> My friend Jake and <u>me</u> got lost twice among the tall, dry stalks. <b>(4)</b> After a while, each of the paths <u>look</u> exactly the same. <b>(5)</b> Finally, a farmer standing on a wooden tower pointed us toward the exit. <b>(6)</b> When you visit next month, we <u>can</u> look at all my photos together. <b>(7)</b> Love, Marco"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["whose", "who", "NO CHANGE", "where"], "ci": 2, "exp": "It is already correct. <i>That</i> introduces details about a thing (the plates): <i>hard plates <b>that</b> work like a suit of armor.</i> <i>Who</i> is for people, and <i>where</i> is for places.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Armadillos Stay Safe</strong><br><b>(1)</b> The nine-banded armadillo lives in Texas, Oklahoma, and other southern states. <b>(2)</b> Its back is covered by hard plates <u>that</u> work like a suit of armor. <b>(3)</b> When an armadillo <u>sensed</u> danger, it usually runs straight to its burrow. <b>(4)</b> When it feels trapped it can also jump about three feet into the air. <b>(5)</b> This surprise move startles foxes, coyotes, and other predators. <b>(6)</b> Armadillos is also good swimmers, and they can hold their breath for six minutes."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["sensing", "will have sensed", "NO CHANGE", "senses"], "ci": 3, "exp": "This report tells what armadillos usually do, so it stays in the present tense (<i>lives</i>, <i>runs</i>, <i>feels</i>). So: <i>When an armadillo <b>senses</b> danger, it usually runs.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Report: How Armadillos Stay Safe</strong><br><b>(1)</b> The nine-banded armadillo lives in Texas, Oklahoma, and other southern states. <b>(2)</b> Its back is covered by hard plates <u>that</u> work like a suit of armor. <b>(3)</b> When an armadillo <u>sensed</u> danger, it usually runs straight to its burrow. <b>(4)</b> When it feels trapped it can also jump about three feet into the air. <b>(5)</b> This surprise move startles foxes, coyotes, and other predators. <b>(6)</b> Armadillos is also good swimmers, and they can hold their breath for six minutes."}, {"stem": "Which sentence has an error?", "opts": ["Armadillos is also good swimmers, and they can hold their breath for six minutes.", "This surprise move startles foxes, coyotes, and other predators.", "The nine-banded armadillo lives in Texas, Oklahoma, and other southern states.", "Its back is covered by hard plates that work like a suit of armor."], "ci": 0, "exp": "<i>Armadillos</i> is plural, so it needs the plural verb <i>are</i>: <i>Armadillos <b>are</b> also good swimmers.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Armadillos Stay Safe</strong><br><b>(1)</b> The nine-banded armadillo lives in Texas, Oklahoma, and other southern states. <b>(2)</b> Its back is covered by hard plates <u>that</u> work like a suit of armor. <b>(3)</b> When an armadillo <u>sensed</u> danger, it usually runs straight to its burrow. <b>(4)</b> When it feels trapped it can also jump about three feet into the air. <b>(5)</b> This surprise move startles foxes, coyotes, and other predators. <b>(6)</b> Armadillos is also good swimmers, and they can hold their breath for six minutes."}, {"stem": "Where should a comma be added in sentence 4?", "opts": ["When it feels trapped, it can also jump about three feet into the air.", "When it feels trapped it can also jump, about three feet into the air.", "When, it feels trapped it can also jump about three feet into the air.", "When it feels, trapped it can also jump about three feet into the air."], "ci": 0, "exp": "When a sentence starts with a <i>when</i> part, put a comma after that part: <i>When it feels trapped<b>,</b> it can also jump.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Report: How Armadillos Stay Safe</strong><br><b>(1)</b> The nine-banded armadillo lives in Texas, Oklahoma, and other southern states. <b>(2)</b> Its back is covered by hard plates <u>that</u> work like a suit of armor. <b>(3)</b> When an armadillo <u>sensed</u> danger, it usually runs straight to its burrow. <b>(4)</b> When it feels trapped it can also jump about three feet into the air. <b>(5)</b> This surprise move startles foxes, coyotes, and other predators. <b>(6)</b> Armadillos is also good swimmers, and they can hold their breath for six minutes."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["will chop", "have chopped", "NO CHANGE", "chop"], "ci": 2, "exp": "It is already correct. The journal tells what happened tonight in the past tense (<i>helped</i>, <i>browned</i>), so <i>chopped</i> matches: <i>First, I <b>chopped</b> the tomatoes.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Journal: Taco Night</strong><br><b>(1)</b> Tonight I helped Mom cook chicken tacos for the whole family, including Grandpa. <b>(2)</b> First, I <u>chopped</u> the tomatoes while Mom browned the meat. <b>(3)</b> My little sister, Rosa, set the table with our blue plates. <b>(4)</b> She forgot to put out the forks. <b>(5)</b> At dinner, Dad said the tacos tasted <u>real</u> good. <b>(6)</b> I already want to cook again next Friday, and this time I will make the salsa. <b>(7)</b> <u>Because it was so much fun.</u>"}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["My little sister, Rosa, set the table with our blue plates but, she forgot to put out the forks.", "My little sister, Rosa, set the table with our blue plates, so she forgot to put out the forks.", "My little sister, Rosa, set the table with our blue plates, but she forgot to put out the forks.", "My little sister, Rosa, set the table with our blue plates, she forgot to put out the forks."], "ci": 2, "exp": "Use a comma + <i>but</i> to join two sentences that show a contrast: she set the table, <b>but</b> she forgot the forks. <i>So</i> would mean the plates caused her to forget, and a comma alone cannot join two sentences.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Journal: Taco Night</strong><br><b>(1)</b> Tonight I helped Mom cook chicken tacos for the whole family, including Grandpa. <b>(2)</b> First, I <u>chopped</u> the tomatoes while Mom browned the meat. <b>(3)</b> My little sister, Rosa, set the table with our blue plates. <b>(4)</b> She forgot to put out the forks. <b>(5)</b> At dinner, Dad said the tacos tasted <u>real</u> good. <b>(6)</b> I already want to cook again next Friday, and this time I will make the salsa. <b>(7)</b> <u>Because it was so much fun.</u>"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["NO CHANGE", "really", "more real", "realer"], "ci": 1, "exp": "<i>Real</i> is an adjective. To tell <i>how</i> good the tacos tasted, use the adverb <i>really</i>: <i>the tacos tasted <b>really</b> good.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Journal: Taco Night</strong><br><b>(1)</b> Tonight I helped Mom cook chicken tacos for the whole family, including Grandpa. <b>(2)</b> First, I <u>chopped</u> the tomatoes while Mom browned the meat. <b>(3)</b> My little sister, Rosa, set the table with our blue plates. <b>(4)</b> She forgot to put out the forks. <b>(5)</b> At dinner, Dad said the tacos tasted <u>real</u> good. <b>(6)</b> I already want to cook again next Friday, and this time I will make the salsa. <b>(7)</b> <u>Because it was so much fun.</u>"}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["It was so much fun.", "NO CHANGE", "Because it was so much fun!", "Being so much fun."], "ci": 0, "exp": "“Because it was so much fun” is a fragment — a <i>because</i> part cannot stand alone as a sentence. Make it a complete sentence: <i><b>It was so much fun.</b></i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Journal: Taco Night</strong><br><b>(1)</b> Tonight I helped Mom cook chicken tacos for the whole family, including Grandpa. <b>(2)</b> First, I <u>chopped</u> the tomatoes while Mom browned the meat. <b>(3)</b> My little sister, Rosa, set the table with our blue plates. <b>(4)</b> She forgot to put out the forks. <b>(5)</b> At dinner, Dad said the tacos tasted <u>real</u> good. <b>(6)</b> I already want to cook again next Friday, and this time I will make the salsa. <b>(7)</b> <u>Because it was so much fun.</u>"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["“Have you seen my library book.”?", "NO CHANGE", "“Have you seen my library book”.", "“Have you seen my library book?”"], "ci": 3, "exp": "When the spoken words are a question, the question mark goes <b>inside</b> the closing quotation marks: <i>“Have you seen my library book<b>?</b>” she asked.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The Missing Book</strong><br><b>(1)</b> Ava searched her whole room for her library book. <b>(2)</b> <u>“Have you seen my library book”?</u> she asked her brother. <b>(3)</b> Ben and her checked the living room together. <b>(4)</b> Ava <u>has looked</u> under the bed and inside her backpack, but the book was still missing. <b>(5)</b> Then she thought of Max, their curious puppy. <b>(6)</b> She ran to the corner <u>when</u> Max keeps his bed. <b>(7)</b> Sure enough, the book was there, a little damp but safe."}, {"stem": "Which sentence has an error?", "opts": ["Ben and her checked the living room together.", "Sure enough, the book was there, a little damp but safe.", "Ava searched her whole room for her library book.", "Then she thought of Max, their curious puppy."], "ci": 0, "exp": "<i>Ben and her</i> are doing the action, so use the subject pronoun <i>she</i>: <i>Ben and <b>she</b> checked the living room.</i> (Test it: <i>she checked</i>, not <i>her checked</i>.)", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Story: The Missing Book</strong><br><b>(1)</b> Ava searched her whole room for her library book. <b>(2)</b> <u>“Have you seen my library book”?</u> she asked her brother. <b>(3)</b> Ben and her checked the living room together. <b>(4)</b> Ava <u>has looked</u> under the bed and inside her backpack, but the book was still missing. <b>(5 var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
