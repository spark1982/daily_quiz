<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261029";
var RAW_QUESTIONS = [{"stem": "According to the passage, where were the two telegraph lines joined?", "opts": ["in New York City", "in Salt Lake City, Utah", "in Omaha, Nebraska", "in Washington, D.C."], "ci": 1, "exp": "The third paragraph says, “On October 24, 1861, the two lines were joined in Salt Lake City, Utah.” Omaha was where the western crew started.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>"}, {"stem": "Which event happened <b>right after</b> the two telegraph lines were joined?", "opts": ["Western Union sent out two crews from opposite ends.", "A message from California reached President Lincoln.", "Congress passed a law offering money for the line.", "The Pony Express announced that it would close."], "ci": 1, "exp": "“Within hours” of the joining, the message reached Lincoln. The Pony Express closing came “two days later,” so it was not right after.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Bison did so much damage that the telegraph line took many years to finish.", "Despite hard conditions, crews built a telegraph line that made cross-country messages almost instant.", "The Pony Express was the fastest way to send news across the country in 1861.", "President Lincoln asked Congress to build a telegraph so California would stay loyal."], "ci": 1, "exp": "The passage tells how crews overcame obstacles and ends, “A journey that had demanded ten days now required only minutes.” The line took about a year, not many years, and the passage never says Lincoln asked for it.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>"}, {"stem": "Read this sentence from the second paragraph: “The obstacles were formidable.” What does <b>formidable</b> mean?", "opts": ["strange and hard to explain", "very difficult to overcome", "small and easy to ignore", "costly and hard to pay for"], "ci": 1, "exp": "The next sentences list the hardships: poles hauled “for hundreds of miles,” bison knocking poles down, and ice on the wire, so the obstacles were very difficult to overcome. Money is never described as the problem.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>"}, {"stem": "How does the author organize the second and third paragraphs?", "opts": ["by describing one plant’s problem and then its solution", "by arguing which kind of seed travel works best", "by telling the steps of one seed’s life in time order", "by grouping seeds according to what carries them: wind, animals, and water"], "ci": 3, "exp": "The second paragraph begins “Some plants depend on the wind” and then “Other plants recruit animals,” and the third begins “Water carries seeds, too.” Calling one method “most dramatic” is not an argument about which works best.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>"}, {"stem": "The suffix <b>-ling</b> means “a young or small one.” What does <b>seedling</b> in the first paragraph most likely mean?", "opts": ["a young plant that has just sprouted", "a person who plants seeds for a living", "a group of seeds inside one pod", "a seed that an animal has buried"], "ci": 0, "exp": "seed + -ling = a young one that comes from a seed. The passage says a seedling “sprouts,” which shows it is a young plant, not a buried seed.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of “distant” as it is used in the last paragraph?", "opts": ["tropical", "faraway", "nearby", "sandy"], "ci": 2, "exp": "A coconut takes root on a “distant beach,” meaning far away. The opposite is <i>nearby</i>. <i>Faraway</i> means the same as distant, so it is not the opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Burdock burrs gave an engineer the idea for Velcro.", "Some acorns grow into oaks because squirrels forget where they buried them.", "Witch hazel pods can fling seeds as far as thirty feet.", "A maple seed floats down under a tuft of silky threads, like a parachute."], "ci": 3, "exp": "The silky “tiny parachute” belongs to the dandelion. The passage says a maple seed has “a single papery wing that makes it spin like a helicopter blade.” The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>"}, {"stem": "According to the story, where was Biscuit found?", "opts": ["waiting outside the shelter gate", "living in a family’s backyard", "hiding behind the library", "wandering near the highway"], "ci": 3, "exp": "Ms. Hale says, “She was found wandering near the highway.” A family appears only at the end, when they adopt her.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Biscuit</strong><br><p style=\"margin:0 0 8px;\">Diego had volunteered at the Maple Street Animal Shelter for three Saturdays, and every Saturday the same brown dog had pressed herself into the back corner of her kennel, trembling.</p><p style=\"margin:0 0 8px;\">“That’s Biscuit,” said Ms. Hale, the shelter manager, handing Diego a bag of treats. “She was found wandering near the highway. She doesn’t trust people yet.”</p><p style=\"margin:0 0 8px;\">Diego crouched by the gate and held out a treat. Biscuit stared at him but refused to move. After ten minutes, his legs ached, and he stood up, discouraged.</p><p style=\"margin:0 0 8px;\">“Can I try something different next week?” he asked. Ms. Hale nodded.</p><p style=\"margin:0 0 8px;\">The next Saturday, Diego brought a library book and sat on the floor outside Biscuit’s kennel, reading aloud in a quiet voice. He didn’t look at her or call her name. Halfway through the second chapter, he heard a soft scraping sound. Biscuit had crept to the front of the kennel and was resting her chin against the gate.</p><p style=\"margin:0 0 8px;\">“Well,” Ms. Hale whispered from the doorway, “I think she likes the story.”</p><p style=\"margin:0 0 8px;\">By the end of the month, Biscuit wagged her tail whenever Diego arrived, and in December a family with two gentle kids adopted her. Diego was sorry to see her leave, but he was proud, too.</p>"}, {"stem": "Why did Diego most likely avoid looking at Biscuit or calling her name while he read?", "opts": ["Ms. Hale had told him never to speak to the dogs.", "He was still upset that she had ignored his treats.", "He wanted her to feel safe enough to come closer on her own.", "He was too interested in the book to notice her."], "ci": 2, "exp": "Biscuit “doesn’t trust people yet,” and Diego’s plan was “something different” from holding out treats. Keeping quiet let her approach when she was ready, which she did. Diego was clearly paying attention, since he noticed the “soft scraping sound” right away.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Biscuit</strong><br><p style=\"margin:0 0 8px;\">Diego had volunteered at the Maple Street Animal Shelter for three Saturdays, and every Saturday the same brown dog had pressed herself into the back corner of her kennel, trembling.</p><p style=\"margin:0 0 8px;\">“That’s Biscuit,” said Ms. Hale, the shelter manager, handing Diego a bag of treats. “She was found wandering near the highway. She doesn’t trust people yet.”</p><p style=\"margin:0 0 8px;\">Diego crouched by the gate and held out a treat. Biscuit stared at him but refused to move. After ten minutes, his legs ached, and he stood up, discouraged.</p><p style=\"margin:0 0 8px;\">“Can I try something different next week?” he asked. Ms. Hale nodded.</p><p style=\"margin:0 0 8px;\">The next Saturday, Diego brought a library book and sat on the floor outside Biscuit’s kennel, reading aloud in a quiet voice. He didn’t look at her or call her name. Halfway through the second chapter, he heard a soft scraping sound. Biscuit had crept to the front of the kennel and was resting her chin against the gate.</p><p style=\"margin:0 0 8px;\">“Well,” Ms. Hale whispered from the doorway, “I think she likes the story.”</p><p style=\"margin:0 0 8px;\">By the end of the month, Biscuit wagged her tail whenever Diego arrived, and in December a family with two gentle kids adopted her. Diego was sorry to see her leave, but he was proud, too.</p>"}, {"stem": "Which sentence best states a theme of the story?", "opts": ["Dogs always like stories more than treats.", "Patience and gentleness can help someone learn to trust.", "Hard work is always rewarded right away.", "It is best not to care about animals you cannot keep."], "ci": 1, "exp": "Diego’s quiet, patient visits slowly won Biscuit’s trust, and she was adopted. His first try did not work right away, so the story does not say hard work is rewarded immediately.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Biscuit</strong><br><p style=\"margin:0 0 8px;\">Diego had volunteered at the Maple Street Animal Shelter for three Saturdays, and every Saturday the same brown dog had pressed herself into the back corner of her kennel, trembling.</p><p style=\"margin:0 0 8px;\">“That’s Biscuit,” said Ms. Hale, the shelter manager, handing Diego a bag of treats. “She was found wandering near the highway. She doesn’t trust people yet.”</p><p style=\"margin:0 0 8px;\">Diego crouched by the gate and held out a treat. Biscuit stared at him but refused to move. After ten minutes, his legs ached, and he stood up, discouraged.</p><p style=\"margin:0 0 8px;\">“Can I try something different next week?” he asked. Ms. Hale nodded.</p><p style=\"margin:0 0 8px;\">The next Saturday, Diego brought a library book and sat on the floor outside Biscuit’s kennel, reading aloud in a quiet voice. He didn’t look at her or call her name. Halfway through the second chapter, he heard a soft scraping sound. Biscuit had crept to the front of the kennel and was resting her chin against the gate.</p><p style=\"margin:0 0 8px;\">“Well,” Ms. Hale whispered from the doorway, “I think she likes the story.”</p><p style=\"margin:0 0 8px;\">By the end of the month, var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
