<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261118";
var RAW_QUESTIONS = [{"stem": "Role-play: you manage a drive-through bank branch and have just presented a staffing schedule. The judge asks: &ldquo;Our lines are longest on Friday afternoons. What would you do about that specifically?&rdquo; Which answer is best?", "opts": ["&ldquo;I&rsquo;d hire five new full-time tellers right away.&rdquo;", "&ldquo;Long lines are normal on Fridays, so customers expect to wait.&rdquo;", "&ldquo;That&rsquo;s a great question. Efficient operations are essential to every bank.&rdquo;", "&ldquo;I&rsquo;d check our transaction data to confirm the busiest hours, schedule an extra teller from 2 to 6 p.m. on Fridays by shifting a slower Tuesday shift, and promote the mobile app for simple deposits.&rdquo;"], "ci": 3, "exp": "Judges look for answers that are <b>specific, data-based, and practical</b>. The best response uses data, shifts existing labor to match demand without adding cost, and reduces demand at the window. Hiring five full-time tellers is costly for a few busy hours, accepting long lines ignores the problem, and a general statement avoids the question."}, {"stem": "A grocery store sells pre-cut, washed fruit cups at its checkout lanes, open 24 hours a day. Making the fruit available <b>at any hour the customer wants it</b> adds which type of economic utility?", "opts": ["Form utility", "Place utility", "Time utility", "Possession utility"], "ci": 2, "exp": "<b>Time utility</b> is value added by making a product available <i>when</i> customers want it (24 hours). Cutting and washing the fruit adds <i>form</i> utility; putting it at the checkout lane adds <i>place</i> utility; making it easy to buy and own (for example, accepting cards) adds <i>possession</i> utility. The question asks only about availability at any hour."}, {"stem": "A marketing analyst wants to show executives how monthly website visits changed over the past two years. Which type of chart would communicate this most clearly?", "opts": ["A line chart", "A pie chart", "A single bar showing the two-year total", "A table listing every visitor&rsquo;s IP address"], "ci": 0, "exp": "A <b>line chart</b> is best for showing a trend over time. A pie chart shows parts of a whole at one moment, a single total hides the month-to-month change, and raw visitor data is overwhelming and not a summary."}, {"stem": "A new team member at an investment firm recently moved from another country and rarely speaks up in brainstorming meetings, where most coworkers interrupt each other freely. Which action by the team leader best demonstrates cultural sensitivity?", "opts": ["Asking team members to submit ideas in writing before the meeting and inviting each person to share in turn", "Assuming the new employee has no ideas and assigning him only routine tasks", "Telling the new employee to adapt by interrupting like everyone else", "Holding a separate meeting for the new employee so he does not slow down the team"], "ci": 0, "exp": "Cultural sensitivity means recognizing that people from different backgrounds may communicate differently and adjusting so everyone can contribute. Written idea submission and turn-taking give quieter or differently-socialized members a fair chance. The other choices make negative assumptions, demand that one person change, or exclude him."}, {"stem": "A bank advertises itself as &ldquo;the friendliest bank in town,&rdquo; but customers report that tellers rarely greet them or make eye contact. What is the most likely effect on the bank&rsquo;s image?", "opts": ["Customers will believe the bank does not keep its brand promise, which weakens trust in the brand.", "Customers will ignore employee behavior because advertising shapes their opinions more strongly.", "The bank&rsquo;s image will improve because the slogan is memorable.", "There will be no effect, because image depends only on interest rates."], "ci": 0, "exp": "A company&rsquo;s image is built by every customer contact, not just its advertising. When employee behavior contradicts the brand promise, customers notice the gap and trust drops. Employees are often the most powerful influence on image, and image depends on much more than price."}, {"stem": "An employee at a large insurance company proposes, builds, and leads a new mobile app for filing claims while still working for the company and using its resources. This employee is best described as a(n)", "opts": ["sole proprietor", "franchisee", "venture capitalist", "intrapreneur"], "ci": 3, "exp": "An <b>intrapreneur</b> acts like an entrepreneur <i>inside</i> an existing organization, developing new ideas with the company&rsquo;s backing. A sole proprietor owns his or her own business, a franchisee buys the right to run another company&rsquo;s business model, and a venture capitalist invests money in new companies."}, {"stem": "Which sequence correctly lists the steps of the decision-making process?", "opts": ["Choose and act &rarr; define the problem &rarr; identify alternatives &rarr; evaluate the results", "Identify alternatives &rarr; choose and act &rarr; define the problem &rarr; evaluate alternatives", "Define the problem &rarr; identify alternatives &rarr; evaluate alternatives &rarr; choose and act &rarr; evaluate the results", "Evaluate the results &rarr; define the problem &rarr; choose and act &rarr; identify alternatives"], "ci": 2, "exp": "A good decision starts with a clearly <b>defined problem</b>, then lists and compares options before acting, and finally checks whether the decision worked. The other orders act before understanding the problem or evaluate results that do not yet exist."}, {"stem": "An engineer at a small fintech startup invents a new, non-obvious method for detecting fraudulent card transactions. Which form of legal protection would give the company the exclusive right to make, use, and sell this invention for a limited period?", "opts": ["A trademark", "A copyright", "A patent", "A trade name registration"], "ci": 2, "exp": "A <b>patent</b> protects inventions &mdash; new, useful, and non-obvious processes or devices &mdash; for a limited time (generally 20 years from filing for utility patents). A trademark protects brand names and logos, a copyright protects original creative expression (such as text or code as written), and a trade name identifies the business itself."}, {"stem": "In a job interview at a bank, a candidate is asked, &ldquo;Tell me about a time you solved a problem for a customer.&rdquo; Which answer structure would make the response most effective?", "opts": ["Describe the situation, the task, the action you took, and the result", "Explain why you are the best candidate before describing any example", "Give a general statement that you are a good problem-solver", "List every job you have held in order"], "ci": 0, "exp": "The <b>STAR method</b> (Situation, Task, Action, Result) answers behavioral questions with a specific, complete example and a measurable outcome. General claims and job lists do not answer the &ldquo;tell me about a time&rdquo; question."}, {"stem": "A family-owned company sells space heaters. A customer is burned when a heater&rsquo;s casing overheats because of a defect in its design, even though the customer used it exactly as directed. Under the doctrine of <b>strict product liability</b>, what must the customer generally show to recover damages?", "opts": ["The company intended to harm the customer.", "The product was defective and the defect caused the injury, even if the company was not careless.", "The company was negligent in hiring the workers who assembled the heater.", "The customer signed a written contract with the manufacturer before buying the heater."], "ci": 1, "exp": "Strict liability holds sellers responsible for injuries caused by <b>defective</b> products <i>without</i> proof of fault or carelessness. The customer must show a defect and that it caused the harm. Intent is required for intentional torts, careless hiring relates to negligence, and no direct contract with the manufacturer is needed."}, {"stem": "A regional bank needs a new branch manager quickly and wants someone who already understands its procedures and culture. Which recruiting method best fits this goal?", "opts": ["Hiring a recruiting firm to search other industries", "Posting the opening internally so current assistant managers can apply", "Placing an ad in a national newspaper", "Waiting for unsolicited applications from the public"], "ci": 1, "exp": "<b>Internal recruiting</b> fills a position with current employees who already know the company&rsquo;s procedures and culture, and it is usually faster and cheaper. It can also motivate employees by showing a path to promotion. The other methods bring in outsiders and typically take longer."}, {"stem": "A bank plans to replace its paper loan files with a new digital system next quarter. Several experienced loan officers are worried about the change. What should management do first to reduce resistance?", "opts": ["Announce the new system on launch day so there is less time for complaints", "Tell the loan officers that anyone who resists will be replaced", "Explain why the change is needed, involve the loan officers in planning, and provide training before launch", "Delay the change indefinitely until every employee agrees with it"], "ci": 2, "exp": "People resist change most when they don&rsquo;t understand it or feel it is forced on them. Effective <b>change management</b> communicates the reason, involves those affected, and builds their skills through training. Surprise announcements and threats increase resistance, and waiting for unanimous agreement can stall needed improvements."}, {"stem": "Role-play: you are an assistant manager at a credit union and have just presented a plan to cut a monthly paper-statement fee. The judge asks: &ldquo;What will you say to long-time members who are upset that we are charging them for paper statements at all?&rdquo; Which response is best?", "opts": ["&ldquo;I&rsquo;d tell them the fee is company policy and there is nothing I can do.&rdquo;", "&ldquo;I&rsquo;d remove the fee for everyone who complains so they don&rsquo;t close their accounts.&rdquo;", "&ldquo;I&rsquo;d thank them for their loyalty, explain that the fee covers printing and mailing costs, show them how to switch to free e-statements in two minutes, and waive the fee for members who can&rsquo;t use online banking.&rdquo;", "&ldquo;That&rsquo;s an important question. Members are the most important part of any credit union.&rdquo;"], "ci": 2, "exp": "Judges reward answers that are <b>specific, empathetic, and realistic</b>. The best response acknowledges the members, explains the reason, offers a practical solution, and protects members with real needs. Hiding behind policy shows poor customer relations; waiving the fee for anyone who complains undermines the plan and treats members unequally; a general statement avoids the question."}, {"stem": "A marketing manager wants a 30-minute staff meeting about a new campaign to stay focused and end on time. Which action would most help?", "opts": ["Inviting every employee in the company so no one feels left out", "Saving all questions for an email after the meeting", "Sending a short agenda with the meeting&rsquo;s goal and topics to attendees beforehand", "Starting with an open discussion so attendees can choose the topics"], "ci": 2, "exp": "An <b>agenda</b> sent in advance tells attendees the purpose and order of topics, so they come prepared and the leader can keep the discussion on track. Inviting everyone adds people who don&rsquo;t need to attend; banning questions blocks needed feedback; an open-ended start makes it harder to finish on time."}, {"stem": "A city sets a legal maximum rent that is well <b>below</b> the price at which the quantity of apartments supplied equals the quantity demanded. What is the most likely result?", "opts": ["A surplus of empty apartments, because landlords will build more units", "No change, because the market price will stay the same", "A shortage, because more people want apartments at that rent than landlords are willing to supply", "Lower demand for apartments, because renters will expect rents to fall further"], "ci": 2, "exp": "A <b>price ceiling</b> set below equilibrium makes quantity demanded rise and quantity supplied fall, creating a <b>shortage</b>. A surplus happens with a price <i>floor</i> above equilibrium. A binding ceiling does change the market, and a lower price increases, not decreases, the quantity demanded."}, {"stem": "A judge&rsquo;s performance indicator is &ldquo;<b>Explain the nature of effective communications.</b>&rdquo; You are role-playing a branch supervisor at a community bank whose tellers keep giving customers conflicting information about a new mobile-deposit limit. Which statement would best address this performance indicator?", "opts": ["&ldquo;Effective communication means the sender&rsquo;s message is received and understood as intended, so I&rsquo;d give every teller the same one-page summary of the deposit limit, review it in a short huddle, and ask each teller to explain it back so we know the message is clear.&rdquo;", "&ldquo;Communication is the process of sending and receiving messages.&rdquo;", "&ldquo;I&rsquo;d tell the tellers that they need to communicate better, and I&rsquo;d remind them that customers come first.&rdquo;", "&ldquo;Effective communication means talking to customers as often as possible, so I&rsquo;d have tellers call every customer about the limit.&rdquo;"], "ci": 0, "exp": "A strong PI answer <b>explains the concept and applies it to the situation</b>. The best answer defines effective communication (message understood as intended), then applies it with specific steps: one consistent message, a huddle, and a check for understanding (feedback). A memorized definition alone earns few points, a vague instruction to &ldquo;communicate better&rdquo; does not explain the concept, and the last choice misdefines it as frequency."}, {"stem": "In one city, all banks together hold $500 million in personal savings deposits. Harbor Bank holds $75 million of these deposits. What is Harbor Bank&rsquo;s market share of personal savings deposits?", "opts": ["7.5%", "15%", "25%", "85%"], "ci": 1, "exp": "Market share = company sales &divide; total market sales &times; 100 = 75 &divide; 500 &times; 100 = <b>15%</b>. 85% is the share held by all <i>other</i> banks; 7.5% and 25% come from misplacing the decimal or dividing incorrectly."}, {"stem": "A loan-processing office has three steps: application review (20 files per hour), credit check (8 files per hour), and final approval (15 files per hour). What is the maximum number of files the office can complete per hour, and why?", "opts": ["15 files, the average of the three steps", "8 files, because the credit check is a bottleneck that limits the whole process", "20 files, because review is the first step", "43 files, the total of all three steps"], "ci": 1, "exp": "A process can move no faster than its slowest step, called the <b>bottleneck</b>. Because the credit check handles only 8 files per hour, files pile up there, so the office completes at most 8 per hour. To increase output, managers should add capacity at the credit check."}, {"stem": "A credit union&rsquo;s call-center supervisor directly manages 35 representatives and has little time to coach any of them. Which organizational change would most directly address this problem?", "opts": ["Narrowing the supervisor&rsquo;s span of control by adding team leads who each oversee a smaller group", "Widening the supervisor&rsquo;s span of control by assigning more representatives", "Removing all supervisors so representatives manage themselves", "Moving the supervisor to a different department"], "ci": 0, "exp": "<b>Span of control</b> is the number of employees a manager supervises directly. With 35 direct reports, coaching time per person is very small; adding team leads narrows each manager&rsquo;s span so employees get more guidance. Widening it makes the problem worse, and the other choices do not address supervision."}, {"stem": "A judge&rsquo;s performance indicator is &ldquo;<b>Describe the nature of cash-flow statements.</b>&rdquo; You are role-playing an accountant advising a bakery owner who is surprised that the bakery reported a profit but cannot pay its suppliers this month. Which statement best addresses this performance indicator?", "opts": ["&ldquo;A cash-flow statement is one of the main financial statements.&rdquo;", "&ldquo;A cash-flow statement lists everything the bakery owns and owes on a single day, so it shows that you are profitable.&rdquo;", "&ldquo;A cash-flow statement shows the cash actually coming in and going out from operations, investing, and financing. Your bakery can show a profit while cash is low &mdash; for example, if catering clients haven&rsquo;t paid their invoices yet &mdash; so we&rsquo;ll use the statement to time your supplier payments.&rdquo;", "&ldquo;Profit and cash are always the same, so the statement must contain an error.&rdquo;"], "ci": 2, "exp": "The best answer explains what a cash-flow statement is (actual cash in and out, in three sections) <b>and applies it</b> to the owner&rsquo;s problem (profit without cash because of unpaid invoices). Naming the statement is not an explanation; &ldquo;owns and owes on a single day&rdquo; describes a balance sheet; and profit and cash are often different because of timing."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){

      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* exam-mode 2026-11-14 */
(function(){
  function examActive(){ return !state.reported && !(activeSet && activeSet.length); }
  window.EXAM_ACTIVE = examActive;
  var banner = document.createElement('div'); banner.className = 'exam-banner'; banner.id = 'exam-banner';
  banner.innerHTML = '&#128221; <b>Test mode</b> &mdash; like a real test: no answers or explanations until you finish. You can change your answers until you press Finish.';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(banner, card);
  var _pick = window.pick;
  window.pick = function(idx){
    if(!examActive()) return _pick(idx);
    if(state.showResults) return;
    var qi = activeOrder()[state.cur];
    state.answers[qi] = idx; saveState(); render();
  };
  function maskDots(){
    var ds = document.querySelectorAll('#dots-panel .dot');
    for(var i=0;i<ds.length;i++){ var d=ds[i]; if(d.classList.contains('answered-correct')||d.classList.contains('answered-wrong')){ d.classList.remove('answered-correct','answered-wrong'); d.classList.add('answered-exam'); } }
  }
  function mask(){
    var on = examActive() && !state.showResults;
    banner.style.display = on ? 'block' : 'none';
    if(!on) return;
    var qi = activeOrder()[state.cur];
    var btns = document.querySelectorAll('#options .opt-btn');
    for(var i=0;i<btns.length;i++){ (function(b, idx){
      b.classList.remove('reveal-correct','selected-wrong','selected-correct','exam-selected');
      b.disabled = false;
      b.onclick = function(){ window.pick(idx); };
      if(state.answers[qi] === idx) b.classList.add('exam-selected');
    })(btns[i], i); }
    var eb = document.getElementById('exp-box'); if(eb){ eb.style.display='none'; eb.innerHTML=''; }
    maskDots();
  }
  var _render = window.render;
  window.render = function(){ var r = _render.apply(this, arguments); try{ mask(); }catch(e){} return r; };
  var _tj = window.toggleJump;
  window.toggleJump = function(){ var r = _tj.apply(this, arguments); try{ if(examActive() && !state.showResults) maskDots(); }catch(e){} return r; };
  render();
})();
</script>
