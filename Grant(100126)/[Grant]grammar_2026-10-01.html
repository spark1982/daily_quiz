  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_24";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20261001";
var RAW_QUESTIONS = [{"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The ground is <b>shaking</b> beneath our feet.", "The whole building was <b>shaking</b> during the earthquake.", "The <b>shaking</b> ground sent everyone running outside.", "<b>Shaking</b> hands is a common way to greet someone."], "ci": 2, "exp": "In \"The shaking ground sent everyone running outside,\" \"shaking\" comes directly before the noun \"ground\" and describes what the ground is doing - this adjective use of an -ing word is a present participle. In \"The ground is shaking beneath our feet\" and \"The whole building was shaking during the earthquake,\" \"shaking\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Shaking hands is a common way to greet someone,\" \"shaking\" (with \"hands\") is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Whispering secrets to each other in class.", "The kitten knocked the vase off the shelf.", "After spending the whole day at the beach.", "The biggest pumpkin at the fall festival."], "ci": 1, "exp": "\"The kitten knocked the vase off the shelf.\" is a complete sentence — subject: 'The kitten', predicate: 'knocked'. The others are fragments: an -ing phrase, an 'After' phrase, and a noun phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["He is <b>building</b> a treehouse.", "They were <b>building</b> a sandcastle at the beach.", "We will be <b>building</b> a new shed this summer.", "<b>Building</b> strong friendships takes time and patience."], "ci": 3, "exp": "In \"Building strong friendships takes time and patience,\" \"building\" is the subject of the sentence - a noun - which makes it a gerund. In the other three sentences, \"building\" follows \"is / were / will be\" and is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "The family drove _____ the tunnel to get to the city on the other side of the mountain.", "opts": ["through", "along", "across", "over"], "ci": 0, "exp": "\"Through\" means passing within and out the other side of an enclosed space like a tunnel. \"Over\" would mean going above the tunnel or mountain.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["Well I guess we could try again tomorrow.", "Well, I guess we could try again tomorrow.", "Well I guess, we could try again tomorrow.", "Well; I guess we could try again tomorrow."], "ci": 1, "exp": "An introductory interjection like \"Well\" must be followed by a comma before the rest of the sentence. A semicolon cannot follow a single word like \"Well.\"", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["More than one student have applied for the scholarship this year.", "More than one answer on the quiz were marked as partially correct.", "More than one of the library books are missing from the shelf today.", "More than one student has applied for the scholarship this year."], "ci": 3, "exp": "\"More than one\" always takes a singular verb, so \"has applied\" is correct. \"Have applied\" is plural — wrong. \"Were marked\" is plural — use \"was.\" \"Are missing\" is plural — use \"is.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "I feel <u>happy</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Happy\" follows the linking verb \"feel\" and describes the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["expensive small gold ring", "small expensive gold ring", "gold expensive small ring", "expensive gold small ring"], "ci": 0, "exp": "Correct order: opinion (expensive) → size (small) → material (gold) → noun\n✔ expensive small gold ring", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>run</b> &rsaquo; Past: <b>ran</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["runned", "ran", "running", "run"], "ci": 3, "exp": "'run' is an irregular verb. Its past participle is 'run'. Past perfect: had run.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The wolf howled as it's pack ran through the forest.", "The children's laughter filled the playground.", "The scouts set up there tents by the river.", "Ours team won every game this season."], "ci": 1, "exp": "<strong>\"children's\"</strong> is correct — <em>children</em> is already plural; the possessive is <em>children's</em>.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>there</em> should be <em>their</em> (possessive adjective).<br>• <em>Ours</em> is a standalone pronoun; it cannot precede a noun. Use <em>our team</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The pilot <b>landed</b> the plane.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The plane ______ by the pilot.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was landed", "were landed", "was landing", "was land"], "ci": 0, "exp": "The new subject \"the plane\" is singular and the action is in the past, so use was + the past participle \"landed\": was landed.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>thief</b>?", "opts": ["thiefs", "thiefes", "theives", "thieves"], "ci": 3, "exp": "thief → thieves (-f changes to -ves)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "Despite the heavy rain, the cheerful children played energetically in the muddy puddles outside.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADJECTIVES in this sentence, and only the adjectives?</span>", "opts": ["heavy, cheerful, muddy", "heavy, cheerful, energetically, muddy", "cheerful, muddy", "heavy, cheerful"], "ci": 0, "exp": "'Heavy', 'cheerful', and 'muddy' are all adjectives.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "The old wooden bridge that once connected the two villages collapsed during the terrible flood last winter.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["The old wooden bridge", "the two villages", "the terrible flood", "last winter"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "She <u>multiply</u> numbers quickly in her head.", "opts": ["multiplies", "multiplys", "multiples", "multiplyes"], "ci": 0, "exp": "multiply → multiplies (consonant + y: drop -y, add -ies)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "rare<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["rarer / rarest", "rareer / rareest", "more rare / most rare", "rarere / rareste"], "ci": 0, "exp": "rare → rarer / rarest (silent -e: drop -e, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "He <span style=\"text-decoration:underline;\">______</span> the broken screen before his parents came back home.", "opts": ["had fixed", "has fixed", "will have fixed", "fixed"], "ci": 0, "exp": "\"had fixed\" is past perfect — the screen was fixed before his parents returned.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "She is <u>get</u> dressed for school.", "opts": ["getting", "geting", "getng", "getted"], "ci": 0, "exp": "get → getting (short vowel + single consonant: double the -t, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "The prices _____ gone up again this month.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. This month is unfinished, and the result is felt now.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">She had no sooner walked in than the phone started ringing.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["No sooner had she walked in when the phone started ringing.", "No sooner she had walked in than the phone started ringing.", "No sooner had she walked in than the phone started ringing.", "No sooner did she walk in than the phone started ringing."], "ci": 2, "exp": "\"No sooner...than\" requires inversion: \"No sooner + had + she + walked in...\". The conjunction must be \"than\" (not \"when\"), and past perfect \"had\" is correct. The correct form is: No sooner had she walked in than the phone started ringing.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>hear</b>?", "opts": ["heard", "heared", "hearen", "hearrd"], "ci": 0, "exp": "The past tense of <b>hear</b> is <b>heard</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "She ________ this city when she was a child.", "opts": ["visited", "has visited"], "ci": 0, "exp": "When she was a child is a specific finished period, so use simple past: visited.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "The teacher told us a story.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["us", "a story"], "ci": 0, "exp": "\"Us\" is the indirect object (who heard it). \"A story\" is the direct object (what was told).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "The long years of dedicated service rendered the old professor an indispensable member of the faculty.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["the old professor", "an indispensable member of the faculty"], "ci": 0, "exp": "\"The old professor\" is the object (who was rendered). \"An indispensable member of the faculty\" is the objective complement (the status he earned).", "tag": "Objective Complement", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
