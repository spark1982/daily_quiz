<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261022";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have begun", "NO CHANGE", "have began", "has begun"], "ci": 0, "exp": "After <i>have</i>, use the past participle: <i>begin → began → <b>begun</b></i>. <i>This month I <b>have begun</b> going to the new chess club.</i> (<i>Has</i> goes with he/she/it, not I.)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Letter to Uncle Ray</strong><br><b>(1)</b> Dear Uncle Ray, I have exciting news about school this fall. <b>(2)</b> This month I <u>have beginned</u> going to the new chess club. <b>(3)</b> Mr. Lopez gave Kai and <u>me</u> a thick book of chess puzzles to share. <b>(4)</b> Each knight in my new chess set has <u>it&rsquo;s</u> own carved wooden mane. <b>(5)</b> After school on Tuesdays we practice in the library for an hour. <b>(6)</b> I hope we can play a game together when you visit in December!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "I", "myself", "mine"], "ci": 0, "exp": "Kai and ___ <i>receive</i> the book, so use the object pronoun <i>me</i>. Try it alone: “Mr. Lopez gave <i>me</i> a book.” The sentence is already correct.", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Letter to Uncle Ray</strong><br><b>(1)</b> Dear Uncle Ray, I have exciting news about school this fall. <b>(2)</b> This month I <u>have beginned</u> going to the new chess club. <b>(3)</b> Mr. Lopez gave Kai and <u>me</u> a thick book of chess puzzles to share. <b>(4)</b> Each knight in my new chess set has <u>it&rsquo;s</u> own carved wooden mane. <b>(5)</b> After school on Tuesdays we practice in the library for an hour. <b>(6)</b> I hope we can play a game together when you visit in December!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["its", "NO CHANGE", "its&rsquo;", "their"], "ci": 0, "exp": "<i>It&rsquo;s</i> means “it is.” To show that something belongs to it, use <i><b>its</b></i> with no apostrophe. <i>Each knight has <b>its</b> own carved wooden mane.</i> (<i>Their</i> would not match the singular <i>each knight</i>.)", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Letter to Uncle Ray</strong><br><b>(1)</b> Dear Uncle Ray, I have exciting news about school this fall. <b>(2)</b> This month I <u>have beginned</u> going to the new chess club. <b>(3)</b> Mr. Lopez gave Kai and <u>me</u> a thick book of chess puzzles to share. <b>(4)</b> Each knight in my new chess set has <u>it&rsquo;s</u> own carved wooden mane. <b>(5)</b> After school on Tuesdays we practice in the library for an hour. <b>(6)</b> I hope we can play a game together when you visit in December!"}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["After school on Tuesdays, we practice in the library for an hour.", "After school on Tuesdays we, practice in the library for an hour.", "After, school on Tuesdays we practice in the library for an hour.", "After school on Tuesdays we practice in the library, for an hour."], "ci": 0, "exp": "Put a comma after an introductory phrase that tells <i>when</i>: <i>After school on Tuesdays<b>,</b> we practice in the library for an hour.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Letter to Uncle Ray</strong><br><b>(1)</b> Dear Uncle Ray, I have exciting news about school this fall. <b>(2)</b> This month I <u>have beginned</u> going to the new chess club. <b>(3)</b> Mr. Lopez gave Kai and <u>me</u> a thick book of chess puzzles to share. <b>(4)</b> Each knight in my new chess set has <u>it&rsquo;s</u> own carved wooden mane. <b>(5)</b> After school on Tuesdays we practice in the library for an hour. <b>(6)</b> I hope we can play a game together when you visit in December!"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "swimmed", "swimming", "swum"], "ci": 3, "exp": "After <i>had</i>, use the past participle: <i>swim → swam → <b>swum</b></i>. <i>I had never <b>swum</b> in a real race before.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>My First Swim Meet</strong><br><b>(1)</b> Saturday was my very first swim meet, and I felt nervous all morning. <b>(2)</b> I had never <u>swam</u> in a real race before. <b>(3)</b> When the whistle blew, I <u>dive</u> into the cold water. <b>(4)</b> The members of my team cheers loudly from the side of the pool. <b>(5)</b> My arms were getting tired near the end. <b>(6)</b> I kept swimming as hard as I could. <b>(7)</b> I finished in third place and earned a shiny ribbon!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["dove", "NO CHANGE", "will dive", "am diving"], "ci": 0, "exp": "The story is told in the past (<i>blew</i>, <i>was</i>, <i>finished</i>), so the verb must be past tense too: <i>When the whistle blew, I <b>dove</b> into the cold water.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>My First Swim Meet</strong><br><b>(1)</b> Saturday was my very first swim meet, and I felt nervous all morning. <b>(2)</b> I had never <u>swam</u> in a real race before. <b>(3)</b> When the whistle blew, I <u>dive</u> into the cold water. <b>(4)</b> The members of my team cheers loudly from the side of the pool. <b>(5)</b> My arms were getting tired near the end. <b>(6)</b> I kept swimming as hard as I could. <b>(7)</b> I finished in third place and earned a shiny ribbon!"}, {"stem": "Which sentence has an error?", "opts": ["Saturday was my very first swim meet, and I felt nervous all morning.", "My arms were getting tired near the end.", "The members of my team cheers loudly from the side of the pool.", "I finished in third place and earned a shiny ribbon!"], "ci": 2, "exp": "The subject is <i>members</i> (plural), not <i>team</i>, so use <i>cheer</i>: <i>The members of my team <b>cheer</b> loudly.</i> (In this story it would also be past tense: <i>cheered</i>.) Don't let the words <i>of my team</i> trick you.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>My First Swim Meet</strong><br><b>(1)</b> Saturday was my very first swim meet, and I felt nervous all morning. <b>(2)</b> I had never <u>swam</u> in a real race before. <b>(3)</b> When the whistle blew, I <u>dive</u> into the cold water. <b>(4)</b> The members of my team cheers loudly from the side of the pool. <b>(5)</b> My arms were getting tired near the end. <b>(6)</b> I kept swimming as hard as I could. <b>(7)</b> I finished in third place and earned a shiny ribbon!"}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["My arms were getting tired near the end, I kept swimming as hard as I could.", "My arms were getting tired near the end, so I kept swimming as hard as I could.", "My arms were getting tired near the end, but I kept swimming as hard as I could.", "Because I kept swimming as hard as I could, my arms were getting tired near the end."], "ci": 2, "exp": "The two ideas go against each other (tired → kept going anyway), so join them with a comma and <i>but</i>. A comma alone makes a run-on, and <i>so</i> or <i>because</i> changes the meaning.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>My First Swim Meet</strong><br><b>(1)</b> Saturday was my very first swim meet, and I felt nervous all morning. <b>(2)</b> I had never <u>swam</u> in a real race before. <b>(3)</b> When the whistle blew, I <u>dive</u> into the cold water. <b>(4)</b> The members of my team cheers loudly from the side of the pool. <b>(5)</b> My arms were getting tired near the end. <b>(6)</b> I kept swimming as hard as I could. <b>(7)</b> I finished in third place and earned a shiny ribbon!"}, {"stem": "What is the best way to combine sentences 2 and 3?", "opts": ["John Muir was a naturalist who loved these forests and worked to protect them.", "John Muir was a naturalist which loved these forests and worked to protect them.", "John Muir was a naturalist, he loved these forests and worked to protect them.", "John Muir was a naturalist, so he loved these forests and worked to protect them."], "ci": 0, "exp": "Use <i>who</i> for a person and <i>which</i> for things: <i>John Muir was a naturalist <b>who</b> loved these forests.</i> A comma alone between two sentences is a run-on, and <i>so</i> wrongly says that being a naturalist caused his love.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>The Giant Sequoias</strong><br><b>(1)</b> Giant sequoias grow on the western slopes of California&rsquo;s Sierra Nevada mountains and are some of the largest living things on Earth. <b>(2)</b> John Muir was a famous naturalist. <b>(3)</b> He loved these forests and worked for years to protect them. <b>(4)</b> Each of the trees <u>has</u> thick, spongy bark. <b>(5)</b> Young sequoias grow <u>real</u> quickly when they get plenty of sunlight. <b>(6)</b> Some sequoias are over 3,000 years old. <b>(7)</b> These trees have survived many forest fires."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["have", "NO CHANGE", "are having", "were having"], "ci": 1, "exp": "<i>Each</i> is singular, so it takes a singular verb: <i>Each of the trees <b>has</b> thick, spongy bark.</i> The plural word <i>trees</i> is a trap — the subject is <i>each</i>. The sentence is already correct.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>The Giant Sequoias</strong><br><b>(1)</b> Giant sequoias grow on the western slopes of California&rsquo;s Sierra Nevada mountains and are some of the largest living things on Earth. <b>(2)</b> John Muir was a famous naturalist. <b>(3)</b> He loved these forests and worked for years to protect them. <b>(4)</b> Each of the trees <u>has</u> thick, spongy bark. <b>(5)</b> Young sequoias grow <u>real</u> quickly when they get plenty of sunlight. <b>(6)</b> Some sequoias are over 3,000 years old. <b>(7)</b> These trees have survived many forest fires."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["NO CHANGE", "realer", "really", "more real"], "ci": 2, "exp": "<i>Quickly</i> is an adverb, and only an adverb can describe it. Use <i>really</i>, not <i>real</i>: <i>Young sequoias grow <b>really</b> quickly.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>The Giant Sequoias</strong><br><b>(1)</b> Giant sequoias grow on the western slopes of California&rsquo;s Sierra Nevada mountains and are some of the largest living things on Earth. <b>(2)</b> John Muir was a famous naturalist. <b>(3)</b> He loved these forests and worked for years to protect them. <b>(4)</b> Each of the trees <u>has</u> thick, spongy bark. <b>(5)</b> Young sequoias grow <u>real</u> quickly when they get plenty of sunlight. <b>(6)</b> Some sequoias are over 3,000 years old. <b>(7)</b> These trees have survived many forest fires."}, {"stem": "What is the best way to combine sentences 6 and 7?", "opts": ["Some sequoias, who are over 3,000 years old, have survived many forest fires.", "Some sequoias are over 3,000 years old, these trees have survived many forest fires.", "Some sequoias are over 3,000 years old because they have survived many forest fires.", "Some sequoias, which are over 3,000 years old, have survived many forest fires."], "ci": 3, "exp": "Use <i>which</i> for things like trees: <i>Some sequoias, <b>which</b> are over 3,000 years old, have survived many forest fires.</i> <i>Who</i> is for people, a comma alone makes a run-on, and <i>because</i> changes the meaning.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>The Giant Sequoias</strong><br><b>(1)</b> Giant sequoias grow on the western slopes of California&rsquo;s Sierra Nevada mountains and are some of the largest living things on Earth. <b>(2)</b> John Muir was a famous naturalist. <b>(3)</b> He loved these forests and worked for years to protect them. <b>(4)</b> Each of the trees <u>has</u> thick, spongy bark. <b>(5)</b> Young sequoias grow <u>real</u> quickly when they get plenty of sunlight. <b>(6)</b> Some sequoias are over 3,000 years old. <b>(7)</b> These trees have survived many forest fires."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "&ldquo;Where is my lunchbox,&rdquo; asked Leo?", "&ldquo;Where is my lunchbox?&rdquo; asked Leo.", "&ldquo;Where is my lunchbox&rdquo; asked Leo?"], "ci": 2, "exp": "A question mark that belongs to the spoken words goes <b>inside</b> the closing quotation marks: <i>“Where is my lunchbox<b>?</b>” asked Leo.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>The Lost Lunchbox</strong><br><b>(1)</b> Leo opened his backpack at lunchtime and froze. <b>(2)</b> His green dinosaur lunchbox was gone, and his stomach was already growling. <b>(3)</b> <u>&ldquo;Where is my lunchbox&rdquo;? asked Leo.</u> <b>(4)</b> &ldquo;Somebody must have <u>took</u> it,&rdquo; he said with a groan. <b>(5)</b> Maya and <u>him</u> searched every desk and shelf in the classroom. <b>(6)</b> Until Maya finally spotted it under the coat rack by the door. <b>(7)</b> Leo laughed, thanked her for helping him, and offered her one of his cookies."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["taken", "NO CHANGE", "taked", "takes"], "ci": 0, "exp": "After <i>must have</i>, use the past participle: <i>take → took → <b>taken</b></i>. <i>“Somebody must have <b>taken</b> it,” he said.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>The Lost Lunchbox</strong><br><b>(1)</b> Leo opened his backpack at lunchtime and froze. <b>(2)</b> His green dinosaur lunchbox was gone, and his stomach was already growling. <b>(3)</b> <u>&ldquo;Whe g": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Winter Coat Drive</strong><br><b>(1)</b> Room 12 is collecting warm coats for families in our town this winter. <b>(2)</b> So far, our class <u>has collected</u> forty coats! <b>(3)</b> Please drop off your coats <u>in</u> Monday or Tuesday morning before the bell. <b>(4)</b> Coats should be clean and they should have working zippers. <b>(5)</b> Their going to be given out at the community center next week. <b>(6)</b> Gloves, hats, and scarves are welcome too. <b>(7)</b> Thank you for helping our neighbors stay warm!"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
