<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261022";
var RAW_QUESTIONS = [{"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["P. T. Barnum led elephants across the bridge before it opened to prove it was safe.", "Ice on the East River sometimes stopped the ferries for days.", "Emily Roebling studied mathematics and bridge design.", "The bridge&rsquo;s main span was 1,595 feet long."], "ci": 0, "exp": "The passage says Barnum &ldquo;later&rdquo; led the elephants across — after the bridge opened on May 24, 1883, not before. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Building the Brooklyn Bridge</strong><br><p style=\"margin:0 0 8px;\">In the 1860s, the only way to cross the East River between Brooklyn and Manhattan was by ferry, and in winter, drifting ice often halted the boats for days. Engineer John A. Roebling proposed an enormous suspension bridge hung from steel cables, a design that many experts considered reckless. In 1869, before construction even began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later.</p><p style=\"margin:0 0 8px;\">His son, Washington Roebling, took charge. Workers labored deep inside caissons that had been sunk to the river bottom, breathing compressed air that kept the water out. Rising to the surface too quickly caused a painful illness that workers called &ldquo;the bends,&rdquo; and by 1872 Washington was so weakened that he could no longer visit the site. From his window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied mathematics and bridge design until officials relied on her expertise.</p><p style=\"margin:0 0 8px;\">The bridge finally opened on May 24, 1883. Its main span stretched 1,595 feet, the longest in the world at that time. To prove that the bridge was sturdy, the showman P. T. Barnum later led twenty-one elephants across it.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["The Brooklyn Bridge was finished despite deadly dangers and setbacks because the Roebling family kept working on it.", "Ferries were the only way to cross the East River in the 1860s.", "Workers who rose too quickly from the caissons caught a painful illness.", "P. T. Barnum used elephants to show that the bridge was sturdy."], "ci": 0, "exp": "The whole passage follows the bridge from John&rsquo;s plan and death, through Washington&rsquo;s illness and Emily&rsquo;s help, to the opening. The other choices are true details, but each covers only one small part of the passage.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Building the Brooklyn Bridge</strong><br><p style=\"margin:0 0 8px;\">In the 1860s, the only way to cross the East River between Brooklyn and Manhattan was by ferry, and in winter, drifting ice often halted the boats for days. Engineer John A. Roebling proposed an enormous suspension bridge hung from steel cables, a design that many experts considered reckless. In 1869, before construction even began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later.</p><p style=\"margin:0 0 8px;\">His son, Washington Roebling, took charge. Workers labored deep inside caissons that had been sunk to the river bottom, breathing compressed air that kept the water out. Rising to the surface too quickly caused a painful illness that workers called &ldquo;the bends,&rdquo; and by 1872 Washington was so weakened that he could no longer visit the site. From his window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied mathematics and bridge design until officials relied on her expertise.</p><p style=\"margin:0 0 8px;\">The bridge finally opened on May 24, 1883. Its main span stretched 1,595 feet, the longest in the world at that time. To prove that the bridge was sturdy, the showman P. T. Barnum later led twenty-one elephants across it.</p>"}, {"stem": "Which event happened right after Washington Roebling became too weak to visit the bridge site?", "opts": ["A ferry crushed John Roebling&rsquo;s foot at the dock.", "He watched through a telescope while Emily carried his instructions to the engineers.", "P. T. Barnum led twenty-one elephants across the bridge.", "The bridge opened with the longest main span in the world."], "ci": 1, "exp": "The second paragraph says that by 1872 Washington &ldquo;could no longer visit the site,&rdquo; and then &ldquo;from his window, he watched through a telescope while his wife, Emily, carried his instructions.&rdquo; The bridge opened later, in 1883, and the elephants crossed after that.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Building the Brooklyn Bridge</strong><br><p style=\"margin:0 0 8px;\">In the 1860s, the only way to cross the East River between Brooklyn and Manhattan was by ferry, and in winter, drifting ice often halted the boats for days. Engineer John A. Roebling proposed an enormous suspension bridge hung from steel cables, a design that many experts considered reckless. In 1869, before construction even began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later.</p><p style=\"margin:0 0 8px;\">His son, Washington Roebling, took charge. Workers labored deep inside caissons that had been sunk to the river bottom, breathing compressed air that kept the water out. Rising to the surface too quickly caused a painful illness that workers called &ldquo;the bends,&rdquo; and by 1872 Washington was so weakened that he could no longer visit the site. From his window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied mathematics and bridge design until officials relied on her expertise.</p><p style=\"margin:0 0 8px;\">The bridge finally opened on May 24, 1883. Its main span stretched 1,595 feet, the longest in the world at that time. To prove that the bridge was sturdy, the showman P. T. Barnum later led twenty-one elephants across it.</p>"}, {"stem": "In the first paragraph, many experts considered Roebling&rsquo;s design <b>reckless</b>. What does <b>reckless</b> most likely mean?", "opts": ["too expensive to build", "dangerously risky, without enough care", "old-fashioned and dull", "impossible to understand"], "ci": 1, "exp": "The experts doubted a huge bridge &ldquo;hung from steel cables&rdquo; could be safe, so they thought it was dangerously risky. &ldquo;Too expensive&rdquo; is tempting, but the passage never mentions cost — the worry was danger.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Building the Brooklyn Bridge</strong><br><p style=\"margin:0 0 8px;\">In the 1860s, the only way to cross the East River between Brooklyn and Manhattan was by ferry, and in winter, drifting ice often halted the boats for days. Engineer John A. Roebling proposed an enormous suspension bridge hung from steel cables, a design that many experts considered reckless. In 1869, before construction even began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later.</p><p style=\"margin:0 0 8px;\">His son, Washington Roebling, took charge. Workers labored deep inside caissons that had been sunk to the river bottom, breathing compressed air that kept the water out. Rising to the surface too quickly caused a painful illness that workers called &ldquo;the bends,&rdquo; and by 1872 Washington was so weakened that he could no longer visit the site. From his window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied mathematics and bridge design until officials relied on her expertise.</p><p style=\"margin:0 0 8px;\">The bridge finally opened on May 24, 1883. Its main span stretched 1,595 feet, the longest in the world at that time. To prove that the bridge was sturdy, the showman P. T. Barnum later led twenty-one elephants across it.</p>"}, {"stem": "What is the main idea of the passage?", "opts": ["Lightning is five times hotter than the surface of the sun.", "You can find how far away a storm is by counting seconds.", "Lightning forms when electric charges build up in storm clouds, and its heat creates thunder.", "Hail pellets are heavier than ice crystals inside a cloud."], "ci": 2, "exp": "The passage explains how charges separate, how the spark forms, and how thunder results. The other choices are true details, but each covers only part of the passage.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>How Lightning Forms</strong><br><p style=\"margin:0 0 8px;\">During a thunderstorm, the tops of towering clouds are far below freezing. Strong winds inside the cloud toss tiny ice crystals and heavier pellets of soft hail up and down, and as they collide, they swap electric charges. The lighter crystals, which become positively charged, are carried toward the top of the cloud, while the heavier, negatively charged pellets collect near the bottom.</p><p style=\"margin:0 0 8px;\">When the difference in charge grows large enough, a discharge becomes inevitable. A giant spark leaps between the cloud and the ground or between two parts of the cloud. This spark is lightning, and it heats the air around it to about 50,000 degrees Fahrenheit, roughly five times hotter than the surface of the sun. The superheated air expands so rapidly that it creates a shock wave, which we hear as thunder.</p><p style=\"margin:0 0 8px;\">Because light travels much faster than sound, you see the flash before you hear the boom. Counting the seconds between them and dividing by five gives an approximate distance in miles. Even so, lightning can strike more than ten miles from a storm, so experts warn that once you hear thunder, you are close enough to be struck.</p>"}, {"stem": "In the second paragraph, the prefix <i>super-</i> means &ldquo;above&rdquo; or &ldquo;beyond.&rdquo; What does <b>superheated</b> most likely mean?", "opts": ["heated slowly over a long time", "cooled down after being heated", "heated far beyond its normal temperature", "heated by the sun"], "ci": 2, "exp": "Super- (beyond) + heated = heated beyond normal. The passage says the air reaches &ldquo;about 50,000 degrees Fahrenheit.&rdquo; &ldquo;Heated by the sun&rdquo; is tempting because the sun is mentioned, but the sun is only used for comparison.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>How Lightning Forms</strong><br><p style=\"margin:0 0 8px;\">During a thunderstorm, the tops of towering clouds are far below freezing. Strong winds inside the cloud toss tiny ice crystals and heavier pellets of soft hail up and down, and as they collide, they swap electric charges. The lighter crystals, which become positively charged, are carried toward the top of the cloud, while the heavier, negatively charged pellets collect near the bottom.</p><p style=\"margin:0 0 8px;\">When the difference in charge grows large enough, a discharge becomes inevitable. A giant spark leaps between the cloud and the ground or between two parts of the cloud. This spark is lightning, and it heats the air around it to about 50,000 degrees Fahrenheit, roughly five times hotter than the surface of the sun. The superheated air expands so rapidly that it creates a shock wave, which we hear as thunder.</p><p style=\"margin:0 0 8px;\">Because light travels much faster than sound, you see the flash before you hear the boom. Counting the seconds between them and dividing by five gives an approximate distance in miles. Even so, lightning can strike more than ten miles from a storm, so experts warn that once you hear thunder, you are close enough to be struck.</p>"}, {"stem": "According to the passage, about how hot does lightning make the air around it?", "opts": ["about 10,000 degrees Fahrenheit", "about 5,000 degrees Fahrenheit", "about 500,000 degrees Fahrenheit", "about 50,000 degrees Fahrenheit"], "ci": 3, "exp": "The passage says lightning &ldquo;heats the air around it to about 50,000 degrees Fahrenheit, roughly five times hotter than the surface of the sun.&rdquo; The number five appears in the sentence, which makes 5,000 a tempting but wrong choice.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>How Lightning Forms</strong><br><p style=\"margin:0 0 8px;\">During a thunderstorm, the tops of towering clouds are far below freezing. Strong winds inside the cloud toss tiny ice crystals and heavier pellets of soft hail up and down, and as they collide, they swap electric charges. The lighter crystals, which become positively charged, are carried toward the top of the cloud, while the heavier, negatively charged pellets collect near the bottom.</p><p style=\"margin:0 0 8px;\">When the difference in charge grows large enough, a discharge becomes inevitable. A giant spark leaps between the cloud and the ground or between two parts of the cloud. This spark is lightning, and it heats the air around it to about 50,000 degrees Fahrenheit, roughly five times hotter than the surface of the sun. The superheated air expands so rapidly that it creates a shock wave, which we hear as thunder.</p><p style=\"margin:0 0 8px;\">Because light travels much faster than sound, you see the flash before you hear the boom. Counting the seconds between them and dividing by five gives an approximate distance in miles. Even so, lightning can strike more than ten miles from a storm, so experts warn that once you hear thunder, you are close enough to be struck.</p>"}, {"stem": "According to the passage, what causes the sound of thunder?", "opts": ["Ice crystals and hail crash into each other inside the cloud.", "Positive and negative charges collect in different parts of the cloud.", "Light from the flash travels faster than sound.", "Superheated air expands so quickly that it makes a shock wave."], "ci": 3, "exp": "The passage says the superheated air &ldquo;expands so rapidly that it creates a shock wave, which we hear as thunder.&rdquo; Colliding ice is what separates the charges — it happens earlier and is not the sound we hear.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>How Lightning Forms</strong><br><p style=\"margin:0 0 8px;\">During a thunderstorm, the tops of towering clouds are far below freezing. Strong winds inside the cloud toss tiny ice crystals and heavier pellets of soft hail up and down, and as they collide, they swap electric charges. The lighter crystals, which become positively charged, are carried toward the top of the cloud, while the heavier, negatively charged pellets collect near the bottom.</p><p style=\"margin:0 0 8px;\">When the difference in charge grows large enough, a discharge becomes inevitable. A giant spark leaps between the cloud and the ground or between two parts of the cloud. This spark is lightning, and it heats the air around it to about 50,000 degrees Fahrenheit, roughly five times hotter than the surface of the sun. The superheated air expands so rapidly that it creates a shock wave, which we hear as thunder.</p><p style=\"margin:0 0 8px;\">Because light travels much faster than sound, you see the flash before you hear the boom. Counting the seconds between them and dividing by five gives an approximate distance in miles. Even so, lightning can strike more than ten miles from a storm, so experts warn that once you hear thunder, you are close enough to be struck.</p>"}, {"stem": "What did Sophie do right after Dante pointed to the scrap pile?", "opts": ["She sawed the boards while Dante held them steady.", "She measured all the pieces twice.", "She marked the new boards with a pencil.", "She showed the judge her finished birdhouse."], "ci": 2, "exp": "After Dante &ldquo;tapped the scrap pile,&rdquo; Sophie &ldquo;grabbed a pencil and marked the new boards.&rdquo; She sawed the boards after that, and she had measured twice before the story began.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Birdhouse Contest</strong><br><p style=\"margin:0 0 8px;\">Sophie spread the pieces of cedar across the garage floor and frowned. The birdhouse contest at the nature center was on Saturday, and the roof would not fit.</p><p style=\"margin:0 0 8px;\">&ldquo;I measured everything twice,&rdquo; she said. &ldquo;How can the sides be too short?&rdquo;</p><p style=\"margin:0 0 8px;\">Her older brother, Dante, picked up the instructions and studied them. &ldquo;You cut the sides at six inches,&rdquo; he said, &ldquo;but the plan says eight.&rdquo;</p><p style=\"margin:0 0 8px;\">Sophie groaned. &ldquo;So I wasted the wood. Maybe I should just quit and buy one at the hardware store.&rdquo;</p><p style=\"margin:0 0 8px;\">&ldquo;You could,&rdquo; Dante said, &ldquo;but then it wouldn&rsquo;t be yours.&rdquo; He tapped the scrap pile. &ldquo;Those short pieces could become a feeding tray. You&rsquo;d only need to cut two new sides.&rdquo;</p><p style=\"margin:0 0 8px;\">Sophie was reluctant at first, but she grabbed a pencil and marked the new boards, checking the plan after every line. Dante held the boards steady while she sawed. By dinnertime the roof sat snugly on top, and the short pieces had become a tray across the front.</p><p style=\"margin:0 0 8px;\">On Saturday, the judge did not award Sophie first place, but she pointed at the tray and called it the most inventive design in the room.</p>"}, {"stem": "Why did Dante most likely say, &ldquo;But then it wouldn&rsquo;t be yours&rdquo;?", "opts": ["He thought the hardware store birdhouses were too expensive.", "He thought Sophie would be prouder of a birdhouse she built herself.", "He wanted to build the birdhouse for Sophie himself.", "He believed store-bought birdhouses could not enter the contest."], "ci": 1, "exp": "Dante encourages Sophie to fix her own work instead of quitting, which suggests he wanted her to be proud of something she made. The story never mentions prices or contest rules, and Dante only helps by holding the boards.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Birdhouse Contest</strong><br><p style=\"margin:0 0 8px;\">Sophie spread the pieces of cedar across the garage floor and frowned. The birdhouse contest at the nature center was on Saturday, and the roof would not fit.</p><p style=\"margin:0 0 8px;\">&ldquo;I measured everything twice,&rdquo; she said. &ldquo;How can the sides be too short?&rdquo;</p><p style=\"margin:0 0 8px;\">Her older brother, Dante, picked up the instructions and studied them. &ldquo;You cut the sides at six inches,&rdquo; he said, &ldquo;but the plan says eight.&rdquo;</p><p style=\"margin:0 0 8px;\">Sophie groaned. &ldquo;So I wasted the wood. Maybe I should just quit and buy one at the hardware store.&rdquo;</p><p style=\"margin:0 0 8px;\">&ldquo;You could,&rdquo; Dante said, &ldquo;but then it wouldn&rsquo;t be yours.&rdquo; He tapped the scrap pile. &ldquo;Those short pieces could become a feeding tray. You&rsquo;d only need to cut two new sides.&rdquo;</p><p style=\"margin:0 0 8px;\">Sophie was reluctant at first, but she grabbed a pencil and marked the new boards, checking the plan after every line. Dante held the boards steady while she sawed. By dinnertime the roof sat snugly on top, and the short pieces had become a tray across the front.</p><p style=\"margin:0 0 8px;\">On Saturday, the judge did not award Sophie first place, but she pointed at the tray and called it the most inventive design in the room.</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of <b>reluctant</b> as it is used in the passage?", "opts": ["unwilling", "careful", "tired", "eager"], "ci": 3, "exp": "&ldquo;Reluctant&rdquo; means not wanting to do something; Sophie was unsure about starting over. The opposite is <i>eager</i> (wanting very much to e.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Birdhouse Contest</strong><br><p style=\"margin:0 0 8px;\">Sophie spread the pieces of cedar across the garage floor and frowned. The birdhouse contest at the nature center was on Saturday, and the roof would not fit.</p><p style=\"margin:0 0 8px;\">&ldquo;I measured everything twice,&rdquo; she said. &ldquo;How can the sides be too short?&rdquo;</p><p style=\"margin:0 0 8px;\">Her older brother, Dante, picked up the instructions and studied them. &ldquo;You cut the sides at six inches,&rdquo; he said, &ldquo;but the plan says eight.&rdquo;</p><p style=\"margin:0 0 8px;\">Sophie groaned. &ldquo;So I wasted the wood. Maybe I should just quit and buy one at the hardware store.&rdquo;</p><p style=\"margin:0 0 8px;\">&ldquo;You could,&rdquo; Dante said, &ldquo;but then it wouldn&rsquo;t be yours.&rdquo; He tapped the scrap pile. &ldquo;Those short pieces could become a feeding tray. You&rsquo;d only need to cut two new sides.&rdquo;</p><p style=\"margin:0 0 8px;\">Sophie was reluctant at first, but she grabbed a pencil and marked the new boards, checking the plan after every line. Dante held the boards steady while she sawed. By dinnertime the roof sat snugly on top, and the short pieces had become a tray across the front.</p><p style=\"margin:0 0 8px;\">On Saturday, the judge did not award Sophie first place, but she pointed at the tray and called it the most inventive design in the room.</p>"}, {"stem": "Ida admitted that she had been <b>terrified</b>. Which word means the <b>OPPOSITE</b> of <b>terrified</b>?", "opts": ["fearless", "frightened", "exhausted", "lonely"], "ci": 0, "exp": "&ldquo;Terrified&rdquo; means extremely afraid. The opposite is <i>fearless</i>. <i>Frightened</i> means almost the same as terrified, so it is a trap.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>The Light on Gull Ledge</strong><br><p style=\"margin:0 0 8px;\">In the winter of 1857, fifteen-year-old Ida Marsh lived with her family in the lighthouse on Gull Ledge, a rocky island far off the coast of Maine. When her father rowed to the mainland for supplies, a storm arrived sooner than anyone expected. Waves crashed over the island for four weeks, and his boat could not return.</p><p style=\"margin:0 0 8px;\">Ida knew that ships passing in the dark depended on the light. Every evening she climbed the narrow tower stairs, trimmed the wicks of the lamps, and polished the soot from the glass so the beams would shine brightly. Her mother was ill, so Ida also cared for her younger sisters and kept the stove burning.</p><p style=\"margin:0 0 8px;\">One night, a wave tore through the henhouse. Ida waded into the freezing water and carried the hens to safety one at a time, even though her hands grew numb. She refused to let the light go dark, and when the storm finally calmed, her father rowed home to find every lamp still burning. Years later, Ida admitted that she had been terrified, but she said that quitting had never seemed like a choice.</p>"}, {"stem": "In the second paragraph, Ida <b>trimmed</b> the wicks of the lamps. Which meaning of <b>trim</b> is used here?", "opts": ["to decorate something with lace or ribbon", "to cut off small uneven parts so something works or looks neat", "to make an amount or cost smaller", "to look thin and healthy"], "ci": 1, "exp": "Ida cut the burned ends off the lamp wicks so they would burn brightly. The other choices are real meanings of <i>trim</i> (&ldquo;trim a dress,&rdquo; &ldquo;trim the budget,&rdquo; &ldquo;a trim runner&rdquo;), but they do not fit a lamp wick.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>The Light on Gull Ledge</strong><br><p style=\"margin:0 0 8px;\">In the winter of 1857, fifteen-year-old Ida Marsh lived with her family in the lighthouse on Gull Ledge, a rocky island far off the coast of Maine. When her father rowed to the mainland for supplies, a storm arrived sooner g.</p><p style=\"margin:0 0 8px;\">One night, a wave tore through the henhouse. Ida waded into the freezing water and carried the hens to safety one at a time, even though her hands grew numb. She refused to let the light go dark, and when the storm finally calmed, her father rowed home to find every lamp still burning. Years later, Ida admitted that she had been terrified, but she said that quitting had never seemed like a choice.</p>"}, {"stem": "What does the last paragraph suggest about Ida?", "opts": ["She was never frightened during the storm.", "She wished she had gone to the mainland with her father.", "She kept going and did her job even though she was afraid.", "She thought the hens mattered more than the light."], "ci": 2, "exp": "Ida &ldquo;admitted that she had been terrified,&rdquo; yet &ldquo;quitting had never seemed like a choice&rdquo; — she persevered while scared. &ldquo;She was never frightened&rdquo; is tempting because she acted bravely, but the passage says she was terrified.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Light on Gull Ledge</strong><br><p style=\"margin:0 0 8px;\">In the winter of 1857, fifteen-year-old Ida Marsh lived with her family in the lighthouse on Gull Ledge, a rocky island far off the coast of Maine. When her father rowed to the mainland for supplies, a storm arrived sooner than anyone expected. Waves crashed over the island for four weeks, and his boat could not return.</p><p style=\"margin:0 0 8px;\">Ida knew that ships passing in the dark depended on the light. Every evening she climbed the narrow tower stairs, trimmed the wicks of the lamps, and polished the soot from the glass so the beams would shine brightly. Her mother was ill, so Ida also cared for her younger sisters and kept the stove burning.</p><p style=\"margin:0 0 8px;\">One night, a wave tore through the henhouse. Ida waded into the freezing water and carried the hens to safety one at a time, even though her hands grew numb. She refused to let the light go dark, and when the storm finally calmed, her father rowed home to find every lamp still burning. Years later, Ida admitted that she had been terrified, but she said that quitting had never seemed like a choice.</p>"}, {"stem": "In the first stanza, the geese fly in &ldquo;a <b>ragged</b> V.&rdquo; What does <b>ragged</b> most likely mean here?", "opts": ["torn and dirty", "straight and orderly", "very noisy", "uneven and not perfectly lined up"], "ci": 3, "exp": "A V of real geese wobbles as birds change places, so <i>ragged</i> means uneven. &ldquo;Torn and dirty&rdquo; is another meaning of ragged (ragged clothes), but it does not fit a shape in the sky.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Geese Heading South</strong><br><em>a poem</em><br><p style=\"margin:0 0 8px;\">Above the brown and quiet fields,<br>a ragged V of geese appears;<br>they call like rusty garden gates<br>the way they&rsquo;ve called for countless years.</p><p style=\"margin:0 0 8px;\">The leader breaks the heavy wind,<br>then drops behind to rest a while;<br>another takes the point and pulls<br>the flock along for mile on mile.</p><p style=\"margin:0 0 8px;\">They do not argue, do not stop<br>to count how far the marshes lie;<br>they share the work and trust the sky<br>and stitch the clouds as they go by.</p><p style=\"margin:0 0 8px;\">I watch them till they disappear,<br>a whisper fading into blue,<br>and wish that people, when it&rsquo;s hard,<br>would share the load the way geese do.</p>"}, {"stem": "Why does the poet write that the geese &ldquo;call like rusty garden gates&rdquo;?", "opts": ["to use a metaphor that shows the geese are old and slow", "to use a simile that shows their calls sound harsh and creaky", "to show that the geese are flying over a garden", "to exaggerate how loud the geese are"], "ci": 1, "exp": "The word <i>like</i> signals a simile. Rusty gates squeak and creak, so the comparison helps the reader hear the geese&rsquo;s honking. It is not a metaphor (no <i>like</i> or <i>as</i>), and the fields are not gardens.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Geese Heading South</strong><br><em>a poem</em><br><p style=\"margin:0 0 8px;\">Above the brown and quiet fields,<br>a ragged V of geese appears;<br>they call like rusty garden gates<br>the way they&rsquo;ve called for countless years.</p><p style=\"margin:0 0 8px;\">The leader breaks the heavy wind,<br>then drops behind to rest a while;<br>another takes the point and pulls<br>the flock along for mile on mile.</p><p style=\"margin:0 0 8px;\">They do not argue, do not stop<br>to count how far the marshes lie;<br>they share the work and trust the sky<br>and stitch the clouds as they go by.</p><p style=\"margin:0 0 8px;\">I watch them till they disappear,<br>a whisper fading into blue,<br>and wish that people, when it&rsquo;s hard,<br>would share the load the way geese do.</p>"}, {"stem": "How is the message of &ldquo;Geese Heading South&rdquo; similar to what happens in &ldquo;The Birdhouse Contest&rdquo;?", "opts": ["Both show that winning first place is what matters most.", "Both show that it is better to work alone than with others.", "Both show that a hard job becomes easier when someone shares the work.", "Both show that nature can be dangerous for people."], "ci": 2, "exp": "In the poem, geese take turns leading so they &ldquo;share the load&rdquo;; in the story, Dante holds the boards and helps Sophie find a solution. Sophie did not win first place, and nature is not dangerous in either text.", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Geese Heading South</strong><br><em>a poem</em><br><p style=\"margin:0 0 8px;\">Above the brown and quiet fields,<br>a ragged V of geese appears;<br>they call like rusty garden gates<br>the way they&rsquo;ve called for countless years.</p><p style=\"margin:0 0 8px;\">The leader breaks the heavy wind,<br>then drops behind to rest a while;<br>another takes the point and pulls<br>the flock along for mile on mile.</p><p style=\"margin:0 0 8px;\">They do not argue, do not stop<br>to count how far the marshes lie;<br>they share the work and trust the sky<br>and stitch the clouds as they go by.</p><p style=\"margin:0 0 8px;\">I watch them till they disappear,<br>a whisper fading into blue,<br>and wish that people, when it&rsquo;s hard,<br>would share the load the way geese do.</p>"}, {"stem": "Which of these is <b>NOT</b> described in the poem?", "opts": ["The geese land in a marsh to rest for the night.", "The lead goose drops back so another can take its place.", "The geese make a creaky, honking sound.", "The flock flies away until the speaker can no longer see it."], "ci": 0, "exp": "The third stanza says the geese &ldquo;do not stop&rdquo; to count how far the marshes lie — they never land. The other three are in the poem: &ldquo;drops behind to rest,&rdquo; &ldquo;call like rusty garden gates,&rdquo; and &ldquo;I watch them till they disappear.&rdquo;", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Geese Heading South</strong><br><em>a poem</em><br><p style=\"margin:0 0 8px;\">Above the brown and quiet fields,<br>a ragged V of geese appears;<br>they call like rusty garden gates<br>the way they&rsquo;ve called for countless years.</p><p style=\"margin:0 0 8px;\">The leader breaks the heavy wind,<br>then drops behind to rest a while;<br>another takes the point and pulls<br>the flock along for mile on mile.</p><p style=\"margin:0 0 8px;\">They do not argue, do not stop<br>to count how far the marshes lie;<br>they share the work and trust the sky<br>and stitch the clouds as they go by.</p><p style=\"margin:0 0 8px;\">I watch them till they disappear,<br>a whisper fading into blue,<br>and wish that people, when it&rsquo;s hard,<br>would share the load the way geese do.</p>"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
