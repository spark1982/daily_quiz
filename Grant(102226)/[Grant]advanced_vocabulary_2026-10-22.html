<!DOCTYPE html>
<html lang="en">
<head>

<title>[Grant] Advanced Vocabulary</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

</style>

<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Grant] Advanced Vocabulary</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>
    <div class="dots-panel" id="dots-panel" style="display:none;"></div>
  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>
    <div class="q-text" id="q-text"></div>

</div>

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261022";
var RAW_QUESTIONS = [{"stem": "The student council had only $300, so they had to <b>allocate</b> the money carefully: $150 for the dance, $100 for posters, and $50 for snacks. What does <b>allocate</b> mean in this sentence?", "opts": ["to save something for a later year", "to decide how something will be divided and given out for different uses", "to collect money from many people", "to spend everything on one thing"], "ci": 1, "exp": "<i><b>allocate</b></i> (v.) to set aside or share out something for a certain purpose. <i>The coach will <b>allocate</b> ten minutes of practice to free throws.</i> Family: allocation (n.) The council split the $300 into parts for different uses.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After the race ended in a near tie, the judges decided to _____ the votes to make sure the winner was correct.", "opts": ["recount", "summarize", "classify", "distribute"], "ci": 0, "exp": "<i><b>recount</b></i> (v.) to count again; also, to tell what happened. <i>The class had to <b>recount</b> the money because the total looked wrong.</i> Family: recount (n.) Checking whether votes are correct means counting them again, not sorting (<i>classify</i>) or handing them out (<i>distribute</i>).", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "It takes Earth about 365 days to make one <b>revolution</b> around the sun. Which meaning of <b>revolution</b> is used here?", "opts": ["a sudden fight to change a government", "a big change in how people live or work", "one complete trip around something", "a turn of a planet on its own axis"], "ci": 2, "exp": "<i><b>revolution</b></i> (n.) (1) a complete trip around something; (2) a fight to replace a government; (3) a huge change. <i>The American <b>Revolution</b> began in 1775.</i> Family: revolve (v.), revolutionary (adj.) Earth's year-long trip around the sun is one complete orbit. Spinning on its own axis is a <i>rotation</i>, which takes a day.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Every snowflake is <b>unique</b>; scientists have never found two with exactly the same pattern. What does <b>unique</b> mean in this sentence?", "opts": ["very cold and fragile", "common and easy to find", "being the only one of its kind", "too small to see"], "ci": 2, "exp": "<i><b>unique</b></i> (adj.) the only one of its kind; not like anything else. <i>Your fingerprints are <b>unique</b> to you.</i> Family: uniquely (adv.), uniqueness (n.) No two snowflakes are the same, so each one is the only one of its kind.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "During the summer, Liam and his cousin in Texas <b>correspond</b> by writing letters every week. Which meaning of <b>correspond</b> is used here?", "opts": ["to match or agree with something", "to write to each other and send messages", "to be similar in size or shape", "to answer a question in class"], "ci": 1, "exp": "<i><b>correspond</b></i> (v.) (1) to write to each other; (2) to match or agree with something. <i>The numbers on the map <b>correspond</b> to the pictures below.</i> Family: correspondence (n.), corresponding (adj.) Here the cousins are sending letters, so it means writing to each other — not matching.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Her nervousness began to <b>manifest</b> itself in shaky hands and a quiet voice. Which word means the <b>SAME</b> or nearly the same as <b>manifest</b>?", "opts": ["hide", "cause", "calm", "show"], "ci": 3, "exp": "<i><b>manifest</b></i> (v.) to show something clearly so others can see it. <i>His love of animals <b>manifested</b> itself in his many drawings of dogs.</i> Family: manifestation (n.) <i>Hide</i> means the opposite. The nervousness was shown through her hands and voice.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The crowd let out a <b>tremendous</b> cheer when the home team scored in the last second. Which word means the <b>SAME</b> or nearly the same as <b>tremendous</b>?", "opts": ["tiny", "sudden", "enormous", "pleasant"], "ci": 2, "exp": "<i><b>tremendous</b></i> (adj.) very great in size, amount, or power. <i>The waterfall made a <b>tremendous</b> roar.</i> Family: tremendously (adv.) <i>Tiny</i> is the opposite. <i>Sudden</i> describes timing, not size.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The two neighbors met to _____ where the new fence should go, and each agreed to give up a little space.", "opts": ["investigate", "negotiate", "examine", "hesitate"], "ci": 1, "exp": "<i><b>negotiate</b></i> (v.) to talk with others to reach an agreement. <i>Sam tried to <b>negotiate</b> a later bedtime with his parents.</i> Family: negotiation (n.), negotiator (n.) Talking and each giving up a little to agree is negotiating; <i>investigate</i> and <i>examine</i> mean to look closely, not to make a deal.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "On a globe, the lines that measure how far a place is north or south of the equator show its _____.", "opts": ["frontier", "boundary", "latitude", "territory"], "ci": 2, "exp": "<i><b>latitude</b></i> (n.) distance north or south of the equator, measured in degrees. <i>Places at a high <b>latitude</b>, like Alaska, have very cold winters.</i> A <i>boundary</i> or <i>frontier</i> is an edge or border, not a measure of distance from the equator.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "After the new library opened, the number of kids checking out books showed a <b>dramatic</b> increase — it nearly tripled in one month. What does <b>dramatic</b> mean in this sentence?", "opts": ["slow and steady", "small but surprising", "expected by everyone", "sudden and very large or noticeable"], "ci": 3, "exp": "<i><b>dramatic</b></i> (adj.) sudden and very noticeable; big enough to surprise people. <i>There was a <b>dramatic</b> drop in temperature when the cold front arrived.</i> Family: drama (n.), dramatically (adv.) Nearly tripling in one month is a big, sudden change.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After months of practice, Nadia was finally able to <b>conquer</b> her fear of the high diving board. Which word means the <b>OPPOSITE</b> of <b>conquer</b>?", "opts": ["defeat", "surrender", "explain", "remember"], "ci": 1, "exp": "<i><b>conquer</b></i> (v.) to defeat or overcome something by fighting or effort. <i>The climbers <b>conquered</b> the steep mountain.</i> Family: conquest (n.), conqueror (n.) <i>Defeat</i> is a synonym — a trap. The opposite of overcoming something is giving up to it, or surrendering.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Before the hurricane season, the town mailed every family a <b>comprehensive</b> safety guide that covered food, water, power outages, pets, and flooded roads. What does <b>comprehensive</b> mean in this sentence?", "opts": ["short and quick to read", "including all or nearly all of the important parts", "written mostly for experts", "printed in several languages"], "ci": 1, "exp": "<i><b>comprehensive</b></i> (adj.) including everything or almost everything that is needed. <i><b>Comprehensive</b> notes cover every topic that will be on the test.</i> Family: comprehend (v.), comprehension (n.) The guide covered many different topics, so it was complete — not short or quick.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "In 1607, English settlers started a <b>colony</b> at Jamestown, but the land was still ruled by the king of England, thousands of miles away. What does <b>colony</b> mean in this sentence?", "opts": ["a large city that rules itself", "a group of soldiers sent to fight", "a trading ship that crosses the ocean", "a settlement in a new land that is controlled by a faraway country"], "ci": 3, "exp": "<i><b>colony</b></i> (n.) a place settled by people from another country and controlled by that country. <i>Georgia was the last of the thirteen English <b>colonies</b>.</i> Family: colonist (n.), colonial (adj.), colonize (v.) The settlement was ruled by a faraway king, so it did not rule itself.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "That factory can <b>manufacture</b> about 2,000 bicycles a week using machines and a long assembly line. What does <b>manufacture</b> mean in this sentence?", "opts": ["to repair old or broken products", "to sell products in stores", "to make products in large numbers, usually with machines", "to design a product on paper"], "ci": 2, "exp": "<i><b>manufacture</b></i> (v.) to make goods in large amounts, often in a factory. <i>Many companies <b>manufacture</b> toys overseas.</i> Family: manufacturer (n.), manufacturing (n.) Machines and an assembly line making 2,000 bikes a week means making products in large numbers.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before answering the riddle, Ava sat quietly for a minute to _____ what it could mean.", "opts": ["conceal", "justify", "reveal", "ponder"], "ci": 3, "exp": "<i><b>ponder</b></i> (v.) to think carefully about something for a while. <i>He <b>pondered</b> the chess board before making his move.</i> Family: ponderous is a different word meaning slow and heavy Sitting quietly to figure out a riddle means thinking carefully about it.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The campers added more wood to <b>sustain</b> the fire through the cold night. Which word means the <b>OPPOSITE</b> of <b>sustain</b>?", "opts": ["maintain", "build", "end", "warm"], "ci": 2, "exp": "<i><b>sustain</b></i> (v.) to keep something going over time. <i>Food and water <b>sustain</b> life.</i> Family: sustainable (adj.), sustainability (n.) <i>Maintain</i> is a synonym — it means the same thing, so it is a trap. The opposite of keeping the fire going is ending it.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Blue and orange are _____ colors: when you put them side by side, each one makes the other look brighter.", "opts": ["complement", "complementary", "complementing", "complemented"], "ci": 1, "exp": "<i><b>complement</b></i> (v./n.) to complete something or make it better by adding to it. <i>The gravy <b>complemented</b> the mashed potatoes.</i> Family: complementary (adj.) The blank comes before the noun <i>colors</i>, so it needs an adjective: <i>complementary</i>. (Don't mix it up with <i>complimentary</i>, which means praising or free.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Mom checked the cooler and said, “We have <b>sufficient</b> water for the hike, so we don’t need to stop at the store.” What does <b>sufficient</b> mean in this sentence?", "opts": ["more than anyone could ever use", "enough for what is needed", "clean and cold", "not quite enough"], "ci": 1, "exp": "<i><b>sufficient</b></i> (adj.) as much as is needed; enough. <i>Two sandwiches were <b>sufficient</b> for lunch.</i> Family: insufficient (adj., not enough), suffice (v.) They did not need to buy more, so the water was enough — not extra, and not too little.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "During a fire drill, our class follows the same <b>procedure</b> every time: line up quietly, leave by the side door, and meet at the flagpole. What does <b>procedure</b> mean in this sentence?", "opts": ["a set way of doing something, with steps in order", "a rule that punishes students", "a quick guess about what to do", "a loud warning signal"], "ci": 0, "exp": "<i><b>procedure</b></i> (n.) a series of steps done in a certain order. <i>The nurse explained the <b>procedure</b> before giving the shot.</i> Family: proceed (v.), procedural (adj.) Lining up, leaving, and meeting are steps done in order the same way each time.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "A smile is understood _____ — people in every country know it means someone is friendly.", "opts": ["universal", "universe", "universality", "universally"], "ci": 3, "exp": "<i><b>universal</b></i> (adj.) true or shared everywhere and by everyone. <i>Water is a <b>universal</b> need for living things.</i> Family: universally (adv.), universe (n.) The blank describes <i>how</i> a smile is understood, so it needs the adverb ending in <i>-ly</i>.", "tag": "Word Family", "tagcolor": "#f5a623"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
