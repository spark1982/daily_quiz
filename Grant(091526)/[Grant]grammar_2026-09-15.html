<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#185FA5;padding:10px 0 2px;}

.q-tag{display:inline-block;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.passage-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.88rem;color:#222;line-height:1.6;max-height:260px;overflow-y:auto;}
.context-label{font-size:0.92rem;font-weight:600;color:#333;margin-bottom:8px;line-height:1.4;}
.context-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;line-height:1.6;}

.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}

.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;}
.hint-btn{background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block;}
.hint-box{background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none;}

.next-btn{background:#185FA5;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}

.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;}

<script>
(function(){
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar";
var LS_KEY = "quiz_grantgrammar_20260915";
var ATT_KEY = "quiz_grantgrammar_att_20260915";
var TAG_COLORS = {"Irregular Plurals": "#185FA5", "Objective Complement": "#185FA5", "Perfect Tense": "#185FA5", "Object vs Complement": "#185FA5", "Comparative / Superlative": "#185FA5", "Have vs Had": "#185FA5", "Indirect / Direct Object": "#185FA5", "Irregular Verbs (Past Tense)": "#185FA5", "Adjective Order": "#185FA5", "Past Perfect": "#185FA5", "Present Progressive": "#185FA5", "Present Participle": "#185FA5", "Subject-Verb Agreement": "#185FA5", "Possessives": "#185FA5", "Inversion": "#185FA5", "3rd Person Singular": "#185FA5", "Subject & Verb Identification": "#185FA5", "Parts of Speech": "#185FA5", "Past vs Present Perfect": "#185FA5", "Passive Voice": "#185FA5", "Punctuation & Capitalization": "#185FA5", "Gerund vs Participle": "#185FA5", "Prepositions": "#185FA5", "Complete Sentences": "#185FA5"};
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
var RAW_QUESTIONS = [{"stem": "What is the plural of <b>pike</b> (the fish)?", "opts": ["pikes", "pikees", "pikeies", "pike"], "ci": 3, "exp": "pike → pike (no change when referring to the fish)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "They chose her team leader.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["team leader", "her"], "ci": 0, "exp": "\"Team leader\" is the objective complement — it names the role given to \"her.\" \"Her\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "She <span style=\"text-decoration:underline;\">______</span> enough money for college by the end of this year.", "opts": ["had saved", "has saved", "will have saved", "saves"], "ci": 2, "exp": "\"will have saved\" is future perfect — she will reach her savings goal before year-end.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "They grow <u>flowers</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Flowers\" receives the action of \"grow.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "trim<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["trimmer / trimmest", "trimer / trimest", "more trim / most trim", "trimm / trimmest"], "ci": 0, "exp": "trim → trimmer / trimmest (short vowel + single consonant: double the -m)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "She _____ grown a lot since I last saw her.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" (has) is correct. The growth connects the past to the present moment.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "He passed me the ball.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["the ball", "me"], "ci": 0, "exp": "\"The ball\" is the direct object (what was passed). \"Me\" is the indirect object (who received it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>write</b>?", "opts": ["wrote", "writed", "written", "wroted"], "ci": 0, "exp": "The past tense of <b>write</b> is <b>wrote</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["three gorgeous silk scarves", "gorgeous three silk scarves", "silk three gorgeous scarves", "three silk gorgeous scarves"], "ci": 0, "exp": "Correct order: number (three) → opinion (gorgeous) → material (silk) → noun\n✔ three gorgeous silk scarves", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>shut</b> &rsaquo; Past: <b>shut</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["shutted", "shutting", "shutten", "shut"], "ci": 3, "exp": "'shut' is an irregular verb. Its past participle is 'shut'. Past perfect: had shut.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "He is <u>hope</u> for good news.", "opts": ["hoping", "hopeing", "hopping", "hoped"], "ci": 0, "exp": "hope → hoping (drop -e, add -ing — 'hopping' means jumping, which is different!)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The kettle is <b>whistling</b> on the stove.", "The <b>whistling</b> kettle signaled that the water was ready.", "The kettle was <b>whistling</b> loudly a moment ago.", "<b>Whistling</b> while you work can make chores more fun."], "ci": 1, "exp": "In \"The whistling kettle signaled that the water was ready,\" \"whistling\" comes directly before the noun \"kettle\" and describes what the kettle is doing - this adjective use of an -ing word is a present participle. In \"The kettle is whistling on the stove\" and \"The kettle was whistling loudly a moment ago,\" \"whistling\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Whistling while you work can make chores more fun,\" \"whistling\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["Both of the answers was marked wrong on the test.", "Both players on the starting lineup runs five miles every day.", "Both of the answers were marked wrong on the test.", "Both of the windows in the hallway is stuck and will not open."], "ci": 2, "exp": "\"Both\" is plural, so \"were\" is correct. \"Was\" is singular — wrong for both. \"Both players\" is plural — use \"run.\" \"Both of the windows\" is plural — use \"are.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The company's revenue doubled this year.", "The trophy is her's to keep forever.", "The pond was known for it's beauty.", "The mens' bathroom is under renovation."], "ci": 0, "exp": "<strong>\"company's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>her's</em> does not exist; the correct form is <em>hers</em>.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>mens'</em> is wrong — <em>men</em> is already plural; the possessive is <em>men's</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">The team only discovered the error after the project was submitted.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Only after the project was submitted the team discovered the error.", "Only after the project was submitted did the team discover the error.", "Only after the project was submitted did the team discovered the error.", "Only after did the project submit did the team discover the error."], "ci": 1, "exp": "With \"Only after + clause\", the main clause inverts: \"Only after the project was submitted + did + the team + discover...\". The base form \"discover\" (not \"discovered\") follows \"did\". The correct form is: Only after the project was submitted did the team discover the error.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "The eagle <u>fly</u> high above the mountains.", "opts": ["flies", "flys", "flyes", "flyies"], "ci": 0, "exp": "fly → flies (consonant + y: drop -y, add -ies)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "After the heavy rainstorm finally stopped, the flooded streets slowly began to clear.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["began", "stopped", "clear", "flooded"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "The brilliant scientist carefully analyzed the complex data she had collected during her extensive fieldwork.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADVERBS in this sentence, and only the adverbs?</span>", "opts": ["carefully", "carefully, fieldwork", "(none of these)", "carefully, brilliant"], "ci": 0, "exp": "'Carefully' is an adverb - it modifies 'analyzed'.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "I ________ learning guitar.", "opts": ["recently started", "have recently started"], "ci": 1, "exp": "Recently with present relevance = present perfect: have recently started.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The police <b>arrested</b> the suspect.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The suspect ______ by the police.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["were arrested", "was arrested", "was arresting", "was arrest"], "ci": 1, "exp": "The new subject \"the suspect\" is singular and the action is in the past, so use was + the past participle \"arrested\": was arrested.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["Have you read the book, \"The Giver\" by Lois Lowry?", "Have you read the book \"The Giver\" by Lois Lowry?", "Have you read the book \"the giver\" by Lois Lowry?", "Have you read the book \"The Giver,\" by Lois Lowry?"], "ci": 1, "exp": "Book titles use title case (major words capitalized). When a book title is used as a direct object with no introductory pause, no comma is needed before the title. No comma is needed after the closing quotation mark here because the title is not a nonessential element.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["My grandmother is <b>sewing</b> a quilt.", "She was <b>sewing</b> a costume for the play.", "He is interested in <b>sewing</b> his own clothes.", "They will be <b>sewing</b> new curtains next week."], "ci": 2, "exp": "In \"He is interested in sewing his own clothes,\" \"sewing\" is the object of the preposition \"in\" - a noun role - which makes it a gerund. In the other three sentences, \"sewing\" follows \"is / was / will be\" and is part of the progressive verb tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "The two countries agreed to cooperate _____ each other to address the growing climate challenges.", "opts": ["against", "with", "beside", "among"], "ci": 1, "exp": "\"With\" indicates working together in partnership. \"Against\" means opposition, which is the opposite meaning. \"Cooperate with\" is the standard English phrase.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Although the movie received poor reviews.", "The fireflies lit up the summer night.", "Packed tightly into a small brown box.", "Down the steep hill and across the bridge."], "ci": 1, "exp": "\"The fireflies lit up the summer night.\" is a complete sentence — subject: 'The fireflies', predicate: 'lit'. The others are fragments: an 'Although' clause, a participial phrase, and a prepositional phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}];
var DEBATE_MODE = false;
var TIMED = false;
var TIME_LIMIT = 40;
var TTS_LANG = "ko-KR";

var order = [];
var state = {};
var hintShown = false;
var paused = false;
var timerHandle = null;

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }
function incAttempts(){ localStorage.setItem(ATT_KEY, loadAttempts()+1); }

function defaultOrder(){ var a=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) a.push(i); return a; }

function resetState(randomOrder){
  order = defaultOrder();
  if (randomOrder) {
    for (var k=order.length-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=order[k]; order[k]=order[j]; order[j]=t; }
  }
  state = { cur:0, answers:{}, shuffles:{}, showResults:false, order:order.slice() };
  if (TIMED) {
    state.timers = {};
    for (var i=0;i<RAW_QUESTIONS.length;i++) state.timers[i] = { remaining: TIME_LIMIT, timedOut:false, running:false };
  }
}

function loadState(){
  try {
    var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.order) {
      state = s;
      order = s.order;
    } else {
      resetState(false);
    }
  } catch(e) {
    localStorage.removeItem(LS_KEY);
    resetState(false);
  }
}

function saveState(){
  state.order = order;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function getShuffle(qi){
  if (!state.shuffles[qi]) {
    var n = RAW_QUESTIONS[qi].opts.length;
    var a = []; for (var i=0;i<n;i++) a.push(i);
    for (var k=n-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[qi] = a;
  }
  return state.shuffles[qi];
}
function getCSI(qi){ return getShuffle(qi).indexOf(RAW_QUESTIONS[qi].ci); }

function isTimedOut(qi){ return TIMED && state.timers && state.timers[qi] && state.timers[qi].timedOut; }
function isAnswered(qi){ return state.answers[qi] !== undefined || isTimedOut(qi); }
function isCorrectAns(qi){ return state.answers[qi] !== undefined && state.answers[qi] === getCSI(qi); }

function updateNav(){
  var ans = 0;
  for (var p=0;p<order.length;p++) if (isAnswered(order[p])) ans++;
  document.getElementById('nav-count').textContent = ans + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (order.length? (ans/order.length*100):0).toFixed(1) + '%';
  renderDots();
}

function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'none' || !p.style.display) {
    p.style.display = 'block'; b.innerHTML = 'Hide &#9652;'; renderDots();
  } else {
    p.style.display = 'none'; b.innerHTML = 'Jump &#9662;';
  }
}

function renderDots(){
  var p = document.getElementById('dot-panel');
  if (p.style.display === 'none' || !p.style.display) return;
  var h = '';
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var bg = !isAnswered(qi) ? '#d7dde6' : (isCorrectAns(qi) ? '#185FA5' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+qi+')">' + (pos+1) + '</span>';
  }
  var allAns = true;
  for (var pos2=0; pos2<order.length; pos2++) if (!isAnswered(order[pos2])) { allAns = false; break; }
  if (allAns && order.length>0) {
    h += '<br><span onclick="finishQuiz()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}

function goToQ(qi){
  var pos = order.indexOf(qi);
  if (pos === -1) pos = 0;
  state.cur = pos; state.showResults = false; saveState(); render();
  document.getElementById('dot-panel').style.display = 'none';
  document.getElementById('jump-btn').innerHTML = 'Jump &#9662;';
}

function speak(text, lang){
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function speakCurrent(){
  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  if (q && q.tts) speak(q.tts, TTS_LANG);
}
window.speakCurrent = speakCurrent;

function updateAttDisplay(){ /* no-op placeholder for subtitle; title fixed */ }



function render(){
  if (state.showResults) { renderResults(); return; }
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  updateNav();

  var pos = state.cur;
  var qi = order[pos];
  var q = RAW_QUESTIONS[qi];

  document.getElementById('q-num').textContent = 'Question ' + (pos+1) + ' of ' + order.length;


  var tagEl = document.getElementById('q-tag-label');
  if (q.tag) {
    tagEl.style.display = 'inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#185FA5';
  } else {
    tagEl.style.display = 'none';
  }


  var pb = document.getElementById('passage-box');
  if (q.passage) { pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; }



  document.getElementById('q-text').innerHTML = q.stem;
  var ttsBtn = document.getElementById('tts-btn');
  if (q.tts) { ttsBtn.style.display = 'inline-block'; } else { ttsBtn.style.display = 'none'; }

  var sh = getShuffle(qi);
  var ans = state.answers[qi];
  var csi = getCSI(qi);
  var timedOut = TIMED && state.timers[qi] && state.timers[qi].timedOut;
  var html = '';
  for (var s=0; s<sh.length; s++) {
    var oi = sh[s];
    var cls = 'opt-btn';
    var dis = '';
    if (ans !== undefined || timedOut) {
      dis = 'disabled';
      if (s === csi) cls += ' correct';
      else if (s === ans) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+qi+','+s+')">' + q.opts[oi] + '</button>';
  }
  document.getElementById('opts-area').innerHTML = html;



  var eb = document.getElementById('exp-box');
  if ((ans !== undefined && ans !== csi) || timedOut) {
    eb.style.display = 'block';
    eb.textContent = q.exp;
  } else {
    eb.style.display = 'none';
  }

  document.getElementById('next-btn').textContent = (pos === order.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (pos === 0);


}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  if (TIMED && state.timers[qi] && state.timers[qi].timedOut) return;
  state.answers[qi] = si;

  saveState(); render();
}

function finishQuiz(){
  state.showResults = true;
  incAttempts();
  saveState(); render(); reportResult();
}

function goNext(){
  if (state.cur === order.length-1) { finishQuiz(); return; }
  state.cur = Math.min(order.length-1, state.cur+1);
  saveState(); render();
}

function go(dir){

  if (dir === 1) {
    if (state.cur === order.length - 1) {
      state.showResults = true; incAttempts(); saveState(); render(); reportResult();
      return;
    }
    state.cur = Math.min(order.length-1, state.cur+1);
    saveState(); render();
    return;
  }
  state.cur = Math.max(0, state.cur-1);
  saveState(); render();
}

function renderResults(){
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';

  updateNav();

  var c=0,w=0,sk=0;
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (!isAnswered(qi)) sk++;
    else if (isCorrectAns(qi)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;' +
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;' +
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html = '';
  for (var pos2=0; pos2<order.length; pos2++) {
    var qi2 = order[pos2];
    var label,bg,tc;
    if (!isAnswered(qi2)) { label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (isCorrectAns(qi2)) { label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label = isTimedOut(qi2) ? 'Timed Out' : 'Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var stemText = String(RAW_QUESTIONS[qi2].stem).replace(/<[^>]*>/g,'').substring(0,60);
    html += '<div class="results-card" onclick="goToQ('+qi2+')">' +
      '<span style="font-size:0.95rem;font-weight:600;color:#333;">Q'+(pos2+1)+'. '+stemText+'</span>' +
      '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>' +
      '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function retryWrong(){
  var wrongQi = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      wrongQi.push(qi);
    }
  }
  if (wrongQi.length === 0) return;
  for (var i=0;i<wrongQi.length;i++) {
    delete state.answers[wrongQi[i]];
    delete state.shuffles[wrongQi[i]];
    if (TIMED && state.timers) { state.timers[wrongQi[i]] = { remaining: TIME_LIMIT, timedOut:false, running:false }; }
  }
  order = wrongQi;
  state.order = order;
  state.cur = 0; state.showResults = false;
  saveState(); render();
}

function toggleHint(){
  hintShown = !hintShown;
  var b = document.getElementById('hint-btn'), x = document.getElementById('hint-box');
  if (hintShown) { x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function stripTags(s){ return String(s).replace(/<[^>]*>/g,''); }

function copyRes(){
  var lines = [TITLE + ' - Results'];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var lbl = !isAnswered(qi) ? 'Skipped' : (isCorrectAns(qi) ? 'Correct' : (isTimedOut(qi) ? 'Timed Out' : 'Wrong'));
    lines.push('Q'+(pos+1)+' '+stripTags(RAW_QUESTIONS[qi].stem)+': '+lbl);
  }
  var txt = lines.join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}

function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

function saveWrong(){
  var wrongAnswers = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var a = state.answers[qi];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      var q = RAW_QUESTIONS[qi];
      var sh = getShuffle(qi);
      wrongAnswers.push({
        question: stripTags(q.stem),
        yourAnswer: (a===undefined) ? '(no answer - time ran out)' : stripTags(q.opts[sh[a]]),
        correctAnswer: stripTags(q.opts[q.ci]),
        explanation: stripTags(q.exp)
      });
    }
  }
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  try {
    var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a2 = document.createElement('a');
    a2.href = url;
    a2.download = QUIZ_KEY + '_wrong.json';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e){}
}

var freshRandom = false;
function openFreshModal(randomOrder){ freshRandom = !!randomOrder; document.getElementById('freshModal').style.display='flex'; }
function confirmFresh(){
  document.getElementById('freshModal').style.display='none';
  localStorage.removeItem(LS_KEY);

  resetState(freshRandom);
  saveState(); render();
}

function reportResult(){
  try {
    var correct=0, wrong=0, skipped=0;
    for (var pos=0; pos<order.length; pos++) {
      var qi = order[pos];
      var a = state.answers[qi];

      if (a===undefined) {
        skipped++;
        continue;
      }
      if (a===getCSI(qi)) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if (TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if (TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if (TITLE.indexOf('[Both]')===0) childName='Both';
    else if (TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY,
      attemptNumber: loadAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  } catch(e){}
}

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;
window.copyRes = copyRes;
window.saveWrong = saveWrong;
window.openFreshModal = openFreshModal;
window.confirmFresh = confirmFresh;
window.speak = speak;


loadState(); saveState(); render();
})();
</script>
</body>
