<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Speed Quiz</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#185FA5;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;min-height:1px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:10px 0;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:140px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.q-tag{display:inline-block;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.passage-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.88rem;color:#222;line-height:1.6;max-height:260px;overflow-y:auto;}
.context-label{font-size:0.92rem;font-weight:600;color:#333;margin-bottom:8px;line-height:1.4;}
.context-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;line-height:1.6;}
.q-text{font-size:1.05rem;font-weight:700;color:#111;margin-bottom:12px;line-height:1.5;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;}
.hint-btn{background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block;}
.hint-box{background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none;}
.hint-box.show{display:block;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
.timer-box{text-align:center;font-size:1.1rem;font-weight:800;margin-bottom:8px;}
.timer-box.warn{color:#E24B4A;}
.pause-btn{background:#e8edf4;color:#185FA5;border:none;border-radius:8px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.pause-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.96);z-index:90;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:#185FA5;}

.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;}
.frac .den{border-top:1.4px solid #111;}
</style>
</head>
<body>
<div class="title-hd">[Grant] Speed Quiz</div>
<div class="instruction" id="instruction">Answer each problem before time runs out. Numbers are taken exactly as given — work carefully and quickly!</div>
<div class="timer-box" id="timer-box"></div>
<div style="text-align:center;margin-bottom:8px;"><button class="pause-btn" onclick="togglePause()" id="pause-btn">Pause</button></div>
<div id="nav-bar">
  <span id="nav-count">0 / N</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>
<div id="quizArea" style="display:none;">
  <div><span class="q-tag" id="q-tag-label"></span></div>
  <div class="q-num" id="q-num"></div>
  <div class="context-label" id="context-label" style="display:none;"></div>
  <div class="passage-box" id="passage-box" style="display:none;"></div>
  <div class="context-box" id="context-box" style="display:none;"></div>
  <div class="q-text" id="q-text" style="display:inline;"></div>
  <button id="tts-btn" onclick="speakCurrent()" title="Listen" style="display:none;background:#e8edf4;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:0.95rem;margin-left:6px;vertical-align:middle;">&#128264;</button>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>
<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#185FA5;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="saveWrong()" style="display:block;width:100%;padding:13px;background:#f5a623;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Save Wrong Answers</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal(false)" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>
<div class="pause-overlay" id="pauseOverlay">Paused</div>

<script>
(function(){
var TITLE = "[Grant] Speed Quiz";
var QUIZ_KEY = "grantspeedquiz";
var LS_KEY = "quiz_grantspeedquiz_20260915";
var ATT_KEY = "quiz_grantspeedquiz_att_20260915";
var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
var RAW_QUESTIONS = [{"stem": "Compute the following series.<br>1 + 2 + 3 + 4 + &hellip; + 48 + 49 + 50", "opts": ["1300", "1225", "1275", "1250"], "ci": 2, "exp": "Pair the first and last terms: (1+50)+(2+49)+&hellip; = 51 &times; 25 pairs = 1275.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>2 + 4 + 6 + 8 + &hellip; + 46 + 48 + 50", "opts": ["600", "650", "625", "675"], "ci": 1, "exp": "This is 2 &times; (1+2+3+&hellip;+25) = 2 &times; 325 = 650.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>1 + 3 + 5 + 7 + &hellip; + 45 + 47 + 49", "opts": ["650", "625", "600", "576"], "ci": 1, "exp": "The sum of the first n odd numbers is n&sup2;. There are 25 odd numbers from 1 to 49, so the sum is 25&sup2; = 625.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?", "opts": ["100", "90", "105", "95"], "ci": 3, "exp": "The coins saved each week form 5, 6, 7, &hellip;, 14 (10 terms). Sum = (5+14) &times; 10 &divide; 2 = 95.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "There are 20 teams in the North Volleyball League. Each team must play exactly one match with every other team. How many matches are to be played altogether in the league?", "opts": ["200", "180", "210", "190"], "ci": 3, "exp": "This is the sum 1+2+&hellip;+19 = 19&times;20&divide;2 = 190 matches (each pair of teams plays once).", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Find the sum of all multiples of 4 that are smaller than or equal to 40.", "opts": ["220", "210", "240", "200"], "ci": 0, "exp": "The multiples are 4+8+&hellip;+40 = 4 &times; (1+2+&hellip;+10) = 4 &times; 55 = 220.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Joe puts 5 matchsticks on a table. Each matchstick is 10 cm away from the next one, in a straight line. How far is the fifth matchstick away from the first one?", "opts": ["30", "45", "40", "50"], "ci": 2, "exp": "From the 1st to the 5th matchstick there are 4 gaps, so the distance is 4 &times; 10 cm = 40 cm.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "A sailor tied 7 knots on a rope at regular intervals. The distance from the first knot to the seventh one was 18 m long. What is the distance between every two knots?", "opts": ["2.5", "3", "2", "3.6"], "ci": 1, "exp": "From the 1st to the 7th knot there are 6 gaps, so each gap is 18 &divide; 6 = 3 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "It takes John 8 minutes to saw a log into 3 equal lengths. How long does it take for him to saw the same log into 9 equal lengths?", "opts": ["24", "36", "32", "40"], "ci": 2, "exp": "3 equal lengths need 2 cuts, so each cut takes 8 &divide; 2 = 4 minutes. 9 equal lengths need 8 cuts, so it takes 8 &times; 4 = 32 minutes.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "David uses some coins to form a triangle. There is a coin at every corner. How many coins does he use if there are 6 coins on each side of the triangle?", "opts": ["18", "16", "15", "12"], "ci": 2, "exp": "Each side has 6 coins, but the 3 corner coins are shared between two sides. Total = 3 &times; (6&minus;1) = 15 coins.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?", "opts": ["120", "125", "100", "130"], "ci": 0, "exp": "25 trees create 24 gaps between them, so the road is 24 &times; 5 m = 120 m long.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "16 lamp posts are placed at regular intervals along a road that is 300 m long. If lamp posts are placed at both ends of the road as well, how far is one lamp post from another?", "opts": ["18", "25", "15", "20"], "ci": 3, "exp": "16 lamp posts at both ends create 15 gaps, so each gap is 300 &divide; 15 = 20 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>54 + 46 =", "opts": ["90", "80", "100", "110"], "ci": 2, "exp": "Regroup: 54 + 46 = (54+6) + 40 = 60 + 40 = 100.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>33 + 47 =", "opts": ["70", "80", "75", "90"], "ci": 1, "exp": "Regroup: 33 + 47 = (33+7) + 40 = 40 + 40 = 80.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>24 + 55 + 76 =", "opts": ["145", "150", "160", "155"], "ci": 3, "exp": "Group 24 and 76 first: 24 + 76 = 100. Then 100 + 55 = 155.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>284 + 118 =", "opts": ["392", "412", "400", "402"], "ci": 3, "exp": "284 + 118 = 284 + 116 + 2 = 400 + 2 = 402.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>383 + 1,005 =", "opts": ["1398", "1378", "1388", "1288"], "ci": 2, "exp": "383 + 1,005 = 383 + 1,000 + 5 = 1,383 + 5 = 1,388.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>650 &minus; 238 &minus; 162 =", "opts": ["250", "270", "240", "260"], "ci": 0, "exp": "Group the subtractions: 238 + 162 = 400. Then 650 &minus; 400 = 250.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>24 &times; 25 =", "opts": ["550", "650", "600", "500"], "ci": 2, "exp": "24 &times; 25 = 6 &times; 4 &times; 25 = 6 &times; 100 = 600.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>36 &times; 25 =", "opts": ["900", "800", "950", "850"], "ci": 0, "exp": "36 &times; 25 = 9 &times; 4 &times; 25 = 9 &times; 100 = 900.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>48 &times; 125 =", "opts": ["6000", "5500", "5000", "6500"], "ci": 0, "exp": "48 &times; 125 = 6 &times; 8 &times; 125 = 6 &times; 1,000 = 6,000.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>88 &times; 125 =", "opts": ["11000", "10000", "11500", "10500"], "ci": 0, "exp": "88 &times; 125 = 11 &times; 8 &times; 125 = 11 &times; 1,000 = 11,000.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>40 &times; 99 =", "opts": ["3860", "3900", "3960", "4000"], "ci": 2, "exp": "40 &times; 99 = 40 &times; 100 &minus; 40 = 4,000 &minus; 40 = 3,960.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>33 &times; 101 =", "opts": ["3333", "3033", "3300", "3363"], "ci": 0, "exp": "33 &times; 101 = 33 &times; 100 + 33 = 3,300 + 33 = 3,333.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "5 points A, B, C, D, and E are marked on a straight line so that no two of the segments between any pair of points have the same length.<br><svg width=\"260\" height=\"80\" viewBox=\"0 0 260 80\" style=\"display:block;margin:10px auto;\"><line x1=\"20\" y1=\"50\" x2=\"240\" y2=\"50\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20.0\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"20.0\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"66.8\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"66.8\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"141.7\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"141.7\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"179.1\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"179.1\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"240.0\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"240.0\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>How many different lengths of line segments are formed in total (counting every pair of points)?", "opts": ["12", "9", "8", "10"], "ci": 3, "exp": "The number of segments formed by choosing any 2 of the 5 points is C(5,2) = (5&times;4)&divide;2 = 10. Since no two segments share a length, there are 10 different lengths.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "6 points A, B, C, D, E, and F are marked on a straight line so that no two of the segments between any pair of points have the same length.<br><svg width=\"260\" height=\"80\" viewBox=\"0 0 260 80\" style=\"display:block;margin:10px auto;\"><line x1=\"20\" y1=\"50\" x2=\"240\" y2=\"50\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20.0\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"20.0\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"57.9\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"57.9\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"118.6\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"118.6\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"149.0\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"149.0\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"198.3\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"198.3\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"240.0\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"240.0\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>How many different lengths of line segments are formed in total (counting every pair of points)?", "opts": ["15", "12", "18", "20"], "ci": 0, "exp": "The number of segments formed by choosing any 2 of the 6 points is C(6,2) = (6&times;5)&divide;2 = 15. Since no two segments share a length, there are 15 different lengths.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "7 points A, B, C, D, E, F, and G are marked on a straight line so that no two of the segments between any pair of points have the same length.<br><svg width=\"260\" height=\"80\" viewBox=\"0 0 260 80\" style=\"display:block;margin:10px auto;\"><line x1=\"20\" y1=\"50\" x2=\"240\" y2=\"50\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20.0\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"20.0\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"50.1\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"50.1\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"98.4\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"98.4\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"122.5\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"122.5\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"161.6\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"161.6\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"194.8\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"194.8\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text><circle cx=\"240.0\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"240.0\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">G</text></svg>How many different lengths of line segments are formed in total (counting every pair of points)?", "opts": ["21", "28", "24", "18"], "ci": 0, "exp": "The number of segments formed by choosing any 2 of the 7 points is C(7,2) = (7&times;6)&divide;2 = 21. Since no two segments share a length, there are 21 different lengths.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The figure below is a 1&times;7 row of unit squares.<br><svg width=\"280\" height=\"60\" viewBox=\"0 0 280 60\" style=\"display:block;margin:10px auto;\"><rect x=\"20\" y=\"15\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"60\" y=\"15\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"100\" y=\"15\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"140\" y=\"15\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"180\" y=\"15\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"220\" y=\"15\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"260\" y=\"15\" width=\"40\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/></svg>How many rectangles of any size (including squares) can be found in the figure in total?", "opts": ["28", "32", "21", "24"], "ci": 0, "exp": "For a 1-row strip of 7 unit cells, the number of rectangles is C(8,2) = 28 (choose any 2 of the 8 vertical grid lines).", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "In the triangle below, two line segments are drawn from the top vertex down to the base, dividing the triangle into 3 smaller regions.<br><svg width=\"200\" height=\"160\" viewBox=\"0 0 200 160\" style=\"display:block;margin:10px auto;\"><polygon points=\"100,10 20,150 180,150\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"10\" x2=\"80\" y2=\"150\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"10\" x2=\"140\" y2=\"150\" stroke=\"#333\" stroke-width=\"2\"/></svg>How many triangles of any size are in the figure in total?", "opts": ["6", "9", "7", "5"], "ci": 0, "exp": "With k=2 cevians from one vertex, the base is split into k+1=3 regions, and the total number of triangles is (k+1)(k+2)&divide;2 = 3&times;4&divide;2 = 6.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The figure below is a rectangle divided into a 3&times;2 grid of unit squares (3 columns, 2 rows).<br><svg width=\"180\" height=\"120\" viewBox=\"0 0 180 120\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"160\" height=\"100\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"63.3\" y1=\"10\" x2=\"63.3\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"116.7\" y1=\"10\" x2=\"116.7\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"60\" x2=\"170\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many squares of any size can be found in the figure in total?", "opts": ["7", "9", "6", "8"], "ci": 3, "exp": "1&times;1 squares: 6 (3 columns &times; 2 rows). 2&times;2 squares: 2 (2 positions across &times; 1 position down). Total = 6 + 2 = 8.", "tag": "Geometry", "tagcolor": "#E24B4A"}];
var DEBATE_MODE = false;
var TIMED = true;
var TIME_LIMIT = 40;
var TTS_LANG = "ko-KR";

var order = [];
var state = {};
var hintShown = false;
var paused = false;
var timerHandle = null;

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }
function incAttempts(){ localStorage.setItem(ATT_KEY, loadAttempts()+1); }

function defaultOrder(){ var a=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) a.push(i); return a; }

function resetState(randomOrder){
  order = defaultOrder();
  if (randomOrder) {
    for (var k=order.length-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=order[k]; order[k]=order[j]; order[j]=t; }
  }
  state = { cur:0, answers:{}, shuffles:{}, showResults:false, order:order.slice() };
  if (TIMED) {
    state.timers = {};
    for (var i=0;i<RAW_QUESTIONS.length;i++) state.timers[i] = { remaining: TIME_LIMIT, timedOut:false, running:false };
  }
}

function loadState(){
  try {
    var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.order) {
      state = s;
      order = s.order;
    } else {
      resetState(false);
    }
  } catch(e) {
    localStorage.removeItem(LS_KEY);
    resetState(false);
  }
}

function saveState(){
  state.order = order;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function getShuffle(qi){
  if (!state.shuffles[qi]) {
    var n = RAW_QUESTIONS[qi].opts.length;
    var a = []; for (var i=0;i<n;i++) a.push(i);
    for (var k=n-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[qi] = a;
  }
  return state.shuffles[qi];
}
function getCSI(qi){ return getShuffle(qi).indexOf(RAW_QUESTIONS[qi].ci); }

function isTimedOut(qi){ return TIMED && state.timers && state.timers[qi] && state.timers[qi].timedOut; }
function isAnswered(qi){ return state.answers[qi] !== undefined || isTimedOut(qi); }
function isCorrectAns(qi){ return state.answers[qi] !== undefined && state.answers[qi] === getCSI(qi); }

function updateNav(){
  var ans = 0;
  for (var p=0;p<order.length;p++) if (isAnswered(order[p])) ans++;
  document.getElementById('nav-count').textContent = ans + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (order.length? (ans/order.length*100):0).toFixed(1) + '%';
  renderDots();
}

function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'none' || !p.style.display) {
    p.style.display = 'block'; b.innerHTML = 'Hide &#9652;'; renderDots();
  } else {
    p.style.display = 'none'; b.innerHTML = 'Jump &#9662;';
  }
}

function renderDots(){
  var p = document.getElementById('dot-panel');
  if (p.style.display === 'none' || !p.style.display) return;
  var h = '';
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var bg = !isAnswered(qi) ? '#d7dde6' : (isCorrectAns(qi) ? '#185FA5' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+qi+')">' + (pos+1) + '</span>';
  }
  var allAns = true;
  for (var pos2=0; pos2<order.length; pos2++) if (!isAnswered(order[pos2])) { allAns = false; break; }
  if (allAns && order.length>0) {
    h += '<br><span onclick="finishQuiz()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}

function goToQ(qi){
  var pos = order.indexOf(qi);
  if (pos === -1) pos = 0;
  state.cur = pos; state.showResults = false; saveState(); render();
  document.getElementById('dot-panel').style.display = 'none';
  document.getElementById('jump-btn').innerHTML = 'Jump &#9662;';
}

function speak(text, lang){
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function speakCurrent(){
  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  if (q && q.tts) speak(q.tts, TTS_LANG);
}
window.speakCurrent = speakCurrent;

function updateAttDisplay(){ /* no-op placeholder for subtitle; title fixed */ }


function clearTimerHandle(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
function startTimerFor(qi){
  clearTimerHandle();
  if (!state.timers[qi]) state.timers[qi] = { remaining: TIME_LIMIT, timedOut:false, running:false };
  var t = state.timers[qi];
  if (state.answers[qi] !== undefined || t.timedOut) { renderTimerDisplay(); return; }
  t.running = true;
  timerHandle = setInterval(function(){
    if (paused) return;
    t.remaining--;
    if (t.remaining <= 0) {
      t.remaining = 0; t.timedOut = true; t.running = false;
      clearTimerHandle();
      saveState(); render();
      return;
    }
    saveState();
    renderTimerDisplay();
  }, 1000);
  renderTimerDisplay();
}
function renderTimerDisplay(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var box = document.getElementById('timer-box');
  if (!t) { box.textContent=''; return; }
  if (state.answers[qi] !== undefined) { box.textContent = ''; box.className='timer-box'; return; }
  box.textContent = t.timedOut ? "Time's up!" : ('Time left: ' + t.remaining + 's');
  box.className = 'timer-box' + (t.remaining <= 10 && !t.timedOut ? ' warn' : '');
}
function togglePause(){
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? 'Resume' : 'Pause';
  document.getElementById('pauseOverlay').style.display = paused ? 'flex' : 'none';
}


function render(){
  if (state.showResults) { renderResults(); return; }
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  updateNav();

  var pos = state.cur;
  var qi = order[pos];
  var q = RAW_QUESTIONS[qi];

  document.getElementById('q-num').textContent = 'Question ' + (pos+1) + ' of ' + order.length;


  var tagEl = document.getElementById('q-tag-label');
  if (q.tag) {
    tagEl.style.display = 'inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#185FA5';
  } else {
    tagEl.style.display = 'none';
  }


  var pb = document.getElementById('passage-box');
  if (q.passage) { pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; }



  document.getElementById('q-text').innerHTML = q.stem;
  var ttsBtn = document.getElementById('tts-btn');
  if (q.tts) { ttsBtn.style.display = 'inline-block'; } else { ttsBtn.style.display = 'none'; }

  var sh = getShuffle(qi);
  var ans = state.answers[qi];
  var csi = getCSI(qi);
  var timedOut = TIMED && state.timers[qi] && state.timers[qi].timedOut;
  var html = '';
  for (var s=0; s<sh.length; s++) {
    var oi = sh[s];
    var cls = 'opt-btn';
    var dis = '';
    if (ans !== undefined || timedOut) {
      dis = 'disabled';
      if (s === csi) cls += ' correct';
      else if (s === ans) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+qi+','+s+')">' + q.opts[oi] + '</button>';
  }
  document.getElementById('opts-area').innerHTML = html;



  var eb = document.getElementById('exp-box');
  if ((ans !== undefined && ans !== csi) || timedOut) {
    eb.style.display = 'block';
    eb.textContent = q.exp;
  } else {
    eb.style.display = 'none';
  }

  document.getElementById('next-btn').textContent = (pos === order.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (pos === 0);

  startTimerFor(qi);
}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  if (TIMED && state.timers[qi] && state.timers[qi].timedOut) return;
  state.answers[qi] = si;
  clearTimerHandle();
  saveState(); render();
}

function finishQuiz(){
  state.showResults = true;
  incAttempts();
  saveState(); render(); reportResult();
}

function goNext(){
  if (state.cur === order.length-1) { finishQuiz(); return; }
  state.cur = Math.min(order.length-1, state.cur+1);
  saveState(); render();
}

function go(dir){
  clearTimerHandle();
  if (dir === 1) {
    if (state.cur === order.length - 1) {
      state.showResults = true; incAttempts(); saveState(); render(); reportResult();
      return;
    }
    state.cur = Math.min(order.length-1, state.cur+1);
    saveState(); render();
    return;
  }
  state.cur = Math.max(0, state.cur-1);
  saveState(); render();
}

function renderResults(){
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  clearTimerHandle();
  updateNav();

  var c=0,w=0,sk=0;
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (!isAnswered(qi)) sk++;
    else if (isCorrectAns(qi)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;' +
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;' +
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html = '';
  for (var pos2=0; pos2<order.length; pos2++) {
    var qi2 = order[pos2];
    var label,bg,tc;
    if (!isAnswered(qi2)) { label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (isCorrectAns(qi2)) { label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label = isTimedOut(qi2) ? 'Timed Out' : 'Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var stemText = String(RAW_QUESTIONS[qi2].stem).replace(/<[^>]*>/g,'').substring(0,60);
    html += '<div class="results-card" onclick="goToQ('+qi2+')">' +
      '<span style="font-size:0.95rem;font-weight:600;color:#333;">Q'+(pos2+1)+'. '+stemText+'</span>' +
      '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>' +
      '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function retryWrong(){
  var wrongQi = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      wrongQi.push(qi);
    }
  }
  if (wrongQi.length === 0) return;
  for (var i=0;i<wrongQi.length;i++) {
    delete state.answers[wrongQi[i]];
    delete state.shuffles[wrongQi[i]];
    if (TIMED && state.timers) { state.timers[wrongQi[i]] = { remaining: TIME_LIMIT, timedOut:false, running:false }; }
  }
  order = wrongQi;
  state.order = order;
  state.cur = 0; state.showResults = false;
  saveState(); render();
}

function toggleHint(){
  hintShown = !hintShown;
  var b = document.getElementById('hint-btn'), x = document.getElementById('hint-box');
  if (hintShown) { x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function stripTags(s){ return String(s).replace(/<[^>]*>/g,''); }

function copyRes(){
  var lines = [TITLE + ' - Results'];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var lbl = !isAnswered(qi) ? 'Skipped' : (isCorrectAns(qi) ? 'Correct' : (isTimedOut(qi) ? 'Timed Out' : 'Wrong'));
    lines.push('Q'+(pos+1)+' '+stripTags(RAW_QUESTIONS[qi].stem)+': '+lbl);
  }
  var txt = lines.join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}

function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

function saveWrong(){
  var wrongAnswers = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var a = state.answers[qi];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      var q = RAW_QUESTIONS[qi];
      var sh = getShuffle(qi);
      wrongAnswers.push({
        question: stripTags(q.stem),
        yourAnswer: (a===undefined) ? '(no answer - time ran out)' : stripTags(q.opts[sh[a]]),
        correctAnswer: stripTags(q.opts[q.ci]),
        explanation: stripTags(q.exp)
      });
    }
  }
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  try {
    var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a2 = document.createElement('a');
    a2.href = url;
    a2.download = QUIZ_KEY + '_wrong.json';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e){}
}

var freshRandom = false;
function openFreshModal(randomOrder){ freshRandom = !!randomOrder; document.getElementById('freshModal').style.display='flex'; }
function confirmFresh(){
  document.getElementById('freshModal').style.display='none';
  localStorage.removeItem(LS_KEY);
  clearTimerHandle(); paused=false; document.getElementById('pauseOverlay').style.display='none'; document.getElementById('pause-btn').textContent='Pause';
  resetState(freshRandom);
  saveState(); render();
}

function reportResult(){
  try {
    var correct=0, wrong=0, skipped=0, timedout=0;
    for (var pos=0; pos<order.length; pos++) {
      var qi = order[pos];
      var a = state.answers[qi];
      var t = state.timers ? state.timers[qi] : null;
      if (a===undefined) {
        if (t && t.timedOut) timedout++; else skipped++;
        continue;
      }
      if (a===getCSI(qi)) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if (TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if (TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if (TITLE.indexOf('[Both]')===0) childName='Both';
    else if (TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY,
      attemptNumber: loadAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, timedOut: timedout, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  } catch(e){}
}

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;
window.copyRes = copyRes;
window.saveWrong = saveWrong;
window.openFreshModal = openFreshModal;
window.confirmFresh = confirmFresh;
window.speak = speak;
window.togglePause = togglePause;

loadState(); saveState(); render();
})();
</script>
