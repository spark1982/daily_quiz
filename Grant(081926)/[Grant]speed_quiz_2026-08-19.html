<style>
*{box-sizing:border-box;}

.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.5;}

.next-btn{background:#1D9E75;color:#fff;}

function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }

function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; if(!state.timedOut) state.timedOut={}; if(!state.qTimeLeft) state.qTimeLeft={}; if(!state.qPaused) state.qPaused={}; }

function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

function getShuffle(i){
  if(!state.shuffles[i]){

  }
  return state.shuffles[i];

function isLocked(i){ return state.answers[i]!==undefined || state.timedOut[i]; }

function stopQTimer(){ if(qInterval){ clearInterval(qInterval); qInterval=null; } }

function tickTimer(){
  var i = state.cur;

    state.qTimeLeft[i]=0;
    state.timedOut[i]=true;

    saveState();
    render();
    return;
  }
  state.qTimeLeft[i]=left;
  saveState();
  renderTimerOnly();
}

function startQTimer(){

  if(state.qTimeLeft[i]===undefined) state.qTimeLeft[i]=SEC_PER_Q;
  if(!state.qPaused[i]) qInterval=setInterval(tickTimer,1000);

function togglePause(){

function renderTimerOnly(){
  var i = state.cur;
  var disp = document.getElementById('qtimer-display');
  var status = document.getElementById('qtimer-status');
  var pbtn = document.getElementById('qtimer-pause-btn');
  if(!disp) return;
  disp.classList.remove('warn','danger');
  if(state.timedOut[i]){
    status.textContent = "Time's Up"; disp.textContent=''; pbtn.disabled=true; pbtn.textContent='Pause';
    return;
  }
  if(state.answers[i]!==undefined){
    status.textContent = 'Answered'; disp.textContent=''; pbtn.disabled=true; pbtn.textContent='Pause';
    return;
  }
  var left = (state.qTimeLeft[i]===undefined) ? SEC_PER_Q : state.qTimeLeft[i];
  status.textContent = state.qPaused[i] ? 'Paused' : 'Time Left';
  disp.textContent = String(left) + 's';
  if(left<=8) disp.classList.add('danger'); else if(left<=16) disp.classList.add('warn');
  pbtn.disabled=false;
  pbtn.textContent = state.qPaused[i] ? 'Resume' : 'Pause';
}

function updateNav(){
  var ans=Object.keys(state.answers).length + Object.keys(state.timedOut).length;
  document.getElementById('nav-count').textContent=Math.min(ans,qs.length)+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(Math.min(ans,qs.length)/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel'), b=document.getElementById('jump-btn');
  if(p.style.display==='none'||!p.style.display){ p.style.display='block'; b.textContent='Hide ▴'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump ▾'; }
}
function renderDots(){
  var p=document.getElementById('dot-panel');
  if(p.style.display!=='block') return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg;
    if(state.timedOut[i]) bg='#f5a623';
    else if(state.answers[i]===undefined) bg='#d7dde6';
    else bg = (state.answers[i]===getCSI(i)) ? '#185FA5' : '#E24B4A';
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  p.innerHTML=h;
}
function goToQ(i){ stopQTimer(); state.cur=i; state.showResults=false; saveState(); render(); document.getElementById('dot-panel').style.display='none'; document.getElementById('jump-btn').textContent='Jump ▾'; }

function showResults(){
  stopQTimer();
  state.showResults=true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('attCount').textContent = loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur, q=qs[i];
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  var tagEl=document.getElementById('q-tag-label');
  if(q.tag){ tagEl.style.display='inline-block'; tagEl.textContent=q.tag; } else { tagEl.style.display='none'; }
  document.getElementById('q-stem').innerHTML=q.q;
  var sh=getShuffle(i), ans=state.answers[i], csi=getCSI(i), html='';
  var locked = isLocked(i);
  for(var s=0;s<4;s++){
    var oi=sh[s], cls='opt-btn', dis='';
    if(locked){ dis='disabled'; if(s===csi) cls+=' correct'; else if(s===ans) cls+=' wrong'; }
    html+='<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.getElementById('prev-btn').disabled=(i===0);
  renderTimerOnly();
  startQTimer();
}

function renderResults(){
  stopQTimer();
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,to=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.timedOut[i]) to++;
    else if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp; '+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp; '+
    '<span style="color:#f5a623;font-weight:700;">'+to+'</span> timed out &nbsp; '+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i], label,bg,tc;
    if(state.timedOut[i]){ label='Timed Out'; bg='#fff3e0'; tc='#8a5a00'; }
    else if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;font-weight:600;color:#333;">Q'+(i+1)+' &middot; '+qs[i].tag+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.8rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}

function pick(qi,si){ if(isLocked(qi)) return; state.answers[qi]=si; stopQTimer(); saveState(); render(); }
function go(dir){ stopQTimer(); if(dir===1 && state.cur===qs.length-1){ showResults(); return; } state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir)); saveState(); render(); }

function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    var wasWrong = state.answers[i]!==undefined && state.answers[i]!==getCSI(i);
    var wasTimedOut = !!state.timedOut[i];
    if(wasWrong || wasTimedOut){
      if(first===-1) first=i;
      delete state.answers[i];
      delete state.timedOut[i];
      delete state.qTimeLeft[i];
      delete state.qPaused[i];
    }
  }
  if(first!==-1){ state.cur=first; state.showResults=false; saveState(); render(); }
  else { render(); }
}

function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    var lbl = state.timedOut[i] ? 'Timed Out' : (a===undefined?'Skipped':(a===getCSI(i)?'Correct':'Wrong'));
    lines.push('Q'+(i+1)+' ('+qs[i].tag+'): '+lbl);
  }
  var txt=lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

function askFresh(mode){
  pendingFreshMode=mode;
  var t = (mode==='random') ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
  var m = (mode==='random')
    ? 'Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.'
    : 'Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay" style="display:flex;"><div class="modal-box">' +
    '<h3 style="margin:0 0 10px;color:#185FA5;font-size:1.05rem;">'+t+'</h3>' +
    '<p style="font-size:0.95rem;color:#333;">'+m+'</p>' +
    '<button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>' +
    '<button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>' +
    '</div></div>';
}
function askFreshOriginal(){ askFresh('original'); }
function askFreshRandom(){ askFresh('random'); }
function closeFreshModal(){ document.getElementById('modalRoot').innerHTML=''; }
function confirmFresh(){
  stopQTimer();
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestionsFromOrder(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.askFreshOriginal=askFreshOriginal; window.askFreshRandom=askFreshRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.togglePause=togglePause;

loadState(); saveState(); render();

})();
</script>
</body>
