<script>
(function(){
var QUIZ_KEY='quiz_english_25_20260613_v1';
var ATT_KEY='quiz_english_attempts_20260613_v1';

var P1="In 1969, a quiet Sunday evening turned into a moment the world would never forget. Neil Armstrong carefully descended the ladder of the Eagle lunar module and placed his boot on the dusty gray surface of the Moon. For the first time in history, a human being stood on another world. Millions watched the grainy black-and-white footage on their televisions, hardly believing what they were witnessing. Armstrong's calm voice carried those famous words across 238,855 miles of space to an awed planet below.";
var P2="Behind this triumph lay years of relentless effort. The Apollo program had suffered its share of tragedies — most devastatingly, the Apollo 1 fire that claimed the lives of three astronauts in 1967. Yet NASA engineers refused to let grief become defeat. They redesigned the command module, improved safety protocols, and pressed on with quiet determination. Their goal remained fixed: beat the Soviet Union to the Moon and, in doing so, demonstrate the strength of American technology and ambition.";
var P3="The journey itself was a dance of precision and daring. The Saturn V rocket — taller than a 36-story building — burned two million pounds of fuel in under three minutes. Once in lunar orbit, Armstrong and Buzz Aldrin transferred to the Eagle while Michael Collins remained in the command module above, circling alone in the silence of space. The landing was far from automatic. Armstrong piloted the craft manually over a boulder-strewn field, his heart rate spiking to 150 beats per minute before he found a smooth patch of ground.";
var P4="The Moon landing changed how humanity thought about its place in the universe. Standing on the lunar surface, Armstrong described Earth as a small but extraordinarily beautiful marble hanging in the darkness. Scientists gained invaluable data from the 842 pounds of Moon rocks the crew brought back. Children who watched that Sunday broadcast grew up inspired to explore science, engineering, and space. Though nearly six decades have passed, the courage of the Apollo 11 crew continues to remind us that determination and imagination can carry us far beyond what once seemed impossible.";
var P2b="In 1903, Orville and Wilbur Wright made the first powered airplane flight at Kitty Hawk, North Carolina. Their aircraft, the Flyer, remained airborne for only twelve seconds and traveled 120 feet. Like the Apollo mission sixty-six years later, the Wright brothers' achievement grew from repeated failure, careful study, and the unwavering belief that what seemed impossible was within reach. Both milestones transformed how humanity moves through the world — and beyond it.";

var qs=[
 {tag:'Inference',q:'Based on the passage, what can most reasonably be inferred about Neil Armstrong as a pilot during the lunar landing?',opts:['He relied entirely on the spacecraft\'s autopilot system.','He was a skilled pilot capable of adapting to unexpected obstacles.','He preferred orbiting the Moon to landing on its surface.','He had never encountered rocky terrain before the Moon landing.'],ci:1,exp:'The passage states Armstrong "piloted the craft manually over a boulder-strewn field" and found a smooth patch. This implies skilled adaptability, not reliance on autopilot.'},
 {tag:'Main Idea',q:'What is the main idea of this passage?',opts:['Michael Collins played the most critical role in the Moon landing mission.','The Moon landing was a triumph achieved through years of effort, courage, and skill.','NASA\'s greatest challenge was the Apollo 1 fire in 1967.','Neil Armstrong was the most famous astronaut in history.'],ci:1,exp:'The passage covers the historic achievement of the Moon landing, the effort behind it, the details of the mission, and its lasting legacy — making option B the central idea.'},
 {tag:'Theme',q:'What is the central theme of this passage?',opts:['Scientific discoveries always come with great risk.','Human curiosity and collaboration lead to unprecedented achievements.','Determination and imagination can help people overcome great challenges.','Space exploration is the most important goal of modern civilization.'],ci:2,exp:'The final sentence states "determination and imagination can carry us far beyond what once seemed impossible," directly expressing the central theme.'},
 {tag:'Predict',q:'Based on the passage, if a similar crewed Moon mission were planned today, what would most likely be true?',opts:['Engineers would not review past safety records.','The mission would require exactly the same crew size.','Advances in technology would likely make the mission safer and more precise.','The mission could not succeed without the original Saturn V rocket.'],ci:2,exp:'The passage emphasizes how technology and determination drove progress. Modern technology improvements logically suggest safer, more precise missions.'},
 {tag:'Summary',q:'Which of the following best summarizes the passage?',opts:['The passage describes the tragic Apollo 1 fire and its impact on the space program.','The passage explains why Michael Collins stayed in orbit during the Moon landing.','The passage recounts the historic Apollo 11 Moon landing, from earlier setbacks to its lasting impact on humanity.','The passage argues that the Moon landing was the single greatest achievement in history.'],ci:2,exp:'The passage covers the Moon landing event, the backstory of setbacks, the mission details, and the lasting legacy — making option C the best summary.'},
 {tag:'Tone',q:'What is the overall tone of this passage?',opts:['Critical and skeptical','Humorous and lighthearted','Admiring and celebratory','Neutral and purely factual'],ci:2,exp:'The author uses words like "triumph," "courage," and "determination," and ends with an uplifting statement about human achievement, reflecting an admiring and celebratory tone.'},
 {tag:'Point of View',q:'From what point of view is this passage written?',opts:['Neil Armstrong\'s first-person perspective','A third-person narrator observing and reflecting on historical events','A NASA scientist providing a technical report','A Soviet space agency official commenting on the mission'],ci:1,exp:'The passage uses third-person pronouns ("Armstrong," "they," "the crew") and the narrator reflects on events as a historian or author would, not as a participant.'},
 {tag:"Author's Purpose",q:"What is the author's main purpose in writing this passage?",opts:['To argue that the Soviet Union should have won the Space Race','To inform readers about the Apollo 11 mission and inspire appreciation for human achievement','To explain the technical details of building the Saturn V rocket','To entertain readers with a fictional account of space travel'],ci:1,exp:'The author describes the real events of the Moon landing and its legacy, aiming to inform and inspire readers rather than argue or entertain with fiction.'},
 {tag:'Cause & Effect',q:'According to the passage, what was one direct effect of the Apollo 1 fire?',opts:['NASA cancelled all further Moon missions.','The Soviet Union overtook the United States in the Space Race.','NASA engineers redesigned the command module and improved safety protocols.','Armstrong chose to pilot the Eagle manually.'],ci:2,exp:'The passage states: "They redesigned the command module, improved safety protocols, and pressed on with quiet determination" — a direct effect of the Apollo 1 tragedy.'},
 {tag:'Compare & Contrast',q:'How were Armstrong\'s and Collins\'s roles during the Moon landing different?',opts:['Armstrong stayed in orbit while Collins landed on the surface.','Collins piloted the Eagle while Armstrong observed from orbit.','Armstrong landed on the Moon while Collins remained in the command module above.','Both Armstrong and Collins walked on the lunar surface together.'],ci:2,exp:'The passage clearly states Armstrong and Aldrin transferred to the Eagle (and landed), while "Michael Collins remained in the command module above."'},
 {tag:'Text Structure',q:'How is this passage primarily organized?',opts:['Problem and solution','A comparison of the American and Soviet space programs','A narrative of the historic event followed by its background and lasting significance','A list from least to most important events in order'],ci:2,exp:'The passage opens with the Moon landing, moves to background (Apollo 1, preparation), details the mission, then discusses the lasting impact — a narrative with context and significance.'},
 {tag:'Character Traits',q:'Which character trait best describes Neil Armstrong as shown in the passage?',opts:['Reckless and impulsive','Calm and skilled under pressure','Competitive and arrogant','Timid and overly cautious'],ci:1,exp:'Armstrong spoke with a "calm voice," piloted manually over rough terrain, and found a safe landing spot. These details show he was calm and skilled under pressure.'},
 {tag:'Supporting Details',q:'Which detail from the passage best supports the idea that the Saturn V rocket was enormous?',opts:['It burned two million pounds of fuel in under three minutes.','It was taller than a 36-story building.','It carried three astronauts to the Moon.','It was launched from Florida in 1969.'],ci:1,exp:'Comparing the Saturn V to a 36-story building directly illustrates its enormous size, making option B the most relevant supporting detail.'},
 {tag:'Situation',q:'What situation motivated the Apollo 11 Moon landing mission, according to the passage?',opts:['A United Nations request for international space cooperation','The desire to collect Moon rocks for scientific research','Competition with the Soviet Union and the goal of demonstrating American technology','A congressional order to establish a permanent Moon base'],ci:2,exp:'The passage states the goal was to "beat the Soviet Union to the Moon and, in doing so, demonstrate the strength of American technology and ambition."'},
 {tag:'Setting',q:'Where does the primary action of this passage take place?',opts:['At NASA headquarters in Washington, D.C.','On the Moon and in lunar orbit','In television studios broadcasting the event worldwide','At Cape Canaveral during the rocket launch'],ci:1,exp:'The main events — the Moon landing and the lunar orbit operations — take place on the Moon and in lunar orbit, making option B correct.'},
 {tag:'Figurative Language',q:'What does the phrase "a dance of precision and daring" in paragraph 3 mean?',opts:['The astronauts danced to celebrate a successful launch.','The mission required a combination of careful accuracy and brave risk-taking.','The Saturn V rocket moved gracefully through space like a dancer.','NASA planned a public celebration involving dance after the mission.'],ci:1,exp:'"Dance" is a metaphor comparing the complex mission to a dance — the word "precision" represents careful accuracy and "daring" represents bravery, making option B correct.'},
 {tag:'Analogy',q:'Armstrong described Earth as "a small but extraordinarily beautiful marble hanging in the darkness." What does this analogy suggest?',opts:['Earth is physically smaller than the Moon in reality.','Earth is perfectly round and symmetrical in shape.','Earth appeared tiny yet strikingly beautiful in the vast darkness of space.','Armstrong found Earth to be ordinary when viewed from the Moon.'],ci:2,exp:'The marble analogy conveys that Earth looked small (like a marble) yet breathtaking against the darkness of space — tiny but beautiful.'},
 {tag:'Synonym & Antonym',q:'As used in paragraph 2, which word is closest in meaning to "relentless"?',opts:['Casual','Persistent','Brief','Uncertain'],ci:1,exp:'"Relentless effort" means effort that never stops or lets up. "Persistent" (continuing despite difficulty) is the closest synonym.'},
 {tag:'Guess the Meaning',q:'In paragraph 3, the word "strewn" most likely means:',opts:['Arranged in neat, orderly rows','Hidden beneath the surface of an object','Scattered across an area','Polished until smooth'],ci:2,exp:'"Boulder-strewn field" means a field with boulders scattered around it. "Strewn" means spread or scattered in a disorganized way.'},
 {tag:'Preposition',q:'Which preposition correctly completes the sentence as it appears in the passage? "Armstrong piloted the craft manually ___ a boulder-strewn field."',opts:['from','beneath','inside','over'],ci:3,exp:'The passage states "Armstrong piloted the craft manually over a boulder-strewn field." "Over" is the correct preposition here, meaning above and across.'},
 {tag:'Genre',q:'What genre does this passage most likely belong to?',opts:['Science fiction','Historical nonfiction','Autobiographical narrative','Fantasy adventure'],ci:1,exp:'The passage describes real historical events (the Apollo 11 Moon landing in 1969) using factual details, placing it in the genre of historical nonfiction.'},
 {tag:'Kind of Writing',q:'This passage is best described as which type of writing?',opts:['A short story with fictional characters','A biography of Neil Armstrong','An informational article about a historical event','A persuasive essay arguing for space exploration'],ci:2,exp:'The passage presents factual information about the Apollo 11 mission, its context, and its legacy. It is an informational article, not a story, biography, or persuasive essay.'},
 {tag:'Fact vs Opinion',q:'Which of the following is an OPINION expressed in the passage?',opts:['"Neil Armstrong placed his boot on the dusty gray surface of the Moon."','"The Saturn V rocket burned two million pounds of fuel in under three minutes."','"Armstrong described Earth as a small but extraordinarily beautiful marble."','"The courage of the Apollo 11 crew continues to remind us that determination and imagination can carry us far beyond what once seemed impossible."'],ci:3,exp:'Options A, B, and C are facts (verifiable events or direct quotes). Option D is the author\'s interpretation of the mission\'s legacy — an opinion, not a verifiable fact.'},
 {tag:'Title',q:'Which title would best suit this passage?',opts:['"The Soviet Space Program\'s Downfall"','"Michael Collins: The Forgotten Astronaut"','"One Giant Leap: The Apollo 11 Mission and Its Lasting Legacy"','"How to Build a Saturn V Rocket"'],ci:2,exp:'The passage covers the Apollo 11 mission from context to achievement to lasting legacy. "One Giant Leap" captures this scope best, referencing Armstrong\'s famous words.'},
 {tag:'Text-to-Text',q:'Read the additional passage below. Based on both passages, what do the Apollo 11 mission and the Wright brothers\' first flight have in common?',opts:['Both were directly funded by the United States government.','Both were achieved on the very first attempt without prior failure.','Both resulted from determination and belief in overcoming what seemed impossible.','Both required international collaboration to succeed.'],ci:2,ex2:true,exp:'The main passage ends with "determination and imagination can carry us far beyond what once seemed impossible." The second passage states the Wright brothers had "the unwavering belief that what seemed impossible was within reach." Both share this theme.'}
];

var state={};
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');
    if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<qs.length&&s.answers&&typeof s.answers==='object'&&s.shuffles&&typeof s.shuffles==='object'){state=s;}
    else{resetState();}
  }catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}
}
function resetState(){state={cur:0,answers:{},shuffles:{},showResults:false};}
function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}
function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCorrectSI(i){return getShuffle(i).indexOf(qs[i].ci);}
function loadAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0',10);}
function updateAttempts(){localStorage.setItem(ATT_KEY,loadAttempts()+1);}
function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel');
  var b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}
  else{p.style.display='none';b.textContent='Jump ▾';}
}
function renderDots(){
  var p=document.getElementById('dot-panel');if(p.style.display==='none')return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===getCorrectSI(i)?'#185FA5':'#E24B4A');
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML=h;
}
function goToQ(i){
  state.cur=i;state.showResults=false;saveState();render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump ▾';
}
function showResults(){state.showResults=true;updateAttempts();saveState();render();}
function render(){
  document.getElementById('att-display').textContent='Total Attempts: '+loadAttempts();
  if(state.showResults){renderResults();return;}
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur;
  var q=qs[i];
  document.getElementById('q-tag').textContent=q.tag;
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  document.getElementById('q-text').textContent=q.q;
  // passage display
  document.getElementById('passage-main').innerHTML='<strong>Passage:</strong><br><br><p>'+P1+'</p><p>'+P2+'</p><p>'+P3+'</p><p>'+P4+'</p>';
  if(q.ex2){
    document.getElementById('passage-extra').style.display='block';
    document.getElementById('passage-extra').innerHTML='<strong>Additional Passage:</strong><br><br><p>'+P2b+'</p>';
  }else{
    document.getElementById('passage-extra').style.display='none';
  }
  var sh=getShuffle(i);
  var ans=state.answers[i];
  var correctSI=getCorrectSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi=sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===correctSI)cls+=' correct';
      else if(s===ans)cls+=' wrong';
    }
    html+='<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+escHtml(q.opts[oi])+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  var expBox=document.getElementById('exp-box');
  if(ans!==undefined&&ans!==correctSI){expBox.style.display='block';expBox.textContent=q.exp;}
  else{expBox.style.display='none';}
  var nb=document.getElementById('next-btn');
  if(i===qs.length-1){nb.textContent='See Results →';}
  else{nb.textContent='Next';}
  document.querySelector('.prev-btn').disabled=(i===0);
}
function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var correct=0,wrong=0,skipped=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined)skipped++;
    else if(state.answers[i]===getCorrectSI(i))correct++;
    else wrong++;
  }
  document.getElementById('results-summary').innerHTML='<span style="color:#1D9E75;font-weight:700;">'+correct+'</span> correct &nbsp; <span style="color:#E24B4A;font-weight:700;">'+wrong+'</span> wrong &nbsp; <span style="color:#888;font-weight:700;">'+skipped+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    var label,bg,tc;
    if(a===undefined){label='Skipped';bg='#d7dde6';tc='#555';}
    else if(a===getCorrectSI(i)){label='Correct';bg='#E1F5EE';tc='#085041';}
    else{label='Wrong';bg='#FCEBEB';tc='#501313';}
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;color:#333;">Q'+(i+1)+': '+escHtml(qs[i].tag)+'</span><span class="results-pill" style="background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}
function pick(qi,si){
  if(state.answers[qi]!==undefined)return;
  state.answers[qi]=si;saveState();render();
}
function go(dir){
  if(dir===1&&state.cur===qs.length-1){showResults();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));
  saveState();render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined&&state.answers[i]!==getCorrectSI(i)){
      if(first===-1)first=i;
      delete state.answers[i];
    }
  }
  if(first!==-1){state.cur=first;state.showResults=false;saveState();render();}
}
function copyRes(){
  var lines=['[Grant] English - Results (2026-06-13)'];
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    var label=a===undefined?'Skipped':a===getCorrectSI(i)?'Correct':'Wrong';
    lines.push('Q'+(i+1)+' ('+qs[i].tag+'): '+label);
  }
  var txt=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);});}
  else{fallbackCopy(txt);}
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function startRetry(){retryWrong();}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){
  document.getElementById('freshModal').style.display='none';
  localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.pick=pick;window.go=go;window.goToQ=goToQ;window.toggleJump=toggleJump;
window.retryWrong=retryWrong;window.copyRes=copyRes;window.startRetry=startRetry;
window.openFreshModal=openFreshModal;window.confirmFresh=confirmFresh;window.showResults=showResults;

loadState();saveState();render();
})();
</script>
</body>
