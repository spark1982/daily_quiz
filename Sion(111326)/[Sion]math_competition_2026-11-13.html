var TODAY_STR = "20261113";
var RAW_QUESTIONS = [{"stem": "Let <i>x</i> and <i>y</i> be real numbers satisfying<br><br>(<i>x</i><sup>2</sup> + <i>x</i> &minus; 1)(<i>x</i><sup>2</sup> &minus; <i>x</i> + 1) = 2(<i>y</i><sup>3</sup> &minus; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> &minus; 1)<br><br>and<br><br>(<i>y</i><sup>2</sup> + <i>y</i> &minus; 1)(<i>y</i><sup>2</sup> &minus; <i>y</i> + 1) = 2(<i>x</i><sup>3</sup> + 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> &minus; 1).<br><br>Find 8<i>x</i><sup>2</sup> + 4<i>y</i><sup>3</sup>. (Purple Comet)", "opts": ["0", "20", "10", "40"], "ci": 1, "exp": "<b>What we need:</b> the value of 8<i>x</i><sup>2</sup> + 4<i>y</i><sup>3</sup> for real numbers <i>x</i>, <i>y</i> that satisfy both equations.<br><br><b>Step 1 &mdash; Simplify the left sides.</b> (<i>x</i><sup>2</sup> + <i>x</i> &minus; 1)(<i>x</i><sup>2</sup> &minus; <i>x</i> + 1) = (<i>x</i><sup>2</sup> + (<i>x</i> &minus; 1))(<i>x</i><sup>2</sup> &minus; (<i>x</i> &minus; 1)) = <i>x</i><sup>4</sup> &minus; (<i>x</i> &minus; 1)<sup>2</sup> = <i>x</i><sup>4</sup> &minus; <i>x</i><sup>2</sup> + 2<i>x</i> &minus; 1. The <i>y</i> equation works the same way.<br><br><b>Step 2 &mdash; Guess numbers that make powers simple.</b> The &plusmn;2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> in the problem suggests the golden-ratio numbers <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span> and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span>, which are the two roots of <i>t</i><sup>2</sup> = <i>t</i> + 1. For any such <i>t</i>: <i>t</i><sup>3</sup> = <i>t</i> &middot; <i>t</i><sup>2</sup> = <i>t</i><sup>2</sup> + <i>t</i> = 2<i>t</i> + 1, and <i>t</i><sup>4</sup> = (<i>t</i><sup>2</sup>)<sup>2</sup> = (<i>t</i> + 1)<sup>2</sup> = <i>t</i><sup>2</sup> + 2<i>t</i> + 1 = 3<i>t</i> + 2.<br><br><b>Step 3 &mdash; Check <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span>, <i>y</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span>.</b> Here <i>y</i> &minus; <i>x</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> and <i>x</i> + <i>y</i> = 1.<br>First equation: left side = <i>x</i><sup>4</sup> &minus; <i>x</i><sup>2</sup> + 2<i>x</i> &minus; 1 = (3<i>x</i> + 2) &minus; (<i>x</i> + 1) + 2<i>x</i> &minus; 1 = 4<i>x</i>. Right side = 2((2<i>y</i> + 1) &minus; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> &minus; 1) = 4<i>y</i> &minus; 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> = 4(<i>y</i> &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span>) = 4<i>x</i>. &#10003;<br>Second equation: left side = 4<i>y</i> (same steps with <i>y</i>). Right side = 2((2<i>x</i> + 1) + 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> &minus; 1) = 4<i>x</i> + 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> = 4(<i>x</i> + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span>) = 4<i>y</i>. &#10003;<br><br><b>Step 4 &mdash; Compute.</b> 8<i>x</i><sup>2</sup> = 8(<i>x</i> + 1) = 8<i>x</i> + 8 and 4<i>y</i><sup>3</sup> = 4(2<i>y</i> + 1) = 8<i>y</i> + 4. Adding: 8<i>x</i><sup>2</sup> + 4<i>y</i><sup>3</sup> = 8(<i>x</i> + <i>y</i>) + 12 = 8 &middot; 1 + 12 = <b>20</b>.<br><br><b>Answer check:</b> Numerically, <i>x</i> &asymp; &minus;0.618 and <i>y</i> &asymp; 1.618: 8(0.382) + 4(4.236) &asymp; 3.056 + 16.944 = 20. A computer search for real solutions from many starting points found only this pair, and exact algebra gives both equations equal to 0 there.<br><br><b>Trap:</b> Swapping the values (<i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span>) breaks the first equation, because the signs of 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> decide which variable gets the &minus; root. 40 would come from forgetting that <i>x</i> + <i>y</i> = 1, not 2.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "The numbers in the sequence 1, 6, 15, 28, 45, &hellip; are called the hexagonal numbers.<div style=\"text-align:center;margin:14px 0;\"><svg style=\"max-width:460px;width:100%;\" viewBox=\"0 0 480 170\"><circle cx=\"60\" cy=\"85\" r=\"5\" fill=\"#111\"/><text x=\"60\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8321; = 1</text><polygon points=\"200,45 234.6,65 234.6,105 200,125 165.4,105 165.4,65\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"200\" cy=\"45\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"65\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"200\" cy=\"125\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"65\" r=\"4\" fill=\"#111\"/><text x=\"200\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8322; = 6</text><polygon points=\"380,30 427.6,57.5 427.6,112.5 380,140 332.4,112.5 332.4,57.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><polygon points=\"380,58 403.4,71.5 403.4,98.5 380,112 356.6,98.5 356.6,71.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"30\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"140\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><circle cx=\"380\" cy=\"85\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"30\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"140\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"58\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"380\" cy=\"112\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><text x=\"380\" y=\"158\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8323; = 15</text></svg></div>What is the 11<sup>th</sup> hexagonal number?", "opts": ["242", "210", "231", "225"], "ci": 2, "exp": "<b>What we need:</b> the 11th number in 1, 6, 15, 28, 45, &hellip;<br><br><b>Step 1 &mdash; Look at the differences.</b> 6 &minus; 1 = 5, 15 &minus; 6 = 9, 28 &minus; 15 = 13, 45 &minus; 28 = 17. The differences go up by 4 each time, so the second differences are constant. That means the rule is a quadratic: <i>H</i><sub><i>n</i></sub> = <i>an</i><sup>2</sup> + <i>bn</i> + <i>c</i>.<br><br><b>Step 2 &mdash; Find the formula.</b> A constant second difference of 4 means 2<i>a</i> = 4, so <i>a</i> = 2. Then <i>H</i><sub>1</sub> = 2 + <i>b</i> + <i>c</i> = 1 and <i>H</i><sub>2</sub> = 8 + 2<i>b</i> + <i>c</i> = 6. Subtracting: 6 + <i>b</i> = 5, so <i>b</i> = &minus;1, and then <i>c</i> = 1 &minus; 2 + 1 = 0. So <i>H</i><sub><i>n</i></sub> = 2<i>n</i><sup>2</sup> &minus; <i>n</i> = <i>n</i>(2<i>n</i> &minus; 1).<br><br><b>Step 3 &mdash; Check the formula.</b> <i>n</i> = 3: 3 &middot; 5 = 15. <i>n</i> = 4: 4 &middot; 7 = 28. <i>n</i> = 5: 5 &middot; 9 = 45. &#10003;<br><br><b>Step 4 &mdash; Plug in 11.</b> <i>H</i><sub>11</sub> = 11 &middot; (2 &middot; 11 &minus; 1) = 11 &middot; 21 = <b>231</b>.<br><br><b>Answer check:</b> Keep adding differences: after 17 come 21, 25, 29, 33, 37, 41. So 45 + 21 = 66, + 25 = 91, + 29 = 120, + 33 = 153, + 37 = 190, + 41 = 231. &#10003;<br><br><b>Trap:</b> 225 = 15<sup>2</sup> and 210 is <i>H</i><sub>10</sub> + 20; both come from guessing a pattern instead of building the formula. (<i>H</i><sub>10</sub> = 10 &middot; 19 = 190.)", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "There are three treasure chests. One chest is plated with silver, one with gold, and one with bronze. One of the three chests is filled with great treasure, whereas the other two chests both house man-eating pythons. Faced with a dilemma, you then notice that there are inscriptions on the chests:\n\nSilver Chest: The treasure is in this chest.\nGold Chest: Treasure is not in this chest.\nBronze Chest: Treasure is not in the Gold Chest.\n\nIf at least one statement is true and at least one statement is false, which chest contains the treasure? (Waterloo)", "opts": ["Silver Chest", "Bronze Chest", "Cannot be determined", "Gold Chest"], "ci": 1, "exp": "<b>What we need:</b> the chest with the treasure, given that at least one sign is true and at least one sign is false.<br><br><b>Step 1 &mdash; Test each chest.</b> There are only three possibilities, so check each one against all three signs.<br>&bull; <b>Treasure in Silver:</b> Silver&rsquo;s sign (&ldquo;The treasure is in this chest&rdquo;) is true, Gold&rsquo;s sign (&ldquo;Treasure is not in this chest&rdquo;) is true, and Bronze&rsquo;s sign (&ldquo;Treasure is not in the Gold Chest&rdquo;) is true. All three are true &mdash; not allowed.<br>&bull; <b>Treasure in Gold:</b> Silver&rsquo;s sign is false, Gold&rsquo;s sign is false, and Bronze&rsquo;s sign is false. All three are false &mdash; not allowed.<br>&bull; <b>Treasure in Bronze:</b> Silver&rsquo;s sign is false, Gold&rsquo;s sign is true, and Bronze&rsquo;s sign is true. One false and two true &mdash; this fits.<br><br><b>Step 2 &mdash; Conclude.</b> Only one case fits the condition, so the treasure is in the <b>Bronze Chest</b>, and the answer can be determined.<br><br><b>Answer check:</b> Notice that the Gold and Bronze signs say the same thing (the treasure is not in Gold), so they are always both true or both false. For the signs to be mixed, these two must be true and Silver&rsquo;s must be false: the treasure is not in Gold and not in Silver, so it is in Bronze.<br><br><b>Trap:</b> Choosing Silver because its sign &ldquo;sounds&rdquo; honest ignores the rule that at least one sign must be false.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Find all positive integral pairs (<i>x</i>, <i>y</i>) that satisfy the equation <i>xy</i> + <i>x</i> &minus; 2<i>y</i> = 9.", "opts": ["(3, 6)", "(4, 5)", "(2, 7)", "(5, 4)"], "ci": 0, "exp": "<b>What we need:</b> every pair of <b>positive</b> integers (<i>x</i>, <i>y</i>) with <i>xy</i> + <i>x</i> &minus; 2<i>y</i> = 9.<br><br><b>Step 1 &mdash; Try to factor.</b> The terms <i>xy</i> + <i>x</i> &minus; 2<i>y</i> look like the start of a product (<i>x</i> &minus; 2)(<i>y</i> + 1). Expand it: (<i>x</i> &minus; 2)(<i>y</i> + 1) = <i>xy</i> + <i>x</i> &minus; 2<i>y</i> &minus; 2.<br><br><b>Step 2 &mdash; Make the equation match.</b> Subtract 2 from both sides of the original equation: <i>xy</i> + <i>x</i> &minus; 2<i>y</i> &minus; 2 = 7. Now the left side is exactly the product, so (<i>x</i> &minus; 2)(<i>y</i> + 1) = 7. (This is Simon&rsquo;s Favorite Factoring Trick.)<br><br><b>Step 3 &mdash; Use that 7 is prime.</b> Two integers multiply to 7 only as 1 &times; 7, 7 &times; 1, (&minus;1) &times; (&minus;7), or (&minus;7) &times; (&minus;1). Since <i>y</i> is positive, <i>y</i> + 1 is at least 2, so <i>y</i> + 1 must be 7 (it cannot be 1, &minus;1, or &minus;7).<br><br><b>Step 4 &mdash; Solve.</b> <i>y</i> + 1 = 7 gives <i>y</i> = 6, and then <i>x</i> &minus; 2 = 1 gives <i>x</i> = 3. So the only pair is (3, 6).<br><br><b>Answer check:</b> 3 &middot; 6 + 3 &minus; 2 &middot; 6 = 18 + 3 &minus; 12 = 9. &#10003; A computer search of all positive <i>x</i>, <i>y</i> up to 100 finds only (3, 6).<br><br><b>Trap:</b> (5, 4) gives 20 + 5 &minus; 8 = 17, (4, 5) gives 20 + 4 &minus; 10 = 14, and (2, 7) gives 14 + 2 &minus; 14 = 2 &mdash; none equal 9.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "A basket of fruit is arranged out of apples, bananas, and oranges. What is the smallest number of fruit that should be put in the basket to guarantee that there are either at least 8 apples or at least 6 bananas or at least 9 oranges?", "opts": ["19", "21", "22", "20"], "ci": 1, "exp": "<b>What we need:</b> the smallest number of fruit that <i>forces</i> at least 8 apples, or at least 6 bananas, or at least 9 oranges &mdash; no matter how unlucky the mix is.<br><br><b>Step 1 &mdash; Think about the worst case.</b> To avoid every goal for as long as possible, put in as many of each fruit as you can <i>without</i> reaching its goal: at most 7 apples (one short of 8), at most 5 bananas (one short of 6), and at most 8 oranges (one short of 9).<br><br><b>Step 2 &mdash; Count the worst case.</b> 7 + 5 + 8 = 20. So a basket of 20 fruit can still miss every goal (7 apples, 5 bananas, 8 oranges).<br><br><b>Step 3 &mdash; Add one more.</b> With 21 fruit, suppose no goal is met. Then there are at most 7 apples, at most 5 bananas, and at most 8 oranges, which is at most 20 fruit &mdash; but there are 21. That is impossible, so some goal must be met. This is the Pigeonhole Principle.<br><br><b>Answer check:</b> 20 is not enough (the 7-5-8 basket), and 21 always works, so the smallest number is <b>21</b>. A computer check of every possible mix of apples, bananas, and oranges gives the same answer.<br><br><b>Trap:</b> Adding the goals (8 + 6 + 9 = 23) or forgetting the final +1 (giving 20) are the common mistakes. The worst case uses one <i>less</i> than each goal, then you add 1.", "tag": "Chapter 1", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
