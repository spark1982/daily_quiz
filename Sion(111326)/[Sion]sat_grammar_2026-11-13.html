<script>
var TITLE = "[Sion] SAT Grammar";
var QUIZ_KEY = "satgrammar_20";
var INSTRUCTION = "Read each text and choose the answer that best completes or revises it.";
var TODAY_STR = "20261113";
var RAW_QUESTIONS = [{"context": "Launched in 1977, the Voyager 1 space probe carries a gold-plated record intended for any intelligent beings who might someday find ______ the sound of rain, greetings in fifty-five languages, and music ranging from Bach to Chuck Berry.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["it,", "it:", "it", "it;"], "ci": 1, "exp": "The words after the blank are a list that explains what the record holds, and the part before the blank is a complete clause. A colon introduces such a list. A semicolon must join two independent clauses, a comma makes &ldquo;the sound of rain&rdquo; look like part of the main clause, and no punctuation runs the list into the verb &ldquo;find.&rdquo;", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Long before the Hubble Space Telescope finally reached orbit in 1990, astronomer Lyman Spitzer ______ for nearly four decades that a large telescope placed above Earth&rsquo;s blurring atmosphere could transform astronomy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["has argued", "will have argued", "had argued", "argues"], "ci": 2, "exp": "&ldquo;Long before &hellip; in 1990&rdquo; shows that Spitzer&rsquo;s arguing took place before another past event, so the past perfect &ldquo;had argued&rdquo; is required. The present perfect and present tense connect the action to the present, and the future perfect points to the future, none of which fits a 1990 timeline.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Hoping to cut the amount of food waste sent to its landfills, ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the weight of the food scraps that residents threw away became the basis of a new fee in Seoul.", "a fee based on the weight of food scraps was introduced by the city of Seoul.", "the city of Seoul began charging residents according to the weight of the food scraps they threw away.", "residents of Seoul began to be charged by the city according to the weight of the food scraps they threw away."], "ci": 2, "exp": "The introductory phrase &ldquo;Hoping to cut the amount of food waste sent to its landfills&rdquo; must describe the subject that comes right after the comma. Only &ldquo;the city of Seoul&rdquo; is the one hoping to cut waste sent to <i>its</i> landfills. In the other choices, the phrase would describe residents, a fee, or the weight of scraps, creating a dangling modifier.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; Mauna Loa, in Hawaii, is a shield volcano.<br>&bull; Its eruptions usually produce slow-moving rivers of runny lava.<br>&bull; Mount St. Helens, in Washington State, is a stratovolcano.<br>&bull; Its 1980 eruption was explosive, blasting ash more than 24 kilometers into the air.<br>&bull; Both volcanoes are monitored by the U.S. Geological Survey.", "stem": "The student wants to contrast the eruptions of the two volcanoes. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["In 1980, Mount St. Helens, a stratovolcano in Washington State, erupted explosively, blasting ash more than 24 kilometers into the air.", "Whereas Mauna Loa&rsquo;s eruptions usually send out slow-moving rivers of runny lava, Mount St. Helens erupted explosively in 1980, blasting ash more than 24 kilometers into the air.", "Both Mauna Loa in Hawaii and Mount St. Helens in Washington State are monitored by the U.S. Geological Survey.", "Mauna Loa is a shield volcano in Hawaii, while Mount St. Helens is a stratovolcano in Washington State."], "ci": 1, "exp": "To contrast the <i>eruptions</i>, a choice must describe how each volcano erupts and show the difference. Only the &ldquo;Whereas&rdquo; choice does both. One choice gives a similarity, one contrasts the volcano types and locations but not the eruptions, and one describes only Mount St. Helens.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "The Dead Sea lies more than 400 meters below sea level, and no rivers flow out of it. ______ water leaves the lake only by evaporating, which leaves dissolved salts behind and makes the water nearly ten times saltier than the ocean.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "For example,", "As a result,", "In contrast,"], "ci": 2, "exp": "The first sentence gives the cause (no outlet), and the second gives the effect (water can leave only by evaporating). &ldquo;As a result&rdquo; signals that cause-and-effect link. &ldquo;In contrast&rdquo; and &ldquo;Nevertheless&rdquo; signal opposition, and &ldquo;For example&rdquo; would introduce an illustration, not a consequence.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "The Great Wall of China is often said to be visible from the Moon with the naked eye. Astronauts who have orbited Earth, ______ report that the wall is hard to spot even from low orbit, since it is narrow and roughly the same color as the land around it.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["moreover,", "consequently,", "however,", "for example,"], "ci": 2, "exp": "The second sentence contradicts the popular claim in the first: astronauts say the wall is hard to see even from much closer than the Moon. &ldquo;However&rdquo; marks that contrast. &ldquo;Moreover&rdquo; would add support, &ldquo;for example&rdquo; would illustrate the claim, and &ldquo;consequently&rdquo; would make the astronauts&rsquo; reports a result of the claim.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "The ______ salamander native to the canals and lakes beneath Mexico City&mdash;can regrow entire limbs, parts of its heart, and even sections of its brain, abilities that have made it a model organism for scientists who study healing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["axolotl a", "axolotl; a", "axolotl, a", "axolotl&mdash;a"], "ci": 3, "exp": "The phrase &ldquo;a salamander native to &hellip; Mexico City&rdquo; is extra information inserted between the subject and the verb &ldquo;can regrow.&rdquo; It already ends with a dash, so it must begin with a dash too. Mixing a comma with a dash is not allowed, and a semicolon would cut the subject off from its verb.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Ecologist Suzanne Simard studies the vast underground fungal networks that connect the roots of forest ______ networks, she has found, can carry carbon and nutrients from older trees to young seedlings.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["trees. These", "trees these", "trees, and, these", "trees, these"], "ci": 0, "exp": "Both &ldquo;Ecologist Suzanne Simard studies &hellip; forest trees&rdquo; and &ldquo;These networks &hellip; can carry carbon&rdquo; are independent clauses, so they must be separated by a period (or a semicolon). A comma alone creates a comma splice, no punctuation creates a run-on, and the comma after &ldquo;and&rdquo; is not standard.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "The collection of handwritten letters that historian Mary Beth Norton located in an archive in Vermont ______ new light on how ordinary families experienced the Revolutionary War.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["sheds", "have shed", "shed", "are shedding"], "ci": 0, "exp": "The subject is the singular noun &ldquo;collection,&rdquo; not &ldquo;letters,&rdquo; which belongs to the prepositional phrase &ldquo;of handwritten letters.&rdquo; A singular subject takes the singular verb &ldquo;sheds.&rdquo; The other choices are plural verbs that wrongly agree with &ldquo;letters&rdquo; or &ldquo;families.&rdquo;", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "While researching a topic, a student has taken the following notes:<br>&bull; Ada Lovelace (1815&ndash;1852) was an English mathematician.<br>&bull; She wrote detailed notes on Charles Babbage&rsquo;s proposed Analytical Engine, a mechanical computer.<br>&bull; Her notes included a step-by-step method for the machine to calculate Bernoulli numbers.<br>&bull; Many historians consider this method the first published computer program.<br>&bull; The Analytical Engine was never built.", "stem": "The student wants to emphasize that Lovelace&rsquo;s program was written for a machine that did not yet exist. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Although Babbage&rsquo;s Analytical Engine was never built, Ada Lovelace wrote for it what many historians consider the first published computer program.", "Charles Babbage proposed the Analytical Engine, a mechanical computer, and Ada Lovelace wrote detailed notes about it.", "Many historians consider Ada Lovelace&rsquo;s step-by-step method for calculating Bernoulli numbers to be the first published computer program.", "Ada Lovelace, an English mathematician who lived from 1815 to 1852, wrote detailed notes on Charles Babbage&rsquo;s Analytical Engine."], "ci": 0, "exp": "The goal has two parts: Lovelace&rsquo;s program, and the fact that the machine did not exist. Only the correct choice joins &ldquo;the first published computer program&rdquo; with &ldquo;the Analytical Engine was never built.&rdquo; The choice about Bernoulli numbers mentions the program but never says the machine was not built; the others mention neither the program&rsquo;s importance nor the missing machine.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ if(window.SAT_TIMEUP && SAT_TIMEUP() && !(activeSet && activeSet.length)){ wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, "(time's up)")); } else skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* sat-timer 2026-11-06 */
(function(){
  var PER_Q = 45;
  var LIMIT = PER_Q * RAW_QUESTIONS.length;
  var TK = STORAGE_KEY + '_timer';
  function blank(){ return {el:0, per:{}, up:false}; }
  function load(){ try{ return JSON.parse(localStorage.getItem(TK)) || blank(); }catch(e){ return blank(); } }
  var T = load(), paused = false, last = Date.now();
  function save(){ try{ localStorage.setItem(TK, JSON.stringify(T)); }catch(e){} }
  function retrying(){ return !!(activeSet && activeSet.length); }
  window.SAT_TIMEUP = function(){ return !!T.up; };
  var bar = document.createElement('div'); bar.className = 'sat-timer'; bar.id = 'sat-timer';
  bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
