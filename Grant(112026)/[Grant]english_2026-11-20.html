<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Some questions say \u201cSelect ALL that apply\u201d \u2014 those have more than one correct answer. Look back at the passage before you answer.";
var TODAY_STR = "20261120";
var RAW_QUESTIONS = [{"passage": "<strong>A Shortcut Between Oceans</strong><br>For centuries, ships traveling between the Atlantic and Pacific Oceans had to sail around the southern tip of South America, a voyage that could take months. In the 1880s, a French company attempted to dig a canal across the narrow Isthmus of Panama, but the effort collapsed. Heavy rains triggered mudslides that buried completed work, and tropical diseases spread by mosquitoes killed thousands of laborers.<br><br>When the United States took over the project in 1904, officials were determined to ensure that those failures would not be repeated. Dr. William Gorgas, an army physician, persuaded leaders that the mosquitoes themselves had to be defeated. His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred. Within a few years, yellow fever had vanished from the canal zone, and far fewer workers fell ill.<br><br>Engineers also changed the plan. Rather than cutting a channel all the way down to sea level, they dammed a river to create an enormous lake and built giant locks that raise ships about 85 feet to reach it. When the canal opened in 1914, a voyage from New York to San Francisco became roughly 8,000 miles shorter.", "stem": "According to the passage, why did the engineers build giant locks?", "opts": ["Ships had to be lifted up to reach the lake the engineers created.", "The locks kept mosquitoes from crossing the isthmus.", "Mudslides had filled the new lake with mud.", "The French had already dug a channel down to sea level."], "ci": 0, "exp": "The third paragraph says the engineers did not dig to sea level; instead they made a lake and &ldquo;built giant locks that raise ships about 85 feet to reach it.&rdquo; Because the lake sat high above the oceans, ships needed locks to climb up to it.<br><b>Why not the others:</b> the most tempting choice mentions the French channel, but the French effort &ldquo;collapsed,&rdquo; and the Americans chose <i>not</i> to cut down to sea level; mosquitoes and mudslides have nothing to do with the locks.<br><b>Clue words:</b> &ldquo;Rather than &hellip;&rdquo; signals the engineers&rsquo; reason for a new plan.", "tag": "Cause & Effect", "tagcolor": "#E24B4A"}, {"passage": "<strong>A Shortcut Between Oceans</strong><br>For centuries, ships traveling between the Atlantic and Pacific Oceans had to sail around the southern tip of South America, a voyage that could take months. In the 1880s, a French company attempted to dig a canal across the narrow Isthmus of Panama, but the effort collapsed. Heavy rains triggered mudslides that buried completed work, and tropical diseases spread by mosquitoes killed thousands of laborers.<br><br>When the United States took over the project in 1904, officials were determined to ensure that those failures would not be repeated. Dr. William Gorgas, an army physician, persuaded leaders that the mosquitoes themselves had to be defeated. His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred. Within a few years, yellow fever had vanished from the canal zone, and far fewer workers fell ill.<br><br>Engineers also changed the plan. Rather than cutting a channel all the way down to sea level, they dammed a river to create an enormous lake and built giant locks that raise ships about 85 feet to reach it. When the canal opened in 1914, a voyage from New York to San Francisco became roughly 8,000 miles shorter.", "stem": "The passage says that Dr. Gorgas&rsquo;s crews worked to defeat the mosquitoes. Which of these is an <b>example</b> of something the crews did to defeat the mosquitoes?", "opts": ["Yellow fever vanished from the canal zone.", "They decided that the mosquitoes had to be defeated.", "They covered windows with screens.", "Engineers dammed a river to make a lake."], "tag": "Example", "tagcolor": "#185FA5", "hint": "An <b>example</b> is one specific thing, action, or event that shows the bigger idea. It is <i>not</i> the big idea said again in other words, and it is <i>not</i> a result of the idea.", "exp": "<b>What is an example?</b> An example is <b>one specific case</b> that shows a bigger idea. Big idea: the crews worked to defeat the mosquitoes. A specific action they took: &ldquo;covered windows with screens.&rdquo; That is an example.<br><b>Why not the others:</b> &ldquo;They decided the mosquitoes had to be defeated&rdquo; just says the big idea again &mdash; it is not one specific thing they did; &ldquo;Yellow fever vanished from the canal zone&rdquo; is a <i>result</i> of their work, not an example of it; &ldquo;Engineers dammed a river to make a lake&rdquo; is true, but it is an example of a different idea (changing the canal plan).<br><b>Test:</b> put &ldquo;For example,&rdquo; in front: &ldquo;The crews fought the mosquitoes. <i>For example,</i> they covered windows with screens.&rdquo; If it sounds right and shows the idea, it is an example.", "ci": 2}, {"passage": "<strong>A Shortcut Between Oceans</strong><br>For centuries, ships traveling between the Atlantic and Pacific Oceans had to sail around the southern tip of South America, a voyage that could take months. In the 1880s, a French company attempted to dig a canal across the narrow Isthmus of Panama, but the effort collapsed. Heavy rains triggered mudslides that buried completed work, and tropical diseases spread by mosquitoes killed thousands of laborers.<br><br>When the United States took over the project in 1904, officials were determined to ensure that those failures would not be repeated. Dr. William Gorgas, an army physician, persuaded leaders that the mosquitoes themselves had to be defeated. His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred. Within a few years, yellow fever had vanished from the canal zone, and far fewer workers fell ill.<br><br>Engineers also changed the plan. Rather than cutting a channel all the way down to sea level, they dammed a river to create an enormous lake and built giant locks that raise ships about 85 feet to reach it. When the canal opened in 1914, a voyage from New York to San Francisco became roughly 8,000 miles shorter.", "stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Heavy rains soaked the isthmus.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> Yellow fever vanished from the canal zone.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> Mosquitoes spread tropical diseases.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> The trip from New York to San Francisco became about 8,000 miles shorter.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Crews drained standing water and sprayed oil on ponds.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> Mudslides buried work that was already finished.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The canal opened in 1914.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> Thousands of laborers died.</td></tr></table>Which choice matches every cause with the correct effect?", "opts": ["1–A, 2–B, 3–C, 4–D", "1–C, 2–A, 3–D, 4–B", "1–C, 2–D, 3–A, 4–B", "1–D, 2–C, 3–A, 4–B"], "ci": 2, "exp": "Test each pair with &ldquo;Because ___, ___.&rdquo; <b>1–C:</b> Because heavy rains fell, &ldquo;mudslides &hellip; buried completed work.&rdquo; <b>2–D:</b> Because mosquitoes spread disease, they &ldquo;killed thousands of laborers.&rdquo; <b>3–A:</b> Because crews drained water and sprayed ponds, &ldquo;yellow fever had vanished from the canal zone.&rdquo; <b>4–B:</b> Because the canal opened, the voyage &ldquo;became roughly 8,000 miles shorter.&rdquo;<br><b>Watch out:</b> the letters are not in the same order as the numbers &mdash; matching 1–A, 2–B, 3–C, 4–D just copies the order. Read each effect and ask which cause made it happen.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A"}, {"passage": "<strong>A Shortcut Between Oceans</strong><br>For centuries, ships traveling between the Atlantic and Pacific Oceans had to sail around the southern tip of South America, a voyage that could take months. In the 1880s, a French company attempted to dig a canal across the narrow Isthmus of Panama, but the effort collapsed. Heavy rains triggered mudslides that buried completed work, and tropical diseases spread by mosquitoes killed thousands of laborers.<br><br>When the United States took over the project in 1904, officials were determined to ensure that those failures would not be repeated. Dr. William Gorgas, an army physician, persuaded leaders that the mosquitoes themselves had to be defeated. His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred. Within a few years, yellow fever had vanished from the canal zone, and far fewer workers fell ill.<br><br>Engineers also changed the plan. Rather than cutting a channel all the way down to sea level, they dammed a river to create an enormous lake and built giant locks that raise ships about 85 feet to reach it. When the canal opened in 1914, a voyage from New York to San Francisco became roughly 8,000 miles shorter.", "stem": "<b>Part A</b><br>According to the passage, why did far fewer canal workers become sick after 1904?", "opts": ["Heavy rains washed the mosquitoes out of the canal zone.", "Engineers built locks, so workers no longer had to dig in the mud.", "Crews destroyed the places where disease-carrying mosquitoes bred and kept the insects away from people.", "The French company left medicine behind for the American workers."], "ci": 2, "exp": "The second paragraph explains the cause: Gorgas&rsquo;s &ldquo;crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred,&rdquo; and the result follows: &ldquo;yellow fever had vanished &hellip; and far fewer workers fell ill.&rdquo; Test it: <i>Because</i> crews wiped out the mosquitoes&rsquo; breeding spots, <i>far fewer workers got sick</i>.<br><b>Why not the others:</b> the locks were about raising ships, not about health; the passage never mentions French medicine; heavy rains caused <i>mudslides</i>, and they happened in the French years.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A"}, {"passage": "<strong>A Shortcut Between Oceans</strong><br>For centuries, ships traveling between the Atlantic and Pacific Oceans had to sail around the southern tip of South America, a voyage that could take months. In the 1880s, a French company attempted to dig a canal across the narrow Isthmus of Panama, but the effort collapsed. Heavy rains triggered mudslides that buried completed work, and tropical diseases spread by mosquitoes killed thousands of laborers.<br><br>When the United States took over the project in 1904, officials were determined to ensure that those failures would not be repeated. Dr. William Gorgas, an army physician, persuaded leaders that the mosquitoes themselves had to be defeated. His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred. Within a few years, yellow fever had vanished from the canal zone, and far fewer workers fell ill.<br><br>Engineers also changed the plan. Rather than cutting a channel all the way down to sea level, they dammed a river to create an enormous lake and built giant locks that raise ships about 85 feet to reach it. When the canal opened in 1914, a voyage from New York to San Francisco became roughly 8,000 miles shorter.", "stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did far fewer canal workers become sick after 1904?&rdquo;)?<br><br><b>A.</b> &ldquo;a voyage that could take months&rdquo;<br><b>B.</b> &ldquo;Heavy rains triggered mudslides that buried completed work&rdquo;<br><b>C.</b> &ldquo;His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred.&rdquo;<br><b>D.</b> &ldquo;tropical diseases spread by mosquitoes killed thousands of laborers&rdquo;<br><b>E.</b> &ldquo;Within a few years, yellow fever had vanished from the canal zone&rdquo;<br><b>F.</b> &ldquo;they dammed a river to create an enormous lake&rdquo;", "opts": ["C and E", "D and E", "A and C", "B and F"], "ci": 0, "exp": "<b>C</b> shows what the crews did (the cause), and <b>E</b> shows what happened because of it (the disease disappeared) &mdash; together they prove the answer to Part A.<br><b>Why not the others:</b> <b>D</b> is true, but it describes the French years and explains why mosquitoes were dangerous, not what changed after 1904; <b>A</b> is about the long trip around South America; <b>B</b> is about mudslides; <b>F</b> is about the engineers&rsquo; lake.<br><b>Tip:</b> pick one sentence that shows the <i>cause</i> and one that shows the <i>effect</i>.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A"}, {"passage": "<strong>The Starter</strong><br>Marcus lifted the lid of the glass jar and frowned. Grandma Dee&rsquo;s sourdough starter, which usually rose into a bubbly dome, lay flat and gray, and a thin layer of brown liquid floated on top.<br><br>&ldquo;I think I killed it,&rdquo; he said. &ldquo;I forgot to feed it all week because of soccer tournaments.&rdquo;<br><br>Grandma Dee peered into the dash; that is a cause, not a result of feeding.<br>&#10007; On the first day &ldquo;nothing happened.&rdquo;<br>&#10007; Grandma Dee ties on her apron to bake; nothing says she leaves Marcus out.<br><b>Tip:</b> &ldquo;Select ALL&rdquo; can mean two answers or more. Choose every one the text supports, and only those.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "multi": true, "cis": [0, 1]}, {"passage": "<strong>When the River Came</strong><br>All through April of 1927, the rain would not stop. In Greenville, Mississippi, eleven-year-old Ruthie Bell watched her father leave each evening with the other men to stack sandbags along the levee. One gray morning, the church bells began ringing in the middle of the week, something Ruthie had never heard before.<br><br>&ldquo;The levee broke upstream,&rdquo; Papa announced, bursting through the door. &ldquo;Water&rsquo;s coming. Grab what you can carry.&rdquo;<br><br>Ruthie wrapped her mother&rsquo;s Bible and the family photographs in an oilcloth while her little brother, Amos, chased the hens into a crate. By noon, brown water was swirling around the porch steps. A neighbor rowed up in a flat-bottomed boat, and the family climbed in, leaving behind the piano Ruthie had practiced on every afternoon.<br><br>That night, from the crowded second floor of the brick courthouse, Ruthie gazed at the rooftops poking above the water like stepping stones. Amos was trembling, so she pulled him close and hummed the song she had been learning on the piano, softly, so as not to wake the babies sleeping nearby.", "stem": "Which event happened right after Papa burst through the door with the news?", "opts": ["Ruthie hummed a song to Amos at the courthouse.", "Ruthie wrapped her mother&rsquo;s Bible and the photographs in an oilcloth.", "The church bells began ringing in the middle of the week.", "A neighbor rowed up in a flat-bottomed boat."], "ci": 1, "exp": "Order of events: the bells ring &rarr; Papa bursts in with the news &rarr; R ear</i> to her to comfort him, so <i>close</i> here means &ldquo;near.&rdquo; (It is pronounced with a soft s sound, like <i>dose</i>.)<br><b>Why not the others:</b> &ldquo;to shut&rdquo; is the verb <i>close</i> (close a door), with a z sound; &ldquo;almost equal&rdquo; is the meaning in &ldquo;a close game&rdquo;; &ldquo;to end&rdquo; is the meaning in &ldquo;close the meeting.&rdquo;", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>When the River Came</strong><br>All through April of 1927, the rain would not stop. In Greenville, Mississippi, eleven-year-old Ruthie Bell watched her father leave each evening with the other men to stack sandbags along the levee. One gray morning, the church bells began ringing in the middle of the week, something Ruthie had never heard before.<br><br>&ldquo;The levee broke upstream,&rdquo; Papa announced, bursting through the door. &ldquo;Water&rsquo;s coming. Grab what you can carry.&rdquo;<br><br>Ruthie wrapped her mother&rsquo;s Bible and the family photographs in an oilcloth while her little brother, Amos, chased the hens into a crate. By noon, brown water was swirling around the porch steps. A neighbor rowed up in a flat-bottomed boat, and the family climbed in, leaving behind the piano Ruthie had practiced on every afternoon.<br><br>That night, from the crowded second floor of the brick courthouse, Ruthie gazed at the rooftops poking above the water like stepping stones. Amos was trembling, so she pulled him close and hummed the song she had been learning on the piano, softly, so as not to wake the babies sleeping nearby.", "stem": "What can the reader infer about Ruthie? <b>Select ALL that apply.</b>", "opts": ["She is angry at her father for making the family leave.", "She thinks about other people&rsquo;s needs.", "She cares deeply about her little brother.", "She is too frightened to help her family pack.", "She stays calm on a frightening night."], "ci": 1, "exp": "Use clues from the story:<b ective meetings.", "stem": "According to Passage A, why did Walter&rsquo;s family argue about the heroes for days afterward?", "opts": ["Everyone in the family had listened to the same program together.", "Walter&rsquo;s father did not allow talking during the news.", "The radio played adventure programs only on Saturdays.", "The heroes&rsquo; adventures were reported on the news."], "ci": 0, "exp": "Passage A states the cause directly: &ldquo;<b>Because</b> everyone listened together, the family argued about what would happen next to the heroes for days afterward.&rdquo;<br><b>Why not the others:</b> the no-talking rule was only during the news and does not explain the arguing; the serials were heard &ldquo;each evening,&rdquo; not only Saturdays; the news and the adventure serials were different programs.<br><b>Clue word:</b> <i>because</i> introduces the cause.", "tag": "Cause & Effect", "tagcolor": "#E24B4A"}, {"passage": "<strong>Passage A: The Family Radio</strong><br>In 1938, ten-year-old Walter Kaminski&rsquo;s family owned one radio, a wooden cabinet nearly as tall as Walter himself. Each evening after supper, his parents, grandmother, and three sisters gathered in the living room to hear the news and their favorite adventure serials. Because everyone listened together, the family argued about what would happen next to the heroes for days afterward. During the news, however, Walter&rsquo;s father allowed no talking, since prices and jobs were on every adult&rsquo;s mind. On Saturday mornings, Walter had the radio to himself for one program, and he never missed it.<br><br><strong>Passage B: Mia&rsquo;s Earbuds</strong><br>Today, eleven-year-old Mia Torres listens to stories through a tiny pair of earbuds. She downloads episodes of a mystery podcast to her tablet and plays them whenever she wants: on the bus, while folding laundry, or before bed. If she misses a clue, she simply rewinds. Her older brother follows an entirely different podcast about space, and her parents prefer the news. Mia often wishes someone else in her house were following her mystery, because she has no one to share her guesses with. Last month, she persuaded her best friend to start the series, which transformed their walks to school into detective meetings.", "stem": "Based on Passage B, which statement is <b>NOT</b> true?", "opts": ["Mia&rsquo;s parents listen to the mystery podcast with her every night.", "Mia can rewind an episode if she misses a clue.", "Mia&rsquo;s brother follows a podcast about space.", "Mia&rsquo;s best friend started listening to the mystery series."], "ci": 0, "exp": "Passage B says her parents &ldquo;prefer the news,&rdquo; and Mia wishes someone in her house were following her mystery &mdash; so her parents do <i>not</i> listen with her.<br><b>The others are true:</b> &ldquo;If she misses a clue, she simply rewinds&rdquo;; her brother &ldquo;follows an entirely different podcast about space&rdquo;; she &ldquo;persuaded her best friend to start the series.&rdquo;", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Passage A: The Family Radio</strong><br>In 1938, ten-year-old Walter Kaminski&rsquo;s family owned one radio, a wooden cabinet nearly as tall as Walter himself. Each evening after supper, his parents, grandmother, and three sisters gathered in the living room to hear the news and their favorite adventure serials. Because everyone listened together, the family argued about what would happen next to the heroes for days afterward. During the news, however, Walter&rsquo;s father allowed no talking, since prices and jobs were on every adult&rsquo;s mind. On Saturday mornings, Walter had the radio to himself for one program, and he never missed it.<br><br><strong>Passage B: Mia&rsquo;s Earbuds</strong><br>Today, eleven-year-old Mia Torres listens to stories through a tiny pair of earbuds. She downloads episodes of a mystery podcast to her tablet and plays them whenever she wants: on the bus, while folding laundry, or before bed. If she misses a clue, she simply rewinds. Her older brother follows an entirely different podcast about space, and her parents prefer the news. Mia often wishes someone else in her house were following her mystery, because she has no one to share her guesses with. Last month, she persuaded her best friend to start the series, which transformed their walks to school into detective meetings.", "stem": "What can the reader infer from <b>both</b> passages?", "opts": ["Sharing a story with other people makes listening more fun for both Walter and Mia.", "Children today listen to fewer stories than children did in 1938.", "Walter and Mia both prefer the news to adventure stories.", "Both families chose their programs based on what the father wanted."], "ci": 0, "exp": "Walter&rsquo;s family loved arguing about the heroes &ldquo;for days afterward,&rdquo; and Mia wanted someone &ldquo;to share her guesses with,&rdquo; so she got her friend to listen too. Both passages show that stories are better when shared.<br><b>Why not the others:</b> neither passage compares <i>how many</i> stories children hear; only Walter&rsquo;s father controlled the news, and Mia picks her own podcasts; neither child is said to prefer the news.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Passage A: The Family Radio</strong><br>In 1938, ten-year-old Walter Kaminski&rsquo;s family owned one radio, a wooden cabinet nearly as tall as Walter himself. Each evening after supper, his parents, grandmother, and three sisters gathered in the living room to hear the news and their favorite adventure serials. Because everyone listened together, the family argued about what would happen next to the heroes for days afterward. During the news, however, Walter&rsquo;s father allowed no talking, since prices and jobs were on every adult&rsquo;s mind. On Saturday mornings, Walter had the radio to himself for one program, and he never missed it.<br><br><strong>Pas   var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += isRight(qi, state.answers[qi]) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && !isRight(qi, state.answers[qi]); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
