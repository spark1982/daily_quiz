var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261023";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "had drived", "had driven", "has driven"], "ci": 2, "exp": "After <i>had</i>, use the past participle: <i>drive → drove → <b>driven</b></i>. <i>My family <b>had driven</b> to Kansas City.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Email to Coach Diaz</strong><br><b>(1)</b> Dear Coach Diaz, I am sorry that I missed soccer practice on Monday. <b>(2)</b> My family <u>had drove</u> to Kansas City to visit my grandmother. <b>(3)</b> She has a big garden <u>where</u> she grows pumpkins as large as beach balls. <b>(4)</b> My cousin and <u>me</u> picked the biggest one for our front porch. <b>(5)</b> We got home late on Sunday night so I was too tired to finish my homework. <b>(6)</b> I will be at practice on Wednesday, and I promise to run extra laps!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "which", "who", "when"], "ci": 0, "exp": "Use <i>where</i> to point back to a place. <i>Garden</i> is a place, so <i>a big garden <b>where</b> she grows pumpkins</i> is already correct.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Email to Coach Diaz</strong><br><b>(1)</b> Dear Coach Diaz, I am sorry that I missed soccer practice on Monday. <b>(2)</b> My family <u>had drove</u> to Kansas City to visit my grandmother. <b>(3)</b> She has a big garden <u>where</u> she grows pumpkins as large as beach balls. <b>(4)</b> My cousin and <u>me</u> picked the biggest one for our front porch. <b>(5)</b> We got home late on Sunday night so I was too tired to finish my homework. <b>(6)</b> I will be at practice on Wednesday, and I promise to run extra laps!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "I", "myself", "mine"], "ci": 1, "exp": "<i>My cousin and ___</i> is the subject (they did the picking), so use <i>I</i>. Try it alone: “<i>I</i> picked the biggest one,” not “<i>Me</i> picked.”", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Email to Coach Diaz</strong><br><b>(1)</b> Dear Coach Diaz, I am sorry that I missed soccer practice on Monday. <b>(2)</b> My family <u>had drove</u> to Kansas City to visit my grandmother. <b>(3)</b> She has a big garden <u>where</u> she grows pumpkins as large as beach balls. <b>(4)</b> My cousin and <u>me</u> picked the biggest one for our front porch. <b>(5)</b> We got home late on Sunday night so I was too tired to finish my homework. <b>(6)</b> I will be at practice on Wednesday, and I promise to run extra laps!"}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["We got home late on Sunday night, so I was too tired to finish my homework.", "We got home, late on Sunday night so I was too tired to finish my homework.", "We got home late on Sunday, night so I was too tired to finish my homework.", "We got home late on Sunday night so, I was too tired to finish my homework."], "ci": 0, "exp": "When <i>so</i> joins two complete sentences, put a comma before it: <i>We got home late on Sunday night<b>,</b> so I was too tired.</i>", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Email to Coach Diaz</strong><br><b>(1)</b> Dear Coach Diaz, I am sorry that I missed soccer practice on Monday. <b>(2)</b> My family <u>had drove</u> to Kansas City to visit my grandmother. <b>(3)</b> She has a big garden <u>where</u> she grows pumpkins as large as beach balls. <b>(4)</b> My cousin and <u>me</u> picked the biggest one for our front porch. <b>(5)</b> We got home late on Sunday night so I was too tired to finish my homework. <b>(6)</b> I will be at practice on Wednesday, and I promise to run extra laps!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["spends", "NO CHANGE", "are spending", "have spent"], "ci": 0, "exp": "The subject is <i>each</i>, which is singular, so use <i>spends</i>. Don’t let <i>of the salmon</i> trick you: <i><b>Each</b> of the salmon <b>spends</b> several years in the ocean.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Salmon Find Their Way Home</strong><br><b>(1)</b> Pacific salmon begin their lives in small streams far from the ocean. <b>(2)</b> After a year or two, the young fish swim downstream to the sea. <b>(3)</b> Each of the salmon <u>spend</u> several years in the salty ocean water. <b>(4)</b> <u>Then, without a map. They travel</u> hundreds of miles back to the stream where they hatched. <b>(5)</b> Scientists <u>have known</u> for many years that salmon use smell to find their way. <b>(6)</b> On the trip, the fish swim past many other streams. <b>(7)</b> Those streams smell different from home."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "Then without a map they, travel", "Then, without a map, they travel", "Then, without a map; they travel"], "ci": 2, "exp": "“Then, without a map.” is not a complete sentence — it has no subject or verb. Join it to the next part with a comma: <i>Then, without a map<b>,</b> they travel hundreds of miles.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Report: How Salmon Find Their Way Home</strong><br><b>(1)</b> Pacific salmon begin their lives in small streams far from the ocean. <b>(2)</b> After a year or two, the young fish swim downstream to the sea. <b>(3)</b> Each of the salmon <u>spend</u> several years in the salty ocean water. <b>(4)</b> <u>Then, without a map. They travel</u> hundreds of miles back to the stream where they hatched. <b>(5)</b> Scientists <u>have known</u> for many years that salmon use smell to find their way. <b>(6)</b> On the trip, the fish swim past many other streams. <b>(7)</b> Those streams smell different from home."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["NO CHANGE", "have knew", "has known", "have knowed"], "ci": 0, "exp": "<i>Scientists</i> is plural, so use <i>have</i>, and after <i>have</i> use the past participle <i>known</i>. <i>Scientists <b>have known</b> for many years.</i> The sentence is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Report: How Salmon Find Their Way Home</strong><br><b>(1)</b> Pacific salmon begin their lives in small streams far from the ocean. <b>(2)</b> After a year or two, the young fish swim downstream to the sea. <b>(3)</b> Each of the salmon <u>spend</u> several years in the salty ocean water. <b>(4)</b> <u>Then, without a map. They travel</u> hundreds of miles back to the stream where they hatched. <b>(5)</b> Scientists <u>have known</u> for many years that salmon use smell to find their way. <b>(6)</b> On the trip, the fish swim past many other streams. <b>(7)</b> Those streams smell different from home."}, {"stem": "What is the best way to combine sentences 6 and 7?", "opts": ["On the trip, the fish swim past many other streams, who smell different from home.", "On the trip, the fish swim past many other streams, they smell different from home.", "On the trip, the fish swim past many other streams, where smell different from home.", "On the trip, the fish swim past many other streams, which smell different from home."], "ci": 3, "exp": "Use <i>which</i> to add information about a thing (<i>streams</i>). <i>Who</i> is only for people, <i>where</i> needs its own subject, and a comma alone between two sentences makes a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Salmon Find Their Way Home</strong><br><b>(1)</b> Pacific salmon begin their lives in small streams far from the ocean. <b>(2)</b> After a year or two, the young fish swim downstream to the sea. <b>(3)</b> Each of the salmon <u>spend</u> several years in the salty ocean water. <b>(4)</b> <u>Then, without a map. They travel</u> hundreds of miles back to the stream where they hatched. <b>(5)</b> Scientists <u>have known</u> for many years that salmon use smell to find their way. <b>(6)</b> On the trip, the fish swim past many other streams. <b>(7)</b> Those streams smell different from home."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "had never weared", "had never worn", "have never worn"], "ci": 2, "exp": "After <i>had</i>, use the past participle: <i>wear → wore → <b>worn</b></i>. <i>I <b>had never worn</b> ice skates before.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Diary: My First Time Ice Skating</strong><br><b>(1)</b> Today Mom took my sister and me to the ice rink downtown. <b>(2)</b> I <u>had never wore</u> ice skates before. <b>(3)</b> At first, I held on to the wall and moved very slow. <b>(4)</b> My sister said, “You <u>should</u> bend your knees a little.” <b>(5)</b> I fell twice, but by the end of the hour I could skate across the whole rink. <b>(6)</b> When the music <u>stops</u>, we took off our skates and drank hot cocoa."}, {"stem": "Which sentence has an error?", "opts": ["Today Mom took my sister and me to the ice rink downtown.", "My sister said, “You should bend your knees a little.”", "I fell twice, but by the end of the hour I could skate across the whole rink.", "At first, I held on to the wall and moved very slow."], "ci": 3, "exp": "<i>Slow</i> describes a thing; to tell <i>how</i> I moved, use the adverb <i>slowly</i>: <i>I held on to the wall and moved very <b>slowly</b>.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Diary: My First Time Ice Skating</strong><br><b>(1)</b> Today Mom took my sister and me to the ice rink downtown. <b>(2)</b> I <u>had never wore</u> ice skates before. <b>(3)</b> At first, I held on to the wall and moved very slow. <b>(4)</b> My sister said, “You <u>should</u> bend your knees a little.” <b>(5)</b> I fell twice, but by the end of the hour I could skate across the whole rink. <b>(6)</b> When the music <u>stops</u>, we took off our skates and drank hot cocoa."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["should of", "shoulds", "should to", "NO CHANGE"], "ci": 3, "exp": "<i>Should</i> is followed by the plain verb <i>bend</i>. “Should of” is a mistake for <i>should have</i>. <i>You <b>should</b> bend your knees a little</i> is already correct.", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Diary: My First Time Ice Skating</strong><br><b>(1)</b> Today Mom took my sister and me to the ice rink downtown. <b>(2)</b> I <u>had never wore</u> ice skates before. <b>(3)</b> At first, I held on to the wall and moved very slow. <b>(4)</b> My sister said, “You <u>should</u> bend your knees a little.” <b>(5)</b> I fell twice, but by the end of the hour I could skate across the whole rink. <b>(6)</b> When the music <u>stops</u>, we took off our skates and drank hot cocoa."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["NO CHANGE", "stopped", "will stop", "is stopping"], "ci": 1, "exp": "The diary tells what already happened (<i>took</i>, <i>drank</i>), so the verb must be past tense too: <i>When the music <b>stopped</b>, we took off our skates.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Diary: My First Time Ice Skating</strong><br><b>(1)</b> Today Mom took my sister and me to the ice rink downtown. <b>(2)</b> I <u>had never wore</u> ice skates before. <b>(3)</b> At first, I held on to the wall and moved very slow. <b>(4)</b> My sister said, “You <u>should</u> bend your knees a little.” <b>(5)</b> I fell twice, but by the end of the hour I could skate across the whole rink. <b>(6)</b> When the music <u>stops</u>, we took off our skates and drank hot cocoa."}, {"stem": "What is t  all through September.", "Jordan and me pushed the cart while Tara steered.", "Mr. Allen borrowed a sturdy metal cart from the cafeteria kitchen.", "We rolled the pumpkin all the way to the front office."], "ci": 1, "exp": "<i>Jordan and ___</i> are doing the pushing, so use the subject pronoun <i>I</i>: <i>Jordan and <b>I</b> pushed the cart.</i> Try it alone: “I pushed,” not “Me pushed.”", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Story: The Giant Pumpkin</strong><br><b>(1)</b> Our class grew a pumpkin in the school garden this fall, and it kept growing all through September. <b>(2)</b> By October, it was bigger than <u>Mr. Allens</u> desk chair. <b>(3)</b> <u>“How will we ever move it” asked</u> Tara. <b>(4)</b> Mr. Allen borrowed a sturdy metal cart from the cafeteria kitchen. <b>(5)</b> Jordan and me pushed the cart while Tara steered. <b>(6)</b> We rolled the pumpkin all the way to the front office. <b>(7)</b> Where everyone came out to see it."}, {"stem": "What is the best way to combine sentences 6 and 7?", "opts": ["We rolled the pumpkin all the way to the front office, where everyone came out to see it.", "We rolled the pumpkin all the way to the front office. Where everyone came out to see it.", "We rolled the pumpkin all the way to the front office, everyone came out to see it.", "We rolled the pumpkin all the way to the front office where, everyone came out to see it."], "ci": 0, "exp": "Sentence 7 is a fragment — it can’t stand alone. Attach it to sentence 6 with a comma: <i>&hellip;to the front office<b>, where</b> everyone came out to see it.</i> Joining two sentences with only a comma makes a run-on.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Story: The Giant Pumpkin</strong><br><b>(1)</b> Our class grew a pumpkin in the school garden this fall, and it kept growing all through September. <b>(2)</b> By October, it was bigger than <u>Mr. Allens</u> desk chair. <b>(3)</b> <u>“How will we ever move it var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
