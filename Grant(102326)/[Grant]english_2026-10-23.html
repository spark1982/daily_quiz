<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261023";
var RAW_QUESTIONS = [{"stem": "Which event happened right after the explorers got horses from Sacagawea&rsquo;s people?", "opts": ["They struggled across the Rocky Mountains in early snow.", "They reached the coast of the Pacific Ocean.", "They met Sacagawea at Fort Mandan.", "They returned to St. Louis with their journals."], "ci": 0, "exp": "The passage says that after Sacagawea&rsquo;s help &ldquo;allowed them to obtain horses,&rdquo; &ldquo;Soon afterward, they struggled across the Rocky Mountains.&rdquo; Meeting Sacagawea happened earlier, during the winter at Fort Mandan.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Corps of Discovery</strong><br><p style=\"margin:0 0 8px;\">In 1803, the United States bought an enormous territory from France called the Louisiana Purchase, roughly doubling the size of the young nation. Yet almost no one in the East knew what the land contained. President Thomas Jefferson asked Meriwether Lewis to lead an expedition that would map the region, study its plants and animals, and search for a water route to the Pacific Ocean. Lewis invited his friend William Clark to share command.</p><p style=\"margin:0 0 8px;\">In May 1804, about thirty men, known as the Corps of Discovery, set out from near St. Louis and paddled up the Missouri River. They spent their first winter at Fort Mandan, in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them as an interpreter. The next summer, when the explorers reached her people, Sacagawea&rsquo;s help allowed them to obtain horses. Soon afterward, they struggled across the Rocky Mountains, where early snow and hunger nearly ended the journey.</p><p style=\"margin:0 0 8px;\">In November 1805, they finally reached the Pacific coast. When they returned to St. Louis in September 1806, they carried extensive journals and maps describing over a hundred animals that scientists in the East had never recorded. They had not found an all-water route, but their records changed how Americans understood the West.</p>"}, {"stem": "According to the passage, where did the Corps of Discovery spend its first winter?", "opts": ["near St. Louis, where the journey began", "on the Pacific coast", "at Fort Mandan, in present-day North Dakota", "high in the Rocky Mountains"], "ci": 2, "exp": "The passage states, &ldquo;They spent their first winter at Fort Mandan, in present-day North Dakota.&rdquo; St. Louis is where they started in May 1804, not where they spent the winter.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Corps of Discovery</strong><br><p style=\"margin:0 0 8px;\">In 1803, the United States bought an enormous territory from France called the Louisiana Purchase, roughly doubling the size of the young nation. Yet almost no one in the East knew what the land contained. President Thomas Jefferson asked Meriwether Lewis to lead an expedition that would map the region, study its plants and animals, and search for a water route to the Pacific Ocean. Lewis invited his friend William Clark to share command.</p><p style=\"margin:0 0 8px;\">In May 1804, about thirty men, known as the Corps of Discovery, set out from near St. Louis and paddled up the Missouri River. They spent their first winter at Fort Mandan, in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them as an interpreter. The next summer, when the explorers reached her people, Sacagawea&rsquo;s help allowed them to obtain horses. Soon afterward, they struggled across the Rocky Mountains, where early snow and hunger nearly ended the journey.</p><p style=\"margin:0 0 8px;\">In November 1805, they finally reached the Pacific coast. When they returned to St. Louis in September 1806, they carried extensive journals and maps describing over a hundred animals that scientists in the East had never recorded. They had not found an all-water route, but their records changed how Americans understood the West.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Although the Corps of Discovery never found an all-water route, its long journey gave Americans valuable knowledge about the West.", "Sacagawea was the only reason the Corps of Discovery survived the trip across the mountains.", "The Louisiana Purchase roughly doubled the size of the United States in 1803.", "Crossing the Rocky Mountains was the most difficult part of the Corps&rsquo;s journey."], "ci": 0, "exp": "The whole passage follows the expedition from start to finish and ends: &ldquo;their records changed how Americans understood the West.&rdquo; The other choices are single details from one part of the passage.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Corps of Discovery</strong><br><p style=\"margin:0 0 8px;\">In 1803, the United States bought an enormous territory from France called the Louisiana Purchase, roughly doubling the size of the young nation. Yet almost no one in the East knew what the land contained. President Thomas Jefferson asked Meriwether Lewis to lead an expedition that would map the region, study its plants and animals, and search for a water route to the Pacific Ocean. Lewis invited his friend William Clark to share command.</p><p style=\"margin:0 0 8px;\">In May 1804, about thirty men, known as the Corps of Discovery, set out from near St. Louis and paddled up the Missouri River. They spent their first winter at Fort Mandan, in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them as an interpreter. The next summer, when the explorers reached her people, Sacagawea&rsquo;s help allowed them to obtain horses. Soon afterward, they struggled across the Rocky Mountains, where early snow and hunger nearly ended the journey.</p><p style=\"margin:0 0 8px;\">In November 1805, they finally reached the Pacific coast. When they returned to St. Louis in September 1806, they carried extensive journals and maps describing over a hundred animals that scientists in the East had never recorded. They had not found an all-water route, but their records changed how Americans understood the West.</p>"}, {"stem": "In the third paragraph, what does the word &ldquo;extensive&rdquo; mean in &ldquo;they carried extensive journals and maps&rdquo;?", "opts": ["expensive and carefully decorated", "copied from earlier explorers", "written quickly at the end of the trip", "long and detailed, covering many subjects"], "ci": 3, "exp": "The journals described &ldquo;over a hundred animals,&rdquo; so they covered a great deal &mdash; they were <i>extensive</i>. Nothing in the passage says they were costly or copied.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Corps of Discovery</strong><br><p style=\"margin:0 0 8px;\">In 1803, the United States bought an enormous territory from France called the Louisiana Purchase, roughly doubling the size of the young nation. Yet almost no one in the East knew what the land contained. President Thomas Jefferson asked Meriwether Lewis to lead an expedition that would map the region, study its plants and animals, and search for a water route to the Pacific Ocean. Lewis invited his friend William Clark to share command.</p><p style=\"margin:0 0 8px;\">In May 1804, about thirty men, known as the Corps of Discovery, set out from near St. Louis and paddled up the Missouri River. They spent their first winter at Fort Mandan, in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them as an interpreter. The next summer, when the explorers reached her people, Sacagawea&rsquo;s help allowed them to obtain horses. Soon afterward, they struggled across the Rocky Mountains, where early snow and hunger nearly ended the journey.</p><p style=\"margin:0 0 8px;\">In November 1805, they finally reached the Pacific coast. When they returned to St. Louis in September 1806, they carried extensive journals and maps describing over a hundred animals that scientists in the East had never recorded. They had not found an all-water route, but their records changed how Americans understood the West.</p>"}, {"stem": "What can the reader infer about a limestone cave with very large rooms?", "opts": ["It was carved by a powerful underground river.", "It contains no stalactites or stalagmites.", "It formed in rock that does not dissolve in acid.", "It has been forming for an extremely long time."], "ci": 3, "exp": "The passage says the acid turns cracks into tunnels and, &ldquo;after hundreds of thousands of years, into enormous rooms.&rdquo; So very large rooms suggest a very long time. The passage says caves are carved &ldquo;not by rushing rivers.&rdquo;", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>How Limestone Caves Form</strong><br><p style=\"margin:0 0 8px;\">Many of the world&rsquo;s largest caves were carved not by rushing rivers but by slow, quiet chemistry. As rain falls and soaks into the soil, it absorbs carbon dioxide and becomes a weak acid. This slightly acidic water seeps downward through tiny cracks in limestone, a rock made mostly of the shells and skeletons of ancient sea creatures. Little by little, the acid dissolves the rock, widening the cracks into tunnels and, after hundreds of thousands of years, into enormous rooms.</p><p style=\"margin:0 0 8px;\">Once a cave has formed, it continues to change. When water drips from the ceiling, it releases some of its carbon dioxide into the cave air, and a tiny ring of limestone is left behind. Over centuries, these rings build stalactites that hang down like icicles, while drops that splash on the floor build stalagmites that rise upward. Where the two meet, they form a column.</p><p style=\"margin:0 0 8px;\">Because many formations grow only about an inch every hundred years, they are fragile treasures. A single careless touch can leave skin oils that stop a formation from growing, which is why visitors to caves such as Mammoth Cave in Kentucky are asked to keep their hands to themselves.</p>"}, {"stem": "The suffix <i>-ward</i> means &ldquo;in the direction of.&rdquo; What does &ldquo;downward&rdquo; most likely mean in &ldquo;water seeps downward through tiny cracks&rdquo;?", "opts": ["toward a lower place", "in a slow and quiet way", "deep under the ground", "all the way to the bottom"], "ci": 0, "exp": "<i>Down</i> + <i>-ward</i> (&ldquo;in the direction of&rdquo;) means &ldquo;in the direction of down,&rdquo; or toward a lower place. &ldquo;All the way to the bottom&rdquo; is too strong &mdash; the word tells only the direction.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>How Limestone Caves Form</strong><br><p style=\"margin:0 0 8px;\">Many of the world&rsquo;s largest caves were carved not by rushing rivers but by slow, quiet chemistry. As rain falls and soaks into the soil, it absorbs carbon dioxide and becomes a weak acid. This slightly acidic water seeps downward through tiny cracks in limestone, a rock made mostly of the shells and skeletons of ancient sea creatures. Little by little, the acid dissolves the rock, widening the cracks into tunnels and, after hundreds of thousands of years, into enormous rooms.</p><p style=\"margin:0 0 8px;\">Once a cave has formed, it continues to change. When water drips from the ceiling, it releases some of its carbon dioxide into the cave air, and a tiny ring of limestone is left behind. Over centuries, these rings build stalactites that hang down like icicles, while drops that splash on the floor build stalagmites that rise upward. Where the two meet, they form a column.</p><p style=\"margin:0 0 8px;\">Because many formations grow only about an inch every hundred years, they are fragile treasures. A single careless touch can leave skin oils that stop a formation from growing, which is why visitors to caves such as Mammoth Cave in Kentucky are asked to keep their hands to themselves.</p>"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Rainwater becomes a weak acid by absorbing carbon dioxide.", "Most large caves are carved quickly by rushing underground rivers.", "Limestone is made mostly of the shells and skeletons of ancient sea creatures.", "Stalagmites rise upward from drops that splash on the cave floor."], "ci": 1, "exp": "The passage says the largest caves were carved &ldquo;not by rushing rivers but by slow, quiet chemistry,&rdquo; and the process takes &ldquo;hundreds of thousands of years.&rdquo; The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>How Limestone Caves Form</strong><br><p style=\"margin:0 0 8px;\">Many of the world&rsquo;s largest caves were carved not by rushing rivers but by slow, quiet chemistry. As rain falls and soaks into the soil, it absorbs carbon dioxide and becomes a weak acid. This slightly acidic water seeps downward through tiny cracks in limestone, a rock made mostly of the shells and skeletons of ancient sea creatures. Little by little, the acid dissolves the rock, widening the cracks into tunnels and, after hundreds of thousands of years, into enormous rooms.</p><p style=\"margin:0 0 8px;\">Once a cave has formed, it continues to change. When water drips from the ceiling, it releases some of its carbon dioxide into the cave air, and a tiny ring of limestone is left behind. Over centuries, these rings build stalactites that hang down like icicles, while drops that splash on the floor build stalagmites that rise upward. Where the two meet, they form a column.</p><p style=\"margin:0 0 8px;\">Because many formations grow only about an inch every hundred years, they are fragile treasures. A single careless touch can leave skin oils that stop a formation from growing, which is why visitors to caves such as Mammoth Cave in Kentucky are asked to keep their hands to themselves.</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of &ldquo;fragile&rdquo; as it is used in the passage?", "opts": ["delicate", "sturdy", "valuable", "ancient"], "ci": 1, "exp": "The formations are <i>fragile</i> because &ldquo;a single careless touch&rdquo; can harm them, so <i>fragile</i> means easily damaged. The opposite is <i>sturdy</i>. <i>Delicate</i> is a trap &mdash; it means almost the same as fragile.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>How Limestone Caves Form</strong><br><p style=\"margin:0 0 8px;\">Many of the world&rsquo;s largest caves were carved not by rushing rivers but by slow, quiet chemistry. As rain falls and soaks into the soil, it absorbs carbon dioxide and becomes a weak acid. This slightly acidic water seeps downward through tiny cracks in limestone, a rock made mostly of the shells and skeletons of ancient sea creatures. Little by little, the acid dissolves the rock, widening the cracks into tunnels and, after hundreds of thousands of years, into enormous rooms.</p><p style=\"margin:0 0 8px;\">Once a cave has formed, it continues to change. When water drips from the ceiling, it releases some of its carbon dioxide into the cave air, and a tiny ring of limestone is left behind. Over centuries, these rings build stalactites that hang down like icicles, while drops that splash on the floor build stalagmites that rise upward. Where the two meet, they form a column.</p><p style=\"margin:0 0 8px;\">Because many formations grow only about an inch every hundred years, they are fragile treasures. A single careless touch can leave skin oils that stop a formation from growing, which is why visitors to caves such as Mammoth Cave in Kentucky are asked to keep their hands to themselves.</p>"}, {"stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;confident&rdquo; as it is used in the story?", "opts": ["doubtful", "nervous", "careful", "sure"], "ci": 3, "exp": "Talia &ldquo;was confident that neat, careful work would impress the judges,&rdquo; meaning she felt <i>sure</i>. <i>Doubtful</i> means the opposite.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Scarecrow Contest</strong><br><p style=\"margin:0 0 8px;\">Talia had planned her entry for the Maple Street Scarecrow Contest for weeks. She had sketched a tidy farmer in a plaid shirt and straw hat, and she was confident that neat, careful work would impress the judges. Her younger brother, Marco, kept offering suggestions, but she waved them away.</p><p style=\"margin:0 0 8px;\">&ldquo;What if he&rsquo;s a pirate?&rdquo; Marco asked, holding up a striped sock.</p><p style=\"margin:0 0 8px;\">&ldquo;Scarecrows aren&rsquo;t pirates,&rdquo; Talia said. &ldquo;Just hand me the twine.&rdquo;</p><p style=\"margin:0 0 8px;\">On the morning of the contest, a gust of wind tore across the yard. The straw hat sailed over the fence, and the farmer&rsquo;s stuffed arm drooped to the ground. Talia stared at the wreckage. There was not sufficient time to buy new supplies.</p><p style=\"margin:0 0 8px;\">Marco tugged her sleeve. &ldquo;We could still make him a pirate. Pirates don&rsquo;t need hats that stay on.&rdquo;</p><p style=\"margin:0 0 8px;\">Talia hesitated, then laughed. Together they tied a red bandana around the scarecrow&rsquo;s head, glued on a cardboard eye patch, and propped a broom on his shoulder like an oar. By noon, a crowd of neighbors had gathered to admire Captain Straw. That afternoon, when the judges handed Talia a ribbon for &ldquo;Most Original,&rdquo; she passed it straight to Marco.</p>"}, {"stem": "In the first sentence, what does &ldquo;entry&rdquo; mean in &ldquo;Talia had planned her entry for the Maple Street Scarecrow Contest&rdquo;?", "opts": ["a door or a way into a place", "something entered in a contest", "a note written in a diary", "the act of going into a room"], "ci": 1, "exp": "Talia is making a scarecrow to enter in the contest, so <i>entry</i> means the thing she enters. <i>Entry< var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;

var ACTIVE_KEY = STORAGE_KEY + '_active';

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){

  var ord = activeOrder();
  var qi = ord[state.cur];

  var qpEl = document.getElementById('q-position');

  var opts = document.getElementById('options');

      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
