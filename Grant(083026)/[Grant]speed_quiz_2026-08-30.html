<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}
.subtitle{text-align:center;font-size:0.85rem;color:#555;background:#fff;padding:2px 0 4px}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:2px 12px 10px}
.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}

.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;border:none;}
.results-pill{display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;border:none;}

.q-num{font-size:0.82rem;color:#888;}
.tag-badge{font-size:0.75rem;padding:2px 10px;border-radius:10px;background:#185FA5;color:#fff;font-weight:600;}
.passage-box,.context-box{background:#f5f7fa;border-left:3px solid #185FA5;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.92rem;color:#333;line-height:1.5;}
.q-text{font-size:1.08rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.5;}

.opt-btn:disabled{cursor:default;}

.nav-btns{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
.prev-btn,.next-btn{padding:9px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;}
.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}
.r-card.correct{background:#E1F5EE;color:#085041;}
.r-card.wrong{background:#FCEBEB;color:#501313;}
.r-card.skipped{background:#f5f7fa;color:#555;}
.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}
.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}
.q-timer-bar{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:8px;}
.q-timer-display{font-size:1.2rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;}
.q-timer-display.warn{color:#f5a623;}
.q-timer-display.danger{color:#E24B4A;}
.pause-btn{background:#e8edf4;color:#185FA5;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timeout-box{margin-top:12px;padding:10px 12px;background:#FCEBEB;border-left:3px solid #E24B4A;border-radius:6px;font-size:0.88rem;color:#501313;display:none;}
.r-card.timedout{background:#fdecd2;color:#7a4c00;}
</style>
</head>
<body><div class="quiz-title">[Grant] Speed Quiz</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Answer each problem before the 40-second timer runs out. Use Pause if you need a break.</div><div id="nav-bar"><span id="nav-count">0 / 30</span><div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div><button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button></div><div id="dot-panel"></div>

</div>

</div>

<div class="results-screen" id="results-screen">

    </div>
  </div>
</div>
<script>var TITLE = "[Grant] Speed Quiz";var QUIZ_KEY = "quiz_grantspeed_30_20260829_v1";var ATT_KEY = "quiz_grantspeed_30_att_20260829_v1";var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};var RAW_QUESTIONS = [{"stem": "Compute the following.<br>25 &times; 12 =", "opts": ["300", "275", "325", "250"], "ci": 0, "exp": "25 &times; 12 = 25 &times; 4 &times; 3 = 100 &times; 3 = 300.", "tag": "Multiply"}, {"stem": "My grandfather clock takes 6 seconds to chime 3 times at 3 o'clock. How long does it take to chime 6 times at 6 o'clock?", "opts": ["15 seconds", "12 seconds", "18 seconds", "10 seconds"], "ci": 0, "exp": "Chiming 3 times involves 3 &minus; 1 = 2 intervals in 6 seconds, so each interval takes 6 &divide; 2 = 3 seconds. Chiming 6 times involves 6 &minus; 1 = 5 intervals, so it takes 5 &times; 3 = 15 seconds.", "tag": "Intervals"}, {"stem": "Compute the following.<br>63 &times; 11 =", "opts": ["673", "693", "683", "703"], "ci": 1, "exp": "63 &times; 11 = 63 &times; 10 + 63 = 630 + 63 = 693.", "tag": "Multiply"}, {"stem": "Compute the following.<br>284 + 118 =", "opts": ["400", "392", "402", "412"], "ci": 2, "exp": "284 + 118 = 402.", "tag": "Add & Subtract"}, {"stem": "Compute the following series.<br>2 + 3 + 4 + 5 + 6 + 7 + 8", "opts": ["35", "37", "30", "33"], "ci": 0, "exp": "This is an arithmetic series from 2 to 8 (7 terms). Sum = (first + last) &times; number of terms &divide; 2 = (2 + 8) &times; 7 &divide; 2 = 35.", "tag": "Gauss"}, {"stem": "Compute the following.<br>48 &times; 125 =", "opts": ["7,000", "5,000", "5,500", "6,000"], "ci": 3, "exp": "Regroup for easy multiplication: 48 &times; 125 = 48 &times; 1000 &divide; 8 = 48,000 &divide; 8 = 6,000.", "tag": "Multiply"}, {"stem": "Compute the following.<br>44 &times; 25 =", "opts": ["1,200", "900", "1,100", "1,000"], "ci": 2, "exp": "44 &times; 25 = 44 &times; 100 &divide; 4 = 4,400 &divide; 4 = 1,100.", "tag": "Multiply"}, {"stem": "Compute the following series.<br>6 + 7 + 8 + 9 + 10 + 11", "opts": ["54", "49", "51", "45"], "ci": 2, "exp": "This is an arithmetic series from 6 to 11 (6 terms). Sum = (first + last) &times; number of terms &divide; 2 = (6 + 11) &times; 6 &divide; 2 = 51.", "tag": "Gauss"}, {"stem": "Compute the following. (See Example 6.)<br>937 &minus; (337 + 260) =", "opts": ["350", "320", "330", "340"], "ci": 3, "exp": "337 + 260 = 597, and 937 &minus; 597 = 340.", "tag": "Add & Subtract"}, {"stem": "Compute the following. (See Example 6.)<br>567 &minus; 134 &minus; 133 =", "opts": ["310", "290", "300", "295"], "ci": 2, "exp": "567 &minus; 134 = 433, and 433 &minus; 133 = 300.", "tag": "Add & Subtract"}, {"stem": "David uses some coins to form a triangle. There is a coin at every corner. How many coins does he use if there are 6 coins on each side of the triangle?", "opts": ["18 coins", "12 coins", "16 coins", "15 coins"], "ci": 3, "exp": "Each side has 6 coins including the shared corners, so each side contributes 6 &minus; 1 = 5 coins not counted on the next side. With 3 sides, the total is 3 &times; 5 = 15 coins.", "tag": "Intervals"}, {"stem": "Seven points A, B, C, D, E, F, G lie on a line at unequal intervals, so that every pair of points is a different distance apart. How many different lengths of line segments are there altogether?<br><svg width=\"260\" height=\"60\" viewBox=\"0 0 260 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"250\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"20\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"55\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"55\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"90\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"90\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"125\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"125\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"160\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"160\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"195\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"195\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">F</text><circle cx=\"230\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"230\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">G</text></svg>", "opts": ["21", "14", "24", "20"], "ci": 0, "exp": "With 7 points, the number of segments is C(7,2) = 7 &times; 6 &divide; 2 = 21. Since all intervals are unequal, all 21 segments have different lengths.", "tag": "Geometry"}, {"stem": "How many rectangles are there altogether in the figure below, which shows a 3-by-3 grid?<br><svg width=\"140\" height=\"140\" viewBox=\"0 0 140 140\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"120\" height=\"120\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"130\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"130\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"50\" x2=\"130\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"90\" x2=\"130\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["27", "36", "30", "18"], "ci": 1, "exp": "In an m-by-n grid, the number of rectangles is C(m+1,2) &times; C(n+1,2). Here m = n = 3, so C(4,2) &times; C(4,2) = 6 &times; 6 = 36.", "tag": "Geometry"}, {"stem": "Compute the following series.<br>1 + 2 + 3 + 4 + &hellip; + 48 + 49 + 50", "opts": ["1,300", "1,250", "1,250", "1,275"], "ci": 3, "exp": "This is an arithmetic series from 1 to 50 (50 terms). Sum = (first + last) &times; number of terms &divide; 2 = (1 + 50) &times; 50 &divide; 2 = 1,275.", "tag": "Gauss"}, {"stem": "Each side of a football field is planted with 16 flags. There is one flag at each corner. How many flags are planted altogether in the football field?", "opts": ["56 flags", "64 flags", "48 flags", "60 flags"], "ci": 3, "exp": "The football field is a rectangle with 4 sides. Each side has 16 flags including the shared corners, so each side contributes 16 &minus; 1 = 15 flags not counted on the next side. With 4 sides, the total is 4 &times; 15 = 60 flags.", "tag": "Intervals"}, {"stem": "Five points A, B, C, D, E lie on a line at unequal intervals, so that every pair of points is a different distance apart. How many different lengths of line segments are there altogether?<br><svg width=\"220\" height=\"60\" viewBox=\"0 0 220 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"210\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"20\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"70\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"70\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"110\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"110\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"150\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"150\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"200\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"200\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>", "opts": ["10", "20", "9", "8"], "ci": 0, "exp": "With 5 points, the number of segments is the number of ways to choose 2 points: C(5,2) = 5 &times; 4 &divide; 2 = 10. Since all intervals are unequal, all 10 segments have different lengths.", "tag": "Geometry"}, {"stem": "Six points A, B, C, D, E, F lie on a line at unequal intervals, so that every pair of points is a different distance apart. How many different lengths of line segments are there altogether?<br><svg width=\"240\" height=\"60\" viewBox=\"0 0 240 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"230\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"20\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"60\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"60\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"100\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"100\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"140\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"140\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"180\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"180\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"220\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"220\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>", "opts": ["15", "18", "12", "10"], "ci": 0, "exp": "With 6 points, the number of segments is C(6,2) = 6 &times; 5 &divide; 2 = 15. Since all intervals are unequal, all 15 segments have different lengths.", "tag": "Geometry"}, {"stem": "It takes John 8 minutes to saw a log into 3 equal lengths. How long does it take for him to saw the same log into 9 equal lengths?", "opts": ["36 minutes", "32 minutes", "24 minutes", "28 minutes"], "ci": 1, "exp": "Sawing a log into 3 equal lengths requires 3 &minus; 1 = 2 cuts in 8 minutes, so each cut takes 8 &divide; 2 = 4 minutes. Sawing into 9 equal lengths requires 9 &minus; 1 = 8 cuts, so it takes 8 &times; 4 = 32 minutes.", "tag": "Intervals"}, {"stem": "A bus leaves the station every 10 minutes. How many buses would have left the station in 60 minutes?", "opts": ["7 buses", "6 buses", "8 buses", "5 buses"], "ci": 0, "exp": "If the first bus leaves at the very start, buses depart at 0, 10, 20, 30, 40, 50, and 60 minutes, which is 60 &divide; 10 + 1 = 7 buses in total.", "tag": "Intervals"}, {"stem": "How many squares are there altogether in the figure below, which shows a 3-by-2 grid?<br><svg width=\"150\" height=\"100\" viewBox=\"0 0 150 100\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"130\" height=\"80\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"53\" y1=\"10\" x2=\"53\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"96\" y1=\"10\" x2=\"96\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"50\" x2=\"140\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["7", "8", "6", "9"], "ci": 1, "exp": "Count by size: there are 6 of the smallest (1&times;1) squares, and 2 of the next size up (2&times;2) squares that fit inside the grid. Total = 6 + 2 = 8.", "tag": "Geometry"}, {"stem": "How many squares are there altogether in the figure below, which shows a 2-by-2 grid?<br><svg width=\"120\" height=\"120\" viewBox=\"0 0 120 120\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"100\" height=\"100\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"60\" y1=\"10\" x2=\"60\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"60\" x2=\"110\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["4", "8", "6", "5"], "ci": 3, "exp": "Count by size: there are 4 of the smallest (1&times;1) squares, and 1 of the next size up (2&times;2) square that fits the whole grid. Total = 4 + 1 = 5.", "tag": "Geometry"}, {"stem": "Compute the following.<br>24 + 55 + 76 =", "opts": ["145", "160", "155", "150"], "ci": 2, "exp": "24 + 55 = 79, 79 + 76 = 155.", "tag": "Add & Subtract"}, {"stem": "A sailor tied 7 knots on a rope at regular intervals. The distance from the first knot to the seventh one was 18 m long. What is the distance between every two knots?", "opts": ["2 m", "3 m", "3.6 m", "2.6 m"], "ci": 1, "exp": "From the 1st to the 7th knot there are 7 &minus; 1 = 6 intervals. Distance between two knots = 18 &divide; 6 = 3 m.", "tag": "Intervals"}, {"stem": "Find the sum of all multiples of 4 that are smaller than or equal to 40.", "opts": ["240", "200", "220", "200"], "ci": 2, "exp": "The multiples of 4 up to 40 are 4, 8, 12, &hellip;, 40, which is 10 terms. Sum = (first + last) &times; number of terms &divide; 2 = (4 + 40) &times; 10 &divide; 2 = 220.", "tag": "Gauss"}, {"stem": "Compute the following series.<br>1 + 3 + 5 + 7 + 9 + 11", "opts": ["25", "42", "36", "35"], "ci": 2, "exp": "The sum of the first n odd numbers equals n&sup2;. Here there are 6 odd numbers (1 through 11), so the sum is 6&sup2; = 36.", "tag": "Gauss"}, {"stem": "Compute the following.<br>46 &times; 101 =", "opts": ["4,746", "4,646", "4,546", "4,600"], "ci": 1, "exp": "46 &times; 101 = 46 &times; 100 + 46 = 4,600 + 46 = 4,646.", "tag": "Multiply"}, {"stem": "Compute the following.<br>24 + 47 + 39 =", "opts": ["115", "100", "105", "110"], "ci": 3, "exp": "24 + 47 = 71, 71 + 39 = 110.", "tag": "Add & Subtract"}, {"stem": "Compute the following series.<br>4 + 6 + 8 + 10 + 12 + 14", "opts": ["51", "58", "45", "54"], "ci": 3, "exp": "This is an arithmetic series from 4 to 14 with common difference 2 (6 terms). Sum = (first + last) &times; number of terms &divide; 2 = (4 + 14) &times; 6 &divide; 2 = 54.", "tag": "Gauss"}, {"stem": "Compute the following.<br>86 + 34 + 14 =", "opts": ["134", "138", "125", "130"], "ci": 0, "exp": "86 + 34 = 120, 120 + 14 = 134.", "tag": "Add & Subtract"}, {"stem": "Compute the following.<br>60 &times; 99 =", "opts": ["5,880", "5,940", "6,000", "5,840"], "ci": 1, "exp": "60 &times; 99 = 60 &times; 100 &minus; 60 = 6,000 &minus; 60 = 5,940.", "tag": "Multiply"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + "_order_v1";
var Q_TIME = 40;

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<N;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultTimerState(){ return { remainingAtStart: Q_TIME, startedAt: null, running: false, timedOut: false }; }
function defaultState(){
  var timers = {};
  for(var i=0;i<N;i++) timers[i] = defaultTimerState();
  return { cur:0, answers:{}, timers: timers, showResults:false };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.timers !== 'object' || s.timers===null) s.timers = {};
    for(var i=0;i<N;i++){ if(!s.timers[i]) s.timers[i] = defaultTimerState(); }
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var tickInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function getRemaining(qi){
  var t = state.timers[qi];
  if(!t) return Q_TIME;
  if(t.running && t.startedAt){
    var elapsed = (Date.now()-t.startedAt)/1000;
    return Math.max(0, t.remainingAtStart - elapsed);
  }
  return t.remainingAtStart;
}
function freezeTimer(qi){
  var t = state.timers[qi];
  if(t && t.running){
    t.remainingAtStart = getRemaining(qi);
    t.running = false;
    t.startedAt = null;
  }
}
function startTimerFor(qi){
  var t = state.timers[qi];
  if(!t) { t = defaultTimerState(); state.timers[qi] = t; }
  if(t.timedOut) return;
  if(state.answers[qi] !== undefined) return;
  if(!t.running){
    t.startedAt = Date.now();
    t.running = true;
  }
}
function stopTickInterval(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }
function startTickInterval(){ stopTickInterval(); tickInterval = setInterval(tickRender, 250); }

function tickRender(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var disp = document.getElementById('qTimerDisplay');
  var pauseBtn = document.getElementById('pauseBtn');
  if(!t) return;
  var remaining = getRemaining(qi);
  disp.classList.remove('warn','danger');
  if(remaining <= 0){
    if(t.running){
      t.running = false;
      t.startedAt = null;
      t.remainingAtStart = 0;
      t.timedOut = true;
      saveState();
      renderOptionsLockState();
    }
    disp.textContent = "0:00";
    disp.classList.add('danger');
    document.getElementById('timeout-box').style.display = (state.answers[qi]===undefined) ? 'block' : 'none';
    pauseBtn.disabled = true;
    return;
  }
  pauseBtn.disabled = false;
  disp.textContent = formatTime(remaining);
  if(remaining <= Q_TIME*0.1) disp.classList.add('danger');
  else if(remaining <= Q_TIME*0.25) disp.classList.add('warn');
  pauseBtn.textContent = t.running ? 'Pause' : 'Resume';
}

function renderOptionsLockState(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var answered = state.answers[qi];
  var btns = document.querySelectorAll('#options .opt-btn');
  btns.forEach(function(btn){
    if(answered !== undefined || (t && t.timedOut)) btn.disabled = true;
  });
}

function togglePause(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(!t || t.timedOut || state.answers[qi]!==undefined) return;
  if(t.running){ freezeTimer(qi); }
  else { startTimerFor(qi); }
  saveState();
  tickRender();
}
window.togglePause = togglePause;

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  var timerBar = document.querySelector('.q-timer-bar');
  if(state.showResults){
    qa.style.display='none';
    timerBar.style.display='none';
    rs.classList.add('show');
    stopTickInterval();
    renderResults();
    return;
  }
  qa.style.display='block';
  timerBar.style.display='flex';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  badge.textContent = q.tag;
  badge.style.background = TAG_COLORS[q.tag] || '#185FA5';

  document.getElementById('q-text').innerHTML = q.stem;

  startTimerFor(qi);

  var answered = state.answers[qi];
  var t = state.timers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = (answered !== undefined) || (t && t.timedOut);
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var timeoutBox = document.getElementById('timeout-box');
  timeoutBox.style.display = (t && t.timedOut && answered===undefined) ? 'block' : 'none';

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
  tickRender();
  startTickInterval();
}

function updateNav(){
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi = order[k];
    if(state.answers[qi]!==undefined || (state.timers[qi] && state.timers[qi].timedOut)) done++;
  }
  document.getElementById('nav-count').textContent = done + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (done/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg;
    if(state.answers[qi]===undefined){
      bg = (state.timers[qi] && state.timers[qi].timedOut) ? '#f5a623' : '#d7dde6';
    } else {
      bg = state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A';
    }
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi2 = order[k];
    if(state.answers[qi2]!==undefined || (state.timers[qi2] && state.timers[qi2].timedOut)) done++;
  }
  if(done===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  freezeTimer(order[state.cur]);
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  freezeTimer(order[state.cur]);
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(state.answers[qi] !== undefined) return;
  if(t && t.timedOut) return;
  state.answers[qi] = idx;
  freezeTimer(qi);
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ freezeTimer(order[state.cur]); state.cur--; saveState(); render(); }
}
function goNext(){
  freezeTimer(order[state.cur]);
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0, timedout=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a===undefined){
      if(t && t.timedOut) timedout++; else skipped++;
      continue;
    }
    if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+timedout+' timed out, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var card = document.createElement('div');
    if(a===undefined){
      if(t && t.timedOut){ card.className='r-card timedout'; card.textContent='Q'+(pos+1)+' Time'; }
      else { card.className='r-card skipped'; card.textContent='Q'+(pos+1)+' Skip'; }
    } else {
      var ok = a===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var isWrong = (a!==undefined && a!==RAW_QUESTIONS[qi].ci);
    var isTimedOut = (a===undefined && t && t.timedOut);
    if(isWrong || isTimedOut) wrong.push(qi);
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){
    delete state.answers[qi];
    state.timers[qi] = defaultTimerState();
  });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s += (t && t.timedOut) ? 'Timed Out' : 'Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    } else if(a===undefined && t && t.timedOut){
      var q2 = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q2.stem, yourAnswer: '(timed out)', correctAnswer: q2.opts[q2.ci], explanation: q2.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
</script>
