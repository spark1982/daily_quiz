<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_48_20260829_v1";var ATT_KEY = "quiz_grantgrammar_48_att_20260829_v1";var RAW_QUESTIONS = [{"stem": "ill<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["worse / worst", "iller / illest", "more ill / most ill", "badder / baddest"], "ci": 0, "exp": "ill → worse / worst (same irregular forms as 'bad')", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">The children had not finished dinner when the power went out.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Hardly the children had finished dinner when the power went out.", "Hardly had the children finished dinner when the power went out.", "Hardly did the children finish dinner when the power went out.", "Hardly had the children finished dinner that the power went out."], "ci": 1, "exp": "\"Hardly\" triggers inversion: \"Hardly + had + the children + finished...\". The conjunction must be \"when\" (not \"that\"), and the past participle \"finished\" follows past perfect \"had\". The correct form is: Hardly had the children finished dinner when the power went out.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">We had scarcely arrived at the hotel when it started to snow.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Scarcely we had arrived at the hotel when it started to snow.", "Scarcely had we arrive at the hotel when it started to snow.", "Scarcely had we arrived at the hotel when it started to snow.", "Scarcely did we arrive at the hotel when it started to snow."], "ci": 2, "exp": "\"Scarcely\" triggers inversion: \"Scarcely + had + we + arrived...\". Past perfect \"had\" is correct, and the past participle \"arrived\" follows. \"Did\" would require simple past, which changes the meaning. The correct form is: Scarcely had we arrived at the hotel when it started to snow.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>set</b>?", "opts": ["set", "setted", "seted", "sett"], "ci": 0, "exp": "The past tense of <b>set</b> is <b>set</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "I am not hungry at all because I <span style=\"text-decoration:underline;\">______</span> my lunch just now.", "opts": ["had eaten", "have eaten", "will have eaten", "was eating"], "ci": 1, "exp": "\"have eaten\" is present perfect — lunch was just finished and I feel full now.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["She is <b>singing</b> on stage right now.", "We were <b>singing</b> along to the radio.", "He will be <b>singing</b> at the wedding.", "<b>Singing</b> in the choir is fun."], "ci": 3, "exp": "In \"Singing in the choir is fun,\" \"singing\" (with \"in the choir\") is the subject of the sentence, functioning as a noun - a gerund. In the other three sentences, \"singing\" follows \"is / were / will be\" and describes an action in progress, so it is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "The train ________ at 9 o'clock this morning.", "opts": ["arrived", "has arrived"], "ci": 0, "exp": "At 9 o'clock is a specific finished time, so use simple past: arrived.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The bird is <b>singing</b> outside my window.", "<b>Singing</b> is her favorite way to relax.", "They were <b>singing</b> loudly in the car.", "The <b>singing</b> bird perched on the fence."], "ci": 3, "exp": "In \"The singing bird perched on the fence,\" \"singing\" comes directly before the noun \"bird\" and describes what the bird is doing - this adjective use of an -ing word is a present participle. In \"The bird is singing outside my window\" and \"They were singing loudly in the car,\" \"singing\" is the main verb paired with \"is / were,\" making it part of the progressive tense. In \"Singing is her favorite way to relax,\" \"singing\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["After the storm passed the children who had stayed inside rushed outside to play.", "After the storm passed, the children who had stayed inside, rushed outside to play.", "After the storm passed, the children who had stayed inside rushed outside to play.", "After the storm passed, the children, who had stayed inside rushed outside to play."], "ci": 2, "exp": "An introductory adverb clause (\"After the storm passed\") is followed by a comma. \"who had stayed inside\" is a restrictive relative clause — it identifies which children — so it should NOT be set off by commas.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>close</b> &rsaquo; Past: <b>closed</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["close", "closing", "closd", "closed"], "ci": 3, "exp": "'close' is a regular verb. Its past participle is 'closed' (base + -ed). Past perfect: had closed.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>child</b>?", "opts": ["childs", "childen", "childrens", "children"], "ci": 3, "exp": "child → children (special -ren ending)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "The teacher told us a story.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["us", "a story"], "ci": 0, "exp": "\"Us\" is the indirect object (who heard it). \"A story\" is the direct object (what was told).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "She reads a long book.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADVERBS in this sentence, and only the adverbs?</span>", "opts": ["reads", "long", "she", "None of the above"], "ci": 3, "exp": "There is no adverb in this sentence. 'Long' is an adjective modifying 'book', not a verb. The correct answer is 'None of the above'.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["I enjoy <b>running</b> every morning.", "He is <b>running</b> in the marathon this year.", "She was <b>running</b> late for school.", "They will be <b>running</b> the race together."], "ci": 0, "exp": "In \"I enjoy running every morning,\" \"running\" is the object of the verb \"enjoy\" - a noun role - which makes it a gerund. In the other three sentences, \"running\" pairs with \"is / was / will be\" to describe an action in progress, so it is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "They _____ already eaten lunch, so they are not hungry.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. The eating is complete, and the result (not being hungry) is felt in the present.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>watch</b> &rsaquo; Past: <b>watched</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["watch", "watching", "watchd", "watched"], "ci": 3, "exp": "'watch' is a regular verb. Its past participle is 'watched' (base + -ed). Past perfect: had watched.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The child is <b>crying</b> in the other room.", "The <b>crying</b> child needed comfort.", "<b>Crying</b> helps release stress.", "She was <b>crying</b> during the sad movie."], "ci": 1, "exp": "In \"The crying child needed comfort,\" \"crying\" comes directly before the noun \"child\" and describes what the child is doing - this adjective use of an -ing word is a present participle. In \"The child is crying in the other room\" and \"She was crying during the sad movie,\" \"crying\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Crying helps release stress,\" \"crying\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "She sat _____ her two best friends during the graduation ceremony so they could take photos together.", "opts": ["between", "among", "below", "beside"], "ci": 0, "exp": "\"Between\" is used when referring to a position relative to exactly two people or things. She has one friend on each side. \"Among\" is used for groups of three or more.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["James' car broke down on the highway.", "The sheeps' wool was thick and warm.", "She returned the book to it's shelf.", "Those mittens are your's to keep."], "ci": 0, "exp": "<strong>\"James'\"</strong> is an accepted possessive for names ending in <em>s</em>.<br>• <em>sheeps'</em> is wrong — <em>sheep</em> is already plural; the possessive is <em>sheep's</em>.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>your's</em> does not exist; the correct form is <em>yours</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "They are <u>have</u> dinner together.", "opts": ["having", "haveing", "havving", "haved"], "ci": 0, "exp": "have → having (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "She is <u>come</u> down the stairs.", "opts": ["coming", "comeing", "comming", "comed"], "ci": 0, "exp": "come → coming (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "well<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["better / best", "weller / wellest", "more well / most well", "gooder / goodest"], "ci": 0, "exp": "well → better / best (same irregular forms as 'good' when used as an adverb)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["After eating a big Thanksgiving dinner.", "The books on the library shelf.", "The snow fell softly through the night.", "Wishing for a snow day tomorrow."], "ci": 2, "exp": "\"The snow fell softly through the night.\" is a complete sentence — subject: 'The snow', predicate: 'fell'. The others are fragments: an 'After' phrase, a noun phrase with no verb, and a -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["While the rest of the class was reading.", "The new student answered every question.", "Excited about the upcoming field trip.", "A basket full of ripe red apples."], "ci": 1, "exp": "\"The new student answered every question.\" is a complete sentence — subject: 'The new student', predicate: 'answered'. The others are fragments: a 'While' clause, an adjective phrase, and a noun phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "He found the room empty.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["empty", "the room"], "ci": 0, "exp": "\"Empty\" is the objective complement — it describes the state of \"the room.\" \"The room\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>A spider <b>caught</b> the fly.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The fly ______ by a spider.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was caught", "were caught", "was catching", "was catch"], "ci": 0, "exp": "The new subject \"the fly\" is singular and the action is in the past, so use was + the past participle \"caught\": was caught.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "He found the room empty.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["the room", "empty"], "ci": 0, "exp": "\"The room\" is the object (what was found). \"Empty\" is the objective complement (its condition).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "Our teacher smiled at the class.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["smiled", "Our teacher", "class", "at"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "I ________ my keys. I cannot find them!", "opts": ["lost", "have lost"], "ci": 1, "exp": "The result still affects the present (cannot find them), so use present perfect: have lost.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "The rescue team searched _____ several hours without stopping until they found the missing hiker.", "opts": ["within", "for", "since", "by"], "ci": 1, "exp": "\"For\" indicates a duration of time, such as several hours. \"Since\" requires a specific starting point (e.g., since noon). \"Within\" would mean before the period ended, which changes the meaning.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "She buys <u>shoes</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Shoes\" receives the action of \"buys.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "He hates <u>bugs</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Bugs\" receives the action of \"hates.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "He _____ worked at this company since 2019.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" (has) is correct. \"Since\" signals an action that started in the past and continues to the present.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "He <u>push</u> the door open.", "opts": ["pushes", "pushs", "pushies", "pusheds"], "ci": 0, "exp": "push → pushes (ends in -sh, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The geeses' feathers floated on the lake.", "We heard the neighbors dog barking all night.", "The coach praised the team's effort.", "He left his keys in the car, but their fine."], "ci": 2, "exp": "<strong>\"team's\"</strong> correctly shows singular possessive.<br>• <em>geeses'</em> is wrong — <em>geese</em> is already plural; the possessive is <em>geese's</em>.<br>• <em>neighbors dog</em> is missing the apostrophe — should be <em>neighbor's</em>.<br>• <em>their</em> should be <em>they're</em> (they are) in that context.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "She reads a long book.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADJECTIVES in this sentence, and only the adjectives?</span>", "opts": ["long", "long, book", "reads, long", "(none of these)"], "ci": 0, "exp": "'Long' is an adjective - it describes the book.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The company <b>sells</b> cars.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>Cars ______ by the company.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["is sold", "are sold", "are selling", "are sell"], "ci": 1, "exp": "The new subject \"cars\" is plural and the action is in the present, so use are + the past participle \"sold\": are sold.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>cost</b>?", "opts": ["cost", "costed", "costen", "costt"], "ci": 0, "exp": "The past tense of <b>cost</b> is <b>cost</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "Our teacher smiled at the class.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["Our teacher", "class", "smiled", "the"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "I <span style=\"text-decoration:underline;\">______</span> my lunch long before he called me to go out.", "opts": ["had eaten", "have eaten", "will have eaten", "ate"], "ci": 0, "exp": "\"had eaten\" is past perfect — eating happened before he called.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The report on housing costs and rents were published last week.", "Neither Marcus nor his sisters was present at the meeting.", "Everyone in the two advanced classes have read that novel.", "The number of schools in this district has grown each year."], "ci": 3, "exp": "\"The number\" is singular, so \"has\" is correct. \"Report\" is singular — use \"was.\" With neither...nor, the verb matches the closer subject — \"sisters\" is plural, so use \"were.\" \"Everyone\" is singular — use \"has.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The pile of old magazines and newspapers are in the garage.", "Each player on both teams receives a trophy at the end.", "The team of engineers work on the project every weekend.", "Anyone who forgets their homework lose five points."], "ci": 1, "exp": "\"Each\" is singular, so \"receives\" is correct. \"Pile\" is singular — use \"is.\" \"Team\" is singular — use \"works.\" \"Anyone\" is singular — use \"loses.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "The teacher told us a story.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["a story", "us"], "ci": 0, "exp": "\"A story\" is the direct object (what was told). \"Us\" is the indirect object (who heard it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["expensive small gold ring", "small expensive gold ring", "gold expensive small ring", "expensive gold small ring"], "ci": 0, "exp": "Correct order: opinion (expensive) → size (small) → material (gold) → noun\n✔ expensive small gold ring", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["Its important to remember that the sun rises in the east.", "It's important to remember that the sun rises in the East.", "It's important to remember that the Sun rises in the east.", "It's important to remember that the sun rises in the east."], "ci": 3, "exp": "\"It's\" (with an apostrophe) means \"it is\" — the correct form here. \"The sun\" is not capitalized unless used as a formal astronomical name. \"East\" as a general direction is lowercase (unlike \"the East\" as a named region).", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["four old gray wolves", "gray four old wolves", "old four gray wolves", "four gray old wolves"], "ci": 0, "exp": "Correct order: number (four) → age (old) → color (gray) → noun\n✔ four old gray wolves", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "She <u>catch</u> the ball every time.", "opts": ["catches", "catchs", "catchies", "catcheds"], "ci": 0, "exp": "catch → catches (ends in -ch, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>louse</b>?", "opts": ["louses", "lice", "louses", "leese"], "ci": 1, "exp": "louse → lice (ou → i), just like mouse → mice", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
