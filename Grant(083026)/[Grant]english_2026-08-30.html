<script>var TITLE = "[Grant] English";var QUIZ_KEY = "quiz_grantenglish_25_20260829_v1";var ATT_KEY = "quiz_grantenglish_25_att_20260829_v1";var RAW_QUESTIONS = [{"stem": "What is the main idea of the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1941, a Swiss engineer named George de Mestral took his dog for a walk through the countryside near his home. When he returned, he noticed that his wool trousers and his dog's fur were covered with small, stubborn burrs from a plant called burdock. Rather than brushing the burrs away, de Mestral grew curious why they clung so tightly to fabric and fur.<br><br>He placed one burr under a microscope and found its surface covered in tiny hooks, each able to catch onto the small loops found in fabric or animal hair. This hook and loop system was strong enough to hold the burr in place, yet it could still be pulled apart without much force. De Mestral wondered whether this design could be copied to create a new fastener.<br><br>Turning the idea into a product proved far more difficult than expected. He spent years experimenting with fabrics, weaving tiny hooks on one strip and tiny loops on another so the two would grip each other the way the burr gripped fur. Many weavers doubted such a fastener could ever be made cheaply or reliably, and several early attempts fell apart after only a few uses.<br><br>The breakthrough came when de Mestral experimented with nylon, a durable synthetic fabric that could be heated and shaped without losing strength. Nylon loops held up to repeated pulling far better than natural fibers had, and de Mestral built a machine capable of weaving thousands of tiny nylon hooks at once. By 1955, he patented his invention, naming it Velcro, from the French words \"velours,\" meaning velvet, and \"crochet,\" meaning hook.<br><br>For years, Velcro struggled to attract interest outside a few specialty uses. Then, in the 1960s, NASA began using Velcro to secure equipme manufacturing, not about awareness of hook and loop systems."}, {"stem": "What effect did switching to nylon have on de Mestral's invention, according to the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1941, a Swiss engineer named George de Mestral took his dog for a walk through the countryside near his home. When he returned, he noticed that his wool trousers and his dog's fur were covered with small, stubborn burrs from a plant called burdock. Rather than brushing the burrs away, de Mestral grew curious why they clung so tightly to fabric and fur.<br><br>He placed one burr under a microscope and found its surface covered in tiny hooks, each able to catch onto the small loops found in fabric or animal hair. This hook and loop system was strong enough to hold the burr in place, yet it could still be pulled apart without much force. De Mestral wondered whether this design could be copied to create a new fastener.<br><br>Turning the idea into a product proved far more difficult than expected. He spent years experimenting with fabrics, weaving tiny hooks on one strip and tiny loops on another so the two would grip each other the way the burr gripped fur. Many weavers doubted such a fastener could ever be made cheaply or reliably, and several early attempts fell apart after only a few uses.<br><br>The breakthrough came when de Mestral experimented with nylon, a durable synthetic fabric that could be heated and shaped without losing strength. Nylon loops held up to repeated pulling far better than natural fibers had, and de Mestral built a machine capable of weaving thousands of tiny nylon hooks at once. By 1955, he patented his invention, naming it Velcro, from the French words \"velours,\" meaning velvet, and \"crochet,\" meaning hook.<br><br>For years, Velcro struggled to attract interest outside a few specialty uses. Then, in the 1960s, NASA began using Velcro to secure equipment in the weightlessness of space, since sc }
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
