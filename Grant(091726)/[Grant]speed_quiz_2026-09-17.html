<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}

.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}

.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}

.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}

.q-timer-bar{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:8px;}

.r-card.timedout{background:#fdecd2;color:#7a4c00;}
</style>

<body><div class="quiz-title">[Grant] Speed Quiz</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Answer each problem before the 40-second timer runs out. Use Pause if you need a break.</div><div id="nav-bar"><span id="nav-count">0 / 30</span><div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div><button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button></div><div id="dot-panel"></div>

</div>
<script>var TITLE = "[Grant] Speed Quiz";var QUIZ_KEY = "quiz_grantspeedquiz_30_20260917_v1";var ATT_KEY = "quiz_grantspeedquiz_30_att_20260917_v1";var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};var RAW_QUESTIONS = [{"stem": "Compute the following.<br>a) 63 x 11 =", "opts": ["673", "683", "693", "703"], "ci": 2, "exp": "63 &times; 11 = 630 + 63 = 693.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "A 3-by-3 grid of unit squares is shown below.<br><svg width=\"110\" height=\"110\" viewBox=\"0 0 110 110\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"10\" x2=\"100\" y2=\"10\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"40\" x2=\"100\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"70\" x2=\"100\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"100\" x2=\"100\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"10\" x2=\"40\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/></svg><br>How many rectangles of any size (including squares) are there altogether?", "opts": ["36", "9", "16", "30"], "ci": 0, "exp": "For a 3&times;3 grid: C(4,2) &times; C(4,2) = 6 &times; 6 = 36.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "There are 20 teams in the North Volleyball League. Each team must play exactly one match with every other team. How many matches are to be played altogether in the league?", "opts": ["200", "380", "190", "180"], "ci": 2, "exp": "Each pair of teams plays once, so the number of matches is C(20,2) = 20&times;19&divide;2 = 190.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>(c) 4 + 6 + 8 + 10 + 12 + 14", "opts": ["48", "63", "60", "54"], "ci": 3, "exp": "This is 6 terms from 4 to 14: (4+14)&times;6&divide;2 = 54.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "There are 7 points A, B, C, D, E, F, G on a line, all at different (unequal) distances from one another so that no two segments share the same length.<br><svg width=\"300\" height=\"60\" viewBox=\"0 0 300 60\" style=\"display:block;margin:10px auto;\"><line x1=\"20\" y1=\"30\" x2=\"280\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"25\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"25\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"55\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"55\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"100\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"100\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"140\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"140\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"190\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"190\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"235\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"235\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text><circle cx=\"275\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"275\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">G</text></svg><br>How many different segment lengths (line segments) can be formed altogether?", "opts": ["20", "28", "21", "14"], "ci": 2, "exp": "With 7 points all at unequal distances, the number of distinct segments is C(7,2) = 7&times;6&divide;2 = 21.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "A sailor tied 7 knots on a rope at regular intervals. The distance from the first knot to the seventh one was 18 m long. What is the distance between every two knots?", "opts": ["3.5 m", "2.57 m", "3 m", "2.5 m"], "ci": 2, "exp": "There are 6 gaps between 7 knots spanning 18 m: 18&divide;6 = 3 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>a) 24 x 25 =", "opts": ["600", "620", "500", "650"], "ci": 0, "exp": "24 &times; 25 = 24 &times; 100 &divide; 4 = 2400 &divide; 4 = 600.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Joe puts 5 matchsticks on a table. Each matchstick is 10 cm away from another. How far is the fifth matchstick away from the first one?", "opts": ["36 cm", "40 cm", "50 cm", "45 cm"], "ci": 1, "exp": "There are 4 gaps of 10 cm between the 1st and 5th matchstick: 4&times;10 = 40 cm.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>(a) 24 + 47 + 39 =", "opts": ["100", "105", "110", "120"], "ci": 2, "exp": "24 + 47 + 39 = 110.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "A grid is made of 3 columns and 2 rows of unit squares, as shown.<br><svg width=\"110\" height=\"80\" viewBox=\"0 0 110 80\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"10\" x2=\"100\" y2=\"10\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"40\" x2=\"100\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"70\" x2=\"100\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"10\" x2=\"40\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/></svg><br>How many squares of any size are there altogether?", "opts": ["8", "6", "9", "7"], "ci": 0, "exp": "In a 3-by-2 grid: six 1&times;1 squares plus two 2&times;2 squares = 8 squares total.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?", "opts": ["99", "101", "102", "100"], "ci": 1, "exp": "500&divide;5 = 100 gaps, and planting at both ends adds 1 tree: 100+1 = 101 trees.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following series.<br>(b) 6 + 7 + 8 + 9 + 10 + 11", "opts": ["51", "45", "48", "57"], "ci": 0, "exp": "This is 6 consecutive terms from 6 to 11: (6+11)&times;6&divide;2 = 51.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>(c) 738 - (238 + 162) =", "opts": ["328", "358", "348", "338"], "ci": 3, "exp": "238 + 162 = 400, so 738 &minus; 400 = 338.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following series.<br>(d) 1 + 3 + 5 + 7 + 9 + 11", "opts": ["36", "42", "30", "33"], "ci": 0, "exp": "This is 6 terms from 1 to 11: (1+11)&times;6&divide;2 = 36.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "From the top vertex of a triangle, 3 line segments (cevians) are drawn to the opposite side, dividing the triangle into 4 smaller regions, as shown.<br><svg width=\"200\" height=\"150\" viewBox=\"0 0 200 150\" style=\"display:block;margin:10px auto;\"><polygon points=\"100,15 25,135 175,135\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"15\" x2=\"62.5\" y2=\"135\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"15\" x2=\"100.0\" y2=\"135\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"15\" x2=\"137.5\" y2=\"135\" stroke=\"#333\" stroke-width=\"1.5\"/></svg><br>How many triangles of any size are there altogether in the figure?", "opts": ["10", "4", "6", "15"], "ci": 0, "exp": "3 cevians create 4 regions (k=3): (k+1)(k+2)&divide;2 = 4&times;5&divide;2 = 10.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>c) 36 x 25 =", "opts": ["850", "900", "890", "950"], "ci": 1, "exp": "36 &times; 25 = 36 &times; 100 &divide; 4 = 3600 &divide; 4 = 900.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>a) 33 x 101 =", "opts": ["3330", "3333", "3033", "3303"], "ci": 1, "exp": "33 &times; 101 = 3300 + 33 = 3333.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>(a) 284 + 118 =", "opts": ["392", "402", "412", "398"], "ci": 1, "exp": "284 + 118 = 402.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "A 1-row by 7-column strip of unit squares is shown below.<br><svg width=\"174\" height=\"42\" viewBox=\"0 0 174 42\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"10\" x2=\"164\" y2=\"10\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"32\" x2=\"164\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"10\" x2=\"10\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"32\" y1=\"10\" x2=\"32\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"54\" y1=\"10\" x2=\"54\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"76\" y1=\"10\" x2=\"76\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"98\" y1=\"10\" x2=\"98\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"120\" y1=\"10\" x2=\"120\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"142\" y1=\"10\" x2=\"142\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"164\" y1=\"10\" x2=\"164\" y2=\"32\" stroke=\"#333\" stroke-width=\"1.5\"/></svg><br>How many rectangles of any size are there altogether?", "opts": ["35", "28", "14", "21"], "ci": 1, "exp": "For a 1-by-7 strip: C(8,2) &times; C(2,2) = 28 &times; 1 = 28.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?", "opts": ["100", "95", "105", "90"], "ci": 1, "exp": "The weekly amounts are 5,6,7,...,14 (10 terms): (5+14)&times;10&divide;2 = 95.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>(a) 438 - 132 - 206 =", "opts": ["110", "120", "90", "100"], "ci": 3, "exp": "438 &minus; 132 &minus; 206 = 438 &minus; 338 = 100.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>a) 44 x 25 =", "opts": ["1050", "1100", "1150", "1000"], "ci": 1, "exp": "44 &times; 25 = 44 &times; 100 &divide; 4 = 4400 &divide; 4 = 1100.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "There are 5 points A, B, C, D, E on a line, all at different (unequal) distances from one another so that no two segments share the same length.<br><svg width=\"300\" height=\"60\" viewBox=\"0 0 300 60\" style=\"display:block;margin:10px auto;\"><line x1=\"20\" y1=\"30\" x2=\"280\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"30\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"90\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"90\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"140\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"140\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"220\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"220\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"270\" cy=\"30\" r=\"4\" fill=\"#185FA5\"/><text x=\"270\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text></svg><br>How many different segment lengths (line segments) can be formed altogether?", "opts": ["20", "8", "9", "10"], "ci": 3, "exp": "With 5 points all at unequal distances, the number of distinct segments is C(5,2) = 5&times;4&divide;2 = 10.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following series.<br>(a) 2 + 3 + 4 + 5 + 6 + 7 + 8", "opts": ["35", "42", "28", "49"], "ci": 0, "exp": "This is 7 consecutive terms from 2 to 8: (2+8)&times;7&divide;2 = 35.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>c) 64 x 125 =", "opts": ["8000", "8200", "7800", "7500"], "ci": 0, "exp": "64 &times; 125 = 64 &times; 1000 &divide; 8 = 64000 &divide; 8 = 8000.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "It takes John 8 minutes to saw a log into 3 equal lengths. How long does it take for him to saw the same log into 9 equal lengths?", "opts": ["36 minutes", "32 minutes", "24 minutes", "28 minutes"], "ci": 1, "exp": "Cutting into 3 lengths needs 2 cuts (8 min &divide; 2 = 4 min/cut). Cutting into 9 lengths needs 8 cuts: 8&times;4 = 32 minutes.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?", "opts": ["125 m", "130 m", "120 m", "100 m"], "ci": 2, "exp": "25 trees create 24 gaps of 5 m each: 24&times;5 = 120 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>(a) 22 + 78 =", "opts": ["90", "98", "110", "100"], "ci": 3, "exp": "22 + 78 = 100 (make a friendly ten).", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>(d) 54 + 46 =", "opts": ["96", "110", "100", "90"], "ci": 2, "exp": "54 + 46 = 100 (make a friendly ten).", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "David uses some coins to form a triangle. There is a coin at every corner. How many coins does he use if there are 6 coins on each side of the triangle?", "opts": ["15", "12", "16", "18"], "ci": 0, "exp": "Each side has 6 coins but corners are shared, so total = 3&times;(6&minus;1) = 15.", "tag": "Intervals", "tagcolor": "#1D9E75"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + "_order_v1";
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
var Q_TIME = 40;

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<N;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultTimerState(){ return { remainingAtStart: Q_TIME, startedAt: null, running: false, timedOut: false }; }
function defaultState(){
  var timers = {};
  for(var i=0;i<N;i++) timers[i] = defaultTimerState();
  return { cur:0, answers:{}, timers: timers, showResults:false };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.timers !== 'object' || s.timers===null) s.timers = {};
    for(var i=0;i<N;i++){ if(!s.timers[i]) s.timers[i] = defaultTimerState(); }
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var tickInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0, timedout=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      var a = state.answers[qi];
      var t = state.timers[qi];
      if(a===undefined){
        if(t && t.timedOut) timedout++; else skipped++;
        continue;
      }
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, timedOut: timedout, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function getRemaining(qi){
  var t = state.timers[qi];
  if(!t) return Q_TIME;
  if(t.running && t.startedAt){
    var elapsed = (Date.now()-t.startedAt)/1000;
    return Math.max(0, t.remainingAtStart - elapsed);
  }
  return t.remainingAtStart;
}
function freezeTimer(qi){
  var t = state.timers[qi];
  if(t && t.running){
    t.remainingAtStart = getRemaining(qi);
    t.running = false;
    t.startedAt = null;
  }
}
function startTimerFor(qi){
  var t = state.timers[qi];
  if(!t) { t = defaultTimerState(); state.timers[qi] = t; }
  if(t.timedOut) return;
  if(state.answers[qi] !== undefined) return;
  if(!t.running){
    t.startedAt = Date.now();
    t.running = true;
  }
}
function stopTickInterval(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }
function startTickInterval(){ stopTickInterval(); tickInterval = setInterval(tickRender, 250); }

function tickRender(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var disp = document.getElementById('qTimerDisplay');
  var pauseBtn = document.getElementById('pauseBtn');
  if(!t) return;
  var remaining = getRemaining(qi);
  disp.classList.remove('warn','danger');
  if(remaining <= 0){
    if(t.running){
      t.running = false;
      t.startedAt = null;
      t.remainingAtStart = 0;
      t.timedOut = true;
      saveState();
      renderOptionsLockState();
    }
    disp.textContent = "0:00";
    disp.classList.add('danger');
    document.getElementById('timeout-box').style.display = (state.answers[qi]===undefined) ? 'block' : 'none';
    pauseBtn.disabled = true;
    return;
  }
  pauseBtn.disabled = false;
  disp.textContent = formatTime(remaining);
  if(remaining <= Q_TIME*0.1) disp.classList.add('danger');
  else if(remaining <= Q_TIME*0.25) disp.classList.add('warn');
  pauseBtn.textContent = t.running ? 'Pause' : 'Resume';
}

function renderOptionsLockState(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var answered = state.answers[qi];
  var btns = document.querySelectorAll('#options .opt-btn');
  btns.forEach(function(btn){
    if(answered !== undefined || (t && t.timedOut)) btn.disabled = true;
  });
}

function togglePause(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(!t || t.timedOut || state.answers[qi]!==undefined) return;
  if(t.running){ freezeTimer(qi); }
  else { startTimerFor(qi); }
  saveState();
  tickRender();
}
window.togglePause = togglePause;

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  var timerBar = document.querySelector('.q-timer-bar');
  if(state.showResults){
    qa.style.display='none';
    timerBar.style.display='none';
    rs.classList.add('show');
    stopTickInterval();
    renderResults();
    return;
  }
  qa.style.display='block';
  timerBar.style.display='flex';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  badge.textContent = q.tag;
  badge.style.background = TAG_COLORS[q.tag] || '#185FA5';

  document.getElementById('q-text').innerHTML = q.stem;

  startTimerFor(qi);

  var answered = state.answers[qi];
  var t = state.timers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = (answered !== undefined) || (t && t.timedOut);
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var timeoutBox = document.getElementById('timeout-box');
  timeoutBox.style.display = (t && t.timedOut && answered===undefined) ? 'block' : 'none';

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
  tickRender();
  startTickInterval();
}

function updateNav(){
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi = order[k];
    if(state.answers[qi]!==undefined || (state.timers[qi] && state.timers[qi].timedOut)) done++;
  }
  document.getElementById('nav-count').textContent = done + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (done/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg;
    if(state.answers[qi]===undefined){
      bg = (state.timers[qi] && state.timers[qi].timedOut) ? '#f5a623' : '#d7dde6';
    } else {
      bg = state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A';
    }
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi2 = order[k];
    if(state.answers[qi2]!==undefined || (state.timers[qi2] && state.timers[qi2].timedOut)) done++;
  }
  if(done===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  freezeTimer(order[state.cur]);
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  freezeTimer(order[state.cur]);
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(state.answers[qi] !== undefined) return;
  if(t && t.timedOut) return;
  state.answers[qi] = idx;
  freezeTimer(qi);
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ freezeTimer(order[state.cur]); state.cur--; saveState(); render(); }
}
function goNext(){
  freezeTimer(order[state.cur]);
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0, timedout=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a===undefined){
      if(t && t.timedOut) timedout++; else skipped++;
      continue;
    }
    if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+timedout+' timed out, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var card = document.createElement('div');
    if(a===undefined){
      if(t && t.timedOut){ card.className='r-card timedout'; card.textContent='Q'+(pos+1)+' Time'; }
      else { card.className='r-card skipped'; card.textContent='Q'+(pos+1)+' Skip'; }
    } else {
      var ok = a===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var isWrong = (a!==undefined && a!==RAW_QUESTIONS[qi].ci);
    var isTimedOut = (a===undefined && t && t.timedOut);
    if(isWrong || isTimedOut) wrong.push(qi);
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){
    delete state.answers[qi];
    state.timers[qi] = defaultTimerState();
  });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s += (t && t.timedOut) ? 'Timed Out' : 'Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    } else if(a===undefined && t && t.timedOut){
      var q2 = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q2.stem, yourAnswer: '(timed out)', correctAnswer: q2.opts[q2.ci], explanation: q2.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
</script>
