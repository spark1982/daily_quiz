(function(){
var CFG = {"date": "20261124", "quizzes": [{"key": "grantmathcomp_14", "label": "Math Competition", "limit": 4}, {"key": "quiz_grantspeedquiz_30_20261124_v1", "label": "Speed Quiz", "limit": 4}, {"key": "grantgrammar_edit_20", "label": "Grammar", "limit": 2}, {"key": "grantmentor_tag", "label": "Mentor Sentence", "pct": 85}, {"key": "grantvocab_20", "label": "Advanced Vocabulary", "limit": 5}]};

<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261124";
var RAW_QUESTIONS = [{"passage": "<strong>Fall Garden Cleanup Day</strong><br><b>(1)</b> Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7. <b>(2)</b> Students and parents <u>should</u> bring gloves and a rake if they have them. <b>(3)</b> Each of the volunteers is going to get a free pumpkin muffin. <b>(4)</b> The tools for the job is waiting in the shed behind the gym. <b>(5)</b> We will pull weeds. <b>(6)</b> The weeds grow along the fence. <b>(7)</b> The garden will look <u>beautifuller</u> than ever by lunchtime!", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which sentence has an error?", "opts": ["Each of the volunteers is going to get a free pumpkin muffin.", "The tools for the job is waiting in the shed behind the gym.", "Students and parents should bring gloves and a rake if they have them.", "Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7."], "ci": 1, "exp": "The subject is <i>tools</i> (plural), not <i>job</i>, so use <i>are</i>: <i>The tools for the job <b>are</b> waiting in the shed behind the gym.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>Library LEGO Challenge</strong><br><b>(1)</b> Calling all builders in grades 3 to 5 who love to create! <b>(2)</b> The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7. <b>(3)</b> To get ideas, read the book <u>“build it big”</u> at the front desk. <b>(4)</b> This is the most biggest contest the library has ever held. <b>(5)</b> Bring <u>your</u> own snack and water bottle, and we will supply the bricks. <b>(6)</b> Kids can work alone. <b>(7)</b> They can work with a partner.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which sentence has an error?", "opts": ["Calling all builders in grades 3 to 5 who love to create!", "The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7.", "Bring your own snack and water bottle.", "This is the most biggest contest the library has ever held."], "ci": 3, "exp": "Never use <i>most</i> with an <i>-est</i> word. Use just one: <i>This is the <b>biggest</b> contest the library has ever held.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"passage": "<strong>How Sea Otters Use Tools</strong><br><b>(1)</b> Sea otters are among the few animals that use tools. <b>(2)</b> An otter floats on its back in the water and smashes clams against a flat rock that it keeps on its chest. <b>(3)</b> Otters also eat sea urchins. <b>(4)</b> Sea urchins damage the giant kelp forests along the coast. <b>(5)</b> At night, a group of otters <u>float</u> together near the shore. <b>(6)</b> They rest in a kelp bed, <u>where</u> long leaves keep them from drifting away. <b>(7)</b> <u>Especially during storms.</u>", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>What is the best way to combine sentences 3 and 4?", "opts": ["Otters also eat sea urchins, they damage the giant kelp forests along the coast.", "Otters also eat sea urchins which, damage the giant kelp forests along the coast.", "Otters also eat sea urchins, who damage the giant kelp forests along the coast.", "Otters also eat sea urchins, which damage the giant kelp forests along the coast."], "ci": 3, "exp": "Use <i>which</i> for animals and things (not <i>who</i>), with the comma before it: <i>Otters also eat sea urchins, <b>which</b> damage the giant kelp forests along the coast.</i> Joining with only a comma and <i>they</i> makes a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>What is the correct way to write the underlined part in sentence 2?", "opts": ["has been", "are", "was", "NO CHANGE"], "ci": 1, "exp": "The subject is <i>wings</i> (plural), not <i>monarch</i>. The phrase <i>of a monarch</i> just describes the wings, so the verb must be plural: <i>The bright wings of a monarch <b>are</b> orange with thin black lines.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>How Monarch Butterflies Travel</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> The bright wings of a monarch <u>is</u> orange with thin black lines. <b>(3)</b> The butterflies fly south to the mountains of central Mexico. <b>(4)</b> Because the northern winter would kill them. <b>(5)</b> There long trip can cover almost 3,000 miles. <b>(6)</b> Monarchs glide on warm air currents, so they can fly <u>farther</u> than you might expect for such small insects. <b>(7)</b> In spring, their children and grandchildren slowly make the trip back north."}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>What is the correct way to write the underlined part in sentence 2?", "opts": ["“Can I knead the dough?”, Noah asked.", "NO CHANGE", "“Can I knead the dough,” Noah asked?", "“Can I knead the dough?” Noah asked."], "ci": 3, "exp": "The question mark belongs to the spoken words, so it goes <b>inside</b> the closing quotation mark, and no extra comma is needed after it: <i>“Can I knead the dough<b>?”</b> Noah asked.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>The First Loaf</strong><br><b>(1)</b> On Sunday morning, Noah helped Grandma bake bread for the first time. <b>(2)</b> <u>“Can I knead the dough”? Noah asked.</u> <b>(3)</b> Grandma smiled and <u>hands</u> him the big wooden bowl. <b>(4)</b> Noah pushed and folded the sticky dough for ten minutes. <b>(5)</b> Later, Grandma showed his sister and he how to shape the loaves. <b>(6)</b> “We <u>should of</u> let it rise longer,” Grandma said with a laugh when the first loaf came out flat. <b>(7)</b> The second loaf was tall, golden, and perfect."}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["are searching", "will search", "NO CHANGE", "searched"], "ci": 3, "exp": "The story happened <i>last Thursday</i>, and the other sentences use past tense (<i>looked</i>, <i>found</i>). Keep it in the past: <i>Maya and I <b>searched</b> the whole house.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>The Missing Library Book</strong><br><b>(1)</b> Last Thursday, my sister Maya and I <u>search</u> the whole house for her library book. <b>(2)</b> We looked under the couch, behind the bookshelf, and inside the toy box. <b>(3)</b> Maya said she <u>had never lose</u> a book before. <b>(4)</b> Finally, Dad found it on the back seat of <u>his</u> car. <b>(5)</b> The book had slid under <u>Mayas</u> soccer bag. <b>(6)</b> Maya hugged the book and promised to keep it on her desk from now on."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["had never lossed", "had never lost", "has never losed", "NO CHANGE"], "ci": 1, "exp": "After <i>had</i>, use the past participle. The past participle of <i>lose</i> is <i>lost</i>: <i>She <b>had never lost</b> a book before.</i> (<i>Losed</i> and <i>lossed var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();

window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
