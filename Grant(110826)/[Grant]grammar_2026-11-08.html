<b>(5)</b> In a good summer, a strong hive works real hard and makes more honey than it needs. <b>(6)</b> Beekeepers take only the extra honey and leave the rest for winter."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "can't", "could of", "could"], "ci": 3, "exp": "The sentence tells what Mr. Ortiz <i>said</i> in the past, so <i>can</i> changes to <i>could</i>: <i>Mr. Ortiz said I <b>could</b> jump in the last pile.</i> (<i>Could of</i> is never correct; the words are <i>could have</i>.)", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>My Leaf-Raking Journal</strong><br><b>(1)</b> On Saturday, I helped my neighbor, Mr. Ortiz, rake the leaves in his yard. <b>(2)</b> By noon, we <u>had took</u> twelve bags to the curb. <b>(3)</b> Mr. Ortiz said I <u>can</u> jump in the last pile before we bagged it. <b>(4)</b> Me and him laughed when the crunchy leaves stuck in my hair. <b>(5)</b> My arms were sore. <b>(6)</b> I felt proud of our work. <b>(7)</b> Next weekend, we will rake his big front yard together."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "himself", "he", "his"], "ci": 0, "exp": "It is already correct. After the word <i>to</i>, use an object pronoun: <i>handed the box to <b>him</b></i>.", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>The Volcano That Wouldn't Erupt</strong><br><b>(1)</b> Lucy and her brother Sam built a clay volcano for the science fair. <b>(2)</b> On the big day, Lucy poured vinegar into the top, but nothing <u>happens</u>. <b>(3)</b> &ldquo;We forgot the baking soda&rdquo; Sam whispered. <b>(4)</b> Lucy quickly handed the box to <u>him</u>, and he shook some into the volcano. <b>(5)</b> Suddenly, red foam bubbled over the sides. <b>(6)</b> <u>Spilling onto the table and the judge's shoes.</u> <b>(7)</b> Luckily, the judge laughed and gave them a blue ribbon anyway."}, {"stem": "Which sentence has an error?", "opts": ["The tools for the job is waiting in the shed behind the gym.", "Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7.", "Students and parents should bring gloves and a rake if they have them.", "Each of the volunteers is going to get a free pumpkin muffin."], "ci": 0, "exp": "The subject is <i>tools</i> (plural), not <i>job</i>, so use <i>are</i>: <i>The tools for the job <b>are</b> waiting in the shed behind the gym.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Fall Garden Cleanup Day</strong><br><b>(1)</b> Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7. <b>(2)</b> Students and parents <u>should</u> bring gloves and a rake if they have them. <b>(3)</b> Each of the volunteers is going to get a free pumpkin muffin. <b>(4)</b> The tools for the job is waiting in the shed behind the gym. <b>(5)</b> We will pull weeds. <b>(6)</b> The weeds grow along the fence. <b>(7)</b> The garden will look <u>beautifuller</u> than ever by lunchtime!"}, {"stem": "We ________ that film at the cinema last March.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5", "opts": ["had watched", "have been watching", "watched", "have watched"], "ci": 2, "exp": "Last March is a specific finished time, so use simple past: watched."}, {"stem": "Which sentence has an error?", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The Night the Lights Went Out</strong><br><b>(1)</b> When thunder crashed every light in the house went dark. <b>(2)</b> “Mom, where are the flashlights?” Mia asked. <b>(3)</b> “They’re in the kitchen drawer,” Mom answered, “next to the batteries.” <b>(4)</b> “I’ll get them” said Mia. <b>(5)</b> Mia found them quickly, and her brother said she did a <u>good</u> job. <b>(6)</b> Then Dad read us a chapter of <i>Charlotte’s web</i> by flashlight while rain drummed on the roof. <b>(7)</b> “That was the best blackout ever!” Leo said, smiling.", "opts": ["Then Dad read us a chapter of <i>Charlotte’s web</i> by flashlight while rain drummed on the roof.", "“They’re in the kitchen drawer,” Mom answered, “next to the batteries.”", "“Mom, where are the flashlights?” Mia asked.", "“That was the best blackout ever!” Leo said, smiling."], "ci": 0, "exp": "In a book title, capitalize the important words: <i><b>Charlotte’s Web</b></i>."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>The Runaway Kite</strong><br><b>(1)</b> On a windy afternoon, Lily and her cousins took a red kite to Prairie Hill. <b>(2)</b> Neither Lily nor her cousins <u>was</u> ready for how hard the wind pulled. <b>(3)</b> The kite flew higher and higher. <b>(4)</b> Until the string snapped. <b>(5)</b> “Look up there” Lily cried as it drifted toward the pond. <b>(6)</b> Luckily, it landed in a short tree by the shore. <b>(7)</b> “We <u>could of</u> lost it forever,” her cousin Max said with a laugh.", "opts": ["were", "is", "has been", "NO CHANGE"], "ci": 0, "exp": "With <i>neither … nor</i>, the verb matches the subject closer to it. <i>Cousins</i> is plural, so: <i>Neither Lily nor her cousins <b>were</b> ready.</i>"}, {"stem": "What is the best way to combine sentences 4 and 5?", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Email to Aunt Mei</strong><br><b>(1)</b> Dear Aunt Mei, I joined the robotics club at school this fall. <b>(2)</b> So far our team <u>has builded</u> a small robot that can follow a black line. <b>(3)</b> The box of spare parts <u>sit</u> on a shelf in our classroom. <b>(4)</b> Ms. Ortiz is our coach. <b>(5)</b> She used to work at a car factory. <b>(6)</b> Next month we <u>might</u> enter a contest in Wichita. <b>(7)</b> I will send you a video of our robot soon!", "opts": ["Ms. Ortiz, which used to work at a car factory, is our coach.", "Ms. Ortiz is our coach, she used to work at a car factory.", "Ms. Ortiz, who used to work at a car factory, is our coach.", "Ms. Ortiz, whose used to work at a car factory, is our coach."], "ci": 2, "exp": "Use <i>who</i> for a person: <i>Ms. Ortiz, <b>who</b> used to work at a car factory, is our coach.</i> <i>Which</i> is for things, and a comma alone cannot join two sentences."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday I took my first pottery class at the community center. <b>(2)</b> Our teacher, Ms. Alvarez, <u>has taught</u> pottery for twenty years. <b>(3)</b> First she showed us how to center the clay on a spinning wheel. <b>(4)</b> My bowl came out lopsided, but it looked <u>real</u> nice after I painted it blue. <b>(5)</b> Ms. Alvarez baked the bowl in a hot oven called a kiln so <u>it’s</u> glaze would turn shiny. <b>(6)</b> I can’t wait to show it to you at Thanksgiving!", "opts": ["its’", "its", "it is", "NO CHANGE"], "ci": 1, "exp": "<i>Its</i> (no apostrophe) shows ownership; <i>it’s</i> means <i>it is</i>. The glaze belongs to the bowl: <i>so <b>its</b> glaze would turn shiny.</i>"}, {"stem": "What is the best way to combine sentences 2 and 3?", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Picture Day Notice</strong><br><b>(1)</b> School Picture Day is Thursday, November 5, in the gym. <b>(2)</b> Students should wear their brightest smiles. <b>(3)</b> They should bring a comb. <b>(4)</b> Mr. Bell, <u>who</u> takes our school photos every year, will set up his camera at 8:00. <b>(5)</b> If you want a retake, you can talk to Mrs. Ford or I in the front office. <b>(6)</b> Picture packets will be sent home <u>quick</u>, usually within three weeks. <b>(7)</b> Please return the order form to your teacher by Monday.", "opts": ["Students should wear their brightest smiles or bring a comb.", "Students should wear their brightest smiles, bring a comb.", "Students should wear their brightest smiles, they should bring a comb.", "Students should wear their brightest smiles and bring a comb."], "ci": 3, "exp": "Both sentences tell what students should do, so join the two actions with <i>and</i>: <i>Students should wear their brightest smiles <b>and</b> bring a comb.</i> <i>Or</i> would mean they only need to do one."}, {"stem": "Which sentence has an error?", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Library LEGO Challenge</strong><br><b>(1)</b> Calling all builders in grades 3 to 5 who love to create! <b>(2)</b> The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7. <b>(3)</b> To get ideas, read the book <u>“build it big”</u> at the front desk. <b>(4)</b> This is the most biggest contest the library has ever held. <b>(5)</b> Bring <u>your</u> own snack and water bottle, and we will supply the bricks. <b>(6)</b> Kids can work alone. <b>(7)</b> They can work with a partner.", "opts": ["Calling all builders in grades 3 to 5 who love to create!", "Bring your own snack and water bottle.", "The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7.", "This is the most biggest contest the library has ever held."], "ci": 3, "exp": "Never use <i>most</i> with an <i>-est</i> word. Use just one: <i>This is the <b>biggest</b> contest the library has ever held.</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Letter to Mrs. Patel</strong><br><b>(1)</b> My family moved to Denver in August, and I really miss your class at Lincoln Elementary. <b>(2)</b> Last week we <u>have went</u> to the mountains for the first time. <b>(3)</b> By the time we got home, we <u>had finished</u> three whole bags of trail mix! <b>(4)</b> <u>My sister and me</u> are also learning to ski this winter. <b>(5)</b> My new school is big. <b>(6)</b> It has a climbing wall in the gym. <b>(7)</b> Please say hello to the class for me.", "opts": ["went", "has went", "NO CHANGE", "have gone"], "ci": 0, "exp": "&ldquo;Last week&rdquo; names a finished time, so use the simple past, not <i>have</i>: <i>Last week we <b>went</b> to the mountains.</i> (<i>Have went</i> is never correct, and <i>have gone</i> does not go with &ldquo;last week.&rdquo;)"}, {"stem": "What is the best way to combine sentences 3 and 4?", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: Life in a Tide Pool</strong><br><b>(1)</b> A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide. <b>(2)</b> The animals in a tide pool <u>has</u> to survive big changes every day. <b>(3)</b> Hermit crabs live in tide pools. <b>(4)</b> Hermit crabs borrow empty shells from snails. <b>(5)</b> When the tide comes back in, fresh seawater <u>washed</u> over the pool and brings new food. <b>(6)</b> Visitors should never pull a sea star off a rock because its tube feet can tear. <b>(7)</b> Many visitors say they could of stayed for hours watching the crabs.", "opts": ["Hermit crabs, who’s borrow empty shells from snails, live in tide pools.", "Hermit crabs, which borrow empty shells from snails, live in tide pools.", "Hermit crabs live in tide pools, which borrow empty shells from snails.", "Hermit crabs live in tide pools, they borrow empty shells from snails."], "ci": 1, "exp": "Use <i>which</i> right after the noun it describes: <i>Hermit crabs<b>, which</b> borrow empty shells from snails<b>,</b> live in tide pools.</i> Putting <i>which</i> after <i>tide pools</i> makes it sound like the tide pools borrow shells."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage rect — it only sounds like <i>could’ve</i>. Write <i>could have</i>: <i>they <b>could have</b> stayed for hours.</i>"}, {"stem": "Which sentence contains an error in grammar or punctuation?", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Band Diary</strong><br><b>(1)</b> Yesterday I <u>have played</u> the trumpet in band class for the first time. <b>(2)</b> Mr. Hall showed us how to press our lips together and buzz. <b>(3)</b> At first, my trumpet <u>sounds</u> like an angry goose. <b>(4)</b> Mr. Hall said we <u>should</u> practice for twenty minutes every day. <b>(5)</b> Because my little brother covers his ears whenever I play. <b>(6)</b> Maybe I will practice in the garage instead. <b>(7)</b> Next week we get to learn a real song!", "opts": ["Because my little brother covers his ears whenever I play.", "Mr. Hall showed us how to press our lips together and buzz.", "Next week we get to learn a real song!", "Maybe I will practice in the garage instead."], "ci": 0, "exp": "A group of words that starts with <i>because</i> cannot stand alone — it is a fragment. Join it to a complete sentence: <i>Maybe I will practice in the garage <b>because</b> my little brother covers his ears.</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>The Robot Kit</strong><br><b>(1)</b> On Saturday, Nora and her grandpa opened a robot kit on the kitchen table. <b>(2)</b> The box of tiny screws and wires <u>was</u> heavier than Nora expected. <b>(3)</b> \"Where do we start\"? Nora asked. <b>(4)</b> Grandpa pointed to the instruction book and said, \"Page one, of course.\" <b>(5)</b> They worked for two hours and the robot finally rolled across the floor. <b>(6)</b> Grandpa smiled at Nora. <b>(7)</b> Grandpa had once built robots for a car factory.", "opts": ["have been", "were", "NO CHANGE", "are"], "ci": 2, "exp": "The subject is <i>box</i> (one box), layers on my team is getting faster every week. <b>(5)</b> Last weekend we won our first tournament game 3 to 1 against the Tigers. <b>(6)</b> Yes I scored the second goal with a header!<br>Love, Leo"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["real carefully", "really careful", "NO CHANGE", "really carefully"], "ci": 3, "exp": "To describe how someone does an action, use adverbs: <i>carefully</i> (not <i>careful</i>) and <i>really</i> (not <i>real</i>). <i>I rolled each piece of dough <b>really carefully</b>.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Pretzel Day</strong><br><b>(1)</b> Yesterday Dad and I <u>make</u> soft pretzels for the first time. <b>(2)</b> First, we mixed flour, yeast, and warm water in Dad's biggest bowl. <b>(3)</b> I rolled each piece of dough <u>real careful</u> into a long rope. <b>(4)</b> Then we twisted the ropes into pretzel shapes and sprinkled salt on top. <b>(5)</b> After they baked for fifteen minutes the pretzels were golden brown. <b>(6)</b> The kitchen smelled so good that our dog wagged it's tail by the oven door. <b>(7)</b> Next weekend we're going to make cinnamon ones."}, {"stem": "Which sentence contains an error?", "opts": ["Next weekend we're going to make cinnamon ones.", "The kitchen smelled so good that our dog wagged it's tail by the oven door.", "First, we mixed flour, yeast, and warm water in Dad's biggest bowl.", "Then we twisted the ropes into pretzel shapes and sprinkled salt on top."], "ci": 1, "exp": "<i>It's</i> means <i>it is</i>. To show that something belongs to <i>it</i>, use <i>its</i> with no apostrophe: <i>our dog wagged <b>its</b> tail.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Pretzel Day</strong><br><b>(1)</b> Yesterday Dad and I <u>make</u> soft pretzels for the first time. <b>(2)</b> First, we mixed flour, yeast, and warm water in Dad's biggest bowl. <b>(3)</b> I rolled each piece nce fair was last Friday, and I have wanted to tell you about it ever since.", "Each of the five brands were tested three times.", "The judges gave me a blue ribbon for careful measuring."], "ci": 2, "exp": "With <i>each</i>, use a singular verb, even when “of the five brands” comes in between: <i>Each of the five brands <b>was</b> tested three times.</i>", "passage": "<strong>A Letter to Aunt Rosa</strong><br>Dear Aunt Rosa,<br><b>(1)</b> Our school science fair was last Friday, and I <u>have wanted</u> to tell you about it ever since. <b>(2)</b> My project tested which brand of paper towel soaks up the most water. <b>(3)</b> Each of the five brands were tested three times. <b>(4)</b> First I measured the water, and then I <u>dip</u> each towel into a cup for ten seconds. <b>(5)</b> The judges gave me a blue ribbon for careful measuring. <b>(6)</b> Yes I already hung the ribbon above my desk!<br>Love, Nina", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["that", "whom", "where", "NO CHANGE"], "ci": 0, "exp": "The word must be the subject of “must eat,” and it refers to birds, so use <i>that</i>: <i>tiny birds <b>that</b> must eat almost all day long.</i> <i>Whose</i> shows ownership and needs a noun after it (whose wings).", "passage": "<strong>How Hummingbirds Survive Cold Nights</strong><br><b>(1)</b> Hummingbirds are tiny birds <u>whose</u> must eat almost all day long. <b>(2)</b> Their hearts can beat more than a thousand times a minute. <b>(3)</b> A hummingbird burns energy <u>real</u> fast, so it could starve during a long, cold night. <b>(4)</b> To stay alive, the bird slips into a deep sleep called torpor. <b>(5)</b> Its body temperature drops. <b>(6)</b> Its heartbeat slows down. <b>(7)</b> In the morning, the bird warms up and flies off to find <u>it's</u> breakfast.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"stem": "What is the correc n was too hot. <b>(7)</b> We <u>should of</u> turned the heat down sooner.", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["We burned the first pancake because the pan was too hot.", "Because we burned the first pancake, the pan was too hot.", "We burned the first pancake. Because, the pan was too hot.", "We burned the first pancake, the pan was too hot."], "ci": 0, "exp": "Sentence 6 is a fragment; it can't stand alone. Attach it to the sentence it explains: <i>We burned the first pancake <b>because</b> the pan was too hot.</i> Putting <i>because</i> before “we burned” flips the cause and the effect.", "passage": "<strong>My Journal: Birthday Pancakes</strong><br><b>(1)</b> Early this morning my little sister June and I made a stack of pancakes for Mom's birthday. <b>(2)</b> We had never <u>cooked</u> breakfast by ourselves before. <b>(3)</b> June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl. <b>(4)</b> Mom said the pancakes were the best that her and Dad had ever tasted. <b>(5)</b> We burned the first pancake. <b>(6)</b> Because the pan was too hot. <b>(7)</b> We <u>should of</u> turned the heat down sooner.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["should of had", "NO CHANGE", "should have", "should had"], "ci": 2, "exp": "“Should of” is a mistake that comes from how “should’ve” sounds. Write <i>should have</i>: <i>We <b>should have</b> turned the heat down sooner.</i>", "passage": "<strong>My Journal: Birthday Pancakes</strong><br><b>(1)</b> Early this morning my little sister June and I made a stack of pancakes for Mom's birthday. <b>(2)</b> We had never <u>cooked</u> breakfast by ourselves before. <b>(3)</b> June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl. <b>(4)</b> Mom said the pancakes were the best that he var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
