<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer. This week's review — questions you missed recently.";
var TODAY_STR = "20261108";
var RAW_QUESTIONS = [{"stem": "Which of these events happened first?", "opts": ["A dust storm carried dust to ships in the Atlantic Ocean.", "The rains returned to the Great Plains.", "The Soil Conservation Service was created.", "Black Sunday darkened the sky over the plains."], "ci": 0, "exp": "The passage says that &ldquo;in 1934, one storm carried dust all the way to the East Coast.&rdquo; Black Sunday came later, on April 14, 1935, even though the passage mentions it right after.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Dust Bowl</strong><br>During the 1920s, farmers on the southern Great Plains plowed up millions of acres of native prairie grass to plant wheat. Wheat prices were high, and many families enjoyed a brief period of prosperity. The deep roots of the prairie grass, however, had held the soil in place for thousands of years, even through long dry spells.<br><br>When a severe drought struck in 1931, the exposed topsoil dried into fine dust. Strong winds lifted it into enormous black clouds that rolled across Kansas, Oklahoma, and Texas. In 1934, one storm carried dust all the way to the East Coast, where it settled on ships in the Atlantic Ocean. On April 14, 1935, a day later called Black Sunday, a storm grew so dense that people could not see their own hands in front of their faces. Thousands of families abandoned their farms and moved west in search of work.<br><br>In response, the federal government created the Soil Conservation Service in 1935. Its experts taught farmers to plant rows of trees as windbreaks and to plow in curving lines that followed the shape of the land. By the early 1940s, the rains had returned, and the new methods kept much of the soil from blowing away again."}, {"stem": "Which statement best expresses the main idea of the passage?", "opts": ["The federal government forced farm families to leave the Great Plains in the 1930s.", "Plowing up the prairie grass, followed by drought, led to the Dust Bowl, and new farming methods helped the land recover.", "High wheat prices in the 1920s made farm families on the Great Plains wealthy.", "Black Sunday was the worst single dust storm that ever struck the Great Plains."], "ci": 1, "exp": "The passage moves from cause (prairie grass plowed up, then &ldquo;a severe drought struck in 1931&rdquo;) to effects (dust storms, families leaving) to the solution (&ldquo;the new methods kept much of the soil from blowing away&rdquo;). Black Sunday is only one detail, and the passage never calls it the worst storm ever.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Dust Bowl</strong><br>During the 1920s, farmers on the southern Great Plains plowed up millions of acres of native prairie grass to plant wheat. Wheat prices were high, and many families enjoyed a brief period of prosperity. The deep roots of the prairie grass, however, had held the soil in place for thousands of years, even through long dry spells.<br><br>When a severe drought struck in 1931, the exposed topsoil dried into fine dust. Strong winds lifted it into enormous black clouds that rolled across Kansas, Oklahoma, and Texas. In 1934, one storm carried dust all the way to the East Coast, where it settled on ships in the Atlantic Ocean. On April 14, 1935, a day later called Black Sunday, a storm grew so dense that people could not see their own hands in front of their faces. Thousands of families abandoned their farms and moved west in search of work.<br><br>In response, the federal government created the Soil Conservation Service in 1935. Its experts taught farmers to plant rows of trees as windbreaks and to plow in curving lines that followed the shape of the land. By the early 1940s, the rains had returned, and the new methods kept much of the soil from blowing away again."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["A bat calls faster as it gets closer to an insect.", "Some moths make clicking sounds when a bat comes near.", "A bat calls about two hundred times per second during its whole flight.", "Most bat calls are too high for people to hear."], "ci": 2, "exp": "The passage says a bat calls &ldquo;sometimes nearly two hundred times per second&rdquo; only &ldquo;as a bat closes in on an insect&rdquo; &mdash; not during its whole flight. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>How Bats See with Sound</strong><br>On a summer night, a little brown bat can catch hundreds of mosquitoes in a single hour without bumping into one branch. The bat is not relying on its eyes. Instead, it uses echolocation. As it flies, the bat produces a rapid series of high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how long each echo takes to return, and how loud it is, the bat&rsquo;s brain builds a detailed picture of its surroundings. A close object returns its echo sooner than a distant one. As a bat closes in on an insect, it calls faster and faster, sometimes nearly two hundred times per second, a burst that scientists have nicknamed the &ldquo;feeding buzz.&rdquo;<br><br>Some moths have developed a clever defense. They can hear the calls, and when a bat approaches, they drop toward the ground or make clicking sounds of their own that may confuse the hunter. Still, echolocation is so precise that some bats can detect a wire thinner than a human hair."}, {"stem": "Which meaning of <b>dial</b> is used in the first paragraph?", "opts": ["to call someone by pressing numbers on a phone", "a round gauge that shows a measurement, such as speed", "the face of a clock that shows the hours", "a knob that is turned to choose a radio station"], "ci": 3, "exp": "Mae&rsquo;s father &ldquo;fiddled with the dial&rdquo; of the family radio, so it is the knob that tunes the station. A gauge is also a kind of dial, but it only shows a measurement; it is not turned to change anything.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>Listening for Lindbergh</strong><br>On the afternoon of May 21, 1927, eleven-year-old Mae Hollis sat cross-legged in front of the family radio in Wichita, Kansas, while her father fiddled with the dial. Somewhere over the Atlantic Ocean, a young pilot named Charles Lindbergh was attempting to fly alone, without stopping, from New York to Paris. No one had ever done it.<br><br>&ldquo;He&rsquo;s been in the air more than thirty hours,&rdquo; Papa said, frowning at the crackling speaker. &ldquo;Fog over the ocean, they say.&rdquo;<br><br>Mae thought of the newspaper photograph of Lindbergh&rsquo;s plane, the <i>Spirit of St. Louis</i>, its silver wings so slender they looked fragile. To save weight, the newspaper said, he had left behind his radio and even his parachute.<br><br>Then the static cleared, and an announcer&rsquo;s voice rose with excitement: Lindbergh had landed at Le Bourget Field, and a huge crowd was rushing across the airfield toward his plane.<br><br>Papa let out a whoop that rattled the windows. Mae ran onto the porch, where neighbors were already spilling out of their houses, and looked up at the sky as though she might see the tiny plane herself."}, {"stem": "Which word means the <b>OPPOSITE</b> of <b>restless</b> as it is used in the third stanza?", "opts": ["settled", "noisy", "hungry", "uneasy"], "ci": 0, "exp": "Restless cattle cannot stay still. The opposite is <i>settled</i> (calm and still). <i>Uneasy</i> means almost the same as restless.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Prairie Wind</strong><br>At dawn the wind is barely breathing;<br>it combs the wheat with gentle hands<br>and lifts the meadowlark&rsquo;s first music<br>across the waking, golden lands.<br><br>By noon it gathers up its courage;<br>it races fences, rattles doors,<br>it bends the cottonwoods like dancers<br>and sweeps the dust from porch-board floors.<br><br>At dusk it turns impatient, hungry;<br>it howls along the fields of hay,<br>it herds the clouds like restless cattle<br>and chases tumbleweeds away.<br><br>But when the stars come out to listen,<br>the wind lies down in tall, soft grass<br>and hums a low and patient lullaby<br>to every field it used to pass."}, {"stem": "Which list shows these events in the order they happened?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>America&rsquo;s First National Park</strong><br>In the summer of 1870, a group of explorers traveled into the remote wilderness where the present-day states of Wyoming, Montana, and Idaho meet. They returned with astonishing reports of boiling springs, towering waterfalls, and geysers that hurled scalding water high into the air. Many people in the East refused to believe them. The following year, the geologist Ferdinand Hayden led a government survey to the region, bringing along the photographer William Henry Jackson and the painter Thomas Moran. Their photographs and paintings gave members of Congress something the written reports could not: proof.<br><br>Hayden worried that private companies would soon claim the land, build hotels, and charge visitors to see the geysers. He urged lawmakers to protect it instead. On March 1, 1872, President Ulysses S. Grant signed a law setting aside more than two million acres as Yellowstone National Park, &ldquo;for the benefit and enjoyment of the people.&rdquo;<br><br>No nation had ever done anything quite like it. The idea of giving wild land permanent protection eventually spread across the country and around the world, and today the U.S. National Park System includes more than four hundred areas.", "opts": ["Hayden leads a government survey &rarr; explorers report boiling springs and geysers &rarr; President Grant signs the park law &rarr; the idea spreads around the world", "explorers report boiling springs and geysers &rarr; President Grant signs the park law &rarr; Hayden leads a government survey &rarr; the idea spreads around the world", "explorers report boiling springs and geysers &rarr; Hayden leads a government survey &rarr; President Grant signs the park law &rarr; the idea spreads around the world", "explorers report boiling springs and geysers &rarr; Hayden leads a government survey &rarr; the idea spreads around the world &rarr; President Grant signs the park law"], "ci": 2, "exp": "The explorers went in 1870, Hayden&rsquo;s survey came &ldquo;the following year,&rdquo; Grant signed the law on March 1, 1872, and the idea &ldquo;eventually spread.&rdquo; Hayden&rsquo;s survey came after the explorers&rsquo; reports, not before."}, {"stem": "In the second stanza, what causes the “tiny parachutes” to go drifting into flight?", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Dandelion Clock</strong><br><p style=\"margin:0 0 8px;\">Yesterday it was a yellow sun<br>stitched low against the lawn;<br>today it is a silver globe,<br>a moon that waits for dawn.</p><p style=\"margin:0 0 8px;\">I pluck it, hold it to my lips,<br>and blow with all my might—<br>a hundred tiny parachutes<br>go drifting into flight.</p><p style=\"margin:0 0 8px;\">They sail above the garden fence,<br>past chimney, roof, and tree,<br>too swift for me to follow them,<br>too light for me to see.</p><p style=\"margin:0 0 8px;\">Next spring, in someone else’s yard,<br>where no one planted one,<br>a stubborn little dandelion<br>will lift its face to the sun.</p>", "opts": ["The sun dries out the yellow petals.", "A strong wind shakes the garden fence.", "The speaker blows on the dandelion.", "The speaker drops the dandelion on the lawn."], "ci": 2, "exp": "The speaker says, “I pluck it, hold it to my lips, / and blow with all my might,” and then the seeds go “drifting into flight.” The fence appears later, as something the seeds sail above."}, {"stem": "The word <b>globe</b> has more than one meaning. Which meaning is used in the first stanza?", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>Dandelion Clock</strong><br><p style=\"margin:0 0 8px;\">Yesterday it was a yellow sun<br>stitched low against the lawn;<br>today it is a silver globe,<br>a moon that waits for dawn.</p><p style=\"margin:0 0 8px;\">I pluck it, hold it to my lips,<br>and blow with all my might—<br>a hundred tiny parachutes<br>go drifting into flight.</p><p style=\"margin:0 0 8px;\">They sail above the garden fence,<br>past chimney, roof, and tree,<br>too swift for me to follow them,<br>too light for me to see.</p><p style=\"margin:0 0 8px;\">Next spring, in someone else’s yard,<br>where no one planted one,<br>a stubborn little dandelion<br>will lift its face to the sun.</p>", "opts": ["the whole world and its people", "a model of Earth on a stand", "a round, ball-shaped object", "a glass cover over a lamp"], "ci": 2, "exp": "The dandelion has turned from a flat yellow flower into a fluffy “silver globe,” described as “a moon,” so <i>globe</i> means a round shape. A model of Earth is a real meaning of globe, but not the one used here."}, {"stem": "What can the reader infer about the small local school near Eli&rsquo;s ranch?", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1910, nine-year-old Hattie walked two miles each morning to a one-room schoolhouse in rural Iowa. Inside, twenty students between the ages of six and fourteen shared a single teacher, Miss Pruitt. Because she could not teach every grade at once, the older students often helped the younger ones practice reading and arithmetic. In winter, Hattie arrived early to carry in wood for the iron stove, since the building had no other heat. Lessons were simple and books were scarce, but Hattie treasured her hours there. For a farm girl who was needed at home every afternoon, school was a precious chance to learn.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Eli lives on a cattle ranch in Montana, forty miles from the nearest town. Instead of riding a bus, he opens a laptop at the kitchen table, where his teacher appears on the screen along with classmates scattered across the state. When the internet connection drops during a storm, Eli has to wait and reconnect, which can be frustrating. Still, online school gives him access to classes, such as robotics, that his small local school could never offer. In the afternoons, Eli helps feed the cattle, and in the evenings he finishes assignments that his teacher reviews from more than a hundred miles away.</p>", "opts": ["It is located on Eli&rsquo;s family&rsquo;s ranch.", "It closed because the internet connection kept dropping.", "It has a better robotics program than the online school.", "It offers fewer classes than Eli&rsquo;s online school."], "ci": 3, "exp": "Passage B says online school gives Eli &ldquo;classes, such as robotics, that his small local school could never offer.&rdquo; This suggests the local school has fewer choices."}, {"stem": "The suffix <b>-ling</b> means “a young or small one.” What does <b>seedling</b> in the first paragraph most likely mean?", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>", "opts": ["a group of seeds inside one pod", "a seed that an animal has buried", "a young plant that has just sprouted", "a person who plants seeds for a living"], "ci": 2, "exp": "seed + -ling = a young one that comes from a seed. The passage says a seedling “sprouts,” which shows it is a young plant, not a buried seed."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>", "opts": ["Some acorns grow into oaks because squirrels forget where they buried them.", "A maple seed floats down under a tuft of silky threads, like a parachute.", "Witch hazel pods can fling seeds as far as thirty feet.", "Burdock burrs gave an engineer the idea for Velcro."], "ci": 1, "exp": "The silky “tiny parachute” belongs to the dandelion. The passage says a maple seed has “a single papery wing that makes it spin like a helicopter blade.” The other three statements match the passage."}, {"stem": "Based on the passages, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1962, twelve-year-old Gary lived in Huntsville, Alabama, where engineers were designing the giant rockets that would one day carry astronauts toward the Moon. Inspired by the rumble of engine tests that rattled his windows, Gary built model rockets from cardboard tubes and balsa-wood fins. His first three launches failed spectacularly; one rocket spun in circles and crashed into a neighbor’s garden. Rather than quit, Gary persevered, studying each failure and adjusting the fins. When his fourth rocket soared straight up and drifted back down on its parachute, he decided he would become an engineer himself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last spring, Maya’s science club in Wichita, Kansas, launched a weather balloon carrying a small camera and a GPS tracker. As the balloon climbed, the air grew thinner, and the balloon swelled until it burst more than 90,000 feet above the ground. A parachute carried the equipment safely back to a wheat field sixty miles away, where the club located it using the GPS signal. Back at school, the students watched the video in amazement: the sky had turned nearly black, and the curve of Earth stretched across the screen. Maya says the project made space feel close enough to touch.</p>", "opts": ["Maya’s balloon burst more than 90,000 feet above the ground.", "Gary’s first three rocket launches did not succeed.", "Maya’s club used a GPS signal to find its equipment.", "Gary’s fourth rocket crashed into a neighbor’s garden."], "ci": 3, "exp": "In Passage A, a rocket from the first three failed launches crashed into the garden. The fourth rocket “soared straight up and drifted back down on its parachute.”"}, {"stem": "Which word means the <b>OPPOSITE</b> of “<b>dormant</b>” as it is used in the passage?", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Islands from a Hot Spot</strong><br><p style=\"margin:0 0 8px;\">The Hawaiian Islands stretch across the Pacific Ocean for about 1,500 miles, yet no collision of continents created them. Deep beneath the Pacific Plate, a column of unusually hot rock rises from far inside Earth. Geologists call this place a hot spot.</p><p style=\"margin:0 0 8px;\">Where the rising rock nears the surface, some of it melts into magma that erupts through the seafloor. Layer upon layer of cooled lava gradually builds a mountain, and after hundreds of thousands of years, its summit breaks through the waves as a new island.</p><p style=\"margin:0 0 8px;\">The hot spot, however, stays in place while the Pacific Plate creeps northwest about three to four inches each year. As the plate moves, each volcano is carried away from its supply of magma. It becomes dormant and slowly erodes, while a new volcano begins to grow above the hot spot. This explains why the oldest large islands, such as Kauai, lie to the northwest, while the Big Island, which still has active volcanoes, lies to the southeast.</p>", "opts": ["active", "sleeping", "inactive", "ancient"], "ci": 0, "exp": "A <i>dormant</i> volcano is quiet and no longer erupting. The passage contrasts it with the Big Island, “which still has active volcanoes,” so the opposite is <i>active</i>. <i>Inactive</i> and <i>sleeping</i> mean nearly the same as dormant."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Arm of Liberty</strong><br><p style=\"margin:0 0 8px;\">In the summer of 1876, eleven-year-old Thomas Reilly rode a crowded train from Trenton to Philadelphia with his uncle Patrick, a blacksmith. The whole country, it seemed, had come to the Centennial Exhibition, a fair celebrating one hundred years since the signing of the Declaration of Independence.</p><p style=\"margin:0 0 8px;\">Their first stop was Machinery Hall. There, the colossal Corliss steam engine, taller than a three-story house, turned a flywheel that powered hundreds of other machines through belts and shafts. Uncle Patrick stood in silence for a long time. “Every hammer I own,” he finally murmured, “and none of them could do in a day what this does in a minute.”</p><p style=\"margin:0 0 8px;\">Later, near the lagoon, Thomas spotted something even stranger: a giant copper hand gripping a torch, rising above the crowd. A sign explained that it belonged to a statue that France planned to give the United States, and that visitors could pay to climb a vertical ladder inside the arm to the balcony around the torch. The money would help pay to finish the statue.</p><p style=\"margin:0 0 8px;\">Thomas counted the coins in his pocket, then looked hopefully at his uncle. Uncle Patrick grinned and added a coin of his own. From the balcony, the fairgrounds spread out beneath them, and Thomas tried to imagine how tall the finished statue would be.</p>", "opts": ["The fair celebrated one hundred years since the Declaration of Independence.", "Uncle Patrick refused to pay for the climb to the torch.", "The torch belonged to a statue France planned to give the United States.", "The Corliss engine powered many other machines."], "ci": 1, "exp": "Uncle Patrick “grinned and added a coin of his own,” so he helped pay. The other three statements match the passage."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>How a Tornado Forms</strong><br><p style=\"margin:0 0 8px;\">A tornado is a violently spinning column of air that stretches from a thunderstorm down to the ground. Although tornadoes can strike almost anywhere, they are especially common in the central United States, a region sometimes nicknamed Tornado Alley, because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.</p><p style=\"margin:0 0 8px;\">Most powerful tornadoes are born inside supercells. When winds near the ground blow in a different direction and at a different speed than winds higher up, the air between them begins to roll like a pencil between your palms. A strong updraft inside the storm can tilt this rolling air upright, and the whole storm begins to rotate. If the spinning narrows and tightens, it speeds up, just as a figure skater spins faster when she pulls in her arms, and a funnel may descend toward the earth.</p><p style=\"margin:0 0 8px;\">Tornado winds can exceed 200 miles per hour, causing tremendous damage in seconds. Because no one can prevent a tornado, forecasters concentrate on warning people early. Doppler radar can detect rotation inside a storm before a funnel ever appears, giving families precious minutes to reach a basement or an interior room.</p>", "opts": ["Tornadoes form only in the central United States.", "Tornado winds can be faster than 200 miles per hour.", "A spinning storm speeds up when the spinning narrows.", "Doppler radar can detect rotation before a funnel appears."], "ci": 0, "exp": "The passage says tornadoes “can strike almost anywhere,” even though they are especially common in the central United States. The other three statements match the passage."}, {"stem": "According to the story, which event happened right after the levee north of town gave way?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>High Water in Greenville</strong><br><p style=\"margin:0 0 8px;\">In April 1927, after months of relentless rain, the Mississippi River swelled higher than anyone in Greenville, Mississippi, could remember. Eleven-year-old Henry Jackson watched from the levee as brown water lapped just inches below the top of the earthen wall, and his father doubted it could withstand much more.</p><p style=\"margin:0 0 8px;\">On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning, and within hours the streets had become canals. His father hoisted Henry’s little sister onto the roof of their porch while Henry gathered the family’s quilts and a sack of cornmeal.</p><p style=\"margin:0 0 8px;\">Two days later, a rowboat finally reached their house. The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer around floating fence posts and ruined crops. They carried the family to the top of the levee, which had become a crowded, muddy camp for thousands of people.</p><p style=\"margin:0 0 8px;\">That night, Henry gazed across the vast brown lake that had once been farmland. His father rested a hand on his shoulder. “The river took a lot,” he said quietly, “but it couldn’t take us.”</p>", "opts": ["A rowboat reached the Jacksons’ house.", "Church bells rang to warn the town.", "Henry watched the water from the top of the levee.", "The family was carried to the camp on the levee."], "ci": 1, "exp": "“On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning.” The rowboat came “two days later.”"}, {"stem": "The poet writes that the wind “came walking down our street / on tall and restless, unseen feet.” What does this language do?", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>", "opts": ["It shows that the speaker is afraid of the wind.", "It tells exactly how fast the wind was blowing.", "It describes the wind as if it were a person.", "It compares the wind to embers by using the word “like.”"], "ci": 2, "exp": "Wind cannot really walk or have feet. Giving it human actions is called personification. The poem does use “like” later, but that compares the <i>leaves</i> to embers."}, {"stem": "Which sentence best states a theme of the story?", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>", "opts": ["Audiences always notice every small mistake.", "It is better to avoid performing in front of crowds.", "A mistake is not a failure if you keep going.", "Enough practice guarantees a perfect performance."], "ci": 2, "exp": "Jonah forgot the middle but kept playing, and at the end “he didn’t feel defeated by a mistake.” Ms. Bell even says audiences “rarely notice a slip.”"}, {"stem": "Read this sentence: “He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.” Which word means the <b>SAME</b> or nearly the same as <b>deliberate</b>?", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>", "opts": ["hurried", "intentional", "cheerful", "accidental"], "ci": 1, "exp": "<i>Deliberate</i> means done carefully and on purpose. Jonah chose the section he knew best and played it steadily, so <i>intentional</i> fits. <i>Hurried</i> and <i>accidental</i> mean nearly the opposite."}, {"stem": "What was the main way in which a caisson kept river water out while men dug?", "tag": "Main Way", "tagcolor": "#185FA5", "passage": "In the summer of 1881, twelve-year-old Thomas Byrne lived in a crowded apartment near the East River in Brooklyn. Every morning he watched hundreds of people squeeze onto the ferries that carried workers across the river to New York City. When fog or ice filled the river, the ferries stopped, and many families lost a day&rsquo;s pay. That was why the city was building the Brooklyn Bridge, a suspension bridge, or a bridge whose roadway hangs from huge cables stretched between tall towers.<br><br>Years earlier, Thomas&rsquo;s father had helped dig the bridge&rsquo;s foundations. He had worked in a caisson, a giant wooden box without a bottom that was sunk to the riverbed and filled with pressed air to keep the water out. Workers who came up too quickly often became sick with a painful illness called caisson disease. The chief engineer, Washington Roebling, became so ill that he could no longer leave his house.<br><br>One afternoon, Thomas delivered a package to the Roebling home. He saw Emily Roebling, the engineer&rsquo;s wife, studying drawings at a cluttered table. She explained that she carried her husband&rsquo;s instructions to the builders every day and had learned the mathematics of cables herself. <u>Mrs. Roebling was the most remarkable person in all of Brooklyn.</u><br><br>From the window, Thomas could see the two stone towers rising above the river like giant gray guardians. Workers were spinning steel wires into four thick cables, each made of more than 5,000 wires. Thomas asked whether a boy could ever learn to build something so enormous. Mrs. Roebling handed him a small notebook and told him to begin by writing down every question he had. On his way home, Thomas stopped at the water&rsquo;s edge, opened the notebook, and stared up at the cables shining in the evening sun.", "opts": ["It was lined with stone from the towers.", "It was filled with pressed air.", "It was covered with wet sheets.", "It was held up by steel cables."], "ci": 1, "exp": "The caisson was &ldquo;sunk to the riverbed and filled with pressed air to keep the water out.&rdquo;"}, {"stem": "How are the libraries in Passage A and Passage B alike?", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs.", "opts": ["Both opened in Philadelphia during colonial times.", "Both help people share costly things instead of buying them.", "Both were started by Benjamin Franklin and his friends.", "Both lend mostly tools and musical instruments to families."], "ci": 1, "exp": "In Passage A, books were &ldquo;expensive and rare,&rdquo; so members shared them. In Passage B, families share tools and instruments instead of buying them. The libraries are in different places and times, and only B lends tools."}, {"stem": "According to Passage A, how did the Library Company get money to buy books?", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs.", "opts": ["Each member paid a fee to join.", "The colony of Pennsylvania gave the club money.", "Benjamin Franklin paid for all the books himself.", "Readers paid each time they borrowed a book."], "ci": 0, "exp": "Passage A says, &ldquo;Each member paid a fee to join, and the money was used to purchase books from London.&rdquo; Members paid once to join, not each time they borrowed."}, {"stem": "According to the passage, what did the American Bison Society do?", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>", "opts": ["It bought the hides that hunters sold.", "It named the bison the national mammal.", "It sent bison to new wildlife refuges.", "It counted the bison that were left in 1889."], "ci": 2, "exp": "The passage says the Society “sent animals to new wildlife refuges.” Hornaday’s count happened in 1889, before the Society existed, and Congress (not the Society) named the national mammal in 2016."}, {"stem": "Which of these does the poem <b>NOT</b> describe the river doing?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>", "opts": ["freezing over again in the fall", "humming a gentle tune in July", "cracking its ice in March", "swallowing a fence and a footbridge"], "ci": 0, "exp": "The poem moves from March to April to July and never mentions fall. It does say the river “cracks its frozen coat,” “swallows fence and footbridge,” and “hums a gentle tune.”"}, {"stem": "According to the passage, why do wildfires often skip over land near a beaver pond?", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>", "opts": ["The ground there stays wet and soggy.", "Beavers cut down all the trees nearby.", "Farmers clear the land around the pond.", "The dam blocks the wind from reaching the land."], "ci": 0, "exp": "Because the pond holds water, “nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground.” Beavers do cut trees, but the passage links the fires to the wet ground."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>", "opts": ["Soil near a beaver pond can stay moist during a drought.", "Beavers store branches under the ice to eat in winter.", "A beaver’s front teeth never stop growing.", "Beaver dams speed up the current of a stream."], "ci": 3, "exp": "The passage says the dam “slows the current and floods the land behind it,” so it does not speed the current up. The other three statements match the passage."}, {"stem": "Which word means the <b>SAME</b> or nearly the same as “<b>stalling</b>” as it is used in the story?", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>Just a Tuesday</strong><br><p style=\"margin:0 0 8px;\">Owen chalked his hands for the third time and stared up at the purple route. It was the final climb of the Riverside Youth Bouldering Contest, and every competitor before him had slipped at the same overhang near the top.</p><p style=\"margin:0 0 8px;\">“You’re stalling,” his friend Jada said, nudging him. “You’ve practiced that move a hundred times.”</p><p style=\"margin:0 0 8px;\">“Practicing is different,” Owen muttered. “Nobody was watching then.”</p><p style=\"margin:0 0 8px;\">Coach Ortiz knelt beside him. “Forget the crowd. Climb it the way you’d climb it on a Tuesday afternoon, one hold at a time.”</p><p style=\"margin:0 0 8px;\">Owen nodded and began. His legs trembled at the overhang, and for a moment his fingers started to slide. Instead of lunging, he paused, shifted his hip closer to the wall, and reached deliberately for the next hold. It held. Three moves later, he slapped the top with both hands.</p><p style=\"margin:0 0 8px;\">The gym erupted, but Owen barely heard it. He was grinning at Coach Ortiz, who simply raised one thumb, as if to say, <i>Just a Tuesday.</i></p>", "opts": ["hurrying", "complaining", "delaying", "bragging"], "ci": 2, "exp": "Owen has chalked his hands “for the third time” and is staring at the route instead of climbing, so Jada says he is <i>stalling</i>: putting off starting. <i>Hurrying</i> means the opposite."}, {"stem": "The suffix <i>-ward</i> means &ldquo;in the direction of.&rdquo; What does &ldquo;downward&rdquo; most likely mean in &ldquo;water seeps downward through tiny cracks&rdquo;?", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>How Limestone Caves Form</strong><br><p style=\"margin:0 0 8px;\">Many of the world&rsquo;s largest caves were carved not by rushing rivers but by slow, quiet chemistry. As rain falls and soaks into the soil, it absorbs carbon dioxide and becomes a weak acid. This slightly acidic water seeps downward through tiny cracks in limestone, a rock made mostly of the shells and skeletons of ancient sea creatures. Little by little, the acid dissolves the rock, widening the cracks into tunnels and, after hundreds of thousands of years, into enormous rooms.</p><p style=\"margin:0 0 8px;\">Once a cave has formed, it continues to change. When water drips from the ceiling, it releases some of its carbon dioxide into the cave air, and a tiny ring of limestone is left behind. Over centuries, these rings build stalactites that hang down like icicles, while drops that splash on the floor build stalagmites that rise upward. Where the two meet, they form a column.</p><p style=\"margin:0 0 8px;\">Because many formations grow only about an inch every hundred years, they are fragile treasures. A single careless touch can leave skin oils that stop a formation from growing, which is why visitors to caves such as Mammoth Cave in Kentucky are asked to keep their hands to themselves.</p>", "opts": ["all the way to the bottom", "in a slow and quiet way", "deep under the ground", "toward a lower place"], "ci": 3, "exp": "<i>Down</i> + <i>-ward</i> (&ldquo;in the direction of&rdquo;) means &ldquo;in the direction of down,&rdquo; or toward a lower place. &ldquo;All the way to the bottom&rdquo; is too strong &mdash; the word tells only the direction."}, {"stem": "Read this sentence from the story.<br><br>“Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was <b>flawless</b>.”<br><br>Which word means the <b>OPPOSITE</b> of <b>flawless</b>?", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>The Leaky Lightning</strong><br><p style=\"margin:0 0 8px;\">Elena pressed the last strip of duct tape along the seam of the cardboard boat and stepped back. “It looks like a giant cereal box,” her little brother Sam said doubtfully.</p><p style=\"margin:0 0 8px;\">“It’s a racing boat,” Elena corrected him. “And it’s called the <i>Lightning</i>.”</p><p style=\"margin:0 0 8px;\">The rules of the Riverside Pool Cardboard Regatta were simple: build a boat from cardboard and tape, then paddle it across the pool. Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was flawless.</p><p style=\"margin:0 0 8px;\">Five seconds after the starting whistle, cold water began seeping through the bottom. Sam’s knees were soaked. “We’re sinking!” he wailed.</p><p style=\"margin:0 0 8px;\">Elena’s stomach dropped. Every other boat was already halfway across. Then she remembered the extra roll of tape in her pocket. “Keep paddling,” she said. “I’ll patch it.”</p><p style=\"margin:0 0 8px;\">While Sam paddled furiously, Elena slapped tape over the widest crack. The leak slowed to a trickle. Inch by inch, the <i>Lightning</i> crept forward until its nose bumped the far wall.</p><p style=\"margin:0 0 8px;\">They finished last, but the crowd cheered louder for them than for the winners. Sam grinned and wiped the water off his face. “Next year,” he announced, “we use twice as much tape.”</p>", "opts": ["clever", "faulty", "sturdy", "perfect"], "ci": 1, "exp": "<i>Flawless</i> means having no mistakes. The opposite is <i>faulty</i>, which means having something wrong with it, and the leaky boat proves the design had a problem. <i>Perfect</i> means the same as flawless."}, {"stem": "Which event happened <b>right after</b> the two telegraph lines were joined?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>", "opts": ["Western Union sent out two crews from opposite ends.", "The Pony Express announced that it would close.", "Congress passed a law offering money for the line.", "A message from California reached President Lincoln."], "ci": 3, "exp": "“Within hours” of the joining, the message reached Lincoln. The Pony Express closing came “two days later,” so it was not right after."}, {"stem": "According to the story, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Last Move</strong><br><p style=\"margin:0 0 8px;\">Kenji had practiced for weeks, but when the tournament director posted the final pairings, his stomach dropped. His opponent in the championship round was Ava, his best friend and the person who had taught him the game.</p><p style=\"margin:0 0 8px;\">“We don’t have to make this weird,” Ava said, sliding into the chair across from him. “Just play your best.”</p><p style=\"margin:0 0 8px;\">Kenji nodded, though his hands were trembling. For forty minutes the two of them traded pieces in near silence. Then Ava leaned back and frowned. Kenji glanced at the board and saw it: if he moved his knight, her queen would be trapped. He hesitated. Winning would mean defeating the person who had spent an entire summer patiently explaining openings to him at her kitchen table.</p><p style=\"margin:0 0 8px;\">He moved the knight.</p><p style=\"margin:0 0 8px;\">Ava stared at the board for a long moment. Then, to Kenji’s astonishment, she grinned and reached across to shake his hand. “I resign,” she said. “I’ve been waiting all year for you to find a move like that.”</p><p style=\"margin:0 0 8px;\">On the bus ride home, Kenji kept the small trophy in his lap, but what he remembered most was the pride in his friend’s voice.</p>", "opts": ["Kenji’s knight move trapped Ava’s king.", "The two players had traded pieces for forty minutes before Kenji saw his move.", "Ava resigned after Kenji moved his knight.", "Ava had taught Kenji how to play chess."], "ci": 0, "exp": "The story says that if Kenji moved his knight, “her queen would be trapped” — the queen, not the king. The other three statements match the story."}, {"stem": "According to the passage, which event happened right after burning embers leaped across the Chicago River?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>", "opts": ["Strong winds pushed the flames toward downtown.", "The city’s waterworks caught fire.", "A fire broke out in the O’Leary barn.", "Rain helped put out the flames."], "ci": 1, "exp": "The passage says embers “leaped across the Chicago River, and soon the city’s waterworks caught fire.” The barn fire and the winds came before the embers crossed the river; the rain came last, on October 10."}, {"stem": "Read this sentence from the first paragraph: “Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city <b>parched</b>.” What does <b>parched</b> mean in this sentence?", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>", "opts": ["nearly empty", "extremely dry", "very crowded", "badly damaged"], "ci": 1, "exp": "A drought is a long time without rain, and the dry wood is why the fire spread so fast. So <i>parched</i> means extremely dry. The city was crowded, but a drought does not make a city crowded."}, {"stem": "According to the passage, what happened right after Mr. Lindqvist tumbled into the net?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>High Above the Golden Gate</strong><br><p style=\"margin:0 0 8px;\">Every morning in the spring of 1936, eleven-year-old Rosa Delgado climbed the hill near her house to watch her father leave for work. Papa was an ironworker on the Golden Gate Bridge, and from the hill she could see its two orange towers rising out of the fog like the masts of an enormous ship.</p><p style=\"margin:0 0 8px;\">Rosa knew the work was dangerous. Wind whipped through the strait, and the steel beams were often slick with mist. But Papa always reminded her about the net. The bridge’s chief engineer, Joseph Strauss, had ordered a huge rope net strung beneath the deck. “If anyone slips,” Papa said, “the net catches him like a fish.”</p><p style=\"margin:0 0 8px;\">One foggy afternoon, Papa came home later than usual. His friend Mr. Lindqvist had lost his footing on a beam and tumbled into the net, and Papa had helped haul him back up. “He’s fine,” Papa said, setting down his lunch pail. “He says he’s a member of the Halfway to Hell Club now.”</p><p style=\"margin:0 0 8px;\">Rosa laughed, but that night she added one line to her diary: <i>Thank you, net.</i></p>", "opts": ["Rosa wrote a line in her diary.", "Papa came home later than usual.", "Joseph Strauss ordered the net to be strung.", "Papa helped haul him back up."], "ci": 3, "exp": "Mr. Lindqvist “tumbled into the net, and Papa had helped haul him back up.” Papa came home afterward, and Rosa wrote in her diary that night. Strauss had ordered the net long before."}, {"stem": "In Passage B, the prefix <i>hydro-</i> means “water.” Based on this and the passage, what does <b>hydroponic</b> most likely mean?", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1943, with food rationed during World War II, the government urged Americans to plant “victory gardens.” Thirteen-year-old Ruth Kowalski and her neighbors on Chicago’s South Side cleared bricks and broken glass from a vacant lot behind their apartment building. They planted beans, tomatoes, and cabbage in tidy rows, hauling water in buckets from the building’s basement. By August, the lot was producing more vegetables than the families could eat, so Ruth’s mother canned the extra in glass jars to last through the winter. Ruth later said the garden taught her that a neighborhood could feed itself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last year, students at Ridgeview Middle School in Denver turned their flat school roof into a hydroponic garden. Instead of soil, the plants grow in trays of water mixed with nutrients, and sensors send a text message to the students when the water runs low. Seventh grader Leo Martinez checks the lettuce and basil every morning before class. The harvest goes straight to the school cafeteria, where it replaces vegetables that once traveled more than a thousand miles by truck. Leo says the best part is watching classmates eat a salad that was growing above their heads that morning.</p>", "opts": ["growing plants in water instead of soil", "growing plants on a flat roof", "watering plants with buckets", "growing plants that need very little water"], "ci": 0, "exp": "Passage B says, “Instead of soil, the plants grow in trays of water mixed with nutrients.” <i>Hydro-</i> (water) matches this. Being on a roof is where the garden is, not what <i>hydroponic</i> means."}, {"stem": "According to the story, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Race to Nome</strong><br><p style=\"margin:0 0 8px;\">Nellie Pruett pressed her mittened hand against the frosted window and stared down Front Street. For five days, the people of Nome, Alaska, had been waiting. It was the winter of 1925, diphtheria was spreading among the town’s children, and Dr. Welch’s medicine had expired. Nellie’s little brother, Tom, lay in the next room, his breathing rough and shallow.</p><p style=\"margin:0 0 8px;\">Fresh medicine had traveled by train from Anchorage to the town of Nenana. From there, teams of sled dogs were racing it across nearly seven hundred miles of ice, passing the package from one driver to the next like runners in a relay. Airplanes could not fly in such bitter cold, and the frozen sea had closed the harbor to ships.</p><p style=\"margin:0 0 8px;\">Before dawn on February 2, Nellie heard a sound she would never forget: the jingle of harness bells. Out of the darkness came a team of exhausted dogs, frost coating their fur, led by a black husky named Balto. The driver, Gunnar Kaasen, stumbled to the doctor’s door with the precious bundle.</p><p style=\"margin:0 0 8px;\">Nellie ran to Tom’s bedside. “It’s here,” she whispered. “Hold on just a little longer.”</p>", "opts": ["Airplanes carried the medicine for part of the trip.", "The medicine traveled by train before the dogs took it.", "The frozen sea had closed Nome’s harbor to ships.", "Balto was the lead dog of Gunnar Kaasen’s team."], "ci": 0, "exp": "The story says “airplanes could not fly in such bitter cold,” so no airplane carried the medicine. The other three statements match the story."}, {"stem": "In Passage A, Lena and her father worked “so that the <b>beam</b> would never diminish.” Which meaning of <b>beam</b> is used here?", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>Keepers of the Light</strong><br><strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1886, twelve-year-old Lena Harlow lived at Seal Ledge Light, a stone tower on a rocky island off the coast of Maine. Each evening at sunset, she climbed eighty-one steps behind her father to light the great lamp. Through the night, they took turns trimming the wick and carrying cans of oil up the spiral stairs so that the beam would never diminish. During winter storms, waves sometimes swept across the island, and the family could not reach the mainland for weeks. Lena knew that if the light went out, a ship could strike the ledge.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Today, most American lighthouses operate without keepers. At Point Avery Light, an LED lamp switches on by itself when a sensor detects darkness, and backup batteries keep it glowing if the power fails. Coast Guard technicians visit only a few times a year to inspect the equipment. Many ships now rely chiefly on GPS, yet the Coast Guard still maintains lighthouses, because electronics can fail and a steady light in the right place remains a dependable guide. Some towers that are no longer needed have become museums where visitors can climb the stairs.</p>", "opts": ["a narrow bar used in gymnastics", "a long, heavy piece of wood or metal", "a big, happy smile", "a ray of light"], "ci": 3, "exp": "The sentence is about keeping the lamp burning brightly, so <i>beam</i> means the ray of light from the lamp. The other choices are real meanings of <i>beam</i> that do not fit a lighthouse lamp at night."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Ferries could stall when ice filled the river.", "Washington Roebling was injured when a ferry crushed his foot.", "Emily Roebling carried her husband's instructions to the site.", "The bridge's main span was nearly 1,600 feet long."], "ci": 1, "exp": "It was John A. Roebling, the father, whose foot was crushed by a ferry. Washington was hurt later while working in the caissons. The other three statements match the passage.", "passage": "<strong>The Bridge That Linked Two Cities</strong><br>In 1869, New York and Brooklyn were separate cities divided by the East River, and thousands of commuters depended on crowded ferries that stalled whenever ice clogged the water. Engineer John A. Roebling designed a suspension bridge of unprecedented magnitude, with a main span nearly 1,600 feet long. Before construction began, however, a ferry crushed Roebling's foot against a dock, and he died of tetanus a few weeks later. His son, Washington Roebling, assumed command of the project.<br><br>To anchor the towers, workers labored deep beneath the river inside caissons that were pumped full of compressed air to hold back the water. Many men who climbed back to the surface too rapidly developed crippling pains, and in 1872 Washington himself became partially paralyzed. Confined to his apartment, he followed the progress through a telescope while his wife, Emily Warren Roebling, carried his instructions to the site. Emily studied engineering so thoroughly that officials began consulting her directly.<br><br>When the bridge opened on May 24, 1883, Emily rode across first, holding a rooster as a symbol of victory. Within a single day, more than 150,000 people had strolled along its promenade.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"stem": "According to the passage, where do monarchs lay their eggs?", "opts": ["on grasses along roadsides and farm fields", "on any flowering plant that has nectar", "only on milkweed plants", "on oyamel fir trees in Mexico"], "ci": 2, "exp": "The passage says monarchs head north “laying eggs only on milkweed, the one plant their caterpillars can eat.” The fir trees are where they spend the winter, and flowers give them nectar for flying.", "passage": "<strong>The Monarch's Long Journey</strong><br>Each autumn, millions of monarch butterflies leave Canada and the northern United States and fly as far as 3,000 miles to the mountains of central Mexico. The trip is remarkable because no monarch flying south has ever made it before; the butterflies that migrate in fall are the great-grandchildren of the ones that left Mexico the previous spring. Scientists believe monarchs navigate by tracking the position of the sun with the help of an internal clock in their antennae, and they may also sense Earth's magnetic field.<br><br>Along the way, monarchs depend on flowering plants for nectar, which fuels their flight. In Mexico they cluster by the thousands on oyamel fir trees, where the cool, moist air slows their bodies so that they use little energy all winter. In spring they mate and head north, laying eggs only on milkweed, the one plant their caterpillars can eat.<br><br>Over recent decades, however, milkweed has become far less abundant as farm fields and roadsides have been sprayed and cleared. Because fewer caterpillars survive, the number of monarchs reaching Mexico has dropped sharply. Many families and schools now plant milkweed gardens to help restore the route.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"stem": "Which statement best expresses the theme of the story?", "opts": ["Judges should listen more carefully to young speakers.", "Practice is the key to winning any contest.", "Being honest can matter more than winning.", "Nervous people often make mistakes under pressure."], "ci": 2, "exp": "Grace admits her mistake even though it costs her the trophy, and her grandmother says she is “prouder than if you had won.” Grace's misspelling was not caused by nerves; the story is about what she chose to do afterward.", "passage": "<strong>The Last Word</strong><br>Grace Moreno had reached the final round of the county spelling bee, and only one other speller, a tall boy named Theo, remained on the stage. When the pronouncer read the word “rhythm,” Grace spelled it slowly, letter by letter. The judges nodded, and the audience applauded.<br><br>As she returned to her seat, though, Grace's stomach tightened. She replayed the letters in her head and realized she had said “r-h-y-t-h-e-m.” The judges had misheard her.<br><br>“You look pale,” Theo whispered. “Are you nervous?”<br><br>Grace didn't answer. She thought about the gleaming trophy and about her grandmother, who had driven two hours to watch. Then she stood, walked to the judges' table, and explained her mistake.<br><br>The head judge studied her for a long moment. “That took courage,” she said quietly. “Most people would have stayed silent.”<br><br>Theo spelled the next word correctly and won. Afterward, while families crowded around him, Grace's grandmother squeezed her hand. “I came to watch a speller,” she said, “but I'm leaving prouder than if you had won.”", "tag": "Main Idea / Theme", "tagcolor": "#185FA5"}, {"stem": "According to the passage, how did Grace actually spell the word on stage?", "opts": ["r-y-t-h-m", "r-h-y-t-h-m", "r-h-y-t-h-e-m", "r-h-i-t-h-m"], "ci": 2, "exp": "Grace “realized she had said ‘r-h-y-t-h-e-m.’” The correct spelling, r-h-y-t-h-m, is what the judges thought they heard.", "passage": "<strong>The Last Word</strong><br>Grace Moreno had reached the final round of the county spelling bee, and only one other speller, a tall boy named Theo, remained on the stage. When the pronouncer read the word “rhythm,” Grace spelled it slowly, letter by letter. The judges nodded, and the audience applauded.<br><br>As she returned to her seat, though, Grace's stomach tightened. She replayed the letters in her head and realized she had said “r-h-y-t-h-e-m.” The judges had misheard her.<br><br>“You look pale,” Theo whispered. “Are you nervous?”<br><br>Grace didn't answer. She thought about the gleaming trophy and about her grandmother, who had driven two hours to watch. Then she stood, walked to the judges' table, and explained her mistake.<br><br>The head judge studied her for a long moment. “That took courage,” she said quietly. “Most people would have stayed silent.”<br><br>Theo spelled the next word correctly and won. Afterward, while families crowded around him, Grace's grandmother squeezed her hand. “I came to watch a speller,” she said, “but I'm leaving prouder than if you had won.”", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"stem": "Which list shows the events in the order they happened?", "opts": ["Congress approved the project &rarr; workers blasted tunnels to move the river &rarr; the dam was finished &rarr; concrete was poured in columns", "Congress approved the project &rarr; concrete was poured in columns &rarr; workers blasted tunnels to move the river &rarr; the dam was finished", "Workers blasted tunnels to move the river &rarr; Congress approved the project &rarr; concrete was poured in columns &rarr; the dam was finished", "Congress approved the project &rarr; workers blasted tunnels to move the river &rarr; concrete was poured in columns &rarr; the dam was finished"], "ci": 3, "exp": "The passage says Congress approved the project \"in 1928,\" and \"Before any concrete could be poured, workers blasted four enormous tunnels.\" The dam \"was completed in 1936.\" The tempting order that puts the concrete before the tunnels misses the clue word <i>Before</i>.", "passage": "<strong>The Dam in the Desert</strong><br>In the early 1900s, the Colorado River was both a blessing and a threat to the American Southwest. Each spring, melting snow from the Rocky Mountains swelled the river until it overflowed its banks and destroyed farms in California's Imperial Valley; by late summer, the same river could shrink to a trickle. In 1928, Congress approved a massive project to tame it. Construction began in 1931 in Black Canyon, on the border between Nevada and Arizona. Before any concrete could be poured, workers blasted four enormous tunnels through the canyon walls to divert the river around the building site. Thousands of men, desperate for work during the Great Depression, labored in temperatures that sometimes climbed above 120 degrees. Because a single solid block of concrete that size would have needed more than a century to cool, engineers poured the dam in separate columns and pumped cold water through pipes buried inside them. The dam was completed in 1936, two years ahead of schedule. Today, Lake Mead stores the river's water, and the dam's generators supply electricity to more than a million people in three states.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"stem": "Based on the passage, what would most likely happen to a red maple during an autumn of cloudy days and freezing nights?", "opts": ["Its red color would probably be duller than usual.", "Its yellow pigments would disappear completely.", "Its leaves would stay green all winter.", "Its leaves would turn bright purple instead of red."], "ci": 0, "exp": "The passage says sunny days and nights \"above freezing\" make \"the most brilliant reds,\" and that forests are \"disappointingly dull\" in other years. Cloudy, freezing weather is the opposite, so the reds would likely be dull. Nothing suggests the leaves would stay green.", "passage": "<strong>Why Leaves Change Color</strong><br>All summer long, the leaves of a maple tree are packed with chlorophyll. This green pigment captures sunlight so that the tree can make food, but it is fragile, and the leaf must constantly manufacture fresh supplies to replace what the sun breaks down. Hidden beneath all that green are yellow and orange pigments called carotenoids. Carrots and corn owe their color to the same substances. As autumn approaches and the nights grow longer, the tree gradually stops producing chlorophyll. Once the green fades, the yellows and oranges that were present all along finally become visible. Reds and purples are a different story. Those colors come from pigments that some trees, such as red maples and sumacs, actually create in the fall when sugar becomes trapped in their leaves. Sunny days and cool nights that stay above freezing produce the most brilliant reds, which is why New England's forests are spectacular in some years and disappointingly dull in others. Eventually, a layer of cells forms where each leaf meets its twig, sealing it off, and the leaf drifts to the ground.", "tag": "Inference", "tagcolor": "#185FA5"}, {"stem": "According to the passage, why do yellow and orange colors appear in maple leaves in autumn?", "opts": ["Cool nights freeze the chlorophyll and turn it a yellow color.", "Longer nights cause the leaves to soak up more sunlight than usual.", "The tree creates new yellow and orange pigments when sugar is trapped in its leaves.", "The green chlorophyll fades, revealing pigments that were in the leaf all summer."], "ci": 3, "exp": "The passage says, \"Once the green fades, the yellows and oranges that were present all along finally become visible.\" Trapped sugar is how some trees make <i>reds and purples</i>, not yellows.", "passage": "<strong>Why Leaves Change Color</strong><br>All summer long, the leaves of a maple tree are packed with chlorophyll. This green pigment captures sunlight so that the tree can make food, but it is fragile, and the leaf must constantly manufacture fresh supplies to replace what the sun breaks down. Hidden beneath all that green are yellow and orange pigments called carotenoids. Carrots and corn owe their color to the same substances. As autumn approaches and the nights grow longer, the tree gradually stops producing chlorophyll. Once the green fades, the yellows and oranges that were present all along finally become visible. Reds and purples are a different story. Those colors come from pigments that some trees, such as red maples and sumacs, actually create in the fall when sugar becomes trapped in their leaves. Sunny days and cool nights that stay above freezing produce the most brilliant reds, which is why New England's forests are spectacular in some years and disappointingly dull in others. Eventually, a layer of cells forms where each leaf meets its twig, sealing it off, and the leaf drifts to the ground.", "tag":
