<style>

  * { box-sizing: border-box; }

  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }

  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }

  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }

  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }

  .modal-no { background:#eef2f7; color:#333; }

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues. This week's review — questions you missed recently.";
var TODAY_STR = "20261108";
var RAW_QUESTIONS = [{"stem": "The American ______ began in 1775, when colonists started fighting for independence from Britain.", "opts": ["declaration", "exhibition", "expedition", "revolution"], "ci": 3, "exp": "<i>revolution</i> (n.) a time when people fight to overthrow a government and set up a new one. <i>The American <b>Revolution</b> ended when Britain recognized the United States.</i> Family: revolutionary (adj.), revolt (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The bridge was closed for repairs; <b>therefore</b>, the school bus had to take a longer road through the hills.<br><br>What does <b>therefore</b> mean in this sentence?", "opts": ["even though that happened", "at the same time", "before that happened", "for that reason; as a result"], "ci": 3, "exp": "<i>therefore</i> (adv.) for that reason; as a result. <i>It was raining hard; <b>therefore</b>, the game was moved indoors.</i> Family: (a linking word, like <i>so</i> and <i>as a result</i>)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "At dinner, Grandpa loved to <b>recount</b> stories about growing up on a farm in Iowa.<br><br>Which meaning of <b>recount</b> is used in this sentence?", "opts": ["to tell about events in detail", "a new count of the votes after a close election", "to count something a second time", "to check a total again to find a mistake"], "ci": 0, "exp": "<i>recount</i> has more than one meaning. Here it means <i>to tell about events in detail</i>, because Grandpa is telling stories. It can also mean <i>to count again</i>, or (as a noun) <i>a second count of votes</i>. <i>She <b>recounted</b> her trip to the Grand Canyon.</i> Family: recounting (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Farmers in the dry valley dig long ditches to <b>irrigate</b> their fields with water from the river, so the corn can grow even when it does not rain.<br><br>What does <b>irrigate</b> mean in this sentence?", "opts": ["to bring water to land so crops can grow", "to clear land by cutting down plants", "to protect fields from flooding", "to measure how much rain has fallen"], "ci": 0, "exp": "<i>irrigate</i> (v.) to supply land or crops with water, usually through pipes or ditches. <i>The farmers <b>irrigate</b> their orchards with water from a nearby lake.</i> Family: irrigation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "There was a <b>dramatic</b> drop in temperature last night: it went from 70 degrees to 35 degrees in just a few hours. In this sentence, what does <b>dramatic</b> mean?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["having to do with plays and acting", "sudden and very large", "showing feelings in a big, showy way", "exciting to watch, like a movie"], "ci": 1, "exp": "<i>dramatic</i> (adj.) can mean (1) about plays and acting, (2) acting in a big, showy way, or (3) sudden and very large. A drop of 35 degrees in a few hours is sudden and very large. <i>The city saw a <b>dramatic</b> rise in visitors.</i> Family: drama (n.), dramatically (adv.)"}, {"stem": "Instead of looking everywhere at once, the detective made a _____ search, checking the house one room at a time from top to bottom.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["reluctant", "abundant", "frequent", "systematic"], "ci": 3, "exp": "<i>systematic</i> (adj.) done in a careful, step-by-step order. <i>A <b>systematic</b> search checks every room in order.</i> Family: system (n.), systematically (adv.)."}, {"stem": "The numbers on the map <b>correspond</b> to the numbered stops on the tour, so stop 3 is marked with a 3. Which word means the <b>SAME</b> or nearly the same as “correspond”?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["differ", "match", "repeat", "explain"], "ci": 1, "exp": "<i>correspond</i> (v.) to match or be connected to something. Here each number matches a stop. <i>Differ</i> is the opposite. <i>Each key <b>corresponds</b> to one lock.</i> Family: correspondence (n.)"}, {"stem": "Scientists created a <b>______</b> system that puts living things into groups such as kingdoms, families, and species. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["tolerance", "prosperity", "emergence", "classification"], "ci": 3, "exp": "<i><b>classification</b></i> (n.) the act or system of sorting things into groups. <i>The <b>classification</b> of animals helps scientists compare them.</i> Family: classify (v.) Only “classification” describes a system for putting things into groups."}, {"stem": "The invention of the smartphone caused a <b>revolution</b> in the way people talk to each other. What does <b>revolution</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a long argument", "a small improvement", "a careful plan", "a huge change"], "ci": 3, "exp": "<i>revolution</i> (n.) a very big change in the way people live or do things. <i>The printing press started a <b>revolution</b> in reading.</i> Family: revolutionary (adj.)"}, {"stem": "The school <b>administration</b> decided to add a second recess on Fridays. Which meaning of <b>administration</b> is used here?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["the people who run and manage an organization", "the act of giving someone medicine", "a test given to a whole class", "the group of leaders working with a country’s president"], "ci": 0, "exp": "<i><b>administration</b></i> can mean the people who manage a place like a school or company, a president’s team of leaders (<i>the Lincoln <b>administration</b></i>), or the act of giving something out, like medicine. Here it is the school’s managers. Family: administer (v.), administrator (n.)."}, {"stem": "The coach wanted to <b>integrate</b> the new players into the team, so everyone practiced and ate lunch together.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>integrate</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["train", "combine", "select", "separate"], "ci": 1, "exp": "<i>integrate</i> (v.) to bring parts or people together so they work as one whole. <i>Separate</i> is the opposite. <i>Our teacher <b>integrates</b> art into science lessons.</i> Family: integration (n.)"}, {"stem": "Frederick Douglass traveled across the country, giving speeches that called for the ______ of slavery.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["abolition", "expansion", "revolution", "legislation"], "ci": 0, "exp": "<i>abolition</i> (n.) the act of officially ending something, especially slavery. Douglass wanted slavery ended, so <i>abolition</i> fits; <i>expansion</i> would mean making slavery bigger. <i>The <b>abolition</b> of slavery came with the 13th Amendment in 1865.</i> Family: abolish (v.), abolitionist (n.)"}, {"stem": "The author’s novel was <b>adapted</b> into a movie, so some scenes were shortened and new music was added. Which meaning of <b>adapt</b> is used in this sentence?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["rewritten in a new form, such as a movie or play", "changed over many generations to survive in a habitat", "changed a tool or machine so it can be used in a new way", "got used to a new place or situation"], "ci": 0, "exp": "<i>adapt</i> (v.) can mean to change to fit a new place, to change over generations to survive, or to rewrite a story in a new form. <i>The class <b>adapted</b> the fairy tale into a short play.</i> Family: adaptation (n.), adaptable (adj.). The novel became a movie, so it was rewritten in a new form."}, {"stem": "To keep the sick hamster from spreading the illness, the vet told us to <b>isolate</b> it in a separate cage for a week. What does <b>isolate</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["to check often for signs of sickness", "to feed on a special diet", "to keep warm and quiet", "to keep apart from others"], "ci": 3, "exp": "<i><b>isolate</b></i> (v.) to set apart or keep away from others. <i>The island was <b>isolated</b>, so supplies came only once a month.</i> Family: isolated (adj.), isolation (n.) A separate cage keeps the hamster away from the others."}, {"stem": "The word <b>construct</b> has more than one meaning. Which meaning is used in this sentence?<br><br>“In math class, we used a ruler and a compass to <b>construct</b> a triangle with three equal sides.”", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["to build a large structure such as a bridge", "to draw a shape exactly, using tools", "to put words together into a sentence or argument", "an idea that people have made up (noun)"], "ci": 1, "exp": "<i>construct</i> can mean to build a structure, to put ideas or words together, or (in math) to draw a figure exactly with tools. A ruler, a compass, and a triangle show the math meaning. Family: construction (n.), constructive (adj.)"}, {"stem": "After many complaints about long lunch lines, the principal promised to _____ the way the cafeteria worked. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["reform", "inherit", "conceal", "evacuate"], "ci": 0, "exp": "<i><b>reform</b></i> (v.) to change something in order to make it better. <i>The city wants to <b>reform</b> its bus system.</i> Family: reformer (n.) The complaints show that the cafeteria needed to be improved."}, {"stem": "“Fairness is an <b>abstract</b> idea, so you cannot touch it or hold it in your hand.”<br><br>Which word means the <b>OPPOSITE</b> of <b>abstract</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["general", "theoretical", "concrete", "complex"], "ci": 2, "exp": "<i>abstract</i> (adj.) existing as an idea, not as a real object you can touch. The opposite is <i>concrete</i>: something real you can see or touch. <i>Theoretical</i> and <i>general</i> are close in meaning to abstract."}, {"stem": "During the fire drill, everyone followed the school's ______: line up quietly, walk to the nearest exit, and meet on the field.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["priority", "territory", "procedure", "heritage"], "ci": 2, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>The nurse explained the <b>procedure</b> for getting a flu shot.</i> Family: proceed (v.), procedural (adj.)"}, {"stem": "The class voted to _____ half of the bake-sale money to the animal shelter and the other half to new library books. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["exaggerate", "allocate", "abandon", "examine"], "ci": 1, "exp": "<i><b>allocate</b></i> (v.) to give a share of something for a certain purpose. <i>The school <b>allocated</b> two hours a week for art.</i> Family: allocation (n.) The class decided which part of the money would go where."}, {"stem": "The team practiced the trick play all week, and on Saturday they <b>executed</b> it perfectly to score the winning goal.<br><br>What does <b>execute</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["changed at the last minute", "carried out or performed", "explained in words", "forgot about"], "ci": 1, "exp": "<i>execute</i> (v.) to carry out a plan or perform an action. They did the play perfectly in the game. <i>The gymnast <b>executed</b> a flawless flip.</i> Family: execution (n.)"}, {"stem": "A <b>colony</b> of ants built a maze of tunnels under the sidewalk. In this sentence, what does <b>colony</b> mean?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["a large group of the same kind of animal living together", "an area ruled by a faraway nation", "a system of tunnels dug under the ground", "a settlement started by people who moved from another country"], "ci": 0, "exp": "<i>colony</i> (n.) can mean (1) a settlement started by people from another country, (2) a land ruled by a faraway nation, or (3) a group of the same kind of animal living together. Here it is the group of ants; the tunnels are what the colony built. <i>A <b>colony</b> of bats lives in the old barn.</i> Family: colonist (n.), colonial (adj.)"}, {"stem": "Before the experiment, the class read the safety ______ step by step: goggles on, gloves on, then measure the vinegar.<br><br>Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["procedure", "hypothesis", "phenomenon", "statistic"], "ci": 0, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>Every fire drill follows the same <b>procedure</b>.</i> Family: procedural (adj.), proceed (v.)"}, {"stem": "In the old legend, the knight’s greatest <b>exploit</b> was crossing the frozen mountains alone to rescue the village. Which meaning of <b>exploit</b> is used in this sentence?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["a brave or daring act", "to treat someone unfairly to get something for yourself", "to make full use of something, such as a natural resource", "a trick that takes advantage of a weakness in a computer program"], "ci": 0, "exp": "<i>exploit</i> has several meanings. As a noun it can mean a brave, exciting act. As a verb it can mean to use something fully, or to treat someone unfairly. <i>The pilot’s <b>exploits</b> were told in every newspaper.</i> Here it names something the knight did that was daring: “crossing the frozen mountains alone.”"}, {"stem": "The book had a <b>profound</b> effect on Marcus; after reading it, he decided to become a doctor. Which word means the <b>OPPOSITE</b> of <b>profound</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["powerful", "slight", "deep", "lasting"], "ci": 1, "exp": "<i><b>profound</b></i> (adj.) very deep or strong. <i>The music had a <b>profound</b> effect on the crowd.</i> The opposite is <i>slight</i> (very small). “Deep” and “powerful” mean nearly the same as <i>profound</i>."}, {"stem": "Her nervousness began to __________ itself in small ways: she tapped her pencil and kept checking the clock.<br><br>Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["execute", "manifest", "sustain", "integrate"], "ci": 1, "exp": "<i>manifest</i> (v.) to show something clearly so that others can see it. Her tapping and clock-checking showed her nerves. <i>The disease <b>manifests</b> itself as a rash.</i> Family: manifestation (n.)"}, {"stem": "Ben's essay was ______: each sentence connected clearly to the next, and his ideas were easy to follow.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["abundant", "fragile", "coherent", "reluctant"], "ci": 2, "exp": "<i>coherent</i> (adj.) clear, logical, and easy to understand because the parts fit together. <i>After a good night's sleep, his answers were much more <b>coherent</b>.</i> Family: coherence (n.), incoherent (adj., opposite)"}, {"stem": "When Ella turned eleven, her parents gave her more _____: she could choose her own after-school activities and plan her own homework time.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["procedure", "boundary", "legislation", "autonomy"], "ci": 3, "exp": "<i>autonomy</i> (n.) the freedom to make your own choices and control your own actions. <i>Older students get more <b>autonomy</b> in choosing projects.</i> Family: autonomous (adj.)."}, {"stem": "When smoke filled the hallway, the teachers had to <b>evacuate</b> the building. Which word means the <b>OPPOSITE</b> of <b>evacuate</b>?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["clear", "empty", "enter", "leave"], "ci": 2, "exp": "<i><b>evacuate</b></i> (v.) to leave or move people out of a dangerous place. The opposite is <i>enter</i>. <i>Empty</i> and <i>leave</i> are traps — they mean nearly the same as evacuate. Family: evacuation (n.)."}, {"stem": "Nora ______ left the last cookie on the plate so her little brother could have it.<br><br>Which word correctly completes the sentence?", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["deliberation", "deliberate", "deliberated", "deliberately"], "ci": 3, "exp": "The blank describes how she left it, so it needs an adverb: <i>deliberately</i> (on purpose). <i>Deliberate</i> is the adjective (a <i>deliberate</i> choice). Family: deliberate (adj./v.), deliberation (n.)"}, {"stem": "At the science fair, Ben’s volcano was placed in the Earth Science _____, next to projects about rocks and earthquakes. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["fortune", "hazard", "summit", "category"], "ci": 3, "exp": "<i><b>category</b></i> (n.) a group of things that are alike in some way. <i>Apples and pears belong in the fruit <b>category</b>.</i> Family: categorize (v.) The volcano was grouped with other Earth Science projects."}, {"stem": "Leaders from many countries rushed to _____ the attack on the peaceful village.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["compensate", "condemn", "migrate", "commence"], "ci": 1, "exp": "<i><b>condemn</b></i> (v.) to say strongly that something is wrong or bad. <i>The principal <b>condemned</b> the bullying in a letter to families.</i> Family: condemnation (n.)."}, {"stem": "The nurse will __________ the flu shots to every student on Friday morning.<br><br>Which form of the word correctly completes the sentence?", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["administer", "administrative", "administrator", "administration"], "ci": 0, "exp": "The blank needs a verb after <i>will</i>, so use <i>administer</i> (v.) to give or manage something officially. <i>Administration</i> (n.) is the group that runs something, <i>administrator</i> (n.) is a person, and <i>administrative</i> is an adjective. <i>The school <b>administration</b> planned the event.</i>"}, {"stem": "The new bike lanes had a big <b>impact</b> on the town: twice as many kids now ride their bikes to school. What does <b>impact</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a high cost to pay", "a sudden crash between two objects", "a long delay", "a strong effect"], "ci": 3, "exp": "<i>impact</i> (n.) a strong effect or influence; it can also mean the force of one thing hitting another. <i>Planting trees had a huge <b>impact</b> on how cool the street felt.</i> Family: impactful (adj.). Here nothing crashed — the bike lanes changed how many kids ride, which is an effect."}, {"stem": "At dinner, Grandpa loves to <b>recount</b> the day he caught a twelve-pound catfish, telling every detail just as it happened.<br><br>What does <b>recount</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["try hard to remember", "count again", "tell the story of", "make bigger than it really was"], "ci": 2, "exp": "<i>recount</i> (v.) to tell the story of something that happened. (It can also mean &ldquo;count again,&rdquo; but here Grandpa is <i>telling every detail</i>.) <i>The book <b>recounts</b> the journey of the first pioneers.</i> Family: recounting (n.)"}, {"stem": "Because Anchorage lies at a much higher <b>latitude</b> than Miami, it is farther north and gets far less sunlight in winter.<br><br>What does <b>latitude</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["distance east or west of a starting line", "distance north or south of the equator", "amount of land a city covers", "height above sea level"], "ci": 1, "exp": "<i>latitude</i> (n.) how far a place is north or south of the equator, measured in degrees. <i>Places near the equator have a low <b>latitude</b> and warm weather.</i> Related: longitude (east&ndash;west), latitudinal (adj.)"}, {"stem": "Scientists _____ animals by putting them into groups, such as mammals, birds, and reptiles.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["classify", "evacuate", "persist", "conceal"], "ci": 0, "exp": "<i>classify</i> (v.) to sort things into groups by type. <i>We <b>classified</b> the rocks by color and size.</i> Family: classification (n.)"}, {"stem": "Voting in free elections is an important part of a _____ government.", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["democratic", "democrat", "democracy", "democratically"], "ci": 0, "exp": "<i><b>democratic</b></i> (adj.) run by the people, who choose leaders by voting. <i>Our class made a <b>democratic</b> choice by voting on the field trip.</i> Family: democracy (n.), democratically (adv.) The blank describes the noun “government,” so it needs the adjective."}, {"stem": "As teenagers grow older, they become more ______ and can make many of their own decisions.", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["autonomies", "autonomy", "autonomous", "autonomously"], "ci": 2, "exp": "After <i>become more</i>, you need an adjective: <i>autonomous</i> (able to decide and act on your own). <i>autonomy</i> (n.) the freedom to make your own choices. <i>The club has <b>autonomy</b> to plan its own events.</i> Family: autonomy (n.), autonomous (adj.), autonomously (adv.)"}, {"stem": "Each winter, waves <b>erode</b> the sandy cliff a little more, and now the old path is only a foot from the edge.<br><br>What does <b>erode</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["to build up higher", "to slowly wear away", "to protect from damage", "to freeze solid"], "ci": 1, "exp": "<i>erode</i> (v.) to slowly wear away land or rock by water, wind, or ice. The cliff keeps getting closer to the path. <i>Rain can <b>erode</b> a hillside.</i> Family: erosion (n.)"}, {"stem": "After six hours of hiking, we finally reached the <b>summit</b>. From the very top, we could see three states.<br><br>What does <b>summit</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a shelter where hikers rest", "a narrow trail along a cliff", "the highest point of a mountain", "a flat valley between two hills"], "ci": 2, "exp": "<i>summit</i> (n.) the top of a mountain; also an important meeting of leaders. <i>Clouds covered the <b>summit</b> of Pikes Peak.</i>"}, {"stem": "Even after scoring the winning goal, Diego stayed <b>modest</b> and told reporters that the whole team deserved the credit. What does <b>modest</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["tired after working very hard", "shy and afraid to speak to people", "not bragging about your own success", "thankful for help from a coach"], "ci": 2, "exp": "<i><b>modest</b></i> (adj.) not bragging about your abilities or success; also, not large. <i>The champion gave a <b>modest</b> smile and thanked her family.</i> Family: modestly (adv.), modesty (n.) Diego gave the credit to others instead of himself."}, {"stem": "From the tree house, Jamal had a new ______ on the backyard: the garden looked like a tiny map from up there.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["obstacle", "perspective", "hypothesis", "sequence"], "ci": 1, "exp": "<i>perspective</i> (n.) a way of seeing or thinking about something, often from a certain position. Seeing the yard from above gave Jamal a new view."}, {"stem": "Water is <b>abundant</b> in the rainforest. Which word means the <b>OPPOSITE</b> of <i>abundant</i>?", "opts": ["generous", "plentiful", "scarce", "ample"], "ci": 2, "exp": "<i>abundant</i> (adj.) existing in large amounts; more than enough. The opposite is <i>scarce</i> (hard to find, not enough). \"Plentiful\" and \"ample\" mean almost the <i>same</i> as abundant. Family: abundance (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Giving up her Saturday to help at the food bank was a ______ choice, but Ana felt proud afterward.", "opts": ["sacrificial", "sacrifice", "sacrificing", "sacrificed"], "ci": 0, "exp": "The blank comes before the noun <i>choice</i>, so it needs an adjective: <i>sacrificial</i> (involving giving something up). <i>sacrifice</i> (n./v.) to give up something you value for something more important. <i>Parents often <b>sacrifice</b> sleep for their babies.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The pool has a sign that <b>prohibits</b> running, so the lifeguard blew her whistle when two kids raced along the edge.", "opts": ["does not allow", "strongly suggests", "makes easier", "sometimes permits"], "ci": 0, "exp": "<i>prohibit</i> (v.) to officially not allow something; to forbid. <i>The library <b>prohibits</b> food near the computers.</i> Family: prohibition (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Scientists measured the ______ of the earthquake to find out just how strong it had been.", "opts": ["incentive", "boundary", "principle", "magnitude"], "ci": 3, "exp": "<i>magnitude</i> (n.) the size, strength, or importance of something. <i>Nobody expected a storm of that <b>magnitude</b>.</i> \"Boundary\" is a dividing line, which cannot tell how strong a quake was.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The bakery became so popular that the owners decided to <b>expand</b> into the empty shop next door. What does <b>expand</b> mean in this sentence?", "opts": ["sell the business", "close for a while", "move to another town", "grow larger"], "ci": 3, "exp": "<i>expand</i> (v.) to become bigger or to make something bigger. <i>A balloon <b>expands</b> when you blow air into it.</i> Taking over the shop next door makes the bakery bigger. Family: expansion (n.), expandable (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The dark clouds and sudden wind <b>indicate</b> that a storm is coming, so the coach ended practice early. What does <b>indicate</b> mean in this sentence?", "opts": ["show or point to", "keep secret", "cause to happen", "stop from happening"], "ci": 0, "exp": "<i>indicate</i> (v.) to show or be a sign of something. <i>A green light <b>indicates</b> that you may go.</i> The clouds do not cause the storm; they are a sign that it is coming. Family: indication (n.), indicator (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"The new stadium has a <b>capacity</b> of 40,000 fans.\" What does <i>capacity</i> mean in this sentence?", "opts": ["a job or role someone has", "a state of being completely full", "a person's ability to learn or do something", "the largest amount something can hold"], "ci": 3, "exp": "<i>capacity</i> has several meanings. Here it means the most that something can hold: the stadium holds up to 40,000 people. <i>The bottle has a <b>capacity</b> of one liter.</i> It can also mean a person's ability (\"a capacity to learn\") or a role (\"in her capacity as coach\"). Family: capable (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "After a month of lessons, Jada became a ______ swimmer who could swim two laps without stopping. Which word best completes the sentence?", "opts": ["fragile", "hostile", "reluctant", "competent"], "ci": 3, "exp": "<i>competent</i> (adj.) able to do something well enough. <i>A <b>competent</b> cook can follow any recipe.</i> Being able to swim two laps shows skill. Family: competence (n.), competently (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The <b>frigid</b> wind made our cheeks sting as we waited for the bus. Which word means the <b>OPPOSITE</b> of <i>frigid</i>?", "opts": ["damp", "icy", "freezing", "sweltering"], "ci": 3, "exp": "<i>frigid</i> (adj.) extremely cold. <i>We wore three layers on the <b>frigid</b> morning.</i> The opposite is <i>sweltering</i> (very hot). \"Icy\" and \"freezing\" mean almost the <i>same</i> as frigid. Family: frigidly (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
