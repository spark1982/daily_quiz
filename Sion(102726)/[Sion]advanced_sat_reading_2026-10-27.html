<script>
var TITLE = "[Sion] Advanced SAT Reading";
var QUIZ_KEY = "sionadvreading";
var INSTRUCTION = "Read each passage and choose the best answer.";
var TODAY_STR = "20261027";
var RAW_QUESTIONS = [{"passage": "In her history of early twentieth-century bridge building, Mara Quist observes that engineers of the period seldom trusted their calculations alone. Before a new span opened to the public, crews would drive dozens of gravel-filled wagons onto the deck and measure how far it sagged, a test designed to ______ the designers&rsquo; predictions with direct physical evidence.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["preclude", "corroborate", "embellish", "disparage"], "ci": 1, "exp": "The test supplies &ldquo;direct physical evidence&rdquo; to check and confirm the calculations, so <i>corroborate</i> (support with evidence) fits. <i>Preclude</i> (prevent) and <i>disparage</i> (belittle) do not describe confirming a prediction, and <i>embellish</i> means to add decorative detail.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "For years, scientists assumed that the Amazon rainforest supplied nearly all of its own nutrients by rapidly recycling fallen leaves. That view struggled to explain how the forest kept its phosphorus, a nutrient that heavy rains constantly wash out of the soil. Satellite measurements later showed that winds carry enormous quantities of mineral dust from the Sahara across the Atlantic each year, and that some of this dust settles over the Amazon. Researchers now suggest that the rainforest&rsquo;s fertility depends partly on a desert thousands of miles away.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It argues that heavy rains are the main source of the Amazon&rsquo;s nutrients.", "It compares two rival theories and concludes that neither is supported by satellite data.", "It presents a long-held assumption, identifies a problem the assumption could not explain, and describes evidence that led to a revised explanation.", "It describes a desert ecosystem and then explains how rainforests differ from it."], "ci": 2, "exp": "The text moves from the old view (self-supplied nutrients), to a puzzle (lost phosphorus), to new satellite evidence and a revised view (Saharan dust). It does not end by rejecting both theories, and rain is described as removing, not supplying, nutrients.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "<table style=\"border-collapse:collapse;font-size:0.9rem;margin-bottom:8px;\"><tr><th style=\"border:1px solid #bbb;padding:4px 8px;\">City</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Daily bus riders before free fares</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Daily bus riders one year after</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Percent change</th></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Avon</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">12,000</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">15,600</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">+30%</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Belmont</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">40,000</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">46,000</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">+15%</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Corley</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">5,000</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">7,500</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">+50%</td></tr></table>Transportation analysts studying three cities that eliminated bus fares argued that free fares produce the largest proportional gains in ridership where ridership was initially low. The data in the table support this view: ______", "stem": "Which choice most effectively uses data from the table to complete the statement?", "opts": ["Avon&rsquo;s daily ridership rose from 12,000 to 15,600 after fares were eliminated.", "Corley, which had the fewest daily riders before fares were eliminated, saw the largest percent increase, 50%.", "Belmont gained 6,000 daily riders, more than either of the other two cities.", "All three cities had more daily bus riders one year after fares were eliminated."], "ci": 1, "exp": "The claim concerns <i>proportional</i> gains and <i>initially low</i> ridership, so the answer must link the lowest starting city to the largest percent change. Belmont&rsquo;s gain is the largest in raw numbers but the smallest in percent, which works against the claim.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "Critics often call the novelist&rsquo;s prose plain, but literary scholar Daniel Osei argues that the plainness is deceptive. The short declarative sentences seem artless, he contends, yet each is carefully ______: its length and stresses are chosen so that the paragraph slows the reader at moments of grief and quickens at moments of danger.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["exaggerated", "calibrated", "improvised", "obscured"], "ci": 1, "exp": "The contrast &ldquo;seem artless, yet&rdquo; and the explanation that length and stresses &ldquo;are chosen&rdquo; point to precise adjustment, so <i>calibrated</i> fits. <i>Improvised</i> is the opposite of carefully chosen, and nothing suggests the sentences are hidden or overstated.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "When fire destroyed the wooden roof frame of Notre-Dame Cathedral in Paris in 2019, some architects proposed replacing it with steel or concrete, materials that would be lighter and less flammable. The restoration team instead chose to rebuild the frame from oak beams shaped largely by hand with axes, following medieval methods. Supporters of the decision argued that the original frame had survived for centuries and that the craft of building it was itself part of the cathedral&rsquo;s heritage, worth preserving alongside the structure.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To describe how the 2019 fire started and spread through the cathedral", "To explain why restorers chose a traditional method of rebuilding despite modern alternatives", "To criticize architects who proposed modern materials for the new roof", "To argue that steel and concrete are unsafe materials for large buildings"], "ci": 1, "exp": "The text sets up the modern proposal, then explains the team&rsquo;s choice of hand-shaped oak and the reasons for it. It does not claim steel is unsafe, explain the fire&rsquo;s cause, or attack the other architects.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "After gray wolves were reintroduced to Yellowstone National Park in 1995, willows along some streams grew taller for the first time in decades. One ecologist hypothesizes that the recovery occurred mainly because elk began avoiding places where wolves could easily ambush them, not simply because wolves reduced the total number of elk.", "stem": "Which finding, if true, would most directly support the ecologist&rsquo;s hypothesis?", "opts": ["The total elk population in the park declined steadily after 1995.", "Willows recovered most in areas with poor visibility and few escape routes for elk, even where elk numbers were similar to those in other areas.", "Wolves in Yellowstone hunt deer and bison as well as elk.", "Willows grew taller in years with more rainfall, whether or not wolves were present."], "ci": 1, "exp": "The hypothesis is about elk <i>behavior</i> (avoiding risky spots) rather than elk <i>numbers</i>. Recovery concentrated in risky places, with elk numbers held similar, isolates behavior. A declining elk population fits the rival explanation instead.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "<strong>Text 1</strong><br>Historians have long credited the printing press with the rapid rise of literacy in Europe after the 1450s. By making books far cheaper than hand-copied manuscripts, the press, in this view, gave ordinary people a reason and a means to learn to read.<br><br><strong>Text 2</strong><br>Studying records of early print shops, one economic historian found that printers overwhelmingly set up business in towns that already had universities, schools, and active book trades. Literacy rates in those towns had begun climbing before the presses arrived. Printers, the historian concludes, went where readers already were.", "stem": "Based on the texts, how would the historian in Text 2 most likely respond to the view described in Text 1?", "opts": ["By claiming that universities opposed the spread of printing presses", "By agreeing that cheaper books were the main reason ordinary people learned to read", "By suggesting that the press may have followed an existing demand for reading rather than creating it", "By arguing that hand-copied manuscripts were more widely read than printed books"], "ci": 2, "exp": "Text 2 shows that presses clustered where literacy was already rising, which challenges the cause-and-effect order in Text 1. Nothing in Text 2 praises manuscripts or says universities resisted printing.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "At an ancient village site in northern China, archaeologists found chemical residue from millet in many cooking pots. Surprisingly, they found almost no millet seeds in the surrounding soil. The researchers note that millet grains are tiny and fragile, that they were usually cooked into porridge, and that uncharred seeds decay quickly in damp ground. This suggests that ______", "stem": "Which choice most logically completes the text?", "opts": ["millet was eaten only on rare ceremonial occasions at the site.", "the residue in the pots must have come from a different grain that resembles millet.", "the villagers grew millet but traded all of it to neighboring settlements.", "the scarcity of seeds in the soil does not, on its own, show that the villagers rarely ate millet."], "ci": 3, "exp": "The researchers list reasons seeds would not survive (tiny, cooked, quickly decaying), which explains the missing seeds without contradicting the residue evidence. The other choices assume the missing seeds mean millet was absent or rare, the very conclusion the reasons undercut.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Many fig species can be pollinated only by a single species of tiny wasp. The female wasp crawls into a developing fig, pollinates the flowers inside, and lays her eggs there; her offspring hatch, mate, and carry pollen to a new fig. Each partner depends entirely on the other to reproduce. <u>Yet this partnership is more fragile than it appears.</u> Because many fig wasps live only a day or two after leaving their fig, even a modest rise in temperature can kill them before they reach a new tree, leaving both species without a way to reproduce.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It introduces a weakness in the mutually dependent relationship that the text has just described.", "It offers a solution to the problem of rising temperatures discussed later in the text.", "It questions whether fig wasps actually pollinate fig flowers.", "It summarizes the reproductive process described in the preceding sentences."], "ci": 0, "exp": "The sentence pivots with &ldquo;Yet&rdquo; from describing the partnership to explaining why it can fail (short wasp lifespans and heat). It does not summarize, propose a solution, or doubt that wasps pollinate figs.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Many songbirds living in cities sing at higher pitches than members of the same species living in forests. One explanation is that traffic produces mostly low-frequency noise, which drowns out low notes; birds that sing higher are more likely to be heard by mates and rivals. If this explanation is correct, then ______", "stem": "Which choice most logically completes the text?", "opts": ["city birds should sing louder but not at higher pitches than forest birds.", "forest birds should sing at higher pitches than city birds during the breeding season.", "birds that sing low notes should be more successful at attracting mates in cities.", "birds of the same species should tend to sing lower in quiet areas than in places with heavy low-frequency noise."], "ci": 3, "exp": "The explanation ties higher pitch to low-frequency noise, so where that noise is absent, birds would have no reason to shift upward and should sing lower. The low-notes choice reverses the logic: low notes are the ones that get drowned out.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Before 1956, loading a cargo ship was slow and costly: dockworkers carried sacks, barrels, and crates aboard one at a time, and a ship could spend more days in port than at sea. That year, trucking businessman Malcolm McLean sent a converted tanker from New Jersey to Texas carrying fifty-eight identical metal boxes that cranes could lift directly from truck beds onto the deck. Because standard containers could be moved between trucks, trains, and ships without being unpacked, the cost of loading cargo fell dramatically, and shipping goods across oceans became cheap enough to reshape global trade.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To explain how a seemingly simple innovation sharply reduced shipping costs and transformed international trade", "To compare the advantages of trucks, trains, and ships for moving cargo", "To argue that dockworkers were responsible for the high cost of shipping before 1956", "To describe the engineering challenges of converting a tanker into a cargo ship"], "ci": 0, "exp": "The text contrasts slow pre-1956 loading with McLean&rsquo;s standard boxes and ends with their effect on trade, so its purpose is to explain the innovation&rsquo;s impact. It does not blame workers, rank transport types, or focus on the ship&rsquo;s conversion.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "<strong>Text 1</strong><br>Some astronomers argue that a large, undiscovered planet orbits far beyond Neptune. Their evidence is that several small icy objects in the outer solar system have orbits that appear to cluster, pointing in similar directions, as if something massive were pulling them into alignment.<br><br><strong>Text 2</strong><br>Other researchers caution that telescopes surveying the outer solar system can look only at certain regions of the sky, at certain times of year, and in directions not washed out by the Milky Way. When these researchers accounted for where surveys had and had not searched, the apparent clustering largely disappeared.", "stem": "Based on the texts, how would the researchers in Text 2 most likely respond to the reasoning in Text 1?", "opts": ["They would argue that the clustering may reflect where telescopes have looked rather than the pull of an unseen planet.", "They would agree that the clustering proves a large planet exists beyond Neptune.", "They would argue that the Milky Way&rsquo;s gravity causes the icy objects&rsquo; orbits to align.", "They would claim that the icy objects described in Text 1 do not actually exist."], "ci": 0, "exp": "Text 2 says that once survey limits are taken into account, &ldquo;the apparent clustering largely disappeared,&rdquo; so the pattern may be an observational artifact. Text 2 does not deny the objects exist, and the Milky Way is mentioned only as something that blocks the view, not as a gravitational cause.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
