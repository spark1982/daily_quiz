<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }

  #options { display:flex; flex-direction:column; gap:10px; }

  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }

  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }

  .modal-no { background:#eef2f7; color:#333; }

</style>

<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Sion] Deca Cluster Quiz</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>

</div>

<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20260925";
var RAW_QUESTIONS = [
{"stem": "A lending company plans to share customers' personal financial data with a marketing partner. Which legal issue must it address first?", "opts": ["Minimum wage laws for its employees", "Data privacy laws that require proper notice, consent, and protection of customers' personal information", "Copyright rules for the company's logo", "Zoning laws for its office building"], "ci": 1, "exp": "Handling personal financial information raises privacy and data-protection requirements, such as disclosure and consent. Copyright, wage, and zoning laws do not govern sharing customer data."},
{"stem": "A U.S. auto-parts maker sells to customers in Canada and Mexico under the United States-Mexico-Canada Agreement (USMCA). What is the most likely impact of this trade agreement on the company?", "opts": ["Higher taxes on all goods sold in Canada and Mexico", "Lower or eliminated tariffs on qualifying goods, making its products easier to sell across the three countries", "No change, because trade agreements apply only to farm products", "A ban on exporting any products outside the United States"], "ci": 1, "exp": "Trade alliances like the USMCA reduce trade barriers such as tariffs among member nations, which can expand markets for businesses. They do not ban exports or raise taxes across the board, and they cover many industries."},
{"stem": "A manager asks Jordan to write a one-page report on last week's customer complaints. Which structure is most appropriate for a simple written report?", "opts": ["A list of every email he received, in random order", "A clear purpose statement, the key findings, and a brief conclusion or recommendation", "Only a title, with no details", "A long personal story about his week"], "ci": 1, "exp": "Simple reports should state their purpose, present the main facts or findings in an organized way, and end with a conclusion or recommendation. Personal stories, random lists, and missing details make a report unusable."},
{"stem": "Maya, a junior analyst at Brightwater Credit Union, needs to pull every customer record whose last name begins with \"Mc\" from the member database. Which query technique should she use?", "opts": ["An exact-match search for the text \"Mc\" only", "Sorting the entire table alphabetically and scrolling through it", "Deleting all records that do not start with \"Mc\"", "A wildcard character, such as searching for last names matching \"Mc%\""], "ci": 3, "exp": "Wildcards stand in for unknown characters, so \"Mc%\" returns every name that starts with \"Mc\" no matter what follows. An exact match would only find the literal value \"Mc,\" scrolling is slow and error-prone, and deleting records destroys data."},
{"stem": "Greenleaf Landscaping bills 400 customers on the first day of every month. Which accounting-software feature would save the most time?", "opts": ["Manual entry of each invoice one at a time", "A spell-checker for customer letters", "Batch invoicing, which creates and sends many invoices at once", "A payroll calculator for employee wages"], "ci": 2, "exp": "Batch invoicing generates a large group of invoices in a single process, which is ideal for regular monthly billing. Manual entry is slow, and payroll or spell-check tools do not address invoicing."},
{"stem": "Keisha enjoys working with numbers, is detail-oriented, and likes helping people plan for the future. Before choosing a finance career path, what should she do first?", "opts": ["Pick whatever career her friends are choosing", "Assess her interests and skills and compare them to the requirements of specific finance careers", "Choose the job with the highest starting salary without further research", "Avoid career assessments because they are never useful"], "ci": 1, "exp": "A self-assessment of interests and skills helps match a person to careers where she is likely to succeed and be satisfied. Choosing by salary alone or by peer choices ignores personal fit."},
{"stem": "Summit Ridge Insurance collects claim data from phone calls, emails, and web forms but stores it in separate systems that do not connect. Which information-management goal would best address this problem?", "opts": ["Collecting even more data from additional channels", "Printing every record and filing it in cabinets", "Allowing each department to keep its own private copy of the data", "Integrating the data into one organized, accessible system so employees can find accurate information quickly"], "ci": 3, "exp": "Information management aims to collect, organize, store, and share information so it is accurate and usable. Connecting the scattered systems solves the real problem; adding more data, printing, or keeping separate copies makes it worse."},
{"stem": "Which feature is a key component of a well-governed company?", "opts": ["Financial reports shared only with top executives", "No written policies, so managers can act freely", "A CEO who also chairs the board and approves his own pay without review", "An independent audit function that reviews financial reports for accuracy"], "ci": 3, "exp": "Well-governed companies rely on independent audits, a board that oversees management, and transparent reporting. Concentrated unchecked power, secret reporting, and missing policies are signs of weak governance."},
{"stem": "Daniel, a U.S. account manager, is preparing a video call with a new banking partner in Japan. Which step would best help him communicate effectively across cultures?", "opts": ["Assume the partner will adapt to American customs", "Use American sports expressions to seem friendly and relaxed", "Speak faster so that the meeting stays short", "Research the partner's business customs, speak clearly without slang, and confirm key points in a written follow-up"], "ci": 3, "exp": "Cross-cultural communication improves when you learn the other culture's norms, avoid idioms that may not translate, and confirm understanding in writing. Slang, rushing, and expecting others to adapt all increase misunderstanding."},
{"stem": "Before closing out the cash drawer each night, a bank teller follows the same written checklist in the same order: count the cash, match receipts, record totals, and lock the drawer. This is an example of", "opts": ["systematic behavior", "impulsive behavior", "delegation", "procrastination"], "ci": 0, "exp": "Systematic behavior means following an organized, step-by-step method every time, which reduces errors. The teller is not acting on impulse, handing off the job, or delaying it."},
{"stem": "Rachel, age 30, wants affordable life insurance that covers her family only until her children finish college, about 20 years from now. Which type of policy best fits her needs?", "opts": ["Term life insurance", "Universal life insurance", "Whole life insurance with a large cash-value component", "No insurance, because she is young"], "ci": 0, "exp": "Term life insurance provides coverage for a set period at a lower cost, which fits a temporary need. Universal and whole life are permanent policies that cost more because they build cash value."},
{"stem": "Tyler, a finance intern, wants to build strong professional relationships in the industry. Which action is most effective?", "opts": ["Only talking to people inside his own department", "Sending the same generic message to hundreds of strangers online", "Waiting until he needs a job before contacting anyone", "Joining a professional finance association and following up with contacts he meets at its events"], "ci": 3, "exp": "Professional associations provide networking events, mentors, and industry knowledge, and following up turns contacts into relationships. Mass messages, staying isolated, and waiting until you need help are weak strategies."},
{"stem": "A bank uses software that flags any wire transfer over $10,000 sent to a list of high-risk countries, following fixed \"if-then\" rules. What type of reasoning does this compliance tool use?", "opts": ["Symbolic (rule-based) reasoning", "Emotional reasoning based on feelings", "Contextual reasoning that interprets meaning from surrounding patterns", "Random sampling with no rules"], "ci": 0, "exp": "Symbolic reasoning applies explicit, predefined rules, such as \"if amount > $10,000 and destination is on the list, then flag it.\" Contextual reasoning instead weighs patterns and context to judge meaning."},
{"stem": "A financial advisor learns that recommending a certain fund would earn her a larger commission, even though a lower-cost fund better fits her client's goals. Which choice reflects ethical behavior?", "opts": ["Recommending the higher-commission fund without telling the client", "Letting the client guess which fund is better", "Recommending the fund that best serves the client and disclosing any conflict of interest", "Refusing to recommend any fund at all"], "ci": 2, "exp": "Ethics means acting honestly and fairly, which here means putting the client's interests first and being transparent about conflicts. Hiding the conflict is dishonest, and refusing to help or leaving the client guessing fails the advisor's duty."},
{"stem": "A small investment advisory firm wants to reduce the chance of being sued by clients. Which legal consideration is most important for its risk-management plan?", "opts": ["Following industry regulations and keeping clear, written client agreements and disclosures", "Avoiding written records so there is less evidence", "Ignoring new regulations until a lawsuit is filed", "Promising clients guaranteed returns to keep them happy"], "ci": 0, "exp": "Complying with laws and documenting agreements and disclosures reduces legal risk. Destroying records, guaranteeing returns, and ignoring regulations all increase legal exposure."},
{"stem": "The board of directors at Clearview Bank requires that any loan over $5 million be approved by a credit committee before it is issued. How does this governance process affect management?", "opts": ["It removes all risk from the bank's lending", "It creates a structured, accountable approval step that guides and limits large decisions", "It lets the board avoid responsibility for lending decisions", "It allows managers to approve any loan without review"], "ci": 1, "exp": "Governance processes set rules for who can make decisions and how, adding accountability and oversight. They do not give unlimited authority, cannot remove all risk, and actually increase board responsibility."},
{"stem": "A bank's risk managers discover that a popular loan product could harm low-income borrowers, even though it is technically legal and profitable. What role should ethics play in their decision?", "opts": ["Ethics should guide them to weigh the harm to borrowers and the bank's reputation, not just legality and profit", "Ethics does not matter as long as the product is legal", "They should hide the concern to protect profits", "They should wait for a lawsuit before acting"], "ci": 0, "exp": "Ethical risk management considers fairness, stakeholder harm, and long-term reputation, not only what is legal today. Ignoring or hiding the problem increases both ethical and business risk."},
{"stem": "The operations manager at Harbor Point Furniture asks the accounting team for a monthly report comparing each factory line's actual costs to its budget so she can decide where to cut waste. This report is an example of", "opts": ["tax accounting prepared for the IRS", "managerial accounting", "financial accounting prepared for outside investors", "auditing performed by an outside CPA firm"], "ci": 1, "exp": "Managerial accounting produces internal, decision-focused reports for managers, such as budget-versus-actual comparisons. Financial accounting targets outside users, tax accounting targets tax authorities, and auditing is an independent review."},
{"stem": "After a presentation that did not go as planned, a new bank teller named Luis tells himself, \"I made mistakes, but I also did several things well, and I can improve.\" This attitude best shows", "opts": ["arrogance about his abilities", "a lack of motivation", "healthy self-esteem and self-acceptance", "an unwillingness to accept feedback"], "ci": 2, "exp": "Self-acceptance means recognizing both strengths and weaknesses without harsh self-judgment, which supports healthy self-esteem and growth. Luis is not boasting, he is motivated to improve, and he is open to learning."},
{"stem": "The marketing department at Pinecrest Bank notices that its reports use different formats for dates, numbers, and headings. What is the best solution?", "opts": ["Use as many fonts as possible to make reports interesting", "Let each writer choose any format they like", "Stop writing reports altogether", "Adopt a style manual so that all writers follow the same formatting and usage rules"], "ci": 3, "exp": "A style manual sets consistent rules for grammar, formatting, and usage, which makes business documents clear and professional. The other choices increase inconsistency or remove needed communication."}
];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
