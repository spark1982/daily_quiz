<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Advanced SAT Reading</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#185FA5;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;min-height:1px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:10px 0;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:140px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.q-tag{display:inline-block;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.passage-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.88rem;color:#222;line-height:1.6;max-height:260px;overflow-y:auto;}
.context-label{font-size:0.92rem;font-weight:600;color:#333;margin-bottom:8px;line-height:1.4;}
.context-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;line-height:1.6;}
.q-text{font-size:1.05rem;font-weight:700;color:#111;margin-bottom:12px;line-height:1.5;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;}
.hint-btn{background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block;}
.hint-box{background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none;}
.hint-box.show{display:block;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}

.timer-box.warn{color:#E24B4A;}

.pause-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.96);z-index:90;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:#185FA5;}

.frac .den{border-top:1.4px solid #111;}

<body>
<div class="title-hd">[Sion] Advanced SAT Reading</div>

  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal(false)" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){
var TITLE = "[Sion] Advanced SAT Reading";

var TAG_COLORS = {"Information and Ideas": "#185FA5", "Command of Evidence": "#1D9E75", "Inferences": "#f5a623", "Words in Context": "#7b61ff", "Craft and Structure": "#E24B4A", "Text Structure and Purpose": "#0d9488", "Cross-Text Connections": "#d6336c", "Expression of Ideas": "#495057"};
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
var RAW_QUESTIONS = [{"stem": "Which choice best supports the claim that remote employees can be as productive, or more productive, than in-office employees?", "opts": ["The general claim that proponents of remote work exist", "The specific statistic showing call center agents completed 13.5 percent more calls per shift from home", "The fact that the study lasted two years", "The mention that call centers are commonly studied by researchers"], "ci": 1, "exp": "A specific, measurable statistic — 13.5 percent more calls completed — provides concrete evidence for the productivity claim, unlike the more general statements offered in the other choices.", "tag": "Command of Evidence", "tagcolor": "#1D9E75", "passage": "Proponents of remote work often claim that productivity actually increases when employees work from home. One two-year study tracking a call center found that agents working from home completed 13.5 percent more calls per shift than their in-office counterparts, an increase researchers attributed largely to a quieter, less interrupted work environment."}, {"stem": "How is the text structured?", "opts": ["It presents two competing theories and evaluates which one is correct.", "It describes a sequence of research stages that build on one another in chronological order.", "It compares coral reefs in different oceans without discussing any research process.", "It opens with a conclusion and then works backward to justify it."], "ci": 1, "exp": "The text moves step by step through a research process — satellite survey, then on-site verification, then model calibration — showing a clear chronological structure.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488", "passage": "A 2019 study first surveyed thousands of coral reefs using satellite imagery to identify likely bleaching events. Researchers then dispatched dive teams to the twenty reefs showing the most severe satellite signals, collecting water temperature and coral tissue samples on-site. Finally, they compared their in-person findings against the satellite predictions to calibrate a more accurate early-warning model for future bleaching events."}, {"stem": "Which choice best describes the function of the phrase \"the debate was not fully settled until researchers used tiny radar transponders\" in the text?", "opts": ["It introduces a new controversy that remains unresolved to this day.", "It marks the turning point at which lingering scientific doubt was finally overcome by direct evidence.", "It suggests that von Frisch's original research was fundamentally flawed.", "It shows that most biologists never accepted the existence of the waggle dance."], "ci": 1, "exp": "The phrase signals the moment when a long-standing scientific uncertainty was conclusively resolved through a new experimental method, which is the key structural turn in the passage.", "tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "For decades, biologists debated whether the waggle dance of honeybees actually conveyed precise spatial information or merely excited nearby bees without transmitting real directions. Karl von Frisch's meticulous decoding of the dance's angle and duration persuaded many skeptics, but the debate was not fully settled until researchers used tiny radar transponders to track bees departing after watching a dance: the foragers flew directly to the exact patch of flowers the dance had indicated, even when researchers moved the hive to trick them."}, {"stem": "The mention of a \"quieter, less interrupted work environment\" primarily serves to", "opts": ["contradict the study's main finding about productivity", "offer a possible explanation for why remote productivity increased in the study", "prove that in-office work environments are always too noisy to be productive", "suggest that the study's results cannot be trusted"], "ci": 1, "exp": "This phrase gives a plausible reason behind the observed increase in productivity, functioning as an explanation rather than a contradiction or a criticism of the study.", "tag": "Command of Evidence", "tagcolor": "#1D9E75", "passage": "Proponents of remote work often claim that productivity actually increases when employees work from home. One two-year study tracking a call center found that agents working from home completed 13.5 percent more calls per shift than their in-office counterparts, an increase researchers attributed largely to a quieter, less interrupted work environment."}, {"stem": "It can most reasonably be inferred from the text that swim bladders would be a disadvantage for deep-sea fish because", "opts": ["gas-filled organs would be dangerously compressed or expanded by the extreme pressure changes at great depths.", "lipids are more difficult for a fish's body to produce than gas.", "swim bladders make fish more visible to predators in dark water.", "shallow-water fish do not need to control their buoyancy at all."], "ci": 0, "exp": "Since deep-sea fish rely on lipids instead of gas-filled organs, and the text notes that rapid pressure changes damage their organs, it follows that a gas-filled swim bladder would react poorly to the extreme pressure changes found at great depths.", "tag": "Inferences", "tagcolor": "#f5a623", "passage": "Many deep-sea fish lack swim bladders, the gas-filled organs that most shallow-water fish use to control buoyancy. Instead, their bodies contain higher concentrations of lipids, substances less dense than water, distributed evenly throughout their muscle tissue. When brought rapidly to the surface, these fish often cannot compensate for the drastic pressure change, and their organs may become severely damaged."}, {"stem": "What is the main purpose of the text?", "opts": ["To argue that satellite imagery is completely unreliable for studying coral reefs", "To explain how researchers refined a predictive model for coral bleaching using multiple methods in sequence", "To describe the life cycle of coral polyps in tropical waters", "To criticize the cost of sending dive teams to study coral reefs"], "ci": 1, "exp": "The passage's purpose is to walk through how researchers combined satellite data and on-site verification to build a better predictive model, which this option states directly.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488", "passage": "A 2019 study first surveyed thousands of coral reefs using satellite imagery to identify likely bleaching events. Researchers then dispatched dive teams to the twenty reefs showing the most severe satellite signals, collecting water temperature and coral tissue samples on-site. Finally, they compared their in-person findings against the satellite predictions to calibrate a more accurate early-warning model for future bleaching events."}, {"stem": "Based on the two texts, how would Historian B most likely respond to Historian A's claim about the printing press?", "opts": ["By agreeing entirely that the printing press alone caused the Reformation", "By arguing that underlying social and political discontent, not the technology itself, was the primary cause", "By denying that the printing press had any effect on the spread of Luther's ideas", "By claiming that Luther's ideas would never have spread without the printing press"], "ci": 1, "exp": "Historian B's passage explicitly states that discontent had already \"primed much of Europe for reform\" and that the press only \"accelerated\" a movement that was already underway, which directly counters Historian A's emphasis on the technology.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "<strong>Text 1</strong><br>Historian A argues that the printing press was the single most important catalyst for the Protestant Reformation, since it allowed Martin Luther's ideas to spread across Europe within weeks rather than years, reaching ordinary readers who had never before had direct access to religious texts.<br><br><strong>Text 2</strong><br>Historian B contends that social and political discontent with the Catholic Church's wealth and corruption had already primed much of Europe for reform decades before Luther, and that the printing press merely accelerated a movement that popular resentment would have produced through other means."}, {"stem": "The author's reference to researchers moving the hive \"to trick them\" mainly serves to", "opts": ["highlight the cruelty of the experimental method used on the bees.", "emphasize the rigor of the experiment by showing that an alternative explanation was ruled out.", "suggest that the bees were confused and unable to complete their task.", "argue that von Frisch's decoding of the dance was ultimately incorrect."], "ci": 1, "exp": "By moving the hive, researchers eliminated the possibility that bees were simply returning to a remembered location rather than following the dance's directions, which strengthens the experiment's conclusions.", "tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "For decades, biologists debated whether the waggle dance of honeybees actually conveyed precise spatial information or merely excited nearby bees without transmitting real directions. Karl von Frisch's meticulous decoding of the dance's angle and duration persuaded many skeptics, but the debate was not fully settled until researchers used tiny radar transponders to track bees departing after watching a dance: the foragers flew directly to the exact patch of flowers the dance had indicated, even when researchers moved the hive to trick them."}, {"stem": "Which choice best describes a key difference between the two historians' perspectives?", "opts": ["Historian A emphasizes a technological cause, while Historian B emphasizes a social and political cause.", "Historian A focuses on economic factors, while Historian B focuses on religious doctrine.", "Historian A believes the Reformation never truly succeeded, while Historian B believes it did.", "Historian A and Historian B agree on every major point about the Reformation's causes."], "ci": 0, "exp": "Historian A's argument centers on the printing press as a technological catalyst, while Historian B's argument centers on pre-existing social and political discontent, making this the central point of disagreement.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "<strong>Text 1</strong><br>Historian A argues that the printing press was the single most important catalyst for the Protestant Reformation, since it allowed Martin Luther's ideas to spread across Europe within weeks rather than years, reaching ordinary readers who had never before had direct access to religious texts.<br><br><strong>Text 2</strong><br>Historian B contends that social and political discontent with the Catholic Church's wealth and corruption had already primed much of Europe for reform decades before Luther, and that the printing press merely accelerated a movement that popular resentment would have produced through other means."}, {"stem": "As used in the text, \"equivocal\" most nearly means", "opts": ["clearly successful", "ambiguous or mixed", "completely disastrous", "widely celebrated"], "ci": 1, "exp": "The passage describes benefits for some commuters and losses for others, which is a mixed or ambiguous result rather than a clearly positive or negative one — the meaning of \"equivocal.\"", "tag": "Words in Context", "tagcolor": "#7b61ff", "passage": "City officials initially praised the new transit line as an unqualified triumph, but ridership data released a year later revealed a far more <u>equivocal</u> outcome: while commuters near downtown stations benefited enormously from faster travel times, residents in outlying neighborhoods saw bus service cut to help fund the new line, leaving them with longer and more expensive commutes than before."}, {"stem": "The text suggests that lipids are advantageous for deep-sea fish primarily because they", "opts": ["provide buoyancy without requiring a gas-filled cavity that would be affected by changes in pressure.", "allow fish to swim much faster than fish with swim bladders.", "make deep-sea fish immune to all effects of pressure change.", "are only useful very close to the ocean's surface."], "ci": 0, "exp": "The passage contrasts gas-filled swim bladders with lipid-based buoyancy, implying that lipids let deep-sea fish control buoyancy without the pressure-related risks that a gas-filled organ would face.", "tag": "Inferences", "tagcolor": "#f5a623", "passage": "Many deep-sea fish lack swim bladders, the gas-filled organs that most shallow-water fish use to control buoyancy. Instead, their bodies contain higher concentrations of lipids, substances less dense than water, distributed evenly throughout their muscle tissue. When brought rapidly to the surface, these fish often cannot compensate for the drastic pressure change, and their organs may become severely damaged."}, {"stem": "Which choice provides the best evidence for the meaning of \"equivocal\" as used in the text?", "opts": ["\"City officials initially praised the new transit line as an unqualified triumph\"", "\"ridership data released a year later\"", "\"commuters near downtown stations benefited enormously\" contrasted with residents facing \"longer and more expensive commutes\"", "\"the new transit line\""], "ci": 2, "exp": "The direct contrast between downtown commuters benefiting and outlying residents losing service is what makes the outcome mixed, or equivocal, rather than a simple success.", "tag": "Words in Context", "tagcolor": "#7b61ff", "passage": "City officials initially praised the new transit line as an unqualified triumph, but ridership data released a year later revealed a far more <u>equivocal</u> outcome: while commuters near downtown stations benefited enormously from faster travel times, residents in outlying neighborhoods saw bus service cut to help fund the new line, leaving them with longer and more expensive commutes than before."}];
var DEBATE_MODE = false;
var TIMED = false;
var TIME_LIMIT = 40;
var TTS_LANG = "ko-KR";

var order = [];
var state = {};
var hintShown = false;
var paused = false;
var timerHandle = null;

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }
function incAttempts(){ localStorage.setItem(ATT_KEY, loadAttempts()+1); }

function defaultOrder(){ var a=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) a.push(i); return a; }

function resetState(randomOrder){
  order = defaultOrder();
  if (randomOrder) {
    for (var k=order.length-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=order[k]; order[k]=order[j]; order[j]=t; }
  }
  state = { cur:0, answers:{}, shuffles:{}, showResults:false, order:order.slice() };
  if (TIMED) {
    state.timers = {};
    for (var i=0;i<RAW_QUESTIONS.length;i++) state.timers[i] = { remaining: TIME_LIMIT, timedOut:false, running:false };
  }
}

function loadState(){
  try {
    var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.order) {
      state = s;
      order = s.order;
    } else {
      resetState(false);
    }
  } catch(e) {
    localStorage.removeItem(LS_KEY);
    resetState(false);
  }
}

function saveState(){
  state.order = order;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function getShuffle(qi){
  if (!state.shuffles[qi]) {
    var n = RAW_QUESTIONS[qi].opts.length;
    var a = []; for (var i=0;i<n;i++) a.push(i);
    for (var k=n-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[qi] = a;
  }
  return state.shuffles[qi];
}
function getCSI(qi){ return getShuffle(qi).indexOf(RAW_QUESTIONS[qi].ci); }

function isTimedOut(qi){ return TIMED && state.timers && state.timers[qi] && state.timers[qi].timedOut; }
function isAnswered(qi){ return state.answers[qi] !== undefined || isTimedOut(qi); }
function isCorrectAns(qi){ return state.answers[qi] !== undefined && state.answers[qi] === getCSI(qi); }

function updateNav(){
  var ans = 0;
  for (var p=0;p<order.length;p++) if (isAnswered(order[p])) ans++;
  document.getElementById('nav-count').textContent = ans + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (order.length? (ans/order.length*100):0).toFixed(1) + '%';
  renderDots();
}

function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'none' || !p.style.display) {
    p.style.display = 'block'; b.innerHTML = 'Hide &#9652;'; renderDots();
  } else {
    p.style.display = 'none'; b.innerHTML = 'Jump &#9662;';
  }
}

function renderDots(){
  var p = document.getElementById('dot-panel');
  if (p.style.display === 'none' || !p.style.display) return;
  var h = '';
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var bg = !isAnswered(qi) ? '#d7dde6' : (isCorrectAns(qi) ? '#185FA5' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+qi+')">' + (pos+1) + '</span>';
  }
  var allAns = true;
  for (var pos2=0; pos2<order.length; pos2++) if (!isAnswered(order[pos2])) { allAns = false; break; }
  if (allAns && order.length>0) {
    h += '<br><span onclick="finishQuiz()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}

function goToQ(qi){
  var pos = order.indexOf(qi);
  if (pos === -1) pos = 0;
  state.cur = pos; state.showResults = false; saveState(); render();
  document.getElementById('dot-panel').style.display = 'none';
  document.getElementById('jump-btn').innerHTML = 'Jump &#9662;';
}

function speak(text, lang){
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function speakCurrent(){
  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  if (q && q.tts) speak(q.tts, TTS_LANG);
}
window.speakCurrent = speakCurrent;

function updateAttDisplay(){ /* no-op placeholder for subtitle; title fixed */ }



function render(){
  if (state.showResults) { renderResults(); return; }
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  updateNav();

  var pos = state.cur;
  var qi = order[pos];
  var q = RAW_QUESTIONS[qi];

  document.getElementById('q-num').textContent = 'Question ' + (pos+1) + ' of ' + order.length;


  var tagEl = document.getElementById('q-tag-label');
  if (q.tag) {
    tagEl.style.display = 'inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#185FA5';
  } else {
    tagEl.style.display = 'none';
  }


  var pb = document.getElementById('passage-box');
  if (q.passage) { pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; }



  document.getElementById('q-text').innerHTML = q.stem;
  var ttsBtn = document.getElementById('tts-btn');
  if (q.tts) { ttsBtn.style.display = 'inline-block'; } else { ttsBtn.style.display = 'none'; }

  var sh = getShuffle(qi);
  var ans = state.answers[qi];
  var csi = getCSI(qi);
  var timedOut = TIMED && state.timers[qi] && state.timers[qi].timedOut;
  var html = '';
  for (var s=0; s<sh.length; s++) {
    var oi = sh[s];
    var cls = 'opt-btn';
    var dis = '';
    if (ans !== undefined || timedOut) {
      dis = 'disabled';
      if (s === csi) cls += ' correct';
      else if (s === ans) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+qi+','+s+')">' + q.opts[oi] + '</button>';
  }
  document.getElementById('opts-area').innerHTML = html;



  var eb = document.getElementById('exp-box');
  if ((ans !== undefined && ans !== csi) || timedOut) {
    eb.style.display = 'block';
    eb.textContent = q.exp;
  } else {
    eb.style.display = 'none';
  }

  document.getElementById('next-btn').textContent = (pos === order.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (pos === 0);


}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  if (TIMED && state.timers[qi] && state.timers[qi].timedOut) return;
  state.answers[qi] = si;

  saveState(); render();
}

function finishQuiz(){
  state.showResults = true;
  incAttempts();
  saveState(); render(); reportResult();
}

function goNext(){
  if (state.cur === order.length-1) { finishQuiz(); return; }
  state.cur = Math.min(order.length-1, state.cur+1);
  saveState(); render();
}

function go(dir){

  if (dir === 1) {
    if (state.cur === order.length - 1) {
      state.showResults = true; incAttempts(); saveState(); render(); reportResult();
      return;
    }
    state.cur = Math.min(order.length-1, state.cur+1);
    saveState(); render();
    return;
  }
  state.cur = Math.max(0, state.cur-1);
  saveState(); render();
}

function renderResults(){
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';

  updateNav();

  var c=0,w=0,sk=0;
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (!isAnswered(qi)) sk++;
    else if (isCorrectAns(qi)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;' +
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;' +
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html = '';
  for (var pos2=0; pos2<order.length; pos2++) {
    var qi2 = order[pos2];
    var label,bg,tc;
    if (!isAnswered(qi2)) { label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (isCorrectAns(qi2)) { label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label = isTimedOut(qi2) ? 'Timed Out' : 'Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var stemText = String(RAW_QUESTIONS[qi2].stem).replace(/<[^>]*>/g,'').substring(0,60);
    html += '<div class="results-card" onclick="goToQ('+qi2+')">' +
      '<span style="font-size:0.95rem;font-weight:600;color:#333;">Q'+(pos2+1)+'. '+stemText+'</span>' +
      '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>' +
      '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function retryWrong(){
  var wrongQi = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      wrongQi.push(qi);
    }
  }
  if (wrongQi.length === 0) return;
  for (var i=0;i<wrongQi.length;i++) {
    delete state.answers[wrongQi[i]];
    delete state.shuffles[wrongQi[i]];
    if (TIMED && state.timers) { state.timers[wrongQi[i]] = { remaining: TIME_LIMIT, timedOut:false, running:false }; }
  }
  order = wrongQi;
  state.order = order;
  state.cur = 0; state.showResults = false;
  saveState(); render();
}

function toggleHint(){
  hintShown = !hintShown;
  var b = document.getElementById('hint-btn'), x = document.getElementById('hint-box');
  if (hintShown) { x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function stripTags(s){ return String(s).replace(/<[^>]*>/g,''); }

function copyRes(){
  var lines = [TITLE + ' - Results'];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var lbl = !isAnswered(qi) ? 'Skipped' : (isCorrectAns(qi) ? 'Correct' : (isTimedOut(qi) ? 'Timed Out' : 'Wrong'));
    lines.push('Q'+(pos+1)+' '+stripTags(RAW_QUESTIONS[qi].stem)+': '+lbl);
  }
  var txt = lines.join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}

function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

function saveWrong(){
  var wrongAnswers = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var a = state.answers[qi];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      var q = RAW_QUESTIONS[qi];
      var sh = getShuffle(qi);
      wrongAnswers.push({
        question: stripTags(q.stem),
        yourAnswer: (a===undefined) ? '(no answer - time ran out)' : stripTags(q.opts[sh[a]]),
        correctAnswer: stripTags(q.opts[q.ci]),
        explanation: stripTags(q.exp)
      });
    }
  }
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  try {
    var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a2 = document.createElement('a');
    a2.href = url;
    a2.download = QUIZ_KEY + '_wrong.json';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e){}
}

var freshRandom = false;
function openFreshModal(randomOrder){ freshRandom = !!randomOrder; document.getElementById('freshModal').style.display='flex'; }
function confirmFresh(){
  document.getElementById('freshModal').style.display='none';
  localStorage.removeItem(LS_KEY);

  resetState(freshRandom);
  saveState(); render();
}

function reportResult(){
  try {
    var correct=0, wrong=0, skipped=0;
    for (var pos=0; pos<order.length; pos++) {
      var qi = order[pos];
      var a = state.answers[qi];

      if (a===undefined) {
        skipped++;
        continue;
      }
      if (a===getCSI(qi)) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if (TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if (TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if (TITLE.indexOf('[Both]')===0) childName='Both';
    else if (TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY,
      attemptNumber: loadAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  } catch(e){}
}

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;
window.copyRes = copyRes;
window.saveWrong = saveWrong;
window.openFreshModal = openFreshModal;
window.confirmFresh = confirmFresh;
window.speak = speak;


loadState(); saveState(); render();
})();
</script>
</body>
</html>
