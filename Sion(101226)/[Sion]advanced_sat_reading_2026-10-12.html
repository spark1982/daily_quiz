<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }

  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }

  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }

  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }

  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }

  .modal-no { background:#eef2f7; color:#333; }

</style>

<script>
var TITLE = "[Sion] Advanced SAT Reading";
var QUIZ_KEY = "sionadvreading";
var INSTRUCTION = "Read each passage and choose the best answer.";
var TODAY_STR = "20261012";
var RAW_QUESTIONS = [{"passage": "<table style=\"border-collapse:collapse;font-size:0.9rem;margin-bottom:8px;\"><tr><th style=\"border:1px solid #bbb;padding:4px 8px;\">City</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Bike lanes added (miles)</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Bike commuters before</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Bike commuters after</th></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Ashford</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">2</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">1,200</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">1,260</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Bellmont</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">15</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">1,100</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">2,050</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Carver</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">8</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">900</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">1,350</td></tr></table>A transportation analyst studied three cities of similar size that added protected bike lanes over the same two-year period. The analyst concluded that the more miles of bike lanes a city added, the larger the increase in the number of people who commuted by bike.", "stem": "Which choice best describes data from the table that support the analyst&rsquo;s conclusion?", "opts": ["Carver added 8 miles of lanes and had 1,350 bike commuters afterward.", "Bellmont added the most miles of lanes and had the largest increase in bike commuters, while Ashford added the fewest and had the smallest increase.", "Ashford had more bike commuters than Carver both before and after the lanes were added.", "All three cities had more than 800 bike commuters before adding lanes."], "ci": 1, "exp": "The conclusion compares miles added with the size of the increase. Bellmont (15 miles) rose by 950, Carver (8 miles) by 450, and Ashford (2 miles) by only 60, so the ordering matches. The other choices report single values or totals without comparing lane miles to the change in commuters.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "In a study of urban birds, ecologists recorded the songs of white-crowned sparrows in a busy part of San Francisco and in quieter parks outside the city. Sparrows in the noisy area sang at noticeably higher pitches than sparrows in the quiet parks. Traffic noise is concentrated at low pitches, so the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "opts": ["sparrows in the city sing more slowly than sparrows in parks.", "traffic noise causes sparrows to stop singing altogether.", "sparrows in quiet parks are unable to sing at high pitches.", "singing at a higher pitch may help city sparrows be heard above the low-pitched sound of traffic."], "ci": 3, "exp": "Traffic noise is mostly low-pitched, and city sparrows sing higher. A higher song would stand apart from the low noise, so the most logical conclusion is that the higher pitch helps the birds be heard. The study says nothing about park birds being unable to sing high, about birds going silent, or about song speed.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "When the poet Clara Whitfield visited small towns across the American South in the 1930s, she often read her poems aloud in churches and school auditoriums rather than in fancy concert halls. Whitfield believed that poetry should reach ordinary working people, not only critics and wealthy readers. By choosing these modest settings and keeping her ticket prices low, she made her readings available to audiences who might never have attended a literary event.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To explain how Whitfield&rsquo;s choices about where and how she read her poems reflected her belief about who poetry was for", "To describe the history of churches in the American South", "To argue that concert halls are the best places to hear poetry", "To compare Whitfield&rsquo;s poems with the poems of other writers of the 1930s"], "ci": 0, "exp": "The text connects Whitfield&rsquo;s choice of churches and auditoriums and her low ticket prices to her belief that poetry should reach ordinary working people. It does not argue for concert halls, give a history of churches, or compare Whitfield to other poets.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "<strong>Text 1</strong><br>Many nutrition researchers have concluded that eating breakfast improves students&rsquo; performance in school. Studies repeatedly find that students who eat breakfast earn higher grades than students who skip it, and these researchers recommend that schools provide free morning meals to all students.<br><br><strong>Text 2</strong><br>Economist Daniel Reyes points out that students who eat breakfast differ from those who skip it in many ways: they tend to get more sleep, live in households with more regular schedules, and miss fewer days of school. When Reyes compared students with similar sleep, attendance, and family routines, the grade difference linked to breakfast shrank to almost nothing.", "stem": "Based on the texts, how would Reyes (Text 2) most likely respond to the conclusion in Text 1?", "opts": ["He would claim that students who skip breakfast actually earn higher grades than those who eat it.", "He would argue that nutrition has no effect on any aspect of children&rsquo;s health.", "He would argue that the grade differences may be explained by other factors that come along with eating breakfast, not by breakfast itself.", "He would agree that free morning meals are the most effective way to raise students&rsquo; grades."], "ci": 2, "exp": "Reyes shows that breakfast eaters also sleep more and attend school more, and that the grade gap almost disappears when those factors are matched. He would therefore question whether breakfast itself causes better grades. He does not say skipping breakfast helps, and he makes no claim about health in general.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "The new public library was designed to be welcoming to everyone. Its architects avoided the imposing stone steps and heavy doors of older libraries, choosing instead a ground-level entrance with wide glass walls that let passersby see readers inside. The building&rsquo;s open design was meant to <u>temper</u> the sense that libraries are formal places reserved for scholars.", "stem": "As used in the text, what does the word &ldquo;temper&rdquo; most nearly mean?", "opts": ["soften", "anger", "strengthen", "measure"], "ci": 0, "exp": "The architects wanted to make the library feel less formal, so the open design was meant to lessen, or soften, the feeling that libraries are only for scholars. &ldquo;Strengthen&rdquo; is the opposite, &ldquo;anger&rdquo; confuses the noun &ldquo;temper,&rdquo; and &ldquo;measure&rdquo; does not fit.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "Early critics described the composer&rsquo;s final symphony as disorganized, but later scholars, studying her notebooks, found that every seemingly random shift in tempo had been carefully planned. Far from being chaotic, the work was ______ constructed, with each section designed to echo a theme introduced in the opening bars.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["reluctantly", "carelessly", "meticulously", "hastily"], "ci": 2, "exp": "The text contrasts the critics&rsquo; view (&ldquo;disorganized&rdquo;) with the scholars&rsquo; finding that every shift was &ldquo;carefully planned.&rdquo; &ldquo;Meticulously&rdquo; means with great care and precision, which fits. &ldquo;Hastily&rdquo; and &ldquo;carelessly&rdquo; repeat the critics&rsquo; mistaken view, and &ldquo;reluctantly&rdquo; describes unwillingness, not planning.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "In her study of nineteenth-century factory towns, historian Lena Ortiz notes that mill owners frequently described their workers as &ldquo;one great family.&rdquo; Ortiz does not dismiss the phrase as mere propaganda. Instead, she shows that owners did sponsor schools, churches, and libraries, while also setting wages, hours, and rules for nearly every part of workers&rsquo; lives. The phrase, she argues, captured both the genuine care and the tight control that defined these communities.", "stem": "As used in the text, what is the main purpose of the phrase &ldquo;one great family&rdquo;?", "opts": ["It is evidence that Ortiz uses to argue that mill owners were related to their workers.", "It serves as a description whose double meaning Ortiz examines to show that owners were both caring and controlling.", "It is a phrase that Ortiz rejects as entirely false and misleading.", "It is a slogan that Ortiz proves was invented by workers to protest low wages."], "ci": 1, "exp": "The text says Ortiz &ldquo;does not dismiss the phrase&rdquo; and argues it captured &ldquo;both the genuine care and the tight control.&rdquo; She examines it as having two sides; she neither rejects it as false nor treats it as literal family ties, and the text never says workers created it.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Many coastal towns have tried to stop beach erosion by building seawalls, concrete barriers that block waves from reaching the land behind them. <u>Yet a seawall often protects the property behind it at the expense of the beach in front of it.</u> When waves strike a vertical wall, their energy is reflected back toward the sea, scouring away sand that would otherwise settle on the shore. Over several decades, a town may find that its buildings are safe but that the beach that drew visitors in the first place has nearly vanished.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It offers a solution to the problem of beach erosion that the text later rejects.", "It summarizes a debate among scientists about how waves are formed.", "It introduces a drawback of seawalls that the rest of the text goes on to explain.", "It presents evidence that seawalls are cheaper than other methods of protecting a coast."], "ci": 2, "exp": "The sentence begins with &ldquo;Yet,&rdquo; turning from the purpose of seawalls to a cost: the beach is lost. The following sentences explain how reflected wave energy removes sand, so the sentence sets up the drawback that the text then explains. The text never discusses prices or how waves form.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "<strong>Text 1</strong><br>When archaeologists uncovered hundreds of carved stone tokens at an ancient site in Mesopotamia, many concluded that the tokens were game pieces. The tokens are small, smooth, and come in a handful of repeated shapes, much like the pieces used in board games found elsewhere in the region.<br><br><strong>Text 2</strong><br>Archaeologist Mira Hassan notes that the tokens at the site were found sealed inside clay envelopes, some of which are marked on the outside with impressions matching the tokens&rsquo; shapes. Hassan argues that the tokens were records of goods, such as jars of oil or measures of grain, used to confirm the contents of a trade shipment.", "stem": "Based on the texts, how would Hassan (Text 2) most likely respond to the conclusion described in Text 1?", "opts": ["She would claim that the clay envelopes were themselves the game boards.", "She would agree that the tokens&rsquo; smooth shapes prove they were used in games.", "She would argue that the way the tokens were stored suggests they recorded trade goods rather than serving as game pieces.", "She would argue that the tokens were made much later than other archaeologists believe."], "ci": 2, "exp": "Hassan points to evidence the first group did not consider: the tokens were sealed in clay envelopes marked with matching shapes, which fits a record-keeping system for shipments. She does not accept the game explanation or discuss dating the tokens.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "For years, engineers assumed that the best way to keep a skyscraper steady in strong winds was to make it as stiff as possible. The designers of several recent towers took a different approach. They placed a tuned mass damper&mdash;an enormous weight hung near the top of the building&mdash;that swings in the opposite direction of the building&rsquo;s motion. As the tower sways one way, the damper&rsquo;s movement pulls the other way, reducing the swaying felt by people inside without requiring a heavier, more rigid frame.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It lists several skyscrapers in order of height and then ranks their designers.", "It compares two engineers&rsquo; personal histories and explains why one became more famous.", "It describes a problem with skyscrapers and concludes that no solution exists.", "It describes a long-held assumption, then explains an alternative approach and how it works."], "ci": 3, "exp": "The text opens with what engineers &ldquo;assumed&rdquo; (stiffness), then introduces &ldquo;a different approach&rdquo; and explains how the damper reduces swaying. It does not rank buildings, deny that solutions exist, or discuss engineers&rsquo; lives.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "Glaciologists measuring an ice sheet in Greenland noticed that some sections were sliding toward the ocean faster in summer than in winter. They found that meltwater from the surface drains through cracks to the base of the ice, where it forms a thin layer between the ice and the bedrock. Because this layer reduces friction, ______", "stem": "Which choice most logically completes the text?", "opts": ["more surface melting during warm months likely allows the ice to move more quickly over the bedrock.", "the ice sheet probably stops moving entirely during the summer.", "the bedrock beneath the ice is likely melting faster than the ice itself.", "meltwater probably has no effect on how quickly the ice moves."], "ci": 0, "exp": "The text links summer to faster sliding and explains that meltwater at the base reduces friction. Less friction lets the ice slide more easily, so more summer melting would logically allow faster movement. The text gives no support for bedrock melting or for the ice stopping.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "A team of agricultural scientists hypothesized that planting clover between rows of corn would increase corn yields by adding nitrogen to the soil, since clover roots host bacteria that convert nitrogen from the air into a form plants can use. The team planted twenty test fields with clover between the corn rows and twenty similar fields with bare soil between the rows.", "stem": "Which finding, if true, would most directly support the team&rsquo;s hypothesis?", "opts": ["Fields with clover had higher soil nitrogen levels and produced more corn per acre than fields with bare soil.", "Fields with clover attracted more bees than fields with bare soil.", "Clover grew more quickly in fields that received more rainfall.", "Corn in both types of fields grew to about the same height by midsummer."], "ci": 0, "exp": "The hypothesis has two links: clover adds nitrogen, and that raises corn yields. Only the finding about higher soil nitrogen together with more corn per acre addresses both. Bees, equal plant height, and rainfall effects on clover do not test whether corn yields rose.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
