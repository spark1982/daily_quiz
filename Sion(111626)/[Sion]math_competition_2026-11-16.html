  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */

<div class="quiz-wrap">

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261116";
var RAW_QUESTIONS = [{"stem": "A box has 300 matches. Two players take turns removing no more than half the matches in the box. The player who can&rsquo;<i>t</i> move loses. Who can guarantee a win?", "opts": ["Player 2", "Player 1"], "ci": 1, "exp": "<b>What we need</b><br>Decide which player can always win when the game starts with 300 matches and each move removes at least one match but no more than half of the matches left. A player who cannot move loses.<br><br><b>Step 1: Find the losing positions.</b> Call a number of matches a <i>losing position</i> if the player about to move will lose against perfect play. With 1 match, half is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, so no whole match can be taken: 1 is losing. With 2 matches you may take 1, leaving 1 (losing for your opponent), so 2 is winning. With 3 matches you may take only 1 (half of 3 is 1<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>), leaving 2, which is winning for your opponent, so 3 is losing. Continuing this way, the losing positions are 1, 3, 7, 15, 31, 63, 127, 255, &hellip; &mdash; the numbers of the form 2<sup><i>k</i></sup> &minus; 1.<br><br><b>Step 2: Why 2<sup><i>k</i></sup> &minus; 1 is losing.</b> From 2<sup><i>k</i></sup> &minus; 1 matches, a player may take at most half, which is at most 2<sup><i>k</i>&minus;1</sup> &minus; 1 matches (half of an odd number, rounded down). So at least 2<sup><i>k</i>&minus;1</sup> matches remain, and at most 2<sup><i>k</i></sup> &minus; 2 remain. Every number in that range lies strictly between two numbers of the form 2<sup><i>j</i></sup> &minus; 1, so the opponent never receives a losing position.<br><br><b>Step 3: Why every other number is winning.</b> If 2<sup><i>k</i></sup> &le; <i>n</i> &le; 2<sup><i>k</i>+1</sup> &minus; 2, take <i>n</i> &minus; (2<sup><i>k</i></sup> &minus; 1) matches. This is allowed because <i>n</i> &minus; (2<sup><i>k</i></sup> &minus; 1) &le; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\">2</span></span> exactly when <i>n</i> &le; 2<sup><i>k</i>+1</sup> &minus; 2, which is true. The opponent is then left with the losing number 2<sup><i>k</i></sup> &minus; 1.<br><br><b>Step 4: Apply it to 300.</b> Since 255 = 2<sup>8</sup> &minus; 1 &lt; 300 &lt; 511 = 2<sup>9</sup> &minus; 1, the number 300 is not a losing position. Player 1 takes 300 &minus; 255 = 45 matches (allowed, since 45 &le; 150) and leaves 255. After that, whatever Player 2 does, Player 1 again moves to the next smaller number of the form 2<sup><i>k</i></sup> &minus; 1: 127, 63, 31, 15, 7, 3, 1. Player 2 finally faces 1 match and cannot move.<br><br><b>Answer check</b><br>A computer search of every position from 1 to 300 confirms that the only losing positions below 300 are 1, 3, 7, 15, 31, 63, 127, 255, and that 45 is the only winning first move from 300.<br><br><b>Trap</b><br>&ldquo;Mirroring&rdquo; the opponent does not describe the strategy here. The key is to return to the next number of the form 2<sup><i>k</i></sup> &minus; 1 after every move.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "The roots of <i>x</i><sup>4</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; 1 = 0 are <i>a</i>, <i>b</i>, <i>c</i>, and <i>d</i>. Find<br><br><i>p</i>(<i>a</i>) + <i>p</i>(<i>b</i>) + <i>p</i>(<i>c</i>) + <i>p</i>(<i>d</i>),<br><br>where <i>p</i>(<i>x</i>) = <i>x</i><sup>6</sup> &minus; <i>x</i><sup>5</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; <i>x</i>. (AIME)", "opts": ["4", "6", "10", "3"], "ci": 1, "exp": "<b>What we need</b><br><i>a</i>, <i>b</i>, <i>c</i>, <i>d</i> are the roots of <i>x</i><sup>4</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; 1 = 0. Find <i>p</i>(<i>a</i>) + <i>p</i>(<i>b</i>) + <i>p</i>(<i>c</i>) + <i>p</i>(<i>d</i>) for <i>p</i>(<i>x</i>) = <i>x</i><sup>6</sup> &minus; <i>x</i><sup>5</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; <i>x</i>.<br><br><b>Step 1: Divide <i>p</i>(<i>x</i>) by the quartic.</b> Let <i>q</i>(<i>x</i>) = <i>x</i><sup>4</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; 1. Then<br><i>p</i>(<i>x</i>) = (<i>x</i><sup>2</sup> + 1)&middot;<i>q</i>(<i>x</i>) + (<i>x</i><sup>2</sup> &minus; <i>x</i> + 1).<br>Check by expanding: (<i>x</i><sup>2</sup> + 1)(<i>x</i><sup>4</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; 1) = <i>x</i><sup>6</sup> &minus; <i>x</i><sup>5</sup> &minus; <i>x</i><sup>4</sup> &minus; <i>x</i><sup>2</sup> + <i>x</i><sup>4</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; 1 = <i>x</i><sup>6</sup> &minus; <i>x</i><sup>5</sup> &minus; <i>x</i><sup>3</sup> &minus; 2<i>x</i><sup>2</sup> &minus; 1. Adding <i>x</i><sup>2</sup> &minus; <i>x</i> + 1 gives <i>x</i><sup>6</sup> &minus; <i>x</i><sup>5</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; <i>x</i> = <i>p</i>(<i>x</i>). &#10003;<br><br><b>Step 2: Use the fact that each root makes <i>q</i> zero.</b> For a root <i>r</i>, <i>q</i>(<i>r</i>) = 0, so <i>p</i>(<i>r</i>) = <i>r</i><sup>2</sup> &minus; <i>r</i> + 1. Therefore the requested sum is<br>(<i>a</i><sup>2</sup> + <i>b</i><sup>2</sup> + <i>c</i><sup>2</sup> + <i>d</i><sup>2</sup>) &minus; (<i>a</i> + <i>b</i> + <i>c</i> + <i>d</i>) + 4.<br><br><b>Step 3: Vieta&rsquo;s formulas.</b> For <i>x</i><sup>4</sup> &minus; <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> + 0<i>x</i> &minus; 1: the sum of the roots is <i>e</i><sub>1</sub> = 1, and the sum of all products of two roots is <i>e</i><sub>2</sub> = &minus;1 (the <i>x</i><sup>2</sup> coefficient).<br><br><b>Step 4: Sum of squares.</b> <i>a</i><sup>2</sup> + <i>b</i><sup>2</sup> + <i>c</i><sup>2</sup> + <i>d</i><sup>2</sup> = <i>e</i><sub>1</sub><sup>2</sup> &minus; 2<i>e</i><sub>2</sub> = 1 &minus; 2(&minus;1) = 3.<br><br><b>Step 5: Finish.</b> The sum is 3 &minus; 1 + 4 = 6.<br><br><b>Answer check</b><br>Finding the four roots numerically and adding <i>p</i>(root) for each gives 6.0000 (the imaginary parts cancel).<br><br><b>Trap</b><br>3 is only the sum of the squares; forgetting the &minus;(sum of roots) and the +4 (one +1 for each of the four roots) leads to 3 or 4.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "As Kyle walked along a street at a constant speed, he noticed that every 12 minutes, a bus passed him traveling in the same direction as Kyle, and every 4 minutes, a bus passed him traveling in the opposite direction as Kyle. If all the buses travel at a constant speed and leave the terminals at each end of the street at equally spaced intervals, how many minutes long is that interval? (MathCounts)", "opts": ["4 minutes", "6 minutes", "10 minutes", "8 minutes"], "ci": 1, "exp": "<b>What we need</b><br>Buses leave each end of the street every <i>T</i> minutes and all travel at the same speed. Kyle is passed by a same-direction bus every 12 minutes and meets an opposite-direction bus every 4 minutes. Find <i>T</i>.<br><br><b>Step 1: Name the quantities.</b> Let Kyle&rsquo;s speed be <i>w</i> and each bus&rsquo;s speed be <i>v</i> (distance per minute). Buses going one way are spaced <i>d</i> = <i>v</i><i>T</i> apart, because a new bus starts every <i>T</i> minutes.<br><br><b>Step 2: Same-direction buses.</b> A bus behind Kyle closes the gap at the relative speed <i>v</i> &minus; <i>w</i>. It covers one spacing <i>d</i> in 12 minutes, so <i>d</i> = 12(<i>v</i> &minus; <i>w</i>).<br><br><b>Step 3: Opposite-direction buses.</b> Kyle and an oncoming bus approach each other at <i>v</i> + <i>w</i>, so <i>d</i> = 4(<i>v</i> + <i>w</i>).<br><br><b>Step 4: Solve.</b> Set the two expressions equal: 12<i>v</i> &minus; 12<i>w</i> = 4<i>v</i> + 4<i>w</i>, so 8<i>v</i> = 16<i>w</i> and <i>v</i> = 2<i>w</i>. Then <i>d</i> = 12(2<i>w</i> &minus; <i>w</i>) = 12<i>w</i>, and <i>T</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>d</i></span><span style=\"border-top:1.4px solid #111;\"><i>v</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12<i>w</i></span><span style=\"border-top:1.4px solid #111;\">2<i>w</i></span></span> = 6 minutes.<br><br><b>Answer check</b><br>Choose <i>w</i> = 1 and <i>v</i> = 2, so <i>d</i> = 12. Same direction: 12 &divide; (2 &minus; 1) = 12 minutes. Opposite direction: 12 &divide; (2 + 1) = 4 minutes. Both match. (A shortcut: the interval is the harmonic mean <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2 &times; 12 &times; 4</span><span style=\"border-top:1.4px solid #111;\">12 + 4</span></span> = 6.)<br><br><b>Trap</b><br>8 minutes is the plain average of 12 and 4. Speeds add and subtract, so the times combine through the relative speeds, not by averaging.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "If for three distinct positive numbers <i>x</i>, <i>y</i>, and <i>z</i>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i>&minus;<i>z</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i>+<i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>z</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>, then find the numerical value of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>. (AHSME)", "opts": ["2", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "3", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>"], "ci": 0, "exp": "<b>What we need</b><br>The three fractions <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i>&minus;<i>z</i></span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i>+<i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>z</i></span></span>, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> are all equal. Find the value of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>.<br><br><b>Step 1: Call the common value <i>k</i>.</b> Then <i>y</i> = <i>k</i>(<i>x</i> &minus; <i>z</i>), <i>x</i> + <i>y</i> = <i>k</i><i>z</i>, and <i>x</i> = <i>k</i><i>y</i>.<br><br><b>Step 2: Add the three equations.</b> Left sides: <i>y</i> + (<i>x</i> + <i>y</i>) + <i>x</i> = 2<i>x</i> + 2<i>y</i>. Right sides: <i>k</i>(<i>x</i> &minus; <i>z</i>) + <i>k</i><i>z</i> + <i>k</i><i>y</i> = <i>k</i>(<i>x</i> + <i>y</i>), because &minus;<i>k</i><i>z</i> and +<i>k</i><i>z</i> cancel.<br><br><b>Step 3: Solve for <i>k</i>.</b> 2(<i>x</i> + <i>y</i>) = <i>k</i>(<i>x</i> + <i>y</i>). Since <i>x</i> and <i>y</i> are positive, <i>x</i> + <i>y</i> &ne; 0, so we may divide: <i>k</i> = 2. Therefore <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = 2.<br><br><b>Answer check</b><br>Take <i>y</i> = 2. Then <i>x</i> = 4 (so <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = 2). From <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i>&minus;<i>z</i></span></span> = 2 we get <i>x</i> &minus; <i>z</i> = 1, so <i>z</i> = 3. Check: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">4&minus;3</span></span> = 2, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4+2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 2, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 2. The numbers 4, 2, 3 are distinct and positive, as required.<br><br><b>Trap</b><br><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>, the upside-down ratio. Read carefully which ratio the question asks for.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "The numbers in the sequence 1, 6, 15, 28, 45, &hellip; are called the hexagonal numbers.<div style=\"text-align:center;margin:14px 0;\"><svg style=\"max-width:460px;width:100%;\" viewBox=\"0 0 480 170\"><circle cx=\"60\" cy=\"85\" r=\"5\" fill=\"#111\"/><text x=\"60\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8321; = 1</text><polygon points=\"200,45 234.6,65 234.6,105 200,125 165.4,105 165.4,65\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"200\" cy=\"45\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"65\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"200\" cy=\"125\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"65\" r=\"4\" fill=\"#111\"/><text x=\"200\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8322; = 6</text><polygon points=\"380,30 427.6,57.5 427.6,112.5 380,140 332.4,112.5 332.4,57.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><polygon points=\"380,58 403.4,71.5 403.4,98.5 380,112 356.6,98.5 356.6,71.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"30\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"140\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><circle cx=\"380\" cy=\"85\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"30\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"140\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"58\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"380\" cy=\"112\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><text x=\"380\" y=\"158\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8323; = 15</text></svg></div>What is the 11<sup>th</sup> hexagonal number?", "opts": ["242", "231", "210", "225"], "ci": 1, "exp": "<b>What we need:</b> the 11th number in 1, 6, 15, 28, 45, &hellip;<br><br><b>Step 1 &mdash; Look at the differences.</b> 6 &minus; 1 = 5, 15 &minus; 6 = 9, 28 &minus; 15 = 13, 45 &minus; 28 = 17. The differences go up by 4 each time, so the second differences are constant. That means the rule is a quadratic: <i>H</i><sub><i>n</i></sub> = <i>an</i><sup>2</sup> + <i>bn</i> + <i>c</i>.<br><br><b>Step 2 &mdash; Find the formula.</b> A constant second difference of 4 means 2<i>a</i> = 4, so <i>a</i> = 2. Then <i>H</i><sub>1</sub> = 2 + <i>b</i> + <i>c</i> = 1 and <i>H</i><sub>2</sub> = 8 + 2<i>b</i> + <i>c</i> = 6. Subtracting: 6 + <i>b</i> = 5, so <i>b</i> = &minus;1, and then <i>c</i> = 1 &minus; 2 + 1 = 0. So <i>H</i><sub><i>n</i></sub> = 2<i>n</i><sup>2</sup> &minus; <i>n</i> = <i>n</i>(2<i>n</i> &minus; 1).<br><br><b>Step 3 &mdash; Check the formula.</b> <i>n</i> = 3: 3 &middot; 5 = 15. <i>n</i> = 4: 4 &middot; 7 = 28. <i>n</i> = 5: 5 &middot; 9 = 45. &#10003;<br><br><b>Step 4 &mdash; Plug in 11.</b> <i>H</i><sub>11</sub> = 11 &middot; (2 &middot; 11 &minus; 1) = 11 &middot; 21 = <b>231</b>.<br><br><b>Answer check:</b> Keep adding differences: after 17 come 21, 25, 29, 33, 37, 41. So 45 + 21 = 66, + 25 = 91, + 29 = 120, + 33 = 153, + 37 = 190, + 41 = 231. &#10003;<br><br><b>Trap:</b> 225 = 15<sup>2</sup> and 210 is <i>H</i><sub>10</sub> + 20; both come from guessing a pattern instead of building the formula. (<i>H</i><sub>10</sub> = 10 &middot; 19 = 190.)", "tag": "Chapter 5", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
