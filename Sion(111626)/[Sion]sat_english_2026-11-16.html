<script>
var TITLE = "[Sion] SAT English";
var QUIZ_KEY = "sionsatenglish_10";
var INSTRUCTION = "Read each text carefully and choose the best answer. Use the timer to practice real SAT pacing.";
var TODAY_STR = "20261116";
var RAW_QUESTIONS = [{"passage": "Despite her expertise, the young engineer was ______ during her first design review, speaking so hesitantly that her colleagues initially overlooked the structural flaw she had correctly identified.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["indignant", "garrulous", "diffident", "meticulous"], "ci": 2, "exp": "<b>Clue:</b> <i>Despite her expertise</i> signals that she did not act like an expert, and she spoke &ldquo;so hesitantly&rdquo; that people ignored her. The blank needs a word meaning &ldquo;lacking confidence; shy.&rdquo; <i>Diffident</i> means exactly that.<br><br><b>Why the others fail:</b> <i>indignant</i> (angry at unfairness) does not match hesitant speech; <i>meticulous</i> (very careful) describes her work, not her hesitant manner, and would not contrast with expertise; <i>garrulous</i> (very talkative) is the opposite of hesitant.<br><br><b>Vocabulary:</b> diffident (adj.) &mdash; shy, lacking self-confidence. Related: diffidence (n.); opposite: confident, assertive. Example: <i>The <b>diffident</b> student rarely raised her hand, even when she knew the answer.</i><br><br><b>Strategy:</b> the clause after the blank (&ldquo;speaking so hesitantly&rdquo;) often defines the missing word &mdash; use it as your prediction.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Traffic noise is concentrated at low frequencies. A team of ecologists hypothesizes that songbirds living near busy roads adjust their songs so that they can still be heard by other birds, specifically by raising the lowest notes of their songs above the range where traffic noise is loudest.", "stem": "Which finding, if true, would most directly support the ecologists&rsquo; hypothesis?", "opts": ["Several bird species that sing at naturally high pitches were more common near highways than in forests.", "Birds near highways sang more songs per hour than birds of the same species in quiet forests.", "Birds near highways sang at the same minimum pitch on weekdays and on holidays with very little traffic.", "Birds of a single species recorded near highways sang with higher minimum pitches than birds of that species recorded in quiet forests."], "ci": 3, "exp": "<b>What the question asks:</b> which finding best supports the specific claim that birds near roads <i>raise their lowest notes</i> to escape low-frequency traffic noise.<br><br><b>Why the answer works:</b> it compares the <i>same species</i> in noisy and quiet places and finds exactly the predicted change: higher minimum pitch near highways. Using one species rules out the possibility that the difference comes from different kinds of birds.<br><br><b>Why the others fail:</b> singing <i>more often</i> is a different adjustment from raising pitch; finding naturally high-pitched <i>species</i> near highways is about which birds live there, not about birds adjusting their songs; no change between busy days and quiet holidays would actually <i>weaken</i> the idea that birds respond to traffic noise.<br><br><b>Strategy:</b> match the evidence to every part of the hypothesis &mdash; here, &ldquo;adjust,&rdquo; &ldquo;lowest notes,&rdquo; and &ldquo;higher.&rdquo;", "tag": "Information and Ideas", "tagcolor": "#185FA5"}, {"passage": "Many visitors assume that a midday hike will leave them energized, but park rangers warn that the relentless desert sun tends to ______ even experienced hikers, leaving them sluggish, dehydrated, and prone to poor decisions.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["acclimate", "enervate", "exhilarate", "embolden"], "ci": 1, "exp": "<b>Clue:</b> <i>but</i> contrasts with &ldquo;energized,&rdquo; and the effect is described: hikers become &ldquo;sluggish, dehydrated, and prone to poor decisions.&rdquo; The blank needs a word meaning &ldquo;drain of energy.&rdquo; <i>Enervate</i> means to weaken or exhaust.<br><br><b>Why the others fail:</b> <i>exhilarate</i> (to make excited and lively) and <i>embolden</i> (to make braver) are the opposite of sluggish; <i>acclimate</i> means to get used to a new climate, which would make hikers <i>better</i> able to handle the heat, not worse.<br><br><b>Vocabulary:</b> enervate (v.) &mdash; to weaken, to drain energy. Watch out: it sounds like &ldquo;energize,&rdquo; but it means nearly the opposite. Related: enervating (adj.). Example: <i>The long, humid afternoon was <b>enervating</b>.</i><br><br><b>Strategy:</b> when a word looks familiar, check it against the sentence&rsquo;s clues instead of trusting how it sounds.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Honeybees that find a good patch of flowers return to the hive and perform a &ldquo;waggle dance&rdquo; to share its location. The angle of the bee&rsquo;s waggling run, measured relative to straight up on the honeycomb, shows the direction of the flowers relative to the sun. ______ the length of time the bee spends waggling indicates how far away the flowers are.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["In contrast,", "As a result,", "Nevertheless,", "Additionally,"], "ci": 3, "exp": "<b>What the question asks:</b> the relationship between the two sentences.<br><br><b>Reasoning:</b> the first sentence explains one piece of information the dance gives (direction); the second gives another piece (distance). The second simply <i>adds</i> a parallel fact, so <i>Additionally</i> fits.<br><br><b>Why the others fail:</b> <i>Nevertheless</i> signals something unexpected despite the previous point, but distance is not surprising; <i>In contrast</i> would require opposite ideas, yet direction and distance work together; <i>As a result</i> would mean the angle <i>causes</i> the timing, which the text does not say.<br><br><b>Strategy:</b> name the relationship in your own words (here: &ldquo;and also&rdquo;) before reading the choices.", "tag": "Expression of Ideas", "tagcolor": "#f5a623"}, {"passage": "Layers of mud at the bottom of a lake preserve pollen that blew in from the surrounding land, so researchers can use the layers to reconstruct past vegetation. In sediment from a lake near an ancient settlement, tree pollen drops sharply in layers dated to about 1,000 years ago, while pollen from grasses and cereal crops rises. The same layers contain unusually thick deposits of charcoal. Because natural wildfires in this region typically leave only thin charcoal layers and forests usually regrow within decades afterward, the researchers concluded that ______", "stem": "Which choice most logically completes the text?", "opts": ["natural wildfires probably became much more frequent in the region about 1,000 years ago.", "people living in the settlement probably cleared the forest with fire to make room for crops.", "a long drought about 1,000 years ago probably caused the trees around the lake to die off.", "the lake probably filled with more mud than usual about 1,000 years ago, hiding the tree pollen."], "ci": 1, "exp": "<b>What the question asks:</b> the conclusion that best fits <i>all</i> the evidence.<br><br><b>Reasoning:</b> three clues point the same way: trees decline, <i>cereal crops</i> rise, and the charcoal is unusually thick. The last sentence rules out ordinary wildfires, which leave thin charcoal and are followed by regrowth. Crops plus heavy burning near a settlement suggest people cleared the land with fire to farm it.<br><br><b>Why the others fail:</b> a drought does not explain the rise in cereal crops or the thick charcoal; the text gives no evidence about extra mud, and grass pollen <i>rose</i>, so pollen was clearly still being preserved; the text says natural fires leave <i>thin</i> layers and forests regrow, so more natural fires do not match the thick charcoal and the lasting change.<br><br><b>Strategy:</b> an inference answer must explain every clue &mdash; check each choice against each piece of evidence.", "tag": "Information and Ideas", "tagcolor": "#185FA5"}, {"passage": "The collection of letters exchanged between the two astronomers, many of which describe observations made decades apart, ______ now housed in a university archive, where historians can examine the handwritten originals.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["have been", "were", "is", "are"], "ci": 2, "exp": "<b>Rule:</b> the verb must agree with its subject, even when a long phrase separates them.<br><br><b>Find the subject:</b> strip away the interrupters &mdash; &ldquo;of letters exchanged between the two astronomers&rdquo; and &ldquo;many of which describe observations made decades apart.&rdquo; What is left is &ldquo;The collection &hellip; ______ now housed.&rdquo; <i>Collection</i> is singular, so the verb is <i>is</i>.<br><br><b>Why the others fail:</b> <i>are</i>, <i>were</i>, and <i>have been</i> are all plural, matching the nearby words <i>letters</i> or <i>astronomers</i> instead of the true subject. (The word <i>now</i> also calls for the present tense.)<br><br><b>Strategy:</b> cross out prepositional phrases and &ldquo;which&rdquo; clauses to find the real subject.", "tag": "Standard English Conventions", "tagcolor": "#1D9E75"}, {"passage": "Discovered in 1799 by French soldiers in Egypt, the Rosetta Stone carries the same decree written in three ______ hieroglyphic, Demotic, and ancient Greek. Because scholars could already read the Greek, the stone became the key to decoding hieroglyphs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["scripts,", "scripts.", "scripts:", "scripts;"], "ci": 2, "exp": "<b>Rule:</b> a colon can introduce a list that explains or names what came just before it, as long as the part before the colon is a complete sentence.<br><br><b>Why the answer works:</b> &ldquo;the Rosetta Stone carries the same decree written in three scripts&rdquo; is complete, and the list names the three scripts.<br><br><b>Why the others fail:</b> a semicolon must join two complete sentences, but &ldquo;hieroglyphic, Demotic, and ancient Greek&rdquo; is not a sentence; a comma makes the list look like more items in a series, which is confusing; a period leaves the list as a fragment.<br><br><b>Strategy:</b> if what follows the blank is a list that explains the word right before the blank, think colon.", "tag": "Standard English Conventions", "tagcolor": "#1D9E75"}, {"passage": "While researching a topic, a student has taken the following notes:<ul style=\"margin:6px 0 0 18px;padding:0\"><li>The Svalbard Global Seed Vault opened in 2008 on a Norwegian island in the Arctic.</li><li>It stores duplicate samples of seeds sent by gene banks around the world.</li><li>The vault holds more than one million seed samples.</li><li>Seeds are kept at about &minus;18&deg;C (about 0&deg;F).</li><li>If a gene bank&rsquo;s collection is lost to war, disaster, or accident, the backup seeds can be used to restore it.</li></ul>", "stem": "The student wants to emphasize the purpose of the seed vault. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Svalbard Global Seed Vault, which opened in 2008, is located on a Norwegian island in the Arctic.", "Kept at about &minus;18&deg;C, the more than one million seed samples in the Svalbard Global Seed Vault are stored in very cold conditions.", "Opened in 2008, the Svalbard Global Seed Vault holds more than one million seed samples.", "The Svalbard Global Seed Vault stores backup copies of seeds from gene banks worldwide so that lost collections can be restored."], "ci": 3, "exp": "<b>What the question asks:</b> the choice that shows the vault&rsquo;s <i>purpose</i> &mdash; why it exists.<br><br><b>Why the answer works:</b> it combines the notes about storing duplicate seeds and restoring lost collections, which together explain what the vault is <i>for</i>.<br><br><b>Why the others fail:</b> each gives accurate facts &mdash; the location and opening date, the temperature, or the size &mdash; but none explains <i>why</i> the vault stores seeds. They describe the vault without stating its purpose.<br><br><b>Strategy:</b> ignore whether a choice is true (they all are); ask only whether it accomplishes the stated goal.", "tag": "Expression of Ideas", "tagcolor": "#f5a623"}, {"passage": "Although the travel writer admitted that the hotel&rsquo;s rooms were cramped and its elevator unreliable, she went on to ______ its rooftop garden, describing it as the most peaceful spot she had found anywhere in the city.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["overlook", "replicate", "extol", "disparage"], "ci": 2, "exp": "<b>Clue:</b> <i>Although</i> sets up a contrast with the complaints, and she calls the garden &ldquo;the most peaceful spot she had found anywhere.&rdquo; The blank needs a word meaning &ldquo;praise highly.&rdquo; <i>Extol</i> means to praise enthusiastically.<br><br><b>Why the others fail:</b> <i>disparage</i> (to speak badly of) continues the complaints instead of contrasting with them; <i>overlook</i> (to ignore) clashes with her detailed praise; <i>replicate</i> (to copy) does not fit a writer describing a place.<br><br><b>Vocabulary:</b> extol (v.) &mdash; to praise highly. Example: <i>Reviewers <b>extolled</b> the film&rsquo;s stunning photography.</i><br><br><b>Strategy:</b> after <i>Although</i> + a negative idea, expect a positive word in the blank.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Along the Pacific coast of North America, sea otters feed heavily on sea urchins, spiny animals that graze on kelp. When fur traders hunted otters nearly to extinction in the 1700s and 1800s, urchin populations surged in many areas, and the urchins stripped the seafloor of kelp, leaving barren rock where dense underwater forests had stood. In places where otters later returned, urchin numbers fell, and kelp forests&mdash;along with the fish that shelter in them&mdash;gradually recovered.", "stem": "Which choice best states the main idea of the text?", "opts": ["Sea urchins became the main food source for fish after kelp forests disappeared.", "Kelp forests recover quickly on their own once the seafloor becomes barren rock.", "Fur traders in the 1700s and 1800s hunted sea otters mainly to protect kelp forests.", "By keeping sea urchin populations in check, sea otters help kelp forests survive."], "ci": 3, "exp": "<b>What the question asks:</b> the main idea &mdash; the point the whole text builds toward.<br><br><b>Evidence:</b> the text describes a chain: otters eat urchins &rarr; without otters, urchins &ldquo;stripped the seafloor of kelp&rdquo; &rarr; when otters returned, &ldquo;urchin numbers fell, and kelp forests &hellip; gradually recovered.&rdquo; Every sentence supports the idea that otters protect kelp by limiting urchins.<br><br><b>Why the others fail:</b> the text says fish <i>shelter</i> in kelp, not that they eat urchins; traders hunted otters (for fur), and the text never says they wanted to protect kelp &mdash; in fact, the hunting destroyed kelp; the forests recovered only <i>where otters returned</i>, not on their own.<br><br><b>Strategy:</b> for main-idea questions, look for the answer that connects the first and last sentences, not a detail from the middle.", "tag": "Information and Ideas", "tagcolor": "#185FA5"}, {"passage": "Once the centerpiece of the orchestra&rsquo;s season, the composer&rsquo;s early symphony was later ______ to occasional performances at summer festivals, as critics and audiences turned their attention to his more ambitious late works.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["elevated", "reconciled", "relegated", "attributed"], "ci": 2, "exp": "<b>Clue:</b> the symphony was <i>once</i> the centerpiece, but <i>later</i> it was played only occasionally because attention shifted elsewhere. The blank needs a word meaning &ldquo;moved to a less important position.&rdquo; <i>Relegated</i> means exactly that.<br><br><b>Why the others fail:</b> <i>elevated</i> (raised in importance) is the opposite of what happened; <i>attributed</i> means credited to a source, which does not fit &ldquo;to occasional performances&rdquo;; <i>reconciled</i> means brought into agreement, which makes no sense here.<br><br><b>Vocabulary:</b> relegate (v.) &mdash; to move someone or something to a lower or less important place. Related: relegation (n.). Example: <i>After the injury, the star player was <b>relegated</b> to the bench.</i><br><br><b>Strategy:</b> words like <i>once</i> and <i>later</i> signal a change &mdash; predict which direction the change goes before reading the choices.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "<b>Text 1</b><br>For much of the twentieth century, many paleontologists assumed that feathers evolved as an adaptation for flight. Feathers are lightweight yet strong, and the long, asymmetrical feathers of a bird&rsquo;s wing are precisely shaped to generate lift. Such a specialized structure, they reasoned, must have arisen because it helped ancestral birds take to the air.<br><br><b>Text 2</b><br>Fossils discovered since the 1990s complicate that view. Many small dinosaurs that could not fly&mdash;their arms were far too short to serve as wings&mdash;were covered in simple, hairlike filaments, and some had broad, symmetrical feathers on their arms or tails. Feathers, it now appears, were widespread long before anything flew; the asymmetrical flight feather is a late refinement of a structure that first served other purposes, such as insulation or display.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the reasoning described in Text 1?", "opts": ["By arguing that the shape of modern flight feathers does not reveal the purpose for which feathers first evolved", "By suggesting that small feathered dinosaurs used their feathers mainly to glide between trees", "By agreeing that feathers evolved for flight but arguing that flight evolved earlier than paleontologists assumed", "By claiming that the asymmetrical shape of wing feathers actually makes them poorly suited for generating lift"], "ci": 0, "exp": "<b>What the question asks:</b> how Text 2&rsquo;s author would react to Text 1&rsquo;s <i>reasoning</i> &mdash; the step from &ldquo;flight feathers are perfectly shaped for lift&rdquo; to &ldquo;feathers evolved for flight.&rdquo;<br><br><b>Key evidence:</b> Text 2 says feathers were &ldquo;widespread long before anything flew&rdquo; and calls the flight feather &ldquo;a late refinement of a structure that first served other purposes.&rdquo; So the author would say that how a modern feather works does not tell us why feathers first appeared &mdash; the specialized shape came <i>later</i>.<br><br><b>Why the others fail:</b> Text 2 does <i>not</i> agree that feathers evolved for flight; it says the opposite, and it never claims flight came earlier. Text 2 calls the flight feather a &ldquo;refinement,&rdquo; implying it <i>is</i> well suited to flight, so &ldquo;poorly suited for generating lift&rdquo; contradicts it. Gliding is a tempting trap, but Text 2 stresses that these dinosaurs &ldquo;could not fly&rdquo; and names insulation and display, not gliding.<br><br><b>Strategy:</b> in cross-text questions, identify exactly which claim or reasoning Text 1 makes, then find the sentence in Text 2 that speaks to it. The best answer usually challenges the <i>logic</i>, not just a detail.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ if(window.SAT_TIMEUP && SAT_TIMEUP() && !(activeSet && activeSet.length)){ wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, "(time's up)")); } else skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* sat-timer 2026-11-06 */
(function(){
  var PER_Q = 60;
  var LIMIT = PER_Q * RAW_QUESTIONS.length;
  var TK = STORAGE_KEY + '_timer';
  function blank(){ return {el:0, per:{}, up:false}; }
  function load(){ try{ return JSON.parse(localStorage.getItem(TK)) || blank(); }catch(e){ return blank(); } }
  var T = load(), paused = false, last = Date.now();
  function save(){ try{ localStorage.setItem(TK, JSON.stringify(T)); }catch(e){} }
  function retrying(){ return !!(activeSet && activeSet.length); }
  window.SAT_TIMEUP = function(){ return !!T.up; };
  var bar = document.createElement('div'); bar.className = 'sat-timer'; bar.id = 'sat-timer';
  bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function curAnswered(){ if(window.EXAM_ACTIVE && EXAM_ACTIVE()) return false; var q = activeOrder()[state.cur]; return q !== undefined && state.answers[q] !== undefined; } /* sat-timer-pause-on-answer 2026-11-14 */
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && !curAnswered() && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
