<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Math Competition</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Sion] Math Competition</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>
    <div class="dots-panel" id="dots-panel" style="display:none;"></div>
  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>
    <button class="hint-btn" id="hint-btn" onclick="toggleHint()" style="display:none;">Show Hint</button>
    <div class="hint-box" id="hint-box"></div>
    <div class="exp-box" id="exp-box"></div>
    <div class="nav-btns">
      <button id="prev-btn" onclick="prevQ()">Prev</button>
      <button id="next-btn" onclick="goNext()">Next</button>
    </div>
  </div>

  <div class="results-card" id="results-card" style="display:none;">
    <h2>Results</h2>
    <div class="score-big" id="score-big"></div>
    <div id="score-detail" style="text-align:center;color:#555;font-size:0.9rem;"></div>
    <div class="action-row">
      <button class="btn-retry" onclick="startRetry()">Retry Wrong Ones</button>
      <button class="btn-fresh" onclick="openFreshModal()">Start Fresh</button>
    </div>
  </div>

  <button class="fresh-btn-bottom" onclick="openFreshModal()">Start Fresh</button>
</div>

<div class="modal-overlay" id="fresh-modal" style="display:none;">
  <div class="modal-box">
    <p>Reset all progress and start over?</p>
    <button class="modal-yes" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="modal-no" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261123";
var RAW_QUESTIONS = [{"stem": "A grasshopper jumps along a line. His first jump takes him 1 cm, his second 2 cm, and so on. Each jump can take him to the right or to the left. Is it possible that after 2010 jumps the grasshopper returns to the point at which he started? (Russia)", "opts": ["impossible", "possible"], "ci": 0, "exp": "<b>What we need</b><br><br>Each jump is either to the right (+) or to the left (&minus;). We must decide whether the signed sum &plusmn;1 &plusmn;2 &plusmn;3 &hellip; &plusmn;2010 can equal 0.<br><br><b>Step 1 &ndash; Split the jumps into two groups.</b> Let <i>R</i> be the total length of all right jumps and <i>L</i> the total length of all left jumps. Returning to the start means <i>R</i> &minus; <i>L</i> = 0, so <i>R</i> = <i>L</i>.<br><br><b>Step 2 &ndash; Add all jump lengths.</b> Every jump is in exactly one group, so <i>R</i> + <i>L</i> = 1 + 2 + &hellip; + 2010 = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2010 &times; 2011</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 1005 &times; 2011 = 2021055.<br><br><b>Step 3 &ndash; Use parity.</b> If <i>R</i> = <i>L</i>, then <i>R</i> + <i>L</i> = 2<i>R</i> is even. But 2021055 is odd (1005 and 2011 are both odd, and odd &times; odd is odd). This is a contradiction, so the grasshopper can never be back at the start after 2010 jumps.<br><br><b>Answer check</b>: Try small cases. After 3 jumps the total is 6 (even) and 1 + 2 &minus; 3 = 0 works. After 2 jumps the total is 3 (odd) and none of &plusmn;1 &plusmn;2 equals 0. The rule &ldquo;the total must be even&rdquo; matches. (In general it is possible exactly when 1 + 2 + &hellip; + <i>n</i> is even.)<br><br><b>Trap</b>: Many students think &ldquo;with so many jumps, surely some choice of directions works.&rdquo; The parity of the total sum decides it, no matter how the directions are chosen.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "The product of two of the four zeros of the quartic equation<br><br><i>x</i><sup>4</sup> &minus; 18<i>x</i><sup>3</sup> + <i>kx</i><sup>2</sup> + 200<i>x</i> &minus; 1984 = 0<br><br>is &minus;32. Find <i>k</i>.", "opts": ["86", "30", "56", "62"], "ci": 0, "exp": "<b>What we need</b><br><br>The quartic <i>x</i><sup>4</sup> &minus; 18<i>x</i><sup>3</sup> + <i>k</i><i>x</i><sup>2</sup> + 200<i>x</i> &minus; 1984 = 0 has two zeros whose product is &minus;32. Find <i>k</i>.<br><br><b>Step 1 &ndash; Group the zeros into two pairs.</b> By Vieta, the product of all four zeros is the constant term &minus;1984 (degree 4 is even, leading coefficient 1). If one pair has product &minus;32, the other pair has product <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;1984</span><span style=\"border-top:1.4px solid #111;\">&minus;32</span></span> = 62.<br><br><b>Step 2 &ndash; Write the quartic as two quadratics.</b> A pair with sum <i>m</i> and product &minus;32 is the zeros of <i>x</i><sup>2</sup> &minus; <i>m</i><i>x</i> &minus; 32; the other pair (sum <i>n</i>, product 62) gives <i>x</i><sup>2</sup> &minus; <i>n</i><i>x</i> + 62. So <i>x</i><sup>4</sup> &minus; 18<i>x</i><sup>3</sup> + <i>k</i><i>x</i><sup>2</sup> + 200<i>x</i> &minus; 1984 = (<i>x</i><sup>2</sup> &minus; <i>m</i><i>x</i> &minus; 32)(<i>x</i><sup>2</sup> &minus; <i>n</i><i>x</i> + 62).<br><br><b>Step 3 &ndash; Expand and match coefficients.</b> The right side is <i>x</i><sup>4</sup> &minus; (<i>m</i> + <i>n</i>)<i>x</i><sup>3</sup> + (<i>mn</i> + 62 &minus; 32)<i>x</i><sup>2</sup> + (32<i>n</i> &minus; 62<i>m</i>)<i>x</i> &minus; 1984.<br>&bull; <i>x</i><sup>3</sup>: <i>m</i> + <i>n</i> = 18.<br>&bull; <i>x</i>: 32<i>n</i> &minus; 62<i>m</i> = 200.<br><br><b>Step 4 &ndash; Solve.</b> Put <i>n</i> = 18 &minus; <i>m</i>: 32(18 &minus; <i>m</i>) &minus; 62<i>m</i> = 200, so 576 &minus; 94<i>m</i> = 200, so 94<i>m</i> = 376, so <i>m</i> = 4 and <i>n</i> = 14.<br><br><b>Step 5 &ndash; Find <i>k</i>.</b> <i>k</i> = <i>mn</i> + 62 &minus; 32 = 4&middot;14 + 30 = 56 + 30 = 86.<br><br><b>Answer check</b>: (<i>x</i><sup>2</sup> &minus; 4<i>x</i> &minus; 32)(<i>x</i><sup>2</sup> &minus; 14<i>x</i> + 62) expands to <i>x</i><sup>4</sup> &minus; 18<i>x</i><sup>3</sup> + 86<i>x</i><sup>2</sup> + 200<i>x</i> &minus; 1984. &#10003; (Also <i>x</i><sup>2</sup> &minus; 4<i>x</i> &minus; 32 = (<i>x</i> &minus; 8)(<i>x</i> + 4), whose zeros 8 and &minus;4 really multiply to &minus;32.)<br><br><b>Trap</b>: 56 is only <i>mn</i> &mdash; it forgets the 62 &minus; 32 = 30 that comes from multiplying the constant terms with the <i>x</i><sup>2</sup> terms. 30 is that leftover part alone.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "A computer system considers a string of decimal digits a valid codeword if it contains an even number of 0<i>s</i>. Find a closed form for <i>a</i><sub><i>n</i></sub>, the number of valid <i>n</i>-digit codewords.", "opts": ["8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)"], "ci": 1, "exp": "<b>What we need:</b> a formula for <i>a</i><sub><i>n</i></sub>, the number of strings of <i>n</i> decimal digits (0–9, any digit allowed in any place) that contain an even number of zeros.<br><br><b>Step 1 — Pair it with the opposite count.</b> Let <i>b</i><sub><i>n</i></sub> be the number of <i>n</i>-digit strings with an odd number of zeros. Every string is one or the other, so <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup>.<br><br><b>Step 2 — Build a string one digit at a time.</b> Add one more digit to a string of length <i>n</i> &minus; 1. If the new digit is one of the 9 nonzero digits, the number of zeros keeps its parity. If the new digit is 0, the parity flips. So<br><i>a</i><sub><i>n</i></sub> = 9<i>a</i><sub><i>n</i> &minus; 1</sub> + <i>b</i><sub><i>n</i> &minus; 1</sub>, and <i>b</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i> &minus; 1</sub> + 9<i>b</i><sub><i>n</i> &minus; 1</sub>.<br><br><b>Step 3 — Look at the difference.</b> Let <i>d</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub>. Subtracting the two lines: <i>d</i><sub><i>n</i></sub> = 8<i>a</i><sub><i>n</i> &minus; 1</sub> &minus; 8<i>b</i><sub><i>n</i> &minus; 1</sub> = 8<i>d</i><sub><i>n</i> &minus; 1</sub>. The empty string (length 0) has zero zeros, which is even, so <i>d</i><sub>0</sub> = 1 &minus; 0 = 1. Therefore <i>d</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>.<br><br><b>Step 4 — Solve the two equations.</b> <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> and <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>. Adding them: 2<i>a</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> + 8<sup><i>n</i></sup>, so <i>a</i><sub><i>n</i></sub> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>).<br><br><b>Answer check:</b> <i>n</i> = 1: the 9 one-digit strings 1–9 have zero zeros, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8 + 10) = 9 ✔. <i>n</i> = 2: 81 strings with no 0 plus the string 00 = 82, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(64 + 100) = 82 ✔. A computer count for <i>n</i> = 1 to 5 gives 9, 82, 756, 7048, 66384, matching the formula each time.<br><br><b>Trap:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>) is <i>b</i><sub><i>n</i></sub>, the count with an <i>odd</i> number of zeros. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>) comes from using 9 instead of 8 in Step 3 — forgetting that the one choice of 0 sends a string to the other group.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Al walks down to the bottom of an escalator that is moving up and he counts 150 steps. Bob walks up to the top of the escalator and he counts 75 steps. If Al's speed of walking (in steps per unit time) is three times Bob's walking speed, how many steps are visible on the escalator at a given time? (AIME)", "opts": ["150 steps", "100 steps", "120 steps", "110 steps"], "ci": 2, "exp": "<b>What we need</b><br><br>Let <i>N</i> be the number of visible steps. Let Bob walk <i>b</i> steps per unit time, so Al walks 3<i>b</i>, and let the escalator move <i>e</i> steps per unit time (upward).<br><br><b>Step 1 &ndash; Al (walking down, against the escalator).</b> He takes 150 steps, so his time is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>150</span><span style=\"border-top:1.4px solid #111;\">3<i>b</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>50</span><span style=\"border-top:1.4px solid #111;\"><i>b</i></span></span>. During that time the escalator carries him up <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>50<i>e</i></span><span style=\"border-top:1.4px solid #111;\"><i>b</i></span></span> steps. His own 150 steps cover the visible steps plus what the escalator brought up: 150 = <i>N</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>50<i>e</i></span><span style=\"border-top:1.4px solid #111;\"><i>b</i></span></span>, so <i>N</i> = 150 &minus; 50<i>r</i>, where <i>r</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>e</i></span><span style=\"border-top:1.4px solid #111;\"><i>b</i></span></span>.<br><br><b>Step 2 &ndash; Bob (walking up, with the escalator).</b> He takes 75 steps, so his time is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>75</span><span style=\"border-top:1.4px solid #111;\"><i>b</i></span></span>. The escalator helps by <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>75<i>e</i></span><span style=\"border-top:1.4px solid #111;\"><i>b</i></span></span> steps: <i>N</i> = 75 + 75<i>r</i>.<br><br><b>Step 3 &ndash; Set them equal.</b> 150 &minus; 50<i>r</i> = 75 + 75<i>r</i>, so 75 = 125<i>r</i>, so <i>r</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span>. Then <i>N</i> = 75 + 75&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span> = 75 + 45 = 120.<br><br><b>Answer check</b>: From Al&rsquo;s side, <i>N</i> = 150 &minus; 50&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span> = 150 &minus; 30 = 120. &#10003; Both walkers give the same 120 visible steps.<br><br><b>Trap</b>: Adding the escalator&rsquo;s steps for Al (instead of subtracting) or ignoring that Al is 3 times as fast leads to answers like 100 or 150. Always ask: does the escalator help or fight this walker?", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "If <i>f</i>(<i>x</i>)+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>&middot;<i>f</i>(&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>) = 3, what is the value of <i>f</i>(2)? (MathCounts)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span>", "3", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>"], "ci": 3, "exp": "<b>What we need</b><br><br>We know <i>f</i>(<i>x</i>) + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>&middot;<i>f</i>(&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>) = 3 for every nonzero <i>x</i>, and we want <i>f</i>(2).<br><br><b>Step 1 &ndash; Plug in the two values that are linked.</b> Put <i>x</i> = 2: <i>f</i>(2) + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>&middot;<i>f</i>(&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>) = 3. &nbsp;(1)<br><br>Put <i>x</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>: then <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> = &minus;2 and &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> = 2, so <i>f</i>(&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>) + (&minus;2)&middot;<i>f</i>(2) = 3. &nbsp;(2)<br><br><b>Step 2 &ndash; Solve the system.</b> Let <i>a</i> = <i>f</i>(2) and <i>b</i> = <i>f</i>(&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>). Then (1) says <i>a</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span><i>b</i> = 3 and (2) says <i>b</i> &minus; 2<i>a</i> = 3, so <i>b</i> = 3 + 2<i>a</i>.<br><br>Substitute into (1): <i>a</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(3 + 2<i>a</i>) = 3, so <i>a</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> + <i>a</i> = 3, so 2<i>a</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, so <i>a</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>.<br><br><b>Step 3 &ndash; General formula (optional).</b> Doing the same with a general <i>x</i> gives 2<i>f</i>(<i>x</i>) + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> = 3, so <i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2<i>x</i></span></span>, and <i>f</i>(2) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>.<br><br><b>Answer check</b>: Then <i>b</i> = 3 + 2&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">2</span></span>. Equation (1): <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = 3. &#10003; Equation (2): <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &minus; 2&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 3. &#10003;<br><br><b>Trap</b>: Plugging in only <i>x</i> = 2 gives one equation with two unknowns. The answer <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span> is the value of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span><i>f</i>(&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>), not <i>f</i>(2), and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> is only the first part of the formula <i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2<i>x</i></span></span> (the second part was dropped).", "tag": "Chapter 2", "tagcolor": "#1D9E75"}];

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function renderQuestion(){

  var pb = document.getElementById('passage-box');

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
