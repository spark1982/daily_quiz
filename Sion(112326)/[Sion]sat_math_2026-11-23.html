<style>

  * { box-sizing: border-box; }

  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }

  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }

  .btn-save { background:#7b61ff; color:#fff; }

  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }

  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }

  .sat-timer{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#eef3fb;border:1px solid #c9d8ef;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:0.9rem;font-weight:700;color:#185FA5;position:sticky;top:0;z-index:5;}
  .sat-timer .over{color:#E24B4A;}

<script>
var TITLE = "[Sion] SAT Math";
var QUIZ_KEY = "sionsatmath_10";
var INSTRUCTION = "Choose the correct answer for each problem. A calculator (Desmos) is allowed, as on the real SAT.";
var TODAY_STR = "20261123";
var RAW_QUESTIONS = [{"stem": "Which of the following is equivalent to <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i><sup>2</sup> &minus; 9</span><span style=\"border-top:1.4px solid #111;\"><i>x</i><sup>2</sup> + <i>x</i> &minus; 6</span></span> for <i>x</i> &gt; 3?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> + 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>"], "ci": 0, "exp": "<b>What it asks:</b> a simpler expression with the same value as the rational expression.<br><br><b>Step 1:</b> Factor the numerator as a difference of squares: <i>x</i><sup>2</sup> &minus; 9 = (<i>x</i> &minus; 3)(<i>x</i> + 3).<br><br><b>Step 2:</b> Factor the denominator: <i>x</i><sup>2</sup> + <i>x</i> &minus; 6 = (<i>x</i> + 3)(<i>x</i> &minus; 2) (numbers that multiply to &minus;6 and add to 1 are 3 and &minus;2).<br><br><b>Step 3:</b> Cancel the common factor (<i>x</i> + 3), which is not zero for <i>x</i> &gt; 3: the expression equals <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>.<br><br><b>Answer check:</b> Try <i>x</i> = 4: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>16 &minus; 9</span><span style=\"border-top:1.4px solid #111;\">16 + 4 &minus; 6</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>7</span><span style=\"border-top:1.4px solid #111;\">14</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4 &minus; 3</span><span style=\"border-top:1.4px solid #111;\">4 &minus; 2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>. &#10003;<br><br><b>Traps:</b><br>&bull; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span> &mdash; canceling the wrong factor (<i>x</i> &minus; 3) from the top.<br>&bull; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> + 2</span></span> &mdash; factoring the denominator as (<i>x</i> + 3)(<i>x</i> + 2), whose product is <i>x</i><sup>2</sup> + 5<i>x</i> + 6.<br>&bull; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span> &mdash; illegally &ldquo;canceling&rdquo; the <i>x</i><sup>2</sup> terms.<br><br><b>Desmos:</b> Graph both expressions; they match for <i>x</i> &gt; 3.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "<i>y</i> = <i>x</i><sup>2</sup> &minus; 4<i>x</i> + 7<br><i>y</i> = 2<i>x</i> + <i>k</i><br><br>In the system of equations above, <i>k</i> is a constant. For what value of <i>k</i> does the system have exactly one real solution?", "opts": ["2", "&minus;2", "9", "3"], "ci": 1, "exp": "<b>What it asks:</b> the value of <i>k</i> that makes the line touch the parabola at exactly one point.<br><br><b>Step 1:</b> Set the expressions equal: <i>x</i><sup>2</sup> &minus; 4<i>x</i> + 7 = 2<i>x</i> + <i>k</i>, so <i>x</i><sup>2</sup> &minus; 6<i>x</i> + (7 &minus; k) = 0.<br><br><b>Step 2:</b> Exactly one solution means the discriminant is zero: (&minus;6)<sup>2</sup> &minus; 4(1)(7 &minus; k) = 0.<br><br><b>Step 3:</b> So 36 &minus; 28 + 4<i>k</i> = 0, which gives 8 + 4<i>k</i> = 0 and <i>k</i> = &minus;2.<br><br><b>Answer check:</b> With <i>k</i> = &minus;2, <i>x</i><sup>2</sup> &minus; 6<i>x</i> + 9 = (<i>x</i> &minus; 3)<sup>2</sup> = 0, so <i>x</i> = 3 only, and <i>y</i> = 2(3) &minus; 2 = 4 = 9 &minus; 12 + 7. &#10003;<br><br><b>Traps:</b><br>&bull; 2 &mdash; sign error in 8 + 4<i>k</i> = 0.<br>&bull; 3 &mdash; using only the parabola&rsquo;<i>s</i> coefficient &minus;4 instead of the combined &minus;6: 16 &minus; 4(7 &minus; k) = 0 gives <i>k</i> = 3.<br>&bull; 9 &mdash; noticing that 7 &minus; <i>k</i> must equal 9 for a perfect square, then reporting 9 instead of solving 7 &minus; <i>k</i> = 9.<br><br><b>Desmos:</b> Graph both with a slider for <i>k</i>; the line becomes tangent at <i>k</i> = &minus;2.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "2<i>x</i> &minus; <i>ky</i> = 5<br>6<i>x</i> &minus; 9<i>y</i> = 14<br><br>In the system of equations above, <i>k</i> is a constant. If the system has no solution, what is the value of <i>k</i>?", "opts": ["3", "27", "9", "&minus;3"], "ci": 0, "exp": "<b>What it asks:</b> the value of <i>k</i> that makes the two lines parallel but not the same line.<br><br><b>Step 1:</b> A system of two linear equations has no solution when the lines have the same slope but different intercepts, that is, when the <i>x</i>- and <i>y</i>-coefficients are proportional but the constants are not.<br><br><b>Step 2:</b> Multiply the first equation by 3 so its <i>x</i>-coefficient matches: 6<i>x</i> &minus; 3<i>ky</i> = 15.<br><br><b>Step 3:</b> Compare with 6<i>x</i> &minus; 9<i>y</i> = 14: the <i>y</i>-coefficients must match, so 3<i>k</i> = 9 and <i>k</i> = 3. The constants are 15 and 14, which differ, so the lines are parallel and distinct.<br><br><b>Answer check:</b> With <i>k</i> = 3 the first line is <i>y</i> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)<i>x</i> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">3</span></span> and the second is <i>y</i> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)<i>x</i> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>14</span><span style=\"border-top:1.4px solid #111;\">9</span></span>: same slope, different intercepts (&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">9</span></span> vs. &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>14</span><span style=\"border-top:1.4px solid #111;\">9</span></span>). &#10003;<br><br><b>Traps:</b><br>&bull; &minus;3 &mdash; sign error when matching &minus;3<i>k</i> with &minus;9.<br>&bull; 9 &mdash; copying the coefficient &minus;9 without scaling the first equation.<br>&bull; 27 &mdash; multiplying 9 by 3 instead of dividing.<br><br><b>Desmos:</b> Type 2<i>x</i> &minus; <i>ky</i> = 5 with a <i>k</i> slider next to 6<i>x</i> &minus; 9<i>y</i> = 14; the lines become parallel at <i>k</i> = 3.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "A <i>caf</i>&eacute; recorded the outdoor high temperature <i>x</i>, in degrees Fahrenheit, and the number of iced drinks <i>y</i> it sold on each of 40 days. The line of best fit for the data is <i>y</i> = 3.2<i>x</i> &minus; 118. Which of the following is the best interpretation of the number 3.2 in this context?", "opts": ["For each additional iced drink sold, the model predicts the high temperature rises by about 3.2 degrees Fahrenheit.", "For each increase of 1 degree Fahrenheit in the high temperature, the model predicts about 3.2 more iced drinks sold.", "The model predicts that about 3.2 iced drinks are sold on a day when the high temperature is 0 degrees Fahrenheit.", "On average, the <i>caf</i>&eacute; sold about 3.2 iced drinks per hour on the 40 days."], "ci": 1, "exp": "<b>What it asks:</b> what the slope of a line of best fit means in context.<br><br><b>Step 1:</b> In <i>y</i> = <i>mx</i> + <i>b</i>, the slope <i>m</i> is the change in <i>y</i> for each increase of 1 in <i>x</i>.<br><br><b>Step 2:</b> Here <i>x</i> is temperature (degrees Fahrenheit) and <i>y</i> is iced drinks sold, so 3.2 is the predicted increase in drinks for each 1-degree increase.<br><br><b>Step 3:</b> It is a prediction from the model, so &ldquo;about&rdquo; and &ldquo;predicts&rdquo; are appropriate.<br><br><b>Answer check:</b> From 80 to 81 degrees: <i>y</i> goes from 3.2(80) &minus; 118 = 138 to 3.2(81) &minus; 118 = 141.2, an increase of 3.2. &#10003;<br><br><b>Traps:</b><br>&bull; &ldquo;0 degrees&rdquo; choice &mdash; describes the <i>y</i>-intercept, which is &minus;118 here (and is not meaningful).<br>&bull; &ldquo;temperature rises&rdquo; choice &mdash; reverses the variables; drinks do not cause temperature.<br>&bull; &ldquo;per hour&rdquo; choice &mdash; the data are per day, and the slope is a rate per degree, not per hour.", "tag": "Problem-Solving and Data Analysis", "tagcolor": "#1D9E75"}, {"stem": "A delivery van can safely carry at most 1,500 pounds of driver and cargo. The driver weighs 180 pounds, and each box weighs 42 pounds. What is the greatest number of boxes the driver can load into the van?", "opts": ["36", "31", "35", "32"], "ci": 1, "exp": "<b>What it asks:</b> the largest whole number of boxes that keeps the total weight at or below 1,500 pounds.<br><br><b>Step 1:</b> Let <i>b</i> be the number of boxes. Total weight: 180 + 42<i>b</i> &le; 1,500.<br><br><b>Step 2:</b> Subtract 180: 42<i>b</i> &le; 1,320. Divide by 42: <i>b</i> &le; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1,320</span><span style=\"border-top:1.4px solid #111;\">42</span></span> &asymp; 31.43.<br><br><b>Step 3:</b> Boxes come in whole numbers, so the greatest value is <i>b</i> = 31 (rounding <i>down</i>, because 32 would break the limit).<br><br><b>Answer check:</b> 180 + 42(31) = 1,482 &le; 1,500, but 180 + 42(32) = 1,524 &gt; 1,500.<br><br><b>Traps:</b><br>&bull; 32 &mdash; rounding 31.43 to the nearest whole number instead of down.<br>&bull; 35 or 36 &mdash; forgetting the driver&rsquo;<i>s</i> 180 pounds (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1,500</span><span style=\"border-top:1.4px solid #111;\">42</span></span> &asymp; 35.7).", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = <i>a</i>(<i>b</i>)<sup><i>x</i></sup>, where a and <i>b</i> are positive constants. If <i>f</i>(1) = 12 and <i>f</i>(3) = 108, what is the value of <i>f</i>(4)?", "opts": ["324", "216", "972", "432"], "ci": 0, "exp": "<b>What it asks:</b> <i>f</i>(4) for an exponential function determined by two points.<br><br><b>Step 1:</b> Write the two facts: <i>ab</i> = 12 and <i>ab</i><sup>3</sup> = 108.<br><br><b>Step 2:</b> Divide the second by the first: <i>b</i><sup>2</sup> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>108</span><span style=\"border-top:1.4px solid #111;\">12</span></span> = 9. Since <i>b</i> is positive, <i>b</i> = 3.<br><br><b>Step 3:</b> Then <i>a</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 4, so <i>f</i>(<i>x</i>) = 4(3)<sup><i>x</i></sup> and <i>f</i>(4) = 4 &times; 81 = 324.<br><br><b>Answer check:</b> <i>f</i>(1) = 4 &times; 3 = 12 &#10003;, <i>f</i>(3) = 4 &times; 27 = 108 &#10003;. Also each step multiplies by 3, so <i>f</i>(4) = 3 &times; <i>f</i>(3) = 324.<br><br><b>Traps:</b><br>&bull; 972 &mdash; multiplying <i>f</i>(3) by 9 (treating <i>b</i><sup>2</sup> = 9 as the one-step factor).<br>&bull; 216 &mdash; treating the growth as linear: adding 108 to 108.<br>&bull; 432 &mdash; multiplying <i>f</i>(3) by <i>a</i> = 4 instead of by the growth factor <i>b</i> = 3.<br><br><b>Desmos:</b> Enter <i>f</i>(<i>x</i>) = <i>a</i>&middot;<i>b</i><sup><i>x</i></sup> with the points (1, 12) and (3, 108) as a regression or use sliders for a and <i>b</i>.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "A cube is inscribed in a sphere, so that all eight vertices of the cube lie on the sphere. The volume of the sphere is 36&pi; cubic centimeters. What is the volume of the cube, in cubic centimeters?", "opts": ["3<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>", "54<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>", "24<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>", "216"], "ci": 2, "exp": "<b>What it asks:</b> the cube&rsquo;<i>s</i> volume when its vertices touch a sphere of known volume.<br><br><b>Step 1:</b> Find the radius: (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)&pi;<i>r</i><sup>3</sup> = 36&pi;, so <i>r</i><sup>3</sup> = 27 and <i>r</i> = 3. The diameter is 6.<br><br><b>Step 2:</b> For an inscribed cube, the <i>space diagonal</i> (corner to opposite corner through the center) is a diameter. A cube with edge <i>s</i> has space diagonal <i>s</i><span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> (from <i>s</i><sup>2</sup> + <i>s</i><sup>2</sup> + <i>s</i><sup>2</sup>). So <i>s</i><span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> = 6 and <i>s</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>6</span><span style=\"border-top:1.4px solid #111;\"><span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span></span></span> = 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>.<br><br><b>Step 3:</b> Volume: <i>s</i><sup>3</sup> = (2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>)<sup>3</sup> = 8 &times; 3<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> = 24<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>.<br><br><b>Answer check:</b> <i>s</i> = 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> &asymp; 3.464, so <i>s</i><span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> = 6 &#10003; and <i>s</i><sup>3</sup> &asymp; 41.57; 24<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> &asymp; 41.57. &#10003; The cube (&asymp; 41.6) is smaller than the sphere (36&pi; &asymp; 113.1), as it must be.<br><br><b>Traps:</b><br>&bull; 216 &mdash; setting the edge equal to the diameter (6<sup>3</sup>). That cube would stick out of the sphere.<br>&bull; 54<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span> &mdash; using the <i>face</i> diagonal: <i>s</i><span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span> = 6 gives <i>s</i> = 3<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span> and <i>s</i><sup>3</sup> = 54<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>.<br>&bull; 3<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> &mdash; setting the space diagonal equal to the radius 3 instead of the diameter.", "tag": "Geometry and Trigonometry", "tagcolor": "#E24B4A"}, {"stem": "Line &ell; passes through the point (&minus;2, 7) and is perpendicular to the line 3<i>x</i> &minus; 4<i>y</i> = 12. What is the <i>y</i>-intercept of line &ell;?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>29</span><span style=\"border-top:1.4px solid #111;\">3</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>13</span><span style=\"border-top:1.4px solid #111;\">3</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>11</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>17</span><span style=\"border-top:1.4px solid #111;\">2</span></span>"], "ci": 1, "exp": "<b>What it asks:</b> the <i>y</i>-intercept of the line through (&minus;2, 7) that is perpendicular to 3<i>x</i> &minus; 4<i>y</i> = 12.<br><br><b>Step 1:</b> Find the slope of the given line: 3<i>x</i> &minus; 4<i>y</i> = 12 gives &minus;4<i>y</i> = &minus;3<i>x</i> + 12, so <i>y</i> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)<i>x</i> &minus; 3. Its slope is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>.<br><br><b>Step 2:</b> A perpendicular line has the negative reciprocal slope: &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span>.<br><br><b>Step 3:</b> Use <i>y</i> = <i>mx</i> + <i>b</i> with (&minus;2, 7): 7 = (&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)(&minus;2) + <i>b</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>8</span><span style=\"border-top:1.4px solid #111;\">3</span></sp   bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function curAnswered(){ if(window.EXAM_ACTIVE && EXAM_ACTIVE()) return false; var q = activeOrder()[state.cur]; return q !== undefined && state.answers[q] !== undefined; } /* sat-timer-pause-on-answer 2026-11-14 */
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && !curAnswered() && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
