<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
html{margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:2px 12px 8px;background:#fff;}
#attbar{text-align:center;font-size:0.8rem;color:#888;margin-bottom:6px;}

.timer-bar{background:#fff;border-bottom:1px solid #d0dce8;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}

#nav-bar{display:flex;align-items:center;gap:8px;margin:10px 0;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#1D9E75;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}

.q-tag{display:inline-block;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:6px;}
.box-ctx{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.92rem;color:#222;line-height:1.6;}
.q-stem{font-size:1.05rem;font-weight:700;color:#111;margin-bottom:14px;line-height:1.5;}
.ul{text-decoration:underline;font-style:normal;}

.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;line-height:1.4;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}

.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.5;}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#1D9E75;}
.next-btn{background:#1D9E75;color:#fff;}
.prev-btn:disabled{opacity:0.4;cursor:default;}

.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:340px;margin:20px;text-align:center;}

.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}
.fr .fn,.fr .fd{display:block;font-size:0.78em;line-height:1.25;padding:0 3px;}
.fr .fb{display:block;border-top:1.5px solid currentColor;min-width:14px;}
.radical{display:inline-flex;align-items:center;vertical-align:middle;}
.radical-index{font-size:0.65em;align-self:flex-start;margin-right:1px;line-height:1;}
.radical-symbol{display:inline-flex;align-items:stretch;}
.radical-symbol::before{content:"\221A";font-size:1.15em;line-height:1;position:relative;top:2px;}
.radical-content{border-top:2.5px solid currentColor;padding:1px 4px 1px 2px;display:inline-block;line-height:1.3;}
.mblock{text-align:center;margin:10px 0;font-size:1.05em;font-style:italic;line-height:2;}
svg.qsvg{display:block;margin:8px auto;max-width:100%;}

<body>

<div class="title-hd">[Sion] Advanced SAT Reading</div>
<div class="instruction">Read each passage and choose the best answer.</div>
<div id="attbar"></div>

<div class="timer-bar" id="timerBar">
  <div class="timer-setup" id="timerSetup">
    <label for="timerMinutesInput">Set Time Limit:</label>
    <input type="number" id="timerMinutesInput" min="1" max="180" value="25"> min
    <button class="timer-start-btn" onclick="startTimer()">Start</button>

</div>

  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #1D9E75;border-radius:14px;background:#fff;color:#1D9E75;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div id="tagWrap"><span class="q-tag" id="q-tag-label"></span></div>
  <div class="q-num" id="q-num"></div>
  <div class="box-ctx" id="box-ctx" style="display:none;"></div>
  <div class="q-stem" id="q-stem"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" id="prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">

  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModalOriginal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:12px;">Start Fresh (Original Order)</button>
  <button onclick="openFreshModalRandom()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh (Random Order)</button>
</div>

<div class="modal-overlay" id="freshModal">

    <p id="freshModalText" style="font-size:0.95rem;color:#444;margin:0 0 16px;">All progress will be cleared.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<div class="modal-overlay" id="clearAttModal">
</div>

var RAW_QUESTIONS = [{"tag": "Cross-Text Connections", "box": "Text 1: Some education researchers argue that standardized test scores, despite their flaws, remain the most reliable tool available for identifying under-resourced schools that need additional funding, since the scores provide a consistent metric that can be compared across an entire state each year.<br><br>Text 2: An analysis of one state's testing data found that schools serving large numbers of recent immigrants often scored lowest on standardized tests, not because these schools were the most under-resourced, but because the tests were administered only in English, disadvantaging students who were still developing English proficiency regardless of the school's actual funding level.", "stem": "How would the researcher who conducted the analysis described in Text 2 most likely respond to the claim in Text 1?", "opts": ["By cautioning that test scores can be driven by factors such as language barriers rather than resource levels, making them a less reliable indicator of funding need than Text 1 suggests.", "By agreeing entirely that standardized test scores are the most reliable way to identify under-resourced schools in every state.", "By arguing that standardized testing should be eliminated entirely and replaced with no metric at all.", "By pointing out that under-resourced schools always have the highest numbers of recent immigrant students."], "ci": 0, "exp": "The Text 2 researcher's own findings show that low scores can result from language barriers rather than actual resource shortages, which directly supports a cautious, limiting response to Text 1's broad claim about reliability. Full agreement is inconsistent with a finding that complicates the reliability of test scores. Text 2 never argues for eliminating testing altogether, only for questioning its use as the sole indicator of funding need. Text 2 also never claims that under-resourced schools always have the most recent immigrant students; it only describes what happened in one analysis."}, {"tag": "Transitions", "box": "The committee had expected the new recycling program to reduce landfill waste significantly within its first year. ______, waste levels dropped by less than two percent, a result the committee attributed to widespread confusion about which materials the program actually accepted.", "stem": "Which choice completes the text with the most logically appropriate transition?", "opts": ["In practice, however,", "Fittingly,", "As anticipated,", "Similarly,"], "ci": 0, "exp": "\"In practice, however,\" correctly signals the shift from what the committee expected to what actually happened, a sharp drop of less than two percent instead of a significant reduction. \"Fittingly\" and \"As anticipated\" both incorrectly suggest the outcome matched expectations, the opposite of what occurred. \"Similarly\" incorrectly implies the second sentence aligns with the first rather than contrasting with it."}, {"tag": "Command of Evidence (If True)", "box": "A curriculum specialist hypothesizes that students who complete brief, low-stakes retrieval quizzes throughout a unit will retain more material on a final exam than students who spend the same amount of time simply rereading their notes, because actively recalling information strengthens memory more effectively than passive review does.", "stem": "Which finding, if true, would most strengthen the curriculum specialist's hypothesis?", "opts": ["Students who took retrieval quizzes scored significantly higher on the final exam than students who only reread their notes, even though both groups spent equal study time.", "Students who took retrieval quizzes reported enjoying their study sessions more than students who only reread their notes.", "Teachers who assigned retrieval quizzes spent less time preparing lesson plans than teachers who assigned rereading.", "Students who reread their notes multiple times remembered the material better than students who read it only once."], "ci": 0, "exp": "The hypothesis compares retrieval quizzing against rereading when study time is held equal, so a result showing a higher score for the quiz group under those exact equal-time conditions directly confirms it. Greater enjoyment says nothing about how much material was retained. A difference in teacher preparation time is unrelated to student retention. The last option only compares two amounts of rereading to each other, never testing rereading against retrieval practice."}, {"tag": "Cross-Text Connections", "box": "Text 1: Proponents of universal basic income argue that a guaranteed monthly payment would reduce poverty more efficiently than the current patchwork of means-tested welfare programs, since it eliminates the administrative overhead and stigma associated with proving eligibility for dozens of separate benefits.<br><br>Text 2: A recent pilot study found that unconditional cash transfers did reduce administrative costs relative to traditional welfare programs, but only for recipients who were already stably housed; unhoused participants in the same pilot struggled to receive and manage payments reliably, suggesting that a single cash program cannot fully replace the specialized services some means-tested programs provide.", "stem": "Which statement best describes how the pilot study's findings in Text 2 relate to the claim made in Text 1?", "opts": ["The findings partly support Text 1's claim about efficiency, but suggest the benefit does not extend to every population that the claim in Text 1 would need to cover.", "The findings completely contradict Text 1's claim, showing that cash transfers never reduce administrative costs compared to traditional welfare programs.", "The findings fully confirm Text 1's claim and show that a universal basic income would work equally well for every group of recipients.", "The findings show that means-tested welfare programs are completely ineffective at helping unhoused individuals."], "ci": 0, "exp": "Text 2 shows lower administrative costs for stably housed recipients, partly supporting Text 1, but also shows the approach struggling for unhoused recipients, a limitation Text 1's broad claim does not account for. The findings do not completely contradict Text 1, since costs actually did fall for one group. They do not fully confirm Text 1 either, since the unhoused group's results undercut the claim that a single cash program can replace all means-tested programs. Text 2 never evaluates how effective means-tested programs are for unhoused individuals, only how a cash-transfer pilot performed."}, {"tag": "Command of Evidence (If True)", "box": "A wildlife researcher hypothesizes that when a species of songbird arrives at its summer breeding grounds earlier in spring, the population in that region increases, because earlier arrival gives pairs more time to complete successful nesting cycles before autumn migration begins. The chart below shows population change across four regions, ordered from earliest to latest average arrival date.<br><svg class=\"qsvg\" width=\"320\" height=\"200\" viewBox=\"0 0 320 200\"><line x1=\"40\" y1=\"15\" x2=\"40\" y2=\"160\" stroke=\"#888\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"160\" x2=\"310\" y2=\"160\" stroke=\"#888\" stroke-width=\"1.5\"/><rect x=\"55\" y=\"44.0\" width=\"55\" height=\"116.0\" fill=\"#185FA5\"/><text x=\"82.5\" y=\"39.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">+24%</text><text x=\"82.5\" y=\"174\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\">Region A</text><text x=\"82.5\" y=\"185\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\">(earliest arrival)</text><rect x=\"130\" y=\"68.16666666666667\" width=\"55\" height=\"91.83333333333333\" fill=\"#185FA5\"/><text x=\"157.5\" y=\"63.16666666666667\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">+19%</text><text x=\"157.5\" y=\"174\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\">Region B</text><rect x=\"205\" y=\"106.83333333333334\" width=\"55\" height=\"53.166666666666664\" fill=\"#185FA5\"/><text x=\"232.5\" y=\"101.83333333333334\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">+11%</text><text x=\"232.5\" y=\"174\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\">Region C</text><rect x=\"280\" y=\"150.33333333333334\" width=\"55\" height=\"9.666666666666666\" fill=\"#185FA5\"/><text x=\"307.5\" y=\"145.33333333333334\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\">+2%</text><text x=\"307.5\" y=\"174\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\">Region D</text><text x=\"307.5\" y=\"185\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\">(latest arrival)</text><text x=\"12\" y=\"23\" font-size=\"10\" fill=\"#555\" transform=\"rotate(-90 12,23)\"></text></svg>", "stem": "Which finding, if true, would most strengthen the researcher's hypothesis?", "opts": ["Regions where the birds arrived earliest also showed the highest rates of successful nesting before migration began.", "Birds that migrate earlier in spring tend to be slightly smaller in body size than birds that migrate later.", "The songbird population has been declining across most of its overall range for the past decade.", "Regions with earlier arrival dates also experienced significantly warmer average summer temperatures."], "ci": 0, "exp": "The hypothesis specifically claims that earlier arrival leads to more successful nesting cycles, which in turn raises population. A finding directly linking early arrival to higher nesting success would confirm that exact mechanism. The option about body size describes a related but separate trait that says nothing about nesting success. The option about an overall population decline does not explain the pattern shown in the chart. The option about summer temperature introduces a separate factor that might explain the pattern without confirming the researcher's specific claim about nesting time."}, {"tag": "Inferences", "box": "When a new online grocery delivery service launched in a mid-sized city, its founders priced delivery fees far below their competitors, expecting the low price to attract enough new customers to offset the loss on each individual delivery. After six months, however, internal data showed that most of the service's new customers were people who had previously used a competing delivery app and switched providers, rather than people who had never used a delivery service before. Because the company's marketing had specifically targeted people with no prior delivery experience, the analysts concluded that ______.", "stem": "Which choice most logically completes the text?", "opts": ["the marketing campaign was largely ineffective at reaching its intended audience of first-time delivery users, even though it succeeded in attracting customers overall", "most of the service's new customers had previously used a competing delivery app rather than being first-time users", "online grocery delivery services are never able to attract customers who have no prior delivery experience", "the company should immediately raise its delivery fees to match its competitors' prices"], "ci": 0, "exp": "This choice draws a new conclusion by connecting the marketing's intended audience to the mismatch revealed by the data, that the campaign failed to reach the group it targeted even while attracting customers from elsewhere. The second choice merely restates a fact already stated in the passage. The third choice generalizes from one company's experience to an absolute claim about \"never,\" which the passage does not support. The fourth choice recommends an action the passage never discusses or evaluates."}, {"tag": "Inferences", "box": "Marine biologists tagging juvenile sea turtles found that hatchlings released at dawn showed substantially higher survival rates during their first week at sea than hatchlings released at midday, even though predator density near the shore was measured to be nearly identical at both times. Because visual predators such as gulls rely heavily on contrast against the water's surface to spot prey, and because the light at dawn is markedly dimmer and less directional than the light at midday, the researchers concluded that ______.", "stem": "Which choice most logically completes the text?", "opts": ["reduced visual contrast at dawn likely makes it harder for predators to detect and target the hatchlings, even when just as many predators are present", "hatchlings released at dawn showed higher survival rates than hatchlings released at midday", "predators near the shore hunt exclusively by sight and never rely on any other senses to locate prey", "sea turtle hatchlings should always be released at dawn regardless of location or predator behavior"], "ci": 0, "exp": "This choice connects the two stated premises, the equal predator density and the dimmer, less directional dawn light, into a new explanation for why survival differs. The second choice simply repeats a fact already given in the passage rather than drawing a new conclusion from it. The third choice overreaches by claiming predators rely \"exclusively\" and \"never\" use other senses, far stronger than anything the passage supports. The fourth choice turns a specific research finding into a sweeping, unsupported recommendation that ignores other locations and conditions."}, {"tag": "Central Ideas and Details", "box": "Mr. Ashworth had grown wealthy by degrees, a shilling here, a favor remembered there, until at last his name commanded a respect his manners never could. He gave to charity with a punctuality that impressed the parish, though those who watched closely noted he gave always in public, and never once when no eye but his own might mark the sum.", "stem": "Which choice best states the central idea of this passage?", "opts": ["Mr. Ashworth's apparent generosity seems motivated more by a desire for public recognition than by genuine charitable feeling.", "Mr. Ashworth earned his entire fortune through a single fortunate financial windfall.", "The parish grew so disapproving of Mr. Ashworth's donations that they asked him to stop giving.", "Mr. Ashworth's manners were admired by the parish just as much as his growing wealth."], "ci": 0, "exp": "The passage notes that Ashworth gave \"always in public, and never once when no eye but his own might mark the sum,\" implying his charity was performed for recognition rather than out of real generosity, which is the passage's central idea. The phrase \"by degrees\" indicates his wealth grew gradually, not from one windfall. The passage never mentions the parish disapproving of his donations. The passage explicitly states that his manners could never command the respect his name did, the opposite of manners being equally admired."}, {"tag": "Central Ideas and Details", "box": "The old house stood apart from the village, wrapped in an ivy that seemed less an ornament than a shroud. Its windows, dim with dust, watched the road as an aged sentinel watches a battlefield long since abandoned, faithful still, though no one now marched there, and no one now remembered why the watch had ever been kept.", "stem": "Which choice best states the central idea of this passage?", "opts": ["The house continues a solitary vigil that has long outlived any real purpose.", "The villagers have completely forgotten the exact location of the old house.", "The ivy growing on the house has caused irreversible damage to its windows.", "A battle once took place on the road directly in front of the house."], "ci": 0, "exp": "The passage compares the house's watchful windows to a sentinel who keeps guarding a battlefield no one remembers, capturing the central idea of a pointless, ongoing vigil. The passage never claims the house's location was forgotten, only that the reason for its \"watch\" was. The ivy is described as shroud-like in appearance, not as a cause of structural damage. The battlefield comparison is a figure of speech, not a claim that an actual battle occurred there."}, {"tag": "Transitions", "box": "Critics of the new stadium funding plan predicted that ticket prices would rise sharply to cover construction costs. ______, prices actually fell slightly in the two years after the stadium opened, as increased attendance allowed the team to lower per-ticket revenue targets while still meeting its overall budget goals.", "stem": "Which choice completes the text with the most logically appropriate transition?", "opts": ["Contrary to that prediction,", "Granted,", "Consequently,", "In a similar vein,"], "ci": 0, "exp": "\"Contrary to that prediction,\" directly and correctly signals that the actual outcome, falling prices, opposed what critics had predicted. \"Granted\" typically introduces a concession before returning to support an original point, which does not fit a sentence that simply reports a contrasting outcome. \"Consequently\" incorrectly implies the price drop resulted from the prediction itself. \"In a similar vein\" incorrectly suggests agreement with the prediction rather than a reversal of it."}, {"tag": "Command of Evidence (Textual)", "box": "Miss Eleanor received the news with a composure that astonished her cousin, who had expected tears, or at least a trembling hand upon the mantel. Instead, she folded the letter twice, set it beneath the candlestick, and remarked only that the weather had turned unseasonably warm for October, a comment her cousin found, upon reflection, far more unsettling than any outburst could have been.", "stem": "Which quotation from the passage best supports the idea that Miss Eleanor's calm reaction troubled her cousin more than an emotional one would have?", "opts": ["\"a comment her cousin found, upon reflection, far more unsettling than any outburst could have been\"", "\"Miss Eleanor received the news with a composure that astonished her cousin\"", "\"she folded the letter twice, set it beneath the candlestick\"", "\"the weather had turned unseasonably warm for October\""], "ci": 0, "exp": "Only this quotation explicitly states that the cousin found the calm remark more unsettling than an emotional outburst would have been, directly supporting the claim. The quotation about composure shows the cousin was astonished, but astonishment alone does not establish that the reaction was more troubling than tears would have been. The quotation about folding the letter is a neutral physical action with no evaluative content. The quotation about the weather is simply what Miss Eleanor said, without indicating how her cousin felt about it."}, {"tag": "Command of Evidence (Textual)", "box": "The captain gave the order to turn back with a steadiness in his voice that no one aboard had heard him use before, not even in the worst of the November storms. It was this calm, more than any word he spoke, that told the crew exactly how much danger lay ahead.", "stem": "Which quotation from the passage best supports the idea that the captain's tone communicated more to the crew than the content of his words did?", "opts": ["\"It was this calm, more than any word he spoke, that told the crew exactly how much danger lay ahead.\"", "\"gave the order to turn back with a steadiness in his voice that no one aboard had heard him use before\"", "\"not even in the worst of the November storms\"", "\"exactly how much danger lay ahead\""], "ci": 0, "exp": "Only this quotation directly states that the calm tone, \"more than any word he spoke,\" is what conveyed the danger to the crew, exactly the comparison the question asks about. The second quotation shows the tone was unusually steady but does not compare it to the content of his words. The third quotation only establishes how rare this steadiness was, without addressing what it communicated. The fourth quotation names what was communicated but not that tone, rather than words, was what communicated it."}];

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}

  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;

    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; }
    else { state = defaultState(); }
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }
function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10) || 0; }catch(e){ return 0; } }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if (!state.timerStartedAt) { setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now() - state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if (remaining <= 0){ displayEl.textContent = "Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if (remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if (remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if (!minutes || minutes<=0) minutes = 25;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function resetTimer(){ state.timerTotalSec=null; state.timerStartedAt=null; saveState(); stopTimerInterval(); renderTimer(); }

function getShuffle(i){
  if (!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel'); var b=document.getElementById('jump-btn');
  if (p.style.display==='none' || !p.style.display){ p.style.display='block'; b.textContent='Hide \u25B4'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump \u25BE'; }
}
function renderDots(){
  var p=document.getElementById('dot-panel');
  if (p.style.display!=='block') return;
  var h='';
  for (var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if (Object.keys(state.answers).length === qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump \u25BE';
}

function showResults(){
  state.showResults = true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('attbar').textContent = 'Total Attempts: ' + loadAttempts();
  if (state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;

  var tagWrap = document.getElementById('tagWrap');
  var tagEl = document.getElementById('q-tag-label');
  if (q.tag){
    tagWrap.style.display='block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagWrap.style.display='none';
  }

  var bc = document.getElementById('box-ctx');
  if (q.box){ bc.style.display='block'; bc.innerHTML = q.box; }
  else { bc.style.display='none'; bc.innerHTML=''; }

  document.getElementById('q-stem').innerHTML = q.stem;

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for (var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn'; var dis='';
    if (ans !== undefined){
      dis='disabled';
      if (s===csi) cls+=' correct';
      else if (s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if (ans !== undefined && ans !== csi){ eb.style.display='block'; eb.innerHTML = q.exp; }
  else { eb.style.display='none'; }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.getElementById('prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i]===undefined) sk++;
    else if (state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if (a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Question '+(i+1)+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = si;
  saveState(); render();
}
function go(dir){
  if (dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i] !== undefined && state.answers[i] !== getCSI(i)){
      if (first===-1) first=i;
      delete state.answers[i];
    }
  }
  if (first !== -1){ state.cur=first; state.showResults=false; saveState(); render(); }
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    lines.push('Q'+(i+1)+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if (navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if (mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.startTimer=startTimer;

var _origAddListener = document.addEventListener.bind(document);
var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again/i;
document.addEventListener('click', function(ev){
  var el = ev.target, depth=0;
  while (el && depth<4){
    var isClickable = el.tagName==='BUTTON' || el.tagName==='A';
    if (isClickable){
      var txt = (el.textContent||'').trim();
      if (txt.length>0 && txt.length<40 && qzRetryRe.test(txt)){ resetTimer(); return; }
    }
    el = el.parentElement; depth++;
  }
}, true);

loadState(); saveState();
render();
if (state.timerStartedAt) startTimerInterval();

})();
</script>
</body>
</html>
