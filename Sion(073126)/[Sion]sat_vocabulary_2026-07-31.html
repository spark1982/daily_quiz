<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Vocabulary</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
html{margin:0 auto;}
.wrap{max-width:700px;margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.sub-hd{text-align:center;font-size:0.82rem;color:#555;margin-bottom:6px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
.q-tag{display:inline-block;background:#1D9E75;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.word-text{font-size:1.3rem;font-weight:800;color:#111;line-height:1.4;}
.speak-btn{background:#e8edf4;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;white-space:pre-line;}
.box-ctx{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.9rem;color:#222;line-height:1.6;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#1D9E75;}
.prev-btn:disabled{opacity:0.5;cursor:default;}
.next-btn{background:#1D9E75;color:#fff;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#1D9E75;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:340px;margin:20px;text-align:center;}
.timer-bar{background:#fff;border:1px solid #d0dce8;border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}

</style>
</head>
<body>
<div class="wrap">

<div class="title-hd">[Sion] SAT Vocabulary</div>
<div class="sub-hd" id="att-display">Total Attempts: 0</div>
<div class="instruction">Choose the best definition for each word.</div>

<div class="timer-bar" id="timerBar">
  <div class="timer-setup" id="timerSetup">
    <label for="timerMinutesInput">Set Time Limit:</label>
    <input type="number" id="timerMinutesInput" min="1" max="180" value="20"> min
    <button class="timer-start-btn" onclick="startTimer()">Start</button>
  </div>
  <div class="timer-running" id="timerRunning" style="display:none;">
    <span class="timer-label">Time Left</span>
    <span class="timer-display" id="timerDisplay">20:00</span>
  </div>
</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / N</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #1D9E75;border-radius:14px;background:#fff;color:#1D9E75;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div id="tagWrap"><span class="q-tag" id="q-tag-label" style="display:none;"></span></div>
  <div class="q-num" id="q-num"></div>
  <div class="box-ctx" id="box-ctx" style="display:none;"></div>
  <div class="word-row">
    <span class="word-text" id="q-word"></span>
    <button class="speak-btn" onclick="speakWord()" title="Listen">&#128264;</button>
  </div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#1D9E75;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="openFreshModalOriginal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:12px;">Start Fresh (Original Order)</button>
  <button onclick="openFreshModalRandom()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh (Random Order)</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <h3 id="freshModalTitle" style="margin:0 0 10px;color:#185FA5;font-size:1.05rem;">Start Fresh?</h3>
    <p id="freshModalText" style="font-size:0.95rem;color:#444;margin:0 0 16px;">All progress will be cleared.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

</div>
<script>
(function(){

var QUIZ_KEY = "quiz_sionsatvocab_20_20260730_v1";
var ATT_KEY = "quiz_sionsatvocab_att_20260730_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Sion] SAT Vocabulary - Results";
var TAG_COLORS = {"Review": "#f5a623", "New": "#1D9E75"};

var RAW_QUESTIONS = [{"stem": "abate", "tag": "New", "opts": ["To become less intense or severe", "To publicly declare something", "To copy someone's behavior closely", "To gather in large numbers"], "ci": 0, "exp": "\"Abate\" means to lessen in force or intensity. Example: \"The storm began to abate just before midnight, and the streets grew quiet again.\""}, {"stem": "adamant", "tag": "New", "opts": ["Refusing to change one's mind; firmly resolved", "Easily persuaded by others", "Uncertain about one's own opinion", "Quick to apologize for mistakes"], "ci": 0, "exp": "\"Adamant\" describes someone unwilling to be swayed. Example: \"She was adamant that the meeting start on time, no matter who was missing.\""}, {"stem": "aloof", "tag": "Review", "opts": ["Not friendly or open; emotionally distant", "Overly talkative and social", "Deeply loyal to a cause", "Extremely nervous or anxious"], "ci": 0, "exp": "\"Aloof\" describes someone who keeps a cool, reserved distance from others. Example: \"The new manager seemed aloof, rarely joining conversations in the break room.\""}, {"stem": "abjure", "tag": "New", "opts": ["To solemnly renounce a belief, cause, or claim", "To formally accept a new responsibility", "To celebrate a long-held tradition", "To postpone a decision indefinitely"], "ci": 0, "exp": "\"Abjure\" means to formally give up or reject something. Example: \"Under pressure from the court, he was forced to abjure his earlier statements.\""}, {"stem": "anachronistic", "tag": "New", "opts": ["Belonging to a period other than the one being portrayed; outdated", "Relating to distant future events", "Characterized by unusually rapid growth", "Based on careful, precise measurement"], "ci": 0, "exp": "\"Anachronistic\" describes something out of its proper time period. Example: \"Critics called the film's use of modern slang in a medieval setting jarringly anachronistic.\""}, {"stem": "antipathy", "tag": "New", "opts": ["A deep-seated feeling of dislike or aversion", "A strong feeling of admiration", "A state of complete indifference", "An urge to travel frequently"], "ci": 0, "exp": "\"Antipathy\" means strong, settled dislike. Example: \"There has long been antipathy between the two rival families.\""}, {"stem": "truculent", "tag": "New", "opts": ["Eager to argue or fight; aggressively defiant", "Calm and easily agreeable", "Shy and withdrawn in group settings", "Generous with time and money"], "ci": 0, "exp": "\"Truculent\" describes a fierce, combative attitude. Example: \"The truculent customer refused to lower his voice even after the manager apologized.\""}, {"stem": "solace", "tag": "Review", "opts": ["Comfort received in a time of distress or sadness", "A feeling of intense anger", "A formal agreement between rivals", "A sudden burst of energy"], "ci": 0, "exp": "\"Solace\" refers to comfort in a moment of grief or hardship. Example: \"She found solace in long walks after losing her job.\""}, {"stem": "affluent", "tag": "New", "opts": ["Having a great deal of money or wealth", "Lacking basic necessities", "Skilled in several languages", "Prone to sudden, unpredictable change"], "ci": 0, "exp": "\"Affluent\" describes someone or something wealthy. Example: \"The affluent suburb was known for its large houses and expensive cars.\""}, {"stem": "acrimony", "tag": "New", "opts": ["Bitterness or anger, especially in speech or argument", "A deep sense of gratitude", "A state of complete calm", "An eagerness to help others"], "ci": 0, "exp": "\"Acrimony\" refers to sharp, bitter hostility. Example: \"The divorce proceedings dragged on for months, filled with acrimony on both sides.\""}, {"stem": "abort", "tag": "New", "opts": ["To end a process or action before it is completed", "To begin a journey with great excitement", "To celebrate an achievement publicly", "To record information in careful detail"], "ci": 0, "exp": "\"Abort\" means to stop something partway through. Example: \"Mission control decided to abort the launch after detecting a fuel leak.\""}, {"stem": "affable", "tag": "New", "opts": ["Friendly, good-natured, and easy to talk to", "Quick to anger over small things", "Secretive and difficult to trust", "Overly formal and stiff in manner"], "ci": 0, "exp": "\"Affable\" describes a warm, approachable personality. Example: \"The affable host greeted every guest with a smile and a handshake.\""}, {"stem": "anecdote", "tag": "New", "opts": ["A short, amusing story about a real incident or person", "A substance that counteracts the effects of a poison", "A formal written agreement between two parties", "A device used to measure atmospheric pressure"], "ci": 0, "exp": "\"Anecdote\" means a brief personal story, not to be confused with \"antidote,\" which counteracts poison. Example: \"He opened his speech with a funny anecdote about his first day of college.\""}, {"stem": "malleable", "tag": "New", "opts": ["Easily shaped, influenced, or changed", "Impossible to bend or change", "Extremely fragile and prone to breaking", "Resistant to any outside influence"], "ci": 0, "exp": "\"Malleable\" describes something that can be shaped or easily influenced. Example: \"Gold is a highly malleable metal, and young minds are often just as malleable.\""}, {"stem": "beguile", "tag": "Review", "opts": ["To charm or delight someone, sometimes in a misleading way", "To punish someone severely", "To organize information logically", "To withdraw from a competition"], "ci": 0, "exp": "\"Beguile\" means to charm, and often carries a hint of deception. Example: \"The salesman beguiled the tourists with promises that were never kept.\""}, {"stem": "abstruse", "tag": "Review", "opts": ["Difficult to understand; obscure", "Very entertaining and lighthearted", "Extremely dangerous or risky", "Easily solved using common sense"], "ci": 0, "exp": "\"Abstruse\" means difficult to understand, often because it is highly technical or abstract. Example: \"The professor's lecture on quantum mechanics was so abstruse that half the class gave up taking notes.\""}, {"stem": "ephemeral", "tag": "New", "opts": ["Lasting for a very short time", "Extremely loud and disruptive", "Deeply rooted in tradition", "Impossible to replicate exactly"], "ci": 0, "exp": "\"Ephemeral\" describes something fleeting or short-lived. Example: \"The cherry blossoms are ephemeral, lasting barely a week each spring.\""}, {"stem": "accede", "tag": "Review", "opts": ["To agree to a demand or request, often reluctantly", "To strongly oppose a plan", "To forget something important", "To celebrate a victory"], "ci": 0, "exp": "\"Accede\" means to give in to a request, often after resistance. Example: \"After weeks of protest, the company finally acceded to the workers' demands.\""}, {"stem": "affinity", "tag": "New", "opts": ["A natural liking for, or close resemblance to, someone or something", "A strong dislike or aversion", "A formal legal dispute between parties", "A sudden, unexpected change of plans"], "ci": 0, "exp": "\"Affinity\" describes a natural attraction or connection. Example: \"From an early age, she showed a strong affinity for music.\""}, {"stem": "adulation", "tag": "New", "opts": ["Excessive or uncritical admiration and praise", "Harsh and unfair criticism", "Quiet indifference toward someone", "A formal request for help"], "ci": 0, "exp": "\"Adulation\" describes praise that goes beyond what is reasonable. Example: \"The pop star was surrounded by fans whose adulation bordered on obsession.\""}];



function escHtmlText(s){ return String(s); }

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = 20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(q.tag){
    tagEl.style.display='inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagEl.style.display='none';
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;

function speakWord(){
  var w = document.getElementById('q-word').textContent;
  var u = new SpeechSynthesisUtterance(w);
  u.lang = 'en-US';
  window.speechSynthesis.speak(u);
}
window.speakWord = speakWord;


loadState(); saveState(); render();

})();
</script>
