<head>

<title>[Sion] SAT Grammar</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
html{margin:0 auto;}
.wrap{max-width:700px;margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.sub-hd{text-align:center;font-size:0.82rem;color:#555;margin-bottom:6px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
.q-tag{display:inline-block;background:#1D9E75;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.word-text{font-size:1.3rem;font-weight:800;color:#111;line-height:1.4;}
.speak-btn{background:#e8edf4;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;white-space:pre-line;}
.box-ctx{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.9rem;color:#222;line-height:1.6;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}

.next-btn{background:#1D9E75;color:#fff;}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}

.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:340px;margin:20px;text-align:center;}

<body>
<div class="wrap">

  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="openFreshModalOriginal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:12px;">Start Fresh (Original Order)</button>
  <button onclick="openFreshModalRandom()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh (Random Order)</button>

    <button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

</div>
<script>
(function(){

var QUIZ_KEY = "quiz_sionsatgrammar_20_20260730_v1";
var ATT_KEY = "quiz_sionsatgrammar_att_20260730_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Sion] SAT Grammar - Results";
var TAG_COLORS = {};

var RAW_QUESTIONS = [{"box": "Coral reefs cover less than one percent of the ocean floor. ___ they support roughly a quarter of all known marine species.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "Therefore,", "For example,", "In addition,"], "ci": 0, "exp": "The sentence sets up a contrast: reefs cover very little area, yet they support an enormous share of marine life. \"Nevertheless\" signals that contrast. \"Therefore\" wrongly implies the small size causes the large biodiversity. \"For example\" wrongly frames the second sentence as an illustration of the first rather than a contrast. \"In addition\" wrongly frames the two facts as simply additive rather than surprising in relation to each other."}, {"box": "The committee's decision, along with several amendments proposed by junior members, ___ still under review by the board.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["remains", "remain", "have remained", "were remaining"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"decision\"; the phrase \"along with several amendments proposed by junior members\" is a prepositional phrase that does not change the number of the subject, so a singular verb is required. \"Remain\" and \"have remained\" are plural forms that do not agree with \"decision.\" \"Were remaining\" is also a plural form and shifts incorrectly into the past tense."}, {"box": "The new curriculum aims to strengthen students' ability to analyze primary sources, evaluate competing arguments, and ___ persuasive essays of their own.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["write", "writing", "to write", "having written"], "ci": 0, "exp": "The sentence lists three parallel actions governed by a single \"to\": \"to analyze... evaluate... write.\" Because \"to\" already applies to all three verbs, each one should appear in its base form. \"Writing\" and \"having written\" break this parallel structure by switching verb forms, and \"to write\" incorrectly repeats \"to,\" which is unnecessary once it has already been established for the series."}, {"box": "The museum's east wing has been closed for renovation since March___ visitors can still explore the west wing's permanent collection.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["; however,", ", however,", "however,", "but however,"], "ci": 0, "exp": "Both halves of the sentence are independent clauses, so joining them with a conjunctive adverb like \"however\" requires a semicolon before it and a comma after it. Using only a comma before \"however\" creates a comma splice, since a comma alone cannot join two independent clauses. Leaving out punctuation entirely creates a run-on. Pairing \"but\" with \"however\" is redundant, since both words serve the same contrastive function."}, {"box": "Each of the interns submitted ___ final report before the Friday deadline.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["his or her", "their", "they're", "our"], "ci": 0, "exp": "\"Each\" is a singular indefinite pronoun, so the possessive that refers back to it must also be singular in formal Standard English; \"his or her\" satisfies this requirement. \"Their\" is plural and does not formally agree with the singular \"each,\" even though it is common in casual speech. \"They're\" is a contraction of \"they are\" and does not function as a possessive at all. \"Our\" incorrectly shifts to the first-person plural, which does not match the third-person subject \"each of the interns.\""}, {"box": "Having reviewed the quarterly earnings report, ___ recommended a hiring freeze until the next fiscal year.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the board", "a hiring freeze was", "it was", "the recommendation"], "ci": 0, "exp": "The opening phrase \"Having reviewed the quarterly earnings report\" must be followed immediately by the noun that performed the reviewing; only \"the board\" can logically review a report. \"A hiring freeze,\" \"it,\" and \"the recommendation\" cannot review anything, so each of these choices creates a dangling modifier that illogically attaches the opening phrase to the wrong noun."}, {"box": "The two companies revised ___ merger agreement after regulators raised concerns about market competition.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["their", "its", "it's", "they're"], "ci": 0, "exp": "The subject \"the two companies\" is plural, so the possessive pronoun referring to it must also be plural; \"their\" is correct. \"Its\" is singular and does not agree with \"companies.\" \"It's\" is a contraction of \"it is\" and cannot function as a possessive. \"They're\" is a contraction of \"they are\" and cannot show possession either."}, {"box": "___ the new subway line will reduce average commute times for thousands of residents.", "stem": "Which choice completes the text with the most concise phrasing that preserves the sentence's meaning?", "opts": ["Officials say", "According to city officials and various transportation experts who have studied the matter extensively", "In the considered opinion of numerous experts on the subject", "It has been stated by officials that"], "ci": 0, "exp": "\"Officials say\" conveys the same basic meaning as the other choices, that officials are the source of the claim, using far fewer words. The other options pad the sentence with extra phrases that add length without adding meaningful information."}, {"box": "By the time the fire department arrived, the warehouse ___ completely, leaving little to salvage.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had burned", "burned", "was burning", "has burned"], "ci": 0, "exp": "The warehouse finished burning before the fire department's arrival, a past event before another past event, which calls for the past perfect tense \"had burned.\" \"Burned\" places both events in simple past without showing which happened first. \"Was burning\" suggests the fire was still active when the department arrived, which contradicts \"completely.\" \"Has burned\" uses the present perfect, which does not fit a narrative set entirely in the past."}, {"box": "The city council approved funding for the new bike lanes last spring. ___ construction has yet to begin, and no start date has been announced.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Yet,", "As a result,", "Similarly,", "Specifically,"], "ci": 0, "exp": "The second sentence contrasts with the first: funding was approved, but construction still has not started. \"Yet\" signals that contrast. \"As a result\" wrongly implies the approval caused the delay. \"Similarly\" wrongly treats the two sentences as alike rather than contrasting. \"Specifically\" wrongly frames the second sentence as a detail of the first rather than a contrasting fact."}, {"box": "Neither the coach nor the players ___ satisfied with the referee's final call.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "is", "has been"], "ci": 0, "exp": "With \"neither...nor,\" the verb agrees with the subject closer to it, which here is the plural noun \"players,\" so the plural verb \"were\" is correct. \"Was,\" \"is,\" and \"has been\" are all singular forms that would only be correct if the closer subject were singular, such as \"the coach.\""}, {"box": "The proposal would not only reduce the department's operating costs but also ___ employee satisfaction across every division.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["improve", "improving", "improves", "will improve"], "ci": 0, "exp": "The correlative pair \"not only...but also\" requires parallel grammatical forms on both sides; since \"reduce\" is the bare base form following the modal \"would,\" the second verb must also appear as \"improve.\" \"Improving\" and \"improves\" break this parallel structure, and \"will improve\" introduces a second modal construction that does not match \"would reduce.\""}, {"box": "The novel___ which was adapted into a film last year, has sold over two million copies worldwide.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["novel, which", "novel; which", "novel: which", "novel which"], "ci": 0, "exp": "The clause \"which was adapted into a film last year\" simply adds extra information about a novel that is already fully identified, making it nonrestrictive; nonrestrictive clauses must be set off by commas on both sides, and the sentence already has a comma after \"year,\" so a matching comma belongs before \"which.\" A semicolon would incorrectly treat the clause as a separate independent statement, a colon would incorrectly frame it as a formal introduction, and no punctuation at all would fuse the noun and the clause together improperly."}, {"box": "The award will be given to ___ the committee judges to have made the greatest contribution to the field.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["whomever", "whoever", "who", "whom"], "ci": 0, "exp": "Within the clause, the pronoun functions as the object of \"judges\" (\"the committee judges [him] to have made...\"), so the objective form \"whomever\" is required even though the entire clause serves as the object of \"to.\" \"Whoever\" is the subjective form and would only be correct if the pronoun were the subject of the clause's verb. \"Who\" is also subjective and therefore incorrect here. \"Whom\" is objective but lacks the \"-ever\" needed to form an indefinite relative clause with no specific antecedent already named."}, {"box": "Wrapped in a faded, hand-stitched blanket, the movers carefully carried the antique rocking chair up the narrow staircase.", "stem": "Which choice best revises the sentence to correct the misplaced modifier?", "opts": ["The movers carefully carried the antique rocking chair, wrapped in a faded, hand-stitched blanket, up the narrow staircase.", "Wrapped in a faded, hand-stitched blanket, the movers carefully carried the antique rocking chair up the narrow staircase.", "Carefully carrying the antique rocking chair up the narrow staircase, a faded, hand-stitched blanket wrapped the movers.", "Up the narrow staircase, wrapped in a faded, hand-stitched blanket, the movers carefully carried the antique rocking chair."], "ci": 0, "exp": "In the corrected sentence, the phrase \"wrapped in a faded, hand-stitched blanket\" sits directly beside \"the antique rocking chair,\" the item that is actually wrapped. In the original sentence and in the version beginning \"Up the narrow staircase,\" the phrase sits beside \"the movers,\" illogically suggesting the movers themselves are wrapped in the blanket. The version with \"a faded, hand-stitched blanket wrapped the movers\" is even more illogical, since it directly states that a blanket wrapped the people rather than the chair."}, {"box": "The three ___ presentations were each limited to ten minutes, though only two teams finished on time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["teams'", "team's", "teams's", "teams"], "ci": 0, "exp": "Because three teams each have their own presentations, the plural possessive \"teams'\" is required, formed by adding only an apostrophe after the existing plural \"s.\" \"Team's\" is a singular possessive and does not match \"three.\" \"Teams's\" doubles the \"s\" in a way that is not standard. \"Teams\" is simply the plural noun with no possessive marking at all, so it cannot show ownership of the presentations."}, {"box": "___ the report highlighted three main areas for improvement: staffing levels, communication between departments, and outdated equipment.", "stem": "Which choice completes the text with the most concise phrasing that preserves the sentence's meaning?", "opts": ["The report found that", "In terms of what the report actually says regarding its main findings,", "It is important to note that, according to the report's findings,", "As far as the report is concerned in terms of its content,"], "ci": 0, "exp": "\"The report found that\" states the same basic fact as the other options, that the report identified these areas, in the fewest words. The remaining choices repeat the idea of \"the report\" and its \"findings\" or \"content\" in roundabout, padded phrasing that adds no new information."}, {"box": "The bylaws require that every member ___ the annual meeting unless excused in advance by the board.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["attend", "attends", "attended", "will attend"], "ci": 0, "exp": "Formal constructions such as \"require that\" call for the subjunctive mood, which uses the base form of the verb regardless of the subject; \"attend\" is correct even though \"every member\" is singular. \"Attends\" incorrectly applies ordinary present-tense agreement instead of the subjunctive. \"Attended\" shifts to the past tense, which does not fit the ongoing requirement described. \"Will attend\" introduces a modal that the subjunctive construction does not use."}, {"box": "The chef refused to compromise on one ingredient___ freshly grated nutmeg.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["ingredient: freshly", "ingredient; freshly", "ingredient, freshly", "ingredient - freshly"], "ci": 0, "exp": "A colon is the conventional way to introduce a specific example that follows a complete independent clause, and \"The chef refused to compromise on one ingredient\" is a complete independent clause on its own, so a colon correctly introduces the example that follows. A semicolon is used to join two independent clauses, but \"freshly grated nutmeg\" is not an independent clause. A comma alone is too weak to introduce a specific example in this formal way. A dash can sometimes work informally, but it is not the conventional choice for introducing a single defining example in formal Standard English."}, {"box": "Scattered across the abandoned factory floor ___ dozens of rusted machine parts, each one a relic of the building's industrial past.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "is", "has been"], "ci": 0, "exp": "In this inverted sentence, the true subject is the plural noun phrase \"dozens of rusted machine parts,\" which appears after the verb; the verb must still agree with that postponed subject rather than with the nearby singular phrase \"the factory floor.\" \"Was,\" \"is,\" and \"has been\" are all singular forms that fail to agree with the plural subject \"dozens of rusted machine parts.\""}];



function escHtmlText(s){ return String(s); }

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = 25;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(q.tag){
    tagEl.style.display='inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagEl.style.display='none';
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
