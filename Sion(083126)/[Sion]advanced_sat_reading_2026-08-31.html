in areas that remain largely unshaded. The researchers concluded that equitable distribution, not total tree count, determines whether a citywide cooling effort succeeds.", "opts": ["To describe the biological process by which trees convert sunlight into chemical energy.", "To recommend that cities stop planting new trees altogether.", "To argue that shaded pavement is always warmer than pavement in direct sunlight.", "To explain why the distribution of trees across a city, not just the total number planted, determines the effectiveness of urban cooling efforts."], "ci": 3, "exp": "The researchers' conclusion, that equitable distribution rather than total tree count determines success, is the text's central purpose, matching the correct choice. The text states shaded pavement is cooler, the opposite of the wrong choice. Photosynthesis is never discussed. The text argues for better distribution, not for abandoning tree planting.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}, {"stem": "Which finding, if true, would most directly support the researcher's claim?", "passage": "A researcher claims that a new irrigation technique conserves water in orchards without reducing fruit yield.", "opts": ["The new irrigation technique costs slightly more per acre than traditional irrigation.", "The tubing used in the new irrigation technique is more brightly colored than traditional tubing.", "Farm workers found the new irrigation system easier to install than the traditional system.", "Orchards using the new technique used 18 percent less water over the growing season while producing a fruit yield statistically indistinguishable from orchards using traditional irrigation."], "ci": 3, "exp": "Since the claim concerns water use and fruit yield together, a direct measurement of both under comparable conditions most directly supports it. Tubing color says nothing about water conservation or yield. Ease of installation doesn't address either measure. Cost doesn't measure water use or yield.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"stem": "The student wants to emphasize that the Wright brothers' methodical testing, not luck, was responsible for their success. Which choice most effectively uses the given information to accomplish this goal?", "passage": "- The Wright brothers ran a bicycle repair shop in Dayton, Ohio before turning to aviation.<br>- They used a homemade wind tunnel to test more than 200 wing designs.<br>- Their systematic testing let them correct errors in aerodynamic data that earlier researchers had published.<br>- In 1903, their aircraft achieved the first sustained, controlled, powered flight.", "opts": ["By testing more than 200 wing designs in a homemade wind tunnel, the Wright brothers systematically corrected flawed aerodynamic data and achieved the first sustained, controlled, powered flight in 1903.", "The Wright brothers ran a bicycle repair shop in Dayton, Ohio before turning to aviation.", "The Wright brothers used a homemade wind tunnel to test more than 200 wing designs.", "In 1903, the Wright brothers' aircraft achieved the first sustained, controlled, powered flight."], "ci": 0, "exp": "Only the correct choice connects the systematic wind-tunnel testing to both the correction of flawed data and the historic 1903 flight, exactly the causal link the student wants to emphasize. The other choices each describe only the bicycle shop, only the 1903 flight, or only the testing, without linking cause to result.", "tag": "Rhetorical Synthesis", "tagcolor": "#f5a623"}, {"stem": "As used in the text, what does the word \"qualify\" most nearly mean?", "passage": "Although the committee's initial proposal seemed straightforward, several members later found reasons to qualify their support, attaching conditions that considerably narrowed the scope of what the plan could accomplish.", "opts": ["celebrate", "limit", "certify", "abandon"], "ci": 1, "exp": "Since the members attached conditions that narrowed the plan's scope, they were limiting rather than certifying their support. Certify suggests formal approval without restriction, which doesn't fit the added conditions. Celebrate and abandon both describe reactions far stronger than merely narrowing scope with conditions.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"stem": "Which choice best describes the relationship between the two texts?", "passage": "Text 1: Proponents of standardized testing argue that a single, consistent exam allows for fair comparisons of student achievement across different schools and districts, since every student answers the same questions under the same conditions.<br><br>Text 2: Critics counter that standardized tests often reflect the resources and preparation available to students rather than their underlying ability, meaning that scores may reveal more about a student's access to test preparation than about actual learning.", "opts": ["Text 1 and Text 2 both focus primarily on the history of standardized testing.", "Text 2 challenges the fairness that Text 1 attributes to standardized testing by highlighting unequal access to preparation resources.", "Text 1 directly responds to the criticism raised in Text 2.", "Text 2 provides additional support for the fairness claim made in Text 1."], "ci": 1, "exp": "Text 1 claims the tests are fair because conditions are identical, while Text 2 argues that unequal access to preparation undermines that fairness, making the correct choice accurate. Text 2 challenges rather than supports Text 1's claim. Neither text discusses the history of testing. Text 1 is presented independently and does not respond to Text 2.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Based on the two texts, how would the historians in Text 2 most likely respond to the emphasis on external pressures in Text 1?", "passage": "Text 1: Historians who study the fall of the Western Roman Empire have traditionally emphasized external pressures, arguing that repeated invasions by various groups overwhelmed the empire's military and administrative capacity.<br><br>Text 2: More recent historians argue that internal factors, including political instability, economic strain, and a fragmented governing structure, had already weakened the empire well before major external invasions occurred, making the empire particularly vulnerable when invasions did arrive.", "opts": ["They would likely agree completely that external invasions alone caused the empire's fall.", "They would likely argue that no invasions occurred during the empire's decline.", "They would likely argue that external pressures alone are an incomplete explanation, since internal weaknesses had already made the empire vulnerable before major invasions occurred.", "They would likely argue that political instability had no effect on the empire's ability to resist invasion."], "ci": 2, "exp": "Text 2's emphasis on internal weakness preceding invasions directly challenges Text 1's focus on external pressures as the main cause, supporting the correct choice. The two texts disagree, so Text 2's historians would not agree completely with Text 1. Text 2 never denies that invasions occurred. Text 2 explicitly credits political instability with weakening the empire, the opposite of the wrong choice.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Which choice most logically completes the text?", "passage": "Paleontologists studying fossilized burrows have found that certain ancient mammals dug complex, multi-chambered tunnel systems only in regions with highly seasonal rainfall, while closely related species living in regions with consistent year-round rainfall dug much simpler, single-chamber burrows. If researchers uncovered a previously unknown burrow system that was elaborate and multi-chambered, they would most likely conclude that the animal that built it ______.", "opts": ["fed exclusively on other burrowing animals", "lived in an environment with pronounced seasonal variation in rainfall", "was incapable of digging any type of burrow", "lived in an environment with constant, unvarying rainfall throughout the year"], "ci": 1, "exp": "Since elaborate, multi-chambered burrows were linked to seasonal rainfall, an elaborate burrow system would most logically suggest a seasonal-rainfall environment, matching the correct choice. Consistent year-round rainfall was linked to simple burrows, the opposite of the wrong choice. The burrow system itself shows the animal could dig complex tunnels. Diet is never discussed in the passage.", "tag": "Inferences", "tagcolor": "#0d9488"}, {"stem": "Which choice best states the main idea of the text?", "passage": "Cephalopods such as octopuses can change the color and texture of their skin within a fraction of a second, a feat once attributed solely to specialized pigment cells called chromatophores. Recent studies, however, reveal that octopus skin also contains light-sensitive proteins similar to those found in eyes, suggesting the skin itself may detect ambient light and help coordinate camouflage responses without direct input from the brain. This finding complicates the traditional view that all camouflage decisions originate in the octopus's central nervous system.", "opts": ["The octopus's brain processes visual information more slowly than previously believed.", "Octopus chromatophores are the only mechanism responsible for changing skin color and texture.", "New research suggests octopus skin may sense light and assist in camouflage independently of the brain, challenging the earlier view that camouflage is controlled solely by the brain.", "Octopus skin cannot detect light under any circumstances, according to new research."], "ci": 2, "exp": "The text explains that skin may sense light and help coordinate camouflage without direct brain input, challenging the traditional view, matching the correct choice. The text explicitly says chromatophores were once believed the sole mechanism, but new findings complicate that. The finding is that skin can detect light, the opposite of the wrong choice. Brain processing speed is never discussed.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}, {"stem": "Which finding would most strongly support the official's claim?", "passage": "A city transportation official claims that a new network of protected bike lanes has reduced injuries among cyclists.", "opts": ["A survey found that most drivers thought the new bike lanes looked visually appealing.", "In the two years after the protected bike lanes were installed, reported cyclist injuries on those streets fell by 35 percent compared with the two years before, even as citywide cycling volume increased.", "The protected bike lanes were painted a brighter shade of green than older bike lanes.", "The protected bike lanes cost more to construct than unprotected bike lanes."], "ci": 1, "exp": "Since the claim concerns injury reduction, a direct before-and-after injury comparison, especially one that accounts for increased ridership, most strongly supports it. Paint color says nothing about injuries. Driver opinions about appearance don't measure safety outcomes. Construction cost doesn't measure injury rates.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"stem": "As used in the text, what does the word \"spare\" most nearly mean?", "passage": "Critics praised the novel's spare prose, noting that the author's refusal to embellish even the most dramatic scenes lent the narrative an unexpected gravity that more ornate writing might have undercut.", "opts": ["unadorned", "extra", "generous", "merciful"], "ci": 0, "exp": "Since the text contrasts the prose with embellishment and ornate writing, \"spare\" describes plain, unadorned writing. Extra describes a surplus quantity, which contradicts the idea of restraint. Generous and merciful describe qualities of a person's character, not a writing style.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"stem": "The student wants to emphasize that Lovelace's specific written contribution, not just her association with Babbage, is why she is remembered as a programming pioneer. Which choice most effectively uses the given information to accomplish this goal?", "passage": "- Ada Lovelace worked with Charles Babbage on his proposed Analytical Engine in the 1840s.<br>- She wrote detailed notes describing how the machine could execute a sequence of instructions.<br>- Her notes included what is now considered the first published algorithm intended for a machine.<br>- Lovelace is often credited today as an early visionary of computer programming.", "opts": ["Lovelace is often credited today as an early visionary of computer programming.", "Ada Lovelace worked with Charles Babbage on his proposed Analytical Engine in the 1840s.", "Her notes included what is now considered the first published algorithm intended for a machine.", "Beyond her work with Charles Babbage on the Analytical Engine, Ada Lovelace wrote notes containing what is now considered the first published algorithm for a machine, a contribution that earns her recognition as an early visionary of computer programming."], "ci": 3, "exp": "Only the correct choice explicitly links Lovelace's specific written algorithm to her recognition as a programming pioneer, beyond mere association with Babbage, exactly the goal stated. The other choices each describe only the collaboration, only her modern recognition, or only the algorithm fact, without connecting them.", "tag": "Rhetorical Synthesis", "tagcolor": "#f5a623"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';

function formatTime(sec){

  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');

function renderTimer(){

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
