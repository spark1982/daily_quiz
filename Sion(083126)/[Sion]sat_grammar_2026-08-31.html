<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_siongrammar_20_20260830_v1";var ATT_KEY = "quiz_siongrammar_20_att_20260830_v1";var RAW_QUESTIONS = [{"stem": "Which choice completes the text with the most logical transition?", "context": "The committee had reviewed dozens of proposals before the deadline arrived; ______ they postponed the final vote until further evidence could be gathered.", "opts": ["consequently,", "similarly,", "moreover,", "nevertheless,"], "ci": 3, "exp": "Despite having reviewed dozens of proposals, the committee still postponed its decision, an unexpected outcome that calls for a contrast transition like \"nevertheless.\" \"Consequently\" wrongly implies the postponement resulted from the review. \"Similarly\" suggests a comparison that isn't present. \"Moreover\" wrongly signals additional supporting information rather than contrast."}, {"stem": "Which choice most effectively combines the underlined portion into a single, correctly punctuated sentence?", "context": "The critic's review was blunt she called the film's pacing glacially slow and utterly unearned.", "opts": ["blunt: she", "blunt; and she", "blunt, she", "blunt she"], "ci": 0, "exp": "A colon is the most effective way to introduce the explanation of exactly how the review was blunt, so \"blunt: she\" is correct. A comma alone creates a comma splice between two independent clauses. Omitting punctuation entirely creates a run-on sentence. \"Semicolon and\" is redundant, since a semicolon alone (without \"and\") would already properly join the two independent clauses, and pairing it with \"and\" is nonstandard."}, {"stem": "Which choice completes the sentence with the correct possessive form?", "context": "After months of negotiation, the two companies finalized ______ merger.", "opts": ["companies'", "companys'", "companies's", "company's"], "ci": 0, "exp": "Since \"companies\" is already plural, the possessive is formed by adding only an apostrophe after the final s: \"companies'.\" \"Company's\" is singular possessive, which doesn't match the plural subject. \"Companies's\" and \"companys'\" are not standard possessive forms."}, {"stem": "Which choice completes the sentence using the correct verb mood?", "context": "The committee recommended that the new policy ______ implemented before the next fiscal quarter began.", "opts": ["will be", "was", "be", "is"], "ci": 2, "exp": "A recommendation expressed with \"that\" requires the subjunctive mood, which uses the base form \"be\" regardless of the subject. \"Is,\" \"was,\" and \"will be\" are all indicative forms that do not follow the subjunctive construction triggered by \"recommended that.\""}, {"stem": "Which choice maintains the formal tone established elsewhere in the essay?", "context": "In her dissertation, the historian argued that the treaty's provisions were a huge deal for regional stability.", "opts": ["extremely significant", "kind of a big thing", "pretty important", "a huge deal"], "ci": 0, "exp": "\"Extremely significant\" matches the formal, academic register expected in a dissertation. \"A huge deal,\" \"kind of a big thing,\" and \"pretty important\" are all casual expressions that clash with the formal tone of academic writing."}, {"stem": "Which choice completes the underlined portion so that the sentence maintains a consistent grammatical pattern?", "context": "The internship taught her to manage competing deadlines, to communicate clearly with clients, and negotiating contracts under pressure.", "opts": ["negotiating contracts under pressure", "to negotiate contracts under pressure", "negotiation of contracts under pressure", "having negotiated contracts under pressure"], "ci": 1, "exp": "The first two items in the list use the infinitive form (\"to manage,\" \"to communicate\"), so the third item must match with \"to negotiate\" to preserve parallel structure. The other choices break the established infinitive pattern by shifting to a gerund, a perfect participle, or a noun phrase."}, {"stem": "Which choice completes the sentence with the correct possessive form?", "context": "The research team was surprised to find that the organism could regulate ______ internal temperature even in extreme cold.", "opts": ["its'", "their", "it's", "its"], "ci": 3, "exp": "The possessive form of \"it\" has no apostrophe, so \"its\" correctly modifies \"internal temperature.\" \"It's\" is a contraction of \"it is,\" which doesn't fit here. \"Its'\" is not a standard English word. \"Their\" is plural and does not agree with the singular \"the organism.\""}, {"stem": "Which choice most effectively combines the underlined portion into a single, correctly punctuated sentence?", "context": "The results confirmed what the researchers had suspected all along, warmer ocean temperatures were accelerating coral bleaching at an unprecedented rate.", "opts": ["all along; warmer", "all along, and warmer", "all along, warmer", "all along: warmer"], "ci": 3, "exp": "A colon is the most effective way to introduce the explanation of exactly what the researchers had suspected, so \"all along: warmer\" is correct. A comma alone creates a comma splice between two independent clauses. A semicolon would be grammatically permissible but is less effective than a colon at signaling that the second clause explains the first. Adding \"and\" changes the relationship from an explanation to a simple addition."}, {"stem": "Which choice most clearly resolves the ambiguous pronoun in the underlined portion?", "context": "When the mentor introduced the new intern to the senior researcher, she seemed visibly nervous about the upcoming presentation.", "opts": ["they seemed visibly nervous", "the senior researcher, who seemed visibly nervous,", "she seemed visibly nervous", "the new intern seemed visibly nervous"], "ci": 3, "exp": "Since the sentence mentions two women, \"the mentor\" and \"the senior researcher\" as well as \"the new intern,\" the pronoun \"she\" could refer to more than one person; naming \"the new intern\" directly removes the ambiguity. Keeping \"she\" or switching to \"they\" does not resolve which person is meant. Reassigning the nervousness to \"the senior researcher\" changes the sentence's intended meaning rather than clarifying it."}, {"stem": "Which choice corrects the unnecessary punctuation in the underlined portion?", "context": "Scientists who study deep-sea ecosystems, often rely on remotely operated vehicles to collect samples from depths no diver could reach.", "opts": ["ecosystems, often, rely", "ecosystems often, rely", "ecosystems often rely", "ecosystems; often rely"], "ci": 2, "exp": "The clause \"who study deep-sea ecosystems\" is essential to identifying which scientists are meant, so it should not be set off by a comma at all. Adding commas around \"often\" or a semicolon after \"ecosystems\" introduces unnecessary or incorrect punctuation that a restrictive clause like this should not have."}, {"stem": "Which choice most effectively corrects both the dangling modifier and the unclear pronoun reference in the sentence?", "context": "After reviewing the applicant's portfolio and interviewing several candidates, the position was offered to the designer whose references had most impressed them.", "opts": ["the designer, whose references had most impressed them, was offered the position by the hiring committee", "the hiring committee offered the position to the designer whose references had most impressed its members", "the designer whose references had most impressed them was offered the position", "the position was offered to the designer whose references had most impressed the team"], "ci": 1, "exp": "Naming \"the hiring committee\" as the one who reviewed the portfolio and conducted interviews fixes the dangling modifier, since \"the position\" cannot logically perform those actions; replacing the ambiguous \"them\" with \"its members\" clarifies that the committee, not some unnamed group, was impressed. The other choices either leave the modifier dangling on \"the position\" and \"the designer,\" or leave the ambiguous pronoun \"them\" unresolved."}, {"stem": "Which choice completes the sentence with the pronoun that agrees with its antecedent according to Standard English conventions?", "context": "Neither the museum's director nor the trustees were willing to relocate ______ offices during the renovation.", "opts": ["his", "their", "her", "its"], "ci": 1, "exp": "With a \"neither...nor\" construction, the pronoun agrees with the nearer antecedent, the plural \"trustees,\" so \"their\" is correct. \"His\" and \"her\" are singular and don't agree with \"trustees.\" \"Its\" is used for a single inanimate object or entity, not for a group of people referred to individually like \"trustees.\""}, {"stem": "Which choice completes the text so that the sentence follows the conventions of Standard English?", "context": "The collection of rare manuscripts, donated by an anonymous alumna along with several first-edition novels, ______ housed in a climate-controlled wing of the library.", "opts": ["have been", "are", "were", "is"], "ci": 3, "exp": "The sentence's true subject is the singular noun \"collection,\" not the plural nouns in the intervening phrase, so the singular present-tense verb \"is\" is required. \"Are\" and \"have been\" incorrectly treat the subject as plural. \"Were\" is both plural and in the wrong tense for a fact presented as currently true."}, {"stem": "Which choice fixes the underlined portion so that it does not form a comma splice?", "context": "The museum's new wing features an impressive glass atrium, however the older galleries still rely on artificial lighting that dates back decades.", "opts": ["atrium however, the older galleries", "atrium, however the older galleries", "atrium, however, the older galleries", "atrium; however, the older galleries"], "ci": 3, "exp": "Because \"however\" here joins two independent clauses, it needs a semicolon before it and a comma after it. Leaving a comma before \"however\" with no semicolon creates a comma splice, whether or not a comma follows \"however.\" Omitting the comma after \"however\" is also nonstandard when it begins a clause like this."}, {"stem": "Which choice completes the sentence so that it maintains a consistent grammatical pattern?", "context": "The proposal recommended reducing energy costs, expanding renewable infrastructure, and that the city adopt stricter building codes.", "opts": ["to adopt stricter building codes", "adopting stricter building codes", "that the city adopt stricter building codes", "the adoption of stricter building codes"], "ci": 1, "exp": "The first two items in the list use the gerund form (\"reducing,\" \"expanding\"), so the third item must match with \"adopting\" to preserve parallel structure. The other choices shift to a subordinate clause, a noun phrase, or an infinitive, each breaking the established gerund pattern."}, {"stem": "Which choice corrects the dangling modifier in the sentence?", "context": "Having revised the manuscript three times, the publisher finally accepted Elena's novel for publication.", "opts": ["Having revised the manuscript three times, Elena's novel was finally accepted by the publisher.", "Elena, having revised the manuscript three times, finally had her novel accepted by the publisher.", "The publisher finally accepted Elena's novel, having revised the manuscript three times.", "Elena's novel was finally accepted by the publisher, having revised the manuscript three times."], "ci": 1, "exp": "Since Elena, not the publisher or the novel, revised the manuscript, the modifier must sit next to \"Elena\" to describe her correctly. The other choices all leave the introductory or trailing modifier attached to \"the publisher\" or \"the novel,\" illogically suggesting that one of them did the revising."}, {"stem": "Which choice most effectively establishes the relationship between the two ideas in the sentence?", "context": "The satellite had been orbiting for over a decade, engineers were still receiving usable data from its aging instruments.", "opts": ["decade, although", "decade, and", "decade, so", "decade;"], "ci": 0, "exp": "\"Although\" most effectively signals the surprising contrast between the satellite's age and the fact that its instruments still produced usable data. A semicolon alone would fix the run-on but would not capture that contrast. \"And\" wrongly implies the two ideas are simply additive. \"So\" incorrectly implies the aging caused the continued usable data, which reverses the intended logic."}, {"stem": "Which choice completes the text with the most logical transition?", "context": "The negotiators reached a preliminary agreement on trade tariffs by early spring; ______ discussions over intellectual property rights remained deadlocked for another year.", "opts": ["in addition,", "as a result,", "by contrast,", "similarly,"], "ci": 2, "exp": "The sentence sets up a contrast between the swiftly resolved tariff agreement and the deadlocked intellectual property discussions, so \"by contrast\" is the most logical transition. \"Similarly\" incorrectly suggests the two outcomes are alike. \"In addition\" and \"as a result\" wrongly suggest the second clause simply adds to or results from the first, rather than contrasting with it."}, {"stem": "Which choice most effectively improves the concision of the underlined portion while keeping its meaning?", "context": "Due to the fact that the bridge had been closed for repairs for a period of several months, commuters were forced to find alternate routes.", "opts": ["Due to the bridge being closed for repairs for a period of several months of time,", "Because the bridge had been closed for repairs for several months,", "Owing to the fact that the bridge had, for a period of several months, been closed for repairs,", "Because of the reason that the bridge had been closed for repairs for a period of several months,"], "ci": 1, "exp": "\"Because the bridge had been closed for repairs for several months\" conveys the same meaning far more concisely than the wordy original. The other choices each retain redundant phrasing, such as \"because of the reason that\" or \"a period of several months of time,\" that adds no new meaning."}, {"stem": "Which choice completes the sentence with the verb form that is most consistent with the sequence of events described?", "context": "By the time the researchers published their findings, the original hypothesis ______ almost entirely by newer data.", "opts": ["has been disproven", "will be disproven", "had been disproven", "is disproven"], "ci": 2, "exp": "Since the disproving of the hypothesis happened before the past event of publishing, the past perfect \"had been disproven\" correctly signals which past event came first. \"Has been disproven\" and \"is disproven\" wrongly suggest the disproving is still relevant to the present. \"Will be disproven\" incorrectly places the disproving in the future."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
