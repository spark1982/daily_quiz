  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261028";
var RAW_QUESTIONS = [{"stem": "“The graduation ceremony will <b>commence</b> at ten o’clock sharp.”<br><br>Which word means the <b>SAME</b> or nearly the same as <b>commence</b> as it is used in the sentence?", "opts": ["pause", "continue", "finish", "begin"], "ci": 3, "exp": "<i>commence</i> (v.) to begin or start. <i>Finish</i> is its opposite, and <i>pause</i> or <i>continue</i> describe the middle of an event. Family: commencement (n.) — another name for a graduation ceremony!", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The word <b>mature</b> has more than one meaning. Which meaning is used in this sentence?<br><br>“Even though he is only eleven, Theo was very <b>mature</b> about losing the game; he shook every player’s hand.”", "opts": ["acting in a sensible, grown-up way", "fully grown and ready to be picked", "due to be paid back on a certain date", "to grow and develop over time"], "ci": 0, "exp": "<i>mature</i> can mean fully grown (a <i>mature</i> oak tree), to grow up (verb), or acting grown-up and sensible. Theo handled losing calmly and politely, so he acted <b>mature</b>. Family: maturity (n.), immature (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "After six hours of hiking, we finally reached the <b>summit</b>. From the very top, we could see three states.<br><br>What does <b>summit</b> mean in this sentence?", "opts": ["a shelter where hikers rest", "a flat valley between two hills", "the highest point of a mountain", "a narrow trail along a cliff"], "ci": 2, "exp": "<i>summit</i> (n.) the top of a mountain; also an important meeting of leaders. <i>Clouds covered the <b>summit</b> of Pikes Peak.</i>", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "From the tree house, Jamal had a new ______ on the backyard: the garden looked like a tiny map from up there.", "opts": ["perspective", "hypothesis", "sequence", "obstacle"], "ci": 0, "exp": "<i>perspective</i> (n.) a way of seeing or thinking about something, often from a certain position. Seeing the yard from above gave Jamal a new view.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "“Thunderstorms are <b>frequent</b> in Kansas during May.”<br><br>Which word means the <b>OPPOSITE</b> of <b>frequent</b> as it is used in the sentence?", "opts": ["rare", "common", "constant", "regular"], "ci": 0, "exp": "<i>frequent</i> (adj.) happening often. The opposite is <i>rare</i> (not happening often). <i>Common</i>, <i>regular</i>, and <i>constant</i> are close to the same meaning. Family: frequently (adv.), frequency (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "In 1903, President Theodore Roosevelt helped <b>establish</b> the first national wildlife refuge, and it is still protecting birds today.<br><br>What does <b>establish</b> mean in this sentence?", "opts": ["to start or set up something that will last", "to change something that already exists", "to discover something by accident", "to visit something for a short time"], "ci": 0, "exp": "<i>establish</i> (v.) to start or create something meant to last, like a school or a rule. <i>The town <b>established</b> a library in 1890.</i> Family: establishment (n.), established (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The word <b>atmosphere</b> has more than one meaning. Which meaning is used in this sentence?<br><br>“With soft music and candles on every table, the restaurant had a calm, cozy <b>atmosphere</b>.”", "opts": ["the weather on a certain day", "the air inside a closed room", "the layer of gases around a planet", "the feeling or mood of a place"], "ci": 3, "exp": "<i>atmosphere</i> can mean the gases around Earth or another planet, or the mood a place gives you. Music and candles create a <b>mood</b>, so here it means the feeling of the place.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The climbers stared up at the <b>vertical</b> cliff. It rose straight up from the ground, so they could not simply walk to the top.<br><br>What does <b>vertical</b> mean in this sentence?", "opts": ["rough and covered with loose rocks", "going straight up and down", "flat and level like a floor", "slanting gently to one side"], "ci": 1, "exp": "<i>vertical</i> (adj.) straight up and down, like a flagpole. Its opposite is <i>horizontal</i> (flat). <i>The climber clung to the <b>vertical</b> wall.</i> Family: vertically (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The principal must give written ______ before our class can go on the field trip.", "opts": ["authorize", "authorization", "authorizing", "authorized"], "ci": 1, "exp": "After <i>written</i>, the sentence needs a noun: <i>authorization</i> (official permission). <i>Authorize</i> is the verb: <i>The principal will <b>authorize</b> the trip.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The flood caused ______ damage: water filled hundreds of homes, washed out roads, and ruined crops for miles.", "opts": ["modest", "precise", "extensive", "feeble"], "ci": 2, "exp": "<i>extensive</i> (adj.) covering a large area or a lot of things. Hundreds of homes and miles of crops is a lot. <i>Modest</i> would mean small. Family: extend (v.), extension (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "“When the council voted, there was only one voice of <b>dissent</b>; everyone else said yes.”<br><br>Which word means the <b>SAME</b> or nearly the same as <b>dissent</b> as it is used in the sentence?", "opts": ["disagreement", "agreement", "silence", "approval"], "ci": 0, "exp": "<i>dissent</i> (n.) disagreeing with what most people think or decide. One person said no while everyone else said yes. <i>Agreement</i> and <i>approval</i> are opposites. Family: dissenter (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Our teacher asked us to <b>incorporate</b> at least two facts from the article into our own paragraphs, so the facts became part of what we wrote.<br><br>What does <b>incorporate</b> mean in this sentence?", "opts": ["to leave something out on purpose", "to copy something word for word", "to check whether something is true", "to include something as part of a larger whole"], "ci": 3, "exp": "<i>incorporate</i> (v.) to take something in and make it part of a bigger thing. <i>The chef <b>incorporated</b> fresh herbs into the soup.</i> Family: incorporation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Many people in the 1800s worked hard to ______ slavery, and in 1865 the Thirteenth Amendment finally ended it.", "opts": ["abolish", "restore", "endure", "acquire"], "ci": 0, "exp": "<i>abolish</i> (v.) to officially end a law or system. The sentence says slavery was <i>finally ended</i>. <i>Endure</i> (put up with), <i>acquire</i> (get), and <i>restore</i> (bring back) do not fit. Family: abolition (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Because of the drought, the town will <b>restrict</b> lawn watering to only two mornings a week.<br><br>What does <b>restrict</b> mean in this sentence?", "opts": ["to limit how much or how often something can happen", "to make something happen more often", "to pay people for doing something", "to ask people politely to try something"], "ci": 0, "exp": "<i>restrict</i> (v.) to keep something within a limit. <i>The park <b>restricts</b> dogs to the paved paths.</i> Family: restriction (n.), restrictive (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Grandpa’s advice was so ______ that it helped me understand why my friend was upset.", "opts": ["insights", "insight", "insightfully", "insightful"], "ci": 3, "exp": "After <i>was so</i>, the sentence needs an adjective: <i>insightful</i> (showing deep understanding). <i>Insight</i> is the noun: <i>He has great <b>insight</b>.</i> The suffix <i>-ful</i> means “full of.”", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The students made colorful posters to <b>promote</b> the bake sale, hoping more families would come and buy treats.<br><br>What does <b>promote</b> mean in this sentence?", "opts": ["to pay for something ahead of time", "to cancel an event", "to keep something a secret", "to help something become known or popular"], "ci": 3, "exp": "<i>promote</i> (v.) to advertise or support something so more people notice it; also, to move someone up to a higher job. <i>The singer <b>promoted</b> her new album on the radio.</i> Family: promotion (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Every spring, Ana’s family cooks tamales and dances at a festival to celebrate their Mexican ______.", "opts": ["priority", "territory", "heritage", "hardship"], "ci": 2, "exp": "<i>heritage</i> (n.) the traditions, culture, and history passed down in a family or group. Festivals, food, and dance are part of heritage. Family: inherit (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Learning the violin takes <b>discipline</b>. Lena practices for thirty minutes every day, even when she would rather play outside.<br><br>What does <b>discipline</b> mean in this sentence?", "opts": ["a punishment given by a teacher", "a special lesson from an expert", "natural talent that a person is born with", "the ability to make yourself do what you should, even when it is hard"], "ci": 3, "exp": "<i>discipline</i> (n.) control over your own actions so you keep working toward a goal. It can also mean punishment, but here Lena makes <i>herself</i> practice. Family: disciplined (adj.), self-discipline (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After the storm knocked down power lines, the city’s top <b>priority</b> was getting electricity back to the hospital first.<br><br>What does <b>priority</b> mean in this sentence?", "opts": ["a rule that everyone in the city must obey", "a plan that is saved for a later time", "a problem that nobody knows how to fix", "the thing that is most important and must be done first"], "ci": 3, "exp": "<i>priority</i> (n.) something that is more important than other things and needs attention first. <i>Homework is my <b>priority</b> before video games.</i> Family: prioritize (v.), prior (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "“Fairness is an <b>abstract</b> idea, so you cannot touch it or hold it in your hand.”<br><br>Which word means the <b>OPPOSITE</b> of <b>abstract</b> as it is used in the sentence?", "opts": ["general", "concrete", "complex", "theoretical"], "ci": 1, "exp": "<i>abstract</i> (adj.) existing as an idea, not as a real object you can touch. The opposite is <i>concrete</i>: something real you can see or touch. <i>Theoretical</i> and <i>general</i> are close in meaning to abstract.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
