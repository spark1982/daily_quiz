var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261028";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["had build", "NO CHANGE", "has built", "has building"], "ci": 2, "exp": "After <i>has</i>, use the past participle. <i>Build</i> is irregular: build → built → built. So: <i>our team <b>has built</b> a small robot.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Email to Aunt Mei</strong><br><b>(1)</b> Dear Aunt Mei, I joined the robotics club at school this fall. <b>(2)</b> So far our team <u>has builded</u> a small robot that can follow a black line. <b>(3)</b> The box of spare parts <u>sit</u> on a shelf in our classroom. <b>(4)</b> Ms. Ortiz is our coach. <b>(5)</b> She used to work at a car factory. <b>(6)</b> Next month we <u>might</u> enter a contest in Wichita. <b>(7)</b> I will send you a video of our robot soon!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "are sitting", "sitting", "sits"], "ci": 3, "exp": "The subject is <i>box</i> (one box), not <i>parts</i>. One box needs a singular verb: <i>The box of spare parts <b>sits</b> on a shelf.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Email to Aunt Mei</strong><br><b>(1)</b> Dear Aunt Mei, I joined the robotics club at school this fall. <b>(2)</b> So far our team <u>has builded</u> a small robot that can follow a black line. <b>(3)</b> The box of spare parts <u>sit</u> on a shelf in our classroom. <b>(4)</b> Ms. Ortiz is our coach. <b>(5)</b> She used to work at a car factory. <b>(6)</b> Next month we <u>might</u> enter a contest in Wichita. <b>(7)</b> I will send you a video of our robot soon!"}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["Ms. Ortiz, which used to work at a car factory, is our coach.", "Ms. Ortiz, who used to work at a car factory, is our coach.", "Ms. Ortiz is our coach, she used to work at a car factory.", "Ms. Ortiz, whose used to work at a car factory, is our coach."], "ci": 1, "exp": "Use <i>who</i> for a person: <i>Ms. Ortiz, <b>who</b> used to work at a car factory, is our coach.</i> <i>Which</i> is for things, and a comma alone cannot join two sentences.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Email to Aunt Mei</strong><br><b>(1)</b> Dear Aunt Mei, I joined the robotics club at school this fall. <b>(2)</b> So far our team <u>has builded</u> a small robot that can follow a black line. <b>(3)</b> The box of spare parts <u>sit</u> on a shelf in our classroom. <b>(4)</b> Ms. Ortiz is our coach. <b>(5)</b> She used to work at a car factory. <b>(6)</b> Next month we <u>might</u> enter a contest in Wichita. <b>(7)</b> I will send you a video of our robot soon!"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["NO CHANGE", "might of", "mights", "must of"], "ci": 0, "exp": "It is already correct. <i>Might</i> + verb shows something that could happen: <i>Next month we <b>might</b> enter a contest.</i> <i>Might of</i> and <i>must of</i> are never correct.", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Email to Aunt Mei</strong><br><b>(1)</b> Dear Aunt Mei, I joined the robotics club at school this fall. <b>(2)</b> So far our team <u>has builded</u> a small robot that can follow a black line. <b>(3)</b> The box of spare parts <u>sit</u> on a shelf in our classroom. <b>(4)</b> Ms. Ortiz is our coach. <b>(5)</b> She used to work at a car factory. <b>(6)</b> Next month we <u>might</u> enter a contest in Wichita. <b>(7)</b> I will send you a video of our robot soon!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "shaked", "had shaken", "shakes"], "ci": 3, "exp": "This report tells how the harvest happens, so it stays in the present tense (<i>flood</i>, <i>come</i>, <i>rise</i>). So: <i>Then a machine <b>shakes</b> the vines.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>How Cranberries Are Harvested</strong><br><b>(1)</b> Cranberries grow on low vines in sandy fields called bogs. <b>(2)</b> In the fall, farmers flood the bogs with water. <b>(3)</b> Then a machine <u>shook</u> the vines so the berries come loose. <b>(4)</b> Each berry has tiny pockets of air inside it’s skin. <b>(5)</b> Because the berries are light they rise to the top of the water. <b>(6)</b> Workers push them together with long floating booms. <b>(7)</b> Ripe cranberries also bounce <u>good</u>, so farmers sometimes test them by dropping them."}, {"stem": "Which sentence has an error?", "opts": ["Workers push them together with long floating booms.", "In the fall, farmers flood the bogs with water.", "Each berry has tiny pockets of air inside it’s skin.", "Cranberries grow on low vines in sandy fields called bogs."], "ci": 2, "exp": "<i>It’s</i> means <i>it is</i>. To show that something belongs to it, use <i>its</i> with no apostrophe: <i>inside <b>its</b> skin.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>How Cranberries Are Harvested</strong><br><b>(1)</b> Cranberries grow on low vines in sandy fields called bogs. <b>(2)</b> In the fall, farmers flood the bogs with water. <b>(3)</b> Then a machine <u>shook</u> the vines so the berries come loose. <b>(4)</b> Each berry has tiny pockets of air inside it’s skin. <b>(5)</b> Because the berries are light they rise to the top of the water. <b>(6)</b> Workers push them together with long floating booms. <b>(7)</b> Ripe cranberries also bounce <u>good</u>, so farmers sometimes test them by dropping them."}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["goodly", "well", "more good", "NO CHANGE"], "ci": 1, "exp": "<i>Good</i> describes a noun. To tell <i>how</i> the berries bounce, use the adverb <i>well</i>: <i>Ripe cranberries also bounce <b>well</b>.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>How Cranberries Are Harvested</strong><br><b>(1)</b> Cranberries grow on low vines in sandy fields called bogs. <b>(2)</b> In the fall, farmers flood the bogs with water. <b>(3)</b> Then a machine <u>shook</u> the vines so the berries come loose. <b>(4)</b> Each berry has tiny pockets of air inside it’s skin. <b>(5)</b> Because the berries are light they rise to the top of the water. <b>(6)</b> Workers push them together with long floating booms. <b>(7)</b> Ripe cranberries also bounce <u>good</u>, so farmers sometimes test them by dropping them."}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["Because the berries are light they rise, to the top of the water.", "Because the berries are light, they rise to the top of the water.", "Because the berries, are light they rise to the top of the water.", "Because, the berries are light they rise to the top of the water."], "ci": 1, "exp": "When a sentence starts with a <i>because</i> part, put a comma after that part: <i>Because the berries are light<b>,</b> they rise to the top.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>How Cranberries Are Harvested</strong><br><b>(1)</b> Cranberries grow on low vines in sandy fields called bogs. <b>(2)</b> In the fall, farmers flood the bogs with water. <b>(3)</b> Then a machine <u>shook</u> the vines so the berries come loose. <b>(4)</b> Each berry has tiny pockets of air inside it’s skin. <b>(5)</b> Because the berries are light they rise to the top of the water. <b>(6)</b> Workers push them together with long floating booms. <b>(7)</b> Ripe cranberries also bounce <u>good</u>, so farmers sometimes test them by dropping them."}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["who", "whose", "whom", "NO CHANGE"], "ci": 0, "exp": "Grandpa is a person, so use <i>who</i>. It is the subject of <i>loves</i>, so <i>whom</i> does not fit: <i>Grandpa, <b>who</b> loves birds, helped me.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>My Bird Feeder Journal</strong><br><b>(1)</b> Dear Journal, last weekend Grandpa, <u>which</u> loves birds, helped me build a bird feeder out of cedar boards. <b>(2)</b> We measured, sawed, and sanded every piece. <b>(3)</b> By noon we <u>had painted</u> it bright blue. <b>(4)</b> Then Grandpa gave my sister and <u>I</u> a bag of sunflower seeds. <b>(5)</b> We hung the feeder outside the kitchen window. <b>(6)</b> The next morning, the first chickadee lands on the perch. <b>(7)</b> I can’t wait to see who visits next!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["have painted", "has painting", "had paint", "NO CHANGE"], "ci": 3, "exp": "It is already correct. <i>Had</i> + past participle shows something finished before a past time (by noon): <i>By noon we <b>had painted</b> it bright blue.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>My Bird Feeder Journal</strong><br><b>(1)</b> Dear Journal, last weekend Grandpa, <u>which</u> loves birds, helped me build a bird feeder out of cedar boards. <b>(2)</b> We measured, sawed, and sanded every piece. <b>(3)</b> By noon we <u>had painted</u> it bright blue. <b>(4)</b> Then Grandpa gave my sister and <u>I</u> a bag of sunflower seeds. <b>(5)</b> We hung the feeder outside the kitchen window. <b>(6)</b> The next morning, the first chickadee lands on the perch. <b>(7)</b> I can’t wait to see who visits next!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["myself", "mine", "NO CHANGE", "me"], "ci": 3, "exp": "Take away <i>my sister and</i>: Grandpa gave <i>me</i> a bag, not <i>gave I</i>. So: <i>Grandpa gave my sister and <b>me</b> a bag of sunflower seeds.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>My Bird Feeder Journal</strong><br><b>(1)</b> Dear Journal, last weekend Grandpa, <u>which</u> loves birds, helped me build a bird feeder out of cedar boards. <b>(2)</b> We measured, sawed, and sanded every piece. <b>(3)</b> By noon we <u>had painted</u> it bright blue. <b>(4)</b> Then Grandpa gave my sister and <u>I</u> a bag of sunflower seeds. <b>(5)</b> We hung the feeder outside the kitchen window. <b>(6)</b> The next morning, the first chickadee lands on the perch. <b>(7)</b> I can’t wait to see who visits next!"}, {"stem": "Which sentence has an error?", "opts": ["We measured, sawed, and sanded every piece.", "I can’t wait to see who visits next!", "We hung the feeder outside the kitchen window.", "The next morning, the first chickadee lands on the perch."], "ci": 3, "exp": "The journal tells about last weekend in the past tense, so do not switch to the present: <i>The next morning, the first chickadee <b>landed</b> on the perch.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>My Bird Feeder Journal</strong><br><b>(1)</b> Dear Journal, last weekend Grandpa, <u>which</u> loves birds, helped me build a bird feeder out of cedar boards. <b>(2)</b> We measured, sawed, and sanded every piece. <b>(3)</b> By noon we <u>had painted</u> it bright blue. <b>(4)</b> Then Grandpa gave my sister and <u>I</u> a bag of sunflower seeds. <b>(5)</b> We hung the feeder outside the kitchen window. <b>(6)</b> The next morning, the first chickadee lands on the perch. <b>(7)</b> I can’t wait to see who visits next!"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["is", "were", "has been", "NO CHANGE"], "ci": 1, "exp": "With <i>neither … nor</i>, the verb matches the subject closer to it. <i>Cousins</i> is plural, so: <i>Neither Lily nor her cousins <b>were</b> ready.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>The Runaway Kite</strong><br><b>(1)</b> On a windy afternoon, Lily and her cousins took a red kite to Prairie Hill. <b>(2)</b> Ne var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
