<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261028";
var RAW_QUESTIONS = [{"stem": "Which sentence best states the main idea of the passage?", "opts": ["Bison were important to Plains nations because they supplied food, clothing, and shelter.", "William Hornaday was the most important naturalist of the 1800s.", "American bison nearly disappeared because of overhunting, but people’s efforts helped them recover.", "Railroads carried bison hides to factories in the East by the trainload."], "ci": 2, "exp": "The passage moves from huge herds, to near extinction, to recovery. The detail about Plains nations and the railroads are true but are only parts of the story, and the passage never ranks Hornaday against other naturalists.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>"}, {"stem": "Which list shows the events in the order they happened?", "opts": ["Hunters sell bison hides to factories → Hornaday finds about a thousand bison left → Congress names the bison the national mammal → the American Bison Society is founded", "Hunters sell bison hides to factories → the American Bison Society is founded → Hornaday finds about a thousand bison left → Congress names the bison the national mammal", "Hornaday finds about a thousand bison left → hunters sell bison hides to factories → the American Bison Society is founded → Congress names the bison the national mammal", "Hunters sell bison hides to factories → Hornaday finds about a thousand bison left → the American Bison Society is founded → Congress names the bison the national mammal"], "ci": 3, "exp": "The hunting happened in the 1870s and 1880s, Hornaday’s count was in 1889, the Society was founded in 1905, and Congress acted in 2016.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>"}, {"stem": "According to the passage, what did the American Bison Society do?", "opts": ["It named the bison the national mammal.", "It sent bison to new wildlife refuges.", "It bought the hides that hunters sold.", "It counted the bison that were left in 1889."], "ci": 1, "exp": "The passage says the Society “sent animals to new wildlife refuges.” Hornaday’s count happened in 1889, before the Society existed, and Congress (not the Society) named the national mammal in 2016.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>"}, {"stem": "Read this sentence from “The Return of the Buffalo.”<br><br>“In the 1870s and 1880s, however, the herds <b>collapsed</b>.”<br><br>What does <b>collapsed</b> mean in this sentence?", "opts": ["fell down because they were tired", "shrank suddenly to a very small number", "joined together into one giant herd", "moved to a new part of the country"], "ci": 1, "exp": "The next sentences explain that hunters killed bison “by the millions” until “barely a thousand bison remained,” so the herds shrank very quickly. They did not move or join together, and the bison did not fall from tiredness.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>"}, {"stem": "Read this sentence from “How a Tornado Forms.”<br><br>“Doppler radar … giving families <b>precious</b> minutes to reach a basement or an interior room.”<br><br>Which word means the <b>OPPOSITE</b> of <b>precious</b> as it is used in the passage?", "opts": ["frightening", "brief", "worthless", "valuable"], "ci": 2, "exp": "Here <i>precious</i> means very valuable, because those minutes can save lives. The opposite is <i>worthless</i>. <i>Valuable</i> means the same thing, and <i>brief</i> and <i>frightening</i> describe other qualities.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>How a Tornado Forms</strong><br><p style=\"margin:0 0 8px;\">A tornado is a violently spinning column of air that stretches from a thunderstorm down to the ground. Although tornadoes can strike almost anywhere, they are especially common in the central United States, a region sometimes nicknamed Tornado Alley, because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.</p><p style=\"margin:0 0 8px;\">Most powerful tornadoes are born inside supercells. When winds near the ground blow in a different direction and at a different speed than winds higher up, the air between them begins to roll like a pencil between your palms. A strong updraft inside the storm can tilt this rolling air upright, and the whole storm begins to rotate. If the spinning narrows and tightens, it speeds up, just as a figure skater spins faster when she pulls in her arms, and a funnel may descend toward the earth.</p><p style=\"margin:0 0 8px;\">Tornado winds can exceed 200 miles per hour, causing tremendous damage in seconds. Because no one can prevent a tornado, forecasters concentrate on warning people early. Doppler radar can detect rotation inside a storm before a funnel ever appears, giving families precious minutes to reach a basement or an interior room.</p>"}, {"stem": "According to the passage, why are tornadoes especially common in the central United States?", "opts": ["Winds there always blow at 200 miles per hour.", "Warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.", "Doppler radar stations are located there.", "The land is flat, so tornadoes can travel farther."], "ci": 1, "exp": "The first paragraph says tornadoes are common there “because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.” The passage never mentions flat land, and 200 miles per hour describes tornado winds, not everyday winds.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>How a Tornado Forms</strong><br><p style=\"margin:0 0 8px;\">A tornado is a violently spinning column of air that stretches from a thunderstorm down to the ground. Although tornadoes can strike almost anywhere, they are especially common in the central United States, a region sometimes nicknamed Tornado Alley, because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.</p><p style=\"margin:0 0 8px;\">Most powerful tornadoes are born inside supercells. When winds near the ground blow in a different direction and at a different speed than winds higher up, the air between them begins to roll like a pencil between your palms. A strong updraft inside the storm can tilt this rolling air upright, and the whole storm begins to rotate. If the spinning narrows and tightens, it speeds up, just as a figure skater spins faster when she pulls in her arms, and a funnel may descend toward the earth.</p><p style=\"margin:0 0 8px;\">Tornado winds can exceed 200 miles per hour, causing tremendous damage in seconds. Because no one can prevent a tornado, forecasters concentrate on warning people early. Doppler radar can detect rotation inside a storm before a funnel ever appears, giving families precious minutes to reach a basement or an interior room.</p>"}, {"stem": "Why does the author compare the storm to a figure skater pulling in her arms?", "opts": ["to show that tornadoes are graceful and beautiful", "to prove that tornadoes happen most often in winter", "to help readers picture why the spinning gets faster as it narrows", "to explain how forecasters warn people early"], "ci": 2, "exp": "Right after the comparison, the passage says the spinning “speeds up” as it “narrows and tightens.” A skater who pulls in her arms spins faster in the same way. The comparison is about speed, not beauty, warnings, or seasons.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>How a Tornado Forms</strong><br><p style=\"margin:0 0 8px;\">A tornado is a violently spinning column of air that stretches from a thunderstorm down to the ground. Although tornadoes can strike almost anywhere, they are especially common in the central United States, a region sometimes nicknamed Tornado Alley, because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.</p><p style=\"margin:0 0 8px;\">Most powerful tornadoes are born inside supercells. When winds near the ground blow in a different direction and at a different speed than winds higher up, the air between them begins to roll like a pencil between your palms. A strong updraft inside the storm can tilt this rolling air upright, and the whole storm begins to rotate. If the spinning narrows and tightens, it speeds up, just as a figure skater spins faster when she pulls in her arms, and a funnel may descend toward the earth.</p><p style=\"margin:0 0 8px;\">Tornado winds can exceed 200 miles per hour, causing tremendous damage in seconds. Because no one can prevent a tornado, forecasters concentrate on warning people early. Doppler radar can detect rotation inside a storm before a funnel ever appears, giving families precious minutes to reach a basement or an interior room.</p>"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Tornadoes form only in the central United States.", "A spinning storm speeds up when the spinning narrows.", "Tornado winds can be faster than 200 miles per hour.", "Doppler radar can detect rotation before a funnel appears."], "ci": 0, "exp": "The passage says tornadoes “can strike almost anywhere,” even though they are especially common in the central United States. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>How a Tornado Forms</strong><br><p style=\"margin:0 0 8px;\">A tornado is a violently spinning column of air that stretches from a thunderstorm down to the ground. Although tornadoes can strike almost anywhere, they are especially common in the central United States, a region sometimes nicknamed Tornado Alley, because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.</p><p style=\"margin:0 0 8px;\">Most powerful tornadoes are born inside supercells. When winds near the ground blow in a different direction and at a different speed than winds higher up, the air between them begins to roll like a pencil between your palms. A strong updraft inside the storm can tilt this rolling air upright, and the whole storm begins to rotate. If the spinning narrows and tightens, it speeds up, just as a figure skater spins faster when she pulls in her arms, and a funnel may descend toward the earth.</p><p style=\"margin:0 0 8px;\">Tornado winds can exceed 200 miles per hour, causing tremendous damage in seconds. Because no one can prevent a tornado, forecasters concentrate on warning people early. Doppler radar can detect rotation inside a storm before a funnel ever appears, giving families precious minutes to reach a basement or an interior room.</p>"}, {"stem": "Read this sentence from the story.<br><br>“Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was <b>flawless</b>.”<br><br>Which word means the <b>OPPOSITE</b> of <b>flawless</b>?", "opts": ["clever", "sturdy", "faulty", "perfect"], "ci": 2, "exp": "<i>Flawless</i> means having no mistakes. The opposite is <i>faulty</i>, which means having something wrong with it, and the leaky boat proves the design had a problem. <i>Perfect</i> means the same as flawless.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>The Leaky Lightning</strong><br><p style=\"margin:0 0 8px;\">Elena pressed the last strip of duct tape along the seam of the cardboard boat and stepped back. “It looks like a giant cereal box,” her little brother Sam said doubtfully.</p><p style=\"margin:0 0 8px;\">“It’s a racing boat,” Elena corrected him. “And it’s called the <i>Lightning</i>.”</p><p style=\"margin:0 0 8px;\">The rules of the Riverside Pool Cardboard Regatta were simple: build a boat from cardboard and tape, then paddle it across the pool. Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was flawless.</p><p style=\"margin:0 0 8px;\">Five seconds after the starting whistle, cold water began seeping through the bottom. Sam’s knees were soaked. “We’re sinking!” he wailed.</p><p style=\"margin:0 0 8px;\">Elena’s stomach dropped. Every other boat was already halfway across. Then she remembered the extra roll of tape in her pocket. “Keep paddling,” she said. “I’ll patch it.”</p><p style=\"margin:0 0 8px;\">While Sam paddled furiously, Elena slapped tape over the widest crack. The leak slowed to a trickle. Inch by inch, the <i>Lightning</i> crept forward until its nose bumped the far wall.</p><p style=\"margin:0 0 8px;\">They finished last, but the crowd cheered louder for them than for the winners. Sam grinned and wiped the water off his face. “Next year,” he announced, “we use twice as much tape.”</p>"}, {"stem": "According to the story, which statement is <b>NOT</b> true?", "opts": ["Water came in through the bottom of the boat.", "Elena had an extra roll of tape in her pocket.", "Elena spent two weekends building the boat.", "Sam patched the crack while Elena paddled."], "ci": 3, "exp": "The story says, “While Sam paddled furiously, Elena slapped tape over the widest crack.” The jobs are switched in this statement. The other three statements match the story.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Leaky Lightning</strong><br><p style=\"margin:0 0 8px;\">Elena pressed the last strip of duct tape along the seam of the cardboard boat and stepped back. “It looks like a giant cereal box,” her little brother Sam said doubtfully.</p><p style=\"margin:0 0 8px;\">“It’s a racing boat,” Elena corrected him. “And it’s called the <i>Lightning</i>.”</p><p style=\"margin:0 0 8px;\">The rules of the Riverside Pool Cardboard Regatta were simple: build a boat from cardboard and tape, then paddle it across the pool. Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was flawless.</p><p style=\"margin:0 0 8px;\">Five seconds after the starting whistle, cold water began seeping through the bottom. Sam’s knees were soaked. “We’re sinking!” he wailed.</p><p style=\"margin:0 0 8px;\">Elena’s stomach dropped. Every other boat was already halfway across. Then she remembered the extra roll of tape in her pocket. “Keep paddling,” she said. “I’ll patch it.”</p><p style=\"margin:0 0 8px;\">While Sam paddled furiously, Elena slapped tape over the widest crack. The leak slowed to a trickle. Inch by inch, the <i>Lightning</i> crept forward until its nose bumped the far wall.</p><p style=\"margin:0 0 8px;\">They finished last, but the crowd cheered louder for them than for the winners. Sam grinned and wiped the water off his face. “Next year,” he announced, “we use twice as much tape.”</p>"}, {"stem": "Read this sentence from “The Leaky Lightning.”<br><br>“Five seconds after the starting whistle, cold water began <b>seeping</b> through the bottom.”<br><br>Which word means the <b>SAME</b> or nearly the same as <b>seeping</b>?", "opts": ["leaking", "splashing", "freezing", "pouring"], "ci": 0, "exp": "Water <i>seepin nly way to earn people’s respect."], "ci": 1, "exp": "Elena stays calm, patches the leak, and finishes the race; even though they come in last, the crowd cheers and Sam is already excited for next year. The crowd cheering for last place shows that winning is not the only thing that matters.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Leaky Lightning</strong><br><p style=\"margin:0 0 8px;\">Elena pressed the last strip of duct tape along the seam of the cardboard boat and stepped back. “It looks like a giant cereal box,” her little brother Sam said doubtfully.</p><p style=\"margin:0 0 8px;\">“It’s a racing boat,” Elena corrected him. “And it’s called the <i>Lightning</i>.”</p><p style=\"margin:0 0 8px;\">The rules of the Riverside Pool Cardboard Regatta were simple: build a boat from cardboard and tape, then paddle it across the pool. Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was flawless.</p><p style=\"margin:0 0 8px;\">Five seconds after the starting whistle, cold water began seeping through the bottom. Sam’s knees were soaked. “We’re sinking!” he wailed.</p><p style=\"margin:0 0 8px;\">Elena’s stomach dropped. Every other boat was already halfway across. Then she remembered the extra roll of tape in her pocket. “Keep paddling,” she said. “I’ll patch it.”</p><p style=\"margin:0 0 8px;\">While Sam paddled furiously, Elena slapped tape over the widest crack. The leak slowed to a trickle. Inch by inch, the <i>Lightning</i> crept forward until its nose bumped the far wall.</p><p style=\"margin:0 0 8px;\">They finished last, but the crowd cheered louder for them than for the winners. Sam grinned and wiped the water off his face. “Next year,” he announced, “we use twice as much tape.”</p>"}, {"stem": "What happened right after the family climbed onto the roof of the barn?", "opts": ["Ada asked why Mrs. Becker was sealing her windows.", "Ada held her breath and then let it out slowly.", "Ada tossed the comet pill into the pigpen.", "Papa explained that the comet’s tail was thinner than air."], "ci": 1, "exp": "On the roof, the family saw the comet, and “Ada held her breath at first, then let it out slowly.” Papa’s explanation and Ada’s question happened earlier at supper, and she tossed the pill the next morning.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Night of the Comet</strong><br><p style=\"margin:0 0 8px;\">In May 1910, everyone in Harlan County, Nebraska, seemed to be talking about Halley’s Comet. The newspapers reported that Earth would pass through the comet’s glowing tail on the night of May 18, and some people were convinced the tail contained poisonous gas. In town, a traveling salesman was selling “comet pills” that he claimed would protect anyone who swallowed them.</p><p style=\"margin:0 0 8px;\">Ada Lindqvist, who was eleven, did not know what to believe. At supper she pushed her potatoes around her plate until her father set down his fork.</p><p style=\"margin:0 0 8px;\">“The tail is thinner than the air in this kitchen,” Papa said. “Astronomers have measured it. We will be fine.”</p><p style=\"margin:0 0 8px;\">“Then why is Mrs. Becker sealing her windows with wet towels?” Ada asked.</p><p style=\"margin:0 0 8px;\">Papa smiled. “Fear spreads faster than facts.”</p><p style=\"margin:0 0 8px;\">After dark, the whole family climbed onto the roof of the barn. The comet hung above the cornfields like a silver brushstroke, its tail stretching across a wide swath of sky. Ada held her breath at first, then let it out slowly. Nothing happened, except that the crickets kept singing.</p><p style=\"margin:0 0 8px;\">The next morning, she tossed the comet pill her friend had given her into the pigpen.</p>"}, {"stem": "Why did Ada most likely toss the comet pill into the pigpen?", "opts": ["Her friend asked her to get rid of it.", "She now believed the comet was harmless and the pill wa ople nearby.", "Both were started because food was rationed during a war.", "Both use sensors to tell people when to water.", "Both grow vegetables in rows of soil."], "ci": 0, "exp": "Ruth’s neighbors used a vacant lot, and Leo’s school used a flat roof; both feed the people around them. Only Passage A mentions rationing, only Passage B uses sensors, and Passage B’s plants grow in water, not soil.", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1943, with food rationed during World War II, the government urged Americans to plant “victory gardens.” Thirteen-year-old Ruth Kowalski and her neighbors on Chicago’s South Side cleared bricks and broken glass from a vacant lot behind their apartment building. They planted beans, tomatoes, and cabbage in tidy rows, hauling water in buckets from the building’s basement. By August, the lot was producing more vegetables than the families could eat, so Ruth’s mother canned the extra in glass jars to last through the winter. Ruth later said the garden taught her that a neighborhood could feed itself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last year, students at Ridgeview Middle School in Denver turned their flat school roof into a hydroponic garden. Instead of soil, the plants grow in trays of water mixed with nutrients, and sensors send a text message to the students when the water runs low. Seventh grader Leo Martinez checks the lettuce and basil every morning before class. The harvest goes straight to the school cafeteria, where it replaces vegetables that once traveled more than a thousand miles by truck. Leo says the best part is watching classmates eat a salad that was growing above their heads that morning.</p>"}, {"stem": "In Passage B, the prefix <i>hydro-</i> means “water.” Based on this and the passage, what does <b>hydroponic</b> most likely mean?", "opts": ["growing plants in water instead of soil", "watering plants with buckets", "growing plants that need very little water", "growing plants on a flat roof"], "ci": 0, "exp": "Passage B says, “Instead of soil, the plants grow in trays of water mixed with nutrients.” <i>Hydro-</i> (water) matches this. Being on a roof is where the garden is, not what <i>hydroponic</i> means.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1943, with food rationed during World War II, the government urged Americans to plant “victory gardens.” Thirteen-year-old Ruth Kowalski and her neighbors on Chicago’s South Side cleared bricks and broken glass from a vacant lot behind their apartment building. They planted beans, tomatoes, and cabbage in tidy rows, hauling water in buckets from the building’s basement. By August, the lot was producing more vegetables than the families could eat, so Ruth’s mother canned the extra in glass jars to last through the winter. Ruth later said the garden taught her that a neighborhood could feed itself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last year, students at Ridgeview Middle School in Denver turned their flat school roof into a hydroponic garden. Instead of soil, the plants grow in trays of water mixed with nutrients, and sensors send a text message to the students when the water runs low. Seventh grader Leo Martinez checks the lettuce and basil every morning before class. The harvest goes straight to the school cafeteria, where it replaces vegetables that once traveled more than a thousand miles by truck. Leo says the best part is watching classmates eat a salad that was growing above their heads that morning.</p>"}, {"stem": "According to Passage A, what did Ruth’s mother do with the extra vegetables?", "opts": ["She sold them to stores on the South Side.", "She sent them to soldiers fighting in the war.", "She gave them to the school cafeteria.", "She canned them in glass jars to last through the winter."], "ci": 3, "exp": "Passage A says Ruth’s mother “canned the extra in glass jars to last through the winter.” The cafeteria appears in Passage B, and the passage never mentions selling or sending the food away.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1943, with food rationed during World War II, the government urged Americans to plant “victory gardens.” Thirteen-year-old Ruth Kowalski and her neighbors on Chicago’s South Side cleared bricks and broken glass from a vacant lot behind their apartment building. They planted beans, tomatoes, and cabbage in tidy rows, hauling water in buckets from the building’s basement. By August, the lot was producing more vegetables than the families could eat, so Ruth’s mother canned the extra in glass jars to last through the winter. Ruth later said the garden taught her that a neighborhood could feed itself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last year, students at Ridgeview Middle School in Denver turned their flat school roof into a hydroponic garden. Instead of soil, the plants grow in trays of water mixed with nutrients, and sensors send a text message to the students when the water runs low. Seventh grader Leo Martinez checks the lettuce and basil every morning before class. The harvest goes straight to the school cafeteria, where it replaces vegetables that once traveled more than a thousand miles by truck. Leo says the best part is watching classmates eat a salad that was growing above their heads that morning.</p>"}, {"stem": "Based on Passage B, why does Leo most likely think the rooftop garden is better than buying vegetables from far away?", "opts": ["Trucks are not allowed to deliver food to the school.", "The vegetables are cheaper because sensors grow them.", "The vegetables are fresher because they do not have to travel far.", "Students do not have to eat salad anymore."], "ci": 2, "exp": "The cafeteria vegetables once “traveled more than a thousand miles by truck,” but now classmates eat lettuce that was “growing above their heads that morning.” This suggests freshness matters to Leo. The passage says nothing about cost or banning trucks.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1943, with food rationed during World War II, the government urged Americans to plant “victory gardens.” Thirteen-year-old Ruth Kowalski and her neighbors on Chicago’s South Side cleared bricks and broken glass from a vacant lot behind their apartment building. They planted beans, tomatoes, and cabbage in tidy rows, hauling water in buckets from the building’s basement. By August, the lot was producing more vegetables than the families could eat, so Ruth’s mother canned the extra in glass jars to last through the winter. Ruth later said the garden taught her that a neighborhood could feed itself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last year, students at Ridgeview Middle School in Denver turned their flat school roof into a hydroponic garden. Instead of soil, the plants grow in trays of water mixed with nutrients, and sensors send a text message to the students when the water runs low. Seventh grader Leo Martinez checks the lettuce and basil every morning before class. The harvest goes straight to the school cafeteria, where it replaces vegetables that once traveled more than a thousand miles by truck. Leo says the best part is watching classmates eat a salad that was growing above their heads that morning.</p>"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){

    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
