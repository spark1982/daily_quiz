s and towns expand, so volunteers now plant it in gardens and schoolyards to help the monarchs survive."}, {"stem": "In the third paragraph, &ldquo;Gradually, her shoulders <b>loosened</b>.&rdquo; What does <b>loosened</b> mean in this sentence?", "opts": ["became sore and tired", "became more relaxed", "lifted up higher", "began to shake"], "ci": 1, "exp": "Earlier Lily was stiff and her bow trembled; now &ldquo;the notes grew warm and steady.&rdquo; Her tight shoulders became relaxed. &ldquo;Began to shake&rdquo; describes how she felt at the start, not here.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Solo</strong><br>Lily had practiced the cello solo for six weeks, but as she waited backstage for the winter concert, her hands felt as stiff as frozen twigs. Through a gap in the curtain she could see the auditorium filling up: parents with cameras, grandparents with programs, and, in the third row, her older brother Theo, who had promised to come even though he had a basketball game that afternoon.<br><br>When Mr. Okafor nodded to her, Lily walked to the chair in the center of the stage and sat down. For the first few measures her bow trembled, and one note came out thin and wobbly. Her face burned. Then she remembered what Theo had told her the night before: “Don’t play for the whole room. Play for one person.” She found him in the third row and fixed her eyes on his familiar grin.<br><br>Gradually, her shoulders loosened. The notes grew warm and steady, and by the final phrase the music seemed to pour out of the cello on its own. When the applause came, it startled her, as though she had forgotten anyone else was listening."}, {"stem": "What can the reader infer about Theo?", "opts": ["He cares about Lily and wanted to help her do well.", "He was upset about missing his basketball game.", "He also plays the cello in the school orchestra.", "He thought Lily had not practiced enough."], "ci": 0, "exp": "Theo came even though s. Delgado discovered that the ripest tomatoes in the community garden had vanished overnight. On the fourth morning, she posted a sign on the gate: REWARD FOR INFORMATION.<br><br>Ben and his cousin Ruby volunteered to investigate. “A person would take the whole tomato,” Ruby reasoned, crouching beside the vines. “Look. These were bitten, and the half-eaten ones are lying in the dirt.”<br><br>Ben pointed at a row of small, five-toed tracks pressed into the mud near the fence. “And whoever left these wasn’t wearing shoes.”<br><br>That evening, Ben strapped his trail camera to a fence post. The next morning, the cousins hurried to check the footage. At 2:14 a.m., a masked face appeared on the screen, followed by a striped tail.<br><br>“A raccoon!” Ruby laughed. “Our thief has a bandit mask built in.”<br><br>Mrs. Delgado was so relieved that she gave them the reward anyway: a basket of the tomatoes the raccoon had missed. Then she asked a neighbor to help her build a taller fence with a wire top."}, {"stem": "In the last paragraph, &ldquo;Mrs. Delgado was so <b>relieved</b> that she gave them the reward anyway.&rdquo; What does <b>relieved</b> mean?", "opts": ["surprised and confused", "glad because a worry was gone", "tired after a long night", "proud of her garden"], "ci": 1, "exp": "Mrs. Delgado had been worried about a thief. Learning it was only a raccoon took that worry away, so she was <i>relieved</i>. She may have been surprised, but that word does not explain why she gave a reward &ldquo;anyway.&rdquo;", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Case of the Vanishing Tomatoes</strong><br>For three mornings in a row, Mrs. Delgado discovered that the ripest tomatoes in the community garden had vanished overnight. On the fourth morning, she posted a sign on the gate: REWARD FOR INFORMATION.<br><br>Ben and his cousin Ruby volunteered to investigate. “A person would take the whole tomato,” Ruby reasoned, crouching beside the v il camera to a fence post. The next morning, the cousins hurried to check the footage. At 2:14 a.m., a masked face appeared on the screen, followed by a striped tail.<br><br>“A raccoon!” Ruby laughed. “Our thief has a bandit mask built in.”<br><br>Mrs. Delgado was so relieved that she gave them the reward anyway: a basket of the tomatoes the raccoon had missed. Then she asked a neighbor to help her build a taller fence with a wire top."}, {"stem": "Why does Mrs. Delgado most likely build a taller fence with a wire top?", "opts": ["She wants to keep the raccoon from climbing into the garden again.", "She plans to catch the raccoon and take it to a zoo.", "She thinks Ben and Ruby took the tomatoes.", "She wants the cousins to stop investigating."], "ci": 0, "exp": "The camera showed a raccoon was the thief, and the tracks were near the fence. A taller fence with a wire top would stop an animal that climbs. She rewarded the cousins, so she did not blame them.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Case of the Vanishing Tomatoes</strong><br>For three mornings in a row, Mrs. Delgado discovered that the ripest tomatoes in the community garden had vanished overnight. On the fourth morning, she posted a sign on the gate: REWARD FOR INFORMATION.<br><br>Ben and his cousin Ruby volunteered to investigate. “A person would take the whole tomato,” Ruby reasoned, crouching beside the vines. “Look. These were bitten, and the half-eaten ones are lying in the dirt.”<br><br>Ben pointed at a row of small, five-toed tracks pressed into the mud near the fence. “And whoever left these wasn’t wearing shoes.”<br><br>That evening, Ben strapped his trail camera to a fence post. The next morning, the cousins hurried to check the footage. At 2:14 a.m., a masked face appeared on the screen, followed by a striped tail.<br><br>“A raccoon!” Ruby laughed. “Our thief has a bandit mask built in.”<br><br>Mrs. Delgado was so relieved that she gave them the reward anyway: a basket of the tomatoes the raccoon had missed. Then she asked a neighbor to help her build a taller fence with a wire top."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The tomatoes disappeared three mornings in a row.", "Some tomatoes were left half-eaten in the dirt.", "Mrs. Delgado gave the cousins tomatoes as a reward.", "Ruby strapped the trail camera to the garden gate."], "ci": 3, "exp": "The story says &ldquo;Ben strapped his trail camera to a fence post.&rdquo; Ruby did not do it, and it was not on the gate. The other statements match the story.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Case of the Vanishing Tomatoes</strong><br>For three mornings in a row, Mrs. Delgado discovered that the ripest tomatoes in the community garden had vanished overnight. On the fourth morning, she posted a sign on the gate: REWARD FOR INFORMATION.<br><br>Ben and his cousin Ruby volunteered to investigate. “A person would take the whole tomato,” Ruby reasoned, crouching beside the vines. “Look. These were bitten, and the half-eaten ones are lying in the dirt.”<br><br>Ben pointed at a row of small, five-toed tracks pressed into the mud near the fence. “And whoever left these wasn’t wearing shoes.”<br><br>That evening, Ben strapped his trail camera to a fence post. The next morning, the cousins hurried to check the footage. At 2:14 a.m., a masked face appeared on the screen, followed by a striped tail.<br><br>“A raccoon!” Ruby laughed. “Our thief has a bandit mask built in.”<br><br>Mrs. Delgado was so relieved that she gave them the reward anyway: a basket of the tomatoes the raccoon had missed. Then she asked a neighbor to help her build a taller fence with a wire top."}, {"stem": "Which word means the <b>OPPOSITE</b> of <b>wasteful</b> as it is used in Passage B?", "opts": ["extravagant", "expensive", "generous", "economical"], "ci": 3, "exp": "Buying a tool you use only once or twice is <i>wasteful</i>. The opposite is <i>economical</i>, which means careful not to waste money. <i>Extravagant</i> means almost the same as wasteful.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs."}, {"stem": "How are the libraries in Passage A and Passage B alike?", "opts": ["Both were started by Benjamin Franklin and his friends.", "Both lend mostly tools and musical instruments to families.", "Both help people share costly things instead of buying them.", "Both opened in Philadelphia during colonial times."], "ci": 2, "exp": "In Passage A, books were &ldquo;expensive and rare,&rdquo; so members shared them. In Passage B, families share tools and instruments instead of buying them. The libraries var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
