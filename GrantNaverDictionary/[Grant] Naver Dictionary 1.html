<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vocabulary Quiz</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f4fa;
  min-height: 100vh;
  padding: 14px;
}
.due-date {
  font-size: 2rem;
  font-weight: 800;
  color: #185FA5;
  background: white;
  text-align: center;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}
.quiz-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: #185FA5;
  text-align: center;
  margin-bottom: 10px;
}
.nav-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
#nav-count {
  font-size: 13px;
  white-space: nowrap;
  color: #555;
}
.prog-track {
  background: #d6e2ec;
  border-radius: 3px;
  height: 6px;
  flex: 1;
}
.prog-fill {
  background: #185FA5;
  border-radius: 3px;
  height: 6px;
  width: 0%;
  transition: width 0.2s;
}
#jump-btn {
  font-size: 12px;
  padding: 4px 10px;
  border: 1px solid #185FA5;
  border-radius: 14px;
  background: #fff;
  color: #185FA5;
  cursor: pointer;
  white-space: nowrap;
}
.dot-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: center;
  padding: 10px;
  background: white;
  border-radius: 12px;
  margin-bottom: 14px;
}
.dot-nav {
  display: none;
  max-height: 220px;
  overflow-y: auto;
}
.dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #d1d9e6;
  color: #555;
  font-size: 0.65rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.1s;
  -webkit-appearance: none;
}
.dot:active { transform: scale(0.92); }
.dot.current { border: 2px solid #185FA5; }
.dot.correct { background: #185FA5; color: white; }
.dot.wrong { background: #E24B4A; color: white; }
.quiz-card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.type-badge {
  display: inline-block;
  background: #185FA5;
  color: white;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 10px;
}
.q-counter {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 6px;
}
.question-text {
  font-size: 1.1rem;
  font-weight: 600;
  color: #1a1a2e;
  line-height: 1.5;
  margin-bottom: 18px;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.opt-btn {
  width: 100%;
  padding: 14px 16px;
  border-radius: 10px;
  border: 2px solid transparent;
  background: #e8edf4;
  color: #111111;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  transition: transform 0.1s;
  -webkit-appearance: none;
  font-family: inherit;
}
.opt-btn:active { transform: scale(0.98); }
.explanation {
  margin-top: 12px;
  padding: 10px 14px;
  background: #fff4e5;
  border-left: 4px solid #f5a623;
  border-radius: 0 8px 8px 0;
  font-size: 0.9rem;
  color: #5a3e00;
  line-height: 1.5;
}
.nav-btns {
  display: flex;
  gap: 10px;
}
.nav-btn {
  flex: 1;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  -webkit-appearance: none;
  font-family: inherit;
}
.prev-btn { background: #e8edf4; color: #185FA5; }
.next-btn { background: #185FA5; color: white; }
.nav-btn:active { transform: scale(0.97); }
.results-screen {
  display: none;
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.results-screen.show { display: block; }
.results-header { text-align: center; margin-bottom: 20px; }
.results-score { font-size: 2.5rem; font-weight: 800; color: #185FA5; }
.results-subtitle { font-size: 1rem; color: #666; margin-top: 4px; }
.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 7px;
  margin-bottom: 20px;
}
.result-card {
  padding: 7px 4px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 600;
}
.result-card.correct { background: #E1F5EE; color: #085041; border: 1px solid #1D9E75; }
.result-card.wrong { background: #FCEBEB; color: #501313; border: 1px solid #E24B4A; }
.result-card.skipped { background: #f0f0f0; color: #555; border: 1px solid #ccc; }
.wrong-list { margin-bottom: 20px; }
.wrong-item {
  padding: 12px;
  border-radius: 10px;
  background: #FCEBEB;
  border: 1px solid #E24B4A;
  margin-bottom: 8px;
  font-size: 0.9rem;
  color: #501313;
  line-height: 1.5;
}
.correct-ans { margin-top: 6px; color: #085041; font-weight: 600; }
.results-btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.copy-btn {
  flex: 1;
  min-width: 120px;
  padding: 14px;
  background: #185FA5;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.fresh-btn {
  flex: 1;
  min-width: 120px;
  padding: 14px;
  background: #e8edf4;
  color: #185FA5;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}
.retry-btn {
  width: 100%;
  padding: 14px;
  background: #E24B4A;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 10px;
}
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: white;
  border-radius: 16px;
  padding: 24px;
  width: 90%;

  text-align: center;

.modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; color: #1a1a2e; }
.modal-msg { font-size: 0.95rem; color: #555; margin-bottom: 20px; }

#quizArea { display: none; }

<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->
<!-- ===== Universal Total Attempts Counter (auto-injected) ===== -->
<style>
  #qzAttemptsBar { background: #f5f8fc; border-bottom: 1px solid #d0dce8; padding: 6px 12px; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.82rem; color: #4a6fa5; font-weight: 700; letter-spacing: 0.01em; }
  #qzAttemptsBar span { color: #185FA5; font-weight: 900; margin-left: 4px; }
</style>
<div id="qzAttemptsBar">Total Attempts:<span id="qzAttemptsCount">0</span></div>
<script>
(function(){
  var QA_KEY = 'qzAttempts_' + location.pathname;
  function qaGet(){ try { return parseInt(localStorage.getItem(QA_KEY)||'0',10) || 0; } catch(e){ return 0; } }
  function qaSet(n){ try { localStorage.setItem(QA_KEY, String(n)); } catch(e){} }
  function qaRenderCount(){
    var el = document.getElementById('qzAttemptsCount');
    if (el) el.textContent = qaGet();
  }
  function qaIsVisible(el){
    if (!el) return false;
    var r = el.getBoundingClientRect();
    if (r.width < 80 || r.height < 30) return false;
    var cs = window.getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden';
  }
  function qaResultsShowing(){
    var els = document.querySelectorAll('[id*="result" i],[class*="result" i],[id*="score" i],[class*="score" i]');
    for (var i=0;i<els.length;i++){ if (qaIsVisible(els[i])) return true; }
    return false;
  }
  var qaWasShowing = false;
  function qaCheck(){
    var showing = qaResultsShowing();
    if (showing && !qaWasShowing) {
      qaSet(qaGet()+1);
      qaRenderCount();
    }
    qaWasShowing = showing;
  }
  qaRenderCount();
  setInterval(qaCheck, 800);
  function qaObserve(){
    if (!document.body) return;
    var mo = new MutationObserver(function(){ qaCheck(); });
    mo.observe(document.body, { attributes: true, childList: true, subtree: true });
  }
  if (document.body) qaObserve();
  else document.addEventListener('DOMContentLoaded', qaObserve);
  setTimeout(qaCheck, 1500);
})();
</script>
<!-- ===== End Universal Total Attempts Counter ===== -->

  { q: "The meal eaten in the evening; dinner", options: ["supper","dozen","delight","instance"], ci: 0 }
];

var STORAGE_KEY = 'vocabQuiz50_v2';
var TOTAL = questions.length;
var ORDER_KEY = STORAGE_KEY + '_order_v1';
function identityOrder() { var arr = []; for (var i = 0; i < TOTAL; i++) arr.push(i); return arr; }
function isValidOrder(arr) {
  if (!Array.isArray(arr) || arr.length !== TOTAL) return false;
  var seen = {};
  for (var i = 0; i < arr.length; i++) {
    if (typeof arr[i] !== 'number' || arr[i] < 0 || arr[i] >= TOTAL || seen[arr[i]]) return false;
    seen[arr[i]] = true;
  }
  return true;
}
function loadOrder() {
  try {
    var raw = localStorage.getItem(ORDER_KEY);
    if (raw) {
      var arr = JSON.parse(raw);
      if (isValidOrder(arr)) return arr;
    }
  } catch(e) {}
  return null;
}
function saveOrder(order) {
  try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch(e) {}
}
function randomOrder() { return shuffleArr(identityOrder()); }
var currentOrder = loadOrder() || identityOrder();
saveOrder(currentOrder);
var pendingFreshMode = 'original';
function Q(pos) {
  if (state.retryMode) return questions[state.retryList[pos]];
  return questions[currentOrder[pos]];
}

var state = { current: 0, answers: {}, shuffleOrders: {}, showResults: false, retryMode: false, retryList: [] };

function getList() {
  if (state.retryMode) return state.retryList;
  var arr = [];
  for (var i = 0; i < TOTAL; i++) arr.push(i);
  return arr;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (s) state = JSON.parse(s);
  } catch(e) {}
}

function shuffleArr(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function getShuffleOrder(qIdx) {
  if (!state.shuffleOrders[qIdx]) {
    state.shuffleOrders[qIdx] = shuffleArr([0,1,2,3]);
    saveState();
  }
  return state.shuffleOrders[qIdx];
}

function checkCorrect(qIdx, displayPos) {
  var order = getShuffleOrder(qIdx);
  return order[displayPos] === Q(qIdx).ci;
}

function getCorrectDisplayPos(qIdx) {
  var order = getShuffleOrder(qIdx);
  return order.indexOf(Q(qIdx).ci);
}

function render() {
  try {
    var quizArea = document.getElementById('quizArea');
    var resultsScreen = document.getElementById('resultsScreen');

    if (state.showResults) {
      quizArea.style.display = 'none';
      resultsScreen.classList.add('show');
      renderResults();
      renderDotNav();
      return;
    }

    resultsScreen.classList.remove('show');
    quizArea.style.display = 'block';

    var q = Q(state.current);
    var order = getShuffleOrder(state.current);
    var answered = state.answers[state.current] !== undefined;
    var sel = state.answers[state.current];

    document.getElementById('qCounter').textContent = 'Question ' + (state.current + 1) + ' of ' + getList().length;
    document.getElementById('questionText').textContent = q.q;

    var optDiv = document.getElementById('optionsDiv');
    optDiv.innerHTML = '';

    for (var dp = 0; dp < 4; dp++) {
      (function(displayPos) {
        var origIdx = order[displayPos];
        var btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = q.options[origIdx];

        if (answered) {
          btn.disabled = true;
          var corrDisplay = getCorrectDisplayPos(state.current);
          if (displayPos === sel) {
            if (checkCorrect(state.current, sel)) {
              btn.style.cssText = 'background:#E1F5EE;border:2px solid #1D9E75;color:#085041;width:100%;padding:14px 16px;border-radius:10px;font-size:1rem;font-weight:500;text-align:left;font-family:inherit;';
            } else {
              btn.style.cssText = 'background:#FCEBEB;border:2px solid #E24B4A;color:#501313;width:100%;padding:14px 16px;border-radius:10px;font-size:1rem;font-weight:500;text-align:left;font-family:inherit;';
            }
          } else if (displayPos === corrDisplay) {
            btn.style.cssText = 'background:#E1F5EE;border:2px solid #1D9E75;color:#085041;width:100%;padding:14px 16px;border-radius:10px;font-size:1rem;font-weight:500;text-align:left;font-family:inherit;';
          } else {
            btn.style.cssText = 'background:#e8edf4;border:2px solid transparent;color:#111111;width:100%;padding:14px 16px;border-radius:10px;font-size:1rem;font-weight:500;text-align:left;font-family:inherit;';
          }
        } else {
          btn.style.cssText = 'background:#e8edf4;border:2px solid transparent;color:#111111;width:100%;padding:14px 16px;border-radius:10px;font-size:1rem;font-weight:500;text-align:left;cursor:pointer;font-family:inherit;';
          btn.onclick = function() { selectAnswer(displayPos); };
        }
        optDiv.appendChild(btn);
      })(dp);
    }

    var expDiv = document.getElementById('explanation');
    if (answered && !checkCorrect(state.current, sel)) {
      expDiv.textContent = 'The correct answer is: "' + q.options[q.ci] + '"';
      expDiv.style.display = 'block';
    } else {
      expDiv.style.display = 'none';
    }

    var prevBtn = document.getElementById('prevBtn');
    prevBtn.style.display = state.current === 0 ? 'none' : 'block';

    var nextBtn = document.getElementById('nextBtn');
    nextBtn.textContent = state.current === getList().length - 1 ? 'See Results \u2192' : 'Next \u2192';

    renderDotNav();
  } catch(err) {
    document.body.innerHTML = '<div style="padding:20px;color:red;font-size:1rem;">Error rendering quiz: ' + err.message + '</div>';
  }
}

function toggleJump() {
  var p = document.getElementById('dotNav');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'flex') { p.style.display = 'none'; b.innerHTML = 'Jump &#9662;'; }
  else { p.style.display = 'flex'; b.innerHTML = 'Hide &#9652;'; renderDotNav(); }
}

function renderDotNav() {
  var list = getList();
  var __ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = __ans + ' / ' + list.length;
  document.getElementById('prog-fill').style.width = (__ans / list.length * 100).toFixed(1) + '%';
  var nav = document.getElementById('dotNav');
  nav.innerHTML = '';

  if (state.showResults) {
    var pill = document.createElement('span');
    pill.style.cssText = 'background:#185FA5;color:white;padding:4px 16px;border-radius:20px;font-size:0.85rem;font-weight:700;';
    pill.textContent = 'Results';
    nav.appendChild(pill);
    return;
  }

  for (var i = 0; i < list.length; i++) {
    (function(idx) {
      var dot = document.createElement('button');
      dot.className = 'dot';
      dot.textContent = idx + 1;
      if (state.answers[idx] !== undefined) {
        if (checkCorrect(idx, state.answers[idx])) {
          dot.classList.add('correct');
        } else {
          dot.classList.add('wrong');
        }
      }
      if (idx === state.current) dot.classList.add('current');
      dot.onclick = function() { state.current = idx; saveState(); render(); };
      nav.appendChild(dot);
    })(i);
  }
}

function selectAnswer(displayPos) {
  state.answers[state.current] = displayPos;
  saveState();
  render();
}

function goPrev() {
  if (state.current > 0) { state.current--; saveState(); render(); }
}

function goNext() {
  if (state.current === getList().length - 1) {
    state.showResults = true;
    saveState();
    render();
  } else {
    state.current++;
    saveState();
    render();
  }
}

function renderResults() {
  var list = getList();
  var correct = 0, wrong = 0, skipped = 0;
  for (var i = 0; i < list.length; i++) {
    if (state.answers[i] === undefined) skipped++;
    else if (checkCorrect(i, state.answers[i])) correct++;
    else wrong++;
  }
  document.getElementById('resultsScore').textContent = correct + ' / ' + list.length;

  var grid = document.getElementById('resultsGrid');
  grid.innerHTML = '';
  for (var i = 0; i < list.length; i++) {
    (function(idx) {
      var card = document.createElement('div');
      card.className = 'result-card';
      if (state.answers[idx] === undefined) {
        card.classList.add('skipped');
        card.textContent = 'Q' + (idx+1) + ' Skip';
      } else if (checkCorrect(idx, state.answers[idx])) {
        card.classList.add('correct');
        card.textContent = 'Q' + (idx+1) + ' \u2713';
      } else {
        card.classList.add('wrong');
        card.textContent = 'Q' + (idx+1) + ' \u2717';
      }
      card.onclick = function() { state.showResults = false; state.current = idx; saveState(); render(); };
      grid.appendChild(card);
    })(i);
  }

  var wrongList = document.getElementById('wrongList');
  wrongList.innerHTML = '';
  for (var i = 0; i < list.length; i++) {
    if (state.answers[i] !== undefined && checkCorrect(i, state.answers[i])) continue;
    var q = Q(i);
    var item = document.createElement('div');
    item.className = 'wrong-item';
    var yourAns = 'Skipped';
    if (state.answers[i] !== undefined) {
      var order = getShuffleOrder(i);
      yourAns = q.options[order[state.answers[i]]];
    }
    item.innerHTML = '<strong>Q' + (i+1) + ':</strong> ' + q.q + '<br>Your answer: ' + yourAns + '<div class="correct-ans">\u2713 Correct: ' + q.options[q.ci] + '</div>';
    wrongList.appendChild(item);
  }

  var retryWrap = document.getElementById('retryBtnWrap');
  retryWrap.innerHTML = '';
  var hasWrong = false;
  for (var i = 0; i < list.length; i++) {
    if (state.answers[i] === undefined || !checkCorrect(i, state.answers[i])) { hasWrong = true; break; }
  }
  if (hasWrong) {
    var retryBtn = document.createElement('button');
    retryBtn.className = 'retry-btn';
    retryBtn.textContent = 'Retry Wrong Answers \u2192';
    retryBtn.onclick = retryWrong;
    retryWrap.appendChild(retryBtn);
  }
}

function copyResults() {
  var list = getList();
  var correct = 0;
  for (var i = 0; i < list.length; i++) {
    if (state.answers[i] !== undefined && checkCorrect(i, state.answers[i])) correct++;
  }
  var text = 'Vocabulary Quiz Results\n' + '='.repeat(30) + '\nScore: ' + correct + ' / ' + list.length + '\n\n';
  for (var i = 0; i < list.length; i++) {
    var q = Q(i);
    var status = 'Skipped';
    var ans = 'Skipped';
    if (state.answers[i] !== undefined) {
      var order = getShuffleOrder(i);
      ans = q.options[order[state.answers[i]]];
      status = checkCorrect(i, state.answers[i]) ? '\u2713 Correct' : '\u2717 Wrong';
    }
    text += 'Q' + (i+1) + ': ' + status + ' | ' + q.q + '\n  Your answer: ' + ans + ' | Correct: ' + q.options[q.ci] + '\n';
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { alert('Copied!'); }).catch(function() { fallbackCopy(text); });
  } else { fallbackCopy(text); }
}

function fallbackCopy(text) {
  var el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(el);
  el.focus(); el.select();
  try { document.execCommand('copy'); alert('Copied!'); } catch(e) { alert('Copy failed. Please copy manually.'); }
  document.body.removeChild(el);
}

function showFreshModal() { document.getElementById('modalOverlay').classList.add('show'); }
function hideFreshModal() { document.getElementById('modalOverlay').classList.remove('show'); }

function askFresh(mode) {
  pendingFreshMode = mode;
  document.getElementById('modalTitle').textContent = mode === 'random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
  document.getElementById('modalText').textContent = mode === 'random' ? 'Questions will be reshuffled into a new random order, and all progress will be reset.' : 'Questions will return to their original order, and all progress will be reset.';
  showFreshModal();
}

function retryWrong() {
  var list = getList();
  var wrong = [];
  for (var i = 0; i < list.length; i++) {
    if (state.answers[i] === undefined || !checkCorrect(i, state.answers[i])) {
      var absIdx = state.retryMode ? state.retryList[i] : currentOrder[i];
      wrong.push(absIdx);
    }
  }
  if (wrong.length === 0) { alert('No wrong or skipped answers to retry!'); return; }
  for (var j = 0; j < list.length; j++) {
    delete state.answers[j];
  }
  state.retryMode = true;
  state.retryList = wrong;
  state.current = 0;
  state.showResults = false;
  saveState();
  render();
}

function doStartFresh() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  currentOrder = (pendingFreshMode === 'random') ? randomOrder() : identityOrder();
  saveOrder(currentOrder);
  state = { current: 0, answers: {}, shuffleOrders: {}, showResults: false, retryMode: false, retryList: [] };
  hideFreshModal();
  render();
}

loadState();
render();
</script>
</body>
</html>
