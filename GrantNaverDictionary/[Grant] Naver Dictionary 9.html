<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }

  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>

    if(typeof s.cur !== "number" || s.cur < 0 || s.cur >= TOTAL) throw new Error("bad cur");
    if(typeof s.answers !== "object" || s.answers === null) throw new Error("bad answers");
    if(typeof s.shuffles !== "object" || s.shuffles === null) throw new Error("bad shuffles");
    s.showResults = !!s.showResults;
    s.counted = !!s.counted;
    s.retryMode = !!s.retryMode;
    s.retryList = Array.isArray(s.retryList) ? s.retryList : [];
    s.retryAnswers = (typeof s.retryAnswers === "object" && s.retryAnswers) ? s.retryAnswers : {};
    s.retryShuffles = (typeof s.retryShuffles === "object" && s.retryShuffles) ? s.retryShuffles : {};
    if(typeof s.retryCur !== "number" || s.retryCur < 0) s.retryCur = 0;
    s.retryShowResults = !!s.retryShowResults;
    if(s.retryMode && (s.retryList.length === 0 || s.retryCur >= s.retryList.length)){
      s.retryMode = false; s.retryCur = 0; s.retryShowResults = false;
    }
    return s;
  }catch(e){
    try{ localStorage.removeItem(LS_KEY); }catch(e2){}
    return defaultState();
  }
}

var state = loadState();

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function getAttempts(){ try{ var v = parseInt(localStorage.getItem(ATT_KEY), 10); return isNaN(v) ? 0 : v; }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts() + 1)); }catch(e){} }

function shuffleArr(n){
  var a = []; for(var i=0;i<n;i++) a.push(i);
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function ensureShuffle(store, qIdx, n){
  if(!store[qIdx] || !Array.isArray(store[qIdx]) || store[qIdx].length !== n){
    store[qIdx] = shuffleArr(n); save();
  }
  return store[qIdx];
}

function allIndices(){ var a=[]; for(var i=0;i<TOTAL;i++) a.push(i); return a; }

function ctx(){
  if(state.retryMode){
    return { list:state.retryList, answers:state.retryAnswers, shuffles:state.retryShuffles,
             cur:state.retryCur, showResults:state.retryShowResults, retry:true };
  }
  return { list:currentOrder, answers:state.answers, shuffles:state.shuffles,
           cur:state.cur, showResults:state.showResults, retry:false };
}

function setCur(p){ if(state.retryMode) state.retryCur = p; else state.cur = p; save(); render(); }
function recordAnswer(qIdx, origIdx){
  if(state.retryMode) state.retryAnswers[qIdx] = origIdx; else state.answers[qIdx] = origIdx;
  save();
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function speak(word){
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US"; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

var SPK_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';

function statusOf(answersMap, qIdx){
  if(!answersMap.hasOwnProperty(qIdx)) return "skipped";
  return (answersMap[qIdx] === QUESTIONS[qIdx].ci) ? "correct" : "wrong";
}

function toggleJump(){
  var p = document.getElementById("dotnav");
  var b = document.getElementById("jump-btn");
  if(p.style.display === "flex"){ p.style.display = "none"; b.innerHTML = "Jump &#9662;"; }
  else{ p.style.display = "flex"; b.innerHTML = "Hide &#9652;"; }
}

function renderTop(c){
  document.getElementById("attempts").textContent = "Total Attempts: " + getAttempts();
  var ans = Object.keys(c.answers).length;
  document.getElementById("nav-count").textContent = ans + " / " + c.list.length;
  document.getElementById("prog-fill").style.width = (ans / c.list.length * 100).toFixed(1) + "%";
  var nav = document.getElementById("dotnav");
  var h = "";
  for(var p=0;p<c.list.length;p++){
    var qIdx = c.list[p];
    var st = statusOf(c.answers, qIdx);
    var cls = "dot";
    if(st === "correct") cls += " correct";
    else if(st === "wrong") cls += " wrong";
    if(!c.showResults && p === c.cur) cls += " cur";
    h += '<div class="'+cls+'" onclick="setCur('+p+')">'+(p+1)+'</div>';
  }
  h += '<div class="pill'+(c.showResults ? ' cur' : '')+'" onclick="enterResults()">Results</div>';
  nav.innerHTML = h;
  var counter = document.getElementById("counter");
  counter.textContent = c.showResults ? (c.list.length + " / " + c.list.length) : ((c.cur+1) + " / " + c.list.length);
}

function render(){
  var c = ctx();
  renderTop(c);
  var quizArea = document.getElementById("quizArea");
  var resultsScreen = document.getElementById("resultsScreen");
  if(c.showResults){
    quizArea.style.display = "none";
    resultsScreen.classList.add("show");
    resultsScreen.style.display = "block";
    try { renderResults(c); }
    catch(e){ resultsScreen.innerHTML = '<div class="rcard">Results could not be displayed. Please reload the page.</div>'; }
  } else {
    resultsScreen.classList.remove("show");
    resultsScreen.style.display = "none";
    quizArea.style.display = "block";
    try { renderQuestion(c); }
    catch(e){ quizArea.innerHTML = '<div>Question could not be displayed. Please reload the page.</div>'; }
  }
}

function renderQuestion(c){
  var qIdx = c.list[c.cur];
  var q = QUESTIONS[qIdx];
  var shuffle = ensureShuffle(c.shuffles, qIdx, q.options.length);
  var answered = c.answers.hasOwnProperty(qIdx);
  var selOrig = answered ? c.answers[qIdx] : null;

  var h = '';
  h += '<span class="badge">Vocabulary</span>';
  h += '<div class="prompt">Choose the correct meaning of the word below.</div>';
  h += '<div class="wordrow"><span class="word">'+escapeHtml(q.word)+'</span>';
  h += '<button class="spk" onclick="speak(\''+q.word+'\')" aria-label="Listen">'+SPK_SVG+'</button></div>';

  h += '<div class="opts">';
  for(var dp=0; dp<shuffle.length; dp++){
    var origIdx = shuffle[dp];
    var text = q.options[origIdx];
    var cls = "opt";
    var clickAttr = '';
    if(answered){
      cls += " locked";
      if(origIdx === q.ci) cls += " correct";
      else if(origIdx === selOrig) cls += " wrong";
    } else {
      clickAttr = ' onclick="selectOption('+qIdx+','+origIdx+')"';
    }
    h += '<button class="'+cls+'"'+clickAttr+'>'+escapeHtml(text)+'</button>';
  }
  h += '</div>';

  if(answered){
    if(selOrig === q.ci){
      h += '<div class="ok">Correct.</div>';
    } else {
      h += '<div class="expl">'+escapeHtml('"'+q.word+'" means: '+q.options[q.ci])+'</div>';
    }
  }

  var isLast = (c.cur === c.list.length - 1);
  h += '<div class="navrow">';
  h += '<button class="navbtn prev" '+(c.cur===0?'disabled':'')+' onclick="setCur('+(c.cur-1)+')">Previous</button>';
  if(isLast){
    h += '<button class="navbtn next" onclick="enterResults()">See Results</button>';
  } else {
    h += '<button class="navbtn next" onclick="setCur('+(c.cur+1)+')">Next</button>';
  }
  h += '</div>';

  document.getElementById("quizArea").innerHTML = h;
}

function selectOption(qIdx, origIdx){
  var c = ctx();
  if(c.answers.hasOwnProperty(qIdx)) return;
  recordAnswer(qIdx, origIdx);
  render();
}

function enterResults(){
  if(state.retryMode){
    state.retryShowResults = true;
  } else {
    if(!state.counted){ incAttempts(); state.counted = true; }
    state.showResults = true;
  }
  save();
  render();
}

function jumpToQuestion(qIdx){
  state.showResults = false;
  var pos = currentOrder.indexOf(qIdx);
  state.cur = (pos >= 0 ? pos : qIdx);
  save();
  render();
}

function renderResults(c){
  if(c.retry){ renderRetryResults(c); return; }

  var correct = 0, list = [];
  for(var i=0;i<TOTAL;i++){
    var st = statusOf(state.answers, i);
    if(st === "correct") correct++;
    list.push(st);
  }

  var h = '';
  h += '<div class="rcard">';
  h += '<div class="attempts">Total Attempts: '+getAttempts()+'</div>';
  h += '<div class="score">'+correct+' / '+TOTAL+' correct</div>';
  h += '<div class="grid">';
  for(var i=0;i<TOTAL;i++){
    var st = list[i];
    var label = st.charAt(0).toUpperCase()+st.slice(1);
    h += '<div class="gcell '+st+'" onclick="jumpToQuestion('+i+')"><div class="qn">Q'+(i+1)+'</div><div class="st">'+label+'</div></div>';
  }
  h += '</div></div>';

  var review = [];
  for(var i=0;i<TOTAL;i++){ if(list[i] !== "correct") review.push(i); }

  if(review.length > 0){
    h += '<div class="rcard">';
    for(var k=0;k<review.length;k++){
      var qi = review[k];
      var q = QUESTIONS[qi];
      var st = list[qi];
      h += '<div class="rev">';
      h += '<div class="rw">Q'+(qi+1)+'. '+escapeHtml(q.word)+'</div>';
      if(st === "skipped"){
        h += '<div class="rl ra">Your answer: Skipped</div>';
      } else {
        h += '<div class="rl ra">Your answer: '+escapeHtml(q.options[state.answers[qi]])+'</div>';
      }
      h += '<div class="rl rc">Correct answer: '+escapeHtml(q.options[q.ci])+'</div>';
      h += '</div>';
    }
    h += '</div>';
  }

  h += '<div class="rcard"><div class="rbtns">';
  h += '<button class="rbtn copy" onclick="copyAll()">Copy All Results</button>';
  if(review.length > 0){
    h += '<button class="rbtn retry" onclick="startRetry()">Retry Wrong Questions</button>';
  }
  h += '<button class="rbtn fresh" id="freshBtnOriginal" onclick="showModal(\'original\')">Start Fresh (Original Order)</button>';
  h += '<button class="rbtn fresh" id="freshBtnRandom" onclick="showModal(\'random\')">Start Fresh (Random Order)</button>';
  h += '</div></div>';

  document.getElementById("resultsScreen").innerHTML = h;
}

function renderRetryResults(c){
  var listQ = state.retryList;
  var correct = 0;
  for(var p=0;p<listQ.length;p++){
    var qi = listQ[p];
    if(statusOf(state.retryAnswers, qi) === "correct") correct++;
  }
  var h = '';
  h += '<div class="rcard">';
  h += '<div class="score">Retry Score: '+correct+' / '+listQ.length+'</div>';
  h += '<div class="scoresub">Questions you previously missed.</div>';
  h += '</div>';

  var review = [];
  for(var p=0;p<listQ.length;p++){
    var qi = listQ[p];
    if(statusOf(state.retryAnswers, qi) !== "correct") review.push(qi);
  }
  if(review.length > 0){
    h += '<div class="rcard">';
    for(var k=0;k<review.length;k++){
      var qi = review[k];
      var q = QUESTIONS[qi];
      var st = statusOf(state.retryAnswers, qi);
      h += '<div class="rev">';
      h += '<div class="rw">'+escapeHtml(q.word)+'</div>';
      if(st === "skipped"){
        h += '<div class="rl ra">Your answer: Skipped</div>';
      } else {
        h += '<div class="rl ra">Your answer: '+escapeHtml(q.options[state.retryAnswers[qi]])+'</div>';
      }
      h += '<div class="rl rc">Correct answer: '+escapeHtml(q.options[q.ci])+'</div>';
      h += '</div>';
    }
    h += '</div>';
  }

  h += '<div class="rcard"><div class="rbtns">';
  h += '<button class="rbtn back" onclick="exitRetry()">Back to Results</button>';
  h += '</div></div>';

  document.getElementById("resultsScreen").innerHTML = h;
}

function startRetry(){
  var wrong = [];
  for(var i=0;i<TOTAL;i++){
    if(statusOf(state.answers, i) !== "correct") wrong.push(i);
  }
  if(wrong.length === 0) return;
  state.retryMode = true;
  state.retryList = wrong;
  state.retryAnswers = {};
  state.retryShuffles = {};
  state.retryCur = 0;
  state.retryShowResults = false;
  save();
  render();
}

function exitRetry(){
  state.retryMode = false;
  state.retryShowResults = false;
  save();
  render();
}

function copyAll(){
  var lines = [];
  lines.push("English Vocabulary Quiz - " + QUIZ_DATE);
  var correct = 0;
  for(var i=0;i<TOTAL;i++){ if(statusOf(state.answers,i)==="correct") correct++; }
  lines.push("Score: " + correct + " / " + TOTAL);
  lines.push("");
  for(var i=0;i<TOTAL;i++){
    var q = QUESTIONS[i];
    var st = statusOf(state.answers, i);
    var label = st.charAt(0).toUpperCase()+st.slice(1);
    lines.push("Q"+(i+1)+". "+q.word+" - "+label);
    if(st !== "correct"){
      lines.push("   Correct answer: " + q.options[q.ci]);
    }
  }
  copyText(lines.join("\n"));
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("Copied"); }, function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  try{
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    ta.contentEditable = "true"; ta.readOnly = false;
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    if(ta.setSelectionRange) ta.setSelectionRange(0, text.length);
    document.execCommand("copy");
    document.body.removeChild(ta);
    toast("Copied");
  }catch(e){ toast("Copy failed"); }
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1500);
}

function showModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById("modalTitle");
  var x = document.getElementById("modalText");
  if(t){ t.textContent = mode === "random" ? "Start Fresh (Random Order)?" : "Start Fresh (Original Order)?"; }
  if(x){ x.textContent = mode === "random" ? "Questions will be reshuffled into a new random order, and all progress will be reset." : "Questions will return to their original order, and all progress will be reset."; }
  document.getElementById("modal").style.display = "flex";
}
function hideModal(){ document.getElementById("modal").style.display = "none"; }
function doStartFresh(){
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  currentOrder = (pendingFreshMode === "random") ? randomOrder() : identityOrder();
  saveOrder(currentOrder);
  state = defaultState();
  save();
  hideModal();
  render();
}

render();
</script>
