<script>
/* ===== TIMER IIFE ===== */
(function(){
  var QUIZ_ID='grant_naver_dict_01';
  var TK='qzTimer_'+QUIZ_ID;
  var interval=null,pausedRemaining=null,startedAt=null,totalMs=0;

  function fmt(ms){
    if(ms<=0)return'Time\'s Up';
    var s=Math.ceil(ms/1000);
    var m=Math.floor(s/60);s=s%60;
    return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function setColor(ms){
    var el=document.getElementById('qzCountdown');
    var pct=totalMs>0?ms/totalMs:1;
    el.style.color=pct<=0.10?'#E24B4A':pct<=0.25?'#f5a623':'#111';
  }
  function tick(){
    var now=Date.now();
    var remaining=pausedRemaining!==null?pausedRemaining:(totalMs-(now-startedAt));
    if(remaining<=0){
      clearInterval(interval);interval=null;
      document.getElementById('qzCountdown').textContent='Time\'s Up';
      document.getElementById('qzCountdown').style.color='#E24B4A';
      save({running:false,remaining:0});
      return;
    }
    document.getElementById('qzCountdown').textContent=fmt(remaining);
    setColor(remaining);
    save({running:pausedRemaining===null,remaining:remaining});
  }
  function save(d){try{localStorage.setItem(TK,JSON.stringify(d));}catch(e){}}
  function showRunning(){
    document.getElementById('qzTimerSetup').style.display='none';
    document.getElementById('qzTimerRunning').style.display='flex';
  }
  window.qzStartTimer=function(){
    var mins=parseInt(document.getElementById('qzTimerInput').value)||20;
    totalMs=mins*60000;
    startedAt=Date.now();pausedRemaining=null;
    clearInterval(interval);
    interval=setInterval(tick,500);
    showRunning();
    document.getElementById('qzCountdown').textContent=fmt(totalMs);
    setColor(totalMs);
  };
  window.qzPauseResume=function(){
    var btn=document.getElementById('qzPauseBtn');
    if(pausedRemaining===null){
      pausedRemaining=totalMs-(Date.now()-startedAt);
      clearInterval(interval);interval=null;
      btn.textContent='Resume';
    } else {
      startedAt=Date.now()-(totalMs-pausedRemaining);
      pausedRemaining=null;
      clearInterval(interval);
      interval=setInterval(tick,500);
      btn.textContent='Pause';
    }
  };
  window.qzTimerReset=function(){
    clearInterval(interval);interval=null;
    pausedRemaining=null;startedAt=null;
    document.getElementById('qzTimerSetup').style.display='flex';
    document.getElementById('qzTimerRunning').style.display='none';
    document.getElementById('qzCountdown').textContent='';
    try{localStorage.removeItem(TK);}catch(e){}
  };
})();
</script>

  try{
    var raw=localStorage.getItem(ORDER_KEY);
    if(raw){var arr=JSON.parse(raw);if(isValidOrder(arr))return arr;}
  }catch(e){}
  return null;
}
function saveOrder(order){try{localStorage.setItem(ORDER_KEY,JSON.stringify(order));}catch(e){}}
function randomOrder(){
  var arr=identityOrder();
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
var currentOrder=loadOrder()||identityOrder();
saveOrder(currentOrder);
var pendingFreshMode='original';

var state={};
var retryMode=false;
var retryList=[];
var modalCb=null;
var dotPanelOpen=false;

function loadState(){
  try{
    var raw=localStorage.getItem(SK);
    if(!raw)return null;
    var s=JSON.parse(raw);
    if(typeof s.cur!=='number'||s.cur<0||s.cur>=ALL_Q.length)return null;
    if(typeof s.answers!=='object'||typeof s.shuffles!=='object')return null;
    return s;
  }catch(e){return null;}
}
function saveState(){
  try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}
}
function getAtt(){
  try{return parseInt(localStorage.getItem(AK)||'0');}catch(e){return 0;}
}
function incAtt(){
  try{localStorage.setItem(AK,String(getAtt()+1));}catch(e){}
}
function updateAttDisplay(){
  document.getElementById('attCount').textContent=getAtt();
}

function fisherYates(arr,seed){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    seed=(seed*1664525+1013904223)&0xffffffff;
    var j=Math.abs(seed)%(i+1);
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function getQuestions(){return retryMode?retryList:ALL_Q;}

function init(){
  window.qzTimerReset();
  updateAttDisplay();
  var saved=loadState();
  if(saved){
    state=saved;
  } else {
    state={cur:0,answers:{},shuffles:{},showResults:false};
    saveState();
  }
  buildDots();
  if(state.showResults){
    showResults();
  } else {
    render();
  }
}

function buildDots(){
  var qs=getQuestions();
  var panel=document.getElementById('dotPanel');
  panel.innerHTML='';
  for(var i=0;i<qs.length;i++){
    (function(idx){
      var d=document.createElement('button');
      d.className='dot';
      d.textContent=idx+1;
      d.onclick=function(){jumpTo(idx);};
      panel.appendChild(d);
    })(i);
  }
  var pill=document.getElementById('resultsPill');
  pill.style.display='none';
}

function updateDots(){
  var qs=getQuestions();
  var panel=document.getElementById('dotPanel');
  var dots=panel.querySelectorAll('.dot');
  var allDone=true;
  for(var i=0;i<qs.length;i++){
    var ans=state.answers[i];
    if(ans===undefined){allDone=false;dots[i].className='dot';}
    else if(ans===true){dots[i].className='dot correct';}
    else{dots[i].className='dot wrong';}
  }
  var answered=Object.keys(state.answers).length;
  var label=document.getElementById('progressLabel');
  label.textContent=answered+' / '+qs.length;
  var fill=document.getElementById('progressFill');
  fill.style.width=(qs.length>0?(answered/qs.length*100):0)+'%';
  var pill=document.getElementById('resultsPill');
  pill.style.display=allDone?'block':'none';
}

window.toggleDots=function(){
  dotPanelOpen=!dotPanelOpen;
  var panel=document.getElementById('dotPanel');
  panel.style.display=dotPanelOpen?'flex':'none';
  document.getElementById('jumpToggle').textContent=dotPanelOpen?'Jump ▴':'Jump ▾';
};

function jumpTo(idx){
  state.cur=idx;
  state.showResults=false;
  saveState();
  render();
}

function render(){
  var qs=getQuestions();
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateDots();

  var qi=retryMode?state.cur:currentOrder[state.cur];
  var q=qs[qi];
  document.getElementById('qNum').textContent='Question '+(state.cur+1)+' of '+qs.length;
  document.getElementById('qWord').textContent=q.w;

  // shuffle options
  if(!state.shuffles[state.cur]){
    var indices=[0,1,2,3];
    var shuffled=fisherYates(indices,state.cur*31+7777);
    state.shuffles[state.cur]=shuffled;
    saveState();
  }
  var order=state.shuffles[state.cur];
  var answered=state.answers[state.cur];
  var optsDiv=document.getElementById('optsDiv');
  optsDiv.innerHTML='';
  order.forEach(function(oi,pos){
    var btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=q.opts[oi];
    if(answered!==undefined){
      if(oi===q.ci){btn.classList.add('correct');}
      else if(answered===false&&pos===order.indexOf(order[pos])&&oi!==q.ci&&state.selectedOpt!==undefined&&state.selectedOpt[state.cur]===oi){btn.classList.add('wrong');}
    }
    btn.onclick=(function(optIdx){return function(){selectOpt(optIdx);};})(oi);
    optsDiv.appendChild(btn);
  });

  // restore wrong highlight
  if(answered===false&&state.selectedOpt&&state.selectedOpt[state.cur]!==undefined){
    var wrongOi=state.selectedOpt[state.cur];
    var btns=optsDiv.querySelectorAll('.opt');
    order.forEach(function(oi,pos){
      if(oi===wrongOi&&oi!==q.ci){btns[pos].classList.add('wrong');}
    });
  }

  // explanation
  var expl=document.getElementById('explDiv');
  if(answered===false){
    expl.style.display='block';
    expl.innerHTML='<strong>Explanation:</strong> The correct answer is <em>'+q.opts[q.ci]+'</em>. "'+q.w+'" means: '+q.opts[q.ci]+'.';
  } else {
    expl.style.display='none';
  }

  // prev/next
  document.getElementById('prevBtn').disabled=(state.cur===0);
  var nextBtn=document.getElementById('nextBtn');
  var isLast=(state.cur===qs.length-1);
  nextBtn.textContent=isLast?'See Results \u2192':'Next \u2192';
}

function selectOpt(optIdx){
  var qs=getQuestions();
  var qi=retryMode?state.cur:currentOrder[state.cur];
  var q=qs[qi];
  if(state.answers[state.cur]!==undefined)return;
  var correct=(optIdx===q.ci);
  state.answers[state.cur]=correct;
  if(!state.selectedOpt)state.selectedOpt={};
  state.selectedOpt[state.cur]=optIdx;
  saveState();
  render();
}

window.speakWord=function(){
  var qs=getQuestions();
  var qi=retryMode?state.cur:currentOrder[state.cur];
  var word=qs[qi].w;
  if(!window.speechSynthesis)return;
  var u=new SpeechSynthesisUtterance(word);
  u.lang='en-US';
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
};

window.goNext=function(){
  var qs=getQuestions();
  if(state.cur===qs.length-1){
    goResults();
  } else {
    state.cur++;
    saveState();
    render();
  }
};

window.goPrev=function(){
  if(state.cur>0){
    state.cur--;
    saveState();
    render();
  }
};

window.goResults=function(){
  if(!retryMode){
    incAtt();
  }
  updateAttDisplay();
  state.showResults=true;
  saveState();
  showResults();
};

function showResults(){
  var qs=getQuestions();
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateDots();
  var grid=document.getElementById('summaryGrid');
  grid.innerHTML='';
  for(var pos=0;pos<qs.length;pos++){
    var ans=state.answers[pos];
    var card=document.createElement('div');
    card.className='scard '+(ans===true?'correct':ans===false?'wrong':'skipped');
    card.innerHTML='<div class="sc-num">Q'+(pos+1)+'</div><div>'+(ans===true?'Correct':ans===false?'Wrong':'Skipped')+'</div>';
    card.onclick=(function(idx){return function(){
      state.cur=idx;state.showResults=false;saveState();render();
    };})(pos);
    grid.appendChild(card);
  }
}

window.retryWrong=function(){
  var qs=getQuestions();
  var wrong=[];
  for(var pos=0;pos<qs.length;pos++){
    var qi=retryMode?pos:currentOrder[pos];
    if(state.answers[pos]===false)wrong.push(qs[qi]);
  }
  if(wrong.length===0){return;}
  retryMode=true;
  retryList=wrong;
  state={cur:0,answers:{},shuffles:{},showResults:false};
  saveState();
  buildDots();
  render();
};

window.copyResults=function(){
  var qs=getQuestions();
  var lines=['[Grant] Naver Dictionary — Results'];
  for(var pos=0;pos<qs.length;pos++){
    var qi=retryMode?pos:currentOrder[pos];
    var q=qs[qi];
    var ans=state.answers[pos];
    var status=ans===true?'Correct':ans===false?'Wrong':'Skipped';
    lines.push('Q'+(pos+1)+' ('+q.w+'): '+status);
  }
  var correct=Object.values(state.answers).filter(function(v){return v===true;}).length;
  lines.push('');
  lines.push('Score: '+correct+' / '+qs.length);
  navigator.clipboard&&navigator.clipboard.writeText(lines.join('\n'));
};

window.askFresh=function(mode){
  pendingFreshMode=mode;
  var t=document.getElementById('modalTitle');
  if(t)t.textContent=mode==='random'?'Start Fresh (Random Order)?':'Start Fresh (Original Order)?';
  document.getElementById('modalMsg').textContent=mode==='random'?'Questions will be reshuffled into a new random order, and all progress will be reset.':'Questions will return to their original order, and all progress will be reset.';
  modalCb=function(){
    retryMode=false;retryList=[];
    currentOrder=(pendingFreshMode==='random')?randomOrder():identityOrder();
    saveOrder(currentOrder);
    try{localStorage.removeItem(SK);}catch(e){}
    state={cur:0,answers:{},shuffles:{},showResults:false};
    saveState();
    buildDots();
    render();
  };
  document.getElementById('modalOverlay').style.display='flex';
};

window.closeModal=function(){
  document.getElementById('modalOverlay').style.display='none';
  modalCb=null;
};
window.confirmModal=function(){
  document.getElementById('modalOverlay').style.display='none';
  if(modalCb)modalCb();
  modalCb=null;
};

window.jumpTo=jumpTo;

init();
})();
</script>
</body>
</html>
