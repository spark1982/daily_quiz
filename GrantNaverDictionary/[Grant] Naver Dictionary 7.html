<style>

body { margin:0; background:#f4f6fa; color:#111;

.header { text-align:center; padding:8px 12px 0; }

<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->

 that something is true"], "answer": 0}, {"word": "convinced", "options": ["completely certain that something is true", "unwilling to wait and easily annoyed by delay", "an area of land that is under the control of a ruler or government", "stated clearly and in full detail, leaving no room for doubt"], "answer": 0}, {"word": "throughout", "options": ["in or to every part of something, or during the whole of a period", "the art and practice of designing and constructing buildings", "an organized journey made for a particular purpose, such as exploration", "stated clearly and in full detail, leaving no room for doubt"], "answer": 0}];
var STATE_KEY = "quiz_english_vocab_53_v1";
var ATTEMPTS_KEY = "quiz_english_vocab_53_attempts_v1";
var TOTAL = QUESTIONS.length;

var ORDER_KEY = STATE_KEY + '_order_v1';
function identityOrder(){ var a=[]; for(var i=0;i<TOTAL;i++){a.push(i);} return a; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==TOTAL) return false;
  var seen={};
  for(var i=0;i<arr.length;i++){
    if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=TOTAL || seen[arr[i]]) return false;
    seen[arr[i]]=true;
  }
  return true;
}
function loadOrder(){
  try{
    var raw=localStorage.getItem(ORDER_KEY);
    if(raw){ var arr=JSON.parse(raw); if(isValidOrder(arr)) return arr; }
  }catch(e){}
  return null;
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function randomOrder(){
  var arr=identityOrder();
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
var currentOrder = loadOrder() || identityOrder();
saveOrder(currentOrder);
var pendingFreshMode = 'original';

var MODE = 'main';
var main = { cur:0, answers:{}, shuffles:{}, showResults:false };
var retry = { list:[], cur:0, answers:{}, shuffles:{}, showResults:false };
var attemptsCount = 0;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function activeSession(){ return MODE==='main' ? main : retry; }
function activeList(){ if(MODE==='main'){ return currentOrder; } return retry.list; }
function activeLen(){ return activeList().length; }
function questionAt(pos){ return QUESTIONS[ activeList()[pos] ]; }

function save(){ try{ localStorage.setItem(STATE_KEY, JSON.stringify(main)); }catch(e){} }

function loadState(){
  try{
    var raw = localStorage.getItem(STATE_KEY);
    if(!raw){ return; }
    var o = JSON.parse(raw);
    if(!o || typeof o!=='object'){ throw 0; }
    if(typeof o.cur!=='number' || o.cur<0 || o.cur>=TOTAL){ throw 0; }
    if(typeof o.answers!=='object' || o.answers===null){ throw 0; }
    if(typeof o.shuffles!=='object' || o.shuffles===null){ throw 0; }
    if(typeof o.showResults!=='boolean'){ throw 0; }
    main = { cur:o.cur, answers:o.answers, shuffles:o.shuffles, showResults:o.showResults };
  }catch(e){
    try{ localStorage.removeItem(STATE_KEY); }catch(e2){}
    main = { cur:0, answers:{}, shuffles:{}, showResults:false };
  }
}

function readAttempts(){ try{ var v=parseInt(localStorage.getItem(ATTEMPTS_KEY),10); return isNaN(v)?0:v; }catch(e){ return 0; } }
function updateAttempts(){ var el=document.getElementById('attempts'); if(el){ el.textContent='Total Attempts: '+attemptsCount; } }
function incrementAttempts(){ attemptsCount++; try{ localStorage.setItem(ATTEMPTS_KEY, String(attemptsCount)); }catch(e){} updateAttempts(); }

function getShuffle(pos){
  var sess=activeSession();
  var sh=sess.shuffles[pos];
  if(!Array.isArray(sh) || sh.length!==4){
    sh=[0,1,2,3];
    for(var i=sh.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=sh[i]; sh[i]=sh[j]; sh[j]=t; }
    sess.shuffles[pos]=sh;
    if(MODE==='main'){ save(); }
  }
  return sh;
}

function speak(w){
  try{
    if(!('speechSynthesis' in window)){ return; }
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(w).replace(/\//g,' '));
    u.lang='en-US'; u.rate=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function render(){
  try{
    var quizArea=document.getElementById('quizArea');
    var resultsScreen=document.getElementById('resultsScreen');
    var sess=activeSession();
    if(sess.showResults){
      quizArea.style.display='none';
      resultsScreen.classList.add('show');
      resultsScreen.style.display='block';
      renderResults();
    } else {
      resultsScreen.classList.remove('show');
      resultsScreen.style.display='none';
      quizArea.style.display='block';
      renderQuestion();
    }
    renderDotNav();
    updateNavBar();
  }catch(e){
    var fb=document.getElementById('fallback');
    if(fb){ fb.style.display='block'; }
  }
}

function renderQuestion(){
  var sess=activeSession();
  var pos=sess.cur;
  var q=questionAt(pos);
  document.getElementById('counter').textContent=(pos+1)+' / '+activeLen();
  var wordEl=document.getElementById('word');
  wordEl.innerHTML='<span>'+esc(q.word)+'</span>';
  var spk=document.createElement('button');
  spk.className='spk'; spk.setAttribute('aria-label','Listen');
  spk.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path></svg>';
  spk.onclick=function(){ speak(q.word); };
  wordEl.appendChild(spk);

  var sh=getShuffle(pos);
  var answered = (sess.answers[pos]!==undefined);
  var selected = sess.answers[pos];
  var optsEl=document.getElementById('options');
  optsEl.innerHTML='';
  for(var d=0; d<sh.length; d++){
    var oi=sh[d];
    var btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=q.options[oi];
    if(answered){
      btn.disabled=true;
      if(oi===q.answer){ btn.className='opt correct'; }
      else if(oi===selected){ btn.className='opt wrong'; }
    } else {
      (function(dd){ btn.onclick=function(){ selectOption(dd); }; })(d);
    }
    optsEl.appendChild(btn);
  }

  var ex=document.getElementById('explain');
  if(answered && selected!==q.answer){
    ex.style.display='block';
    ex.innerHTML='<strong>'+esc(q.word)+'</strong> means: '+esc(q.options[q.answer]);
  } else {
    ex.style.display='none';
    ex.innerHTML='';
  }

  var prev=document.getElementById('prevBtn');
  var next=document.getElementById('nextBtn');
  prev.disabled=(pos===0);
  next.textContent = (pos===activeLen()-1) ? 'See Results \u2192' : 'Next';
}

function selectOption(d){
  var sess=activeSession();
  var pos=sess.cur;
  if(sess.answers[pos]!==undefined){ return; }
  var sh=getShuffle(pos);
  sess.answers[pos]=sh[d];
  if(MODE==='main'){ save(); }
  render();
}

function nextQuestion(){
  var sess=activeSession();
  if(sess.cur < activeLen()-1){ sess.cur++; if(MODE==='main'){ save(); } render(); }
  else { goToResults(); }
}
function prevQuestion(){
  var sess=activeSession();
  if(sess.cur>0){ sess.cur--; if(MODE==='main'){ save(); } render(); }
}
function goToQuestion(pos){
  var sess=activeSession();
  sess.cur=pos; sess.showResults=false;
  if(MODE==='main'){ save(); }
  render();
}
function goToResults(){
  var sess=activeSession();
  if(!sess.showResults){
    if(MODE==='main'){ incrementAttempts(); }
    sess.showResults=true;
    if(MODE==='main'){ save(); }
  }
  render();
}

function updateNavBar(){
  var sess=activeSession();
  var list=activeList();
  var ans=0;
  for(var pos=0; pos<list.length; pos++){ if(sess.answers[pos]!==undefined){ ans++; } }
  document.getElementById('nav-count').textContent=ans+' / '+list.length;
  document.getElementById('prog-fill').style.width=(ans/list.length*100).toFixed(1)+'%';
}

function toggleJump(){
  var p=document.getElementById('dotNav');
  var b=document.getElementById('jump-btn');
  if(p.style.display==='flex'){ p.style.display='none'; b.innerHTML='Jump &#9662;'; }
  else{ p.style.display='flex'; b.innerHTML='Hide &#9652;'; }
}

function renderDotNav(){
  var sess=activeSession();
  var list=activeList();
  var nav=document.getElementById('dotNav');
  nav.innerHTML='';
  for(var pos=0; pos<list.length; pos++){
    var dot=document.createElement('button');
    dot.className='dot';
    dot.textContent=(pos+1);
    var ans=sess.answers[pos];
    if(ans!==undefined){
      var q=QUESTIONS[list[pos]];
      dot.className += (ans===q.answer) ? ' correct' : ' wrong';
    }
    if(!sess.showResults && pos===sess.cur){ dot.className += ' current'; }
    (function(p){ dot.onclick=function(){ goToQuestion(p); }; })(pos);
    nav.appendChild(dot);
  }
  var pill=document.createElement('button');
  pill.className='pill'+(sess.showResults?' active':'');
  pill.textContent='Results';
  pill.onclick=function(){ goToResults(); };
  nav.appendChild(pill);
}

function computeBuckets(){
  var sess=activeSession();
  var list=activeList();
  var correct=[], wrong=[], skipped=[];
  for(var pos=0; pos<list.length; pos++){
    var ans=sess.answers[pos];
    var q=QUESTIONS[list[pos]];
    if(ans===undefined){ skipped.push(pos); }
    else if(ans===q.answer){ correct.push(pos); }
    else { wrong.push(pos); }
  }
  return {correct:correct, wrong:wrong, skipped:skipped};
}

function renderResults(){
  var sess=activeSession();
  var list=activeList();
  var b=computeBuckets();
  var rs=document.getElementById('resultsScreen');
  var title = (MODE==='retry') ? 'Retry Results' : 'Results';
  var html='';
  html += '<h2 class="resTitle">'+title+'</h2>';
  html += '<div class="score">You got '+b.correct.length+' out of '+list.length+' correct.</div>';
  html += '<div class="grid" id="grid"></div>';
  var review = b.wrong.concat(b.skipped);
  if(review.length){ html += '<div class="reviewBox" id="reviewBox"></div>'; }
  html += '<div class="resBtns" id="resBtns"></div>';
  rs.innerHTML=html;

  var grid=document.getElementById('grid');
  for(var pos=0; pos<list.length; pos++){
    var ans=sess.answers[pos];
    var q=QUESTIONS[list[pos]];
    var st, cls;
    if(ans===undefined){ st='Skipped'; cls='skipped'; }
    else if(ans===q.answer){ st='Correct'; cls='correct'; }
    else { st='Wrong'; cls='wrong'; }
    var card=document.createElement('button');
    card.className='gcard '+cls;
    card.innerHTML='<div class="gnum">'+(pos+1)+'</div><div class="gst">'+st+'</div>';
    (function(p){ card.onclick=function(){ jumpToFromResults(p); }; })(pos);
    grid.appendChild(card);
  }

  if(review.length){
    var rb=document.getElementById('reviewBox');
    review.sort(function(a,bb){ return a-bb; });
    for(var i=0;i<review.length;i++){
      var pos2=review[i];
      var q2=QUESTIONS[list[pos2]];
      var item=document.createElement('div');
      item.className='rev';
      var head=document.createElement('div');
      head.className='revHead';
      head.innerHTML='<span class="revQ">Q'+(pos2+1)+'</span><span class="revWord">'+esc(q2.word)+'</span>';
      var mean=document.createElement('div');
      mean.className='revMean';
      mean.textContent=q2.options[q2.answer];
      var cp=document.createElement('button');
      cp.className='miniCopy';
      cp.textContent='Copy';
      (function(qq, button){ button.onclick=function(){ copyText(qq.word+' - '+qq.options[qq.answer], button); }; })(q2, cp);
      item.appendChild(head);
      item.appendChild(mean);
      item.appendChild(cp);
      rb.appendChild(item);
    }
  }

  var rbtns=document.getElementById('resBtns');
  var copyAll=document.createElement('button');
  copyAll.className='bigBtn copyBtn';
  copyAll.textContent='Copy All Results';
  copyAll.onclick=function(){ copyText(buildSummary(), copyAll); };
  rbtns.appendChild(copyAll);

  if(b.wrong.length+b.skipped.length>0){
    var retryBtn=document.createElement('button');
    retryBtn.className='bigBtn retryBtn';
    retryBtn.textContent='Retry Wrong Questions';
    retryBtn.onclick=function(){ startRetry(); };
    rbtns.appendChild(retryBtn);
  }

  if(MODE==='retry'){
    var backBtn=document.createElement('button');
    backBtn.className='bigBtn backBtn';
    backBtn.textContent='Back to Full Results';
    backBtn.onclick=function(){ backToFull(); };
    rbtns.appendChild(backBtn);
  } else {
    var freshBtn=document.createElement('button');
    freshBtn.className='bigBtn freshBtn';
    freshBtn.id='fresh-btn';
    freshBtn.textContent='Start Fresh (Original Order)';
    freshBtn.onclick=function(){ openModal('original'); };
    rbtns.appendChild(freshBtn);

    var freshRandomBtn=document.createElement('button');
    freshRandomBtn.className='bigBtn freshBtn';
    freshRandomBtn.id='fresh-btn-random';
    freshRandomBtn.textContent='Start Fresh (Random Order)';
    freshRandomBtn.onclick=function(){ openModal('random'); };
    rbtns.appendChild(freshRandomBtn);
  }
}

function buildSummary(){
  var sess=activeSession();
  var list=activeList();
  var b=computeBuckets();
  var lines=[];
  lines.push(MODE==='retry'?'Retry Results':'Results');
  lines.push('Score: '+b.correct.length+' / '+list.length);
  lines.push('');
  for(var pos=0; pos<list.length; pos++){
    var ans=sess.answers[pos];
    var q=QUESTIONS[list[pos]];
    var st;
    if(ans===undefined){ st='SKIPPED'; }
    else if(ans===q.answer){ st='CORRECT'; }
    else { st='WRONG'; }
    var line='Q'+(pos+1)+'. '+q.word+' - '+st;
    if(st!=='CORRECT'){ line += ' | Answer: '+q.options[q.answer]; }
    lines.push(line);
  }
  return lines.join('\n');
}

function jumpToFromResults(pos){
  var sess=activeSession();
  sess.showResults=false; sess.cur=pos;
  if(MODE==='main'){ save(); }
  render();
}
function startRetry(){
  var sess=activeSession();
  var list=activeList();
  var notCorrect=[];
  for(var pos=0; pos<list.length; pos++){
    var ans=sess.answers[pos];
    var q=QUESTIONS[list[pos]];
    if(ans===undefined || ans!==q.answer){ notCorrect.push(list[pos]); }
  }
  if(notCorrect.length===0){ return; }
  MODE='retry';
  retry={ list:notCorrect, cur:0, answers:{}, shuffles:{}, showResults:false };
  render();
}
function backToFull(){ MODE='main'; render(); }

function openModal(mode){
  pendingFreshMode = mode;
  var t=document.getElementById('modalTitle');
  var x=document.getElementById('modalText');
  if(t){ t.textContent = mode==='random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?'; }
  if(x){ x.textContent = mode==='random' ? 'Questions will be reshuffled into a new random order, and all progress will be reset.' : 'Questions will return to their original order, and all progress will be reset.'; }
  var m=document.getElementById('modal'); if(m){ m.style.display='flex'; }
}
function closeModal(){ var m=document.getElementById('modal'); if(m){ m.style.display='none'; } }
function confirmFresh(){
  try{ localStorage.removeItem(STATE_KEY); }catch(e){}
  currentOrder = (pendingFreshMode==='random') ? randomOrder() : identityOrder();
  saveOrder(currentOrder);
  main={ cur:0, answers:{}, shuffles:{}, showResults:false };
  MODE='main';
  closeModal();
  render();
}

function copyText(txt, btn){
  function done(ok){ if(btn){ var o=btn.textContent; btn.textContent= ok?'Copied':'Copy failed'; setTimeout(function(){ btn.textContent=o; },1200); } }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ fallbackCopy(txt, done); });
      return;
    }
  }catch(e){}
  fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){
  try{
    var ta=document.createElement('textarea');
    ta.value=txt;
    ta.style.position='fixed'; ta.style.top='0'; ta.style.left='0'; ta.style.opacity='0';
    ta.contentEditable=true; ta.readOnly=false;
    document.body.appendChild(ta);
    var range=document.createRange(); range.selectNodeContents(ta);
    var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    ta.setSelectionRange(0, txt.length);
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    if(done){ done(ok); }
  }catch(e){ if(done){ done(false); } }
}

document.getElementById('prevBtn').onclick=function(){ prevQuestion(); };
document.getElementById('nextBtn').onclick=function(){ nextQuestion(); };
document.getElementById('modalCancel').onclick=function(){ closeModal(); };
document.getElementById('modalConfirm').onclick=function(){ confirmFresh(); };

loadState();
attemptsCount=readAttempts();
updateAttempts();
render();
</script>
