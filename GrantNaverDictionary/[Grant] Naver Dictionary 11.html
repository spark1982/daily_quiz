.optBtn.correct{border-color:#1D9E75;background:#e8f8f2;color:#145c45;font-weight:600}
.optBtn.wrong{border-color:#e74c3c;background:#fdecea;color:#a00}

#nextBtn{background:#1D9E75;color:#fff}

{word:'contempt',correct:'a feeling that something is worthless or inferior',options:['a feeling that something is worthless or inferior','the act of making fun of someone cruelly','willingness to accept or agree to something','a basic principle used in reasoning']},
{word:'consent',correct:'to give permission or agree to something',options:['to give permission or agree to something','to ask firmly and forcefully for something','to refuse or reject a request firmly','to spread out from a particular source']},
{word:'deny',correct:'to refuse to admit or accept something',options:['to refuse to admit or accept something','to give permission or agree to something','to ask firmly and forcefully for something','to express approval by clapping']},
{word:'logic',correct:'a system of reasoning used to reach conclusions',options:['a system of reasoning used to reach conclusions','a set of fundamental laws governing a nation','the act of using up resources','the state of being held in custody']},
{word:'applaud',correct:'to express approval by clapping the hands',options:['to express approval by clapping the hands','to refuse to admit or accept something','to give permission or agree to something','to eat something greedily and completely']},
{word:'representative',correct:'a person who acts officially on behalf of others',options:['a person who acts officially on behalf of others','a foolish or mentally unstable person','a small piece or amount of food','a set of fundamental laws or principles']},
{word:'serve',correct:'to perform duties or provide a service for others',options:['to perform duties or provide a service for others','to begin or arise from a particular source','to communicate or express a message','to spread out or come from a source']},
{word:'constitution',correct:'a set of fundamental laws governing a country',options:['a set of fundamental laws governing a country','a system of reasoning used to reach conclusions','the act of using up resources or goods','the state of being held in custody']},
{word:'developed',correct:'having reached an advanced or mature stage',options:['having reached an advanced or mature stage','poorly made and likely to break or fall','lacking in quantity or quality','relating to or coming from a god']},
{word:'develop',correct:'to grow or cause to grow more advanced',options:['to grow or cause to grow more advanced','to spread out or come from a source','to begin or arise from a particular source','to communicate or express a message']},
{word:'feature',correct:'a distinctive quality or characteristic of something',options:['a distinctive quality or characteristic of something','a set of fundamental laws governing a nation','the basic material something is made from','a system of reasoning used to reach conclusions']},
{word:'substance',correct:'the basic material or matter that something consists of',options:['the basic material or matter that something consists of','a distinctive quality or characteristic','a set of fundamental laws or principles','a system of reasoning used to reach conclusions']},
{word:'courteous',correct:'polite and considerate in behavior toward others',options:['polite and considerate in behavior toward others','having or showing great courage','having strong healthy energy and force','producing clear powerful and detailed images']},
{word:'courageous',correct:'having or showing great bravery in difficult situations',options:['having or showing great bravery in difficult situations','polite and considerate in behavior toward others','having strong healthy energy and force','producing clear powerful and detailed images']},
{word:'detention',correct:'the state of being held in custody or kept back',options:['the state of being held in custody or kept back','the act of using up resources or goods','a set of fundamental laws governing a nation','a system of reasoning used to reach conclusions']},
{word:'coldly',correct:'in an unfriendly and emotionally distant manner',options:['in an unfriendly and emotionally distant manner','in a rigid and not relaxed manner','in a way requiring immediate action','in a rough and unfriendly manner']},
{word:'chortle',correct:'to laugh in a joyful and partly suppressed way',options:['to laugh in a joyful and partly suppressed way','to make someone laugh or smile gently','to express approval by clapping hands','to eat something greedily and completely']},
{word:'divorced',correct:'legally separated from a marriage partner',options:['legally separated from a marriage partner','having reached an advanced or mature stage','poorly made and likely to break or fall','polite and considerate in behavior']},
{word:'curt',correct:'briefly and rudely abrupt in speech or manner',options:['briefly and rudely abrupt in speech or manner','having a rough and unfriendly manner or voice','using irony to mock or show contempt','in a rigid and not relaxed manner']},
{word:'iridescent',correct:'showing shifting rainbow-like colors in different lights',options:['showing shifting rainbow-like colors in different lights','shining with a bright soft light','producing clear powerful and detailed images','relating to or coming from a god']},
{word:'flee',correct:'to run away from danger or a threat quickly',options:['to run away from danger or a threat quickly','to eat something greedily and completely','to spread out or come from a source','to begin or arise from a particular source']},
{word:'humorous',correct:'causing amusement; having a sense of humor',options:['causing amusement; having a sense of humor','polite and considerate in behavior toward others','having or showing great courage','producing clear powerful and detailed images']}
];

var TOTAL=ALL.length;
var ORDER_KEY=STORAGE_KEY+'_order_v1';
function identityOrder(){var a=[];for(var i=0;i<TOTAL;i++)a.push(i);return a;}
function isValidOrder(arr){
  if(!Array.isArray(arr)||arr.length!==TOTAL)return false;
  var seen={};
  for(var i=0;i<arr.length;i++){
    if(typeof arr[i]!=="number"||arr[i]<0||arr[i]>=TOTAL||seen[arr[i]])return false;
    seen[arr[i]]=true;
  }
  return true;
}
function loadOrder(){
  try{
    var raw=localStorage.getItem(ORDER_KEY);
    if(raw){var arr=JSON.parse(raw);if(isValidOrder(arr))return arr;}
  }catch(e){}
  return null;
}
function saveOrder(order){try{localStorage.setItem(ORDER_KEY,JSON.stringify(order));}catch(e){}}
function randomOrder(){
  var arr=identityOrder();
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
var currentOrder=loadOrder()||identityOrder();
saveOrder(currentOrder);
var pendingFreshMode='original';

var state={mode:'all',indices:[],current:0,answers:{},wrongChoice:{},version:STORAGE_KEY};

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    var s=JSON.parse(raw);
    if(s.version!==STORAGE_KEY)return;
    state=s;
  }catch(e){}
}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function init(mode,indices){
  state={mode:mode||'all',indices:indices||currentOrder.slice(),current:0,answers:{},wrongChoice:{},version:STORAGE_KEY};
  saveState();
  if(typeof window.qzTimerReset==='function')window.qzTimerReset();
  render();
}

function render(){
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  renderNav();
  renderDots();
  renderQuestion();
}

function renderNav(){
  var total=state.indices.length;
  document.getElementById('qCounter').textContent='Q '+(state.current+1)+' / '+total;
  document.getElementById('progressBar').style.width=(((state.current+1)/total)*100).toFixed(1)+'%';
}

function renderDots(){
  var grid=document.getElementById('dotGrid');
  grid.innerHTML='';
  state.indices.forEach(function(qi,pos){
    var btn=document.createElement('button');
    btn.className='dot';
    btn.textContent=pos+1;
    var ans=state.answers[pos];
    if(ans===undefined)btn.classList.add('dot-unanswered');
    else if(ans===true)btn.classList.add('dot-correct');
    else btn.classList.add('dot-wrong');
    if(pos===state.current)btn.classList.add('dot-current');
    btn.onclick=(function(p){return function(){state.current=p;saveState();render();};})(pos);
    grid.appendChild(btn);
  });
}

function renderQuestion(){
  var pos=state.current;
  var qi=state.indices[pos];
  var q=ALL[qi];
  var answered=state.answers[pos]!==undefined;
  document.getElementById('qWord').textContent=q.word;
  var og=document.getElementById('optionsGrid');
  og.innerHTML='';
  var opts=shuffle(q.options);
  opts.forEach(function(opt){
    var btn=document.createElement('button');
    btn.className='optBtn';
    btn.textContent=opt;
    if(answered){
      btn.disabled=true;
      if(opt===q.correct)btn.classList.add('correct');
      else if(opt===state.wrongChoice[pos])btn.classList.add('wrong');
    } else {
      btn.onclick=(function(o){return function(){answer(o);};})(opt);
    }
    og.appendChild(btn);
  });
  var expl=document.getElementById('explanation');
  if(answered&&state.answers[pos]===false){
    expl.style.display='block';
    expl.innerHTML='<strong>Explanation:</strong> The correct meaning of <strong>'+q.word+'</strong> is "'+q.correct+'."';
  } else {
    expl.style.display='none';
  }
  var total=state.indices.length;
  var nextBtn=document.getElementById('nextBtn');
  nextBtn.textContent=pos===total-1?'Finish \u2713':'Next \u25b6';
  nextBtn.disabled=false;
  document.getElementById('prevBtn').disabled=pos===0;
}

function answer(choice){
  var pos=state.current;
  var qi=state.indices[pos];
  var q=ALL[qi];
  var correct=choice===q.correct;
  state.answers[pos]=correct;
  if(!correct)state.wrongChoice[pos]=choice;
  saveState();
  var btns=document.querySelectorAll('.optBtn');
  btns.forEach(function(btn){
    btn.disabled=true;
    if(btn.textContent===q.correct)btn.classList.add('correct');
    else if(!correct&&btn.textContent===choice)btn.classList.add('wrong');
  });
  var expl=document.getElementById('explanation');
  if(!correct){
    expl.style.display='block';
    expl.innerHTML='<strong>Explanation:</strong> The correct meaning of <strong>'+q.word+'</strong> is "'+q.correct+'."';
  }
  document.getElementById('nextBtn').textContent=(state.current===state.indices.length-1)?'Finish \u2713':'Next \u25b6';
  renderDots();
}

window.goNext=function(){
  var total=state.indices.length;
  if(state.current===total-1){goResults();}
  else{state.current++;saveState();render();}
};
window.goPrev=function(){
  if(state.current>0){state.current--;saveState();render();}
};
window.toggleDots=function(){
  var p=document.getElementById('dotPanel');
  p.style.display=p.style.display==='block'?'none':'block';
};
window.speakWord=function(){
  var word=document.getElementById('qWord').textContent;
  if('speechSynthesis' in window){
    var utt=new SpeechSynthesisUtterance(word);
    utt.lang='en-US';utt.rate=0.9;
    speechSynthesis.cancel();speechSynthesis.speak(utt);
  }
};

function goResults(){
  if(state.mode!=='retry'){
    try{localStorage.setItem(ATT_KEY,getAttempts()+1);}catch(e){}
  }
  updateAttDisplay();
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  var total=state.indices.length;
  var correct=0;
  state.indices.forEach(function(qi,pos){if(state.answers[pos]===true)correct++;});
  document.getElementById('scoreLine').textContent=correct+' / '+total;
  var pct=Math.round((correct/total)*100);
  document.getElementById('scoreMsg').textContent=pct===100?'Perfect score! Amazing work!':pct>=80?'Great job! Keep it up!':pct>=60?'Good effort! Review the wrong ones.':'Keep practicing! You\'ll get better.';
  var wrongs=[];
  state.indices.forEach(function(qi,pos){if(state.answers[pos]===false)wrongs.push(qi);});
  var wl=document.getElementById('wrongList');
  if(wrongs.length===0){wl.innerHTML='';document.getElementById('retryWrongBtn').style.display='none';}
  else{
    document.getElementById('retryWrongBtn').style.display='';
    wl.innerHTML='<h3>Incorrect Answers ('+wrongs.length+')</h3>';
    wrongs.forEach(function(qi){
      var q=ALL[qi];
      var div=document.createElement('div');
      div.className='wrongItem';
      div.innerHTML='<strong>'+q.word+'</strong>: '+q.correct;
      wl.appendChild(div);
    });
  }
}

window.retryWrong=function(){
  var wrongs=[];
  state.indices.forEach(function(qi,pos){if(state.answers[pos]===false)wrongs.push(qi);});
  if(wrongs.length===0)return;
  init('retry',shuffle(wrongs));
};
window.copyResults=function(){
  var total=state.indices.length;var correct=0;
  var lines=['[Grant] Naver Dictionary - Results'];
  state.indices.forEach(function(qi,pos){
    var q=ALL[qi];var ok=state.answers[pos]===true;
    if(ok)correct++;
    lines.push((ok?'V':'X')+' '+q.word+': '+q.correct);
  });
  lines.unshift('Score: '+correct+' / '+total);
  var txt=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){var btn=document.getElementById('copyResultsBtn');btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy All Results';},1800);});}
};
window.confirmFresh=function(mode){
  pendingFreshMode=mode;
  var t=document.getElementById('modalTitle');
  if(t)t.textContent=mode==='random'?'Start Fresh (Random Order)?':'Start Fresh (Original Order)?';
  document.getElementById('modalMsg').textContent=mode==='random'?'Questions will be reshuffled into a new random order, and all progress will be reset.':'Questions will return to their original order, and all progress will be reset.';
  document.getElementById('modalOverlay').classList.add('active');
};
window.modalConfirmCb=function(){
  closeModal();
  currentOrder=(pendingFreshMode==='random')?randomOrder():identityOrder();
  saveOrder(currentOrder);
  localStorage.removeItem(STORAGE_KEY);init('all',null);
};
window.closeModal=function(){document.getElementById('modalOverlay').classList.remove('active');};

loadState();
updateAttDisplay();
if(!state.indices||state.indices.length===0){init('all',null);}
else{render();}
})();
</script>

<script>
(function(){
  var QZ_KEY='qzTimer_grant_naver_dict';
  var qz={totalSec:null,startedAt:null,pausedRemaining:null};
  var qzInterval=null;

  function qzLoad(){
    try{var r=localStorage.getItem(QZ_KEY);if(r){var p=JSON.parse(r);if(p&&typeof p.totalSec==='number')qz=p;}}catch(e){}
  }
  function qzSave(){try{localStorage.setItem(QZ_KEY,JSON.stringify(qz));}catch(e){}}
  function qzClear(){try{localStorage.removeItem(QZ_KEY);}catch(e){}}
  function qzFormat(sec){
    sec=Math.max(0,Math.round(sec));
    var m=Math.floor(sec/60),s=sec%60;
    return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function isPaused(){return qz.pausedRemaining!==null;}
  function getRemaining(){
    if(isPaused())return qz.pausedRemaining;
    if(!qz.startedAt)return null;
    return qz.totalSec-(Date.now()-qz.startedAt)/1000;
  }
  function qzRender(){
    var setupEl=document.getElementById('qzTimerSetup');
    var runEl=document.getElementById('qzTimerRunning');
    var disp=document.getElementById('qzTimerDisplay');
    var pauseBtn=document.getElementById('qzTimerPauseBtn');
    if(!setupEl||!runEl||!disp)return;
    if(!qz.startedAt&&qz.pausedRemaining===null){setupEl.style.display='flex';runEl.style.display='none';return;}
    setupEl.style.display='none';runEl.style.display='flex';
    var remaining=getRemaining();
    disp.classList.remove('qz-warn','qz-danger');
    if(remaining<=0){disp.textContent="Time's Up";disp.classList.add('qz-danger');qzStopInterval();return;}
    disp.textContent=qzFormat(remaining);
    if(remaining<=qz.totalSec*0.1)disp.classList.add('qz-danger');
    else if(remaining<=qz.totalSec*0.25)disp.classList.add('qz-warn');
    if(pauseBtn)pauseBtn.textContent=isPaused()?'Resume':'Pause';
  }
  function qzStopInterval(){if(qzInterval){clearInterval(qzInterval);qzInterval=null;}}
  function qzStartInterval(){qzStopInterval();qzInterval=setInterval(qzRender,1000);}

  function qzStart(){
    var input=document.getElementById('qzTimerInput');
    var minutes=parseFloat(input.value);
    if(!minutes||minutes<=0)minutes=20;
    qz={totalSec:Math.round(minutes*60),startedAt:Date.now(),pausedRemaining:null};
    qzSave();qzRender();qzStartInterval();
  }

  function qzPauseResume(){
    if(!qz.startedAt&&qz.pausedRemaining===null)return;
    if(isPaused()){
      // Resume: recalculate startedAt from remaining
      qz.startedAt=Date.now()-((qz.totalSec-qz.pausedRemaining)*1000);
      qz.pausedRemaining=null;
      qzSave();qzRender();qzStartInterval();
    } else {
      // Pause: capture remaining
      var rem=getRemaining();
      if(rem<=0)return;
      qzStopInterval();
      qz.pausedRemaining=rem;
      qz.startedAt=null;
      qzSave();qzRender();
    }
  }

  window.qzTimerReset=function(){
    qzStopInterval();qz={totalSec:null,startedAt:null,pausedRemaining:null};qzClear();
    var setupEl=document.getElementById('qzTimerSetup');
    var runEl=document.getElementById('qzTimerRunning');
    if(setupEl)setupEl.style.display='flex';
    if(runEl)runEl.style.display='none';
  };

  document.getElementById('qzTimerStartBtn').addEventListener('click',qzStart);
  document.getElementById('qzTimerPauseBtn').addEventListener('click',qzPauseResume);
  document.getElementById('qzTimerResetBtn').addEventListener('click',window.qzTimerReset);

  qzLoad();qzRender();
  if(qz.startedAt&&!isPaused())qzStartInterval();
})();
</script>
</body>
