*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh;}

/* NAV */
#nav-bar{display:flex;align-items:center;gap:8px;padding:10px 16px 6px 16px;background:#fff;border-bottom:2px solid #185FA5;position:sticky;top:0;z-index:100;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;min-width:52px;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}

/* INSTRUCTION */
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}

/* CARD */
#quiz-area{padding:16px 16px 100px 16px;max-width:640px;margin:0 auto;}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:24px 20px;}
.q-num{font-size:13px;color:#aaa;margin-bottom:8px;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.word-text{font-size:30px;font-weight:700;color:#1a1a2e;}
.spk-btn{background:none;border:2px solid #185FA5;border-radius:50%;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#185FA5;font-size:16px;flex-shrink:0;}
.spk-btn:hover{background:#e8f0fb;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{background:#f7f9fc;border:2px solid #d7dde6;border-radius:10px;padding:13px 16px;font-size:15px;color:#222;cursor:pointer;text-align:left;transition:all 0.15s;}
.opt:hover:not(:disabled){border-color:#185FA5;background:#edf3fc;}
.opt:disabled{cursor:default;}
.opt.correct{border-color:#1D9E75;background:#e8f7f2;color:#1D9E75;font-weight:600;}
.opt.wrong{border-color:#E24B4A;background:#fdecea;color:#E24B4A;font-weight:600;}
.opt.reveal{border-color:#1D9E75;background:#e8f7f2;color:#1D9E75;}
.exp{display:none;margin-top:14px;background:#fff8e1;border-left:4px solid #f5a623;border-radius:6px;padding:12px 14px;font-size:14px;color:#555;line-height:1.6;}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;z-index:100;}
.nav-btn{background:#185FA5;color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;}
.nav-btn:disabled{background:#b0bec5;cursor:default;}
.nav-btn:hover:not(:disabled){background:#1450a3;}
#q-counter{font-size:14px;color:#888;}

/* RESULTS */
#results-screen{display:none;max-width:640px;margin:0 auto;padding:32px 16px;}
.res-card{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:32px 24px;text-align:center;}
.res-card h2{font-size:22px;color:#185FA5;margin-bottom:8px;}
.score-big{font-size:54px;font-weight:800;color:#1a1a2e;}
.score-sub{font-size:15px;color:#888;margin-bottom:24px;}
.res-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;}
.btn-retry-wrong{background:#1D9E75;color:#fff;}
.btn-fresh{background:#888;color:#fff;}
.wrong-review{margin-top:24px;text-align:left;}
.wrong-review h3{font-size:15px;color:#E24B4A;margin-bottom:10px;}
.wrong-item{background:#fdecea;border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:14px;}
.wrong-item strong{color:#1a1a2e;}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center;}
#modal-box{background:#fff;border-radius:14px;padding:28px 24px;max-width:320px;width:90%;text-align:center;}

<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->

<style>
  #qzAttemptsBar { background: #f5f8fc; border-bottom: 1px solid #d0dce8; padding: 6px 12px; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.82rem; color: #4a6fa5; font-weight: 700; letter-spacing: 0.01em; }

</style>
<div id="qzAttemptsBar">Total Attempts:<span id="qzAttemptsCount">0</span></div>
<script>
(function(){
  var QA_KEY = 'qzAttempts_' + location.pathname;
  function qaGet(){ try { return parseInt(localStorage.getItem(QA_KEY)||'0',10) || 0; } catch(e){ return 0; } }
  function qaSet(n){ try { localStorage.setItem(QA_KEY, String(n)); } catch(e){} }
  function qaRenderCount(){
    var el = document.getElementById('qzAttemptsCount');
    if (el) el.textContent = qaGet();
  }
  function qaIsVisible(el){
    if (!el) return false;
    var r = el.getBoundingClientRect();
    if (r.width < 80 || r.height < 30) return false;
    var cs = window.getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden';
  }
  function qaResultsShowing(){
    var els = document.querySelectorAll('[id*="result" i],[class*="result" i],[id*="score" i],[class*="score" i]');
    for (var i=0;i<els.length;i++){ if (qaIsVisible(els[i])) return true; }
    return false;
  }
  var qaWasShowing = false;
  function qaCheck(){
    var showing = qaResultsShowing();
    if (showing && !qaWasShowing) {
      qaSet(qaGet()+1);
      qaRenderCount();
    }
    qaWasShowing = showing;
  }
  qaRenderCount();
  setInterval(qaCheck, 800);
  function qaObserve(){
    if (!document.body) return;
    var mo = new MutationObserver(function(){ qaCheck(); });
    mo.observe(document.body, { attributes: true, childList: true, subtree: true });
  }
  if (document.body) qaObserve();
  else document.addEventListener('DOMContentLoaded', qaObserve);
  setTimeout(qaCheck, 1500);
})();
</script>
<!-- ===== End Universal Total Attempts Counter ===== -->

  {w:'conceal',   ci:0, opts:['to hide something from view','to reveal something openly','to admire something carefully','to encounter someone suddenly'], exp:'<b>conceal</b> means to keep something hidden or secret from others.'},
  {w:'tremendous',ci:3, opts:['barely noticeable to anyone','gradually shrinking in size','stale and slowly fading away','very large or great in amount'], exp:'<b>tremendous</b> means very large, great, or powerful in amount or extent.'},
  {w:'stout',     ci:2, opts:['thin and very fragile','shattered and completely broken','solidly built or thick and strong','tattered and visibly weakened'], exp:'<b>stout</b> means solidly and heavily built, or thick and strong in structure.'},
  {w:'elated',    ci:1, opts:['feeling deeply ashamed','extremely happy and excited','agitated and very upset','contentedly and quietly pleased'], exp:'<b>elated</b> means feeling very happy, proud, and overjoyed about something.'},
  {w:'coastal',   ci:0, opts:['relating to land near the sea','located deep and far inland','vast and very mountainous','stale and completely landlocked'], exp:'<b>coastal</b> means relating to or situated on the coast, near the sea.'},
  {w:'stale',     ci:3, opts:['brand new and very exciting','tremendously vast in size','warm and very soothing','no longer fresh or interesting'], exp:'<b>stale</b> means no longer fresh, or lacking originality and interest.'},
  {w:'possess',   ci:2, opts:['to conceal something from others','to dispute something with someone','to have or own something','to encounter someone by chance'], exp:'<b>possess</b> means to have or own something as one\'s own.'},
  {w:'soothe',    ci:1, opts:['to agitate and disturb someone','to calm or relieve discomfort','to humiliate someone publicly','to impair or weaken something'], exp:'<b>soothe</b> means to gently calm someone or relieve pain and discomfort.'}
];

var N = QS.length;

var ORDER_KEY = QUIZ_KEY + '_order_v1';
function identityOrder(){ var a=[]; for(var i=0;i<N;i++) a.push(i); return a; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==N) return false;
  var seen={};
  for(var i=0;i<arr.length;i++){
    if(typeof arr[i]!=="number" || arr[i]<0 || arr[i]>=N || seen[arr[i]]) return false;
    seen[arr[i]]=true;
  }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(raw){ var arr = JSON.parse(raw); if(isValidOrder(arr)) return arr; }
  }catch(e){}
  return null;
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function randomOrder(){
  var arr = identityOrder();
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
var currentOrder = loadOrder() || identityOrder();
saveOrder(currentOrder);
var pendingFreshMode = 'original';

var state = {cur:0, answers:{}, showResults:false, retryMode:false, retryList:[]};

function getList(){
  if(state.retryMode) return state.retryList;
  return currentOrder;
}

function saveState(){
  try{localStorage.setItem(QUIZ_KEY,JSON.stringify({cur:state.cur,answers:state.answers,showResults:state.showResults,retryMode:state.retryMode,retryList:state.retryList}));}catch(e){}
}
function loadState(){
  try{
    var d=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');
    if(d&&d.answers){
      state.cur=d.cur||0;
      state.answers=d.answers;
      state.showResults=!!d.showResults;
      state.retryMode=!!d.retryMode;
      state.retryList=Array.isArray(d.retryList)?d.retryList:[];
      var bound = state.retryMode ? state.retryList.length : N;
      if(state.cur<0 || state.cur>=Math.max(bound,1)){state.cur=0;}
      if(state.retryMode && state.retryList.length===0){state.retryMode=false;state.cur=0;}
    }
  }catch(e){}
}

// Seeded shuffle per question index - stable across re-renders
function getShuffled(qi){
  var q=QS[qi];
  var arr=q.opts.slice();
  var seed=qi*1664525+1013904223;
  function rand(){seed=((seed*1664525)+1013904223)&0x7fffffff;return seed/0x7fffffff;}
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(rand()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  return arr;
}
function getShuffledCI(qi){
  var q=QS[qi];
  var correct=q.opts[q.ci];
  var shuffled=getShuffled(qi);
  return shuffled.indexOf(correct);
}

function answeredCount(){
  var list=getList();
  var cnt=0;
  for(var i=0;i<list.length;i++){ if(state.answers[list[i]]!==undefined) cnt++; }
  return cnt;
}

function render(){
  if(state.showResults){showResults();return;}
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('bottom-nav').style.display='flex';
  document.getElementById('results-screen').style.display='none';
  document.getElementById('nav-bar').style.display='flex';
  document.getElementById('quiz-header').style.display='block';
  document.getElementById('dot-panel');

  var list=getList();
  var pos=state.cur;
  var qi=list[pos];
  var q=QS[qi];
  document.getElementById('q-num').textContent='Question '+(pos+1)+' of '+list.length;
  document.getElementById('word-disp').textContent=q.w;
  document.getElementById('q-counter').textContent=(pos+1)+' / '+list.length;

  var shuffled=getShuffled(qi);
  var sci=getShuffledCI(qi);
  var answered=(state.answers[qi]!==undefined);
  var pickedIdx=state.answers[qi];

  var container=document.getElementById('opts-container');
  container.innerHTML='';
  shuffled.forEach(function(txt,idx){
    var btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=txt;
    if(answered){
      btn.disabled=true;
      if(idx===sci) btn.classList.add('reveal');
      if(idx===pickedIdx){
        btn.classList.remove('reveal');
        btn.classList.add(pickedIdx===sci?'correct':'wrong');
      }
    } else {
      (function(i){btn.onclick=function(){pick(qi,i);};})(idx);
    }
    container.appendChild(btn);
  });

  var expBox=document.getElementById('exp-box');
  if(answered && pickedIdx!==sci){
    expBox.style.display='block';
    expBox.innerHTML=q.exp;
  } else {
    expBox.style.display='none';
  }

  document.getElementById('prev-btn').disabled=(pos===0);
  var nextBtn=document.getElementById('next-btn');
  if(pos===list.length-1){nextBtn.textContent='See Results';}
  else{nextBtn.textContent='Next \u2192';}
  nextBtn.disabled=false;

  updateNav();
}

function pick(qi,idx){
  state.answers[qi]=idx;
  saveState();
  render();
}

function updateNav(){
  var list=getList();
  var cnt=answeredCount();
  document.getElementById('nav-count').textContent=cnt+' / '+list.length;
  document.getElementById('prog-fill').style.width=(cnt/list.length*100).toFixed(1)+'%';
  var pill=document.getElementById('results-pill');
  if(pill) pill.style.display=(cnt===list.length)?'block':'none';
  if(document.getElementById('dot-panel').style.display!=='none') renderDots();
}

function renderDots(){
  var list=getList();
  var panel=document.getElementById('dot-panel');
  var html='';
  for(var i=0;i<list.length;i++){
    var qIdx=list[i];
    var bg='#d7dde6';
    if(state.answers[qIdx]!==undefined){
      bg=(state.answers[qIdx]===getShuffledCI(qIdx))?'#185FA5':'#E24B4A';
    }
    html+='<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
  }
  html+='<div style="margin-top:6px;text-align:center;"><button id="results-pill" onclick="goResults()" style="display:none;background:#185FA5;color:#fff;border:none;border-radius:20px;padding:5px 18px;font-size:13px;cursor:pointer;">See Results</button></div>';
  panel.innerHTML=html;
  var pill=document.getElementById('results-pill');
  if(pill) pill.style.display=(answeredCount()===list.length)?'block':'none';
}

window.toggleJump=function(){
  var panel=document.getElementById('dot-panel');
  var btn=document.getElementById('jump-btn');
  if(panel.style.display==='none'){panel.style.display='block';btn.textContent='Hide \u25b4';renderDots();}
  else{panel.style.display='none';btn.textContent='Jump \u25be';}
};

window.goToQ=function(i){
  state.cur=i;
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump \u25be';
  render();window.scrollTo(0,0);
};

window.go=function(dir){
  var list=getList();
  if(dir===-1&&state.cur>0){state.cur--;render();window.scrollTo(0,0);}
  else if(dir===1){
    if(state.cur===list.length-1){window.goResults();}
    else{state.cur++;render();window.scrollTo(0,0);}
  }
};

window.goResults=function(){
  state.showResults=true;saveState();showResults();
};

function showResults(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('bottom-nav').style.display='none';
  document.getElementById('nav-bar').style.display='none';
  document.getElementById('quiz-header').style.display='none';
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('results-screen').style.display='block';

  var list=getList();
  var correct=0;
  for(var i=0;i<list.length;i++){ if(state.answers[list[i]]===getShuffledCI(list[i])) correct++; }
  document.getElementById('res-score').textContent=correct+'/'+list.length;
  document.getElementById('res-sub').textContent='You got '+correct+' out of '+list.length+' correct!';

  var wrongList=[];
  for(var j=0;j<list.length;j++){
    var qi=list[j];
    if(state.answers[qi]!==undefined&&state.answers[qi]!==getShuffledCI(qi)) wrongList.push(qi);
  }
  var wr=document.getElementById('wrong-review');
  if(wrongList.length===0){wr.innerHTML='<p style="color:#1D9E75;font-weight:600;text-align:center;margin-top:16px;">Perfect score! All correct!</p>';}
  else{
    var h='<h3>Words to review ('+wrongList.length+')</h3>';
    wrongList.forEach(function(i){h+='<div class="wrong-item"><strong>'+QS[i].w+'</strong>: '+QS[i].opts[QS[i].ci]+'</div>';});
    wr.innerHTML=h;
  }
}

window.retryWrong=function(){
  var list=getList();
  var wrong=[];
  for(var i=0;i<list.length;i++){
    var qi=list[i];
    if(state.answers[qi]!==undefined&&state.answers[qi]!==getShuffledCI(qi)){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  for(var j=0;j<wrong.length;j++){ delete state.answers[wrong[j]]; }
  state.retryMode=true;
  state.retryList=wrong;
  state.cur=0;
  state.showResults=false;
  saveState();render();
};

window.openFreshModal=function(mode){
  pendingFreshMode = mode;
  var t=document.getElementById('modalTitle');
  var x=document.getElementById('modalText');
  if(t) t.textContent = mode==='random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
  if(x) x.textContent = mode==='random' ? 'Questions will be reshuffled into a new random order, and all progress will be reset.' : 'Questions will return to their original order, and all progress will be reset.';
  document.getElementById('modal-overlay').style.display='flex';
};
window.closeFreshModal=function(){
  document.getElementById('modal-overlay').style.display='none';
};
window.confirmFresh=function(){
  currentOrder = (pendingFreshMode==='random') ? randomOrder() : identityOrder();
  saveOrder(currentOrder);
  state.answers={};state.cur=0;state.showResults=false;state.retryMode=false;state.retryList=[];saveState();
  document.getElementById('modal-overlay').style.display='none';
  render();
};

window.speak=function(){
  var word=document.getElementById('word-disp').textContent;
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';u.rate=0.9;
    window.speechSynthesis.speak(u);
  }
};

window.pick=pick;
window.go=window.go;

loadState();
render();

})();
</script>
</body>
</html>
