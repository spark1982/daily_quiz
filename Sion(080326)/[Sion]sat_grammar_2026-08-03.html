<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}

<script>
(function(){

var QUIZ_KEY = "quiz_satgrammar_20_20260802_v1";
var ATT_KEY = "quiz_satgrammar_20260802_att_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Sion] SAT Grammar - Results";
var TAG_COLORS = {};
var TIMER_DEFAULT_MIN = 25;

var RAW_QUESTIONS = [{"box": "Preliminary sales figures suggested the new tablet would outsell its predecessor by a wide margin. ___ actual returns from retailers show the two models selling at nearly identical rates.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["However,", "Therefore,", "In addition,", "For example,"], "ci": 0, "exp": "The first sentence describes an expectation, and the second reports a contradicting reality, so a contrast word is needed. \"However\" signals that reversal correctly. \"Therefore\" wrongly implies the actual returns resulted from the preliminary figures. \"In addition\" wrongly suggests the second sentence adds a similar point rather than contradicting the first. \"For example\" wrongly frames the second sentence as an illustration of the first."}, {"box": "A collection of rare manuscripts, donated anonymously along with several pieces of period furniture, ___ now on permanent display in the east wing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "were", "have been"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"collection\"; the phrase describing what was donated with it does not change the number of the subject. A singular verb is required, so \"is\" is correct. \"Are,\" \"were,\" and \"have been\" are plural or otherwise mismatched forms that incorrectly treat \"manuscripts\" or \"furniture\" as the subject rather than \"collection.\""}, {"box": "The internship requires candidates to complete an aptitude test, submit two letters of recommendation, and ___ a short writing sample within one week of applying.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["provide", "providing", "provided", "have provided"], "ci": 0, "exp": "The sentence lists three parallel requirements governed by \"requires candidates to\": \"complete... submit... provide.\" Because \"to\" already applies to the whole series, each item should appear in its base form, making \"provide\" correct. \"Providing,\" \"provided,\" and \"have provided\" all break the parallel pattern established by \"complete\" and \"submit.\""}, {"box": "The city council debated the zoning proposal for nearly six hours ___ the vote itself took less than five minutes to complete.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["; yet the", "; and yet the", "yet the", ", the"], "ci": 0, "exp": "Both halves of the sentence are independent clauses, so a semicolon alone can join them since \"yet\" already supplies the necessary contrast without a coordinating conjunction after the semicolon. Omitting punctuation entirely creates a run-on, joining the clauses with only a comma creates a comma splice, and adding \"and\" before \"yet\" after the semicolon is redundant, since \"yet\" alone already functions as the connector."}, {"box": "When the museum's curator spoke with the sculptor about the damaged exhibit, <span style=\"text-decoration:underline\">she explained that repairs would take at least six months</span>.", "stem": "Which choice best revises the underlined portion to eliminate the ambiguous pronoun reference?", "opts": ["the curator explained that repairs would take at least six months", "she was told that repairs would take at least six months, apparently", "she, being the one who explained, said repairs would take six months", "it was explained that repairs would take at least six months"], "ci": 0, "exp": "In the original sentence, \"she\" could refer to either the curator or the sculptor, so the meaning is unclear. Naming \"the curator\" directly removes the ambiguity. The other choices keep the vague pronoun \"she\" or \"it\" without ever specifying who did the explaining."}, {"box": "Exhausted after finishing the final leg of the relay, the coach congratulated the runner on her performance.", "stem": "Which choice best revises the sentence to correct the misplaced modifier?", "opts": ["Exhausted after finishing the final leg of the relay, the runner was congratulated by the coach on her performance.", "Exhausted after finishing the final leg of the relay, the coach's congratulations went to the runner.", "The coach, exhausted after finishing the final leg of the relay, congratulated the runner on her performance.", "Finishing the final leg of the relay, the coach congratulated the exhausted runner on her performance."], "ci": 0, "exp": "The introductory phrase \"exhausted after finishing the final leg of the relay\" logically describes the runner, not the coach, so the noun immediately following the comma must be \"the runner.\" Restructuring so the runner is congratulated fixes the error. The other choices still attach the exhaustion to the coach or introduce awkward, unclear phrasing."}, {"box": "The two rival firms announced that ___ merger talks had collapsed after months of negotiation, though neither company would confirm the reason.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["their", "its", "they're", "there"], "ci": 0, "exp": "The sentence requires a possessive form referring back to \"the two rival firms,\" a plural subject, so \"their\" is correct. \"Its\" is singular and does not agree with the plural subject. \"They're\" is a contraction of \"they are\" and does not fit grammatically before a noun. \"There\" refers to location or introduces a clause and cannot function as a possessive."}, {"box": "The report, <span style=\"text-decoration:underline\">which was withdrawn by the agency due to the fact that several of its central statistics had been miscalculated</span>, will not be reissued until an independent audit is complete.", "stem": "Which choice most effectively revises the underlined portion while keeping its meaning?", "opts": ["which the agency withdrew after discovering that several central statistics had been miscalculated", "which was, owing to the fact of miscalculated statistics, withdrawn by the agency", "which the agency, due to the fact that its statistics were wrong, withdrew", "which was withdrawn due to it having several miscalculated statistics, by the agency"], "ci": 0, "exp": "The phrase \"due to the fact that\" is a wordy way of expressing causation, and replacing it with \"after discovering that\" conveys the same meaning far more concisely. The other choices keep the wordy \"due to the fact\" construction or rearrange the sentence awkwardly without removing the redundancy."}, {"box": "By the time the negotiators reached a compromise, the original deadline ___ for nearly three weeks, making the agreement largely symbolic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had already passed", "already passed", "has already passed", "was already passing"], "ci": 0, "exp": "The deadline passing was completed before another past event (reaching the compromise), which requires the past perfect tense \"had already passed.\" The simple past \"already passed\" does not clearly establish that the passing happened before the compromise. \"Has already passed\" incorrectly shifts to the present perfect, and \"was already passing\" wrongly suggests the deadline was still in the process of passing."}, {"box": "Neither the marketing director nor the regional managers ___ willing to approve the campaign without further testing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "is", "has been"], "ci": 0, "exp": "With \"neither... nor\" constructions, the verb agrees with the noun closest to it, which here is the plural \"regional managers,\" so the plural verb \"were\" is correct. \"Was,\" \"is,\" and \"has been\" are all singular forms that would only be correct if the closer noun were singular."}, {"box": "The foundation's mission is not only to fund scientific research but also ___ underrepresented students through mentorship programs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["to support", "supporting", "supports", "having supported"], "ci": 0, "exp": "The correlative pair \"not only... but also\" requires parallel grammatical forms on both sides. Since the first half uses the infinitive \"to fund,\" the second half must also use a matching infinitive, making \"to support\" correct. \"Supporting,\" \"supports,\" and \"having supported\" all break the parallel infinitive structure."}, {"box": "The laboratory's safety manual lists three required steps before any chemical is handled___ verifying ventilation, checking protective equipment, and confirming that a supervisor is present.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": [":", ",", ";", " and"], "ci": 0, "exp": "A colon is used to introduce a list that follows a complete independent clause, and \"the laboratory's safety manual lists three required steps before any chemical is handled\" is a complete sentence setting up the list. A comma alone would create a run-on before a list of this length, a semicolon is reserved for joining independent clauses, and inserting \"and\" without punctuation fails to signal that a list is beginning."}, {"box": "If an employee disagrees with the performance review, ___ may request a written appeal within ten business days.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["he or she", "they", "you", "one who"], "ci": 0, "exp": "The antecedent \"an employee\" is singular, so the pronoun referring back to it must also be singular; \"he or she\" correctly matches in number. \"They\" is common in casual usage but is not the choice that strictly matches the singular antecedent in this formal, error-testing context. \"You\" incorrectly shifts to second person, and \"one who\" is not grammatically suited to stand in for a person already introduced as \"an employee.\""}, {"box": "The committee only recommends candidates who have completed a minimum of five years of relevant field experience.", "stem": "Which choice best revises the sentence so that the modifier \"only\" is placed to convey the intended meaning?", "opts": ["The committee recommends only candidates who have completed a minimum of five years of relevant field experience.", "The committee recommends candidates only who have completed a minimum of five years of relevant field experience.", "Only the committee recommends candidates who have completed a minimum of five years of relevant field experience.", "The committee recommends candidates who have only completed a minimum of five years of relevant field experience."], "ci": 0, "exp": "The intended meaning is that recommendations go exclusively to qualifying candidates, so \"only\" should sit directly before \"candidates.\" Placing \"only\" before \"recommends\" wrongly limits what the committee does, before \"the committee\" wrongly implies no other body makes such recommendations, and after \"have\" wrongly suggests the five years is a minimal, limiting condition rather than a requirement, none of which matches the intended meaning."}, {"box": "The three research teams shared access to the same equipment, so the final results belong jointly to ___.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["all three teams' findings", "all three team's findings", "all three teams's findings", "all three team findings'"], "ci": 0, "exp": "Because three separate teams jointly possess the findings, the plural noun \"teams\" takes an apostrophe after the final \"s\" to show plural possession: \"teams'.\" \"Team's\" incorrectly treats the noun as singular, \"teams's\" adds a nonstandard extra \"s,\" and \"team findings'\" misplaces the apostrophe onto the wrong noun entirely."}, {"box": "<span style=\"text-decoration:underline\">In light of the fact that the bridge had recently undergone a full structural inspection</span>, engineers were surprised to find corrosion along several support cables.", "stem": "Which choice most effectively revises the underlined portion while keeping its meaning?", "opts": ["Although the bridge had recently undergone a full structural inspection", "Despite the fact of the bridge's recent inspection, which had been full", "In light of the bridge, which had recently undergone a full inspection, being so", "Regardless of the fact that recently is when the bridge had an inspection"], "ci": 0, "exp": "The phrase \"in light of the fact that\" is a wordy way of expressing a contrast between the recent inspection and the surprising discovery, and \"although\" conveys the same meaning far more concisely. The other choices keep an awkward \"fact\" construction or rearrange the sentence in ways that sound unnatural."}, {"box": "When the auditors compared this year's spending to last year's, ___ they found that overhead costs had risen sharply.", "stem": "Which choice completes the text most concisely without changing its meaning?", "opts": ["they found that overhead costs had risen sharply", "they found, in point of fact, that overhead costs had risen quite sharply indeed", "it was found by them that overhead costs had experienced a sharp rise", "the finding that they made was that overhead costs had risen sharply"], "ci": 0, "exp": "\"they found that overhead costs had risen sharply\" states the finding directly and concisely without unnecessary words. In 'in point of fact... quite sharply indeed,' the phrases 'in point of fact' and 'indeed' add redundant emphasis without adding meaning. In 'it was found by them,' the passive construction adds words without adding meaning. In 'the finding that they made was that,' the roundabout phrasing needlessly delays the actual point."}, {"box": "Rising steadily since early spring, analysts now expect the company's stock price to level off by autumn.", "stem": "Which choice best revises the sentence to correct the misplaced modifier?", "opts": ["Rising steadily since early spring, the company's stock price is now expected by analysts to level off by autumn.", "Rising steadily since early spring, analysts' expectations for the company's stock price are to level off by autumn.", "Since early spring, the rising analysts now expect the company's stock price to level off by autumn.", "Analysts, rising steadily since early spring, now expect the company's stock price to level off by autumn."], "ci": 0, "exp": "The introductory phrase \"rising steadily since early spring\" logically describes the stock price, not the analysts, so the noun immediately following the comma must be \"the company's stock price.\" The other choices still attach the rising action to \"analysts\" or introduce confusing phrasing that misidentifies what has been rising."}, {"box": "The volunteer coordinator, along with several longtime committee members, ___ opposed to moving the annual fundraiser to a smaller venue.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "were", "have been"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"coordinator\"; the phrase \"along with several longtime committee members\" is a parenthetical addition that does not change the number of the subject. A singular verb is required, so \"is\" is correct. \"Are,\" \"were,\" and \"have been\" are all plural forms that incorrectly treat \"committee members\" as the true subject."}, {"box": "The startup's founders spent their first year building a prototype, testing it with focus groups, and ___ investors before any product reached the market.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["courting", "to court", "having courted", "they courted"], "ci": 0, "exp": "The sentence lists three parallel activities the founders spent their year doing: \"building... testing... courting.\" Since \"building\" and \"testing\" are both gerunds, the third item must match that same -ing form, making \"courting\" correct. \"To court,\" \"having courted,\" and \"they courted\" all break the parallel gerund pattern established by the first two items."}];


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(q.tag){
    tagEl.style.display='inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagEl.style.display='none';
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
