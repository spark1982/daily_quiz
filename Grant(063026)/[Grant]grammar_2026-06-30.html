<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Grammar</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:#eef2f7;color:#222;}
.wrap{max-width:640px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 18px rgba(0,0,0,0.08);}
.title{text-align:center;font-size:1.25rem;font-weight:900;color:#185FA5;padding:16px 12px 4px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
#qzAttemptsBar{text-align:center;font-size:0.78rem;font-weight:700;color:#888;padding:2px 12px 8px;background:#fff;letter-spacing:0.02em;}
#qzAttemptsBar span{color:#185FA5;margin-left:4px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:0;padding:10px 14px;background:#fff;border-top:1px solid #e6ebf1;border-bottom:1px solid #e6ebf1;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;font-weight:700;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;margin:0 14px 8px;border-radius:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;margin:2px;}
.timer-bar{background:#fff;border-bottom:1px solid #d0dce8;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-start-btn:active{opacity:0.8;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
.card{padding:18px 16px 20px;}
.tagline{display:inline-block;background:#185FA5;color:#fff;font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:10px;}
.tagline.review{background:#f5a623;}
.extra-box{background:#f5f7fa;border-left:4px solid #185FA5;padding:12px 14px;border-radius:6px;margin-bottom:14px;font-size:0.92rem;line-height:1.55;color:#333;}
.passage-box{background:#f5f7fa;border-left:4px solid #185FA5;padding:14px 16px;border-radius:6px;margin-bottom:16px;font-size:0.92rem;line-height:1.6;color:#333;}
.qtext{font-size:1.04rem;font-weight:700;line-height:1.5;margin-bottom:16px;color:#1a1a1a;}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border:1.5px solid #d7dde6;border-radius:10px;background:#fff;font-size:0.96rem;cursor:pointer;color:#222;line-height:1.4;}
.opt:active{opacity:0.85;}
.opt.correct{border-color:#1D9E75;background:#e9faf3;color:#0c6b4d;font-weight:700;}
.opt.wrong{border-color:#E24B4A;background:#fdeceb;color:#9c2b22;font-weight:700;}
.opt.disabled{cursor:default;}
.exp{display:none;background:#fff7e8;border-left:4px solid #f5a623;padding:12px 14px;border-radius:6px;margin-top:6px;font-size:0.92rem;line-height:1.55;color:#5a4521;}
.exp.show{display:block;}
.navrow{display:flex;gap:10px;margin-top:18px;}
.navbtn{flex:1;padding:13px;border:none;border-radius:10px;font-size:0.96rem;font-weight:700;cursor:pointer;background:#185FA5;color:#fff;}
.navbtn:disabled{background:#c7d2de;cursor:not-allowed;}
.navbtn.secondary{background:#eef2f7;color:#185FA5;}
.result{padding:24px 18px;text-align:center;}
.result h2{color:#185FA5;font-size:1.3rem;margin-bottom:4px;}
.scoreline{font-size:2rem;font-weight:900;color:#1D9E75;margin:12px 0;}
.resultbtn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;color:#fff;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:50;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;padding:22px;max-width:300px;text-align:center;}
.modal-box h3{margin:0 0 10px;color:#185FA5;font-size:1.05rem;}
.modal-box p{font-size:0.96rem;color:#333;margin-bottom:18px;line-height:1.5;}
.modal-row{display:flex;gap:10px;}
.modal-row button{flex:1;padding:11px;border:none;border-radius:8px;font-size:0.92rem;font-weight:700;cursor:pointer;}
.ul{text-decoration:underline;}
.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}
.fr .fn,.fr .fd{display:block;font-size:0.78em;line-height:1.25;padding:0 3px;}
.fr .fb{display:block;border-top:1.5px solid currentColor;min-width:14px;}
.radical{display:inline-flex;align-items:center;vertical-align:middle;}
.radical-index{font-size:0.65em;align-self:flex-start;margin-right:1px;line-height:1;}
.radical-symbol{display:inline-flex;align-items:stretch;}
.radical-symbol::before{content:"\221A";font-size:1.15em;line-height:1;position:relative;top:2px;}
.radical-content{border-top:2.5px solid currentColor;padding:1px 4px 1px 2px;display:inline-block;line-height:1.3;}
.mblock{text-align:center;margin:10px 0;font-size:1.05em;font-style:italic;line-height:2;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">[Grant] Grammar</div>
  <div class="instruction">Choose the answer that follows the grammar rule correctly.</div>
  <div id="qzAttemptsBar">Total Attempts:<span id="qzAttemptsCount">0</span></div>
  <div class="timer-bar" id="timerBar">
    <div class="timer-setup" id="timerSetup">
      <label for="timerMinutesInput">Set Time Limit:</label>
      <input type="number" id="timerMinutesInput" min="1" max="180" value="20"> min
      <button class="timer-start-btn" onclick="startTimer()">Start</button>
    </div>
    <div class="timer-running" id="timerRunning" style="display:none;">
      <span class="timer-label">Time Left</span>
      <span class="timer-display" id="timerDisplay">20:00</span>
    </div>
  </div>
  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>

  <div class="card" id="quizArea"></div>
  <div class="result" id="resultArea" style="display:none;"></div>

  <div class="modal-overlay" id="freshModal">
    <div class="modal-box">
      <h3 id="freshModalTitle">Start Fresh?</h3>
      <p id="freshModalText">Progress will be cleared. This cannot be undone.</p>
      <div class="modal-row">
        <button style="background:#eef2f7;color:#185FA5;" onclick="closeFreshModal()">Cancel</button>
        <button style="background:#E24B4A;color:#fff;" onclick="confirmFresh()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>

<script>
var RAW_QUESTIONS = [{"q": "Choose the sentence that uses correct subject-verb agreement.", "opts": ["The boxes of old toys is sitting in the attic.", "The boxes of old toys are sitting in the attic.", "The boxes of old toys sitting in the attic.", "The box of old toys are sitting in the attic."], "ci": 1, "exp": "The subject is the plural noun \"boxes,\" so it needs the plural verb \"are.\" \"The boxes of old toys are sitting in the attic\" is correct."}, {"q": "Which sentence is punctuated correctly?", "opts": ["Before the game started the players warmed up on the field.", "Before the game, started the players warmed up on the field.", "Before, the game started the players warmed up on the field.", "Before the game started, the players warmed up on the field."], "ci": 3, "exp": "A comma is needed after an introductory phrase like \"Before the game started\" to separate it from the main sentence. \"Before the game started, the players warmed up on the field\" places the comma correctly."}, {"q": "Choose the sentence that uses the correct form of the homophone.", "opts": ["I can't believe your already finished with you're homework.", "I can't believe you're already finished with you're homework.", "I can't believe you're already finished with your homework.", "I can't believe your already finished with your homework."], "ci": 2, "exp": "\"You're\" is a contraction meaning \"you are,\" and \"your\" shows possession. \"I can't believe you're already finished with your homework\" uses each word correctly."}, {"q": "Which sentence uses an apostrophe correctly to show possession?", "opts": ["The dogs' leash was tangled around the fence post.", "The dog's leash was tangled around the fence post.", "The dogs leash was tangled around the fence post.", "The dog's' leash was tangled around the fence post."], "ci": 1, "exp": "Since there is only one dog, the possessive form needs an apostrophe before the s. \"The dog's leash\" correctly shows that the leash belongs to one dog."}, {"q": "Choose the sentence that correctly uses quotation marks for dialogue.", "opts": ["Maria said, Let's leave for the bus stop early today.", "Maria said \"Let's leave for the bus stop early today.", "\"Maria said, Let's leave for the bus stop early today.\"", "Maria said, \"Let's leave for the bus stop early today.\""], "ci": 3, "exp": "Dialogue must be enclosed in quotation marks, with the closing punctuation placed inside the final quotation mark. \"Maria said, 'Let's leave for the bus stop early today.'\" follows this rule correctly."}, {"q": "Which sentence uses the correct past-tense form of the irregular verb?", "opts": ["Yesterday, the team swimmed across the entire lake.", "Yesterday, the team swum across the entire lake.", "Yesterday, the team has swam across the entire lake.", "Yesterday, the team swam across the entire lake."], "ci": 3, "exp": "\"Swim\" is an irregular verb whose simple past-tense form is \"swam,\" not \"swimmed\" or \"swum.\" \"Yesterday, the team swam across the entire lake\" uses the correct form."}, {"q": "Choose the sentence that correctly uses an adverb instead of an adjective.", "opts": ["She finished the race quick, beating her own best time.", "She finished the race quicker, beating her own best time, than ever.", "She finished the race quickly, beating her own best time.", "She finished the race in a quick way of running, beating her own best time."], "ci": 2, "exp": "Because the word describes how she finished the race (a verb), it needs the adverb form \"quickly,\" not the adjective \"quick.\" \"She finished the race quickly\" is correct."}, {"q": "Which sentence avoids using a double negative?", "opts": ["I don't have any homework left to finish tonight.", "I don't have no homework left to finish tonight.", "I haven't got no homework left to finish tonight.", "I don't have none left to finish tonight."], "ci": 0, "exp": "A sentence should only contain one negative word. \"I don't have any homework left\" uses just one negative, \"don't,\" while the other choices incorrectly pair \"don't\" or \"haven't\" with a second negative word like \"no\" or \"none.\""}, {"q": "Choose the sentence that uses capitalization correctly.", "opts": ["Last July, we drove through Yellowstone National Park on our way to Idaho.", "Last july, we drove through yellowstone National park on our way to idaho.", "Last July, we drove through Yellowstone national park on our way to Idaho.", "last July, we drove through Yellowstone National Park on our way to idaho."], "ci": 0, "exp": "Months, proper place names, and the first word of a sentence must all be capitalized. \"Last July, we drove through Yellowstone National Park on our way to Idaho\" follows every rule correctly."}, {"q": "Which sentence correctly combines the two ideas using a comma and a conjunction?", "opts": ["The sky grew dark and, the wind picked up speed.", "The sky grew dark, and the wind picked up speed.", "The sky grew dark the wind picked up speed.", "The sky grew dark, the wind picked up speed."], "ci": 1, "exp": "Two independent clauses joined by a conjunction like \"and\" need a comma placed before the conjunction, not after it or omitted entirely. \"The sky grew dark, and the wind picked up speed\" is punctuated correctly."}, {"q": "Choose the sentence that uses the correct comparative form.", "opts": ["This backpack is heavier than the one I had last year.", "This backpack is more heavier than the one I had last year.", "This backpack is heaviest than the one I had last year.", "This backpack is heavyer than the one I had last year."], "ci": 0, "exp": "When comparing exactly two things, the comparative form \"heavier\" should be used, not the superlative \"heaviest\" or the doubled form \"more heavier.\" \"This backpack is heavier than the one I had last year\" is correct."}, {"q": "Which sentence correctly fixes the run-on sentence below?<br><br>\"The bell rang the students rushed into the hallway.\"", "opts": ["The bell rang the students, rushed into the hallway.", "The bell rang, so the students rushed into the hallway.", "The bell rang. The students, rushed into the hallway.", "The bell, rang the students rushed into the hallway."], "ci": 1, "exp": "Two complete sentences joined with no punctuation form a run-on. Adding a comma and the conjunction \"so\" correctly joins the two ideas: \"The bell rang, so the students rushed into the hallway.\""}, {"q": "Choose the sentence that uses the correct plural form of the noun.", "opts": ["Both of the childs lost their library books on the bus.", "Both of the childes lost their library books on the bus.", "Both of the children lost their library books on the bus.", "Both of the children's lost their library books on the bus."], "ci": 2, "exp": "\"Child\" has an irregular plural form, \"children,\" rather than adding -s or -es. \"Both of the children lost their library books on the bus\" uses the correct plural."}, {"q": "Which sentence correctly uses a preposition to show location?", "opts": ["The cat hid to the porch during the thunderstorm.", "The cat hid underneath the porch during the thunderstorm.", "The cat hid of the porch during the thunderstorm.", "The cat hid about the porch during the thunderstorm."], "ci": 1, "exp": "The preposition \"underneath\" correctly shows the cat's location in relation to the porch. \"To,\" \"of,\" and \"about\" do not logically describe where the cat was hiding."}, {"q": "Choose the sentence that is a complete sentence rather than a fragment.", "opts": ["Whenever the fire alarm goes off in the building.", "Lining up outside calmly during the fire alarm.", "Whenever the fire alarm goes off, everyone lines up outside calmly.", "Everyone outside calmly during the fire alarm."], "ci": 2, "exp": "A complete sentence needs both a subject and a main verb that can stand on its own. \"Whenever the fire alarm goes off, everyone lines up outside calmly\" has a main clause, \"everyone lines up outside calmly,\" so it is complete."}, {"q": "Which sentence correctly uses the conjunction \"because\" to show a reason?", "opts": ["We canceled the picnic, because, heavy rain was forecast all afternoon.", "We canceled the picnic because heavy rain was forecast all afternoon.", "Because we canceled the picnic heavy rain was forecast all afternoon.", "We canceled the picnic but because heavy rain was forecast all afternoon."], "ci": 1, "exp": "\"Because\" should directly introduce the reason for an action without extra commas breaking up the clause. \"We canceled the picnic because heavy rain was forecast all afternoon\" correctly shows cause and effect."}, {"q": "Choose the sentence that correctly identifies and places the adjective.", "opts": ["The puppy curious sniffed every corner of the new backyard.", "The curious puppy sniffed every corner of the new backyard.", "The puppy sniffed every curious corner of the new backyard.", "The puppy sniffed curious every corner of the new backyard."], "ci": 1, "exp": "An adjective like \"curious\" should be placed directly before the noun it describes. \"The curious puppy\" correctly places the adjective before \"puppy,\" the noun it modifies."}, {"q": "Which sentence uses the correct title capitalization for a book?", "opts": ["My favorite book this year is charlotte's web.", "My favorite book this year is Charlotte's web.", "My favorite book this year is Charlotte's Web.", "My favorite book this year is CHARLOTTE'S Web."], "ci": 2, "exp": "In a title, the main words should be capitalized, including both \"Charlotte's\" and \"Web.\" \"My favorite book this year is Charlotte's Web\" follows standard title capitalization."}, {"q": "Choose the sentence that correctly uses \"there,\" \"their,\" or \"they're.\"", "opts": ["The students left there backpacks over their by the door because they're going outside.", "The students left their backpacks over there by the door because they're going outside.", "The students left their backpacks over their by the door because there going outside.", "The students left they're backpacks over there by the door because their going outside."], "ci": 1, "exp": "\"Their\" shows possession, \"there\" refers to a place, and \"they're\" means \"they are.\" \"The students left their backpacks over there by the door because they're going outside\" uses all three correctly."}, {"q": "Which sentence correctly uses a colon to introduce a list?", "opts": ["Please bring the following items, a pencil, a notebook, and a calculator.", "Please bring the following items a pencil, a notebook, and a calculator.", "Please bring: the following items a pencil, a notebook, and a calculator.", "Please bring the following items: a pencil, a notebook, and a calculator."], "ci": 3, "exp": "A colon is used after a complete sentence to introduce a list. \"Please bring the following items: a pencil, a notebook, and a calculator\" places the colon correctly after the introductory clause."}];
var QUIZ_KEY = 'quiz_grantgrammar_20_20260629_v1';
var ATT_KEY = 'quiz_grantgrammar_att_20260629_v1';
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var EXTRA_FIELD = '';
var EXTRA_CLASS = 'extra-box';
var QUIZ_TITLE = '[Grant] Grammar';

function fr(n,d){ return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>'; }
function R(idx,inner){ var i = idx ? '<span class="radical-index">'+idx+'</span>' : ''; return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>'; }

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var QUESTIONS = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{ var raw = localStorage.getItem(QUIZ_KEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function saveState(s){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(s)); }catch(e){} }

var state = loadState() || defaultState();
var timerInterval = null;

function render(){
  if(state.showResults){ renderResult(); document.getElementById('quizArea').style.display='none'; document.getElementById('resultArea').style.display='block'; updateNav(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultArea').style.display='none';
  var i = state.cur;
  var q = QUESTIONS[i];
  var picked = state.answers[i];
  var html = '';
  if(q.tag){ html += '<span class="tagline'+(q.tag==='Review'?' review':'')+'">'+q.tag+'</span><br>'; }
  if(EXTRA_FIELD && q[EXTRA_FIELD]){ html += '<div class="'+EXTRA_CLASS+'">'+q[EXTRA_FIELD]+'</div>'; }
  html += '<div class="qtext">Q'+(i+1)+'. '+q.q+'</div>';
  for(var k=0;k<q.opts.length;k++){
    var cls='opt';
    if(picked!==undefined){
      cls += ' disabled';
      if(k===q.ci) cls += ' correct';
      else if(k===picked) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+(picked!==undefined?'disabled':'onclick="pick('+k+')"')+'>'+q.opts[k]+'</button>';
  }
  if(picked!==undefined && picked!==q.ci){
    html += '<div class="exp show">'+q.exp+'</div>';
  }
  html += '<div class="navrow">';
  html += '<button class="navbtn secondary" onclick="go(-1)" '+(i===0?'disabled':'')+'>&larr; Prev</button>';
  if(i>=QUESTIONS.length-1){
    html += '<button class="navbtn" onclick="finishQuiz()">Show Results &rarr;</button>';
  } else {
    html += '<button class="navbtn" onclick="go(1)">Next &rarr;</button>';
  }
  html += '</div>';
  document.getElementById('quizArea').innerHTML = html;
  updateNav();
}

function pick(k){
  var i = state.cur;
  if(state.answers[i]!==undefined) return;
  state.answers[i] = k;
  saveState(state);
  render();
}

function go(d){
  var ni = state.cur + d;
  if(ni<0 || ni>QUESTIONS.length-1) return;
  state.cur = ni;
  saveState(state);
  render();
}

function goToQ(i){
  state.cur = i;
  state.showResults = false;
  saveState(state);
  render();
}

function finishQuiz(){
  state.showResults = true;
  saveState(state);
  bumpAttempts();
  render();
}

function renderResult(){
  var correct=0, wrong=0;
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]===undefined) continue;
    if(state.answers[i]===QUESTIONS[i].ci) correct++; else wrong++;
  }
  var pct = Math.round(correct/QUESTIONS.length*100);
  var html = '<h2>Results</h2>';
  html += '<div class="scoreline">'+correct+' / '+QUESTIONS.length+'</div>';
  html += '<div style="color:#555;margin-bottom:18px;">'+pct+'% correct &middot; '+wrong+' incorrect</div>';
  html += '<button class="resultbtn" style="background:#7b61ff;" onclick="copyRes()">Copy All Results</button>';
  html += '<button id="retryWrongBtn" class="resultbtn" style="background:#1D9E75;" onclick="retryWrong()">Retry Wrong Ones</button>';
  html += '<button class="resultbtn" style="background:#185FA5;" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button>';
  html += '<button class="resultbtn" style="background:#888;" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button>';
  document.getElementById('resultArea').innerHTML = html;
}

function retryWrong(){
  var wrongList = [];
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==QUESTIONS[i].ci){
      wrongList.push(i);
      delete state.answers[i];
    }
  }
  if(wrongList.length>0){
    state.cur = wrongList[0];
    state.showResults = false;
    state.timerStartedAt = null;
    state.timerTotalSec = null;
    saveState(state);
    stopTimerInterval();
    renderTimer();
    render();
  }
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  QUESTIONS = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState(state);
  stopTimerInterval();
  closeFreshModal();
  render();
  renderTimer();
}

function copyRes(){
  var correct=0;
  for(var i=0;i<QUESTIONS.length;i++){ if(state.answers[i]===QUESTIONS[i].ci) correct++; }
  var txt = QUIZ_TITLE + ' - Score: ' + correct + '/' + QUESTIONS.length;
  try{
    navigator.clipboard.writeText(txt);
  }catch(e){}
}

function updateNav(){
  var answered = 0;
  for(var i=0;i<QUESTIONS.length;i++){ if(state.answers[i]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = (answered/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}

function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || !panel.style.display){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}

function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none' || !panel.style.display) return;
  var html='';
  for(var i=0;i<QUESTIONS.length;i++){
    var p = state.answers[i];
    var bg = p===undefined ? '#d7dde6' : (p===QUESTIONS[i].ci ? '#185FA5' : '#E24B4A');
    html += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  panel.innerHTML = html;
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(state);
  renderTimer();
  startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function qaGet(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0; }catch(e){ return 0; } }
function qaSet(n){ try{ localStorage.setItem(ATT_KEY, String(n)); }catch(e){} }
function bumpAttempts(){ qaSet(qaGet()+1); renderAttempts(); }
function renderAttempts(){ var el=document.getElementById('qzAttemptsCount'); if(el) el.textContent = qaGet(); }

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.retryWrong = retryWrong;
window.openFreshModalOriginal = openFreshModalOriginal;
window.openFreshModalRandom = openFreshModalRandom;
window.closeFreshModal = closeFreshModal;
window.confirmFresh = confirmFresh;
window.copyRes = copyRes;
window.toggleJump = toggleJump;
window.startTimer = startTimer;

render();
renderTimer();
renderAttempts();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
