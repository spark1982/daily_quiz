<script>
(function(){

var TODAY_STR = "20261114";

var DATA = {"sentences": [{"tokens": [["Grandpa", "pn"], ["slowed", "verb"], ["down", "adv"], ["near", "prep"], ["the", "art"], ["corner", "adj"], ["market", "cn_s"], [",", null], ["and", "conj"], ["he", "pro"], ["stopped", "verb"], ["at", "prep"], ["a", "art"], ["stand", "cn_s"], ["with", "prep"], ["apples", "cn_p"], ["and", "conj"], ["pumpkins", "cn_p"], [".", null]], "phrases": [[3, 6], [11, 13], [14, 17]], "subject": [0, 9], "verb": [1, 10], "structure": "compound", "purpose": "declarative", "pov": "third person", "tense": "past", "skills": ["proper noun", "adverb after verb", "noun as adjective", "stand as a noun", "phrase with two nouns joined by and", "prepositional phrase boundaries", "compound sentence", "tense on the verb"], "notes": {"0": "<i>Grandpa</i> is used as his name here (it is capitalized), so it is a proper noun.", "1": "<i>Slowed</i> is the past tense of <i>slow</i>, so it is the verb.", "2": "<i>Down</i> tells <b>how</b> Grandpa slowed. It is an adverb, not part of the verb. The verb is only <i>slowed</i>.", "5": "<i>Corner</i> is usually a noun, but here it sits in front of <i>market</i> and tells which market, so it works as an adjective.", "8": "<i>And</i> joins two sentences that could each stand alone, so it is a conjunction.", "13": "<i>Stand</i> can be a verb, but after <i>at a</i> it names a thing (a table where people sell food), so it is a singular common noun.", "p0": "<i>near the corner market</i> starts at <i>near</i> and ends at the noun <i>market</i>. <i>Corner</i> is inside the phrase.", "p1": "<i>at a stand</i> is a short phrase of its own: <i>at</i> + <i>a</i> + the noun <i>stand</i>.", "p2": "The phrase starts at <i>with</i> and keeps going through <i>and pumpkins</i>, because the apples and the pumpkins are both on the stand.", "subj": "There are two subject + verb sets: <i>Grandpa slowed</i> and <i>he stopped</i>. Mark both subjects.", "verb": "Mark both verbs: <i>slowed</i> and <i>stopped</i>. <i>Down</i> is not part of the verb.", "structure": "<i>Grandpa slowed down near the corner market</i> can stand alone, and <i>he stopped at a stand with apples and pumpkins</i> can stand alone too. Two complete sentences joined by <i>, and</i> make a compound sentence.", "tense": "<i>Slowed</i> and <i>stopped</i> end in -ed, so the sentence is past tense. Tense belongs to the verbs."}}, {"tokens": [["Maya", "pn"], ["and", "conj"], ["her", "pro"], ["brother", "cn_s"], ["feed", "verb"], ["the", "art"], ["very", "adv"], ["hungry", "adj"], ["ducks", "cn_p"], ["at", "prep"], ["the", "art"], ["pond", "cn_s"], ["because", "conj"], ["the", "art"], ["birds", "cn_p"], ["wait", "verb"], ["by", "prep"], ["the", "art"], ["water", "cn_s"], ["for", "prep"], ["some", "adj"], ["bread", "cn_s"], [".", null]], "phrases": [[9, 11], [16, 18], [19, 21]], "subject": [0, 3, 14], "verb": [4, 15], "structure": "complex", "purpose": "declarative", "pov": "third person", "tense": "present", "skills": ["proper noun", "very as an adverb", "some as adjective", "compound subject", "complex sentence (because = conjunction)", "prepositional phrase boundaries", "present tense on the verb", "simple vs compound vs complex"], "notes": {"0": "<i>Maya</i> is a person's name, so it is a proper noun.", "1": "<i>And</i> joins <i>Maya</i> and <i>her brother</i>, so it is a conjunction.", "2": "<i>Her</i> shows whose brother, so it is a pronoun (a possessive pronoun).", "4": "<i>Feed</i> is the action Maya and her brother do now, so it is the verb (present tense).", "6": "<i>Very</i> tells <b>how</b> hungry the ducks are. A word that describes an adjective is an adverb.", "12": "<i>Because</i> joins the reason <i>the birds wait by the water</i> to the rest of the sentence, so it is a conjunction (a subordinating conjunction).", "15": "<i>Wait</i> is what the birds do, so it is a verb.", "20": "<i>Some</i> tells how much bread, so it works as an adjective.", "p0": "<i>at the pond</i> starts at <i>at</i> and ends at the noun <i>pond</i>.", "p1": "<i>by the water</i> is one phrase, and <i>for some bread</i> is a second phrase that starts at the next preposition, <i>for</i>.", "p2": "<i>for some bread</i> starts at <i>for</i> and ends at the noun <i>bread</i>. <i>Some</i> is inside the phrase.", "subj": "The first part has a compound subject: <i>Maya</i> and <i>brother</i>. The <i>because</i> part has its own subject: <i>birds</i>. Mark all three.", "verb": "Mark both verbs: <i>feed</i> and <i>wait</i>.", "structure": "<i>Maya and her brother feed the very hungry ducks at the pond</i> can stand alone, but <i>because the birds wait by the water for some bread</i> cannot. One part that stands alone plus one part that starts with <i>because</i> makes a complex sentence.", "tense": "<i>Feed</i> and <i>wait</i> tell what happens now (they do not end in -ed and have no <i>will</i>), so the sentence is present tense."}}]};
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ATT_KEY = STORAGE_KEY + '_att';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
var LABELS = [
  ['cn_s','Common noun','singular (cn sn)','cn sn'],
  ['cn_p','Common noun','plural (cn pl)','cn pl'],
  ['pn','Proper noun','a name (pn)','pn'],
  ['pro','Pronoun','(pro)','pro'],
  ['verb','Verb','(verb)','verb'],
  ['adj','Adjective','(adj)','adj'],
  ['art','Article','a, an, the (A)','A'],
  ['adv','Adverb','(adv)','adv'],
  ['prep','Preposition','(prep)','prep'],
  ['conj','Conjunction','(conj)','conj']
];
var LNAME = {}; var LABBR = {};
LABELS.forEach(function(l){ LNAME[l[0]] = l[1] + (l[0]==='cn_s' ? ' (singular)' : (l[0]==='cn_p' ? ' (plural)' : '')); LABBR[l[0]] = l[3]; });
var RULE = {
  cn_s: 'A common noun names any person, place, thing, or idea (not a special name). Singular means one.',
  cn_p: 'A common noun names any person, place, thing, or idea. Plural means more than one (usually ends in -s or -es).',
  pn: 'A proper noun is the name of one special person, place, or thing, so it begins with a capital letter even in the middle of a sentence.',
  pro: 'A pronoun takes the place of a noun: I, you, he, she, it, we, they, me, him, her, us, them, my, his, her, their, its.',
  verb: 'A verb shows an action (run, looked) or a state of being (is, was, seemed). Helping verbs (was, had, will) are verbs too.',
  adj: 'An adjective describes a noun: what kind (strange), which one (this), or how many (some, three). A noun in front of another noun can work as an adjective (school bus, bus window).',
  art: 'Articles are the three little words a, an, and the.',
  adv: 'An adverb tells how, when, where, or how much. It often sits right next to a verb (looked out, ran away, sat down) or in front of an adjective (very exciting).',
  prep: 'A preposition shows where or when something is, and it starts a prepositional phrase (through, at, on, to, after, under, with, of).',
  conj: 'A conjunction joins words or sentences: and, but, or, so, because, when, while.'
};
var SEL = {
  structure: ['simple','compound','complex'],
  purpose: ['declarative','interrogative','imperative','exclamatory'],
  pov: ['first person','second person','third person'],
  tense: ['past','present','future']
};
var SELQ = {
  structure: 'Sentence structure: simple, compound, or complex?',
  purpose: 'Sentence type: what does the sentence do?',
  pov: 'Point of view (POV):',
  tense: 'Tense of the main verb:'
};
var SELRULE = {
  structure: 'Simple = one subject + verb set. Compound = two complete sentences joined by and, but, or so. Complex = one complete sentence + a part that starts with because, when, while, after, if (and cannot stand alone).',
  purpose: 'Declarative tells (ends with .). Interrogative asks (?). Imperative gives a command. Exclamatory shows strong feeling (!).',
  pov: 'First person uses I or we. Second person talks to you. Third person tells about others by name or he, she, they.',
  tense: 'Look at the main verb: looked, got, ran = past; looks, runs = present; will look = future.'
};
var STEPS = [['pos','1. Label every word'],['ph','2. Prepositional phrases'],['sv','3. Subject & verb'],['about','4. About the sentence']];

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function blankAns(){ return { pos:{}, phrases:[], subj:[], verb:[], structure:'', purpose:'', pov:'', tense:'' }; }
function newState(){ var s = { cur:0, step:'pos', ans:[], checked:[], showResults:false, reported:false, retry:null, lastProgress:-1 }; for(var i=0;i<DATA.sentences.length;i++){ s.ans.push(blankAns()); s.checked.push(false); } return s; }
var state = newState();
try{ var raw = ls(STORAGE_KEY); if(raw){ var p = JSON.parse(raw); if(p && p.ans && p.ans.length===DATA.sentences.length) state = p; } }catch(e){}
function saveState(){ ls(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){ return parseInt(ls(ATT_KEY) || '0', 10); }
function incAttempts(){ ls(ATT_KEY, String(getAttempts() + 1)); }
var selWord = null, pending = null, svMode = 'subj';

function S(){ return DATA.sentences[state.cur]; }
function A(){ return state.ans[state.cur]; }
function words(si){ var t = DATA.sentences[si].tokens, out = []; for(var i=0;i<t.length;i++) if(t[i][1]) out.push(i); return out; }
function plain(si){ var t = DATA.sentences[si].tokens, s=''; for(var i=0;i<t.length;i++){ if(i>0 && t[i][1]) s+=' '; s+=t[i][0]; } return s; }
function phraseText(si, ph){ var t = DATA.sentences[si].tokens, out=[]; for(var i=ph[0];i<=ph[1];i++) if(t[i][1]) out.push(t[i][0]); return out.join(' '); }
function sameSet(a,b){ if(a.length!==b.length) return false; var x=a.slice().sort(), y=b.slice().sort(); for(var i=0;i<x.length;i++) if(x[i]!==y[i]) return false; return true; }

// ---------- grading ----------
function items(si){
  var s = DATA.sentences[si], a = state.ans[si], out = [];
  words(si).forEach(function(i){ out.push({ id:'w'+i, kind:'word', idx:i, ok: a.pos[i]===s.tokens[i][1], your: a.pos[i] ? LNAME[a.pos[i]] : '(not marked)', correct: LNAME[s.tokens[i][1]] }); });
  s.phrases.forEach(function(ph,k){ var hit = a.phrases.some(function(m){ return m[0]===ph[0] && m[1]===ph[1]; });
    var near = a.phrases.filter(function(m){ return m[0]<=ph[1] && m[1]>=ph[0]; })[0];
    out.push({ id:'p'+k, kind:'phrase', ph:ph, ok:hit, your: hit ? phraseText(si,ph) : (near ? phraseText(si,near) : '(not marked)'), correct: phraseText(si,ph) }); });
  out.push({ id:'subj', kind:'subj', ok: sameSet(a.subj, s.subject), your: a.subj.length ? a.subj.map(function(i){return s.tokens[i][0];}).join(' ') : '(not marked)', correct: s.subject.map(function(i){return s.tokens[i][0];}).join(' ') });
  out.push({ id:'verb', kind:'verb', ok: sameSet(a.verb, s.verb), your: a.verb.length ? a.verb.map(function(i){return s.tokens[i][0];}).join(' ') : '(not marked)', correct: s.verb.map(function(i){return s.tokens[i][0];}).join(' ') });
  ['structure','purpose','pov','tense'].forEach(function(k){ out.push({ id:k, kind:'sel', key:k, ok: a[k]===s[k], your: a[k] || '(not answered)', correct: s[k] }); });
  if(state.retry){ var R = state.retry[si] || []; out = out.filter(function(it){ return R.indexOf(it.id) >= 0; }); }
  return out;
}
function explain(si, it){
  var s = DATA.sentences[si], n = s.notes || {};
  if(it.kind==='word') return n[String(it.idx)] || RULE[s.tokens[it.idx][1]];
  if(it.kind==='phrase') return n['p'+it.id.slice(1)] || 'A prepositional phrase starts with the preposition and keeps going to the noun at the end (with every word in between, and every noun joined by and).';
  if(it.kind==='subj') return n.subj || 'The simple subject is the main noun or pronoun the sentence is about (who or what does the action).';
  if(it.kind==='verb') return n.verb || 'The simple predicate is the main verb (with any helping verbs). Words like out, down, or away after the verb are adverbs, not part of the verb.';
  return n[it.key] || SELRULE[it.key];
}
function questionText(si, it){
  var s = DATA.sentences[si], q = 'Sentence: &ldquo;' + plain(si) + '&rdquo;<br>';
  if(it.kind==='word') return q + 'What part of speech is <b>' + s.tokens[it.idx][0] + '</b> in this sentence?';
  if(it.kind==='phrase') return q + 'Which words make the prepositional phrase that begins with <b>' + s.tokens[it.ph[0]][0] + '</b>?';
  if(it.kind==='subj') return q + 'What is the simple subject?';
  if(it.kind==='verb') return q + 'What is the main verb (simple predicate)?';
  return q + SELQ[it.key];
}

// ---------- rendering ----------
function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var qc = document.getElementById('quiz-card'), rc = document.getElementById('result-card');
  if(state.showResults){ qc.style.display='none'; rc.style.display='block'; renderResults(); updateProgress(); return; }
  qc.style.display='block'; rc.style.display='none';
  document.getElementById('q-position').textContent = 'Sentence ' + (state.cur+1) + ' / ' + DATA.sentences.length + (state.retry ? ' (retry)' : '');
  var st = document.getElementById('steps'); st.innerHTML='';
  STEPS.forEach(function(x){ var b=document.createElement('button'); b.className='step'+(state.step===x[0]?' on':'')+(stepDone(x[0])?' done':''); b.textContent=x[1]; b.onclick=function(){ state.step=x[0]; selWord=null; pending=null; saveState(); render(); }; st.appendChild(b); });
  renderSentence(); renderTools(); renderFeedback(); renderNav(); updateProgress();
}
function stepDone(k){ var a=A(), s=S();
  if(k==='pos') return words(state.cur).every(function(i){ return !!a.pos[i]; });
  if(k==='ph') return a.phrases.length>0;
  if(k==='sv') return a.subj.length>0 && a.verb.length>0;
  return !!(a.structure && a.purpose && a.pov && a.tense); }
function inPhrase(list, i){ for(var k=0;k<list.length;k++) if(i>=list[k][0] && i<=list[k][1]) return list[k]; return null; }
function renderSentence(){
  var box = document.getElementById('sentence'), s = S(), a = A(), chk = state.checked[state.cur]; box.innerHTML='';
  var wrongW = {}; if(chk){ items(state.cur).forEach(function(it){ if(it.kind==='word') wrongW[it.idx] = it.ok ? 'ok' : 'bad'; }); }
  s.tokens.forEach(function(t,i){
    var d = document.createElement('div'); d.className='tok';
    if(!t[1]){ d.className+=' punct'; d.innerHTML='<span class="w"></span><span class="lab"></span>'; d.firstChild.textContent=t[0]; box.appendChild(d); return; }
    var ph = inPhrase(a.phrases, i);
    if(ph){ d.className+=' inph'; if(i===ph[0]) d.className+=' phs'; if(i===ph[1]) d.className+=' phe'; }
    if(pending===i) d.className+=' pend';
    if(selWord===i) d.className+=' sel';
    if(a.subj.indexOf(i)>=0) d.className+=' subj';
    if(a.verb.indexOf(i)>=0) d.className+=' verb';
    if(chk && state.step==='pos' && wrongW[i]) d.className+=' '+wrongW[i];
    var sv = a.subj.indexOf(i)>=0 ? 'S' : (a.verb.indexOf(i)>=0 ? 'V' : '');
    d.innerHTML = '<span class="sv"></span><span class="w"></span><span class="lab"></span><span class="fix"></span>';
    d.children[0].textContent = sv; d.children[1].textContent = t[0]; d.children[2].textContent = a.pos[i] ? LABBR[a.pos[i]] : '';
    if(chk && state.step==='pos' && wrongW[i]==='bad') d.children[3].textContent = '→ ' + LABBR[t[1]];
    d.onclick = function(){ tapWord(i); };
    box.appendChild(d);
  });
}
function locked(){ return state.checked[state.cur]; }
function tapWord(i){
  if(locked()) return;
  var a = A();
  if(state.step==='pos'){ selWord = i; render(); return; }
  if(state.step==='ph'){
    if(pending===null){ if(inPhrase(a.phrases,i)) return; pending = i; }
    else { var lo=Math.min(pending,i), hi=Math.max(pending,i), clash=false; a.phrases.forEach(function(m){ if(m[0]<=hi && m[1]>=lo) clash=true; }); if(!clash) a.phrases.push([lo,hi]); pending=null; saveState(); maybeProgress(); }
    render(); return;
  }
  if(state.step==='sv'){ var L = svMode==='subj' ? a.subj : a.verb, o = svMode==='subj' ? a.verb : a.subj; var k=L.indexOf(i); if(k>=0) L.splice(k,1); else { L.push(i); var j=o.indexOf(i); if(j>=0) o.splice(j,1); } saveState(); maybeProgress(); render(); }
}
function setLabel(key){ if(selWord===null || locked()) return; A().pos[selWord]=key; var ws=words(state.cur), k=ws.indexOf(selWord); selWord=null; for(var j=k+1;j<ws.length;j++){ if(!A().pos[ws[j]]){ selWord=ws[j]; break; } } saveState(); maybeProgress(); render(); }
function renderTools(){
  var t = document.getElementById('tools'), h = document.getElementById('hint'), a = A(); t.innerHTML='';
  if(state.step==='pos'){
    h.textContent = 'Tap a word, then tap its part of speech. Every word gets a label.';
    var p = document.createElement('div'); p.className='palette';
    LABELS.forEach(function(l){ var b=document.createElement('button'); b.className='pal'; b.innerHTML=l[1]+'<small>'+l[2]+'</small>'; b.disabled = selWord===null || locked(); b.onclick=function(){ setLabel(l[0]); }; p.appendChild(b); });
    t.appendChild(p);
  } else if(state.step==='ph'){
    h.textContent = 'Tap the FIRST word of a prepositional phrase, then tap its LAST word. Mark every prepositional phrase in the sentence.';
    var r=document.createElement('div'); r.className='row';
    var u=document.createElement('button'); u.className='btn sec'; u.textContent='Undo last phrase'; u.disabled=locked()||!a.phrases.length; u.onclick=function(){ a.phrases.pop(); pending=null; saveState(); render(); }; r.appendChild(u);
    var c=document.createElement('button'); c.className='btn sec'; c.textContent='Clear phrases'; c.disabled=locked()||!a.phrases.length; c.onclick=function(){ a.phrases=[]; pending=null; saveState(); render(); }; r.appendChild(c);
    t.appendChild(r);
  } else if(state.step==='sv'){
    h.textContent = 'Choose Subject or Verb, then tap the word(s). Subject = the main noun or pronoun the sentence is about. Verb = the main verb (include helping verbs like was or had).';
    var r2=document.createElement('div'); r2.className='row';
    [['subj','Subject (S)'],['verb','Verb (V)']].forEach(function(m){ var b=document.createElement('button'); b.className='mode'+(svMode===m[0]?' on':''); b.textContent=m[1]; b.onclick=function(){ svMode=m[0]; render(); }; r2.appendChild(b); });
    t.appendChild(r2);
  } else {
    h.textContent = 'Answer four questions about the whole sentence.';
    var res = state.checked[state.cur] ? items(state.cur) : [];
    ['structure','purpose','pov','tense'].forEach(function(k){
      var q=document.createElement('div'); q.className='qa'; var it = res.filter(function(x){ return x.id===k; })[0]; if(it) q.className+= it.ok ? ' ok' : ' bad';
      var lab=document.createElement('label'); lab.textContent=SELQ[k]; q.appendChild(lab);
      var s=document.createElement('select'); s.disabled=locked(); var o0=document.createElement('option'); o0.value=''; o0.textContent='Choose...'; s.appendChild(o0);
      SEL[k].forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; if(a[k]===v) o.selected=true; s.appendChild(o); });
      s.onchange=function(){ a[k]=s.value; saveState(); maybeProgress(); renderNav(); renderStepsOnly(); }; q.appendChild(s); t.appendChild(q);
    });
  }
  var lg=document.createElement('div'); lg.className='legend'; lg.textContent='Yellow box = prepositional phrase · S = subject · V = verb'; t.appendChild(lg);
}
function renderStepsOnly(){ var st=document.getElementById('steps'); Array.prototype.forEach.call(st.children,function(b,ix){ b.className='step'+(state.step===STEPS[ix][0]?' on':'')+(stepDone(STEPS[ix][0])?' done':''); }); }
function allDone(){ return STEPS.every(function(x){ return stepDone(x[0]); }); }
function renderNav(){
  var r=document.getElementById('navrow'); r.innerHTML='';
  if(state.cur>0){ var p=document.createElement('button'); p.className='btn sec'; p.textContent='← Previous sentence'; p.onclick=function(){ state.cur--; state.step='pos'; selWord=null; pending=null; saveState(); render(); }; r.appendChild(p); }
  if(!state.checked[state.cur]){
    var c=document.createElement('button'); c.className='btn'; c.id='check-btn'; c.textContent='Check this sentence'; c.disabled=!allDone(); c.onclick=checkSentence; r.appendChild(c);
    if(!allDone()){ var m=document.createElement('span'); m.style.fontSize='0.85rem'; m.style.color='#777'; m.textContent='Finish all 4 steps to check.'; r.appendChild(m); }
  } else {
    var last = state.cur===DATA.sentences.length-1;
    var n=document.createElement('button'); n.className='btn'; n.id='next-btn'; n.textContent= last ? 'See results' : 'Next sentence →'; n.onclick=goNext; r.appendChild(n);
  }
}
function renderFeedback(){
  var f=document.getElementById('fb'); f.innerHTML='';
  if(!state.checked[state.cur]) return;
  var it=items(state.cur), ok=it.filter(function(x){return x.ok;}).length;
  var html='<p><strong>'+ok+' of '+it.length+' correct in this sentence.</strong> Tap the steps above to see your marks (wrong words show the right label in red).</p><ul>';
  it.forEach(function(x){ if(x.ok) return; var what = x.kind==='word' ? '<b>'+S().tokens[x.idx][0]+'</b>' : (x.kind==='phrase' ? 'Prepositional phrase' : (x.kind==='subj' ? 'Subject' : (x.kind==='verb' ? 'Verb' : SELQ[x.key])));
    html+='<li><span class="x">✗</span> '+what+': you chose <em>'+esc(x.your)+'</em> → correct: <strong>'+esc(x.correct)+'</strong>. '+explain(state.cur,x)+'</li>'; });
  if(ok===it.length) html+='<li>Every item is correct. Great job!</li>';
  f.innerHTML=html+'</ul>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function checkSentence(){ if(!allDone()) return; state.checked[state.cur]=true; selWord=null; pending=null; saveState(); render(); }
function goNext(){
  if(state.showResults) return;
  if(state.cur < DATA.sentences.length-1){ state.cur++; state.step='pos'; saveState(); render(); return; }
  if(state.reported){ state.showResults=true; saveState(); render(); return; }
  state.showResults=true; incAttempts(); saveState(); render(); reportResult(); state.reported=true; saveState();
}
function showResultsNow(){ if(state.showResults) return; if(!state.checked.every(function(c){return c;})) return; goNext(); }
function fullNum(si,id){ /* keep-orig-num 2026-11-11: item number in the full (first-try) list */
  var keep=state.retry, n=0, hit=0; state.retry=null;
  for(var s=0;s<DATA.sentences.length && !hit;s++){ var L=items(s); for(var j=0;j<L.length;j++){ n++; if(s===si && L[j].id===id){ hit=n; break; } } }
  state.retry=keep; return hit; }
function totals(){ var c=0,t=0,wrong=[]; for(var si=0;si<DATA.sentences.length;si++){ items(si).forEach(function(it){ t++; if(it.ok) c++; else wrong.push([si,it]); }); } return {c:c,t:t,wrong:wrong}; }
function updateProgress(){ var tt=0, dn=0; for(var si=0;si<DATA.sentences.length;si++){ var a=state.ans[si]; words(si).forEach(function(i){ tt++; if(a.pos[i]) dn++; }); tt+=3; if(a.phrases.length) dn++; if(a.subj.length && a.verb.length) dn++; if(a.structure&&a.purpose&&a.pov&&a.tense) dn++; }
  document.getElementById('prog-text').textContent = state.showResults ? 'Done' : (dn+'/'+tt); document.getElementById('prog-fill').style.width = (state.showResults?100:Math.round(dn/tt*100))+'%'; }
function renderResults(){
  var T=totals(); document.getElementById('score-big').textContent=T.c+' / '+T.t;
  document.getElementById('score-detail').textContent = (state.retry ? 'Retry: ' : '') + Math.round(T.c/Math.max(1,T.t)*100) + '% correct';
  var h=''; if(T.wrong.length){ h='<p><strong>Items to review</strong></p><ul>'; T.wrong.forEach(function(w){ h+='<li>'+questionText(w[0],w[1])+'<br><span class="x">You: '+esc(w[1].your)+'</span> → <strong>'+esc(w[1].correct)+'</strong>. '+explain(w[0],w[1])+'</li>'; }); h+='</ul>'; } else h='<p class="center">Perfect! Every label is correct.</p>';
  document.getElementById('mistakes').innerHTML=h; document.getElementById('retry-btn').style.display = T.wrong.length ? 'inline-block' : 'none';
}
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function quizDateStr(){ return TODAY_STR; }
function reportResult(){
  try{
    var T=totals(), det=[], pos=[];
    T.wrong.forEach(function(w,k){ pos.push(fullNum(w[0],w[1].id)); det.push({ question: wrongTxt(questionText(w[0],w[1])), yourAnswer: wrongTxt(w[1].your), correctAnswer: wrongTxt(w[1].correct), explanation: wrongTxt(explain(w[0],w[1])) }); });
    var payload = { child:'Grant', quizTitle:TITLE, quizKey:QUIZ_KEY, attemptNumber:getAttempts(), correct:T.c, wrong:T.wrong.length, skipped:0, total:T.t,
      scorePercent: T.t>0 ? Math.round(T.c/T.t*1000)/10 : 0, wrongNumbers: pos.join(','), quizDate: quizDateStr() };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!state.retry && !ls(firstKey)){ payload.wrongAnswers = det; ls(firstKey,'1'); }
    fetch(REPORT_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(function(){});
  }catch(e){}
}
function answeredCount(){ var n=0; state.ans.forEach(function(a){ n+=Object.keys(a.pos).length + a.phrases.length + a.subj.length + a.verb.length + (a.structure?1:0)+(a.purpose?1:0)+(a.pov?1:0)+(a.tense?1:0); }); return n; }
function maybeProgress(){}
function sendProgress(){
  try{
    if(state.reported || state.retry) return; var n=answeredCount(); if(n===0 || n===state.lastProgress) return;
    var T=totals(), det=[]; T.wrong.forEach(function(w){ det.push({ question: wrongTxt(questionText(w[0],w[1])), yourAnswer: wrongTxt(w[1].your==='(not marked)'||w[1].your==='(not answered)' ? '(not answered)' : w[1].your), correctAnswer: wrongTxt(w[1].correct), explanation: wrongTxt(explain(w[0],w[1])) }); });
    var payload = { type:'progress', child:'Grant', quizTitle:TITLE, quizKey:QUIZ_KEY, quizDate:TODAY_STR, answered:n, total:T.t, correct:T.c, wrongAnswers:det };
    state.lastProgress=n; saveState();
    fetch(REPORT_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') sendProgress(); });
window.addEventListener('pagehide', sendProgress);
function startRetry(){
  var R=[], any=false;
  for(var si=0;si<DATA.sentences.length;si++){ var ids=[], a=state.ans[si], s=DATA.sentences[si];
    items(si).forEach(function(it){ if(it.ok) return; ids.push(it.id); any=true;
      if(it.kind==='word') delete a.pos[it.idx];
      else if(it.kind==='phrase') a.phrases = a.phrases.filter(function(m){ return !(m[0]<=it.ph[1] && m[1]>=it.ph[0]); });
      else if(it.kind==='subj') a.subj=[]; else if(it.kind==='verb') a.verb=[]; else a[it.key]=''; });
    R.push(ids); }
  if(!any) return;
  state.retry=R; state.checked=state.checked.map(function(){return false;}); state.cur=0; state.step='pos'; state.showResults=false; state.reported=false; saveState(); render();
}
function openFreshModal(){ document.getElementById('fresh-modal').className='modal-bg show'; }
function closeFreshModal(){ document.getElementById('fresh-modal').className='modal-bg'; }
function confirmFresh(){ state=newState(); saveState(); closeFreshModal(); selWord=null; pending=null; render(); }
window.startRetry=startRetry; window.openFreshModal=openFreshModal; window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.goNext=goNext; window.showResultsNow=showResultsNow; window.checkSentence=checkSentence; window.tapWord=tapWord; window.setLabel=setLabel;
render();
})();
</script>
