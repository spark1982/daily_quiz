<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261114";
var RAW_QUESTIONS = [{"stem": "<b>Part A</b><br>Why did New York City become the busiest port in the nation after 1825?", "opts": ["because wagons could finally travel on smooth new roads", "because Clinton poured Lake Erie water into the Atlantic Ocean", "because many Irish immigrants settled in New York City", "because the canal made shipping goods between the Great Lakes and the coast much cheaper"], "ci": 3, "exp": "The last paragraph links the two ideas: &ldquo;Shipping costs plunged by about ninety percent, and New York City soon became the busiest port.&rdquo; Cheaper shipping is the cause; the busy port is the effect.<br><b>Why not the others:</b> pouring the water was a celebration, not a reason for trade; the Irish workers dug the canal but are not given as the reason for the port; the passage never says roads improved.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A", "passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by hand, relying on shovels, horses, and occasionally gunpowder to blast through rock. Because the land rises about 570 feet between the Hudson and Lake Erie, engineers built 83 locks to lift boats up the slope one step at a time.<br><br>The canal opened on October 26, 1825, eight years after digging began. Clinton rode a boat from Buffalo to New York City and poured a barrel of Lake Erie water into the Atlantic Ocean. Shipping costs plunged by about ninety percent, and New York City soon became the busiest port in the nation."}, {"stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did New York City become the busiest port in the nation after 1825?&rdquo;)?<br><br><b>A.</b> &ldquo;shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself&rdquo;<br><b>B.</b> &ldquo;Critics mocked the plan as &lsquo;Clinton&rsquo;s Ditch&rsquo;&rdquo;<br><b>C.</b> &ldquo;Workers, many of them Irish immigrants, dug almost entirely by hand&rdquo;<br><b>D.</b> &ldquo;Shipping costs plunged by about ninety percent&rdquo;<br><b>E.</b> &ldquo;Clinton rode a boat from Buffalo to New York City&rdquo;<br><b>F.</b> &ldquo;engineers built 83 locks to lift boats up the slope&rdquo;", "opts": ["A and D", "A and F", "D and E", "C and D"], "ci": 0, "exp": "<b>A</b> shows how expensive shipping was <i>before</i> the canal, and <b>D</b> shows that the canal made it much cheaper. Together they prove the cause in Part A: cheaper shipping.<br><b>Why not the others:</b> <b>B</b> is about critics; <b>C</b> is about who did the digging; <b>E</b> is Clinton&rsquo;s celebration trip; <b>F</b> explains how the canal was built, not why the port grew. Each is true, but none shows that shipping got cheaper.<br><b>Tip for Part B:</b> the right evidence must prove <i>your Part A answer</i>, not just be a true fact from the passage.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A", "passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by hand, relying on shovels, horses, and occasionally gunpowder to blast through rock. Because the land rises about 570 feet between the Hudson and Lake Erie, engineers built 83 locks to lift boats up the slope one step at a time.<br><br>The canal opened on October 26, 1825, eight years after digging began. Clinton rode a boat from Buffalo to New York City and poured a barrel of Lake Erie water into the Atlantic Ocean. Shipping costs plunged by about ninety percent, and New York City soon became the busiest port in the nation."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Shipping costs dropped by about ninety percent.", "The canal was finished less than five years after digging began.", "The canal stretched 363 miles from Albany to Buffalo.", "Many of the workers were Irish immigrants."], "ci": 1, "exp": "The passage says the canal opened in 1825, &ldquo;eight years after digging began.&rdquo; Eight years is not less than five, so this statement is false. The other three choices match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by hand, relying on shovels, horses, and occasionally gunpowder to blast through rock. Because the land rises about 570 feet between the Hudson and Lake Erie, engineers built 83 locks to lift boats up the slope one step at a time.<br><br>The canal opened on October 26, 1825, eight years after digging began. Clinton rode a boat from Buffalo to New York City and poured a barrel of Lake Erie water into the Atlantic Ocean. Shipping costs plunged by about ninety percent, and New York City soon became the busiest port in the nation."}, {"stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Shipping goods by wagon was slow and very expensive.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> Engineers built 83 locks to lift boats up the slope.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> The land rises about 570 feet between the Hudson River and Lake Erie.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> New York City became the busiest port in the nation.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Critics believed the canal could never succeed.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> Governor Clinton persuaded the legislature to pay for a canal.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The canal made shipping goods about ninety percent cheaper.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> People mocked the plan as &ldquo;Clinton&rsquo;s Ditch.&rdquo;</td></tr></table>Which choice matches every cause with its correct effect?", "opts": ["1&ndash;C, 2&ndash;A, 3&ndash;D, 4&ndash;B", "1&ndash;D, 2&ndash;A, 3&ndash;C, 4&ndash;B", "1&ndash;A, 2&ndash;C, 3&ndash;D, 4&ndash;B", "1&ndash;A, 2&ndash;B, 3&ndash;C, 4&ndash;D", "1&ndash;C, 2&ndash;A, 3&ndash;B, 4&ndash;D"], "ci": 0, "exp": "<b>Test each pair with &ldquo;Because ___, ___.&rdquo;</b> The cause goes after <i>because</i>; the effect is what happened next.<br>&bull; <b>1&ndash;C:</b> Because wagons were slow and costly, Clinton pushed for a canal (the first paragraph starts with this problem).<br>&bull; <b>2&ndash;A:</b> Because the land rises 570 feet, engineers needed 83 locks to lift boats up the slope.<br>&bull; <b>3&ndash;D:</b> Because critics thought it would fail, they mocked it as &ldquo;Clinton&rsquo;s Ditch.&rdquo;<br>&bull; <b>4&ndash;B:</b> Because shipping became so much cheaper, New York City soon became the busiest port.<br><b>Watch out:</b> don&rsquo;t just match 1&ndash;A, 2&ndash;B, 3&ndash;C, 4&ndash;D in order. Read each cause, ask &ldquo;So what happened?&rdquo;, and find that effect.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A", "passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by hand, relying on shovels, horses, and occasionally gunpowder to blast through rock. Because the land rises about 570 feet between the Hudson and Lake Erie, engineers built 83 locks to lift boats up the slope one step at a time.<br><br>The canal opened on October 26, 1825, eight years after digging began. Clinton rode a boat from Buffalo to New York City and poured a barrel of Lake Erie water into the Atlantic Ocean. Shipping costs plunged by about ninety percent, and New York City soon became the busiest port in the nation."}, {"stem": "According to the passage, what allows a bat to build a detailed picture of its surroundings?", "opts": ["seeing clearly in the dark with its eyes", "listening for the buzzing sounds insects make", "comparing how quickly echoes return and how loud they are", "flying in loops around each object it finds"], "ci": 2, "exp": "The passage says, &ldquo;By comparing how quickly the echoes return and how loud they are, the bat&rsquo;s brain builds a detailed picture.&rdquo; The word <i>By</i> tells the cause (how it happens).<br><b>Why not the others:</b> the bat&rsquo;s eyes &ldquo;are not useless,&rdquo; but it relies on echolocation; flying in loops and listening for insects are not mentioned as the cause.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "passage": "<strong>How Bats See with Sound</strong><br>On a summer evening, a little brown bat can snatch hundreds of mosquitoes from the air in a single hour, even in near-total darkness. Its eyes are not useless, but it relies on a far more precise tool called echolocation. As the bat flies, it produces rapid, high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how quickly the echoes return and how loud they are, the bat&rsquo;s brain builds a detailed picture of its surroundings. A faint, delayed echo signals something distant, while a loud, quick echo warns of something close. As a bat closes in on an insect, its calls speed up to as many as two hundred per second, allowing it to track the target&rsquo;s every twist and turn.<br><br>Echolocation is so reliable that engineers studied it while developing sonar for ships and submarines. Today, scientists are exploring whether similar tools could help people who are blind move safely through unfamiliar streets."}, {"stem": "Which choice lists the steps of echolocation in the correct order?", "opts": ["The bat makes a call &rarr; an echo returns &rarr; the call strikes an object &rarr; the brain builds a picture", "The call strikes an object &rarr; the bat makes a call &rarr; the brain builds a picture &rarr; an echo returns", "The brain builds a picture &rarr; the bat makes a call &rarr; the call strikes an object &rarr; an echo returns", "The bat makes a call &rarr; the call strikes an object &rarr; an echo returns &rarr; the brain builds a picture"], "ci": 3, "exp": "The first paragraph gives the order: the bat &ldquo;produces &hellip; calls,&rdquo; then &ldquo;a call strikes an object&rdquo; and &ldquo;bounces back as an echo.&rdquo; Only after the echoes return can the brain compare them and &ldquo;build a detailed picture.&rdquo; An echo cannot return before the call hits something.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>How Bats See with Sound</strong><br>On a summer evening, a little brown bat can snatch hundreds of mosquitoes from the air in a single hour, even in near-total darkness. Its eyes are not useless, but it relies on a far more precise tool called echolocation. As the bat flies, it produces rapid, high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how quickly the echoes return and how loud they are, the bat&rsquo;s brain builds a detailed picture of its surroundings. A faint, delayed echo signals something distant, while a loud, quick echo warns of something close. As a bat closes in on an insect, its calls speed up to as many as two hundred per second, allowing it to track the target&rsquo;s every twist and turn.<br><br>Echolocation is so reliable that engineers studied it while developing sonar for ships and submarines. Today, scientists are exploring whether similar tools could help people who are blind move safely through unfamiliar streets."}, {"stem": "As it is used in the first paragraph, what does &ldquo;precise&rdquo; mean?", "opts": ["exact and accurate", "expensive and rare", "simple and old-fashioned", "loud and powerful"], "ci": 0, "exp": "The bat relies on &ldquo;a far more precise tool&rdquo; than its eyes &mdash; one that lets it snatch tiny insects in the dark. That means a tool that is exact and accurate. <i>Loud</i> describes the calls, not how exact the tool is.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>How Bats See with Sound</strong><br>On a summer evening, a little brown bat can snatch hundreds of mosquitoes from the air in a single hour, even in near-total darkness. Its eyes are not useless, but it relies on a far more precise tool called echolocation. As the bat flies, it produces rapid, high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how quickly the echoes return and how loud they are, the bat&rsquo;s brain builds a detailed picture of its surroundings. A faint, delayed echo signals something distant, while a loud, quick echo warns of something close. As a bat closes in on an insect, its calls speed up to as many as two hundred per second, allowing it to track the target&rsquo;s every twist and turn.<br><br>Echolocation is so reliable that engineers studied it while developing sonar for ships and submarines. Today, scientists are exploring whether similar tools could help people who are blind move safely through unfamiliar streets."}, {"stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margi       var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
