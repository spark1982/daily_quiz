<style>

  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar";
var INSTRUCTION = "Choose the correct answer for each item.";
var TODAY_STR = "20260921";
var RAW_QUESTIONS = [{"stem": "<div>Present: <b>learn</b> &rsaquo; Past: <b>learned</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["learn", "learning", "learnd", "learned"], "ci": 3, "exp": "'learn' is a regular verb. Its past participle is 'learned' (base + -ed). Past perfect: had learned.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "He called the plan perfect.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["the plan", "perfect"], "ci": 0, "exp": "\"The plan\" is the object (what was called). \"Perfect\" is the objective complement (the quality assigned).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "They are <u>students</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Students\" follows the linking verb \"are\" and renames the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The rest of the players waits on the bench during the timeout.", "The rest of the cake were eaten before we arrived at the party.", "The rest of the players wait on the bench during the timeout.", "The rest of the items on the list was checked off by the end of the day."], "ci": 2, "exp": "\"The rest of the players\" — players is plural, so \"wait\" is correct. \"Waits\" is singular — wrong. \"Cake\" is singular — use \"was eaten.\" \"Items\" is plural — use \"were.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "He <u>fry</u> eggs for breakfast.", "opts": ["fries", "frys", "fryes", "fryies"], "ci": 0, "exp": "fry → fries (consonant + y: drop -y, add -ies)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "She ________ a gold medal at the 2020 Olympics.", "opts": ["won", "has won"], "ci": 0, "exp": "At the 2020 Olympics is a specific finished event, so use simple past: won.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The professor's lecture was hard to follow.", "The snake shed it's skin in the sun.", "Theirs house is the one with the blue door.", "The apple's fell from the tree in the wind."], "ci": 0, "exp": "<strong>\"professor's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>Theirs</em> is a standalone pronoun; it cannot precede a noun. Use <em>their house</em>.<br>• <em>apple's</em> incorrectly adds an apostrophe to a simple plural noun.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "The elderly professor quietly entered the crowded lecture hall and immediately began his fascinating presentation.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADVERBS in this sentence, and only the adverbs?</span>", "opts": ["quietly, immediately", "immediately", "quietly", "quietly, immediately, crowded"], "ci": 0, "exp": "'Quietly' and 'immediately' are both adverbs.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "brave<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["braver / bravest", "braveer / braveest", "more brave / most brave", "bravere / braveste"], "ci": 0, "exp": "brave → braver / bravest (silent -e: drop -e, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>swim</b>?", "opts": ["swam", "swimmed", "swum", "swimed"], "ci": 0, "exp": "The past tense of <b>swim</b> is <b>swam</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["We are <b>camping</b> by the lake this weekend.", "Their favorite summer activity is <b>camping</b>.", "They were <b>camping</b> in the mountains last July.", "He will be <b>camping</b> with his troop in August."], "ci": 1, "exp": "In \"Their favorite summer activity is camping,\" \"camping\" renames the subject \"activity\" after the linking verb \"is\" - a subject complement - which makes it a gerund. In the other three sentences, \"camping\" follows \"are / were / will be\" and is part of the progressive verb tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The mouse is <b>squeaking</b> in its cage.", "The hinge was <b>squeaking</b> every time the door opened.", "<b>Squeaking</b> is a common sound in old houses.", "The <b>squeaking</b> mouse darted behind the fridge."], "ci": 3, "exp": "In \"The squeaking mouse darted behind the fridge,\" \"squeaking\" comes directly before the noun \"mouse\" and describes what the mouse is doing - this adjective use of an -ing word is a present participle. In \"The mouse is squeaking in its cage\" and \"The hinge was squeaking every time the door opened,\" \"squeaking\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Squeaking is a common sound in old houses,\" \"squeaking\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "The sunlight shone _____ the window and cast long shadows across the wooden floor.", "opts": ["through", "over", "past", "beneath"], "ci": 0, "exp": "\"Through\" means the light passed within and across the window opening. \"Over\" would mean the light went above the window rather than entering through it.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>species</b>?", "opts": ["specieses", "speciesies", "speciess", "species"], "ci": 3, "exp": "species → species (no change)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "Check your inbox; I <span style=\"text-decoration:underline;\">______</span> the report to you just now.", "opts": ["had sent", "have sent", "will have sent", "was sending"], "ci": 1, "exp": "\"have sent\" is present perfect — it was just sent and you can check it now.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "The mysterious package that arrived on our doorstep early Tuesday morning contained an old, handwritten map.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["The mysterious package", "our doorstep", "Tuesday morning", "an old map"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "She is <u>compete</u> in the swimming race.", "opts": ["competing", "competeing", "competring", "competed"], "ci": 0, "exp": "compete → competing (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "I _____ not finished reading the report yet.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. \"Yet\" is typically used with present perfect to show an incomplete action.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["The three branches of government are: the Legislative, the Executive, and the Judicial.", "The three branches of government are the legislative, the executive, and the judicial.", "The three branches of government are the Legislative, the Executive, and the Judicial.", "The three branches of government are: the legislative, the executive, and the judicial."], "ci": 2, "exp": "\"Legislative,\" \"Executive,\" and \"Judicial\" are proper nouns when referring to specific branches of the U.S. government. A colon should not follow \"are\" — when a verb leads directly into a list, no colon is needed.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["gorgeous gold Mexican bracelet", "gold gorgeous Mexican bracelet", "Mexican gorgeous gold bracelet", "gorgeous Mexican gold bracelet"], "ci": 0, "exp": "Correct order: opinion (gorgeous) → color (gold) → origin (Mexican) → noun\n✔ gorgeous gold Mexican bracelet", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The storm <b>damaged</b> the houses.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The houses ______ by the storm.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was damaged", "were damaged", "were damaging", "were damage"], "ci": 1, "exp": "The new subject \"the houses\" is plural and the action is in the past, so use were + the past participle \"damaged\": were damaged.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">I have not seen such a crowd since the last World Cup.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Not since the last World Cup I have seen such a crowd.", "Not since the last World Cup did I see such a crowd.", "Not since the last World Cup have I seen such a crowd.", "Not since the last World Cup had I seen such a crowd."], "ci": 2, "exp": "\"Not since\" triggers inversion. With present perfect: \"Not since the last World Cup + have + I + seen...\". The past participle \"seen\" follows. The correct form is: Not since the last World Cup have I seen such a crowd.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Even though the team worked very hard.", "Covered in mud from head to toe.", "The pilot landed the plane safely.", "During the most exciting part of the game."], "ci": 2, "exp": "\"The pilot landed the plane safely.\" is a complete sentence — subject: 'The pilot', predicate: 'landed'. The others are fragments: an 'Even though' clause, a participial phrase, and a prepositional phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "The coach showed them a new move.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["them", "a new move"], "ci": 0, "exp": "\"Them\" is the indirect object (who was shown). \"A new move\" is the direct object (what was shown).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}];
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;



loadState();
render();
</script>
</body>
</html>
