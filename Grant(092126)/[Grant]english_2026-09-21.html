, "opts": ["Personification, because the wind is given a human or animal-like action", "Simile, because two things are compared using \"like\" or \"as\"", "Hyperbole, because the sentence uses an extreme exaggeration", "Metaphor, because two unlike things are directly called the same thing"], "ci": 0, "exp": "Giving the wind the action of \"howling,\" something usually done by animals or people, is personification. The sentence does not use \"like\" or \"as,\" does not exaggerate, and does not call the wind something else entirely, so it is not a simile, hyperbole, or metaphor.", "tag": "Figurative Language", "tagcolor": "#185FA5", "passage": "Theo had planted his first tomato seedling only three weeks ago, and already it was taller than his hand. He checked on it every morning before school, along with the rest of the plants in the Riverbend Middle School garden club. The club had worked all spring to grow vegetables for the town's harvest fair, and the fair was only five days away.<br><br>Then, on Tuesday night, a strong storm rolled through town. Thunder shook the windows, and rain poured for hours. When Theo arrived at school the next morning, he found the garden in ruins. Stakes had fallen over, three tomato plants were snapped in half, and mud covered the little rows of lettuce.<br><br>Theo felt his stomach drop. He had wanted to show his grandmother, who used to grow vegetables in her own backyard, how much he had learned. Now the fair felt impossible.<br><br>His classmate Willa knelt beside him and picked up a bent stake. \"We still have five days,\" she said. \"That's enough time to fix most of this.\" Slowly, other club members arrived and began working too. They propped up the fallen plants, pulled out the ruined ones, and planted quick-growing radishes in the empty spots.<br><br>By Friday afternoon, the garden looked different but alive. Some rows were shorter, and a few new seedlings stood where tomatoes once grew. When Theo's grandmother visited the fair that weekend, she smiled at the neat rows and the small sign the club had made: \"Grown Together After the Storm.\" Theo realized the garden told a better story than a perfect one ever could."}, {"stem": "Choose the correct preposition to complete the sentence: \"Willa placed the bent stake ____ the wheelbarrow.\"", "opts": ["in", "at", "by", "from"], "ci": 0, "exp": "\"In\" correctly shows that the stake was placed inside the wheelbarrow. \"At,\" \"by,\" and \"from\" do not correctly describe placing something inside a container.", "tag": "Preposition Usage", "tagcolor": "#185FA5", "passage": "Theo had planted his first tomato seedling only three weeks ago, and already it was taller than his hand. He checked on it every morning before school, along with the rest of the plants in the Riverbend Middle School garden club. The club had worked all spring to grow vegetables for the town's harvest fair, and the fair was only five days away.<br><br>Then, on Tuesday night, a strong storm rolled through town. Thunder shook the windows, and rain poured for hours. When Theo arrived at school the next morning, he found the garden in ruins. Stakes had fallen over, three tomato plants were snapped in half, and mud covered the little rows of lettuce.<br><br>Theo felt his stomach drop. He had wanted to show his grandmother, who used to grow vegetables in her own backyard, how much he had learned. Now the fair felt impossible.<br><br>His classmate Willa knelt beside him and picked up a bent stake. \"We still have five days,\" she said. \"That's enough time to fix most of this.\" Slowly, other club members arrived and began working too. They propped up the fallen plants, pulled out the ruined ones, and planted quick-growing radishes in the empty spots.<br><br>By Friday afternoon, the garden looked different but alive. Some rows were shorter, and a few new seedlings stood where tomatoes once grew. When Theo's grandmother visited the fair that weekend, she smiled at the neat rows and the small sign the club had made: \"Grown Together After the Storm.\" Theo realized the garden told a better story than a perfect one ever could."}, {"stem": "What do Ivy and Omar have in common in how they experience rainy weekends?", "opts": ["Both of their weekend plans are directly affected by whether or not it rains.", "Both of them play soccer every weekend.", "Both of them dislike staying indoors.", "Both of them enjoy playing board games the most."], "ci": 0, "exp": "Rain changes what each of them expects to do that weekend, whether it means a cozy day inside for Ivy or a canceled soccer practice for Omar, even though their feelings about it are opposite. Only Omar plays soccer, Ivy does not dislike staying indoors, and board games are not shown to be either character's favorite activity.", "tag": "Paired Passage — Synthesis (Similarities)", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br>Ivy always smiled when she heard rain tapping on her window. To her, a rainy Saturday meant hot cocoa, a blanket fort in the living room, and hours of reading her favorite comic books without anyone asking her to go outside. She loved the sound of thunder rolling in the distance, safe and far away. Her little brother would often join her fort, and together they would invent silly stories about dragons hiding in the clouds. When the rain finally stopped, Ivy almost felt disappointed, already looking forward to the next storm.<br><br><strong>Passage B</strong><br>For Omar, rain meant one thing: his soccer practice would be canceled. He stood by the window, watching gray clouds roll in, and felt his shoulders slump. Rainy weekends stretched out long and boring in his mind, without the games he loved best. He tried reading a book, but he kept glancing outside, hoping the clouds might break apart. His mother suggested board games, and although he enjoyed beating his sister at checkers, it never quite replaced running across a muddy field with his teammates. By evening, Omar was already checking the weather for tomorrow."}, {"stem": "How does Omar's attitude toward rainy weekends differ from Ivy's?", "opts": ["Omar feels bored and disappointed when it rains, while Ivy feels cozy and excited.", "Omar loves rainy weekends just as much as Ivy does.", "Ivy dislikes rain because it cancels her soccer practice.", "Omar and Ivy both prefer sunny weekends over rainy ones."], "ci": 0, "exp": "Passage A shows Ivy looking forward to rain for cocoa and reading, while Passage B shows Omar feeling bored because rain cancels his soccer practice, so their attitudes toward rain are opposite. Omar does not love rain like Ivy, soccer is Omar's issue not Ivy's, and Ivy is never shown preferring sunny weekends.", "tag": "Paired Passage — Contrast (Differences)", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br>Ivy always smiled when she heard rain tapping on her window. To her, a rainy Saturday meant hot cocoa, a blanket fort in the living room, and hours of reading her favorite comic books without anyone asking her to go outside. She loved the sound of thunder rolling in the distance, safe and far away. Her little brother would often join her fort, and together they would invent silly stories about dragons hiding in the clouds. When the rain finally stopped, Ivy almost felt disappointed, already looking forward to the next storm.<br><br><strong>Passage B</strong><br>For Omar, rain meant one thing: his soccer practice would be canceled. He stood by the window, watching gray clouds roll in, and felt his shoulders slump. Rainy weekends stretched out long and boring in his mind, without the games he loved best. He tried reading a book, but he kept glancing outside, hoping the clouds might break apart. His mother suggested board games, and although he enjoyed beating his sister at checkers, it never quite replaced running across a muddy field with his teammates. By evening, Omar was already checking the weather for tomorrow."}];

      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;



loadState();
render();
</script>
</body>
</html>
