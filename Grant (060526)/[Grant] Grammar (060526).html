<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 6 Grammar Quiz – Set 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4fa; min-height: 100vh; padding: 0 0 40px; }
  #due-date { text-align: center; font-size: 2rem; font-weight: 800; color: #185FA5; background: #fff; padding: 14px 0 6px; }
  #quiz-title { text-align: center; font-size: 1.35rem; font-weight: 700; color: #333; background: #fff; padding: 0 0 14px; border-bottom: 2px solid #e0e8f4; }
  #dot-nav { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; padding: 14px 10px 10px; background: #fff; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #e0e8f4; }
  .dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #aab8cc; background: #e8edf4; color: #333; font-size: 0.78rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .dot.correct { background: #185FA5; border-color: #185FA5; color: #fff; }
  .dot.wrong { background: #E24B4A; border-color: #E24B4A; color: #fff; }
  .dot.current { box-shadow: 0 0 0 3px #185FA530; }
  .dot.results-pill { width: auto; border-radius: 16px; padding: 0 14px; font-size: 0.8rem; background: #185FA5; color: #fff; border-color: #185FA5; }
  #quiz-screen { display: none; max-width: 680px; margin: 0 auto; padding: 18px 12px 0; }
  #q-counter { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
  #type-badge { display: inline-block; background: #185FA5; color: #fff; font-size: 0.75rem; font-weight: 700; border-radius: 12px; padding: 3px 13px; margin-bottom: 10px; }
  #q-text { font-size: 1.08rem; font-weight: 600; color: #1a2540; line-height: 1.6; margin-bottom: 18px; background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 6px #185fa510; }
  .option-btn { display: block; width: 100%; text-align: left; padding: 13px 16px; margin-bottom: 10px; border-radius: 10px; font-size: 1rem; font-weight: 500; cursor: pointer; border: 2px solid transparent; background: #e8edf4; color: #111111; transition: all .13s; }
  .option-btn:active { transform: scale(.98); }
  .option-btn.correct { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .option-btn.wrong   { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
  .option-btn.reveal  { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  #explanation { background: #fffbe6; border-left: 4px solid #f0b429; border-radius: 8px; padding: 11px 14px; font-size: 0.93rem; color: #5a4200; margin-top: 4px; margin-bottom: 10px; display: none; line-height: 1.5; }
  #nav-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .nav-btn { padding: 11px 28px; border-radius: 10px; font-size: 1rem; font-weight: 700; border: none; cursor: pointer; }
  #prev-btn { background: #e8edf4; color: #185FA5; }
  #next-btn { background: #185FA5; color: #fff; }
  #results-screen { display: none; max-width: 680px; margin: 0 auto; padding: 18px 12px; }
  #score-box { background: #fff; border-radius: 14px; padding: 22px 18px 16px; text-align: center; box-shadow: 0 2px 10px #185fa514; margin-bottom: 16px; }
  #score-text { font-size: 2rem; font-weight: 800; color: #185FA5; }
  #score-label { font-size: 1rem; color: #666; margin-top: 4px; }
  #results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 9px; margin-bottom: 18px; }
  .result-card { background: #fff; border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; box-shadow: 0 1px 5px #185fa510; border: 2px solid transparent; }
  .result-card.r-correct { border-color: #1D9E75; }
  .result-card.r-wrong   { border-color: #E24B4A; }
  .result-card.r-skipped { border-color: #aab8cc; }
  .result-card .rc-num { font-size: 0.78rem; color: #888; font-weight: 600; margin-bottom: 3px; }
  .result-card .rc-status { font-size: 0.85rem; font-weight: 700; }
  .r-correct .rc-status { color: #1D9E75; }
  .r-wrong .rc-status   { color: #E24B4A; }
  .r-skipped .rc-status { color: #888; }
  .result-card .rc-correct-ans { font-size: 0.76rem; color: #555; margin-top: 4px; line-height: 1.35; }
  #results-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
  .res-btn { padding: 11px 22px; border-radius: 10px; font-size: 0.95rem; font-weight: 700; border: none; cursor: pointer; }
  #copy-btn  { background: #e8edf4; color: #185FA5; }
  #fresh-btn { background: #E24B4A; color: #fff; }
  #retry-btn { background: #185FA5; color: #fff; }
  #wrong-screen { display: none; max-width: 680px; margin: 0 auto; padding: 18px 12px 0; }
  #wrong-counter { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
  #modal-overlay { display: none; position: fixed; inset: 0; background: #0006; z-index: 999; align-items: center; justify-content: center; }
  #modal-overlay.show { display: flex; }
  #modal-box { background: #fff; border-radius: 14px; padding: 28px 24px 20px; max-width: 320px; width: 90%; text-align: center; }
  #modal-box h3 { font-size: 1.1rem; margin-bottom: 10px; color: #1a2540; }
  #modal-box p { font-size: 0.93rem; color: #555; margin-bottom: 20px; }
  #modal-btns { display: flex; gap: 10px; justify-content: center; }
  #modal-cancel  { padding: 10px 22px; border-radius: 8px; border: 2px solid #aab8cc; background: #e8edf4; color: #333; font-weight: 700; cursor: pointer; }
  #modal-confirm { padding: 10px 22px; border-radius: 8px; border: none; background: #E24B4A; color: #fff; font-weight: 700; cursor: pointer; }
  @media (max-width: 480px) {
    #due-date { font-size: 1.4rem; }
    #quiz-title { font-size: 1.1rem; }
    .option-btn { font-size: 0.95rem; padding: 12px 13px; }
    #score-text { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div id="due-date">&#128197; Due: June 4, 2026</div>
<div id="quiz-title">Grade 6 Grammar Quiz \u2013 Set 3</div>
<div id="dot-nav"></div>

<div id="quiz-screen">
  <div id="q-counter"></div>
  <div style="margin-bottom:6px;"><span id="type-badge"></span></div>
  <div id="q-text"></div>
  <div id="options-area"></div>

  <div id="nav-row">
    <button class="nav-btn" id="prev-btn" onclick="goTo(state.cur-1)">&#8592; Prev</button>

<div id="results-screen">
  <div id="score-box">
    <div id="score-text"></div>
    <div id="score-label">Quiz Complete!</div>
  </div>
  <div id="results-grid"></div>
  <div id="results-btns">
    <button class="res-btn" id="copy-btn"  onclick="copyResults()">&#128203; Copy All Results</button>
    <button class="res-btn" id="retry-btn" onclick="startRetry()">&#128257; Retry Wrong Only</button>
    <button class="res-btn" id="fresh-btn" onclick="openFreshModal()">&#128260; Start Fresh</button>

</div>

<div id="wrong-screen">
  <div id="wrong-counter"></div>
  <div style="margin-bottom:6px;"><span id="wrong-type-badge" style="display:inline-block;background:#185FA5;color:#fff;font-size:.75rem;font-weight:700;border-radius:12px;padding:3px 13px;margin-bottom:10px;"></span></div>
  <div id="wrong-q-text" style="font-size:1.08rem;font-weight:600;color:#1a2540;line-height:1.6;margin-bottom:18px;background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 6px #185fa510;"></div>
  <div id="wrong-options-area"></div>
  <div id="wrong-explanation" style="background:#fffbe6;border-left:4px solid #f0b429;border-radius:8px;padding:11px 14px;font-size:.93rem;color:#5a4200;margin-top:4px;margin-bottom:10px;display:none;line-height:1.5;"></div>
  <div id="wrong-nav-row" style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
    <button class="nav-btn" id="wrong-prev-btn" onclick="wrongGoTo(wState.cur-1)">&#8592; Prev</button>
    <button class="nav-btn" id="wrong-next-btn" onclick="wrongNextOrResults()">Next &#8594;</button>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal-box">
    <h3>Start Fresh?</h3>
    <p>All your progress will be erased. This cannot be undone.</p>
    <div id="modal-btns">
      <button id="modal-cancel"  onclick="closeFreshModal()">Cancel</button>
      <button id="modal-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>

<script>
var QUESTIONS = [

  // ── Q1  Irregular Noun Plural ──────────────────────────────────────────────
  {
    type: "Irregular Noun Plural",
    q: "Which option shows the CORRECT singular and plural forms of an irregular noun?",
    options: [
      "cactus \u2192 cactuses",
      "crisis \u2192 crisises",
      "fungus \u2192 fungie",
      "radius \u2192 radii"
    ],
    ci: 3,
    exp: "\"Radius \u2192 radii\" is correct. Many nouns borrowed from Latin ending in -us form their plural with -i. \"Cactus\" can become \"cacti\" (not \"cactuses\" in formal use), \"crisis \u2192 crises,\" and \"fungus \u2192 fungi.\""
  },

  // ── Q2  Irregular Noun Plural ──────────────────────────────────────────────
  {
    type: "Irregular Noun Plural",
    q: "Which option shows the CORRECT singular and plural forms of an irregular noun?",
    options: [
      "louse \u2192 louses",
      "goose \u2192 gooses",
      "moose \u2192 mooses",
      "louse \u2192 lice"
    ],
    ci: 3,
    exp: "\"Louse \u2192 lice\" is correct \u2014 the vowel changes irregularly. \"Goose \u2192 geese\" (not gooses), and \"moose\" stays \"moose\" as a zero plural. Not all -oose words follow the same pattern."
  },

  // ── Q3  Irregular Past Tense ───────────────────────────────────────────────
  {
    type: "Irregular Past Tense",
    q: "Which option shows the CORRECT base form and simple past tense of an irregular verb?",
    options: [
      "sink \u2192 sinked",
      "ring \u2192 ringed",
      "spring \u2192 sprang",
      "sing \u2192 singed"
    ],
    ci: 2,
    exp: "\"Spring \u2192 sprang\" is correct. Sink \u2192 sank, ring \u2192 rang, sing \u2192 sang. These verbs all change the vowel in the past tense \u2014 none of them add -ed."
  },

  // ── Q4  Irregular Past Tense ───────────────────────────────────────────────
  {
    type: "Irregular Past Tense",
    q: "Which option shows the CORRECT base form and simple past tense of an irregular verb?",
    options: [
      "freeze \u2192 freezed",
      "choose \u2192 choosed",
      "lose \u2192 losed",
      "bite \u2192 bit"
    ],
    ci: 3,
    exp: "\"Bite \u2192 bit\" is correct. Freeze \u2192 froze, choose \u2192 chose, lose \u2192 lost. All are irregular and none use -ed for the simple past."
  },

  // ── Q5  3rd Person Singular ────────────────────────────────────────────────
  {
    type: "3rd Person Singular",
    q: "Which option shows the CORRECT base form and third-person singular present tense?",
    options: [
      "pass \u2192 passs",
      "scratch \u2192 scratchs",
      "guess \u2192 guesses",
      "march \u2192 marchs"
    ],
    ci: 2,
    exp: "\"Guess \u2192 guesses\" is correct. Verbs ending in -s, -ss, -sh, -ch, or -x add -es. Pass \u2192 passes, scratch \u2192 scratches, march \u2192 marches."
  },

  // ── Q6  3rd Person Singular ────────────────────────────────────────────────
  {
    type: "3rd Person Singular",
    q: "Which option shows the CORRECT base form and third-person singular present tense?",
    options: [
      "destroy \u2192 destroies",
      "supply \u2192 supplys",
      "obey \u2192 obeies",
      "deny \u2192 denies"
    ],
    ci: 3,
    exp: "\"Deny \u2192 denies\" is correct. \"Deny\" ends in consonant + y, so change y to i and add -es. \"Destroy\" and \"obey\" end in vowel + y, so just add -s: destroys, obeys. Supply \u2192 supplies."
  },

  // ── Q7  Progressive Irregular -ing ────────────────────────────────────────
  {
    type: "Progressive (Irregular -ing)",
    q: "Which option shows the CORRECT base form and present progressive (-ing) form of a verb with an irregular spelling change?",
    options: [
      "open \u2192 openning",
      "dance \u2192 danceing",
      "begin \u2192 begining",
      "wrap \u2192 wrapping"
    ],
    ci: 3,
    exp: "\"Wrap \u2192 wrapping\" is correct. \"Wrap\" ends in CVC (consonant-vowel-consonant), so double the final consonant. Open \u2192 opening (two syllables, stress on first \u2014 no doubling), dance \u2192 dancing (drop silent -e), begin \u2192 beginning (double n, stress on second syllable)."
  },

  // ── Q8  Possessive Forms ───────────────────────────────────────────────────
  {
    type: "Possessive Forms",
    q: "Which sentence uses possessive forms CORRECTLY?",
    options: [
      "The mens' locker room is down the hall from the womens' gym.",
      "Each of the puppies' collars had it's owner's name on it.",
      "The two countries' leaders met to discuss their nations' trade deal.",
      "Everybody's invited to Charles' party at his parent's house."
    ],
    ci: 2,
    exp: "Option C is correct. \"Countries'\" and \"nations'\" are plural possessives (add apostrophe after -s). \"Men's\" and \"women's\" are irregular plurals (add 's). \"Its\" (no apostrophe) is possessive; \"it's\" means \"it is.\" \"Parents'\" needs an apostrophe after the s since both parents own the house."
  },

  // ── Q9  Capitalization & Punctuation ──────────────────────────────────────
  {
    type: "Capitalization & Punctuation",
    q: "The sentence below is written without capitals or punctuation. Which answer is written CORRECTLY?\n\n[ my aunt helen said the golden gate bridge in san francisco is the most beautiful bridge she has ever seen ]",
    options: [
      "My aunt helen said the Golden Gate bridge in San francisco is the most beautiful bridge she has ever seen.",
      "My aunt Helen said the Golden Gate Bridge in San Francisco is the most beautiful bridge she has ever seen.",
      "My Aunt Helen said the golden gate bridge in San Francisco is the most beautiful bridge she has ever seen.",
      "my aunt Helen said the Golden Gate Bridge in san Francisco is the most beautiful bridge she has ever seen."
    ],
    ci: 1,
    exp: "Option B is correct. The sentence starts with a capital. \"Helen\" is a proper name, \"Golden Gate Bridge\" and \"San Francisco\" are proper nouns \u2014 all must be capitalized. \"Aunt\" here is used with a name as a title, so it is capitalized. The sentence ends with a period."
  },

  // ── Q10  Irregular Comparatives & Superlatives ────────────────────────────
  {
    type: "Irregular Comparatives & Superlatives",
    q: "Which option shows the CORRECT comparative and superlative forms of the word \"many\"?",
    options: [
      "many \u2192 more many \u2192 most many",
      "many \u2192 manyer \u2192 manyest",
      "many \u2192 more \u2192 most",
      "many \u2192 much \u2192 most"
    ],
    ci: 2,
    exp: "\"Many\" is irregular: many \u2192 more \u2192 most. For example: \"She has more books than I do\" and \"He has the most stamps in the class.\" \"Manyer\" and \"more many\" are not correct English forms."
  },

  // ── Q11-15 share this sentence ────────────────────────────────────────────
  // "The patient art teacher gently showed the struggling beginners a simple drawing technique during the afternoon class."
  // Subject: The patient art teacher
  // Verb: showed
  // Indirect Object: the struggling beginners
  // Direct Object: a simple drawing technique
  // Complete Predicate: gently showed the struggling beginners a simple drawing technique during the afternoon class

  // ── Q11  Sentence Components: Complete Subject ────────────────────────────
  {
    type: "Sentence Components",
    q: "Use the sentence below to answer questions 11\u201315.\n\n\"The patient art teacher gently showed the struggling beginners a simple drawing technique during the afternoon class.\"\n\nWhat is the COMPLETE SUBJECT of this sentence?",
    options: [
      "gently showed",
      "the struggling beginners",
      "a simple drawing technique",
      "The patient art teacher"
    ],
    ci: 3,
    exp: "The complete subject tells us WHO or WHAT the sentence is about, including all describing words. \"The patient art teacher\" tells us WHO showed the technique \u2014 it is the complete subject."
  },

  // ── Q12  Sentence Components: Verb ────────────────────────────────────────
  {
    type: "Sentence Components",
    q: "Use the sentence below to answer questions 11\u201315.\n\n\"The patient art teacher gently showed the struggling beginners a simple drawing technique during the afternoon class.\"\n\nWhat is the VERB (action word) of this sentence?",
    options: [
      "patient",
      "showed",
      "gently",
      "simple"
    ],
    ci: 1,
    exp: "The verb is the action word of the sentence. \"Showed\" is what the teacher did \u2014 it is the main verb. \"Patient\" and \"simple\" are adjectives, and \"gently\" is an adverb."
  },

  // ── Q13  Sentence Components: Indirect Object ─────────────────────────────
  {
    type: "Sentence Components",
    q: "Use the sentence below to answer questions 11\u201315.\n\n\"The patient art teacher gently showed the struggling beginners a simple drawing technique during the afternoon class.\"\n\nWhat is the INDIRECT OBJECT of this sentence?",
    options: [
      "a simple drawing technique",
      "during the afternoon class",
      "the struggling beginners",
      "The patient art teacher"
    ],
    ci: 2,
    exp: "The indirect object answers TO WHOM or FOR WHOM the action was done. The teacher showed the technique TO WHOM? \u2014 to \"the struggling beginners.\" It comes between the verb and the direct object."
  },

  // ── Q14  Sentence Components: Direct Object ───────────────────────────────
  {
    type: "Sentence Components",
    q: "Use the sentence below to answer questions 11\u201315.\n\n\"The patient art teacher gently showed the struggling beginners a simple drawing technique during the afternoon class.\"\n\nWhat is the DIRECT OBJECT of this sentence?",
    options: [
      "the struggling beginners",
      "during the afternoon class",
      "The patient art teacher",
      "a simple drawing technique"
    ],
    ci: 3,
    exp: "The direct object receives the action of the verb. Ask \"showed WHAT?\" \u2014 the answer is \"a simple drawing technique.\" \"The struggling beginners\" is the indirect object (showed TO whom)."
  },

  // ── Q15  Sentence Components: Complete Predicate ──────────────────────────
  {
    type: "Sentence Components",
    q: "Use the sentence below to answer questions 11\u201315.\n\n\"The patient art teacher gently showed the struggling beginners a simple drawing technique during the afternoon class.\"\n\nWhat is the COMPLETE PREDICATE of this sentence?",
    options: [
      "The patient art teacher",
      "a simple drawing technique during the afternoon class",
      "gently showed the struggling beginners a simple drawing technique during the afternoon class",
      "the struggling beginners a simple drawing technique"
    ],
    ci: 2,
    exp: "The complete predicate includes the verb and everything connected to it. \"Gently showed the struggling beginners a simple drawing technique during the afternoon class\" tells us everything the subject DID \u2014 that is the complete predicate."
  },

  // ── Q16-20 share this sentence ────────────────────────────────────────────
  // "The cheerful old baker always hummed softly while mixing fresh dough in the warm kitchen."
  // cheerful = adjective (modifies baker)
  // always = adverb (modifies hummed)
  // softly = adverb (modifies hummed)
  // fresh = adjective (modifies dough)
  // in = preposition

  // ── Q16  Parts of Speech: Adjective (cheerful) ────────────────────────────
  {
    type: "Parts of Speech",
    q: "Use the sentence below to answer questions 16\u201320.\n\n\"The cheerful old baker always hummed softly while mixing fresh dough in the warm kitchen.\"\n\nWhat part of speech is the word \"cheerful\"?",
    options: [
      "Verb",
      "Adverb",
      "Noun",
      "Adjective"
    ],
    ci: 3,
    exp: "\"Cheerful\" describes the noun \"baker\" \u2014 it tells us what kind of baker. A word that modifies a noun is an adjective."
  },

  // ── Q17  Parts of Speech: Adverb (always) ─────────────────────────────────
  {
    type: "Parts of Speech",
    q: "Use the sentence below to answer questions 16\u201320.\n\n\"The cheerful old baker always hummed softly while mixing fresh dough in the warm kitchen.\"\n\nWhat part of speech is the word \"always\"?",
    options: [
      "Adverb",
      "Adjective",
      "Conjunction",
      "Preposition"
    ],
    ci: 0,
    exp: "\"Always\" modifies the verb \"hummed\" \u2014 it tells us HOW OFTEN the baker hummed. A word that modifies a verb, adjective, or another adverb is an adverb. Frequency words like always, never, often, and sometimes are adverbs."
  },

  // ── Q18  Parts of Speech: Adjective (fresh) ───────────────────────────────
  {
    type: "Parts of Speech",
    q: "Use the sentence below to answer questions 16\u201320.\n\n\"The cheerful old baker always hummed softly while mixing fresh dough in the warm kitchen.\"\n\nWhat part of speech is the word \"fresh\"?",
    options: [
      "Adjective",
      "Adverb",
      "Noun",
      "Verb"
    ],
    ci: 0,
    exp: "\"Fresh\" describes the noun \"dough\" \u2014 it tells us what kind of dough. A word that modifies a noun is an adjective."
  },

  // ── Q19  Parts of Speech: Preposition (in) ────────────────────────────────
  {
    type: "Parts of Speech",
    q: "Use the sentence below to answer questions 16\u201320.\n\n\"The cheerful old baker always hummed softly while mixing fresh dough in the warm kitchen.\"\n\nWhat part of speech is the word \"in\"?",
    options: [
      "Adverb",
      "Conjunction",
      "Preposition",
      "Adjective"
    ],
    ci: 2,
    exp: "\"In\" introduces the phrase \"in the warm kitchen\" and shows WHERE the mixing happened. A word that links a noun to the rest of the sentence by showing a relationship of place, time, or direction is a preposition."
  },

  // ── Q20  Parts of Speech: Conjunction (while) ─────────────────────────────
  {
    type: "Parts of Speech",
    q: "Use the sentence below to answer questions 16\u201320.\n\n\"The cheerful old baker always hummed softly while mixing fresh dough in the warm kitchen.\"\n\nWhat part of speech is the word \"while\"?",
    options: [
      "Preposition",
      "Adverb",
      "Noun",
      "Conjunction"
    ],
    ci: 3,
    exp: "\"While\" connects the main action (hummed) with a second action happening at the same time (mixing dough). A word that joins clauses or phrases together is a conjunction. \"While\" is a subordinating conjunction showing that two actions happen at the same time."
  }

];

// ── STATE ──────────────────────────────────────────────────────────────────
var STORAGE_KEY = 'g6gram_set3_v1';
var state = { answers: {}, shuffles: {}, cur: 0, showResults: false };

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (typeof s.cur !== 'number' || s.cur < 0 || s.cur >= QUESTIONS.length ||
        typeof s.answers !== 'object' || typeof s.shuffles !== 'object') {
      localStorage.removeItem(STORAGE_KEY); return;
    }
    state = s;
  } catch(e) { try { localStorage.removeItem(STORAGE_KEY); } catch(e2) {} }
}

function getShuffleOrder(qi) {
  if (!state.shuffles[qi]) {
    var order = [0,1,2,3];
    for (var i = 3; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    state.shuffles[qi] = order;
    saveState();
  }
  return state.shuffles[qi];
}

function getShuffledCorrectIdx(qi) {
  return getShuffleOrder(qi).indexOf(QUESTIONS[qi].ci);
}

function render() {
  try {
    document.getElementById('quiz-screen').style.display    = 'none';
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('wrong-screen').style.display   = 'none';
    renderDotNav();
    if (state.showResults) {
      document.getElementById('results-screen').style.display = 'block';
      renderResults();
    } else {
      document.getElementById('quiz-screen').style.display = 'block';
      renderQuestion();
    }
  } catch(e) {
    document.body.innerHTML += '<div style="padding:20px;color:red;font-weight:bold;">Error: ' + e.message + '</div>';
  }
}

function renderDotNav() {
  var nav = document.getElementById('dot-nav');
  nav.innerHTML = '';
  for (var qi = 0; qi < QUESTIONS.length; qi++) {
    (function(qi) {
      var d = document.createElement('div');
      d.className = 'dot';
      d.textContent = qi + 1;
      if (state.answers.hasOwnProperty(qi)) {
        d.classList.add(state.answers[qi] === getShuffledCorrectIdx(qi) ? 'correct' : 'wrong');
      }
      if (!state.showResults && qi === state.cur) d.classList.add('current');
      d.onclick = function() {
        if (state.showResults) { state.showResults = false; saveState(); }
        state.cur = qi; saveState(); render();
      };
      nav.appendChild(d);
    })(qi);
  }
  if (state.showResults) {
    var pill = document.createElement('div');
    pill.className = 'dot results-pill';
    pill.textContent = 'Results';
    nav.appendChild(pill);
  }
}

function renderQuestion() {
  var qi = state.cur;
  var q  = QUESTIONS[qi];
  document.getElementById('q-counter').textContent = 'Question ' + (qi+1) + ' / ' + QUESTIONS.length;
  document.getElementById('type-badge').textContent = q.type;
  document.getElementById('q-text').innerHTML = q.q.replace(/\n/g, '<br>');

  var order    = getShuffleOrder(qi);
  var area     = document.getElementById('options-area');
  area.innerHTML = '';
  var answered  = state.answers.hasOwnProperty(qi);
  var correctSh = getShuffledCorrectIdx(qi);

  for (var si = 0; si < order.length; si++) {
    (function(si) {
      var origIdx = order[si];
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = q.options[origIdx];
      if (answered) {
        var chosen = state.answers[qi];
        if (si === correctSh)   btn.classList.add(si === chosen ? 'correct' : 'reveal');
        else if (si === chosen) btn.classList.add('wrong');
        btn.disabled = true;
      } else {
        btn.onclick = function() { answerQ(qi, si); };
      }
      area.appendChild(btn);
    })(si);
  }

  var expEl = document.getElementById('explanation');
  if (answered && state.answers[qi] !== correctSh) {
    expEl.style.display = 'block';
    expEl.innerHTML = '&#128221; ' + q.exp;
  } else {
    expEl.style.display = 'none';
  }

  document.getElementById('prev-btn').style.display = (qi === 0) ? 'none' : 'inline-block';
  document.getElementById('next-btn').textContent =
    (qi === QUESTIONS.length - 1) ? 'See Results \u2192' : 'Next \u2192';
}

function answerQ(qi, si) {
  state.answers[qi] = si;
  saveState();
  render();
}

function goTo(qi) {
  if (qi < 0 || qi >= QUESTIONS.length) return;
  state.cur = qi; saveState(); render();
}

function nextOrResults() {
  if (state.cur === QUESTIONS.length - 1) {
    state.showResults = true; saveState(); render();
  } else {
    goTo(state.cur + 1);
  }
}

function renderResults() {
  try {
    var correct = 0;
    for (var qi = 0; qi < QUESTIONS.length; qi++) {
      if (state.answers.hasOwnProperty(qi) && state.answers[qi] === getShuffledCorrectIdx(qi)) correct++;
    }
    document.getElementById('score-text').textContent  = correct + ' / ' + QUESTIONS.length;
    document.getElementById('score-label').textContent = 'Quiz Complete!';
    var grid = document.getElementById('results-grid');
    grid.innerHTML = '';
    for (var qi2 = 0; qi2 < QUESTIONS.length; qi2++) {
      (function(qi2) {
        var q = QUESTIONS[qi2];
        var answered  = state.answers.hasOwnProperty(qi2);
        var isCorrect = answered && state.answers[qi2] === getShuffledCorrectIdx(qi2);
        var card = document.createElement('div');
        card.className = 'result-card ' + (answered ? (isCorrect ? 'r-correct' : 'r-wrong') : 'r-skipped');
        card.innerHTML =
          '<div class="rc-num">Q' + (qi2+1) + ' \u00b7 ' + q.type + '</div>' +
          '<div class="rc-status">' + (answered ? (isCorrect ? '\u2705 Correct' : '\u274c Wrong') : '\u23ed Skipped') + '</div>' +
          (!isCorrect ? '<div class="rc-correct-ans">\u2714 ' + q.options[q.ci] + '</div>' : '');
        card.onclick = function() { state.showResults = false; state.cur = qi2; saveState(); render(); };
        grid.appendChild(card);
      })(qi2);
    }
  } catch(e) {
    document.getElementById('results-screen').innerHTML += '<div style="color:red;padding:12px;">Results error: ' + e.message + '</div>';
  }
}

function copyResults() {
  var text = 'Grade 6 Grammar Quiz Set 3 Results\n---\n';
  var correct = 0;
  for (var qi = 0; qi < QUESTIONS.length; qi++) {
    var answered  = state.answers.hasOwnProperty(qi);
    var isCorrect = answered && state.answers[qi] === getShuffledCorrectIdx(qi);
    if (isCorrect) correct++;
    text += 'Q' + (qi+1) + ' [' + QUESTIONS[qi].type + ']: ' + (answered ? (isCorrect ? 'Correct' : 'Wrong') : 'Skipped') + '\n';
  }
  text += '---\nScore: ' + correct + ' / ' + QUESTIONS.length;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { alert('Results copied!'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      alert('Results copied!');
    }
  } catch(e) { alert('Copy failed. Please copy manually.'); }
}

var wState = { wrongQis: [], cur: 0, answers: {}, shuffles: {} };

function startRetry() {
  var wqs = [];
  for (var qi = 0; qi < QUESTIONS.length; qi++) {
    if (!state.answers.hasOwnProperty(qi) || state.answers[qi] !== getShuffledCorrectIdx(qi)) wqs.push(qi);
  }
  if (wqs.length === 0) { alert('No wrong or skipped questions!'); return; }
  wState = { wrongQis: wqs, cur: 0, answers: {}, shuffles: {} };
  for (var wi = 0; wi < wqs.length; wi++) {
    var order = [0,1,2,3];
    for (var i = 3; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    wState.shuffles[wi] = order;
  }
  document.getElementById('quiz-screen').style.display    = 'none';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('wrong-screen').style.display   = 'block';
  renderWrongQ();
}

function getWrongCorrectSh(wi) {
  return wState.shuffles[wi].indexOf(QUESTIONS[wState.wrongQis[wi]].ci);
}

function renderWrongQ() {
  try {
    var wi = wState.cur;
    var qi = wState.wrongQis[wi];
    var q  = QUESTIONS[qi];
    document.getElementById('wrong-counter').textContent = 'Wrong Review: ' + (wi+1) + ' / ' + wState.wrongQis.length;
    document.getElementById('wrong-type-badge').textContent = q.type;
    document.getElementById('wrong-q-text').innerHTML = q.q.replace(/\n/g, '<br>');
    var order    = wState.shuffles[wi];
    var area     = document.getElementById('wrong-options-area');
    area.innerHTML = '';
    var answered  = wState.answers.hasOwnProperty(wi);
    var correctSh = getWrongCorrectSh(wi);
    for (var si = 0; si < order.length; si++) {
      (function(si) {
        var origIdx = order[si];
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = q.options[origIdx];
        if (answered) {
          var chosen = wState.answers[wi];
          if (si === correctSh)   btn.classList.add(si === chosen ? 'correct' : 'reveal');
          else if (si === chosen) btn.classList.add('wrong');
          btn.disabled = true;
        } else {
          btn.onclick = function() { wState.answers[wi] = si; renderWrongQ(); };
        }
        area.appendChild(btn);
      })(si);
    }
    var expEl = document.getElementById('wrong-explanation');
    if (answered && wState.answers[wi] !== correctSh) {
      expEl.style.display = 'block';
      expEl.innerHTML = '&#128221; ' + q.exp;
    } else {
      expEl.style.display = 'none';
    }
    document.getElementById('wrong-prev-btn').style.display = (wi === 0) ? 'none' : 'inline-block';
    document.getElementById('wrong-next-btn').textContent =
      (wi === wState.wrongQis.length - 1) ? 'See Results \u2192' : 'Next \u2192';
  } catch(e) {
    document.getElementById('wrong-screen').innerHTML += '<div style="color:red;padding:12px;">Error: ' + e.message + '</div>';
  }
}

function wrongGoTo(wi) {
  if (wi < 0 || wi >= wState.wrongQis.length) return;
  wState.cur = wi; renderWrongQ();
}

function wrongNextOrResults() {
  if (wState.cur === wState.wrongQis.length - 1) { showWrongResults(); }
  else { wrongGoTo(wState.cur + 1); }
}

function showWrongResults() {
  var correct = 0;
  for (var wi = 0; wi < wState.wrongQis.length; wi++) {
    if (wState.answers.hasOwnProperty(wi) && wState.answers[wi] === getWrongCorrectSh(wi)) correct++;
  }
  document.getElementById('wrong-screen').style.display   = 'none';
  document.getElementById('results-screen').style.display = 'block';
  document.getElementById('score-text').textContent  = correct + ' / ' + wState.wrongQis.length + ' (Retry)';
  document.getElementById('score-label').textContent = 'Wrong Review Complete!';
  var grid = document.getElementById('results-grid');
  grid.innerHTML = '';
  for (var wi2 = 0; wi2 < wState.wrongQis.length; wi2++) {
    (function(wi2) {
      var qi = wState.wrongQis[wi2];
      var q  = QUESTIONS[qi];
      var answered  = wState.answers.hasOwnProperty(wi2);
      var isCorrect = answered && wState.answers[wi2] === getWrongCorrectSh(wi2);
      var card = document.createElement('div');
      card.className = 'result-card ' + (answered ? (isCorrect ? 'r-correct' : 'r-wrong') : 'r-skipped');
      card.innerHTML =
        '<div class="rc-num">Q' + (qi+1) + ' \u00b7 ' + q.type + '</div>' +
        '<div class="rc-status">' + (answered ? (isCorrect ? '\u2705 Correct' : '\u274c Wrong') : '\u23ed Skipped') + '</div>' +
        (!isCorrect ? '<div class="rc-correct-ans">\u2714 ' + q.options[q.ci] + '</div>' : '');
      grid.appendChild(card);
    })(wi2);
  }
  renderDotNav();
}

function openFreshModal()  { document.getElementById('modal-overlay').classList.add('show'); }
function closeFreshModal() { document.getElementById('modal-overlay').classList.remove('show'); }
function confirmFresh() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  state = { answers: {}, shuffles: {}, cur: 0, showResults: false };
  closeFreshModal();
  render();
}

try { loadState(); render(); }
catch(e) {
  document.body.innerHTML += '<div style="padding:20px;color:red;font-weight:bold;">Failed to load: ' + e.message + '</div>';
}
</script>
</body>
</html>
