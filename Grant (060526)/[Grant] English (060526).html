For the first two weeks, Diego ate lunch alone, pretending to read so no one would notice. He told himself he didn't need anyone new. Back in San Antonio, friendships had been easy — they had just happened. Here, every conversation felt like a test he hadn't studied for.

Then, one afternoon in gym class, Coach Rivera divided the students into soccer teams. Diego hesitated at first, hanging back near the goal. But when a loose ball rolled toward him, instinct took over. He trapped it cleanly, twisted past two defenders, and sent a perfect low shot into the corner of the net.

The gym went quiet for a moment. Then a boy named Jordan ran over, eyes wide. "Where did you learn to do that?"

Diego shrugged, but he couldn't hide the smile pulling at his mouth. "My friend Marco. We used to play every Saturday back in San Antonio."

"We have a team that practices on Saturdays," Jordan said. "We could really use someone like you."

Diego looked at the muddy field through the gymnasium window. It wasn't San Antonio. The sky was gray and the grass was wet. But a soccer ball was a soccer ball, and a Saturday was a Saturday.

"Okay," he said quietly. "I'll come."

That weekend, standing in the drizzle with new teammates, Diego realized that some things — the language of a perfectly placed pass, the trust between players — are the same everywhere.`;

      "How to Move to a New School Without Losing Friends"
    ],
    ci: 2,
    exp: "'A Ball, a Field, and a New Beginning' captures the three key elements of the story: soccer (the ball and field), and Diego's emotional journey toward belonging (a new beginning). It reflects both the literal and emotional arc of the passage."
  }
];

let state = { cur: 0, answers: {}, shuffles: {}, showResults: false };
let retryIndices = [], retryCur = 0, retryAnswers = {}, retryShuffles = {};

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (
        parsed &&
        typeof parsed.cur === 'number' &&
        parsed.cur >= 0 &&
        parsed.cur < QUESTIONS.length &&
        typeof parsed.answers === 'object' &&
        typeof parsed.shuffles === 'object'
      ) {
        state = parsed;
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
    }
  } catch(e) {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e2) {}
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getShuffled(qi) {
  if (state.shuffles[qi]) return state.shuffles[qi];
  const arr = shuffle(QUESTIONS[qi].options.map((_, i) => i));
  state.shuffles[qi] = arr;
  saveState();
  return arr;
}

function getRetryShuffled(ri) {
  if (retryShuffles[ri]) return retryShuffles[ri];
  const arr = shuffle(QUESTIONS[retryIndices[ri]].options.map((_, i) => i));
  retryShuffles[ri] = arr;
  return arr;
}

function buildDotNav() {
  const nav = document.getElementById('dotNav');
  nav.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = i + 1;
    if (state.answers[i] !== undefined)
      d.classList.add(state.answers[i] === QUESTIONS[i].ci ? 'correct' : 'wrong');
    if (i === state.cur && !state.showResults) d.classList.add('current');
    d.onclick = () => goTo(i);
    nav.appendChild(d);
  });
  const pill = document.createElement('div');
  pill.className = 'dot results-pill' + (state.showResults ? ' active' : '');
  pill.textContent = 'Results';
  pill.onclick = () => { state.showResults = true; saveState(); render(); };
  nav.appendChild(pill);
}

function buildRetryDotNav() {
  const nav = document.getElementById('retryDotNav');
  nav.innerHTML = '';
  retryIndices.forEach((qi, ri) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = qi + 1;
    if (retryAnswers[ri] !== undefined)
      d.classList.add(retryAnswers[ri] === QUESTIONS[qi].ci ? 'correct' : 'wrong');
    if (ri === retryCur) d.classList.add('current');
    d.onclick = () => { retryCur = ri; renderRetry(); };
    nav.appendChild(d);
  });
}

function render() {
  try {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('results-screen').style.display = 'none';
    document.getElementById('wrong-review-screen').style.display = 'none';
    buildDotNav();
    if (state.showResults) {
      document.getElementById('results-screen').style.display = 'block';
      showResultsScreen();
    } else {
      document.getElementById('quiz-screen').style.display = 'block';
      renderQuestion();
    }
  } catch(e) {
    document.body.innerHTML += '<div style="padding:20px;color:red;font-weight:bold;">Error: ' + e.message + '</div>';
  }
}

function renderQuestion() {
  const q = QUESTIONS[state.cur];
  const sh = getShuffled(state.cur);
  document.getElementById('typeBadge').textContent = q.type;
  document.getElementById('qNum').textContent = 'Question ' + (state.cur + 1) + ' of ' + QUESTIONS.length;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('passageText').textContent = PASSAGE;
  document.getElementById('passageBox').style.display = 'block';

  const optDiv = document.getElementById('optionsDiv');
  optDiv.innerHTML = '';
  const answered = state.answers[state.cur];
  sh.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = String.fromCharCode(65 + pos) + '. ' + q.options[origIdx];
    if (answered !== undefined) {
      btn.disabled = true;
      if (origIdx === q.ci) btn.classList.add(answered === q.ci ? 'correct-ans' : 'reveal-correct');
      else if (origIdx === answered) btn.classList.add('wrong-ans');
    } else {
      btn.onclick = () => selectAnswer(origIdx);
    }
    optDiv.appendChild(btn);
  });

  const expDiv = document.getElementById('explanation');
  if (answered !== undefined && answered !== q.ci) {
    expDiv.textContent = '📝 ' + q.exp;
    expDiv.classList.add('show');
  } else {
    expDiv.classList.remove('show');
    expDiv.textContent = '';
  }

  document.getElementById('qCounter').textContent = (state.cur + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('prevBtn').disabled = state.cur === 0;
  const nextBtn = document.getElementById('nextBtn');
  if (state.cur === QUESTIONS.length - 1) {
    nextBtn.textContent = 'See Results →';
    nextBtn.className = 'nav-btn next-results';
  } else {
    nextBtn.textContent = 'Next →';
    nextBtn.className = 'nav-btn';
  }
}

function selectAnswer(origIdx) {
  state.answers[state.cur] = origIdx;
  saveState();
  renderQuestion();
}

function handleNext() {
  if (state.cur === QUESTIONS.length - 1) {
    state.showResults = true;
    saveState();
    render();
  } else {
    goTo(state.cur + 1);
  }
}

function goTo(i) {
  if (i < 0 || i >= QUESTIONS.length) return;
  state.cur = i;
  state.showResults = false;
  saveState();
  render();
}

function showResultsScreen() {
  try {
    let correct = 0;
    QUESTIONS.forEach((q, i) => { if (state.answers[i] === q.ci) correct++; });
    document.getElementById('resultsScore').textContent = correct + ' / ' + QUESTIONS.length;

    const grid = document.getElementById('resultsGrid');
    grid.innerHTML = '';
    QUESTIONS.forEach((q, i) => {
      const a = state.answers[i];
      let cls, status;
      if (a === undefined) { cls = 'skipped'; status = 'Skipped'; }
      else if (a === q.ci) { cls = 'correct'; status = '✓ Correct'; }
      else { cls = 'wrong'; status = '✗ Wrong'; }
      const card = document.createElement('div');
      card.className = 'result-card ' + cls;
      let inner = '<div class="rc-qnum">Q' + (i+1) + ' — ' + q.type + '</div><div class="rc-status">' + status + '</div>';
      if (cls !== 'correct') inner += '<div class="rc-correct-ans">✓ ' + q.options[q.ci] + '</div>';
      card.innerHTML = inner;
      card.onclick = () => goTo(i);
      grid.appendChild(card);
    });

    const wrongCount = QUESTIONS.filter((q, i) => state.answers[i] !== undefined && state.answers[i] !== q.ci).length;
    document.getElementById('retryWrongBtn').style.display = wrongCount > 0 ? 'block' : 'none';
  } catch(e) {
    document.getElementById('results-screen').innerHTML += '<div style="padding:20px;color:red;">Results error: ' + e.message + '</div>';
  }
}

function startRetry() {
  retryIndices = QUESTIONS.map((q, i) => ({ i, q }))
    .filter(({ i, q }) => state.answers[i] !== undefined && state.answers[i] !== q.ci)
    .map(({ i }) => i);
  if (retryIndices.length === 0) return;
  retryCur = 0;
  retryAnswers = {};
  retryShuffles = {};
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('wrong-review-screen').style.display = 'block';
  buildRetryDotNav();
  renderRetry();
}

function renderRetry() {
  const ri = retryCur;
  const qi = retryIndices[ri];
  const q = QUESTIONS[qi];
  const sh = getRetryShuffled(ri);

  document.getElementById('retryBadge').textContent = q.type;
  document.getElementById('retryQNum').textContent = 'Q' + (qi+1) + ' (Wrong Answer Retry — ' + (ri+1) + ' of ' + retryIndices.length + ')';
  document.getElementById('retryQText').textContent = q.q;
  document.getElementById('retryPassageText').textContent = PASSAGE;
  document.getElementById('retryPassageBox').style.display = 'block';

  const optDiv = document.getElementById('retryOptions');
  optDiv.innerHTML = '';
  const answered = retryAnswers[ri];
  sh.forEach((origIdx, pos) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = String.fromCharCode(65 + pos) + '. ' + q.options[origIdx];
    if (answered !== undefined) {
      btn.disabled = true;
      if (origIdx === q.ci) btn.classList.add(answered === q.ci ? 'correct-ans' : 'reveal-correct');
      else if (origIdx === answered) btn.classList.add('wrong-ans');
    } else {
      btn.onclick = () => { retryAnswers[ri] = origIdx; renderRetry(); };
    }
    optDiv.appendChild(btn);
  });

  const expDiv = document.getElementById('retryExplanation');
  if (answered !== undefined && answered !== q.ci) {
    expDiv.textContent = '📝 ' + q.exp;
    expDiv.classList.add('show');
  } else if (answered === q.ci) {
    expDiv.textContent = '✅ Correct!';
    expDiv.classList.add('show');
  } else {
    expDiv.classList.remove('show');
    expDiv.textContent = '';
  }

  document.getElementById('retryCtr').textContent = (ri+1) + ' / ' + retryIndices.length;
  document.getElementById('retryPrev').disabled = ri === 0;
  const nextBtn = document.getElementById('retryNext');
  if (ri === retryIndices.length - 1) {
    nextBtn.textContent = 'Done ✓';
    nextBtn.onclick = backToResults;
  } else {
    nextBtn.textContent = 'Next →';
    nextBtn.onclick = () => retryNav(1);
  }
  buildRetryDotNav();
}

function retryNav(dir) {
  retryCur = Math.max(0, Math.min(retryIndices.length - 1, retryCur + dir));
  renderRetry();
}

function backToResults() {
  document.getElementById('wrong-review-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
  state.showResults = true;
  buildDotNav();
  showResultsScreen();
}

function copyResults() {
  let text = 'English Comprehension Quiz — Set 3\n===================================\n';
  let correct = 0;
  QUESTIONS.forEach((q, i) => {
    const a = state.answers[i];
    let status;
    if (a === undefined) status = 'Skipped';
    else if (a === q.ci) { status = 'Correct'; correct++; }
    else status = 'Wrong (Correct: ' + q.options[q.ci] + ')';
    text += 'Q' + (i+1) + ' [' + q.type + ']: ' + status + '\n';
  });
  text += '\nScore: ' + correct + ' / ' + QUESTIONS.length;
  try { navigator.clipboard.writeText(text).catch(() => fallbackCopy(text)); }
  catch(e) { fallbackCopy(text); }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function showFreshModal() { document.getElementById('freshModal').classList.add('show'); }
function hideFreshModal() { document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh() {
  hideFreshModal();
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  state = { cur: 0, answers: {}, shuffles: {}, showResults: false };
  render();
}

loadState();
render();
</script>

</html>
