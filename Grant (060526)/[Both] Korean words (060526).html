<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Korean Vocabulary Quiz – Set 16</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1b2d; color: #e8edf4; min-height: 100vh; padding: 16px;
  }
  .quiz-date { text-align: center; font-size: 2rem; font-weight: 800; color: #e8edf4; padding: 18px 0 4px; }
  .quiz-header { text-align: center; padding: 6px 0 14px; }
  .quiz-title { font-size: 1.35rem; font-weight: 700; color: #e8edf4; letter-spacing: 0.5px; }
  .quiz-subtitle { font-size: 0.78rem; color: #8fa3bb; margin-top: 4px; }
  .section-label {
    text-align: center; font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.8px; text-transform: uppercase;
    color: #8fa3bb; margin: 6px 0 2px; min-height: 1.1em;
  }
  .dot-nav {
    display: flex; justify-content: center; align-items: center;
    gap: 5px; flex-wrap: wrap; padding: 10px 8px 4px;
  }
  .dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: #1e2e42; color: #8fa3bb;
    font-size: 0.68rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 2px solid transparent; transition: all 0.18s; flex-shrink: 0;
  }
  .dot:hover { border-color: #185FA5; color: #e8edf4; }
  .dot.current { border-color: #185FA5; color: #e8edf4; background: #185FA5; }
  .dot.correct { background: #1D9E75; border-color: #1D9E75; color: #fff; }
  .dot.wrong   { background: #E24B4A; border-color: #E24B4A; color: #fff; }
  .dot.results-pill {
    width: auto; border-radius: 16px; padding: 0 12px;
    font-size: 0.7rem; background: #185FA5; color: #fff;
    border-color: #185FA5; cursor: default;
  }
  .card {
    background: #1a2a3d; border-radius: 16px;
    padding: 22px 18px 20px; max-width: 640px; margin: 0 auto;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .type-badge {
    color: #fff; font-size: 0.68rem; font-weight: 700;
    padding: 3px 10px; border-radius: 20px; letter-spacing: 0.4px; text-transform: uppercase;
  }
  .badge-noun { background: #6B7FA3; }
  .badge-verb { background: #185FA5; }
  .q-counter { font-size: 0.78rem; color: #8fa3bb; }
  .question-text {
    font-size: 1.05rem; font-weight: 600; color: #e8edf4;
    line-height: 1.5; margin-bottom: 20px; min-height: 52px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .option-row { display: flex; align-items: stretch; gap: 8px; }
  .option-btn {
    flex: 1; padding: 13px 16px; border-radius: 10px;
    border: 2px solid transparent; background: #e8edf4; color: #111111;
    font-size: 1.05rem; font-weight: 500; text-align: left;
    cursor: pointer; transition: all 0.15s; min-height: 48px;
  }
  .option-btn:hover:not(:disabled) { border-color: #185FA5; }
  .option-btn.correct-answer {
    background: #E1F5EE !important; border: 2px solid #1D9E75 !important; color: #085041 !important;
  }
  .option-btn.wrong-answer {
    background: #FCEBEB !important; border: 2px solid #E24B4A !important; color: #501313 !important;
  }
  .speak-btn {
    flex-shrink: 0; width: 48px; border-radius: 10px;
    border: 2px solid #2a3f58; background: #1e2e42;
    color: #8fa3bb; font-size: 1.15rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; min-height: 48px;
  }
  .speak-btn:hover { border-color: #185FA5; color: #e8edf4; background: #1a3558; }
  .speak-btn.speaking {
    border-color: #185FA5; color: #185FA5; background: #122033;
    animation: pulse 0.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .explanation {
    background: #122033; border-left: 3px solid #E24B4A;
    border-radius: 8px; padding: 11px 14px;
    font-size: 0.85rem; color: #c8d8e8; line-height: 1.55;
    margin-bottom: 16px; display: none;
  }
  .explanation.show { display: block; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; }
  .nav-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-prev { background: #1e2e42; color: #8fa3bb; }
  .btn-next { background: #185FA5; color: #fff; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  #results-screen { display: none; max-width: 640px; margin: 0 auto; }
  .results-header { text-align: center; padding: 10px 0 18px; }
  .results-header h2 { font-size: 1.3rem; font-weight: 700; }
  .results-score { font-size: 2.2rem; font-weight: 800; color: #185FA5; margin: 6px 0 2px; }
  .results-sub { font-size: 0.82rem; color: #8fa3bb; }
  .results-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 7px; margin-bottom: 20px;
  }
  .result-card {
    background: #1a2a3d; border-radius: 10px; padding: 9px 5px;
    text-align: center; cursor: pointer; transition: transform 0.12s;
  }
  .result-card:hover { transform: scale(1.04); }
  .result-card .rc-num { font-size: 0.65rem; color: #8fa3bb; margin-bottom: 4px; }
  .result-card .rc-status { font-size: 0.7rem; font-weight: 700; padding: 3px 5px; border-radius: 12px; }
  .rc-correct { background: #E1F5EE; color: #085041; }
  .rc-wrong   { background: #FCEBEB; color: #501313; }
  .rc-skipped { background: #e8edf4; color: #555; }
  .results-actions { display: flex; gap: 10px; }
  .btn-copy {
    flex: 1; padding: 13px; border-radius: 10px;
    border: 2px solid #185FA5; background: transparent;
    color: #185FA5; font-size: 0.88rem; font-weight: 700; cursor: pointer;
  }
  .btn-fresh {
    flex: 1; padding: 13px; border-radius: 10px; border: none;
    background: #E24B4A; color: #fff; font-size: 0.88rem; font-weight: 700; cursor: pointer;
  }
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 999;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #1a2a3d; border-radius: 16px;
    padding: 24px 20px; max-width: 320px; width: 100%;
  }
  .modal-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
  .modal-box p  { font-size: 0.85rem; color: #8fa3bb; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-cancel {
    flex: 1; padding: 11px; border-radius: 8px;
    border: 2px solid #2a3f58; background: transparent;
    color: #e8edf4; font-size: 0.88rem; font-weight: 600; cursor: pointer;
  }
  .modal-confirm {
    flex: 1; padding: 11px; border-radius: 8px; border: none;
    background: #E24B4A; color: #fff; font-size: 0.88rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div class="quiz-date" id="quiz-date"></div>
<div class="quiz-header">
  <div class="quiz-title">🇰🇷 Korean Vocabulary Quiz – Set 16</div>
  <div class="quiz-subtitle">Q1–15 Nouns (명사) &nbsp;|&nbsp; Q16–30 Verbs (동사) &nbsp;|&nbsp; tap 🔊 to hear pronunciation</div>
</div>
<div class="section-label" id="section-label"></div>
<div class="dot-nav" id="dot-nav"></div>

<div id="quiz-screen">
  <div class="card">
    <div class="card-top">
      <span class="type-badge" id="type-badge">명사</span>
      <span class="q-counter" id="q-counter">1 / 30</span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
    <div class="explanation" id="explanation"></div>
    <div class="nav-row">
      <button class="nav-btn btn-prev" id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <button class="nav-btn btn-next" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
  </div>
</div>

<div id="results-screen">
  <div class="results-header">
    <h2>Quiz Results</h2>
    <div class="results-score" id="results-score"></div>
    <div class="results-sub">Click any card to review that question</div>
  </div>
  <div class="results-grid" id="results-grid"></div>
  <div class="results-actions">
    <button class="btn-copy" onclick="copyResults()">Copy All Results</button>
    <button class="btn-fresh" onclick="confirmFresh()">Start Fresh</button>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3>Start Fresh?</h3>
    <p>All your answers will be cleared and the quiz will restart.</p>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" onclick="doFresh()">Start Fresh</button>
    </div>
  </div>
</div>

<script>
// ── Date ──
(function() {
  const now = new Date();
  const days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
  document.getElementById("quiz-date").textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
})();

// ── Speech ──
let activeSpeakBtn = null;
function speak(text, btnEl) {
  window.speechSynthesis.cancel();
  if (activeSpeakBtn) { activeSpeakBtn.classList.remove("speaking"); activeSpeakBtn.textContent = "🔊"; }
  if (activeSpeakBtn === btnEl) { activeSpeakBtn = null; return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ko-KR"; utter.rate = 0.85;
  activeSpeakBtn = btnEl;
  btnEl.classList.add("speaking"); btnEl.textContent = "⏹";
  utter.onend  = () => { btnEl.classList.remove("speaking"); btnEl.textContent = "🔊"; activeSpeakBtn = null; };
  utter.onerror = () => { btnEl.classList.remove("speaking"); btnEl.textContent = "🔊"; activeSpeakBtn = null; };
  window.speechSynthesis.speak(utter);
}
function stopSpeech() {
  window.speechSynthesis.cancel();
  if (activeSpeakBtn) { activeSpeakBtn.classList.remove("speaking"); activeSpeakBtn.textContent = "🔊"; activeSpeakBtn = null; }
}

const NOUN_COUNT = 15;

const RAW_QUESTIONS = [
  // ── 명사 (Q1–15) ──
  { prompt: "Choose the correct Korean meaning for the word: Mouth",        answer: "입",     distractors: ["코","귀","혀"],            explanation: "입 means 'mouth'. 코 = nose, 귀 = ear, 혀 = tongue.",                  isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Shoulder",     answer: "어깨",   distractors: ["허리","다리","발"],        explanation: "어깨 means 'shoulder'. 허리 = waist, 다리 = leg, 발 = foot.",           isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Belly",        answer: "배",     distractors: ["다리","발","허리"],        explanation: "배 means 'belly/stomach'. 다리 = leg, 발 = foot, 허리 = waist.",        isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Leg",          answer: "다리",   distractors: ["발","무릎","어깨"],        explanation: "다리 means 'leg'. 발 = foot, 무릎 = knee, 어깨 = shoulder.",            isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Foot",         answer: "발",     distractors: ["다리","무릎","허리"],      explanation: "발 means 'foot'. 다리 = leg, 무릎 = knee, 허리 = waist.",               isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Waist",        answer: "허리",   distractors: ["어깨","배","발"],          explanation: "허리 means 'waist'. 어깨 = shoulder, 배 = belly, 발 = foot.",           isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Grass",        answer: "풀",     distractors: ["나무","꽃","소나무"],      explanation: "풀 means 'grass'. 나무 = tree, 꽃 = flower, 소나무 = pine tree.",       isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Sun",          answer: "해",     distractors: ["달","별","구름"],          explanation: "해 means 'sun'. 달 = moon, 별 = star, 구름 = cloud.",                   isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Tree",         answer: "나무",   distractors: ["풀","꽃","소나무"],        explanation: "나무 means 'tree'. 풀 = grass, 꽃 = flower, 소나무 = pine tree.",       isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Cucumber",     answer: "오이",   distractors: ["파","김","고추"],          explanation: "오이 means 'cucumber'. 파 = green onion, 김 = dried seaweed, 고추 = chili pepper.", isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Clock / Watch", answer: "시계",  distractors: ["거울","가위","바구니"],    explanation: "시계 means 'clock/watch'. 거울 = mirror, 가위 = scissors, 바구니 = basket.", isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Skirt",        answer: "치마",   distractors: ["바지","셔츠","구두"],      explanation: "치마 means 'skirt'. 바지 = pants, 셔츠 = shirt, 구두 = dress shoes.",   isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Fox",          answer: "여우",   distractors: ["사슴","토끼","고래"],      explanation: "여우 means 'fox'. 사슴 = deer, 토끼 = rabbit, 고래 = whale.",           isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Rabbit",       answer: "토끼",   distractors: ["사슴","여우","말"],        explanation: "토끼 means 'rabbit'. 사슴 = deer, 여우 = fox, 말 = horse.",             isNoun: true },
  { prompt: "Choose the correct Korean meaning for the word: Whale",        answer: "고래",   distractors: ["사슴","여우","토끼"],      explanation: "고래 means 'whale'. 사슴 = deer, 여우 = fox, 토끼 = rabbit.",           isNoun: true },

  // ── 동사 (Q16–30) — new verbs ──
  { prompt: "Choose the correct Korean meaning for the verb: To receive",   answer: "받다",   distractors: ["주다","사다","팔다"],      explanation: "받다 means 'to receive'. 주다 = to give, 사다 = to buy, 팔다 = to sell.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To open",      answer: "열다",   distractors: ["닫다","들다","놓다"],      explanation: "열다 means 'to open'. 닫다 = to close, 들다 = to lift, 놓다 = to put down.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To close",     answer: "닫다",   distractors: ["열다","잡다","놓다"],      explanation: "닫다 means 'to close'. 열다 = to open, 잡다 = to grab, 놓다 = to put down.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To sell",      answer: "팔다",   distractors: ["사다","받다","주다"],      explanation: "팔다 means 'to sell'. 사다 = to buy, 받다 = to receive, 주다 = to give.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To throw away", answer: "버리다", distractors: ["고르다","모으다","놓다"],  explanation: "버리다 means 'to throw away/discard'. 고르다 = to choose, 모으다 = to collect, 놓다 = to put down.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To choose / pick", answer: "고르다", distractors: ["모으다","버리다","잡다"], explanation: "고르다 means 'to choose/pick'. 모으다 = to collect, 버리다 = to discard, 잡다 = to grab.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To collect / gather", answer: "모으다", distractors: ["고르다","버리다","나누다"], explanation: "모으다 means 'to collect/gather'. 고르다 = to choose, 버리다 = to discard, 나누다 = to share.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To draw",      answer: "그리다", distractors: ["만들다","찍다","쓰다"],    explanation: "그리다 means 'to draw'. 만들다 = to make, 찍다 = to take (a photo), 쓰다 = to write.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To make",      answer: "만들다", distractors: ["그리다","찍다","하다"],    explanation: "만들다 means 'to make'. 그리다 = to draw, 찍다 = to take (a photo), 하다 = to do.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To take (a photo)", answer: "찍다", distractors: ["그리다","만들다","보다"], explanation: "찍다 means 'to take (a photo)'. 그리다 = to draw, 만들다 = to make, 보다 = to see.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To hit / play (instrument)", answer: "치다", distractors: ["잡다","던지다","들다"], explanation: "치다 means 'to hit / play (an instrument)'. 잡다 = to grab, 던지다 = to throw, 들다 = to lift.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To like",      answer: "좋아하다", distractors: ["싫어하다","사랑하다","미워하다"], explanation: "좋아하다 means 'to like'. 싫어하다 = to dislike, 사랑하다 = to love, 미워하다 = to hate.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To dislike",   answer: "싫어하다", distractors: ["좋아하다","미워하다","사랑하다"], explanation: "싫어하다 means 'to dislike'. 좋아하다 = to like, 미워하다 = to hate, 사랑하다 = to love.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To love",      answer: "사랑하다", distractors: ["좋아하다","미워하다","싫어하다"], explanation: "사랑하다 means 'to love'. 좋아하다 = to like, 미워하다 = to hate, 싫어하다 = to dislike.", isNoun: false },
  { prompt: "Choose the correct Korean meaning for the verb: To hate",      answer: "미워하다", distractors: ["싫어하다","사랑하다","좋아하다"], explanation: "미워하다 means 'to hate'. 싫어하다 = to dislike, 사랑하다 = to love, 좋아하다 = to like.", isNoun: false },
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions() {
  return RAW_QUESTIONS.map(q => ({
    prompt: q.prompt, answer: q.answer,
    options: shuffle([q.answer, ...q.distractors]),
    explanation: q.explanation, isNoun: q.isNoun, chosen: null
  }));
}

let questions = [], current = 0, showingResults = false;
const STORE_KEY = "korean_quiz_set16";

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ questions, current, showingResults })); } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    questions = s.questions; current = s.current; showingResults = s.showingResults;
    return true;
  } catch(e) { return false; }
}

function init() {
  if (!loadState()) { questions = buildQuestions(); current = 0; showingResults = false; }
  if (showingResults) showResults();
  else { renderDots(); renderQuestion(); }
}

function updateSectionLabel() {
  document.getElementById("section-label").textContent =
    current < NOUN_COUNT ? "✦ 명사 (Nouns) — Q1–15" : "★ 동사 (Verbs) — Q16–30";
}

function renderDots(resultsMode) {
  const nav = document.getElementById("dot-nav");
  nav.innerHTML = "";
  questions.forEach((q, i) => {
    const d = document.createElement("div");
    d.className = "dot"; d.textContent = i + 1;
    if (resultsMode) {
      if (q.chosen === q.answer) d.classList.add("correct");
      else if (q.chosen !== null) d.classList.add("wrong");
    } else {
      if (i === current) d.classList.add("current");
      else if (q.chosen === q.answer) d.classList.add("correct");
      else if (q.chosen !== null) d.classList.add("wrong");
    }
    d.addEventListener("click", () => {
      stopSpeech();
      if (showingResults) {
        showingResults = false;
        document.getElementById("results-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
      }
      current = i; saveState(); renderDots(); renderQuestion();
    });
    nav.appendChild(d);
  });
  if (resultsMode) {
    const pill = document.createElement("div");
    pill.className = "dot results-pill"; pill.textContent = "Results";
    nav.appendChild(pill);
    document.getElementById("section-label").textContent = "";
  } else {
    updateSectionLabel();
  }
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById("q-counter").textContent = `${current + 1} / ${questions.length}`;
  document.getElementById("question-text").textContent = q.prompt;

  const badge = document.getElementById("type-badge");
  badge.textContent = q.isNoun ? "명사" : "동사";
  badge.className = "type-badge " + (q.isNoun ? "badge-noun" : "badge-verb");

  const optContainer = document.getElementById("options");
  optContainer.innerHTML = "";
  q.options.forEach(opt => {
    const row = document.createElement("div");
    row.className = "option-row";

    const btn = document.createElement("button");
    btn.className = "option-btn"; btn.textContent = opt;
    if (q.chosen !== null) {
      btn.disabled = true;
      if (opt === q.answer) btn.classList.add("correct-answer");
      else if (opt === q.chosen) btn.classList.add("wrong-answer");
    }
    btn.addEventListener("click", () => selectAnswer(opt));

    const spk = document.createElement("button");
    spk.className = "speak-btn"; spk.textContent = "🔊";
    spk.setAttribute("aria-label", `Pronounce ${opt}`);
    spk.addEventListener("click", (e) => { e.stopPropagation(); speak(opt, spk); });

    row.appendChild(btn); row.appendChild(spk);
    optContainer.appendChild(row);
  });

  const expEl = document.getElementById("explanation");
  if (q.chosen !== null && q.chosen !== q.answer) {
    expEl.textContent = q.explanation; expEl.classList.add("show");
  } else {
    expEl.classList.remove("show"); expEl.textContent = "";
  }

  document.getElementById("btn-prev").disabled = (current === 0);
  document.getElementById("btn-next").textContent = current === questions.length - 1 ? "See Results →" : "Next →";
  updateSectionLabel();
}

function selectAnswer(opt) {
  const q = questions[current];
  if (q.chosen !== null) return;
  q.chosen = opt;
  saveState(); renderDots(); renderQuestion();
  if (current === questions.length - 1) setTimeout(() => showResults(), 600);
}

function navigate(dir) {
  stopSpeech();
  const next = current + dir;
  if (next < 0) return;
  if (next >= questions.length) { showResults(); return; }
  current = next; saveState(); renderDots(); renderQuestion();
}

function showResults() {
  stopSpeech(); showingResults = true; saveState();
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("results-screen").style.display = "block";
  renderDots(true);

  let correct = 0;
  questions.forEach(q => { if (q.chosen === q.answer) correct++; });
  document.getElementById("results-score").textContent = `${correct} / ${questions.length}`;

  const grid = document.getElementById("results-grid");
  grid.innerHTML = "";
  questions.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "result-card";
    let cls, txt;
    if (q.chosen === null)          { cls = "rc-skipped"; txt = "Skipped"; }
    else if (q.chosen === q.answer) { cls = "rc-correct"; txt = "Correct"; }
    else                            { cls = "rc-wrong";   txt = "Wrong"; }
    card.innerHTML = `<div class="rc-num">Q${i+1}${i < NOUN_COUNT ? ' 명' : ' 동'}</div><div class="rc-status ${cls}">${txt}</div>`;
    card.addEventListener("click", () => {
      showingResults = false;
      document.getElementById("results-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";
      current = i; saveState(); renderDots(); renderQuestion();
    });
    grid.appendChild(card);
  });
}

function copyResults() {
  let lines = ["Korean Vocabulary Quiz – Set 16 Results", "", "--- 명사 (Nouns) Q1–15 ---", ""];
  questions.forEach((q, i) => {
    if (i === NOUN_COUNT) lines.push("", "--- 동사 (Verbs) Q16–30 ---", "");
    const status = q.chosen === null ? "Skipped" : q.chosen === q.answer ? "Correct ✓" : "Wrong ✗";
    lines.push(`Q${i+1}: ${q.prompt}`);
    lines.push(`   Your answer: ${q.chosen ?? "—"}   Correct: ${q.answer}   [${status}]`);
  });
  const correct = questions.filter(q => q.chosen === q.answer).length;
  lines.push("", `Total Score: ${correct} / ${questions.length}`);
  navigator.clipboard.writeText(lines.join("\n")).catch(() => {});
}

function confirmFresh() { document.getElementById("modal").classList.add("show"); }
function closeModal()   { document.getElementById("modal").classList.remove("show"); }
function doFresh() {
  closeModal(); stopSpeech();
  try { localStorage.removeItem(STORE_KEY); } catch(e) {}
  questions = buildQuestions(); current = 0; showingResults = false;
  document.getElementById("results-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  saveState(); renderDots(); renderQuestion();
}

init();
</script>
</body>
