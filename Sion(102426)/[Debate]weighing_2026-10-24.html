<script>
var TITLE = "[Debate] Weighing";
var QUIZ_KEY = "sionpfweigh_8";
var INSTRUCTION = "Read each pair of impacts or round situation, then choose the best weighing or strategy. Evidence marked (practice card) was written for this drill. Do not quote it in a real round.";
var TODAY_STR = "20261024";
var RAW_QUESTIONS = [{"stem": "When both teams claim the same mechanism, what is the best move for Sion (Con) in the next speech?", "opts": ["Introduce a brand-new contention in Final Focus.", "Meta-weigh: explain why a different mechanism, such as probability, should decide the round, then show Con wins it.", "Repeat Con’s magnitude claim louder and more often.", "Concede that Pro wins magnitude and stop weighing."], "ci": 1, "exp": "When weighing clashes on the same mechanism, debaters <b>meta-weigh</b> — argue which mechanism matters most and why. New contentions in Final Focus are not allowed, and repetition doesn’t resolve the clash.", "contextLabel": "Both teams are weighing on magnitude:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\"><b>Pro:</b> &ldquo;Losing a town’s water supply is the biggest harm in the round.&rdquo;<br><b>Con:</b> &ldquo;Losing billions in investment is the biggest harm in the round.&rdquo;</span>", "tag": "Comparison", "tagcolor": "#0d9488"}, {"stem": "Pro says, &ldquo;Even if they win jobs, their harm is temporary and ours is forever.&rdquo; Which weighing mechanism is Pro using?", "opts": ["magnitude", "scope", "reversibility", "probability"], "ci": 2, "exp": "<b>Reversibility</b> asks whether a harm can be undone. Pro argues lost groundwater can’t be recovered, while delayed jobs come back. Pro isn’t comparing how many people are affected (scope) or how likely each harm is (probability).", "contextLabel": "During the round, the two impacts are:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\"><b>Pro:</b> Draining an aquifer in Arizona can leave the ground unable to store water for generations.<br><b>Con:</b> A one-year pause delays about 2,000 construction jobs, which restart when the pause ends.</span>", "tag": "Mechanism", "tagcolor": "#7b61ff"}, {"stem": "What is the best way for Sion to respond in Con’s Final Focus?", "opts": ["Answer the housing argument with a new card about housing prices.", "Ignore it completely and say nothing about it.", "Point out that the housing argument is new in Final Focus and ask the judge not to evaluate it, then weigh on the arguments that were extended.", "Agree that housing prices are an important issue."], "ci": 2, "exp": "New arguments are not allowed in Final Focus because the other team can’t answer them. The best response is to <b>flag it as new</b> and then return to weighing what was actually extended through Summary.", "contextLabel": "In Final Focus, Pro says:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;We’re going for the water contention, and here’s a new reason it matters: data centers also raise local housing prices.&rdquo;</span>", "tag": "Collapse", "tagcolor": "#E24B4A"}, {"stem": "Which mechanism gives Con the clearest advantage in this comparison?", "opts": ["scope", "reversibility", "probability", "timeframe"], "ci": 0, "exp": "<b>Scope</b> compares how many people are affected: a whole county versus a few hundred homes. Both harms are happening now, so timeframe doesn’t separate them.", "contextLabel": "During the round, the two impacts are:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\"><b>Con:</b> Data-center tax payments fund schools and roads for every family in a county of 300,000 people.<br><b>Pro:</b> Backup generators add noise and air pollution for the few hundred homes beside the campus.</span>", "tag": "Mechanism", "tagcolor": "#7b61ff"}, {"stem": "Con wants to argue that its impact matters more. Pro responds, &ldquo;Our harm is happening now; theirs is a decade away and depends on several &lsquo;mights.&rsquo;&rdquo; Which two mechanisms is Pro combining?", "opts": ["scope and reversibility", "magnitude and scope", "timeframe and probability", "reversibility and timeframe"], "ci": 2, "exp": "&ldquo;Happening now&rdquo; vs. &ldquo;a decade away&rdquo; is <b>timeframe</b>; &ldquo;depends on several &lsquo;mights&rsquo;&rdquo; questions how <b>likely</b> Con’s chain is — probability. Pro says nothing about undoing harm or the number of people.", "contextLabel": "During the round, the two impacts are:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\"><b>Pro:</b> Rate requests of 8&ndash;12 percent are already in front of regulators in three states this year.<br><b>Con:</b> If the U.S. pauses, AI companies could build abroad, and over the next decade the U.S. might fall behind in AI research.</span>", "tag": "Mechanism", "tagcolor": "#7b61ff"}, {"stem": "Choose the strongest weighing sentence.", "opts": ["&ldquo;Prefer our impact on probability: county budgets show the tax money is already being spent on schools, while their water harm only happens if campuses use evaporative cooling — and new sites are moving to closed-loop systems.&rdquo;", "&ldquo;Their water argument is bad and the judge should ignore it.&rdquo;", "&ldquo;Our impact outweighs because schools are really important to every community.&rdquo;", "&ldquo;Tax revenue funds schools and emergency services, so vote Con.&rdquo;"], "ci": 0, "exp": "Good weighing names a mechanism, gives a reason, and <b>compares</b> both sides. The other choices just repeat Con’s impact or dismiss Pro’s without a comparison, which judges call &ldquo;outweighs with no warrant.&rdquo;", "contextLabel": "Sion (Con) wants to weigh tax revenue against Pro’s water impact. Which line is the best weighing?", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Con impact: local tax revenue funds schools and emergency services.<br>Pro impact: water use in drought regions.</span>", "tag": "Comparison", "tagcolor": "#0d9488"}, {"stem": "What is the main weakness of this weighing?", "opts": ["It describes only Pro’s impact and never explains why it matters more than Con’s impact.", "It mentions families, which judges are told to ignore.", "It weighs on reversibility instead of scope.", "It uses too many statistics for a summary speech."], "ci": 0, "exp": "Weighing must be <b>comparative</b>. Saying your impact is bad is not the same as showing it is worse than your opponent’s. A stronger version would compare: &ldquo;Rate hikes hit millions of households this year, while their job losses are temporary.&rdquo;", "contextLabel": "Pro’s summary says:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Our grid impact outweighs because rate hikes hurt families.&rdquo;</span>", "tag": "Comparison", "tagcolor": "#0d9488"}, {"stem": "Sion has three minutes in Summary. Which strategy is best?", "opts": ["Collapse to C1, extend it with its warrant and impact, answer Pro’s response, and weigh it against Pro’s best argument.", "Spend the whole Summary attacking Pro’s case and extend nothing.", "Collapse to C2 because it has the biggest impact, even though it took heavy damage.", "Extend both contentions equally so the judge sees all of Con’s work."], "ci": 0, "exp": "<b>Collapsing</b> means going for the argument you are most likely to win. C1 is cleaner and Sion can answer the one response. Spreading time across both contentions leaves each one under-covered.", "contextLabel": "After rebuttals, the flow looks like this:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Con C1 (tax revenue): Pro answered with one response, and Sion has a card that answers it.<br>Con C2 (AI leadership): Pro answered with three responses, including a strong card showing companies cannot easily move overseas.</span>", "tag": "Collapse", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    else if(TITLE.indexOf('[Debate]')===0) childName='Sion'; // 2026-10-13: [Debate] quizzes are Sion's
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
