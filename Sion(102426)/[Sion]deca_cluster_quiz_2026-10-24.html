<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261024";
var RAW_QUESTIONS = [{"stem": "Carlos wants to open a tax-preparation business. He is choosing between buying a franchise of a national tax-service brand and starting his own independent firm. Which is a major advantage of the franchise?", "opts": ["He takes on no risk because franchises cannot fail.", "He keeps all profits without paying any fees or royalties.", "He has complete freedom to change the brand’s services and logo.", "He gets an established brand name, a proven system, and training from the franchisor."], "ci": 3, "exp": "Franchisees buy the right to use a known brand and a tested business model, usually with training and support. In exchange they pay fees and royalties and must follow the franchisor’s rules — and franchises can still fail."}, {"stem": "Halfway through the year, Marisol’s bank switches to a new loan-processing system that she finds confusing. Which action best shows the emotional-intelligence skill of adaptability?", "opts": ["She keeps using the old paper forms because they were faster for her.", "She signs up for the training session, practices on sample files, and asks a coworker for tips until she is comfortable.", "She complains to customers that the new system is slowing everything down.", "She waits for management to switch back to the old system."], "ci": 1, "exp": "Adaptability means adjusting your behavior when circumstances change. Seeking training and practicing shows a willingness to adapt; the other choices resist the change."}, {"stem": "In a role-play, your performance indicator is “Explain the nature of staff communication.” You play a branch manager telling the judge (district manager) how you will roll out a new overdraft policy to tellers. Which statement best addresses the indicator?", "opts": ["“Staff communication means telling employees what to do. I’ll email the policy and expect everyone to follow it.”", "“Staff communication is how information flows up, down, and across a team. I’ll explain the policy in a short meeting so tellers can ask questions, then post a one-page summary, and I’ll invite feedback after the first week so problems reach me quickly.”", "“I will let the tellers find out about the policy from customers so they learn it naturally.”", "“Staff communication is important in every business, and communication skills are very valuable.”"], "ci": 1, "exp": "A strong answer explains the concept (information moving in several directions, two-way feedback) and applies it to the situation. Defining it as one-way orders misses the idea; a general statement doesn’t apply it; letting customers inform staff is poor practice."}, {"stem": "A frost destroys much of Florida’s orange crop. Assuming demand for orange juice does not change, what will most likely happen in the orange juice market?", "opts": ["Supply decreases, so the price of orange juice rises.", "Demand decreases, so the price of orange juice falls.", "Price stays the same because demand did not change.", "Supply increases, so the price of orange juice falls."], "ci": 0, "exp": "A frost reduces the amount producers can sell at every price — a decrease in supply. With the same demand and less supply, the equilibrium price rises."}, {"stem": "Tellers at Ridgeway Bank have been working hard during a busy tax season, but morale is dropping. Which action by the branch manager would most likely increase motivation?", "opts": ["Publicly recognizing specific employees’ efforts and offering flexible scheduling as a reward.", "Telling employees that busy seasons are part of the job and nothing will change.", "Announcing that anyone who complains will be written up.", "Adding more rules about break times."], "ci": 0, "exp": "Recognition and meaningful rewards are proven motivators. The other choices increase pressure or dismiss employees’ concerns, which usually lowers morale further."}, {"stem": "At the end of a role-play, the judge (bank president) asks: “Your plan depends on opening the new branch by June. What will you do if construction is delayed?” Which response would earn the most credit?", "opts": ["“Delays happen in every business, so we would just have to accept it.”", "“I’d prepare a backup plan now: if construction slips, we’ll open a temporary pop-up desk in the shopping center next door and expand mobile-banking promotions, so we still reach new customers on schedule.”", "“I’m confident the construction will be on time, so we don’t need a backup plan.”", "“If it’s delayed, I would cancel the whole project and start over next year.”"], "ci": 1, "exp": "Judges look for contingency planning: a specific, realistic backup that still meets the goal. Ignoring the risk, shrugging it off, or giving up are weak responses."}, {"stem": "During a meeting with a new client, a financial advisor keeps checking her phone and glancing at the clock while the client explains his goals. Even though she says, “I’m listening,” the client feels ignored. This situation shows that", "opts": ["spoken words are always more important than body language", "nonverbal cues can send a stronger message than spoken words", "the advisor should have sent a written summary instead", "clients usually prefer short meetings"], "ci": 1, "exp": "Nonverbal communication — eye contact, posture, gestures — often carries more weight than words. When the two conflict, listeners tend to believe the body language."}, {"stem": "Jordan, a freelance designer, creates an original illustrated guide to budgeting for Summit Credit Union’s website. Which type of legal protection automatically applies to Jordan’s illustrations once they are created in a fixed form?", "opts": ["patent", "trademark", "trade secret", "copyright"], "ci": 3, "exp": "Copyright protects original creative works (writing, art, music) automatically once they are fixed in a tangible form. Patents protect inventions, trademarks protect brand names and logos, and trade secrets protect confidential business information."}, {"stem": "A student researching credit-card interest rates for a presentation finds four sources. Which is most likely to be credible?", "opts": ["A recent report from the Federal Reserve that lists its data sources.", "An anonymous social-media post with no date.", "A credit-card company’s advertisement claiming it has “the best rates anywhere.”", "A blog post from 2009 that does not name its author."], "ci": 0, "exp": "Credible sources are current, identify their authors and data, and have no reason to mislead. An ad has a sales motive, and anonymous or outdated sources can’t be checked."}, {"stem": "A new online bank wants to attract customers quickly from established competitors. It offers checking accounts with no monthly fee for the first two years. This is an example of", "opts": ["price skimming", "prestige pricing", "odd-even pricing", "penetration pricing"], "ci": 3, "exp": "Penetration pricing sets a low price at launch to win market share quickly. Skimming starts high and lowers later; prestige pricing keeps prices high to signal quality."}, {"stem": "A credit union is choosing a vendor to supply new ATMs. Vendor A is the cheapest but has poor reviews for repairs. Vendor B costs 8 percent more but guarantees service within four hours. Why might Vendor B be the better choice?", "opts": ["Reliability and service affect total cost, and ATMs that stay broken frustrate members and lose transactions.", "Price should never be considered when purchasing.", "The most expensive vendor is always the highest quality.", "Vendor B is better because it is a larger company."], "ci": 0, "exp": "Good purchasing looks at total value — quality, reliability, and service — not just the purchase price. Long ATM outages cost money and goodwill."}, {"stem": "A customer slips on a freshly mopped floor at Lakeview Savings Bank. No warning sign had been placed, and the customer breaks a wrist. Under tort law, the bank is most likely liable for", "opts": ["fraud, because the bank intentionally misled the customer", "negligence, because it failed to take reasonable care to prevent a foreseeable injury", "breach of contract, because the customer has a checking account with the bank", "nothing, because accidents on business property are always the customer’s responsibility"], "ci": 1, "exp": "Negligence is failing to use the care a reasonable person or business would use. A wet floor with no sign is a foreseeable hazard. There was no intent (not fraud), and the injury is not about the account agreement (not breach of contract)."}, {"stem": "An insurance agency stores clients’ Social Security numbers and medical histories on its computers. Which practice best protects this information?", "opts": ["Saving the files on each employee’s personal laptop for easy access.", "Using the same simple password for every account so no one gets locked out.", "Encrypting the data, limiting access to employees who need it, and keeping secure backups.", "Emailing client files to coworkers whenever someone needs them."], "ci": 2, "exp": "Sensitive data should be encrypted, access should be limited to those who need it, and backups should be secure. Personal laptops, shared simple passwords, and emailing files all increase the risk of a breach."}, {"stem": "Priya, an intern at an investment firm, notices a coworker entering a client’s birth date incorrectly on an account form. The coworker asks her not to mention it because it was “just a typo.” What should Priya do?", "opts": ["Politely point out the error so it can be corrected, and tell her supervisor if it isn’t fixed, because accurate client records matter.", "Ignore it because she is only an intern.", "Post about the mistake on social media as a warning.", "Correct the form secretly without telling anyone."], "ci": 0, "exp": "Ethical behavior means being honest and protecting clients, even when it is uncomfortable. Raising the issue respectfully lets it be fixed; secret changes or public posts are inappropriate."}, {"stem": "A bank creates one savings account for “young adults who value travel and adventure” and another for “retirees who want safety and steady income.” Which kind of market segmentation is mainly being used when the bank groups customers by values and lifestyles?", "opts": ["product segmentation", "geographic segmentation", "behavioral segmentation", "psychographic segmentation"], "ci": 3, "exp": "Psychographic segmentation groups customers by values, interests, attitudes, and lifestyles. Geographic uses location; behavioral uses how people use or buy a product."}, {"stem": "A teller notices that the carpet near the vault door is torn and that coworkers keep tripping on it. What should she do first?", "opts": ["Mention it at the annual safety meeting next spring.", "Fix the carpet herself during her lunch break with tape from home.", "Wait until someone is injured so management will take it seriously.", "Report the hazard to her supervisor right away and help mark the area so people avoid it."], "ci": 3, "exp": "Workplace safety rules call for reporting hazards promptly and warning others. Waiting or making an untrained repair can lead to injuries."}, {"stem": "A bank manager compares each branch’s actual monthly expenses with the budget and finds that one branch is 15 percent over. She meets with that branch to find the cause and fix it. This is an example of which management function?", "opts": ["controlling", "staffing", "organizing", "planning"], "ci": 0, "exp": "Controlling means measuring actual performance against standards (like a budget) and taking corrective action. Planning sets the goals and budget in the first place."}, {"stem": "At the end of a role-play, the judge (a credit union member) asks: “I was charged a $35 late fee because your website was down on the day I tried to pay. Will you remove it?” Which response would earn the most credit?", "opts": ["“I’ll remove this fee and every future late fee you ever get, no matter the reason.”", "“That’s a great question. Customer satisfaction is very important to our credit union.”", "“Our policy says all late fees must be paid, so I can’t help, but you can file a complaint online.”", "“I’m sorry the outage kept you from paying on time. I can confirm our site was down that day, so I will remove the $35 fee today, and I’ll show you how to set up automatic payments so this can’t happen again.”"], "ci": 3, "exp": "The best answer shows empathy, checks the facts, solves the specific problem, and prevents it from happening again. Refusing ignores the bank’s own error, the general statement avoids the question, and promising to waive every future fee is an unrealistic commitment."}, {"stem": "In a role-play, your performance indicator is “Explain the time value of money.” A 16-year-old client (judge) asks why she should start saving now instead of waiting until college. Which statement best addresses the indicator?", "opts": ["“Saving is a good habit, and everyone should save money.”", "“Money you have today is worth more than the same amount later because it can earn interest. If you save $50 a month now, the interest also earns interest, so starting four years earlier can leave you with noticeably more than if you wait.”", "“Time value of money means time is money, so you should work more hours.”", "“Prices never change, so it doesn’t matter when you start saving.”"], "ci": 1, "exp": "The best answer explains the concept (a dollar today can grow through interest and compounding) and applies it to the client. The others misdefine it, stay general, or state something false."}, {"stem": "Devon has a DECA practice role-play due Friday, a math test Thursday, and a shift at his part-time job Wednesday. Which approach shows the best time management?", "opts": ["Work on whichever task feels most fun first and hope the rest gets done.", "Wait until Thursday night to start everything so he works under pressure.", "List the tasks by deadline and importance, schedule study blocks around his shift, and start preparing for the role-play early in the week.", "Skip his work shift without telling his manager."], "ci": 2, "exp": "Prioritizing by deadline and importance and scheduling time in advance is effective time management. The other options create last-minute stress or break commitments."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
