<style>

<script>
(function(){

var QUIZ_KEY = "quiz_satgrammar_20_20260731_v1";
var ATT_KEY = "quiz_satgrammar_20260731_att_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Sion] SAT Grammar - Results";
var TAG_COLORS = {};

var RAW_QUESTIONS = [{"box": "The city's new transit line was projected to reduce downtown traffic by fifteen percent. ___ ridership in its first year fell far short of projections, and congestion has barely changed.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Instead,", "As a result,", "Similarly,", "In particular,"], "ci": 0, "exp": "The first sentence states an expectation (reduced traffic), and the second sentence reports that this expectation did not come true. \"Instead\" correctly signals that the actual outcome replaced the anticipated one. \"As a result\" would wrongly suggest the low ridership was caused by the projection itself. \"Similarly\" wrongly implies agreement between the two ideas rather than a reversal. \"In particular\" wrongly frames the second sentence as a specific example of the first."}, {"box": "The committee's final report, which incorporates feedback from dozens of community meetings held over the past two years, ___ scheduled for release next month.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "have been", "were"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"report\"; the long clause beginning with \"which\" describes the report but does not change the number of the subject. A singular verb is required, so \"is\" is correct. \"Are\" and \"were\" are plural forms that do not agree with \"report,\" and \"have been\" incorrectly shifts into a compound form that also disagrees in number with the singular subject."}, {"box": "During the internship, students are expected to shadow senior engineers, document daily observations, and ___ a final presentation summarizing what they learned.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["deliver", "delivering", "having delivered", "to deliver"], "ci": 0, "exp": "The sentence lists three parallel duties governed by \"are expected to\": \"shadow... document... deliver.\" Because \"to\" already applies to the entire series, each item should appear in its base form. \"Delivering\" and \"having delivered\" break the parallel pattern established by \"shadow\" and \"document,\" and \"to deliver\" incorrectly repeats the infinitive marker that has already been established for the whole list."}, {"box": "The museum's new wing was designed to hold rotating exhibits ___ the original building was never intended to accommodate large traveling collections.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["; the", "; and the", "the", ", the"], "ci": 0, "exp": "Both halves of the sentence are independent clauses that could stand alone, so they must be joined with a semicolon, a comma plus a coordinating conjunction, or separated into two sentences. A semicolon alone correctly joins the two related independent clauses. Joining them with only a comma creates a comma splice, and omitting punctuation entirely creates a run-on. Adding \"and\" after the semicolon is redundant, since a semicolon already separates the clauses without needing a conjunction."}, {"box": "When the researchers compared the new alloy to the older composite, <span style=\"text-decoration:underline\">they found that it corroded more quickly under humid conditions</span>.", "stem": "Which choice best revises the underlined portion to eliminate the ambiguous pronoun reference?", "opts": ["they found that the older composite corroded more quickly under humid conditions", "they found that it corroded more quickly, according to humid conditions", "they found corrosion happened more quickly than it did under humid conditions", "they found that it, being tested under humid conditions, corroded more quickly"], "ci": 0, "exp": "In the original sentence, \"it\" could refer to either the new alloy or the older composite, so the meaning is unclear. Naming \"the older composite\" directly removes the ambiguity and makes clear which material corroded faster. The other choices keep the vague pronoun \"it\" or add awkward phrasing without ever specifying which material is meant."}, {"box": "Having sat untouched in the archive for over fifty years, the librarian was surprised to discover the manuscript's fragile condition.", "stem": "Which choice best revises the sentence to correct the misplaced modifier?", "opts": ["Having sat untouched in the archive for over fifty years, the manuscript surprised the librarian with its fragile condition.", "Having sat untouched in the archive for over fifty years, the librarian's surprise concerned the manuscript's fragile condition.", "The librarian, having sat untouched in the archive for over fifty years, was surprised to discover the manuscript's fragile condition.", "Sitting untouched in the archive, the librarian discovered the manuscript had been there for over fifty years and was surprised."], "ci": 0, "exp": "The introductory phrase \"having sat untouched in the archive for over fifty years\" describes the manuscript, not the librarian, so the noun immediately following the comma must be \"the manuscript.\" Revising to \"Having sat untouched in the archive for over fifty years, the manuscript surprised the librarian with its fragile condition\" places \"the manuscript\" right after the modifier, fixing the error. The other choices still attach the phrase to \"the librarian\" or introduce new confusion about who or what sat untouched."}, {"box": "The corporation announced that ___ quarterly earnings had exceeded analysts' expectations, though several of the company's competitors reported losses.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["its", "it's", "its'", "their"], "ci": 0, "exp": "The sentence requires a possessive form referring back to \"the corporation,\" a singular entity, so \"its\" (no apostrophe) is correct. \"It's\" is a contraction of \"it is\" and would not make sense here. \"Its'\" is not a real word in Standard English. \"Their\" is plural and does not agree with the singular subject \"the corporation.\""}, {"box": "The proposal, <span style=\"text-decoration:underline\">which was ultimately rejected by the board due to the fact that it exceeded the allotted budget by a significant margin</span>, will be revised and resubmitted next quarter.", "stem": "Which choice most effectively revises the underlined portion while keeping its meaning?", "opts": ["which the board ultimately rejected for exceeding the budget by a significant margin", "which was ultimately rejected due to it exceeding the budget, by a significant margin, according to the board", "which was, due to the fact of exceeding the budget significantly, ultimately rejected by the board", "which the board, due to the fact that the budget was exceeded significantly, ultimately rejected"], "ci": 0, "exp": "The original phrase \"due to the fact that it exceeded\" is wordy and can be replaced with the more concise \"for exceeding,\" without losing any meaning. Revising to \"which the board ultimately rejected for exceeding the budget by a significant margin\" makes this cut cleanly. The other choices keep the wordy \"due to the fact\" construction or rearrange the words awkwardly without actually removing the redundancy."}, {"box": "By the time the inspectors arrived at the site, the construction crew ___ the scaffolding, so the safety violation could no longer be verified.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had already dismantled", "already dismantled", "have already dismantled", "was already dismantling"], "ci": 0, "exp": "The dismantling was completed before the inspectors arrived, an earlier past action relative to another past action, which requires the past perfect tense \"had already dismantled.\" The simple past \"already dismantled\" does not clearly establish that the dismantling finished before the arrival. \"Have already dismantled\" incorrectly uses the present perfect, and \"was already dismantling\" wrongly suggests the action was still in progress when the inspectors arrived."}, {"box": "Early drafts of the treaty included strict enforcement mechanisms and clear penalties for noncompliance. ___ the final version, weakened by last-minute negotiations, left enforcement almost entirely voluntary.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Yet", "Consequently,", "Likewise,", "Specifically,"], "ci": 0, "exp": "The sentence contrasts the strict early drafts with the much weaker final version, so a word signaling contrast is needed. \"Yet\" correctly introduces that contrast. \"Consequently\" wrongly implies the final version resulted from the strict drafts. \"Likewise\" wrongly suggests the two versions were similar. \"Specifically\" wrongly frames the second sentence as a detailed example of the first rather than a reversal of it."}, {"box": "Each of the proposals submitted by the regional offices ___ reviewed independently before being forwarded to the central committee.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["is", "are", "were", "have been"], "ci": 0, "exp": "The subject of the sentence is \"each,\" a singular pronoun; the phrase \"of the proposals submitted by the regional offices\" is a prepositional phrase that does not change the number of the subject. A singular verb is required, so \"is\" is correct. \"Are,\" \"were,\" and \"have been\" are all plural forms that incorrectly treat \"proposals\" rather than \"each\" as the true subject."}, {"box": "The new policy not only reduces paperwork for small businesses but also ___ the approval process for larger firms seeking permits.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["simplifies", "simplifying", "has simplified", "will simplify"], "ci": 0, "exp": "The correlative pair \"not only... but also\" requires parallel grammatical forms on both sides. Since the first half uses the present-tense verb \"reduces,\" the second half must also use a matching present-tense verb, making \"simplifies\" correct. \"Simplifying\" breaks the parallel verb form, and \"has simplified\" and \"will simplify\" shift into different tenses that no longer match \"reduces.\""}, {"box": "The lab's protocol requires three safety checks before any experiment begins___ calibration of the instruments, verification of ventilation, and confirmation that all personnel have completed training.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": [":", ",", ";", " and"], "ci": 0, "exp": "A colon is used to introduce a list that follows a complete independent clause, and \"the lab's protocol requires three safety checks before any experiment begins\" is a complete sentence that sets up the list of three items. A comma alone would create a run-on before a list of this length, a semicolon is reserved for joining independent clauses rather than introducing a list, and simply inserting \"and\" without any punctuation does not properly signal that a list is beginning."}, {"box": "If a student misses the deadline, ___ must submit a written request for an extension within five business days.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["he or she", "they", "you", "one that"], "ci": 0, "exp": "The antecedent \"a student\" is singular, so the pronoun that refers back to it must also be singular; \"he or she\" correctly matches in number. \"They\" is commonly used in casual speech but is not the choice that strictly matches the singular antecedent in this formal, error-testing context. \"You\" incorrectly shifts to second person, and \"one that\" is not grammatically suited to stand in for a person already named as \"a student.\""}, {"box": "The scholarship committee only awards funding to students who maintain a minimum grade point average of 3.5 throughout their enrollment.", "stem": "Which choice best revises the sentence so that the modifier \"only\" is placed to convey the intended meaning?", "opts": ["The scholarship committee awards funding only to students who maintain a minimum grade point average of 3.5 throughout their enrollment.", "The scholarship committee awards only funding to students who maintain a minimum grade point average of 3.5 throughout their enrollment.", "Only the scholarship committee awards funding to students who maintain a minimum grade point average of 3.5 throughout their enrollment.", "The scholarship committee awards funding to only students who maintain a minimum grade point average of 3.5 throughout their enrollment."], "ci": 0, "exp": "The intended meaning is that funding goes exclusively to qualifying students, so \"only\" should sit directly before \"to students.\" Revising to \"The scholarship committee awards funding only to students who maintain a minimum grade point average of 3.5 throughout their enrollment\" places it correctly. Placing \"only\" before \"awards\" wrongly limits what the committee does, before \"funding\" wrongly suggests funding is the sole thing given, and before \"the scholarship committee\" wrongly implies no other body awards such funding, none of which matches the intended meaning."}, {"box": "The two departments jointly funded the renovation, so the finished laboratory belongs equally to ___.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["both departments' budgets", "both department's budgets", "both departments's budgets", "both departments budget's"], "ci": 0, "exp": "Because two separate departments each possess their own budget collectively, the plural noun \"departments\" takes an apostrophe after the final \"s\" to show plural possession: \"departments'.\" \"Department's\" incorrectly treats the noun as singular, \"departments's\" adds a nonstandard extra \"s,\" and \"departments budget's\" misplaces the apostrophe onto the wrong noun entirely."}, {"box": "<span style=\"text-decoration:underline\">In spite of the fact that the bridge had been inspected only months earlier</span>, engineers still discovered several previously undetected cracks in the support beams.", "stem": "Which choice most effectively revises the underlined portion while keeping its meaning?", "opts": ["Although the bridge had been inspected only months earlier", "Despite the fact of the bridge's earlier inspection, occurring only months before", "In spite of the bridge, which had been inspected only months earlier, being so", "Regardless of the fact that months earlier is when the bridge had been inspected"], "ci": 0, "exp": "The phrase \"in spite of the fact that\" is a wordy way of expressing a simple contrast, and \"although\" conveys the same meaning far more concisely. The other choices either keep an awkward \"fact\" construction, add unnecessary clauses, or rearrange the sentence in a way that sounds unnatural, none of which is as economical as \"although.\""}, {"box": "When the auditors finally released their findings, the accounting firm ___ its records for nearly three months, far longer than the standard review period.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had been reviewing", "was reviewing", "has been reviewing", "reviewed"], "ci": 0, "exp": "The reviewing began before and continued up until the moment the findings were released, an ongoing action stretching back before another past event, which calls for the past perfect progressive \"had been reviewing.\" \"Was reviewing\" does not capture that the review had already been underway for months prior. \"Has been reviewing\" incorrectly shifts to the present perfect, and \"reviewed\" loses the sense of an extended, ongoing process."}, {"box": "The architect's first major commission ___ a community center in her hometown ___ remains her most celebrated project decades later.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": [", a community center in her hometown,", "a community center in her hometown", "; a community center in her hometown;", "a community center in her hometown,"], "ci": 0, "exp": "The phrase \"a community center in her hometown\" simply renames \"the architect's first major commission\" and is not essential to the sentence's meaning, so it must be set off with a pair of commas on both sides. Leaving out both commas removes the necessary separation, using semicolons is reserved for joining independent clauses rather than setting off an appositive, and including only the closing comma leaves the phrase improperly attached to the sentence at its start."}, {"box": "Neither the lead engineer nor the junior technicians ___ aware that the backup generator had failed during the test.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "is", "has been"], "ci": 0, "exp": "With \"neither... nor\" constructions, the verb agrees with the noun closest to it, which here is the plural \"junior technicians,\" so the plural verb \"were\" is correct. \"Was\" and \"is\" are singular forms that would only be correct if the closer noun were singular, and \"has been\" is also a singular construction that fails to match \"junior technicians.\""}];

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = 25;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(q.tag){
    tagEl.style.display='inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagEl.style.display='none';
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
