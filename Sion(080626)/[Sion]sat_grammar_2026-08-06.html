<script>

var TIMER_DEFAULT_MIN = 20;

var RAW_QUESTIONS = [{"tag": "Subject-Verb Agreement", "box": "The findings of the research team, compiled after nearly a decade of fieldwork across three continents, _____ still being debated by specialists in the field.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["are", "is", "was", "has been"], "ci": 0, "exp": "The subject is the plural noun 'findings'; the phrase 'of the research team, compiled after nearly a decade of fieldwork across three continents' is a modifier separating the subject from the verb, so it does not change the number of the subject. 'is', 'was', and 'has been' incorrectly treat the subject as singular."}, {"tag": "Pronoun Reference", "box": "When the museum's curators moved the sculptures away from the newly installed skylights, _____ had already suffered visible discoloration from prolonged sun exposure.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["several of the pieces", "they", "the skylights", "it"], "ci": 0, "exp": "'several of the pieces' removes the ambiguity created by a pronoun that could grammatically refer to either 'sculptures' or 'skylights', and it matches the logical meaning, since the sculptures are what suffered discoloration. 'they' is ambiguous between the two plural nouns that precede it. 'the skylights' assigns discoloration to the wrong noun. 'it' incorrectly uses a singular pronoun for a plural antecedent."}, {"tag": "Parallel Structure", "box": "The internship required the students to analyze quarterly reports, draft client memos, and _____ presentations to senior partners twice a month.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["deliver", "delivering", "to deliver", "that they deliver"], "ci": 0, "exp": "The sentence lists a series of actions the students were required to do: 'analyze quarterly reports, draft client memos, and deliver presentations', so the third item must match the base-verb form used in 'analyze' and 'draft'. 'delivering' shifts to a gerund, 'to deliver' shifts to an infinitive, and 'that they deliver' breaks the parallel list structure entirely."}, {"tag": "Modifier Placement", "box": "_____, the committee's proposal was rejected within minutes of its presentation.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Having overlooked several key budget constraints", "Overlooked by several key budget constraints", "Several key budget constraints having been overlooked", "To overlook several key budget constraints"], "ci": 0, "exp": "The introductory phrase must logically describe who did the overlooking, and the noun immediately following the comma is 'the committee's proposal', so the phrase needs to attribute the overlooking to an implied agent that the rest of the sentence can sensibly connect to the committee that made the proposal. 'Overlooked by several key budget constraints' illogically makes the constraints the ones doing the overlooking. 'Several key budget constraints having been overlooked' creates a dangling construction disconnected from 'the committee's proposal'. 'To overlook several key budget constraints' suggests purpose rather than a completed action, which does not fit the sentence's meaning."}, {"tag": "Apostrophes", "box": "Both _____ testimonies described the same sequence of events, yet the jury reached sharply different conclusions about what those events meant.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["witnesses'", "witness's", "witnesses", "witnesse's"], "ci": 0, "exp": "Since 'Both' signals more than one witness, the plural possessive form is needed, formed by adding only an apostrophe after the existing plural 's': 'witnesses''. 'witness's' is the singular possessive, incorrectly implying just one witness. 'witnesses' is plural but not possessive, so it cannot show ownership of 'testimonies'. 'witnesse's' is not a standard English spelling."}, {"tag": "Concision", "box": "The revised safety protocol was, in point of fact, actually implemented well before the regulatory deadline required it to be.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["The revised safety protocol was implemented well before the regulatory deadline required it to be.", "The revised safety protocol was, in point of fact, implemented well before the regulatory deadline required it to be.", "The revised safety protocol was actually implemented well before the regulatory deadline required it to be, in point of fact.", "In point of fact, the revised safety protocol was actually implemented well before the regulatory deadline required it to be."], "ci": 0, "exp": "'in point of fact' and 'actually' both signal the same idea of factual emphasis, so keeping only one of them (or neither) avoids redundancy while preserving the sentence's meaning; the first choice removes both. The other three choices all retain at least one of the redundant phrases alongside language that duplicates its function."}, {"tag": "Verb Tense", "box": "By the time the auditors arrived on site, the accounting team _____ the discrepancy and corrected the affected records.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had already discovered", "already discovered", "has already discovered", "was already discovering"], "ci": 0, "exp": "Because the discovery happened before another past event ('the auditors arrived'), the past perfect tense is required to show that sequence: 'had already discovered'. 'already discovered' is simple past, which does not clearly establish that the discovery preceded the auditors' arrival. 'has already discovered' is present perfect, which is inconsistent with a narrative set entirely in the past. 'was already discovering' suggests an ongoing action rather than a completed one before the auditors arrived."}, {"tag": "Transitions", "box": "The new irrigation system reduced water usage by nearly forty percent during its first season. _____, several farmers reported that crop yields remained essentially unchanged.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Notably", "Consequently", "Similarly", "Specifically"], "ci": 0, "exp": "The remark about unchanged crop yields adds a related but separate observation that stands alongside the water-usage finding rather than following from it, so a transition marking a noteworthy additional point fits best. 'Consequently' incorrectly implies the unchanged yields resulted from the reduced water usage. 'Similarly' incorrectly suggests the two facts are alike in kind, when one is about water use and the other about yield. 'Specifically' incorrectly implies the unchanged-yields remark narrows or details the water-usage finding, when it introduces a separate finding."}, {"tag": "Punctuation", "box": "The negotiations dragged on for nearly eighteen hours_____ neither delegation was willing to concede on the question of tariffs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["; neither delegation was willing to concede on the question of tariffs.", "; because neither delegation was willing to concede on the question of tariffs.", ", neither delegation was willing to concede on the question of tariffs.", ": because neither delegation was willing to concede on the question of tariffs."], "ci": 0, "exp": "Both halves of the sentence are independent clauses that are closely related in meaning, so a semicolon alone correctly joins them without a coordinating conjunction. Adding 'because' after the semicolon creates a fragment-like dependent clause that a semicolon cannot properly introduce. A comma alone between two independent clauses creates a comma splice. A colon typically introduces an explanation or list following a complete clause, not a subordinating conjunction like 'because'."}, {"tag": "Subject-Verb Agreement", "box": "Tucked behind the library's oldest archive room _____ a set of hand-drawn maps that no researcher had catalogued in over fifty years.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "have been", "is"], "ci": 0, "exp": "Because the sentence is inverted, the true subject 'a set of hand-drawn maps' comes after the verb, and the head noun of that subject is the plural 'maps', so the plural verb 'were' is required. 'was' and 'is' incorrectly treat the subject as singular by matching it to 'a set' alone. 'have been' is plural but shifts to a present-perfect form that does not fit the simple past narrative established by 'had... catalogued'."}, {"tag": "Pronoun Case", "box": "The award went to the intern _____ the review board, after considerable debate, judged to have shown the most initiative during the fellowship.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["whom", "who", "whose", "which"], "ci": 0, "exp": "The pronoun is the object of the verb 'judged' within the clause ('the review board judged whom'), so the objective case 'whom' is required, even though the phrase 'after considerable debate' separates the pronoun from the verb. 'who' is the subjective case, appropriate only if the pronoun itself were performing the action of judging. 'whose' incorrectly signals possession, which the sentence does not require. 'which' is used for things, not people."}, {"tag": "Parallel Structure", "box": "The new policy not only reduced processing times for routine claims but also _____ for reviewing the more complex cases that had previously taken months.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["created a clearer timeline", "a clearer timeline was created", "clarity was created in the timeline", "the timeline, made clearer,"], "ci": 0, "exp": "With correlative conjunctions like 'not only... but also', the grammatical structure following each half must match; since 'not only' is followed by the verb phrase 'reduced processing times', 'but also' must be followed by a parallel verb phrase, which only 'created a clearer timeline' provides. The other three choices shift into passive constructions or noun phrases that break the parallel structure established by 'reduced'."}, {"tag": "Modifier Placement", "box": "The editor explained that revising the manuscript _____ would strengthen its central argument considerably.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["thoroughly before publication", "before publication thoroughly", "thoroughly, before publication,", "before, publication thoroughly,"], "ci": 0, "exp": "Placing 'thoroughly' directly after 'revising the manuscript' and before 'before publication' avoids the squinting-modifier problem of an adverb that could ambiguously modify either the revising itself or the timing, while still reading smoothly. 'before publication thoroughly' awkwardly separates 'thoroughly' from the verb it modifies and leaves it unclear what 'thoroughly' is describing. The remaining two choices insert commas that disrupt the sentence without resolving the ambiguity."}, {"tag": "Apostrophes", "box": "The startup revised _____ pricing model twice within a single quarter, hoping to slow the rate of customer cancellations.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["its", "it's", "its'", "it is"], "ci": 0, "exp": "The sentence requires a possessive pronoun modifying 'pricing model', and the possessive form of 'it' is 'its', with no apostrophe. 'it's' is a contraction of 'it is', which does not fit the possessive meaning needed here. 'its'' is not a standard English word. 'it is' would create an ungrammatical phrase, 'it is pricing model'."}, {"tag": "Concision", "box": "Due to the fact that the bridge inspection revealed corrosion, engineers closed the northbound lanes for repairs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Because the bridge inspection revealed corrosion, engineers closed the northbound lanes for repairs.", "Due to the fact of the bridge inspection revealing corrosion, engineers closed the northbound lanes for repairs.", "Owing to the fact that the bridge inspection revealed corrosion, engineers closed the northbound lanes for repairs.", "In light of the fact that the bridge inspection revealed corrosion, engineers closed the northbound lanes for repairs."], "ci": 0, "exp": "'Because' conveys the same causal relationship as the wordier phrase 'due to the fact that' in a single word, making the sentence more concise without losing meaning. The remaining three choices all substitute one wordy causal phrase for another instead of trimming it down."}, {"tag": "Verb Tense", "box": "If the city council _____ the zoning request last spring, construction on the new transit hub would already be underway.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had approved", "approved", "would have approved", "has approved"], "ci": 0, "exp": "This is a past-hypothetical conditional describing an unreal past situation, which requires the past perfect in the 'if' clause: 'had approved'. 'approved' as simple past would instead describe a real, factual past condition, not a hypothetical one. 'would have approved' duplicates the conditional construction that belongs in the main clause, not the 'if' clause. 'has approved' is present perfect, which does not fit a scenario set in the past."}, {"tag": "Transitions", "box": "Most reviewers praised the film's pacing and visual style. _____, several critics singled out the same qualities as evidence that the director prioritized spectacle over substance.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Yet", "Moreover", "Therefore", "Likewise"], "ci": 0, "exp": "The remark about critics' reactions reinterprets the very qualities praised by most reviewers as a weakness, signaling a contrast in how the same evidence was judged, so 'Yet' correctly marks that shift. 'Moreover' would incorrectly suggest the critics' remark simply adds another point of praise. 'Therefore' would incorrectly suggest the critics' view follows logically from the reviewers' praise. 'Likewise' would incorrectly suggest the two groups reached similar conclusions."}, {"tag": "Punctuation", "box": "The report's central claim rests on a single data set collected in 2019_____ a limitation the authors acknowledge only in a footnote.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": [", a limitation the authors acknowledge only in a footnote.", ", a limitation, the authors acknowledge only in a footnote.", "; a limitation the authors acknowledge only in a footnote.", ": a limitation, the authors acknowledge only in a footnote."], "ci": 0, "exp": "'a limitation the authors acknowledge only in a footnote' is a noun phrase renaming 'a single data set collected in 2019', so it functions as an appositive and should be set off with a single comma, not joined as if it were an independent clause. A semicolon is reserved for joining two independent clauses, but the phrase after it is not independent. Inserting an extra comma after 'limitation' incorrectly splits the appositive from the clause that describes it. A colon suggests a formal list or explanation is being introduced, which does not fit this appositive construction."}, {"tag": "Subject-Verb Agreement", "box": "Neither the department heads nor the dean _____ willing to finalize the budget before the enrollment figures were confirmed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["was", "were", "have been", "are"], "ci": 0, "exp": "With 'neither... nor' constructions, the verb agrees with the closer subject, which here is the singular 'the dean', so the singular verb 'was' is correct. 'were' and 'are' incorrectly match the verb to the farther, plural subject 'the department heads' instead of the nearer one. 'have been' is also plural and shifts to a present-perfect form that does not fit the past-tense context established by 'were confirmed'."}, {"tag": "Pronoun-Antecedent Agreement", "box": "Each of the applicants who advanced to the final round was asked to submit _____ portfolio no later than Friday.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["his or her", "their", "its", "the"], "ci": 0, "exp": "'Each' is a singular indefinite pronoun, and in this sentence's formal register the traditionally correct singular possessive is 'his or her', agreeing in number with 'Each' rather than with the plural noun 'applicants' inside the modifying clause. 'their' treats the antecedent as plural, which conflicts with the strictly singular 'Each' in this formal context. 'its' is used for things, not people. 'the' fails to indicate whose portfolio is meant."}];

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}
function R(idx,inner){var i=idx?'<span class="radical-index">'+idx+'</span>':'';return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>';}


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();

function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(tagEl){
    if(q.tag){
      tagEl.style.display='inline-block';
      tagEl.textContent = q.tag;
      tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
    } else {
      tagEl.style.display='none';
    }
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi && q.exp){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
