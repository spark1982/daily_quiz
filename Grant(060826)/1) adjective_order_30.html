  .option-btn.reveal { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  #explanation { display: none; background: #fff8e1; border-left: 4px solid #f0a500; border-radius: 8px; padding: 12px 14px; font-size: 0.88rem; color: #5a3e00; margin-bottom: 14px; line-height: 1.6; }
  #navRow { display: flex; gap: 10px; margin-top: 6px; }
  .nav-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; background: #185FA5; color: #fff; transition: background 0.15s; }

  #prevBtn { background: #e8edf4; color: #333; }

  .result-card { border-radius: 10px; padding: 10px 12px; cursor: pointer; border: 2px solid transparent; }

const ORDER_HINT = "Order of Adjectives: ① number  ② opinion  ③ size  ④ shape  ⑤ condition  ⑥ age  ⑦ color  ⑧ origin  ⑨ material  ⑩ purpose";

const STORAGE_KEY = 'quiz_adj_order_30_v1';
let state = { cur: 0, answers: {}, shuffles: {}, showResults: false, qOrder: null };
let QUESTIONS = [];

function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (typeof s.cur !== 'number' || s.cur < 0 || s.cur >= QUESTIONS_RAW.length) throw new Error();
    if (typeof s.answers !== 'object' || typeof s.shuffles !== 'object') throw new Error();
    state = s;
  } catch(e) {
    localStorage.removeItem(STORAGE_KEY);
    state = { cur: 0, answers: {}, shuffles: {}, showResults: false, qOrder: null };
  }
}

function initQOrder() {
  if (state.qOrder && state.qOrder.length === QUESTIONS_RAW.length) return;
  const arr = Array.from({length: QUESTIONS_RAW.length}, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  state.qOrder = arr;
  saveState();
}

function buildQuestions() {
  return state.qOrder.map(ri => {
    const r = QUESTIONS_RAW[ri];
    return { badge: r.badge, q: r.q, options: r.o, ci: 0, exp: r.exp };
  });
}

function getShuffle(qi) {
  if (!state.shuffles[qi]) {
    const n = QUESTIONS[qi].options.length;
    let arr = Array.from({length: n}, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    state.shuffles[qi] = arr;
    saveState();
  }
  return state.shuffles[qi];
}

function buildDotNav() {
  const nav = document.getElementById('dotNav');
  nav.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const d = document.createElement('button');
    d.className = 'dot';
    d.textContent = i + 1;
    if (state.answers[i] !== undefined) {
      d.classList.add(state.answers[i] === getShuffle(i).indexOf(0) ? 'correct' : 'wrong');
    }
    if (!state.showResults && i === state.cur) d.classList.add('current');
    d.addEventListener('click', () => { state.showResults = false; state.cur = i; saveState(); render(); });
    nav.appendChild(d);
  }
  if (state.showResults) {
    const pill = document.createElement('button');
    pill.className = 'dot results-pill';
    pill.textContent = 'Results';
    pill.addEventListener('click', () => { state.showResults = true; saveState(); render(); });
    nav.appendChild(pill);
  }
}

function render() {
  try {
    buildDotNav();
    const qa = document.getElementById('quizArea');
    const ra = document.getElementById('resultsArea');
    if (state.showResults) {
      qa.style.display = 'none';
      ra.style.display = 'block';
      showResults();
    } else {
      ra.style.display = 'none';
      qa.style.display = 'block';
      showQuestion();
    }
  } catch(e) {
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('quizArea').innerHTML = '<p style="color:red;padding:20px;">An error occurred. Please refresh.</p>';
  }
}

function showQuestion() {
  const qi = state.cur;
  const q = QUESTIONS[qi];
  const shuffle = getShuffle(qi);
  const answered = state.answers[qi] !== undefined;
  const chosenIdx = state.answers[qi];
  const correctShuffledIdx = shuffle.indexOf(0);
  const isLast = qi === QUESTIONS.length - 1;

  let optHtml = '';
  const labels = ['A', 'B', 'C', 'D'];
  shuffle.forEach((origIdx, shuffledIdx) => {
    let cls = '';
    if (answered) {
      if (shuffledIdx === chosenIdx) cls = shuffledIdx === correctShuffledIdx ? 'correct' : 'wrong';
      else if (shuffledIdx === correctShuffledIdx) cls = 'reveal';
    }
    optHtml += `<button class="option-btn ${cls}" onclick="choose(${shuffledIdx})" ${answered ? 'disabled' : ''}><b>${labels[shuffledIdx]}.</b> ${q.options[origIdx]}</button>`;
  });

  const expLines = q.exp.split('\n').join('<br>');
  const expDisplay = (answered && chosenIdx !== correctShuffledIdx) ? 'block' : 'none';

  document.getElementById('quizArea').innerHTML = `
    <div class="type-badge">${q.badge}</div>
    <div id="qNum">Question ${qi + 1} / ${QUESTIONS.length}</div>
    <div id="qText">${q.q}</div>
    <div id="options">${optHtml}</div>
    <div id="explanation" style="display:${expDisplay}">${expLines}</div>
    <div id="navRow">
      <button class="nav-btn" id="prevBtn" onclick="go(-1)" ${qi === 0 ? 'disabled style="opacity:0.4"' : ''}>← Prev</button>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">${isLast ? 'See Results →' : 'Next →'}</button>
    </div>
  `;
}

function choose(shuffledIdx) {
  if (state.answers[state.cur] !== undefined) return;
  state.answers[state.cur] = shuffledIdx;
  saveState();
  render();
}

function go(dir) {
  const next = state.cur + dir;
  if (next < 0) return;
  if (next >= QUESTIONS.length) { state.showResults = true; saveState(); render(); return; }
  state.cur = next;
  saveState();
  render();
}

function showResults() {
  let correct = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    const ans = state.answers[i];
    if (ans === undefined) continue;
    if (ans === getShuffle(i).indexOf(0)) correct++;
  }
  let gridHtml = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const ans = state.answers[i];
    const q = QUESTIONS[i];
    let status, cls, correctText = '';
    if (ans === undefined) { status = 'Skipped'; cls = 'skipped'; correctText = q.options[0]; }
    else if (ans === getShuffle(i).indexOf(0)) { status = 'Correct ✓'; cls = 'correct'; }
    else { status = 'Wrong ✗'; cls = 'wrong'; correctText = q.options[0]; }
    gridHtml += `<div class="result-card ${cls}" onclick="jumpTo(${i})">
      <div class="rc-num">Q${i+1}</div>
      <div class="rc-status">${status}</div>
      ${correctText ? `<div class="rc-answer">✔ ${correctText}</div>` : ''}
    </div>`;
  }
  document.getElementById('resultsArea').innerHTML = `
    <div id="resultsScore">${correct} / ${QUESTIONS.length} Correct</div>
    <div id="resultsGrid">${gridHtml}</div>
    <button id="copyBtn" onclick="copyResults()">Copy All Results</button>
    <button id="startFreshBtn" onclick="openModal()">Start Fresh</button>
  `;
}

function jumpTo(i) { state.cur = i; state.showResults = false; saveState(); render(); }

function copyResults() {
  let text = 'Adjective Order Quiz\n', correct = 0;
  for (let i = 0; i < QUESTIONS.length; i++) {
    const ans = state.answers[i];
    const q = QUESTIONS[i];
    let status;
    if (ans === undefined) status = 'Skipped';
    else if (ans === getShuffle(i).indexOf(0)) { correct++; status = 'Correct'; }
    else status = 'Wrong (Correct: ' + q.options[0] + ')';
    text += `Q${i+1}: ${status}\n`;
  }
  text += `\nScore: ${correct} / ${QUESTIONS.length}`;
  try { navigator.clipboard.writeText(text).then(() => alert('Copied!')); }
  catch(e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Copied!'); }
}

function openModal() { document.getElementById('modal').classList.add('active'); }
document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('modal').classList.remove('active'));
document.getElementById('modalConfirm').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('active');
  localStorage.removeItem(STORAGE_KEY);
  state = { cur: 0, answers: {}, shuffles: {}, showResults: false, qOrder: null };
  saveState();
  initQOrder();
  QUESTIONS = buildQuestions();
  render();
});

loadState();
initQOrder();
QUESTIONS = buildQuestions();
render();
</script>
</body>
