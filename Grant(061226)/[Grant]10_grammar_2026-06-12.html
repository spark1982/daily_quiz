<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Grant] Grammar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
.top-bar{background:#fff;text-align:center;padding:10px 12px 4px}
.date-lbl{font-size:2rem;font-weight:800;color:#185FA5}
.title-lbl{font-size:1.25rem;font-weight:700;color:#185FA5;margin-top:2px}
.att-lbl{font-size:0.85rem;color:#555;margin-top:2px;padding-bottom:6px}
.nav-row{background:#fff;display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;border-top:1px solid #e0e7ef;justify-content:center}
.nav-dot{width:30px;height:30px;border-radius:50%;border:2px solid #ccc;background:#e8edf4;font-size:0.68rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333}
.nav-dot.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.nav-dot.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.nav-dot.active{border-color:#185FA5;color:#185FA5}
.nav-dot.results-pill{width:auto;padding:0 12px;border-radius:16px;font-size:0.8rem}
.quiz-area{max-width:700px;margin:16px auto 0;padding:0 12px 40px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:0.78rem;font-weight:600;margin-bottom:10px}
.q-num{font-size:0.85rem;color:#666;margin-bottom:4px}
.q-text{font-size:1rem;line-height:1.7;margin-bottom:16px;color:#111}
.opts{display:flex;flex-direction:column;gap:10px}
.opt-btn{background:#e8edf4;color:#111;border:2px solid transparent;border-radius:8px;padding:11px 16px;font-size:0.92rem;text-align:left;cursor:pointer;transition:all 0.15s;font-family:inherit;line-height:1.45}
.opt-btn:hover{background:#d0d9e8}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn.wrong{background:#FCEBEC;border-color:#E24B4A;color:#501313}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn:disabled{cursor:default}
.exp-box{background:#f7f9fc;border-left:4px solid #185FA5;padding:10px 14px;border-radius:0 8px 8px 0;margin-top:12px;font-size:0.88rem;color:#333;line-height:1.65;display:none}
.nav-btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.nav-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:0.9rem;font-weight:600;cursor:pointer}
.nav-btn.prev-btn{background:#e8edf4;color:#185FA5}
.results-area{max-width:700px;margin:16px auto;padding:0 12px 40px;display:none}
.results-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.results-title{font-size:1.3rem;font-weight:700;color:#185FA5;margin-bottom:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.res-item{border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;border:2px solid transparent}
.res-item.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.res-item.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.res-item.skipped{background:#f0f4f8;border-color:#aaa;color:#555}
.score-line{font-size:1.1rem;font-weight:700;color:#185FA5;margin-bottom:8px}
.action-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:0.88rem;font-weight:600;cursor:pointer;margin-right:8px;margin-top:8px}
.action-btn.sec{background:#e8edf4;color:#185FA5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:360px;width:90%;text-align:center}
.modal-box p{font-size:1rem;color:#333;margin-bottom:18px;line-height:1.5}
.btn-blue{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:0.9rem;font-weight:600;cursor:pointer;margin:4px}
.btn-gray{background:#e8edf4;color:#333;border:none;border-radius:8px;padding:9px 22px;font-size:0.9rem;cursor:pointer;margin:4px}
</style>
</head>
<body>
<div class="top-bar">
  <div class="date-lbl">2026-06-12</div>
  <div class="title-lbl">[Grant] Grammar</div>
  <div class="att-lbl" id="attLbl">Total Attempts: 0</div>
</div>
<div class="nav-row" id="navRow"></div>
<div class="quiz-area" id="quizArea">
  <div class="card">
    <div class="tag-badge" id="tagBadge"></div>
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="opts"></div>
    <div class="exp-box" id="expBox"></div>
    <div class="nav-btns">
      <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">Next</button>
    </div>
  </div>
</div>
<div class="results-area" id="resultsArea">
  <div class="results-card">
    <div class="results-title">Results</div>
    <div class="score-line" id="scoreLine"></div>
    <div class="res-grid" id="resGrid"></div>
    <div style="margin-top:14px">
      <button class="action-btn" onclick="copyRes()">Copy All Results</button>
      <button class="action-btn sec" onclick="openFreshModal()">Start Fresh</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p>Reset all progress and start fresh?</p>
    <button class="btn-blue" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="btn-gray" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>
<script>
(function(){
const KEY='quiz_grantgrammar_20_v1';
const ATT_KEY='quiz_grantgrammar_attempts_v1';
var qs=[
{tag:'Nouns',q:'Which word in the following sentence is a PROPER noun?\n"Last summer, my family visited Yellowstone National Park."',opts:['summer','family','visited','Yellowstone National Park'],ci:3,exp:'A proper noun names a specific person, place, or thing and is capitalized. "Yellowstone National Park" is the name of a specific place, so it is a proper noun. "Summer," "family," and "visited" are common or general words.'},
{tag:'Pronouns',q:'Choose the correct pronoun: "__________ and I are going to the science fair."',opts:['Him','Her','Me','She'],ci:3,exp:'When a pronoun is used as a subject (doing the action), use a subject pronoun: I, you, he, she, we, they. "She and I" are both subjects of the verb "are going." "Him," "Her," and "Me" are object pronouns used after verbs or prepositions, not as subjects.'},
{tag:'Verbs',q:'What type of verb is underlined in the sentence: "The soup smells delicious."',opts:['Action verb','Linking verb','Helping verb','Irregular verb'],ci:1,exp:'"Smells" connects the subject "soup" to the adjective "delicious" that describes it. Verbs like smell, taste, feel, look, and seem are linking verbs when they describe the subject rather than show action.'},
{tag:'Adjectives',q:'Which sentence uses an adjective correctly?',opts:['"She runs quick."','"He played good."','"The ancient ruins stood silently."','"They worked careful."'],ci:2,exp:'An adjective modifies a noun. In option C, "ancient" correctly modifies the noun "ruins." Options A, B, and D use adjectives (quick, good, careful) where adverbs are needed (quickly, well, carefully) because they modify verbs.'},
{tag:'Adverbs',q:'Identify the adverb in this sentence: "The students quietly entered the library."',opts:['students','quietly','entered','library'],ci:1,exp:'"Quietly" is an adverb that modifies the verb "entered" — it tells HOW the students entered. Adverbs often end in -ly and answer questions like how, when, where, or how much.'},
{tag:'Subject-Verb Agreement',q:'Choose the correct verb: "Neither the cats nor the dog __________ been fed yet."',opts:['have','has','were','are'],ci:1,exp:'With "neither...nor," the verb agrees with the noun closest to it. The closest noun is "dog" (singular), so the correct verb is "has." This is called the rule of proximity.'},
{tag:'Verb Tenses',q:'Which sentence uses the PAST PERFECT tense correctly?',opts:['"She finished her homework."','"She had finished her homework before dinner."','"She will finish her homework."','"She is finishing her homework."'],ci:1,exp:'The past perfect uses "had + past participle" to show an action completed before another past action. "She had finished her homework before dinner" uses past perfect to show that finishing came before dinner (another past event).'},
{tag:'Commas',q:'Which sentence uses a comma correctly?',opts:['"I like soccer, but my brother prefers basketball."','"I like, soccer but my brother prefers basketball."','"I like soccer but, my brother prefers basketball."','"I, like soccer but my brother prefers basketball."'],ci:0,exp:'When two independent clauses are joined by a coordinating conjunction (for, and, nor, but, or, yet, so), a comma goes before the conjunction. Option A correctly places the comma before "but."'},
{tag:'Apostrophes',q:'Which sentence uses an apostrophe correctly?',opts:['"The three dog\'s were barking."','"The childrens\' books are on the shelf."','"The teacher\'s desk was covered in papers."','"Its\' raining outside."'],ci:2,exp:'"The teacher\'s desk" correctly uses an apostrophe to show possession (the desk belonging to the teacher). Option A incorrectly adds an apostrophe to a simple plural. Option B misplaces the apostrophe for an irregular plural. "Its\'" is not a word — "its" (no apostrophe) shows possession; "it\'s" means "it is."'},
{tag:'Sentence Types',q:'What type of sentence is this? "Finish your vegetables before you leave the table."',opts:['Declarative','Interrogative','Imperative','Exclamatory'],ci:2,exp:'An imperative sentence gives a command or request. It has an implied subject "you" and tells someone to do something. "Finish your vegetables" is a command, so it is imperative.'},
{tag:'Fragments and Run-ons',q:'Which of the following is a COMPLETE sentence?',opts:['Running through the park on a sunny day.','The storm lasted all night.','Because she was tired.','When the bell finally rang after a long day.'],ci:1,exp:'"The storm lasted all night" has a subject ("storm") and a predicate ("lasted all night"). The other options are fragments — they begin with a participle or subordinating conjunction and do not express a complete thought on their own.'},
{tag:'Conjunctions',q:'Choose the correct conjunction: "I wanted to go to the park, __________ it started raining."',opts:['and','so','but','for'],ci:2,exp:'"But" is a coordinating conjunction that shows contrast or contradiction. Wanting to go to the park and it starting to rain are contrasting situations. "And" adds information, "so" shows result, and "for" shows reason — none of these fit as well as "but."'},
{tag:'Prepositions',q:'Which word is a preposition in this sentence: "The cat jumped onto the table."',opts:['cat','jumped','onto','table'],ci:2,exp:'"Onto" is a preposition that shows the relationship between the cat and the table — specifically, the direction of movement. Prepositions link a noun or pronoun to the rest of the sentence, showing location, direction, time, or manner.'},
{tag:'Direct and Indirect Objects',q:'Identify the INDIRECT object in this sentence: "My teacher gave us a practice test."',opts:['teacher','gave','us','practice test'],ci:2,exp:'The indirect object tells to whom or for whom the action is done. "Gave" is the verb, "practice test" is the direct object (what was given), and "us" is the indirect object (who received it). "Teacher" is the subject.'},
{tag:'Capitalization',q:'Which sentence is capitalized correctly?',opts:['"My favorite Holiday is thanksgiving."','"We visited the amazon river last August."','"President Lincoln gave the Gettysburg Address."','"she goes to westfield middle school."'],ci:2,exp:'Option C correctly capitalizes "President" (used as a title before a name), "Lincoln" (proper name), and "Gettysburg Address" (name of a specific historical document). A: "Holiday" and "thanksgiving" are incorrect. B: "amazon river" should be capitalized as "Amazon River." D: "she" and "westfield middle school" should be capitalized.'},
{tag:'Homophones',q:'Choose the correct word: "Please put the groceries __________ on the counter."',opts:['their','there','they\'re','theyre'],ci:1,exp:'"There" refers to a place or location. "Their" shows possession (belonging to them). "They\'re" is a contraction of "they are." Since the sentence describes where to put the groceries (a location), "there" is correct.'},
{tag:'Active and Passive Voice',q:'Which sentence is written in ACTIVE voice?',opts:['The book was written by a famous author.','A medal was awarded to the athlete.','The chef prepared a delicious meal.','The trophy was won by our team.'],ci:2,exp:'In active voice, the subject performs the action. "The chef prepared a delicious meal" — the chef (subject) is doing the preparing. In the other options, the subject receives the action (passive voice): the book, medal, and trophy are all acted upon.'},
{tag:'Prefixes and Suffixes',q:'What does the prefix "mis-" mean in the word "misunderstand"?',opts:['again','not','wrongly','before'],ci:2,exp:'The prefix "mis-" means wrongly or incorrectly. To misunderstand means to understand something wrongly. Compare: mistake (a wrong action), mislead (to lead wrongly), misprint (a wrong printing).'},
{tag:'Compound Sentences',q:'Which sentence is a COMPOUND sentence?',opts:['After the rain stopped, we went outside.','The dog barked loudly at the mail carrier.','Mia finished her homework, and then she called her friend.','Running down the hill, he tripped on a rock.'],ci:2,exp:'A compound sentence contains two independent clauses joined by a coordinating conjunction (FANBOYS). "Mia finished her homework" and "she called her friend" are each independent clauses joined by "and." Option A is complex (dependent + independent clause). B is simple. D has a participial phrase.'},
{tag:'Complex Sentences',q:'Which sentence is a COMPLEX sentence?',opts:['The sun rose, and the birds began to sing.','Although it was cold, we played outside.','She cooked dinner, but he set the table.','They laughed and sang all evening.'],ci:1,exp:'A complex sentence has one independent clause and at least one dependent clause. "Although it was cold" is a dependent clause (begins with subordinating conjunction "although") and "we played outside" is the independent clause. Options A and C are compound sentences. Option D is a simple sentence with a compound predicate.'}
];

var state={cur:0,answers:{},shuffles:{},showResults:false};
function loadState(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.cur==='number'&&typeof s.answers==='object'&&s.answers!==null&&typeof s.shuffles==='object'&&s.shuffles!==null){if(s.cur<0||s.cur>=qs.length)s.cur=0;state=s;}}catch(e){localStorage.removeItem(KEY);}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
function loadAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
function saveAttempts(n){localStorage.setItem(ATT_KEY,String(n));}
function getShuffled(i){if(!state.shuffles[i]){var arr=qs[i].opts.map((_,j)=>j);for(var k=arr.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var t=arr[k];arr[k]=arr[r];arr[r]=t;}state.shuffles[i]=arr;saveState();}return state.shuffles[i];}

function render(){
  try{
    document.getElementById('attLbl').textContent='Total Attempts: '+loadAttempts();
    buildNav();
    if(state.showResults){
      document.getElementById('quizArea').style.display='none';
      document.getElementById('resultsArea').style.display='block';
      buildResults();
    } else {
      document.getElementById('quizArea').style.display='block';
      document.getElementById('resultsArea').style.display='none';
      buildQ();
    }
  }catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red">Error. Please refresh.</p></div>';document.getElementById('quizArea').style.display='block';}
}
function buildNav(){
  var row=document.getElementById('navRow');row.innerHTML='';
  for(var i=0;i<qs.length;i++){
    var d=document.createElement('button');d.className='nav-dot';d.textContent=i+1;
    if(state.answers[i]!==undefined)d.className+=(state.answers[i]===qs[i].ci?' correct':' wrong');
    if(!state.showResults&&i===state.cur)d.className+=' active';
    (function(idx){d.onclick=function(){if(state.showResults){state.showResults=false;saveState();}state.cur=idx;saveState();render();};})(i);
    row.appendChild(d);
  }
  if(state.showResults){var p=document.createElement('button');p.className='nav-dot results-pill active';p.textContent='Results';p.onclick=function(){state.showResults=true;saveState();render();};row.appendChild(p);}
}
function buildQ(){
  var q=qs[state.cur];
  document.getElementById('tagBadge').textContent=q.tag;
  document.getElementById('qNum').textContent='Question '+(state.cur+1)+' / '+qs.length;
  document.getElementById('qText').textContent=q.q;
  var shuffled=getShuffled(state.cur);var answered=state.answers[state.cur]!==undefined;var chosen=state.answers[state.cur];
  var container=document.getElementById('opts');container.innerHTML='';
  shuffled.forEach(function(origIdx){
    var btn=document.createElement('button');btn.className='opt-btn';btn.textContent=q.opts[origIdx];
    if(answered){btn.disabled=true;if(origIdx===q.ci)btn.className='opt-btn revealed';if(origIdx===chosen&&chosen!==q.ci)btn.className='opt-btn wrong';if(origIdx===chosen&&chosen===q.ci)btn.className='opt-btn correct';}
    (function(oIdx){btn.onclick=function(){pick(oIdx);};})(origIdx);
    container.appendChild(btn);
  });
  var exp=document.getElementById('expBox');
  if(answered&&chosen!==q.ci){exp.style.display='block';exp.textContent=q.exp;}else{exp.style.display='none';}
  document.getElementById('nextBtn').textContent=(state.cur===qs.length-1?'See Results →':'Next');
}
function pick(origIdx){if(state.answers[state.cur]!==undefined)return;state.answers[state.cur]=origIdx;saveState();render();}
function go(dir){
  if(dir===1&&state.cur===qs.length-1){var att=loadAttempts()+1;saveAttempts(att);state.showResults=true;saveState();render();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));saveState();render();
}
function buildResults(){
  var correct=0;var lines=['[Grant] Grammar Results - 2026-06-12'];
  var grid=document.getElementById('resGrid');grid.innerHTML='';
  for(var i=0;i<qs.length;i++){
    var item=document.createElement('div');item.className='res-item';var ans=state.answers[i];
    if(ans===undefined){item.className+=' skipped';item.textContent='Q'+(i+1)+': Skipped';}
    else if(ans===qs[i].ci){item.className+=' correct';item.textContent='Q'+(i+1)+': Correct';correct++;lines.push('Q'+(i+1)+': Correct');}
    else{item.className+=' wrong';item.textContent='Q'+(i+1)+': Wrong';lines.push('Q'+(i+1)+': Wrong');}
    (function(idx){item.onclick=function(){state.showResults=false;state.cur=idx;saveState();render();};})(i);
    grid.appendChild(item);
  }
  document.getElementById('scoreLine').textContent='Score: '+correct+' / '+qs.length+' correct';
  lines.push('Score: '+correct+'/'+qs.length);window._resText=lines.join('\n');
}
function copyRes(){if(navigator.clipboard){navigator.clipboard.writeText(window._resText||'');}else{var ta=document.createElement('textarea');ta.value=window._resText||'';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function closeFreshModal(){document.getElementById('freshModal').style.display='none';}
function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false};closeFreshModal();render();}

window.pick=pick;window.go=go;window.copyRes=copyRes;window.openFreshModal=openFreshModal;window.closeFreshModal=closeFreshModal;window.confirmFresh=confirmFresh;

loadState();render();
})();
</script>
</body>
</html>
