  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_24";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20261009";
var RAW_QUESTIONS = [{"stem": "Which of the following is a COMPLETE sentence?", "opts": ["The spider spun a web between the fence posts.", "Because the sun set too early in winter.", "Laughing at the jokes in the funny movie.", "A dozen eggs sitting in the wire basket."], "ci": 0, "exp": "\"The spider spun a web between the fence posts.\" is a complete sentence — subject: 'The spider', predicate: 'spun'. The others are fragments: a 'Because' clause, an -ing phrase, and a noun phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["three flat cotton sheets", "flat three cotton sheets", "cotton three flat sheets", "three cotton flat sheets"], "ci": 0, "exp": "Correct order: number (three) → shape (flat) → material (cotton) → noun\n✔ three flat cotton sheets", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "She lent me her bike.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["her bike", "me"], "ci": 0, "exp": "\"Her bike\" is the direct object (what was lent). \"Me\" is the indirect object (who borrowed it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "I _____ been trying to contact you all morning.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. The trying started in the past and is still ongoing.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The cat <b>scratched</b> the sofa.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The sofa ______ by the cat.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was scratched", "were scratched", "was scratching", "was scratch"], "ci": 0, "exp": "The new subject \"the sofa\" is singular and the action is in the past, so use was + the past participle \"scratched\": was scratched.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["This is, without a doubt the most exciting game of the season.", "This is without a doubt, the most exciting game of the season.", "This is, without a doubt, the most exciting game of the season.", "This is without a doubt the most exciting game of the season."], "ci": 2, "exp": "\"Without a doubt\" is a parenthetical interruption and must be set off by commas on both sides. Having only one comma on one side creates an unbalanced and incorrect structure.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["She is the only one of the students who have read all five books.", "He is the only one of the players who were selected for the all-star team.", "She is the only one of the students who has read all five books.", "He is the only one of the runners who are expected to break the record."], "ci": 2, "exp": "\"The only one\" is singular, so \"has read\" is correct. With \"the only one of,\" the relative clause verb is singular. \"Have read\" is plural — wrong. \"Were selected\" is plural — use \"was.\" \"Are expected\" is plural — use \"is.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "The remarkably talented young musician performed flawlessly before a completely silent, awestruck audience.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the VERBS in this sentence, and only the verbs?</span>", "opts": ["performed", "performed, silent", "remarkably, performed", "(none of these)"], "ci": 0, "exp": "'Performed' is the main verb.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The glacier slowly lost it's mass over decades.", "The judges' scores were revealed at the end.", "Theirs approach to the problem was unique.", "Benjamins kite got stuck in the tree."], "ci": 1, "exp": "<strong>\"judges'\"</strong> correctly places the apostrophe after the plural noun.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>Theirs</em> is a standalone pronoun; it cannot precede a noun. Use <em>their approach</em>.<br>• <em>Benjamins</em> is missing the apostrophe — should be <em>Benjamin's</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "The documentary about ocean pollution left many viewers deeply troubled and uncertain about the future.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["deeply troubled and uncertain about the future", "many viewers"], "ci": 0, "exp": "\"Deeply troubled and uncertain about the future\" is the objective complement — it describes the state left in \"many viewers.\" \"Many viewers\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "busy<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["busier / busiest", "busyer / busyest", "more busy / most busy", "busir / busist"], "ci": 0, "exp": "busy → busier / busiest (consonant + y: change -y to -i, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>wear</b> &rsaquo; Past: <b>wore</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["weared", "wore", "wearing", "worn"], "ci": 3, "exp": "'wear' is an irregular verb. Its past participle is 'worn'. Past perfect: had worn.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Before the invention of smartphones, people relied on printed maps and phone books to find information.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["relied", "invention", "find", "printed"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "The vehicle looks brand new since we <span style=\"text-decoration:underline;\">______</span> it just now.", "opts": ["had washed", "have washed", "will have washed", "were washing"], "ci": 1, "exp": "\"have washed\" is present perfect — we just washed it and it looks new now.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The horse is <b>galloping</b> across the field.", "The horses were <b>galloping</b> toward the finish line.", "The <b>galloping</b> horse kicked up clouds of dust.", "<b>Galloping</b> is the fastest gait a horse can perform."], "ci": 2, "exp": "In \"The galloping horse kicked up clouds of dust,\" \"galloping\" comes directly before the noun \"horse\" and describes what the horse is doing - this adjective use of an -ing word is a present participle. In \"The horse is galloping across the field\" and \"The horses were galloping toward the finish line,\" \"galloping\" is the main verb paired with \"is / were,\" making it part of the progressive tense. In \"Galloping is the fastest gait a horse can perform,\" \"galloping\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>deal</b>?", "opts": ["dealt", "dealed", "dealt", "dealted"], "ci": 0, "exp": "The past tense of <b>deal</b> is <b>dealt</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "He ________ the contract.", "opts": ["already signed", "has already signed"], "ci": 1, "exp": "Already = completed with present relevance, so use present perfect: has already signed.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">We only found out the truth after the meeting ended.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Only after the meeting ended we found out the truth.", "Only after the meeting ended had we found out the truth.", "Only after the meeting ended did we find out the truth.", "Only after did the meeting end did we find out the truth."], "ci": 2, "exp": "With \"Only after + clause\", the main clause inverts: \"Only after the meeting ended + did + we + find out...\". The base form \"find out\" (not \"found out\") follows \"did\". The correct form is: Only after the meeting ended did we find out the truth.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "The dog waited patiently _____ the door for its owner to come home from work every evening.", "opts": ["beside", "at", "near", "by"], "ci": 1, "exp": "\"At the door\" is a fixed English expression meaning right next to or just outside the door. \"Beside\" also works, but \"at the door\" is the most natural and common phrase.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "We are <u>ready</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Ready\" follows the linking verb \"are\" and describes the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "She <u>play</u> the piano every afternoon.", "opts": ["plays", "playes", "plais", "plies"], "ci": 0, "exp": "play → plays (vowel + y: just add -s, do NOT change to -ies)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["They are <b>competing</b> in the finals today.", "We were <b>competing</b> against the top team.", "<b>Competing</b> at the national level was her lifelong dream.", "He will be <b>competing</b> in the championship next week."], "ci": 2, "exp": "In \"Competing at the national level was her lifelong dream,\" \"competing\" is the subject of the sentence - a noun - which makes it a gerund. In the other three sentences, \"competing\" follows \"are / were / will be\" and describes an action in progress, so it is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "The top is <u>spin</u> on the table.", "opts": ["spinning", "spining", "spinn", "spinned"], "ci": 0, "exp": "spin → spinning (short vowel + single consonant: double the -n, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>wharf</b>?", "opts": ["wharfs", "wharves", "wharvs", "wharfes"], "ci": 1, "exp": "wharf → wharves (-f changes to -ves). A wharf is a dock where ships load and unload.", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
