<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Math Competition</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Sion] Math Competition</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>
    <div class="dots-panel" id="dots-panel" style="display:none;"></div>
  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>
    <button class="hint-btn" id="hint-btn" onclick="toggleHint()" style="display:none;">Show Hint</button>
    <div class="hint-box" id="hint-box"></div>
    <div class="exp-box" id="exp-box"></div>
    <div class="nav-btns">
      <button id="prev-btn" onclick="prevQ()">Prev</button>
      <button id="next-btn" onclick="goNext()">Next</button>
    </div>
  </div>

  <div class="results-card" id="results-card" style="display:none;">
    <h2>Results</h2>
    <div class="score-big" id="score-big"></div>
    <div id="score-detail" style="text-align:center;color:#555;font-size:0.9rem;"></div>
    <div class="action-row">
      <button class="btn-retry" onclick="startRetry()">Retry Wrong Ones</button>
      <button class="btn-fresh" onclick="openFreshModal()">Start Fresh</button>
    </div>
  </div>

  <button class="fresh-btn-bottom" onclick="openFreshModal()">Start Fresh</button>
</div>

<div class="modal-overlay" id="fresh-modal" style="display:none;">
  <div class="modal-box">
    <p>Reset all progress and start over?</p>
    <button class="modal-yes" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="modal-no" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261106";
var RAW_QUESTIONS = [{"stem": "A computer system considers a string of decimal digits a valid codeword if it contains an even number of 0<i>s</i>. Find a closed form for <i>a</i><sub><i>n</i></sub>, the number of valid <i>n</i>-digit codewords.", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)"], "ci": 3, "exp": "<b>What we need:</b> a formula for <i>a</i><sub><i>n</i></sub>, the number of strings of <i>n</i> decimal digits (0–9, any digit allowed in any place) that contain an even number of zeros.<br><br><b>Step 1 — Pair it with the opposite count.</b> Let <i>b</i><sub><i>n</i></sub> be the number of <i>n</i>-digit strings with an odd number of zeros. Every string is one or the other, so <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup>.<br><br><b>Step 2 — Build a string one digit at a time.</b> Add one more digit to a string of length <i>n</i> &minus; 1. If the new digit is one of the 9 nonzero digits, the number of zeros keeps its parity. If the new digit is 0, the parity flips. So<br><i>a</i><sub><i>n</i></sub> = 9<i>a</i><sub><i>n</i> &minus; 1</sub> + <i>b</i><sub><i>n</i> &minus; 1</sub>, and <i>b</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i> &minus; 1</sub> + 9<i>b</i><sub><i>n</i> &minus; 1</sub>.<br><br><b>Step 3 — Look at the difference.</b> Let <i>d</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub>. Subtracting the two lines: <i>d</i><sub><i>n</i></sub> = 8<i>a</i><sub><i>n</i> &minus; 1</sub> &minus; 8<i>b</i><sub><i>n</i> &minus; 1</sub> = 8<i>d</i><sub><i>n</i> &minus; 1</sub>. The empty string (length 0) has zero zeros, which is even, so <i>d</i><sub>0</sub> = 1 &minus; 0 = 1. Therefore <i>d</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>.<br><br><b>Step 4 — Solve the two equations.</b> <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> and <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>. Adding them: 2<i>a</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> + 8<sup><i>n</i></sup>, so <i>a</i><sub><i>n</i></sub> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>).<br><br><b>Answer check:</b> <i>n</i> = 1: the 9 one-digit strings 1–9 have zero zeros, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8 + 10) = 9 ✔. <i>n</i> = 2: 81 strings with no 0 plus the string 00 = 82, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(64 + 100) = 82 ✔. A computer count for <i>n</i> = 1 to 5 gives 9, 82, 756, 7048, 66384, matching the formula each time.<br><br><b>Trap:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>) is <i>b</i><sub><i>n</i></sub>, the count with an <i>odd</i> number of zeros. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>) comes from using 9 instead of 8 in Step 3 — forgetting that the one choice of 0 sends a string to the other group.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Lupe went to the store and paid for her purchase with a $10 bill. She found that the digits making the amount of her purchase could be rearranged to make the amount she received back in change. If her purchase amount and her change amount were different and each amount was at least $1, how many possible amounts of change could she have received? (MathCounts)", "opts": ["10", "8", "6", "4"], "ci": 1, "exp": "<b>What we need:</b> Lupe pays with $10. Her purchase and her change are different amounts, each at least $1, and the digits of one can be rearranged to give the other. How many different change amounts are possible?<br><br><b>Step 1 — Set up the digits.</b> Both amounts are between $1.00 and $9.00, so each has the form $<i>p</i>.<i>q</i><i>r</i> (three digits). Write the purchase as $<i>a</i>.<i>b</i><i>c</i> and the change as $<i>d</i>.<i>e</i><i>f</i>. Their sum is $10.00.<br><br><b>Step 2 — Add column by column.</b> The cents column: <i>c</i> + <i>f</i> ends in 0. If <i>c</i> = <i>f</i> = 0, the dimes column needs <i>b</i> + <i>e</i> = 10 (or both 0), and checking these few cases only gives $5.00 + $5.00, which is not allowed (the amounts must differ). So <i>c</i> + <i>f</i> = 10, with a carry of 1. Then the dimes column needs <i>b</i> + <i>e</i> + 1 = 10, so <i>b</i> + <i>e</i> = 9, and the dollars column needs <i>a</i> + <i>d</i> + 1 = 10, so <i>a</i> + <i>d</i> = 9.<br>So the change digits are <i>d</i> = 9 &minus; <i>a</i>, <i>e</i> = 9 &minus; <i>b</i>, <i>f</i> = 10 &minus; <i>c</i>.<br><br><b>Step 3 — Use \"same digits\".</b> We need {<i>a</i>, <i>b</i>, <i>c</i>} = {9 &minus; <i>a</i>, 9 &minus; <i>b</i>, 10 &minus; <i>c</i>} as lists of digits. A digit can never equal 9 minus itself (9 is odd). Going through where <i>c</i> can be matched, every possibility forces <i>c</i> = 10 &minus; <i>c</i>, so <i>c</i> = 5. (For example, if <i>c</i> = 9 &minus; <i>b</i> and 10 &minus; <i>c</i> = <i>a</i>, then the last pair needs <i>b</i> = 9 &minus; <i>a</i>, which again gives <i>c</i> = 5.) Then the other two digits must swap: <i>a</i> = 9 &minus; <i>b</i>, so <i>a</i> + <i>b</i> = 9.<br><br><b>Step 4 — Count.</b> The purchase is $<i>a</i>.<i>b</i>5 with <i>a</i> + <i>b</i> = 9 and <i>a</i> from 1 to 8 (so that the change 9 &minus; <i>a</i> is at least 1). That gives 8 purchases: $1.85, $2.75, $3.65, $4.55, $5.45, $6.35, $7.25, $8.15, and the change amounts are the same 8 numbers in reverse order. The purchase and change are always different because <i>a</i> + <i>d</i> = 9 is odd, so <i>a</i> ≠ <i>d</i>.<br><br><b>Answer:</b> 8 possible change amounts.<br><br><b>Answer check:</b> a computer check of every purchase from $1.00 to $9.00 finds exactly these 8 change amounts: $1.85, $2.75, $3.65, $4.55, $5.45, $6.35, $7.25, $8.15.<br><br><b>Trap:</b> answering 4 by counting each purchase–change pair only once. The question asks for change amounts, and $1.85 and $8.15 are two different change amounts.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "There are 13 green, 15 blue, and 17 red chameleons on Camelot Island. Whenever two chameleons of different colors meet, they both swap to the third color. Is it possible for all chameleons to become one color? (Russia)", "opts": ["impossible", "possible"], "ci": 0, "exp": "<b>What we need:</b> starting from 13 green, 15 blue and 17 red chameleons (45 in all), can a sequence of meetings ever make all 45 the same color?<br><br><b>Step 1 — See what one meeting does.</b> When two chameleons of different colors meet, those two colors each lose 1 and the third color gains 2. Write the counts as (<i>G</i>, <i>B</i>, <i>R</i>). For example, a green–blue meeting changes (<i>G</i>, <i>B</i>, <i>R</i>) into (<i>G</i> &minus; 1, <i>B</i> &minus; 1, <i>R</i> + 2).<br><br><b>Step 2 — Find something that never changes (an invariant).</b> Look at the difference of any two counts. In the green–blue meeting, <i>G</i> &minus; <i>B</i> does not change at all, while <i>G</i> &minus; <i>R</i> and <i>B</i> &minus; <i>R</i> each drop by 3. Every kind of meeting works the same way: each pairwise difference changes by 0 or by 3. So every pairwise difference keeps the <b>same remainder when divided by 3</b>.<br><br><b>Step 3 — Start values.</b> 13, 15, 17 leave remainders 1, 0, 2 when divided by 3 — three different remainders. So no two counts ever have a difference divisible by 3. In particular <i>G</i> &minus; <i>B</i> = 13 &minus; 15 = &minus;2 is never a multiple of 3, and it never will be.<br><br><b>Step 4 — Compare with the goal.</b> If all 45 chameleons were one color, the counts would be 45, 0, 0 in some order. Then the two colors with 0 would have difference 0, which <i>is</i> a multiple of 3. That contradicts Step 3, so this can never happen.<br><br><b>Answer:</b> impossible.<br><br><b>Answer check:</b> a computer search of every count triple reachable from (13, 15, 17) finds 360 reachable triples and none of them has two zeros.<br><br><b>Trap:</b> checking only the total (45 is fine) or trying a few meetings by hand does not prove anything. You need a quantity that every meeting preserves.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "There are positive integers <i>m</i> and <i>n</i> so that <i>x</i> = <i>m</i> + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>n</i></span></span> is a solution to the equation<br><br><i>x</i><sup>2</sup> &minus; 10<i>x</i> + 1 = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (<i>x</i> + 1).<br><br>Find <i>m</i> + <i>n</i>.", "opts": ["43", "61", "55", "48"], "ci": 2, "exp": "<b>What we need:</b> a solution of <i>x</i><sup>2</sup> &minus; 10<i>x</i> + 1 = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (<i>x</i> + 1) that has the form <i>x</i> = <i>m</i> + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>n</i></span></span> with positive integers <i>m</i> and <i>n</i>. Find <i>m</i> + <i>n</i>.<br><br><b>Step 1 — Remove the square root.</b> Let <i>t</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (so <i>t</i> > 0 and <i>x</i> = <i>t</i><sup>2</sup>). The equation becomes <i>t</i><sup>4</sup> &minus; 10<i>t</i><sup>2</sup> + 1 = <i>t</i>(<i>t</i><sup>2</sup> + 1) = <i>t</i><sup>3</sup> + <i>t</i>.<br><br><b>Step 2 — Divide by <i>t</i><sup>2</sup>.</b> <i>t</i><sup>2</sup> &minus; 10 + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span>. This is symmetric in <i>t</i> and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span>, so let <i>w</i> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span>. Then <i>t</i><sup>2</sup> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> = <i>w</i><sup>2</sup> &minus; 2.<br><br><b>Step 3 — Solve for <i>w</i>.</b> (<i>w</i><sup>2</sup> &minus; 2) &minus; 10 = <i>w</i>, so <i>w</i><sup>2</sup> &minus; <i>w</i> &minus; 12 = 0, which factors as (<i>w</i> &minus; 4)(<i>w</i> + 3) = 0. Since <i>t</i> > 0, <i>w</i> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span> > 0, so <i>w</i> = 4.<br><br><b>Step 4 — Solve for <i>t</i> and <i>x</i>.</b> <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span> = 4 gives <i>t</i><sup>2</sup> &minus; 4<i>t</i> + 1 = 0, so <i>t</i> = 2 ± <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>. Then <i>x</i> = <i>t</i><sup>2</sup> = (2 ± <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>)<sup>2</sup> = 4 ± 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> + 3 = 7 ± 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>.<br><br><b>Step 5 — Pick the right form.</b> 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">16 · 3</span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span>. The root 7 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span> has the form <i>m</i> + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>n</i></span></span> with <i>m</i> = 7, <i>n</i> = 48. (The other root, 7 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span>, has a minus sign, so it is not of that form.) So <i>m</i> + <i>n</i> = 7 + 48 = 55.<br><br><b>Answer check:</b> <i>x</i> = 7 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span> ≈ 13.9282. Left side: <i>x</i><sup>2</sup> &minus; 10<i>x</i> + 1 ≈ 55.7128. Right side: <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (<i>x</i> + 1) ≈ 3.7321 × 14.9282 ≈ 55.7128. ✔<br><br><b>Trap:</b> squaring both sides right away gives a degree-4 polynomial in <i>x</i> that is hard to factor; the substitution <i>t</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> and then <i>w</i> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span> is the key.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "The arithmetic mean of two distinct positive integers <i>x</i> and <i>y</i> is a two-digit integer. The geometric mean of <i>x</i> and <i>y</i> is obtained by reversing the digits of the arithmetic mean. What is |<i>x</i>&minus;<i>y</i>|? (AMC 12)", "opts": ["88", "77", "66", "54"], "ci": 2, "exp": "<b>What we need:</b> two different positive integers <i>x</i> and <i>y</i> whose arithmetic mean is a two-digit number, and whose geometric mean is that number with its digits reversed. Find |<i>x</i> &minus; <i>y</i>|.<br><br><b>Step 1 — Name the digits.</b> Let the arithmetic mean be 10<i>a</i> + <i>b</i>, so <i>x</i> + <i>y</i> = 2(10<i>a</i> + <i>b</i>). The geometric mean is 10<i>b</i> + <i>a</i>, so <i>x</i><i>y</i> = (10<i>b</i> + <i>a</i>)<sup>2</sup>.<br><br><b>Step 2 — Use the identity for (<i>x</i> &minus; <i>y</i>)<sup>2</sup>.</b> (<i>x</i> &minus; <i>y</i>)<sup>2</sup> = (<i>x</i> + <i>y</i>)<sup>2</sup> &minus; 4<i>x</i><i>y</i> = 4(10<i>a</i> + <i>b</i>)<sup>2</sup> &minus; 4(10<i>b</i> + <i>a</i>)<sup>2</sup>.<br>Expand: (10<i>a</i> + <i>b</i>)<sup>2</sup> &minus; (10<i>b</i> + <i>a</i>)<sup>2</sup> = 100<i>a</i><sup>2</sup> + <i>b</i><sup>2</sup> &minus; 100<i>b</i><sup>2</sup> &minus; <i>a</i><sup>2</sup> = 99(<i>a</i><sup>2</sup> &minus; <i>b</i><sup>2</sup>).<br>So (<i>x</i> &minus; <i>y</i>)<sup>2</sup> = 4 · 99(<i>a</i><sup>2</sup> &minus; <i>b</i><sup>2</sup>) = 396(<i>a</i><sup>2</sup> &minus; <i>b</i><sup>2</sup>).<br><br><b>Step 3 — Make it a perfect square.</b> 396 = 2<sup>2</sup> · 3<sup>2</sup> · 11. For 396(<i>a</i><sup>2</sup> &minus; <i>b</i><sup>2</sup>) to be a perfect square, <i>a</i><sup>2</sup> &minus; <i>b</i><sup>2</sup> must be 11 times a perfect square. Since <i>a</i> and <i>b</i> are digits, <i>a</i><sup>2</sup> &minus; <i>b</i><sup>2</sup> ≤ 81, so it is 11 or 44. If it were 44 = (<i>a</i> &minus; <i>b</i>)(<i>a</i> + <i>b</i>), the two factors must have the same parity (they differ by 2<i>b</i>), so they would be 2 and 22, giving <i>a</i> = 12 — not a digit. So <i>a</i><sup>2</sup> &minus; <i>b</i><sup>2</sup> = 11.<br>(<i>a</i> &minus; <i>b</i>)(<i>a</i> + <i>b</i>) = 11 with 11 prime gives <i>a</i> &minus; <i>b</i> = 1 and <i>a</i> + <i>b</i> = 11, so <i>a</i> = 6, <i>b</i> = 5.<br><br><b>Step 4 — Compute.</b> (<i>x</i> &minus; <i>y</i>)<sup>2</sup> = 396 · 11 = 4356, so |<i>x</i> &minus; <i>y</i>| = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">4356</span></span> = 66.<br><br><b>Answer check:</b> the arithmetic mean is 65, so <i>x</i> + <i>y</i> = 130; with a difference of 66 the numbers are 98 and 32. Their product is 3136 = 56<sup>2</sup>, and 56 is 65 reversed. ✔ A computer search over all pairs confirms this is the only pair.<br><br><b>Trap:</b> the answer is not the difference of the two means (65 &minus; 56 = 9). Always finish by finding the actual numbers <i>x</i> and <i>y</i> and checking them.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}];

    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
