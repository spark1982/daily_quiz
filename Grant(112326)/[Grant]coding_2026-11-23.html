<style>

  .nav-btns { display:flex; justify-content:space-between; margin-top:14px; gap:10px; }

  /* 2026-11-16 intro lessons + "new idea" boxes */

  .intro-body { font-size:1rem; line-height:1.55; }

  .sb { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; font-size:0.9rem; font-weight:700; color:#fff; display:inline-block; }

  .sb-event { background:#ffbf00; border-radius:16px 16px 8px 8px; }
  .sb-motion { background:#4c97ff; } .sb-looks { background:#9966ff; } .sb-control { background:#ffab19; }
  .sb-c { background:#ffab19; border-radius:8px; padding:7px 0 7px 12px; margin:2px 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .sb-c > .sb-inner { background:#fff; border-radius:6px 0 0 6px; margin:6px 0 6px 14px; padding:3px 6px; min-width:150px; }
  .try-box { background:#f5f9ff; border:1.5px dashed #185FA5; border-radius:10px; padding:10px; margin-top:10px; }
  .intro-nav { display:flex; justify-content:space-between; gap:10px; margin-top:14px; }
  .intro-nav button { flex:1; padding:11px; border-radius:10px; font-weight:800; font-size:0.95rem; cursor:pointer; border:1.5px solid #f5a623; background:#fff; color:#a5720a; }

  .learn-box summary { font-weight:800; color:#a5720a; cursor:pointer; }
  .parts { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; font-family: Menlo, Consolas, monospace; }
  .parts span { border-radius:6px; padding:4px 7px; background:#1e2533; color:#e8edf5; text-align:center; }

  @media (max-width:520px){ .cell { width:32px; height:32px; font-size:19px; } }

<script>
var TITLE = "[Grant] Coding";
var QUIZ_KEY = "grantcoding_10";
var INSTRUCTION = "Write Python to guide the robot through each maze, and read code to answer the questions. Press Run to test your code as many times as you like!";
var TODAY_STR = "20261123";
var ITEMS = [{"type": "puzzle", "tag": "Variables", "title": "The U-Turn", "goal": "Collect both gems 💎 and stop on the flag 🚩. Use the variable <code>gap<\/code> for <b>every<\/b> move.", "map": ["######", "#H..*#", "####.#", "####.#", "#F..*#", "######"], "palette": ["gap = 3", "hero.move_right(gap)", "hero.move_down(gap)", "hero.move_left(gap)", "hero.move_up(gap)"], "max_lines": 4, "must_use": ["gap"], "hint": "Count the squares: right, then down, then left. Are all three the same number?", "solution": "gap = 3\nhero.move_right(gap)\nhero.move_down(gap)\nhero.move_left(gap)", "explain": "Every side of the U is 3 squares long, so one box, <code>gap = 3<\/code>, works for all three moves: right 3 (gem), down 3 (gem), left 3 (flag).", "learn": {"title": "Warm-up: variables", "html": "A variable is a named box. You can put a number in the box once and use it again and again &mdash; even inside robot moves. For example, <code>jump = 2<\/code> then <code>hero.move_up(jump)<\/code> moves up 2."}, "id": "20261120-1", "tagcolor": "#f5a623"}, {"type": "mc", "tag": "Variables", "stem": "What does this code print?", "code": "x = 4\ny = x * 3\nprint(y)", "opts": ["4", "x * 3", "7", "12"], "ci": 3, "exp": "Line 1 puts 4 in <code>x<\/code>. Line 2 works out <code>x * 3<\/code> = 4 &times; 3 = 12 and puts it in <code>y<\/code>. So <code>print(y)<\/code> shows <b>12<\/b>. If you picked 7, you added instead of multiplied (<code>*<\/code> means times).", "opts_code": true, "id": "20261120-2", "tagcolor": "#f5a623"}, {"type": "mc", "tag": "Conditions", "stem": "What does this code print?", "code": "gems = 5\nif gems > 3:\n    print(\"Lots!\")\nelse:\n    print(\"A few\")", "opts": ["Lots!\nA few", "A few", "gems > 3", "Lots!"], "ci": 3, "exp": "<code>gems<\/code> is 5. The question <code>gems &gt; 3<\/code> asks &ldquo;is 5 greater than 3?&rdquo; &mdash; True. So Python runs only the line under <code>if<\/code> and shows <b>Lots!<\/b>. The <code>else<\/code> line is skipped; both lines never run together.", "opts_code": true, "learn": {"title": "New idea: if / else", "html": "<code>if<\/code> checks a True/False question. True &rarr; run the indented line under <code>if<\/code>. False &rarr; run the line under <code>else<\/code>. For example, 2 &gt; 9 is False, so this shows <b>no<\/b>:", "scratch": [{"t": "control", "text": "if ‹2 > 9› then"}, {"t": "looks", "text": "    say yes"}, {"t": "control", "text": "else"}, {"t": "looks", "text": "    say no"}], "code": "if 2 > 9:\n    print(\"yes\")\nelse:\n    print(\"no\")"}, "id": "20261120-3", "tagcolor": "#7b61ff"}, {"type": "puzzle", "tag": "Conditions", "title": "Bumper Path", "goal": "Collect both gems 💎 and stop on the flag 🚩. The loop runs 8 times. Each time, the robot should go <b>right<\/b> if it can, or <b>down<\/b> if a wall is in the way. Finish the <code>else<\/code> part.", "map": ["#######", "#H..###", "###*###", "###.*.#", "#####.#", "#####F#", "#######"], "palette": ["hero.move_down()", "hero.move_right()", "hero.move_left()", "hero.move_up()"], "start_code": "for i in range(8):\n    if hero.can_move_right():\n        hero.move_right()\n    else:\n", "max_lines": 5, "must_use": ["for", "if", "else"], "hint": "Under <code>else:<\/code> you need one line, indented 8 spaces (inside the loop AND inside else). What should the robot do when the right side is blocked?", "solution": "for i in range(8):\n    if hero.can_move_right():\n        hero.move_right()\n    else:\n        hero.move_down()", "explain": "Each trip through the loop the robot asks <code>can_move_right()<\/code>. Open floor &rarr; it steps right; wall &rarr; the <code>else<\/code> line makes it step down. That simple rule follows the whole bumpy path: right, right, down, down, right, right, down, down &mdash; 8 moves, ending on the flag.", "learn": {"title": "Decide inside a loop", "html": "Put an <code>if / else<\/code> inside a loop and the robot makes a new choice every time around. The <code>if<\/code> line is indented 4 spaces (inside the loop), and the moves under it are indented 8 spaces."}, "id": "20261120-4", "tagcolor": "#7b61ff"}, {"type": "mc", "tag": "Debugging", "stem": "This code should print <b>Game over<\/b> when <code>lives<\/code> is 0, but Python gives an error. What is the mistake?", "code": "lives = 0\nif lives = 0:\n    print(\"Game over\")", "opts": ["<code>print<\/code> should not be indented", "Line 2 needs <code>==<\/code> (two equals signs) to compare", "<code>Game over<\/code> should not be in quotation marks", "Line 1 should be <code>lives == 0<\/code>"], "ci": 1, "exp": "One equals sign <code>=<\/code> <b>puts<\/b> a value in a box; two equals signs <code>==<\/code> <b>ask<\/b> &ldquo;are these equal?&rdquo; An <code>if<\/code> needs a question, so line 2 must be <code>if lives == 0:<\/code>. Line 1 is correct (it fills the box), the <code>print<\/code> must be indented to be inside the <code>if<\/code>, and text to print needs quotation marks.", "id": "20261120-5", "tagcolor": "#495057"}, {"type": "puzzle", "tag": "Variables", "title": "Growing Steps", "goal": "Collect all 3 gems 💎 and stop on the flag 🚩. Each stair gets one square <b>longer<\/b>: right 1, then right 2, then right 3. Use a loop and a variable <code>n<\/code> that grows.", "map": ["#########", "#H.######", "##*..####", "####*..*#", "#######F#", "#########"], "palette": ["n = 1", "for i in range(3):", "hero.move_right(n)", "hero.move_down()", "n += 1"], "max_lines": 5, "must_use": ["n", "for"], "hint": "Start with <code>n = 1<\/code>. Inside the loop: move right <code>n<\/code>, move down 1, then add 1 to <code>n<\/code> so the next stair is longer.", "solution": "n = 1\nfor i in range(3):\n    hero.move_right(n)\n    hero.move_down()\n    n += 1", "explain": "<code>n<\/code> starts at 1. Trip 1: right 1, down, n becomes 2. Trip 2: right 2, down, n becomes 3. Trip 3: right 3, down onto the flag. The variable changes each time, so the same loop makes longer and longer stairs.", "id": function countLines(src){ return src.split('\n').filter(function(s){ var t = s.trim(); return t && t[0] !== '#'; }).length; }
function checkPuzzle(item, src){

  if(r.world.flag && !r.atFlag) return {ok:false, r:r, msg:'You got the gems. Now finish on the flag \ud83d\udea9.'};
  if(item.expect_out && r.out.join('\n') !== item.expect_out) return {ok:false, r:r, msg:'The robot reached the goal, but the printed words are not what the goal asks for.'};

  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);
Object.assign(window, {pick: pick, prevQ: prevQ, goNext: goNext, showResultsNow: showResultsNow, goToQ: goToQ, toggleJump: toggleJump, startRetry: startRetry, openFresh: openFresh, closeFresh: closeFresh, confirmFresh: confirmFresh, runCode: runCode, replay: replay, insertCode: insertCode, toggleHint: toggleHint, resetCode: resetCode, openGiveUp: openGiveUp, closeGiveUp: closeGiveUp, confirmGiveUp: confirmGiveUp}); /* no eval: some pages block it (CSP) */
document.getElementById('instruction').textContent = INSTRUCTION;
/* ===== intro lessons (2026-11-16) ===== */
var introOpen = false, introPage = 0;
function sbHTML(list){
  return (list || []).map(function(b){
    if(b.t === 'repeat') return '<div class="sb sb-c">' + b.text + '<div class="sb-inner">' + sbHTML(b.body) + '</div></div>';
    return '<div class="sb sb-blk sb-' + (b.t || 'motion') + '">' + b.text + '</div>';
  }).join('<br>');
}
function learnHTML(L){
  var h = L.html || '';
  if(L.scratch || L.code){
    h += '<div class="side">';
    if(L.scratch) h += '<div><div class="cap">SCRATCH</div>' + sbHTML(L.scratch) + '</div>';
    if(L.code) h += '<div><div class="cap">PYTHON (same thing!)</div><pre class="code" style="margin:0">' + hl(L.code) + '</pre></div>';
    h += '</div>';
  }
  if(L.after) h += L.after;
  return h;
}
function renderIntro(){
  var p = INTRO[introPage], last = introPage === INTRO.length - 1;
  var h = '<div class="intro-step">HOW TO PLAY &middot; ' + (introPage + 1) + ' / ' + INTRO.length + '</div><div class="intro-title">' + p.title + '</div><div class="intro-body">' + learnHTML(p) + '</div>';
  if(p.try){
    var t = p.try;
    h += '<div class="try-box"><b>&#9997;&#65039; Try it!</b> ' + (t.goal || '') + '<div id="try-board">' + boardHTML(t, null) + '</div>';
    if(t.palette) h += '<div class="palette">' + t.palette.map(function(s, i){ return '<button class="pal-btn' + (/^(for|if|while|def)\b/.test(s) ? ' kw2' : '') + '" onclick="tryInsert(' + i + ')">' + esc(s) + '</button>'; }).join('') + '</div>';
    h += '<textarea class="editor" id="try-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" style="min-height:90px">' + esc(t.start_code || '') + '</textarea>';
    h += '<div class="ed-btns"><button class="run-btn" onclick="tryRun()">&#9654; Run</button><button class="small-btn" onclick="tryReset()">Reset</button></div><div class="console" id="try-console" style="display:none"></div><div class="msg" id="try-msg"></div></div>';
  }
  h += '<div class="intro-nav"><button onclick="introPrev()"' + (introPage === 0 ? ' disabled' : '') + '>Back</button><button class="go" onclick="introNext()">' + (last ? 'Start the quiz! &#128640;' : 'Next') + '</button></div>';
  if(last || state.introDone) h += '<div style="text-align:center;margin-top:8px"><button class="small-btn" onclick="closeIntro()">Close</button></div>';
  document.getElementById('intro-card').innerHTML = h;
  var te = document.getElementById('try-editor'); if(te){ te.addEventListener('keydown', edKey); ['click','keyup'].forEach(function(ev){ te.addEventListener(ev, function(){ te.__touched = true; }); }); }
}
function tryInsert(i){ var t = INTRO[introPage].try, ed = document.getElementById('try-editor'); if(!ed) return; insertInto(ed, t.palette[i], !ed.__touched); }
function tryReset(){ renderIntro(); }
function tryRun(){
  var t = INTRO[introPage].try, ed = document.getElementById('try-editor'), msg = document.getElementById('try-msg');
  var res = checkPuzzle(t, ed.value); msg.className = 'msg info'; msg.textContent = 'Running\u2026';
  animate(t, res.r.world.frames, function(){ msg.className = res.ok ? 'msg ok' : 'msg bad'; msg.textContent = res.ok ? (t.success || '\ud83c\udf89 You did it!') : res.msg; window.__tryResult = res.ok; }, 'try-board', 'try-console');
}
function introNext(){ if(introPage < INTRO.length - 1){ introPage++; render(); window.scrollTo(0, 0); } else closeIntro(); }
function introPrev(){ if(introPage > 0){ introPage--; render(); } }
function openIntro(){ if(!INTRO.length) return; introOpen = true; introPage = 0; render(); window.scrollTo(0, 0); }
function closeIntro(){ introOpen = false; state.introDone = true; saveState(); render(); window.scrollTo(0, 0); }
Object.assign(window, {openIntro: openIntro, closeIntro: closeIntro, introNext: introNext, introPrev: introPrev, tryRun: tryRun, tryReset: tryReset, tryInsert: tryInsert}); /* no eval: some pages block it (CSP) */
loadState();
if(!INTRO.length) document.getElementById('learn-btn').style.display = 'none';
if(INTRO_AUTO && INTRO.length && !state.introDone && !state.showResults && !Object.keys(state.answers).length) introOpen = true;
render();
</script>
</body>
</html>
