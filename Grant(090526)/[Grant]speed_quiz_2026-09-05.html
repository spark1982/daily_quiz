<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}
.subtitle{text-align:center;font-size:0.85rem;color:#555;background:#fff;padding:2px 0 4px}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:2px 12px 10px}
.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}
.timer-setup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
.timer-setup label { font-weight: 700; }
.timer-setup input[type="number"] { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
.timer-start-btn { background: #185FA5; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }

.timer-label { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.02em; }
.timer-display { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }

.timer-display.danger { color: #E24B4A; }

#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;border:none;}
.results-pill{display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;border:none;}
.quiz-area{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.q-num{font-size:0.82rem;color:#888;}
.tag-badge{font-size:0.75rem;padding:2px 10px;border-radius:10px;background:#185FA5;color:#fff;font-weight:600;}
.passage-box,.context-box{background:#f5f7fa;border-left:3px solid #185FA5;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.92rem;color:#333;line-height:1.5;}
.q-text{font-size:1.08rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:9px;}

.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041;}

.exp-box{margin-top:12px;padding:10px 12px;background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;font-size:0.88rem;color:#333;display:none;}
.nav-btns{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
.prev-btn,.next-btn{padding:9px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;}
.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}
.r-card.correct{background:#E1F5EE;color:#085041;}
.r-card.wrong{background:#FCEBEB;color:#501313;}
.r-card.skipped{background:#f5f7fa;color:#555;}
.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}
.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}
.q-timer-bar{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:8px;}
.q-timer-display{font-size:1.2rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;}
.q-timer-display.warn{color:#f5a623;}
.q-timer-display.danger{color:#E24B4A;}
.pause-btn{background:#e8edf4;color:#185FA5;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timeout-box{margin-top:12px;padding:10px 12px;background:#FCEBEB;border-left:3px solid #E24B4A;border-radius:6px;font-size:0.88rem;color:#501313;display:none;}
.r-card.timedout{background:#fdecd2;color:#7a4c00;}
</style>
</head>
<body><div class="quiz-title">[Grant] Speed Quiz</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Answer as quickly as you can. Each question has a 40 second timer.</div><div id="nav-bar"><span id="nav-count">0 / 30</span><div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div><button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button></div><div id="dot-panel"></div>

</div>
<div class="quiz-area" id="quiz-area">

    <button class="next-btn" id="next-btn" onclick="goNext()">Next</button>
  </div>
</div>

<div class="results-screen" id="results-screen">
  <div class="results-heading" id="results-heading">Results</div>
  <div class="results-score" id="results-score"></div>
  <div class="results-grid" id="results-grid"></div>
  <div class="results-btns">
    <button class="retry-btn" onclick="retryWrong()">Retry Wrong &amp; Timed Out</button>
    <button class="copy-btn" onclick="copyRes()">Copy All Results</button>
    <button class="save-btn" onclick="saveWrongAnswers()">Save Wrong Answers</button>
    <button class="fresh-btn" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button>
    <button class="fresh-btn" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button>
  </div>
</div>

<div class="modal-overlay" id="freshModal">

    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeFreshModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>
<script>var TITLE = "[Grant] Speed Quiz";var QUIZ_KEY = "quiz_grantspeedquiz_20260905_v1";var ATT_KEY = "quiz_grantspeedquiz_att_20260905_v1";var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};var RAW_QUESTIONS = [{"stem": "Compute the following.<br>b) 25 x 32 x 4", "opts": ["3,423", "3,200", "3,141", "3,077"], "ci": 1, "exp": "25 &times; 4 = 100, then 100 &times; 32 = 3,200.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "From one vertex of the triangle below, 4 line segments are drawn to the opposite side, splitting the triangle into 5 regions.<br><svg width=\"200\" height=\"130\" viewBox=\"0 0 200 130\" style=\"display:block;margin:10px auto;\"><polygon points=\"100,10 10,110 190,110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"10\" x2=\"46\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"82\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"118\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"154\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many triangles are there in the whole figure?", "opts": ["17", "16", "15", "14"], "ci": 2, "exp": "With k=4 cevians: (k+1)(k+2)/2 = (5)(6)/2 = 15.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "David uses some coins to form a triangle. There is a coin at every corner. How many coins does he use if there are 6 coins on each side of the triangle?", "opts": ["18", "12", "16", "15"], "ci": 3, "exp": "Each side has 6 coins including the 2 shared corners, so each side contributes 5 new coins beyond the first corner: 3 &times; 5 = 15 coins total.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>(d) 78 + 52 + 22 =", "opts": ["153", "155", "159", "152"], "ci": 3, "exp": "78 + 52 + 22 = 152.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>a) 33 x 101", "opts": ["3,100", "3,333", "3,470", "3,289"], "ci": 1, "exp": "33 &times; 101 = 33 &times; 100 + 33 = 3,300 + 33 = 3,333.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "The grid below is a 3&times;3 grid of unit cells.<br><svg width=\"104\" height=\"104\" viewBox=\"0 0 104 104\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"84\" height=\"84\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"38\" y1=\"10\" x2=\"38\" y2=\"94\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"66\" y1=\"10\" x2=\"66\" y2=\"94\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"38\" x2=\"94\" y2=\"38\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"66\" x2=\"94\" y2=\"66\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many rectangles (including squares) can be found in the figure altogether?", "opts": ["33", "36", "34", "38"], "ci": 1, "exp": "For a 3&times;3 grid, the rectangle count is C(4,2) &times; C(4,2) = 6 &times; 6 = 36.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The grid below is a 4&times;4 grid of unit cells.<br><svg width=\"132\" height=\"132\" viewBox=\"0 0 132 132\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"112\" height=\"112\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"38\" y1=\"10\" x2=\"38\" y2=\"122\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"66\" y1=\"10\" x2=\"66\" y2=\"122\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"94\" y1=\"10\" x2=\"94\" y2=\"122\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"38\" x2=\"122\" y2=\"38\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"66\" x2=\"122\" y2=\"66\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"94\" x2=\"122\" y2=\"94\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many squares (of any size) can be found in the figure altogether?", "opts": ["32", "31", "29", "30"], "ci": 3, "exp": "For an n&times;n grid, the square count is n(n+1)(2n+1)/6 = 4(5)(9)/6 = 30 (1&times;1: 16, 2&times;2: 9, 3&times;3: 4, 4&times;4: 1).", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following series.<br>(d) 754 + 750 + 742 + 746 + 758", "opts": ["3,750", "3,761", "3,871", "3,769"], "ci": 0, "exp": "754 + 750 + 742 + 746 + 758 = 3,750.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>(c) 86 + 34 + 14 =", "opts": ["135", "134", "123", "125"], "ci": 1, "exp": "86 + 34 + 14 = 134.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "There are 20 teams in the North Volleyball League. Each team must play exactly one match with every other team. How many matches are to be played altogether in the league?", "opts": ["201", "196", "190", "191"], "ci": 2, "exp": "Every pair of teams plays once: C(20,2) = 20 &times; 19 &divide; 2 = 190.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>d) 25 x 7 x 4", "opts": ["748", "704", "677", "700"], "ci": 3, "exp": "25 &times; 4 = 100, then 100 &times; 7 = 700.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "The 8 points A, B, C, D, E, F, G, H lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"270\" height=\"70\" viewBox=\"0 0 270 70\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"35\" x2=\"255\" y2=\"35\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"41\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"41\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"61\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"61\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"70\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"70\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"145\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"145\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"147\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"147\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text><circle cx=\"193\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"193\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">G</text><circle cx=\"255\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"255\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">H</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["28", "29", "26", "30"], "ci": 0, "exp": "With 8 points at all-different spacings, every pair of points gives a distinct length: C(8,2) = 28.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>(a) 24 + 55 + 76 =", "opts": ["152", "155", "157", "164"], "ci": 1, "exp": "24 + 55 + 76 = 155.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Pots of flowers are used to decorate the edges of a square garden. The distance between every two pots of flowers is 3 m. One side of the square garden is 24 m. How many pots of flowers are needed?", "opts": ["36", "24", "32", "28"], "ci": 2, "exp": "Each side has 24&divide;3 = 8 gaps, meaning 9 pots per side including both corners. Since each corner pot is shared by 2 sides, the total distinct pots = 4 &times; 8 = 32.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "The strip below is divided into 5 equal cells in a single row.<br><svg width=\"160\" height=\"48\" viewBox=\"0 0 160 48\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"140\" height=\"28\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"38\" y1=\"10\" x2=\"38\" y2=\"38\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"66\" y1=\"10\" x2=\"66\" y2=\"38\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"94\" y1=\"10\" x2=\"94\" y2=\"38\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"122\" y1=\"10\" x2=\"122\" y2=\"38\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many rectangles (including squares) can be found in the figure altogether?", "opts": ["14", "16", "15", "17"], "ci": 2, "exp": "For a 1-row, 5-cell strip, the rectangle count is C(6,2) = 15 (choose any 2 of the 6 vertical lines as the rectangle's sides).", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>b) 46 x 101", "opts": ["4,708", "4,839", "4,783", "4,646"], "ci": 3, "exp": "46 &times; 101 = 46 &times; 100 + 46 = 4,600 + 46 = 4,646.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>c) 16 x 4 x 25", "opts": ["1,681", "1,714", "1,674", "1,600"], "ci": 3, "exp": "4 &times; 25 = 100, then 100 &times; 16 = 1,600.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>(h) 25 + 35 =", "opts": ["60", "70", "50", "65"], "ci": 0, "exp": "25 + 35 = 60.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following series.<br>(c) 996 + 997 + 998 + 999 + 995", "opts": ["5,336", "5,308", "4,985", "4,910"], "ci": 2, "exp": "996 + 997 + 998 + 999 + 995 = 4,985.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Stella tied 6 knots on a piece of ribbon. The length between the second and fifth knots was 60 cm. What was the length between the first and sixth knots?", "opts": ["93", "102", "104", "100"], "ci": 3, "exp": "The 2nd to 5th knot spans 3 gaps = 60 cm, so each gap is 20 cm. The 1st to 6th knot spans 5 gaps: 5 &times; 20 = 100 cm.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following series.<br>(a) 17 + 18 + 19 + 20 + 21 + 22 + 23", "opts": ["129", "150", "140", "145"], "ci": 2, "exp": "This is 7 consecutive terms centered on 20: average (17+23)/2 = 20, times 7 terms = 140.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "There are 10 rows of seats in an auditorium. The first row has 30 seats. The second row has 34 seats. The third row has 38 seats and so on. How many seats are there in the auditorium?", "opts": ["507", "475", "480", "447"], "ci": 2, "exp": "This is arithmetic with first term 30, common difference 4, 10 terms: sum = 10 &divide; 2 &times; (2&times;30 + 9&times;4) = 5 &times; (60+36) = 5 &times; 96 = 480.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Melvin lives on the 5th floor of an apartment building. Nick lives on the next floor. The staircases leading to Melvin's apartment have 80 steps. How many steps have the staircases leading to Nick's apartment?", "opts": ["100", "107", "105", "95"], "ci": 0, "exp": "From the ground floor to the 5th floor is 4 flights of stairs, so each flight has 80&divide;4 = 20 steps. Nick lives one floor higher (5 flights): 5 &times; 20 = 100 steps.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following series.<br>(b) 100 + 102 + 104 + 106 + 108 + 110", "opts": ["600", "596", "630", "671"], "ci": 2, "exp": "6 terms, average (100+110)/2 = 105, times 6 terms = 630.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "It takes John 8 minutes to saw a log into 3 equal lengths. How long does it take for him to saw the same log into 9 equal lengths?", "opts": ["33", "29", "32", "35"], "ci": 2, "exp": "Cutting into 3 equal lengths needs 2 cuts, so each cut takes 8&divide;2 = 4 minutes. Cutting into 9 equal lengths needs 8 cuts: 8 &times; 4 = 32 minutes.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "The 7 points A, B, C, D, E, F, G lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"240\" height=\"70\" viewBox=\"0 0 240 70\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"35\" x2=\"225\" y2=\"35\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"42\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"42\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"78\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"78\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"137\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"137\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"189\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"189\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"202\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"202\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text><circle cx=\"225\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"225\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">G</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["21", "20", "22", "19"], "ci": 0, "exp": "With 7 points at all-different spacings, every pair of points gives a distinct length: C(7,2) = 21.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>a) 4 x 5 x 25", "opts": ["483", "535", "533", "500"], "ci": 3, "exp": "4 &times; 5 &times; 25 = 20 &times; 25 = 500.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>(b) 56 + 66 + 44 =", "opts": ["173", "177", "166", "165"], "ci": 2, "exp": "56 + 66 + 44 = 166.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "A sailor tied 7 knots on a rope at regular intervals. The distance from the first knot to the seventh one was 18 m long. What is the distance between every two knots?", "opts": ["3", "4", "2", "6"], "ci": 0, "exp": "7 knots make 6 gaps: 18 &divide; 6 = 3 m between every two knots.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>(g) 56 + 24 =", "opts": ["70", "80", "90", "84"], "ci": 1, "exp": "56 + 24 = 80.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + "_order_v1";
var Q_TIME = 40;

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<N;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultTimerState(){ return { remainingAtStart: Q_TIME, startedAt: null, running: false, timedOut: false }; }
function defaultState(){
  var timers = {};
  for(var i=0;i<N;i++) timers[i] = defaultTimerState();
  return { cur:0, answers:{}, timers: timers, showResults:false };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.timers !== 'object' || s.timers===null) s.timers = {};
    for(var i=0;i<N;i++){ if(!s.timers[i]) s.timers[i] = defaultTimerState(); }
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var tickInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function getRemaining(qi){
  var t = state.timers[qi];
  if(!t) return Q_TIME;
  if(t.running && t.startedAt){
    var elapsed = (Date.now()-t.startedAt)/1000;
    return Math.max(0, t.remainingAtStart - elapsed);
  }
  return t.remainingAtStart;
}
function freezeTimer(qi){
  var t = state.timers[qi];
  if(t && t.running){
    t.remainingAtStart = getRemaining(qi);
    t.running = false;
    t.startedAt = null;
  }
}
function startTimerFor(qi){
  var t = state.timers[qi];
  if(!t) { t = defaultTimerState(); state.timers[qi] = t; }
  if(t.timedOut) return;
  if(state.answers[qi] !== undefined) return;
  if(!t.running){
    t.startedAt = Date.now();
    t.running = true;
  }
}
function stopTickInterval(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }
function startTickInterval(){ stopTickInterval(); tickInterval = setInterval(tickRender, 250); }

function tickRender(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var disp = document.getElementById('qTimerDisplay');
  var pauseBtn = document.getElementById('pauseBtn');
  if(!t) return;
  var remaining = getRemaining(qi);
  disp.classList.remove('warn','danger');
  if(remaining <= 0){
    if(t.running){
      t.running = false;
      t.startedAt = null;
      t.remainingAtStart = 0;
      t.timedOut = true;
      saveState();
      renderOptionsLockState();
    }
    disp.textContent = "0:00";
    disp.classList.add('danger');
    document.getElementById('timeout-box').style.display = (state.answers[qi]===undefined) ? 'block' : 'none';
    pauseBtn.disabled = true;
    return;
  }
  pauseBtn.disabled = false;
  disp.textContent = formatTime(remaining);
  if(remaining <= Q_TIME*0.1) disp.classList.add('danger');
  else if(remaining <= Q_TIME*0.25) disp.classList.add('warn');
  pauseBtn.textContent = t.running ? 'Pause' : 'Resume';
}

function renderOptionsLockState(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var answered = state.answers[qi];
  var btns = document.querySelectorAll('#options .opt-btn');
  btns.forEach(function(btn){
    if(answered !== undefined || (t && t.timedOut)) btn.disabled = true;
  });
}

function togglePause(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(!t || t.timedOut || state.answers[qi]!==undefined) return;
  if(t.running){ freezeTimer(qi); }
  else { startTimerFor(qi); }
  saveState();
  tickRender();
}
window.togglePause=togglePause;

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  var timerBar = document.querySelector('.q-timer-bar');
  if(state.showResults){
    qa.style.display='none';
    timerBar.style.display='none';
    rs.classList.add('show');
    stopTickInterval();
    renderResults();
    return;
  }
  qa.style.display='block';
  timerBar.style.display='flex';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  badge.textContent = q.tag;
  badge.style.background = TAG_COLORS[q.tag] || '#185FA5';

  document.getElementById('q-text').innerHTML = q.stem;

  startTimerFor(qi);

  var answered = state.answers[qi];
  var t = state.timers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = (answered !== undefined) || (t && t.timedOut);
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var timeoutBox = document.getElementById('timeout-box');
  timeoutBox.style.display = (t && t.timedOut && answered===undefined) ? 'block' : 'none';

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
  tickRender();
  startTickInterval();
}

function updateNav(){
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi = order[k];
    if(state.answers[qi]!==undefined || (state.timers[qi] && state.timers[qi].timedOut)) done++;
  }
  document.getElementById('nav-count').textContent = done + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (done/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg;
    if(state.answers[qi]===undefined){
      bg = (state.timers[qi] && state.timers[qi].timedOut) ? '#f5a623' : '#d7dde6';
    } else {
      bg = state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A';
    }
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi2 = order[k];
    if(state.answers[qi2]!==undefined || (state.timers[qi2] && state.timers[qi2].timedOut)) done++;
  }
  if(done===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  freezeTimer(order[state.cur]);
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  freezeTimer(order[state.cur]);
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(state.answers[qi] !== undefined) return;
  if(t && t.timedOut) return;
  state.answers[qi] = idx;
  freezeTimer(qi);
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ freezeTimer(order[state.cur]); state.cur--; saveState(); render(); }
}
function goNext(){
  freezeTimer(order[state.cur]);
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0, timedout=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a===undefined){
      if(t && t.timedOut) timedout++; else skipped++;
      continue;
    }
    if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+timedout+' timed out, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var card = document.createElement('div');
    if(a===undefined){
      if(t && t.timedOut){ card.className='r-card timedout'; card.textContent='Q'+(pos+1)+' Time'; }
      else { card.className='r-card skipped'; card.textContent='Q'+(pos+1)+' Skip'; }
    } else {
      var ok = a===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var isWrong = (a!==undefined && a!==RAW_QUESTIONS[qi].ci);
    var isTimedOut = (a===undefined && t && t.timedOut);
    if(isWrong || isTimedOut) wrong.push(qi);
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){
    delete state.answers[qi];
    state.timers[qi] = defaultTimerState();
  });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s += (t && t.timedOut) ? 'Timed Out' : 'Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    } else if(a===undefined && t && t.timedOut){
      var q2 = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q2.stem, yourAnswer: '(timed out)', correctAnswer: q2.opts[q2.ci], explanation: q2.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
</script>
