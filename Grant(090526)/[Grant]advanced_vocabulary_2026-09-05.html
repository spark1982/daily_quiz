<script>var TITLE = "[Grant] Advanced Vocabulary";var QUIZ_KEY = "quiz_grantvocab_20_20260905_v1";var ATT_KEY = "quiz_grantvocab_20_att_20260905_v1";var RAW_QUESTIONS = [{"stem": "Which is the best definition of \"<b>respond</b>\"?", "opts": ["intended to be kept secret or private", "to say or do something as a reaction to something that has been said or done", "existing or available in large quantities; plentiful", "being the only one of its kind; unlike anything else"], "ci": 1, "exp": "\"respond\" means: to say or do something as a reaction to something that has been said or done.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>mechanism</b>\"?", "opts": ["achieving maximum productivity with minimum wasted effort or expense", "concerned with beauty or the appreciation of beauty", "to say or do something as a reaction to something that has been said or done", "a system of parts working together, or a process by which something takes place"], "ci": 3, "exp": "\"mechanism\" means: a system of parts working together, or a process by which something takes place.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>abundant</b>\"?", "opts": ["concerned with beauty or the appreciation of beauty", "existing as an idea or concept rather than as a concrete, physical thing", "a thing that completes or enhances something else when combined with it", "existing or available in large quantities; plentiful"], "ci": 3, "exp": "\"abundant\" means: existing or available in large quantities; plentiful.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>enumerate</b>\"?", "opts": ["concerned with beauty or the appreciation of beauty", "to recognize or express what makes something different from something else", "to happen or take place", "to mention a number of things one by one; to list"], "ci": 3, "exp": "\"enumerate\" means: to mention a number of things one by one; to list.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>capitalism</b>\"?", "opts": ["achieving maximum productivity with minimum wasted effort or expense", "an economic system based on private ownership of property and the means of production, operated for profit", "a recognized branch or grouping within a religion; a value or size of a unit in a system of currency", "intended to be kept secret or private"], "ci": 1, "exp": "\"capitalism\" means: an economic system based on private ownership of property and the means of production, operated for profit.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>crucial</b>\"?", "opts": ["decisive or critical, especially in the success or failure of something", "to fill someone with the urge or ability to do or feel something, especially creatively", "susceptible to being harmed, attacked, or negatively influenced", "a simplified drawing that shows the appearance, structure, or workings of something"], "ci": 0, "exp": "\"crucial\" means: decisive or critical, especially in the success or failure of something.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>efficient</b>\"?", "opts": ["being the only one of its kind; unlike anything else", "susceptible to being harmed, attacked, or negatively influenced", "achieving maximum productivity with minimum wasted effort or expense", "to fill someone with the urge or ability to do or feel something, especially creatively"], "ci": 2, "exp": "\"efficient\" means: achieving maximum productivity with minimum wasted effort or expense.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>occur</b>\"?", "opts": ["existing or available in large quantities; plentiful", "decisive or critical, especially in the success or failure of something", "a simplified drawing that shows the appearance, structure, or workings of something", "to happen or take place"], "ci": 3, "exp": "\"occur\" means: to happen or take place.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>differentiate</b>\"?", "opts": ["language designed to have a persuasive or impressive effect, often regarded as lacking sincerity", "existing as an idea or concept rather than as a concrete, physical thing", "to recognize or express what makes something different from something else", "a thing that completes or enhances something else when combined with it"], "ci": 2, "exp": "\"differentiate\" means: to recognize or express what makes something different from something else.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>vulnerable</b>\"?", "opts": ["susceptible to being harmed, attacked, or negatively influenced", "to happen or take place", "concerned with beauty or the appreciation of beauty", "intended to be kept secret or private"], "ci": 0, "exp": "\"vulnerable\" means: susceptible to being harmed, attacked, or negatively influenced.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>rhetoric</b>\"?", "opts": ["a recognized branch or grouping within a religion; a value or size of a unit in a system of currency", "language designed to have a persuasive or impressive effect, often regarded as lacking sincerity", "existing or available in large quantities; plentiful", "an economic system based on private ownership of property and the means of production, operated for profit"], "ci": 1, "exp": "\"rhetoric\" means: language designed to have a persuasive or impressive effect, often regarded as lacking sincerity.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>abstract</b>\"?", "opts": ["being the only one of its kind; unlike anything else", "language designed to have a persuasive or impressive effect, often regarded as lacking sincerity", "existing as an idea or concept rather than as a concrete, physical thing", "a simplified drawing that shows the appearance, structure, or workings of something"], "ci": 2, "exp": "\"abstract\" means: existing as an idea or concept rather than as a concrete, physical thing.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>aesthetic</b>\"?", "opts": ["to mention a number of things one by one; to list", "concerned with beauty or the appreciation of beauty", "to recognize or express what makes something different from something else", "a simplified drawing that shows the appearance, structure, or workings of something"], "ci": 1, "exp": "\"aesthetic\" means: concerned with beauty or the appreciation of beauty.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>unique</b>\"?", "opts": ["being the only one of its kind; unlike anything else", "to recognize or express what makes something different from something else", "language designed to have a persuasive or impressive effect, often regarded as lacking sincerity", "a recognized branch or grouping within a religion; a value or size of a unit in a system of currency"], "ci": 0, "exp": "\"unique\" means: being the only one of its kind; unlike anything else.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>complement</b>\"?", "opts": ["existing as an idea or concept rather than as a concrete, physical thing", "a thing that completes or enhances something else when combined with it", "achieving maximum productivity with minimum wasted effort or expense", "to recognize or express what makes something different from something else"], "ci": 1, "exp": "\"complement\" means: a thing that completes or enhances something else when combined with it.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>confidential</b>\"?", "opts": ["to fill someone with the urge or ability to do or feel something, especially creatively", "intended to be kept secret or private", "a recognized branch or grouping within a religion; a value or size of a unit in a system of currency", "language designed to have a persuasive or impressive effect, often regarded as lacking sincerity"], "ci": 1, "exp": "\"confidential\" means: intended to be kept secret or private.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>diagram</b>\"?", "opts": ["existing or available in large quantities; plentiful", "to say or do something as a reaction to something that has been said or done", "language designed to have a persuasive or impressive effect, often regarded as lacking sincerity", "a simplified drawing that shows the appearance, structure, or workings of something"], "ci": 3, "exp": "\"diagram\" means: a simplified drawing that shows the appearance, structure, or workings of something.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "Which is the best definition of \"<b>display</b>\"?", "opts": ["to fill someone with the urge or ability to do or feel something, especially creatively", "intended to be kept secret or private", "to say or do something as a reaction to something that has been said or done", "to put something on view; to show or exhibit"], "ci": 3, "exp": "\"display\" means: to put something on view; to show or exhibit.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>inspire</b>\"?", "opts": ["to fill someone with the urge or ability to do or feel something, especially creatively", "a system of parts working together, or a process by which something takes place", "to put something on view; to show or exhibit", "intended to be kept secret or private"], "ci": 0, "exp": "\"inspire\" means: to fill someone with the urge or ability to do or feel something, especially creatively.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "Which is the best definition of \"<b>denomination</b>\"?", "opts": ["a recognized branch or grouping within a religion; a value or size of a unit in a system of currency", "concerned with beauty or the appreciation of beauty", "to fill someone with the urge or ability to do or feel something, especially creatively", "to mention a number of things one by one; to list"], "ci": 0, "exp": "\"denomination\" means: a recognized branch or grouping within a religion; a value or size of a unit in a system of currency.", "tag": "New", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){

}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;

function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }

  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
