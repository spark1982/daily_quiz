<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }

  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>

// Shuffle helper (deterministic, seeded — used for per-question option order)
function shuffle(arr, seed) {
  let a = arr.slice();
  let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    let j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// True random shuffle — used for "Start Fresh (Random Order)"
function shuffleRandom(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadOrder() {
  try {
    const raw = localStorage.getItem(ORDER_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    if (!isValidOrder(arr)) throw new Error();
    return arr;
  } catch (e) {
    localStorage.removeItem(ORDER_KEY);
    return null;
  }
}
function saveOrder(order) { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }

let currentOrder = loadOrder() || identityOrder();
questions = currentOrder.map(i => RAW_QUESTIONS[i]);

const N = questions.length;
let state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
function getList() { return state.retryMode ? state.retryList : questions.map((_, i) => i); }

function loadState() {
  try {
    const raw = localStorage.getItem(QUIZ_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (typeof s.cur !== 'number' || s.cur < 0 || s.cur >= N) return;
    if (typeof s.answers !== 'object' || typeof s.shuffles !== 'object') return;
    state = s;
  } catch(e) {
    localStorage.removeItem(QUIZ_KEY);
  }
}
function saveState() {
  try { localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); } catch(e) {}
}

function getAttempts() {
  try { return parseInt(localStorage.getItem(ATT_KEY) || '0', 10); } catch(e) { return 0; }
}
function incAttempts() {
  try { localStorage.setItem(ATT_KEY, String(getAttempts() + 1)); } catch(e) {}
}

function getShuffledOptions(qi) {
  if (state.shuffles[qi] !== undefined) {
    // rebuild from seed
    const q = questions[qi];
    const arr = q.options.map((o, i) => i);
    const seed = state.shuffles[qi];
    let a = arr.slice(), s = seed;
    for (let i = a.length - 1; i > 0; i--) {
      s = (s * 1664525 + 1013904223) & 0xffffffff;
      let j = Math.abs(s) % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a; // array of original indices
  }
  const seed = (qi * 7919 + 1234) ^ 0xabcdef;
  state.shuffles[qi] = seed;
  const arr = questions[qi].options.map((_, i) => i);
  let a = arr.slice(), s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    let j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateNav() {
  const list = getList();
  const answered = list.filter(qi => state.answers[qi] !== undefined).length;
  document.getElementById('answeredCount').textContent = `${answered} / ${list.length}`;
  document.getElementById('progressFill').style.width = `${(answered/list.length)*100}%`;
  const pill = document.getElementById('resultsPill');
  pill.style.display = answered === list.length ? 'inline-block' : 'none'; // pill shown when all answered
  updateDots();
  updateSubtitle();
}

function updateDots() {
  const panel = document.getElementById('dotPanel');
  panel.innerHTML = '';
  const list = getList();
  list.forEach((qi, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (state.answers[qi] !== undefined ? (state.answers[qi] === questions[qi].ci ? ' correct' : ' wrong') : '');
    d.textContent = i + 1;
    d.onclick = function(){ state.cur = i; render(); };
    panel.appendChild(d);
  });
}

function updateSubtitle() {
  const att = getAttempts();
  document.getElementById('subtitleBar').textContent = `Fractions, Percents & Word Problems | Total Attempts: ${att}`;
}

window.toggleDots = function() {
  document.getElementById('dotPanel').classList.toggle('open');
};

window.showResults = function() {
  state.showResults = true;
  saveState();
  if (!state.retryMode) { incAttempts(); }
  updateSubtitle();
  renderResults();
};

function renderResults() {
  try {
    document.getElementById('quizArea').style.display = 'none';
    const ra = document.getElementById('resultsArea');
    ra.style.display = 'block';
    const list = getList();
    let correct = 0;
    list.forEach(qi => { if (state.answers[qi] === questions[qi].ci) correct++; });
    const pct = Math.round(correct / list.length * 100);
    const title = state.retryMode ? 'Retry Results' : 'Results';
    let html = `<div class="results-card">
      <div class="results-heading">${title}</div>
      <div class="score-row">
        <div class="score-box"><div class="score-num">${correct}/${list.length}</div><div class="score-label">Correct</div></div>
        <div class="score-box"><div class="score-num">${pct}%</div><div class="score-label">Score</div></div>
      </div>`;
    list.forEach((qi, i) => {
      const q = questions[qi];
      const answered = state.answers[qi];
      const isCorrect = answered === q.ci;
      const userOpt = answered !== undefined ? q.options[answered] : 'Not answered';
      html += `<div class="result-item ${isCorrect ? 'r-correct' : 'r-wrong'}">
        <div class="result-q">Q${i+1}: ${q.text}</div>
        <div class="result-ans">${isCorrect ? 'Correct' : `Your answer: ${userOpt} | Correct: ${q.options[q.ci]}`}</div>
      </div>`;
    });
    html += `</div>
    <div class="result-btns">`;
    if (state.retryMode) {
      html += `<button class="retry-btn" onclick="window.backToMain()">Back to Full Results</button>
      <button class="copy-btn" onclick="window.copyResults()">Copy All Results</button>`;
    } else {
      html += `<button class="retry-btn" onclick="window.retryWrong()">Retry Wrong Ones</button>
      <button class="copy-btn" onclick="window.copyResults()">Copy All Results</button>
      <button class="fresh-btn" onclick="window.openFreshModal('original')">Start Fresh (Original Order)</button>
      <button class="fresh-btn" onclick="window.openFreshModal('random')">Start Fresh (Random Order)</button>`;
    }
    html += `</div>`;
    ra.innerHTML = html;
  } catch(e) {
    document.getElementById('resultsArea').innerHTML = '<p style="padding:20px">Error showing results.</p>';
  }
}

window.retryWrong = function() {
  const list = getList();
  const wrongOnes = list.filter(qi => state.answers[qi] !== questions[qi].ci);
  if (!wrongOnes.length) return;
  wrongOnes.forEach(qi => { delete state.answers[qi]; });
  state.retryMode = true;
  state.retryList = wrongOnes;
  state.showResults = false;
  state.cur = 0;
  saveState();
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  render();
};

window.backToMain = function() {
  state.retryMode = false;
  state.retryList = [];
  state.showResults = true;
  saveState();
  render();
};

window.copyResults = function() {
  const list = getList();
  let text = `Chapter 8 Math Quiz Results\n`;
  let correct = 0;
  list.forEach((qi, i) => {
    const isC = state.answers[qi] === questions[qi].ci;
    if (isC) correct++;
    text += `Q${i+1}: ${isC ? 'Correct' : 'Wrong'}\n`;
  });
  text += `Score: ${correct}/${list.length} (${Math.round(correct/list.length*100)}%)`;
  try {
    navigator.clipboard.writeText(text).catch(() => {});
  } catch(e) {}
};

let pendingFreshMode = 'original';
window.openFreshModal = function(mode) {
  pendingFreshMode = mode;
  const t = document.getElementById('freshModalTitle');
  const b = document.getElementById('freshModalText');
  if (mode === 'random') {
    t.textContent = 'Start Fresh (Random Order)?';
    b.textContent = 'Questions will be reshuffled into a new random order, and all your answers will be cleared. This cannot be undone.';
  } else {
    t.textContent = 'Start Fresh (Original Order)?';
    b.textContent = 'Questions will return to their original order, and all your answers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
};
window.closeFreshModal = function() { document.getElementById('freshModal').classList.remove('show'); };
window.confirmFresh = function() {
  currentOrder = (pendingFreshMode === 'random') ? shuffleRandom(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  questions = currentOrder.map(i => RAW_QUESTIONS[i]);
  localStorage.removeItem(QUIZ_KEY);
  localStorage.removeItem(ATT_KEY);
  state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
  document.getElementById('freshModal').classList.remove('show');
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  updateSubtitle();
  render();
};

function render() {
  try {
    const qa = document.getElementById('quizArea');
    qa.style.display = 'block';
    const list = getList();
    const i = list[state.cur];
    const q = questions[i];
    const shuffleOrder = getShuffledOptions(i);
    const answered = state.answers[i];
    const isAnswered = answered !== undefined;

    let optHtml = '';
    shuffleOrder.forEach(origIdx => {
      let cls = 'opt-btn';
      if (isAnswered) {
        if (origIdx === q.ci) cls += ' correct-ans';
        else if (origIdx === answered) cls += ' wrong-ans';
      }
      const disabled = isAnswered ? 'disabled' : '';
      optHtml += `<button class="${cls}" ${disabled} onclick="window.selectAnswer(${origIdx})">${q.options[origIdx]}</button>`;
    });

    const prevDisabled = state.cur === 0 ? 'disabled' : '';
    const nextLabel = state.cur === list.length - 1 ? 'Finish' : 'Next';

    qa.innerHTML = `
      <div class="q-header">Question ${state.cur+1} of ${list.length}</div>
      <div class="section-label">${q.section}</div>
      <div class="question-text">${q.text}</div>
      <div class="options">${optHtml}</div>
      <div class="explanation ${isAnswered ? 'show' : ''}" id="expBox">${q.exp}</div>
      <div class="nav-btns">
        <button class="prev-btn" ${prevDisabled} onclick="window.goTo(${state.cur-1})">Prev</button>
        <button class="next-btn" onclick="window.goNext()">${nextLabel}</button>
      </div>
    `;
    updateNav();
    saveState();
  } catch(e) {
    document.getElementById('quizArea').innerHTML = '<p style="padding:20px">Error rendering question.</p>';
  }
}

window.selectAnswer = function(origIdx) {
  const list = getList();
  const i = list[state.cur];
  if (state.answers[i] !== undefined) return;
  state.answers[i] = origIdx;
  saveState();
  render();
};

window.goTo = function(idx) {
  const list = getList();
  if (idx < 0 || idx >= list.length) return;
  state.cur = idx;
  render();
};

window.goNext = function() {
  const list = getList();
  if (state.cur === list.length - 1) {
    window.showResults();
  } else {
    state.cur++;
    render();
  }
};

loadState();
updateSubtitle();
if (state.showResults) {
  document.getElementById('quizArea').style.display = 'none';
  renderResults();
} else {
  document.getElementById('quizArea').style.display = 'block';
  render();
}

})();
</script>
</body>
</html>
