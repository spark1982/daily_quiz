<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|다시\s*시작|처음부터/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->

<script>
(function(){
const SKEY = 'quiz_ch12rates_v1';
const ATT_KEY = 'quiz_ch12rates_att_v1';

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}

const RAW_QS = [

  {
    q: 'Kyle sewed 525 shirts in 75 hours. What was his average rate of shirts sewed per hour?',
    opts: ['7 shirts per hour', '6 shirts per hour', '75 shirts per hour', '450 shirts per hour'],
    ci: 0,
    expl: 'Rate = total shirts / total hours = 525 / 75 = 7 shirts per hour.'
  },
  {
    q: 'A plane travels a distance of 1125 miles at an average speed of 540 miles per hour. How many minutes does the trip take?',

    ci: 0,
    expl: 'Time in hours = distance / speed = 1125 / 540 = 25/12 hours. Converting to minutes: 25/12 &times; 60 = 125 minutes.'
  },
  {
    q: 'During a road trip, Jonathan drives at a rate of 45 miles per hour for the first two hours, a rate of 60 miles per hour for the next five hours and a rate of 30 miles per hour for the final three hours. What is his average speed in miles per hour for the whole road trip?',
    opts: ['45 mph', '50 mph', '48 mph', '40 mph'],
    ci: 2,
    expl: 'Total distance = 45(2) + 60(5) + 30(3) = 90 + 300 + 90 = 480 miles. Total time = 2 + 5 + 3 = 10 hours. Average speed = 480 / 10 = 48 mph.'
  },
  {
    q: 'Carl can solve 14 math problems per hour. If his older brother can solve twice as many math problems per hour as Carl, how many hours will it take them to solve 336 math problems if they work together?',
    opts: ['8 hours', '24 hours', '12 hours', '16 hours'],
    ci: 0,
    expl: 'Carl\'s brother solves 2 &times; 14 = 28 problems per hour. Working together, their combined rate is 14 + 28 = 42 problems per hour. Time = 336 / 42 = 8 hours.'
  },
  {
    q: 'Three workers can build 72 microwaves in 8 hours. How many microwaves can one worker build in one hour? Hint: It is equivalent to the rate.',

  {

    opts: ['30 mph', '32 mph', '40 mph', '24 mph'],
    ci: 0,
    expl: 'Time going = 120/40 = 3 hours, and time returning = 120/24 = 5 hours, for a total of 8 hours over a total distance of 240 miles. Average speed = 240 / 8 = 30 mph.'
  },
  {
    q: '6 workers can build 378 chairs in 7 hours. How many chairs can 4 workers build in 5 hours?',

    expl: 'One worker builds 378 / (6 &times; 7) = 9 chairs per hour. Four workers working for 5 hours build 4 &times; 5 &times; 9 = 180 chairs.'
  },
  {

    opts: ['1<span class="fr"><span class="fn">1</span><span class="fb"></span><span class="fd">2</span></span> hours', '2 hours', '96 hours', '1<span class="fr"><span class="fn">3</span><span class="fb"></span><span class="fd">5</span></span> hours'],

// --- Question order (original vs random), persisted independently of quiz progress ---
const ORDER_KEY = SKEY + '_order_v1';
function identityOrder(){ return RAW_QS.map((_,i)=>i); }
function isValidOrder(arr){
  if(!Array.isArray(arr)||arr.length!==RAW_QS.length) return false;
  const sorted=[...arr].sort((a,b)=>a-b);
  for(let i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    const raw=localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    const arr=JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error();
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }
function shuffleRandom(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
let currentOrder = loadOrder() || identityOrder();
let QS = currentOrder.map(i => RAW_QS[i]);

let state = {cur:0, answers:{}, shuffles:{}, showResults:false, retryMode:false, retryList:[]};
let attCount = parseInt(localStorage.getItem(ATT_KEY)||'0');
function getList(){ return state.retryMode ? state.retryList : QS.map((_,i)=>i); }

function saveState(){
  try{ localStorage.setItem(SKEY, JSON.stringify(state)); } catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(SKEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(typeof s.answers!=='object'||typeof s.shuffles!=='object') return;
    if(s.retryMode && !Array.isArray(s.retryList)) return;
    const list = s.retryMode ? s.retryList : QS.map((_,i)=>i);
    if(typeof s.cur!=='number'||s.cur<0||s.cur>=list.length) return;
    state = s;
  } catch(e){ localStorage.removeItem(SKEY); }
}
function getShuffled(i){
  if(!state.shuffles[i]){
    const q=QS[i];
    const idx=[0,1,2,3];
    for(let j=idx.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[idx[j],idx[r]]=[idx[r],idx[j]];}
    const newCi=idx.indexOf(q.ci);
    state.shuffles[i]={order:idx,ci:newCi};
    saveState();
  }
  return state.shuffles[i];
}

function render(){
  const qa=document.getElementById('quiz-area');
  const rs=document.getElementById('results-screen');
  const bn=document.getElementById('bottom-nav');
  if(state.showResults){
    qa.style.display='none';
    bn.style.display='none';
    rs.classList.add('show');
    showResultsScreen();
    updateNav();
    return;
  }
  rs.classList.remove('show');
  qa.style.display='block';
  bn.style.display='flex';
  renderQuestion();
  updateNav();
}

function renderQuestion(){
  const list=getList();
  const i=list[state.cur];
  const q=QS[i];
  const sh=getShuffled(i);
  const answered=state.answers[i]!==undefined;
  const chosen=state.answers[i];

  let html=`<div class="q-num">Question ${state.cur+1} of ${list.length}</div>`;
  html+=`<div class="q-text">${i+1}. ${q.q}</div><div class="opts">`;
  sh.order.forEach((origIdx,pos)=>{
    let cls='opt-btn';
    if(answered){
      if(pos===sh.ci) cls+=' opt-reveal';
      else if(pos===chosen) cls+=' opt-wrong';
    }
    const dis=answered?'disabled':'';
    html+=`<button class="${cls}" ${dis} onclick="window.pickOpt(${pos})">${q.opts[origIdx]}</button>`;
  });
  html+=`</div>`;
  if(answered){
    html+=`<div id="explanation" style="display:block">${q.expl}</div>`;
  } else {
    html+=`<div id="explanation" style="display:none"></div>`;
  }
  document.getElementById('quiz-area').innerHTML=html;

  const nb=document.getElementById('next-btn');
  const pb=document.getElementById('prev-btn');
  pb.disabled=(state.cur===0);
  nb.textContent=(state.cur===list.length-1)?'See Results →':'Next';
}

function updateNav(){
  const list=getList();
  const total=list.length;
  const ans=list.filter(i=>state.answers[i]!==undefined).length;
  document.getElementById('ans-count').textContent=`${ans} / ${total}`;
  document.getElementById('prog-bar-fill').style.width=`${ans/total*100}%`;
  document.getElementById('att-num').textContent=attCount;

  // dots
  const dp=document.getElementById('dot-panel');
  let dhtml='';
  list.forEach((qi,pos)=>{
    let cls='nav-dot dot-unanswered';
    if(state.answers[qi]!==undefined){
      const sh=state.shuffles[qi];
      if(sh && state.answers[qi]===sh.ci) cls='nav-dot dot-correct';
      else cls='nav-dot dot-wrong';
    }
    dhtml+=`<button class="${cls}" onclick="window.jumpTo(${pos})">${pos+1}</button>`;
  });
  dp.innerHTML=dhtml;

  const allDone=ans===total;
  document.getElementById('results-pill').style.display=allDone?'inline':'none';
}

window.pickOpt=function(pos){
  const list=getList();
  const i=list[state.cur];
  if(state.answers[i]!==undefined) return;
  state.answers[i]=pos;
  saveState();
  render();
  const allDone=list.filter(qi=>state.answers[qi]!==undefined).length===list.length;
  if(allDone) document.getElementById('results-pill').style.display='inline';
};
window.goPrev=function(){
  if(state.cur>0){state.cur--;saveState();render();}
};
window.goNext=function(){
  const list=getList();
  if(state.cur===list.length-1){window.goResults();return;}
  state.cur++;saveState();render();
};
window.jumpTo=function(pos){
  state.cur=pos;saveState();render();
};
window.toggleDots=function(){
  const dp=document.getElementById('dot-panel');
  dp.style.display=(dp.style.display==='flex')?'none':'flex';
};
window.goResults=function(){
  state.showResults=true;
  if(!state.retryMode){
    attCount++;
    localStorage.setItem(ATT_KEY,String(attCount));
  }
  saveState();render();
};

function showResultsScreen(){
  const list=getList();
  const total=list.length;
  let correct=0;
  list.forEach(i=>{
    const sh=state.shuffles[i];
    if(sh && state.answers[i]===sh.ci) correct++;
  });
  document.getElementById('results-heading').textContent = state.retryMode ? 'Retry Results' : 'Results';
  document.getElementById('score-line').textContent=`Score: ${correct} / ${total}`;
  let html='';
  list.forEach((i,pos)=>{
    const q=QS[i];
    const sh=state.shuffles[i];
    const chosen=state.answers[i];
    const isCorrect=sh&&chosen===sh.ci;
    const chosenText=(chosen!==undefined&&sh)?q.opts[sh.order[chosen]]:'(no answer)';
    const correctText=sh?q.opts[sh.order[sh.ci]]:'(no answer)';
    const rc=isCorrect?'rc-correct':'rc-wrong';
    html+=`<div class="results-card">
      <div class="rc-q">Q${pos+1}: ${q.q.substring(0,80)}${q.q.length>80?'&hellip;':''}</div>
      <div class="rc-a ${rc}">${isCorrect?'Correct':'Wrong'} - Your answer: ${chosenText}${isCorrect?'':' | Correct: '+correctText}</div>
      <div class="rc-expl">${q.expl}</div>
    </div>`;
  });
  document.getElementById('results-cards').innerHTML=html;
}

window.retryWrong=function(){
  const list=getList();
  const wrong=list.filter(i=>{
    const sh=state.shuffles[i];
    return state.answers[i]===undefined||(sh&&state.answers[i]!==sh.ci);
  });
  if(!wrong.length) return;
  wrong.forEach(i=>{delete state.answers[i];});
  state.retryMode=true;
  state.retryList=wrong;
  state.showResults=false;
  state.cur=0;
  saveState();render();
};
window.copyResults=function(){
  const list=getList();
  let txt='Math Competition ch12 Results\n';
  list.forEach((i,pos)=>{
    const sh=state.shuffles[i];
    const isCorrect=sh&&state.answers[i]===sh.ci;
    txt+=`Q${pos+1}: ${isCorrect?'Correct':'Wrong'}\n`;
  });
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt);
    } else {
      const ta=document.createElement('textarea');
      ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    }
  } catch(e){}
};
let pendingFreshMode = 'original';
window.confirmFresh=function(mode){
  pendingFreshMode = mode;
  const t = document.getElementById('modal-title');
  const m = document.getElementById('modal-msg');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers will be cleared. This cannot be undone.';
  }
  document.getElementById('modal-overlay').classList.add('show');
};
window.closeModal=function(){
  document.getElementById('modal-overlay').classList.remove('show');
};
window.doFresh=function(){
  currentOrder = (pendingFreshMode==='random') ? shuffleRandom(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  QS = currentOrder.map(i => RAW_QS[i]);
  localStorage.removeItem(SKEY);
  state={cur:0,answers:{},shuffles:{},showResults:false,retryMode:false,retryList:[]};
  document.getElementById('modal-overlay').classList.remove('show');
  render();
};

loadState();
render();
})();
</script>
</body>
</html>
