<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }

<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|다시\s*시작|처음부킰/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>

<script>
(function(){
const SKEY = 'quiz_ch10arith_v1';
const ATT_KEY = 'quiz_ch10arith_att_v1';

const RAW_QS = [
  {
    q: "Given an arithmetic sequence, 2, 5, 8, 11, ..., find the 9th term.",
    opts: ["26", "23", "24", "29"],
    ci: 0,
    expl: "The common difference is 3. The 9th term equals 2 plus 8 times 3, which is 2 + 24 = 26."
  },
  {
    q: "Given an arithmetic sequence, -20, -15, -10, -5, ..., find the 71st term.",
    opts: ["330", "325", "335", "340"],
    ci: 0,
    expl: "The common difference is 5. The 71st term equals -20 plus 70 times 5, which is -20 + 350 = 330."
  },
  {
    q: "Find the sum of the first 10 terms of the sequence: 2, 7, 12, 17, ...",
    opts: ["245", "220", "250", "230"],
    ci: 0,
    expl: "The common difference is 5, so the 10th term is 2 + 9(5) = 47. The sum is 10/2 × (2 + 47) = 5 × 49 = 245."
  },
  {
    q: "Find the sum of the first 15 terms of the sequence: -14, -12, -10, -8, ...",
    opts: ["0", "-2", "2", "14"],
    ci: 0,
    expl: "The common difference is 2, so the 15th term is -14 + 14(2) = 14. The sum is 15/2 × (-14 + 14) = 15/2 × 0 = 0."
  },
  {
    q: "Find the missing terms in the sequence: ___, 11, ___, 29, 38, ___",
    opts: ["2, 20, 47", "2, 20, 38", "11, 20, 47", "2, 18, 47"],
    ci: 0,
    expl: "From 29 to 38, the common difference is 9. Working backward and forward with difference 9 gives the full sequence 2, 11, 20, 29, 38, 47, so the missing terms are 2, 20, and 47."
  },
  {
    q: "Find the missing terms in the sequence: -55, ___, 215, ___, ___, 620, 755",
    opts: ["80, 350, 485", "75, 345, 480", "80, 345, 490", "85, 350, 480"],
    ci: 0,
    expl: "Using the 1st and 7th terms, the common difference is (755 - (-55)) / 6 = 135. Adding 135 repeatedly from -55 gives the missing terms 80, 350, and 485."
  },
  {
    q: "What is the next term in the sequence? 80, 71, 62, 53, ...",
    opts: ["44", "42", "45", "46"],
    ci: 0,
    expl: "The common difference is -9, so the next term is 53 + (-9) = 44."
  },
  {
    q: "If James' allowance is $15 in January, $35 in February, $55 in March and so on with every monthly allowance increasing by $20, how much money would he have received in allowance in a year?",
    opts: ["$1,500", "$1,440", "$1,560", "$1,200"],
    ci: 0,
    expl: "This is an arithmetic sequence with first term 15, common difference 20, and 12 terms. The 12th term is 15 + 11(20) = 235. The sum is 12/2 × (15 + 235) = 6 × 250 = $1,500."
  },
  {
    q: "Find the sum of the first 15 positive integers.",
    opts: ["120", "105", "135", "110"],
    ci: 0,
    expl: "The sum is 15 × 16 / 2 = 120."
  },
  {
    q: "Find the missing terms in the sequence: 88, ___, 112, ___, 136, ___",
    opts: ["100, 124, 148", "100, 124, 150", "98, 124, 148", "100, 126, 148"],
    ci: 0,
    expl: "From 88 to 112 spans two gaps, so the common difference is (112 - 88) / 2 = 12. Adding 12 repeatedly gives the missing terms 100, 124, and 148."
  },
  {
    q: "If a grandfather clock chimes once at 1 o'clock, twice at 2 o'clock, thrice at 3 o'clock and so on for each of the 12 hours, how many times does it chime in total over the 12 hour period?",
    opts: ["78", "66", "90", "72"],
    ci: 0,
    expl: "The total is 1 + 2 + 3 + ... + 12 = 12 × 13 / 2 = 78."
  },
  {
    q: "What is the product of the 10th term and the 100th term of the following sequence: -297, -294, -291, ... ?",
    opts: ["0", "-270", "270", "-27,000"],
    ci: 0,
    expl: "The common difference is 3. The 10th term is -297 + 9(3) = -270. The 100th term is -297 + 99(3) = 0. The product is -270 × 0 = 0."
  },
  {
    q: "Find the missing terms, then find the sum of the first 20 terms for the following sequence: 9, ___, 25, 33, ___, ...",
    opts: ["1,700", "1,600", "1,620", "1,750"],
    ci: 0,
    expl: "Since 33 - 25 = 8, the common difference is 8 and the first term is 9. The sum of the first 20 terms is 20/2 × (2×9 + 19×8) = 10 × 170 = 1,700."
  },
  {
    q: "What is the sum of the terms between the 10th term and the 30th term, inclusive, of the following sequence: 1, 16, 31, 46, ... ?",
    opts: ["6,006", "5,870", "6,020", "5,994"],
    ci: 0,
    expl: "The common difference is 15. The 10th term is 1 + 9(15) = 136, and the 30th term is 1 + 29(15) = 436. There are 21 terms from the 10th to the 30th inclusive, so the sum is 21/2 × (136 + 436) = 21 × 286 = 6,006."
  },
  {
    q: "Find the sum of the first 25 positive even integers.",
    opts: ["650", "625", "600", "675"],
    ci: 0,
    expl: "The sum of the first n positive even integers is n(n+1). With n = 25, the sum is 25 × 26 = 650."
  },
  {
    q: "Find the positive difference between the sum of the first 30 positive even integers and the sum of the first 30 positive odd integers.",
    opts: ["30", "0", "15", "60"],
    ci: 0,
    expl: "The sum of the first 30 even integers is 30 × 31 = 930. The sum of the first 30 odd integers is 30² = 900. The positive difference is 930 - 900 = 30."
  },
  {
    q: "A store has a stack of soda cans. The top row has 1 can, the second row has 8 cans, and so on in an arithmetic sequence until the final row with 50 cans. How many cans in total are in the stack?",
    opts: ["204", "200", "196", "210"],
    ci: 0,
    expl: "The common difference is 7. Solving 1 + (n-1)(7) = 50 gives n = 8 rows. The sum is 8/2 × (1 + 50) = 4 × 51 = 204."
  },
  {
    q: "Find the missing terms: 11, ___, ___, ___, 251, ___",
    opts: ["71, 131, 191, 311", "70, 130, 190, 310", "71, 135, 195, 311", "71, 131, 191, 300"],
    ci: 0,
    expl: "Going from term 1 to term 5 spans four gaps, so the common difference is (251 - 11) / 4 = 60. Adding 60 repeatedly gives the missing terms 71, 131, 191, and 311."
  },
  {
    q: "Find the difference between the sum of the 1st and 50th term and the sum of the 2nd and 49th term of the sequence: -146, -96, -46, ...",
    opts: ["0", "50", "100", "2,158"],
    ci: 0,
    expl: "For any arithmetic sequence, the 1st term plus the 50th term equals 2a + 49d, which is exactly the same as the 2nd term plus the 49th term. So the difference is always 0, regardless of the specific sequence."
  },
  {
    q: "If the first term of a sequence is 3, the last term is 39 and the sum of the terms from first to last is 210, what is the product of the common difference and the number of terms?",
    opts: ["40", "36", "44", "42"],
    ci: 0,
    expl: "Using the sum formula, 210 = n/2 × (3 + 39), so n = 10 terms. Using the last term, 39 = 3 + (10-1)d, so d = 4. The product of d and n is 4 × 10 = 40."
  }
];

// --- Question order (original vs random), persisted independently of quiz progress ---
const ORDER_KEY = SKEY + '_order_v1';
function identityOrder(){ return RAW_QS.map((_,i)=>i); }
function isValidOrder(arr){
  if(!Array.isArray(arr)||arr.length!==RAW_QS.length) return false;
  const sorted=[...arr].sort((a,b)=>a-b);
  for(let i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    const raw=localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    const arr=JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error();
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }
function shuffleRandom(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
let currentOrder = loadOrder() || identityOrder();
let QS = currentOrder.map(i => RAW_QS[i]);

let state = {cur:0, answers:{}, shuffles:{}, showResults:false, retryMode:false, retryList:[]};
let attCount = parseInt(localStorage.getItem(ATT_KEY)||'0');
function getList(){ return state.retryMode ? state.retryList : QS.map((_,i)=>i); }

function saveState(){
  try{ localStorage.setItem(SKEY, JSON.stringify(state)); } catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(SKEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(typeof s.answers!=='object'||typeof s.shuffles!=='object') return;
    if(s.retryMode && !Array.isArray(s.retryList)) return;
    const list = s.retryMode ? s.retryList : QS.map((_,i)=>i);
    if(typeof s.cur!=='number'||s.cur<0||s.cur>=list.length) return;
    state = s;
  } catch(e){ localStorage.removeItem(SKEY); }
}
function getShuffled(i){
  if(!state.shuffles[i]){
    const q=QS[i];
    const idx=[0,1,2,3];
    for(let j=idx.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[idx[j],idx[r]]=[idx[r],idx[j]];}
    const newCi=idx.indexOf(q.ci);
    state.shuffles[i]={order:idx,ci:newCi};
    saveState();
  }
  return state.shuffles[i];
}

function render(){
  const qa=document.getElementById('quiz-area');
  const rs=document.getElementById('results-screen');
  const bn=document.getElementById('bottom-nav');
  if(state.showResults){
    qa.style.display='none';
    bn.style.display='none';
    rs.classList.add('show');
    showResultsScreen();
    updateNav();
    return;
  }
  rs.classList.remove('show');
  qa.style.display='block';
  bn.style.display='flex';
  renderQuestion();
  updateNav();
}

function renderQuestion(){
  const list=getList();
  const i=list[state.cur];
  const q=QS[i];
  const sh=getShuffled(i);
  const answered=state.answers[i]!==undefined;
  const chosen=state.answers[i];

  let html=`<div class="q-num">Question ${state.cur+1} of ${list.length}</div>`;
  html+=`<div class="q-text">${i+1}. ${q.q}</div><div class="opts">`;
  sh.order.forEach((origIdx,pos)=>{
    let cls='opt-btn';
    if(answered){
      if(pos===sh.ci) cls+=' opt-reveal';
      else if(pos===chosen) cls+=' opt-wrong';
    }
    const dis=answered?'disabled':'';
    html+=`<button class="${cls}" ${dis} onclick="window.pickOpt(${pos})">${q.opts[origIdx]}</button>`;
  });
  html+=`</div>`;
  if(answered){
    html+=`<div id="explanation" style="display:block">${q.expl}</div>`;
  } else {
    html+=`<div id="explanation" style="display:none"></div>`;
  }
  document.getElementById('quiz-area').innerHTML=html;

  const nb=document.getElementById('next-btn');
  const pb=document.getElementById('prev-btn');
  pb.disabled=(state.cur===0);
  nb.textContent=(state.cur===list.length-1)?'See Results →':'Next';
}

function updateNav(){
  const list=getList();
  const total=list.length;
  const ans=list.filter(i=>state.answers[i]!==undefined).length;
  document.getElementById('ans-count').textContent=`${ans} / ${total}`;
  document.getElementById('prog-bar-fill').style.width=`${ans/total*100}%`;
  document.getElementById('att-num').textContent=attCount;

  // dots
  const dp=document.getElementById('dot-panel');
  let dhtml='';
  list.forEach((qi,pos)=>{
    let cls='nav-dot dot-unanswered';
    if(state.answers[qi]!==undefined){
      const sh=state.shuffles[qi];
      if(sh && state.answers[qi]===sh.ci) cls='nav-dot dot-correct';
      else cls='nav-dot dot-wrong';
    }
    dhtml+=`<button class="${cls}" onclick="window.jumpTo(${pos})">${pos+1}</button>`;
  });
  dp.innerHTML=dhtml;

  const allDone=ans===total;
  document.getElementById('results-pill').style.display=allDone?'inline':'none';
}

window.pickOpt=function(pos){
  const list=getList();
  const i=list[state.cur];
  if(state.answers[i]!==undefined) return;
  state.answers[i]=pos;
  saveState();
  render();
  const allDone=list.filter(qi=>state.answers[qi]!==undefined).length===list.length;
  if(allDone) document.getElementById('results-pill').style.display='inline';
};
window.goPrev=function(){
  if(state.cur>0){state.cur--;saveState();render();}
};
window.goNext=function(){
  const list=getList();
  if(state.cur===list.length-1){window.goResults();return;}
  state.cur++;saveState();render();
};
window.jumpTo=function(pos){
  state.cur=pos;saveState();render();
};
window.toggleDots=function(){
  const dp=document.getElementById('dot-panel');
  dp.style.display=(dp.style.display==='flex')?'none':'flex';
};
window.goResults=function(){
  state.showResults=true;
  if(!state.retryMode){
    attCount++;
    localStorage.setItem(ATT_KEY,String(attCount));
  }
  saveState();render();
};

function showResultsScreen(){
  const list=getList();
  const total=list.length;
  let correct=0;
  list.forEach(i=>{
    const sh=state.shuffles[i];
    if(sh && state.answers[i]===sh.ci) correct++;
  });
  document.getElementById('results-heading').textContent = state.retryMode ? 'Retry Results' : 'Results';
  document.getElementById('score-line').textContent=`Score: ${correct} / ${total}`;
  let html='';
  list.forEach((i,pos)=>{
    const q=QS[i];
    const sh=state.shuffles[i];
    const chosen=state.answers[i];
    const isCorrect=sh&&chosen===sh.ci;
    const chosenText=(chosen!==undefined&&sh)?q.opts[sh.order[chosen]]:'—';
    const correctText=sh?q.opts[sh.order[sh.ci]]:'—';
    const rc=isCorrect?'rc-correct':'rc-wrong';
    html+=`<div class="results-card">
      <div class="rc-q">Q${pos+1}: ${q.q.substring(0,80)}${q.q.length>80?'…':''}</div>
      <div class="rc-a ${rc}">${isCorrect?'Correct':'Wrong'} — Your answer: ${chosenText}${isCorrect?'':' | Correct: '+correctText}</div>
      <div class="rc-expl">${q.expl}</div>
    </div>`;
  });
  document.getElementById('results-cards').innerHTML=html;
}

window.retryWrong=function(){
  const list=getList();
  const wrong=list.filter(i=>{
    const sh=state.shuffles[i];
    return state.answers[i]===undefined||(sh&&state.answers[i]!==sh.ci);
  });
  if(!wrong.length) return;
  wrong.forEach(i=>{delete state.answers[i];});
  state.retryMode=true;
  state.retryList=wrong;
  state.showResults=false;
  state.cur=0;
  saveState();render();
};
window.copyResults=function(){
  const list=getList();
  let txt='Chapter 10 – Arithmetic Sequences Results\n';
  list.forEach((i,pos)=>{
    const sh=state.shuffles[i];
    const isCorrect=sh&&state.answers[i]===sh.ci;
    txt+=`Q${pos+1}: ${isCorrect?'Correct':'Wrong'}\n`;
  });
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt);
    } else {
      const ta=document.createElement('textarea');
      ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    }
  } catch(e){}
};
let pendingFreshMode = 'original';
window.confirmFresh=function(mode){
  pendingFreshMode = mode;
  const t = document.getElementById('modal-title');
  const m = document.getElementById('modal-msg');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers will be cleared. This cannot be undone.';
  }
  document.getElementById('modal-overlay').classList.add('show');
};
window.closeModal=function(){
  document.getElementById('modal-overlay').classList.remove('show');
};
window.doFresh=function(){
  currentOrder = (pendingFreshMode==='random') ? shuffleRandom(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  QS = currentOrder.map(i => RAW_QS[i]);
  localStorage.removeItem(SKEY);
  state={cur:0,answers:{},shuffles:{},showResults:false,retryMode:false,retryList:[]};
  document.getElementById('modal-overlay').classList.remove('show');
  render();
};

loadState();
render();
})();
</script>
</body>
</html>
