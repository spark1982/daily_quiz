<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>[Sion] Naver Dictionary 94</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:0 0 40px;}
h1{text-align:center;font-size:1.35rem;font-weight:800;color:#1D9E75;background:#fff;padding:4px 16px 2px;}
#att-display{text-align:center;font-size:0.82rem;color:#555;background:#fff;padding:2px 0 8px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:4px 0 10px;}
#top-nav{background:#fff;border:2px solid #1D9E75;border-radius:10px;margin:10px 12px 0;padding:7px 10px 5px;}
#nav-row{display:flex;align-items:center;gap:8px;}
#count-display{font-size:0.88rem;font-weight:700;color:#333;white-space:nowrap;}
#progress-bar-wrap{flex:1;height:7px;background:#d7dde6;border-radius:4px;overflow:hidden;}
#progress-bar-fill{height:100%;background:#1D9E75;border-radius:4px;transition:width 0.3s;}
#jump-btn{font-size:0.78rem;font-weight:700;color:#1D9E75;background:#fff;border:1.5px solid #1D9E75;border-radius:6px;padding:3px 10px;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:7px 2px 2px;display:none;flex-wrap:wrap;gap:5px;margin-top:6px;}
#dot-panel.open{display:flex;}
.nav-dot{width:26px;height:26px;border-radius:50%;border:none;font-size:0.72rem;font-weight:700;cursor:pointer;color:#fff;background:#d7dde6;color:#333;}
.nav-dot.correct{background:#1D9E75;color:#fff;}
.nav-dot.wrong{background:#E24B4A;color:#fff;}
.nav-dot.results-pill{width:auto;border-radius:13px;padding:0 12px;background:#185FA5;color:#fff;font-size:0.72rem;}
#quiz-area{display:none;padding:14px 14px 0;}
.q-card{background:#fff;border-radius:12px;padding:18px 16px 14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
.q-word-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.q-word{font-size:1.45rem;font-weight:800;color:#185FA5;}
.tts-btn{background:none;border:none;cursor:pointer;font-size:1.3rem;padding:2px 4px;color:#1D9E75;line-height:1;}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt-btn{width:100%;text-align:left;padding:12px 14px;font-size:1rem;border-radius:8px;border:2px solid transparent;background:#e8edf4;color:#111111;cursor:pointer;transition:background 0.15s,border 0.15s;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.explain-box{margin-top:12px;border:2px solid #f5a623;background:#fffbe6;border-radius:8px;padding:10px 12px;font-size:0.9rem;color:#333;line-height:1.5;}
#btn-row{display:flex;gap:10px;margin:8px 14px 0;}
#prev-btn{flex:1;padding:12px;font-size:1rem;font-weight:700;border-radius:8px;border:none;background:#e8edf4;color:#333;cursor:pointer;}
#next-btn{flex:2;padding:12px;font-size:1rem;font-weight:700;border-radius:8px;border:none;background:#1D9E75;color:#fff;cursor:pointer;}
#results-screen{display:none;padding:14px;}
#results-screen.show{display:block;}
.results-heading{text-align:center;font-size:1.4rem;font-weight:800;color:#1D9E75;margin-bottom:4px;}
.results-sub{text-align:center;font-size:0.9rem;color:#555;margin-bottom:14px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px;margin-bottom:16px;}
.summary-card{border-radius:8px;padding:8px 4px 6px;text-align:center;cursor:pointer;font-size:0.78rem;font-weight:700;}
.summary-card.c{background:#E1F5EE;color:#085041;border:2px solid #1D9E75;}
.summary-card.w{background:#FCEBEB;color:#501313;border:2px solid #E24B4A;}
.summary-card.s{background:#f5f7fa;color:#555;border:2px solid #d7dde6;}
.summary-card .sq{font-size:1rem;font-weight:800;}
#results-btns{display:flex;flex-direction:column;gap:10px;}
#retry-btn{padding:13px;font-size:1rem;font-weight:700;border-radius:8px;border:none;background:#1D9E75;color:#fff;cursor:pointer;}
#copy-btn{padding:13px;font-size:1rem;font-weight:700;border-radius:8px;border:none;background:#185FA5;color:#fff;cursor:pointer;}
#fresh-btn{padding:13px;font-size:1rem;font-weight:700;border-radius:8px;border:none;background:#e8edf4;color:#333;cursor:pointer;}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
#modal-overlay.open{display:flex;}
#modal-box{background:#fff;border-radius:14px;padding:28px 22px 20px;max-width:320px;width:90%;text-align:center;}
#modal-box h3{font-size:1.1rem;font-weight:800;margin-bottom:10px;}
#modal-box p{font-size:0.92rem;color:#555;margin-bottom:18px;}
#modal-btns{display:flex;gap:10px;}
#modal-cancel{flex:1;padding:11px;border-radius:8px;border:none;background:#e8edf4;color:#333;font-weight:700;font-size:0.95rem;cursor:pointer;}
#modal-confirm{flex:1;padding:11px;border-radius:8px;border:none;background:#E24B4A;color:#fff;font-weight:700;font-size:0.95rem;cursor:pointer;}
</style>
</head>
<body>
<h1>[Sion] Naver Dictionary 94</h1>
<div id="att-display">English Vocabulary | Total Attempts: <span id="att-num">0</span></div>
<div class="instruction">Choose the correct meaning for each word.</div>
<div id="top-nav">
  <div id="nav-row">
    <span id="count-display">1 / 51</span>
    <div id="progress-bar-wrap"><div id="progress-bar-fill" style="width:0%"></div></div>
    <button id="jump-btn" onclick="window.toggleDots()">Jump</button>
  </div>
  <div id="dot-panel"></div>
</div>
<div id="quiz-area"></div>
<div id="btn-row">
  <button id="prev-btn" onclick="window.goPrev()">Prev</button>
  <button id="next-btn" onclick="window.goNext()">Next</button>
</div>
<div id="results-screen">
  <div class="results-heading">Results</div>
  <div class="results-sub" id="results-sub"></div>
  <div class="summary-grid" id="summary-grid"></div>
  <div id="results-btns">
    <button id="retry-btn" onclick="window.retryWrong()">Retry Wrong Ones</button>
    <button id="copy-btn" onclick="window.copyResults()">Copy All Results</button>
    <button id="fresh-btn" onclick="window.askFresh()">Start Fresh</button>
  </div>
</div>
<div id="modal-overlay">
  <div id="modal-box">
    <h3>Start Fresh?</h3>
    <p>All progress will be cleared. This cannot be undone.</p>
    <div id="modal-btns">
      <button id="modal-cancel" onclick="window.closeModal()">Cancel</button>
      <button id="modal-confirm" onclick="window.doFresh()">Start Fresh</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';

var STORAGE_KEY = 'quiz_sionnaver_v1';
var ATT_KEY = 'quiz_sionnaver_att_v1';

var QUESTIONS = [
  {word:'dastardly',ci:0,opts:['cowardly and cruel','faithful and loyal','calm and unhurried','excessively talkative'],exp:'Dastardly means wicked in a cowardly way. It combines cruelty with a lack of courage.'},
  {word:'gladiatorial',ci:1,opts:['shy and lacking confidence','relating to fierce combat','spreading widely throughout','a natural tendency'],exp:'Gladiatorial refers to the combative style of gladiators — aggressive, fierce contest or conflict.'},
  {word:'pusillanimous',ci:2,opts:['holy and greatly revered','excessively curious about others','lacking courage, timid','bold and assertive'],exp:'Pusillanimous means lacking courage or determination. It is a formal word for cowardly timidity.'},
  {word:'craven',ci:3,opts:['persistent and determined','brief and meaningful','tending to stir up conflict','contemptibly lacking in courage'],exp:'Craven describes someone who is shamefully cowardly, even more than merely afraid.'},
  {word:'sedate',ci:0,opts:['calm and unhurried','waste away, weaken','easily frightened, timid','treachery, deceitfulness'],exp:'Sedate means tranquil, composed, and not easily excited or hurried.'},
  {word:'hallowed',ci:1,opts:['using only one color','holy and greatly revered','reduce in force or strength','pretend shyness or reluctance'],exp:'Hallowed means made sacred or treated with great reverence. "Hallowed ground" is a classic usage.'},
  {word:'coyness',ci:2,opts:['a state of uncertainty','natural ability or talent','pretended shyness or reluctance','faithfulness, loyalty'],exp:'Coyness is the behavior of pretending to be shy or reluctant, often to seem more attractive or elusive.'},
  {word:'atrophy',ci:3,opts:['confirm or support with evidence','encourage or assist wrongdoing','walk heavily and slowly','waste away or weaken from disuse'],exp:'Atrophy means to gradually decline in strength or size, typically from lack of use.'},
  {word:'vitality',ci:0,opts:['energy and enthusiasm for life','postpone or cancel punishment','a spoken magical formula','courage in adversity'],exp:'Vitality is the state of being strong, active, and full of energy and liveliness.'},
  {word:'chum',ci:1,opts:['an omen of coming events','a close friend','occurring at irregular intervals','unnecessary, superfluous'],exp:'Chum is an informal word for a close friend or companion.'},
  {word:'abet',ci:2,opts:['relieve or ease','an omen of coming events','encourage or assist in wrongdoing','support or strengthen'],exp:'To abet means to assist or encourage someone in doing something wrong or illegal.'},
  {word:'expostulate',ci:3,opts:['show rainbow-like colors','walk heavily and slowly','compensate for harm or loss','express disagreement or protest'],exp:'To expostulate means to reason earnestly with someone, expressing opposition or objection.'},
  {word:'profuse',ci:0,opts:['abundant and plentiful','making complex or difficult','bad-tempered and silent','bold and domineering'],exp:'Profuse means produced or occurring in large amounts; very plentiful or abundant.'},
  {word:'propensity',ci:1,opts:['easy to perceive, definite','a natural tendency toward something','a forerunner or predecessor','excessively talkative'],exp:'A propensity is a natural inclination or tendency to behave in a certain way.'},
  {word:'aptitude',ci:2,opts:['cancel a debt or punishment','treachery, deceitfulness','a natural ability or talent','persistence, determination'],exp:'Aptitude is an inherent ability or talent, especially for a specific skill or field.'},
  {word:'sullen',ci:3,opts:['completely absorbed, fascinated','a close friend','faithful and loyal','bad-tempered and silently resentful'],exp:'Sullen describes someone who is gloomy, resentful, and refuses to speak or engage pleasantly.'},
  {word:'pervasive',ci:0,opts:['spreading widely throughout an area','a spoken magical formula','courage in adversity','pretended shyness or reluctance'],exp:'Pervasive means present or spreading through every part of something; found everywhere.'},
  {word:'omnipresent',ci:1,opts:['brief and meaningful','present everywhere at once','excessively curious about others','contemptibly lacking in courage'],exp:'Omnipresent means present in all places at the same time; everywhere simultaneously.'},
  {word:'sporadic',ci:2,opts:['using only one color','support or strengthen','occurring at irregular intervals','holy and greatly revered'],exp:'Sporadic means happening or appearing at irregular intervals; not continuous or steady.'},
  {word:'plod',ci:3,opts:['cancel a debt or punishment','a natural tendency toward something','relieve or ease','walk heavily and slowly'],exp:'To plod means to walk slowly with heavy steps, or to work steadily through a difficult task.'},
  {word:'perfidy',ci:0,opts:['treachery and deceitfulness','occurring at irregular intervals','a natural ability or talent','an excess or overabundance'],exp:'Perfidy is the quality of being deceitful and untrustworthy; deliberate betrayal.'},
  {word:'fidelity',ci:1,opts:['lacking courage, timid','faithfulness and loyalty','win favor, appease','spreading widely throughout'],exp:'Fidelity means faithfulness to a person, cause, or belief, especially in the face of temptation.'},
  {word:'attenuate',ci:2,opts:['walk heavily and slowly','express disagreement or protest','reduce in force or strength','encourage or assist in wrongdoing'],exp:'To attenuate means to reduce the strength, effect, or density of something; to weaken or thin.'},
  {word:'corroborate',ci:3,opts:['waste away or weaken from disuse','postpone or cancel punishment','using only one color','confirm or support with evidence'],exp:'To corroborate means to strengthen or confirm a statement or theory with supporting evidence.'},
  {word:'underpin',ci:0,opts:['support or strengthen from below','excessively curious about others','a sign of things to come','arrogant and domineering'],exp:'To underpin means to support, justify, or form the basis of something; to strengthen from beneath.'},
  {word:'fortitude',ci:1,opts:['unnecessary, superfluous','courage and strength in adversity','tending to stir up conflict','easy to perceive, definite'],exp:'Fortitude is the mental strength and courage that allows someone to endure pain or difficulty.'},
  {word:'tenacity',ci:2,opts:['bad-tempered and silently resentful','relieve or ease','persistence and determination','a natural tendency toward something'],exp:'Tenacity is the quality of being very determined and not giving up; persistent resolve.'},
  {word:'convolute',ci:3,opts:['energy and enthusiasm for life','a forerunner or predecessor','faithfulness and loyalty','to make complex or difficult to follow'],exp:'To convolute means to make something intricate and difficult to understand; to complicate unnecessarily.'},
  {word:'garrulous',ci:0,opts:['excessively talkative','holy and greatly revered','present everywhere at once','easily frightened, timid'],exp:'Garrulous describes someone who talks excessively, especially about unimportant things.'},
  {word:'pithy',ci:1,opts:['cowardly and cruel','brief, meaningful, and forcefully expressed','spreading widely throughout','bad-tempered and silently resentful'],exp:'Pithy means brief but full of substance and meaning; concise and forcefully expressive.'},
  {word:'surfeit',ci:2,opts:['courage and strength in adversity','a natural ability or talent','an excess or overabundance','cancel a debt or punishment'],exp:'A surfeit is an excessive amount of something, more than is needed or wanted.'},
  {word:'remit',ci:3,opts:['confirm or support with evidence','excessively talkative','an omen of coming events','cancel or reduce a debt or punishment'],exp:'To remit means to cancel or refrain from exacting a debt or punishment; also to send money.'},
  {word:'indemnify',ci:0,opts:['compensate for harm or loss','reduce in force or strength','completely absorbed, fascinated','pretended shyness or reluctance'],exp:'To indemnify means to compensate someone for harm or loss, or to protect against future loss.'},
  {word:'reprieve',ci:1,opts:['a spoken magical formula','a postponement or cancellation of punishment','win favor, appease','spreading widely throughout an area'],exp:'A reprieve is a cancellation or delay of a punishment; temporary relief from difficulty.'},
  {word:'imperious',ci:2,opts:['occurring at irregular intervals','a forerunner or predecessor','arrogant and domineering in manner','confirm or support with evidence'],exp:'Imperious means assuming power or authority without justification; arrogantly commanding.'},
  {word:'assuage',ci:3,opts:['encourage or assist in wrongdoing','persistence and determination','bad-tempered and silently resentful','to relieve or ease pain or distress'],exp:'To assuage means to make an unpleasant feeling less intense; to soothe or relieve.'},
  {word:'propitiate',ci:0,opts:['win favor or appease someone','walk heavily and slowly','express disagreement or protest','a sign of things to come'],exp:'To propitiate means to win the favor of an angry or powerful person or deity; to appease.'},
  {word:'rapt',ci:1,opts:['unnecessary, superfluous','completely absorbed or fascinated','reduce in force or strength','cowardly and cruel'],exp:'Rapt means completely fascinated by something; totally absorbed and enraptured.'},
  {word:'diffident',ci:2,opts:['treachery and deceitfulness','present everywhere at once','shy and lacking in self-confidence','an excess or overabundance'],exp:'Diffident describes someone who is shy and hesitant to speak up or assert themselves.'},
  {word:'timorous',ci:3,opts:['holy and greatly revered','faithful and loyal','support or strengthen from below','easily frightened and timid'],exp:'Timorous means easily alarmed; lacking in courage or confidence; nervously timid.'},
  {word:'monochrome',ci:0,opts:['using shades of only one color','excessively talkative','an omen of coming events','a spoken magical formula'],exp:'Monochrome means consisting of or displaying images in only one color or in black and white.'},
  {word:'iridescent',ci:1,opts:['easy to perceive, definite','showing luminous rainbow-like colors','bad-tempered and silently resentful','reduce in force or strength'],exp:'Iridescent means showing luminous colors that seem to change when seen from different angles.'},
  {word:'prying',ci:2,opts:['courage and strength in adversity','tending to stir up conflict','excessively curious about others','to make complex or difficult'],exp:'Prying means intrusively curious about other people\'s affairs; snooping where not welcome.'},
  {word:'incendiary',ci:3,opts:['occurring at irregular intervals','faithfulness and loyalty','cancel or reduce a debt or punishment','tending to stir up conflict or violence'],exp:'Incendiary describes something designed to cause fires or, figuratively, to inflame emotions and conflict.'},
  {word:'incantation',ci:0,opts:['a spoken magical formula or spell','a sign of things to come','persistence and determination','a natural tendency toward something'],exp:'An incantation is a series of words said as a magic spell or charm; a verbal ritual formula.'},
  {word:'portent',ci:1,opts:['compensate for harm or loss','an omen signaling coming events','shy and lacking in self-confidence','spreading widely throughout an area'],exp:'A portent is a sign or warning that something significant, usually bad, is about to happen.'},
  {word:'precursor',ci:2,opts:['relieve or ease pain or distress','arrogant and domineering in manner','a forerunner or predecessor','excessively curious about others'],exp:'A precursor is something that comes before and often leads to the development of something else.'},
  {word:'harbinger',ci:3,opts:['using shades of only one color','win favor or appease someone','bad-tempered and silently resentful','a sign that announces something to come'],exp:'A harbinger is a person or thing that signals the approach of a future event; a forerunner.'},
  {word:'clear-cut',ci:0,opts:['easy to perceive and definite','an excess or overabundance','waste away or weaken from disuse','excessively talkative'],exp:'Clear-cut means sharply defined and easy to understand; leaving no room for confusion or ambiguity.'},
  {word:'quandary',ci:1,opts:['completely absorbed or fascinated','a state of uncertainty or confusion','tending to stir up conflict','cancel or reduce a debt or punishment'],exp:'A quandary is a state of perplexity or uncertainty about what to do in a difficult situation.'},
  {word:'redundant',ci:2,opts:['a spoken magical formula or spell','a natural ability or talent','unnecessary or superfluous','a sign that announces something to come']}
];

var state = loadState();
var dotsOpen = false;

function defaultState(){
  var shuffles = {};
  var answers = {};
  QUESTIONS.forEach(function(q,i){
    var arr = q.opts.map(function(_,j){return j;});
    shuffleArr(arr);
    shuffles[i] = arr;
    answers[i] = null;
  });
  return {cur:0,answers:answers,shuffles:shuffles,showResults:false};
}

function shuffleArr(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
}

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return defaultState();
    var s=JSON.parse(raw);
    if(typeof s.cur!=='number'||s.cur<0||s.cur>=QUESTIONS.length){throw 0;}
    if(typeof s.answers!=='object'||typeof s.shuffles!=='object'){throw 0;}
    return s;
  }catch(e){
    localStorage.removeItem(STORAGE_KEY);
    return defaultState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function getAtt(){
  return parseInt(localStorage.getItem(ATT_KEY)||'0',10);
}
function incAtt(){
  var n=getAtt()+1;
  localStorage.setItem(ATT_KEY,String(n));
  return n;
}

function render(){
  var qa=document.getElementById('quiz-area');
  var rs=document.getElementById('results-screen');
  var btnRow=document.getElementById('btn-row');

  if(state.showResults){
    qa.style.display='none';
    btnRow.style.display='none';
    rs.classList.add('show');
    rs.style.display='block';
    renderResults();
    renderDots();
    renderNav();
    return;
  }

  rs.classList.remove('show');
  rs.style.display='none';
  qa.style.display='block';
  btnRow.style.display='flex';

  var i=state.cur;
  var q=QUESTIONS[i];
  var shuf=state.shuffles[i];
  var ans=state.answers[i];
  var answered=(ans!==null);

  // quiz area
  var html='<div class="q-card">';
  html+='<div class="q-word-row">';
  html+='<span class="q-word">'+q.word+'</span>';
  html+='<button class="tts-btn" onclick="window.speakWord(\''+q.word+'\')" title="Listen">&#128264;</button>';
  html+='</div>';
  html+='<div class="opts">';
  shuf.forEach(function(origIdx,pos){
    var txt=q.opts[origIdx];
    var cls='opt-btn';
    var dis='';
    if(answered){
      dis='disabled';
      if(origIdx===q.ci){cls+=' correct';}
      else if(ans===origIdx){cls+=' wrong';}
    }
    html+='<button class="'+cls+'" '+dis+' onclick="window.pickAns('+origIdx+')">'+txt+'</button>';
  });
  html+='</div>';
  if(answered && ans!==q.ci && q.exp){
    html+='<div class="explain-box">'+q.exp+'</div>';
  }
  html+='</div>';
  qa.innerHTML=html;

  // prev/next
  var prevBtn=document.getElementById('prev-btn');
  var nextBtn=document.getElementById('next-btn');
  prevBtn.disabled=(i===0);
  prevBtn.style.opacity=(i===0)?'0.4':'1';
  var isLast=(i===QUESTIONS.length-1);
  nextBtn.textContent=isLast?'See Results':'Next';

  renderDots();
  renderNav();
  document.getElementById('att-num').textContent=getAtt();
}

function renderNav(){
  var i=state.cur;
  var total=QUESTIONS.length;
  var answered=Object.keys(state.answers).filter(function(k){return state.answers[k]!==null;}).length;
  document.getElementById('count-display').textContent=(state.showResults?'Results':((i+1)+' / '+total));
  var pct=Math.round(answered/total*100);
  document.getElementById('progress-bar-fill').style.width=pct+'%';
}

function renderDots(){
  var panel=document.getElementById('dot-panel');
  var html='';
  QUESTIONS.forEach(function(q,i){
    var ans=state.answers[i];
    var cls='nav-dot';
    if(ans===null)cls+='';
    else if(ans===q.ci)cls+=' correct';
    else cls+=' wrong';
    html+='<button class="'+cls+'" onclick="window.jumpTo('+i+')">'+(i+1)+'</button>';
  });
  var allDone=Object.keys(state.answers).every(function(k){return state.answers[k]!==null;});
  if(allDone){
    html+='<button class="nav-dot results-pill" onclick="window.goResults()">Results</button>';
  }
  panel.innerHTML=html;
}

function renderResults(){
  var correct=0,wrong=0,skip=0;
  QUESTIONS.forEach(function(q,i){
    var a=state.answers[i];
    if(a===null)skip++;
    else if(a===q.ci)correct++;
    else wrong++;
  });
  document.getElementById('results-sub').textContent='Correct: '+correct+' / Wrong: '+wrong+' / Skipped: '+skip;
  var grid=document.getElementById('summary-grid');
  var html='';
  QUESTIONS.forEach(function(q,i){
    var a=state.answers[i];
    var cls='summary-card '+(a===null?'s':a===q.ci?'c':'w');
    var lbl=a===null?'Skip':a===q.ci?'Correct':'Wrong';
    html+='<div class="'+cls+'" onclick="window.jumpTo('+i+')"><div class="sq">Q'+(i+1)+'</div><div>'+lbl+'</div></div>';
  });
  grid.innerHTML=html;
  document.getElementById('att-num').textContent=getAtt();
}

window.pickAns=function(origIdx){
  if(state.answers[state.cur]!==null)return;
  state.answers[state.cur]=origIdx;
  saveState();
  render();
};

window.goPrev=function(){
  if(state.cur>0){state.cur--;saveState();render();}
};

window.goNext=function(){
  if(state.cur<QUESTIONS.length-1){state.cur++;saveState();render();}
  else{window.goResults();}
};

window.goResults=function(){
  var n=incAtt();
  state.showResults=true;
  saveState();
  render();
};

window.jumpTo=function(i){
  state.showResults=false;
  state.cur=i;
  saveState();
  if(dotsOpen){dotsOpen=false;document.getElementById('dot-panel').classList.remove('open');}
  render();
};

window.toggleDots=function(){
  dotsOpen=!dotsOpen;
  var panel=document.getElementById('dot-panel');
  if(dotsOpen)panel.classList.add('open');else panel.classList.remove('open');
};

window.retryWrong=function(){
  var wrong=[];
  QUESTIONS.forEach(function(q,i){
    var a=state.answers[i];
    if(a!==null&&a!==q.ci)wrong.push(i);
  });
  if(wrong.length===0)return;
  wrong.forEach(function(i){state.answers[i]=null;});
  state.showResults=false;
  state.cur=wrong[0];
  saveState();
  render();
};

window.copyResults=function(){
  var lines=['[Sion] Naver Dictionary - 2026-06-23'];
  QUESTIONS.forEach(function(q,i){
    var a=state.answers[i];
    var lbl=a===null?'Skipped':a===q.ci?'Correct':'Wrong';
    lines.push('Q'+(i+1)+' '+q.word+': '+lbl);
  });
  var txt=lines.join('\n');
  try{
    navigator.clipboard.writeText(txt);
    document.getElementById('copy-btn').textContent='Copied!';
    setTimeout(function(){document.getElementById('copy-btn').textContent='Copy All Results';},1500);
  }catch(e){}
};

window.askFresh=function(){
  document.getElementById('modal-overlay').classList.add('open');
};

window.closeModal=function(){
  document.getElementById('modal-overlay').classList.remove('open');
};

window.doFresh=function(){
  localStorage.removeItem(STORAGE_KEY);
  state=defaultState();
  saveState();
  document.getElementById('modal-overlay').classList.remove('open');
  render();
};

window.speakWord=function(word){
  try{
    var u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
};

render();
})();
</script>
