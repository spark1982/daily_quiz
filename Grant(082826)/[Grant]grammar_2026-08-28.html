<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_48_20260827_v1";var ATT_KEY = "quiz_grantgrammar_48_att_20260827_v1";var RAW_QUESTIONS = [{"stem": "She ________ to Paris twice in her life.", "opts": ["went", "has been"], "ci": 1, "exp": "In her life = experience up to now with no specific time, so use present perfect: has been.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The baby is <b>sleeping</b> in the crib.", "<b>Sleeping</b> eight hours a night is important for kids.", "She was <b>sleeping</b> when the storm began.", "Please don't wake the <b>sleeping</b> baby."], "ci": 3, "exp": "In \"Please don't wake the sleeping baby,\" \"sleeping\" comes directly before the noun \"baby\" and describes what the baby is doing - this adjective use of an -ing word is a present participle. In \"The baby is sleeping in the crib\" and \"She was sleeping when the storm began,\" \"sleeping\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Sleeping eight hours a night is important for kids,\" \"sleeping\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["Before leaving for school, jake packed his lunch, his homework, and his gym shoes.", "Before leaving for school Jake packed his lunch, his homework, and his gym shoes.", "Before leaving for school, Jake packed his lunch, his homework, and his gym shoes.", "Before leaving for school, Jake packed his lunch his homework and his gym shoes."], "ci": 2, "exp": "An introductory phrase (\"Before leaving for school\") must be followed by a comma. Items in a series of three or more must be separated by commas. \"Jake\" is a proper noun and is capitalized.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "The happy dog runs quickly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the VERBS in this sentence, and only the verbs?</span>", "opts": ["runs", "runs, quickly", "dog, runs", "(none of these)"], "ci": 0, "exp": "'Runs' is the verb - the action in the sentence.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "He is <u>drive</u> to the airport.", "opts": ["driving", "driveing", "drivving", "drived"], "ci": 0, "exp": "drive → driving (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "She called him smart.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["smart", "him"], "ci": 0, "exp": "\"Smart\" is the objective complement — it describes \"him.\" \"Him\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "He sent her a letter.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["a letter", "her"], "ci": 0, "exp": "\"A letter\" is the direct object (what was sent). \"Her\" is the indirect object (who received it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>hit</b>?", "opts": ["hit", "hitted", "hited", "hitten"], "ci": 0, "exp": "The past tense of <b>hit</b> is <b>hit</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">She left the office, and almost immediately it began to rain.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["No sooner she had left the office than it began to rain.", "No sooner did she leave the office when it began to rain.", "No sooner had she left the office when it began to rain.", "No sooner had she left the office than it began to rain."], "ci": 3, "exp": "\"No sooner...than\" requires inversion: \"No sooner + had + she + left...\". The paired conjunction must be \"than\" (not \"when\"), and past perfect \"had\" is correct. The correct form is: No sooner had she left the office than it began to rain.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "He sent her a letter.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["her", "a letter"], "ci": 0, "exp": "\"Her\" is the indirect object (who received it). \"A letter\" is the direct object (what was sent).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>let</b>?", "opts": ["let", "letted", "leted", "letten"], "ci": 0, "exp": "The past tense of <b>let</b> is <b>let</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "He kicks <u>balls</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Balls\" receives the action of \"kicks.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["Either the manager or the workers has to sign the form.", "The list of rules and regulations are posted on the board.", "Several students in the class finishes early every Friday.", "Everybody on the two school buses needs a permission slip."], "ci": 3, "exp": "\"Everybody\" is singular, so \"needs\" is correct. With either...or, the verb agrees with the closer subject — \"workers\" is plural, so use \"have.\" \"List\" is singular — use \"is.\" \"Students\" is plural — use \"finish.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "By the time you get stuck in traffic and arrive, she <span style=\"text-decoration:underline;\">______</span> dinner.", "opts": ["had prepared", "has prepared", "will have prepared", "prepares"], "ci": 2, "exp": "\"will have prepared\" is future perfect — she will finish preparing before you arrive.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["She loves <b>cooking</b> for her family.", "My dad is <b>cooking</b> dinner tonight.", "They were <b>cooking</b> when the fire alarm went off.", "He will be <b>cooking</b> all afternoon."], "ci": 0, "exp": "In \"She loves cooking for her family,\" \"cooking\" is the object of the verb \"loves\" - a noun role - which makes it a gerund. In the other three sentences, \"cooking\" pairs with \"is / were / will be\" to form the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>see</b> &rsaquo; Past: <b>saw</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["seed", "saw", "seeing", "seen"], "ci": 3, "exp": "'see' is an irregular verb. Its past participle is 'seen'. Past perfect: had seen.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["gorgeous old leather jacket", "old gorgeous leather jacket", "leather gorgeous old jacket", "gorgeous leather old jacket"], "ci": 0, "exp": "Correct order: opinion (gorgeous) → age (old) → material (leather) → noun\n✔ gorgeous old leather jacket", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "We _____ lived in this city for five years and love it here.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. They still live here, so the action continues into the present. Present perfect is used for actions that started in the past and continue now.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "He <u>watch</u> TV after dinner.", "opts": ["watches", "watchs", "watchies", "watcheds"], "ci": 0, "exp": "watch → watches (ends in -ch, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["During the loud and exciting soccer game.", "Birds sing beautifully every morning.", "Swimming in the cool lake all afternoon.", "If you finish your dinner tonight."], "ci": 1, "exp": "\"Birds sing beautifully every morning.\" is a complete sentence — subject: 'Birds', predicate: 'sing'. The others are fragments: a prepositional phrase, an -ing phrase, and an 'If' dependent clause.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The womens' meeting starts at nine.", "Have you seen Johns new laptop?", "She forgot to bring hers notebook.", "The students' essays were returned today."], "ci": 3, "exp": "<strong>\"students'\"</strong> correctly marks plural possessive.<br>• <em>womens'</em> is wrong — <em>women</em> is already plural; it should be <em>women's</em>.<br>• <em>Johns</em> is missing the apostrophe — should be <em>John's</em>.<br>• <em>hers</em> is a standalone pronoun; it cannot precede a noun. Use <em>her notebook</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "The explorers traveled _____ dense forests and wide rivers to reach the ancient ruins.", "opts": ["through", "onto", "within", "beside"], "ci": 0, "exp": "\"Through\" indicates movement from one side to the other of something. The explorers moved across and within the forests and rivers, so \"through\" fits perfectly. \"Onto\" implies moving on top of a surface.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">He had hardly arrived home when the phone rang.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Hardly he had arrived home when the phone rang.", "Hardly had he arrived home when the phone rang.", "Hardly did he arrive home when the phone rang.", "Hardly had he arrived home that the phone rang."], "ci": 1, "exp": "\"Hardly\" triggers inversion: \"Hardly + had + he + arrived...\". The conjunction must be \"when\" (not \"that\"), and past perfect \"had\" is correct. The correct form is: Hardly had he arrived home when the phone rang.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["The kids are <b>dancing</b> at the party.", "We were <b>dancing</b> until midnight.", "She will be <b>dancing</b> in the recital.", "<b>Dancing</b> makes me happy."], "ci": 3, "exp": "In \"Dancing makes me happy,\" \"dancing\" is the subject of the sentence - a noun - so it is a gerund. In the other three sentences, \"dancing\" follows \"are / were / will be\" and describes an ongoing or planned action, making it part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "My sister reads every night.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["every night", "reads", "My sister", "night"], "ci": 2, "exp": "See the correct answer highlighted above.", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "They eat <u>pizza</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Pizza\" receives the action of \"eat.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>wash</b> &rsaquo; Past: <b>washed</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["wash", "washing", "washd", "washed"], "ci": 3, "exp": "'wash' is a regular verb. Its past participle is 'washed' (base + -ed). Past perfect: had washed.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "My sister reads every night.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["reads", "My sister", "every", "night"], "ci": 0, "exp": "See the correct answer highlighted above.", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "far<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["farther / farthest", "farer / farest", "more far / most far", "further / furtest"], "ci": 0, "exp": "far → farther / farthest (distance); 'further/furthest' is also accepted for figurative use", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The results of the experiment surprises even the scientists.", "One of my best friends live across the street.", "The committee members votes on the new rule tomorrow.", "My brother and his best friend walk to school together every day."], "ci": 3, "exp": "\"My brother and his best friend\" is a compound (plural) subject, so \"walk\" is correct. \"Results\" is plural — use \"surprise.\" \"One\" is singular — use \"lives.\" \"Members\" is plural — use \"vote.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["When the teacher finally arrived.", "My favorite pizza with extra cheese.", "Jumping over the puddles on the way home.", "The cat sat on the warm windowsill."], "ci": 3, "exp": "\"The cat sat on the warm windowsill.\" is a complete sentence — subject: 'The cat', predicate: 'sat'. The others are fragments: a 'When' clause, a noun phrase with no verb, and an -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "She called him smart.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["him", "smart"], "ci": 0, "exp": "\"Him\" is the object (who was called). \"Smart\" is the objective complement (the quality assigned to him).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "The happy dog runs quickly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADVERBS in this sentence, and only the adverbs?</span>", "opts": ["quickly", "happy, quickly", "(none of these)", "dog, quickly"], "ci": 0, "exp": "'Quickly' is an adverb - it tells how the dog runs.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>foot</b>?", "opts": ["foots", "feets", "footes", "feet"], "ci": 3, "exp": "foot → feet (oo → ee)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "little<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["less / least", "littler / littlest", "more little / most little", "lesser / leastest"], "ci": 0, "exp": "little → less / least (irregular when referring to amount)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["The package, which arrived on monday, contained books, a map and an old compass.", "The package, which arrived on Monday, contained books, a map, and an old compass.", "The package which arrived on Monday contained books, a map, and an old compass.", "The package, which arrived on Monday, contained books a map and an old compass."], "ci": 1, "exp": "\"Monday\" is a proper noun and must be capitalized. A nonessential clause (\"which arrived on Monday\") must be set off by commas on both sides. A serial comma is needed before \"and\" in a list of three items.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "She is <u>ride</u> her bike to the park.", "opts": ["riding", "rideing", "ridding", "rided"], "ci": 0, "exp": "ride → riding (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The water is <b>boiling</b> right now.", "Be careful of the <b>boiling</b> water on the stove.", "<b>Boiling</b> is one way to purify water.", "The soup was <b>boiling</b> over when she walked in."], "ci": 1, "exp": "In \"Be careful of the boiling water on the stove,\" \"boiling\" comes directly before the noun \"water\" and describes what the water is doing - this adjective use of an -ing word is a present participle. In \"The water is boiling right now\" and \"The soup was boiling over when she walked in,\" \"boiling\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Boiling is one way to purify water,\" \"boiling\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "She <u>do</u> her homework every night.", "opts": ["does", "dos", "do", "doed"], "ci": 0, "exp": "do → does (irregular; pronounced 'duz', not 'doos')", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "We ________ dinner an hour ago.", "opts": ["finished", "have finished"], "ci": 0, "exp": "An hour ago is a specific finished time, so use simple past: finished.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["That bicycle over there is her's.", "The dogs bone is buried in the yard.", "We visited our grandparents' house last summer.", "The team lost there best player."], "ci": 2, "exp": "<strong>\"grandparents'\"</strong> correctly places the apostrophe after the plural noun.<br>• <em>her's</em> does not exist; the correct form is <em>hers</em>.<br>• <em>dogs</em> is missing the apostrophe — should be <em>dog's</em>.<br>• <em>there</em> is a location word; the possessive adjective is <em>their</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "Tom _____ just arrived at the station. He is waiting for you.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" (has) is correct. \"Just\" with present perfect shows a very recent action whose result is felt now.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "My grandfather keeps a small photograph of his hometown _____ his wallet wherever he goes.", "opts": ["along", "against", "inside", "toward"], "ci": 2, "exp": "\"Inside\" shows that the photograph is contained within the wallet. \"Along\" means beside or accompanying movement, and \"against\" means pressing on a surface — neither fits a wallet.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>Workers <b>built</b> the bridge.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The bridge ______ by workers.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["were built", "was built", "was building", "was build"], "ci": 1, "exp": "The new subject \"the bridge\" is singular and the action is in the past, so use was + the past participle \"built\": was built.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>tooth</b>?", "opts": ["tooths", "teeths", "teeth", "toothes"], "ci": 2, "exp": "tooth → teeth (oo → ee)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The dog <b>chased</b> the cats.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The cats ______ by the dog.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was chased", "were chased", "were chasing", "were chase"], "ci": 1, "exp": "The new subject \"the cats\" is plural and the action is in the past, so use were + the past participle \"chased\": were chased.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "The theater doors closed because they <span style=\"text-decoration:underline;\">______</span> out of tickets hours before.", "opts": ["had sold", "have sold", "will have sold", "sold"], "ci": 0, "exp": "\"had sold\" is past perfect — the tickets sold out before the doors closed.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["big round yellow ball", "yellow big round ball", "round big yellow ball", "big yellow round ball"], "ci": 0, "exp": "Correct order: size (big) → shape (round) → color (yellow) → noun\n✔ big round yellow ball", "tag": "Adjective Order", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
