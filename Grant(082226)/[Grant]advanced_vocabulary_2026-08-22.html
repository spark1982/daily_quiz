    try {

  function safeSet(key, val) {

  }

    var mmS = mm < 10 ? "0" + mm : String(mm);

      session.timeUp = true;
      safeSet(QUIZ_KEY, session);
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      return;
    }
    timerTextEl.textContent = fmtTime(remaining);
    var ratio = remaining / totalMs;
    timerTextEl.classList.remove("warnOrange", "warnRed");
    if (ratio <= 0.10) {
      timerTextEl.classList.add("warnRed");
    } else if (ratio <= 0.25) {
      timerTextEl.classList.add("warnOrange");
    }
  }

  function startTimerFromState() {
    if (session.startTs && session.timerRunning) {
      timerSetupEl.style.display = "none";
      timerDisplayEl.style.display = "block";
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(tickTimer, 1000);
      tickTimer();
    } else if (session.timeUp) {
      timerSetupEl.style.display = "none";
      timerDisplayEl.style.display = "block";
      timerTextEl.textContent = "Time's Up";
      timerTextEl.classList.add("warnRed");
    } else {
      timerSetupEl.style.display = "block";
      timerDisplayEl.style.display = "none";
      timeLimitInputEl.value = session.timeLimitMin || 20;
    }
  }

  function onStartTimer() {
    var val = parseInt(timeLimitInputEl.value, 10);
    if (!val || val < 1) val = 20;
    session.timeLimitMin = val;
    session.startTs = Date.now();
    session.timerRunning = true;
    session.timeUp = false;
    safeSet(QUIZ_KEY, session);
    startTimerFromState();
  }

  function currentQIndex() {
    return session.queue[session.pos];
  }

  function renderProgress() {
    var answeredCount = 0;
    for (var i = 0; i < session.queue.length; i++) {
      var qi = session.queue[i];
      if (session.answers[qi] !== undefined && session.answers[qi] !== null) answeredCount++;
    }
    progressTextEl.textContent = answeredCount + " / " + session.queue.length + " answered";
    var pct = session.queue.length ? (answeredCount / session.queue.length) * 100 : 0;
    progressFillEl.style.width = pct + "%";
  }

  function renderDots() {
    dotPanelEl.innerHTML = "";
    for (var i = 0; i < session.queue.length; i++) {
      var qi = session.queue[i];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "dotItem";
      var rec = session.answers[qi];
      if (rec && rec.correct === true) btn.classList.add("correct");
      else if (rec && rec.correct === false) btn.classList.add("wrong");
      if (i === session.pos) btn.classList.add("current");
      btn.textContent = String(i + 1);
      (function (targetPos) {
        btn.addEventListener("click", function () {
          if (session.finished) return;
          session.pos = targetPos;
          safeSet(QUIZ_KEY, session);
          renderQuestion();
        });
      })(i);
      dotPanelEl.appendChild(btn);
    }
  }

  function renderQuestion() {
    if (session.finished) {
      showResults();
      return;
    }
    quizAreaEl.style.display = "block";
    resultsAreaEl.style.display = "none";
    var qi = currentQIndex();
    var q = QUESTIONS[qi];
    tagBadgeEl.textContent = q.tag;
    tagBadgeEl.className = "tagBadge" + (q.tag === "Review" ? " review" : "");
    qStemEl.textContent = q.stem;
    optsListEl.innerHTML = "";
    feedbackEl.style.display = "none";
    feedbackEl.textContent = "";

    var rec = session.answers[qi];
    var answered = rec !== undefined && rec !== null;

    for (var i = 0; i < q.opts.length; i++) {
      (function (optIdx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "optBtn";
        b.textContent = q.opts[optIdx];
        if (answered) {
          b.classList.add("disabledOpt");
          if (optIdx === q.ci) {
            b.classList.add("revealCorrect");
          }
          if (optIdx === rec.picked && rec.picked !== q.ci) {
            b.classList.add("selectedWrong");
          }
          if (optIdx === rec.picked && rec.picked === q.ci) {
            b.classList.add("selectedCorrect");
          }
        } else {
          b.addEventListener("click", function () {
            selectAnswer(qi, optIdx);
          });
        }
        optsListEl.appendChild(b);
      })(i);
    }

    if (answered) {
      feedbackEl.style.display = "block";
      feedbackEl.textContent = q.exp;
    }

    prevBtn.disabled = session.pos === 0;
    var isLast = session.pos === session.queue.length - 1;
    nextBtn.textContent = isLast ? "Show Results →" : "Next →";
    nextBtn.disabled = false;

    renderProgress();
    if (dotPanelVisible) renderDots();
  }

  function selectAnswer(qi, optIdx) {
    var q = QUESTIONS[qi];
    var correct = optIdx === q.ci;
    session.answers[qi] = { picked: optIdx, correct: correct };
    safeSet(QUIZ_KEY, session);
    renderQuestion();
  }

  function goNext() {
    var isLast = session.pos === session.queue.length - 1;
    if (isLast) {
      finishQuiz();
      return;
    }
    session.pos++;
    safeSet(QUIZ_KEY, session);
    renderQuestion();
  }

  function goPrev() {
    if (session.pos === 0) return;
    session.pos--;
    safeSet(QUIZ_KEY, session);
    renderQuestion();
  }

  function finishQuiz() {
    session.finished = true;
    if (!session.resultCounted) {
      attempts++;
      safeSet(ATT_KEY, attempts);
      session.resultCounted = true;
      renderAttempts();
    }
    safeSet(QUIZ_KEY, session);
    showResults();
  }

  function showResults() {
    quizAreaEl.style.display = "none";
    resultsAreaEl.style.display = "block";
    var correctCount = 0;
    resultsListEl.innerHTML = "";
    for (var i = 0; i < session.queue.length; i++) {
      var qi = session.queue[i];
      var q = QUESTIONS[qi];
      var rec = session.answers[qi];
      var row = document.createElement("div");
      var isCorrect = rec && rec.correct === true;
      if (isCorrect) correctCount++;
      row.className = "resultRow " + (isCorrect ? "rightRow" : "wrongRow");
      var pickedText = rec ? q.opts[rec.picked] : "(not answered)";
      row.textContent = (i + 1) + ". " + q.stem + " - your answer: " + pickedText + (isCorrect ? " (correct)" : " (correct answer: " + q.opts[q.ci] + ")");
      resultsListEl.appendChild(row);
    }
    scoreTextEl.textContent = "Score: " + correctCount + " / " + session.queue.length;
    renderProgress();
    if (dotPanelVisible) renderDots();
  }

  function getWrongList() {
    var wrong = [];
    for (var i = 0; i < session.queue.length; i++) {
      var qi = session.queue[i];
      var rec = session.answers[qi];
      if (rec && rec.correct === false) {
        wrong.push({ qi: qi, rec: rec });
      }
    }
    return wrong;
  }

  function copyAllResults() {
    var lines = [];
    lines.push("Score: " + document.getElementById("scoreText").textContent.replace("Score: ", ""));
    for (var i = 0; i < session.queue.length; i++) {
      var qi = session.queue[i];
      var q = QUESTIONS[qi];
      var rec = session.answers[qi];
      var pickedText = rec ? q.opts[rec.picked] : "(not answered)";
      var status = rec && rec.correct ? "Correct" : "Wrong";
      lines.push((i + 1) + ". " + q.stem + " - " + status + " - your answer: " + pickedText + " - correct answer: " + q.opts[q.ci]);
    }
    var text = lines.join("\n");
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          alert("Results copied to clipboard.");
        }).catch(function () {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    } catch (e) {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      alert("Results copied to clipboard.");
    } catch (e) {
      alert("Could not copy automatically. Please select and copy manually.");
    }
  }

  function retryWrongOnes() {
    var wrong = getWrongList();
    if (wrong.length === 0) {
      alert("No wrong answers to retry. Great job!");
      return;
    }
    var newQueue = [];
    for (var i = 0; i < wrong.length; i++) newQueue.push(wrong[i].qi);
    session.queue = newQueue;
    session.answers = {};
    session.pos = 0;
    session.finished = false;
    session.resultCounted = false;
    safeSet(QUIZ_KEY, session);
    renderQuestion();
  }

  function saveWrongAnswers() {
    try {
      var wrong = getWrongList();
      if (wrong.length === 0) {
        alert("No wrong answers to save. Great job!");
        return;
      }
      var wrongData = [];
      for (var i = 0; i < wrong.length; i++) {
        var qi = wrong[i].qi;
        var rec = wrong[i].rec;
        var q = QUESTIONS[qi];
        wrongData.push({
          q: q.stem,
          opts: q.opts,
          ci: q.ci,
          picked: rec.picked
        });
      }
      var payload = {
        child: "Grant",
        subject: "[Grant] Advanced Vocabulary",
        date: "2026-08-22",
        wrong: wrongData
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "grant_advanced_vocabulary_wrong_answers.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      alert("Could not save wrong answers due to an error.");
    }
  }
  window.saveWrongAnswers = saveWrongAnswers;

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function doStartFresh(randomOrder) {
    if (randomOrder) {
      fullOrder = shuffleArray(defaultOrder());
    } else {
      fullOrder = defaultOrder();
    }
    safeSet(ORDER_KEY, fullOrder);
    session = defaultSession();
    session.queue = fullOrder.slice();
    safeSet(QUIZ_KEY, session);
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    startTimerFromState();
    renderQuestion();
  }

  function openModal(text, onConfirm) {
    modalTextEl.textContent = text;
    pendingModalAction = onConfirm;
    modalOverlayEl.style.display = "flex";
  }
  function closeModal() {
    modalOverlayEl.style.display = "none";
    pendingModalAction = null;
  }

  function toggleDotPanel() {
    dotPanelVisible = !dotPanelVisible;
    dotPanelEl.style.display = dotPanelVisible ? "flex" : "none";
    jumpToggleBtn.textContent = dotPanelVisible ? "Hide Questions ▴" : "Jump to Question ▾";
    if (dotPanelVisible) renderDots();
  }

  startTimerBtn.addEventListener("click", onStartTimer);
  jumpToggleBtn.addEventListener("click", toggleDotPanel);
  nextBtn.addEventListener("click", goNext);
  prevBtn.addEventListener("click", goPrev);
  copyResultsBtn.addEventListener("click", copyAllResults);
  retryWrongBtn.addEventListener("click", retryWrongOnes);
  saveWrongBtn.addEventListener("click", saveWrongAnswers);
  startFreshOrigBtn.addEventListener("click", function () {
    openModal("Start fresh in the original question order? This will reset your progress and timer.", function () {
      doStartFresh(false);
    });
  });
  startFreshRandBtn.addEventListener("click", function () {
    openModal("Start fresh in a random question order? This will reset your progress and timer.", function () {
      doStartFresh(true);
    });
  });
  modalConfirmBtn.addEventListener("click", function () {
    var action = pendingModalAction;
    closeModal();
    if (action) action();
  });
  modalCancelBtn.addEventListener("click", closeModal);
  modalOverlayEl.addEventListener("click", function (e) {
    if (e.target === modalOverlayEl) closeModal();
  });

  renderAttempts();
  startTimerFromState();
  renderQuestion();
})();
</script>
</body>
</html>
