<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Grammar</title>
<style>
  :root{
    --blue:#185FA5;
    --track:#d7dde6;
    --red:#E24B4A;
    --green:#1D9E75;
    --purple:#7b61ff;
    --orange:#FF8C00;
    --ink:#22303f;
    --sub:#5a6b7d;
    --card:#ffffff;
    --bg:#f2f5f9;
    --border:#e1e7ee;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    max-width:720px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  h1{
    font-size:26px;
    text-align:center;
    margin:10px 0 4px;
  }
  .instruction{
    text-align:center;
    color:var(--sub);
    font-size:15px;
    margin-bottom:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 1px 4px rgba(20,30,50,0.06);
  }
  .timer-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    justify-content:space-between;
  }
  .timer-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .timer-controls label{
    font-size:14px;
    color:var(--sub);
  }
  .timer-controls input[type="number"]{
    width:64px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
  }
  .btn{
    border:none;
    border-radius:9px;
    padding:9px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
  }
  .btn-blue{background:var(--blue);}
  .btn-green{background:var(--green);}
  .btn-purple{background:var(--purple);}
  .btn-grey{background:#6b7684;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  #timerDisplay{
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    min-width:90px;
    text-align:right;
  }
  #timerDisplay.orange{color:var(--orange);}
  #timerDisplay.red{color:var(--red);}
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    color:var(--sub);
    margin-bottom:8px;
  }
  .progress-track{
    width:100%;
    height:10px;
    background:var(--track);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progress-fill{
    height:100%;
    background:var(--blue);
    width:0%;
    transition:width 0.2s ease;
  }
  .jump-toggle{
    background:none;
    border:none;
    color:var(--blue);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
  }
  .jump-panel{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  .jump-panel.open{display:flex;}
  .jump-dot{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--track);
    border:2px solid transparent;
    color:var(--ink);
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .jump-dot.answered-correct{background:var(--blue);color:#fff;}
  .jump-dot.answered-wrong{background:var(--red);color:#fff;}
  .jump-dot.current{border-color:var(--ink);}
  .qnum{
    font-size:13px;
    color:var(--sub);
    font-weight:700;
    margin-bottom:6px;
  }
  .qtext{
    font-size:18px;
    line-height:1.45;
    margin-bottom:16px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 14px;
    margin-bottom:10px;
    border:2px solid var(--border);
    border-radius:10px;
    background:#fff;
    font-size:15px;
    cursor:pointer;
    color:var(--ink);
  }
  .opt:hover{border-color:var(--blue);}
  .opt.selected{border-color:var(--blue);background:#eaf2fb;}
  .opt.correct{border-color:var(--green);background:#e7f7f1;}
  .opt.wrong{border-color:var(--red);background:#fbeaea;}
  .opt:disabled{cursor:default;}
  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:6px;
  }
  .exp-box{
    margin-top:12px;
    padding:12px 14px;
    background:#f6f8fb;
    border-left:4px solid var(--blue);
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
    color:var(--sub);
  }
  .results-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .results-actions .btn{width:100%;}
  .score-line{
    font-size:20px;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
  }
  .attempts-line{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    margin-bottom:16px;
  }
  .review-item{
    padding:12px 0;
    border-top:1px solid var(--border);
  }
  .review-q{font-weight:600;margin-bottom:6px;}
  .review-your{font-size:14px;margin-bottom:2px;}
  .review-correct{font-size:14px;margin-bottom:6px;}
  .tag-right{color:var(--green);font-weight:700;}
  .tag-wrong{color:var(--red);font-weight:700;}
  #toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    display:none;
    z-index:50;
  }
  .modal-overlay{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(20,30,50,0.45);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:20px;
    max-width:360px;
    width:100%;
  }
  .modal-box p{font-size:15px;line-height:1.5;margin-top:0;}
  .modal-btn-row{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:16px;
  }
  .modal-btn{
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .modal-cancel{background:var(--track);color:var(--ink);}
  .modal-confirm{background:var(--blue);color:#fff;}
</style>
</head>
<body>

<h1>[Grant] Grammar</h1>
<div class="instruction">Choose the best answer to complete each sentence.</div>

<div class="card" id="timerCard">
  <div class="timer-row">
    <div class="timer-controls">
      <label for="timeLimitInput">Set Time Limit (min)</label>
      <input type="number" id="timeLimitInput" min="1" max="120" value="15">
      <button class="btn btn-blue" id="startTimerBtn" onclick="window.startTimer()">Start</button>
    </div>
    <div id="timerDisplay">--:--</div>
  </div>
</div>

<div class="card" id="progressCard">
  <div class="progress-row">
    <span id="answeredCount">Answered 0/20</span>
    <button class="jump-toggle" id="jumpToggleBtn" onclick="window.toggleJumpPanel()">Jump to Question &#9662;</button>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="jump-panel" id="jumpPanel"></div>
</div>

<div class="card" id="quizCard"></div>

<div class="card" id="resultsCard" style="display:none;"></div>

<div id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p id="modalText"></p>
    <div class="modal-btn-row">
      <button class="modal-btn modal-cancel" id="modalCancelBtn">Cancel</button>
      <button class="modal-btn modal-confirm" id="modalConfirmBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STATE_KEY = "quiz_grantgrammar_20_20260821_v1";
  var ATTEMPTS_KEY = "quiz_grantgrammar_20260821_att_v1";

  var QUESTIONS = [
    {
      q:"Mia and her brothers ___ to the park every Saturday.",
      opts:["walk","walks","walking","has walked"],
      ci:0,
      exp:"Mia and her brothers is a compound subject joined by and, so it needs the plural verb walk. Walks is the singular verb form and does not agree with the plural subject. Walking and has walked are not complete simple present tense forms that fit here."
    },
    {
      q:"Either the coach or the players ___ responsible for choosing the team captain.",
      opts:["is","are","was","be"],
      ci:1,
      exp:"When subjects are joined by or, the verb agrees with the nearer subject, players, which is plural, so are is correct. Is and was are singular verb forms that do not match the plural players. Be is not a complete conjugated verb for this sentence."
    },
    {
      q:"By the time we arrived, the movie had already ___.",
      opts:["began","begun","begin","beginned"],
      ci:1,
      exp:"Begun is the correct past participle used with had to form the past perfect tense. Began is the simple past tense form and cannot follow had in this construction. Beginned is not a real word, since begin has an irregular past form."
    },
    {
      q:"Grant made ___ a sandwich after school.",
      opts:["hisself","himself","him","he"],
      ci:1,
      exp:"Himself is the correct reflexive pronoun because the subject Grant is also the one receiving the action. Hisself is not a standard English word. Him and he are not reflexive pronouns and do not correctly refer back to the subject."
    },
    {
      q:"This is a secret between you and ___.",
      opts:["I","me","myself","mine"],
      ci:1,
      exp:"Me is the correct object pronoun to use after the preposition between. I is a subject pronoun and cannot follow a preposition. Myself is a reflexive pronoun and does not fit unless the speaker is also the subject performing an action on themselves."
    },
    {
      q:"___ going to love this new book.",
      opts:["Your","You're","Yore","Yours"],
      ci:1,
      exp:"You're is the contraction of you are, which fits the sentence. Your is a possessive pronoun and does not mean you are. Yore is an unrelated word meaning long ago, and yours is a possessive pronoun that also does not mean you are."
    },
    {
      q:"The students left ___ backpacks by the door.",
      opts:["there","their","they're","theirs"],
      ci:1,
      exp:"Their is the possessive pronoun that shows the backpacks belong to the students. There refers to a place, not possession. They're is a contraction of they are and does not show ownership."
    },
    {
      q:"Which sentence uses the correct order of adjectives?",
      opts:["She wore a beautiful long red dress.","She wore a red beautiful long dress.","She wore a long beautiful red dress.","She wore a red long beautiful dress."],
      ci:0,
      exp:"English adjective order typically places opinion before length before color, so beautiful long red is correct. Placing red before beautiful and long breaks the standard opinion-size-color order. Long beautiful red reverses the opinion and length adjectives from their usual order."
    },
    {
      q:"Which sentence correctly uses a semicolon to join two independent clauses?",
      opts:["The rain stopped; the sun came out.","The rain stopped, the sun came out.","The rain stopped; and the sun came out.","The rain stopped the sun; came out."],
      ci:0,
      exp:"A semicolon can correctly join two closely related independent clauses without a conjunction, as in The rain stopped; the sun came out. Using only a comma between two independent clauses creates a comma splice. Adding and after a semicolon is unnecessary, since a semicolon already replaces the conjunction."
    },
    {
      q:"Which sentence correctly uses a subordinating conjunction?",
      opts:["Although it was raining, we still went hiking.","It was raining, we still went hiking.","Although it was raining we still went, hiking.","We still went hiking, although."],
      ci:0,
      exp:"Although correctly introduces the dependent clause and is followed by a comma before the independent clause, forming a proper complex sentence. The second option leaves out the subordinating conjunction, creating a comma splice. The last option leaves although stranded with nothing after it, so it does not form a complete dependent clause."
    },
    {
      q:"Which sentence correctly punctuates an introductory phrase?",
      opts:["After finishing his homework, Grant played video games.","After finishing his homework Grant played video games.","After finishing, his homework Grant played video games.","After, finishing his homework Grant played video games."],
      ci:0,
      exp:"A comma correctly follows the introductory phrase After finishing his homework before the main clause begins. Leaving out the comma makes the sentence harder to read and breaks the standard rule for introductory phrases. Placing a comma in the middle of the phrase itself, as in after finishing, splits it in the wrong place."
    },
    {
      q:"Which sentence uses commas correctly in a series?",
      opts:["I packed apples, crackers, and juice for the trip.","I packed apples crackers, and juice for the trip.","I packed apples, crackers and, juice for the trip.","I packed apples, crackers, and, juice for the trip."],
      ci:0,
      exp:"Commas correctly separate each item in the series, including before the conjunction and, forming apples, crackers, and juice. The second option is missing the comma after apples, so the first two items run together. The last option adds an extra unnecessary comma right after and."
    },
    {
      q:"Which sentence correctly punctuates dialogue?",
      opts:["\"Let's go to the park,\" said Mia.","\"Let's go to the park\" said Mia.","Let's go to the park, said Mia.","\"Let's go to the park\", said Mia."],
      ci:0,
      exp:"The comma correctly sits inside the closing quotation mark before said Mia, following standard dialogue punctuation. Leaving out the comma before the closing quotation mark breaks the pause needed before the speaker tag. Leaving out the quotation marks entirely fails to show that Mia's exact words are being quoted."
    },
    {
      q:"Which sentence uses the possessive form correctly?",
      opts:["The dog's leash was left on the porch.","The dogs leash was left on the porch.","The dog's' leash was left on the porch.","The dogs' leash was left on the porch."],
      ci:0,
      exp:"Since dog is singular, it takes an apostrophe plus s to show possession, forming dog's. The dogs leash leaves out the apostrophe entirely. The dogs' leash uses the plural possessive form, which would only be correct if more than one dog owned the leash."
    },
    {
      q:"Which sentence uses the plural possessive form correctly?",
      opts:["The two teams' uniforms were the same color.","The two team's uniforms were the same color.","The two teams's uniforms were the same color.","The two teams uniforms were the same color."],
      ci:0,
      exp:"Since teams is already plural, it takes only an apostrophe after the s to show possession, forming teams'. Team's would only be correct for a single team. Teams's incorrectly adds both an apostrophe and an extra s to an already plural word."
    },
    {
      q:"___ left this backpack on the bus?",
      opts:["Whom","Who","Whose","Who's"],
      ci:1,
      exp:"Who is the correct subject pronoun to use here because it performs the action of leaving the backpack. Whom is an object pronoun and would only be correct if it were receiving an action from someone else. Whose shows possession and who's is a contraction of who is, neither of which fits this question."
    },
    {
      q:"Grant plays the piano very ___.",
      opts:["good","well","gooder","best"],
      ci:1,
      exp:"Well is the adverb form needed to describe how Grant plays, since adverbs modify verbs like plays. Good is an adjective and should describe a noun, not a verb. Gooder is not a standard English word, and best is a superlative form that does not fit this simple sentence."
    },
    {
      q:"Which sentence avoids a double negative?",
      opts:["I don't have no homework tonight.","I don't have any homework tonight.","I haven't got no homework tonight.","I don't got no homework tonight."],
      ci:1,
      exp:"I don't have any homework tonight uses only one negative word, don't, making it grammatically correct. The other three sentences each combine a negative word like don't or haven't with no, creating a double negative that is considered incorrect in standard English."
    },
    {
      q:"Which sentence uses parallel structure correctly?",
      opts:["She likes hiking, swimming, and to bike.","She likes hiking, swimming, and biking.","She likes to hike, swimming, and biking.","She likes hiking, to swim, and biking."],
      ci:1,
      exp:"Hiking, swimming, and biking all use the same -ing verb form, keeping the list grammatically parallel. Mixing in to bike or to hike breaks the pattern by switching to an infinitive form partway through the list. Parallel structure requires every item in a series to match the same grammatical form."
    },
    {
      q:"Which sentence keeps its verb tense consistent?",
      opts:["Grant opened his book and reads the first chapter.","Grant opens his book and read the first chapter.","Grant opened his book and read the first chapter.","Grant opens his book and reading the first chapter."],
      ci:2,
      exp:"Opened and read are both simple past tense verbs, keeping the sentence's tense consistent throughout. The first option shifts from past tense opened to present tense reads midway through. The second option similarly shifts from present tense opens to past tense read, creating an inconsistent tense shift."
    }
  ];

  var TOTAL = QUESTIONS.length;

  function safeGet(key){
    try{
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  function safeSet(key, val){
    try{
      localStorage.setItem(key, JSON.stringify(val));
    }catch(e){ /* ignore */ }
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function freshState(mode){
    var order;
    if(mode === "random"){
      order = shuffle(Array.from({length: TOTAL}, function(_, i){ return i; }));
    } else {
      order = Array.from({length: TOTAL}, function(_, i){ return i; });
    }
    return {
      orderMode: mode || "original",
      order: order,
      answers: new Array(order.length).fill(null),
      currentPos: 0,
      finished: false,
      countedThisAttempt: false,
      isRetry: false,
      timer: { durationMs: null, startTs: null, running: false }
    };
  }

  var state = safeGet(STATE_KEY);
  if(!state || !state.order || !state.answers || state.order.length !== state.answers.length){
    state = freshState("original");
    safeSet(STATE_KEY, state);
  }

  function save(){ safeSet(STATE_KEY, state); }

  // ---------- Timer ----------
  var timerInterval = null;

  function updateTimerDisplay(){
    var el = document.getElementById("timerDisplay");
    if(!state.timer || !state.timer.running || !state.timer.durationMs){
      el.textContent = "--:--";
      el.classList.remove("orange","red");
      return;
    }
    var elapsed = Date.now() - state.timer.startTs;
    var remaining = state.timer.durationMs - elapsed;
    if(remaining <= 0){
      el.textContent = "Time's Up";
      el.classList.remove("orange");
      el.classList.add("red");
      state.timer.running = false;
      save();
      if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
      return;
    }
    var pct = remaining / state.timer.durationMs;
    el.classList.remove("orange","red");
    if(pct <= 0.10){ el.classList.add("red"); }
    else if(pct <= 0.25){ el.classList.add("orange"); }
    var totalSec = Math.ceil(remaining / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    el.textContent = (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
  }

  function startTimerInterval(){
    if(timerInterval){ clearInterval(timerInterval); }
    timerInterval = setInterval(updateTimerDisplay, 500);
    updateTimerDisplay();
  }

  window.startTimer = function(){
    var input = document.getElementById("timeLimitInput");
    var minutes = parseFloat(input.value);
    if(!minutes || minutes <= 0){ minutes = 15; }
    state.timer = {
      durationMs: minutes * 60 * 1000,
      startTs: Date.now(),
      running: true
    };
    save();
    startTimerInterval();
  };

  // ---------- Rendering ----------
  function currentQuestionIndex(){
    return state.order[state.currentPos];
  }

  function renderProgress(){
    var answeredCount = state.answers.filter(function(a){ return a !== null; }).length;
    document.getElementById("answeredCount").textContent = "Answered " + answeredCount + "/" + state.order.length;
    var pct = state.order.length ? (answeredCount / state.order.length) * 100 : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    renderJumpPanel();
  }

  function renderJumpPanel(){
    var panel = document.getElementById("jumpPanel");
    panel.innerHTML = "";
    state.order.forEach(function(qIdx, pos){
      var dot = document.createElement("div");
      dot.className = "jump-dot";
      var ans = state.answers[pos];
      if(ans !== null){
        var q = QUESTIONS[qIdx];
        dot.className += (ans === q.ci) ? " answered-correct" : " answered-wrong";
      }
      if(pos === state.currentPos && !state.finished){
        dot.className += " current";
      }
      dot.textContent = String(pos + 1);
      dot.setAttribute("onclick", "window.jumpTo(" + pos + ")");
      panel.appendChild(dot);
    });
  }

  window.toggleJumpPanel = function(){
    var panel = document.getElementById("jumpPanel");
    var btn = document.getElementById("jumpToggleBtn");
    var open = panel.classList.toggle("open");
    btn.innerHTML = open ? "Jump to Question &#9652;" : "Jump to Question &#9662;";
  };

  window.jumpTo = function(pos){
    if(state.finished) return;
    state.currentPos = pos;
    save();
    renderQuiz();
  };

  function renderQuiz(){
    if(state.finished){
      renderResults();
      return;
    }
    document.getElementById("resultsCard").style.display = "none";
    var card = document.getElementById("quizCard");
    card.style.display = "block";

    var pos = state.currentPos;
    var qIdx = state.order[pos];
    var q = QUESTIONS[qIdx];
    var picked = state.answers[pos];

    var html = "";
    html += '<div class="qnum">Question ' + (pos + 1) + ' of ' + state.order.length + '</div>';
    html += '<div class="qtext">' + escapeHtml(q.q) + '</div>';

    q.opts.forEach(function(optText, oIdx){
      var cls = "opt";
      var disabled = "";
      if(picked !== null){
        disabled = "disabled";
        if(oIdx === q.ci){ cls += " correct"; }
        else if(oIdx === picked){ cls += " wrong"; }
      }
      html += '<button class="' + cls + '" ' + disabled + ' onclick="window.selectOption(' + oIdx + ')">' + escapeHtml(optText) + '</button>';
    });

    if(picked !== null){
      html += '<div class="exp-box">' + escapeHtml(q.exp) + '</div>';
    }

    var isLast = (pos === state.order.length - 1);
    html += '<div class="nav-row">';
    html += '<button class="btn btn-grey" onclick="window.goPrev()" ' + (pos === 0 ? "disabled" : "") + '>&larr; Previous</button>';
    if(isLast){
      html += '<button class="btn btn-blue" onclick="window.goNext()">Show Results &rarr;</button>';
    } else {
      html += '<button class="btn btn-blue" onclick="window.goNext()">Next &rarr;</button>';
    }
    html += '</div>';

    card.innerHTML = html;
    renderProgress();
  }

  window.selectOption = function(oIdx){
    var pos = state.currentPos;
    if(state.answers[pos] !== null) return;
    state.answers[pos] = oIdx;
    save();
    renderQuiz();
  };

  window.goPrev = function(){
    if(state.currentPos > 0){
      state.currentPos -= 1;
      save();
      renderQuiz();
    }
  };

  window.goNext = function(){
    var isLast = (state.currentPos === state.order.length - 1);
    if(isLast){
      finishQuiz();
    } else {
      state.currentPos += 1;
      save();
      renderQuiz();
    }
  };

  function finishQuiz(){
    state.finished = true;
    if(!state.countedThisAttempt){
      var attempts = safeGet(ATTEMPTS_KEY);
      if(typeof attempts !== "number"){ attempts = 0; }
      attempts += 1;
      safeSet(ATTEMPTS_KEY, attempts);
      state.countedThisAttempt = true;
    }
    save();
    renderQuiz();
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Results ----------
  function renderResults(){
    document.getElementById("quizCard").style.display = "none";
    var card = document.getElementById("resultsCard");
    card.style.display = "block";

    var correctCount = 0;
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      if(state.answers[pos] === q.ci){ correctCount++; }
    });

    var attempts = safeGet(ATTEMPTS_KEY);
    if(typeof attempts !== "number"){ attempts = 0; }

    var html = "";
    html += '<div class="score-line">Score: ' + correctCount + ' / ' + state.order.length + '</div>';
    html += '<div class="attempts-line">Total Attempts: ' + attempts + '</div>';

    html += '<div class="results-actions">';
    html += '<button class="btn btn-blue" onclick="window.copyAllResults()">Copy All Results</button>';
    html += '<button class="btn btn-green" onclick="window.retryWrongOnes()">Retry Wrong Ones</button>';
    html += '<button class="btn btn-purple" onclick="window.saveWrongAnswers()">Save Wrong Answers</button>';
    html += '<button class="btn btn-grey" onclick="window.startFresh(\'original\')">Start Fresh (Original Order)</button>';
    html += '<button class="btn btn-grey" onclick="window.startFresh(\'random\')">Start Fresh (Random Order)</button>';
    html += '</div>';

    html += '<div id="reviewList">';
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      var picked = state.answers[pos];
      var isCorrect = picked === q.ci;
      html += '<div class="review-item">';
      html += '<div class="review-q">' + (pos + 1) + '. ' + escapeHtml(q.q) + '</div>';
      html += '<div class="review-your">Your answer: ' + escapeHtml(picked !== null ? q.opts[picked] : "(no answer)") + ' <span class="' + (isCorrect ? "tag-right" : "tag-wrong") + '">' + (isCorrect ? "Correct" : "Incorrect") + '</span></div>';
      if(!isCorrect){
        html += '<div class="review-correct">Correct answer: ' + escapeHtml(q.opts[q.ci]) + '</div>';
      }
      html += '<div class="exp-box">' + escapeHtml(q.exp) + '</div>';
      html += '</div>';
    });
    html += '</div>';

    card.innerHTML = html;
    renderProgress();
  }

  // ---------- Copy / Save / Retry / Reset ----------
  window.copyAllResults = function(){
    var lines = [];
    lines.push("[Grant] Grammar - Results");
    var correctCount = 0;
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      var picked = state.answers[pos];
      var isCorrect = picked === q.ci;
      if(isCorrect) correctCount++;
      lines.push((pos + 1) + ". " + q.q);
      lines.push("Your answer: " + (picked !== null ? q.opts[picked] : "(no answer)") + (isCorrect ? " (Correct)" : " (Incorrect)"));
      if(!isCorrect){
        lines.push("Correct answer: " + q.opts[q.ci]);
      }
      lines.push("");
    });
    lines.push("Score: " + correctCount + " / " + state.order.length);
    var text = lines.join("\n");

    function showToast(msg){
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(function(){ t.style.display = "none"; }, 2200);
    }

    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          showToast("Results copied to clipboard.");
        }).catch(function(){
          showToast("Could not copy results.");
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Results copied to clipboard.");
      }
    }catch(e){
      showToast("Could not copy results.");
    }
  };

  window.saveWrongAnswers = function(){
    var wrong = [];
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      var picked = state.answers[pos];
      if(picked !== q.ci){
        wrong.push({
          q: q.q,
          opts: q.opts,
          ci: q.ci,
          picked: picked
        });
      }
    });

    if(wrong.length === 0){
      alert("No wrong answers to save. Great job!");
      return;
    }

    var payload = {
      child: "Grant",
      subject: "[Grant] Grammar",
      date: "2026-08-22",
      wrong: wrong
    };

    try{
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "grant_grammar_wrong_answers_2026-08-22.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){
      alert("Could not save wrong answers file.");
    }
  };

  window.retryWrongOnes = function(){
    var wrongIdx = [];
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      if(state.answers[pos] !== q.ci){
        wrongIdx.push(qIdx);
      }
    });
    if(wrongIdx.length === 0){
      alert("No wrong answers to retry. Great job!");
      return;
    }
    state.order = wrongIdx;
    state.answers = new Array(wrongIdx.length).fill(null);
    state.currentPos = 0;
    state.finished = false;
    state.countedThisAttempt = false;
    state.isRetry = true;
    save();
    renderQuiz();
  };

  function showModal(message, onConfirm){
    var overlay = document.getElementById("modalOverlay");
    document.getElementById("modalText").textContent = message;
    overlay.classList.add("open");

    var confirmBtn = document.getElementById("modalConfirmBtn");
    var cancelBtn = document.getElementById("modalCancelBtn");

    function cleanup(){
      overlay.classList.remove("open");
      confirmBtn.removeEventListener("click", onConfirmClick);
      cancelBtn.removeEventListener("click", onCancelClick);
    }
    function onConfirmClick(){ cleanup(); onConfirm(); }
    function onCancelClick(){ cleanup(); }

    confirmBtn.addEventListener("click", onConfirmClick);
    cancelBtn.addEventListener("click", onCancelClick);
  }

  window.startFresh = function(mode){
    var label = (mode === "random") ? "Random Order" : "Original Order";
    showModal("Start fresh with " + label + "? This will clear your current progress.", function(){
      state = freshState(mode);
      save();
      if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
      updateTimerDisplay();
      var panel = document.getElementById("jumpPanel");
      panel.classList.remove("open");
      document.getElementById("jumpToggleBtn").innerHTML = "Jump to Question &#9662;";
      renderQuiz();
    });
  };

  // ---------- Init ----------
  document.getElementById("timeLimitInput").value = state.timer && state.timer.durationMs ? Math.round(state.timer.durationMs / 60000) : 15;
  if(state.timer && state.timer.running && state.timer.durationMs){
    startTimerInterval();
  } else {
    updateTimerDisplay();
  }
  renderQuiz();
})();
</script>
</body>
</html>
