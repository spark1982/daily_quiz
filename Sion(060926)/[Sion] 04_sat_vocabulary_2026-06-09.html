<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Vocabulary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}.container{max-width:800px;margin:0 auto}.date-header{text-align:center;font-size:2rem;font-weight:800;color:#185FA5;background:#fff;padding:12px 20px 4px;border-radius:12px 12px 0 0}.quiz-title{text-align:center;font-size:1.3rem;font-weight:700;color:#185FA5;background:#fff;padding:4px 20px 8px}.attempts-bar{text-align:center;font-size:.9rem;color:#555;background:#fff;padding:4px 20px 12px;border-radius:0 0 12px 12px;margin-bottom:12px}.nav-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;padding:12px;background:#fff;border-radius:12px}.dot{width:34px;height:34px;border-radius:50%;border:2px solid #185FA5;background:#e8edf4;color:#185FA5;font-weight:700;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}.dot.correct{background:#1D9E75;border-color:#1D9E75;color:#fff}.dot.wrong{background:#E24B4A;border-color:#E24B4A;color:#fff}.dot.current{border-width:3px}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px}.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;margin-bottom:10px}.qnum{font-size:.85rem;color:#888;margin-bottom:6px}.qtext{font-size:1.05rem;line-height:1.6;color:#111;margin-bottom:16px}.options{display:flex;flex-direction:column;gap:8px}.opt-btn{background:#e8edf4;color:#111111;border:2px solid transparent;border-radius:8px;padding:10px 14px;font-size:.95rem;cursor:pointer;text-align:left;transition:all .15s;line-height:1.4}.opt-btn:hover:not(:disabled){border-color:#185FA5}.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}.opt-btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#085041}.explain-box{margin-top:12px;background:#f8f0e8;border-left:4px solid #185FA5;border-radius:6px;padding:10px 14px;font-size:.9rem;color:#333;line-height:1.5;display:none}.nav-btns{display:flex;gap:10px;justify-content:space-between;margin-top:16px}.nav-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:.95rem;font-weight:600;cursor:pointer}.nav-btn:disabled{background:#ccc;cursor:not-allowed}.results-card{background:#fff;border-radius:12px;padding:20px}.results-title{font-size:1.4rem;font-weight:800;color:#185FA5;margin-bottom:16px;text-align:center}.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}.res-item{border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.85rem}.res-item.correct{background:#E1F5EE;border:1.5px solid #1D9E75;color:#085041}.res-item.wrong{background:#FCEBEB;border:1.5px solid #E24B4A;color:#501313}.res-item.skipped{background:#f5f5f5;border:1.5px solid #aaa;color:#555}.action-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.9rem;font-weight:600;cursor:pointer;margin:4px}.action-btn.secondary{background:#e8edf4;color:#185FA5}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:340px;width:90%;text-align:center}.modal-box p{margin-bottom:16px;font-size:1rem}.speakbtn{background:none;border:none;cursor:pointer;color:#185FA5;font-size:1.1rem;padding:0 6px;vertical-align:middle}@media(max-width:600px){.qtext{font-size:.97rem}.opt-btn{font-size:.9rem}}
</style>
</head>
<body>
<div class="container">
  <div class="date-header">2026-06-09</div>
  <div class="quiz-title">[Sion] SAT Vocabulary</div>
  <div class="attempts-bar" id="attBar">Total Attempts: 0</div>
  <div class="nav-dots" id="navDots"></div>
  <div id="quizArea" style="display:none;"></div>
  <div id="resultsArea" style="display:none;"></div>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box"><p>Start fresh and reset all progress?</p>
  <button class="action-btn" onclick="confirmFresh()">Yes, Start Fresh</button>
  <button class="action-btn secondary" onclick="document.getElementById('freshModal').classList.remove('show')">Cancel</button>
  </div>
</div>
<script>
(function(){
  try{
    var QUESTIONS=[{"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">aloof</span> <button class=\"speakbtn\" onclick=\"speak('aloof','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["not friendly or forthcoming; cool and distant", "deeply passionate", "eagerly sociable and warm", "openly confrontational"], "correct": 0, "explain": "<b>aloof</b>: not friendly or forthcoming; cool and distant"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">asylum</span> <button class=\"speakbtn\" onclick=\"speak('asylum','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a formal written treaty", "a type of public election", "an official trade agreement", "protection granted to a political refugee who has left their home country"], "correct": 3, "explain": "<b>asylum</b>: protection granted to a political refugee who has left their home country"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">absolution</span> <button class=\"speakbtn\" onclick=\"speak('absolution','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a binding legal contract", "a public declaration of intent", "a prolonged moral struggle", "formal release from guilt, obligation, or punishment"], "correct": 3, "explain": "<b>absolution</b>: formal release from guilt, obligation, or punishment"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">censure</span> <button class=\"speakbtn\" onclick=\"speak('censure','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["express severe disapproval of someone, typically in a formal statement", "to warmly praise in public", "to officially promote", "to carefully examine for accuracy"], "correct": 0, "explain": "<b>censure</b>: express severe disapproval of someone, typically in a formal statement"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">audacious</span> <button class=\"speakbtn\" onclick=\"speak('audacious','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["deeply conventional", "overly cautious and hesitant", "easily intimidated", "showing a willingness to take surprisingly bold risks"], "correct": 3, "explain": "<b>audacious</b>: showing a willingness to take surprisingly bold risks"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">adroit</span> <button class=\"speakbtn\" onclick=\"speak('adroit','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["clumsy and ineffective", "reluctant to act", "clever or skillful in using the hands or mind", "excessively formal and rigid"], "correct": 2, "explain": "<b>adroit</b>: clever or skillful in using the hands or mind"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">acrimony</span> <button class=\"speakbtn\" onclick=\"speak('acrimony','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a spirit of deep admiration", "warm goodwill toward others", "bitterness or ill feeling, especially in speech or manner", "enthusiastic praise"], "correct": 2, "explain": "<b>acrimony</b>: bitterness or ill feeling, especially in speech or manner"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">beguile</span> <button class=\"speakbtn\" onclick=\"speak('beguile','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["to quietly ignore", "to openly threaten", "charm or enchant someone, sometimes in a deceptive way", "to forcefully correct"], "correct": 2, "explain": "<b>beguile</b>: charm or enchant someone, sometimes in a deceptive way"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">cadence</span> <button class=\"speakbtn\" onclick=\"speak('cadence','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a sudden dramatic pause", "a technique of logical reasoning", "an abrupt change in topic", "a rhythmic flow or modulation of words or sounds"], "correct": 3, "explain": "<b>cadence</b>: a rhythmic flow or modulation of words or sounds"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">capricious</span> <button class=\"speakbtn\" onclick=\"speak('capricious','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["logically methodical", "carefully disciplined", "extremely consistent and reliable", "given to sudden and unaccountable changes of mood or behavior"], "correct": 3, "explain": "<b>capricious</b>: given to sudden and unaccountable changes of mood or behavior"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">dissent</span> <button class=\"speakbtn\" onclick=\"speak('dissent','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["the process of reaching consensus", "formal agreement with authority", "a written declaration of loyalty", "disagreement with an official or widely held view"], "correct": 3, "explain": "<b>dissent</b>: disagreement with an official or widely held view"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">emulate</span> <button class=\"speakbtn\" onclick=\"speak('emulate','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["to formally oppose", "to analyze in detail", "match or surpass a person or achievement by imitation", "to criticize harshly"], "correct": 2, "explain": "<b>emulate</b>: match or surpass a person or achievement by imitation"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">auspicious</span> <button class=\"speakbtn\" onclick=\"speak('auspicious','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["morally questionable", "completely unpredictable", "indicating failure or misfortune", "giving or suggesting a positive and successful future; favorable"], "correct": 3, "explain": "<b>auspicious</b>: giving or suggesting a positive and successful future; favorable"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">condone</span> <button class=\"speakbtn\" onclick=\"speak('condone','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["to strongly oppose and punish", "to publicly celebrate", "accept and allow behavior considered morally wrong", "to formally document"], "correct": 2, "explain": "<b>condone</b>: accept and allow behavior considered morally wrong"}, {"tag": "SAT Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">anecdote</span> <button class=\"speakbtn\" onclick=\"speak('anecdote','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a formal scientific hypothesis", "an official government report", "a short amusing or interesting story about a real incident or person", "a long historical analysis"], "correct": 2, "explain": "<b>anecdote</b>: a short amusing or interesting story about a real incident or person"}];
    var KEY='quiz_sat_vocab_15_v1',ATT_KEY='quiz_sat_vocab_attempts_v1';
    var state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};
    function loadState(){try{var r=localStorage.getItem(KEY);if(!r)return;var s=JSON.parse(r);if(typeof s.cur!=='number'||s.cur<0||s.cur>=QUESTIONS.length){localStorage.removeItem(KEY);return;}if(typeof s.answers!=='object'||Array.isArray(s.answers)){localStorage.removeItem(KEY);return;}if(typeof s.shuffles!=='object'||Array.isArray(s.shuffles)){localStorage.removeItem(KEY);return;}state=s;}catch(e){localStorage.removeItem(KEY);}}
    function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
    function getAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
    function incAtt(){localStorage.setItem(ATT_KEY,getAtt()+1);}
    function updAtt(){document.getElementById('attBar').textContent='Total Attempts: '+getAtt();}
    function getShuffle(idx){if(!state.shuffles[idx]){var arr=QUESTIONS[idx].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.shuffles[idx]=arr;saveState();}return state.shuffles[idx];}
    function getRetryShuffle(idx){if(!state.retry.shuffles[idx]){var arr=QUESTIONS[idx].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.retry.shuffles[idx]=arr;saveState();}return state.retry.shuffles[idx];}
    function aAns(){return(state.mode==='retry'&&state.retry)?state.retry.answers:state.answers;}
    function aShuf(qi){return(state.mode==='retry'&&state.retry)?getRetryShuffle(qi):getShuffle(qi);}
    function buildDots(){var nd=document.getElementById('navDots');nd.innerHTML='';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var label=state.showResults?'Results':(state.cur+1)+' / '+total;var pill=document.createElement('span');pill.style.cssText='background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;align-self:center;';pill.textContent=label;nd.appendChild(pill);var ans=aAns();indices.forEach(function(qi,pos){var d=document.createElement('button');d.className='dot';d.textContent=pos+1;var a=ans[pos];if(a!==undefined&&a!==null){d.className+=(QUESTIONS[qi].correct===a)?' correct':' wrong';}if(!state.showResults&&pos===state.cur)d.className+=' current';d.onclick=(function(p){return function(){state.cur=p;state.showResults=false;saveState();render();};})(pos);nd.appendChild(d);});}
    function render(){try{buildDots();if(state.showResults){showResults();return;}document.getElementById('resultsArea').style.display='none';var qa=document.getElementById('quizArea');qa.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var pos=state.cur;var qi=indices[pos];var q=QUESTIONS[qi];var shuffle=aShuf(state.mode==='retry'?pos:qi);var ans=aAns();var chosen=ans[pos];var answered=chosen!==undefined&&chosen!==null;var html='<div class="card">';html+='<span class="tag-badge">'+q.tag+'</span>';html+='<div class="qnum">Question '+(pos+1)+' of '+total+'</div>';html+='<div class="qtext">'+q.q+'</div>';html+='<div class="options">';shuffle.forEach(function(oi,si){var opt=q.options[oi];var cls='opt-btn';if(answered){if(oi===q.correct)cls+=' reveal';if(oi===chosen&&chosen!==q.correct)cls+=' wrong';}html+='<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="pick('+pos+','+oi+')">'+opt+'</button>';});html+='</div>';if(answered&&chosen!==q.correct){html+='<div class="explain-box" style="display:block;">'+q.explain+'</div>';}html+='<div class="nav-btns">';html+='<button class="nav-btn" onclick="go(-1)"'+(pos===0?' disabled':'')+'>Prev</button>';if(pos<total-1){html+='<button class="nav-btn" onclick="go(1)">Next</button>';}else{html+='<button class="nav-btn" onclick="finishQuiz()">See Results &rarr;</button>';}html+='</div></div>';qa.innerHTML=html;}catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red;">Render error: '+e.message+'</p></div>';}}
    function pick(pos,oi){var ans=aAns();if(ans[pos]!==undefined)return;ans[pos]=oi;saveState();render();}
    function go(dir){var total=state.mode==='retry'?state.retry.indices.length:QUESTIONS.length;state.cur=Math.max(0,Math.min(total-1,state.cur+dir));saveState();render();}
    function finishQuiz(){state.showResults=true;incAtt();updAtt();saveState();render();}
    function showResults(){document.getElementById('quizArea').style.display='none';var ra=document.getElementById('resultsArea');ra.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var c=0,w=0,s=0;indices.forEach(function(qi,pos){var a=ans[pos];if(a===undefined||a===null)s++;else if(QUESTIONS[qi].correct===a)c++;else w++;});var html='<div class="results-card"><div class="results-title">Results</div>';html+='<p style="text-align:center;margin-bottom:12px;font-size:1rem;">Correct: <b style="color:#1D9E75;">'+c+'</b> / '+indices.length+' &nbsp; Wrong: <b style="color:#E24B4A;">'+w+'</b> &nbsp; Skipped: <b style="color:#888;">'+s+'</b></p>';html+='<div class="results-grid">';indices.forEach(function(qi,pos){var a=ans[pos];var cls=(a===undefined||a===null)?'skipped':(QUESTIONS[qi].correct===a?'correct':'wrong');var lbl=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');html+='<div class="res-item '+cls+'" onclick="goToQ('+pos+')">Q'+(pos+1)+': '+lbl+'</div>';});html+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">';if(w>0)html+='<button class="action-btn" onclick="startRetry()">Retry Wrong Questions</button>';html+='<button class="action-btn secondary" onclick="copyRes()">Copy All Results</button>';html+='<button class="action-btn secondary" onclick="document.getElementById(\'freshModal\').classList.add(\'show\')">Start Fresh</button>';html+='</div></div>';ra.innerHTML=html;}
    function goToQ(pos){state.cur=pos;state.showResults=false;saveState();render();}
    function startRetry(){var wrong=[];QUESTIONS.forEach(function(q,qi){var a=state.answers[qi];if(a!==undefined&&a!==null&&q.correct!==a)wrong.push(qi);});if(!wrong.length)return;state.mode='retry';state.retry={indices:wrong,answers:{},shuffles:{}};state.cur=0;state.showResults=false;saveState();render();}
    function copyRes(){var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var lines=['[Sion] SAT Vocabulary — 2026-06-09'];indices.forEach(function(qi,pos){var a=ans[pos];var st=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');lines.push('Q'+(pos+1)+': '+st);});var text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
    function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
    function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};document.getElementById('freshModal').classList.remove('show');saveState();render();}
    function speak(text,lang){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}
    window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;window.speak=speak;
    loadState();updAtt();render();
  }catch(e){document.body.innerHTML+='<div style="color:red;padding:20px;">Fatal error: '+e.message+'</div>';}
})();
</script>
</body></html>
