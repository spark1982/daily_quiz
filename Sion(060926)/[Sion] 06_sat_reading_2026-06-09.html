em;\">4&nbsp;</span>The presence of trees and open areas also mitigates the urban heat island effect, reducing cooling costs for nearby residents.<br><span style=\"color:#999;font-size:.8rem;\">5&nbsp;</span>Critics may argue that green spaces represent underutilized land in crowded cities, but this view undervalues the social capital these areas generate.<br><span style=\"color:#999;font-size:.8rem;\">6&nbsp;</span>When families gather in shared outdoor spaces, they form the informal networks that sustain neighborhood resilience during difficult times.<br><span style=\"color:#999;font-size:.8rem;\">7&nbsp;</span>A city's parkland, therefore, is not mere decoration but infrastructure as vital as any road or utility.<br></div><div class=\"passage-box\"><b>Passage 2</b><br><span style=\"color:#999;font-size:.8rem;\">1&nbsp;</span>While the emotional appeal of urban greenery is undeniable, planners focused on sustainable city growth recognize that mixed-use development — combining residential, commercial, and recreational spaces — creates far more dynamic communities.<br><span style=\"color:#999;font-size:.8rem;\">2&nbsp;</span>By integrating shops, offices, and homes within walkable distances, cities reduce automobile dependence and foster spontaneous social interaction on sidewalks and plazas.<br><span style=\"color:#999;font-size:.8rem;\">3&nbsp;</span>The economic vitality generated by active street life funds public services that benefit all residents, including those in lower-income brackets.<br><span style=\"color:#999;font-size:.8rem;\">4&nbsp;</span>Moreover, when buildings incorporate green features such as rooftop gardens and living walls, environmental goals need not conflict with density objectives.<br><span style=\"color:#999;font-size:.8rem;\">5&nbsp;</span>The debate should not be framed as nature versus development, but rather as how thoughtful design can harmonize both imperatives within a coherent urban fabric.<br></div>Which of the following best de x\"><b>Passage 2</b><br><span style=\"color:#999;font-size:.8rem;\">1&nbsp;</span>While the emotional appeal of urban greenery is undeniable, planners focused on sustainable city growth recognize that mixed-use development — combining residential, commercial, and recreational spaces — creates far more dynamic communities.<br><span style=\"color:#999;font-size:.8rem;\">2&nbsp;</span>By integrating shops, offices, and homes within walkable distances, cities reduce automobile dependence and foster spontaneous social interaction on sidewalks and plazas.<br><span style=\"color:#999;font-size:.8rem;\">3&nbsp;</span>The economic vitality generated by active street life funds public services that benefit all residents, including those in lower-income brackets.<br><span style=\"color:#999;font-size:.8rem;\">4&nbsp;</span>Moreover, when buildings incorporate green features such as rooftop gardens and living walls, environmental goals need not conflict with density objectives.<br><span style=\"color:#999;font-size:.8rem;\">5&nbsp;</span>The debate should not be framed as nature versus development, but rather as how thoughtful design can harmonize both imperatives within a coherent urban fabric.<br></div>The author of Passage 1 would most likely describe the view expressed in Passage 2, lines 1-3 (\"mixed-use development...communities\"), with", "options": ["reluctant acknowledgment", "complete dismissal", "enthusiastic endorsement", "deep confusion"], "correct": 0, "explain": "The author of Passage 1 acknowledges that critics see green space as underutilized (line 5), indicating awareness of the opposing view, but ultimately disagrees. This suggests reluctant acknowledgment rather than endorsement or dismissal."}, {"tag": "Best Evidence", "q": "<div class=\"passage-box\"><b>Passage 1</b><br><span style=\"color:#999;font-size:.8rem;\">1&nbsp;</span>Urban planners have long debated the ideal composition of city neighborhoods.<br><span style=\"color:#999;font-size:.8rem;\">2&nbsp m;\">3&nbsp;</span>Research conducted over the past two decades consistently shows that residents near parks report lower stress levels and stronger neighborly bonds.<br><span style=\"color:#999;font-size:.8rem;\">4&nbsp;</span>The presence of trees and open areas also mitigates the urban heat island effect, reducing cooling costs for nearby residents.<br><span style=\"color:#999;font-size:.8rem;\">5&nbsp;</span>Critics may argue that green spaces represent underutilized land in crowded cities, but this view undervalues the social capital these areas generate.<br><span style=\"color:#999;font-size:.8rem;\">6&nbsp;</span>When families gather in shared outdoor spaces, they form the informal networks that sustain neighborhood resilience during difficult times.<br><span style=\"color:#999;font-size:.8rem;\">7&nbsp;</span>A city's parkland, therefore, is not mere decoration but infrastructure as vital as any road or utility.<br></div><div class=\"passage-box\"><b>Passage 2</b><br><span style=\"color:#999;font-size:.8rem;\">1&nbsp;</span>While the emotional appeal of urban greenery is undeniable, planners focused on sustainable city growth recognize that mixed-use development — combining residential, commercial, and recreational spaces — creates far more dynamic communities.<br><span style=\"color:#999;font-size:.8rem;\">2&nbsp;</span>By integrating shops, offices, and homes within walkable distances, cities reduce automobile dependence and foster spontaneous social interaction on sidewalks and plazas.<br><span style=\"color:#999;font-size:.8rem;\">3&nbsp;</span>The economic vitality generated by active street life funds public services that benefit all residents, including those in lower-income brackets.<br><span style=\"color:#999;font-size:.8rem;\">4&nbsp;</span>Moreover, when buildings incorporate green features such as rooftop gardens and living walls, environmental goals need not conflict with density objectives.<br><span style=\"color:#999;font-size:.8rem;\">5&nbsp tives within a coherent urban fabric.<br></div>The author of Passage 2 mentions \"rooftop gardens and living walls\" (line 4) in order to", "options": ["suggest that environmental goals and urban density are not mutually exclusive.", "argue that green spaces are always less effective than built structures.", "criticize the limitations of traditional park planning.", "demonstrate that all green building features are economically impractical."], "correct": 0, "explain": "The author uses these examples to show that density-focused development can still incorporate green elements, so \"environmental goals need not conflict with density objectives.\""}, {"tag": "Primary Concern", "q": "<div class=\"passage-box\"><b>Passage 1</b><br><span style=\"color:#999;font-size:.8rem;\">1&nbsp;</span>Urban planners have long debated the ideal composition of city neighborhoods.<br><span style=\"color:#999;font-size:.8rem;\">2&nbsp;</span>Advocates for green space argue that parks and natural environments serve as essential anchors for community life.<br><span style=\"color:#999;font-size:.8rem;\">3&nbsp;</span>Research conducted over the past two decades consistently shows that residents near parks report lower stress levels and stronger neighborly bonds.<br><span style=\"color:#999;font-size:.8rem;\">4&nbsp;</span>The presence of trees and open areas also mitigates the urban heat island effect, reducing cooling costs for nearby residents.<br><span style=\"color:#999;font-size:.8rem;\">5&nbsp;</span>Critics may argue that green spaces represent underutilized land in crowded cities, but this view undervalues the social capital these areas generate.<br><span style=\"color:#999;font-size:.8rem;\">6&nbsp;</span>When families gather in shared outdoor spaces, they form the informal networks that sustain neighborhood resilience during difficult times.<br><span style=\"color:#999;font-size:.8rem;\">7&nbsp;</span>A city's parkland, therefore, is not mere decoration but infrastructure as vital as any road or utility.<br></div><div class=\"passage-box\"><b>Passage 2</b><br><span style=\"color:#999;font-size:.8rem;\">1&nbsp;</span>While the emotional appeal of urban greenery is undeniable, planners focused on sustainable city growth recognize that mixed-use development — combining residential, commercial, and recreational spaces — creates far more dynamic communities.<br><span style=\"color:#999;font-size:.8rem;\">2&nbsp;</span>By integrating shops, offices, and homes within walkable distances, cities reduce automobile dependence and foster spontaneous social interaction on sidewalks and plazas.<br><span style=\"color:#999;font-size:.8rem;\">3&nbsp;</span>The economic vitality generated by active street life funds public services that benefit all residents, including those in lower-income brackets.<br><span style=\"color:#999;font-size:.8rem;\">4&nbsp;</span>Moreover, when buildings incorporate green features such as rooftop gardens and living walls, environmental goals need not conflict with density objectives.<br><span style=\"color:#999;font-size:.8rem;\">5&nbsp;</span>The debate should not be framed as nature versus development, but rather as how thoughtful design can harmonize both imperatives within a coherent urban fabric.<br></div>Unlike the author of Passage 2, the author of Passage 1 is primarily concerned with analyzing", "options": ["the social and psychological role of natural spaces within urban communities.", "the economic benefits of walkable, mixed-use neighborhoods.", "the architectural features of environmentally sustainable buildings.", "the relationship between housing density and transportation infrastructure."], "correct": 0, "explain": "Passage 1 focuses on community bonds, stress reduction, and social capital from parks. Passage 2 focuses on economic vitality and design integration. The primary distinction is social/psychological vs. economic/design."}];

    function incAtt(){localStorage.setItem(ATT_KEY,getAtt()+1);}
    function updAtt(){document.getElementById('attBar').textContent='Total Attempts: '+getAtt();}
    function getShuffle(qi){if(!state.shuffles[qi]){var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.shuffles[qi]=arr;saveState();}return state.shuffles[qi];}
    function getRetryShuffle(pos){if(!state.retry.shuffles[pos]){var qi=state.retry.indices[pos];var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.retry.shuffles[pos]=arr;saveState();}return state.retry.shuffles[pos];}
    function aAns(){return(state.mode==='retry'&&state.retry)?state.retry.answers:state.answers;}
    function aShuf(pos,qi){return(state.mode==='retry'&&state.retry)?getRetryShuffle(pos):getShuffle(qi);}
    function buildDots(){var nd=document.getElementById('navDots');nd.innerHTML='';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var label=state.showResults?'Results':(state.cur+1)+' / '+total;var pill=document.createElement('span');pill.style.cssText='background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;align-self:center;';pill.textContent=label;nd.appendChild(pill);var ans=aAns();indices.forEach(function(qi,pos){var d=document.createElement('button');d.className='dot';d.textContent=pos+1;var a=ans[pos];if(a!==undefined&&a!==null){d.className+=(QUESTIONS[qi].correct===a)?' correct':' wrong';}if(!state.showResults&&pos===state.cur)d.className+=' current';d.onclick=(function(p){return function(){state.cur=p;state.showResults=false;saveState();render();};})(pos);nd.appendChild(d);});}
    function render(){try{buildDots();if(state.showResults){showResults();return;}document.getElementById('resultsArea').style.display='none';var qa=document.getElementById('quizArea');qa.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var pos=state.cur;var qi=indices[pos];var q=QUESTIONS[qi];var shuffle=aShuf(pos,qi);var ans=aAns();var chosen=ans[pos];var answered=chosen!==undefined&&chosen!==null;var html='<div class="card">';html+='<span class="tag-badge">'+q.tag+'</span>';html+='<div class="qnum">Question '+(pos+1)+' of '+total+'</div>';html+='<div class="qtext">'+q.q+'</div>';html+='<div class="options">';shuffle.forEach(function(oi){var opt=q.options[oi];var cls='opt-btn';if(answered){if(oi===q.correct)cls+=' reveal';if(oi===chosen&&chosen!==q.correct)cls+=' wrong';}html+='<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="pick('+pos+','+oi+')">'+opt+'</button>';});html+='</div>';if(answered&&chosen!==q.correct){html+='<div class="explain-box" style="display:block;">'+q.explain+'</div>';}html+='<div class="nav-btns">';html+='<button class="nav-btn" onclick="go(-1)"'+(pos===0?' disabled':'')+'>Prev</button>';if(pos<total-1){html+='<button class="nav-btn" onclick="go(1)">Next</button>';}else{html+='<button class="nav-btn" onclick="finishQuiz()">See Results &rarr;</button>';}html+='</div></div>';qa.innerHTML=html;}catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red;">Render error: '+e.message+'</p></div>';}}
    function pick(pos,oi){var ans=aAns();if(ans[pos]!==undefined)return;ans[pos]=oi;saveState();render();}
    function go(dir){var total=state.mode==='retry'?state.retry.indices.length:QUESTIONS.length;state.cur=Math.max(0,Math.min(total-1,state.cur+dir));saveState();render();}
    function finishQuiz(){state.showResults=true;incAtt();updAtt();saveState();render();}
    function showResults(){document.getElementById('quizArea').style.display='none';var ra=document.getElementById('resultsArea');ra.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var c=0,w=0,s=0;indices.forEach(function(qi,pos){var a=ans[pos];if(a===undefined||a===null)s++;else if(QUESTIONS[qi].correct===a)c++;else w++;});var html='<div class="results-card"><div class="results-title">Results</div>';html+='<p style="text-align:center;margin-bottom:12px;font-size:1rem;">Correct: <b style="color:#1D9E75;">'+c+'</b> / '+indices.length+' &nbsp; Wrong: <b style="color:#E24B4A;">'+w+'</b> &nbsp; Skipped: <b style="color:#888;">'+s+'</b></p>';html+='<div class="results-grid">';indices.forEach(function(qi,pos){var a=ans[pos];var cls=(a===undefined||a===null)?'skipped':(QUESTIONS[qi].correct===a?'correct':'wrong');var lbl=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');html+='<div class="res-item '+cls+'" onclick="goToQ('+pos+')">Q'+(pos+1)+': '+lbl+'</div>';});html+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">';if(w>0)html+='<button class="action-btn" onclick="startRetry()">Retry Wrong Questions</button>';html+='<button class="action-btn secondary" onclick="copyRes()">Copy All Results</button>';html+='<button class="action-btn secondary" onclick="document.getElementById(\'freshModal\').classList.add(\'show\')">Start Fresh</button>';html+='</div></div>';ra.innerHTML=html;}
    function goToQ(pos){state.cur=pos;state.showResults=false;saveState();render();}
    function startRetry(){var wrong=[];state.answers&&Object.keys(state.answers).forEach(function(p){var pos=parseInt(p);var indices=QUESTIONS.map(function(_,i){return i;});var qi=indices[pos];var a=state.answers[pos];if(a!==undefined&&a!==null&&QUESTIONS[qi].correct!==a)wrong.push(qi);});if(!wrong.length)return;state.mode='retry';state.retry={indices:wrong,answers:{},shuffles:{}};state.cur=0;state.showResults=false;saveState();render();}
    function copyRes(){var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var lines=['[Sion] SAT reading — 2026-06-09'];indices.forEach(function(qi,pos){var a=ans[pos];var st=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');lines.push('Q'+(pos+1)+': '+st);});var text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
    function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
    function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};document.getElementById('freshModal').classList.remove('show');saveState();render();}
    function speak(text,lang){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}

    window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;window.speak=speak;
    loadState();updAtt();render();
  }catch(e){document.body.innerHTML+='<div style="color:red;padding:20px;">Fatal error: '+e.message+'</div>';}
})();
</script>
</body></html>
