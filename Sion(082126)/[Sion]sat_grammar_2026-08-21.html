<!DOCTYPE html>
<html lang="en">
<head>

<title>[Sion] SAT Grammar</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    max-width: 900px;

    background: #f4f6f9;

  h1 {

  }

  }

    font-size: 14px;

  }

    padding: 5px 6px;
    border: 1px solid #d7dde6;
    border-radius: 6px;

    background: #14213d;
    color: #ffffff;
    border: none;

  .navwrap {
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;

    font-size: 14px;
    font-weight: 600;

    width: 26px;

    cursor: pointer;

  .dot.wrong { background: #E24B4A; color: #ffffff; }
  .card {
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 20px;
  }
  .qcount {
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .context-box {

    border-left: 4px solid #185FA5;

    padding: 14px 16px;

    line-height: 1.55;
    color: #1f2530;
    margin-bottom: 16px;
  }
  .qtext {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
    color: #14213d;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: #ffffff;
    border: 1.5px solid #d7dde6;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14.5px;
    cursor: pointer;
    color: #1f2530;
  }
  .opt:hover { border-color: #185FA5; }
  .opt.selected { border-color: #185FA5; background: #eaf1fb; }
  .opt.correctPick { border-color: #1D9E75; background: #e5f7f0; }
  .opt.wrongPick { border-color: #E24B4A; background: #fbe9e9; }

  .explanation {
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #f7f8fa;
    border: 1px solid #d7dde6;
    font-size: 14px;
    line-height: 1.5;
    color: #333c48;
    display: none;
  }
  .explanation.show { display: block; }
  .navbtns {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;

  }
  .navbtns button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
    font-weight: 600;

  #nextBtn { background: #185FA5; color: #ffffff; }
  #nextBtn:disabled { background: #b9c6d6; cursor: not-allowed; }
  .resultsBtns {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }
  .resultsBtns button {

    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #ffffff;
  }
  #copyBtn { background: #14213d; }
  #retryBtn { background: #1D9E75; }
  #saveWrongBtn { background: #7b61ff; }
  #freshOrigBtn { background: #34495E; }
  #freshRandBtn { background: #2C3E50; }
  .scoreLine {
    font-size: 20px;
    font-weight: 700;
    color: #14213d;
    margin-bottom: 14px;
  }
  .reviewItem {
    border-bottom: 1px solid #e5e9ef;
    padding: 12px 0;
    font-size: 14px;
  }
  .reviewItem:last-child { border-bottom: none; }
  .reviewItem .rq { font-weight: 600; margin-bottom: 4px; color: #14213d; }

  .rcorrect { color: #1D9E75; font-weight: 700; }
  .rwrong { color: #E24B4A; font-weight: 700; }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;

    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-box {
    background: #ffffff;
    border-radius: 10px;
    padding: 22px;
    max-width: 360px;
    width: 90%;
    text-align: center;
  }
  .modal-box p { font-size: 15px; color: #14213d; margin-bottom: 18px; }
  .modal-box button {
    padding: 9px 16px;
    border-radius: 7px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin: 0 6px;
  }
  #modalYesBtn { background: #185FA5; color: #ffffff; }
  #modalNoBtn { background: #eef2f7; color: #14213d; }
</style>
</head>
<body>
<div class="app">
  <h1>[Sion] SAT Grammar</h1>
  <p class="instructions">Choose the best way to revise or complete each passage.</p>

  <div class="topbar">
    <div class="attempts">Total Attempts: <span id="attemptsCount">0</span></div>
    <div class="timer-widget">
      <label for="timeLimitInput">Set Time Limit (min):</label>
      <input type="number" id="timeLimitInput" min="1" max="180" value="20">
      <button onclick="startTimer()">Start</button>
      <span id="timerDisplay">20:00</span>
    </div>
  </div>

  <div class="navwrap" id="navwrap">
    <div class="navline"><span id="answeredCount">0</span>/<span id="totalCount">20</span> answered</div>
    <div class="progressbar"><div class="progressfill" id="progressFill"></div></div>
    <button id="toggleDotsBtn" onclick="toggleDots()">Jump to Question</button>
    <div id="dotsPanel" class="dots-panel hidden"></div>
  </div>

  <div id="quizArea"></div>
  <div id="resultsArea" class="hidden"></div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <p id="modalText">Are you sure?</p>
    <button id="modalYesBtn" onclick="modalConfirmYes()">Yes, Start Fresh</button>
    <button id="modalNoBtn" onclick="modalConfirmNo()">Cancel</button>
  </div>
</div>

<script>
var QUESTIONS = [
  {
    q: "Which choice most logically and stylistically completes the text?",
    context: "Marie Curie's early research into radioactivity relied on instruments she built herself, since no commercial equipment existed for measuring the phenomenon she was studying. Her methods were later adopted, with only minor modifications, by physics laboratories across Europe. _____ the techniques Curie devised in a converted shed became the foundation of an entire scientific instrument industry.",
    opts: ["Similarly,", "For example,", "In short,", "On the other hand,"],
    ci: 2,
    exp: "\"In short,\" correctly signals that the sentence is a concise restatement of the point already established, that Curie's self-built methods became widely influential. \"Similarly,\" is wrong because no parallel comparison is being introduced. \"On the other hand,\" is wrong because there is no contrast between the ideas; the final sentence reinforces, not opposes, the previous point."
  },
  {
    q: "Which choice most effectively completes the sentence, given the contrast being drawn with the board members' view?",
    context: "The committee's proposal would cut funding for the library's weekend programs while increasing funding for digital archiving. Several board members argued that weekend programs serve populations, such as working families, who cannot easily visit during weekday hours. The committee, _____ maintained that digital archiving would ultimately reach a larger number of patrons than any in-person program could.",
    opts: ["for its part,", "in other words,", "as a result,", "likewise,"],
    ci: 0,
    exp: "\"for its part,\" correctly marks the committee's position as one side of a two-sided disagreement already set up by the board members' objection. \"in other words,\" is wrong because the committee's statement is not simply a restatement of what the board members said, it is a competing claim. \"likewise,\" is wrong because the committee is disagreeing with the board members, not agreeing with them."
  },
  {
    q: "Which choice most logically introduces the sentence, based on the reasoning developed in the passage?",
    context: "Coral reefs occupy less than one percent of the ocean floor. They support roughly a quarter of all known marine species, from tiny larval fish to apex predators. _____ reefs are frequently described by marine biologists as the rainforests of the sea.",
    opts: ["Because reefs are shrinking,", "Although reefs are diverse,", "Regardless of their size,", "Given this disproportionate importance,"],
    ci: 3,
    exp: "\"Given this disproportionate importance,\" correctly links the nickname to the specific contrast between a reef's tiny footprint and its outsized biodiversity described in the previous sentences. \"Although reefs are diverse,\" is wrong because it treats the reefs' diversity as a concession working against the nickname, when diversity is actually the reason for it. \"Because reefs are shrinking,\" is wrong because reef decline is never mentioned in the passage."
  },
  {
    q: "Which choice completes the sentence with the verb form that agrees with its subject and fits the intended meaning?",
    context: "A collection of rare manuscripts, donated by an anonymous benefactor along with several early printed books, _____ the centerpiece of the university's special collections library.",
    opts: ["form", "forms", "is forming", "has formed"],
    ci: 1,
    exp: "\"forms\" agrees with the singular subject \"A collection\" and uses the simple present tense appropriate for describing the collection's ongoing role as the centerpiece. \"form\" is wrong because it is a plural verb, incorrectly agreeing with the nearby plural noun \"books\" rather than with the singular subject. \"has formed\" is wrong because the present perfect incorrectly frames the collection's role as a completed action rather than its current, ongoing status."
  },
  {
    q: "Which choice completes the sentence with the verb form that correctly agrees with the subject and matches the sentence's time frame?",
    context: "Neither the museum's curators nor its director _____ aware, at the time the painting was acquired, that its provenance records had been altered.",
    opts: ["were", "have been", "was", "has been"],
    ci: 2,
    exp: "\"was\" is correct because with \"neither...nor,\" the verb must agree with the nearer subject, the singular \"director,\" and the past tense matches the time frame set by \"at the time the painting was acquired.\" \"were\" is wrong because it wrongly agrees with the more distant plural subject \"curators\" instead of the nearer singular \"director.\" \"has been\" is wrong because the present perfect tense does not match the simple past time frame established in the sentence."
  },
  {
    q: "Which choice completes the sentence while maintaining the parallel structure of the list?",
    context: "The internship program was designed to help students build professional networks, gain hands-on experience, and _____.",
    opts: ["to develop a portfolio of published work", "developing a portfolio of published work", "development of a portfolio of published work", "develop a portfolio of published work"],
    ci: 3,
    exp: "\"develop a portfolio of published work\" matches the bare-infinitive form of \"build\" and \"gain,\" all three sharing the single \"to\" that begins the list. \"to develop a portfolio of published work\" is wrong because repeating \"to\" breaks the parallel structure already established by \"build\" and \"gain.\" \"developing a portfolio of published work\" is wrong because a gerund does not match the infinitive verb forms used elsewhere in the list."
  },
  {
    q: "Which choice completes the sentence with a structure parallel to the other items in the list?",
    context: "Effective leaders listen carefully, communicate clearly, and _____.",
    opts: ["know when to delegate authority to others", "they know when to delegate authority to others", "knowing when to delegate authority to others", "the knowledge of when to delegate authority to others"],
    ci: 0,
    exp: "\"know when to delegate authority to others\" matches the bare verb forms \"listen\" and \"communicate\" earlier in the list. \"they know when to delegate authority to others\" is wrong because adding the subject \"they\" breaks the parallel list structure. \"the knowledge of when to delegate authority to others\" is wrong because a noun phrase cannot complete a list of parallel verbs."
  },
  {
    q: "Which choice most effectively corrects the punctuation joining the two clauses?",
    context: "The lab's centrifuge had been malfunctioning _____ the results were simply unreliable, so no one flagged the error until the semester's data had already been published.",
    opts: ["for weeks, technicians assumed", "for weeks; technicians assumed", "for weeks technicians assumed", "for weeks, however technicians assumed"],
    ci: 1,
    exp: "A semicolon correctly joins the two independent clauses \"The lab's centrifuge had been malfunctioning for weeks\" and \"technicians assumed the results were simply unreliable\" without a coordinating conjunction. \"for weeks, technicians assumed\" is wrong because a comma alone creates a comma splice between two independent clauses. \"for weeks, however technicians assumed\" is wrong because \"however\" is a conjunctive adverb, not a coordinating conjunction, so a comma before it still produces a comma splice."
  },
  {
    q: "Which choice most effectively completes the sentence?",
    context: "By the third week of the excavation, the team had reached a significant depth _____ a layer of ash consistent with a fire that had swept through the settlement centuries earlier.",
    opts: [": revealing", "; revealing", ", and revealing", ", revealing"],
    ci: 3,
    exp: "A comma correctly sets off the participial phrase \"revealing a layer of ash...\" which describes the action of reaching a certain depth rather than forming a second independent clause. \": revealing\" is wrong because a colon must be followed by an independent clause or a list, and \"revealing...\" is neither. \"; revealing\" is wrong for the same reason, a semicolon requires an independent clause on each side."
  },
  {
    q: "Which choice provides the most appropriate punctuation for the clause describing when the cables were installed?",
    context: "The bridge's original support _____ badly enough that engineers ordered a full inspection of the structure.",
    opts: ["cables which were installed in 1932 had begun to corrode", "cables, which were installed in 1932 had begun to corrode", "cables, which were installed in 1932, had begun to corrode", "cables; which were installed in 1932; had begun to corrode"],
    ci: 2,
    exp: "\"cables, which were installed in 1932, had begun to corrode\" is correct because the clause \"which were installed in 1932\" is nonrestrictive, it simply adds extra information about the bridge's one set of original cables, so it must be set off with commas on both sides. \"cables which were installed in 1932 had begun to corrode\" is wrong because omitting both commas incorrectly treats the clause as essential, as if there were multiple sets of original cables to distinguish between. \"cables; which were installed in 1932; had begun to corrode\" is wrong because semicolons are not used to set off a nonrestrictive clause like this one."
  },
  {
    q: "Which choice most effectively punctuates the list of three items, each of which already contains an internal comma?",
    context: "The exhibit featured works from three periods: Monet's early impressionist canvases, painted in the _____ abstract expressionist pieces from the late 1940s.",
    opts: ["1870s, Picasso's cubist experiments from the 1910s, and Pollock's", "1870s; Picasso's cubist experiments from the 1910s; and Pollock's", "1870s: Picasso's cubist experiments from the 1910s: and Pollock's", "1870s, Picasso's cubist experiments from the 1910s; and Pollock's"],
    ci: 1,
    exp: "Using semicolons to separate the 1870s item, the 1910s item, and the 1940s item is correct because each item in the list already contains an internal comma, so semicolons are needed to keep the three items clearly distinct. \"1870s, Picasso's cubist experiments from the 1910s, and Pollock's\" is wrong because using only commas makes it unclear where each list item begins and ends. \"1870s: Picasso's cubist experiments from the 1910s: and Pollock's\" is wrong because colons are not used repeatedly as list separators."
  },
  {
    q: "Which choice most clearly resolves the pronoun ambiguity while keeping the sentence's intended meaning that the editor made the suggestion?",
    context: "When Elena handed the manuscript to her editor, she suggested that the final chapter needed substantial revision.",
    opts: [
      "When Elena handed the manuscript to her editor, the editor suggested that the final chapter needed substantial revision.",
      "When Elena handed the manuscript to her editor, she suggested that the final chapter needed substantial revision.",
      "When Elena handed the manuscript to her editor, they suggested that the final chapter needed substantial revision.",
      "Handing the manuscript to her editor, Elena suggested that the final chapter needed substantial revision."
    ],
    ci: 0,
    exp: "Replacing the ambiguous pronoun with \"the editor\" makes clear that the editor, not Elena, suggested the revision. \"When Elena handed the manuscript to her editor, she suggested that the final chapter needed substantial revision.\" is wrong because \"she\" could logically refer to either Elena or the editor. \"Handing the manuscript to her editor, Elena suggested that the final chapter needed substantial revision.\" is wrong because it changes the meaning entirely, now stating that Elena made the suggestion."
  },
  {
    q: "Which choice most clearly resolves the pronoun ambiguity so that it is clear the finance committee's proposal, not the marketing team's, was rejected?",
    context: "The board reviewed the finance committee's proposal and the marketing team's proposal _____.",
    opts: ["before rejecting it for being financially unrealistic", "before rejecting them for being financially unrealistic", "before rejecting the finance committee's proposal for being financially unrealistic", "before rejecting the first one for being financially unrealistic"],
    ci: 2,
    exp: "Naming \"the finance committee's proposal\" directly removes the ambiguity of a pronoun that could otherwise point to either proposal mentioned earlier. \"before rejecting it for being financially unrealistic\" is wrong because \"it\" could refer to either the finance committee's proposal or the marketing team's proposal. \"before rejecting them for being financially unrealistic\" is wrong because \"them\" incorrectly suggests both proposals were rejected."
  },
  {
    q: "Which choice corrects the dangling modifier at the beginning of the sentence?",
    context: "Rushing to catch the last train of the night, the station's doors closed just as Marcus reached the platform.",
    opts: [
      "Rushing to catch the last train of the night, the station's doors closed just as Marcus reached the platform.",
      "Rushing to catch the last train of the night, the platform was reached by Marcus just as the station's doors closed.",
      "As Marcus was rushing to catch the last train of the night, the station's doors, closing, met him at the platform.",
      "Rushing to catch the last train of the night, Marcus reached the platform just as the station's doors closed."
    ],
    ci: 3,
    exp: "\"Rushing to catch the last train of the night, Marcus reached the platform just as the station's doors closed.\" correctly places \"Marcus\" right after the introductory phrase, since he is the one doing the rushing. \"Rushing to catch the last train of the night, the station's doors closed just as Marcus reached the platform.\" is wrong because it illogically implies that the station's doors were rushing to catch a train. \"As Marcus was rushing to catch the last train of the night, the station's doors, closing, met him at the platform.\" is wrong because it produces an awkward and confusing image of doors meeting a person."
  },
  {
    q: "Which choice most effectively corrects the modifier that currently seems to describe the historians rather than the tablet?",
    context: "Written entirely in a dead language that took decades to decipher, historians consider the tablet one of the most significant archaeological finds of the century.",
    opts: [
      "Written entirely in a dead language that took decades to decipher, historians consider the tablet one of the most significant archaeological finds of the century.",
      "Written entirely in a dead language that took decades to decipher, the tablet is considered by historians one of the most significant archaeological finds of the century.",
      "Historians consider the tablet, written entirely in a dead language that took decades to decipher, one of the most significant archaeological finds of the century.",
      "Historians, written entirely in a dead language that took decades to decipher, consider the tablet one of the most significant archaeological finds of the century."
    ],
    ci: 1,
    exp: "\"Written entirely in a dead language that took decades to decipher, the tablet is considered by historians one of the most significant archaeological finds of the century.\" correctly places \"the tablet\" immediately after the opening phrase, since the tablet, not the historians, was written in the dead language. \"Written entirely in a dead language that took decades to decipher, historians consider the tablet one of the most significant archaeological finds of the century.\" is wrong because it illogically implies the historians were written in a dead language. \"Historians, written entirely in a dead language that took decades to decipher, consider the tablet one of the most significant archaeological finds of the century.\" is wrong for the same reason, it attaches the modifier to \"Historians\" instead of \"the tablet.\""
  },
  {
    q: "Which choice completes the sentence with the correct possessive form?",
    context: "After months of negotiation, the three _____ merger created what analysts called the largest media conglomerate in the region's history.",
    opts: ["companies'", "company's", "companies", "companie's"],
    ci: 0,
    exp: "\"companies'\" is the correct plural possessive form, matching \"three companies\" that jointly own the merger. \"company's\" is wrong because it is singular possessive and contradicts \"three companies.\" \"companies\" is wrong because it has no possessive marking at all, even though the sentence requires showing that the merger belongs to the companies."
  },
  {
    q: "Which choice completes the sentence with the pronoun form that is both correctly possessive and consistent in number with its antecedent?",
    context: "The research team announced its findings only after _____ conclusions had been independently verified by two outside laboratories.",
    opts: ["it's", "their", "its", "his or her"],
    ci: 2,
    exp: "\"its\" correctly treats \"the research team\" as a single collective unit, matching the singular possessive already used in \"its findings\" earlier in the sentence. \"their\" is wrong because it switches to a plural pronoun, creating an inconsistency with the singular treatment established by \"its findings.\" \"it's\" is wrong because it is a contraction of \"it is,\" not a possessive form."
  },
  {
    q: "Which choice most effectively improves the conciseness of the opening phrase without changing its meaning?",
    context: "_____ the bridge's support beams had corroded significantly, engineers closed the road for repairs.",
    opts: ["Due to the fact that", "In light of the fact that", "Owing to the circumstance that", "Because"],
    ci: 3,
    exp: "\"Because\" concisely and correctly expresses the causal relationship without the wordiness of the original phrase. \"Due to the fact that\" is wrong because it is unnecessarily wordy where a single word conveys the same meaning. \"Owing to the circumstance that\" is wrong for the same reason, it is an awkward, overly formal way of saying \"because.\""
  },
  {
    q: "Which choice most effectively eliminates redundancy while keeping the sentence's meaning clear?",
    context: "The new policy will _____, streamlining the permit process for small business owners.",
    opts: ["eliminate unnecessary paperwork", "completely eliminate all unnecessary paperwork that serves no useful purpose", "eliminate all the unnecessary and useless paperwork", "completely and totally eliminate paperwork that is unnecessary"],
    ci: 0,
    exp: "\"eliminate unnecessary paperwork\" removes the redundancy of the original phrase, since \"eliminate\" already implies complete removal and \"unnecessary\" already conveys that the paperwork serves no useful purpose. \"completely eliminate all unnecessary paperwork that serves no useful purpose\" is wrong because it repeats the same idea three times. \"completely and totally eliminate paperwork that is unnecessary\" is wrong because \"completely and totally\" needlessly pairs two synonyms."
  },
  {
    q: "Which choice completes the sentence with the verb form required by the counterfactual conditional?",
    context: "If the museum's director _____ aware of the forgery sooner, the painting would never have been included in the exhibition.",
    opts: ["was", "had been", "were", "would have been"],
    ci: 1,
    exp: "\"had been\" is the correct past-perfect form for the if-clause of a counterfactual conditional whose result clause, \"would never have been included,\" is already in the past. \"were\" is wrong because it fits a present-tense hypothetical like \"If I were you,\" not a past conditional paired with \"would have been included.\" \"would have been\" is wrong because that construction belongs in the result clause, not in the if-clause itself."
  }
];

var STORAGE_STATE = "quiz_sionsatgrammar_20_20260820_v1";
var STORAGE_ATT = "quiz_sionsatgrammar_20260820_att_v1";
var STORAGE_ORDER = "quiz_sionsatgrammar_order_20260820_v1";

var state = null;
var timerInterval = null;
var pendingModalAction = null;

function defaultOrder() {
  var arr = [];
  for (var i = 0; i < QUESTIONS.length; i++) arr.push(i);
  return arr;
}

function defaultState() {
  return {
    order: defaultOrder(),
    answers: new Array(QUESTIONS.length).fill(null),
    current: 0,
    mode: "normal",
    retryQueue: [],
    retryAnswers: {},
    retryCurrent: 0,
    timer: { limitMin: 20, startTs: null, running: false },
    resultsShown: false
  };
}

function loadOrder() {
  try {
    var raw = localStorage.getItem(STORAGE_ORDER);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === QUESTIONS.length) return arr;
    }
  } catch (e) {}
  return defaultOrder();
}

function saveOrder(order) {
  try { localStorage.setItem(STORAGE_ORDER, JSON.stringify(order)); } catch (e) {}
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_STATE);
    if (raw) {
      var parsed = JSON.parse(raw);
      var d = defaultState();
      for (var k in d) { if (parsed[k] === undefined) parsed[k] = d[k]; }
      if (!Array.isArray(parsed.answers) || parsed.answers.length !== QUESTIONS.length) {
        parsed.answers = new Array(QUESTIONS.length).fill(null);
      }
      return parsed;
    }
  } catch (e) {}
  return defaultState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_STATE, JSON.stringify(state)); } catch (e) {}
}

function loadAttempts() {
  try {
    var raw = localStorage.getItem(STORAGE_ATT);
    var n = parseInt(raw, 10);
    if (!isNaN(n)) return n;
  } catch (e) {}
  return 0;
}

function saveAttempts(n) {
  try { localStorage.setItem(STORAGE_ATT, String(n)); } catch (e) {}
}

function incrementAttempts() {
  var n = loadAttempts() + 1;
  saveAttempts(n);
  updateAttemptsDisplay();
}

function updateAttemptsDisplay() {
  var el = document.getElementById("attemptsCount");
  if (el) el.textContent = String(loadAttempts());
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function activeList() {
  if (state.mode === "retry") {
    return {
      positions: state.retryQueue,
      getAnswer: function (pos) { return state.retryAnswers[pos] || null; },
      setAnswer: function (pos, val) { state.retryAnswers[pos] = val; state.answers[pos] = val; },
      getPointer: function () { return state.retryCurrent; },
      setPointer: function (p) { state.retryCurrent = p; }
    };
  }
  return {
    positions: state.order.map(function (_, i) { return i; }),
    getAnswer: function (pos) { return state.answers[pos]; },
    setAnswer: function (pos, val) { state.answers[pos] = val; },
    getPointer: function () { return state.current; },
    setPointer: function (p) { state.current = p; }
  };
}

function init() {
  state = loadState();
  state.order = loadOrder();
  updateAttemptsDisplay();
  bindTimerResume();
  if (state.resultsShown) {
    renderResults(false);
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  document.getElementById("resultsArea").classList.add("hidden");
  document.getElementById("navwrap").classList.remove("hidden");
  var quizArea = document.getElementById("quizArea");
  quizArea.classList.remove("hidden");

  var al = activeList();
  var posList = al.positions;
  var pointer = al.getPointer();

  if (posList.length === 0) {
    quizArea.innerHTML = "<div class=\"card\"><p>No questions to show.</p></div>";
    return;
  }
  if (pointer >= posList.length) {
    finishRun();
    return;
  }

  var pos = posList[pointer];
  var qIndex = state.order[pos];
  var question = QUESTIONS[qIndex];
  var existing = al.getAnswer(pos);
  var isLast = (pointer === posList.length - 1);

  var html = "";
  html += "<div class=\"card\">";
  html += "<div class=\"qcount\">Question " + (pointer + 1) + " of " + posList.length + "</div>";
  html += "<div class=\"context-box\">" + escapeHtml(question.context) + "</div>";
  html += "<div class=\"qtext\">" + escapeHtml(question.q) + "</div>";
  html += "<div id=\"optsWrap\">";
  for (var i = 0; i < question.opts.length; i++) {
    var cls = "opt";
    if (existing) {
      if (i === question.ci) cls += " revealCorrect";
      else if (i === existing.picked) cls += " wrongPick";
    }
    html += "<button class=\"" + cls + "\" " + (existing ? "disabled" : "") + " onclick=\"selectOption(" + i + ")\">" + escapeHtml(question.opts[i]) + "</button>";
  }
  html += "</div>";
  html += "<div class=\"explanation" + (existing ? " show" : "") + "\" id=\"expBox\">" + (existing ? escapeHtml(question.exp) : "") + "</div>";
  html += "<div class=\"navbtns\">";
  html += "<button id=\"prevBtn\" onclick=\"prevQuestion()\" " + (pointer === 0 ? "disabled" : "") + ">&larr; Prev</button>";
  var nextDisabled = (!isLast && !existing) ? "disabled" : "";
  var nextLabel = isLast ? "Show Results →" : "Next →";
  html += "<button id=\"nextBtn\" onclick=\"nextQuestion()\" " + nextDisabled + ">" + nextLabel + "</button>";
  html += "</div>";
  html += "</div>";

  quizArea.innerHTML = html;
  updateNav();
  renderDots();
}

function selectOption(i) {
  var al = activeList();
  var posList = al.positions;
  var pointer = al.getPointer();
  var pos = posList[pointer];
  var qIndex = state.order[pos];
  var question = QUESTIONS[qIndex];
  if (al.getAnswer(pos)) return;
  var correct = (i === question.ci);
  al.setAnswer(pos, { picked: i, correct: correct });
  saveState();
  renderQuestion();
}

function nextQuestion() {
  var al = activeList();
  var pointer = al.getPointer();
  al.setPointer(pointer + 1);
  saveState();
  renderQuestion();
}

function prevQuestion() {
  var al = activeList();
  var pointer = al.getPointer();
  if (pointer > 0) {
    al.setPointer(pointer - 1);
    saveState();
    renderQuestion();
  }
}

function jumpTo(pos) {
  var al = activeList();
  var idx = al.positions.indexOf(pos);
  if (idx === -1) return;
  al.setPointer(idx);
  saveState();
  renderQuestion();
}

function toggleDots() {
  var panel = document.getElementById("dotsPanel");
  var btn = document.getElementById("toggleDotsBtn");
  if (panel.classList.contains("hidden")) {
    panel.classList.remove("hidden");
    btn.textContent = "Hide Questions";
  } else {
    panel.classList.add("hidden");
    btn.textContent = "Jump to Question";
  }
}

function renderDots() {
  var al = activeList();
  var posList = al.positions;
  var panel = document.getElementById("dotsPanel");
  var html = "";
  for (var i = 0; i < posList.length; i++) {
    var pos = posList[i];
    var ans = al.getAnswer(pos);
    var cls = "dot";
    if (ans) cls += ans.correct ? " correct" : " wrong";
    html += "<button class=\"" + cls + "\" onclick=\"jumpTo(" + pos + ")\">" + (i + 1) + "</button>";
  }
  panel.innerHTML = html;
}

function updateNav() {
  var al = activeList();
  var posList = al.positions;
  var answeredCount = 0;
  for (var i = 0; i < posList.length; i++) {
    if (al.getAnswer(posList[i])) answeredCount++;
  }
  document.getElementById("answeredCount").textContent = String(answeredCount);
  document.getElementById("totalCount").textContent = String(posList.length);
  var pct = posList.length ? (answeredCount / posList.length) * 100 : 0;
  document.getElementById("progressFill").style.width = pct + "%";
}

function finishRun() {
  incrementAttempts();
  state.resultsShown = true;
  saveState();
  renderResults(true);
}

function renderResults(justFinished) {
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("navwrap").classList.add("hidden");
  var resultsArea = document.getElementById("resultsArea");
  resultsArea.classList.remove("hidden");

  var total = state.order.length;
  var correctCount = 0;
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && state.answers[i].correct) correctCount++;
  }

  var html = "";
  html += "<div class=\"card\">";
  html += "<div class=\"scoreLine\">Score: " + correctCount + " / " + total + "</div>";
  html += "<div class=\"resultsBtns\">";
  html += "<button id=\"copyBtn\" onclick=\"copyAllResults()\">Copy All Results</button>";
  html += "<button id=\"retryBtn\" onclick=\"retryWrongOnes()\">Retry Wrong Ones</button>";
  html += "<button id=\"saveWrongBtn\" onclick=\"saveWrongAnswers()\">틀린 문제 저장</button>";
  html += "<button id=\"freshOrigBtn\" onclick=\"startFreshOriginal()\">Start Fresh (Original Order)</button>";
  html += "<button id=\"freshRandBtn\" onclick=\"startFreshRandom()\">Start Fresh (Random Order)</button>";
  html += "</div>";
  html += "<div id=\"reviewList\">";
  for (var p = 0; p < state.order.length; p++) {
    var qIndex = state.order[p];
    var question = QUESTIONS[qIndex];
    var ans = state.answers[p];
    html += "<div class=\"reviewItem\">";
    html += "<div class=\"rq\">Q" + (p + 1) + ". " + escapeHtml(question.q) + "</div>";
    if (ans) {
      html += "<div class=\"rline\">Your answer: " + escapeHtml(question.opts[ans.picked]) + "</div>";
      html += "<div class=\"rline\">Correct answer: " + escapeHtml(question.opts[question.ci]) + "</div>";
      html += "<div class=\"rline " + (ans.correct ? "rcorrect" : "rwrong") + "\">" + (ans.correct ? "Correct" : "Incorrect") + "</div>";
    } else {
      html += "<div class=\"rline\">Not answered</div>";
    }
    html += "</div>";
  }
  html += "</div>";
  html += "</div>";
  resultsArea.innerHTML = html;
}

function retryWrongOnes() {
  var wrongPositions = [];
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && !state.answers[i].correct) wrongPositions.push(i);
  }
  if (wrongPositions.length === 0) {
    alert("No wrong answers to retry.");
    return;
  }
  state.mode = "retry";
  state.retryQueue = wrongPositions;
  state.retryAnswers = {};
  state.retryCurrent = 0;
  state.resultsShown = false;
  saveState();
  renderQuestion();
}

function saveWrongAnswers() {
  var wrong = [];
  for (var i = 0; i < state.answers.length; i++) {
    var ans = state.answers[i];
    if (ans && !ans.correct) {
      var qIndex = state.order[i];
      var question = QUESTIONS[qIndex];
      wrong.push({ q: question.q, opts: question.opts, ci: question.ci, picked: ans.picked });
    }
  }
  if (wrong.length === 0) {
    alert("No wrong answers to save.");
    return;
  }
  try {
    var payload = { child: "Sion", subject: "[Sion] SAT Grammar", date: "2026-08-21", wrong: wrong };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "sion_sat_grammar_wrong_answers.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) {
    alert("Could not save wrong answers.");
  }
}

function copyAllResults() {
  var lines = [];
  lines.push("[Sion] SAT Grammar Results");
  var correctCount = 0;
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && state.answers[i].correct) correctCount++;
  }
  lines.push("Score: " + correctCount + " / " + state.order.length);
  lines.push("");
  for (var p = 0; p < state.order.length; p++) {
    var qIndex = state.order[p];
    var question = QUESTIONS[qIndex];
    var ans = state.answers[p];
    lines.push("Q" + (p + 1) + ": " + question.q);
    if (ans) {
      lines.push("Your answer: " + question.opts[ans.picked]);
      lines.push("Correct answer: " + question.opts[question.ci]);
      lines.push("Result: " + (ans.correct ? "Correct" : "Incorrect"));
    } else {
      lines.push("Not answered");
    }
    lines.push("");
  }
  var text = lines.join("\n");
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        alert("Results copied to clipboard.");
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  } catch (e) {
    try { fallbackCopy(text); } catch (e2) {}
  }
}

function fallbackCopy(text) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("Results copied to clipboard.");
  } catch (e) {
    alert("Could not copy results.");
  }
}

function startFreshOriginal() {
  pendingModalAction = "original";
  document.getElementById("modalText").textContent = "Start fresh with questions in the original order? This will reset all progress and the timer.";
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function startFreshRandom() {
  pendingModalAction = "random";
  document.getElementById("modalText").textContent = "Start fresh with questions in random order? This will reset all progress and the timer.";
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function modalConfirmYes() {
  var newOrder = (pendingModalAction === "random") ? shuffleArray(defaultOrder()) : defaultOrder();
  saveOrder(newOrder);
  state = defaultState();
  state.order = newOrder;
  saveState();
  document.getElementById("modalOverlay").classList.add("hidden");
  pendingModalAction = null;
  stopTimerInterval();
  updateTimerDisplay();
  renderQuestion();
}

function modalConfirmNo() {
  document.getElementById("modalOverlay").classList.add("hidden");
  pendingModalAction = null;
}

function startTimer() {
  var input = document.getElementById("timeLimitInput");
  var minutes = parseInt(input.value, 10);
  if (isNaN(minutes) || minutes <= 0) minutes = 20;
  state.timer.limitMin = minutes;
  state.timer.startTs = Date.now();
  state.timer.running = true;
  saveState();
  startTimerInterval();
}

function bindTimerResume() {
  if (state.timer && state.timer.running && state.timer.startTs) {
    startTimerInterval();
  } else {
    updateTimerDisplay();
  }
}

function startTimerInterval() {
  stopTimerInterval();
  tickTimer();
  timerInterval = setInterval(tickTimer, 500);
}

function stopTimerInterval() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function tickTimer() {
  if (!state.timer || !state.timer.running || !state.timer.startTs) {
    updateTimerDisplay();
    return;
  }
  var totalMs = state.timer.limitMin * 60000;
  var elapsed = Date.now() - state.timer.startTs;
  var remaining = totalMs - elapsed;
  var display = document.getElementById("timerDisplay");
  if (remaining <= 0) {
    display.textContent = "Time's Up";
    display.classList.remove("orange");
    display.classList.add("red");
    state.timer.running = false;
    saveState();
    stopTimerInterval();
    return;
  }
  var totalSec = Math.ceil(remaining / 1000);
  var mm = Math.floor(totalSec / 60);
  var ss = totalSec % 60;
  display.textContent = (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
  var ratio = remaining / totalMs;
  display.classList.remove("orange", "red");
  if (ratio <= 0.10) display.classList.add("red");
  else if (ratio <= 0.25) display.classList.add("orange");
}

function updateTimerDisplay() {
  var display = document.getElementById("timerDisplay");
  if (!display) return;
  if (state.timer && state.timer.limitMin) {
    var mm = state.timer.limitMin;
    display.textContent = (mm < 10 ? "0" + mm : mm) + ":00";
  } else {
    display.textContent = "20:00";
  }
  display.classList.remove("orange", "red");
}

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

window.startTimer = startTimer;
window.selectOption = selectOption;
window.nextQuestion = nextQuestion;
window.prevQuestion = prevQuestion;
window.jumpTo = jumpTo;
window.toggleDots = toggleDots;
window.retryWrongOnes = retryWrongOnes;
window.saveWrongAnswers = saveWrongAnswers;
window.startFreshOriginal = startFreshOriginal;
window.startFreshRandom = startFreshRandom;
window.modalConfirmYes = modalConfirmYes;
window.modalConfirmNo = modalConfirmNo;
window.copyAllResults = copyAllResults;

init();
</script>
</body>
</html>
