<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Vocabulary</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f9;
    color: #1f2733;
    margin: 0 auto;
    max-width: 720px;
    padding: 20px 16px 60px;
  }
  h1.title {
    font-size: 26px;
    margin: 6px 0 4px;
    color: #14202e;
    text-align: center;
  }
  p.instruction {
    text-align: center;
    color: #4a5568;
    margin: 0 0 6px;
    font-size: 15px;
  }
  p.attempts {
    text-align: center;
    color: #6b7684;
    margin: 0 0 18px;
    font-size: 14px;
  }
  .timer-box {
    background: #ffffff;
    border: 1px solid #dde3ea;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .timer-box label {
    font-size: 13px;
    color: #445;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .timer-box input[type="number"] {
    width: 64px;
    padding: 5px 6px;
    border: 1px solid #c9d2dc;
    border-radius: 6px;
    font-size: 14px;
  }
  .timer-box button {
    background: #185FA5;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .timer-box button:disabled {
    background: #9fb4c8;
    cursor: not-allowed;
  }
  .timer-display {
    font-size: 18px;
    font-weight: 700;
    color: #185FA5;
    margin-left: auto;
    min-width: 70px;
    text-align: right;
  }
  .timer-display.warn { color: #d98324; }
  .timer-display.danger { color: #E24B4A; }

  .nav-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .nav-count {
    font-size: 13px;
    color: #4a5568;
    white-space: nowrap;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: #d7dde6;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #185FA5;
    width: 0%;
    transition: width .2s ease;
  }
  .jump-toggle {
    background: #eef2f7;
    border: 1px solid #d7dde6;
    color: #185FA5;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .jump-panel {
    background: #ffffff;
    border: 1px solid #dde3ea;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 16px;
    max-height: 170px;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: #d7dde6;
    color: #33404d;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dot.correct { background: #185FA5; color: #fff; }
  .dot.wrong { background: #E24B4A; color: #fff; }
  .dot.current { outline: 2px solid #14202e; outline-offset: 1px; }

  .quiz-card {
    background: #ffffff;
    border: 1px solid #dde3ea;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .q-number {
    font-size: 13px;
    color: #6b7684;
  }
  .tag-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    color: #fff;
  }
  .tag-review { background: #f5a623; }
  .tag-new { background: #6b7684; }
  .word-stem {
    font-size: 28px;
    font-weight: 800;
    color: #14202e;
    margin: 4px 0 18px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    text-align: left;
    background: #f7f9fb;
    border: 1px solid #dde3ea;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 15px;
    color: #1f2733;
    cursor: pointer;
  }
  .option-btn:hover { background: #eef2f7; }
  .option-btn.picked-correct { background: #dff3ea; border-color: #1D9E75; }
  .option-btn.picked-wrong { background: #fbe4e3; border-color: #E24B4A; }
  .option-btn.reveal-correct { background: #dff3ea; border-color: #1D9E75; }
  .option-btn:disabled { cursor: default; }
  .explanation {
    margin-top: 14px;
    background: #f4f8ff;
    border-left: 4px solid #185FA5;
    padding: 10px 12px;
    font-size: 14px;
    color: #33404d;
    border-radius: 4px;
    display: none;
  }
  .explanation.show { display: block; }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 30px;
  }
  .nav-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #prevBtn { background: #e5e9ee; color: #33404d; }
  #prevBtn:disabled { color: #a7b1bd; cursor: not-allowed; }
  #nextBtn { background: #185FA5; color: #fff; }
  #nextBtn:disabled { background: #a7c3dc; cursor: not-allowed; }

  .results-screen {
    background: #ffffff;
    border: 1px solid #dde3ea;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
  }
  .results-screen h2 {
    margin-top: 0;
    color: #14202e;
  }
  .score-line {
    font-size: 20px;
    font-weight: 700;
    color: #185FA5;
    margin-bottom: 18px;
  }
  .result-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .result-buttons button {
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
  }
  #copyResultsBtn { background: #33404d; }
  #retryWrongBtn { background: #1D9E75; }
  #saveWrongBtn { background: #7b61ff; }
  #freshOrigBtn { background: #185FA5; }
  #freshRandBtn { background: #4a7ab5; }
  .result-list {
    text-align: left;
    margin-top: 18px;
    font-size: 13px;
    color: #4a5568;
    max-height: 240px;
    overflow-y: auto;
    border-top: 1px solid #eef2f7;
    padding-top: 10px;
  }
  .result-list div { margin-bottom: 6px; }

  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(20,32,46,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-box {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .modal-box p { font-size: 15px; color: #1f2733; margin-bottom: 18px; }
  .modal-buttons {
    display: flex;
    gap: 10px;
  }
  .modal-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #modalCancelBtn { background: #e5e9ee; color: #33404d; }
  #modalConfirmBtn { background: #E24B4A; color: #fff; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <h1 class="title" id="quizTitle">[Sion] SAT Vocabulary</h1>
  <p class="instruction">Choose the definition that best matches each word.</p>
  <p class="attempts">Total Attempts: <span id="attemptsCount">0</span></p>

  <div class="timer-box">
    <label>Set Time Limit (minutes):
      <input type="number" id="timeLimitInput" min="1" max="180" value="20">
    </label>
    <button id="timerStartBtn">Start</button>
    <span class="timer-display" id="timerDisplay">--:--</span>
  </div>

  <div class="nav-bar">
    <span class="nav-count" id="navCount">0 / 20</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <button class="jump-toggle" id="jumpToggleBtn">Jump &#9662;</button>
  </div>
  <div class="jump-panel" id="jumpPanel" hidden></div>

  <div class="quiz-card" id="quizCard">
    <div class="q-meta">
      <span class="q-number" id="qNumber">Question 1 of 20</span>
      <span class="tag-badge" id="qTag"></span>
    </div>
    <div class="word-stem" id="wordStem"></div>
    <div class="options" id="optionsList"></div>
    <div class="explanation" id="explanation"></div>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn">&larr; Prev</button>
    <button id="nextBtn">Next &rarr;</button>
  </div>

  <div class="results-screen" id="resultsScreen" hidden>
    <h2>Quiz Complete</h2>
    <div class="score-line" id="scoreLine"></div>
    <div class="result-buttons">
      <button id="copyResultsBtn">Copy All Results</button>
      <button id="retryWrongBtn">Retry Wrong Ones</button>
      <button id="saveWrongBtn">틀린 문제 저장</button>
      <button id="freshOrigBtn">Start Fresh (Original Order)</button>
      <button id="freshRandBtn">Start Fresh (Random Order)</button>
    </div>
    <div class="result-list" id="resultList"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box">
      <p id="modalMessage"></p>
      <div class="modal-buttons">
        <button id="modalCancelBtn">Cancel</button>
        <button id="modalConfirmBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var QUESTIONS = [
    { id: 0, stem: "meticulous", tag: "New",
      opts: ["careless and hasty", "extremely generous", "showing great attention to detail; very careful and precise", "easily frightened"],
      ci: 2,
      exp: 'Meticulous means showing great attention to detail; very careful and precise. It does not mean "careless and hasty," which is nearly the opposite, nor "easily frightened," which describes a different trait entirely.' },
    { id: 1, stem: "veracity", tag: "Review",
      opts: ["conformity to facts; truthfulness or accuracy", "extreme anger or rage", "a strong desire for revenge", "the state of being uncertain"],
      ci: 0,
      exp: 'Veracity means conformity to facts; truthfulness or accuracy. It is unrelated to "extreme anger or rage" or "a strong desire for revenge," which describe emotional states, not truthfulness.' },
    { id: 2, stem: "litigious", tag: "New",
      opts: ["skilled at resolving conflicts peacefully", "knowledgeable about literature", "reluctant to speak in public", "prone to engaging in lawsuits; excessively inclined to sue"],
      ci: 3,
      exp: 'Litigious means prone to engaging in lawsuits; excessively inclined to sue. It is the opposite of "skilled at resolving conflicts peacefully," and it is not related to "knowledgeable about literature" despite the similar spelling.' },
    { id: 3, stem: "expiate", tag: "New",
      opts: ["to postpone or delay something", "to expel forcefully", "to explain in great detail", "to make amends for guilt or wrongdoing; to atone for"],
      ci: 3,
      exp: 'Expiate means to make amends for guilt or wrongdoing; to atone for. It does not mean "to postpone or delay something" or "to explain in great detail," which describe entirely different actions.' },
    { id: 4, stem: "aesthetic", tag: "Review",
      opts: ["relating to moral principles", "concerned with beauty or the appreciation of beauty", "concerned with practical usefulness", "relating to historical accuracy"],
      ci: 1,
      exp: 'Aesthetic means concerned with beauty or the appreciation of beauty. It is different from "relating to moral principles," which describes ethics, and "concerned with practical usefulness," which describes function rather than beauty.' },
    { id: 5, stem: "sublime", tag: "New",
      opts: ["ordinary and unremarkable", "of such beauty or grandeur as to inspire awe", "extremely small in scale", "morally corrupt"],
      ci: 1,
      exp: 'Sublime means of such beauty or grandeur as to inspire awe. It is nearly the opposite of "ordinary and unremarkable," and it has nothing to do with being "extremely small in scale."' },
    { id: 6, stem: "diminutive", tag: "Review",
      opts: ["quiet and reserved", "extremely large or imposing", "extremely small; tiny", "lacking in confidence"],
      ci: 2,
      exp: 'Diminutive means extremely small; tiny. It is the opposite of "extremely large or imposing" and is not the same as being "quiet and reserved," which describes personality rather than size.' },
    { id: 7, stem: "dither", tag: "New",
      opts: ["to act quickly and decisively", "to be indecisive; to hesitate about what to do", "to argue loudly", "to organize carefully"],
      ci: 1,
      exp: 'Dither means to be indecisive; to hesitate about what to do. It is nearly the opposite of "to act quickly and decisively," and it does not mean "to argue loudly."' },
    { id: 8, stem: "attribute", tag: "New",
      opts: ["to combine two separate things into one", "to regard something as being caused by a particular source", "to remove or take something away", "to publicly criticize or condemn"],
      ci: 1,
      exp: 'Attribute (as a verb) means to regard something as being caused by a particular source. It does not mean "to remove or take something away," and it is unrelated to "to publicly criticize or condemn."' },
    { id: 9, stem: "concise", tag: "New",
      opts: ["excessively wordy and repetitive", "vague and unclear", "harsh and critical", "expressed clearly in few words; brief but complete"],
      ci: 3,
      exp: 'Concise means expressed clearly in few words; brief but complete. It is the opposite of "excessively wordy and repetitive," and it does not mean "vague and unclear," since concise writing is precise, not unclear.' },
    { id: 10, stem: "tantamount", tag: "Review",
      opts: ["completely unrelated to", "temporarily delayed", "far superior to", "equivalent in effect or value to; virtually the same as"],
      ci: 3,
      exp: 'Tantamount means equivalent in effect or value to; virtually the same as. It is nearly the opposite of "completely unrelated to," and it does not mean "far superior to."' },
    { id: 11, stem: "pompous", tag: "New",
      opts: ["humble and modest", "excessively self-important or arrogant in manner", "extremely generous with money", "cheerful and optimistic"],
      ci: 1,
      exp: 'Pompous means excessively self-important or arrogant in manner. It is the opposite of "humble and modest," and it is not the same as "cheerful and optimistic."' },
    { id: 12, stem: "decry", tag: "New",
      opts: ["to praise enthusiastically", "to publicly criticize or denounce as wrong", "to decrease gradually", "to keep secret"],
      ci: 1,
      exp: 'Decry means to publicly criticize or denounce as wrong. It is nearly the opposite of "to praise enthusiastically," and it is not the same as "to decrease gradually," despite sounding similar to "decrease."' },
    { id: 13, stem: "guile", tag: "Review",
      opts: ["open and honest behavior", "extreme physical strength", "sly or cunning intelligence used to deceive others", "a strong feeling of guilt"],
      ci: 2,
      exp: 'Guile means sly or cunning intelligence used to deceive others. It is the opposite of "open and honest behavior," and it is not the same as "a strong feeling of guilt," despite the similar sound.' },
    { id: 14, stem: "infer", tag: "New",
      opts: ["to state something directly and openly", "to ignore available evidence", "to deduce or conclude from evidence rather than explicit statement", "to memorize without understanding"],
      ci: 2,
      exp: 'Infer means to deduce or conclude from evidence rather than explicit statement. It is nearly the opposite of "to state something directly and openly," which describes making a statement rather than drawing a conclusion.' },
    { id: 15, stem: "plausible", tag: "New",
      opts: ["seeming reasonable or probable; believable", "clearly false or impossible", "extremely complicated", "morally acceptable"],
      ci: 0,
      exp: 'Plausible means seeming reasonable or probable; believable. It is the opposite of "clearly false or impossible," and it does not mean "extremely complicated."' },
    { id: 16, stem: "dissipate", tag: "New",
      opts: ["to gather together and intensify", "to preserve carefully", "to multiply rapidly", "to scatter and gradually disappear; to vanish"],
      ci: 3,
      exp: 'Dissipate means to scatter and gradually disappear; to vanish. It is the opposite of "to gather together and intensify," and it does not mean "to multiply rapidly."' },
    { id: 17, stem: "objective", tag: "New",
      opts: ["influenced by personal opinions or feelings", "extremely detailed and thorough", "not influenced by personal feelings; unbiased and fact-based", "difficult to prove or verify"],
      ci: 2,
      exp: 'Objective (as an adjective) means not influenced by personal feelings; unbiased and fact-based. It is the opposite of "influenced by personal opinions or feelings," and it does not simply mean "extremely detailed and thorough."' },
    { id: 18, stem: "diffuse", tag: "New",
      opts: ["tightly compressed into a small space", "extremely bright or intense", "spread out over a wide area; not concentrated", "difficult to understand"],
      ci: 2,
      exp: 'Diffuse means spread out over a wide area; not concentrated. It is the opposite of "tightly compressed into a small space," and it does not simply mean "difficult to understand."' },
    { id: 19, stem: "genial", tag: "New",
      opts: ["cold and unwelcoming", "friendly, warm, and cheerful in manner", "extremely intelligent", "nervous and anxious"],
      ci: 1,
      exp: 'Genial means friendly, warm, and cheerful in manner. It is the opposite of "cold and unwelcoming," and it does not mean "extremely intelligent."' }
  ];

  var ORDER_KEY = "quiz_sionsatvocab_20_20260820_order_v1";
  var QUIZ_KEY = "quiz_sionsatvocab_20_20260820_v1";
  var ATT_KEY = "quiz_sionsatvocab_20260820_att_v1";

  function safeGet(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSet(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { /* storage unavailable, ignore */ }
  }

  function defaultOrder() {
    var arr = [];
    for (var i = 0; i < QUESTIONS.length; i++) arr.push(i);
    return arr;
  }

  function loadOrder() {
    var raw = safeGet(ORDER_KEY);
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length === QUESTIONS.length) {
          var sorted = parsed.slice().sort(function (a, b) { return a - b; });
          var ok = true;
          for (var i = 0; i < sorted.length; i++) { if (sorted[i] !== i) { ok = false; break; } }
          if (ok) return parsed;
        }
      } catch (e) { /* fall through to default */ }
    }
    var d = defaultOrder();
    safeSet(ORDER_KEY, JSON.stringify(d));
    return d;
  }

  function defaultTimer() {
    return { limitMin: 20, startTs: null, running: false, expired: false };
  }

  function defaultState(order) {
    return {
      idx: 0,
      answers: {},
      activeIds: order.slice(),
      finished: false,
      timer: defaultTimer()
    };
  }

  var baseOrder = loadOrder();
  var state = null;
  (function loadState() {
    var raw = safeGet(QUIZ_KEY);
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.activeIds) && parsed.activeIds.length > 0 && parsed.timer) {
          state = parsed;
          return;
        }
      } catch (e) { /* fall through */ }
    }
    state = defaultState(baseOrder);
  })();

  function saveState() {
    safeSet(QUIZ_KEY, JSON.stringify(state));
  }

  var attempts = 0;
  (function loadAttempts() {
    var raw = safeGet(ATT_KEY);
    var n = parseInt(raw, 10);
    attempts = isNaN(n) ? 0 : n;
  })();
  function saveAttempts() { safeSet(ATT_KEY, String(attempts)); }

  function qById(id) {
    for (var i = 0; i < QUESTIONS.length; i++) { if (QUESTIONS[i].id === id) return QUESTIONS[i]; }
    return null;
  }

  var els = {
    attemptsCount: document.getElementById("attemptsCount"),
    timeLimitInput: document.getElementById("timeLimitInput"),
    timerStartBtn: document.getElementById("timerStartBtn"),
    timerDisplay: document.getElementById("timerDisplay"),
    navCount: document.getElementById("navCount"),
    progressFill: document.getElementById("progressFill"),
    jumpToggleBtn: document.getElementById("jumpToggleBtn"),
    jumpPanel: document.getElementById("jumpPanel"),
    quizCard: document.getElementById("quizCard"),
    qNumber: document.getElementById("qNumber"),
    qTag: document.getElementById("qTag"),
    wordStem: document.getElementById("wordStem"),
    optionsList: document.getElementById("optionsList"),
    explanation: document.getElementById("explanation"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    resultsScreen: document.getElementById("resultsScreen"),
    scoreLine: document.getElementById("scoreLine"),
    resultList: document.getElementById("resultList"),
    copyResultsBtn: document.getElementById("copyResultsBtn"),
    retryWrongBtn: document.getElementById("retryWrongBtn"),
    saveWrongBtn: document.getElementById("saveWrongBtn"),
    freshOrigBtn: document.getElementById("freshOrigBtn"),
    freshRandBtn: document.getElementById("freshRandBtn"),
    modalOverlay: document.getElementById("modalOverlay"),
    modalMessage: document.getElementById("modalMessage"),
    modalCancelBtn: document.getElementById("modalCancelBtn"),
    modalConfirmBtn: document.getElementById("modalConfirmBtn")
  };

  var jumpOpen = false;
  var timerInterval = null;

  function fmtTime(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    return (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
  }

  function updateTimerDisplay() {
    var t = state.timer;
    els.timerDisplay.classList.remove("warn", "danger");
    if (!t.startTs && !t.expired) {
      els.timerDisplay.textContent = fmtTime(t.limitMin * 60000);
      return;
    }
    if (t.expired) {
      els.timerDisplay.textContent = "Time's Up";
      els.timerDisplay.classList.add("danger");
      return;
    }
    var totalMs = t.limitMin * 60000;
    var elapsed = Date.now() - t.startTs;
    var remaining = totalMs - elapsed;
    if (remaining <= 0) {
      t.running = false;
      t.expired = true;
      saveState();
      stopTimerInterval();
      els.timerDisplay.textContent = "Time's Up";
      els.timerDisplay.classList.add("danger");
      autoFinishOnTimeout();
      return;
    }
    var ratio = remaining / totalMs;
    if (ratio <= 0.10) els.timerDisplay.classList.add("danger");
    else if (ratio <= 0.25) els.timerDisplay.classList.add("warn");
    els.timerDisplay.textContent = fmtTime(remaining);
  }

  function startTimerInterval() {
    stopTimerInterval();
    timerInterval = setInterval(updateTimerDisplay, 250);
  }
  function stopTimerInterval() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function autoFinishOnTimeout() {
    if (!state.finished) {
      finishQuiz();
    }
  }

  els.timerStartBtn.addEventListener("click", function () {
    var val = parseInt(els.timeLimitInput.value, 10);
    if (isNaN(val) || val < 1) val = 1;
    if (val > 180) val = 180;
    els.timeLimitInput.value = val;
    state.timer = { limitMin: val, startTs: Date.now(), running: true, expired: false };
    saveState();
    els.timeLimitInput.disabled = true;
    els.timerStartBtn.disabled = true;
    startTimerInterval();
    updateTimerDisplay();
  });

  function resumeTimerIfNeeded() {
    var t = state.timer;
    if (t.running && !t.expired) {
      els.timeLimitInput.value = t.limitMin;
      els.timeLimitInput.disabled = true;
      els.timerStartBtn.disabled = true;
      startTimerInterval();
    } else if (t.expired) {
      els.timeLimitInput.disabled = true;
      els.timerStartBtn.disabled = true;
    } else {
      els.timeLimitInput.value = t.limitMin;
      els.timeLimitInput.disabled = false;
      els.timerStartBtn.disabled = false;
    }
    updateTimerDisplay();
  }

  function resetTimer() {
    stopTimerInterval();
    state.timer = defaultTimer();
    els.timeLimitInput.value = 20;
    els.timeLimitInput.disabled = false;
    els.timerStartBtn.disabled = false;
    updateTimerDisplay();
  }

  function currentQ() {
    var qid = state.activeIds[state.idx];
    return qById(qid);
  }

  function renderNav() {
    var total = state.activeIds.length;
    var answered = 0;
    for (var i = 0; i < state.activeIds.length; i++) {
      if (state.answers[state.activeIds[i]]) answered++;
    }
    els.navCount.textContent = answered + " / " + total;
    var pct = total > 0 ? Math.round((answered / total) * 100) : 0;
    els.progressFill.style.width = pct + "%";
    renderJumpPanel();
  }

  function renderJumpPanel() {
    els.jumpPanel.innerHTML = "";
    for (var i = 0; i < state.activeIds.length; i++) {
      var qid = state.activeIds[i];
      var ans = state.answers[qid];
      var btn = document.createElement("button");
      btn.className = "dot";
      if (ans) btn.classList.add(ans.correct ? "correct" : "wrong");
      if (i === state.idx && !state.finished) btn.classList.add("current");
      btn.textContent = String(i + 1);
      (function (targetIdx) {
        btn.addEventListener("click", function () {
          if (state.finished) return;
          state.idx = targetIdx;
          saveState();
          renderQuestion();
          renderNav();
        });
      })(i);
      els.jumpPanel.appendChild(btn);
    }
  }

  els.jumpToggleBtn.addEventListener("click", function () {
    jumpOpen = !jumpOpen;
    els.jumpPanel.hidden = !jumpOpen;
    els.jumpToggleBtn.innerHTML = jumpOpen ? "Hide &#9652;" : "Jump &#9662;";
  });

  function renderQuestion() {
    if (state.finished) return;
    var q = currentQ();
    var total = state.activeIds.length;
    els.qNumber.textContent = "Question " + (state.idx + 1) + " of " + total;
    els.qTag.textContent = q.tag;
    els.qTag.className = "tag-badge " + (q.tag === "Review" ? "tag-review" : "tag-new");
    els.wordStem.textContent = q.stem;
    els.optionsList.innerHTML = "";
    var existingAns = state.answers[q.id];

    q.opts.forEach(function (optText, optIdx) {
      var btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = optText;
      if (existingAns) {
        btn.disabled = true;
        if (optIdx === q.ci) btn.classList.add("reveal-correct");
        if (optIdx === existingAns.picked && optIdx !== q.ci) btn.classList.add("picked-wrong");
        if (optIdx === existingAns.picked && optIdx === q.ci) btn.classList.add("picked-correct");
      } else {
        btn.addEventListener("click", function () {
          selectAnswer(q, optIdx);
        });
      }
      els.optionsList.appendChild(btn);
    });

    if (existingAns) {
      els.explanation.textContent = q.exp;
      els.explanation.classList.add("show");
    } else {
      els.explanation.textContent = "";
      els.explanation.classList.remove("show");
    }

    els.prevBtn.disabled = state.idx === 0;
    var isLast = state.idx === total - 1;
    els.nextBtn.textContent = isLast ? "Show Results →" : "Next →";
    els.nextBtn.disabled = false;
  }

  function selectAnswer(q, optIdx) {
    var correct = optIdx === q.ci;
    state.answers[q.id] = { picked: optIdx, correct: correct };
    saveState();
    renderQuestion();
    renderNav();
  }

  els.prevBtn.addEventListener("click", function () {
    if (state.idx > 0) {
      state.idx -= 1;
      saveState();
      renderQuestion();
      renderNav();
    }
  });

  els.nextBtn.addEventListener("click", function () {
    var total = state.activeIds.length;
    if (state.idx < total - 1) {
      state.idx += 1;
      saveState();
      renderQuestion();
      renderNav();
    } else {
      finishQuiz();
    }
  });

  function finishQuiz() {
    if (state.finished) { renderResults(); return; }
    state.finished = true;
    saveState();
    attempts += 1;
    saveAttempts();
    renderResults();
  }

  function renderResults() {
    els.quizCard.hidden = true;
    document.querySelector(".nav-buttons").hidden = true;
    document.querySelector(".nav-bar").hidden = true;
    els.jumpPanel.hidden = true;
    jumpOpen = false;
    els.resultsScreen.hidden = false;

    var total = state.activeIds.length;
    var correctCount = 0;
    var listHtml = "";
    for (var i = 0; i < state.activeIds.length; i++) {
      var qid = state.activeIds[i];
      var q = qById(qid);
      var ans = state.answers[qid];
      var mark;
      if (ans && ans.correct) { correctCount++; mark = "Correct"; }
      else { mark = "Wrong"; }
      var pickedText = ans ? q.opts[ans.picked] : "(not answered)";
      listHtml += "<div><strong>" + (i + 1) + ". " + escapeHtml(q.stem) + "</strong> - " + mark +
        "<br>Your answer: " + escapeHtml(pickedText) +
        (ans && !ans.correct ? "<br>Correct answer: " + escapeHtml(q.opts[q.ci]) : "") +
        "</div>";
    }
    els.scoreLine.textContent = "Score: " + correctCount + " / " + total;
    els.resultList.innerHTML = listHtml;
    els.attemptsCount.textContent = String(attempts);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function showQuizScreen() {
    els.quizCard.hidden = false;
    document.querySelector(".nav-buttons").hidden = false;
    document.querySelector(".nav-bar").hidden = false;
    els.resultsScreen.hidden = true;
    renderQuestion();
    renderNav();
  }

  function getWrongList() {
    var wrong = [];
    for (var i = 0; i < state.activeIds.length; i++) {
      var qid = state.activeIds[i];
      var q = qById(qid);
      var ans = state.answers[qid];
      if (ans && !ans.correct) {
        wrong.push({ q: q.stem, opts: q.opts.slice(), ci: q.ci, picked: ans.picked });
      }
    }
    return wrong;
  }

  els.copyResultsBtn.addEventListener("click", function () {
    var lines = [];
    lines.push("[Sion] SAT Vocabulary Results");
    lines.push("Score: " + els.scoreLine.textContent.replace("Score: ", ""));
    for (var i = 0; i < state.activeIds.length; i++) {
      var qid = state.activeIds[i];
      var q = qById(qid);
      var ans = state.answers[qid];
      var pickedText = ans ? q.opts[ans.picked] : "(not answered)";
      lines.push((i + 1) + ". " + q.stem + " - " + (ans && ans.correct ? "Correct" : "Wrong") +
        " | Your answer: " + pickedText +
        (ans && !ans.correct ? " | Correct answer: " + q.opts[q.ci] : ""));
    }
    var text = lines.join("\n");
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          alert("Results copied to clipboard.");
        }, function () {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    } catch (e) {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      alert("Results copied to clipboard.");
    } catch (e) {
      alert("Could not copy automatically. Please copy manually.");
    }
  }

  els.retryWrongBtn.addEventListener("click", function () {
    var wrongIds = [];
    for (var i = 0; i < state.activeIds.length; i++) {
      var qid = state.activeIds[i];
      var ans = state.answers[qid];
      if (ans && !ans.correct) wrongIds.push(qid);
    }
    if (wrongIds.length === 0) {
      alert("No wrong answers to retry.");
      return;
    }
    state.activeIds = wrongIds;
    state.answers = {};
    state.idx = 0;
    state.finished = false;
    saveState();
    showQuizScreen();
  });

  window.saveWrongAnswers = function () {
    try {
      var wrong = getWrongList();
      if (wrong.length === 0) {
        alert("There were no wrong answers.");
        return;
      }
      var payload = {
        child: "Sion",
        subject: "[Sion] SAT Vocabulary",
        date: "2026-08-21",
        wrong: wrong
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "sion_sat_vocabulary_wrong_answers.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      alert("Could not save wrong answers.");
    }
  };
  els.saveWrongBtn.addEventListener("click", function () {
    window.saveWrongAnswers();
  });

  var pendingModalAction = null;

  function showModal(message, onConfirm) {
    els.modalMessage.textContent = message;
    pendingModalAction = onConfirm;
    els.modalOverlay.hidden = false;
  }
  function hideModal() {
    els.modalOverlay.hidden = true;
    pendingModalAction = null;
  }
  els.modalCancelBtn.addEventListener("click", hideModal);
  els.modalConfirmBtn.addEventListener("click", function () {
    var action = pendingModalAction;
    hideModal();
    if (action) action();
  });

  els.freshOrigBtn.addEventListener("click", function () {
    showModal("Start fresh in original word order? Your current progress and timer will be reset.", function () {
      baseOrder = defaultOrder();
      safeSet(ORDER_KEY, JSON.stringify(baseOrder));
      state = defaultState(baseOrder);
      saveState();
      resetTimer();
      showQuizScreen();
    });
  });

  els.freshRandBtn.addEventListener("click", function () {
    showModal("Start fresh in random order? Your current progress and timer will be reset.", function () {
      var shuffled = baseOrder.slice();
      for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = tmp;
      }
      baseOrder = shuffled;
      safeSet(ORDER_KEY, JSON.stringify(baseOrder));
      state = defaultState(baseOrder);
      saveState();
      resetTimer();
      showQuizScreen();
    });
  });

  function init() {
    els.attemptsCount.textContent = String(attempts);
    resumeTimerIfNeeded();
    if (state.finished) {
      renderResults();
    } else {
      showQuizScreen();
    }
  }

  init();
})();
</script>
</body>
</html>
