<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Grammar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#222;min-height:100vh;}
#app{max-width:700px;margin:0 auto;padding:16px;}
h1{text-align:center;font-size:1.35rem;font-weight:800;color:#185FA5;padding:14px 0 4px;}
.instr{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;min-width:52px;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:6px;}
.timer-bar{background:white;border:1px solid #d0dce8;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
#att-bar{text-align:center;font-size:0.8rem;color:#888;margin-bottom:8px;}
#att-bar span{font-weight:700;color:#185FA5;}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:20px 18px;margin-bottom:12px;}
.q-num{font-size:0.78rem;color:#888;margin-bottom:8px;}
.topic-tag{display:inline-block;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#e3f0ff;color:#185FA5;margin-bottom:8px;}
.context-box{background:#f5f9ff;border-left:3px solid #185FA5;padding:11px 14px;border-radius:4px;font-size:0.95rem;line-height:1.75;color:#222;margin-bottom:12px;}
.q-text{font-size:0.95rem;line-height:1.5;margin-bottom:14px;color:#333;font-weight:600;}
.opts{display:grid;gap:8px;}
.opt{padding:11px 14px;border:2px solid #d7dde6;border-radius:8px;cursor:pointer;font-size:0.92rem;background:white;text-align:left;line-height:1.4;transition:border-color 0.15s,background 0.15s;}
.opt:hover:not(:disabled){border-color:#185FA5;background:#f0f6ff;}
.opt.correct{border-color:#1D9E75;background:#e6f7f1;color:#0d6b50;font-weight:700;}
.opt.wrong{border-color:#E24B4A;background:#fdf0f0;color:#b03030;}
.opt:disabled{cursor:default;}
.exp{margin-top:12px;padding:11px;background:#f5f9ff;border-left:3px solid #185FA5;border-radius:4px;font-size:0.86rem;line-height:1.55;color:#333;display:none;}
.nav-btns{display:flex;gap:8px;margin-top:8px;}
.nav-btns button{flex:1;padding:10px;border:1.5px solid #d7dde6;border-radius:8px;background:white;cursor:pointer;font-size:0.9rem;color:#444;}
.nav-btns button:hover:not(:disabled){border-color:#185FA5;color:#185FA5;}
.nav-btns button:disabled{opacity:0.4;cursor:not-allowed;}
.results{background:white;border-radius:12px;padding:28px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.score-big{font-size:3rem;font-weight:900;color:#185FA5;}
.score-lbl{color:#888;font-size:0.9rem;margin-bottom:16px;}
.stats-row{display:flex;justify-content:center;gap:28px;margin-bottom:22px;}
.stat-n{font-size:1.5rem;font-weight:800;}
.stat-lbl{font-size:0.75rem;color:#888;}
.res-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;}
.btn-copy{background:#7b61ff;color:white;}
.btn-retry{background:#1D9E75;color:white;}
.btn-fresh{background:#e8ecf0;color:#444;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-ov.show{display:flex;}
.modal-box{background:white;border-radius:14px;padding:24px;max-width:360px;width:90%;text-align:center;}
.modal-box h3{color:#185FA5;margin-bottom:10px;font-size:1.05rem;}
.modal-box p{font-size:0.88rem;color:#555;margin-bottom:18px;line-height:1.5;}
.modal-acts{display:flex;gap:10px;}
.modal-acts button{flex:1;padding:10px;border:none;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;}
.modal-acts .cancel{background:#e8ecf0;color:#444;}
.modal-acts .confirm{background:#E24B4A;color:white;}
</style>
</head>
<body>
<div id="app">
  <h1>[Sion] SAT Grammar</h1>
  <div class="instr">Read each passage excerpt and choose the best answer.</div>
  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>
  <div class="timer-bar" id="timerBar">
    <div class="timer-setup" id="timerSetup">
      <label for="timerMin">Set Time Limit:</label>
      <input type="number" id="timerMin" min="1" max="180" value="25"> min
      <button class="timer-start-btn" onclick="startTimer()">Start</button>
    </div>
    <div class="timer-running" id="timerRunning" style="display:none;">
      <span class="timer-label">Time Left</span>
      <span class="timer-display" id="timerDisplay">25:00</span>
    </div>
  </div>
  <div id="att-bar">Total Attempts: <span id="attCount">0</span></div>
  <div id="qcard"></div>
  <div id="freshModal" class="modal-ov">
    <div class="modal-box">
      <h3 id="freshTitle">Start Fresh?</h3>
      <p id="freshText">All progress will be cleared. This cannot be undone.</p>
      <div class="modal-acts">
        <button class="cancel" onclick="closeFreshModal()">Cancel</button>
        <button class="confirm" onclick="confirmFresh()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>
<script>
var DATE = '20260630';
var QUIZ_KEY = 'quiz_siongrammar_20_' + DATE + '_v1';
var ATT_KEY  = 'quiz_siongrammar_att_' + DATE + '_v1';
var ORDER_KEY = QUIZ_KEY + '_order_v1';

var RAW_QUESTIONS = [
  {topic:'Transitions',
   ctx:'The governor\'s proposal to expand public transit initially attracted strong criticism from fiscal conservatives. _____ a bipartisan coalition eventually rallied behind the plan after independent analysts confirmed its long-term cost savings.',
   q:'Which choice completes the text with the most logical transition?',
   opts:['Consequently,','Furthermore,','Nevertheless,','Indeed,'], ci:2,
   exp:'"Nevertheless" signals contrast: despite the initial criticism, support eventually emerged. "Consequently" and "Furthermore" both continue or build on the same idea rather than introducing an opposing outcome. "Indeed" reinforces the previous point rather than contrasting with it.'},
  {topic:'Subject-Verb Agreement',
   ctx:'The team of engineers, along with several specialists from the university, [_____] been consulting on the project for over two years.',
   q:'Which choice most accurately completes the sentence according to the conventions of Standard English?',
   opts:['has','have','are','were'], ci:0,
   exp:'"Team" is the grammatical subject, a singular noun. The phrase "along with several specialists from the university" is a prepositional modifier that does not change the subject\'s number. A singular subject requires the singular "has," not the plural "have," "are," or "were."'},
  {topic:'Parallel Structure',
   ctx:'The professor argued that the most effective study techniques include creating detailed outlines, reviewing material in spaced intervals, and [_____] practice questions to self-test understanding.',
   q:'Which choice maintains the parallel structure of the sentence?',
   opts:['to generate','generating','when generating','the generation of'], ci:1,
   exp:'"Generating" is parallel with "creating" and "reviewing" - all present participles. "To generate" is an infinitive, "when generating" adds an unnecessary conjunction, and "the generation of" shifts to a noun phrase, each breaking the established parallel pattern.'},
  {topic:'Pronoun Reference',
   ctx:'After the lead investigator interviewed the witness, [_____] submitted a detailed report to the department.',
   q:'Which choice most clearly identifies who submitted the report?',
   opts:['she','they','the lead investigator','it'], ci:2,
   exp:'"She" is ambiguous because it could refer either to the lead investigator or to the witness. "They" is plural and does not match either singular noun. "It" cannot refer to a person. Only "the lead investigator" unambiguously identifies the person who submitted the report.'},
  {topic:'Modifier Placement',
   ctx:'Traveling at nearly 18,000 miles per hour, [_____].',
   q:'Which choice correctly completes the sentence without creating a dangling modifier?',
   opts:['satellites must withstand extreme temperature variations as they orbit Earth','the orbital path of satellites takes them around Earth repeatedly','Earth is orbited by satellites at extreme speed','extreme temperatures are experienced by satellites in orbit'], ci:0,
   exp:'"Satellites must withstand" correctly places "satellites" immediately after the participial phrase, making clear that the satellites are what travel at 18,000 miles per hour. In the other options, the grammatical subject of the main clause (the orbital path, Earth, extreme temperatures) is not the thing doing the traveling, creating a dangling modifier.'},
  {topic:'Apostrophe Usage',
   ctx:'The organization announced that [_____] research grant program would expand to include candidates from previously underrepresented countries.',
   q:'Which choice most accurately completes the sentence?',
   opts:['its','it\'s','their','they\'re'], ci:0,
   exp:'"Its" is the possessive pronoun and correctly shows that the grant program belongs to the organization. "It\'s" is a contraction of "it is" and would produce the grammatically incorrect "it is research grant program." "Their" and "they\'re" are plural forms that do not agree with the singular antecedent "organization."'},
  {topic:'Concision',
   ctx:'The new legislation will fundamentally change and alter the way that medical providers must document patient information.',
   q:'Which version of the highlighted portion is most concise without changing the intended meaning?',
   opts:['fundamentally change and alter the way that','fundamentally alter the manner in which','change and essentially transform how','fundamentally change the way'], ci:3,
   exp:'"Change and alter" is redundant because the two words are synonyms. "Fundamentally change the way" conveys the full meaning with no redundancy. "Fundamentally alter the manner in which" replaces the redundant pair with one verb but swaps the concise "way" for the wordy "manner in which." "Change and essentially transform" also contains a redundant pair.'},
  {topic:'Verb Tense',
   ctx:'By the time the rescue team arrived at the crash site, the survivors [_____] shelter using debris from the wreckage.',
   q:'Which choice most accurately completes the sentence?',
   opts:['construct','constructed','had constructed','were constructing'], ci:2,
   exp:'The past perfect "had constructed" indicates an action completed before another past event. The rescue team "arrived" in the simple past; the construction of shelter was completed prior to that arrival. "Constructed" (simple past) implies the two actions were simultaneous. "Were constructing" (past progressive) suggests ongoing activity at the moment of arrival, not completion.'},
  {topic:'Punctuation',
   ctx:'The early mapping of neural connections suggested that memory formation was localized to the hippocampus; _____ subsequent research revealed that multiple brain regions work together to store and retrieve memories.',
   q:'Which choice best completes the text?',
   opts:['and so','however,','because','so that'], ci:1,
   exp:'"However," introduces the contrast between the early (incorrect) view and what later research revealed - the exact logical relationship the semicolon is joining. "And so" would incorrectly suggest the new findings resulted from the old view. "Because" and "so that" introduce dependent clauses, which cannot follow a semicolon joining two independent clauses.'},
  {topic:'Transitions',
   ctx:'Many technological innovations initially met with skepticism from the scientific community. _____ the first proposals for heavier-than-air flight were dismissed by prominent physicists in the late nineteenth century.',
   q:'Which choice completes the text with the most logical transition?',
   opts:['Therefore,','For example,','Despite this,','On the other hand,'], ci:1,
   exp:'"For example" signals that the dismissal of flight proposals is a specific instance of the general claim in the previous sentence. "Therefore" implies causation rather than illustration. "Despite this" introduces an unexpected contrast, but the second sentence supports rather than contradicts the first. "On the other hand" also signals contrast.'},
  {topic:'Subject-Verb Agreement',
   ctx:'Either the director or the two lead actors [_____] expected to arrive at the venue before the ceremony begins.',
   q:'Which choice most accurately completes the sentence?',
   opts:['is','are','was','were'], ci:1,
   exp:'When subjects are joined by "either...or," the verb agrees with the subject closest to it. "The two lead actors" (plural) is the subject nearest the verb, so the plural "are" is required. If the order were reversed ("either the two lead actors or the director"), "is" would be correct.'},
  {topic:'Parallel Structure',
   ctx:'The historian\'s book covers three key aspects of ancient Roman society: the organization of military campaigns, the administration of conquered territories, and [_____].',
   q:'Which choice maintains the parallel structure of the list?',
   opts:['how trade routes were established','trade route establishment','the establishment of trade routes','establishing trade routes'], ci:2,
   exp:'The list consists of noun phrases beginning with "the organization of" and "the administration of." To maintain parallel structure, the third item must follow the same pattern: "the establishment of trade routes." "How trade routes were established" shifts to a clause. "Trade route establishment" is a noun but does not follow the same grammatical pattern. "Establishing trade routes" is a gerund phrase.'},
  {topic:'Relative Clauses',
   ctx:'The novel [_____] won the Booker Prize was published by a first-time author from South Africa.',
   q:'Which choice correctly completes the sentence?',
   opts:['that','which','who','whom'], ci:0,
   exp:'"That" introduces a restrictive relative clause that identifies specifically which novel is meant. No commas set off the clause, confirming it is restrictive. "Which" is used only for non-restrictive (parenthetical) clauses that require commas. "Who" and "whom" are reserved for people, not things like a novel.'},
  {topic:'Apostrophe Usage',
   ctx:'The three [_____] presentations all focused on the same problem but proposed very different solutions.',
   q:'Which choice correctly shows possession?',
   opts:['scientist\'s','scientists\'','scientists\'s','scientists'], ci:1,
   exp:'"Scientists\'" is the plural possessive. Three scientists possess the presentations, so the apostrophe follows the plural "scientists." "Scientist\'s" is singular possessive (only one scientist). "Scientists\'s" is not a standard form. "Scientists" with no apostrophe is simply the plural noun with no possessive meaning.'},
  {topic:'Concision',
   ctx:'The committee ultimately decided to postpone the vote [_____] further investigation into the allegations.',
   q:'Which choice most concisely and accurately completes the sentence?',
   opts:['until a later point in time, pending','until later, pending','to a future date, pending','at a subsequent point in time, pending'], ci:1,
   exp:'"Until later, pending" is the most concise option. "Until a later point in time" is wordy because "a later point in time" means the same as "later." "To a future date" changes the preposition in a way that is slightly less idiomatic. "At a subsequent point in time" is the wordiest option and replaces simple "later" with a multi-word phrase.'},
  {topic:'Verb Tense',
   ctx:'If the government had invested in early childhood education two decades ago, the national literacy rates [_____] significantly higher today.',
   q:'Which choice most accurately completes the sentence?',
   opts:['will be','would be','would have been','are'], ci:1,
   exp:'This is a mixed conditional: the "if" clause uses past perfect ("had invested") to describe an unreal past condition, and the main clause describes the hypothetical present result. "Would be" correctly expresses the present-tense consequence of an unreal past event. "Would have been" is used when both the condition and the result are hypothetical past events, not when the result is a current state.'},
  {topic:'Punctuation',
   ctx:'The director cited three reasons for the film\'s commercial failure: poor marketing, an overcrowded release schedule, and [_____] what she described as an overly challenging narrative structure.',
   q:'Which choice best completes the text?',
   opts:['most importantly,','additionally,','finally,',''], ci:3,
   exp:'The sentence introduces a list of three items after a colon. The first two items contain no transitional words, so adding one before only the third item ("finally,") would be inconsistent and unnecessary. No transition is needed: the list flows naturally from the colon without extra connectives between items.'},
  {topic:'Relative Clauses',
   ctx:'The scientist, [_____] discovered the compound in 1987, published her findings in three leading journals over the next decade.',
   q:'Which choice correctly completes the sentence?',
   opts:['who','that','which','whose work'], ci:0,
   exp:'"Who" introduces a non-restrictive clause about a person. The commas around the clause confirm it is non-restrictive (the information is supplementary, not identifying). "That" cannot introduce a non-restrictive clause. "Which" is used for things, not people. "Whose work" would require restructuring the entire clause and changes the meaning.'},
  {topic:'Transitions',
   ctx:'The city\'s new recycling program diverts thousands of tons of waste from landfills each year. _____ residents have raised concerns about the frequency of collection and the complexity of sorting requirements.',
   q:'Which choice completes the text with the most logical transition?',
   opts:['Even so,','As a result,','For instance,','In other words,'], ci:0,
   exp:'"Even so" signals concession: despite the program\'s success at diverting waste, there are still resident concerns. "As a result" would imply the concerns arose from the diversion success, which is illogical. "For instance" would present the concerns as an example of the success, which contradicts the meaning. "In other words" signals restatement, not contrast.'},
  {topic:'Subject-Verb Agreement',
   ctx:'The discovery of previously unknown cave paintings, along with thousands of carved bone fragments, [_____] archaeologists to reconsider the timeline of human artistic development in this region.',
   q:'Which choice most accurately completes the sentence?',
   opts:['have prompted','are prompting','has prompted','were prompting'], ci:2,
   exp:'"Discovery" is the grammatical subject, a singular noun. The intervening phrase "along with thousands of carved bone fragments" does not change the subject. The singular present-perfect verb "has prompted" correctly agrees with "discovery" and describes the current effect of a past find. "Have prompted" and "are prompting" are plural. "Were prompting" shifts to the past progressive, inconsistent with the present-tense context.'}
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function identityOrder(){var o=[];for(var i=0;i<RAW_QUESTIONS.length;i++)o.push(i);return o;}
function isValidOrder(arr){if(!Array.isArray(arr)||arr.length!==RAW_QUESTIONS.length)return false;var s=arr.slice().sort(function(a,b){return a-b;});for(var i=0;i<s.length;i++)if(s[i]!==i)return false;return true;}
function loadOrder(){try{var r=localStorage.getItem(ORDER_KEY);if(!r)return null;var a=JSON.parse(r);if(!isValidOrder(a))throw new Error('bad');return a;}catch(e){localStorage.removeItem(ORDER_KEY);return null;}}
function saveOrder(o){try{localStorage.setItem(ORDER_KEY,JSON.stringify(o));}catch(e){}}
function buildQuestions(raw,order){var out=[];for(var i=0;i<order.length;i++)out.push(raw[order[i]]);return out;}
var currentOrder=loadOrder()||identityOrder();
var QUESTIONS=buildQuestions(RAW_QUESTIONS,currentOrder);

function defaultState(){return{cur:0,answers:{},showResults:false,timerStartedAt:null,timerTotalSec:null};}
function saveState(s){try{localStorage.setItem(QUIZ_KEY,JSON.stringify(s));}catch(e){}}
function loadState(){try{var r=localStorage.getItem(QUIZ_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
var state=loadState()||defaultState();

function loadAtt(){try{return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0;}catch(e){return 0;}}
function saveAtt(n){try{localStorage.setItem(ATT_KEY,String(n));}catch(e){}}
function renderAtt(){var el=document.getElementById('attCount');if(el)el.textContent=loadAtt();}

var timerInterval=null;
function formatTime(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function renderTimer(){
  var setup=document.getElementById('timerSetup'),run=document.getElementById('timerRunning'),disp=document.getElementById('timerDisplay');
  if(!setup)return;
  if(!state.timerStartedAt){setup.style.display='flex';run.style.display='none';return;}
  setup.style.display='none';run.style.display='flex';
  var elapsed=(Date.now()-state.timerStartedAt)/1000,rem=state.timerTotalSec-elapsed;
  disp.classList.remove('warn','danger');
  if(rem<=0){disp.textContent="Time's Up";disp.classList.add('danger');stopTimerInterval();return;}
  disp.textContent=formatTime(rem);
  if(rem<=state.timerTotalSec*0.1)disp.classList.add('danger');
  else if(rem<=state.timerTotalSec*0.25)disp.classList.add('warn');
}
function startTimer(){var inp=document.getElementById('timerMin');var m=parseFloat(inp.value)||25;state.timerTotalSec=Math.round(m*60);state.timerStartedAt=Date.now();saveState(state);renderTimer();startTimerInterval();}
function startTimerInterval(){stopTimerInterval();timerInterval=setInterval(renderTimer,1000);}
function stopTimerInterval(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+QUESTIONS.length;
  document.getElementById('prog-fill').style.width=(ans/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel=document.getElementById('dot-panel');if(panel.style.display==='none')return;
  var h='';
  for(var i=0;i<QUESTIONS.length;i++){
    var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===QUESTIONS[i].ci?'#185FA5':'#E24B4A');
    h+='<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
  }
  panel.innerHTML=h;
}
function toggleJump(){
  var p=document.getElementById('dot-panel'),b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}
  else{p.style.display='none';b.textContent='Jump ▾';}
}
function goToQ(i){state.cur=i;state.showResults=false;saveState(state);document.getElementById('dot-panel').style.display='none';document.getElementById('jump-btn').textContent='Jump ▾';render();}
function pick(optIdx){if(state.answers[state.cur]!==undefined)return;state.answers[state.cur]=optIdx;saveState(state);render();}
function goPrev(){if(state.cur>0){state.cur--;saveState(state);render();}}
function goNext(){
  if(state.cur<QUESTIONS.length-1){state.cur++;saveState(state);render();}
  else{if(!state.showResults){var a=loadAtt()+1;saveAtt(a);renderAtt();}state.showResults=true;saveState(state);render();}
}
function render(){
  var c=document.getElementById('qcard');
  if(state.showResults){renderResults();return;}
  var q=QUESTIONS[state.cur],ans=state.answers[state.cur],done=ans!==undefined;
  var isLast=state.cur===QUESTIONS.length-1;
  var optsH='';
  for(var i=0;i<q.opts.length;i++){
    var cls='opt';
    if(done){if(i===q.ci)cls+=' correct';else if(i===ans)cls+=' wrong';}
    optsH+='<button class="'+cls+'"'+(done?' disabled':'')+' onclick="pick('+i+')">'+q.opts[i]+'</button>';
  }
  var expH=done&&ans!==q.ci?'<div class="exp" style="display:block">'+q.exp+'</div>':'';
  var nextLbl=isLast?'See Results &#8594;':'Next &#8594;';
  c.innerHTML='<div class="card"><div class="q-num">Q'+(state.cur+1)+' of '+QUESTIONS.length+'</div><span class="topic-tag">'+q.topic+'</span><div class="context-box">'+q.ctx+'</div><div class="q-text">'+q.q+'</div><div class="opts">'+optsH+'</div>'+expH+'</div><div class="nav-btns"><button '+(state.cur===0?'disabled':'')+' onclick="goPrev()">&#8592; Prev</button><button onclick="goNext()">'+nextLbl+'</button></div>';
  updateNav();
}
function renderResults(){
  var correct=0,wrong=0,skip=0;
  for(var i=0;i<QUESTIONS.length;i++){if(state.answers[i]===undefined)skip++;else if(state.answers[i]===QUESTIONS[i].ci)correct++;else wrong++;}
  var pct=Math.round(correct/QUESTIONS.length*100);
  document.getElementById('qcard').innerHTML='<div class="results"><div class="score-big">'+correct+'/'+QUESTIONS.length+'</div><div class="score-lbl">'+pct+'% correct</div><div class="stats-row"><div><div class="stat-n" style="color:#1D9E75">'+correct+'</div><div class="stat-lbl">Correct</div></div><div><div class="stat-n" style="color:#E24B4A">'+wrong+'</div><div class="stat-lbl">Wrong</div></div><div><div class="stat-n" style="color:#888">'+skip+'</div><div class="stat-lbl">Skipped</div></div></div><button class="res-btn btn-copy" onclick="copyRes()">Copy All Results</button><button class="res-btn btn-retry" onclick="retryWrong()">Retry Wrong Ones</button><button class="res-btn btn-fresh" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button><button class="res-btn btn-fresh" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button></div>';
  updateNav();
}
function copyRes(){
  var correct=0,lines=['[Sion] SAT Grammar Results'];
  for(var i=0;i<QUESTIONS.length;i++){var q=QUESTIONS[i],a=state.answers[i],ok=a===q.ci;if(ok)correct++;lines.push('Q'+(i+1)+' ['+q.topic+'] '+(a===undefined?'SKIP':ok?'OK':'WRONG')+' ('+q.opts[q.ci]+')');}
  lines.push('Score: '+correct+'/'+QUESTIONS.length);
  try{navigator.clipboard.writeText(lines.join('\n'));}catch(e){alert(lines.join('\n'));}
}
function retryWrong(){
  var wrong=[];
  for(var i=0;i<QUESTIONS.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==QUESTIONS[i].ci){wrong.push(i);delete state.answers[i];}}
  if(wrong.length>0){state.cur=wrong[0];state.showResults=false;saveState(state);render();}
}
var pendingFreshMode='original';
function openFreshModalOriginal(){pendingFreshMode='original';document.getElementById('freshTitle').textContent='Start Fresh (Original Order)?';document.getElementById('freshText').textContent='Questions return to their original order and all progress is cleared.';document.getElementById('freshModal').classList.add('show');}
function openFreshModalRandom(){pendingFreshMode='random';document.getElementById('freshTitle').textContent='Start Fresh (Random Order)?';document.getElementById('freshText').textContent='Questions will be reshuffled and all progress is cleared.';document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function confirmFresh(){currentOrder=(pendingFreshMode==='random')?shuffle(identityOrder()):identityOrder();saveOrder(currentOrder);QUESTIONS=buildQuestions(RAW_QUESTIONS,currentOrder);state=defaultState();saveState(state);stopTimerInterval();closeFreshModal();render();renderTimer();}
window.toggleJump=toggleJump;window.goToQ=goToQ;window.pick=pick;window.goPrev=goPrev;window.goNext=goNext;
window.startTimer=startTimer;window.copyRes=copyRes;window.retryWrong=retryWrong;
window.openFreshModalOriginal=openFreshModalOriginal;window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;window.confirmFresh=confirmFresh;
render();renderTimer();if(state.timerStartedAt)startTimerInterval();renderAtt();
</script>
