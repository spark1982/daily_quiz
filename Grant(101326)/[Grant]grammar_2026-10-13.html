var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261013";
var RAW_QUESTIONS = [{"passage": "<strong>An Email to Grandma</strong><br><i>Dear Grandma,</i><br><b>(1)</b> Our soccer team finally played in the Fall Classic tournament last weekend. <b>(2)</b> <u>Sam and I</u> were both chosen to start in the first game. <b>(3)</b> By halftime, we <u>had ran</u> so much that my legs felt like noodles. <b>(4)</b> Our goalie made three amazing saves. <b>(5)</b> The other team still won by one goal. <b>(6)</b> If we win our next game we will play in the championship. <b>(7)</b> I hope you can come and watch us play!", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "Me and Sam", "Sam and myself", "Sam and me"], "ci": 0, "exp": "<i>Sam and I</i> is the subject of the sentence (they <i>were chosen</i>), so use the subject pronoun <i>I</i>. Test it alone: <i>I were chosen</i> &rarr; <i>I was chosen</i>, never <i>me was chosen</i>. It is already correct.", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"passage": "<strong>An Email to Grandma</strong><br><i>Dear Grandma,</i><br><b>(1)</b> Our soccer team finally played in the Fall Classic tournament last weekend. <b>(2)</b> <u>Sam and I</u> were both chosen to start in the first game. <b>(3)</b> By halftime, we <u>had ran</u> so much that my legs felt like noodles. <b>(4)</b> Our goalie made three amazing saves. <b>(5)</b> The other team still won by one goal. <b>(6)</b> If we win our next game we will play in the championship. <b>(7)</b> I hope you can come and watch us play!", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["had run", "NO CHANGE", "have ran", "had runned"], "ci": 0, "exp": "After <i>had</i>, use the past participle. The past participle of <i>run</i> is <i>run</i>, not <i>ran</i>: <i>By halftime, we <b>had run</b> so much&hellip;</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"passage": "<strong>An Email to Grandma</strong><br><i>Dear Grandma,</i><br><b>(1)</b> Our soccer team finally played in the Fall Classic tournament last weekend. <b>(2)</b> <u>Sam and I</u> were both chosen to start in the first game. <b>(3)</b> By halftime, we <u>had ran</u> so much that my legs felt like noodles. <b>(4)</b> Our goalie made three amazing saves. <b>(5)</b> The other team still won by one goal. <b>(6)</b> If we win our next game we will play in the championship. <b>(7)</b> I hope you can come and watch us play!", "stem": "What is the best way to combine sentences 4 and 5?", "opts": ["Our goalie made three amazing saves the other team still won by one goal.", "Our goalie made three amazing saves, but the other team still won by one goal.", "Our goalie made three amazing saves, so the other team still won by one goal.", "Because our goalie made three amazing saves, the other team still won by one goal."], "ci": 1, "exp": "The saves and the loss go against each other, so join them with <i>but</i> and a comma. <i>So</i> and <i>because</i> wrongly say the saves caused the loss, and joining the two sentences with no word or comma makes a run-on.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}, {"passage": "<strong>An Email to Grandma</strong><br><i>Dear Grandma,</i><br><b>(1)</b> Our soccer team finally played in the Fall Classic tournament last weekend. <b>(2)</b> <u>Sam and I</u> were both chosen to start in the first game. <b>(3)</b> By halftime, we <u>had ran</u> so much that my legs felt like noodles. <b>(4)</b> Our goalie made three amazing saves. <b>(5)</b> The other team still won by one goal. <b>(6)</b> If we win our next game we will play in the championship. <b>(7)</b> I hope you can come and watch us play!", "stem": "Where should a comma be added in sentence 6?", "opts": ["If we win our next game, we will play in the championship.", "If, we win our next game we will play in the championship.", "If we win our next game we will play, in the championship.", "If we win, our next game we will play in the championship."], "ci": 0, "exp": "When a sentence starts with an <i>if</i> part, put a comma where that part ends: <i>If we win our next game<b>,</b> we will play in the championship.</i>", "tag": "Commas", "tagcolor": "#d6336c"}, {"passage": "<strong>Camping Journal</strong><br><b>(1)</b> Tonight is our second night camping at Clinton Lake. <b>(2)</b> I <u>have never swam</u> in water as cold as the lake was this morning. <b>(3)</b> After lunch, we hiked to a rocky cliff, and Dad <u>points</u> out a bald eagle&rsquo;s nest. <b>(4)</b> The eagles nest was as big as a bathtub. <b>(5)</b> Our sleeping bags got soaked during the afternoon storm. <b>(6)</b> Because we had left the tent flap open. <b>(7)</b> Tomorrow I will dry everything in the sun.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["has never swum", "have never swimmed", "NO CHANGE", "have never swum"], "ci": 3, "exp": "After <i>have</i>, use the past participle. The past participle of <i>swim</i> is <i>swum</i>: <i>I <b>have never swum</b> in water as cold&hellip;</i> (<i>Swam</i> is the simple past, used without <i>have</i>.)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"passage": "<strong>Camping Journal</strong><br><b>(1)</b> Tonight is our second night camping at Clinton Lake. <b>(2)</b> I <u>have never swam</u> in water as cold as the lake was this morning. <b>(3)</b> After lunch, we hiked to a rocky cliff, and Dad <u>points</u> out a bald eagle&rsquo;s nest. <b>(4)</b> The eagles nest was as big as a bathtub. <b>(5)</b> Our sleeping bags got soaked during the afternoon storm. <b>(6)</b> Because we had left the tent flap open. <b>(7)</b> Tomorrow I will dry everything in the sun.", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["pointed", "is pointing", "NO CHANGE", "will point"], "ci": 0, "exp": "The sentence tells what happened after lunch in the past (<i>we hiked</i>), so the second verb must also be past: <i>Dad <b>pointed</b> out a bald eagle&rsquo;s nest.</i> Don&rsquo;t switch to present or future in the middle.", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5"}, {"passage": "<strong>Camping Journal</strong><br><b>(1)</b> Tonight is our second night camping at Clinton Lake. <b>(2)</b> I <u>have never swam</u> in water as cold as the lake was this morning. <b>(3)</b> After lunch, we hiked to a rocky cliff, and Dad <u>points</u> out a bald eagle&rsquo;s nest. <b>(4)</b> The eagles nest was as big as a bathtub. <b>(5)</b> Our sleeping bags got soaked during the afternoon storm. <b>(6)</b> Because we had left the tent flap open. <b>(7)</b> Tomorrow I will dry everything in the sun.", "stem": "Which of these sentences contains an error in grammar or punctuation?", "opts": ["The eagles nest was as big as a bathtub.", "Tomorrow I will dry everything in the sun.", "Tonight is our second night camping at Clinton Lake.", "Our sleeping bags got soaked during the afternoon storm."], "ci": 0, "exp": "The nest belongs to one eagle, so it needs an apostrophe: <i>The <b>eagle&rsquo;s</b> nest was as big as a bathtub.</i> The other three sentences are correct.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a"}, {"passage": "<strong>Camping Journal</strong><br><b>(1)</b> Tonight is our second night camping at Clinton Lake. <b>(2)</b> I <u>have never swam</u> in water as cold as the lake was this morning. <b>(3)</b> After lunch, we hiked to a rocky cliff, and Dad <u>points</u> out a bald eagle&rsquo;s nest. <b>(4)</b> The eagles nest was as big as a bathtub. <b>(5)</b> Our sleeping bags got soaked during the afternoon storm. <b>(6)</b> Because we had left the tent flap open. <b>(7)</b> Tomorrow I will dry everything in the sun.", "stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Our sleeping bags got soaked during the afternoon storm, we had left the tent flap open.", "Our sleeping bags got soaked during the afternoon storm because we had left the tent flap open.", "Our sleeping bags got soaked during the afternoon storm, because, we had left the tent flap open.", "Because our sleeping bags got soaked during the afternoon storm, we had left the tent flap open."], "ci": 1, "exp": "Sentence 6 is a fragment (a <i>because</i> part with no main sentence). Attach it to sentence 5: <i>&hellip;got soaked <b>because</b> we had left the tent flap open.</i> A comma alone makes a comma splice, and moving <i>because</i> to the front changes the meaning.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}, {"passage": "<strong>Busy Honeybees</strong><br><b>(1)</b> A single honeybee colony can hold more than 50,000 bees. <b>(2)</b> The workers in each hive <u>does</u> almost all of the jobs. <b>(3)</b> The queen, <u>who</u> lays up to 2,000 eggs a day, rarely leaves the hive. <b>(4)</b> Worker bees fly from flower to flower and collect sweet nectar. <b>(5)</b> Back at the hive, they dance <u>good</u> enough to show other bees exactly where the flowers are. <b>(6)</b> Neither the drones nor the queen make honey. <b>(7)</b> Without bees, many fruits and vegetables would be hard to grow.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["doing", "NO CHANGE", "do", "has done"], "ci": 2, "exp": "The subject is <i>workers</i> (plural); <i>in each hive</i> just describes them. A plural subject needs a plural verb: <i>The workers in each hive <b>do</b> almost all of the jobs.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>Busy Honeybees</strong><br><b>(1)</b> A single honeybee colony can hold more than 50,000 bees. <b>(2)</b> The workers in each hive <u>does</u> almost all of the jobs. <b>(3)</b> The queen, <u>who</u> lays up to 2,000 eggs a day, rarely leaves the hive. <b>(4)</b> Worker bees fly from flower to flower and collect sweet nectar. <b>(5)</b> Back at the hive, they dance <u>good</u> enough to show other bees exactly where the flowers are. <b>(6)</b> Neither the drones nor the queen make honey. <b>(7)</b> Without bees, many fruits and vegetables would be hard to grow.", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["whom", "which", "whose", "NO CHANGE"], "ci": 3, "exp": "Use <i>who</i> for a person or animal treated like a person when it is the subject of the describing part (<i>who lays eggs</i>). It is already correct.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>Busy Honeybees</strong><br><b>(1)</b> A single honeybee colony can hold more than 50,000 bees. <b>(2)</b> The workers in each hive <u>does</u> almost all of the jobs. <b>(3)</b> The queen, <u>who</u> lays up to 2,000 eggs a day, rarely leaves the hive. <b>(4)</b> Worker bees fly from flower to flower and collect sweet nectar. <b>(5)</b> Back at the hive, they dance <u>good</u> enough to show other bees exactly where the flowers are. <b>(6)</b> Neither the drones nor the queen make honey. <b>(7)</b> Without bees, many fruits and vegetables would be hard to grow.", "stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["gooder", "more good", "NO CHANGE", "well"], "ci": 3, "exp": "<i>Dance</i> is an action, so it needs an adverb: <i>they dance <b>well</b> enough</i>. <i>Good</i> describes nouns (a good dancer); <i>well</i> describes how something is done.", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"passage": "<strong>Busy Honeybees</strong><br><b>(1)</b> A single honeybee colony can hold more than 50,000 bees. <b>(2)</b> The workers in each hive <u>does</u> almost all of the jobs. <b>(3)</b> The queen, <u>who</u> lays up to 2,000 eggs a day, rarely leaves the hive. <b>(4)</b> Worker bees fly from flower to flower and collect sweet nectar. <b>(5)</b> Back at the hive, they dance <u>good</u> enough to show other bees exactly where the flowers are. <b>(6)</b> Neither the drones nor the queen make honey. <b>(7)</b> Without bees, many fruits and vegetables would be hard to grow.", "stem": "Which of these sentences contains an error in grammar or punctuation?", "opts": ["Neither the drones nor the queen make honey.", "A single honeybee colony can hold more than 50,000 bees.", "Without bees, many fruits and vegetables would be hard to grow.", "Worker bees fly from flower to flower and collect sweet nectar."], "ci": 0, "exp": "With <i>neither&hellip;nor</i>, the verb matches the subject closer to it. <i>Queen</i> is singular, so: <i>Neither the drones nor the queen <b>makes</b> honey.</i> The other sentences are correct.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>The Runaway Puppy</strong><br><b>(1)</b> Maya searched the whole park for her puppy, Biscuit. <b>(2)</b> She stopped a jogger and asked<u>, &ldquo;have you seen a little brown dog?&rdquo;</u> <b>(3)</b> The jogger pointed toward the pond and said that she <u>had seen</u> a puppy chasing ducks there. <b>(4)</b> Maya raced down the path as fast as she could. <b>(5)</b> When she got there Biscuit was sitting happily in the mud. <b>(6)</b> &ldquo;You <u>could of</u> gotten lost forever,&rdquo; Maya said as she hugged him. <b>(7)</b> That night, Biscuit got a very long bath.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": [", Have you seen a little brown dog?", "NO CHANGE", "&ldquo;Have you seen a little brown dog&rdquo;?", ", &ldquo;Have you seen a little brown dog?&rdquo;"], "ci": 3, "exp": "A quotation starts with a capital letter, and the question mark goes inside the quotation marks because the words in quotes are the question: <i>asked, &ldquo;<b>H</b>ave you seen a little brown dog?&rdquo;</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057"}, {"passage": "<strong>The Runaway Puppy</strong><br><b>(1)</b> Maya searched the whole park for her puppy, Biscuit. <b>(2)</b> She stopped a jogger and asked<u>, &ldquo;have you seen a little brown dog?&rdquo;</u> <b>(3)</b> The jo that she <u>had seen</u> a puppy chasing ducks there. <b>(4)</b> Maya raced down the path as fast as she could. <b>(5)</b> When she got there Biscuit was sitting happily in the mud. <b>(6)</b> &ldquo;You <u>could of</u> gotten lost forever,&rdquo; Maya said as she hugged him. <b>(7)</b> That night, Biscuit got a very long bath.", "stem": "Where should a comma be added in sentence 5?", "opts": ["When she got there, Biscuit was sitting happily in the mud.", "When, she got there Biscuit was sitting happily in the mud.", "When she got there Biscuit was sitting, happily in the mud.", "When she got there Biscuit, was sitting happily in the mud."], "ci": 0, "exp": "Put a comma after a <i>when</i> part that starts a sentence: <i>When she got there<b>,</b> Biscuit was sitting happily in the mud.</i>", "tag": "Commas", "tagcolor": "#d6336c"}, {"passage": "<strong>Notice: Book Fair This Week</strong><br><b>(1)</b> Our school&rsquo;s fall Book Fair opens in the library on Wednesday. <b>(2)</b> <u>Hundreds of new books, posters, and bookmarks.</u> <b>(3)</b> This year the library is bigger, so the fair has doubled <u>its</u> space. <b>(4)</b> Students may visit with their class or come after school with a parent. <b>(5)</b> Our librarian asked my friends and I to make the welcome posters. <b>(6)</b> Shoppers can pay with cash. <b>(7)</b> They can also pay with a check from a parent.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "Hundreds of new books, posters, and bookmarks for sale.", "There will be hundreds of new books, posters, and bookmarks.", "Hundreds of new books, posters, and, bookmarks."], "ci": 2, "exp": "Sentence 2 has no verb, so it is a fragment. Adding <i>There will be</i> gives it a subject and verb: <i><b>There will be</b> hundreds of new books, posters, and bookmarks.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}, {"passage": "<strong>Notice: Book Fair This Week</strong><br><b>(1)</b> Our school&rsquo;s fall Book Fair opens in the library on Wednesday. <b>(2)</b> <u>Hundreds of new books, posters, and bookmarks.</u> <b>(3)</b> This year the library is bigger, so the fair has doubled <u>its</u> space. <b>(4)</b> Students may visit with their class or come after school with a parent. <b>(5)</b> Our librarian asked my friends and I to make the welcome posters. <b>(6)</b> Shoppers can pay with cash. <b>(7)</b> They can also pay with a check from a parent.", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "their", "it&rsquo;s", "its&rsquo;"], "ci": 0, "exp": "<i>Its</i> (no apostrophe) means &ldquo;belonging to it&rdquo; &mdash; the space belongs to the fair. <i>It&rsquo;s</i> means &ldquo;it is,&rdquo; and the fair is one thing, so not <i>their</i>. It is already correct.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a"}, {"passage": "<strong>Notice: Book Fair This Week</strong><br><b>(1)</b> Our school&rsquo;s fall Book Fair opens in the library on Wednesday. <b>(2)</b> <u>Hundreds of new books, posters, and bookmarks.</u> <b>(3)</b> This year the library is bigger, so the fair has doubled <u>its</u> space. <b>(4)</b> Students may visit with their class or come after school with a parent. <b>(5)</b> Our librarian asked my friends and I to make the welcome posters. <b>(6)</b> Shoppers can pay with cash. <b>(7)</b> They can also pay with a check from a parent.", "stem": "Which of these sentences contains an error in grammar or punctuation?", "opts": ["Our school&rsquo;s fall Book Fair opens in the library on Wednesday.", "Students may visit with their class or come after school with a parent.", "Our librarian asked my friends and I to make the welcome posters.", "Shoppers can pay with cash."], "ci": 2, "exp": "<i>My friends and I</i> is the object of <i>asked</i>, so use the object pronoun: <i>asked my friends and <b>me</b></i>. Test it alone: <i>asked me</i>, not <i>asked I</i>. The other sentences are correct.", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"passage": "<strong>Notice: Book Fair This Week</strong><br><b>(1)</b> Our school&rsquo;s fall Book Fair opens in the library on Wednesday. <b>(2)</b> <u>Hundreds of new books, posters, and bookmarks.</u> <b>(3)</b> This year the library is bigger, so the fair has doubled <u>its</u> space. <b>(4)</b> Students may visit with their class or come after school with a parent. <b>(5)</b> Our librarian asked my friends and I to make the welcome posters. <b>(6)</b> Shoppers can pay with cash. <b>(7)</b> They can also pay with a check from a parent.", "stem": "What is the best way to combine sentences 6 and 7?", "opts": ["Shoppers can pay with both cash, or a check from a parent.", "Shoppers can pay with neither cash nor a check from a parent.", "Shoppers can pay with either cash or a check from a parent.", "Shoppers can pay with cash, they can also pay with a check from a parent."], "ci": 2, "exp": "<i>Either&hellip;or</i> joins two choices: <i>pay with <b>either</b> cash <b>or</b> a check</i>. <i>Neither&hellip;nor</i> changes the meaning (no way to pay), a comma alone makes a comma splice, and <i>both</i> must go with <i>and</i>, not <i>or</i>.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
