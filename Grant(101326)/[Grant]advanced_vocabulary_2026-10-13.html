<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Advanced Vocabulary</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Grant] Advanced Vocabulary</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>

    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully \u2014 the words around the bold word are clues.";
var TODAY_STR = "20261013";
var RAW_QUESTIONS = [{"stem": "At dinner, Grandpa loves to <b>recount</b> the day he caught a twelve-pound catfish, telling every detail just as it happened.<br><br>What does <b>recount</b> mean in this sentence?", "opts": ["make bigger than it really was", "try hard to remember", "count again", "tell the story of"], "ci": 3, "exp": "<i>recount</i> (v.) to tell the story of something that happened. (It can also mean &ldquo;count again,&rdquo; but here Grandpa is <i>telling every detail</i>.) <i>The book <b>recounts</b> the journey of the first pioneers.</i> Family: recounting (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After losing three games in a row to his sister, Leo finally had to <b>concede</b> that she was the better chess player.<br><br>What does <b>concede</b> mean in this sentence?", "opts": ["admit that something is true, even if you don&rsquo;t want to", "prove with facts", "argue loudly about", "hope secretly"], "ci": 0, "exp": "<i>concede</i> (v.) to admit, often unwillingly, that something is true or that you have lost. <i>The runner <b>conceded</b> the race when she hurt her ankle.</i> Family: concession (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Scientists studied the <b>potential</b> dangers of the volcano before letting hikers near it, even though it had not erupted in years.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>potential</b> as it is used in the sentence?", "opts": ["ancient", "possible", "certain", "visible"], "ci": 1, "exp": "<i>potential</i> (adj.) possible, but not yet real or happening. <i>Certain</i> is close to its opposite. <i>Rain is a <b>potential</b> problem for the picnic.</i> Family: potential (n.), potentially (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Scientists use a ______ system that sorts living things into groups such as mammals, birds, and reptiles.<br><br>Which form of the word fits the sentence?", "opts": ["reclassify", "classifies", "classification", "classify"], "ci": 2, "exp": "The blank describes the kind of system, so it needs the noun <i>classification</i> (the act of sorting things into groups). <i>classify</i> (v.) to sort things into groups by type. <i>We <b>classified</b> the rocks by color.</i> Family: classification (n.), class (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Before the experiment, the class read the safety ______ step by step: goggles on, gloves on, then measure the vinegar.<br><br>Which word best completes the sentence?", "opts": ["phenomenon", "procedure", "hypothesis", "statistic"], "ci": 1, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>Every fire drill follows the same <b>procedure</b>.</i> Family: procedural (adj.), proceed (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Watching the ant farm every day for a week gave Nora real <b>insight</b> into how the colony shares its work, and she finally understood why each ant had a job.<br><br>What does <b>insight</b> mean in this sentence?", "opts": ["a good memory", "a quick look", "a strong feeling of surprise", "a deep understanding"], "ci": 3, "exp": "<i>insight</i> (n.) a clear, deep understanding of something. <i>Talking with a firefighter gave us <b>insight</b> into how hard the job is.</i> Family: insightful (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Because Anchorage lies at a much higher <b>latitude</b> than Miami, it is farther north and gets far less sunlight in winter.<br><br>What does <b>latitude</b> mean in this sentence?", "opts": ["amount of land a city covers", "height above sea level", "distance east or west of a starting line", "distance north or south of the equator"], "ci": 3, "exp": "<i>latitude</i> (n.) how far a place is north or south of the equator, measured in degrees. <i>Places near the equator have a low <b>latitude</b> and warm weather.</i> Related: longitude (east&ndash;west), latitudinal (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The team practiced the trick play for weeks so they could ______ it perfectly in the championship game.<br><br>Which word best completes the sentence?", "opts": ["summarize", "classify", "execute", "abolish"], "ci": 2, "exp": "<i>execute</i> (v.) to carry out or perform a plan or action. <i>The pilot <b>executed</b> a smooth landing.</i> Family: execution (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Your teacher asks you to ______ the chapter in three sentences, telling only the most important events.<br><br>Which word best completes the sentence?", "opts": ["elaborate", "summarize", "exaggerate", "illustrate"], "ci": 1, "exp": "<i>summarize</i> (v.) to give a short statement of the main points. <i>Can you <b>summarize</b> the movie without telling every scene?</i> Family: summary (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The fox&rsquo;s reddish fur helps <b>conceal</b> it among the fallen autumn leaves, so hawks flying overhead rarely spot it.<br><br>What does <b>conceal</b> mean in this sentence?", "opts": ["help it move quietly", "make it look bigger", "keep warm", "hide from view"], "ci": 3, "exp": "<i>conceal</i> (v.) to hide something or keep it from being seen or known. <i>He tried to <b>conceal</b> the surprise gift behind his back.</i> Family: concealment (n.), concealed (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The new student was shy at first, but the coach helped ______ him into the team by pairing him with a friendly teammate.<br><br>Which word best completes the sentence?", "opts": ["integrate", "evacuate", "eliminate", "isolate"], "ci": 0, "exp": "<i>integrate</i> (v.) to bring someone or something in so it becomes part of a group. <i>The school <b>integrated</b> art into its science lessons.</i> Family: integration (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "When the family moved from sunny Arizona to snowy Minnesota, it took the kids a whole winter to <b>adapt</b> to the cold.<br><br>What does <b>adapt</b> mean in this sentence?", "opts": ["get used to new conditions", "escape from", "learn the history of", "complain about"], "ci": 0, "exp": "<i>adapt</i> (v.) to change in order to fit a new place or situation. <i>Camels have <b>adapted</b> to life in the hot desert.</i> Family: adaptation (n.), adaptable (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "For her history project, Mia arranged the photos in <b>chronological</b> order, starting with her great-grandmother&rsquo;s wedding in 1948 and ending with last summer&rsquo;s picnic.<br><br>What does <b>chronological</b> mean in this sentence?", "opts": ["arranged by the time things happened", "arranged by which family member is shown", "arranged by importance", "arranged by size"], "ci": 0, "exp": "<i>chronological</i> (adj.) arranged in the order in which things happened. <i>The timeline lists the battles in <b>chronological</b> order.</i> Family: chronology (n.), chronologically (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Radio towers on the hill <b>transmit</b> the station&rsquo;s signal, so families on faraway farms can hear the morning news.<br><br>What does <b>transmit</b> mean in this sentence?", "opts": ["block or stop", "make louder and clearer", "send from one place to another", "record and save for later"], "ci": 2, "exp": "<i>transmit</i> (v.) to send or pass something from one place or person to another. <i>The satellite will <b>transmit</b> pictures back to Earth.</i> Family: transmission (n.), transmitter (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The new library hours are <b>effective</b> Monday, so starting next week the doors will open at 8:00 a.m.<br><br>Which meaning of <b>effective</b> is used in this sentence?", "opts": ["starting to apply on that day", "actual or real, even if not official", "working well and getting good results", "making a strong, impressive impression"], "ci": 0, "exp": "<i>effective</i> usually means &ldquo;working well,&rdquo; but a rule or schedule that is <i>effective</i> on a date starts to apply then (&ldquo;starting next week&rdquo;). <i>The medicine was <b>effective</b>, and her cough went away.</i> Family: effect (n.), effectively (adv.), effectiveness (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The <b>abolition</b> of the school&rsquo;s old dress code meant students could finally wear hoodies to class.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>abolition</b> as it is used in the sentence?", "opts": ["ending", "creation", "explanation", "approval"], "ci": 0, "exp": "<i>abolition</i> (n.) the act of officially ending a law, rule, or system. <i>Creation</i> is its opposite. <i>The <b>abolition</b> of slavery in the United States came in 1865.</i> Family: abolish (v.), abolitionist (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The old train station went through a complete ______ and is now a children&rsquo;s museum.<br><br>Which form of the word fits the sentence?", "opts": ["converted", "convertible", "convert", "conversion"], "ci": 3, "exp": "After &ldquo;a complete,&rdquo; the sentence needs a noun: <i>conversion</i> (n.) the act of changing something into a different form or use. <i>convert</i> (v.) to change from one form or use to another. <i>They <b>converted</b> the garage into a playroom.</i> Family: conversion (n.), convertible (adj./n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The gray wolf is the <b>dominant</b> predator in the park; most other animals stay out of its way.<br><br>Which word means the <b>OPPOSITE</b> of <b>dominant</b> as it is used in the sentence?", "opts": ["nervous", "commanding", "ruling", "powerless"], "ci": 3, "exp": "<i>dominant</i> (adj.) most powerful or in control. Its opposite here is <i>powerless</i>; <i>commanding</i> and <i>ruling</i> mean nearly the same as dominant. <i>The <b>dominant</b> team won every game.</i> Family: dominate (v.), dominance (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Detectives made a <b>systematic</b> search of the house, checking every room in order from the attic to the basement.<br><br>Which word means the <b>OPPOSITE</b> of <b>systematic</b> as it is used in the sentence?", "opts": ["quick", "organized", "methodical", "random"], "ci": 3, "exp": "<i>systematic</i> (adj.) done step by step, following a plan. Its opposite is <i>random</i>; <i>organized</i> and <i>methodical</i> are synonyms. <i>She took a <b>systematic</b> approach to cleaning her room.</i> Family: system (n.), systematically (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Instead of painting real trees or faces, the artist made <b>abstract</b> paintings full of swirling shapes and bold colors.<br><br>Which meaning of <b>abstract</b> is used in this sentence?", "opts": ["a short summary of a longer science article", "based on ideas, so hard to picture or touch", "to take out or remove something from a larger whole", "showing shapes and colors instead of real objects"], "ci": 3, "exp": "<i>abstract</i> has several meanings: (adj.) based on ideas rather than real things; (adj.) art that uses shapes and colors instead of real objects; (n.) a short summary of a paper. Here the paintings show &ldquo;swirling shapes and bold colors&rdquo; instead of &ldquo;real trees or faces.&rdquo; <i>Freedom is an <b>abstract</b> idea.</i> Family: abstraction (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
