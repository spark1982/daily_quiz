<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}
.subtitle{text-align:center;font-size:0.85rem;color:#555;background:#fff;padding:2px 0 4px}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:2px 12px 10px}
.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}
.timer-setup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
.timer-setup label { font-weight: 700; }
.timer-setup input[type="number"] { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
.timer-start-btn { background: #185FA5; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.timer-running { display: flex; align-items: center; gap: 8px; }
.timer-label { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.02em; }
.timer-display { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
.timer-display.warn { color: #f5a623; }
.timer-display.danger { color: #E24B4A; }
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0;background:#fff;padding:8px 12px;border-radius:10px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;border:none;}
.results-pill{display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;border:none;}
.quiz-area{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.q-num{font-size:0.82rem;color:#888;}
.tag-badge{font-size:0.75rem;padding:2px 10px;border-radius:10px;background:#185FA5;color:#fff;font-weight:600;}
.passage-box,.context-box{background:#f5f7fa;border-left:3px solid #185FA5;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.92rem;color:#333;line-height:1.5;}
.q-text{font-size:1.08rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{background:#e8edf4;color:#111;border:2px solid transparent;border-radius:9px;padding:11px 14px;font-size:0.95rem;text-align:left;cursor:pointer;line-height:1.4;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn:disabled{cursor:default;}
.exp-box{margin-top:12px;padding:10px 12px;background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;font-size:0.88rem;color:#333;display:none;}
.nav-btns{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
.prev-btn,.next-btn{padding:9px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;}
.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}
.r-card.correct{background:#E1F5EE;color:#085041;}
.r-card.wrong{background:#FCEBEB;color:#501313;}
.r-card.skipped{background:#f5f7fa;color:#555;}
.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}
.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}
</style>

<body><div class="quiz-title">[Sion] Advanced SAT Reading</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Read the passage(s), then choose the best answer.</div>

<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_20260901_v1";var ATT_KEY = "quiz_sionadvreading_att_20260901_v1";var RAW_QUESTIONS = [{"stem": "Which choice completes the text with the most logical and precise word?", "passage": "The committee's decision to postpone the vote, rather than clarifying the proposal's fate, only deepened the sense of ______ among stakeholders who had expected a resolution that day.", "opts": ["certainty", "ambiguity", "resolution", "irritation"], "ci": 1, "exp": "The phrase \"rather than clarifying\" signals that the postponement left things unclear, and stakeholders expected a \"resolution\" that didn't come, so \"ambiguity\" precisely captures the deepened uncertainty. \"certainty\" and \"resolution\" both mean the opposite of what an unclarified, postponed decision would produce. \"irritation\" describes an emotional reaction, not the lack of clarity the sentence emphasizes.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"stem": "Which choice best describes the function of the phrase \"tidier story to tell\" in the text?", "passage": "For decades, textbooks credited a single naturalist with popularizing the theory of continental drift. Newly digitized correspondence, however, reveals that at least four scientists working independently exchanged data supporting the theory nearly a decade earlier. One historian, reviewing the letters, remarks that the theory's “lone genius” narrative persists largely because it is a tidier story to tell than a decentralized scientific effort.", "opts": ["It emphasizes that the four scientists deliberately fabricated their correspondence to gain credit.", "It implies that the “lone genius” account endures because it is simpler and more satisfying to relate than a more complicated, collaborative reality.", "It suggests that the traditional narrative is more historically accurate than the newly discovered correspondence indicates.", "It indicates that the historian believes the newly digitized letters should be regarded with skepticism."], "ci": 1, "exp": "The historian's remark explains why the simplified “lone genius” version of events has persisted: it is easier to tell than the messier, collaborative truth revealed by the letters, matching the correct choice. The passage never questions the letters' authenticity or accuracy, so the historian is not casting doubt on them. Nothing in the text suggests the correspondence was fabricated. The passage treats the newly discovered correspondence as more accurate, not the traditional account.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"stem": "What is the main purpose of the passage?", "passage": "A science writer begins an article by describing a common but mistaken belief that ancient sailors thought the world was flat, then presents historical evidence that scholars had calculated Earth's circumference with reasonable accuracy centuries earlier, and closes by explaining how the flat-earth myth was popularized much later, primarily through nineteenth century writers.", "opts": ["To argue that ancient sailors were more scientifically advanced than modern navigators.", "To describe the technological methods ancient scholars used to measure the Earth's circumference.", "To correct a widespread misconception by tracing its origins and contrasting it with historical evidence.", "To criticize nineteenth century writers for their lack of historical knowledge."], "ci": 2, "exp": "The passage corrects the flat-earth misconception by presenting contrary historical evidence and explaining how the myth later spread, matching the correct choice. The passage never compares ancient sailors to modern navigators. It mentions the circumference calculation as evidence but does not detail the methods used. It explains that nineteenth century writers popularized the myth but does not criticize their knowledge overall.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"stem": "Which finding, if true, would most directly support the official's claim?", "passage": "A city transportation official claims that a new downtown network of protected bike lanes reduced car congestion. After the network was completed, the city's transportation office collected data for a year to evaluate its effects.", "opts": ["Surveys found that most downtown residents were aware the bike lanes existed.", "The cost of installing the bike lanes was lower than initial estimates.", "Average car travel times through downtown decreased by 18 percent in the year after the bike lanes were completed, while bike trips downtown nearly doubled.", "The paint used for the bike lanes was more durable than the paint used on previous road markings."], "ci": 2, "exp": "Since the claim concerns reduced car congestion, a direct measurement of decreased car travel times alongside increased bike use most directly supports it. Paint durability says nothing about congestion. Public awareness of the lanes doesn't measure whether congestion changed. Installation cost is unrelated to whether congestion was reduced.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"stem": "Which choice completes the text with the most logical and precise word?", "passage": "Though the professor's lecture style was famously ______, wandering through tangents and half-finished anecdotes before circling back to the main point, students consistently rated her among the most memorable teachers they'd ever had.", "opts": ["concise", "monotonous", "rehearsed", "discursive"], "ci": 3, "exp": "\"Wandering through tangents and half-finished anecdotes before circling back\" describes a rambling, digressive style, precisely matching \"discursive.\" \"concise\" means the opposite, brief and to the point. \"rehearsed\" implies careful, practiced delivery, not wandering tangents. \"monotonous\" describes a dull, unvarying tone, not a style built on tangents and anecdotes.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"stem": "The opening rhetorical question mainly serves to", "passage": "Why would a species evolve a trait that appears to place it in greater danger? Biologists studying the peacock's elaborate tail have puzzled over this question for over a century. One influential explanation, the handicap principle, holds that only the healthiest males can afford the energetic cost and predation risk of such an extravagant display, making the tail a reliable signal of genetic fitness to potential mates.", "opts": ["introduce a puzzling phenomenon that the rest of the passage then explains.", "shift the passage's focus away from evolutionary biology toward animal behavior in general.", "provide a direct answer that the following sentences merely restate.", "cast doubt on whether the handicap principle is a valid scientific theory."], "ci": 0, "exp": "The question raises the puzzle of a dangerous-seeming trait, which the passage then resolves by describing the handicap principle, matching the correct choice. The passage presents the handicap principle as an accepted explanation rather than questioning it. The passage stays focused on the peacock's tail specifically, not animal behavior broadly. The question itself supplies no answer; the answer only comes afterward.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"stem": "Which choice best describes the overall structure of the passage being described?", "passage": "The essay opens by describing the grandeur of a newly completed cathedral, then abruptly shifts to a detailed account of the anonymous laborers who died during its construction, before returning in its final paragraph to a meditation on how monuments obscure the human cost of their creation.", "opts": ["It presents a single argument supported by three pieces of evidence in a strictly chronological order.", "It compares two competing architectural styles before endorsing one over the other.", "It moves from admiration of an achievement, to an examination of its human cost, to a broader reflection connecting the two.", "It refutes a popular misconception before offering an alternative and unrelated theory."], "ci": 2, "exp": "The description moves from admiring the cathedral, to detailing the laborers' deaths, to a closing reflection linking monuments and hidden human cost, matching the correct choice exactly. The passage is not organized as chronological evidence for one argument. It contains no comparison between architectural styles. It does not refute a misconception or introduce an unrelated theory.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"stem": "Based on the texts, how would the critics in Text 2 most likely respond to the claim in Text 1 that standardized tests remove subjectivity from achievement comparisons?", "passage": "Text 1: Proponents of standardized testing argue that a single, uniform exam allows for objective comparison of student achievement across vastly different schools and districts, removing the subjectivity inherent in grades assigned by individual teachers.<br><br>Text 2: Critics counter that standardized tests often reflect a student's access to test-preparation resources and family income more than genuine academic ability, meaning that the “objective” scores primarily measure socioeconomic advantage rather than learning.", "opts": ["They would likely argue that standardized tests have no relationship to a student's family income.", "They would likely argue that test scores merely replace one kind of bias, teacher subjectivity, with another, socioeconomic advantage, rather than eliminating bias altogether.", "They would likely agree completely, since both texts describe testing as a purely objective measure.", "They would likely argue that teacher-assigned grades are always more accurate than standardized test scores."], "ci": 1, "exp": "Text 2's claim that scores primarily reflect socioeconomic advantage directly challenges Text 1's claim that testing removes subjectivity, supporting the correct choice as it shows bias merely shifts form rather than disappearing. The two texts disagree, so the critics would not agree completely. Text 2 never claims teacher grades are more accurate, only that test scores are influenced by income. Text 2's whole argument is that scores relate closely to family income, the opposite of the wrong choice.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Which conclusion about the new alloy is most strongly supported by the text?", "passage": "Engineers have found that a newly developed alloy expands and contracts with temperature changes far less than the steel currently used in bridge expansion joints. Excessive expansion and contraction is the primary reason expansion joints wear out and require frequent replacement.", "opts": ["The new alloy would eliminate the need for expansion joints entirely.", "The new alloy is more expensive to manufacture than standard steel.", "Bridges built with the new alloy would be structurally weaker overall.", "Expansion joints built from the new alloy would likely require replacement less often than those built from standard steel."], "ci": 3, "exp": "Since excessive expansion and contraction is described as the main cause of wear, and the new alloy expands and contracts far less, joints made from it would logically wear out less often, matching the correct choice. The text never discusses manufacturing cost. The text says nothing about the alloy's structural strength. Reduced expansion and contraction would not eliminate the need for expansion joints altogether, only reduce wear on them.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"stem": "Which conclusion about crow behavior is best supported by the text?", "passage": "In a study of urban crows, researchers observed that individuals who had previously encountered humans wearing a particular mask displayed alarm behavior whenever they saw that mask again, even years later and even when it was worn by an unfamiliar person. Crows who had never encountered the mask showed no such reaction.", "opts": ["Crows that encounter threatening humans typically abandon urban environments.", "Crows are unable to distinguish between individual humans wearing the same mask.", "Crows are capable of forming lasting associations between a specific visual cue and a past negative experience.", "Crows communicate warnings about masked humans to unrelated crow populations."], "ci": 2, "exp": "Crows reacting to the same mask years later, regardless of who wore it, shows they formed a durable memory linking the visual cue to danger, matching the correct choice. The study describes crows reacting to the mask, not confusing different individuals. The text says nothing about crows leaving urban areas. The text describes individual memory, not communication between unrelated crow populations.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"stem": "Which choice best describes the relationship between the two texts?", "passage": "Text 1: Some sleep researchers argue that the widespread use of screens before bedtime is a major driver of shortened sleep duration in teenagers, pointing to studies linking blue light exposure to delayed melatonin release.<br><br>Text 2: Other researchers, analyzing sleep diaries from thousands of teenagers, found that those with the latest bedtimes were most often teens with early morning school start times combined with heavy extracurricular schedules, regardless of how much they used screens before bed.", "opts": ["Text 2 confirms Text 1's claim that blue light exposure is the primary cause of shortened sleep in teenagers.", "Text 1 and Text 2 both rely on the same sleep-diary dataset to reach their conclusions.", "Text 1 responds directly to the scheduling findings described in Text 2.", "Text 2 presents findings that suggest a factor other than screen use, namely scheduling demands, may better explain shortened teenage sleep than Text 1 proposes."], "ci": 3, "exp": "Text 2's finding that late bedtimes were tied to scheduling demands \"regardless of\" screen use complicates rather than confirms Text 1's screen-focused explanation, matching the correct choice. Text 2 undermines rather than confirms Text 1's claim. Text 1 describes studies on blue light, not the sleep-diary dataset used in Text 2. Text 1 is presented independently and cannot respond to findings from Text 2.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Which finding would most directly support the linguist's claim?", "passage": "A linguist claims that a distinctive regional dialect feature is disappearing among younger speakers in a coastal community.", "opts": ["The dialect feature was first documented by researchers nearly a century ago.", "In recordings collected across three generations, only 4 percent of speakers under age 25 used the dialect feature, compared with 61 percent of speakers over age 60.", "Younger speakers reported feeling proud of their regional identity.", "The recordings were transcribed using standardized phonetic notation."], "ci": 1, "exp": "A sharp generational gap in actual usage rates, measured directly from recordings, most directly supports the claim that the feature is disappearing among younger speakers. When the feature was first documented says nothing about its current decline. Feeling proud of regional identity doesn't measure whether the specific dialect feature is still used. The transcription method used doesn't address usage rates across generations.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;



  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
