<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Speed Quiz</title>
<style>
  :root{
    --primary:#185FA5;
    --track:#d7dde6;
    --purple:#7b61ff;
    --green:#2e7d32;
    --greenBg:#e6f4ea;
    --red:#c62828;
    --redBg:#fdecea;
    --orange:#e08e00;
    --orangeBg:#fff3e0;
    --text:#222831;
    --muted:#5b6472;
    --bg:#f7f9fc;
    --card:#ffffff;
    --border:#d7dde6;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    max-width:720px;
    margin:0 auto;
    padding:16px;
  }
  h1{
    font-size:24px;
    text-align:center;
    margin:8px 0 4px;
    color:var(--primary);
  }
  .instructions{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin-bottom:16px;
  }
  .hidden{display:none !important;}

  .timerRow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:14px;
  }
  #timerDisplay{
    font-size:20px;
    font-weight:700;
    color:var(--primary);
    min-width:70px;
    text-align:center;
  }
  #pauseBtn{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 16px;
    font-size:14px;
    cursor:pointer;
  }
  #pauseBtn:disabled{
    opacity:0.5;
    cursor:not-allowed;
  }

  .progressRow{
    margin-bottom:10px;
  }
  #progressText{
    font-size:13px;
    color:var(--muted);
    margin-bottom:4px;
    text-align:center;
  }
  .progressTrack{
    width:100%;
    height:10px;
    background:var(--track);
    border-radius:6px;
    overflow:hidden;
  }
  #progressFill{
    height:100%;
    width:0%;
    background:var(--primary);
    transition:width 0.2s;
  }

  .jumpToggleBtn{
    display:block;
    margin:10px auto;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--primary);
    border-radius:8px;
    padding:6px 14px;
    font-size:13px;
    cursor:pointer;
  }
  #jumpPanel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:14px;
  }
  #jumpDots{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
  }
  .jumpDot{
    width:26px;
    height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--track);
    color:var(--text);
    font-size:11px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .jumpDot.current{
    border:2px solid var(--primary);
    background:#eaf2fb;
    font-weight:700;
  }
  .jumpDot.dotCorrect{
    background:var(--greenBg);
    color:var(--green);
    border-color:var(--green);
  }
  .jumpDot.dotWrong{
    background:var(--redBg);
    color:var(--red);
    border-color:var(--red);
  }
  .jumpDot.dotTimedOut{
    background:var(--orangeBg);
    color:var(--orange);
    border-color:var(--orange);
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
  }
  .chapterLabel{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--purple);
    margin-bottom:8px;
  }
  #questionText{
    font-size:17px;
    line-height:1.5;
    margin-bottom:16px;
    white-space:pre-line;
  }
  #optionsWrap{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .optBtn{
    text-align:left;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fafcff;
    color:var(--text);
    font-size:15px;
    cursor:pointer;
  }
  .optBtn:hover:not(:disabled){
    border-color:var(--primary);
  }
  .optBtn:disabled{
    cursor:not-allowed;
  }
  .optBtn.correctOpt{
    background:var(--greenBg);
    border-color:var(--green);
    color:var(--green);
    font-weight:700;
  }
  .optBtn.wrongOpt{
    background:var(--redBg);
    border-color:var(--red);
    color:var(--red);
    font-weight:700;
  }

  .navRow{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
  }
  .navRow button{
    flex:1;
    max-width:150px;
    padding:12px;
    border-radius:8px;
    border:none;
    font-size:14px;
    cursor:pointer;
  }
  #prevBtn,#nextBtn{
    background:var(--primary);
    color:#fff;
  }
  #prevBtn:disabled,#nextBtn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  #finishBtn{
    background:var(--orange);
    color:#fff;
  }

  #resultsScreen .card{
    text-align:center;
  }
  .resultCounts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:16px 0;
  }
  .countBox{
    border-radius:10px;
    padding:14px;
    font-size:14px;
  }
  .countBox .num{
    font-size:26px;
    font-weight:700;
    display:block;
  }
  .countCorrect{background:var(--greenBg);color:var(--green);}
  .countWrong{background:var(--redBg);color:var(--red);}
  .countTimedOut{background:var(--orangeBg);color:var(--orange);}
  .countSkipped{background:var(--track);color:var(--muted);}

  .attemptsLine{
    font-size:13px;
    color:var(--muted);
    margin-bottom:14px;
  }

  .resultsBtns{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .resultsBtns button{
    padding:13px;
    border-radius:8px;
    border:none;
    font-size:15px;
    cursor:pointer;
    color:#fff;
  }
  .btnGreen{background:var(--green);}
  .btnPurple{background:var(--purple);}
  .btnNeutral{background:var(--primary);}

  .modalOverlay{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modalBox{
    background:var(--card);
    border-radius:12px;
    padding:20px;
    max-width:340px;
    width:100%;
    text-align:center;
  }
  .modalBox p{
    font-size:15px;
    margin-bottom:18px;
  }
  .modalBtns{
    display:flex;
    gap:10px;
  }
  .modalBtns button{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:none;
    font-size:14px;
    cursor:pointer;
  }
  .modalConfirm{background:var(--primary);color:#fff;}
  .modalCancel{background:var(--track);color:var(--text);}
</style>
</head>
<body>

  <h1>[Grant] Speed Quiz</h1>
  <div class="instructions">Answer each problem before time runs out. Use Next/Prev to navigate.</div>

  <div id="quizScreen">
    <div class="timerRow">
      <span id="timerDisplay">40s</span>
      <button id="pauseBtn" onclick="togglePause()">Pause</button>
    </div>

    <div class="progressRow">
      <div id="progressText">0 / 30 answered</div>
      <div class="progressTrack"><div id="progressFill"></div></div>
    </div>

    <button class="jumpToggleBtn" onclick="toggleJumpPanel()">Jump to question (tap to expand)</button>
    <div id="jumpPanel" class="hidden">
      <div id="jumpDots"></div>
    </div>

    <div class="card">
      <div class="chapterLabel" id="chapterLabel"></div>
      <div id="questionText"></div>
      <div id="optionsWrap"></div>
    </div>

    <div class="navRow">
      <button id="prevBtn" onclick="goPrev()">Prev</button>
      <button id="finishBtn" onclick="finishQuiz()">Finish</button>
      <button id="nextBtn" onclick="goNext()">Next</button>
    </div>
  </div>

  <div id="resultsScreen" class="hidden">
    <div class="card">
      <h2 style="margin-top:0;">Results</h2>
      <div class="resultCounts">
        <div class="countBox countCorrect"><span class="num" id="resCorrect">0</span>Correct</div>
        <div class="countBox countWrong"><span class="num" id="resWrong">0</span>Wrong</div>
        <div class="countBox countTimedOut"><span class="num" id="resTimedOut">0</span>Timed Out</div>
        <div class="countBox countSkipped"><span class="num" id="resSkipped">0</span>Skipped</div>
      </div>
      <div class="attemptsLine">Total Attempts: <span id="resAttempts">0</span></div>
      <div class="resultsBtns">
        <button class="btnGreen" onclick="retryWrongTimedOut()">Retry Wrong &amp; Timed Out</button>
        <button class="btnPurple" onclick="copyAllResults()">Copy All Results</button>
        <button class="btnPurple" onclick="saveWrongAnswers()">Save Wrong Answers</button>
        <button class="btnNeutral" onclick="requestStartFresh('orig')">Start Fresh (Original Order)</button>
        <button class="btnNeutral" onclick="requestStartFresh('random')">Start Fresh (Random Order)</button>
      </div>
    </div>
  </div>

  <div id="freshModal" class="modalOverlay hidden">
    <div class="modalBox">
      <p id="modalText">Start fresh? All progress will be reset.</p>
      <div class="modalBtns">
        <button class="modalCancel" onclick="cancelFresh()">Cancel</button>
        <button class="modalConfirm" onclick="confirmFresh()">Confirm</button>
      </div>
    </div>
  </div>

<script>
(function(){

  var svgGe6 = '<svg width="300" height="180" viewBox="0 0 300 180" style="display:block;margin:10px auto;">' +
    '<line x1="30" y1="160" x2="270" y2="160" stroke="#333" stroke-width="2"/>' +

  var QUESTIONS = [

    { ch:'Gauss', q:"Find the sum of all multiples of 4 that are smaller than or equal to 40.", opts:['220','200','210','240'], ci:0 },

    { ch:'Add & Subtract', q:"Compute the following.<br>257 + 243 =", opts:['480','490','510','500'], ci:3 },
    { ch:'Add & Subtract', q:"Compute the following.<br>175 + 246 + 225 + 254 =", opts:['900','880','890','910'], ci:0 },

  var results = QUESTIONS.map(function(){ return {picked:null, timedOut:false}; });
  var times = QUESTIONS.map(function(){ return 40; });
  var activeOrder = QUESTIONS.map(function(_,i){ return i; });
  var curPos = 0;
  var paused = false;
  var tickHandle = null;
  var pendingFreshMode = null;
  var attempts = 0;

  try {
    var savedAttempts = localStorage.getItem(ATTEMPTS_KEY);
    if (savedAttempts) { attempts = parseInt(savedAttempts, 10) || 0; }
  } catch(e) { attempts = 0; }

  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      if (saved && Array.isArray(saved.results) && saved.results.length === QUESTIONS.length) {
        results = saved.results;
        if (Array.isArray(saved.times) && saved.times.length === QUESTIONS.length) times = saved.times;

      }
    }
  } catch(e) { /* ignore corrupt storage */ }

  function $(id){ return document.getElementById(id); }

  function persist(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        results: results, times: times, activeOrder: activeOrder, curPos: curPos
      }));
    } catch(e) { /* ignore */ }
  }

  function currentOriginalIndex(){ return activeOrder[curPos]; }

  function stopTicking(){
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  function startTicking(){
    stopTicking();
    if (paused) return;
    tickHandle = setInterval(function(){
      var oi = currentOriginalIndex();
      if (results[oi].picked !== null || results[oi].timedOut) { stopTicking(); return; }
      times[oi] -= 1;
      if (times[oi] <= 0) {
        times[oi] = 0;
        results[oi].timedOut = true;
        stopTicking();
        persist();
        renderQuestion();
        return;
      }
      $('timerDisplay').textContent = times[oi] + 's';
      persist();
    }, 1000);
  }

  window.togglePause = function(){
    paused = !paused;
    $('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    if (paused) { stopTicking(); } else { startTicking(); }
  };

  window.selectOption = function(oi, idx){
    var r = results[oi];
    if (r.picked !== null || r.timedOut) return;
    r.picked = idx;
    stopTicking();
    persist();
    renderQuestion();
  };

  window.goNext = function(){
    if (curPos < activeOrder.length - 1) { curPos++; persist(); renderQuestion(); }
  };
  window.goPrev = function(){
    if (curPos > 0) { curPos--; persist(); renderQuestion(); }
  };
  window.jumpTo = function(pos){
    curPos = pos; persist(); renderQuestion();
  };
  window.toggleJumpPanel = function(){
    $('jumpPanel').classList.toggle('hidden');
  };

  function updateProgress(){
    var answeredCount = results.filter(function(r){ return r.picked !== null || r.timedOut; }).length;
    $('progressText').textContent = answeredCount + ' / ' + QUESTIONS.length + ' answered';
    var pct = Math.round(answeredCount / QUESTIONS.length * 100);
    $('progressFill').style.width = pct + '%';
  }

  function updateNavButtons(){
    $('prevBtn').disabled = curPos === 0;
    $('nextBtn').disabled = curPos === activeOrder.length - 1;
  }

  function renderJumpDots(){
    var wrap = $('jumpDots');
    wrap.innerHTML = '';
    activeOrder.forEach(function(oi, pos){
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'jumpDot';
      dot.textContent = String(pos + 1);
      var r = results[oi];
      if (pos === curPos) {
        dot.classList.add('current');
      } else if (r.picked !== null) {
        dot.classList.add(r.picked === QUESTIONS[oi].ci ? 'dotCorrect' : 'dotWrong');
      } else if (r.timedOut) {
        dot.classList.add('dotTimedOut');
      }
      dot.onclick = function(){ window.jumpTo(pos); };
      wrap.appendChild(dot);
    });
  }

  function renderQuestion(){
    stopTicking();
    var oi = currentOriginalIndex();
    var q = QUESTIONS[oi];
    var r = results[oi];

    $('chapterLabel').textContent = q.ch;
    $('questionText').innerHTML = q.q;

    var optsWrap = $('optionsWrap');
    optsWrap.innerHTML = '';
    q.opts.forEach(function(optText, idx){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'optBtn';
      btn.textContent = optText;
      btn.onclick = function(){ window.selectOption(oi, idx); };
      if (r.picked !== null) {
        btn.disabled = true;
        if (idx === q.ci) btn.classList.add('correctOpt');
        if (idx === r.picked && idx !== q.ci) btn.classList.add('wrongOpt');
      } else if (r.timedOut) {
        btn.disabled = true;
        if (idx === q.ci) btn.classList.add('correctOpt');
      }
      optsWrap.appendChild(btn);
    });

    if (r.picked !== null) {
      $('timerDisplay').textContent = times[oi] + 's';
      $('pauseBtn').disabled = true;
    } else if (r.timedOut) {
      $('timerDisplay').textContent = 'Time up';
      $('pauseBtn').disabled = true;
    } else {
      $('timerDisplay').textContent = times[oi] + 's';
      $('pauseBtn').disabled = false;
      $('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
      startTicking();
    }

    updateProgress();
    updateNavButtons();
    renderJumpDots();
  }

  window.finishQuiz = function(){
    stopTicking();
    attempts += 1;
    try { localStorage.setItem(ATTEMPTS_KEY, String(attempts)); } catch(e) { /* ignore */ }
    showResults();
  };

  function computeCounts(){
    var correct = 0, wrong = 0, timedOut = 0, skipped = 0;
    results.forEach(function(r, i){
      if (r.picked !== null) {
        if (r.picked === QUESTIONS[i].ci) correct++; else wrong++;
      } else if (r.timedOut) {
        timedOut++;
      } else {
        skipped++;
      }
    });
    return { correct: correct, wrong: wrong, timedOut: timedOut, skipped: skipped };
  }

  function showResults(){
    $('quizScreen').classList.add('hidden');
    $('resultsScreen').classList.remove('hidden');
    var c = computeCounts();
    $('resCorrect').textContent = c.correct;
    $('resWrong').textContent = c.wrong;
    $('resTimedOut').textContent = c.timedOut;
    $('resSkipped').textContent = c.skipped;
    $('resAttempts').textContent = attempts;
  }

  window.retryWrongTimedOut = function(){
    var idxs = [];
    results.forEach(function(r, i){
      var isWrong = r.picked !== null && r.picked !== QUESTIONS[i].ci;
      var isTimedOut = r.timedOut && r.picked === null;
      if (isWrong || isTimedOut) idxs.push(i);
    });
    if (idxs.length === 0) { alert('No wrong or timed out questions to retry.'); return; }
    idxs.forEach(function(i){ results[i] = {picked:null, timedOut:false}; times[i] = 40; });
    activeOrder = idxs;
    curPos = 0;
    paused = false;
    persist();
    $('resultsScreen').classList.add('hidden');
    $('quizScreen').classList.remove('hidden');
    renderQuestion();
  };

  function stripHtml(html){
    return String(html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function fallbackCopy(text){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('Results copied to clipboard.');
    } catch(e) {
      alert('Could not copy results.');
    }
  }

  window.copyAllResults = function(){
    var lines = [];
    lines.push('[Grant] Speed Quiz Results');
    var c = computeCounts();
    lines.push('Correct: ' + c.correct + ', Wrong: ' + c.wrong + ', Timed Out: ' + c.timedOut + ', Skipped: ' + c.skipped);
    lines.push('');
    QUESTIONS.forEach(function(q, i){
      var r = results[i];
      var status;
      if (r.picked !== null) { status = (r.picked === q.ci) ? 'Correct' : 'Wrong'; }
      else if (r.timedOut) { status = 'Timed Out'; }
      else { status = 'Skipped'; }
      lines.push((i + 1) + '. ' + stripHtml(q.q));
      lines.push('   Your answer: ' + (r.picked !== null ? q.opts[r.picked] : '(none)') + ' | Correct answer: ' + q.opts[q.ci] + ' | Status: ' + status);
    });
    var text = lines.join('\n');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){
          alert('Results copied to clipboard.');
        }).catch(function(){ fallbackCopy(text); });
      } else {
        fallbackCopy(text);
      }
    } catch(e) {
      fallbackCopy(text);
    }
  };

  window.saveWrongAnswers = function(){
    try {
      var wrong = [];
      QUESTIONS.forEach(function(q, i){
        var r = results[i];
        var isWrong = r.picked !== null && r.picked !== q.ci;
        var isTimedOut = r.timedOut && r.picked === null;
        if (isWrong || isTimedOut) {
          wrong.push({ q: q.q, opts: q.opts, ci: q.ci, picked: (r.picked === null ? null : r.picked) });
        }
      });
      if (wrong.length === 0) {
        alert('No wrong or timed out answers to save.');
        return;
      }
      var payload = { child: 'Grant', subject: '[Grant] Speed Quiz', date: '2026-08-21', wrong: wrong };
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'grant_speed_quiz_wrong_answers.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch(e) {
      alert('Could not save wrong answers.');
    }
  };

  window.requestStartFresh = function(mode){
    pendingFreshMode = mode;
    $('modalText').textContent = (mode === 'random')
      ? 'Start fresh in random order? All progress will be reset.'
      : 'Start fresh in original order? All progress will be reset.';
    $('freshModal').classList.remove('hidden');
  };
  window.cancelFresh = function(){
    pendingFreshMode = null;
    $('freshModal').classList.add('hidden');
  };
  window.confirmFresh = function(){
    var mode = pendingFreshMode;
    $('freshModal').classList.add('hidden');
    results = QUESTIONS.map(function(){ return {picked:null, timedOut:false}; });
    times = QUESTIONS.map(function(){ return 40; });
    activeOrder = QUESTIONS.map(function(_,i){ return i; });
    if (mode === 'random') {
      for (var i = activeOrder.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = activeOrder[i]; activeOrder[i] = activeOrder[j]; activeOrder[j] = tmp;
      }
    }
    curPos = 0;
    paused = false;
    persist();
    $('resultsScreen').classList.add('hidden');
    $('quizScreen').classList.remove('hidden');
    renderQuestion();
  };

  renderQuestion();
})();
</script>
</body>
</html>
