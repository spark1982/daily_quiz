<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Grammar</title>
<style>
  :root{
    --blue:#185FA5;
    --track:#d7dde6;
    --red:#E24B4A;
    --green:#1D9E75;
    --purple:#7b61ff;
    --orange:#FF8C00;
    --ink:#22303f;
    --sub:#5a6b7d;
    --card:#ffffff;
    --bg:#f2f5f9;
    --border:#e1e7ee;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    max-width:720px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  h1{
    font-size:26px;
    text-align:center;
    margin:10px 0 4px;
  }
  .instruction{
    text-align:center;
    color:var(--sub);
    font-size:15px;
    margin-bottom:18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 1px 4px rgba(20,30,50,0.06);
  }
  .timer-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    justify-content:space-between;
  }
  .timer-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .timer-controls label{
    font-size:14px;
    color:var(--sub);
  }
  .timer-controls input[type="number"]{
    width:64px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
  }
  .btn{
    border:none;
    border-radius:9px;
    padding:9px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
  }
  .btn-blue{background:var(--blue);}
  .btn-green{background:var(--green);}
  .btn-purple{background:var(--purple);}
  .btn-grey{background:#6b7684;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  #timerDisplay{
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    min-width:90px;
    text-align:right;
  }
  #timerDisplay.orange{color:var(--orange);}
  #timerDisplay.red{color:var(--red);}
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
    color:var(--sub);
    margin-bottom:8px;
  }
  .progress-track{
    width:100%;
    height:10px;
    background:var(--track);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progress-fill{
    height:100%;
    background:var(--blue);
    width:0%;
    transition:width 0.2s ease;
  }
  .jump-toggle{
    background:none;
    border:none;
    color:var(--blue);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
  }
  .jump-panel{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  .jump-panel.open{display:flex;}
  .jump-dot{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--track);
    border:2px solid transparent;
    color:var(--ink);
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .jump-dot.answered-correct{background:var(--blue);color:#fff;}
  .jump-dot.answered-wrong{background:var(--red);color:#fff;}
  .jump-dot.current{border-color:var(--ink);}
  .qnum{
    font-size:13px;
    color:var(--sub);
    font-weight:700;
    margin-bottom:6px;
  }
  .qtext{
    font-size:18px;
    line-height:1.45;
    margin-bottom:16px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 14px;
    margin-bottom:10px;
    border:2px solid var(--border);
    border-radius:10px;
    background:#fff;
    font-size:15px;
    cursor:pointer;
    color:var(--ink);
  }
  .opt:hover{border-color:var(--blue);}
  .opt.selected{border-color:var(--blue);background:#eaf2fb;}
  .opt.correct{border-color:var(--green);background:#e7f7f1;}
  .opt.wrong{border-color:var(--red);background:#fbeaea;}
  .opt:disabled{cursor:default;}
  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:6px;
  }
  .exp-box{
    margin-top:12px;
    padding:12px 14px;
    background:#f6f8fb;
    border-left:4px solid var(--blue);
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
    color:var(--sub);
  }
  .results-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .results-actions .btn{width:100%;}
  .score-line{
    font-size:20px;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
  }
  .attempts-line{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    margin-bottom:16px;
  }
  .review-item{
    padding:12px 0;
    border-top:1px solid var(--border);
  }
  .review-q{font-weight:600;margin-bottom:6px;}
  .review-your{font-size:14px;margin-bottom:2px;}
  .review-correct{font-size:14px;margin-bottom:6px;}
  .tag-right{color:var(--green);font-weight:700;}
  .tag-wrong{color:var(--red);font-weight:700;}
  #toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    display:none;
    z-index:50;
  }
  .modal-overlay{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(20,30,50,0.45);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:14px;
    padding:20px;
    max-width:360px;
    width:100%;
  }
  .modal-box p{font-size:15px;line-height:1.5;margin-top:0;}
  .modal-btn-row{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:16px;
  }
  .modal-btn{
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .modal-cancel{background:var(--track);color:var(--ink);}
  .modal-confirm{background:var(--blue);color:#fff;}
</style>
</head>
<body>

<h1>[Grant] Grammar</h1>
<div class="instruction">Choose the best answer to complete each sentence.</div>

<div class="card" id="timerCard">
  <div class="timer-row">
    <div class="timer-controls">
      <label for="timeLimitInput">Set Time Limit (min)</label>
      <input type="number" id="timeLimitInput" min="1" max="120" value="15">
      <button class="btn btn-blue" id="startTimerBtn" onclick="window.startTimer()">Start</button>
    </div>
    <div id="timerDisplay">--:--</div>
  </div>
</div>

<div class="card" id="progressCard">
  <div class="progress-row">
    <span id="answeredCount">Answered 0/20</span>
    <button class="jump-toggle" id="jumpToggleBtn" onclick="window.toggleJumpPanel()">Jump to Question &#9662;</button>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="jump-panel" id="jumpPanel"></div>
</div>

<div class="card" id="quizCard"></div>

<div class="card" id="resultsCard" style="display:none;"></div>

<div id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p id="modalText"></p>
    <div class="modal-btn-row">
      <button class="modal-btn modal-cancel" id="modalCancelBtn">Cancel</button>
      <button class="modal-btn modal-confirm" id="modalConfirmBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STATE_KEY = "quiz_grantgrammar_20_20260820_v1";
  var ATTEMPTS_KEY = "quiz_grantgrammar_20260820_att_v1";

  var QUESTIONS = [
    {
      q:"Yesterday, my dog ___ across the yard chasing a squirrel.",
      opts:["runned","run","ran","runs"],
      ci:2,
      exp:"Ran is the correct irregular past tense form of run. Runned is not a real word, since run does not add -ed to form its past tense. Run itself is the base or present tense form, not the simple past tense the sentence needs."
    },
    {
      q:"The flock of birds ___ south for the winter.",
      opts:["fly","flying","flown","flies"],
      ci:3,
      exp:"Flock is a singular collective noun, so it takes the singular verb flies. Fly is the plural form and does not agree with the singular subject flock. Flying and flown are not complete simple present tense verbs that fit this sentence."
    },
    {
      q:"The teacher gave the award to Maria and ___.",
      opts:["I","me","myself","mine"],
      ci:1,
      exp:"Me is the correct object pronoun because it receives the action of gave to. I is a subject pronoun and cannot follow the preposition to. Myself is a reflexive pronoun and would only work if Maria and the speaker were the same person."
    },
    {
      q:"___ almost time for the bus to arrive.",
      opts:["Its","It's","Its'","Its's"],
      ci:1,
      exp:"It's is the contraction of it is, which fits the sentence. Its is a possessive pronoun and does not mean it is. Its' and Its's are not correctly formed English words."
    },
    {
      q:"Which sentence is an imperative sentence?",
      opts:["Did you close the door?","What a loud door that is!","Close the door before you leave.","The door is closed."],
      ci:2,
      exp:"Close the door before you leave gives a command, which makes it an imperative sentence. Did you close the door asks a question, making it interrogative. What a loud door that is expresses strong emotion, making it exclamatory."
    },
    {
      q:"Which sentence uses capitalization correctly?",
      opts:["we visited the Grand canyon last summer.","We Visited the grand canyon last Summer.","We visited the grand Canyon last Summer.","We visited the Grand Canyon last summer."],
      ci:3,
      exp:"Grand Canyon is a proper noun naming a specific place, so both words need capital letters, while summer is a common noun and stays lowercase. Lowercasing part of Grand Canyon, such as writing grand or canyon without a capital, breaks the capitalization rule for proper nouns. Capitalizing common words like Visited or Summer adds capitals where none belong."
    },
    {
      q:"Which sentence uses a comma correctly to join two independent clauses?",
      opts:["Sion finished his homework and he went outside to play.","Sion finished his homework, and he went outside to play.","Sion finished, his homework and he went outside to play.","Sion finished his homework, and, he went outside to play."],
      ci:1,
      exp:"A comma belongs before the coordinating conjunction and when it joins two independent clauses, as in Sion finished his homework, and he went outside to play. Leaving out the comma entirely creates a run-on style sentence. Adding an extra comma directly after and places punctuation where it does not belong."
    },
    {
      q:"Which word is the linking verb in this sentence? The soup smells delicious.",
      opts:["soup","smells","delicious","The"],
      ci:1,
      exp:"Smells links the subject soup to the adjective delicious that describes it, making it the linking verb. Delicious is the adjective being linked, not the verb itself. Soup is the subject of the sentence, not a verb."
    },
    {
      q:"Of all three trails, this one is ___.",
      opts:["the more steep","steeper","the steepest","most steepest"],
      ci:2,
      exp:"The steepest is the correct superlative form for comparing three or more trails. Steeper is a comparative form used only when comparing two things. Most steepest incorrectly combines most with the -est ending, creating a double superlative."
    },
    {
      q:"Which word is the preposition in this sentence? The cat hid under the porch.",
      opts:["hid","under","porch","cat"],
      ci:1,
      exp:"Under shows the relationship between hid and the porch, making it the preposition. Hid is the main verb of the sentence, not a preposition. Porch and cat are nouns, not prepositions."
    },
    {
      q:"Which word in this sentence is an abstract noun? Her courage inspired the whole team.",
      opts:["team","inspired","whole","courage"],
      ci:3,
      exp:"Courage names an idea or quality that cannot be seen or touched, which makes it an abstract noun. Team is a concrete noun because it names a group you can actually see. Inspired is a verb showing action, not a noun."
    },
    {
      q:"Which word is the helping verb in this sentence? Grant has finished his chores.",
      opts:["finished","chores","has","Grant"],
      ci:2,
      exp:"Has helps the main verb finished form the present perfect tense, making it the helping verb. Finished is the main verb showing the action itself. Chores is the object of the sentence, not a verb."
    },
    {
      q:"Which of these is a complete sentence, not a fragment?",
      opts:["After the storm passed and the sky cleared.","After the storm passed, the sky turned bright blue.","Because the wind was so strong outside.","Running quickly through the wet grass."],
      ci:1,
      exp:"After the storm passed, the sky turned bright blue contains a complete independent clause along with the introductory clause, so it expresses a full thought. Because the wind was so strong outside is only a dependent clause and never completes its thought. Running quickly through the wet grass is a phrase without a subject and main verb, so it cannot stand alone as a sentence."
    },
    {
      q:"Sion wanted pizza, ___ Grant wanted tacos.",
      opts:["so","and","but","because"],
      ci:2,
      exp:"But correctly shows the contrast between Sion wanting pizza and Grant wanting tacos. So would suggest that one idea caused the other, which does not fit this sentence. Because is a subordinating conjunction, not a coordinating conjunction, and would leave the sentence structure incomplete here."
    },
    {
      q:"Choose the correct plural form: The ___ played in the barn.",
      opts:["mouses","mice","mices","mouse"],
      ci:1,
      exp:"Mice is the correct irregular plural form of mouse. Mouses and mices incorrectly add a regular -s ending to a word that changes spelling in its plural form. Mouse is singular and does not match a sentence describing more than one animal."
    },
    {
      q:"Which sentence uses the possessive form correctly?",
      opts:["The childrens toys were scattered across the floor.","The children toys' were scattered across the floor.","The childrens' toys were scattered across the floor.","The children's toys were scattered across the floor."],
      ci:3,
      exp:"Since children is already a plural word, it takes an apostrophe plus s to show possession, forming children's. Childrens' incorrectly places the apostrophe after children as if it already ended in s. The childrens toys leaves out the needed apostrophe altogether."
    },
    {
      q:"Which sentence uses the adverb correctly?",
      opts:["She sings beautifully at every concert.","She sings beautiful at every concert.","She sing beautifully at every concert.","She sings more beautiful at every concert."],
      ci:0,
      exp:"Beautifully is the adverb form needed to describe how she sings, since adverbs modify verbs. Beautiful is an adjective and cannot correctly modify the verb sings. She sing beautifully uses the wrong verb form, since the subject she requires sings, not sing."
    },
    {
      q:"Each of the girls brought ___ own lunch.",
      opts:["their","its","his","her"],
      ci:3,
      exp:"Each is singular, and since the sentence refers to girls, the singular pronoun her correctly agrees with that antecedent. Their is a plural pronoun and does not match the singular word each. His does not agree in gender with girls in this sentence."
    },
    {
      q:"Which sentence is exclamatory?",
      opts:["Was that roller coaster terrifying?","Ride the roller coaster with me.","That roller coaster was terrifying!","The roller coaster is very tall."],
      ci:2,
      exp:"That roller coaster was terrifying shows strong feeling and ends with an exclamation point, which makes it exclamatory. Was that roller coaster terrifying asks a question, making it interrogative. Ride the roller coaster with me gives a command, making it imperative."
    },
    {
      q:"Which sentence is a run-on and needs to be corrected?",
      opts:["The rain started falling hard, so we quickly ran inside for shelter.","The rain started falling hard we quickly ran inside for shelter.","The rain started falling hard. We quickly ran inside for shelter.","Because the rain started falling hard, we quickly ran inside."],
      ci:1,
      exp:"This sentence joins two independent clauses with no punctuation or conjunction between them, which makes it a run-on. Adding so along with a comma correctly connects the two ideas using a coordinating conjunction. Splitting the ideas into two separate sentences with a period also fixes the run-on correctly."
    }
  ];

  var TOTAL = QUESTIONS.length;

  function safeGet(key){
    try{
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  function safeSet(key, val){
    try{
      localStorage.setItem(key, JSON.stringify(val));
    }catch(e){ /* ignore */ }
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function freshState(mode){
    var order;
    if(mode === "random"){
      order = shuffle(Array.from({length: TOTAL}, function(_, i){ return i; }));
    } else {
      order = Array.from({length: TOTAL}, function(_, i){ return i; });
    }
    return {
      orderMode: mode || "original",
      order: order,
      answers: new Array(order.length).fill(null),
      currentPos: 0,
      finished: false,
      countedThisAttempt: false,
      isRetry: false,
      timer: { durationMs: null, startTs: null, running: false }
    };
  }

  var state = safeGet(STATE_KEY);
  if(!state || !state.order || !state.answers || state.order.length !== state.answers.length){
    state = freshState("original");
    safeSet(STATE_KEY, state);
  }

  function save(){ safeSet(STATE_KEY, state); }

  // ---------- Timer ----------
  var timerInterval = null;

  function updateTimerDisplay(){
    var el = document.getElementById("timerDisplay");
    if(!state.timer || !state.timer.running || !state.timer.durationMs){
      el.textContent = "--:--";
      el.classList.remove("orange","red");
      return;
    }
    var elapsed = Date.now() - state.timer.startTs;
    var remaining = state.timer.durationMs - elapsed;
    if(remaining <= 0){
      el.textContent = "Time's Up";
      el.classList.remove("orange");
      el.classList.add("red");
      state.timer.running = false;
      save();
      if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
      return;
    }
    var pct = remaining / state.timer.durationMs;
    el.classList.remove("orange","red");
    if(pct <= 0.10){ el.classList.add("red"); }
    else if(pct <= 0.25){ el.classList.add("orange"); }
    var totalSec = Math.ceil(remaining / 1000);
    var mm = Math.floor(totalSec / 60);
    var ss = totalSec % 60;
    el.textContent = (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
  }

  function startTimerInterval(){
    if(timerInterval){ clearInterval(timerInterval); }
    timerInterval = setInterval(updateTimerDisplay, 500);
    updateTimerDisplay();
  }

  window.startTimer = function(){
    var input = document.getElementById("timeLimitInput");
    var minutes = parseFloat(input.value);
    if(!minutes || minutes <= 0){ minutes = 15; }
    state.timer = {
      durationMs: minutes * 60 * 1000,
      startTs: Date.now(),
      running: true
    };
    save();
    startTimerInterval();
  };

  // ---------- Rendering ----------
  function currentQuestionIndex(){
    return state.order[state.currentPos];
  }

  function renderProgress(){
    var answeredCount = state.answers.filter(function(a){ return a !== null; }).length;
    document.getElementById("answeredCount").textContent = "Answered " + answeredCount + "/" + state.order.length;
    var pct = state.order.length ? (answeredCount / state.order.length) * 100 : 0;
    document.getElementById("progressFill").style.width = pct + "%";
    renderJumpPanel();
  }

  function renderJumpPanel(){
    var panel = document.getElementById("jumpPanel");
    panel.innerHTML = "";
    state.order.forEach(function(qIdx, pos){
      var dot = document.createElement("div");
      dot.className = "jump-dot";
      var ans = state.answers[pos];
      if(ans !== null){
        var q = QUESTIONS[qIdx];
        dot.className += (ans === q.ci) ? " answered-correct" : " answered-wrong";
      }
      if(pos === state.currentPos && !state.finished){
        dot.className += " current";
      }
      dot.textContent = String(pos + 1);
      dot.setAttribute("onclick", "window.jumpTo(" + pos + ")");
      panel.appendChild(dot);
    });
  }

  window.toggleJumpPanel = function(){
    var panel = document.getElementById("jumpPanel");
    var btn = document.getElementById("jumpToggleBtn");
    var open = panel.classList.toggle("open");
    btn.innerHTML = open ? "Jump to Question &#9652;" : "Jump to Question &#9662;";
  };

  window.jumpTo = function(pos){
    if(state.finished) return;
    state.currentPos = pos;
    save();
    renderQuiz();
  };

  function renderQuiz(){
    if(state.finished){
      renderResults();
      return;
    }
    document.getElementById("resultsCard").style.display = "none";
    var card = document.getElementById("quizCard");
    card.style.display = "block";

    var pos = state.currentPos;
    var qIdx = state.order[pos];
    var q = QUESTIONS[qIdx];
    var picked = state.answers[pos];

    var html = "";
    html += '<div class="qnum">Question ' + (pos + 1) + ' of ' + state.order.length + '</div>';
    html += '<div class="qtext">' + escapeHtml(q.q) + '</div>';

    q.opts.forEach(function(optText, oIdx){
      var cls = "opt";
      var disabled = "";
      if(picked !== null){
        disabled = "disabled";
        if(oIdx === q.ci){ cls += " correct"; }
        else if(oIdx === picked){ cls += " wrong"; }
      }
      html += '<button class="' + cls + '" ' + disabled + ' onclick="window.selectOption(' + oIdx + ')">' + escapeHtml(optText) + '</button>';
    });

    if(picked !== null){
      html += '<div class="exp-box">' + escapeHtml(q.exp) + '</div>';
    }

    var isLast = (pos === state.order.length - 1);
    html += '<div class="nav-row">';
    html += '<button class="btn btn-grey" onclick="window.goPrev()" ' + (pos === 0 ? "disabled" : "") + '>&larr; Previous</button>';
    if(isLast){
      html += '<button class="btn btn-blue" onclick="window.goNext()">Show Results &rarr;</button>';
    } else {
      html += '<button class="btn btn-blue" onclick="window.goNext()">Next &rarr;</button>';
    }
    html += '</div>';

    card.innerHTML = html;
    renderProgress();
  }

  window.selectOption = function(oIdx){
    var pos = state.currentPos;
    if(state.answers[pos] !== null) return;
    state.answers[pos] = oIdx;
    save();
    renderQuiz();
  };

  window.goPrev = function(){
    if(state.currentPos > 0){
      state.currentPos -= 1;
      save();
      renderQuiz();
    }
  };

  window.goNext = function(){
    var isLast = (state.currentPos === state.order.length - 1);
    if(isLast){
      finishQuiz();
    } else {
      state.currentPos += 1;
      save();
      renderQuiz();
    }
  };

  function finishQuiz(){
    state.finished = true;
    if(!state.countedThisAttempt){
      var attempts = safeGet(ATTEMPTS_KEY);
      if(typeof attempts !== "number"){ attempts = 0; }
      attempts += 1;
      safeSet(ATTEMPTS_KEY, attempts);
      state.countedThisAttempt = true;
    }
    save();
    renderQuiz();
  }

  function escapeHtml(str){
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Results ----------
  function renderResults(){
    document.getElementById("quizCard").style.display = "none";
    var card = document.getElementById("resultsCard");
    card.style.display = "block";

    var correctCount = 0;
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      if(state.answers[pos] === q.ci){ correctCount++; }
    });

    var attempts = safeGet(ATTEMPTS_KEY);
    if(typeof attempts !== "number"){ attempts = 0; }

    var html = "";
    html += '<div class="score-line">Score: ' + correctCount + ' / ' + state.order.length + '</div>';
    html += '<div class="attempts-line">Total Attempts: ' + attempts + '</div>';

    html += '<div class="results-actions">';
    html += '<button class="btn btn-blue" onclick="window.copyAllResults()">Copy All Results</button>';
    html += '<button class="btn btn-green" onclick="window.retryWrongOnes()">Retry Wrong Ones</button>';
    html += '<button class="btn btn-purple" onclick="window.saveWrongAnswers()">Save Wrong Answers</button>';
    html += '<button class="btn btn-grey" onclick="window.startFresh(\'original\')">Start Fresh (Original Order)</button>';
    html += '<button class="btn btn-grey" onclick="window.startFresh(\'random\')">Start Fresh (Random Order)</button>';
    html += '</div>';

    html += '<div id="reviewList">';
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      var picked = state.answers[pos];
      var isCorrect = picked === q.ci;
      html += '<div class="review-item">';
      html += '<div class="review-q">' + (pos + 1) + '. ' + escapeHtml(q.q) + '</div>';
      html += '<div class="review-your">Your answer: ' + escapeHtml(picked !== null ? q.opts[picked] : "(no answer)") + ' <span class="' + (isCorrect ? "tag-right" : "tag-wrong") + '">' + (isCorrect ? "Correct" : "Incorrect") + '</span></div>';
      if(!isCorrect){
        html += '<div class="review-correct">Correct answer: ' + escapeHtml(q.opts[q.ci]) + '</div>';
      }
      html += '<div class="exp-box">' + escapeHtml(q.exp) + '</div>';
      html += '</div>';
    });
    html += '</div>';

    card.innerHTML = html;
    renderProgress();
  }

  // ---------- Copy / Save / Retry / Reset ----------
  window.copyAllResults = function(){
    var lines = [];
    lines.push("[Grant] Grammar - Results");
    var correctCount = 0;
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      var picked = state.answers[pos];
      var isCorrect = picked === q.ci;
      if(isCorrect) correctCount++;
      lines.push((pos + 1) + ". " + q.q);
      lines.push("Your answer: " + (picked !== null ? q.opts[picked] : "(no answer)") + (isCorrect ? " (Correct)" : " (Incorrect)"));
      if(!isCorrect){
        lines.push("Correct answer: " + q.opts[q.ci]);
      }
      lines.push("");
    });
    lines.push("Score: " + correctCount + " / " + state.order.length);
    var text = lines.join("\n");

    function showToast(msg){
      var t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(function(){ t.style.display = "none"; }, 2200);
    }

    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          showToast("Results copied to clipboard.");
        }).catch(function(){
          showToast("Could not copy results.");
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Results copied to clipboard.");
      }
    }catch(e){
      showToast("Could not copy results.");
    }
  };

  window.saveWrongAnswers = function(){
    var wrong = [];
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      var picked = state.answers[pos];
      if(picked !== q.ci){
        wrong.push({
          q: q.q,
          opts: q.opts,
          ci: q.ci,
          picked: picked
        });
      }
    });

    if(wrong.length === 0){
      alert("No wrong answers to save. Great job!");
      return;
    }

    var payload = {
      child: "Grant",
      subject: "[Grant] Grammar",
      date: "2026-08-21",
      wrong: wrong
    };

    try{
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "grant_grammar_wrong_answers_2026-08-21.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(e){
      alert("Could not save wrong answers file.");
    }
  };

  window.retryWrongOnes = function(){
    var wrongIdx = [];
    state.order.forEach(function(qIdx, pos){
      var q = QUESTIONS[qIdx];
      if(state.answers[pos] !== q.ci){
        wrongIdx.push(qIdx);
      }
    });
    if(wrongIdx.length === 0){
      alert("No wrong answers to retry. Great job!");
      return;
    }
    state.order = wrongIdx;
    state.answers = new Array(wrongIdx.length).fill(null);
    state.currentPos = 0;
    state.finished = false;
    state.countedThisAttempt = false;
    state.isRetry = true;
    save();
    renderQuiz();
  };

  function showModal(message, onConfirm){
    var overlay = document.getElementById("modalOverlay");
    document.getElementById("modalText").textContent = message;
    overlay.classList.add("open");

    var confirmBtn = document.getElementById("modalConfirmBtn");
    var cancelBtn = document.getElementById("modalCancelBtn");

    function cleanup(){
      overlay.classList.remove("open");
      confirmBtn.removeEventListener("click", onConfirmClick);
      cancelBtn.removeEventListener("click", onCancelClick);
    }
    function onConfirmClick(){ cleanup(); onConfirm(); }
    function onCancelClick(){ cleanup(); }

    confirmBtn.addEventListener("click", onConfirmClick);
    cancelBtn.addEventListener("click", onCancelClick);
  }

  window.startFresh = function(mode){
    var label = (mode === "random") ? "Random Order" : "Original Order";
    showModal("Start fresh with " + label + "? This will clear your current progress.", function(){
      state = freshState(mode);
      save();
      if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
      updateTimerDisplay();
      var panel = document.getElementById("jumpPanel");
      panel.classList.remove("open");
      document.getElementById("jumpToggleBtn").innerHTML = "Jump to Question &#9662;";
      renderQuiz();
    });
  };

  // ---------- Init ----------
  document.getElementById("timeLimitInput").value = state.timer && state.timer.durationMs ? Math.round(state.timer.durationMs / 60000) : 15;
  if(state.timer && state.timer.running && state.timer.durationMs){
    startTimerInterval();
  } else {
    updateTimerDisplay();
  }
  renderQuiz();
})();
</script>
</body>
</html>
