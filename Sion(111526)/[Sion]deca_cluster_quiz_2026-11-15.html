<style>

  * { box-sizing: border-box; }

  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }

  .opt-btn:hover { border-color:#185FA5; }

  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }

  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }

  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }

</style>

<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question. This week's review — questions you missed recently.";
var TODAY_STR = "20261115";
var RAW_QUESTIONS = [{"stem": "A small accounting firm has revenue of $250,000 and a cost of services of $150,000. What is its gross profit margin?", "opts": ["25%", "60%", "40%", "67%"], "ci": 2, "exp": "Gross profit = $250,000 − $150,000 = $100,000. Gross profit margin = $100,000 ÷ $250,000 = 40%. The 60% figure is the cost share, and 67% divides profit by cost instead of by revenue."}, {"stem": "Which part of a business plan gives a short overview of the whole plan and is usually read first by lenders and investors?", "opts": ["The appendix of supporting documents", "The executive summary", "The marketing plan", "The financial statements"], "ci": 1, "exp": "The executive summary briefly describes the business, its opportunity, its strategy, and the financing request. It is often written last but placed first because readers use it to decide whether to read the rest."}, {"stem": "Valley Print Shop switches to just-in-time (JIT) inventory, ordering paper only when jobs come in. What is the main risk of this approach?", "opts": ["Storage costs will rise because more paper must be kept in the warehouse", "A supplier delay could stop production because little backup stock is on hand", "The shop will have to buy paper in much larger quantities", "Paper on hand will become outdated because it sits too long"], "ci": 1, "exp": "JIT keeps inventory very low to cut storage costs, so the business depends on on-time deliveries; a delay can halt work. Higher storage costs, bulk buying, and old stock are problems of holding too much inventory, the opposite of JIT."}, {"stem": "A small company spends $8,000 on new accounting software. In the first year, the software saves the company $9,200 in labor costs. What is the return on investment (ROI) for the first year?", "opts": ["12%", "87%", "115%", "15%"], "ci": 3, "exp": "ROI = (gain − cost) ÷ cost. The net gain is $9,200 − $8,000 = $1,200, and $1,200 ÷ $8,000 = 0.15, or 15%. Choosing 115% divides the total savings by the cost without subtracting the cost."}, {"stem": "Rosa, who owns a small bakery, tells her flour supplier, \"Because you have been so reliable, I will give you a free wedding cake next month.\" Later she changes her mind. Why can the supplier most likely NOT enforce this promise as a contract?", "opts": ["Rosa is the owner, so she is not personally bound by her promises.", "The supplier is a business, and businesses cannot receive gifts.", "The promise lacks consideration because the supplier gave nothing in exchange for the cake.", "The promise was made orally, and all contracts must be written."], "ci": 2, "exp": "A contract needs consideration: each side gives something of value. Rosa offered a gift and asked for nothing in return, so there is no bargain to enforce. Many oral contracts are valid, so the lack of a written document is not the reason."}, {"stem": "A sporting-goods store keeps 40 extra pairs of a popular running shoe in its back room in case a big race causes a sudden rush of buyers. What is this extra inventory called?", "opts": ["Just-in-time inventory", "Consignment stock", "Safety stock", "Obsolete inventory"], "ci": 2, "exp": "Safety stock is extra inventory kept to protect against unexpected demand or late deliveries. Just-in-time inventory works the opposite way by keeping as little stock as possible."}, {"stem": "A bank’s hiring manager writes: \"Applicants must have a high school diploma, two years of cash-handling experience, and strong attention to detail.\" What is this list called?", "opts": ["An employee handbook", "A job description", "A job specification", "A performance appraisal"], "ci": 2, "exp": "A job specification lists the qualifications a person needs (education, experience, skills). A job description explains the duties of the job itself, and a performance appraisal evaluates someone who already works there."}, {"stem": "A credit union analyst is evaluating a small business loan applicant. Which measure best shows whether the business can pay its short-term bills without having to sell its inventory?", "opts": ["The inventory turnover ratio", "The quick (acid-test) ratio", "The debt-to-equity ratio", "The gross profit margin"], "ci": 1, "exp": "The <b>quick ratio</b> = (current assets &minus; inventory) &divide; current liabilities. It measures liquidity while excluding inventory, which may be hard to sell quickly. Debt-to-equity measures long-term leverage, inventory turnover measures how fast stock sells, and gross profit margin measures profitability, not the ability to pay bills."}, {"stem": "Priya wants to launch an app that helps teens track their savings goals. Before spending $40,000 on full development, she builds a simple version with only the core goal-tracking feature and releases it to 200 test users. What is this simple version called?", "opts": ["A franchise model", "A prototype patent", "A loss leader", "A minimum viable product (MVP)"], "ci": 3, "exp": "A <b>minimum viable product</b> is the simplest version of a product that delivers its core value so an entrepreneur can test real demand and collect feedback before investing heavily. A patent protects an invention legally, a franchise model licenses a business system to others, and a loss leader is a product sold below cost to attract customers."}, {"stem": "Marisol leaves her laptop with a repair shop, Fix-It Tech, while it replaces the cracked screen. Legally, what is this relationship called?", "opts": ["A lease, because Marisol is paying the shop for the right to use its workspace", "An agency relationship, because the shop now acts on Marisol&rsquo;s behalf with third parties", "A sale, because ownership of the laptop passes to the shop until the repair bill is paid", "A bailment, in which Fix-It Tech temporarily holds Marisol&rsquo;s property and must take reasonable care of it"], "ci": 3, "exp": "A <b>bailment</b> exists when one party (the bailor, Marisol) hands personal property to another (the bailee, the shop) for a specific purpose, expecting it back. Ownership never transfers, and a bailee for hire must use reasonable care. It is not a sale (no transfer of title), not a lease (Marisol is not renting anything), and not agency (the shop is not making deals for her)."}, {"stem": "A new online bank advertises itself as &ldquo;the bank with no fees, ever&rdquo; to stand apart from large traditional banks. What marketing concept is the bank using?", "opts": ["Positioning", "Market saturation", "Mass production", "Price fixing"], "ci": 0, "exp": "<b>Positioning</b> is creating a distinct image of a product in customers&rsquo; minds relative to competitors &mdash; here, &ldquo;no fees&rdquo; versus traditional banks. Market saturation means a market has little room left for growth, mass production is a manufacturing method, and price fixing is an illegal agreement among competitors to set prices."}, {"stem": "A school district needs 500 new laptops. It sends identical specifications to five suppliers and asks each to submit a price. What is this purchasing process called?", "opts": ["Reciprocal buying", "Requesting bids (competitive bidding)", "Consignment selling", "Drop shipping"], "ci": 1, "exp": "In <b>competitive bidding</b>, a buyer sends the same specifications to several suppliers and compares their offers, often choosing the best combination of price and quality. Reciprocal buying means buying from a supplier because it also buys from you, consignment means the seller is paid only after goods sell, and drop shipping has the supplier ship directly to the customer."}, {"stem": "A financial planning firm wants to sell complex retirement plans to small-business owners, who usually have many detailed questions. Which element of the promotional mix is most effective for this goal?", "opts": ["Billboard advertising", "Coupons", "Personal selling", "Product placement in movies"], "ci": 2, "exp": "<b>Personal selling</b> is two-way, face-to-face (or one-on-one) communication, ideal for complex, high-cost products where buyers need answers tailored to their situation. Billboards and product placement are one-way mass communication with no chance for questions, and coupons are a sales promotion tool better suited to simple, low-cost products."}, {"stem": "During a recession, Congress cuts income taxes and increases spending on highway construction. What kind of economic policy is this?", "opts": ["Contractionary fiscal policy", "Expansionary fiscal policy", "Contractionary monetary policy", "Expansionary monetary policy"], "ci": 1, "exp": "<b>Fiscal policy</b> uses government taxing and spending; <b>monetary policy</b> is the central bank&rsquo;s control of money supply and interest rates. Cutting taxes and raising spending put more money into the economy, so this is <b>expansionary</b> fiscal policy, used to fight recessions. Contractionary fiscal policy would raise taxes or cut spending."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
