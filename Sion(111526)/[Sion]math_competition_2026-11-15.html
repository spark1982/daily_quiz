<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. This week's review — questions you missed recently.";
var TODAY_STR = "20261115";
var RAW_QUESTIONS = [{"stem": "(MA&Theta;) Let <i>r</i>, <i>s</i>, <i>t</i> be the roots of <i>x</i><sup>3</sup> &minus; 6<i>x</i><sup>2</sup> + 5<i>x</i> &minus; 7 = 0. Find<br><br><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>r</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>s</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span>.", "opts": ["<span>&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>109</span><span style=\"border-top:1.4px solid #111;\">49</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>25</span><span style=\"border-top:1.4px solid #111;\">49</span></span>"], "ci": 0, "exp": "<b>What we need:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>r</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>s</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> for the roots of <i>x</i><sup>3</sup> &minus; 6<i>x</i><sup>2</sup> + 5<i>x</i> &minus; 7 = 0, without finding the roots.<br><br><b>Step 1 &mdash; Vieta&rsquo;s formulas.</b> For <i>x</i><sup>3</sup> + <i>a</i><i>x</i><sup>2</sup> + <i>b</i><i>x</i> + <i>c</i>: <i>r</i> + <i>s</i> + <i>t</i> = &minus;<i>a</i>, <i>r</i><i>s</i> + <i>r</i><i>t</i> + <i>s</i><i>t</i> = <i>b</i>, <i>r</i><i>s</i><i>t</i> = &minus;<i>c</i>. Here <i>a</i> = &minus;6, <i>b</i> = 5, <i>c</i> = &minus;7, so <i>r</i> + <i>s</i> + <i>t</i> = 6, <i>r</i><i>s</i> + <i>r</i><i>t</i> + <i>s</i><i>t</i> = 5, <i>r</i><i>s</i><i>t</i> = 7.<br><br><b>Step 2 &mdash; Use a common denominator.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>r</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>s</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(<i>s</i><i>t</i>)<sup>2</sup> + (<i>r</i><i>t</i>)<sup>2</sup> + (<i>r</i><i>s</i>)<sup>2</sup></span><span style=\"border-top:1.4px solid #111;\">(<i>r</i><i>s</i><i>t</i>)<sup>2</sup></span></span>.<br><br><b>Step 3 &mdash; Rewrite the numerator with Vieta values.</b> For any three numbers, <i>p</i><sup>2</sup> + <i>q</i><sup>2</sup> + <i>w</i><sup>2</sup> = (<i>p</i> + <i>q</i> + <i>w</i>)<sup>2</sup> &minus; 2(<i>pq</i> + <i>pw</i> + <i>qw</i>). With <i>p</i> = <i>r</i><i>s</i>, <i>q</i> = <i>r</i><i>t</i>, <i>w</i> = <i>s</i><i>t</i>: the sum of pairwise products is <i>r</i><i>s</i>&middot;<i>r</i><i>t</i> + <i>r</i><i>s</i>&middot;<i>s</i><i>t</i> + <i>r</i><i>t</i>&middot;<i>s</i><i>t</i> = <i>r</i><i>s</i><i>t</i>(<i>r</i> + <i>s</i> + <i>t</i>). So the numerator is (<i>r</i><i>s</i> + <i>r</i><i>t</i> + <i>s</i><i>t</i>)<sup>2</sup> &minus; 2<i>r</i><i>s</i><i>t</i>(<i>r</i> + <i>s</i> + <i>t</i>) = 5<sup>2</sup> &minus; 2 &middot; 7 &middot; 6 = 25 &minus; 84 = &minus;59.<br><br><b>Step 4 &mdash; Divide.</b> The denominator is (<i>r</i><i>s</i><i>t</i>)<sup>2</sup> = 7<sup>2</sup> = 49, so the sum is <b>&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span></b>.<br><br><b>Answer check:</b> Finding the three roots numerically (one real, two complex) and adding <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i><sup>2</sup></span></span> directly gives &minus;1.20408&hellip;, and 59 &divide; 49 = 1.20408&hellip;. A negative answer is possible because two of the roots are complex.<br><br><b>Trap:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>25</span><span style=\"border-top:1.4px solid #111;\">49</span></span> comes from forgetting the &minus;2<i>r</i><i>s</i><i>t</i>(<i>r</i> + <i>s</i> + <i>t</i>) term, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span> (positive) comes from a sign slip in 25 &minus; 84.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Compute <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(10<sup>4</sup>+324)(22<sup>4</sup>+324)&hellip;(58<sup>4</sup>+324)</span><span style=\"border-top:1.4px solid #111;\">(4<sup>4</sup>+324)(16<sup>4</sup>+324)&hellip;(52<sup>4</sup>+324)</span></span>. (AIME)", "opts": ["374", "373", "376", "372"], "ci": 1, "exp": "<b>What we need:</b> the value of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(10<sup>4</sup>+324)(22<sup>4</sup>+324)&hellip;(58<sup>4</sup>+324)</span><span style=\"border-top:1.4px solid #111;\">(4<sup>4</sup>+324)(16<sup>4</sup>+324)&hellip;(52<sup>4</sup>+324)</span></span>.<br><br><b>Step 1 &mdash; Factor <i>n</i><sup>4</sup> + 324.</b> Note 324 = 4 &middot; 81 = 4 &middot; 3<sup>4</sup>. Use the Sophie Germain identity <i>a</i><sup>4</sup> + 4<i>b</i><sup>4</sup> = (<i>a</i><sup>2</sup> &minus; 2<i>ab</i> + 2<i>b</i><sup>2</sup>)(<i>a</i><sup>2</sup> + 2<i>ab</i> + 2<i>b</i><sup>2</sup>) with <i>a</i> = <i>n</i>, <i>b</i> = 3:<br><i>n</i><sup>4</sup> + 324 = (<i>n</i><sup>2</sup> &minus; 6<i>n</i> + 18)(<i>n</i><sup>2</sup> + 6<i>n</i> + 18) = ((<i>n</i> &minus; 3)<sup>2</sup> + 9)((<i>n</i> + 3)<sup>2</sup> + 9).<br>(Check: (<i>n</i> &minus; 3)<sup>2</sup> + 9 = <i>n</i><sup>2</sup> &minus; 6<i>n</i> + 18, and the product expands back to <i>n</i><sup>4</sup> + 324.)<br><br><b>Step 2 &mdash; Write every factor as <i>m</i><sup>2</sup> + 9.</b> Numerator (<i>n</i> = 10, 22, 34, 46, 58): (7<sup>2</sup>+9)(13<sup>2</sup>+9), (19<sup>2</sup>+9)(25<sup>2</sup>+9), (31<sup>2</sup>+9)(37<sup>2</sup>+9), (43<sup>2</sup>+9)(49<sup>2</sup>+9), (55<sup>2</sup>+9)(61<sup>2</sup>+9).<br>Denominator (<i>n</i> = 4, 16, 28, 40, 52): (1<sup>2</sup>+9)(7<sup>2</sup>+9), (13<sup>2</sup>+9)(19<sup>2</sup>+9), (25<sup>2</sup>+9)(31<sup>2</sup>+9), (37<sup>2</sup>+9)(43<sup>2</sup>+9), (49<sup>2</sup>+9)(55<sup>2</sup>+9).<br><br><b>Step 3 &mdash; Cancel (telescoping).</b> The numerator uses <i>m</i> = 7, 13, 19, &hellip;, 55, 61 and the denominator uses <i>m</i> = 1, 7, 13, &hellip;, 49, 55. Everything from 7 to 55 appears once on top and once on the bottom and cancels. What is left is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>61<sup>2</sup> + 9</span><span style=\"border-top:1.4px solid #111;\">1<sup>2</sup> + 9</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3721 + 9</span><span style=\"border-top:1.4px solid #111;\">1 + 9</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3730</span><span style=\"border-top:1.4px solid #111;\">10</span></span> = <b>373</b>.<br><br><b>Answer check:</b> Multiplying out all ten original factors exactly (with a computer) and dividing gives exactly 373.<br><br><b>Trap:</b> 374 or 372 come from an off-by-one slip in the leftover factor (for example, using 61<sup>2</sup> + 9 = 3731 or forgetting the 9 in 1<sup>2</sup> + 9).", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "You have 8 cubes of size 1 through 8. A tower is to be built using all 8 cubes according to the following rules: <i>a</i>) Any cube may be the bottom cube in the tower. <i>b</i>) The cube immediately on top of a cube with size <i>k</i> must have size at most <i>k</i> + 2. How many different towers can be constructed?", "opts": ["972", "1512", "1458", "1440"], "ci": 2, "exp": "<b>What we need:</b> the number of orders (bottom to top) of cubes 1, 2, …, 8 in which the cube directly on top of cube <i>k</i> always has size at most <i>k</i> + 2.<br><br><b>Step 1 — Build the tower by adding the largest cube last.</b> Let <i>T</i>(<i>n</i>) be the number of good towers that use cubes 1 through <i>n</i>. Take any good tower of cubes 1 through <i>n</i> and lift out cube <i>n</i> (the biggest). The cube that was above it drops onto the cube that was below it. The cube above was smaller than <i>n</i>, and the cube below was at least <i>n</i> &minus; 2. So the new jump is at most (<i>n</i> &minus; 1) &minus; (<i>n</i> &minus; 2) = 1, which is allowed. That means every good tower of 1…<i>n</i> comes from a good tower of 1…(<i>n</i> &minus; 1) by inserting cube <i>n</i>.<br><br><b>Step 2 — Where can cube <i>n</i> be inserted?</b> Cube <i>n</i> may sit directly on top of a cube of size at least <i>n</i> &minus; 2, so only on cube <i>n</i> &minus; 1 or cube <i>n</i> &minus; 2. It may also be the bottom cube (rule a). Anything placed on top of cube <i>n</i> is smaller, so that is always fine. So for <i>n</i> ≥ 3 there are exactly <b>3</b> places, and each gives a different tower: <i>T</i>(<i>n</i>) = 3 · <i>T</i>(<i>n</i> &minus; 1).<br><br><b>Step 3 — Starting values.</b> <i>T</i>(1) = 1. With cubes 1 and 2, both orders work, so <i>T</i>(2) = 2.<br><br><b>Step 4 — Multiply.</b> <i>T</i>(3) = 6, <i>T</i>(4) = 18, <i>T</i>(5) = 54, <i>T</i>(6) = 162, <i>T</i>(7) = 486, <i>T</i>(8) = 1458. In one line: 2 × 3<sup>6</sup> = 2 × 729 = 1458.<br><br><b>Answer check:</b> a computer check of all 8! = 40320 orders finds exactly 1458 good towers. Also <i>T</i>(3) = 6 = 3! makes sense: with cubes 1, 2, 3 no jump is bigger than 2, so every order works.<br><br><b>Trap:</b> 972 = 4 × 3<sup>5</sup> comes from starting the chain with the wrong value (4 towers for three cubes). Remember that being the bottom cube is always allowed.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Find the remainder when <i>x</i><sup>51</sup> + 51 is divided by <i>x</i> + 1. (AHSME)", "opts": ["50", "1", "52", "-50"], "ci": 0, "exp": "<b>What we need:</b> the remainder when <i>x</i><sup>51</sup> + 51 is divided by <i>x</i> + 1.<br><br><b>Step 1 — Remainder Theorem.</b> When a polynomial <i>p</i>(<i>x</i>) is divided by <i>x</i> &minus; <i>a</i>, the remainder is the number <i>p</i>(<i>a</i>). Here <i>x</i> + 1 = <i>x</i> &minus; (&minus;1), so <i>a</i> = &minus;1.<br><br><b>Step 2 — Plug in.</b> <i>p</i>(&minus;1) = (&minus;1)<sup>51</sup> + 51. Since 51 is odd, (&minus;1)<sup>51</sup> = &minus;1. So the remainder is &minus;1 + 51 = 50.<br><br><b>Answer check:</b> polynomial long division by computer gives remainder 50. Small case: <i>x</i><sup>3</sup> + 3 divided by <i>x</i> + 1 gives remainder &minus;1 + 3 = 2, and indeed <i>x</i><sup>3</sup> + 3 = (<i>x</i> + 1)(<i>x</i><sup>2</sup> &minus; <i>x</i> + 1) + 2.<br><br><b>Trap:</b> 52 comes from treating (&minus;1)<sup>51</sup> as +1 (odd power keeps the minus sign). &minus;50 comes from plugging in <i>x</i> = 1 by mistake and flipping a sign.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "There are positive integers <i>m</i> and <i>n</i> so that <i>x</i> = <i>m</i> + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>n</i></span></span> is a solution to the equation<br><br><i>x</i><sup>2</sup> &minus; 10<i>x</i> + 1 = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (<i>x</i> + 1).<br><br>Find <i>m</i> + <i>n</i>.", "opts": ["48", "55", "61", "43"], "ci": 1, "exp": "<b>What we need:</b> a solution of <i>x</i><sup>2</sup> &minus; 10<i>x</i> + 1 = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (<i>x</i> + 1) that has the form <i>x</i> = <i>m</i> + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>n</i></span></span> with positive integers <i>m</i> and <i>n</i>. Find <i>m</i> + <i>n</i>.<br><br><b>Step 1 — Remove the square root.</b> Let <i>t</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (so <i>t</i> > 0 and <i>x</i> = <i>t</i><sup>2</sup>). The equation becomes <i>t</i><sup>4</sup> &minus; 10<i>t</i><sup>2</sup> + 1 = <i>t</i>(<i>t</i><sup>2</sup> + 1) = <i>t</i><sup>3</sup> + <i>t</i>.<br><br><b>Step 2 — Divide by <i>t</i><sup>2</sup>.</b> <i>t</i><sup>2</sup> &minus; 10 + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span>. This is symmetric in <i>t</i> and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span>, so let <i>w</i> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span>. Then <i>t</i><sup>2</sup> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> = <i>w</i><sup>2</sup> &minus; 2.<br><br><b>Step 3 — Solve for <i>w</i>.</b> (<i>w</i><sup>2</sup> &minus; 2) &minus; 10 = <i>w</i>, so <i>w</i><sup>2</sup> &minus; <i>w</i> &minus; 12 = 0, which factors as (<i>w</i> &minus; 4)(<i>w</i> + 3) = 0. Since <i>t</i> > 0, <i>w</i> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span> > 0, so <i>w</i> = 4.<br><br><b>Step 4 — Solve for <i>t</i> and <i>x</i>.</b> <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span> = 4 gives <i>t</i><sup>2</sup> &minus; 4<i>t</i> + 1 = 0, so <i>t</i> = 2 ± <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>. Then <i>x</i> = <i>t</i><sup>2</sup> = (2 ± <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>)<sup>2</sup> = 4 ± 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> + 3 = 7 ± 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span>.<br><br><b>Step 5 — Pick the right form.</b> 4<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">16 · 3</span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span>. The root 7 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span> has the form <i>m</i> + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>n</i></span></span> with <i>m</i> = 7, <i>n</i> = 48. (The other root, 7 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span>, has a minus sign, so it is not of that form.) So <i>m</i> + <i>n</i> = 7 + 48 = 55.<br><br><b>Answer check:</b> <i>x</i> = 7 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">48</span></span> ≈ 13.9282. Left side: <i>x</i><sup>2</sup> &minus; 10<i>x</i> + 1 ≈ 55.7128. Right side: <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> (<i>x</i> + 1) ≈ 3.7321 × 14.9282 ≈ 55.7128. ✔<br><br><b>Trap:</b> squaring both sides right away gives a degree-4 polynomial in <i>x</i> that is hard to factor; the substitution <i>t</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\"><i>x</i></span></span> and then <i>w</i> = <i>t</i> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i></span></span> is the key.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Compute the unique positive integer <i>n</i> such that<br><br>2&middot;2<sup>2</sup> + 3&middot;2<sup>3</sup> + 4&middot;2<sup>4</sup> + &hellip; + <i>n</i>&middot;2<sup><i>n</i></sup> = 2<sup><i>n</i>+10</sup>.", "opts": ["512", "514", "511", "513"], "ci": 3, "exp": "<b>What we need:</b> the positive integer <i>n</i> with 2·2<sup>2</sup> + 3·2<sup>3</sup> + … + <i>n</i>·2<sup><i>n</i></sup> = 2<sup><i>n</i>+10</sup>.<br><br><b>Step 1 — A formula for the full sum.</b> Let <i>S</i> = 1·2 + 2·2<sup>2</sup> + 3·2<sup>3</sup> + … + <i>n</i>·2<sup><i>n</i></sup>. Double it: 2<i>S</i> = 1·2<sup>2</sup> + 2·2<sup>3</sup> + … + (<i>n</i> &minus; 1)·2<sup><i>n</i></sup> + <i>n</i>·2<sup><i>n</i>+1</sup>. Subtract <i>S</i> from 2<i>S</i>: the matching powers of 2 leave one copy each, so<br>2<i>S</i> &minus; <i>S</i> = <i>n</i>·2<sup><i>n</i>+1</sup> &minus; (2 + 2<sup>2</sup> + 2<sup>3</sup> + … + 2<sup><i>n</i></sup>).<br><br><b>Step 2 — Add the powers of 2.</b> 2 + 2<sup>2</sup> + … + 2<sup><i>n</i></sup> = 2<sup><i>n</i>+1</sup> &minus; 2. So <i>S</i> = <i>n</i>·2<sup><i>n</i>+1</sup> &minus; 2<sup><i>n</i>+1</sup> + 2 = (<i>n</i> &minus; 1)·2<sup><i>n</i>+1</sup> + 2.<br>Quick test: <i>n</i> = 3 gives 2 + 8 + 24 = 34, and (3 &minus; 1)·2<sup>4</sup> + 2 = 32 + 2 = 34 ✓.<br><br><b>Step 3 — Our sum starts at 2·2<sup>2</sup>, not 1·2.</b> Remove the first term 1·2 = 2: 2·2<sup>2</sup> + … + <i>n</i>·2<sup><i>n</i></sup> = (<i>n</i> &minus; 1)·2<sup><i>n</i>+1</sup>.<br><br><b>Step 4 — Solve.</b> (<i>n</i> &minus; 1)·2<sup><i>n</i>+1</sup> = 2<sup><i>n</i>+10</sup>. Divide both sides by 2<sup><i>n</i>+1</sup>: <i>n</i> &minus; 1 = 2<sup>9</sup> = 512, so <i>n</i> = <b>513</b>.<br><br><b>Answer check:</b> a computer adds 2·2<sup>2</sup> + … + 513·2<sup>513</sup> and gets exactly 2<sup>523</sup> ✓ (and 512 or 514 do not work). <b>Trap:</b> stopping at <i>n</i> &minus; 1 = 512 and choosing 512.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "An escalator of <i>n</i> steps descends at constant speed. Ann and Zoe walk down the escalator steadily as it moves. Ann goes twice as many escalator steps per minute as Zoe. Ann reaches the bottom after taking 27 steps while Zoe reaches the bottom after taking 18 steps. What is <i>n</i>? (AHSME)", "opts": ["54", "48", "72", "60"], "ci": 0, "exp": "<b>What we need:</b> the number of visible steps <i>n</i> on the escalator.<br><br><b>Step 1 — Key idea.</b> While a person walks down, the escalator also carries steps past them. So<br>(steps the person takes) + (steps the escalator moves during that time) = <i>n</i>.<br><br><b>Step 2 — Set up rates.</b> Let Zoe take <i>z</i> steps per minute, so Ann takes 2<i>z</i> steps per minute. Let the escalator move <i>e</i> steps per minute.<br>• Ann takes 27 steps, so her time is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">2<i>z</i></span></span> minutes.<br>• Zoe takes 18 steps, so her time is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>18</span><span style=\"border-top:1.4px solid #111;\"><i>z</i></span></span> minutes.<br><br><b>Step 3 — Write two equations for <i>n</i>.</b><br>Ann: <i>n</i> = 27 + <i>e</i> · <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">2<i>z</i></span></span><br>Zoe: <i>n</i> = 18 + <i>e</i> · <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>18</span><span style=\"border-top:1.4px solid #111;\"><i>z</i></span></span><br>Only the ratio <i>r</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>e</i></span><span style=\"border-top:1.4px solid #111;\"><i>z</i></span></span> matters, so: <i>n</i> = 27 + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">2</span></span><i>r</i> and <i>n</i> = 18 + 18<i>r</i>.<br><br><b>Step 4 — Solve.</b> Set them equal: 27 + 13.5<i>r</i> = 18 + 18<i>r</i>. Then 9 = 4.5<i>r</i>, so <i>r</i> = 2 (the escalator moves twice as fast as Zoe walks).<br>Then <i>n</i> = 18 + 18 · 2 = 18 + 36 = <b>54</b>.<br><br><b>Answer check:</b> Ann's version: 27 + 13.5 · 2 = 27 + 27 = 54 ✔. Picture it with Zoe walking 1 step per minute: Zoe takes 18 minutes and the escalator moves 2 · 18 = 36 steps, total 54; Ann walks 2 per minute for 13.5 minutes while the escalator moves 2 · 13.5 = 27 steps, total 27 + 27 = 54 ✔.<br><br><b>Trap:</b> Adding 27 + 18 = 45 or averaging the step counts ignores the escalator's motion. The slower walker (Zoe) is on the escalator longer, so the escalator does more of her work.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Let <i>p</i>(<i>x</i>) be a polynomial with degree <i>n</i> and<br><br><i>p</i>(<i>k</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i></span><span style=\"border-top:1.4px solid #111;\"><i>k</i>+1</span></span>,&nbsp;&nbsp;&nbsp;<i>k</i> = 0, 1, &hellip;, <i>n</i>.<br><br>What is <i>p</i>(<i>n</i> + 1)? (USAMO)", "opts": ["1 for every <i>n</i>", "<span>1 if <i>n</i> is odd, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i>+2</span></span> if <i>n</i> is even</span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i>+2</span><span style=\"border-top:1.4px solid #111;\"><i>n</i></span></span> if <i>n</i> is even, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i>+2</span></span> if <i>n</i> is odd", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i>+2</span></span> for every <i>n</i>"], "ci": 1, "exp": "<b>What we need</b><br>A polynomial <i>p</i>(<i>x</i>) of degree <i>n</i> matches <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i></span><span style=\"border-top:1.4px solid #111;\"><i>k</i> + 1</span></span> at <i>k</i> = 0, 1, &hellip;, <i>n</i>. We want <i>p</i>(<i>n</i> + 1).<br><br><b>Step 1: Clear the fraction.</b> The condition <i>p</i>(<i>k</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i></span><span style=\"border-top:1.4px solid #111;\"><i>k</i> + 1</span></span> means (<i>k</i> + 1)<i>p</i>(<i>k</i>) = <i>k</i>, or (<i>k</i> + 1)<i>p</i>(<i>k</i>) &minus; <i>k</i> = 0. So define a new polynomial<br><i>q</i>(<i>x</i>) = (<i>x</i> + 1)<i>p</i>(<i>x</i>) &minus; <i>x</i>.<br>Its degree is <i>n</i> + 1, and <i>q</i>(<i>k</i>) = 0 for <i>k</i> = 0, 1, &hellip;, <i>n</i>.<br><br><b>Step 2: Write <i>q</i> using its roots.</b> A polynomial of degree <i>n</i> + 1 with the <i>n</i> + 1 roots 0, 1, &hellip;, <i>n</i> must be<br><i>q</i>(<i>x</i>) = <i>C</i> &middot; <i>x</i>(<i>x</i> &minus; 1)(<i>x</i> &minus; 2)&hellip;(<i>x</i> &minus; <i>n</i>)<br>for some constant <i>C</i>.<br><br><b>Step 3: Find <i>C</i> using <i>x</i> = &minus;1.</b> From the definition, <i>q</i>(&minus;1) = 0 &middot; <i>p</i>(&minus;1) &minus; (&minus;1) = 1. From Step 2, <i>q</i>(&minus;1) = <i>C</i> &middot; (&minus;1)(&minus;2)&hellip;(&minus;<i>n</i> &minus; 1). That product has <i>n</i> + 1 negative factors, so it equals (&minus;1)<sup><i>n</i>+1</sup>(<i>n</i> + 1)!. Therefore <i>C</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(&minus;1)<sup><i>n</i>+1</sup></span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> + 1)!</span></span>.<br><br><b>Step 4: Plug in <i>x</i> = <i>n</i> + 1.</b> Then <i>x</i>(<i>x</i> &minus; 1)&hellip;(<i>x</i> &minus; <i>n</i>) = (<i>n</i> + 1)<i>n</i>&hellip;1 = (<i>n</i> + 1)!, so <i>q</i>(<i>n</i> + 1) = <i>C</i> &middot; (<i>n</i> + 1)! = (&minus;1)<sup><i>n</i>+1</sup>.<br>Also, by the definition, <i>q</i>(<i>n</i> + 1) = (<i>n</i> + 2)<i>p</i>(<i>n</i> + 1) &minus; (<i>n</i> + 1). Setting these equal:<br>(<i>n</i> + 2)<i>p</i>(<i>n</i> + 1) = <i>n</i> + 1 + (&minus;1)<sup><i>n</i>+1</sup>.<br><br><b>Step 5: Split into cases.</b> If <i>n</i> is odd, <i>n</i> + 1 is even, so (&minus;1)<sup><i>n</i>+1</sup> = 1 and <i>p</i>(<i>n</i> + 1) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i> + 2</span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span> = 1. If <i>n</i> is even, (&minus;1)<sup><i>n</i>+1</sup> = &minus;1 and <i>p</i>(<i>n</i> + 1) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span>.<br><br><b>Answer check</b><br><i>n</i> = 1: the line through (0, 0) and (1, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>) is <i>p</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\">2</span></span>, so <i>p</i>(2) = 1 (odd case). <i>n</i> = 2: the parabola through (0, 0), (1, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>), (2, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>) gives <i>p</i>(3) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">4</span></span> (even case, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span>). A computer check of <i>n</i> = 1 to 7 agrees.<br><br><b>Trap</b><br>Guessing the pattern continues, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i> + 1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span>, or ignoring the sign (&minus;1)<sup><i>n</i>+1</sup> leads to an answer that is the same for every <i>n</i>; the sign is what makes odd and even different.<br><br><b>Answer:</b> 1 if <i>n</i> is odd, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span> if <i>n</i> is even", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Evaluate<br><br><span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 4px;\"><span style=\"font-size:0.68em;\">&infin;</span><span style=\"font-size:1.5em;margin:1px 0;\">&Sigma;</span><span style=\"font-size:0.6em;white-space:nowrap;\"><i>n</i>=3</span></span> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i></span></span>. (Purple Comet)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">72</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">48</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span>"], "ci": 2, "exp": "<b>What we need</b><br>The exact value of the infinite sum of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i></span></span> for <i>n</i> = 3, 4, 5, &hellip;<br><br><b>Step 1: Factor the denominator.</b> <i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i> = <i>n</i>(<i>n</i><sup>4</sup> &minus; 5<i>n</i><sup>2</sup> + 4) = <i>n</i>(<i>n</i><sup>2</sup> &minus; 1)(<i>n</i><sup>2</sup> &minus; 4) = (<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2). It is a product of five consecutive integers. (This is why the sum starts at <i>n</i> = 3: for <i>n</i> = 1 or 2 the denominator is 0.)<br><br><b>Step 2: Split into a telescoping difference.</b> Let <i>A</i> = (<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1) and <i>B</i> = (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2). Then <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>B</i> &minus; <i>A</i></span><span style=\"border-top:1.4px solid #111;\"><i>AB</i></span></span>. Both <i>A</i> and <i>B</i> contain (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1), so <i>B</i> &minus; <i>A</i> = (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)[(<i>n</i> + 2) &minus; (<i>n</i> &minus; 2)] = 4(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1). Dividing, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2)</span></span>. So each term equals <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span>).<br><br><b>Step 3: Telescope.</b> Write <i>g</i>(<i>n</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)</span></span>. Then <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <i>g</i>(<i>n</i> + 1), and the sum is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>[(<i>g</i>(3) &minus; <i>g</i>(4)) + (<i>g</i>(4) &minus; <i>g</i>(5)) + &hellip;]. Everything cancels except <i>g</i>(3), because <i>g</i>(<i>n</i>) &rarr; 0 as <i>n</i> grows. <i>g</i>(3) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">1 &times; 2 &times; 3 &times; 4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span>.<br><br><b>Step 4: Finish.</b> Sum = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>.<br><br><b>Answer check</b><br>First term (<i>n</i> = 3): <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">1 &times; 2 &times; 3 &times; 4 &times; 5</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span> &asymp; 0.00833; adding <i>n</i> = 4 (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">720</span></span>) and <i>n</i> = 5 (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2520</span></span>) gives about 0.01012, already close to <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span> &asymp; 0.01042. A computer sum of the first 2000 terms agrees with <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span> to 12 decimal places.<br><br><b>Trap</b><br>Stopping at the first term (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span>), or forgetting the factor <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> and answering <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span>-type values such as <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">48</span></span> or <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">72</span></span>.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "The polynomial 1&minus;<i>x</i>+<i>x</i><sup>2</sup>&minus;<i>x</i><sup>3</sup>+&hellip;+<i>x</i><sup>16</sup>&minus;<i>x</i><sup>17</sup> may be written in the form <i>a</i><sub>0</sub>+<i>a</i><sub>1</sub><i>y</i>+<i>a</i><sub>2</sub><i>y</i><sup>2</sup>+<i>a</i><sub>3</sub><i>y</i><sup>3</sup>+&hellip;+<i>a</i><sub>16</sub><i>y</i><sup>16</sup>+<i>a</i><sub>17</sub><i>y</i><sup>17</sup>, where <i>y</i>=<i>x</i>+1 and the <i>a</i><sub><i>i</i></sub>'s are constants. Find the value of <i>a</i><sub>2</sub>. (AIME)", "opts": ["816", "153", "680", "171"], "ci": 0, "exp": "<b>What we need</b><br>Rewrite the polynomial in powers of <i>y</i> = <i>x</i> + 1 and read off the coefficient <i>a</i><sub>2</sub> of <i>y</i><sup>2</sup>.<br><br><b>Step 1: Use the geometric-series formula.</b> The terms 1, &minus;<i>x</i>, <i>x</i><sup>2</sup>, &hellip;, &minus;<i>x</i><sup>17</sup> form a geometric series with first term 1, ratio &minus;<i>x</i>, and 18 terms. So<br>1 &minus; <i>x</i> + <i>x</i><sup>2</sup> &minus; &hellip; &minus; <i>x</i><sup>17</sup> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; (&minus;<i>x</i>)<sup>18</sup></span><span style=\"border-top:1.4px solid #111;\">1 &minus; (&minus;<i>x</i>)</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; <i>x</i><sup>18</sup></span><span style=\"border-top:1.4px solid #111;\">1 + <i>x</i></span></span>.<br><br><b>Step 2: Substitute <i>x</i> = <i>y</i> &minus; 1.</b> The denominator 1 + <i>x</i> becomes <i>y</i>, so the polynomial equals <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; (<i>y</i> &minus; 1)<sup>18</sup></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>.<br><br><b>Step 3: Find which term of the numerator gives <i>y</i><sup>2</sup>.</b> Dividing by <i>y</i> lowers every power by 1, so <i>a</i><sub>2</sub> is the coefficient of <i>y</i><sup>3</sup> in 1 &minus; (<i>y</i> &minus; 1)<sup>18</sup>. By the binomial theorem, the <i>y</i><sup>3</sup> term of (<i>y</i> &minus; 1)<sup>18</sup> is <i>C</i>(18, 3) &middot; <i>y</i><sup>3</sup> &middot; (&minus;1)<sup>15</sup> = &minus;<i>C</i>(18, 3)<i>y</i><sup>3</sup>. With the minus sign in front, the coefficient becomes +<i>C</i>(18, 3).<br><br><b>Step 4: Compute.</b> <i>C</i>(18, 3) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>18 &times; 17 &times; 16</span><span style=\"border-top:1.4px solid #111;\">3 &times; 2 &times; 1</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4896</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = 816.<br><br><b>Answer check</b><br>Expanding the original polynomial directly in <i>y</i> by computer gives <i>a</i><sub>2</sub> = 816. Also, the constant term 1 cancels: 1 &minus; (<i>y</i> &minus; 1)<sup>18</sup> has constant term 1 &minus; 1 = 0, so the division by <i>y</i> is exact, as it must be.<br><br><b>Trap</b><br>Taking <i>C</i>(18, 2) = 153 (forgetting that dividing by <i>y</i> shifts the power by one), or <i>C</i>(19, 2) = 171 or <i>C</i>(17, 3) = 680 from miscounting the 18 terms.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Find the remainder when <i>x</i><sup>81</sup> + <i>x</i><sup>49</sup> + <i>x</i><sup>25</sup> + <i>x</i><sup>9</sup> + <i>x</i> is divided by <i>x</i><sup>3</sup> &minus; <i>x</i>.", "opts": ["<i>x</i>", "5", "-5<i>x</i>", "5<i>x</i>"], "ci": 3, "exp": "<b>What we need</b><br>The remainder when <i>f</i>(<i>x</i>) = <i>x</i><sup>81</sup> + <i>x</i><sup>49</sup> + <i>x</i><sup>25</sup> + <i>x</i><sup>9</sup> + <i>x</i> is divided by <i>x</i><sup>3</sup> &minus; <i>x</i>.<br><br><b>Step 1: Form of the remainder.</b> The divisor has degree 3, so the remainder has degree at most 2: write it as <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i>. Then <i>f</i>(<i>x</i>) = (<i>x</i><sup>3</sup> &minus; <i>x</i>)<i>q</i>(<i>x</i>) + <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i> for some polynomial <i>q</i>.<br><br><b>Step 2: Plug in the roots of the divisor.</b> <i>x</i><sup>3</sup> &minus; <i>x</i> = <i>x</i>(<i>x</i> &minus; 1)(<i>x</i> + 1) is zero at <i>x</i> = 0, 1, &minus;1, so at those points <i>f</i> equals the remainder.<br>&bull; <i>x</i> = 0: <i>f</i>(0) = 0, so <i>c</i> = 0.<br>&bull; <i>x</i> = 1: <i>f</i>(1) = 1 + 1 + 1 + 1 + 1 = 5, so <i>a</i> + <i>b</i> + <i>c</i> = 5, giving <i>a</i> + <i>b</i> = 5.<br>&bull; <i>x</i> = &minus;1: every exponent (81, 49, 25, 9, 1) is odd, so each term is &minus;1 and <i>f</i>(&minus;1) = &minus;5. So <i>a</i> &minus; <i>b</i> + <i>c</i> = &minus;5, giving <i>a</i> &minus; <i>b</i> = &minus;5.<br><br><b>Step 3: Solve.</b> Adding the two equations: 2<i>a</i> = 0, so <i>a</i> = 0. Then <i>b</i> = 5. The remainder is <b>5<i>x</i></b>.<br><br><b>Answer check</b><br>Another way: <i>x</i><sup>3</sup> &equiv; <i>x</i> (mod <i>x</i><sup>3</sup> &minus; <i>x</i>), so every odd power <i>x</i><sup>2<i>k</i>+1</sup> = <i>x</i> &middot; (<i>x</i><sup>2</sup>)<sup><i>k</i></sup> reduces to <i>x</i> (because <i>x</i><sup>3</sup> = <i>x</i> means <i>x</i><sup>2</sup> acts like 1 when multiplied by <i>x</i>). Five odd-power terms give 5<i>x</i>. Polynomial division by computer also gives 5<i>x</i>.<br><br><b>Trap</b><br>Answering 5 (forgetting that each term reduces to <i>x</i>, not 1), or &minus;5<i>x</i> (using <i>f</i>(&minus;1) with the wrong sign).", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Find the smallest positive integer <i>n</i> for which the expansion of (<i>xy</i>&minus;3<i>x</i>+7<i>y</i>&minus;21)<sup><i>n</i></sup>, after like terms have been collected, has at least 1996 terms.", "opts": ["44", "45", "42", "43"], "ci": 0, "exp": "<b>What we need:</b> the smallest <i>n</i> such that (<i>xy</i>&minus;3<i>x</i>+7<i>y</i>&minus;21)<sup><i>n</i></sup>, fully expanded and simplified, has at least 1996 different terms.<br><br><b>Step 1 — Factor the base by grouping.</b> Group the first two terms and the last two terms: <i>xy</i>&minus;3<i>x</i> = <i>x</i>(<i>y</i>&minus;3) and 7<i>y</i>&minus;21 = 7(<i>y</i>&minus;3). So <i>xy</i>&minus;3<i>x</i>+7<i>y</i>&minus;21 = (<i>x</i>+7)(<i>y</i>&minus;3). Factoring first is the key idea: it splits the problem into one part with only <i>x</i> and one part with only <i>y</i>.<br><br><b>Step 2 — Raise to the power.</b> (<i>xy</i>&minus;3<i>x</i>+7<i>y</i>&minus;21)<sup><i>n</i></sup> = (<i>x</i>+7)<sup><i>n</i></sup>&middot;(<i>y</i>&minus;3)<sup><i>n</i></sup>.<br><br><b>Step 3 — Count the terms of each factor.</b> By the binomial theorem, (<i>x</i>+7)<sup><i>n</i></sup> has the <i>n</i>+1 terms <i>x</i><sup>0</sup>, <i>x</i><sup>1</sup>, …, <i>x</i><sup><i>n</i></sup>, and none of their coefficients is zero (each is a binomial coefficient times a power of 7). In the same way (<i>y</i>&minus;3)<sup><i>n</i></sup> has <i>n</i>+1 nonzero terms <i>y</i><sup>0</sup>, …, <i>y</i><sup><i>n</i></sup>.<br><br><b>Step 4 — Count the terms of the product.</b> Multiplying gives every product <i>x</i><sup><i>a</i></sup><i>y</i><sup><i>b</i></sup> with 0 &le; <i>a</i> &le; <i>n</i> and 0 &le; <i>b</i> &le; <i>n</i>. Different pairs (<i>a</i>, <i>b</i>) give different monomials, so nothing combines and nothing cancels. The number of terms is (<i>n</i>+1)&times;(<i>n</i>+1) = (<i>n</i>+1)<sup>2</sup>.<br><br><b>Step 5 — Solve the inequality.</b> We need (<i>n</i>+1)<sup>2</sup> &ge; 1996. Now 44<sup>2</sup> = 1936, which is too small, and 45<sup>2</sup> = 2025, which is enough. So <i>n</i>+1 = 45, which gives <i>n</i> = 44.<br><br><b>Answer check:</b> for <i>n</i> = 43 there are 44<sup>2</sup> = 1936 terms (fewer than 1996); for <i>n</i> = 44 there are 45<sup>2</sup> = 2025 terms (at least 1996). A computer expansion of the original expression gives the same counts, 1936 and 2025.<br><br><b>Trap:</b> 45 comes from forgetting the &ldquo;+1&rdquo; (using <i>n</i><sup>2</sup> &ge; 1996 instead of (<i>n</i>+1)<sup>2</sup>), and 43 or 42 come from rounding the square root of 1996 (about 44.7) the wrong way.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Find all real roots of<br><br>(2<i>x</i> + 1)(3<i>x</i> + 1)(5<i>x</i> + 1)(30<i>x</i> + 1) = 10.", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;2 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>"], "ci": 3, "exp": "<b>What we need:</b> every real <i>x</i> with (2<i>x</i>+1)(3<i>x</i>+1)(5<i>x</i>+1)(30<i>x</i>+1) = 10.<br><br><b>Step 1 — Pair the factors so the middle terms match.</b> Expanding all four at once gives a messy degree-4 equation. Instead, pair the outer and inner factors: (2<i>x</i>+1)(30<i>x</i>+1) = 60<i>x</i><sup>2</sup>+32<i>x</i>+1 and (3<i>x</i>+1)(5<i>x</i>+1) = 15<i>x</i><sup>2</sup>+8<i>x</i>+1. Notice that 60<i>x</i><sup>2</sup>+32<i>x</i> is exactly 4 times 15<i>x</i><sup>2</sup>+8<i>x</i>. That is why this pairing works (2&middot;30 = 60 = 4&middot;15 and 2+30 = 32 = 4&middot;8).<br><br><b>Step 2 — Substitute.</b> Let <i>u</i> = 15<i>x</i><sup>2</sup>+8<i>x</i>. Then the first pair is 4<i>u</i>+1 and the second pair is <i>u</i>+1, so the equation becomes (4<i>u</i>+1)(<i>u</i>+1) = 10.<br><br><b>Step 3 — Solve for <i>u</i>.</b> Expand: 4<i>u</i><sup>2</sup>+5<i>u</i>+1 = 10, so 4<i>u</i><sup>2</sup>+5<i>u</i>&minus;9 = 0. This factors as (4<i>u</i>+9)(<i>u</i>&minus;1) = 0, so <i>u</i> = 1 or <i>u</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span>.<br><br><b>Step 4 — Throw out the case with no real roots.</b> If <i>u</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span>, then 15<i>x</i><sup>2</sup>+8<i>x</i>+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = 0. Its discriminant is 8<sup>2</sup> &minus; 4&middot;15&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = 64 &minus; 135 = &minus;71 &lt; 0, so there are no real solutions here.<br><br><b>Step 5 — Solve the remaining quadratic.</b> If <i>u</i> = 1, then 15<i>x</i><sup>2</sup>+8<i>x</i>&minus;1 = 0. The quadratic formula gives <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">8<sup>2</sup>+4&middot;15</span></span></span><span style=\"border-top:1.4px solid #111;\">2&middot;15</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">124</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span>. Since <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">124</span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">4&middot;31</span></span> = 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span>, this simplifies to <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>.<br><br><b>Answer check:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span> &asymp; 0.1045 and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span> &asymp; &minus;0.6379. Plugging each back into the original product gives exactly 10 (checked symbolically). The other two roots of the degree-4 equation are complex, so these are the only real roots.<br><br><b>Trap:</b> forgetting to cancel the 2 when simplifying <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span> gives a denominator of 30; flipping the sign of the 8 gives 4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span> on top; dividing only one term by 2 gives &minus;2 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span>.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Let <i>x</i> and <i>y</i> be real numbers satisfying<br><br>(<i>x</i><sup>2</sup> + <i>x</i> &minus; 1)(<i>x</i><sup>2</sup> &minus; <i>x</i> + 1) = 2(<i>y</i><sup>3</sup> &minus; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> &minus; 1)<br><br>and<br><br>(<i>y</i><sup>2</sup> + <i>y</i> &minus; 1)(<i>y</i><sup>2</sup> &minus; <i>y</i> + 1) = 2(<i>x</i><sup>3</sup> + 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> &minus; 1).<br><br>Find 8<i>x</i><sup>2</sup> + 4<i>y</i><sup>3</sup>. (Purple Comet)", "opts": ["10", "0", "40", "20"], "ci": 3, "exp": "<b>What we need:</b> the value of 8<i>x</i><sup>2</sup> + 4<i>y</i><sup>3</sup> for real numbers <i>x</i>, <i>y</i> that satisfy both equations.<br><br><b>Step 1 &mdash; Simplify the left sides.</b> (<i>x</i><sup>2</sup> + <i>x</i> &minus; 1)(<i>x</i><sup>2</sup> &minus; <i>x</i> + 1) = (<i>x</i><sup>2</sup> + (<i>x</i> &minus; 1))(<i>x</i><sup>2</sup> &minus; (<i>x</i> &minus; 1)) = <i>x</i><sup>4</sup> &minus; (<i>x</i> &minus; 1)<sup>2</sup> = <i>x</i><sup>4</sup> &minus; <i>x</i><sup>2</sup> + 2<i>x</i> &minus; 1. The <i>y</i> equation works the same way.<br><br><b>Step 2 &mdash; Guess numbers that make powers simple.</b> The &plusmn;2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> in the problem suggests the golden-ratio numbers <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span> and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span>, which are the two roots of <i>t</i><sup>2</sup> = <i>t</i> + 1. For any such <i>t</i>: <i>t</i><sup>3</sup> = <i>t</i> &middot; <i>t</i><sup>2</sup> = <i>t</i><sup>2</sup> + <i>t</i> = 2<i>t</i> + 1, and <i>t</i><sup>4</sup> = (<i>t</i><sup>2</sup>)<sup>2</sup> = (<i>t</i> + 1)<sup>2</sup> = <i>t</i><sup>2</sup> + 2<i>t</i> + 1 = 3<i>t</i> + 2.<br><br><b>Step 3 &mdash; Check <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span>, <i>y</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span>.</b> Here <i>y</i> &minus; <i>x</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span> and <i>x</i> + <i>y</i> = 1.<br>First equation: left side = <i>x</i><sup>4</sup> &minus; <i>x</i><sup>2</sup> + 2<i>x</i> &minus; 1 = (3<i>x</i> + 2) &minus; (<i>x</i> + 1) + 2<i>x</i> &minus; 1 = 4<i>x</i>. Right side = 2((2<i>y</i> + 1) &minus; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/
