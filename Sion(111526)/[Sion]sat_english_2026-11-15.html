<script>
var TITLE = "[Sion] SAT English";
var QUIZ_KEY = "sionsatenglish_10";
var INSTRUCTION = "Read each text carefully and choose the best answer. This week's review — questions you missed recently.";
var TODAY_STR = "20261115";
var RAW_QUESTIONS = [{"passage": "<b>Text 1</b><br>Many historians credit the printing press with the rapid spread of the Protestant Reformation. Within a few years of 1517, printers had produced hundreds of thousands of copies of Martin Luther&rsquo;s pamphlets, allowing his ideas to reach audiences far beyond the reach of any preacher.<br><br><b>Text 2</b><br>Some economic historians note that cities with printing presses were more likely to adopt Protestantism, but the effect was far from uniform. Pamphlets spread most quickly in cities that already had high literacy and dense trade networks; elsewhere, printed material circulated slowly and won few converts. Printing, in this view, amplified the Reformation only where other conditions were already in place.", "stem": "Based on the texts, how would the historians described in Text 2 most likely respond to the historians described in Text 1?", "opts": ["By pointing out that the printing press was not invented until after Luther&rsquo;s pamphlets had already spread.", "By agreeing that printing helped spread Reformation ideas but arguing that its effect depended on conditions such as literacy and trade.", "By rejecting the idea that printed pamphlets played any meaningful role in the spread of the Reformation.", "By arguing that trade networks, rather than religious ideas, were the true cause of the Reformation."], "ci": 1, "exp": "<b>Step 1 &mdash; Text 1&rsquo;s claim:</b> printing caused the rapid spread.<br><b>Step 2 &mdash; Text 2&rsquo;s position:</b> printing is linked to Protestantism (&ldquo;more likely to adopt&rdquo;), <i>but</i> only &ldquo;where other conditions were already in place.&rdquo; That is partial agreement with a qualification.<br><br><b>Why the others fail:</b><br>&bull; &ldquo;Any meaningful role&rdquo; is too strong; Text 2 says printing <i>amplified</i> the movement.<br>&bull; Text 2 never says trade caused the Reformation itself; trade affected how fast pamphlets spread.<br>&bull; Factually wrong and contradicted by Text 1: pamphlets were printed after 1517, so the press already existed.<br><br><b>Strategy:</b> In cross-text questions, the answer is often &ldquo;agrees in part, but adds a limit.&rdquo; Watch for words like <i>only</i>, <i>far from uniform</i>, and <i>in this view</i>.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Recovered from a shipwreck off the Greek island of Antikythera in 1901, the corroded bronze device was long dismissed as a mere ______ in the 2000s, however, X-ray imaging revealed that its interlocking gears modeled the motions of the Moon and planets.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["curiosity;", "curiosity", "curiosity, which", "curiosity,"], "ci": 0, "exp": "<b>Structure:</b> &ldquo;the &hellip; device was long dismissed as a mere curiosity&rdquo; is an independent clause, and &ldquo;in the 2000s, however, X-ray imaging revealed &hellip;&rdquo; is another independent clause. <i>However</i> sits inside the second clause, so it cannot join the two. Two independent clauses need a period or a semicolon: <i>curiosity;</i>.<br><br><b>Why the others fail:</b> a comma alone creates a comma splice; no punctuation creates a run-on; &ldquo;which in the 2000s, however, X-ray imaging revealed&rdquo; leaves <i>which</i> with nothing to do (the clause already has a subject, <i>X-ray imaging</i>).<br><br><b>Trap:</b> Many students put the semicolon <i>after</i> however out of habit. Ask where the first complete sentence ends &mdash; the semicolon goes there.", "tag": "Standard English Conventions", "tagcolor": "#1D9E75"}, {"passage": "Although the startup&rsquo;s founders announced that their new battery could fully charge an electric car in under a minute, many engineers regarded the claim as ______, noting that the company had not released any independent test results.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["unequivocal", "meticulous", "inevitable", "dubious"], "ci": 3, "exp": "<b>Clue:</b> the engineers point out that there were <i>no independent test results</i>, so they doubt the claim. <i>Dubious</i> means &ldquo;doubtful; probably not true.&rdquo;<br><br><b>Why the others fail:</b> <i>unequivocal</i> (perfectly clear, leaving no doubt) is the opposite of what the engineers think; <i>meticulous</i> (very careful and precise) describes people or work, not a doubtful claim; <i>inevitable</i> (certain to happen) contradicts their skepticism.<br><br><b>Vocabulary:</b> dubious (adj.) &mdash; doubtful, questionable. Related: dubiously (adv.). Example: <i>The study&rsquo;s tiny sample made its conclusions <b>dubious</b>.</i>", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Archaeologists excavating a ninth-century Norse settlement in Iceland found that the earliest houses had long central hearths, while houses built about a century later had much smaller hearths and noticeably thicker turf walls. Pollen preserved in nearby bogs shows that birch woodland, the settlers&rsquo; main source of fuel, shrank sharply during the same period. Taken together, these findings suggest that ______", "stem": "Which choice most logically completes the text?", "opts": ["the birch woodland disappeared because thick turf walls required large amounts of wood.", "the settlers redesigned their houses to hold in heat as firewood became scarcer.", "Iceland&rsquo;s climate grew warmer during the century, so large fires were no longer needed.", "the later houses were built by a different group of settlers with different building traditions."], "ci": 1, "exp": "<b>Connect the two findings:</b> (1) fuel (birch) became scarce; (2) hearths shrank while walls thickened. Smaller fires use less wood, and thicker turf walls insulate better. The completion that links these is an adaptation to conserve heat as fuel ran short.<br><br><b>Why the others fail:</b><br>&bull; A &ldquo;different group&rdquo; is never mentioned; nothing in the evidence points to new people.<br>&bull; A warmer climate would explain smaller hearths but not <i>thicker</i> walls, and the text gives no climate data.<br>&bull; The last choice reverses the logic: turf walls are made of turf (sod), not wood, so they would not use up the birch.<br><br><b>Strategy:</b> A correct inference must be supported by <i>every</i> piece of evidence in the text, not just one of them.", "tag": "Information and Ideas", "tagcolor": "#185FA5"}, {"passage": "Although the first two trial runs of the new desalination system had produced only cloudy, salty water, the lead engineer remained ______ about the project, pointing out that each failed test had revealed a specific flaw that her team already knew how to fix.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["despondent", "sanguine", "indifferent", "credulous"], "ci": 1, "exp": "<b>What the question asks:</b> choose the word that describes the engineer&rsquo;s attitude, using the clues in the sentence.<br><br><b>Clue:</b> <i>Although</i> signals a contrast with the failed trials, and the second half gives her reason for hope &mdash; every flaw is one the team &ldquo;already knew how to fix.&rdquo; So she stays hopeful and confident. <i>Sanguine</i> means cheerfully optimistic, especially in a difficult situation.<br><br><b>Why the others fail:</b> <i>despondent</i> (hopeless, dejected) is the opposite of the attitude the contrast word <i>Although</i> sets up. <i>Indifferent</i> (not caring) clashes with her active explanation of how the team will fix each flaw. <i>Credulous</i> means too ready to believe things without evidence &mdash; but she has a concrete, evidence-based reason for her optimism, so the negative shade of <i>credulous</i> does not fit.<br><br><b>Vocabulary:</b> sanguine (adj.) &mdash; optimistic, confident about the future. Related: sanguinely (adv.). Example: <i>Despite the delay, the coach was <b>sanguine</b> about the team&rsquo;s chances.</i><br><br><b>Strategy:</b> when a sentence begins with <i>Although</i>, predict a word that pushes against the first clause before you look at the choices.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "The veteran air traffic controller was known for her ______: even when a sudden storm forced dozens of flights to change course at once, she spoke to every pilot in the same calm, measured tone she used on quiet mornings.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["audacity", "ambivalence", "equanimity", "vehemence"], "ci": 2, "exp": "<b>What the question asks:</b> choose the quality that the colon&rsquo;s example illustrates.<br><br><b>Clue:</b> the colon introduces an example: under heavy pressure (a storm, dozens of rerouted flights), she kept &ldquo;the same calm, measured tone.&rdquo; The blank must name steady calmness under stress &mdash; <i>equanimity</i>.<br><br><b>Why the others fail:</b> <i>audacity</i> means bold daring or willingness to take risks; nothing in the example shows risk-taking. <i>Ambivalence</i> means having mixed feelings or being unable to decide &mdash; she shows no uncertainty. <i>Vehemence</i> means forceful, intense emotion, the opposite of a &ldquo;calm, measured tone.&rdquo;<br><br><b>Vocabulary:</b> equanimity (n.) &mdash; mental calmness and evenness of temper, especially in a hard situation. Related: equanimous (adj.). Example: <i>She accepted the bad news with surprising <b>equanimity</b>.</i><br><br><b>Strategy:</b> a colon often means &ldquo;here is an example or explanation.&rdquo; Describe the example in your own words (&ldquo;stays calm under pressure&rdquo;) and match that.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Before the 1880s, most towns in the United States set their clocks by local solar time, so noon in one city could fall several minutes earlier or later than noon in a city just a hundred miles away. For railroad companies, this patchwork created a practical problem: a single timetable had to list arrival and departure times in dozens of different local times. In November 1883, the major railroads adopted a system of standard time zones, and many towns quickly reset their own clocks to match, even though Congress did not make standard time zones a matter of federal law until 1918. This suggests that ______", "stem": "Which choice most logically completes the text?", "opts": ["Congress actively opposed the railroads&rsquo; time zones until it was finally persuaded to accept them in 1918.", "railroad timetables did not actually become simpler until standard time zones were made official by law.", "the railroads&rsquo; influence on everyday life was strong enough to change how towns kept time even without a legal requirement.", "most towns had been dissatisfied with local solar time for many years before the railroads were built."], "ci": 2, "exp": "<b>What the question asks:</b> which conclusion follows logically from the facts in the text.<br><br><b>Reasoning:</b> the key contrast is in the last sentence: towns <i>quickly</i> adopted the railroads&rsquo; time zones <i>even though</i> no federal law required them to until 1918 (35 years later). If towns changed without being legally forced, something else must have pushed them &mdash; the obvious candidate in the text is the railroads, whose schedules people depended on. So the railroads&rsquo; practical influence was strong enough to change local timekeeping on its own.<br><br><b>Why the others fail:</b> &ldquo;Congress actively opposed the railroads&rsquo; time zones&rdquo; &mdash; the text says only that a law came in 1918; a delay is not the same as opposition. &ldquo;dissatisfied with local solar time for many years before the railroads&rdquo; &mdash; the text presents the problem as a railroad problem and gives no information about towns&rsquo; feelings before railroads. &ldquo;timetables did not actually become simpler until&hellip; law&rdquo; &mdash; the railroads adopted the zones themselves in 1883, so their timetables could use the zones right away; nothing suggests they waited for the law.<br><br><b>Strategy:</b> for inference completions, look for the sentence with a contrast (<i>even though</i>) &mdash; the answer usually explains that contrast without adding new facts.", "tag": "Information and Ideas", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-11-15 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-11-15 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
