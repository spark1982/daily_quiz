<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Quiz 12</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f9; min-height: 100vh; padding: 16px; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .date-display { font-size: 2rem; font-weight: 800; text-align: center; color: #185FA5; background: white; margin-bottom: 10px; padding: 8px 0; border-radius: 10px; }
  .quiz-header { background: #185FA5; border-radius: 14px 14px 0 0; padding: 16px 20px 12px; color: white; }
  .quiz-title { font-size: 18px; font-weight: 700; }
  .quiz-subtitle { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .dot-nav-wrap { background: #1a6ab8; padding: 10px 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dot { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.25); color: white; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; user-select: none; }
  .dot.active { background: white; color: #185FA5; }
  .dot.correct { background: #1D9E75; }
  .dot.wrong { background: #E24B4A; }
  .dot.results-dot { width: auto; padding: 0 10px; border-radius: 20px; font-size: 11px; background: rgba(255,255,255,0.25); }
  .dot.results-dot.active { background: white; color: #185FA5; }
  .counter-bar { background: #1a6ab8; padding: 0 20px 10px; display: flex; justify-content: center; }
  .counter { background: rgba(255,255,255,0.2); border-radius: 20px; padding: 3px 14px; font-size: 13px; font-weight: 600; color: white; }
  .card { background: white; border-radius: 0 0 14px 14px; padding: 24px 20px 20px; box-shadow: 0 4px 16px rgba(24,95,165,0.10); }
  .type-badge { display: inline-block; background: #185FA5; color: white; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; letter-spacing: 0.5px; text-transform: uppercase; }
  .question-text { font-size: 17px; font-weight: 600; color: #111; line-height: 1.55; margin-bottom: 22px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .option-row { display: flex; align-items: stretch; gap: 8px; }
  .option-btn { flex: 1; padding: 13px 16px; border-radius: 10px; border: 2px solid transparent; background: #e8edf4; color: #111111; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer; line-height: 1.4; }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct-sel { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .option-btn.wrong-sel { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
  .option-btn.revealed-correct { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .speak-btn { flex-shrink: 0; width: 44px; min-height: 44px; border-radius: 10px; border: 2px solid #d0d8e4; background: #f4f7fb; color: #185FA5; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .speak-btn.speaking { background: #dceeff; border-color: #185FA5; }
  .explanation { background: #fff8e1; border-left: 4px solid #f59e0b; border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 14px; color: #4a3000; line-height: 1.5; margin-bottom: 16px; display: none; }
  .explanation.show { display: block; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; }
  .nav-btn { padding: 11px 22px; border-radius: 10px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-prev { background: #e8edf4; color: #185FA5; min-width: 80px; }
  .btn-next { background: #185FA5; color: white; min-width: 80px; }
  .btn-prev:disabled { opacity: 0.4; cursor: default; }
  .results-screen { display: none; }
  .results-screen.show { display: block; }
  .results-title { font-size: 22px; font-weight: 800; color: #185FA5; margin-bottom: 6px; text-align: center; }
  .results-score { text-align: center; font-size: 15px; color: #444; margin-bottom: 18px; }
  .results-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
  .result-card { border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; border: 2px solid transparent; }
  .result-card .rq { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .result-card .rs { font-size: 10px; font-weight: 600; }
  .result-card.rc { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .result-card.rw { background: #FCEBEB; border-color: #E24B4A; color: #501313; }
  .result-card.rk { background: #e8edf4; border-color: #aab4c4; color: #555; }
  .results-actions { display: flex; gap: 10px; }
  .btn-copy-all { flex: 1; padding: 12px; border-radius: 10px; background: #e8edf4; color: #185FA5; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-fresh { flex: 1; padding: 12px; border-radius: 10px; background: #185FA5; color: white; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
  .main-screen { display: block; }
  .main-screen.hide { display: none; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: white; border-radius: 16px; padding: 28px 24px 20px; max-width: 300px; width: 90%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
  .modal-title { font-size: 17px; font-weight: 700; color: #111; margin-bottom: 8px; }
  .modal-msg { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-cancel { flex: 1; padding: 11px; border-radius: 10px; border: none; background: #e8edf4; color: #185FA5; font-size: 14px; font-weight: 700; cursor: pointer; }
  .modal-confirm { flex: 1; padding: 11px; border-radius: 10px; border: none; background: #E24B4A; color: white; font-size: 14px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="date-display">Friday, June 5, 2026</div>
  <div class="quiz-header">
    <div class="quiz-title">Vocabulary Quiz</div>
    <div class="quiz-subtitle">Choose the word that matches the definition</div>
  </div>
  <div class="dot-nav-wrap" id="dotNav"></div>
  <div class="counter-bar"><div class="counter" id="counterDisplay">1 / 15</div></div>
  <div class="card">
    <div class="main-screen" id="mainScreen">
      <div class="type-badge">Vocabulary</div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="explanation" id="explanation"></div>
      <div class="nav-row">
        <button class="nav-btn btn-prev" id="btnPrev" onclick="navigate(-1)">&#8592; Prev</button>
        <button class="nav-btn btn-next" id="btnNext" onclick="navigate(1)">Next &#8594;</button>
      </div>
    </div>
    <div class="results-screen" id="resultsScreen">
      <div class="results-title" id="resultsTitle"></div>
      <div class="results-score" id="resultsScore"></div>
      <div class="results-grid" id="resultsGrid"></div>
      <div class="results-actions">
        <button class="btn-copy-all" onclick="copyAll()">Copy All Results</button>
        <button class="btn-fresh" onclick="openModal()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title">Start Over?</div>
    <div class="modal-msg">All your answers will be cleared. This cannot be undone.</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>
<script>
var STORAGE_KEY='vocab_quiz_12';
var questions=[
  {definition:"Great enthusiasm and passion for a cause, belief, or activity.",answer:"ardor",distractors:["fervent","animated","ebullient"]},
  {definition:"Showing or having cruel disregard for the feelings or suffering of others; cold-hearted.",answer:"callous",distractors:["indifferent","brusque","perfunctory"]},
  {definition:"Intended to reduce hostility and make peace; aiming to smooth over disagreements.",answer:"conciliatory",distractors:["amenable","appease","deferential"]},
  {definition:"Abundant in supply or quantity; present in large amounts.",answer:"copious",distractors:["profuse","replete","lavish"]},
  {definition:"Essentially different in kind; not comparable; made up of distinct or unlike elements.",answer:"disparate",distractors:["discordant","eclectic","amorphous"]},
  {definition:"Successful in producing a desired or intended result; capable and effective.",answer:"efficacious",distractors:["viable","compelling","adept"]},
  {definition:"In accordance with the highest standards; entirely without fault or error.",answer:"impeccable",distractors:["meticulous","scrupulous","fastidious"]},
  {definition:"Not likely to harm or upset anyone; harmless and inoffensive.",answer:"innocuous",distractors:["benign","inane","trivial"]},
  {definition:"Evoking a keen sense of sadness, regret, or deep emotion; deeply moving.",answer:"poignant",distractors:["lugubrious","somber","despondent"]},
  {definition:"Not securely held; dependent on uncertain circumstances; risky and unstable.",answer:"precarious",distractors:["tenuous","fraught","volatile"]},
  {definition:"Competent or skilled at doing something; having expertise through practice.",answer:"proficient",distractors:["adept","deft","adroit"]},
  {definition:"A state of uncertainty or perplexity, especially when one must make a difficult choice.",answer:"quandary",distractors:["quagmire","impasse","conundrum"]},
  {definition:"Not flowing or moving; showing no activity, growth, or development; sluggish.",answer:"stagnant",distractors:["static","dormant","torpid"]},
  {definition:"Eager or quick to argue or fight; aggressively defiant and uncooperative.",answer:"truculent",distractors:["fractious","recalcitrant","contentious"]},
  {definition:"To clear someone of blame or suspicion; to show that a person or action was right or justified.",answer:"vindicate",distractors:["exculpate","reprieve","absolution"]}
];
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function defaultState(){return{current:0,answers:new Array(questions.length).fill(null),shuffledOptions:questions.map(function(q){return shuffle([q.answer].concat(q.distractors));}),finished:false};}
var state=defaultState();
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function loadState(){try{var s=localStorage.getItem(STORAGE_KEY);if(s){var p=JSON.parse(s);if(p.answers&&Array.isArray(p.answers)&&p.answers.length===questions.length&&p.shuffledOptions&&Array.isArray(p.shuffledOptions)&&p.shuffledOptions.length===questions.length&&typeof p.current==='number'&&p.current>=0&&p.current<questions.length){state=p;return true;}else{localStorage.removeItem(STORAGE_KEY);}}}catch(e){try{localStorage.removeItem(STORAGE_KEY);}catch(e2){}}return false;}
var currentSpeakBtn=null;
function speakWord(word,btn){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();if(currentSpeakBtn){currentSpeakBtn.classList.remove('speaking');currentSpeakBtn.textContent='\uD83D\uDD0A';}if(currentSpeakBtn===btn){currentSpeakBtn=null;return;}var utt=new SpeechSynthesisUtterance(word);utt.lang='en-US';utt.rate=0.9;currentSpeakBtn=btn;btn.classList.add('speaking');btn.textContent='\u23F9';utt.onend=function(){btn.classList.remove('speaking');btn.textContent='\uD83D\uDD0A';if(currentSpeakBtn===btn)currentSpeakBtn=null;};utt.onerror=function(){btn.classList.remove('speaking');btn.textContent='\uD83D\uDD0A';if(currentSpeakBtn===btn)currentSpeakBtn=null;};window.speechSynthesis.speak(utt);}
function buildDotNav(){var nav=document.getElementById('dotNav');nav.innerHTML='';questions.forEach(function(_,i){var d=document.createElement('div');d.className='dot'+(i===state.current&&!state.finished?' active':'');if(state.answers[i]!==null)d.classList.add(state.answers[i]===questions[i].answer?'correct':'wrong');d.textContent=i+1;d.onclick=(function(idx){return function(){state.finished=false;goTo(idx);};})(i);nav.appendChild(d);});var rd=document.createElement('div');rd.className='dot results-dot'+(state.finished?' active':'');rd.textContent='Results';rd.onclick=function(){showResults();};nav.appendChild(rd);}
function renderQuestion(){var q=questions[state.current];var opts=state.shuffledOptions[state.current];var userAnswer=state.answers[state.current];document.getElementById('questionText').textContent=q.definition;document.getElementById('counterDisplay').textContent=(state.current+1)+' / '+questions.length;if(window.speechSynthesis)window.speechSynthesis.cancel();if(currentSpeakBtn){currentSpeakBtn.classList.remove('speaking');currentSpeakBtn.textContent='\uD83D\uDD0A';currentSpeakBtn=null;}var container=document.getElementById('optionsContainer');container.innerHTML='';opts.forEach(function(opt){var row=document.createElement('div');row.className='option-row';var btn=document.createElement('button');btn.className='option-btn';btn.textContent=opt;var spk=document.createElement('button');spk.className='speak-btn';spk.textContent='\uD83D\uDD0A';spk.setAttribute('aria-label','Pronounce '+opt);spk.onclick=(function(w,b){return function(e){e.stopPropagation();speakWord(w,b);};})(opt,spk);if(userAnswer!==null){btn.disabled=true;if(opt===userAnswer)btn.classList.add(userAnswer===q.answer?'correct-sel':'wrong-sel');else if(opt===q.answer&&userAnswer!==q.answer)btn.classList.add('revealed-correct');}else{btn.onclick=(function(o){return function(){selectAnswer(o);};})(opt);}row.appendChild(btn);row.appendChild(spk);container.appendChild(row);});var expEl=document.getElementById('explanation');if(userAnswer!==null&&userAnswer!==q.answer){expEl.textContent='You chose "'+userAnswer+'." The correct answer is "'+q.answer+'." While these words may seem similar, "'+q.answer+'" specifically means: '+q.definition;expEl.classList.add('show');}else{expEl.classList.remove('show');expEl.textContent='';}var isLast=state.current===questions.length-1;document.getElementById('btnNext').textContent=isLast?'See Results \u2192':'Next \u2192';document.getElementById('btnPrev').disabled=state.current===0;buildDotNav();}
function selectAnswer(opt){state.answers[state.current]=opt;saveState();renderQuestion();}
function navigate(dir){if(dir===1&&state.current===questions.length-1){showResults();return;}var next=state.current+dir;if(next>=0&&next<questions.length)goTo(next);}
function goTo(i){state.current=i;state.finished=false;document.getElementById('mainScreen').classList.remove('hide');document.getElementById('resultsScreen').classList.remove('show');saveState();renderQuestion();}
function showResults(){if(window.speechSynthesis)window.speechSynthesis.cancel();state.finished=true;saveState();document.getElementById('mainScreen').classList.add('hide');document.getElementById('resultsScreen').classList.add('show');buildDotNav();var correct=state.answers.filter(function(a,i){return a===questions[i].answer;}).length;var skipped=state.answers.filter(function(a){return a===null;}).length;var wrong=questions.length-correct-skipped;document.getElementById('resultsTitle').textContent=correct+' / '+questions.length+' Correct';document.getElementById('resultsScore').textContent=wrong+' wrong \u00b7 '+skipped+' skipped';document.getElementById('counterDisplay').textContent=correct+' / '+questions.length;var grid=document.getElementById('resultsGrid');grid.innerHTML='';questions.forEach(function(q,i){var a=state.answers[i];var card=document.createElement('div');var cls='result-card ';var label='';if(a===null){cls+='rk';label='Skipped';}else if(a===q.answer){cls+='rc';label='Correct';}else{cls+='rw';label='Wrong';}card.className=cls;card.innerHTML='<div class="rq">Q'+(i+1)+'</div><div class="rs">'+label+'</div>';card.onclick=(function(idx){return function(){goTo(idx);};})(i);grid.appendChild(card);});}
function copyAll(){var lines=questions.map(function(q,i){var a=state.answers[i];var status=a===null?'Skipped':a===q.answer?'Correct':'Wrong';return'Q'+(i+1)+': '+status+(a&&a!==q.answer?' (Your answer: '+a+' | Correct: '+q.answer+')':'');});try{navigator.clipboard.writeText(lines.join('\n'));}catch(e){prompt('Copy this:',lines.join('\n'));}}
function openModal(){document.getElementById('modalOverlay').classList.add('show');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
function confirmFresh(){closeModal();if(window.speechSynthesis)window.speechSynthesis.cancel();try{localStorage.removeItem(STORAGE_KEY);}catch(e){}state=defaultState();document.getElementById('mainScreen').classList.remove('hide');document.getElementById('resultsScreen').classList.remove('show');saveState();renderQuestion();}
loadState();
if(state.finished){showResults();}else{renderQuestion();}
</script>
</body>
</html>
