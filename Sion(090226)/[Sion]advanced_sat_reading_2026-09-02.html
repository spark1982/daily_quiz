<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}

.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}

.timer-start-btn { background: #185FA5; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }

.timer-label { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.02em; }
.timer-display { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }

.results-pill{display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;border:none;}

.options{display:flex;flex-direction:column;gap:9px;}

.nav-btns{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
.prev-btn,.next-btn{padding:9px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;}
.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}
.r-card.correct{background:#E1F5EE;color:#085041;}
.r-card.wrong{background:#FCEBEB;color:#501313;}
.r-card.skipped{background:#f5f7fa;color:#555;}
.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}

.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}
.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}
</style>
</head>

<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_20260902_v1";var ATT_KEY = "quiz_sionadvreading_12_att_20260902_v1";var RAW_QUESTIONS = [{"tag": "Words in Context", "tagcolor": "#7b61ff", "passage": "The negotiator's reputation for ______ made even hardened rivals willing to compromise, since both sides trusted that any deal she brokered would be scrupulously fair to all parties.", "stem": "Which choice completes the text with the most logical and precise word?", "opts": ["impartiality", "ambition", "secrecy", "flexibility"], "ci": 0, "exp": "The passage emphasizes that rivals trusted her deals to be \"scrupulously fair to all parties,\" which precisely matches \"impartiality.\" \"Ambition\" and \"secrecy\" don't relate to fairness. \"Flexibility\" describes willingness to change, not fairness to both sides."}, {"tag": "Words in Context", "tagcolor": "#7b61ff", "passage": "Rather than presenting a unified front, the committee members offered ______ accounts of the incident, each contradicting the timeline given by the others.", "stem": "Which choice completes the text with the most logical and precise word?", "opts": ["consistent", "discrepant", "detailed", "official"], "ci": 1, "exp": "The clue \"each contradicting the timeline given by the others\" shows the accounts disagreed, matching \"discrepant.\" \"Consistent\" is the opposite. \"Detailed\" and \"official\" don't capture the contradiction described."}, {"tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "For decades, the small coastal town relied on its shipyard for nearly all local employment. When the shipyard closed in 1998, residents braced for economic collapse. Instead, a handful of former welders and machinists pooled their severance pay to open a specialty metal-fabrication shop, which now supplies custom parts to boat builders across three states. \"We didn't set out to save the town,\" one founder recalled. \"We just didn't know how to do anything else.\"", "stem": "Which choice best describes the function of the quotation in the final sentence?", "opts": ["It undercuts the founder's credibility by revealing he lacked a clear business plan.", "It adds a note of modesty that contrasts with the significant economic impact described earlier in the passage.", "It proves that the shipyard's closure was ultimately beneficial for the town's economy.", "It shifts the passage's focus away from the metal-fabrication shop and onto the shipyard's history."], "ci": 1, "exp": "The founder's plainspoken, modest explanation (\"We just didn't know how to do anything else\") stands in contrast to the passage's earlier description of a shop supplying parts across three states, highlighting an understated tone rather than undermining his credibility, proving a broad economic claim, or shifting the topic."}, {"tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "Do we really need another biography of a composer whose life has already filled a dozen volumes? This new book answers with an emphatic yes, unearthing correspondence that reframes the composer's most famous symphony not as a triumphant statement but as a private elegy for a friend lost to illness.", "stem": "The opening rhetorical question mainly serves to", "opts": ["dismiss the value of writing another biography about the composer.", "introduce a skeptical framing that the passage then overturns with new evidence.", "summarize the central argument of the biography being reviewed.", "criticize previous biographers for failing to consult the composer's correspondence."], "ci": 1, "exp": "The question voices a skeptical expectation (\"do we really need another\") that the next sentence immediately overturns by answering \"yes\" and describing new unearthed evidence, a classic setup-and-reversal structure. It doesn't dismiss the book, summarize its argument, or criticize earlier biographers directly."}, {"tag": "Text Structure and Purpose", "tagcolor": "#0d9488", "passage": "Urban planners have long debated whether wider sidewalks meaningfully increase pedestrian activity. A recent study tracked foot traffic on twelve city blocks before and after sidewalk expansions. Contrary to expectations, foot traffic increased only on blocks that also gained new ground-floor storefronts; blocks with wider sidewalks but no new businesses saw no measurable change. The researchers concluded that sidewalk width alone is not a reliable predictor of pedestrian activity, and that the presence of destinations matters more than available walking space.", "stem": "What is the main purpose of the passage?", "opts": ["To argue that cities should stop investing in sidewalk expansion projects entirely.", "To present a study's finding that a common assumption about sidewalk width and foot traffic does not hold without an additional factor.", "To describe the history of urban planning debates about pedestrian infrastructure.", "To compare the costs of sidewalk expansion projects across twelve different cities."], "ci": 1, "exp": "The passage centers on a study that tests and complicates the assumption that wider sidewalks alone boost foot traffic, concluding instead that the presence of new destinations matters more than sidewalk width itself. It does not argue against all sidewalk investment, recount planning history in general, or compare costs across cities."}, {"tag": "Text Structure and Purpose", "tagcolor": "#0d9488", "passage": "The article opens by describing the near-total collapse of the region's oyster population in the 1980s due to overharvesting and pollution. It then details a decades-long restoration effort involving hatchery-raised larvae and reef-building programs. The final section shifts to the present, reporting that oyster populations have rebounded to nearly forty percent of historic levels, and closes by noting the remaining challenges posed by rising water temperatures.", "stem": "Which choice best describes the overall structure of the passage?", "opts": ["It presents two competing theories about oyster population decline and evaluates which is more persuasive.", "It moves chronologically from a past crisis, through recovery efforts, to a present assessment that includes ongoing challenges.", "It argues that restoration efforts have entirely solved the problem of oyster population decline.", "It compares oyster restoration methods used in this region with those used in an unrelated region."], "ci": 1, "exp": "The passage moves from the 1980s collapse, to restoration efforts, to a present-day assessment that still notes challenges from rising water temperatures, matching a chronological past-to-present structure with an unresolved element. It doesn't weigh competing theories, claim the problem is fully solved, or compare two different regions."}, {"tag": "Command of Evidence", "tagcolor": "#1D9E75", "passage": "A city transportation official claims that installing protected bike lanes on Fifth Avenue reduced overall car travel times during rush hour, because removing car lanes forced better traffic signal coordination.", "stem": "Which finding, if true, would most directly support the official's claim?", "opts": ["Average car travel times on Fifth Avenue during rush hour decreased after the bike lanes and new signal timing were installed.", "Bicycle ridership on Fifth Avenue increased by twenty percent after the bike lanes were installed.", "Residents surveyed near Fifth Avenue reported feeling safer walking after the bike lanes were installed.", "The cost of installing the protected bike lanes was lower than initially budgeted."], "ci": 0, "exp": "The official's claim is specifically about reduced car travel times resulting from the changes, so direct evidence of decreased average car travel times after installation would most directly support it. Ridership, safety perceptions, and project cost don't address the claim about travel times."}, {"tag": "Command of Evidence", "tagcolor": "#1D9E75", "passage": "A nutritionist argues that a particular species of wild mushroom found in the region contains compounds that meaningfully improve memory retention in older adults.", "stem": "Which finding would most directly support the nutritionist's claim?", "opts": ["The mushroom species is difficult to cultivate commercially and is mostly foraged in the wild.", "Older adults who consumed the mushroom regularly for six months scored significantly higher on memory tests than a control group that did not.", "The mushroom has a mild, nutty flavor that is popular in regional cuisine.", "The mushroom grows most abundantly in cool, damp forests during autumn."], "ci": 1, "exp": "The claim is about the mushroom's effect on memory retention in older adults, so a controlled comparison showing higher memory test scores after regular consumption most directly supports that specific causal claim. The other findings describe cultivation, flavor, or growing conditions, none of which bear on memory effects."}, {"tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: Advocates of remote work argue that eliminating daily commutes gives employees more time for family, exercise, and rest, ultimately making them more productive during work hours.<br><br>Text 2: A recent workplace study found that employees working fully remotely reported the reclaimed commute time was most often absorbed by additional work tasks rather than personal activities, with average logged work hours increasing rather than decreasing.", "stem": "Based on the texts, how would the researchers in Text 2 most likely respond to the claim in Text 1 that eliminated commutes free up time for rest and family?", "opts": ["They would likely agree completely, since both texts describe commute time being used for personal activities.", "They would likely argue that, in practice, reclaimed commute time is often used for more work rather than rest or family time, complicating Text 1's assumption.", "They would likely argue that remote employees work fewer hours than office employees.", "They would likely argue that commuting itself has no effect on employee productivity."], "ci": 1, "exp": "Text 2's finding that reclaimed time was \"absorbed by additional work tasks\" rather than personal activities directly complicates Text 1's assumption that eliminated commutes free up time for rest and family. The texts do not agree completely, Text 2 shows increased rather than decreased work hours, and neither text claims commuting has no effect on productivity."}, {"tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: Some economists contend that raising the minimum wage in a region leads businesses to reduce hiring, since higher labor costs make it less affordable to staff at previous levels.<br><br>Text 2: A multi-year analysis of several regions that raised their minimum wage found no significant change in overall employment levels, though some individual businesses did reduce staff while others expanded to meet increased consumer spending from higher wages.", "stem": "Which choice best describes the relationship between the two texts?", "opts": ["Text 2 confirms Text 1's prediction that minimum wage increases uniformly reduce hiring across all businesses.", "Text 1 and Text 2 rely on the same multi-year dataset to reach their conclusions.", "Text 2 complicates Text 1's prediction by showing that overall employment effects were mixed rather than uniformly negative.", "Text 2 was written before Text 1 and inspired Text 1's economic theory."], "ci": 2, "exp": "Text 2's finding of no significant overall change, with some businesses cutting staff and others expanding, complicates rather than confirms Text 1's prediction of uniformly reduced hiring. There's no indication the texts share a dataset or that one inspired the other."}, {"tag": "Inferences", "tagcolor": "#f5a623", "passage": "Researchers studying a newly discovered species of deep-sea fish found that individuals living near hydrothermal vents had significantly thicker protective scales than individuals of the same species found in cooler waters farther from the vents. Both groups showed identical genetic markers, ruling out separate subspecies.", "stem": "Which conclusion about the fish's scale thickness is best supported by the passage?", "opts": ["Scale thickness in this species is determined entirely by genetic differences between populations.", "Scale thickness in this species may be influenced by environmental conditions near hydrothermal vents rather than genetic variation.", "Fish near hydrothermal vents belong to an entirely different species than those in cooler waters.", "Hydrothermal vents cause permanent genetic mutations in nearby fish populations."], "ci": 1, "exp": "Since both groups share identical genetic markers but differ in scale thickness based on proximity to vents, the passage supports environmental influence rather than genetic variation as the likely cause. The identical genetic markers rule out separate species or genetic determination, and there's no evidence of induced mutations."}, {"tag": "Inferences", "tagcolor": "#f5a623", "passage": "A survey of small business owners found that those who used formal written business plans were more likely to secure bank loans than those without written plans. However, among businesses that ultimately succeeded after five years, the presence of a written plan showed no correlation with survival rates.", "stem": "Which conclusion is best supported by the passage?", "opts": ["Written business plans are unnecessary for any aspect of running a small business.", "Written business plans may help with securing initial funding but do not appear to predict long-term business success.", "Businesses without written plans are more likely to succeed after five years than those with plans.", "Bank loan officers refuse to fund businesses that lack a written business plan."], "ci": 1, "exp": "The passage distinguishes between loan approval, which correlates with written plans, and five-year survival, which does not, supporting the conclusion that written plans may aid funding without predicting long-term success. It doesn't claim plans are entirely unnecessary, that plan-less businesses do better, or that loans are strictly refused without one."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
