<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_satgrammar_20_20260902_v1";var ATT_KEY = "quiz_satgrammar_20_att_20260902_v1";var RAW_QUESTIONS = [{"stem": "Which choice provides the best revision of the underlined portion?", "context": "Of all the applicants, Priya's portfolio was clearly the <u>more impressive</u>, combining technical precision with genuine creative vision.", "opts": ["more impressive", "most impressive", "impressive", "impressively"], "ci": 1, "exp": "\"Of all the applicants\" signals a comparison among three or more people, which requires the superlative \"most impressive.\" \"more impressive\" is a comparative form reserved for comparing exactly two things. \"impressive\" drops the necessary comparison entirely. \"impressively\" incorrectly turns the adjective into an adverb, which doesn't fit after the linking verb \"was.\"", "tag": "Comparative vs Superlative", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "By the time the fire department arrived, the flames <u>already spread</u> across the entire second floor of the warehouse.", "opts": ["already spread", "had already spread", "have already spread", "already spreading"], "ci": 1, "exp": "The spreading happened before the fire department's arrival, a past action completed before another past action, which requires the past perfect \"had already spread.\" \"already spread\" uses simple past, which doesn't clearly show the earlier action happened first. \"have already spread\" is present perfect and doesn't fit the past-tense frame of \"arrived.\" \"already spreading\" is not a complete verb and leaves the sentence without proper tense.", "tag": "Verb Tense (Past Perfect)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The committee members disagreed about <u>who they should nominate</u> for the award, since three candidates had nearly identical qualifications.", "opts": ["who they should nominate", "whom they should nominate", "whom should they nominate", "who should they nominate"], "ci": 1, "exp": "The pronoun functions as the object of \"nominate\" (they should nominate whom), so the object pronoun \"whom\" is correct: \"whom they should nominate.\" \"who they should nominate\" wrongly uses the subject pronoun for an object role. \"whom should they nominate\" and \"who should they nominate\" both incorrectly invert the word order as if this were a direct question, which doesn't fit inside this larger sentence.", "tag": "Who vs Whom", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "If the museum <u>would have extended</u> its hours during the festival, attendance likely would have doubled.", "opts": ["would have extended", "extended", "had extended", "extends"], "ci": 2, "exp": "This is a past-tense hypothetical (contrary-to-fact) condition, which requires the past perfect \"had extended\" in the \"if\" clause, paired with \"would have doubled\" in the result clause. \"would have extended\" incorrectly uses \"would have\" in the if-clause itself, a common error - only the result clause should use \"would have.\" \"extended\" (simple past) doesn't signal the hypothetical, unreal nature of the condition strongly enough for this construction. \"extends\" shifts confusingly into the present tense.", "tag": "Conditional Verb Forms", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Neither the marketing director nor the sales representatives <u>was able</u> to explain the sudden drop in quarterly revenue.", "opts": ["was able", "were able", "is able", "being able"], "ci": 1, "exp": "With \"neither...nor,\" the verb agrees with the closer subject, \"the sales representatives,\" which is plural, so \"were able\" is correct. \"was able\" wrongly matches the singular \"marketing director\" instead of the nearer subject. \"is able\" shifts incorrectly into present tense. \"being able\" is not a complete verb form and leaves the sentence without a finite verb.", "tag": "Subject-Verb Agreement (Correlative Subjects)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The professor asked us to turn in our essays by Friday; <u>however students who needed extra time</u> could request a short extension.", "opts": ["however students who needed extra time", "however, students who needed extra time,", "however, students who needed extra time", "however students who needed extra time,"], "ci": 2, "exp": "\"However\" begins a new independent clause after the semicolon and needs a comma right after it; the nonessential detail \"who needed extra time\" is essential here (it specifies which students), so no additional commas are needed around it. \"however, students who needed extra time\" correctly punctuates just after \"however.\" \"however students who needed extra time\" omits the necessary comma after \"however.\" \"however, students who needed extra time,\" wrongly adds a comma that treats the identifying clause as removable. \"however students who needed extra time,\" is missing the required comma after \"however\" while adding an unneeded one later.", "tag": "Conjunctive Adverb Punctuation", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Marie Curie's research, groundbreaking for its era, <u>discovered</u> two new elements and won her Nobel Prizes in two different sciences.", "opts": ["discovered", "having discovered", "was discovering", "discovering"], "ci": 0, "exp": "The sentence needs a finite past-tense verb to match \"won\" later in the sentence, and \"discovered two new elements\" correctly pairs with \"won her Nobel Prizes.\" \"having discovered\" turns the verb into a participle and leaves the sentence without a proper finite verb for that clause. \"was discovering\" incorrectly suggests an ongoing, incomplete action instead of the completed discovery. \"discovering\" is also a non-finite form that can't stand as the sentence's main verb here.", "tag": "Verb Form Consistency", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Anyone who wants to join the hiking club should bring <u>their own</u> water bottle and a pair of sturdy boots to the first meeting.", "opts": ["their own", "his or her own", "the own", "one's own"], "ci": 1, "exp": "\"Anyone\" is a singular indefinite pronoun, so in this traditionally consistent style the possessive should match in number and gender-neutrality with \"his or her own.\" \"their own\" uses a plural pronoun for a strictly singular antecedent under this convention. \"the own\" is not idiomatic English and fails to show possession. \"one's own\" shifts to a different, more formal and impersonal pronoun that doesn't match the established \"anyone... should bring\" pattern of direct address.", "tag": "Pronoun-Antecedent Agreement", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The twins are so alike in personality and habits <u>than</u> even their parents sometimes mix up their names.", "opts": ["than", "that", "as", "so"], "ci": 1, "exp": "The construction \"so...that\" expresses a result or degree, which is exactly what this sentence needs: the twins are so alike that a result (mixing up names) follows. \"than\" is used for comparisons between two things, not for showing a result. \"as\" doesn't complete the \"so...as\" pattern used for equal comparisons and doesn't fit a result clause. \"so\" is already used earlier in the sentence and repeating it here would be redundant and ungrammatical.", "tag": "Correlative Conjunction (So...That)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Exhausted from the twelve-hour shift, <u>the couch was where Marco collapsed onto</u> without even removing his shoes.", "opts": ["the couch was where Marco collapsed onto", "Marco collapsed onto the couch", "onto the couch is where Marco collapsed", "collapsing onto the couch was Marco"], "ci": 1, "exp": "The introductory phrase \"Exhausted from the twelve-hour shift\" describes a person, so the noun immediately following the comma must be that person: \"Marco collapsed onto the couch.\" \"the couch was where Marco collapsed onto\" places the couch, not Marco, right after the modifier, illogically describing the couch as exhausted. \"onto the couch is where Marco collapsed\" has the same dangling-modifier problem. \"collapsing onto the couch was Marco\" awkwardly inverts the sentence and still fails to put \"Marco\" directly after the modifier.", "tag": "Dangling Modifier", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The committee, after reviewing dozens of applications and interviewing several finalists, <u>have decided</u> to award the scholarship to a first-generation college student from rural Ohio.", "opts": ["have decided", "has decided", "having decided", "decide"], "ci": 1, "exp": "\"The committee\" is a collective noun acting as a single unit, so it takes the singular verb \"has decided.\" The phrase between the subject and verb (\"after reviewing... finalists\") doesn't change the subject's number. \"have decided\" wrongly treats the committee as plural. \"having decided\" creates a sentence fragment with no main verb. \"decide\" drops the necessary tense marking for a completed action.", "tag": "Subject-Verb Agreement (Collective Noun)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The lecture ran long<u>, therefore, the students missed</u> their bus and had to wait twenty minutes in the rain for the next one.", "opts": [", therefore, the students missed", "; therefore, the students missed", "therefore, the students missed", ", therefore the students missed"], "ci": 1, "exp": "\"The lecture ran long\" and \"the students missed their bus\" are both independent clauses connected by the conjunctive adverb \"therefore,\" which requires a semicolon before it and a comma after it: \"; therefore, the students missed.\" \", therefore, the students missed\" creates a comma splice by using only a comma to join two independent clauses. \"therefore, the students missed\" omits any punctuation before \"therefore,\" creating a run-on sentence. \", therefore the students missed\" keeps the comma splice and also drops the necessary comma after \"therefore.\"", "tag": "Comma Splice with Conjunctive Adverb", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The report's conclusion was <u>brief and it lacked detail</u>, leaving several key questions about the budget unanswered.", "opts": ["brief and it lacked detail", "brief and lacking in detail", "brief, it lacked detail", "brief, it was lacking detail"], "ci": 1, "exp": "The sentence needs two parallel adjectives describing the conclusion: \"brief and lacking in detail\" matches \"brief\" with another descriptive phrase functioning the same way. \"brief and it lacked detail\" awkwardly shifts from an adjective to a full independent clause with a new subject. \"brief, it lacked detail\" creates a comma splice by joining two independent clauses with only a comma. \"brief, it was lacking detail\" has the same comma splice problem.", "tag": "Parallel Structure (Comma Splice)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The new policy affects three departments: <u>Finance, Human Resources, and also the Marketing team as well</u>.", "opts": ["Finance, Human Resources, and also the Marketing team as well", "Finance, Human Resources, and Marketing", "Finance, Human Resources, and Marketing team also", "Finance, and Human Resources, and also Marketing"], "ci": 1, "exp": "\"Finance, Human Resources, and Marketing\" lists the three departments concisely and in parallel form, matching \"department\" names without redundant additions. \"Finance, Human Resources, and also the Marketing team as well\" is redundant, since \"also\" and \"as well\" repeat the same meaning, and \"team\" is unnecessary given the pattern of the other two items. \"Finance, Human Resources, and Marketing team also\" keeps the redundant \"also\" and the mismatched \"team.\" \"Finance, and Human Resources, and also Marketing\" adds an unnecessary comma before the first \"and\" and keeps the redundant \"also.\"", "tag": "Wordiness and Redundancy", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The scientist insisted that the experiment <u>is repeated</u> under stricter conditions before the results could be published.", "opts": ["is repeated", "be repeated", "was repeated", "will be repeated"], "ci": 1, "exp": "After a verb of insistence like \"insisted that,\" English uses the subjunctive mood, which takes the base form of the verb regardless of subject: \"be repeated.\" \"is repeated\" incorrectly uses the ordinary present-tense form instead of the subjunctive. \"was repeated\" shifts to a simple past form that doesn't fit the subjunctive requirement. \"will be repeated\" introduces an unnecessary future-tense auxiliary that isn't used in this construction.", "tag": "Subjunctive Mood", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The novel explores themes of memory, loss, and <u>how identity can be reinvented</u>, weaving them together across three generations of one family.", "opts": ["how identity can be reinvented", "reinvention of identity", "identity's reinvention happening", "the way identity gets reinvented"], "ci": 1, "exp": "The list needs three parallel nouns: \"memory, loss, and reinvention of identity.\" \"how identity can be reinvented\" breaks the pattern with a clause instead of a noun phrase. \"identity's reinvention happening\" awkwardly tacks on a participle. \"the way identity gets reinvented\" is also a clause, not a noun, so it doesn't match \"memory\" and \"loss.\"", "tag": "Parallel Structure", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Each of the interns, eager to impress their new supervisors, <u>were assigned</u> a separate project to complete within the month.", "opts": ["were assigned", "was assigned", "are assigned", "have been assigned"], "ci": 1, "exp": "\"Each\" is always singular, regardless of the plural noun \"interns\" that follows it in the prepositional phrase, so the verb must be \"was assigned.\" \"were assigned\" incorrectly treats \"each\" as plural. \"are assigned\" both mismatches the number and shifts to present tense. \"have been assigned\" is plural and also shifts the tense unnecessarily.", "tag": "Subject-Verb Agreement (Each/Every)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The bakery's <u>signature item are</u> the cinnamon rolls, which sell out within an hour of opening every single day.", "opts": ["signature item are", "signature item is", "signature items are", "signature item, are,"], "ci": 1, "exp": "The subject of the sentence is the singular \"signature item,\" so the verb must be \"is,\" even though the complement \"the cinnamon rolls\" is plural. \"signature item are\" wrongly matches the verb to the plural complement instead of the actual subject. \"signature items are\" changes the subject itself to plural, which isn't a valid fix since it alters the intended meaning (one item, described further). \"signature item, are,\" adds unnecessary and incorrect commas around the verb.", "tag": "Subject-Verb Agreement (Linking Verb)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The recipe calls for two cups of flour, a teaspoon of salt, and <u>you should add</u> a tablespoon of olive oil.", "opts": ["you should add", "DELETE the underlined portion", "adding", "to add"], "ci": 1, "exp": "The three ingredients should form one simple parallel list: flour, salt, and a tablespoon of olive oil. Deleting the underlined portion removes the unnecessary shift to a new subject and verb, restoring parallel noun phrases. \"you should add\" breaks parallelism by introducing a new subject mid-list. \"adding\" shifts to a gerund that doesn't match the noun list. \"to add\" awkwardly inserts an infinitive that also breaks the noun-phrase pattern.", "tag": "Parallel Structure (Lists)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The data suggests that customers <u>respond positive</u> to shorter checkout lines more than to discounted prices.", "opts": ["respond positive", "respond positively", "responds positive", "are responding positive"], "ci": 1, "exp": "The verb \"respond\" needs to be modified by an adverb, not an adjective, so \"respond positively\" is correct. \"respond positive\" incorrectly uses the adjective \"positive\" to modify a verb. \"responds positive\" both mismatches subject-verb agreement (the plural \"customers\" needs \"respond,\" not \"responds\") and repeats the adjective error. \"are responding positive\" also keeps the incorrect adjective form.", "tag": "Adjective vs Adverb", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;

    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}

    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
