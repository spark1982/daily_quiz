<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261021";
var RAW_QUESTIONS = [{"stem": "<i>Role-play skill: applying a performance indicator.</i> A role-play lists the performance indicator &ldquo;Explain the nature of effective written communications.&rdquo; You are an assistant manager at a bank writing to customers about a new mobile app. Which statement would best address this PI?", "opts": ["&ldquo;We should send the letter to every customer as soon as possible.&rdquo;", "&ldquo;Long, detailed letters are always more effective because they show we are professional.&rdquo;", "&ldquo;Written communication is any message that is written down, like a letter or an email.&rdquo;", "&ldquo;Effective written messages are clear, brief, and organized for the reader, so our letter will open with the main benefit, use simple steps, and end with one clear action: download the app.&rdquo;"], "ci": 3, "exp": "Judges reward answers that <b>explain the concept and apply it</b> to the situation. A memorized definition alone is too thin, and &ldquo;longer is always better&rdquo; is not a principle of effective writing."}, {"stem": "Which statement is the best example of a company&rsquo;s <b>mission statement</b>?", "opts": ["&ldquo;Our new branch opens on Elm Street in March.&rdquo;", "&ldquo;We will cut lobby hours on Saturdays.&rdquo;", "&ldquo;We help families in our community save, borrow, and plan with honest advice and low fees.&rdquo;", "&ldquo;Our goal is to raise profits by 8% next quarter.&rdquo;"], "ci": 2, "exp": "A <b>mission statement</b> explains a company&rsquo;s purpose: what it does, for whom, and how. A quarterly profit target is a short-term goal, and the others are operational decisions."}, {"stem": "An insurance company advertises, &ldquo;We answer every claim call within 30 seconds.&rdquo; Why is it important for every employee to keep this promise?", "opts": ["Customers judge the company by whether its <b>brand promise</b> matches their real experience.", "The promise is only an advertising slogan, so it does not affect customers.", "Keeping promises matters only when a manager is watching.", "Customers care about price only, not about service."], "ci": 0, "exp": "A <b>brand promise</b> is what a business tells customers to expect. When employees deliver it, trust and loyalty grow; when they break it, the company&rsquo;s image suffers."}, {"stem": "Jordan has $2,000. He can put it in a savings account earning 4% a year, or use it to buy a used laptop for his tutoring business. If he buys the laptop, what is his <b>opportunity cost</b>?", "opts": ["The cost of repairing the laptop later", "The $80 in interest he would have earned in the savings account", "The $2,000 price of the laptop", "Nothing, because the laptop will help his business"], "ci": 1, "exp": "<b>Opportunity cost</b> is the value of the next-best choice you give up. Jordan gives up the interest: $2,000 &times; 4% = $80 for the year."}, {"stem": "Lena&rsquo;s budgeting app is growing fast, and she wants a large investment plus advice from experienced investors. In return, she is willing to give up part of the ownership. Which funding source fits best?", "opts": ["Venture capital", "A small loan from a family member", "A personal credit card", "Trade credit from a supplier"], "ci": 0, "exp": "<b>Venture capitalists</b> invest large amounts in fast-growing businesses in exchange for <b>equity</b> (part ownership), and they often give advice. Credit cards and loans must be repaid with interest and give no ownership."}, {"stem": "During a meeting, a credit union member complains that her loan paperwork was confusing. Which response by the employee best shows <b>active listening</b>?", "opts": ["&ldquo;Let me tell you how our loan process works.&rdquo;", "&ldquo;You should have called us before signing.&rdquo;", "&ldquo;So the forms used terms you didn&rsquo;t recognize, and no one explained the next steps. Is that right?&rdquo;", "&ldquo;Everyone finds those forms confusing at first.&rdquo;"], "ci": 2, "exp": "Active listening means <b>paraphrasing</b> what the speaker said and checking for understanding before responding. The other answers dismiss, lecture, or blame the speaker."}, {"stem": "A new bank teller learns to count cash drawers by working beside an experienced teller during real shifts. What type of training is this?", "opts": ["Off-site conference training", "On-the-job training", "Online self-paced training", "Classroom lecture training"], "ci": 1, "exp": "<b>On-the-job training</b> happens while the employee does the real work, often with a mentor. It is practical and immediately useful, though it can slow down the experienced worker."}, {"stem": "A small credit union has current assets of $240,000 and current liabilities of $160,000. What is its current ratio, and what does it suggest?", "opts": ["0.67; it cannot pay any of its short-term debts", "1.5; it has $1.50 of current assets for each $1 of short-term debt", "1.5; it earned a 50% profit this year", "$80,000; it has too much debt"], "ci": 1, "exp": "<b>Current ratio</b> = current assets &divide; current liabilities = $240,000 &divide; $160,000 = 1.5. It measures <b>liquidity</b>, the ability to pay short-term debts, not profit. ($80,000 is the difference, called working capital.)"}, {"stem": "A furniture store&rsquo;s salesperson tells a customer, &ldquo;This sofa frame is guaranteed not to crack for ten years,&rdquo; and the promise is printed on the receipt. What kind of warranty is this?", "opts": ["An implied warranty of merchantability", "A disclaimer of warranty", "An express warranty", "A warranty of title"], "ci": 2, "exp": "An <b>express warranty</b> is a specific promise stated in words or writing. An implied warranty is not spoken; the law assumes it (for example, that a product works for its normal use)."}, {"stem": "A new coffee shop owner wants to know whether nearby office workers would buy breakfast sandwiches. She surveys 150 people walking past her location. What kind of information is she collecting?", "opts": ["Secondary data, because it is about customers", "Secondary data, because it came from other people", "Primary data, because she is gathering it herself for this specific question", "Public data, because it was collected outdoors"], "ci": 2, "exp": "<b>Primary data</b> is collected firsthand for a current purpose (surveys, interviews, observations). <b>Secondary data</b> already exists, such as government reports or industry studies."}, {"stem": "What is the main purpose of an employee <b>performance appraisal</b>?", "opts": ["To evaluate how well an employee is doing and plan ways to improve and grow", "To decide which employees must be fired each year", "To list the duties of a job before it is advertised", "To calculate how much tax is taken out of a paycheck"], "ci": 0, "exp": "A <b>performance appraisal</b> reviews work against goals, gives feedback, and sets development plans. A list of duties is a job description; taxes are part of payroll."}, {"stem": "In a performance review, Maya&rsquo;s supervisor says her reports often contain small math errors. Which reaction shows the strongest emotional intelligence?", "opts": ["Thanking the supervisor, asking for an example, and suggesting a double-check step she will use from now on", "Explaining that everyone in the department makes the same mistakes", "Staying quiet and deciding the supervisor does not like her", "Promising to work late every night to fix all of her past reports"], "ci": 0, "exp": "Emotional intelligence includes <b>accepting constructive criticism</b> calmly, seeking to understand it, and turning it into a plan. Defending, sulking, or overpromising are less effective."}, {"stem": "When a popular streaming service raised its price by 10%, many customers canceled and switched to a cheaper competitor. This shows that demand for the service is —", "opts": ["perfectly fixed, because the price did not matter", "unrelated to price, because only advertising affects demand", "elastic, because buyers changed their purchases a lot when the price changed", "inelastic, because buyers kept paying no matter the price"], "ci": 2, "exp": "Demand is <b>elastic</b> when a price change causes a large change in the quantity people buy, often because good substitutes exist. Inelastic demand barely changes with price."}, {"stem": "<i>Role-play skill: the judge&rsquo;s follow-up question.</i> You presented a plan to resolve a customer&rsquo;s complaint about a late fee. The judge (branch manager) asks, &ldquo;What will you do if the customer is still unhappy after your solution?&rdquo; Which response is best?", "opts": ["&ldquo;I&rsquo;d ask what would make it right for her, explain clearly what we can and can&rsquo;t do, offer the best option within our policy, and involve you if it needs a manager&rsquo;s approval.&rdquo;", "&ldquo;If she&rsquo;s still unhappy, there&rsquo;s nothing more we can do.&rdquo;", "&ldquo;I&rsquo;d remove every fee on her account so she leaves happy.&rdquo;", "&ldquo;I&rsquo;m sure my solution will work, so that won&rsquo;t happen.&rdquo;"], "ci": 0, "exp": "Strong answers stay <b>customer-focused but realistic</b>: listen again, stay within policy, and escalate properly. Giving away everything, giving up, or denying the possibility are weak responses."}, {"stem": "Sales of a sports drink have stopped growing. Many competitors sell similar drinks, and the company is lowering prices and adding new flavors to keep customers. Which stage of the product life cycle is the drink most likely in?", "opts": ["Introduction", "Growth", "Maturity", "Development"], "ci": 2, "exp": "In the <b>maturity</b> stage, sales level off, competition is strong, and companies use price changes and product variations to defend their share. Growth would show rapidly rising sales."}, {"stem": "<i>Role-play skill: applying a performance indicator.</i> A role-play lists the performance indicator &ldquo;Explain the concept of credit.&rdquo; You are a loan officer meeting a recent graduate who wants her first credit card. Which statement best addresses this PI?", "opts": ["&ldquo;You should avoid credit completely because it is always bad.&rdquo;", "&ldquo;Credit is the money a bank gives you for free when you open an account.&rdquo;", "&ldquo;Credit means borrowing now and promising to pay later, usually with interest. If you pay your card on time each month, you build a credit history that helps you get a car loan or apartment later.&rdquo;", "&ldquo;Credit cards let you buy anything you want without worrying about money.&rdquo;"], "ci": 2, "exp": "A strong PI answer gives an <b>accurate explanation</b> and <b>connects it to the client&rsquo;s situation</b>. The wrong answers misstate what credit is or give one-sided advice."}, {"stem": "<i>Role-play skill: the judge&rsquo;s follow-up question.</i> You proposed that a small accounting firm start offering tax help by video call. The judge (firm owner) asks, &ldquo;How will we know if this new service is working?&rdquo; Which response is best?", "opts": ["&ldquo;If our competitors start copying us, we&rsquo;ll know it&rsquo;s a success.&rdquo;", "&ldquo;We&rsquo;ll know it&rsquo;s working if people seem to like it.&rdquo;", "&ldquo;We&rsquo;ll set goals before launch, such as 40 video clients in the first three months and a satisfaction score of 4 out of 5, then check the numbers monthly and adjust.&rdquo;", "&ldquo;It will definitely work because everyone uses video calls now.&rdquo;"], "ci": 2, "exp": "Judges look for <b>measurable goals</b> (key performance indicators) and a plan to review them. Vague feelings, competitor reactions, or confident guesses do not show how success will be measured."}, {"stem": "Two tellers on Evan&rsquo;s team keep arguing about who should handle drive-through customers. As the team lead, what should Evan do first?", "opts": ["Assign all drive-through work to the teller who complained less", "Meet with both tellers privately, let each explain the problem, and work with them to agree on a fair schedule", "Report both tellers to human resources right away", "Tell them to stop complaining and figure it out themselves"], "ci": 1, "exp": "Good conflict management starts by <b>listening to both sides</b> and finding a shared solution. Ignoring the conflict, picking a side, or escalating too early usually makes it worse."}, {"stem": "A pizza restaurant notices it throws away about 15% of its dough each night. Which action is the best example of <b>expense control</b>?", "opts": ["Stop offering pizza on slow nights", "Track nightly sales by day of the week and prepare dough to match expected demand", "Raise menu prices so the waste does not matter", "Buy dough from the cheapest supplier, even if the quality is lower"], "ci": 1, "exp": "<b>Expense control</b> means reducing costs without hurting quality or service. Using sales data to cut waste lowers costs directly; the other choices hurt customers or quality."}, {"stem": "Priya wants a summer internship at an investment firm. Which action is the best example of professional <b>networking</b>?", "opts": ["Waiting for firms to contact her after she posts her résumé", "Applying online to fifty internships with the same résumé", "Asking a friend to write her cover letter", "Introducing herself to a financial advisor at a career fair and following up later with a short thank-you email"], "ci": 3, "exp": "<b>Networking</b> means building professional relationships that can lead to opportunities. Personal contact plus a follow-up is the strongest example here."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
