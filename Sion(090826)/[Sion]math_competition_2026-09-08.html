<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}

.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}

.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}

<body><div class="quiz-title">[Sion] Math Competition</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Choose the correct answer for each problem. Two problems are drawn from each of five chapters.</div>

<script>var TITLE = "[Sion] Math Competition";var QUIZ_KEY = "quiz_sionmathcomp_10_20260908_v1";var ATT_KEY = "quiz_sionmathcomp_10_att_20260908_v1";var RAW_QUESTIONS = [{"stem": "What is the sum of all real numbers x such that (x<sup>2</sup>&minus;5x+5)<sup>(x<sup>2</sup>&minus;7x+12)</sup> = 1? (MathCounts)", "opts": ["10", "9", "12", "8"], "ci": 0, "exp": "Cases: base=1 gives x=1,4; exponent=0 (with base&ne;0) gives x=3,4; base=&minus;1 with even exponent gives x=2,3. All of x=1,2,3,4 are solutions. Sum=10.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "A consumer report revealed the following information about three tubes of toothpaste. Bright is 60% more expensive than Fresh and has 25% less volume than Glow. Glow is 25% less expensive than Bright and has 33⅓% more volume than Fresh. Fresh costs $1.00 per unit of volume. What is the number of cents per unit of volume of Glow? (MathCounts)", "opts": ["80 cents", "75 cents", "96 cents", "90 cents"], "ci": 3, "exp": "The answer is 90 cents.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "The combined weight of two airline passengers' checked luggage is 105 kilograms. The airline's checked-luggage policy allows each passenger a maximum weight at no charge, and charges a constant, per-kilogram rate for any extra weight. One passenger pays $12.00 for the total extra weight of her luggage, and the other passenger pays $18.00 for the total extra weight of his luggage. If all of the luggage had belonged to one of the passengers, the over-weight charge would have been $78.00. How many kilograms of luggage is one person permitted without charge by the airline? (MathCounts)", "opts": ["30 kg", "45 kg", "25 kg", "40 kg"], "ci": 3, "exp": "The answer is 40 kg.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Ryan's letter weighs <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">10</span></span> oz. Stamps weigh <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">30</span></span> oz each. The cost of mailing the first ounce, or fraction thereof, costs 37 cents, and each additional ounce, or fraction thereof, costs 23 cents. If Ryan only has 1 cent stamps, how many stamps should he use? Remember that he is paying for the weight of the stamps, too. Assume there are no physical constraints regarding the number of stamps or the size of the envelope. (MathCounts)", "opts": ["156", "149", "160", "152"], "ci": 3, "exp": "With x stamps, total weight = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x</span><span style=\"border-top:1.4px solid #111;\">30</span></span>+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">10</span></span> oz. Cost = 37+23&lceil;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x</span><span style=\"border-top:1.4px solid #111;\">30</span></span>+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">10</span></span>&minus;1&rceil; = x cents. Solving: x&equiv;14 (mod 23) and x&ge;149. The smallest such x is 152.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "There are 13 green, 15 blue, and 17 red chameleons on Camelot Island. Whenever two chameleons of different colors meet, they both swap to the third color. Is it possible for all chameleons to become one color? (Russia)", "opts": ["possible", "impossible"], "ci": 1, "exp": "The differences between the counts modulo 3 are preserved as an invariant. Initially the counts are 13, 15, 17, with differences 13&minus;15=&minus;2, 15&minus;17=&minus;2, 13&minus;17=&minus;4 (mod 3: 1, 1, 2). For all one color (45, 0, 0), the differences mod 3 would be 0, 0, 0. Since the invariant differs, it is impossible.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "In a certain two-person game, each player, in turn, removes 1, 2, 3, 4, or 5 toothpicks from a common pile, until the pile is exhausted. The player who takes the last toothpick loses. If the starting pile contains 300 toothpicks, how many toothpicks must the first player take on the first turn to guarantee a win with perfect subsequent play? (KMCTST)", "opts": ["5", "1", "2", "3"], "ci": 0, "exp": "The losing positions are multiples of 6. After the first player takes 5, leaving 295 &mdash; wait, 300 mod 6 = 0, so the first player is already in a losing position if they leave a multiple of 6. The first player should take 5, leaving 295. Then whatever the second player takes (k), the first player takes (6&minus;k), maintaining multiples-of-6 control toward leaving 1 for the opponent. Actually: leave positions that are 1 mod 6. Take 5 to leave 295 = 49&times;6+1. The answer is 5.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "Suppose that P(<span class=\"frac\"><span class=\"num\">x</span><span class=\"den\">3</span></span>) = x<sup>2</sup> + x + 1. What is the sum of all values of x for which P(3x) = 7? (AMC 10)", "opts": ["&minus;<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">9</span></span>", "&minus;<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">3</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">9</span></span>", "&minus;<span class=\"frac\"><span class=\"num\">2</span><span class=\"den\">9</span></span>"], "ci": 0, "exp": "Since P(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)=x<sup>2</sup>+x+1, substituting x=3u shows P(u)=9u<sup>2</sup>+3u+1. So P(3x)=9(3x)<sup>2</sup>+3(3x)+1=81x<sup>2</sup>+9x+1. Setting this equal to 7 gives 81x<sup>2</sup>+9x&minus;6=0, or 27x<sup>2</sup>+3x&minus;2=0. The sum of the roots is &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">27</span></span>=&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span>.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "The numbers in the sequence 1, 6, 15, 28, 45, &hellip; are called the hexagonal numbers.<div class=\"hexdiagram\"><svg viewBox=\"0 0 480 170\"><circle cx=\"60\" cy=\"85\" r=\"5\" fill=\"#111\"/><text x=\"60\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8321; = 1</text><polygon points=\"200,45 234.6,65 234.6,105 200,125 165.4,105 165.4,65\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"200\" cy=\"45\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"65\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"200\" cy=\"125\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"65\" r=\"4\" fill=\"#111\"/><text x=\"200\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8322; = 6</text><polygon points=\"380,30 427.6,57.5 427.6,112.5 380,140 332.4,112.5 332.4,57.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><polygon points=\"380,58 403.4,71.5 403.4,98.5 380,112 356.6,98.5 356.6,71.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"30\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"140\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><circle cx=\"380\" cy=\"85\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"30\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"140\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"58\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"380\" cy=\"112\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><text x=\"380\" y=\"158\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8323; = 15</text></svg></div>What is the 11<sup>th</sup> hexagonal number?", "opts": ["225", "210", "242", "231"], "ci": 3, "exp": "The nth hexagonal number is given by H<sub>n</sub> = n(2n&minus;1). Checking: H<sub>1</sub>=1, H<sub>2</sub>=6, H<sub>3</sub>=15, H<sub>4</sub>=28, H<sub>5</sub>=45, matching the given sequence. So H<sub>11</sub> = 11(2&middot;11&minus;1) = 11&middot;21 = 231.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Evaluate<br><br><span class=\"bigsum\"><span class=\"bs-sup\">&infin;</span><span class=\"bs-sigma\">&Sigma;</span><span class=\"bs-sub\">n=3</span></span> <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n<sup>5</sup> &minus; 5n<sup>3</sup> + 4n</span></span>. (Purple Comet)", "opts": ["<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">72</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">120</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">48</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">96</span></span>"], "ci": 2, "exp": "Factor the denominator: n<sup>5</sup>&minus;5n<sup>3</sup>+4n = n(n<sup>2</sup>&minus;1)(n<sup>2</sup>&minus;4) = (n&minus;2)(n&minus;1)n(n+1)(n+2), the product of 5 consecutive integers. Using the telescoping identity 1/[(n&minus;2)(n&minus;1)n(n+1)(n+2)] = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)&middot;{1/[(n&minus;2)(n&minus;1)n(n+1)] &minus; 1/[(n&minus;1)n(n+1)(n+2)]}, the sum from n=3 to &infin; telescopes down to (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)&middot;1/(1&middot;2&middot;3&middot;4) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "The polynomial P(x) = x<sup>3</sup> + ax<sup>2</sup> + bx + c has the property that the mean of its zeros, the product of its zeros, and the sum of its coefficients are all equal. The y-intercept of the graph of y = P(x) is 2. What is b? (AMC 12)", "opts": ["-11", "7", "-13", "-9"], "ci": 0, "exp": "The y-intercept gives c=P(0)=2. For x<sup>3</sup>+ax<sup>2</sup>+bx+c, the product of the zeros is &minus;c=&minus;2, so this common value is &minus;2. The mean of the zeros is &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>a</span><span style=\"border-top:1.4px solid #111;\">3</span></span>=&minus;2, so a=6. The sum of the coefficients is 1+a+b+c=1+6+b+2=9+b, which must also equal &minus;2, so b=&minus;11.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();

}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
