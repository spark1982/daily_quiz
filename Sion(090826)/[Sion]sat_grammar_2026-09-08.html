<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_sionsatgrammar_20_20260908_v1";var ATT_KEY = "quiz_sionsatgrammar_20_att_20260908_v1";var RAW_QUESTIONS = [{"stem": "Which choice provides the best revision of the underlined portion?", "context": "The negotiations dragged on for hours <u>neither side was willing to compromise on the final terms</u>.", "opts": [", for neither side was willing to compromise on the final terms", "neither side was willing to compromise on the final terms", ", however neither side was willing to compromise on the final terms", "; but neither side was willing to compromise on the final terms"], "ci": 0, "exp": "Two independent clauses joined by a comma and the coordinating conjunction \"for\" are correctly connected, fixing the original run-on. The original run-on lacks any punctuation or conjunction between the two independent clauses. Using \", however\" creates a comma splice, since \"however\" is a conjunctive adverb that requires a semicolon rather than a comma. Pairing a semicolon with the coordinating conjunction \"but\" is nonstandard; semicolons are used alone or with conjunctive adverbs, not coordinating conjunctions.", "tag": "Run-on Sentence", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Still sizzling from the grill, <u>the waiter served the steak to the customer</u>.", "opts": ["a steak was what the waiter served to the customer", "the steak was served by the waiter to the customer", "the customer was served the steak by the waiter", "the waiter served the steak to the customer"], "ci": 1, "exp": "The introductory phrase \"Still sizzling from the grill\" must be immediately followed by the noun it logically modifies, the steak. Rephrasing as \"the steak was served by the waiter to the customer\" places \"the steak\" directly after the modifier. The original places \"the waiter\" first, illogically suggesting the waiter is sizzling. \"the customer was served the steak by the waiter\" places \"the customer\" after the modifier, which is equally illogical. \"a steak was what the waiter served to the customer\" inserts \"what\" between the modifier and \"a steak,\" still failing to place the modified noun immediately after the phrase.", "tag": "Misplaced Modifier", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Either the manager or the assistants <u>is</u> responsible for closing the store each night.", "opts": ["are", "was", "is", "has been"], "ci": 0, "exp": "When a compound subject is joined by \"or,\" the verb must agree with the nearer subject, the plural \"assistants,\" so \"are\" is correct. \"is\" and \"was\" incorrectly agree with the singular \"manager\" rather than the nearer noun. \"has been\" is also singular and equally mismatched with \"assistants.\"", "tag": "Subject-Verb Agreement (Compound Subject with \"or\")", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "In the memoir, the author describes her childhood in vivid detail and then <u>reflected</u> on how those years shaped her career.", "opts": ["had reflected", "reflected", "was reflecting", "reflects"], "ci": 3, "exp": "Because the sentence begins in the literary present tense with \"describes,\" the second verb must also stay in the present tense: \"reflects.\" \"reflected\" shifts unnecessarily into the past tense. \"had reflected\" incorrectly implies the reflection happened before the description, which is not indicated. \"was reflecting\" shifts to the past progressive, breaking the present-tense consistency.", "tag": "Verb Tense Shift (Present to Past)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Every employee must submit <u>their</u> timesheet by Friday afternoon.", "opts": ["its", "his or her", "they're", "their"], "ci": 1, "exp": "\"Every employee\" is a singular antecedent, so it requires the singular pronoun \"his or her.\" \"their\" is plural and does not agree in number with the singular antecedent. \"its\" is used for inanimate objects or animals, not people. \"they're\" is a contraction of \"they are\" and does not fit grammatically as a possessive determiner here.", "tag": "Pronoun-Antecedent Agreement (Number)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Learning to play the violin is more difficult than <u>to learn the piano</u>.", "opts": ["the piano being learned", "learning the piano", "learn the piano", "to learn the piano"], "ci": 1, "exp": "The comparison must use parallel grammatical forms; since the sentence begins with the gerund \"Learning,\" the second element should also be a gerund: \"learning the piano.\" \"to learn the piano\" shifts to an infinitive, breaking the parallel structure. \"learn the piano\" is a bare verb form that does not match the gerund. \"the piano being learned\" awkwardly reverses the phrase into a passive construction, still breaking parallelism.", "tag": "Parallel Structure (Comparison)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The award will be given to <u>whomever</u> submits the most innovative proposal.", "opts": ["who's", "whoever", "whom", "whomever"], "ci": 1, "exp": "Although the clause \"whoever submits the most innovative proposal\" functions as the object of the preposition \"to,\" within its own clause \"whoever\" is the subject of the verb \"submits,\" so the subjective form \"whoever\" is correct. \"whomever\" and \"whom\" both incorrectly use the objective case for what is the subject of \"submits\" within its own clause. \"who's\" is a contraction of \"who is\" or \"who has\" and cannot function as the subject of the clause here.", "tag": "Who vs Whom (Whoever vs Whomever)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "After the long hike, she decided to <u>lay</u> down and rest for a while.", "opts": ["laid", "lie", "lay", "lain"], "ci": 1, "exp": "\"Lie\" is the correct intransitive verb meaning to recline, used here in its base form after \"to.\" \"lay\" is a transitive verb meaning to place something down and requires a direct object, which is missing here. \"lain\" is the past participle of \"lie\" and cannot follow the infinitive marker \"to.\" \"laid\" is the past tense of the transitive \"lay\" and is equally incorrect without a direct object.", "tag": "Lay vs Lie", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The inheritance was divided equally <u>between</u> the four siblings.", "opts": ["betwixt", "amid", "between", "among"], "ci": 3, "exp": "\"Among\" is used when referring to three or more items or people, matching the four siblings here. \"between\" is reserved for exactly two entities and does not fit four siblings. \"amid\" means \"in the middle of\" or \"surrounded by\" and does not express equal division. \"betwixt\" is an archaic synonym for \"between\" and carries the same two-entity restriction.", "tag": "Between vs Among", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "A surprising <u>amount</u> of students signed up for the new elective course.", "opts": ["amount", "number", "total amount", "extent"], "ci": 1, "exp": "\"Students\" is a countable noun, so \"number\" is the correct word to describe how many there are. \"amount\" is reserved for uncountable quantities, such as water or time, not individual countable items like students. \"total amount\" repeats the same countable/uncountable error. \"extent\" describes degree or range, not a countable quantity of people.", "tag": "Number vs Amount", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The <u>childrens</u> playground was renovated over the summer.", "opts": ["childrens'", "childrens", "children's", "childs'"], "ci": 2, "exp": "\"Children\" is already an irregular plural noun, so its possessive is formed by adding an apostrophe and an s: \"children's.\" \"childrens\" omits the apostrophe entirely, showing no possession. \"childrens'\" incorrectly treats \"children\" as if it ended in s, adding an apostrophe after a nonexistent extra s. \"childs'\" incorrectly uses the singular \"child\" with a plural possessive apostrophe placement.", "tag": "Apostrophe with Plural Possessive", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The forecast predicted heavy rain, <u>the outdoor concert was moved indoors</u>.", "opts": [", so, the outdoor concert was moved indoors", "the outdoor concert was moved indoors", "and, the outdoor concert was moved indoors", "; the outdoor concert was moved indoors"], "ci": 3, "exp": "Two closely related independent clauses can be joined directly with a semicolon when no conjunction is used, correctly fixing the comma splice. The original comma alone creates a comma splice between two independent clauses. \", so, the outdoor concert was moved indoors\" inserts an unnecessary comma immediately after the coordinating conjunction \"so.\" \"and, the outdoor concert was moved indoors\" is missing the required comma before \"and\" and adds an incorrect comma right after it.", "tag": "Semicolon Joining Independent Clauses", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The novel's author <u>Jane Austen</u> wrote it anonymously, publishing it simply as \"By a Lady.\"", "opts": [", Jane Austen", ", Jane Austen,", "Jane Austen", "Jane Austen,"], "ci": 1, "exp": "Because \"Jane Austen\" is a nonessential appositive renaming \"the novel's author\" (a phrase that already uniquely identifies the person), it must be set off by commas on both sides: \", Jane Austen,\". The original omits both commas, failing to mark the appositive as nonessential. \"Jane Austen,\" includes only the trailing comma, while \", Jane Austen\" includes only the leading comma; both leave the appositive improperly and inconsistently punctuated.", "tag": "Nonessential Appositive (Commas)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "<u>After finishing her homework Maria</u> went outside to play with her friends.", "opts": ["After, finishing her homework Maria", "After finishing her homework Maria", "After finishing her homework, Maria", "After finishing, her homework Maria"], "ci": 2, "exp": "A comma is required after a long introductory phrase before the main clause begins: \"After finishing her homework, Maria.\" The original omits this necessary comma. \"After, finishing her homework Maria\" inserts a comma too early, splitting the introductory phrase awkwardly. \"After finishing, her homework Maria\" places the comma in the middle of the phrase, similarly disrupting its structure.", "tag": "Introductory Phrase Comma", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The storm knocked out power across the city, <u>although</u> residents relied on generators for nearly a week.", "opts": ["although", "whereas", "even though", "so"], "ci": 3, "exp": "\"So\" correctly signals that the second clause is a result of the first (the power outage caused residents to rely on generators). \"although,\" \"even though,\" and \"whereas\" are all subordinating conjunctions of contrast or concession, which illogically suggest the two clauses are in opposition rather than cause and effect.", "tag": "Coordinating vs Subordinating Conjunction", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The chef seasoned the soup carefully, and then <u>the soup was tasted by him</u> before serving it to the guests.", "opts": ["tasting the soup was done by him", "the soup was tasted by him", "it was tasted by the soup", "he tasted the soup"], "ci": 3, "exp": "Since the sentence begins in the active voice (\"The chef seasoned\"), the second clause should also stay active and concise: \"he tasted the soup.\" The original needlessly shifts into the passive voice mid-sentence. \"it was tasted by the soup\" illogically reverses the subject and object, implying the soup did the tasting. \"tasting the soup was done by him\" is an awkward, wordy passive construction that also breaks the active-voice consistency.", "tag": "Passive vs Active Voice Shift", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "After the layoffs, the department <u>didn't have hardly any</u> staff left to handle customer complaints.", "opts": ["had hardly any", "didn't have hardly any", "didn't have no", "wasn't hardly having any"], "ci": 0, "exp": "\"Hardly\" already functions as a near-negative, so pairing it with \"didn't\" creates a double negative; removing \"didn't\" and keeping \"had hardly any\" fixes the error. The original combines \"didn't\" and \"hardly,\" doubling the negation. \"didn't have no\" compounds the problem with a second double negative (\"didn't...no\"). \"wasn't hardly having any\" retains the same double-negative error with an added awkward progressive verb form.", "tag": "Double Negative", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Of the two candidates, Maria is by far the <u>most qualified</u> for the position.", "opts": ["more qualified", "most qualified", "much qualified", "more qualifying"], "ci": 0, "exp": "Because only two candidates are being compared, the comparative form \"more qualified\" is required rather than the superlative, which is reserved for three or more items. \"most qualified\" incorrectly uses the superlative for a two-way comparison. \"much qualified\" is not an idiomatic comparative construction. \"more qualifying\" incorrectly changes \"qualified\" to the present participle form of a different verb sense, which does not fit the intended meaning of being suited for the job.", "tag": "Comparative vs Superlative", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The final exam was far more challenging <u>then</u> the practice tests had suggested it would be.", "opts": ["than", "that", "then", "when"], "ci": 0, "exp": "\"Than\" is the correct word to use in comparisons, matching \"more challenging.\" \"then\" refers to time sequence and does not belong in a comparison. \"that\" does not fit grammatically in this comparative construction. \"when\" also refers to time and cannot substitute for the comparative \"than.\"", "tag": "Then vs Than", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The itinerary included stops in Paris, France<u>, Vienna, Austria, and Prague, Czech Republic</u>.", "opts": ["; Vienna, Austria; and Prague, Czech Republic", ", Vienna, Austria, and Prague, Czech Republic", "; Vienna, Austria, and Prague, Czech Republic", ", Vienna, Austria; and Prague, Czech Republic"], "ci": 0, "exp": "When list items themselves contain internal commas (city, country pairs), semicolons must separate the items to avoid ambiguity: \"; Vienna, Austria; and Prague, Czech Republic.\" The original relies only on commas, making it unclear where each destination begins and ends. \", Vienna, Austria; and Prague, Czech Republic\" inconsistently mixes a comma and a semicolon as separators. \"; Vienna, Austria, and Prague, Czech Republic\" uses only one semicolon, leaving the remaining items still separated by ambiguous commas.", "tag": "Semicolon in a List with Internal Commas", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
