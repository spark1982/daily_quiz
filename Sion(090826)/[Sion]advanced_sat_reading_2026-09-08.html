<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}
.subtitle{text-align:center;font-size:0.85rem;color:#555;background:#fff;padding:2px 0 4px}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:2px 12px 10px}
.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}
.timer-setup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
.timer-setup label { font-weight: 700; }
.timer-setup input[type="number"] { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
.timer-start-btn { background: #185FA5; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.timer-running { display: flex; align-items: center; gap: 8px; }
.timer-label { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.02em; }
.timer-display { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
.timer-display.warn { color: #f5a623; }
.timer-display.danger { color: #E24B4A; }
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0;background:#fff;padding:8px 12px;border-radius:10px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;border:none;}
.results-pill{display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;border:none;}
.quiz-area{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.q-num{font-size:0.82rem;color:#888;}
.tag-badge{font-size:0.75rem;padding:2px 10px;border-radius:10px;background:#185FA5;color:#fff;font-weight:600;}
.passage-box,.context-box{background:#f5f7fa;border-left:3px solid #185FA5;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.92rem;color:#333;line-height:1.5;}
.q-text{font-size:1.08rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{background:#e8edf4;color:#111;border:2px solid transparent;border-radius:9px;padding:11px 14px;font-size:0.95rem;text-align:left;cursor:pointer;line-height:1.4;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn:disabled{cursor:default;}
.exp-box{margin-top:12px;padding:10px 12px;background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;font-size:0.88rem;color:#333;display:none;}
.nav-btns{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
.prev-btn,.next-btn{padding:9px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;}
.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}
.r-card.correct{background:#E1F5EE;color:#085041;}
.r-card.wrong{background:#FCEBEB;color:#501313;}
.r-card.skipped{background:#f5f7fa;color:#555;}
.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}
.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}

</style>
</head>
<body><div class="quiz-title">[Sion] Advanced SAT Reading</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Read each passage, then choose the best answer.</div>

      <button class="modal-cancel" onclick="closeFreshModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>
<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_20260908_v1";var ATT_KEY = "quiz_sionadvreading_12_att_20260908_v1";var RAW_QUESTIONS = [{"stem": "What can reasonably be inferred about the manager's engagement with her job over time?", "passage": "The following text is adapted from a workplace memoir.<br><br>When she first took over as manager, she arrived before dawn to personally check the delivery trucks and stayed long after closing to balance the registers herself. Lately, the deliveries sit unchecked in the loading dock for hours, and the nightly totals are left for whoever happens to still be there to figure out.", "opts": ["The manager plans to expand the business into new locations.", "The manager's engagement with her responsibilities appears to have declined significantly since she first started.", "The manager has been promoted to a position with greater responsibilities.", "The manager has trained her staff so well that her personal involvement is no longer necessary."], "ci": 1, "exp": "The contrast between her early hands-on involvement (checking trucks at dawn, balancing registers herself) and her current neglect (deliveries unchecked, totals left to whoever is around) suggests declining engagement, not promotion, successful delegation, or expansion.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"stem": "What can reasonably be inferred about the fox's environment based on its changed behavior?", "passage": "The following text is adapted from a nature writer's field notes.<br><br>The fox that used to trot boldly across the meadow at dusk, unbothered by our presence, now freezes at the tree line the moment a door creaks, and days pass before it reappears at all. Something in the woods, or perhaps closer to the cabin, has changed its sense of what is safe.", "opts": ["Something in or near the fox's environment has made it more wary of humans or nearby activity than it used to be.", "The meadow has been permanently destroyed by construction.", "The fox no longer needs to search for food in the meadow.", "The fox has been captured and relocated to a different habitat."], "ci": 0, "exp": "The fox's shift from boldness to skittishness, freezing at small sounds and staying away longer, points to an increase in perceived danger nearby, not relocation, reduced need to forage, or destruction of the meadow, none of which the passage mentions.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"stem": "Which claim is best supported by the findings described in the passage?", "passage": "The following text is adapted from a report on workplace lighting.<br><br>An office redesigned two floors to include large windows and skylights, while two comparable floors kept their original fluorescent lighting. Over one year, employees on the naturally lit floors filed 31 percent fewer sick days than those on the fluorescent-lit floors, a gap researchers linked to the added exposure to daylight.", "opts": ["Fluorescent lighting causes permanent health damage in all office workers.", "Increased exposure to natural light in a workplace may be associated with fewer employee sick days compared to standard fluorescent lighting.", "Sick days are determined entirely by factors unrelated to office lighting.", "Every office building should immediately remove all fluorescent lighting."], "ci": 1, "exp": "The 31 percent gap in sick days between the naturally lit and fluorescent-lit floors, linked by researchers to daylight exposure, supports an association between natural light and fewer sick days, not permanent damage, total irrelevance, or a universal mandate.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"stem": "Which claim is best supported by the results described in the passage?", "passage": "The following text is adapted from a study on public library usage.<br><br>A city extended library hours in half its branches while leaving the rest unchanged. Over six months, the branches with extended hours saw a 27 percent rise in checked-out materials among teenagers, while the unchanged branches saw no meaningful shift in that age group.", "opts": ["All city libraries should close early to reduce operating costs.", "Teenagers do not use public libraries under any circumstances.", "Extending library hours may increase library material usage among teenagers compared to branches without extended hours.", "Extended library hours have no effect on usage among any age group."], "ci": 2, "exp": "The 27 percent rise in teen checkouts specifically at branches with extended hours, compared to no change elsewhere, supports the claim that extended hours may boost usage among teenagers, not the other unsupported extremes.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"stem": "What is the effect of comparing the house to 'an old dog' in the passage?", "passage": "The following text is adapted from a novel. The narrator describes returning to a childhood home now owned by strangers.<br><br>The porch swing still hung from the same chains, though the paint had peeled to bare wood, and for a moment I let myself believe the house had simply been waiting, patient as an old dog, for someone to remember it was there.", "opts": ["It personifies the house as something loyal and quietly waiting, deepening the narrator's emotional connection to the childhood home.", "It literally suggests that a dog was living inside the house.", "It indicates that the narrator dislikes animals.", "It implies that the house is dangerous and should be avoided."], "ci": 0, "exp": "Comparing the house's patience to that of 'an old dog' personifies it as loyal and waiting, reinforcing the narrator's nostalgic, emotional attachment rather than suggesting a literal animal, danger, or the narrator's feelings about animals.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"stem": "What does the description of the final lap as 'a kind of narrowing' primarily convey?", "passage": "The following text is adapted from an essay about competitive swimming.<br><br>The final lap always arrived the same way: not as a burst of energy but as a kind of narrowing, the pool lane closing in until nothing existed but the black line beneath me and the count of my own strokes.", "opts": ["It conveys the swimmer's intense, tunnel-vision focus that blocks out everything except the immediate task of swimming.", "It indicates that the swimmer is swimming in an unusually narrow lane.", "It suggests the swimmer is losing consciousness during the race.", "It describes the physical shrinking of the swimming pool itself."], "ci": 0, "exp": "Describing the final lap as 'a narrowing' where 'nothing existed but the black line' conveys intense focus narrowing out distraction, a figurative description of concentration, not a literal shrinking pool, fainting, or an unusually narrow lane.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"stem": "How does the passage organize its discussion of desalination technology?", "passage": "The following text is adapted from a science journalism piece on desalination.<br><br>Turning seawater into drinking water once required enormous amounts of energy, making it a last resort for coastal cities facing drought. Newer membrane technology has cut the energy needed by nearly a third, and some plants now pair the process with solar power, addressing both the cost and the environmental objections that once limited its use.", "opts": ["It provides a chronological history of every desalination plant built in the last century.", "It first describes desalination's traditional drawbacks, then explains how newer technology has addressed those specific drawbacks.", "It compares desalination to unrelated methods of generating electricity.", "It argues that desalination should never be used regardless of technological improvements."], "ci": 1, "exp": "The passage moves from desalination's old high-energy drawback to newer membrane technology and solar pairing that directly address that drawback, structuring the discussion around problem then solution, not a full history, blanket rejection, or unrelated comparison.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"stem": "What is the main purpose of this passage?", "passage": "The following text is adapted from an article on ancient trade routes.<br><br>Historians once assumed the mountain pass was too treacherous for regular trade, used only in rare emergencies. Recent excavations of tools, coins, and worn stone steps along the route tell a different story, one of merchants crossing it routinely enough to wear grooves into solid rock over centuries.", "opts": ["To compare the cost of ancient trade goods to modern currency.", "To argue that mountain passes are too dangerous to ever be used for trade.", "To present new archaeological evidence that challenges a previous assumption about how frequently a mountain pass was used.", "To describe the discovery of a completely new mountain range."], "ci": 2, "exp": "The passage introduces the old assumption (rare emergency use) and then presents excavation evidence (worn stone steps, tools, coins) that overturns it, making its main purpose to challenge that prior assumption with new evidence.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"stem": "How would the researchers in Text 2 most likely respond to the pilot program results cited in Text 1?", "passage": "Text 1<br>Proponents of four-day work weeks argue that condensing full-time hours into four days boosts employee focus and reduces burnout, citing pilot programs where participating companies reported steady or improved output.<br><br>Text 2<br>Other researchers note that the pilot programs praised by four-day work week advocates often let companies choose which employees participated, potentially excluding roles where a shortened week caused scheduling conflicts or coverage gaps.", "opts": ["They would argue that pilot programs should never be used to study workplace policy.", "They would fully agree that four-day work weeks improve output in every role without exception.", "They would suggest that the positive results may be less representative because companies could choose which employees participated.", "They would claim that scheduling conflicts never occur in any four-day work week program."], "ci": 2, "exp": "Text 2 raises the concern that companies selected which employees joined the pilot programs, potentially skewing results by excluding roles with scheduling problems, directly qualifying rather than fully endorsing or fully rejecting Text 1's cited results.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "How would the researchers in Text 2 most likely respond to the conclusion in Text 1 that the shake caused the observed weight loss?", "passage": "Text 1<br>Nutrition researchers who studied a popular meal-replacement shake found that participants who used it lost more weight on average than participants who did not, over a twelve-week period.<br><br>Text 2<br>A separate group of researchers points out that participants in the original study also received free one-on-one counseling sessions alongside the shake, making it difficult to determine whether the shake itself or the counseling drove the weight loss.", "opts": ["They would argue that weight loss cannot be measured accurately in any study.", "They would claim that counseling sessions have no effect on weight loss whatsoever.", "They would agree completely that the shake alone was responsible for all the weight loss observed.", "They would argue that the counseling sessions provided alongside the shake make it unclear whether the shake alone was responsible for the weight loss."], "ci": 3, "exp": "Text 2 identifies the counseling sessions as a confounding factor that makes it hard to isolate the shake's effect, directly complicating rather than confirming or entirely dismissing Text 1's causal conclusion.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "The following text is adapted from a review of a mystery novel.<br><br>The plot's early chapters move with a ____ patience, laying out small, seemingly unrelated details that only click into place in the book's final pages, rewarding readers willing to sit with unanswered questions for the first two hundred pages.", "opts": ["chaotic", "deliberate", "rushed", "careless"], "ci": 1, "exp": "\"Deliberate\" fits the description of a patience that carefully lays out details meant to click into place later; \"chaotic,\" \"rushed,\" and \"careless\" all contradict the idea of a slow, purposeful setup.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "The following text is adapted from a profile of a chess champion.<br><br>Opponents who mistook her early quiet for uncertainty soon learned it was closer to ____ , a calm that let her calculate a dozen moves ahead while they still weighed their first decision.", "opts": ["panic", "confusion", "exhaustion", "composure"], "ci": 3, "exp": "\"Composure\" matches a calm that enables calculating many moves ahead, while \"panic,\" \"confusion,\" and \"exhaustion\" all describe states inconsistent with someone confidently out-thinking her opponents.", "tag": "Words in Context", "tagcolor": "#7b61ff"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
