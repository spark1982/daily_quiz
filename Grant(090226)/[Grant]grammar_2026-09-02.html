<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_48_20260902_v1";var ATT_KEY = "quiz_grantgrammar_48_att_20260902_v1";var RAW_QUESTIONS = [{"stem": "<div>Present: <b>think</b> &rsaquo; Past: <b>thought</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["thinked", "think", "thinking", "thought"], "ci": 3, "exp": "'think' is an irregular verb. Its past participle is 'thought'. Past perfect: had thought.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "I want <u>peace</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Peace\" receives the action of \"want.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "The birds sang beautiful songs.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["sang", "The birds", "songs", "beautiful"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "The birds sang beautiful songs.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["The birds", "songs", "sang", "beautiful"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["Won't you please help me carry these boxes inside?", "Wont you please help me carry these boxes inside?", "Won't you please help me carry these boxes inside.", "Won't you please help me carry these boxes, inside?"], "ci": 0, "exp": "\"Won't\" is a contraction of \"will not\" and requires an apostrophe. The sentence is a question, so it ends with a question mark. No comma is needed before \"inside.\"", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "She named her baby Joy.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["her baby", "Joy"], "ci": 0, "exp": "\"Her baby\" is the object (who was named). \"Joy\" is the objective complement (the name given).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "He <u>box</u> at the gym every Saturday.", "opts": ["boxes", "boxs", "boxies", "boxeds"], "ci": 0, "exp": "box → boxes (ends in -x, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "The eagle soared _____ the mountains as it searched for prey in the valley below.", "opts": ["above", "among", "past", "beside"], "ci": 0, "exp": "\"Above\" means at a higher level than something. The eagle is flying at a level higher than the mountains. \"Past\" would mean it flew by the mountains, not over them.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>A mechanic <b>fixed</b> the car.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The car ______ by a mechanic.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was fixed", "were fixed", "was fixing", "was fix"], "ci": 0, "exp": "The new subject \"the car\" is singular and the action is in the past, so use was + the past participle \"fixed\": was fixed.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The <b>blooming</b> flower attracted several bees.", "The flowers are <b>blooming</b> early this year.", "The roses were <b>blooming</b> all summer.", "<b>Blooming</b> takes several weeks for this species."], "ci": 0, "exp": "In \"The blooming flower attracted several bees,\" \"blooming\" comes directly before the noun \"flower\" and describes what the flower is doing - this adjective use of an -ing word is a present participle. In \"The flowers are blooming early this year\" and \"The roses were blooming all summer,\" \"blooming\" is the main verb paired with \"are / were,\" making it part of the progressive tense. In \"Blooming takes several weeks for this species,\" \"blooming\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "We ate warm soup yesterday.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the NOUNS in this sentence, and only the nouns?</span>", "opts": ["we, soup", "soup", "we", "we, ate, soup"], "ci": 0, "exp": "'We' is a pronoun used as a noun, and 'soup' is a noun.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The students <b>read</b> the book.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The book ______ by the students.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["is read", "are read", "was read", "were read"], "ci": 2, "exp": "The new subject \"the book\" is singular and the action is in the past, so use was + the past participle \"read\": was read.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "She lent me her bike.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["her bike", "me"], "ci": 0, "exp": "\"Her bike\" is the direct object (what was lent). \"Me\" is the indirect object (who borrowed it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "thin<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["thinner / thinnest", "thiner / thinest", "more thin / most thin", "thinn / thinnest"], "ci": 0, "exp": "thin → thinner / thinnest (short vowel + single consonant: double the -n)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>fight</b> &rsaquo; Past: <b>fought</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["fighted", "fight", "fighting", "fought"], "ci": 3, "exp": "'fight' is an irregular verb. Its past participle is 'fought'. Past perfect: had fought.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "She is <u>live</u> her best life.", "opts": ["living", "liveing", "livving", "lived"], "ci": 0, "exp": "live → living (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "She named her baby Joy.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["Joy", "her baby"], "ci": 0, "exp": "\"Joy\" is the objective complement — it is the name given to \"her baby.\" \"Her baby\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["The baby is <b>laughing</b> at the puppet show.", "We were <b>laughing</b> so hard we cried.", "I can't stop <b>laughing</b> at that joke.", "They will be <b>laughing</b> about this for years."], "ci": 2, "exp": "In \"I can't stop laughing at that joke,\" \"laughing\" is the object of the verb \"stop\" - a noun role - which makes it a gerund. In the other three sentences, \"laughing\" follows \"is / were / will be\" and describes an action in progress, so it is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["While the children played outside.", "The library closes at nine o'clock.", "Hidden under the old wooden bed.", "If it snows more than six inches."], "ci": 1, "exp": "\"The library closes at nine o'clock.\" is a complete sentence — subject: 'The library', predicate: 'closes'. The others are fragments: a 'While' clause, a participial phrase, and an 'If' clause.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "She ________ her report.", "opts": ["already submitted", "has already submitted"], "ci": 1, "exp": "Already indicates completion relative to now, so use present perfect: has already submitted.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The library returned it's books to the shelf.", "We parked are car in the wrong spot.", "The childrens park was newly renovated.", "The lawyer reviewed her client's contract."], "ci": 3, "exp": "<strong>\"client's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>are</em> should be <em>our</em> (possessive adjective).<br>• <em>childrens park</em> is missing the apostrophe — should be <em>children's</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["We need to buy: eggs, milk, butter, and flour.", "We need to buy eggs, milk, butter, and flour.", "We need to buy eggs milk butter and flour.", "We need to buy — eggs, milk, butter, and flour."], "ci": 1, "exp": "A colon should not be placed directly after a verb. When a list follows a verb naturally (like \"buy\"), no colon is needed. Commas are required to separate list items, and a serial comma goes before \"and.\"", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">She had barely stepped outside when it started to hail.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Barely she had stepped outside when it started to hail.", "Barely had she stepped outside when it started to hail.", "Barely did she step outside when it started to hail.", "Barely had she stepped outside that it started to hail."], "ci": 1, "exp": "\"Barely\" triggers inversion: \"Barely + had + she + stepped...\". The conjunction is \"when\" (not \"that\"), and past perfect \"had\" is correct. The correct form is: Barely had she stepped outside when it started to hail.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>fall</b>?", "opts": ["fell", "falled", "fallen", "fellen"], "ci": 0, "exp": "The past tense of <b>fall</b> is <b>fell</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>fish</b>?", "opts": ["fishes", "fishies", "fishs", "fish"], "ci": 3, "exp": "fish → fish (no change when talking about multiple fish of the same kind)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "She _____ written ten chapters of her novel so far.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" (has) is correct. \"So far\" signals that the action is still ongoing.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "They ________ the project last Friday.", "opts": ["completed", "have completed"], "ci": 0, "exp": "Last Friday is a specific finished time, so use simple past: completed.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The mices' nest was found in the attic.", "Put the groceries in there proper place.", "Toms car has a broken headlight.", "The mice's droppings were found near the wall."], "ci": 3, "exp": "<strong>\"mice's\"</strong> is correct — <em>mice</em> is already the plural of <em>mouse</em>; the possessive is <em>mice's</em>.<br>• <em>mices'</em> is wrong — <em>mices</em> is not a word.<br>• <em>there</em> should be <em>their</em> (possessive adjective).<br>• <em>Toms</em> is missing the apostrophe — should be <em>Tom's</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "fat<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["fatter / fattest", "fater / fatest", "more fat / most fat", "fatt / fattest"], "ci": 0, "exp": "fat → fatter / fattest (short vowel + single consonant: double the -t)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Please place the completed permission slips _____ the red folder on the teacher's desk.", "opts": ["inside", "onto", "against", "across"], "ci": 0, "exp": "\"Inside\" means within the folder, which is where permission slips belong. \"Onto\" means placing something on top of a surface, not within it.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "By the end of last semester, our team <span style=\"text-decoration:underline;\">______</span> the entire science project.", "opts": ["had finished", "has finished", "will have finished", "finished"], "ci": 0, "exp": "\"had finished\" is past perfect — the project was complete before the semester ended.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "She lent me her bike.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["me", "her bike"], "ci": 0, "exp": "\"Me\" is the indirect object (who borrowed it). \"Her bike\" is the direct object (what was lent).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "We <span style=\"text-decoration:underline;\">______</span> the project successfully so far, but we need a final check.", "opts": ["had finished", "have finished", "will have finished", "were finishing"], "ci": 1, "exp": "\"have finished\" is present perfect — the project is done up to now, with relevance to the present.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "He is <u>love</u> every moment of this trip.", "opts": ["loving", "loveing", "lovving", "loved"], "ci": 0, "exp": "love → loving (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "She <u>mix</u> the batter carefully.", "opts": ["mixes", "mixs", "mixies", "mixeds"], "ci": 0, "exp": "mix → mixes (ends in -x, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The candle is <b>burning</b> on the table.", "The <b>burning</b> candle filled the room with a sweet smell.", "The fire was <b>burning</b> brightly.", "<b>Burning</b> old paperwork is one way to get rid of it."], "ci": 1, "exp": "In \"The burning candle filled the room with a sweet smell,\" \"burning\" comes directly before the noun \"candle\" and describes what the candle is doing - this adjective use of an -ing word is a present participle. In \"The candle is burning on the table\" and \"The fire was burning brightly,\" \"burning\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Burning old paperwork is one way to get rid of it,\" \"burning\" (with \"old paperwork\") is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "The students _____ already handed in their assignments.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. Present perfect with \"already\" shows a completed action relevant to the present.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["<b>Crying</b> is a normal way to release emotions.", "The baby is <b>crying</b> in the next room.", "She was <b>crying</b> after the sad movie.", "He will be <b>crying</b> tears of joy at graduation."], "ci": 0, "exp": "In \"Crying is a normal way to release emotions,\" \"crying\" is the subject of the sentence - a noun - which makes it a gerund. In the other three sentences, \"crying\" follows \"is / was / will be\" and is part of the progressive verb tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">He had no sooner sat down than the alarm went off.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["No sooner he had sat down than the alarm went off.", "No sooner had he sat down than the alarm went off.", "No sooner had he sat down when the alarm went off.", "No sooner did he sit down than the alarm went off."], "ci": 1, "exp": "\"No sooner...than\" requires inversion: \"No sooner + had + he + sat down...\". The conjunction must be \"than\" (not \"when\"). Past perfect \"had\" is correct. The correct form is: No sooner had he sat down than the alarm went off.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "He learns <u>math</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Math\" receives the action of \"learns.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["Every student in all three classes have submitted the assignment.", "Each of the paintings in the museum were restored last year.", "Each member of the two debate teams are preparing a speech.", "Every student in all three classes has submitted the assignment."], "ci": 3, "exp": "\"Every\" always takes a singular verb, so \"has submitted\" is correct. In 'Every student...have submitted,' \"Every student\" is singular — use \"has.\" In 'Each of the paintings...were,' \"Each\" is singular — use \"was.\" In 'Each member...are preparing,' \"Each\" is singular — use \"is.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "We ate warm soup yesterday.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the VERBS in this sentence, and only the verbs?</span>", "opts": ["ate", "ate, yesterday", "ate, warm", "we, ate"], "ci": 0, "exp": "'Ate' is the past tense verb.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["three flat cotton sheets", "flat three cotton sheets", "cotton three flat sheets", "three cotton flat sheets"], "ci": 0, "exp": "Correct order: number (three) → shape (flat) → material (cotton) → noun\n✔ three flat cotton sheets", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["The wind blew the leaves off the trees.", "Whenever the phone rings loudly.", "A pile of old magazines on the floor.", "Singing and dancing at the school talent show."], "ci": 0, "exp": "\"The wind blew the leaves off the trees.\" is a complete sentence — subject: 'The wind', predicate: 'blew'. The others are fragments: a 'Whenever' clause, a noun phrase, and an -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>give</b>?", "opts": ["gave", "gived", "given", "gaven"], "ci": 0, "exp": "The past tense of <b>give</b> is <b>gave</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>deer</b>?", "opts": ["deers", "deeress", "deer", "deeres"], "ci": 2, "exp": "deer → deer (no change)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["enormous empty blue ocean", "blue enormous empty ocean", "empty enormous blue ocean", "enormous blue empty ocean"], "ci": 0, "exp": "Correct order: size (enormous) → condition (empty) → color (blue) → noun\n✔ enormous empty blue ocean", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The principal and the vice principal reviews the schedule every Monday.", "The principal and the vice principal review the schedule every Monday.", "Math and science is my favorite subjects this year.", "The coach and the assistant coach runs the drill every morning."], "ci": 1, "exp": "\"The principal and the vice principal\" is a compound (plural) subject, so \"review\" is correct. \"Reviews\" is singular — wrong for two people. \"Math and science\" is a compound subject — use \"are.\" \"Coach and assistant coach\" is compound — use \"run.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
