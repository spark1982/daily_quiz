itors to the inn.<br><br>As demand for Ruth's chocolate cookies grew, so did the sales of the semi-sweet chocolate bar she used. Executives at the chocolate company noticed the unusual spike in sales near Whitman, Massachusetts, and eventually traced it back to Ruth's popular recipe. Curious, representatives visited the inn and asked to license her recipe for their own packaging.<br><br>Ruth agreed to a deal: in exchange for allowing the company to print her recipe on every package of chocolate bars, she would receive a lifetime supply of chocolate. The company also began selling a specially scored chocolate bar, designed to be broken apart easily into the very chunks Ruth's recipe required.<br><br>What started as a simple substitution born of necessity transformed into one of the most beloved desserts in American history. Today, chocolate chip cookies remain a household staple, and few who enjoy them realize that their invention traces back to a resourceful innkeeper improvising with what she had on hand."}, {"stem": "According to the passage, what happened when Ruth put the chocolate chunks into the oven?", "opts": ["The chunks melted completely, blending smoothly into the dough as baker's chocolate normally would.", "The chunks burned before the rest of the cookie finished baking.", "The chunks softened only slightly and kept their shape instead of dissolving into the batter.", "The chunks caused the dough to rise higher than usual."], "ci": 2, "exp": "The passage states the chocolate chunks \"held their shape in the oven, softening only slightly instead of dissolving completely into the batter,\" showing that they softened only slightly and kept their shape rather than melting away.", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In the 1930s, a woman named Ruth Wakefield ran a small inn in Massachusetts called the Toll House Inn, where she was famous for baking rich, buttery cookies for her guests. One afternoon, while preparing a   for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){

  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}

}
function loadState(){

    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};

function formatTime(sec){

  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
