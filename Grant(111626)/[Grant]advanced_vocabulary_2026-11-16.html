<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261116";
var RAW_QUESTIONS = [{"stem": "Read the sentence: \"The old clock stopped working because one tiny gear inside its <b>mechanism</b> had broken.\" What does <b>mechanism</b> mean in this sentence?", "opts": ["the sound a machine makes", "the outside case that protects a machine", "a set of moving parts that work together inside a machine", "the instructions for using a machine"], "ci": 2, "exp": "<i>mechanism</i> (n.) a system of parts that work together to do a job. <i>The door lock has a simple <b>mechanism</b>.</i> Family: mechanical (adj.), mechanic (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Carrying three heavy backpacks up the hill was a real ______ for Max, so his sister offered to take one. Which word best completes the sentence?", "opts": ["conflict", "outcome", "priority", "burden"], "ci": 3, "exp": "<i>burden</i> (n.) a heavy load, or something hard to deal with. <i>Doing all the chores alone was a <b>burden</b>.</i> A <i>priority</i> is something important to do first, and an <i>outcome</i> is a result. Family: burdensome (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"Every morning, Lucy walked out to the <b>stable</b> to feed and brush the two ponies.\" What does <b>stable</b> mean in this sentence?", "opts": ["calm and not easily upset", "steady and not likely to move or change", "a strong table used for work", "a building where horses are kept"], "ci": 3, "exp": "<i>stable</i> can mean steady (adj.), but here it is a noun: a building where horses live. Feeding and brushing ponies is the clue. <i>The horses rested in the <b>stable</b> during the storm.</i> Family: stability (n.), stabilize (v.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Read the sentence: \"Before the field trip, the principal gave the bus drivers a <b>brief</b> about the route and the stops.\" What does <b>brief</b> mean in this sentence?", "opts": ["short pants worn under clothing", "a short report with important information", "using very few words when speaking", "lasting only a short time"], "ci": 1, "exp": "<i>brief</i> can be an adjective (short in time or length) or a noun. After <i>a</i>, it is a noun here: a short report or set of instructions. <i>The captain read the pilots a <b>brief</b> before takeoff.</i> Family: briefly (adv.), briefing (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Read the sentence: \"The climbers stared up at the <b>vertical</b> cliff that rose straight toward the sky.\" Which word means the <b>OPPOSITE</b> of <b>vertical</b>?", "opts": ["upright", "narrow", "steep", "horizontal"], "ci": 3, "exp": "<i>vertical</i> (adj.) going straight up and down. Its opposite is <i>horizontal</i> (flat, side to side, like the horizon). <i>Upright</i> means nearly the same as vertical. Family: vertically (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"The number of monarch butterflies began to <b>decline</b> when the milkweed plants they need disappeared.\" Which word means the <b>SAME</b> or nearly the same as <b>decline</b>?", "opts": ["change color", "decrease", "travel", "increase"], "ci": 1, "exp": "Here <i>decline</i> (v.) means to become smaller or fewer. <i>Decrease</i> means the same; <i>increase</i> is the opposite. (Decline can also mean to politely say no.) Family: declining (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The student council made colorful posters to ______ the canned food drive and get more families to donate. Which word best completes the sentence?", "opts": ["abandon", "restrict", "clarify", "promote"], "ci": 3, "exp": "<i>promote</i> (v.) to help something become known or grow; also to move someone to a higher rank. <i>The ads <b>promote</b> the new movie.</i> <i>Restrict</i> (limit) and <i>abandon</i> (give up on) would work against the drive. Family: promotion (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"Although Sam was disappointed, he shook hands with the winner to <b>acknowledge</b> that she had played a better game.\" What does <b>acknowledge</b> mean in this sentence?", "opts": ["to argue that something is unfair", "to admit that something is true", "to pretend that something did not happen", "to forget about something quickly"], "ci": 1, "exp": "<i>acknowledge</i> (v.) to admit or recognize that something is true or real. <i>The coach <b>acknowledged</b> that the team needed more practice.</i> Family: acknowledgment (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"The small creek behind the school is a <b>tributary</b> that flows into the Arkansas River about two miles away.\" What does <b>tributary</b> mean in this sentence?", "opts": ["a stream that flows into a bigger river", "a lake made by building a dam", "the place where a river begins in the mountains", "a bridge that crosses over a river"], "ci": 0, "exp": "<i>tributary</i> (n.) a smaller stream or river that flows into a larger one. <i>The Missouri River is a <b>tributary</b> of the Mississippi.</i> Family: tributaries (n. pl.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The class decided to ______ everyone’s ideas into one big mural, so each student painted a small part. Which word best completes the sentence?", "opts": ["reject", "summarize", "exclude", "incorporate"], "ci": 3, "exp": "<i>incorporate</i> (v.) to include something as part of a larger whole. <i>The chef <b>incorporated</b> fresh herbs into the soup.</i> <i>Exclude</i> and <i>reject</i> mean the opposite (leave out). Family: incorporation (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"After the oil spill, scientists studied the <b>ecological</b> damage to the fish, birds, and plants along the coast.\" What does <b>ecological</b> mean in this sentence?", "opts": ["having to do with the history of a place", "having to do with how much money something costs", "having to do with machines and factories", "having to do with how living things and their surroundings affect each other"], "ci": 3, "exp": "<i>ecological</i> (adj.) related to the connections between living things and their environment. <i>Planting native flowers has <b>ecological</b> benefits for bees.</i> Family: ecology (n.), ecologist (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"With the TV blaring in the next room, Aria found it hard to <b>concentrate</b> on her math homework.\" What does <b>concentrate</b> mean in this sentence?", "opts": ["to share your work with someone", "to change your plans", "to finish something very quickly", "to give all your attention to one thing"], "ci": 3, "exp": "<i>concentrate</i> (v.) to focus all your attention on something. <i>Close the door so you can <b>concentrate</b>.</i> Family: concentration (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The caterpillar’s ______ into a butterfly took about two weeks inside its chrysalis. Which form of the word fits the sentence?", "opts": ["transformation", "transformable", "transformed", "transform"], "ci": 0, "exp": "After <i>The caterpillar’s</i>, the blank needs a noun: <i>transformation</i> (a complete change in form). <i>Transform</i> is the verb and <i>transformable</i> is an adjective.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Read the sentence: \"When the package did not arrive, Mom called the post office to <b>inquire</b> where it might be.\" What does <b>inquire</b> mean in this sentence?", "opts": ["to complain loudly", "to wait patiently", "to ask for information", "to send something again"], "ci": 2, "exp": "<i>inquire</i> (v.) to ask a question to get information. <i>The visitor stopped at the desk to <b>inquire</b> about the museum hours.</i> Family: inquiry (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"The new plastic ruler was so <b>rigid</b> that it snapped when Noah tried to bend it.\" Which word means the <b>OPPOSITE</b> of <b>rigid</b>?", "opts": ["solid", "firm", "stiff", "flexible"], "ci": 3, "exp": "<i>rigid</i> (adj.) stiff and not able to bend. Its opposite is <i>flexible</i> (able to bend easily). <i>Stiff</i> and <i>firm</i> mean almost the same as rigid. Family: rigidly (adv.), rigidity (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The ______ of the two small schools into one larger building meant that friends from both neighborhoods were finally classmates. Which form of the word fits the sentence?", "opts": ["consolidated", "consolidating", "consolidate", "consolidation"], "ci": 3, "exp": "The blank comes after <i>The</i> and before <i>of</i>, so it needs a noun: <i>consolidation</i> (the act of joining things into one). <i>Consolidate</i> is the verb; <i>consolidated</i> and <i>consolidating</i> are verb forms.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Read the sentence: \"The sign on the elevator said that the <b>maximum</b> number of riders was eight, so Leo waited for the next one.\" What does <b>maximum</b> mean in this sentence?", "opts": ["the smallest amount needed", "an amount that is only a guess", "the usual or average amount", "the largest amount allowed or possible"], "ci": 3, "exp": "<i>maximum</i> (n./adj.) the greatest amount that is allowed or possible. <i>The <b>maximum</b> speed on this road is 45 miles per hour.</i> Family: maximize (v.); opposite: minimum", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Even after the first three tries failed, Hana chose to <b>persist</b> until her paper airplane flew across the room.\" Which word means the <b>SAME</b> or nearly the same as <b>persist</b>?", "opts": ["keep going", "show off", "give up", "slow down"], "ci": 0, "exp": "<i>persist</i> (v.) to keep trying even when something is hard. <i>Keep going</i> means the same. <i>Give up</i> is the opposite. Family: persistent (adj.), persistence (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "To ______ how a volcano erupts, Ms. Lopez mixed baking soda and vinegar inside a clay model. Which word best completes the sentence?", "opts": ["eliminate", "illustrate", "restrict", "conceal"], "ci": 1, "exp": "<i>illustrate</i> (v.) to show or explain something by using examples or pictures. <i>The chart helps <b>illustrate</b> how the population grew.</i> <i>Conceal</i> means hide and <i>eliminate</i> means get rid of, which do not fit a demonstration. Family: illustration (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"Before the workers built the walls of the new library, they poured a thick concrete <b>foundation</b> deep into the ground.\" What does <b>foundation</b> mean in this sentence?", "opts": ["the outside paint that protects a wall", "a plan drawn on paper before building", "the roof that keeps rain out of a building", "the solid base that a building stands on"], "ci": 3, "exp": "<i>foundation</i> (n.) the strong base that holds up a building; also the basic idea something is built on. <i>Reading every day is a good <b>foundation</b> for learning.</i> Family: found (v.), founder (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
