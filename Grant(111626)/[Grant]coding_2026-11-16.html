var TODAY_STR = "20261116";
var ITEMS = [{"type": "puzzle", "tag": "Sequences", "title": "First Steps", "goal": "Grab the gem 💎, then stop on the flag 🚩.", "map": ["#######", "#H..*.#", "#####.#", "#####F#", "#######"], "palette": ["hero.move_right()", "hero.move_left()", "hero.move_up()", "hero.move_down()"], "hint": "Count the squares: how many steps right to reach the end of the hallway? Then how many steps down?", "solution": "hero.move_right()\nhero.move_right()\nhero.move_right()\nhero.move_right()\nhero.move_down()\nhero.move_down()", "explain": "Python runs your lines <b>from top to bottom, one at a time<\/b>. Four steps right reach the end of the hallway (the gem is picked up on the way), then two steps down land on the flag. Bonus: <code>hero.move_right(4)<\/code> does four steps in one line!", "id": "20261116-1", "tagcolor": "#185FA5"}, {"type": "mc", "tag": "Sequences", "stem": "The robot runs this code. When it finishes, how many squares to the <b>right<\/b> of its starting square is it?", "code": "hero.move_right()\nhero.move_right()\nhero.move_up()\nhero.move_left()", "opts": ["1", "2", "3", "0"], "ci": 0, "exp": "Follow the lines in order: right (+1), right (+2), up (still 2 to the right &mdash; up does not change left/right), left (back to +1). So the robot ends <b>1<\/b> square to the right. If you answered 2, you probably forgot the <code>move_left()<\/code> at the end; 3 counts the <code>move_up()<\/code> as a right step.", "id": "20261116-2", "tagcolor": "#185FA5"}, {"type": "puzzle", "tag": "Sequences", "title": "Gem Staircase", "goal": "Collect all 3 gems going down the stairs, then stop on the flag 🚩.", "map": ["#######", "#H*####", "##.*###", "###.*##", "####.F#", "#######"], "palette": ["hero.move_right()", "hero.move_left()", "hero.move_up()", "hero.move_down()"], "hint": "Look at the pattern: one step right, then one step down, then right again…", "solution": "hero.move_right()\nhero.move_down()\nhero.move_right()\nhero.move_down()\nhero.move_right()\nhero.move_down()\nhero.move_right()", "explain": "The stairs go <b>right, down, right, down, right, down, right<\/b>. Every step lands on a gem or a floor tile, never a wall. Notice the pattern repeats &mdash; next you will learn how a <b>loop<\/b> can repeat it for you.", "id": "20261116-3", "tagcolor": "#185FA5"}, {"type": "mc", "tag": "Loops", "stem": "How many times does this code print <code>hop<\/code>?", "code": "for i in range(4):\n    print(\"hop\")", "opts": ["4", "3", "5", "1"], "ci": 0, "exp": "<code>range(4)<\/code> means &ldquo;repeat 4 times.&rdquo; The indented line <code>print(\"hop\")<\/code> is inside the loop, so it runs 4 times. (The numbers counted are 0, 1, 2, 3 &mdash; that is still 4 numbers, which is why 3 is a trap.)", "id": "20261116-4", "tagcolor": "#1D9E75"}, {"type": "mc", "tag": "Loops", "stem": "What does this code print?", "code": "for i in range(3):\n    print(i)", "opts_code": true, "opts": ["0\n1\n2", "1\n2\n3", "0\n1\n2\n3", "3"], "ci": 0, "exp": "In Python, <code>range(3)<\/code> counts <b>starting at 0<\/b>: 0, 1, 2. The loop variable <code>i<\/code> takes each value in turn, and <code>print(i)<\/code> shows it. It stops <i>before<\/i> 3, so 3 is never printed.", "id": "20261116-5", "tagcolor": "#1D9E75"}, {"type": "puzzle", "tag": "Loops", "title": "Loop the Stairs", "goal": "Collect all 4 gems and stop on the flag 🚩 &mdash; but this time use a <b>for loop<\/b>.", "map": ["#######", "#H#####", "#*.####", "##*.###", "###*.##", "####*F#", "#######"], "palette": ["hero.move_right()", "hero.move_left()", "hero.move_up()", "hero.move_down()", "for i in range(4):"], "max_lines": 3, "must_use": ["for"], "hint": "The robot repeats the same two moves: down, then right. Put those two lines <b>inside<\/b> (indented under) <code>for i in range(4):<\/code>.", "solution": "for i in range(4):\n    hero.move_down()\n    hero.move_right()", "explain": "The pattern <b>down, right<\/b> happens 4 times. A <code>for<\/code> loop repeats every indented line under it, so 3 lines do the work of 8. The 4 spaces at the start of lines 2&ndash;3 tell Python those lines belong <b>inside<\/b> the loop.", "id": "20261116-6", "tagcolor": "#1D9E75"}, {"type": "mc", "tag": "Loops", "stem": "What does this code print? Look carefully at which lines are indented.", "code": "for i in range(2):\n    print(\"A\")\nprint(\"B\")", "opts_code": true, "opts": ["A\nA\nB", "A\nB\nA\nB", "A\nB\nB", "A\nA\nB\nB"], "ci": 0, "exp": "Only the <b>indented<\/b> line <code>print(\"A\")<\/code> is inside the loop, so <code>A<\/code> is printed 2 times. <code>print(\"B\")<\/code> is not indented, so it runs <b>once<\/b>, after the loop is finished. &ldquo;A, B, A, B&rdquo; would be right only if <code>print(\"B\")<\/code> were also indented.", "id": "20261116-7", "tagcolor": "#1D9E75"}, {"type": "mc", "tag": "Debugging", "stem": "This code is supposed to move the robot right 3 times, but Python gives an error. What is the mistake?", "code": "for i in range(3)\n    hero.move_right()", "opts": ["The first line is missing a colon <code>:<\/code> at the end", "The second line should not be indented", "<code>range(3)<\/code> should be <code>range[3]<\/code>", "<code>hero.move_right()<\/code> needs a number inside the parentheses"], "ci": 0, "exp": "Every line that starts a block &mdash; <code>for<\/code>, <code>if<\/code>, <code>while<\/code>, <code>def<\/code> &mdash; must end with a colon: <code>for i in range(3):<\/code>. The indentation of the second line is correct (it must be indented to be inside the loop), <code>range<\/code> uses round parentheses, and <code>move_right()<\/code> works fine without a number (it moves 1 step).", "id": "20261116-8", "tagcolor": "#495057"}, {"type": "puzzle", "tag": "Loops", "title": "Hurdle Jumper", "goal": "Hop over the brick hurdles, landing on both gems 💎, and finish on the flag 🚩. Use a <b>for loop<\/b>.", "map": ["#########", "#.......#", "#H#*#*#F#", "#########"], "palette": ["hero.move_right()", "hero.move_left()", "hero.move_up()", "hero.move_down()", "hero.move_right(2)", "for i in range(3):"], "max_lines": 5, "must_use": ["for"], "hint": "One hop is: up, right, right, down. How many hops get you to the flag? Put the hop inside <code>for i in range(…):<\/code>.", "solution": "for i in range(3):\n    hero.move_up()\n    hero.move_right(2)\n    hero.move_down()", "explain": "One hop is <b>up, right 2, down<\/b>, and it lands the robot just past a hurdle. Three hops land on the two gems and then the flag. Going along the top row the whole way would skip the gems, which sit down between the hurdles.", "id": "20261116-9", "tagcolor": "#1D9E75"}, {"type": "mc", "tag": "Loops", "stem": "Which code moves the robot <b>right 6 times<\/b> with no errors?", "opts_code": true, "opts": ["for i in range(6):\n    hero.move_right()", "for i in range(5):\n    hero.move_right()", "for i in range(6):\nhero.move_right()", "for i in range(3):\n    hero.move_right()\nhero.move_right()"], "ci": 0, "exp": "<code>range(6)<\/code> repeats 6 times, and the indented <code>hero.move_right()<\/code> runs each time. <code>range(5)<\/code> moves only 5 times. Without the indent, Python gives an error because the loop has nothing inside it. The last choice moves 3 times in the loop and once after it &mdash; only 4 steps.", "id": "20261116-10", "tagcolor": "#1D9E75"}];

var N = ITEMS.length;

function blankState(){ return { answers:{}, codes:{}, runs:{}, cur:0, showResults:false, reported:false }; }
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts() + 1)); }catch(e){} }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(code){
  var KW = /^(for|in|range|if|elif|else|while|def|return|and|or|not|True|False|break|pass|print)$/;
  return code.split('\n').map(function(line){
    var out = '', i = 0, m;
    while(i < line.length){
      var rest = line.slice(i);
      if(rest[0] === '#'){ out += '<span class="cm">' + esc(rest) + '</span>'; break; }
      if((m = rest.match(/^("[^"]*"|'[^']*')/))){ out += '<span class="str">' + esc(m[0]) + '</span>'; i += m[0].length; continue; }
      if((m = rest.match(/^\d+/))){ out += '<span class="num">' + m[0] + '</span>'; i += m[0].length; continue; }
      if((m = rest.match(/^[A-Za-z_]\w*/))){
        var w = m[0], nxt = rest.slice(w.length);
        out += KW.test(w) ? '<span class="kw">' + w + '</span>' : (/^\s*\(/.test(nxt) ? '<span class="fn">' + w + '</span>' : esc(w));
        i += w.length; continue;
      }
      out += esc(rest[0]); i++;
    }
    return out;
  }).join('\n');
}

/* ===================== mini-Python interpreter (subset) ===================== */
function PyErr(line, msg){ this.line = line; this.msg = msg; }
function tokenize(src, line){
  var toks = [], i = 0, m;
  while(i < src.length){
    var c = src[i];
    if(c === ' ' || c === '\t'){ i++; continue; }
    if(c === '#') break;
    var rest = src.slice(i);
    if((m = rest.match(/^\d+(\.\d+)?/))){ toks.push({t:'num', v:parseFloat(m[0])}); i += m[0].length; continue; }
    if((m = rest.match(/^("([^"\\]|\\.)*"|'([^'\\]|\\.)*')/))){ toks.push({t:'str', v:m[0].slice(1,-1)}); i += m[0].length; continue; }
    if(c === '"' || c === "'") throw new PyErr(line, 'A quote mark is not closed.');
    if((m = rest.match(/^[A-Za-z_]\w*/))){ toks.push({t:'name', v:m[0]}); i += m[0].length; continue; }
    if((m = rest.match(/^(\/\/|==|!=|<=|>=|\+=|-=|\*=|[+\-*\/%<>=(),.:\[\]])/))){ toks.push({t:'op', v:m[0]}); i += m[0].length; continue; }
    throw new PyErr(line, 'I don\u2019t understand the symbol \u201c' + c + '\u201d.');
  }
  return toks;
}
function Parser(toks, line){ this.k = toks; this.p = 0; this.line = line; }
Parser.prototype.peek = function(){ return this.k[this.p]; };
Parser.prototype.isOp = function(v){ var t = this.k[this.p]; return t && t.t === 'op' && t.v === v; };
Parser.prototype.isName = function(v){ var t = this.k[this.p]; return t && t.t === 'name' && t.v === v; };
Parser.prototype.eat = function(v){ if(!this.isOp(v)) throw new PyErr(this.line, 'Expected \u201c' + v + '\u201d here.'); this.p++; };
Parser.prototype.expr = function(){ return this.or_(); };
Parser.prototype.or_ = function(){ var a = this.and_(); while(this.isName('or')){ this.p++; a = {e:'or', a:a, b:this.and_()}; } return a; };
Parser.prototype.and_ = function(){ var a = this.not_(); while(this.isName('and')){ this.p++; a = {e:'and', a:a, b:this.not_()}; } return a; };
Parser.prototype.not_ = function(){ if(this.isName('not')){ this.p++; return {e:'not', a:this.not_()}; } return this.cmp(); };
Parser.prototype.cmp = function(){
  var a = this.add();
  while(this.peek() && this.peek().t === 'op' && /^(==|!=|<|>|<=|>=)$/.test(this.peek().v)){ var o = this.k[this.p++].v; a = {e:'bin', o:o, a:a, b:this.add()}; }

    var msgTxt = a ? (a.ok ? '\ud83c\udf89 Solved' + (state.runs[qi] ? ' in ' + state.runs[qi] + ' run' + (state.runs[qi] > 1 ? 's' : '') : '') + '!' : 'You looked at the solution. Study it, then try a puzzle like this again in Retry.') : '';
    h += '<div class="' + msgCls + '" id="msg">' + msgTxt + '</div>';
    if(a) h += '<div class="exp-box show"><b>A good solution:</b><pre class="code">' + hl(it.solution) + '</pre>' + it.explain + '</div>';
  }
  document.getElementById('item').innerHTML = h;
  var ed = document.getElementById('editor');
  if(ed && !a){ ed.addEventListener('input', function(){ state.codes[qi] = ed.value; saveState(); }); ed.addEventListener('keydown', edKey); }
  var nb = document.getElementById('next-btn'); nb.textContent = state.cur === ao.length - 1 ? 'Finish' : 'Next';
  document.getElementById('prev-btn').disabled = state.cur === 0;
}
function edKey(e){
  var ed = e.target, s = ed.selectionStart, v = ed.value;
  if(e.key === 'Tab'){ e.preventDefault(); ed.value = v.slice(0, s) + '    ' + v.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = s + 4; ed.dispatchEvent(new Event('input')); }
  else if(e.key === 'Enter'){
    e.preventDefault();
    var ls = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(ls, s), ind = line.match(/^ */)[0];
    if(/:\s*$/.test(line)) ind += '    ';
    var ins = '\n' + ind; ed.value = v.slice(0, s) + ins + v.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = s + ins.length; ed.dispatchEvent(new Event('input'));
  }
}
function insertCode(i){
  var it = ITEMS[activeOrder()[state.cur]], ed = document.getElementById('editor'); if(!ed || ed.readOnly) return;
  var v = ed.value, s = (typeof ed.selectionStart === 'number') ? ed.selectionStart : v.length;
  var ls = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(ls, s), snippet = it.palette[i];
  var ins;
  if(line.trim() === ''){ ins = snippet; }
  else { var ind = line.match(/^ */)[0]; if(/:\s*$/.test(line)) ind += '    '; ins = '\n' + ind + snippet; }
  if(/:$/.test(snippet)){ var bi = ((line.trim() === '' ? line : (ins.match(/\n( *)/) || ['',''])[1])) + '    '; ins += '\n' + bi; }
  ed.value = v.slice(0, s) + ins + v.slice(s); ed.selectionStart = ed.selectionEnd = s + ins.length; ed.focus();
  ed.dispatchEvent(new Event('input'));
}
function toggleHint(){ hintOn = !hintOn; var b = document.getElementById('hint-box'); if(b) b.style.display = hintOn ? 'block' : 'none'; }
function resetCode(){ var qi = activeOrder()[state.cur]; delete state.codes[qi]; saveState(); render(); }
function animate(item, frames, done){
  if(anim){ clearTimeout(anim); anim = null; }
  var bw = document.getElementById('board-wrap'), con = document.getElementById('console'), i = 0;
  if(window.__fast || !frames.length){ var f = frames[frames.length - 1]; if(bw && f) bw.innerHTML = boardHTML(item, f); if(con && f && f.out.length){ con.style.display = 'block'; con.textContent = f.out.join('\n'); } done(); return; }
  (function step(){
    var f = frames[i]; if(bw) bw.innerHTML = boardHTML(item, f);
    if(con && f.out.length){ con.style.display = 'block'; con.textContent = f.out.join('\n'); }
    i++; if(i < frames.length) anim = setTimeout(step, 260); else { anim = null; done(); }
  })();
}
function runCode(){
  var qi = activeOrder()[state.cur], it = ITEMS[qi], ed = document.getElementById('editor'); if(!ed || state.answers[qi]) return;
  var src = ed.value; state.codes[qi] = src; state.runs[qi] = (state.runs[qi] || 0) + 1; saveState();
  var res = checkPuzzle(it, src), rb = document.getElementById('run-btn'); if(rb) rb.disabled = true;
  var msg = document.getElementById('msg'); msg.className = 'msg info'; msg.textContent = 'Running\u2026';
  animate(it, res.r.world.frames, function(){
    if(rb) rb.disabled = false;
    if(res.ok){ state.answers[qi] = {ok:true, code:src}; saveState(); render(); }
    else { msg.className = 'msg bad'; msg.textContent = res.msg + (state.runs[qi] >= 3 ? '  (Stuck? Try the Hint.)' : ''); }
  });
}
function replay(){ var qi = activeOrder()[state.cur], it = ITEMS[qi], a = state.answers[qi]; var r = run(a && a.ok ? a.code : it.solution, it); animate(it, r.world.frames, function(){}); }
function openGiveUp(){ document.getElementById('giveup-modal').style.display = 'flex'; }
function closeGiveUp(){ document.getElementById('giveup-modal').style.display = 'none'; }
function confirmGiveUp(){ closeGiveUp(); var qi = activeOrder()[state.cur]; var ed = document.getElementById('editor'); state.answers[qi] = {ok:false, code: ed ? ed.value : (state.codes[qi] || ''), gaveUp:true}; saveState(); render(); }
function pick(i){ var qi = activeOrder()[state.cur], it = ITEMS[qi]; if(it.type !== 'mc' || state.answers[qi]) return; state.answers[qi] = {pick:i, ok: i === it.ci}; saveState(); render(); }
function prevQ(){ if(state.cur > 0){ state.cur--; hintOn = false; saveState(); render(); } }
function finish(){
  if(state.reported){ state.showResults = true; saveState(); render(); return; } /* no-resend-after-review */
  state.showResults = true; incAttempts(); saveState(); render(); reportResult(); state.reported = true; saveState();
}
function goNext(){ if(state.showResults) return; var ao = activeOrder(); hintOn = false; if(state.cur < ao.length - 1){ state.cur++; saveState(); render(); } else finish(); }
function showResultsNow(){ if(state.showResults) return; finish(); }
function goToQ(pos){ state.cur = pos; state.showResults = false; hintOn = false; saveState(); render(); }
function toggleJump(){ var p = document.getElementById('dot-panel'), b = document.getElementById('jump-btn'); var open = p.style.display !== 'flex'; p.style.display = open ? 'flex' : 'none'; b.innerHTML = open ? 'Hide&#9652;' : 'Jump&#9662;'; }
function updateNav(){
  var ao = activeOrder(), done = 0;
  ao.forEach(function(qi){ if(state.answers[qi]) done++; });
  document.getElementById('nav-count').textContent = '[' + done + '/' + ao.length + ']';
  document.getElementById('prog-fill').style.width = (ao.length ? 100 * done / ao.length : 0) + '%';
  document.getElementById('results-pill').style.display = (done === ao.length && !state.showResults) ? 'inline-block' : 'none';
  document.getElementById('dot-panel').innerHTML = ao.map(function(qi, p){ var a = state.answers[qi]; return '<button class="dot' + (a ? (a.ok ? ' ok' : ' bad') : '') + (p === state.cur && !state.showResults ? ' cur' : '') + '" onclick="goToQ(' + p + ')">' + origNum(qi) + '</button>'; }).join('');
}
function renderResults(){
  var ao = activeOrder(), c = 0;
  ao.forEach(function(qi){ if(isOk(qi)) c++; });
  document.getElementById('res-score').textContent = c + ' / ' + ao.length;
  var pz = ao.filter(function(qi){ return ITEMS[qi].type === 'puzzle'; }), pzOk = pz.filter(isOk).length;
  document.getElementById('res-detail').textContent = 'Puzzles solved: ' + pzOk + ' of ' + pz.length + '   \u00b7   Code questions right: ' + (c - pzOk) + ' of ' + (ao.length - pz.length);
  document.getElementById('res-list').innerHTML = ao.map(function(qi, p){ var it = ITEMS[qi], a = state.answers[qi]; return '<div class="res-row" onclick="goToQ(' + p + ')"><span>Q' + origNum(qi) + '. ' + (it.type === 'puzzle' ? '\ud83e\udd16 ' + it.title : 'Code question') + '</span><span>' + (a ? (a.ok ? '\u2705' : '\u274c') : '\u2014') + '</span></div>'; }).join('');
  var wrong = ao.filter(function(qi){ return !isOk(qi); }).length;
  document.getElementById('retry-btn').style.display = wrong ? 'block' : 'none';
}
function startRetry(){
  var wrongIdx = activeOrder().filter(function(qi){ return !isOk(qi); }); if(!wrongIdx.length) return;
  wrongIdx.forEach(function(qi){ delete state.answers[qi]; delete state.codes[qi]; delete state.runs[qi]; });
  activeSet = wrongIdx; localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state.cur = 0; state.showResults = false; state.reported = false; hintOn = false; saveState(); render(); window.scrollTo(0, 0);
}
function openFresh(){ document.getElementById('fresh-modal').style.display = 'flex'; }
function closeFresh(){ document.getElementById('fresh-modal').style.display = 'none'; }
function confirmFresh(){ closeFresh(); state = blankState(); activeSet = null; localStorage.removeItem(ACTIVE_KEY); saveState(); render(); window.scrollTo(0, 0); }
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function quizDateStr(){ return TODAY_STR; }
function itemQuestion(it){
  var idtag = '<span style="display:none">[coding:' + it.id + ']</span>';
  if(it.type === 'mc') return idtag + it.stem + (it.code ? '<pre>' + esc(it.code) + '</pre>' : '');
  return idtag + '<b>Robot puzzle: ' + it.title + '</b><br>' + it.goal + (it.max_lines ? ' (' + it.max_lines + ' lines or fewer)' : '') + '<br><pre>' + it.map.join('\n') + '</pre>';
}
function wrongDetail(qi, your){
  var it = ITEMS[qi];
  var correct = it.type === 'mc' ? (it.opts_code ? '<pre>' + esc(it.opts[it.ci]) + '</pre>' : it.opts[it.ci]) : '<pre>' + esc(it.solution) + '</pre>';
  return { question: wrongTxt(itemQuestion(it)), yourAnswer: wrongTxt(your), correctAnswer: wrongTxt(correct), explanation: wrongTxt(it.type === 'mc' ? it.exp : it.explain) };
}
function yourText(qi){
  var it = ITEMS[qi], a = state.answers[qi];
  if(!a) return '(not answered)';
  if(it.type === 'mc') return it.opts_code ? '<pre>' + esc(it.opts[a.pick]) + '</pre>' : it.opts[a.pick];
  return '<pre>' + esc(a.code || '') + '</pre>(showed the solution after ' + (state.runs[qi] || 0) + ' run' + ((state.runs[qi] || 0) === 1 ? '' : 's') + ')';
}
function reportResult(){
  try{
    var ao = activeOrder(), correct = 0, wrong = 0, skipped = 0, wp = [], wd = [], runs = [];
    ao.forEach(function(qi){
      var a = state.answers[qi];
      if(ITEMS[qi].type === 'puzzle') runs.push(origNum(qi) + ':' + (state.runs[qi] || 0) + (a && a.ok ? '' : 'x'));
      if(!a){ skipped++; return; }
      if(a.ok) correct++; else { wrong++; wp.push(origNum(qi)); wd.push(wrongDetail(qi, yourText(qi))); }
    });
    var total = ao.length;
    var payload = { child:'Grant', quizTitle:TITLE, quizKey:QUIZ_KEY, attemptNumber:getAttempts(), correct:correct, wrong:wrong, skipped:skipped, total:total,
      scorePercent: total > 0 ? Math.round(correct / total * 1000) / 10 : 0, wrongNumbers: wp.join(','), quizDate: quizDateStr(), puzzleRuns: runs.join(' ') };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){ payload.wrongAnswers = wd; localStorage.setItem(firstKey, '1'); }
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 (coding version) */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if((activeSet && activeSet.length) || localStorage.getItem(STORAGE_KEY + '_wrongsent')) return;
    var answered = 0, correct = 0, wd = [];
    order.forEach(function(qi){ var a = state.answers[qi]; if(!a){ wd.push(wrongDetail(qi, '(not answered)')); return; } answered++; if(a.ok) correct++; else wd.push(wrongDetail(qi, yourText(qi))); });
    if(answered === 0) return;
    var sig = answered + '/' + correct; if(sig === _lastProgressSig) return; _lastProgressSig = sig;
    var body = JSON.stringify({ type:'progress', child:'Grant', quizTitle:TITLE, quizKey:QUIZ_KEY, quizDate:quizDateStr(), answered:answered, total:order.length, correct:correct, wrongAnswers:wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000, headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);
['pick','prevQ','goNext','showResultsNow','goToQ','toggleJump','startRetry','openFresh','closeFresh','confirmFresh','runCode','replay','insertCode','toggleHint','resetCode','openGiveUp','closeGiveUp','confirmGiveUp'].forEach(function(n){ window[n] = eval(n); });
document.getElementById('instruction').textContent = INSTRUCTION;
loadState(); render();
</script>
