<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261116";
var RAW_QUESTIONS = [{"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The bridge opened in 1883.", "Workers dug the tower foundations inside chambers at the bottom of the river.", "Washington Roebling was the first person to ride across the finished bridge.", "John A. Roebling planned a bridge hung from steel wire cables."], "ci": 2, "exp": "The passage says &ldquo;<i>Emily</i> Roebling was the first person to ride across it,&rdquo; not Washington, who was too ill to visit the site. The other three statements match the passage: the steel wire cables, the chambers &ldquo;sunk to the river bottom,&rdquo; and the opening on May 24, 1883.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Brooklyn Bridge</strong><br>In the 1860s, the only way to travel between Manhattan and Brooklyn was by ferry, and in winter, ice on the East River could halt the boats for days. An engineer named John A. Roebling proposed a bridge hung from steel wire cables, a design that critics considered reckless for such a wide river.<br><br>In 1869, just as the project began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later. His son, Washington Roebling, took charge. Workers dug the foundations for the two towers inside giant wooden chambers sunk to the river bottom, where pumps forced in air to hold back the water. Many workers who climbed out too quickly suffered caisson disease, and Washington himself became so ill that he could no longer visit the site.<br><br>From his apartment window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied engineering so intensely that the crews began to treat her as the real chief. When the bridge opened on May 24, 1883, Emily Roebling was the first person to ride across it. A year later, a circus owner marched twenty-one elephants over the span to make it evident that the bridge was safe."}, {"stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> A ferry crushed John Roebling&rsquo;s foot.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> They suffered caisson disease.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> Workers climbed out of the underwater chambers too quickly.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> People could see that the bridge was safe.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Washington Roebling became too ill to visit the site.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> Washington Roebling took charge of building the bridge.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> A circus owner marched twenty-one elephants across the bridge.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> Emily Roebling carried instructions to the engineers.</td></tr></table>Which choice matches every cause with its correct effect?", "opts": ["1&ndash;C, 2&ndash;A, 3&ndash;D, 4&ndash;B", "1&ndash;A, 2&ndash;B, 3&ndash;C, 4&ndash;D", "1&ndash;D, 2&ndash;A, 3&ndash;C, 4&ndash;B", "1&ndash;C, 2&ndash;A, 3&ndash;B, 4&ndash;D"], "ci": 0, "exp": "Test each pair with &ldquo;Because ___, ___.&rdquo;<br><b>1&ndash;C:</b> Because the ferry crushed John&rsquo;s foot (and he died), his son &ldquo;took charge.&rdquo;<br><b>2&ndash;A:</b> Because workers &ldquo;climbed out too quickly,&rdquo; they &ldquo;suffered caisson disease.&rdquo;<br><b>3&ndash;D:</b> Because Washington &ldquo;could no longer visit the site,&rdquo; Emily &ldquo;carried his instructions to the engineers.&rdquo;<br><b>4&ndash;B:</b> The elephants were marched across &ldquo;to make it evident that the bridge was safe.&rdquo;<br><b>Watch out:</b> the choice that goes 1&ndash;A, 2&ndash;B, 3&ndash;C, 4&ndash;D just follows the order of the letters. The effects are mixed up on purpose, so read each one.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A", "passage": "<strong>The Brooklyn Bridge</strong><br>In the 1860s, the only way to travel between Manhattan and Brooklyn was by ferry, and in winter, ice on the East River could halt the boats for days. An engineer named John A. Roebling proposed a bridge hung from steel wire cables, a design that critics considered reckless for such a wide river.<br><br>In 1869, just as the project began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later. His son, Washington Roebling, took charge. Workers dug the foundations for the two towers inside giant wooden chambers sunk to the river bottom, where pumps forced in air to hold back the water. Many workers who climbed out too quickly suffered caisson disease, and Washington himself became so ill that he could no longer visit the site.<br><br>From his apartment window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied engineering so intensely that the crews began to treat her as the real chief. When the bridge opened on May 24, 1883, Emily Roebling was the first person to ride across it. A year later, a circus owner marched twenty-one elephants over the span to make it evident that the bridge was safe."}, {"stem": "<b>Part A</b><br>Why did Emily Roebling carry instructions to the engineers?", "opts": ["because her husband had died after an accident at the ferry dock", "because the city had hired her as the chief engineer", "because the workers refused to follow Washington&rsquo;s plans", "because her husband was too sick to visit the bridge site"], "ci": 3, "exp": "The second and third paragraphs connect the ideas: Washington &ldquo;became so ill that he could no longer visit the site,&rdquo; so he watched by telescope &ldquo;while his wife, Emily, carried his instructions to the engineers.&rdquo;<br><b>Why not the others:</b> the man who died after the ferry accident was John, Washington&rsquo;s father &mdash; not Emily&rsquo;s husband; the crews only <i>began to treat her</i> like the chief, the city did not hire her; nothing says the workers refused Washington&rsquo;s plans.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A", "passage": "<strong>The Brooklyn Bridge</strong><br>In the 1860s, the only way to travel between Manhattan and Brooklyn was by ferry, and in winter, ice on the East River could halt the boats for days. An engineer named John A. Roebling proposed a bridge hung from steel wire cables, a design that critics considered reckless for such a wide river.<br><br>In 1869, just as the project began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later. His son, Washington Roebling, took charge. Workers dug the foundations for the two towers inside giant wooden chambers sunk to the river bottom, where pumps forced in air to hold back the water. Many workers who climbed out too quickly suffered caisson disease, and Washington himself became so ill that he could no longer visit the site.<br><br>From his apartment window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied engineering so intensely that the crews began to treat her as the real chief. When the bridge opened on May 24, 1883, Emily Roebling was the first person to ride across it. A year later, a circus owner marched twenty-one elephants over the span to make it evident that the bridge was safe."}, {"stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did Emily Roebling carry instructions to the engineers?&rdquo;)?<br><br><b>A.</b> &ldquo;His son, Washington Roebling, took charge.&rdquo;<br><b>B.</b> &ldquo;Washington himself became so ill that he could no longer visit the site&rdquo;<br><b>C.</b> &ldquo;a ferry crushed Roebling&rsquo;s foot at the dock&rdquo;<br><b>D.</b> &ldquo;he watched through a telescope while his wife, Emily, carried his instructions to the engineers&rdquo;<br><b>E.</b> &ldquo;Emily Roebling was the first person to ride across it&rdquo;<br><b>F.</b> &ldquo;ice on the East River could halt the boats for days&rdquo;", "opts": ["C and D", "B and E", "B and D", "A and D"], "ci": 2, "exp": "<b>B</b> shows the cause (Washington was too ill to go to the bridge), and <b>D</b> shows the effect (Emily carried his instructions while he watched from home). Together they prove the Part A answer.<br><b>Why not the others:</b> <b>A</b> tells who took over the project, not why Emily helped; <b>C</b> is about John&rsquo;s accident; <b>E</b> is about the opening day; <b>F</b> explains why a bridge was needed.<br><b>Tip:</b> the two right pieces of evidence should work like a &ldquo;because&rdquo; sentence &mdash; one cause, one effect.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A", "passage": "<strong>The Brooklyn Bridge</strong><br>In the 1860s, the only way to travel between Manhattan and Brooklyn was by ferry, and in winter, ice on the East River could halt the boats for days. An engineer named John A. Roebling proposed a bridge hung from steel wire cables, a design that critics considered reckless for such a wide river.<br><br>In 1869, just as the project began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later. His son, Washington Roebling, took charge. Workers dug the foundations for the two towers inside giant wooden chambers sunk to the river bottom, where pumps forced in air to hold back the water. Many workers who climbed out too quickly suffered caisson disease, and Washington himself became so ill that he could no longer visit the site.<br><br>From his apartment window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied engineering so intensely that the crews began to treat her as the real chief. When the bridge opened on May 24, 1883, Emily Roebling was the first person to ride across it. A year later, a circus owner marched twenty-one elephants over the span to make it evident that the bridge was safe."}, {"stem": "According to the passage, what causes a growing crystal to stretch into slender needles?", "opts": ["forming around a speck of pollen instead of dust", "falling through air that is about 23&deg;F", "tumbling through air that is about 5&deg;F", "falling through air that is very dry"], "ci": 1, "exp": "The passage says, &ldquo;around 23&deg;F, the crystal stretches into slender needles.&rdquo; The temperature is the cause, and the needle shape is the effect.<br><b>Why not the others:</b> dry air &ldquo;yields simpler shapes,&rdquo; not needles; dust or pollen is only where the flake starts; 5&deg;F makes feathery arms.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "passage": "<strong>How a Snowflake Takes Shape</strong><br>Every snowflake begins high in a cloud with a speck of dust or pollen. When the air is far below freezing, water vapor clings to the speck and freezes directly into ice, skipping the liquid stage entirely. This tiny crystal is always six-sided, because water molecules lock together in a hexagonal pattern when they freeze.<br><br>As the crystal tumbles through the cloud, more vapor freezes onto its edges, and its shape depends on the conditions it meets. Near 28&deg;F, thin flat plates form; around 23&deg;F, the crystal stretches into slender needles; and near 5&deg;F, it sprouts the feathery arms that most people picture. Moist air produces more elaborate branches, while dry air yields simpler shapes. Because no two crystals follow exactly the same path through a cloud, no two grow in exactly the same way.<br><br>In 1885, a Vermont farmer named Wilson Bentley attached a camera to a microscope and became the first person to photograph a single snowflake. Over the next forty-six years, he captured more than five thousand of them, and his patient work helped scientists understand why each one is unique."}, {"stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Water molecules lock together in a hexagonal pattern.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> It grows more elaborate branches.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> The air around a growing crystal is about 5&deg;F.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> Every snowflake crystal has six sides.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> A crystal grows in very moist air.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> No two snowflakes grow in exactly the same way.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> No two crystals take the same path through a cloud.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> The crystal sprouts feathery arms.</td></tr></table>Which choice matches every cause with its correct effect?", "opts": ["1&ndash;A, 2&ndash;B, 3&ndash;C, 4&ndash;D", "1&ndash;C, 2&ndash;D, 3&ndash;A, 4&ndash;B", "1&ndash;B, 2&ndash;A, 3&ndash;D, 4&ndash;C", "1&ndash;B, 2&ndash;D, 3&ndash;A, 4&ndash;C"], "ci": 3, "exp": "Use &ldquo;Because ___, ___.&rdquo;<br><b>1&ndash;B:</b> The crystal &ldquo;is always six-sided, <i>because</i> water molecules lock together in a hexagonal pattern.&rdquo;<br><b>2&ndash;D:</b> &ldquo;Near 5&deg;F, it sprouts the feathery arms.&rdquo;<br><b>3&ndash;A:</b> &ldquo;Moist air produces more elaborate branches.&rdquo;<br><b>4&ndash;C:</b> &ldquo;<i>Because</i> no two crystals follow exactly the same path &hellip; no two grow in exactly the same way.&rdquo;<br><b>Watch out:</b> 2 and 3 are easy to swap &mdash; temperature decides the <i>kind</i> of shape (arms), while moisture decides how <i>fancy</i> the branches get.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A", "passage": "<strong>How a Snowflake Takes Shape</strong><br>Every snowflake begins high in a cloud with a speck of dust or pollen. When the air is far below freezing, water vapor clings to the speck and freezes directly into ice, skipping the liquid stage entirely. This tiny crystal is always six-sided, because water molecules lock together in a hexagonal pattern when they freeze.<br><br>As the crystal tumbles through the cloud, more vapor freezes onto its edges, and its shape depends on the conditions it meets. Near 28&deg;F, thin flat plates form; around 23&deg;F, the crystal stretches into slender needles; and near 5&deg;F, it sprouts the feathery arms that most people picture. Moist air produces more elaborate branches, while dry air yields simpler shapes. Because no two crystals follow exactly the same path through a cloud, no two grow in exactly the same way.<br><br>In 1885, a Vermont farmer named Wilson Bentley attached a camera to a microscope and became the first person to photograph a single snowflake. Over the next forty-six years, he captured more than five thousand of them, and his patient work helped scientists understand why each one is unique."}, {"stem": "Read this sentence from the passage: &ldquo;Moist air produces more <b>elaborate</b> branches, while dry air yields simpler shapes.&rdquo; What does <b>elaborate</b> mean in this sentence?", "opts": ["wet and heavy", "detailed and complicated", "short and thick", "plain and even"], "ci": 1, "exp": "The word <i>while</i> sets up a contrast: moist air makes <i>elaborate</i> branches, but dry air makes <i>simpler</i> shapes. So <i>elaborate</i> means the opposite of simple &mdash; detailed and complicated. &ldquo;Wet and heavy&rdquo; is a trap because the sentence mentions moist air, but the word describes the branches, not the air.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>How a Snowflake Takes Shape</strong><br>Every snowflake begins high in a cloud with a speck of dust or pollen. When the air is far below freezing, water vapor clings to the speck and freezes directly into ice, skipping the liquid stage entirely. This tiny crystal is always six-sided, because water molecules lock together in a hexagonal pattern when they freeze.<br><br>As the crystal tumbles through the cloud, more vapor freezes onto its edges, and its shape depends on the conditions it meets. Near 28&deg;F, thin flat plates form; around 23&deg;F, the crystal stretches into slender needles; and near 5&deg;F, it sprouts the feathery arms that most people picture. Moist air produces more elaborate branches, while dry air yields simpler shapes. Because no two crystals follow exactly the same path through a cloud, no two grow in exactly the same way.<br><br>In 1885, a Vermont farmer named Wilson Bentley attached a camera to a microscope and became the first person to photograph a single snowflake. Over the next forty-six years, he captured more than five thousand of them, and his patient work helped e,&rdquo; he said. &ldquo;Same position next Saturday.&rdquo;"}, {"stem": "What can the reader infer about how Jamal feels at halftime?", "opts": ["He is angry at Tom&aacute;s for getting hurt.", "He is confident that the Hawks will win.", "He is relieved that he will not have to play again.", "He is discouraged and embarrassed by the goals he let in."], "ci": 3, "exp": "The clues are that two shots got past him and &ldquo;Jamal stared at the ground while the others gulped water.&rdquo; Staring at the ground after a bad half shows he feels let down and embarrassed.<br><b>Why not the others:</b> nothing shows anger at Tom&aacute;s; he still has the second half to play; the Hawks are losing, so confidence does not fit.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Between the Posts</strong><br>Jamal had never played goalie, but when Coach Ruiz announced that Tom&aacute;s had sprained his wrist, every head on the bench turned toward him. &ldquo;You&rsquo;re the tallest,&rdquo; his teammates insisted. Jamal tugged on the oversized gloves, which smelled like old rubber and grass.<br><br>The first shot whistled past his ear before he even moved. The second skipped between his legs. By halftime, the Hawks trailed 2&ndash;0, and Jamal stared at the ground while the others gulped water.<br><br>His older sister, Keisha, leaned over the fence. &ldquo;You keep watching the ball,&rdquo; she said. &ldquo;Watch the kicker&rsquo;s hips instead. Wherever the hips point, the ball goes.&rdquo;<br>&ldquo;That&rsquo;s it? Hips?&rdquo;<br>&ldquo;Trust me. I played goalie for four years.&rdquo;<br><br>In the second half, a forward from the other team charged down the field. Jamal ignored the spinning ball and studied the boy&rsquo;s hips, which swung toward the left corner. He dove left, and the ball slammed into his chest. Two more shots came, and he stopped both. Afterward, Coach Ruiz tossed him the gloves. &ldquo;Keep these,&rdquo; he said. &ldquo;Same position next Saturday.&rdquo;"}, {"stem": "<b>Part A</b><br>Why did Ida start to tell Papa that they could skip the ride?", "opts": ["because the wheel was too crowded with sixty riders in each car", "because she knew the tickets cost a large part of what Papa earned in a day", "because she wanted to see the electric lights instead", "because she was afraid of riding so high above the ground"], "ci": 1, "exp": "Right before Ida speaks, Papa counts out &ldquo;fifty cents each,&rdquo; and &ldquo;Ida knew that was half a day&rsquo;s pay for him.&rdquo; She did not want Papa to spend so much of his money.<br><b>Why not the others:</b> she presses her forehead to the glass happily, so she is not afraid; the passage tells how many riders a car <i>could</i> hold, not that it was too crowded; the lights are described, but they are not her reason.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A", "passage": "<strong>The Wheel in the Sky</strong><br>On a June morning in 1893, eleven-year-old Ida Novak clutched her father&rsquo;s hand as they entered the World&rsquo;s Columbian Exposition in Chicago. Papa had saved his wages from the rail yard for months so that the family could see the fair. Everywhere Ida looked, white buildings gleamed beside lagoons, and at night thousands of electric bulbs made the grounds glow brighter than any street she had ever walked.<br><br>But it was the giant wheel that made her stop. George Ferris had designed it to rival the Eiffel Tower, which had amazed visitors in Paris four years earlier. It rose 264 feet, and each of its thirty-six cars could hold sixty riders.<br><br>&ldquo;Fifty cents each,&rdquo; Papa said, counting coins slowly. Ida knew that was half a day&rsquo;s pay for him. She started to say they could skip it, but Papa pressed the coins into the ticket seller&rsquo;s palm.<br><br>As the wheel lifted them above the fairgrounds, Ida pressed her forehead to the glass. Lake Michigan stretched to the horizon, and the city looked like a toy village. She glanced at Papa, who was smiling at her instead of at the view, and she understood that the ride was his gift."}, {"stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did Ida start to tell Papa that they could skip the ride?&rdquo;)?<br><br><b>A.</b> &ldquo;Papa had saved his wages from the rail yard for months&rdquo;<br><b>B.</b> &ldquo;&lsquo;Fifty cents each,&rsquo; Papa said, counting coins slowly.&rdquo;<br><b>C.</b> &ldquo;Ida knew that was half a day&rsquo;s pay for him.&rdquo;<br><b>D.</b> &ldquo;It rose 264 feet&rdquo;<br><b>E.</b> &ldquo;white buildings gleamed beside lagoons&rdquo;<br><b>F.</b> &ldquo;Lake Michigan stretched to the horizon&rdquo;", "opts": ["C and D", "B and F", "B and C", "A and E"], "ci": 2, "exp": "<b>B</b> gives the price, and <b>C</b> shows what that price meant to Ida: half of Papa&rsquo;s pay for a day. Together they explain why she wanted to skip the ride.<br><b>Why not the others:</b> <b>A</b> is about saving for the whole fair trip; <b>D</b> is the wheel&rsquo;s height; <b>E</b> and <b>F</b> describe what Ida saw. They are true, but they do not prove the Part A answer.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A", "passage": "<strong>The Wheel in the Sky</strong><br>On a June morning in 1893, eleven-year-old Ida Novak clutched her father&rsquo;s hand as they entered the World&rsquo;s Columbian Exposition in Chicago. Papa had saved his wages from the rail yard for months so that the family could see the fair. Everywhere Ida looked, white buildings gleamed beside lagoons, and at night thousands of electric bulbs made the grounds glow brighter than any street she had ever walked.<br><br>But it was the giant wheel that made her stop. George Ferris had designed it to rival the Eiffel Tower, which had amazed visitors in Paris four years earlier. It rose 264 feet, and each of its thirty-six cars could hold sixty riders.<br><br>&ldquo;Fifty cents each,&rdquo; Papa said, counting coins slowly. Ida knew that was half a day&rsquo;s pay for him. She started to say they could skip it, but Papa pressed the coins into the ticket seller&rsquo;s palm.<br><br>As the wheel lifted them above the fairgrounds, Ida pressed her forehead to the glass. Lake Michigan stretched to the horizon, and the city looked like a toy village. She glanced at Papa, who was smiling at her instead of at the view, and she understood that the ride was his gift."}, {"stem": "According to the passage, how tall was the giant wheel?", "opts": ["264 feet", "164 feet", "1,000 feet", "36 feet"], "ci": 0, "exp": "The second paragraph says, &ldquo;It rose 264 feet.&rdquo; The number 36 is how many cars it had, and the passage never gives the Eiffel Tower&rsquo;s height.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Wheel in the Sky</strong><br>On a June morning in 1893, eleven-year-old Ida Novak clutched her father&rsquo;s hand as they entered the World&rsquo;s Columbian Exposition in Chicago. Papa had saved his wages from the rail yard for months so that the family could see the fair. Everywhere Ida looked, white buildings gleamed beside lagoons, and at night thousands of electric bulbs made the grounds glow brighter than any street she had ever walked.<br><br>But it was the giant wheel that made her stop. George Ferris had designed it to rival the Eiffel Tower, which had amazed visitors in Paris four years earlier. It rose 264 feet, and each of its thirty-six cars could hold sixty riders.<br><br>&ldquo;Fifty cents each,&rdquo; Papa said, counting coins slowly. Ida knew that was half a day&rsquo;s pay for him. She started to say they could skip it, but Papa pressed the coins into the ticket seller&rsquo;s palm.<br><br>As the wheel lifted them above the fairgrounds, Ida pressed her forehead to the glass. Lake Michigan stretched to the horizon, and the city looked like a toy village. She glanced at Papa, who was smiling at her instead of at the view, and she understood that the ride was his gift."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Electric bulbs lit up the fairgrounds at night.", "George Ferris designed the wheel to rival the Eiffel Tower.", "Papa worked at a rail yard.", "Each car on the wheel could hold thirty-six riders."], "ci": 3, "exp": "The passage says the wheel had &ldquo;thirty-six cars&rdquo; and each car &ldquo;could hold sixty riders.&rdquo; The false statement mixes up those two numbers. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Wheel in the Sky</strong><br>On a June morning in 1893, eleven-year-old Ida Novak clutched her father&rsquo;s hand as they entered the World&rsquo;s Columbian Exposition in Chicago. Papa had saved his wages from the rail yard for months so that the family could see the fair. Everywhere Ida looked, white buildings gleamed beside lagoons, and at night thousands of electric bulbs made the grounds glow brighter than any street she had ever walked.<br><br>But it was the giant wheel that made her stop. George Ferris had designed it to rival the Eiffel Tower, which had amazed visitors in Paris four years earlier. It rose 264 feet, and each of its thirty-six cars could hold sixty riders.<br><br>&ldquo;Fifty cents each,&rdquo; Papa said, counting coins slowly. Ida knew that was half a day&rsquo;s pay for him. She started to say they could skip it, but Papa pressed the coins into the ticket seller&rsquo;s palm.<br><br>As the wheel lifted them above the fairgrounds, Ida pressed her forehead to the glass. Lake Michigan stretched to the horizon, and the city looked like a toy village. She glanced at Papa, who was smiling at her instead of at the view, and she understood that the ride was his gift."}, {"stem": "Read this sentence from Passage B: &ldquo;Caleb&rsquo;s job is to check the screen and <b>report</b> any cow that seems sick.&rdquo; What does <b>report</b> mean in this sentence?", "opts": ["to arrive somewhere at a set time", "a paper that gives facts about a topic", "to tell someone about something", "a loud bang, like the sound of a firework"], "ci": 2, "exp": "<i>Report</i> has several meanings. Here it is an action Caleb does with a sick cow: he tells the adults about it. A school <i>report</i> is a paper, to <i>report</i> to the office means to show up, and a <i>report</i> can be a loud bang &mdash; but only &ldquo;tell someone about something&rdquo; fits a sick cow.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>Winter Mornings on the Farm</strong><br><strong>Passage A</strong><br>In the winter of 1958, ten-year-old June Larsen woke at five o&rsquo;clock every morning on her family&rsquo;s Iowa farm. Before breakfast, she pulled on two pairs of wool socks and trudged to the barn with a lantern. The water in the cows&rsquo; trough often froze overnight, so June had to break the ice with a hammer before the animals could drink. Her fingers stung in the bitter cold, but she never complained, because her father could not finish the milking alone. By the time the school bus rumbled down the gravel road, June had already worked for two hours.<br><br><strong>Passage B</strong><br>Today, eleven-year-old Caleb Ortiz helps on his family&rsquo;s dairy farm in Wisconsin, but his mornings look very different. A heated trough keeps the cows&rsquo; water from freezing, even when the temperature drops below zero. Robotic milking machines let each cow walk in to be milked whenever she is ready, and a computer records how much milk she gives. Caleb&rsquo;s job is to check the screen and report any cow that seems sick. &ldquo;The robots do the heavy work,&rdquo; he says, &ldquo;but someone still has to notice when something is wrong.&rdquo;"}, {"stem": "According to Passage B, why doesn&rsquo;t Caleb have to break ice in the cows&rsquo; water?", "opts": ["Caleb&rsquo;s farm is in a warmer state than Iowa.", "The cows stay inside a warm barn all winter.", "A heated trough keeps the water from freezing.", "The robotic milking machines also give the cows water."], "ci": 2, "exp": "Passage B says, &ldquo;A heated trough keeps the cows&rsquo; water from freezing, even when the temperature drops below zero.&rdquo; The robots do the milking, not the watering; the passage never mentions a warm barn; and &ldquo;below zero&rdquo; shows Wisconsin is not warm.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "passage": "<strong>Winter Mornings on the Farm</strong><br><strong>Passage A</strong><br>In the winter of 1958, ten-year-old June Larsen woke at five o&rsquo;clock every morning on her family&rsquo;s Iowa farm. Before breakfast, she pulled on two pairs of wool socks and trudged to the barn with a lantern. The water in the cows&rsquo; trough often froze overnight, so June had to break the ice with a hammer before the animals could drink. Her fingers stung in the bitter cold, but she never complained, because her father could not finish the milking alone. By the time the school bus rumbled down the gravel road, June had already worked for two hours.<br><br><strong>Passage B</strong><br>Today, eleven-year-old Caleb Ortiz helps on his family&rsquo;s dairy farm in Wisconsin, but his mornings look very different. A heated trough keeps the cows&rsquo; water from freezing, even when the temperature drops below zero. Robotic milking machines let each cow walk in to be milked whenever she is ready, and a computer records how much milk she gives. Caleb&rsquo;s job is to check the screen and report any cow that seems sick. &ldquo;The robots do the heavy work,&rdquo; he says, &ldquo;but someone still has to notice when something is wrong.&rdquo;"}, {"stem": "Based on what Caleb says at the end of Passage B, what can the reader infer?", "opts": ["Caleb wishes he could milk the cows by hand like June.", "Even with machines, careful attention from a person is still important on the farm.", "Caleb thinks robots will soon replace every farmer.", "Caleb does more heavy work each morning than June did."], "ci": 1, "exp": "Caleb says the robots &ldquo;do the heavy work,&rdquo; but &ldquo;someone still has to notice when something is wrong.&rdquo; He means people are still needed to pay attention.<br><b>Why not the others:</b> he says someone is still needed, so not every farmer is replaced; the robots do the heavy work, so he does <i>less</i> than June; he never mentions wanting to milk by hand.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Winter Mornings on the Farm</strong><br><strong>Passage A</strong><br>In the winter of 1958, ten-year-old June Larsen woke at five o&rsquo;clock every morning on her family&rsquo;s Iowa farm. Before breakfast, she pulled on two pairs of wool socks and trudged to the barn with a lantern. The water in the cows&rsquo; trough often froze overnight, so June had to break the ice with a hammer before the animals could drink. Her fingers stung in the bitter cold, but she never complained, because her father could not finish the milking alone. By the time the school bus rumbled down the gravel road, June had already worked for two hours.<br><br><strong>Passage B</strong><br>Today, eleven-year-old Caleb Ortiz helps on his family&rsquo;s dairy farm in Wisconsin, but his mornings look very different. A heated trough keeps the cows&rsquo; water from freezing, even when the temperature drops below zero. Robotic milking machines let each cow walk in to be milked whenever she is ready, and a computer records how much milk she gives. Caleb&rsquo;s job is to check the screen and report any cow that seems sick. &ldquo;The robots do the heavy work,&rdquo; he says, &ldquo;but someone still has to notice when something is wrong.&rdquo;"}, {"stem": "In Passage A, why did June have to break the ice with a hammer?", "opts": ["because the water pipes in the barn had burst", "because her lantern did not give off enough heat", "because her father wanted the cows to drink from the creek", "because the water in the trough froze during the night"], "ci": 3, "exp": "Passage A says, &ldquo;The water in the cows&rsquo; trough often froze overnight, <i>so</i> June had to break the ice with a hammer.&rdquo; The word <i>so</i> signals the effect. Pipes, a creek, and the lantern&rsquo;s heat are never given as reasons.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "passage": "<strong>Winter Mornings on the Farm</strong><br><strong>Passage A</strong><br>In the winter of 1958, ten-year-old June Larsen woke at five o&rsquo;clock every morning on her family&rsquo;s Iowa farm. Before breakfast, she pulled on two pairs of wool socks and trudged to the barn with a lantern. The water in the cows&rsquo; trough often froze overnight, so June had to break the ice with a hammer before the animals could drink. Her fingers stung in the bitter cold, but she never complained, because her father could not finish the milking alone. By the time the school bus rumbled down the gravel road, June had already worked for two hours.<br><br><strong>Passage B</strong><br>Today, eleven-year-old Caleb Ortiz helps on his family&rsquo;s dairy farm in Wisconsin, but his mornings look very different. A heated trough keeps the cows&rsquo; water from freezing, even when the temperature drops below zero. Robotic milking machines let each cow walk in to be milked whenever she is ready, and a computer records how much milk she gives. Caleb&rsquo;s job is to check the screen and report any cow that seems sick. &ldquo;The robots do the heavy work,&rdquo; he says, &ldquo;but someone still has to notice when something is wrong.&rdquo;"}];

var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
