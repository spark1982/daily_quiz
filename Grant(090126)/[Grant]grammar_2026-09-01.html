<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_48_20260901_v1";var ATT_KEY = "quiz_grantgrammar_48_att_20260901_v1";var RAW_QUESTIONS = [{"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The chef <b>cooked</b> the meal.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The meal ______ by the chef.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was cooked", "were cooked", "was cooking", "was cook"], "ci": 0, "exp": "The new subject \"the meal\" is singular and the action is in the past, so use was + the past participle \"cooked\": was cooked.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>eat</b>?", "opts": ["ate", "eated", "eaten", "aten"], "ci": 0, "exp": "The past tense of <b>eat</b> is <b>ate</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "He is <u>move</u> the furniture around.", "opts": ["moving", "moveing", "movving", "moved"], "ci": 0, "exp": "move → moving (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">Daniel won the contest, and he also won the grand prize.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Not only Daniel has won the contest, but he has also won the grand prize.", "Not only has Daniel won the contest, but also he has won the grand prize.", "Not only has Daniel won the contest, but also has he won the grand prize.", "Not only won Daniel the contest, but also won he the grand prize."], "ci": 2, "exp": "\"Not only...but also\" triggers inversion in both clauses. First clause: \"Not only + has + Daniel + won...\". Second clause: \"but also + has + he + won...\". Both require subject-auxiliary inversion. The correct form is: Not only has Daniel won the contest, but also has he won the grand prize.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "We _____ not heard from him since he left for college.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. \"Since\" connects a past starting point to the present.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "I _____ lost my keys. Has anyone seen them?", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. The keys are still lost now — the past action has a present result.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "Hurry up, or the train <span style=\"text-decoration:underline;\">______</span> the station by the time we park the car.", "opts": ["had left", "has left", "will have left", "leaves"], "ci": 2, "exp": "\"will have left\" is future perfect — the train will be gone before we finish parking.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["five difficult Mexican recipes", "Mexican five difficult recipes", "difficult five Mexican recipes", "five Mexican difficult recipes"], "ci": 0, "exp": "Correct order: number (five) → opinion (difficult) → origin (Mexican) → noun\n✔ five difficult Mexican recipes", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>buy</b> &rsaquo; Past: <b>bought</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["buyed", "buy", "buying", "bought"], "ci": 3, "exp": "'buy' is an irregular verb. Its past participle is 'bought'. Past perfect: had bought.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["The number of students are increasing every semester.", "A number of students are waiting outside the gymnasium.", "Every one of the girls have finished the assignment.", "A number of parents was upset about the new schedule."], "ci": 1, "exp": "\"A number of\" is plural, so \"are waiting\" is correct. \"The number\" is singular — use \"is increasing.\" \"Every one\" is singular — use \"has finished.\" \"A number of parents\" is plural — use \"were.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["She is <b>walking</b> her dog around the block.", "They stayed fit by <b>walking</b> every day.", "They were <b>walking</b> home when it began to snow.", "He will be <b>walking</b> to school tomorrow."], "ci": 1, "exp": "In \"They stayed fit by walking every day,\" \"walking\" is the object of the preposition \"by\" - a noun role - which makes it a gerund. In the other three sentences, \"walking\" follows \"is / were / will be\" and is part of the progressive verb tense, describing an action in progress.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "She saw <u>stars</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Stars\" receives the action of \"saw.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>Scientists <b>study</b> the data.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The data ______ by scientists.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["is studied", "are studied", "is studying", "is study"], "ci": 0, "exp": "The new subject \"the data\" is treated as singular and the action is in the present, so use is + the past participle \"studied\": is studied.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["Neither the principal nor the teachers was informed about the change.", "Neither he nor his brothers plays video games on school nights.", "Neither the teachers nor the principal was at the meeting.", "Neither the boys nor the girl are ready for the presentation."], "ci": 2, "exp": "With neither...nor, the verb agrees with the subject closer to the verb. In 'Neither the teachers nor the principal was,' \"principal\" is the closer subject and it is singular, so \"was\" is correct. In 'Neither the principal nor the teachers was,' \"teachers\" is the closer subject and it is plural — use \"were.\" In 'Neither he nor his brothers plays,' \"brothers\" is closer and plural — use \"play.\" In 'Neither the boys nor the girl are,' \"girl\" is closer and singular — use \"is.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["The frog is <b>jumping</b> across the pond.", "The kids were <b>jumping</b> on the trampoline.", "She will be <b>jumping</b> in the long jump event.", "Her favorite playground activity is <b>jumping</b> rope."], "ci": 3, "exp": "In \"Her favorite playground activity is jumping rope,\" \"jumping\" renames the subject \"activity\" after the linking verb \"is\" - a subject complement - which makes it a gerund. In the other three sentences, \"jumping\" follows \"is / were / will be\" and is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "He runs to school every day.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["He", "school", "runs", "day"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "He ________ his bike when he was ten.", "opts": ["broke", "has broken"], "ci": 0, "exp": "When he was ten is a specific finished time, so use simple past: broke.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Dad cooked us dinner.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["us", "dinner"], "ci": 0, "exp": "\"Us\" is the indirect object (who received it). \"Dinner\" is the direct object (what was cooked).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "We made <u>cake</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Cake\" receives the action of \"made.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>take</b> &rsaquo; Past: <b>took</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["taked", "took", "taking", "taken"], "ci": 3, "exp": "'take' is an irregular verb. Its past participle is 'taken'. Past perfect: had taken.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "She <u>finish</u> her work early.", "opts": ["finishes", "finishs", "finishies", "finisheds"], "ci": 0, "exp": "finish → finishes (ends in -sh, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["My favorite subjects are math, science and english.", "My favorite subjects are Math, Science, and English.", "My favorite subjects are math, science, and English.", "My favorite subjects are Math, science, and English."], "ci": 2, "exp": "General school subjects like math and science are common nouns and are not capitalized. However, \"English\" is always capitalized because it is derived from a proper noun (England). A serial comma is needed before \"and.\"", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "hot<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["hotter / hottest", "hoter / hotest", "more hot / most hot", "hott / hottest"], "ci": 0, "exp": "hot → hotter / hottest (short vowel + single consonant: double the -t)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The ice is <b>melting</b> in the sun.", "The <b>melting</b> ice dripped onto the counter.", "The snow was <b>melting</b> quickly.", "<b>Melting</b> chocolate requires low heat."], "ci": 1, "exp": "In \"The melting ice dripped onto the counter,\" \"melting\" comes directly before the noun \"ice\" and describes what the ice is doing - this adjective use of an -ing word is a present participle. In \"The ice is melting in the sun\" and \"The snow was melting quickly,\" \"melting\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Melting chocolate requires low heat,\" \"melting\" (with \"chocolate\") is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Oh no, the train <span style=\"text-decoration:underline;\">______</span> recently, so the platform is completely empty.", "opts": ["had left", "has left", "will have left", "was leaving"], "ci": 1, "exp": "\"has left\" is present perfect — the train just departed and the platform is empty now.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Across the busy street and through the park.", "The baby smiled at her mother.", "Crying softly in the corner of the room.", "Unless you study hard for the exam."], "ci": 1, "exp": "\"The baby smiled at her mother.\" is a complete sentence — subject: 'The baby', predicate: 'smiled'. The others are fragments: a prepositional phrase, an -ing phrase, and an 'Unless' clause.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "I consider him honest.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["honest", "him"], "ci": 0, "exp": "\"Honest\" is the objective complement — it describes \"him.\" \"Him\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The peoples' voices were heard at the rally.", "That red bike is mine's, not yours.", "I can't find Sarahs glasses anywhere.", "The people's choice award was announced."], "ci": 3, "exp": "<strong>\"people's\"</strong> is correct — <em>people</em> is already an irregular plural; the possessive is <em>people's</em>.<br>• <em>peoples'</em> double-marks the plural — wrong.<br>• <em>mine's</em> does not exist; the correct form is <em>mine</em>.<br>• <em>Sarahs</em> is missing the apostrophe — should be <em>Sarah's</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">I seldom go to the cinema these days.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Seldom I go to the cinema these days.", "Seldom do I go to the cinema these days.", "Seldom did I go to the cinema these days.", "Seldom have I gone to the cinema these days."], "ci": 1, "exp": "\"Seldom\" is a negative frequency adverb. With a simple present verb, inversion uses do-auxiliary: \"Seldom + do + I + go...\". The base form \"go\" follows \"do\". The correct form is: Seldom do I go to the cinema these days.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "The tall teacher speaks softly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADJECTIVES in this sentence, and only the adjectives?</span>", "opts": ["tall", "(none of these)", "tall, speaks", "tall, teacher"], "ci": 0, "exp": "'Tall' is an adjective - it describes the teacher.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "big<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["bigger / biggest", "biger / bigest", "more big / most big", "bigg / biggest"], "ci": 0, "exp": "big → bigger / biggest (short vowel + single consonant: double the -g)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "The little boy hid _____ the bed when he heard the thunder rumbling outside his window.", "opts": ["under", "past", "over", "along"], "ci": 0, "exp": "\"Under\" means below or beneath something. The boy hid in the space below the bed. \"Over\" means above, which is the opposite direction.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Although the sun was shining brightly.", "Before the train arrived at the station.", "The chef prepared a delicious meal.", "Swimming laps in the community pool."], "ci": 2, "exp": "\"The chef prepared a delicious meal.\" is a complete sentence — subject: 'The chef', predicate: 'prepared'. The others are fragments: an 'Although' clause, a 'Before' clause, and an -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "I consider him honest.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["him", "honest"], "ci": 0, "exp": "\"Him\" is the object (who is being considered). \"Honest\" is the objective complement (the quality assigned).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>sheep</b>?", "opts": ["sheeps", "sheepies", "sheepes", "sheep"], "ci": 3, "exp": "sheep → sheep (no change — same in singular and plural)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "I ________ such delicious food.", "opts": ["never ate", "have never eaten"], "ci": 1, "exp": "Never with no specific time = experience up to now, so use present perfect: have never eaten.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>run</b>?", "opts": ["ran", "runned", "ranned", "runed"], "ci": 0, "exp": "The past tense of <b>run</b> is <b>ran</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "She is <u>save</u> money for a new phone.", "opts": ["saving", "saveing", "savving", "saved"], "ci": 0, "exp": "save → saving (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "He <u>fix</u> broken bikes on weekends.", "opts": ["fixes", "fixs", "fixies", "fixeds"], "ci": 0, "exp": "fix → fixes (ends in -x, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "The tall teacher speaks softly.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADVERBS in this sentence, and only the adverbs?</span>", "opts": ["softly", "(none of these)", "tall, softly", "speaks, softly"], "ci": 0, "exp": "'Softly' is an adverb - it tells how the teacher speaks.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "The teacher walked _____ the rows of desks to hand back the graded tests to each student.", "opts": ["between", "among", "along", "through"], "ci": 2, "exp": "\"Along\" means moving forward following a path or line. Walking along rows means moving beside them in a line. \"Through\" would suggest passing within or inside the rows.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Dad cooked us dinner.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["dinner", "us"], "ci": 0, "exp": "\"Dinner\" is the direct object (what was cooked). \"Us\" is the indirect object (who received it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>die</b> (the cube used in games)?", "opts": ["dies", "dices", "dice", "diece"], "ci": 2, "exp": "die → dice (completely different form)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "He runs to school every day.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["runs", "He", "school", "every"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The wind is <b>blowing</b> hard today.", "The wind was <b>blowing</b> all night.", "<b>Blowing</b> bubbles is fun for kids.", "The <b>blowing</b> wind knocked over the trash cans."], "ci": 3, "exp": "In \"The blowing wind knocked over the trash cans,\" \"blowing\" comes directly before the noun \"wind\" and describes what the wind is doing - this adjective use of an -ing word is a present participle. In \"The wind is blowing hard today\" and \"The wind was blowing all night,\" \"blowing\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Blowing bubbles is fun for kids,\" \"blowing\" (with \"bubbles\") is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The apple's in the basket are fresh.", "My boss's office is on the third floor.", "The student forgot there pencil.", "She is going to there house after school."], "ci": 1, "exp": "<strong>\"boss's\"</strong> correctly forms the possessive of a noun ending in <em>s</em>.<br>• <em>apple's</em> incorrectly adds an apostrophe to a simple plural noun.<br>• Both uses of <em>there</em> are wrong — the possessive adjective is <em>their</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["The senator said \"I will fight for lower taxes\" at the rally.", "The senator said, \"I will fight for lower taxes,\" at the rally.", "The senator said, \"I will fight for lower taxes\", at the rally.", "The senator said, \"i will fight for lower taxes,\" at the rally."], "ci": 1, "exp": "A comma introduces a direct quote after a dialogue verb. The first word of a direct quote is capitalized. The comma at the end of the quote goes inside the closing quotation mark, not outside.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["gorgeous pink silk dress", "pink gorgeous silk dress", "silk gorgeous pink dress", "gorgeous silk pink dress"], "ci": 0, "exp": "Correct order: opinion (gorgeous) → color (pink) → material (silk) → noun\n✔ gorgeous pink silk dress", "tag": "Adjective Order", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;



  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
