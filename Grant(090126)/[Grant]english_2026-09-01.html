ty flavor and ice on a hot day.<br><br>Encouraged by the strong response, Frank applied for a patent the following year. By then, his own children had started calling the treats \"Pop's Sicles,\" after their father, and the playful name eventually shortened to \"Popsicle.\" The company that later produced them expanded the frozen treat into dozens of flavors and shapes, sold across the entire country.<br><br>What began as a forgotten cup on a cold porch turned into one of the most popular frozen snacks in American history. Today, people enjoy Popsicles every summer, rarely realizing that the treat traces back to a curious boy, a wooden stick, and an unusually cold night nearly a century ago.", "opts": ["The mixture froze solid around the wooden stirring stick.", "The mixture evaporated completely by morning.", "The mixture turned into a fizzy foam overnight.", "The mixture spilled out of the cup and onto the porch."], "ci": 0, "exp": "The passage states that by morning \"the soda mixture had frozen solid around the stick,\" directly describing the effect of the cold. Evaporating, turning to foam, and spilling are never mentioned as happening to the mixture."}, {"stem": "Which sequence correctly reflects the order of events described in the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1905, an eleven-year-old boy named Frank Epperson lived in San Francisco, California. One chilly evening, he mixed a powdered soda flavoring with water on his back porch, creating a sweet, fizzy drink. Before he could finish it, something distracted him, and he left the cup outside overnight, forgetting that a wooden stirring stick was still standing inside it.<br><br>Temperatures that night dropped far below what was typical for the region, and by morning, the soda mixture had frozen solid around the stick. When Frank discovered the frozen treat, he ran hot water over the outside of the cup to loosen it, then pulled the icy pop out by its w
