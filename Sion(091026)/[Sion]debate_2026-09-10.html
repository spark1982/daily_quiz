<script>var TITLE = "[Sion] Debate";var QUIZ_KEY = "quiz_siondebate_2026-09-10_v1";var ATT_KEY = "quiz_siondebate_att_2026-09-10_v1";var RAW_QUESTIONS = [{"stem": "During a debate, your opponent argues: &ldquo;The opposing team supports building additional nuclear power plants. This is no different from arguing that we should turn the entire country into a ticking time bomb that could go off at any moment, and destroy the right to life of every citizen.&rdquo; What logical fallacy is the opponent committing?", "opts": ["Ad Hominem", "Straw Man Fallacy", "Slippery Slope", "Circular Reasoning"], "ci": 1, "exp": "The opponent's real position was simply \"support building more nuclear plants,\" but this was distorted into an extreme, easy-to-attack claim &mdash; turning the country into a \"ticking time bomb\" and \"destroying everyone's right to life.\" Reframing a moderate position as an extreme one in order to attack it is the definition of a Straw Man Fallacy.", "hint": "Check whether the opponent distorted the other side's real argument into an extreme, easy-to-attack form.", "tag": "Straw Man Fallacy", "tagcolor": "#f5a623"}, {"stem": "Read the following opening argument and analyze its logical flaw: &ldquo;If we introduce a universal basic income, some workers' motivation to work will decline. Reduced motivation will lead to reduced productivity, which will cause the national economy to stagnate, and ultimately bankrupt state finances and collapse the entire social system.&rdquo; What is the core weakness of this argument?", "opts": ["It infers a catastrophic outcome without proving the necessary causal link between each step", "It excludes the possibility of any alternative beyond the two options presented", "The sample size is too small to support a universal conclusion", "It relies solely on expert authority to prove its validity"], "ci": 0, "exp": "This argument chains together several speculative steps (less motivation &rarr; less productivity &rarr; economic stagnation &rarr; bankrupt finances &rarr; social collapse) without demonstrating that each step actually, necessarily follows from the one before it. Predicting an extreme, inevitable outcome from a small initial change without proving each causal link is the hallmark of a Slippery Slope Fallacy.", "hint": "Notice how a small initial cause is claimed to trigger a chain reaction leading to an extreme result, without proof at each intermediate step.", "tag": "Slippery Slope", "tagcolor": "#E24B4A"}, {"stem": "During cross-examination, the opposing team asks: &ldquo;Will you accept our proposed policy and save the economy, or reject it and allow the recession to continue indefinitely?&rdquo; What logical fallacy is embedded in this question?", "opts": ["Appeal to Ignorance", "Red Herring", "Complex Question", "False Dilemma"], "ci": 3, "exp": "The question presents only two extreme outcomes &mdash; accepting the policy and saving the economy, or rejecting it and allowing endless recession &mdash; while ignoring every other realistic possibility in between. Framing a complex issue as if only two extreme options exist is a False Dilemma.", "hint": "Consider whether reasonable alternatives exist beyond the two options presented.", "tag": "False Dilemma", "tagcolor": "#185FA5"}, {"stem": "In an education debate, a debater argues: &ldquo;80% of the faculty at Stanford University support Reform Plan A for the college admissions process. Therefore, it's clear that Reform Plan A is the most effective way to improve students' academic achievement.&rdquo; What logical gap does this argument overlook?", "opts": ["The key terms used in the argument are not clearly defined", "Expert authority alone does not guarantee that a claim is actually true", "It ignores the dissenting 20%, biasing the sample", "It fails to verify the policy's past implementation history"], "ci": 1, "exp": "Even if a large majority of a respected faculty supports a policy, their agreement is not, by itself, empirical proof that the policy will actually improve academic achievement. Treating expert or institutional endorsement as sufficient proof of a claim's truth is an Appeal to Authority.", "hint": "Ask whether a well-known group of experts agreeing with a policy is the same thing as concrete evidence that the policy actually works.", "tag": "Appeal to Authority", "tagcolor": "#8E44AD"}, {"stem": "Evaluate the logical structure of the following argument: &ldquo;This book is the true word of God, because the book itself says so, and God does not lie.&rdquo; What is the structural flaw in this claim?", "opts": ["It appeals to emotion to gain validity", "It mistakes a coincidental connection for causation", "It infers a cause backward from an effect", "It assumes the very conclusion it is supposed to prove as a true premise"], "ci": 3, "exp": "The claim &ldquo;this book is God's true word&rdquo; is supposedly proven by the premise &ldquo;the book itself says so, and God doesn't lie&rdquo; &mdash; but that premise already assumes the book is trustworthy in order to prove that very point. When a conclusion is smuggled into its own premise, that's Begging the Question (a form of Circular Reasoning).", "hint": "Check whether the evidence supporting the claim ultimately just depends on the claim itself being true.", "tag": "Begging the Question", "tagcolor": "#1D9E75"}, {"stem": "In a debate about environmental regulation, the affirmative side argues for &ldquo;stricter industrial wastewater discharge standards.&rdquo; The opposing side responds: &ldquo;The affirmative side claims to want to protect the environment, but doesn't their own lead speaker commute by diesel SUV every single day? An argument from someone who doesn't practice what they preach isn't convincing.&rdquo; What logical fallacy does the opposing side's rebuttal commit?", "opts": ["Cum Hoc Ergo Propter Hoc (Correlation Implies Causation)", "Moralistic Fallacy", "Tu Quoque", "Hasty Generalization"], "ci": 2, "exp": "Instead of addressing whether stricter wastewater standards are actually good policy, the rebuttal attacks the speaker's personal consistency. Even if the speaker really does drive a diesel SUV, that says nothing about whether the policy itself is sound. Responding to criticism with &ldquo;you do it too&rdquo; is the Tu Quoque fallacy.", "hint": "Watch for a 'you're just as bad' or 'you do it too' response that dodges the actual substance of the argument.", "tag": "Tu Quoque", "tagcolor": "#D35400"}, {"stem": "What is the critical flaw in the following argument based on survey data? &ldquo;According to a recent survey, 95% of our app's users reported being satisfied with our service. Therefore, most Americans are satisfied with our service.&rdquo;", "opts": ["The surveyed sample does not represent the entire population", "There is a critical error in the statistical calculations", "The survey questions were worded as leading questions", "It uses past data to predict future trends"], "ci": 0, "exp": "The survey only reflects the opinions of people who already use the app &mdash; a group likely to be more favorable toward it than the general public. Generalizing from a small, self-selected sample of existing users to a sweeping claim about &ldquo;most Americans&rdquo; is a Hasty Generalization built on an unrepresentative sample.", "hint": "Consider whether the people who were surveyed can actually represent the opinions of the entire population.", "tag": "Hasty Generalization", "tagcolor": "#16A085"}, {"stem": "During a debate about restricting teenagers' social media use, the opponent says: &ldquo;While we're busy discussing limits on teens' social media time, why aren't we talking about the far more serious problems of teen cyberbullying and illegal online gambling? Those are the real issues we should be solving.&rdquo; What is the correct way to respond to this?", "opts": ["Try to prove that social media use is a more serious problem than cyberbullying", "Point out that the opponent's team also failed to offer solutions for cyberbullying", "Point out that the opponent has committed a Red Herring and redirect the debate back to the original topic", "Concede with data just how serious the cyberbullying problem actually is"], "ci": 2, "exp": "The opponent hasn't addressed the actual proposal about social media limits at all &mdash; instead, they've introduced an unrelated (if genuinely serious) issue to shift attention away from the topic at hand. The correct response to a Red Herring is to name it explicitly and steer the debate back to the actual issue being argued, rather than getting pulled into a new argument.", "hint": "Think about the right strategy when an opponent tries to shift attention away from the topic actually being debated toward a different issue.", "tag": "Red Herring", "tagcolor": "#2C3E50"}, {"stem": "Find the hidden logical fallacy in the following argument: &ldquo;In City A, the crime rate spiked, and the very next month, the city council increased the police budget. Therefore, the increase in the police budget caused the spike in crime rate in City A.&rdquo;", "opts": ["Mistakes the order of events for a causal relationship (Post Hoc Ergo Propter Hoc)", "Denying the Antecedent", "Fallacy of Composition", "Appeal to Consequences"], "ci": 0, "exp": "The argument assumes that because the budget increase happened around the same time as the crime spike, it must have caused it &mdash; even though the timeline actually suggests the opposite relationship (the budget was likely raised in response to rising crime, not the other way around). Assuming that sequence alone proves causation is the Post Hoc Ergo Propter Hoc fallacy.", "hint": "Consider whether something happening first in time is enough, by itself, to prove that it caused what happened afterward.", "tag": "Post Hoc", "tagcolor": "#7f8c8d"}, {"stem": "During cross-examination, the opponent asks: &ldquo;Is your team prepared to take responsibility for the hundreds of millions of dollars in taxpayer losses that this policy's failure will cause?&rdquo; What logical flaw does this question commit, even as it lands as an aggressive line of attack?", "opts": ["It's a morally pressuring question that gives no time to answer", "It's an ad hominem question venting the questioner's personal grievance", "It's a Complex (Loaded) Question that assumes an unproven premise &mdash; that the policy will fail and cause tax losses &mdash; as if it were already established fact", "It's a question that confuses the roles of the affirmative and negative sides"], "ci": 2, "exp": "The question is built on an assumption that hasn't been established or agreed upon &mdash; that the policy will fail and cause massive taxpayer losses. Any direct answer (yes or no) forces the respondent to implicitly accept that unproven premise. Smuggling an unproven assumption into a question so that any answer accepts it is a Complex Question (also called a Loaded Question).", "hint": "Check whether the question itself already assumes something unproven as if it were already true.", "tag": "Complex Question", "tagcolor": "#0d9488"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;
var hintShown = false;
function toggleHint(){
  hintShown = !hintShown;
  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(hintShown){ hintBox.classList.add('show'); hintBtn.textContent='Hide Hint'; }
  else { hintBox.classList.remove('show'); hintBtn.textContent='Show Hint'; }
}
window.toggleHint=toggleHint;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  hintShown = false;
  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(q.hint){
    hintBtn.style.display='inline-block';
    hintBtn.textContent='Show Hint';
    hintBox.innerHTML = q.hint;
    hintBox.classList.remove('show');
  } else {
    hintBtn.style.display='none';
    hintBox.classList.remove('show');
  }

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();

}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();

</script>
</body>
</html>
