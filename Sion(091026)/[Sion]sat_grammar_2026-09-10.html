<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_sionsatgrammar_20_20260910_v1";var ATT_KEY = "quiz_sionsatgrammar_20_att_20260910_v1";var RAW_QUESTIONS = [{"stem": "Which choice provides the best revision of the underlined portion?", "context": "The recipe asks the cook <u>to quickly whisk</u> the eggs before folding in the flour.", "opts": ["quickly to whisk", "whisking quickly", "to quickly whisk", "to whisk quickly"], "ci": 3, "exp": "Although split infinitives are sometimes acceptable, the smoothest and most standard revision places the adverb after the full infinitive: \"to whisk quickly.\"", "tag": "Awkward Modifier Placement", "tagcolor": "#f5a623"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Because ticket sales declined this quarter, the theater has <u>less</u> performances scheduled for next season.", "opts": ["fewer", "less", "lesser", "a less number of"], "ci": 0, "exp": "\"Performances\" is a countable noun, so \"fewer\" is required rather than \"less,\" which is reserved for uncountable quantities.", "tag": "Fewer vs. Less", "tagcolor": "#d6336c"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The city council debated the proposal for hours<u>. Ultimately voting</u> to postpone the decision until the next session.", "opts": ["; ultimately, they were voting", ". They ultimately voted", ". Ultimately voting", ", ultimately voting"], "ci": 1, "exp": "The original creates a sentence fragment (\"Ultimately voting...\") with no subject or main verb. Supplying \"They ultimately voted\" creates a complete, grammatically correct sentence.", "tag": "Sentence Fragment", "tagcolor": "#7b61ff"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The negotiations dragged on for months <u>, however, both sides eventually reached a compromise everyone could accept.</u>", "opts": [", however, both sides eventually reached a compromise everyone could accept.", ", however both sides eventually reached, a compromise everyone could accept.", "however both sides eventually reached a compromise everyone could accept.", "; however, both sides eventually reached a compromise everyone could accept."], "ci": 3, "exp": "When \"however\" joins two independent clauses, it must be preceded by a semicolon and followed by a comma, not preceded by only a comma, which creates a comma splice.", "tag": "Conjunctive Adverb Punctuation", "tagcolor": "#1D9E75"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "There is only one correct approach to this problem<u>, a careful, step-by-step analysis of the data.</u>", "opts": [": a careful, step-by-step analysis of the data.", ", a careful, step-by-step analysis of the data.", "&mdash;, a careful, step-by-step analysis of the data.", "; a careful, step-by-step analysis of the data."], "ci": 0, "exp": "A colon is the correct punctuation to introduce an explanation or elaboration that follows a complete independent clause, making the second option the clearest and most standard choice.", "tag": "Colon Usage", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The committee offered two options: either the museum could extend its hours, <u>or extending the parking lot</u> to accommodate more visitors.", "opts": ["or it could extend the parking lot", "or extending the parking lot", "or the parking lot extended", "or to extend the parking lot"], "ci": 0, "exp": "The correlative pair \"either...or\" requires parallel grammatical structure. Since the first option is \"the museum could extend its hours,\" the second must match: \"or it could extend the parking lot.\"", "tag": "Correlative Conjunctions", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Walking through the old neighborhood, <u>the houses looked smaller than she remembered.</u>", "opts": ["smaller than she remembered, the houses were noticed.", "the houses looked smaller than she remembered.", "the houses, smaller than she remembered, were walked through.", "she noticed the houses looked smaller than she remembered."], "ci": 3, "exp": "The introductory phrase \"walking through the old neighborhood\" describes a person, not \"the houses,\" which creates a dangling modifier. The revision correctly supplies \"she\" as the one walking.", "tag": "Dangling Modifier", "tagcolor": "#f5a623"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "All three <u>student's</u> projects were selected for the regional science fair.", "opts": ["students's", "student's", "students'", "students"], "ci": 2, "exp": "Because there are multiple students who each have a project, the plural possessive \"students'\" is required, with the apostrophe placed after the \"s.\"", "tag": "Plural Possessive Apostrophe", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The award will be given to <u>whomever</u> submits the most original design.", "opts": ["whoever", "whomever", "which person", "who"], "ci": 0, "exp": "The pronoun functions as the subject of the verb \"submits\" within its own clause, so the subjective case \"whoever\" is required, not the objective \"whomever.\"", "tag": "Who vs. Whoever (Case)", "tagcolor": "#d6336c"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "If the bridge <u>was</u> repaired sooner, the detour would not have caused so much traffic congestion downtown.", "opts": ["will be", "was", "had been", "is"], "ci": 2, "exp": "This sentence expresses a hypothetical, unreal past condition (\"would not have caused\"), which requires the past perfect \"had been,\" not the simple past \"was.\"", "tag": "Verb Mood Consistency", "tagcolor": "#1D9E75"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Each of the volunteers <u>were</u> given a detailed schedule before the marathon began.", "opts": ["have been", "were", "was", "are"], "ci": 2, "exp": "\"Each\" is a singular indefinite pronoun and takes a singular verb, regardless of the plural noun \"volunteers\" that follows it in the prepositional phrase.", "tag": "Indefinite Pronoun Agreement", "tagcolor": "#1D9E75"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The collection of rare manuscripts, donated by several private libraries over the decades, <u>remain</u> in the university's archive today.", "opts": ["remains", "have remained were", "was remaining", "remain"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"collection,\" not the plural \"libraries\" in the intervening phrase. The verb must agree with the singular subject: \"remains.\"", "tag": "Subject-Verb Agreement (Intervening Phrase)", "tagcolor": "#8e44ad"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The internship taught her three things: how to manage a budget, how to lead a team, and <u>managing client relationships</u>.", "opts": ["how to manage client relationships", "the management of client relationships", "managing client relationships", "she managed client relationships"], "ci": 0, "exp": "The list requires parallel structure. Since the first two items begin with \"how to,\" the third item must match: \"how to manage client relationships.\"", "tag": "Parallel Structure in Lists", "tagcolor": "#f5a623"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "My sister told my cousin that <u>she</u> had won the scholarship, though it was unclear which of them the pronoun referred to.", "opts": ["the scholarship winner", "she", "my sister", "my cousin"], "ci": 2, "exp": "The pronoun \"she\" is ambiguous because it could refer to either \"my sister\" or \"my cousin.\" Replacing it with \"my sister\" removes the ambiguity while keeping the sentence concise.", "tag": "Ambiguous Pronoun Reference", "tagcolor": "#7b61ff"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "She answered the interviewer's questions <u>calm and confident</u>, impressing the entire panel.", "opts": ["calm and confident", "calmly and confidently", "in a calm and confident way of speaking", "with calm and confidence"], "ci": 1, "exp": "The words describe how she answered, so adverbs are needed to modify the verb \"answered,\" not adjectives. \"Calmly and confidently\" is the correct, concise adverbial form.", "tag": "Adverb vs. Adjective", "tagcolor": "#0d9488"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "By the time the fire trucks arrived, the flames <u>spread</u> across the entire roof.", "opts": ["will have spread", "were spreading now", "spread", "had spread"], "ci": 3, "exp": "The phrase \"by the time\" signals that one past action was completed before another past action. The past perfect \"had spread\" correctly shows the flames spreading occurred before the trucks arrived.", "tag": "Tense Sequencing", "tagcolor": "#7b61ff"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The scholarship committee insisted <u>on that</u> every applicant submit a personal essay.", "opts": ["for that", "on that", "upon that", "that"], "ci": 3, "exp": "The verb \"insisted\" idiomatically takes a \"that\" clause directly (\"insisted that\"), not the preposition \"on\" before it.", "tag": "Idiomatic Verb + Clause", "tagcolor": "#E24B4A"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The rehearsal ran long, <u>the director decided to cancel the final scene rather than keep everyone late.</u>", "opts": ["cancelling the final scene rather than keeping everyone late, the director decided.", "the director decided to cancel the final scene rather than keep everyone late.", "the director having decided to cancel the final scene rather than keep everyone late.", "so the director decided to cancel the final scene rather than keep everyone late."], "ci": 3, "exp": "The original creates a comma splice, joining two independent clauses with only a comma. Adding the coordinating conjunction \"so\" correctly links the clauses and shows the cause-and-effect relationship.", "tag": "Comma Splice", "tagcolor": "#E24B4A"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The dog wagged <u>it's</u> tail excitedly when the children came home from school.", "opts": ["its'", "its", "their", "it's"], "ci": 1, "exp": "\"Its\" is the possessive form of \"it,\" while \"it's\" is a contraction of \"it is.\" Since possession is intended here, \"its\" is correct.", "tag": "Its vs. It's", "tagcolor": "#0d9488"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The final report was, in the end ultimately, the clearest summary the board had ever received.", "opts": ["in the end ultimately,", "at the ultimate end,", "in the end, ultimately", "ultimately,"], "ci": 3, "exp": "\"In the end\" and \"ultimately\" both express the same idea, making the phrase redundant. The most concise revision keeps only \"ultimately.\"", "tag": "Redundancy", "tagcolor": "#8e44ad"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();

function render(){

  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];

  var badge = document.getElementById('tag-badge');

  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();

}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();

</script>
</body>
</html>
