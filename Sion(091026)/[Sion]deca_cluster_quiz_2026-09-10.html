<script>var TITLE = "[Sion] Deca Cluster Quiz";var QUIZ_KEY = "quiz_siondecacluster_20_20260910_v1";var ATT_KEY = "quiz_siondecacluster_20_att_20260910_v1";var RAW_QUESTIONS = [{"stem": "A U.S.-based company begins sourcing raw materials from suppliers in three different countries and starts accepting customer payments in multiple currencies. This is an example of", "opts": ["an economic recession.", "financial globalization.", "a monopoly.", "insider trading."], "ci": 1, "exp": "Financial globalization refers to the increasing interconnection of financial markets and activities across countries, such as sourcing internationally and dealing in multiple currencies."}, {"stem": "Which of the following best describes the purpose of information management within a business?", "opts": ["Restricting all employees from accessing company data.", "Collecting, organizing, and using data effectively to support decision-making.", "Advertising a company's products to attract new customers.", "Deleting outdated files to save server space, with no other goal."], "ci": 1, "exp": "Information management refers to the processes a business uses to collect, organize, store, and use data to support effective decision-making &mdash; not simply data deletion, restriction, or advertising."}, {"stem": "A team leader sets a clear vision, motivates team members toward shared goals, and takes responsibility for the team's outcomes. This best illustrates the concept of", "opts": ["micromanagement.", "networking.", "leadership.", "outsourcing."], "ci": 2, "exp": "Leadership involves setting direction, motivating others, and taking accountability for results &mdash; all of which this team leader demonstrates."}, {"stem": "Which statement best describes managerial accounting?", "opts": ["It is legally required to follow Generally Accepted Accounting Principles (GAAP) for external reporting.", "It only tracks a company's tax obligations.", "It focuses on preparing reports strictly for external investors following government regulations.", "It provides internal managers with financial information to support day-to-day decision-making."], "ci": 3, "exp": "Managerial accounting generates detailed, often customized financial information for internal use by managers, unlike financial accounting, which follows standardized rules (such as GAAP) for external reporting."}, {"stem": "If Alex invests $2,000 today at an annual interest rate of 5%, compounded annually, approximately how much will the investment be worth in 2 years?", "opts": ["$2,200", "$2,100", "$2,000", "$2,205"], "ci": 3, "exp": "Using the compound interest formula, $2,000 &times; (1.05)&sup2; = $2,000 &times; 1.1025 &asymp; $2,205. This calculation reflects the time value of money: money available today can earn returns over time, so its future value grows with compounding interest."}, {"stem": "A company discovers that many customers' mailing addresses in its database are outdated, resulting in returned mail and wasted marketing costs. What should the company do to prevent this issue going forward?", "opts": ["Increase the marketing budget without changing the database.", "Regularly update and verify customer contact information.", "Delete all customer records from the database.", "Stop mailing marketing materials permanently."], "ci": 1, "exp": "Outdated customer information leads to wasted resources and missed communication. Regularly verifying and updating records helps a business maintain an accurate, useful customer database."}, {"stem": "A caf&eacute;'s sales reports have shown that sales of iced beverages increase by about 30 percent every year during the summer months. How can management best use this information?", "opts": ["By adjusting staffing and inventory levels in advance of the summer season.", "By ignoring seasonal patterns to keep pricing consistent year-round.", "By reducing marketing spending only during the winter months.", "By discontinuing hot beverage sales entirely."], "ci": 0, "exp": "Recognizing a recurring seasonal sales trend allows management to proactively plan staffing and inventory levels, helping the business meet increased demand efficiently."}, {"stem": "A shoe company advertises that its products are \"built to survive any adventure.\" To maintain this brand promise, what should the company prioritize?", "opts": ["Lowering prices below competitors regardless of product quality.", "Changing its advertising slogan every season.", "Focusing primarily on packaging design rather than product performance.", "Consistently manufacturing durable, high-quality products that match its marketing claims."], "ci": 3, "exp": "A brand promise is a commitment a company makes to its customers about what they can expect. To maintain trust and credibility, the company must consistently deliver products that live up to that promise."}, {"stem": "After receiving critical feedback from her manager about a client presentation, Priya reflects on the comments and adjusts her approach for future presentations. This is an example of", "opts": ["engaging in scope creep.", "practicing groupthink.", "demonstrating a fixed mindset.", "using feedback for personal and professional growth."], "ci": 3, "exp": "Reflecting on feedback and using it to improve future performance demonstrates a growth mindset and effective use of feedback, which supports ongoing professional development."}, {"stem": "During a staff meeting, an employee actively listens, takes notes, and waits for an appropriate moment to share ideas. This behavior best demonstrates", "opts": ["passive-aggressive communication.", "groupthink.", "effective meeting participation.", "unprofessional conduct."], "ci": 2, "exp": "Active listening, note-taking, and contributing ideas at appropriate times are hallmarks of effective, professional participation in a staff meeting."}, {"stem": "A manufacturing company budgeted $50,000 for raw materials but actually spent $58,000. A managerial accountant investigates the $8,000 difference to determine its cause. This process is called", "opts": ["horizontal analysis.", "amortization.", "variance analysis.", "capital budgeting."], "ci": 2, "exp": "Variance analysis compares budgeted figures to actual results to identify and explain differences, helping managers understand and control costs."}, {"stem": "A finance department implements new software that automatically flags unusual transactions for review. What is the primary benefit of this technology?", "opts": ["It eliminates the need for any human oversight.", "It helps detect potential errors or fraud more efficiently.", "It replaces the need for a company budget.", "It guarantees the company will never be audited."], "ci": 1, "exp": "Technology that flags unusual transactions helps finance teams more efficiently identify potential errors or fraudulent activity, supporting &mdash; not replacing &mdash; human review and oversight."}, {"stem": "A beverage company funds clean-water projects in communities where it operates. This is an example of", "opts": ["a hostile takeover.", "corporate social responsibility.", "predatory pricing.", "insider trading."], "ci": 1, "exp": "Corporate social responsibility involves businesses voluntarily engaging in activities that benefit society, such as funding community projects, beyond their basic legal obligations."}, {"stem": "A new data-privacy law now requires a company to change how it stores customer information. What is the most effective way for the company to prepare its employees for this change?", "opts": ["Provide training on the new procedures required by the law.", "Ignore the change until a violation occurs.", "Outsource the entire customer service department.", "Reduce the number of customers the company serves."], "ci": 0, "exp": "When external regulations change, businesses must adapt their internal processes. Training employees on new required procedures helps ensure compliance and reduces the risk of costly violations."}, {"stem": "Which of the following best illustrates a basic economic activity?", "opts": ["A family deciding how to allocate its limited income among housing, food, and savings.", "A student memorizing vocabulary words for a test.", "A city repainting the lines on a road.", "A company hosting a holiday party for its employees."], "ci": 0, "exp": "Economics is the study of how individuals and organizations allocate limited resources to satisfy needs and wants. A family budgeting its limited income among competing needs is a basic economic activity, while the other choices do not involve resource allocation decisions."}, {"stem": "A company's board of directors establishes strict guidelines for how executives can approve large expenditures. This illustrates how governance processes", "opts": ["are legally optional for publicly traded companies.", "shape and constrain management's decision-making authority.", "apply only to nonprofit organizations.", "eliminate the need for a management team."], "ci": 1, "exp": "Governance processes, such as board-established guidelines, create a framework within which management must operate, shaping and sometimes limiting management's decision-making authority."}, {"stem": "Jordan wants a life insurance policy that provides coverage for the 20-year period while he pays off his mortgage, at the lowest possible premium, and does not need any long-term savings component. Which type of policy best fits his needs?", "opts": ["Universal life insurance", "Variable life insurance", "Term life insurance", "Whole life insurance"], "ci": 2, "exp": "Term life insurance provides coverage for a fixed period of years at a lower premium because it has no cash-value savings component. Universal, whole, and variable life insurance are permanent policies that build cash value and typically cost more."}, {"stem": "A warehouse employee skips several steps outlined in the forklift's operating manual in order to finish a task more quickly. What is the most likely consequence of this decision?", "opts": ["Increased efficiency with no added risk.", "Automatic approval from a supervisor.", "A higher risk of injury or equipment damage.", "A reduction in the company's insurance premiums."], "ci": 2, "exp": "Operating instructions for machinery are designed to protect workers and equipment. Skipping steps increases the likelihood of accidents, injuries, or damage, rather than providing any real benefit."}, {"stem": "Before finalizing a partnership with a company in Japan, a U.S. executive researches local business customs and greetings ahead of the meeting. What is the primary benefit of this preparation?", "opts": ["It removes the need for a professional interpreter in all cases.", "It guarantees a lower contract price.", "It helps avoid miscommunication and shows respect for the partner's culture.", "It eliminates the need for a written contract."], "ci": 2, "exp": "Researching a business partner's cultural norms and communication style helps prevent misunderstandings and signals respect, which builds trust in international business relationships."}, {"stem": "Which of the following would be classified as a liability on a company's balance sheet?", "opts": ["Retained earnings", "Accounts payable to suppliers", "Cash on hand", "Office equipment"], "ci": 1, "exp": "Accounts payable represents money the company owes to suppliers, making it a liability. Cash and office equipment are assets, and retained earnings is part of owners' equity."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
