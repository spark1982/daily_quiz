<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }

  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }

  .dot.answered-wrong { background:#E24B4A; color:#fff; }

  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }

  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }

  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }

  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }

  .sat-timer{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#eef3fb;border:1px solid #c9d8ef;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:0.9rem;font-weight:700;color:#185FA5;position:sticky;top:0;z-index:5;}
  .sat-timer .over{color:#E24B4A;}
  .sat-timer button{background:#fff;border:1.5px solid #185FA5;color:#185FA5;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;}
  .sat-pausebox{display:none;text-align:center;background:#fff;border-radius:14px;padding:30px 20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);font-weight:700;color:#185FA5;}
</style>

<script>
var TITLE = "[Sion] SAT Math";
var QUIZ_KEY = "sionsatmath_10";
var INSTRUCTION = "Choose the correct answer for each problem. A calculator (Desmos) is allowed, as on the real SAT.";
var TODAY_STR = "20261114";
var RAW_QUESTIONS = [{"stem": "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2<i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 1</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>kx</i> &minus; 5</span><span style=\"border-top:1.4px solid #111;\">3</span></span><br><br>In the given equation, <i>k</i> is a constant. If the equation has no solution, what is the value of <i>k</i>?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>11</span><span style=\"border-top:1.4px solid #111;\">20</span></span>", "4", "1", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>"], "ci": 2, "exp": "<b>What we need:</b> the value of <i>k</i> that makes the linear equation have <i>no</i> solution. A linear equation has no solution when, after simplifying, the <i>x</i>-terms on both sides match but the constants do not.<br><br><b>Step 1 &mdash; Clear the denominators.</b> The least common denominator of 4, 6, and 3 is 12. Multiply every term by 12: 3(2<i>x</i> &minus; 3) &minus; 2(<i>x</i> + 1) = 4(kx &minus; 5).<br><b>Step 2 &mdash; Expand.</b> Left: 6<i>x</i> &minus; 9 &minus; 2<i>x</i> &minus; 2 = 4<i>x</i> &minus; 11. Right: 4<i>kx</i> &minus; 20. So 4<i>x</i> &minus; 11 = 4<i>kx</i> &minus; 20.<br><b>Step 3 &mdash; Apply the no-solution condition.</b> The <i>x</i>-coefficients must be equal: 4 = 4<i>k</i>, so <i>k</i> = 1. Then the equation is 4<i>x</i> &minus; 11 = 4<i>x</i> &minus; 20, <i>i</i>.<i>e</i>., &minus;11 = &minus;20, which is false for every <i>x</i> &mdash; no solution. &#10003;<br><br><b>Answer check (another way):</b> compare <i>x</i>-coefficients before clearing denominators. Left: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>. Right: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i></span><span style=\"border-top:1.4px solid #111;\">3</span></span>. Equal when <i>k</i> = 1. Constants: &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>11</span><span style=\"border-top:1.4px solid #111;\">12</span></span> versus &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>20</span><span style=\"border-top:1.4px solid #111;\">12</span></span> &mdash; different, so there is truly no solution (not infinitely many).<br><br><b>Traps:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span> is the <i>x</i>-coefficient on the left, not <i>k</i>. 4 comes from matching 4<i>x</i> with kx after forgetting to multiply the right side&rsquo;<i>s</i> <i>k</i> by 4. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>11</span><span style=\"border-top:1.4px solid #111;\">20</span></span> comes from setting the constants equal, which is the condition you do <i>not</i> want.<br><br><b>Desmos:</b> graph <i>y</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2<i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 1</span><span style=\"border-top:1.4px solid #111;\">6</span></span> and <i>y</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>kx</i> &minus; 5</span><span style=\"border-top:1.4px solid #111;\">3</span></span> with a <i>k</i>-slider; the lines are parallel (never meet) at <i>k</i> = 1.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "A plumber charges a fixed service fee plus an hourly rate for each job. A 2-hour job costs $190, and a 5-hour job costs $385. Which function gives the total cost <i>C</i>(<i>h</i>), in dollars, of a job that lasts <i>h</i> hours?", "opts": ["<i>C</i>(<i>h</i>) = 95<i>h</i>", "<i>C</i>(<i>h</i>) = 65<i>h</i> + 60", "<i>C</i>(<i>h</i>) = 60<i>h</i> + 65", "<i>C</i>(<i>h</i>) = 65<i>h</i> + 125"], "ci": 1, "exp": "<b>What we need:</b> a linear function <i>C</i>(<i>h</i>) = <i>mh</i> + <i>b</i>, where <i>m</i> is the hourly rate and <i>b</i> is the fixed fee.<br><br><b>Step 1 &mdash; Hourly rate (slope).</b> Going from 2 to 5 hours adds 3 hours and adds $385 &minus; $190 = $195. So m = 195 &divide; 3 = 65 dollars per hour.<br><b>Step 2 &mdash; Fixed fee (intercept).</b> Use the 2-hour job: 190 = 65(2) + b, so b = 190 &minus; 130 = 60.<br><b>Step 3 &mdash; Write the function.</b> <i>C</i>(<i>h</i>) = 65<i>h</i> + 60.<br><br><b>Answer check:</b> <i>C</i>(5) = 65(5) + 60 = 325 + 60 = 385 &#10003;.<br><br><b>Traps:</b> <i>C</i>(<i>h</i>) = 95<i>h</i> divides $190 by 2 and ignores the fixed fee (it would give <i>C</i>(5) = 475). <i>C</i>(<i>h</i>) = 65<i>h</i> + 125 subtracts only one hour&rsquo;<i>s</i> rate from $190. <i>C</i>(<i>h</i>) = 60<i>h</i> + 65 swaps the rate and the fee (<i>C</i>(2) = 185, not 190).", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "<i>ax</i> + 3<i>y</i> = 12<br>4<i>x</i> &minus; 2<i>y</i> = <i>b</i><br><br>In the given system of equations, a and <i>b</i> are constants. If the system has infinitely many solutions, what is the value of <i>a</i> + <i>b</i>?", "opts": ["14", "&minus;14", "&minus;2", "2"], "ci": 1, "exp": "<b>What we need:</b> a system of two linear equations has infinitely many solutions when the two equations describe the <i>same</i> line &mdash; one equation is a constant multiple of the other.<br><br><b>Step 1 &mdash; Find the multiplier from the <i>y</i>-terms.</b> The <i>y</i>-coefficients are 3 and &minus;2, so the second equation must be the first multiplied by &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> (because 3 &times; (&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>) = &minus;2).<br><b>Step 2 &mdash; Apply it to <i>x</i>.</b> a &times; (&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>) = 4, so <i>a</i> = 4 &times; (&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>) = &minus;6.<br><b>Step 3 &mdash; Apply it to the constant.</b> 12 &times; (&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>) = &minus;8, so <i>b</i> = &minus;8.<br><b>Step 4 &mdash; Add.</b> <i>a</i> + <i>b</i> = &minus;6 + (&minus;8) = &minus;14.<br><br><b>Answer check:</b> with <i>a</i> = &minus;6 and <i>b</i> = &minus;8, the first equation is &minus;6<i>x</i> + 3<i>y</i> = 12; multiplying by &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> gives 4<i>x</i> &minus; 2<i>y</i> = &minus;8, exactly the second equation &#10003;.<br><br><b>Traps:</b> 14 drops both negative signs (<i>a</i> = 6, <i>b</i> = 8). 2 gets <i>a</i> = &minus;6 right but uses <i>b</i> = 8. &minus;2 uses <i>a</i> = 6 with <i>b</i> = &minus;8. The sign of the multiplier (&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>) must be applied to every term.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "Which expression is equivalent to <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i><sup>2</sup> &minus; 9</span><span style=\"border-top:1.4px solid #111;\"><i>x</i><sup>2</sup> + <i>x</i> &minus; 6</span></span> for <i>x</i> &gt; 2?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> + 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 9</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 6</span></span>"], "ci": 1, "exp": "<b>What we need:</b> simplify the rational expression by factoring the numerator and denominator and canceling a common factor. (The condition <i>x</i> &gt; 2 keeps the denominator from being zero.)<br><br><b>Step 1 &mdash; Factor the numerator.</b> <i>x</i><sup>2</sup> &minus; 9 is a difference of squares: (<i>x</i> &minus; 3)(<i>x</i> + 3).<br><b>Step 2 &mdash; Factor the denominator.</b> <i>x</i><sup>2</sup> + <i>x</i> &minus; 6: find two numbers that multiply to &minus;6 and add to 1 &mdash; they are 3 and &minus;2. So <i>x</i><sup>2</sup> + <i>x</i> &minus; 6 = (<i>x</i> + 3)(<i>x</i> &minus; 2).<br><b>Step 3 &mdash; Cancel.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(<i>x</i> &minus; 3)(<i>x</i> + 3)</span><span style=\"border-top:1.4px solid #111;\">(<i>x</i> + 3)(<i>x</i> &minus; 2)</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>.<br><br><b>Answer check:</b> try <i>x</i> = 4. Original: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>16 &minus; 9</span><span style=\"border-top:1.4px solid #111;\">16 + 4 &minus; 6</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>7</span><span style=\"border-top:1.4px solid #111;\">14</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>. Simplified: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4 &minus; 3</span><span style=\"border-top:1.4px solid #111;\">4 &minus; 2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &#10003;.<br><br><b>Traps:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span> cancels the wrong factor of the numerator. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> + 2</span></span> factors the denominator as (<i>x</i> + 3)(<i>x</i> + 2) &mdash; but that product is <i>x</i><sup>2</sup> + 5<i>x</i> + 6. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 9</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 6</span></span> &ldquo;cancels&rdquo; the <i>x</i><sup>2</sup> terms, which is never allowed: you can cancel only common <i>factors</i>, not terms.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "What is the sum of all real solutions to the equation <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2<i>x</i> + 7</span></span> = <i>x</i> &minus; 4 ?", "opts": ["9", "1", "5", "10"], "ci": 0, "exp": "<b>What we need:</b> solve a radical equation. Squaring both sides can create <i>extraneous</i> solutions, so every candidate must be checked in the original equation.<br><br><b>Step 1 &mdash; Square both sides.</b> 2<i>x</i> + 7 = (<i>x</i> &minus; 4)<sup>2</sup> = <i>x</i><sup>2</sup> &minus; 8<i>x</i> + 16.<br><b>Step 2 &mdash; Rearrange.</b> 0 = <i>x</i><sup>2</sup> &minus; 10<i>x</i> + 9 = (<i>x</i> &minus; 1)(<i>x</i> &minus; 9), so the candidates are <i>x</i> = 1 and <i>x</i> = 9.<br><b>Step 3 &mdash; Check each candidate.</b> <i>x</i> = 1: left side <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2(1) + 7</span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">9</span></span> = 3; right side 1 &minus; 4 = &minus;3. Since 3 &ne; &minus;3, <i>x</i> = 1 is extraneous. <i>x</i> = 9: left side <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">25</span></span> = 5; right side 9 &minus; 4 = 5 &#10003;.<br><b>Step 4 &mdash; Sum.</b> The only real solution is 9, so the sum is 9.<br><br><b>Answer check:</b> a square root is never negative, so the right side <i>x</i> &minus; 4 must be at least 0, which means <i>x</i> &ge; 4. That rules out <i>x</i> = 1 immediately.<br><br><b>Traps:</b> 10 adds both candidates without checking (it is the sum of the quadratic&rsquo;<i>s</i> roots). 1 keeps only the extraneous root. 5 is the value of each side when <i>x</i> = 9, not the solution.<br><br><b>Desmos:</b> graph <i>y</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2<i>x</i> + 7</span></span> and <i>y</i> = <i>x</i> &minus; 4; they intersect only at (9, 5).", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "<i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> &minus; 2<i>kx</i> + <i>k</i><sup>2</sup> + 3<i>k</i> &minus; 18<br><br>In the given function, <i>k</i> is a constant. For how many integer values of <i>k</i> does the graph of <i>y</i> = <i>f</i>(<i>x</i>) in the xy-plane intersect the <i>x</i>-axis at two distinct points that both have positive <i>x</i>-coordinates?", "opts": ["6", "5", "2", "3"], "ci": 2, "exp": "<b>What we need:</b> the integer values of <i>k</i> for which <i>f</i> has two distinct real zeros, both positive.<br><br><b>Step 1 &mdash; Complete the square.</b> <i>x</i><sup>2</sup> &minus; 2<i>kx</i> + <i>k</i><sup>2</sup> = (<i>x</i> &minus; k)<sup>2</sup>, so <i>f</i>(<i>x</i>) = (<i>x</i> &minus; k)<sup>2</sup> + 3<i>k</i> &minus; 18. The vertex is at (<i>k</i>, 3<i>k</i> &minus; 18).<br><b>Step 2 &mdash; Two distinct zeros.</b> An upward-opening parabola crosses the <i>x</i>-axis twice exactly when its vertex is below the axis: 3<i>k</i> &minus; 18 &lt; 0, so <i>k</i> &lt; 6.<br><b>Step 3 &mdash; Write the zeros.</b> (<i>x</i> &minus; k)<sup>2</sup> = 18 &minus; 3<i>k</i> gives <i>x</i> = <i>k</i> &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">18 &minus; 3<i>k</i></span></span>. The larger zero is positive whenever the smaller one is, so we need only the smaller zero to be positive: <i>k</i> &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">18 &minus; 3<i>k</i></span></span> &gt; 0.<br><b>Step 4 &mdash; Solve that inequality.</b> It requires <i>k</i> &gt; 0 and <i>k</i><sup>2</sup> &gt; 18 &minus; 3<i>k</i>, <i>i</i>.<i>e</i>., <i>k</i><sup>2</sup> + 3<i>k</i> &minus; 18 &gt; 0, <i>i</i>.<i>e</i>., (<i>k</i> + 6)(<i>k</i> &minus; 3) &gt; 0. With <i>k</i> &gt; 0 this means <i>k</i> &gt; 3.<br><b>Step 5 &mdash; Combine.</b> 3 &lt; <i>k</i> &lt; 6, so the integers are <i>k</i> = 4 and <i>k</i> = 5: <b>2</b> values.<br><br><b>Answer check:</b> <i>k</i> = 4: zeros 4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">6</span></span> &asymp; 1.55 and 6.45, both positive &#10003;. <i>k</i> = 5: zeros 5 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">3</span></span> &asymp; 3.27 and 6.73 &#10003;. <i>k</i> = 3: zeros 3 &plusmn; 3 = 0 and 6 &mdash; zero is not positive &#10007;. <i>k</i> = 6: vertex on the axis, only one zero &#10007;.<br><b>Another way (Vieta):</b> both zeros are positive exactly when the discriminant is positive, the sum of the zeros 2<i>k</i> &gt; 0, and the product of the zeros <i>k</i><sup>2</sup> + 3<i>k</i> &minus; 18 &gt; 0. These give <i>k</i> &lt; 6, <i>k</i> &gt; 0, and <i>k</i> &gt; 3 &mdash; the same answer.<br><br><b>Traps:</b> 6 counts <i>k</i> = 0, 1, 2, 3, 4, 5 (only &ldquo;two zeros&rdquo; plus <i>k</i> &ge; 0). 5 counts <i>k</i> = 1 through 5, forgetting that the smaller zero must also be positive. 3 counts <i>k</i> = 3, 4, 5, including <i>k</i> = 3, whose smaller zero is exactly 0.<br><br><b>Desmos:</b> graph <i>y</i> = <i>x</i><sup>2</sup> &minus; 2<i>kx</i> + <i>k</i><sup>2</sup> + 3<i>k</i> &minus; 18 with a <i>k</i>-slider and watch where both zeros sit to the right of the <i>y</i>-axis.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "A pump moves water at a constant rate of 2.4 liters per second. At this rate, how many hours will it take the pump to fill an empty tank with a capacity of 34.56 cubic meters? (1 cubic meter = 1,000 liters)", "opts": ["240", "14.4", "40", "4"], "ci": 3, "exp": "<b>What we need:</b> time = amount &divide; rate, with all units converted so they cancel.<br><br><b>Step 1 &mdash; Convert the capacity to liters.</b> 34.56 <i>m</i><sup>3</sup> &times; 1,000 <i>L</i> per <i>m</i><sup>3</sup> = 34,560 <i>L</i>.<br><b>Step 2 &mdash; Time in seconds.</b> 34,560 <i>L</i> &divide; 2.4 <i>L</i> per <i>s</i> = 14,400 <i>s</i>.<br><b>Step 3 &mdash; Convert to hours.</b> 1 hour = 60 &times; 60 = 3,600 <i>s</i>, so 14,400 &divide; 3,600 = 4 hours.<br><br><b>Answer check:</b> in 4 hours the pump runs 14,400 <i>s</i> and moves 14,400 &times; 2.4 = 34,560 <i>L</i> = 34.56 <i>m</i><sup>3</sup> &#10003;.<br><br><b>Traps:</b> 14.4 is the time in <i>thousands of seconds</i> (14,400 s) left unconverted. 240 is the time in minutes. 40 comes from dividing 14,400 by 360 instead of 3,600.", "tag": "Problem-Solving and Data Analysis", "tagcolor": "#1D9E75"}, {"stem": "A sphere is inscribed in a cube, so that the sphere touches each of the cube&rsquo;<i>s</i> six faces. The volume of the cube is 216 cubic inches. What is the volume, in cubic inches, of the sphere?", "opts": ["36&pi;", "288&pi;", "108&pi;", "27&pi;"], "ci": 0, "exp": "<b>What we need:</b> the sphere&rsquo;<i>s</i> radius, which comes from the cube&rsquo;<i>s</i> edge length.<br><br><b>Step 1 &mdash; Cube edge.</b> <i>s</i><sup>3</sup> = 216, so <i>s</i> = 6 inches.<br><b>Step 2 &mdash; Sphere radius.</b> A sphere that touches all six faces has a diameter equal to the edge length, so the diameter is 6 and the radius is <i>r</i> = 3.<br><b>Step 3 &mdash; Sphere volume.</b> <i>V</i> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)&pi;<i>r</i><sup>3</sup> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)&pi;(27) = 36&pi; cubic inches.<br><br><b>Answer check:</b> 36&pi; &asymp; 113.1, which is about 52% of 216. The ratio of an inscribed sphere&rsquo;<i>s</i> volume to its cube&rsquo;<i>s</i> is always <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&pi;</span><span style=\"border-top:1.4px solid #111;\">6</span></span> &asymp; 0.524 &#10003;.<br><br><b>Traps:</b> 288&pi; uses the edge length 6 as the radius. 108&pi; forgets to divide by 3 in the formula (4&pi;<i>r</i><sup>3</sup>). 27&pi; uses &pi;<i>r</i><sup>3</sup>, dropping the <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span>.", "tag": "Geometry and Trigonometry", "tagcolor": "#E24B4A"}];

    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* sat-timer 2026-11-06 */
(function(){
  var PER_Q = 80;
  var LIMIT = PER_Q * RAW_QUESTIONS.length;
  var TK = STORAGE_KEY + '_timer';
  function blank(){ return {el:0, per:{}, up:false}; }
  function load(){ try{ return JSON.parse(localStorage.getItem(TK)) || blank(); }catch(e){ return blank(); } }
  var T = load(), paused = false, last = Date.now();
  function save(){ try{ localStorage.setItem(TK, JSON.stringify(T)); }catch(e){} }
  function retrying(){ return !!(activeSet && activeSet.length); }
  window.SAT_TIMEUP = function(){ return !!T.up; };
  var bar = document.createElement('div'); bar.className = 'sat-timer'; bar.id = 'sat-timer';
  bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function curAnswered(){ if(window.EXAM_ACTIVE && EXAM_ACTIVE()) return false; var q = activeOrder()[state.cur]; return q !== undefined && state.answers[q] !== undefined; } /* sat-timer-pause-on-answer 2026-11-14 */
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && !curAnswered() && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
