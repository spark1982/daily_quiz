var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261114";
var RAW_QUESTIONS = [{"stem": "Role-play: you are a customer service lead at a credit union. You just presented a plan for reducing hold times. The judge asks: &ldquo;What would you say right now to a member who has already waited on hold for 40 minutes and is furious?&rdquo; Which answer is best?", "opts": ["&ldquo;I&rsquo;d promise them a $100 credit, a free premium account, and a personal phone call from our CEO.&rdquo;", "&ldquo;That&rsquo;s a good question. Customer service is very important to every business.&rdquo;", "&ldquo;I&rsquo;d explain that our hold times are caused by high call volume, which is not our fault.&rdquo;", "&ldquo;I&rsquo;d apologize sincerely, acknowledge that 40 minutes is too long, solve their issue on that call, and offer a callback number so they never have to wait in the queue again for that problem.&rdquo;"], "ci": 3, "exp": "Judges reward answers that are <b>specific, tied to the situation, and realistic</b>. The best answer shows empathy (apology, acknowledgment), resolves the problem, and prevents a repeat. Making excuses shifts blame; promising large rewards you can&rsquo;t authorize is unrealistic; and a general statement avoids the question."}, {"stem": "A judge&rsquo;s performance indicator is &ldquo;Demonstrate self-control.&rdquo; In the role-play, the judge plays a client who rudely questions your competence as a junior financial advisor. Which response best demonstrates the PI?", "opts": ["Explaining that self-control means managing your emotions and that you always try to stay calm", "Agreeing that you are new and offering to transfer him to a more experienced advisor immediately", "Pausing, keeping a calm tone, and saying, &ldquo;I understand you want to be sure your money is in good hands. Let me walk you through how I built this plan and the numbers behind it.&rdquo;", "Firmly telling the client that you will not continue unless he apologizes for his tone"], "ci": 2, "exp": "To <b>demonstrate</b> a PI, you must show it in action, not just define it. Pausing, staying calm, acknowledging the client&rsquo;s concern, and redirecting to facts shows self-control. Demanding an apology escalates; giving up immediately avoids the challenge; and describing self-control instead of showing it misses the verb &ldquo;demonstrate.&rdquo;"}, {"stem": "A credit union analyst is evaluating a small business loan applicant. Which measure best shows whether the business can pay its short-term bills without having to sell its inventory?", "opts": ["The debt-to-equity ratio", "The inventory turnover ratio", "The quick (acid-test) ratio", "The gross profit margin"], "ci": 2, "exp": "The <b>quick ratio</b> = (current assets &minus; inventory) &divide; current liabilities. It measures liquidity while excluding inventory, which may be hard to sell quickly. Debt-to-equity measures long-term leverage, inventory turnover measures how fast stock sells, and gross profit margin measures profitability, not the ability to pay bills."}, {"stem": "Priya wants to launch an app that helps teens track their savings goals. Before spending $40,000 on full development, she builds a simple version with only the core goal-tracking feature and releases it to 200 test users. What is this simple version called?", "opts": ["A minimum viable product (MVP)", "A loss leader", "A prototype patent", "A franchise model"], "ci": 0, "exp": "A <b>minimum viable product</b> is the simplest version of a product that delivers its core value so an entrepreneur can test real demand and collect feedback before investing heavily. A patent protects an invention legally, a franchise model licenses a business system to others, and a loss leader is a product sold below cost to attract customers."}, {"stem": "Which is the most significant disadvantage of starting a business as a sole proprietorship?", "opts": ["The owner must share profits equally with silent partners.", "The business must file articles of incorporation with the state.", "The business is taxed twice, once as a company and again on dividends.", "The owner has unlimited personal liability for the business&rsquo;s debts."], "ci": 3, "exp": "In a <b>sole proprietorship</b>, the owner and the business are legally the same, so creditors can go after the owner&rsquo;s personal assets (house, savings) to pay business debts &mdash; unlimited liability. There are no partners to share profits with, no articles of incorporation, and no double taxation (that applies to C corporations)."}, {"stem": "Marisol leaves her laptop with a repair shop, Fix-It Tech, while it replaces the cracked screen. Legally, what is this relationship called?", "opts": ["An agency relationship, because the shop now acts on Marisol&rsquo;s behalf with third parties", "A bailment, in which Fix-It Tech temporarily holds Marisol&rsquo;s property and must take reasonable care of it", "A sale, because ownership of the laptop passes to the shop until the repair bill is paid", "A lease, because Marisol is paying the shop for the right to use its workspace"], "ci": 1, "exp": "A <b>bailment</b> exists when one party (the bailor, Marisol) hands personal property to another (the bailee, the shop) for a specific purpose, expecting it back. Ownership never transfers, and a bailee for hire must use reasonable care. It is not a sale (no transfer of title), not a lease (Marisol is not renting anything), and not agency (the shop is not making deals for her)."}, {"stem": "A new online bank advertises itself as &ldquo;the bank with no fees, ever&rdquo; to stand apart from large traditional banks. What marketing concept is the bank using?", "opts": ["Positioning", "Market saturation", "Price fixing", "Mass production"], "ci": 0, "exp": "<b>Positioning</b> is creating a distinct image of a product in customers&rsquo; minds relative to competitors &mdash; here, &ldquo;no fees&rdquo; versus traditional banks. Market saturation means a market has little room left for growth, mass production is a manufacturing method, and price fixing is an illegal agreement among competitors to set prices."}, {"stem": "Which of the following is an example of an employee benefit rather than direct wages or salary?", "opts": ["A salesperson earns a 5% commission on each sale.", "An accountant receives an annual salary of $68,000.", "The employer pays half of each worker&rsquo;s health-insurance premium.", "A cashier earns $16 per hour."], "ci": 2, "exp": "<b>Benefits</b> are non-wage compensation such as health insurance, retirement contributions, and paid time off. Hourly wages, commissions, and salaries are all forms of <b>direct pay</b> tied to time worked or performance."}, {"stem": "Role-play: you are an intern at an investment firm presenting to a manager (the judge). The judge asks a question about a regulation you have never heard of. What is the most professional response?", "opts": ["Telling the judge that the question is outside the scope of your role", "Making up a confident answer so that you do not look unprepared", "Saying &ldquo;I don&rsquo;t know&rdquo; and moving on to your next point", "&ldquo;I&rsquo;m not familiar with that specific regulation, but I&rsquo;d research it today and check with our compliance team before we finalize the plan, so we stay within the rules.&rdquo;"], "ci": 3, "exp": "Professionals are honest about what they don&rsquo;t know <b>and</b> show how they will find out. Admitting the gap, naming a concrete next step (research, compliance team), and linking it back to the plan shows integrity and initiative. Bluffing risks giving wrong information, a bare &ldquo;I don&rsquo;t know&rdquo; shows no problem-solving, and refusing the question seems uncooperative."}, {"stem": "A credit union&rsquo;s strategic plan sets the goal of growing membership by 10% in two years. Which is the best key performance indicator (KPI) to track progress toward this goal?", "opts": ["The average temperature in the branch lobbies", "The number of net new members added each quarter", "The number of employees who attended training this year", "The number of pages in the credit union&rsquo;s annual report"], "ci": 1, "exp": "A <b>KPI</b> is a measurable value that shows progress toward a specific objective. Since the goal is membership growth, tracking net new members each quarter shows directly whether the credit union is on pace (about 10% over 8 quarters). Training attendance, lobby temperature, and report length do not measure membership growth."}, {"stem": "Country A can produce either 10 tons of wheat or 5 machines with one unit of labor. Country B can produce either 6 tons of wheat or 6 machines with one unit of labor. According to comparative advantage, how should the countries specialize?", "opts": ["Neither should specialize, because each country can produce both goods.", "Country A should specialize in both goods because it produces more wheat per unit of labor.", "Country A should specialize in machines and Country B in wheat.", "Country A should specialize in wheat and Country B in machines."], "ci": 3, "exp": "Compare <b>opportunity costs</b>. For Country A, 1 machine costs 2 tons of wheat (10 &divide; 5); for Country B, 1 machine costs 1 ton of wheat. So B makes machines more cheaply. For wheat: A gives up 0.5 machine per ton; B gives up 1 machine per ton, so A makes wheat more cheaply. Each specializes where its opportunity cost is lower: A in wheat, B in machines. Having an <i>absolute</i> advantage in one good does not mean producing everything."}, {"stem": "During a team meeting at an insurance office, Devon notices that a usually talkative coworker has been silent, has her arms crossed, and avoids eye contact after her proposal was rejected. Which response shows the strongest emotional intelligence?", "opts": ["Checking in with her privately after the meeting to ask how she is doing and whether she would like help revising the proposal", "Ignoring her behavior, since emotions do not belong in a professional setting", "Pointing out to the whole group that she seems upset so that everyone can address it", "Telling the manager that the coworker is being unprofessional in meetings"], "ci": 0, "exp": "Emotional intelligence includes <b>social awareness</b> (noticing others&rsquo; emotions from nonverbal cues) and <b>relationship management</b> (responding appropriately). A private, supportive check-in respects her dignity and offers help. Calling her out publicly embarrasses her, ignoring her misses a chance to support a teammate, and reporting her escalates a normal emotional reaction."}, {"stem": "A regional bank moves its new management trainees through the loan department, customer service, and operations, spending three months in each. What is this training method called?", "opts": ["Job rotation", "Job enlargement", "Outsourcing", "Vestibule training"], "ci": 0, "exp": "<b>Job rotation</b> moves employees through different positions to build broad skills and understanding of the organization &mdash; common in management training. Job enlargement adds more tasks at the same level to one job, outsourcing hires an outside firm to do work, and vestibule training uses a simulated work area away from the real job."}, {"stem": "A small accounting firm is considering moving its client files from an office server to a cloud storage service. Which is a key concern the firm should evaluate before switching?", "opts": ["Whether the cloud service will eliminate the need for any passwords", "How the provider protects confidential client data and who can access it", "Whether the provider will require the firm to buy its own servers", "Whether cloud storage will make the firm&rsquo;s files impossible to share"], "ci": 1, "exp": "Cloud computing offers lower upfront costs, scalability, and remote access, but the firm hands its data to a third party. For an accounting firm holding confidential financial information, <b>data security, privacy, and access control</b> are the critical questions. Cloud services still require passwords, make sharing easier (not impossible), and do not require buying servers &mdash; avoiding that is one of their advantages."}, {"stem": "A school district needs 500 new laptops. It sends identical specifications to five suppliers and asks each to submit a price. What is this purchasing process called?", "opts": ["Consignment selling", "Requesting bids (competitive bidding)", "Reciprocal buying", "Drop shipping"], "ci": 1, "exp": "In <b>competitive bidding</b>, a buyer sends the same specifications to several suppliers and compares their offers, often choosing the best combination of price and quality. Reciprocal buying means buying from a supplier because it also buys from you, consignment means the seller is paid only after goods sell, and drop shipping has the supplier ship directly to the customer."}, {"stem": "A financial planning firm wants to sell complex retirement plans to small-business owners, who usually have many detailed questions. Which element of the promotional mix is most effective for this goal?", "opts": ["Coupons", "Personal selling", "Product placement in movies", "Billboard advertising"], "ci": 1, "exp": "<b>Personal selling</b> is two-way, face-to-face (or one-on-one) communication, ideal for complex, high-cost products where buyers need answers tailored to their situation. Billboards and product placement are one-way mass communication with no chance for questions, and coupons are a sales promotion tool better suited to simple, low-cost products."}, {"stem": "A bakery buys an oven for $12,000. It expects to use the oven for 5 years and then sell it for $2,000. Using straight-line depreciation, what is the annual depreciation expense?", "opts": ["$10,000", "$2,800", "$2,400", "$2,000"], "ci": 3, "exp": "Straight-line depreciation = (cost &minus; salvage value) &divide; useful life = ($12,000 &minus; $2,000) &divide; 5 = $10,000 &divide; 5 = <b>$2,000</b> per year. $2,400 ignores the salvage value (12,000 &divide; 5), $2,800 adds the salvage value instead of subtracting it (14,000 &divide; 5), and $10,000 is the total depreciation over all five years."}, {"stem": "During a recession, Congress cuts income taxes and increases spending on highway construction. What kind of economic policy is this?", "opts": ["Contractionary monetary policy", "Contractionary fiscal policy", "Expansionary fiscal policy", "Expansionary monetary policy"], "ci": 2, "exp": "<b>Fiscal policy</b> uses government taxing and spending; <b>monetary policy</b> is the central bank&rsquo;s control of money supply and interest rates. Cutting taxes and raising spending put more money into the economy, so this is <b>expansionary</b> fiscal policy, used to fight recessions. Contractionary fiscal policy would raise taxes or cut spending."}, {"stem": "In a role-play, a judge&rsquo;s performance indicator is &ldquo;Explain barriers to effective communication.&rdquo; You play a bank branch supervisor whose tellers keep misreading a new policy memo. Which statement would best address this PI?", "opts": ["&ldquo;The best way to communicate is always face-to-face, so from now on I will stop sending written memos entirely.&rdquo;", "&ldquo;The tellers need to read more carefully. I&rsquo;ll remind them that following policy is part of their job.&rdquo;", "&ldquo;Two barriers are getting in the way: the memo uses banking jargon that new tellers don&rsquo;t know, and it was emailed during our busiest hour, so people skimmed it. I&rsquo;ll rewrite it in plain language and walk through it at our morning huddle.&rdquo;", "&ldquo;Communication barriers are things that block messages, such as noise, jargon, and emotions. They are very important in business.&rdquo;"], "ci": 2, "exp": "A high-scoring PI answer <b>explains the concept and applies it to the situation</b>: it names specific barriers (jargon, poor timing) present in this branch and connects them to a fix. Reciting a textbook definition without applying it earns little; blaming the tellers ignores the PI; and an extreme rule (&ldquo;no memos ever&rdquo;) is not a realistic explanation of barriers."}, {"stem": "An insurance agency surveys customers about satisfaction by placing a link only on the page customers see after they file a successful claim. What is the main problem with this research method?", "opts": ["The sample is biased, because it reaches only customers who just had a positive experience.", "Online surveys cannot collect quantitative data.", "Satisfaction cannot be measured with a survey.", "The sample is too large to analyze accurately."], "ci": 0, "exp": "Good research needs a <b>representative sample</b>. Surveying only customers whose claims were just approved leaves out those whose claims were denied or delayed &mdash; the people most likely to be unhappy &mdash; so results will overstate satisfaction (selection bias). Large samples are generally better, online surveys can easily collect numbers, and surveys are a standard way to measure satisfaction."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
