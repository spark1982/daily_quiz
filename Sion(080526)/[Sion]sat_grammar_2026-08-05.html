<script>
(function(){

var QUIZ_KEY = "quiz_sionsatgrammar_20_20260804_v1";

var TAG_COLORS = {};
var TIMER_DEFAULT_MIN = 20;

var RAW_QUESTIONS = [{"tag": "Subject-Verb Agreement", "box": "A significant portion of the district's aging bridges, despite recent inspections and temporary repairs, _____ in need of complete structural replacement within the decade.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["remains", "remain", "have remained", "were remaining"], "ci": 0, "exp": "The subject of the sentence is the singular noun phrase 'a significant portion,' since 'portion' is the head noun and 'of the district's aging bridges' is a prepositional phrase modifying it, so the verb must be singular: 'remains'. 'remain' and 'have remained' incorrectly treat the subject as plural, and 'were remaining' shifts to an inconsistent past progressive form."}, {"tag": "Pronoun Reference", "box": "Because the museum's curators moved the sculptures before the new wing's climate-control system had been fully calibrated, _____ suffered noticeable cracking within a month.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the sculptures", "they", "the curators", "it"], "ci": 0, "exp": "Restating 'the sculptures' removes the ambiguity of a pronoun that could otherwise point to either the sculptures or the curators, and it matches the logical meaning, since sculptures, not curators, are what would crack. 'they' is ambiguous between the two plural nouns in the sentence. 'the curators' assigns the cracking to the wrong noun. 'it' incorrectly uses a singular pronoun for a plural antecedent."}, {"tag": "Parallel Structure", "box": "The grant committee expects applicants to outline their research goals, justify their proposed budget, and _____ a realistic timeline for completing the project.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["propose", "proposing", "to propose", "the proposal of"], "ci": 0, "exp": "The series already establishes a pattern with the bare infinitives 'outline' and 'justify' (both following 'expects applicants to'), so the third item must match with 'propose'. 'proposing' shifts to a gerund form that breaks the parallel structure. 'to propose' wrongly repeats the infinitive marker already established by 'to'. 'the proposal of' turns the verb into an awkward noun phrase that does not match the other two items."}, {"tag": "Modifier Placement", "box": "_____, the observatory's aging telescope could no longer resolve details on the planet's surface with any reliability.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Coated in decades of dust and grime", "Having coated the lens in decades of dust and grime", "Decades of dust and grime having coated it", "To coat it in decades of dust and grime"], "ci": 0, "exp": "'Coated in decades of dust and grime' functions as a modifier that logically describes 'the observatory's aging telescope,' the subject immediately following the comma, so the sentence reads clearly. 'Having coated the lens in decades of dust and grime' illogically implies the telescope did the coating rather than received it. 'Decades of dust and grime having coated it' creates a dangling construction with an unclear pronoun 'it' before its antecedent appears. 'To coat it in decades of dust and grime' implies purpose rather than a completed condition, which does not fit the sentence's meaning."}, {"tag": "Punctuation", "box": "The committee reviewed three proposals for the new transit line _____ each one promised to reduce commute times by at least twenty minutes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["; ", ", and", ", because", " and,"], "ci": 0, "exp": "Both clauses, 'The committee reviewed three proposals for the new transit line' and 'each one promised to reduce commute times by at least twenty minutes,' are independent, so a semicolon correctly joins them without a coordinating conjunction. ', and' would need a comma before a coordinating conjunction, which is present, but 'and' loosely joins the ideas without capturing that the second clause explains a shared feature of the proposals, making the semicolon the more precise, unbiased connection; still, the semicolon alone remains correct because it avoids implying a causal relationship the passage does not support the way ', because' would, and ' and,' places the comma in an ungrammatical position that no Standard English convention permits."}, {"tag": "Apostrophes", "box": "By the final week of the internship, the two interns had merged _____ research notes into a single shared document.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["their", "there", "they're", "its"], "ci": 0, "exp": "'their' is the possessive pronoun needed to show that the research notes belong to 'the two interns,' a plural antecedent. 'there' refers to location and does not show possession. 'they're' is a contraction of 'they are' and does not fit grammatically before a noun. 'its' is a singular possessive pronoun that does not agree with the plural antecedent 'the two interns.'"}, {"tag": "Concision", "box": "Rather than continuing to rely on outdated paper records, the clinic ultimately decided, after much internal debate and discussion, to fully and completely digitize its entire filing system.", "stem": "Which choice best revises the underlined portion to eliminate the redundancy while keeping the sentence's meaning?", "opts": ["decided to digitize its filing system", "decided, after much debate, to digitize its entire filing system fully", "decided, following internal discussion, to fully digitize its filing system completely", "ultimately decided to fully and completely digitize its filing system"], "ci": 0, "exp": "'decided to digitize its filing system' conveys the same essential meaning without the redundant pairings 'debate and discussion' and 'fully and completely,' both of which repeat a single idea using two words. The other options each retain at least one of these redundant pairs, so they remain wordier than necessary without adding new information."}, {"tag": "Verb Tense", "box": "Ever since the factory installed the new filtration system last spring, emissions from the plant _____ by nearly forty percent.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["have dropped", "dropped", "were dropping", "will drop"], "ci": 0, "exp": "The phrase 'ever since... last spring' signals an action that began in the past and continues to have relevance now, which calls for the present perfect tense 'have dropped.' 'dropped' suggests a completed action with no ongoing connection to the present. 'were dropping' incorrectly implies an interrupted past action. 'will drop' incorrectly places the change in the future, contradicting 'ever since... last spring.'"}, {"tag": "Transitions", "box": "The new bypass road significantly reduced traffic congestion downtown. _____, the surrounding neighborhoods reported a sharp rise in noise from vehicles rerouted onto residential streets.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["However", "Similarly", "Consequently", "For example"], "ci": 0, "exp": "'However' correctly signals the contrast between the bypass road's benefit, reduced downtown congestion, and its drawback, increased residential noise. 'Similarly' would wrongly suggest the two outcomes are alike rather than contrasting. 'Consequently' would wrongly suggest the noise resulted directly from the reduced congestion rather than from rerouted traffic. 'For example' would wrongly suggest that the rise in residential noise merely illustrates the downtown congestion problem rather than presenting an opposing effect."}, {"tag": "Pronoun Reference", "box": "When the negotiators presented their revised contract to the union representatives, _____ agreed to review the terms before the following Monday.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["the representatives", "they", "the negotiators", "those involved in it"], "ci": 0, "exp": "Restating 'the representatives' resolves the ambiguity created by a pronoun that could refer to either group mentioned in the first clause, and it matches the logical meaning, since the representatives, who received the contract, are the ones who would review it. 'they' is ambiguous between 'negotiators' and 'representatives.' 'the negotiators' assigns the reviewing action to the wrong group, since they presented rather than received the contract. 'those involved in it' is vague and does not clearly specify who is doing the reviewing."}, {"tag": "Comma Usage", "box": "The recipe, _____ was passed down through four generations of the family, calls for a spice blend that is no longer sold commercially.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["which", "that", "it", "and it"], "ci": 0, "exp": "'which' correctly introduces a nonrestrictive clause set off by commas, adding extra information about the recipe without limiting which recipe is meant. 'that' is generally reserved for restrictive clauses and is not typically set off by commas. 'it' would create a comma splice by inserting an independent clause without a conjunction. 'and it' awkwardly coordinates the modifying clause with the main clause rather than embedding it as a nonrestrictive modifier."}, {"tag": "Diction", "box": "The panel's recommendations, though well researched, had little _____ on the final policy, which had essentially been decided months earlier.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["effect", "affect", "affects", "effects"], "ci": 0, "exp": "'effect' is the noun meaning a result or influence, which fits the context of the recommendations having little influence on the policy. 'affect' is primarily a verb meaning to influence, so it does not fit as a noun following 'little.' 'affects' is a verb form and cannot follow the adjective 'little' in this position. 'effects' is plural and does not agree with the singular determiner 'little' as used here."}, {"tag": "Subject-Verb Agreement", "box": "Neither the lead engineer nor the junior technicians assigned to the project _____ aware of the software's undocumented dependency until the system failed during testing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "is", "has been"], "ci": 0, "exp": "In a 'neither... nor' construction, the verb agrees with the subject closer to it, which here is the plural 'the junior technicians,' so the plural verb 'were' is correct. 'was' and 'is' incorrectly treat the nearer subject as singular. 'has been' is both singular and in the wrong tense for a past event described elsewhere in the sentence."}, {"tag": "Parallel Structure", "box": "The volunteers spent the morning sorting donated clothing, organizing canned goods by expiration date, and _____ boxes for the afternoon delivery.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["labeling", "label", "to label", "having labeled"], "ci": 0, "exp": "The series established the pattern with the gerunds 'sorting' and 'organizing,' both following 'spent the morning,' so the third item must match with 'labeling.' 'label' breaks the parallel gerund form. 'to label' introduces an infinitive that does not match the established gerund pattern. 'having labeled' incorrectly suggests the labeling was completed before the other two actions rather than occurring alongside them."}, {"tag": "Modifier Placement", "box": "Originally intended only for internal use, employees across the company quickly began relying on the spreadsheet template for client-facing reports as well.", "stem": "Which choice most effectively revises the sentence to place the modifier logically?", "opts": ["Originally intended only for internal use, the spreadsheet template was quickly adopted by employees across the company for client-facing reports as well.", "Originally intended only for internal use, employees quickly adopted the spreadsheet template across the company for client-facing reports as well.", "The spreadsheet template, originally intended only for internal use by employees, was quickly adopted across the company for client-facing reports as well.", "Employees across the company, originally intended only for internal use, quickly began relying on the spreadsheet template for client-facing reports as well."], "ci": 0, "exp": "Placing 'the spreadsheet template' directly after the introductory modifier 'Originally intended only for internal use' correctly links the modifier to the noun it logically describes, since the template, not the employees, was intended for internal use. The remaining options each leave the modifier attached to 'employees' or otherwise misplace it, illogically suggesting that the employees were the ones originally intended for internal use."}, {"tag": "Concision", "box": "Due to the fact that the bridge's support cables had corroded significantly faster than engineers had originally anticipated, the city closed the crossing for emergency repairs.", "stem": "Which choice best revises the underlined portion to be more concise while keeping the sentence's meaning?", "opts": ["Because", "Due to the fact that, as a result of", "Owing to the fact that", "In light of the fact that"], "ci": 0, "exp": "'Because' conveys the same causal relationship as the wordy phrase 'due to the fact that' in a single word, making the sentence more concise without losing meaning. The remaining options either retain the wordy original phrase, combine two redundant causal phrases, or substitute one equally wordy phrase for another."}, {"tag": "Verb Tense", "box": "By the time the auditors finished reviewing the accounts, the finance director _____ three separate discrepancies to the board.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["had already reported", "already reported", "has already reported", "was already reporting"], "ci": 0, "exp": "'had already reported' uses the past perfect tense to show that the director's reporting was completed before the auditors finished reviewing, another past event, which is exactly the sequence the sentence describes. 'already reported' fails to clearly establish that the reporting happened before the reviewing was finished. 'has already reported' incorrectly uses the present perfect for an action set entirely in the past. 'was already reporting' incorrectly suggests an ongoing, interrupted action rather than a completed one."}, {"tag": "Transitions", "box": "The startup's founders had no formal training in manufacturing, and none of them had ever managed a factory floor. _____, within three years their company became the region's largest supplier of custom bicycle frames.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless", "Therefore", "In addition", "Specifically"], "ci": 0, "exp": "'Nevertheless' correctly signals the contrast between the founders' lack of relevant experience and their unexpected success. 'Therefore' would wrongly suggest that their success followed logically from their inexperience. 'In addition' would wrongly suggest that the company's rapid success simply adds a similar fact about the founders rather than contrasting with their lack of experience. 'Specifically' would wrongly suggest that the company's success merely narrows or clarifies the founders' lack of experience rather than opposing its implication."}, {"tag": "Pronoun-Antecedent Agreement", "box": "Each of the laboratory's research teams must submit _____ safety protocol for review before beginning any experiment involving hazardous materials.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["its", "their", "it's", "the team's own"], "ci": 0, "exp": "'Each' is a singular indefinite pronoun, and it refers back to 'research teams' treated individually, so the singular possessive 'its' correctly agrees with 'each.' 'their' incorrectly treats 'each' as plural. 'it's' is a contraction of 'it is' and cannot function as a possessive. 'the team's own' introduces an unnecessary and awkward shift away from the pronoun structure the sentence has already established with 'each.'"}, {"tag": "Punctuation", "box": "The exhibit features three artists working in radically different mediums _____ a sculptor, a muralist, and a sound installation designer.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": [": ", "; ", ", which are", " and"], "ci": 0, "exp": "A colon correctly introduces the list of the three artists' mediums after the independent clause 'The exhibit features three artists working in radically different mediums,' since a colon signals that specific examples will follow. A semicolon is reserved for joining two independent clauses, and the list that follows is not an independent clause. ', which are' adds an unnecessary relative clause that disrupts the sentence's flow. ' and' cannot properly introduce a three-item list without a preceding colon or other punctuation marking the transition."}];

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}
function R(idx,inner){var i=idx?'<span class="radical-index">'+idx+'</span>':'';return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>';}


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(q.tag){
    tagEl.style.display='inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagEl.style.display='none';
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
