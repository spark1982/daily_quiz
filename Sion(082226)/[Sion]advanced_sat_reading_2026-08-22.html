<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Advanced SAT Reading</title>
<style>
  :root{
    --blue:#185FA5;
    --track:#d7dde6;
    --red:#E24B4A;
    --green:#1D9E75;
    --purple:#7b61ff;
    --orange:#e8912d;
    --text:#1f2937;
    --sub:#5b6472;
    --bg:#ffffff;
    --card:#f7f9fc;
    --border:#e2e8f0;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    max-width:760px;
    margin:0 auto;
    padding:20px 16px 60px;
    line-height:1.5;
  }
  h1{font-size:1.4rem;margin:0 0 4px;}
  .instr{color:var(--sub);font-size:0.95rem;margin:0 0 18px;}
  .timer-widget{
    border:1px solid var(--border);
    background:var(--card);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:16px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    font-size:0.9rem;
  }
  .timer-widget input[type=number]{
    width:64px;
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:0.9rem;
  }
  .timer-widget button{
    padding:7px 14px;
    border:none;
    border-radius:6px;
    background:var(--blue);
    color:#fff;
    font-size:0.85rem;
    cursor:pointer;
  }
  .timer-display{
    font-weight:700;
    font-size:1.05rem;
    padding:4px 10px;
    border-radius:6px;
    background:var(--track);
    color:var(--text);
  }
  .timer-display.orange{background:var(--orange);color:#fff;}
  .timer-display.red{background:var(--red);color:#fff;}
  .progress-wrap{margin-bottom:10px;}
  .progress-label{font-size:0.85rem;color:var(--sub);margin-bottom:6px;}
  .progress-track{
    width:100%;
    height:10px;
    background:var(--track);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--blue);
    width:0%;
    transition:width .2s ease;
  }
  .jump-toggle{
    background:none;
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 10px;
    font-size:0.8rem;
    cursor:pointer;
    margin:8px 0;
    color:var(--blue);
  }
  .jump-panel{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    padding:10px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:14px;
  }
  .jump-panel.open{display:flex;}
  .jump-dot{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--track);
    color:var(--text);
    border:2px solid transparent;
    font-size:0.75rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .jump-dot.answered{background:var(--blue);color:#fff;}
  .jump-dot.wrong{background:var(--red);color:#fff;}
  .jump-dot.current{border-color:var(--text);}
  .slot-tag{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--blue);
    background:#eaf2fb;
    padding:3px 8px;
    border-radius:5px;
    margin-bottom:10px;
  }
  .card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    background:var(--bg);
    margin-bottom:16px;
  }
  .box-ctx{
    background:var(--card);
    border-left:4px solid var(--blue);
    border-radius:8px;
    padding:12px 14px;
    margin:10px 0 16px;
    font-size:0.95rem;
  }
  .qtext{font-weight:600;margin-bottom:14px;font-size:1.02rem;}
  .opt{
    display:block;
    width:100%;
    text-align:left;
    padding:11px 14px;
    margin-bottom:10px;
    border:1.5px solid var(--border);
    border-radius:9px;
    background:#fff;
    cursor:pointer;
    font-size:0.94rem;
    color:var(--text);
  }
  .opt:hover{border-color:var(--blue);}
  .opt.selected{border-color:var(--blue);background:#eaf2fb;}
  .opt.correct{border-color:var(--green);background:#e7f8f2;}
  .opt.incorrect{border-color:var(--red);background:#fdeceb;}
  .opt:disabled{cursor:default;}
  .nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
  .nav-row button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:var(--blue);
    color:#fff;
    font-size:0.92rem;
    cursor:pointer;
  }
  .nav-row button:disabled{background:var(--track);color:var(--sub);cursor:default;}
  .explain{
    margin-top:14px;
    padding:12px 14px;
    background:#fbfbfb;
    border:1px dashed var(--border);
    border-radius:8px;
    font-size:0.9rem;
    display:none;
  }
  .explain.show{display:block;}
  #resultsScreen{display:none;}
  .score-big{font-size:2rem;font-weight:800;color:var(--blue);margin:6px 0;}
  .btn-row{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .btn-row button{
    padding:12px 16px;
    border:none;
    border-radius:9px;
    font-size:0.95rem;
    cursor:pointer;
    color:#fff;
  }
  .btn-copy{background:var(--blue);}
  .btn-retry{background:var(--green);}
  .btn-save{background:var(--purple);}
  .btn-fresh1{background:var(--text);}
  .btn-fresh2{background:var(--sub);}
  .attempts-line{font-size:0.85rem;color:var(--sub);margin-top:10px;}
  .modal-overlay{
    display:none;
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.45);
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:12px;
    padding:22px;
    max-width:340px;
    width:90%;
    text-align:center;
  }
  .modal-box p{margin:0 0 16px;font-size:0.95rem;}
  .modal-btns{display:flex;gap:10px;justify-content:center;}
  .modal-btns button{
    padding:9px 16px;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:0.9rem;
  }
  .modal-confirm{background:var(--red);color:#fff;}
  .modal-cancel{background:var(--track);color:var(--text);}
  svg{max-width:100%;height:auto;}
  .review-item{border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:10px;font-size:0.88rem;}
  .review-item.bad{border-color:var(--red);}
</style>
</head>
<body>

<h1>[Sion] Advanced SAT Reading</h1>
<p class="instr">Read each passage and answer the questions.</p>

<div class="timer-widget" id="timerWidget">
  <label for="timeLimitInput">Set Time Limit (min):</label>
  <input type="number" id="timeLimitInput" min="1" max="180" value="20">
  <button id="startTimerBtn" type="button">Start</button>
  <span class="timer-display" id="timerDisplay">--:--</span>
</div>

<div id="quizScreen">
  <div class="progress-wrap">
    <div class="progress-label" id="progressLabel">Answered 0 / 12</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <button class="jump-toggle" id="jumpToggle" type="button">Jump to Question &#9660;</button>
  <div class="jump-panel" id="jumpPanel"></div>

  <div class="card">
    <div class="slot-tag" id="slotTag"></div>
    <div class="qtext" id="qText"></div>
    <div class="box-ctx" id="boxCtx"></div>
    <div id="optsWrap"></div>
    <div class="explain" id="explainWrap"></div>
  </div>

  <div class="nav-row">
    <button id="prevBtn" type="button">&#8592; Previous</button>
    <button id="nextBtn" type="button">Next &#8594;</button>
  </div>
</div>

<div id="resultsScreen">
  <div class="card">
    <h2>Results</h2>
    <div class="score-big" id="scoreBig"></div>
    <div id="reviewList"></div>
    <div class="attempts-line" id="attemptsLine"></div>
    <div class="btn-row">
      <button class="btn-copy" id="copyAllBtn" type="button">Copy All Results</button>
      <button class="btn-retry" id="retryWrongBtn" type="button">Retry Wrong Ones</button>
      <button class="btn-save" id="saveWrongBtn" type="button">Save Wrong Answers</button>
      <button class="btn-fresh1" id="freshOrigBtn" type="button">Start Fresh (Original Order)</button>
      <button class="btn-fresh2" id="freshRandBtn" type="button">Start Fresh (Random Order)</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p id="modalText">Are you sure?</p>
    <div class="modal-btns">
      <button class="modal-cancel" id="modalCancelBtn" type="button">Cancel</button>
      <button class="modal-confirm" id="modalConfirmBtn" type="button">Confirm</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var QUIZ_KEY = "quiz_sionadvsatreading_12_20260821_v1";
  var ATT_KEY = "quiz_sionadvsatreading_20260821_att_v1";
  var ORDER_KEY = "quiz_sionadvsatreading_ordermode_20260821_v1";

  var CHART_SVG = '<svg viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="20" y1="180" x2="310" y2="180" stroke="#5b6472" stroke-width="1.5"/>' +
    '<line x1="180" y1="15" x2="180" y2="180" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="5,4"/>' +
    '<text x="182" y="14" font-size="10" fill="#E24B4A">Loyalty card launched</text>' +
    '<rect x="40" y="84" width="50" height="96" fill="#185FA5"/>' +
    '<text x="65" y="78" font-size="11" text-anchor="middle" fill="#1f2937">120</text>' +
    '<text x="65" y="196" font-size="10" text-anchor="middle" fill="#5b6472">Week 1</text>' +
    '<rect x="110" y="80" width="50" height="100" fill="#185FA5"/>' +
    '<text x="135" y="74" font-size="11" text-anchor="middle" fill="#1f2937">125</text>' +
    '<text x="135" y="196" font-size="10" text-anchor="middle" fill="#5b6472">Week 2</text>' +
    '<rect x="180" y="40" width="50" height="140" fill="#1D9E75"/>' +
    '<text x="205" y="34" font-size="11" text-anchor="middle" fill="#1f2937">175</text>' +
    '<text x="205" y="196" font-size="10" text-anchor="middle" fill="#5b6472">Week 3</text>' +
    '<rect x="250" y="34" width="50" height="146" fill="#1D9E75"/>' +
    '<text x="275" y="28" font-size="11" text-anchor="middle" fill="#1f2937">182</text>' +
    '<text x="275" y="196" font-size="10" text-anchor="middle" fill="#5b6472">Week 4</text>' +
    '<text x="20" y="205" font-size="10" fill="#5b6472">Weekly customer visits</text>' +
    '</svg>';

  var QUESTIONS = [
    {
      slot: "Command of Evidence: If True",
      q: "The owner of a small coffee shop introduced a loyalty punch-card program at the start of Week 3, shown in the graph. The owner claims the loyalty card was the primary cause of the increase in weekly customer visits. Which finding, if true, would most undermine the owner's claim?",
      box: CHART_SVG,
      opts: [
        "A nearby competing coffee shop unexpectedly closed for renovations for six weeks starting in Week 3, sending its regular customers elsewhere.",
        "The loyalty card required customers to make five purchases before earning a free drink.",
        "The shop's marketing manager personally believed the loyalty card was responsible for the growth in visits.",
        "The shop's total weekly revenue also increased during the same period that customer visits rose."
      ],
      ci: 0,
      exp: "The nearby competitor's closure gives an alternative explanation that lines up exactly with when the visit increase began, so it directly undermines the claim that the loyalty card caused the change. The detail about requiring five purchases only describes how the program worked, without addressing what caused the increase in visits. The marketing manager's personal belief is an opinion, not evidence, so it does not undermine or support the claim. The rise in total revenue does not undermine the claim; if anything, it is consistent with more customers visiting, so it does not point to an alternative cause."
    },
    {
      slot: "Command of Evidence: If True",
      q: "After a mid-sized school district shifted its high school start time from 7:30 a.m. to 8:45 a.m. last year, standardized test scores among sophomores rose by an average of 6 points. District administrators attribute the improvement primarily to students getting more sleep due to the later start time. Which additional finding, if true, would most strongly support the administrators' claim?",
      box: "After a mid-sized school district shifted its high school start time from 7:30 a.m. to 8:45 a.m. last year, standardized test scores among sophomores rose by an average of 6 points. District administrators attribute the improvement primarily to students getting more sleep due to the later start time.",
      opts: [
        "Sleep researchers tracked the same students and found their average nightly sleep increased by roughly 50 minutes after the schedule change, with the largest test score gains among students who slept the most additional minutes.",
        "Parents reported that the later start time made morning routines less stressful for the whole family.",
        "The district also purchased new textbooks for the sophomore class the same year the schedule changed.",
        "Teachers said they personally preferred teaching later in the morning."
      ],
      ci: 0,
      exp: "Directly linking increased sleep minutes to the size of each student's test score gain provides strong evidence that more sleep, caused by the later start time, drove the improvement. Parents finding mornings 'less stressful' describes a quality-of-life benefit, not evidence connecting sleep to test scores. The new textbooks introduce a separate, unaddressed factor that could explain the score increase instead of the schedule change, so it does not support the administrators' specific claim. Teachers' personal scheduling preferences say nothing about student sleep or test performance."
    },
    {
      slot: "Central Ideas and Details",
      q: "Which choice best states the central idea of the text?",
      box: "Elena had spent her career translating other people's books, careful never to let her own voice slip into the sentences she carried from one language into another. Fidelity, she believed, was the translator's only real virtue: not elegance, not originality, but the discipline to disappear entirely behind someone else's words. It was strange work for a woman who had once dreamed of writing her own novel, yet she found in this constant self-erasure a peculiar kind of freedom, as though invisibility were its own reward.",
      opts: [
        "Elena finds an unexpected sense of freedom in subordinating her own voice entirely to the authors she translates.",
        "Elena regrets abandoning her dream of writing her own novel and wishes she had pursued it instead.",
        "Elena believes that elegance and originality are more important than accuracy in translation work.",
        "Elena struggles to suppress her own writing style whenever she works on a translation."
      ],
      ci: 0,
      exp: "The text states Elena finds 'a peculiar kind of freedom' in the self-erasure her work requires, directly matching this choice. The choice about regretting her abandoned novel is not supported; the text only notes it was 'strange work for a woman who had once dreamed of writing her own novel,' without describing regret. The choice about valuing elegance and originality over accuracy directly contradicts the text, which states fidelity, not elegance or originality, is 'the translator's only real virtue.' The choice about struggling to suppress her voice misrepresents the text, which describes her discipline as something she has mastered and finds rewarding, not something she struggles against."
    },
    {
      slot: "Central Ideas and Details",
      q: "Which choice best states the central idea of the text?",
      box: "Captain Reyes had crossed the strait more times than he could count, yet he still walked the deck each dawn checking lines that younger sailors swore were already secure. He had seen what a single overlooked knot could do to a ship in open water, and no number of uneventful crossings had ever convinced him that caution was no longer necessary. The younger crew called it habit; Reyes called it the only thing standing between routine and disaster.",
      opts: [
        "Captain Reyes continues his careful inspections because he understands that past safety does not guarantee future safety.",
        "Captain Reyes inspects the lines each morning mainly to set an example of discipline for the younger sailors.",
        "Captain Reyes no longer worries about safety because he has crossed the strait so many times without incident.",
        "Captain Reyes believes the younger crew members are careless and cannot be trusted with inspections."
      ],
      ci: 0,
      exp: "The text states Reyes views his caution as 'the only thing standing between routine and disaster,' showing he continues his checks because he knows past safety does not guarantee future safety. The choice about setting an example is not supported by the text, which never mentions a motive involving the younger sailors' behavior. The choice claiming he no longer worries about safety directly contradicts the passage, which shows his continued vigilance despite years of uneventful crossings. The choice about distrusting the younger crew overreaches; the text only notes their differing opinion, calling his diligence 'habit,' not that Reyes distrusts their abilities."
    },
    {
      slot: "Command of Evidence: Textual Evidence",
      q: "Which quotation from the text most directly supports the claim that Whitfield believed unexplained failures were more valuable than expected successes?",
      box: "Dr. Amara Whitfield kept a locked drawer in her laboratory filled with nothing but her failed experiments, results other researchers would have discarded without a second glance. Her graduate students initially found the practice strange, assuming she simply disliked throwing things away. But Whitfield insisted the drawer held her most valuable data. 'Every experiment that fails for a reason I do not yet understand,' she often said, 'is worth more to me than one that succeeds for a reason I already knew.' Three of her most cited papers began as failures pulled from that very drawer.",
      opts: [
        "'Every experiment that fails for a reason I do not yet understand,' she often said, 'is worth more to me than one that succeeds for a reason I already knew.'",
        "Dr. Amara Whitfield kept a locked drawer in her laboratory filled with nothing but her failed experiments, results other researchers would have discarded without a second glance.",
        "Her graduate students initially found the practice strange, assuming she simply disliked throwing things away.",
        "Three of her most cited papers began as failures pulled from that very drawer."
      ],
      ci: 0,
      exp: "This is Whitfield's own quoted statement, and it makes the exact comparison the claim describes: failures she does not yet understand are worth more to her than successes she already understood. The sentence about the locked drawer only describes her habit of keeping failed experiments, not her stated reasoning for valuing them. The sentence about her students' assumption describes a mistaken guess about her motive, not Whitfield's actual belief. The sentence about her cited papers describes an outcome of the practice, not the belief itself."
    },
    {
      slot: "Command of Evidence: Textual Evidence",
      q: "Which quotation from the text most directly supports the claim that Ilunga believed the old telescope's long history of data made it valuable in a way newer telescopes could not match?",
      box: "When the observatory's oldest telescope was scheduled for decommissioning, astronomer Dr. Felix Ilunga campaigned to keep it running for one more season. Younger colleagues argued that newer instruments made the old telescope obsolete. Ilunga did not dispute their technical point, but he countered that the telescope's decades of consistent, unbroken data made it uniquely suited to detecting slow changes that no new instrument could yet confirm. 'A newer eye sees more detail,' he wrote in his appeal, 'but only an old eye remembers what the sky looked like thirty years ago.'",
      opts: [
        "'A newer eye sees more detail,' he wrote in his appeal, 'but only an old eye remembers what the sky looked like thirty years ago.'",
        "When the observatory's oldest telescope was scheduled for decommissioning, astronomer Dr. Felix Ilunga campaigned to keep it running for one more season.",
        "Younger colleagues argued that newer instruments made the old telescope obsolete.",
        "Ilunga did not dispute their technical point about the newer instruments."
      ],
      ci: 0,
      exp: "This is Ilunga's own quoted statement, and it makes exactly the comparison the claim describes: new telescopes offer more detail, but only the old telescope carries decades of memory no new instrument can match. The sentence about his campaign to keep the telescope running only describes his action, not his stated reasoning. The sentence about younger colleagues' argument describes an opposing viewpoint, not Ilunga's own belief. The sentence noting that he did not dispute the technical point only describes what he conceded, without stating why he still valued the old telescope."
    },
    {
      slot: "Inferences",
      q: "Which choice is the most reasonable inference based on the text?",
      box: "Every evening at exactly six o'clock, Mr. Alderman set two places at his dining table, though he had lived alone since his wife's passing three years earlier. He ate his meal slowly, occasionally speaking aloud to the empty chair across from him, then cleared both plates as though the meal had truly been shared. His neighbors, aware of his routine through the thin apartment walls, never mentioned it, and Mr. Alderman never explained it to anyone who asked.",
      opts: [
        "Setting a second place each evening is likely a way for Mr. Alderman to maintain a connection to his late wife.",
        "Mr. Alderman is expecting a dinner guest who consistently fails to arrive on time.",
        "Mr. Alderman's neighbors have complained to him about the noise from his nightly routine.",
        "Mr. Alderman has forgotten that his wife has passed away and genuinely believes she still lives with him."
      ],
      ci: 0,
      exp: "The consistent nightly ritual involving a second place setting, performed only after his wife's passing and continued for years, most reasonably suggests a way of preserving a connection to her memory, without requiring an explanation the text does not provide. The choice about an expected guest is not supported, since the text gives no indication anyone is expected to arrive. The choice about neighbor complaints directly contradicts the text, which states the neighbors 'never mentioned it.' The choice claiming Mr. Alderman has forgotten his wife's passing goes far beyond what the text supports, since he is described as speaking 'as though' the meal were shared, phrasing that suggests deliberate ritual rather than genuine confusion."
    },
    {
      slot: "Inferences",
      q: "Which choice is the most reasonable inference based on the text?",
      box: "The startup's quarterly report showed that employee turnover had dropped to its lowest rate in company history, coinciding with the introduction of a four-day work week six months earlier. The same report noted that the company had also raised its average salary by 12 percent and expanded its health benefits during that same six-month period.",
      opts: [

        "The four-day work week was definitely the primary cause of the reduced employee turnover.",

    },
    {
      slot: "Cross-Text Connections",
      q: "How would the author of Text 2 most likely respond to the argument in Text 1?",
      box: "Text 1: Nutritionists have traditionally recommended that athletes consume simple carbohydrates immediately after intense exercise, arguing that rapid sugar absorption replenishes muscle glycogen most efficiently during this narrow post-workout window.<br><br>Text 2: A recent meta-analysis of endurance athletes found that total daily carbohydrate intake, not the specific timing of consumption after exercise, was the strongest predictor of glycogen recovery, suggesting the so-called 'window' may matter far less than previously assumed.",
      opts: [
        "By suggesting that the emphasis on a narrow post-workout timing window is likely overstated, since total daily intake appears to matter more.",
        "By agreeing that the timing of carbohydrate consumption after exercise is the single most important factor in glycogen recovery.",
        "By proposing that athletes avoid carbohydrates entirely in order to maximize glycogen recovery.",
        "By conceding that simple carbohydrates are ineffective at replenishing glycogen under any circumstances."
      ],
      ci: 0,
      exp: "Text 2 directly states that total daily intake, not timing, was 'the strongest predictor,' and that the 'window' may matter 'far less than previously assumed,' which is exactly this response. The choice claiming agreement that timing is 'the single most important factor' contradicts Text 2's explicit finding. The choice about avoiding carbohydrates entirely proposes something neither text discusses. The choice claiming simple carbohydrates are 'ineffective... under any circumstances' contradicts Text 2, which questions the importance of timing, not the value of carbohydrates themselves."
    },
    {
      slot: "Cross-Text Connections",
      q: "How does Text 2 relate to the finding presented in Text 1?",
      box: "Text 1: City health officials reported that installing free water bottle refill stations in public parks led to a modest decrease in single-use plastic bottle sales at nearby convenience stores over an eighteen-month period.<br><br>Text 2: A separate study examining twenty cities with similar refill station programs found that the decrease in plastic bottle sales was substantially larger in cities that paired refill stations with public awareness campaigns about plastic waste, and comparatively small in cities that installed stations without any accompanying campaign.",
      opts: [
        "It builds on Text 1's finding by identifying an additional factor, paired public awareness campaigns, that appears to make refill stations more effective at reducing plastic bottle sales.",
        "It contradicts Text 1's finding by showing that refill stations have no effect on plastic bottle sales in any city.",
        "It shifts focus away from plastic bottle sales entirely to examine recycling program funding instead.",
        "It questions whether the city health officials in Text 1 measured bottle sales accurately."
      ],
      ci: 0,
      exp: "Text 2 extends Text 1's finding by identifying the specific condition, pairing stations with awareness campaigns, under which the reduction in bottle sales becomes 'substantially larger.' The choice describing a contradiction is wrong because Text 2 never claims refill stations have 'no effect'; it shows the effect varies by condition. The choice about recycling program funding is unsupported, since Text 2 remains focused on refill stations and bottle sales. The choice about questioning measurement accuracy is unsupported, since Text 2 presents additional findings rather than a critique of Text 1's methodology."
    },
    {
      slot: "Transitions",
      q: "Which choice completes the text with the most logically precise transition?",
      box: "The committee had spent eighteen months drafting a policy it believed would satisfy every stakeholder involved. ____ the moment the draft was released publicly, representatives from three separate advocacy groups announced their intent to challenge it in court.",
      opts: [
        "Yet",
        "Similarly,",
        "As a result,",
        "In other words,"
      ],
      ci: 0,
      exp: "'Yet' correctly signals the contrast between the committee's eighteen months of careful preparation and the immediate, unexpected legal challenges that followed. 'Similarly' is wrong because it implies the second sentence matches or resembles the first, rather than contrasting with it. 'As a result' is wrong because it implies the legal challenges were caused by the drafting process itself, rather than arising in spite of the committee's efforts. 'In other words' is wrong because it implies the second sentence restates the first sentence's idea, rather than introducing a contrasting outcome."
    },
    {
      slot: "Transitions",
      q: "Which choice completes the text with the most logically precise transition?",
      box: "Marine biologists had long assumed that the deep-sea creatures living near hydrothermal vents could not survive outside those narrow, mineral-rich environments. ____ recent expeditions have discovered several vent species thriving in unrelated deep-sea habitats hundreds of miles away.",
      opts: [
        "However,",
        "For example,",
        "Therefore,",
        "Similarly,"
      ],
      ci: 0,
      exp: "'However' correctly signals the contrast between the long-held assumption about vent species and the new discovery that contradicts it. 'For example' is wrong because it implies the second sentence merely illustrates the first sentence's claim, rather than opposing it. 'Therefore' is wrong because it implies the discovery is a logical consequence of the earlier assumption, when it actually undermines that assumption. 'Similarly' is wrong because it implies the second sentence matches the pattern described in the first, rather than contradicting it."
    }
  ];

  var TOTAL = QUESTIONS.length;

  function safeGet(key){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  function safeSet(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }
    catch(e){ /* ignore */ }
  }

  function shuffleArr(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function buildOptShuffles(){
    var out = [];
    for(var i=0;i<TOTAL;i++){
      out.push(shuffleArr([0,1,2,3]));
    }
    return out;
  }

  function freshState(orderMode){
    var baseOrder = [];
    for(var i=0;i<TOTAL;i++) baseOrder.push(i);
    var order = orderMode === "random" ? shuffleArr(baseOrder) : baseOrder;
    return {
      orderMode: orderMode,
      order: order,
      optShuffle: buildOptShuffles(),
      answers: new Array(TOTAL).fill(null),
      current: 0,
      timeLimitMin: null,
      deadline: null,
      timerRunning: false,
      retryMode: false,
      retryQuestionIds: null
    };
  }

  var state = safeGet(QUIZ_KEY);
  if(!state){
    var savedOrderMode = safeGet(ORDER_KEY);
    state = freshState(savedOrderMode && savedOrderMode.mode ? savedOrderMode.mode : "original");
  }

  function persist(){
    safeSet(QUIZ_KEY, state);
  }

  // ---------- DOM refs ----------
  var quizScreen = document.getElementById("quizScreen");
  var resultsScreen = document.getElementById("resultsScreen");
  var slotTag = document.getElementById("slotTag");
  var qText = document.getElementById("qText");
  var boxCtx = document.getElementById("boxCtx");
  var optsWrap = document.getElementById("optsWrap");
  var explainWrap = document.getElementById("explainWrap");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var progressLabel = document.getElementById("progressLabel");
  var progressFill = document.getElementById("progressFill");
  var jumpToggle = document.getElementById("jumpToggle");
  var jumpPanel = document.getElementById("jumpPanel");
  var timeLimitInput = document.getElementById("timeLimitInput");
  var startTimerBtn = document.getElementById("startTimerBtn");
  var timerDisplay = document.getElementById("timerDisplay");
  var scoreBig = document.getElementById("scoreBig");
  var reviewList = document.getElementById("reviewList");
  var attemptsLine = document.getElementById("attemptsLine");
  var modalOverlay = document.getElementById("modalOverlay");
  var modalText = document.getElementById("modalText");
  var modalCancelBtn = document.getElementById("modalCancelBtn");
  var modalConfirmBtn = document.getElementById("modalConfirmBtn");

  function activeOrder(){
    return state.retryMode ? state.retryQuestionIds : state.order;
  }

  function currentQIndex(){
    return activeOrder()[state.current];
  }

  // ---------- Rendering ----------
  function renderJumpPanel(){
    jumpPanel.innerHTML = "";
    var ord = activeOrder();
    for(var pos=0; pos<ord.length; pos++){
      var qIdx = ord[pos];
      var dot = document.createElement("div");
      dot.className = "jump-dot";
      dot.textContent = (pos+1);
      if(state.answers[qIdx] !== null){
        dot.classList.add("answered");
        if(state.answers[qIdx] !== QUESTIONS[qIdx].ci){
          dot.classList.add("wrong");
        }
      }
      if(pos === state.current){
        dot.classList.add("current");
      }
      (function(p){
        dot.addEventListener("click", function(){
          state.current = p;
          persist();
          renderQuestion();
        });
      })(pos);
      jumpPanel.appendChild(dot);
    }
  }

  function renderProgress(){
    var answeredCount = 0;
    var ord = activeOrder();
    for(var i=0;i<ord.length;i++){
      if(state.answers[ord[i]] !== null) answeredCount++;
    }
    progressLabel.textContent = "Answered " + answeredCount + " / " + ord.length;
    progressFill.style.width = Math.round((answeredCount/ord.length)*100) + "%";
  }

  function renderQuestion(){
    var ord = activeOrder();
    var qIdx = ord[state.current];
    var qd = QUESTIONS[qIdx];
    slotTag.textContent = qd.slot;
    qText.textContent = qd.q;
    boxCtx.innerHTML = qd.box;

    var order4 = state.optShuffle[qIdx];
    optsWrap.innerHTML = "";
    var picked = state.answers[qIdx];

    for(var p=0; p<4; p++){
      var underlyingIdx = order4[p];
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt";
      btn.textContent = qd.opts[underlyingIdx];
      if(picked !== null){
        btn.disabled = true;
        if(underlyingIdx === qd.ci){
          btn.classList.add("correct");
        } else if(underlyingIdx === picked){
          btn.classList.add("incorrect");
        }
        if(underlyingIdx === picked){
          btn.classList.add("selected");
        }
      }
      (function(uIdx){
        btn.addEventListener("click", function(){
          window.selectOption(qIdx, uIdx);
        });
      })(underlyingIdx);
      optsWrap.appendChild(btn);
    }

    if(picked !== null){
      explainWrap.innerHTML = "<strong>Explanation:</strong> " + qd.exp;
      explainWrap.classList.add("show");
    } else {
      explainWrap.innerHTML = "";
      explainWrap.classList.remove("show");
    }

    prevBtn.disabled = (state.current === 0);
    if(state.current === ord.length - 1){
      nextBtn.textContent = "Show Results →";
      nextBtn.disabled = false;
    } else {
      nextBtn.textContent = "Next →";
      nextBtn.disabled = false;
    }

    renderProgress();
    renderJumpPanel();
  }

  window.selectOption = function(qIdx, underlyingIdx){
    if(state.answers[qIdx] !== null) return;
    state.answers[qIdx] = underlyingIdx;
    persist();
    renderQuestion();
  };

  prevBtn.addEventListener("click", function(){
    if(state.current > 0){
      state.current--;
      persist();
      renderQuestion();
    }
  });

  nextBtn.addEventListener("click", function(){
    var ord = activeOrder();
    if(state.current < ord.length - 1){
      state.current++;
      persist();
      renderQuestion();
    } else {
      goToResults();
    }
  });

  jumpToggle.addEventListener("click", function(){
    jumpPanel.classList.toggle("open");
  });

  // ---------- Timer ----------
  var timerInterval = null;

  function formatTime(ms){
    if(ms < 0) ms = 0;
    var totalSec = Math.floor(ms/1000);
    var m = Math.floor(totalSec/60);
    var s = totalSec % 60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }

  function tickTimer(){
    if(!state.timerRunning || !state.deadline){
      timerDisplay.textContent = "--:--";
      timerDisplay.classList.remove("orange","red");
      return;
    }
    var remaining = state.deadline - Date.now();
    var totalMs = state.timeLimitMin * 60000;
    if(remaining <= 0){
      timerDisplay.textContent = "Time's Up";
      timerDisplay.classList.add("red");
      state.timerRunning = false;
      persist();
      if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
      return;
    }
    timerDisplay.textContent = formatTime(remaining);
    var pct = remaining / totalMs;
    timerDisplay.classList.remove("orange","red");
    if(pct <= 0.10){ timerDisplay.classList.add("red"); }
    else if(pct <= 0.25){ timerDisplay.classList.add("orange"); }
  }

  startTimerBtn.addEventListener("click", function(){
    var mins = parseFloat(timeLimitInput.value);
    if(!mins || mins <= 0) mins = 20;
    state.timeLimitMin = mins;
    state.deadline = Date.now() + mins*60000;
    state.timerRunning = true;
    persist();
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tickTimer, 1000);
    tickTimer();
  });

  function resumeTimerIfNeeded(){
    if(state.timerRunning && state.deadline){
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(tickTimer, 1000);
      tickTimer();
      if(state.timeLimitMin){
        timeLimitInput.value = state.timeLimitMin;
      }
    }
  }

  // ---------- Results ----------
  function computeScore(){
    var correct = 0;
    var ord = activeOrder();
    for(var i=0;i<ord.length;i++){
      var qIdx = ord[i];
      if(state.answers[qIdx] === QUESTIONS[qIdx].ci) correct++;
    }
    return { correct: correct, total: ord.length };
  }

  function goToResults(){
    quizScreen.style.display = "none";
    resultsScreen.style.display = "block";

    var sc = computeScore();
    scoreBig.textContent = sc.correct + " / " + sc.total + " correct";

    reviewList.innerHTML = "";
    var ord = activeOrder();
    for(var i=0;i<ord.length;i++){
      var qIdx = ord[i];
      var qd = QUESTIONS[qIdx];
      var picked = state.answers[qIdx];
      var isCorrect = picked === qd.ci;
      var div = document.createElement("div");
      div.className = "review-item" + (isCorrect ? "" : " bad");
      var pickedText = picked !== null ? qd.opts[picked] : "(not answered)";
      var correctText = qd.opts[qd.ci];
      div.innerHTML = "<strong>Q" + (i+1) + " (" + qd.slot + "):</strong> " + qd.q +
        "<br><em>Your answer:</em> " + pickedText +
        (isCorrect ? "" : ("<br><em>Correct answer:</em> " + correctText));
      reviewList.appendChild(div);
    }

    var attempts = safeGet(ATT_KEY);
    var count = (typeof attempts === "number") ? attempts : 0;
    count += 1;
    safeSet(ATT_KEY, count);
    attemptsLine.textContent = "Total Attempts: " + count;

    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }

  window.saveWrongAnswers = function(){
    try{
      var ord = activeOrder();
      var wrong = [];
      for(var i=0;i<ord.length;i++){
        var qIdx = ord[i];
        var qd = QUESTIONS[qIdx];
        var picked = state.answers[qIdx];
        if(picked !== qd.ci){
          wrong.push({
            q: qd.q,
            opts: qd.opts,
            ci: qd.ci,
            picked: picked
          });
        }
      }
      if(wrong.length === 0){
        alert("No wrong answers to save. Great job!");
        return;
      }
      var payload = {
        child: "Sion",
        subject: "[Sion] Advanced SAT Reading",
        date: "2026-08-22",
        wrong: wrong
      };
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "sion_advanced_sat_reading_wrong_answers.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(err){
      alert("Could not save wrong answers.");
    }
  };

  document.getElementById("saveWrongBtn").addEventListener("click", function(){
    window.saveWrongAnswers();
  });

  window.copyAllResults = function(){
    var ord = activeOrder();
    var lines = [];
    lines.push("[Sion] Advanced SAT Reading - Results");
    var sc = computeScore();
    lines.push("Score: " + sc.correct + " / " + sc.total);
    for(var i=0;i<ord.length;i++){
      var qIdx = ord[i];
      var qd = QUESTIONS[qIdx];
      var picked = state.answers[qIdx];
      var pickedText = picked !== null ? qd.opts[picked] : "(not answered)";
      var correctText = qd.opts[qd.ci];
      lines.push((i+1) + ". " + qd.q);
      lines.push("   Your answer: " + pickedText);
      lines.push("   Correct answer: " + correctText);
    }
    var text = lines.join("\n");
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          alert("Results copied to clipboard.");
        }, function(){
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }catch(err){
      fallbackCopy(text);
    }
  };

  function fallbackCopy(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      alert("Results copied to clipboard.");
    }catch(e){
      alert("Could not copy results automatically. Please copy manually.");
    }
  }

  document.getElementById("copyAllBtn").addEventListener("click", function(){
    window.copyAllResults();
  });

  window.retryWrongOnes = function(){
    var ord = activeOrder();
    var wrongIds = [];
    for(var i=0;i<ord.length;i++){
      var qIdx = ord[i];
      var qd = QUESTIONS[qIdx];
      if(state.answers[qIdx] !== qd.ci){
        wrongIds.push(qIdx);
      }
    }
    if(wrongIds.length === 0){
      alert("No wrong answers to retry. Great job!");
      return;
    }
    state.retryMode = true;
    state.retryQuestionIds = wrongIds;
    for(var j=0;j<wrongIds.length;j++){
      state.answers[wrongIds[j]] = null;
    }
    state.current = 0;
    persist();
    resultsScreen.style.display = "none";
    quizScreen.style.display = "block";
    renderQuestion();
  };

  document.getElementById("retryWrongBtn").addEventListener("click", function(){
    window.retryWrongOnes();
  });

  // ---------- Start Fresh (custom modal) ----------
  var pendingFreshMode = null;

  function openModal(msg, onConfirm){
    modalText.textContent = msg;
    modalOverlay.classList.add("show");
    modalConfirmBtn.onclick = function(){
      modalOverlay.classList.remove("show");
      onConfirm();
    };
    modalCancelBtn.onclick = function(){
      modalOverlay.classList.remove("show");
    };
  }

  function doStartFresh(mode){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    state = freshState(mode);
    persist();
    safeSet(ORDER_KEY, {mode: mode});
    resultsScreen.style.display = "none";
    quizScreen.style.display = "block";
    jumpPanel.classList.remove("open");
    timerDisplay.textContent = "--:--";
    timerDisplay.classList.remove("orange","red");
    timeLimitInput.value = 20;
    renderQuestion();
  }

  document.getElementById("freshOrigBtn").addEventListener("click", function(){
    openModal("Start fresh with questions in original order? This will erase your current progress.", function(){
      doStartFresh("original");
    });
  });

  document.getElementById("freshRandBtn").addEventListener("click", function(){
    openModal("Start fresh with questions in random order? This will erase your current progress.", function(){
      doStartFresh("random");
    });
  });

  // ---------- Init ----------
  function init(){
    if(state.current === undefined || state.current === null) state.current = 0;
    if(!state.optShuffle || state.optShuffle.length !== TOTAL){
      state.optShuffle = buildOptShuffles();
    }
    persist();
    resumeTimerIfNeeded();
    renderQuestion();
  }

  init();
})();
</script>
</body>
</html>
