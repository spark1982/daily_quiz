<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Grammar</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 18px 60px 18px;
    background: #f4f6f9;
    color: #1f2530;
  }
  h1 {
    font-size: 26px;
    margin: 10px 0 4px 0;
    color: #14213d;
  }
  .instructions {
    font-size: 15px;
    color: #4a5568;
    margin: 0 0 18px 0;
  }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .attempts {
    font-size: 14px;
    font-weight: 600;
    color: #14213d;
  }
  .timer-widget {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .timer-widget input {
    width: 56px;
    padding: 5px 6px;
    border: 1px solid #d7dde6;
    border-radius: 6px;
    font-size: 14px;
  }
  .timer-widget button {
    background: #14213d;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #timerDisplay {
    font-weight: 700;
    font-size: 16px;
    min-width: 58px;
    display: inline-block;
    color: #14213d;
  }
  #timerDisplay.orange { color: #FF9500; }
  #timerDisplay.red { color: #D93025; }
  .navwrap {
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .navline {
    font-size: 14px;
    font-weight: 600;
    color: #14213d;
    margin-bottom: 8px;
  }
  .progressbar {
    height: 10px;
    width: 100%;
    background: #d7dde6;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progressfill {
    height: 100%;
    background: #185FA5;
    width: 0%;
    transition: width 0.2s ease;
  }
  #toggleDotsBtn {
    background: #eef2f7;
    color: #14213d;
    border: 1px solid #d7dde6;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .dots-panel {
    display: grid;
    grid-template-columns: repeat(auto-fill, 26px);
    gap: 8px;
    margin-top: 12px;
  }
  .dots-panel.hidden { display: none; }
  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #d7dde6;
    color: #14213d;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    font-weight: 700;
  }
  .dot.correct { background: #185FA5; color: #ffffff; }
  .dot.wrong { background: #E24B4A; color: #ffffff; }
  .card {
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 20px;
  }
  .qcount {
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .context-box {
    background: #f0f4fa;
    border-left: 4px solid #185FA5;
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.55;
    color: #1f2530;
    margin-bottom: 16px;
  }
  .qtext {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
    color: #14213d;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: #ffffff;
    border: 1.5px solid #d7dde6;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14.5px;
    cursor: pointer;
    color: #1f2530;
  }
  .opt:hover { border-color: #185FA5; }
  .opt.selected { border-color: #185FA5; background: #eaf1fb; }
  .opt.correctPick { border-color: #1D9E75; background: #e5f7f0; }
  .opt.wrongPick { border-color: #E24B4A; background: #fbe9e9; }
  .opt.revealCorrect { border-color: #1D9E75; background: #e5f7f0; }
  .opt:disabled { cursor: default; }
  .explanation {
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #f7f8fa;
    border: 1px solid #d7dde6;
    font-size: 14px;
    line-height: 1.5;
    color: #333c48;
    display: none;
  }
  .explanation.show { display: block; }
  .navbtns {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    gap: 10px;
  }
  .navbtns button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
    font-weight: 600;
  }
  #prevBtn { background: #eef2f7; color: #14213d; }
  #nextBtn { background: #185FA5; color: #ffffff; }
  #nextBtn:disabled { background: #b9c6d6; cursor: not-allowed; }
  .resultsBtns {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }
  .resultsBtns button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #ffffff;
  }
  #copyBtn { background: #14213d; }
  #retryBtn { background: #1D9E75; }
  #saveWrongBtn { background: #7b61ff; }
  #freshOrigBtn { background: #34495E; }
  #freshRandBtn { background: #2C3E50; }
  .scoreLine {
    font-size: 20px;
    font-weight: 700;
    color: #14213d;
    margin-bottom: 14px;
  }
  .reviewItem {
    border-bottom: 1px solid #e5e9ef;
    padding: 12px 0;
    font-size: 14px;
  }
  .reviewItem:last-child { border-bottom: none; }
  .reviewItem .rq { font-weight: 600; margin-bottom: 4px; color: #14213d; }
  .reviewItem .rline { margin: 2px 0; }
  .rcorrect { color: #1D9E75; font-weight: 700; }
  .rwrong { color: #E24B4A; font-weight: 700; }
  .hidden { display: none !important; }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(20,33,61,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-box {
    background: #ffffff;
    border-radius: 10px;
    padding: 22px;
    max-width: 360px;
    width: 90%;
    text-align: center;
  }
  .modal-box p { font-size: 15px; color: #14213d; margin-bottom: 18px; }
  .modal-box button {
    padding: 9px 16px;
    border-radius: 7px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin: 0 6px;
  }
  #modalYesBtn { background: #185FA5; color: #ffffff; }
  #modalNoBtn { background: #eef2f7; color: #14213d; }
</style>
</head>
<body>
<div class="app">
  <h1>[Sion] SAT Grammar</h1>
  <p class="instructions">Choose the best way to revise or complete each passage.</p>

  <div class="topbar">
    <div class="attempts">Total Attempts: <span id="attemptsCount">0</span></div>
    <div class="timer-widget">
      <label for="timeLimitInput">Set Time Limit (min):</label>
      <input type="number" id="timeLimitInput" min="1" max="180" value="20">
      <button onclick="startTimer()">Start</button>
      <span id="timerDisplay">20:00</span>
    </div>
  </div>

  <div class="navwrap" id="navwrap">
    <div class="navline"><span id="answeredCount">0</span>/<span id="totalCount">20</span> answered</div>
    <div class="progressbar"><div class="progressfill" id="progressFill"></div></div>
    <button id="toggleDotsBtn" onclick="toggleDots()">Jump to Question</button>
    <div id="dotsPanel" class="dots-panel hidden"></div>
  </div>

  <div id="quizArea"></div>
  <div id="resultsArea" class="hidden"></div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <p id="modalText">Are you sure?</p>
    <button id="modalYesBtn" onclick="modalConfirmYes()">Yes, Start Fresh</button>
    <button id="modalNoBtn" onclick="modalConfirmNo()">Cancel</button>
  </div>
</div>

<script>
var QUESTIONS = [
  {
    q: "Which choice provides the punctuation needed to set off the nonessential information in the sentence?",
    context: "The bridge's original architect, _____ overruled by the city council on nearly every major design decision, never publicly criticized the finished structure.",
    opts: ["who had been", "who was", "had been", "being"],
    ci: 0,
    exp: "\"who had been\" correctly introduces a nonrestrictive relative clause, set off by commas on both sides, that adds extra information about the architect without being essential to identifying who is meant. \"had been\" removes the relative pronoun needed to properly connect the clause to \"architect,\" leaving the sentence without a clear grammatical link. \"being\" creates an awkward, informal construction that does not fit the sentence's formal tone and clear cause of the overruling."
  },
  {
    q: "Which choice most logically introduces the sentence, given the relationship between the two ideas?",
    context: "The startup's founders had promised investors a working prototype within six months. _____, after eighteen months and three missed deadlines, they had produced only a set of design sketches.",
    opts: ["For example,", "Likewise,", "Consequently,", "Instead,"],
    ci: 3,
    exp: "\"Instead,\" correctly signals that what actually happened, producing only sketches after eighteen months, replaces or contradicts what was originally promised. \"Consequently,\" wrongly suggests that the delay was a direct result of the promise itself rather than a failure to meet it. \"Likewise,\" wrongly treats the two sentences as similar or parallel rather than contrasting a promise with a shortfall."
  },
  {
    q: "Which choice most clearly resolves the vague reference created by the underlined pronoun?",
    context: "The city council debated the proposal for nearly four hours without reaching a vote, and <u>this</u> frustrated residents who had been waiting to speak.",
    opts: ["this situation that occurred", "this", "this thing", "this delay"],
    ci: 3,
    exp: "\"this delay\" replaces the vague pronoun \"this\" with a specific noun that clearly identifies what frustrated the residents, namely the four-hour debate without a vote. \"this situation that occurred\" is wordier but still vague, since \"situation\" does not specify what actually happened. \"this thing\" is even less precise than the original pronoun and fails to clarify what frustrated the residents."
  },
  {
    q: "Which choice provides the punctuation needed to correctly introduce the list that follows?",
    context: "The renovation plan addressed three long-standing complaints_____ inadequate lighting in the stairwells, a lack of accessible entrances, and outdated fire alarms.",
    opts: [",", ";", ":", " and"],
    ci: 2,
    exp: "A colon is correct because the phrase before it, \"The renovation plan addressed three long-standing complaints,\" is a complete independent clause that logically introduces the list that follows. A comma alone is not strong enough punctuation to introduce a list following a complete independent clause in formal writing. A semicolon is used to join two independent clauses or separate complex list items, not to introduce a list from a preceding independent clause."
  },
  {
    q: "Which choice best completes the sentence so that the introductory phrase logically modifies the subject that follows?",
    context: "_____, the museum's east wing remained closed to visitors for another eighteen months.",
    opts: ["Once inspectors discovered structural damage in the ceiling beams", "Structural damage having been discovered in the ceiling beams", "After structural damage was discovered in the ceiling beams", "Having discovered structural damage in the ceiling beams"],
    ci: 0,
    exp: "\"Once inspectors discovered structural damage in the ceiling beams\" supplies its own subject, \"inspectors,\" so the sentence does not require the introductory phrase to modify \"the museum's east wing,\" avoiding a dangling modifier. \"Having discovered structural damage in the ceiling beams\" has no stated subject and would illogically suggest that the museum's east wing itself discovered the damage. \"Structural damage having been discovered in the ceiling beams\" awkwardly shifts the sentence's focus onto the damage rather than setting up a clear actor before the main clause."
  },
  {
    q: "Which choice most logically completes the sentence, given the concession the writer is making?",
    context: "Critics of the new irrigation system point out that it requires a substantial upfront investment and years of maintenance before yields improve. _____ farmers in the pilot region have adopted it at a rate far higher than agricultural officials predicted.",
    opts: ["As a result,", "Similarly,", "In addition,", "Nevertheless,"],
    ci: 3,
    exp: "\"Nevertheless,\" correctly signals the concession between the system's real drawbacks, described in the first sentence, and the surprising fact that farmers still adopted it anyway. \"As a result,\" wrongly implies the adoption rate was caused by the drawbacks just mentioned. \"Similarly,\" wrongly treats the two sentences as parallel rather than contrasting."
  },
  {
    q: "Which choice most effectively edits the sentence to eliminate unnecessary wordiness?",
    context: "Due to the fact that the bridge was closed for repairs, commuters were forced to take a different alternate route to work.",
    opts: ["Owing to the fact that the bridge was closed for repairs, commuters took an alternate route to work.", "Because the bridge was closed for repairs, commuters were forced to take a different alternate route to work.", "Due to the fact that the bridge was closed for repairs, commuters had to take an alternate route to work.", "Because the bridge was closed for repairs, commuters had to take an alternate route to work."],
    ci: 3,
    exp: "\"Because the bridge was closed for repairs, commuters had to take an alternate route to work\" replaces the wordy phrase \"due to the fact that\" with the concise \"because\" and removes the redundant pairing of \"different\" and \"alternate,\" which mean nearly the same thing. The original sentence keeps both of these problems, the wordy \"due to the fact that\" and the redundant \"different alternate route.\" \"Owing to the fact that the bridge was closed for repairs, commuters took an alternate route to work\" still uses a wordy phrase, \"owing to the fact that,\" instead of the more concise \"because.\""
  },
  {
    q: "Which choice completes the sentence with a verb that agrees with its subject?",
    context: "The collection of essays assembled by the retiring diplomats, many of whom served in conflict zones for decades, _____ a rare firsthand account of Cold War-era negotiations.",
    opts: ["have offered", "offers", "offer", "were offering"],
    ci: 1,
    exp: "\"offers\" agrees with the singular subject \"The collection,\" since \"of essays\" and the long modifying phrase about the diplomats are not part of the subject. \"offer\" incorrectly treats the sentence as having a plural subject, likely by agreeing with the nearby plural noun \"diplomats\" instead of \"collection.\" \"were offering\" introduces a past progressive tense that does not fit the sentence's present-tense description of the book's content."
  },
  {
    q: "Which choice completes the sentence with the verb form that agrees with its subject?",
    context: "Neither the lead engineer nor the two technicians assigned to the project _____ aware that the backup generator had been disconnected during testing.",
    opts: ["was", "has been", "were", "is"],
    ci: 2,
    exp: "\"were\" is correct because in a \"neither...nor\" construction, the verb agrees with the noun closer to it, which here is the plural \"the two technicians.\" \"was\" incorrectly agrees with the singular \"the lead engineer\" rather than the closer plural noun. \"has been\" introduces present perfect tense that does not match the past-tense context established by the rest of the sentence."
  },
  {
    q: "Which choice most effectively completes the sentence while maintaining the parallel structure established earlier in the sentence?",
    context: "The internship prepared Maya for a career in journalism by teaching her to verify sources quickly, to write under strict deadlines, and _____.",
    opts: ["to conduct interviews with difficult subjects", "interviews with difficult subjects were something she learned to conduct", "she learned to conduct interviews with difficult subjects", "conducting interviews with difficult subjects was another skill she learned"],
    ci: 0,
    exp: "\"to conduct interviews with difficult subjects\" matches the infinitive form used in \"to verify sources quickly\" and \"to write under strict deadlines,\" keeping all three items in the list grammatically parallel. \"she learned to conduct interviews with difficult subjects\" breaks the list by turning the third item into a full independent clause. \"conducting interviews with difficult subjects was another skill she learned\" abandons the infinitive pattern entirely and restructures the item as its own sentence fragment."
  },
  {
    q: "Which choice places the modifier so that the sentence most clearly expresses its intended meaning?",
    context: "_____ the report warns that the region's aquifer could be permanently depleted.",
    opts: ["The report, based on preliminary but still incomplete data,", "Preliminary but still incomplete, the report is based on data,", "Based on preliminary but still incomplete data,", "Based on data that is preliminary but still incomplete,"],
    ci: 2,
    exp: "\"Based on preliminary but still incomplete data,\" placed at the start of the sentence, clearly modifies \"the report\" that immediately follows, making clear that the report itself relies on incomplete data. \"The report, based on preliminary but still incomplete data,\" awkwardly interrupts the subject and verb with the modifying phrase, making the sentence harder to follow even though it is not strictly ungrammatical. \"Preliminary but still incomplete, the report is based on data,\" illogically suggests that the report itself, rather than the data, is preliminary and incomplete."
  },
  {
    q: "Which choice completes the sentence with the correct possessive form?",
    context: "The two committees released a joint statement acknowledging that the delay was, in the _____ own words, \"an entirely avoidable failure of coordination.\"",
    opts: ["committees", "committees's", "committee's", "committees'"],
    ci: 3,
    exp: "\"committees'\" correctly forms the plural possessive of \"committees,\" showing that the words being quoted belong jointly to both committees mentioned earlier in the sentence. \"committee's\" incorrectly treats the noun as singular, when the sentence has already established that two committees are involved. \"committees's\" is not a standard English possessive form for a plural noun already ending in s."
  },
  {
    q: "Which choice completes the sentence with the pronoun form required by its grammatical role?",
    context: "The award will be given to _____ the committee determines has made the greatest contribution to the field this year.",
    opts: ["who", "whoever", "whomever", "whom"],
    ci: 1,
    exp: "\"whoever\" is correct because it functions as the subject of the verb \"has made\" within the clause \"whoever...has made the greatest contribution,\" not as the object of the earlier verb \"determines.\" \"whom\" would only be correct if the pronoun were the object of a verb or preposition, which it is not here. \"whomever\" makes the same case error as \"whom,\" incorrectly treating the pronoun as an object rather than the subject of \"has made.\""
  },
  {
    q: "Which choice completes the sentence with the verb form appropriate to the hypothetical situation being described?",
    context: "If the survey data _____ accurate, the city's water usage projections for next summer would need to be revised downward significantly.",
    opts: ["will be", "was", "were", "is"],
    ci: 2,
    exp: "\"were\" is the correct subjunctive form used in a hypothetical or contrary-to-fact conditional clause introduced by \"if,\" matching the conditional \"would need to be revised\" later in the sentence. \"was\" incorrectly uses the ordinary past tense rather than the subjunctive form required in this type of hypothetical construction. \"is\" incorrectly uses the present tense, which does not match the hypothetical, conditional framing signaled by \"would need to be revised.\""
  },
  {
    q: "Which choice best maintains the parallel structure established by the correlative conjunction in the sentence?",
    context: "The committee's proposal would not only reduce the department's operating budget but also _____ several long-standing research positions.",
    opts: ["eliminate", "would eliminate", "eliminating", "the elimination of"],
    ci: 0,
    exp: "\"eliminate\" matches the base verb form \"reduce\" that follows \"not only,\" keeping the two halves of the \"not only...but also\" construction grammatically parallel. \"eliminating\" shifts unexpectedly into a gerund, breaking the parallel with the earlier verb \"reduce.\" \"would eliminate\" adds an unnecessary modal verb that does not match the plain form \"reduce\" used in the first half of the construction."
  },
  {
    q: "Which choice most effectively completes the sentence without introducing unnecessary repetition?",
    context: "The new zoning law, which was written to reduce redundant and unnecessary duplication in building permit requirements, _____.",
    opts: ["narrowly passed the city council by a margin that was small", "passed the city council by a narrow margin", "was passed and approved by the city council in a close vote", "passed the city council by a small and narrow margin"],
    ci: 1,
    exp: "\"passed the city council by a narrow margin\" states the outcome without repeating the same idea twice. \"passed the city council by a small and narrow margin\" needlessly pairs two words, \"small\" and \"narrow,\" that mean essentially the same thing. \"narrowly passed the city council by a margin that was small\" repeats the idea of narrowness twice, once in the adverb \"narrowly\" and again in the phrase \"margin that was small.\""
  },
  {
    q: "Which choice completes the sentence with the verb form that agrees with its subject?",
    context: "Among the many challenges facing the new administration _____ a housing shortage that has persisted for nearly a decade.",
    opts: ["is", "has been", "are", "were"],
    ci: 0,
    exp: "\"is\" agrees with the singular subject \"a housing shortage,\" which appears after the verb in this inverted sentence structure beginning with \"Among the many challenges.\" \"are\" incorrectly treats the subject as plural, likely by mistaking the earlier plural noun \"challenges\" for the actual subject of the sentence. \"were\" both mismatches the singular subject in number and shifts incorrectly into the past tense, which does not fit the sentence's present-tense description of an ongoing shortage."
  },
  {
    q: "Which choice completes the sentence with the verb tense that best reflects the sequence of events described?",
    context: "By the time investigators arrived at the warehouse, the fire _____ for nearly three hours, leaving little of the original structure intact.",
    opts: ["had been burning", "has burned", "burned", "burns"],
    ci: 0,
    exp: "\"had been burning\" uses the past perfect progressive to show that the fire had already been in progress for a stretch of time before the investigators' arrival, which is itself a past event. \"burned\" only places the fire in the simple past, without clarifying that it had been ongoing before the investigators showed up. \"has burned\" incorrectly uses the present perfect, which would tie the fire's duration to the present moment rather than to the investigators' arrival in the past."
  },
  {
    q: "Which choice provides the most effective punctuation for the underlined portion?",
    context: "The archive had never been fully catalogued <u>researchers, therefore, resorted</u> to sifting through unlabeled boxes by hand.",
    opts: ["catalogued; researchers, therefore, resorted", "catalogued, researchers therefore resorted", "catalogued, researchers, therefore, resorted", "catalogued researchers, therefore, resorted"],
    ci: 0,
    exp: "A semicolon correctly joins the two independent clauses, \"The archive had never been fully catalogued\" and \"researchers, therefore, resorted to sifting through unlabeled boxes by hand,\" while the commas around \"therefore\" correctly set off the interrupting transitional word. Using only a comma before \"researchers\" creates a comma splice, since both sides of the comma are independent clauses. Leaving out all punctuation between \"catalogued\" and \"researchers\" creates a run-on sentence."
  },
  {
    q: "Which choice most clearly and logically completes the sentence?",
    context: "When Dr. Alvarez handed her findings to Dr. Chen for peer review, _____ had already suspected that the original data set contained a calibration error.",
    opts: ["her colleague", "she", "the scientist", "he"],
    ci: 2,
    exp: "\"the scientist\" avoids the ambiguity created by \"she\" or \"he,\" since the sentence introduces two people, Dr. Alvarez and Dr. Chen, and a pronoun alone would leave it unclear which of them already suspected the error. \"her colleague\" is also ambiguous, since it is unclear whether it refers to Dr. Chen as Dr. Alvarez's colleague or to some other unnamed colleague. Repeating a specific noun phrase like \"the scientist\" only resolves the ambiguity if paired with enough context to make clear which scientist is meant, which \"her colleague\" fails to do."
  }
];

var STORAGE_STATE = "quiz_sionsatgrammar_20_20260821_v1";
var STORAGE_ATT = "quiz_sionsatgrammar_20260821_att_v1";
var STORAGE_ORDER = "quiz_sionsatgrammar_order_20260821_v1";

var state = null;
var timerInterval = null;
var pendingModalAction = null;

function defaultOrder() {
  var arr = [];
  for (var i = 0; i < QUESTIONS.length; i++) arr.push(i);
  return arr;
}

function defaultState() {
  return {
    order: defaultOrder(),
    answers: new Array(QUESTIONS.length).fill(null),
    current: 0,
    mode: "normal",
    retryQueue: [],
    retryAnswers: {},
    retryCurrent: 0,
    timer: { limitMin: 20, startTs: null, running: false },
    resultsShown: false
  };
}

function loadOrder() {
  try {
    var raw = localStorage.getItem(STORAGE_ORDER);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === QUESTIONS.length) return arr;
    }
  } catch (e) {}
  return defaultOrder();
}

function saveOrder(order) {
  try { localStorage.setItem(STORAGE_ORDER, JSON.stringify(order)); } catch (e) {}
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_STATE);
    if (raw) {
      var parsed = JSON.parse(raw);
      var d = defaultState();
      for (var k in d) { if (parsed[k] === undefined) parsed[k] = d[k]; }
      if (!Array.isArray(parsed.answers) || parsed.answers.length !== QUESTIONS.length) {
        parsed.answers = new Array(QUESTIONS.length).fill(null);
      }
      return parsed;
    }
  } catch (e) {}
  return defaultState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_STATE, JSON.stringify(state)); } catch (e) {}
}

function loadAttempts() {
  try {
    var raw = localStorage.getItem(STORAGE_ATT);
    var n = parseInt(raw, 10);
    if (!isNaN(n)) return n;
  } catch (e) {}
  return 0;
}

function saveAttempts(n) {
  try { localStorage.setItem(STORAGE_ATT, String(n)); } catch (e) {}
}

function incrementAttempts() {
  var n = loadAttempts() + 1;
  saveAttempts(n);
  updateAttemptsDisplay();
}

function updateAttemptsDisplay() {
  var el = document.getElementById("attemptsCount");
  if (el) el.textContent = String(loadAttempts());
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function activeList() {
  if (state.mode === "retry") {
    return {
      positions: state.retryQueue,
      getAnswer: function (pos) { return state.retryAnswers[pos] || null; },
      setAnswer: function (pos, val) { state.retryAnswers[pos] = val; state.answers[pos] = val; },
      getPointer: function () { return state.retryCurrent; },
      setPointer: function (p) { state.retryCurrent = p; }
    };
  }
  return {
    positions: state.order.map(function (_, i) { return i; }),
    getAnswer: function (pos) { return state.answers[pos]; },
    setAnswer: function (pos, val) { state.answers[pos] = val; },
    getPointer: function () { return state.current; },
    setPointer: function (p) { state.current = p; }
  };
}

function init() {
  state = loadState();
  state.order = loadOrder();
  updateAttemptsDisplay();
  bindTimerResume();
  if (state.resultsShown) {
    renderResults(false);
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  document.getElementById("resultsArea").classList.add("hidden");
  document.getElementById("navwrap").classList.remove("hidden");
  var quizArea = document.getElementById("quizArea");
  quizArea.classList.remove("hidden");

  var al = activeList();
  var posList = al.positions;
  var pointer = al.getPointer();

  if (posList.length === 0) {
    quizArea.innerHTML = "<div class=\"card\"><p>No questions to show.</p></div>";
    return;
  }
  if (pointer >= posList.length) {
    finishRun();
    return;
  }

  var pos = posList[pointer];
  var qIndex = state.order[pos];
  var question = QUESTIONS[qIndex];
  var existing = al.getAnswer(pos);
  var isLast = (pointer === posList.length - 1);

  var html = "";
  html += "<div class=\"card\">";
  html += "<div class=\"qcount\">Question " + (pointer + 1) + " of " + posList.length + "</div>";
  html += "<div class=\"context-box\">" + question.context + "</div>";
  html += "<div class=\"qtext\">" + escapeHtml(question.q) + "</div>";
  html += "<div id=\"optsWrap\">";
  for (var i = 0; i < question.opts.length; i++) {
    var cls = "opt";
    if (existing) {
      if (i === question.ci) cls += " revealCorrect";
      else if (i === existing.picked) cls += " wrongPick";
    }
    html += "<button class=\"" + cls + "\" " + (existing ? "disabled" : "") + " onclick=\"selectOption(" + i + ")\">" + escapeHtml(question.opts[i]) + "</button>";
  }
  html += "</div>";
  html += "<div class=\"explanation" + (existing ? " show" : "") + "\" id=\"expBox\">" + (existing ? escapeHtml(question.exp) : "") + "</div>";
  html += "<div class=\"navbtns\">";
  html += "<button id=\"prevBtn\" onclick=\"prevQuestion()\" " + (pointer === 0 ? "disabled" : "") + ">&larr; Prev</button>";
  var nextDisabled = (!isLast && !existing) ? "disabled" : "";
  var nextLabel = isLast ? "Show Results →" : "Next →";
  html += "<button id=\"nextBtn\" onclick=\"nextQuestion()\" " + nextDisabled + ">" + nextLabel + "</button>";
  html += "</div>";
  html += "</div>";

  quizArea.innerHTML = html;
  updateNav();
  renderDots();
}

function selectOption(i) {
  var al = activeList();
  var posList = al.positions;
  var pointer = al.getPointer();
  var pos = posList[pointer];
  var qIndex = state.order[pos];
  var question = QUESTIONS[qIndex];
  if (al.getAnswer(pos)) return;
  var correct = (i === question.ci);
  al.setAnswer(pos, { picked: i, correct: correct });
  saveState();
  renderQuestion();
}

function nextQuestion() {
  var al = activeList();
  var pointer = al.getPointer();
  al.setPointer(pointer + 1);
  saveState();
  renderQuestion();
}

function prevQuestion() {
  var al = activeList();
  var pointer = al.getPointer();
  if (pointer > 0) {
    al.setPointer(pointer - 1);
    saveState();
    renderQuestion();
  }
}

function jumpTo(pos) {
  var al = activeList();
  var idx = al.positions.indexOf(pos);
  if (idx === -1) return;
  al.setPointer(idx);
  saveState();
  renderQuestion();
}

function toggleDots() {
  var panel = document.getElementById("dotsPanel");
  var btn = document.getElementById("toggleDotsBtn");
  if (panel.classList.contains("hidden")) {
    panel.classList.remove("hidden");
    btn.textContent = "Hide Questions";
  } else {
    panel.classList.add("hidden");
    btn.textContent = "Jump to Question";
  }
}

function renderDots() {
  var al = activeList();
  var posList = al.positions;
  var panel = document.getElementById("dotsPanel");
  var html = "";
  for (var i = 0; i < posList.length; i++) {
    var pos = posList[i];
    var ans = al.getAnswer(pos);
    var cls = "dot";
    if (ans) cls += ans.correct ? " correct" : " wrong";
    html += "<button class=\"" + cls + "\" onclick=\"jumpTo(" + pos + ")\">" + (i + 1) + "</button>";
  }
  panel.innerHTML = html;
}

function updateNav() {
  var al = activeList();
  var posList = al.positions;
  var answeredCount = 0;
  for (var i = 0; i < posList.length; i++) {
    if (al.getAnswer(posList[i])) answeredCount++;
  }
  document.getElementById("answeredCount").textContent = String(answeredCount);
  document.getElementById("totalCount").textContent = String(posList.length);
  var pct = posList.length ? (answeredCount / posList.length) * 100 : 0;
  document.getElementById("progressFill").style.width = pct + "%";
}

function finishRun() {
  incrementAttempts();
  state.resultsShown = true;
  saveState();
  renderResults(true);
}

function renderResults(justFinished) {
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("navwrap").classList.add("hidden");
  var resultsArea = document.getElementById("resultsArea");
  resultsArea.classList.remove("hidden");

  var total = state.order.length;
  var correctCount = 0;
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && state.answers[i].correct) correctCount++;
  }

  var html = "";
  html += "<div class=\"card\">";
  html += "<div class=\"scoreLine\">Score: " + correctCount + " / " + total + "</div>";
  html += "<div class=\"resultsBtns\">";
  html += "<button id=\"copyBtn\" onclick=\"copyAllResults()\">Copy All Results</button>";
  html += "<button id=\"retryBtn\" onclick=\"retryWrongOnes()\">Retry Wrong Ones</button>";
  html += "<button id=\"saveWrongBtn\" onclick=\"saveWrongAnswers()\">틀린 문제 저장</button>";
  html += "<button id=\"freshOrigBtn\" onclick=\"startFreshOriginal()\">Start Fresh (Original Order)</button>";
  html += "<button id=\"freshRandBtn\" onclick=\"startFreshRandom()\">Start Fresh (Random Order)</button>";
  html += "</div>";
  html += "<div id=\"reviewList\">";
  for (var p = 0; p < state.order.length; p++) {
    var qIndex = state.order[p];
    var question = QUESTIONS[qIndex];
    var ans = state.answers[p];
    html += "<div class=\"reviewItem\">";
    html += "<div class=\"rq\">Q" + (p + 1) + ". " + escapeHtml(question.q) + "</div>";
    if (ans) {
      html += "<div class=\"rline\">Your answer: " + escapeHtml(question.opts[ans.picked]) + "</div>";
      html += "<div class=\"rline\">Correct answer: " + escapeHtml(question.opts[question.ci]) + "</div>";
      html += "<div class=\"rline " + (ans.correct ? "rcorrect" : "rwrong") + "\">" + (ans.correct ? "Correct" : "Incorrect") + "</div>";
    } else {
      html += "<div class=\"rline\">Not answered</div>";
    }
    html += "</div>";
  }
  html += "</div>";
  html += "</div>";
  resultsArea.innerHTML = html;
}

function retryWrongOnes() {
  var wrongPositions = [];
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && !state.answers[i].correct) wrongPositions.push(i);
  }
  if (wrongPositions.length === 0) {
    alert("No wrong answers to retry.");
    return;
  }
  state.mode = "retry";
  state.retryQueue = wrongPositions;
  state.retryAnswers = {};
  state.retryCurrent = 0;
  state.resultsShown = false;
  saveState();
  renderQuestion();
}

function saveWrongAnswers() {
  var wrong = [];
  for (var i = 0; i < state.answers.length; i++) {
    var ans = state.answers[i];
    if (ans && !ans.correct) {
      var qIndex = state.order[i];
      var question = QUESTIONS[qIndex];
      wrong.push({ q: question.q, opts: question.opts, ci: question.ci, picked: ans.picked });
    }
  }
  if (wrong.length === 0) {
    alert("No wrong answers to save.");
    return;
  }
  try {
    var payload = { child: "Sion", subject: "[Sion] SAT Grammar", date: "2026-08-22", wrong: wrong };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "sion_sat_grammar_wrong_answers.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) {
    alert("Could not save wrong answers.");
  }
}

function copyAllResults() {
  var lines = [];
  lines.push("[Sion] SAT Grammar Results");
  var correctCount = 0;
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && state.answers[i].correct) correctCount++;
  }
  lines.push("Score: " + correctCount + " / " + state.order.length);
  lines.push("");
  for (var p = 0; p < state.order.length; p++) {
    var qIndex = state.order[p];
    var question = QUESTIONS[qIndex];
    var ans = state.answers[p];
    lines.push("Q" + (p + 1) + ": " + question.q);
    if (ans) {
      lines.push("Your answer: " + question.opts[ans.picked]);
      lines.push("Correct answer: " + question.opts[question.ci]);
      lines.push("Result: " + (ans.correct ? "Correct" : "Incorrect"));
    } else {
      lines.push("Not answered");
    }
    lines.push("");
  }
  var text = lines.join("\n");
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        alert("Results copied to clipboard.");
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  } catch (e) {
    try { fallbackCopy(text); } catch (e2) {}
  }
}

function fallbackCopy(text) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("Results copied to clipboard.");
  } catch (e) {
    alert("Could not copy results.");
  }
}

function startFreshOriginal() {
  pendingModalAction = "original";
  document.getElementById("modalText").textContent = "Start fresh with questions in the original order? This will reset all progress and the timer.";
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function startFreshRandom() {
  pendingModalAction = "random";
  document.getElementById("modalText").textContent = "Start fresh with questions in random order? This will reset all progress and the timer.";
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function modalConfirmYes() {
  var newOrder = (pendingModalAction === "random") ? shuffleArray(defaultOrder()) : defaultOrder();
  saveOrder(newOrder);
  state = defaultState();
  state.order = newOrder;
  saveState();
  document.getElementById("modalOverlay").classList.add("hidden");
  pendingModalAction = null;
  stopTimerInterval();
  updateTimerDisplay();
  renderQuestion();
}

function modalConfirmNo() {
  document.getElementById("modalOverlay").classList.add("hidden");
  pendingModalAction = null;
}

function startTimer() {
  var input = document.getElementById("timeLimitInput");
  var minutes = parseInt(input.value, 10);
  if (isNaN(minutes) || minutes <= 0) minutes = 20;
  state.timer.limitMin = minutes;
  state.timer.startTs = Date.now();
  state.timer.running = true;
  saveState();
  startTimerInterval();
}

function bindTimerResume() {
  if (state.timer && state.timer.running && state.timer.startTs) {
    startTimerInterval();
  } else {
    updateTimerDisplay();
  }
}

function startTimerInterval() {
  stopTimerInterval();
  tickTimer();
  timerInterval = setInterval(tickTimer, 500);
}

function stopTimerInterval() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function tickTimer() {
  if (!state.timer || !state.timer.running || !state.timer.startTs) {
    updateTimerDisplay();
    return;
  }
  var totalMs = state.timer.limitMin * 60000;
  var elapsed = Date.now() - state.timer.startTs;
  var remaining = totalMs - elapsed;
  var display = document.getElementById("timerDisplay");
  if (remaining <= 0) {
    display.textContent = "Time's Up";
    display.classList.remove("orange");
    display.classList.add("red");
    state.timer.running = false;
    saveState();
    stopTimerInterval();
    return;
  }
  var totalSec = Math.ceil(remaining / 1000);
  var mm = Math.floor(totalSec / 60);
  var ss = totalSec % 60;
  display.textContent = (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
  var ratio = remaining / totalMs;
  display.classList.remove("orange", "red");
  if (ratio <= 0.10) display.classList.add("red");
  else if (ratio <= 0.25) display.classList.add("orange");
}

function updateTimerDisplay() {
  var display = document.getElementById("timerDisplay");
  if (!display) return;
  if (state.timer && state.timer.limitMin) {
    var mm = state.timer.limitMin;
    display.textContent = (mm < 10 ? "0" + mm : mm) + ":00";
  } else {
    display.textContent = "20:00";
  }
  display.classList.remove("orange", "red");
}

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

window.startTimer = startTimer;
window.selectOption = selectOption;
window.nextQuestion = nextQuestion;
window.prevQuestion = prevQuestion;
window.jumpTo = jumpTo;
window.toggleDots = toggleDots;
window.retryWrongOnes = retryWrongOnes;
window.saveWrongAnswers = saveWrongAnswers;
window.startFreshOriginal = startFreshOriginal;
window.startFreshRandom = startFreshRandom;
window.modalConfirmYes = modalConfirmYes;
window.modalConfirmNo = modalConfirmNo;
window.copyAllResults = copyAllResults;

init();
</script>
