<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}

.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}

.hint-btn{background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block;}

.next-btn{background:#1D9E75;color:#fff;}

.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}

.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}

.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}

.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}

.q-timer-bar{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:8px;}
.q-timer-display{font-size:1.2rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;}
.q-timer-display.warn{color:#f5a623;}
.q-timer-display.danger{color:#E24B4A;}
.pause-btn{background:#e8edf4;color:#185FA5;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timeout-box{margin-top:12px;padding:10px 12px;background:#FCEBEB;border-left:3px solid #E24B4A;border-radius:6px;font-size:0.88rem;color:#501313;display:none;}
.r-card.timedout{background:#fdecd2;color:#7a4c00;}

</style>
</head>
<body><div class="quiz-title">[Grant] Speed Quiz</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Answer as quickly as you can. Each question has a 40 second timer.</div><div id="nav-bar"><span id="nav-count">0 / 30</span><div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div><button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button></div><div id="dot-panel"></div>

<script>var TITLE = "[Grant] Speed Quiz";var QUIZ_KEY = "quiz_grantspeedquiz_2026-09-11_v1";var ATT_KEY = "quiz_grantspeedquiz_att_2026-09-11_v1";var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';var RAW_QUESTIONS = [{"stem": "John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?", "opts": ["90", "95", "100", "105"], "ci": 1, "exp": "The weekly coin counts are 5, 6, 7, &hellip;, 14 (10 terms): sum = (5 + 14) &times; 10 &divide; 2 = 95 coins.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "The grid below is a 3-column, 2-row grid of unit cells.<br><svg width=\"152\" height=\"104\" viewBox=\"0 0 152 104\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"132\" height=\"84\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"54\" y1=\"10\" x2=\"54\" y2=\"94\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"98\" y1=\"10\" x2=\"98\" y2=\"94\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"52\" x2=\"142\" y2=\"52\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many squares (of any size) can be found in the figure altogether?", "opts": ["6", "7", "8", "9"], "ci": 2, "exp": "1&times;1 squares: 6. 2&times;2 squares: 2. Total = 6 + 2 = 8.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>24 x 25 =", "opts": ["550", "600", "650", "500"], "ci": 1, "exp": "24 &times; 25 = 24 &times; 100 &divide; 4 = 2,400 &divide; 4 = 600.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "The grid below is a 1-row, 7-column grid of unit cells.<br><svg width=\"230\" height=\"50\" viewBox=\"0 0 230 50\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"210\" height=\"30\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"40\" y1=\"10\" x2=\"40\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"10\" x2=\"160\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"190\" y1=\"10\" x2=\"190\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many rectangles (including squares) can be found in the figure altogether?", "opts": ["21", "24", "28", "32"], "ci": 2, "exp": "For a 1&times;m bar-shaped grid, the rectangle count is C(m+1,2) = C(8,2) = 8 &times; 7 &divide; 2 = 28.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "From one vertex of the triangle below, 3 line segments are drawn to the opposite side, splitting the triangle into 4 regions.<br><svg width=\"230\" height=\"150\" viewBox=\"0 0 230 150\" style=\"display:block;margin:10px auto;\"><polygon points=\"115,10 20,140 210,140\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"115\" y1=\"10\" x2=\"68\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"115\" y1=\"10\" x2=\"115\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"115\" y1=\"10\" x2=\"163\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many triangles are there in the whole figure?", "opts": ["8", "9", "10", "12"], "ci": 2, "exp": "With k=3 cevians: (k+1)(k+2) &divide; 2 = (4)(5) &divide; 2 = 10.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>4 x 5 x 25 =", "opts": ["500", "450", "400", "550"], "ci": 0, "exp": "4 &times; 5 &times; 25 = 20 &times; 25 = 500.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "The 6 points A, B, C, D, E, F lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"165\" height=\"60\" viewBox=\"0 0 165 60\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"30\" x2=\"150\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"35\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"35\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"65\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"65\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"85\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"85\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"115\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"115\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"150\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"150\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["15", "12", "18", "21"], "ci": 0, "exp": "With 6 points at all-different spacings, every pair of points gives a distinct length: C(6,2) = 6 &times; 5 &divide; 2 = 15.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>15 + 85 =", "opts": ["100", "95", "105", "90"], "ci": 0, "exp": "15 + 85 = 100.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "The 7 points A, B, C, D, E, F, G lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"185\" height=\"60\" viewBox=\"0 0 185 60\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"30\" x2=\"170\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"33\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"33\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"65\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"65\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"87\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"87\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"127\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"127\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"142\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"142\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text><circle cx=\"170\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"170\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">G</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["21", "20", "15", "28"], "ci": 0, "exp": "With 7 points at all-different spacings, every pair of points gives a distinct length: C(7,2) = 7 &times; 6 &divide; 2 = 21.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "Compute the following.<br>22 + 78 =", "opts": ["90", "100", "110", "98"], "ci": 1, "exp": "22 + 78 = 100.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following series.<br>2 + 3 + 4 + 5 + 6 + 7 + 8", "opts": ["30", "35", "32", "40"], "ci": 1, "exp": "This is 7 consecutive terms from 2 to 8: sum = (2 + 8) &times; 7 &divide; 2 = 35.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Melvin lives on the 5th floor of an apartment building. Nick lives on the next floor. The staircases leading to Melvin's apartment have 80 steps. How many steps have the staircases leading to Nick's apartment?", "opts": ["84", "96", "100", "120"], "ci": 2, "exp": "Reaching the 5th floor requires climbing 4 flights of stairs, so each flight has 80 &divide; 4 = 20 steps. Nick's floor (the 6th) requires 5 flights: 5 &times; 20 = 100 steps.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Each side of a football field is planted with 16 flags. There is one flag at each corner. How many flags are planted altogether in the football field?", "opts": ["64", "60", "48", "56"], "ci": 1, "exp": "Each side has 16 flags, but corner flags are shared between two sides. Total = 4 &times; (16 &minus; 1) = 60 flags.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "There are 10 rows of seats in an auditorium. The first row has 30 seats. The second row has 34 seats. The third row has 38 seats and so on. How many seats are there in the auditorium?", "opts": ["450", "480", "510", "440"], "ci": 1, "exp": "The rows form 30, 34, 38, &hellip; (10 terms, common difference 4): last row = 30 + 9&times;4 = 66. Sum = (30 + 66) &times; 10 &divide; 2 = 480.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>24 + 55 + 76 =", "opts": ["145", "150", "155", "160"], "ci": 2, "exp": "24 + 55 + 76 = 155.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "There are 20 teams in the North Volleyball League. Each team must play exactly one match with every other team. How many matches are to be played altogether in the league?", "opts": ["380", "190", "210", "200"], "ci": 1, "exp": "Each pair of teams plays once: C(20,2) = 20 &times; 19 &divide; 2 = 190 matches.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>17 + 18 + 19 + 20 + 21 + 22 + 23", "opts": ["133", "140", "147", "136"], "ci": 1, "exp": "This is 7 consecutive terms from 17 to 23: sum = (17 + 23) &times; 7 &divide; 2 = 140.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Stella tied 6 knots on a piece of ribbon. The length between the second and fifth knots was 60 cm. What was the length between the first and sixth knots?", "opts": ["80 cm", "90 cm", "100 cm", "120 cm"], "ci": 2, "exp": "The 2nd to 5th knots span 3 gaps, so each gap = 60 &divide; 3 = 20 cm. The 1st to 6th knots span 5 gaps: 5 &times; 20 = 100 cm.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>33 x 101 =", "opts": ["3,300", "3,333", "3,363", "3,033"], "ci": 1, "exp": "33 &times; 101 = 33 &times; 100 + 33 = 3,300 + 33 = 3,333.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following series.<br>6 + 7 + 8 + 9 + 10 + 11", "opts": ["48", "51", "54", "45"], "ci": 1, "exp": "This is 6 consecutive terms from 6 to 11: sum = (6 + 11) &times; 6 &divide; 2 = 51.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>284 + 118 =", "opts": ["392", "402", "412", "382"], "ci": 1, "exp": "284 + 118 = 402.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following. (See Example 6.)<br>738 - (238 + 162) =", "opts": ["338", "328", "348", "318"], "ci": 0, "exp": "238 + 162 = 400. 738 &minus; 400 = 338.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>44 x 25 =", "opts": ["1,000", "1,100", "1,150", "1,200"], "ci": 1, "exp": "44 &times; 25 = 11 &times; 100 = 1,100.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?", "opts": ["125 m", "120 m", "130 m", "100 m"], "ci": 1, "exp": "With 25 trees there are 25 &minus; 1 = 24 intervals: 24 &times; 5 = 120 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "It takes Professor Sullivan 11 minutes to stroll past the twelfth lamp post along a quiet road. How many lamp posts would he have strolled past after 30 minutes?", "opts": ["30", "31", "32", "33"], "ci": 1, "exp": "Passing the 12th lamp post in 11 minutes means 11 intervals take 11 minutes, so 1 minute per lamp post interval starting from the 1st. After 30 minutes he has passed 30 intervals, reaching the 31st lamp post.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?", "opts": ["100", "99", "101", "105"], "ci": 2, "exp": "Number of intervals = 500 &divide; 5 = 100, so the number of trees (both ends included) = 100 + 1 = 101.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>63 x 11 =", "opts": ["703", "683", "693", "673"], "ci": 2, "exp": "63 &times; 11 = 63 &times; 10 + 63 = 630 + 63 = 693.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>48 x 125 =", "opts": ["5,600", "6,000", "5,500", "6,200"], "ci": 1, "exp": "48 &times; 125 = 48 &times; 1,000 &divide; 8 = 48,000 &divide; 8 = 6,000.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following. (See Example 6.)<br>438 - 132 - 206 =", "opts": ["120", "100", "90", "110"], "ci": 1, "exp": "438 &minus; 132 &minus; 206 = 100.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "The 5 points A, B, C, D, E lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"155\" height=\"60\" viewBox=\"0 0 155 60\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"30\" x2=\"140\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"45\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"45\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"75\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"75\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"100\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"100\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"140\" cy=\"30\" r=\"4\" fill=\"#333\"/><text x=\"140\" y=\"17\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["10", "9", "8", "12"], "ci": 0, "exp": "With 5 points at all-different spacings, every pair of points gives a distinct length: C(5,2) = 5 &times; 4 &divide; 2 = 10.", "tag": "Geometry", "tagcolor": "#E24B4A"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + "_order_v1";
var Q_TIME = 40;

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<N;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultTimerState(){ return { remainingAtStart: Q_TIME, startedAt: null, running: false, timedOut: false }; }
function defaultState(){
  var timers = {};
  for(var i=0;i<N;i++) timers[i] = defaultTimerState();
  return { cur:0, answers:{}, timers: timers, showResults:false };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.timers !== 'object' || s.timers===null) s.timers = {};
    for(var i=0;i<N;i++){ if(!s.timers[i]) s.timers[i] = defaultTimerState(); }
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var tickInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function getRemaining(qi){
  var t = state.timers[qi];
  if(!t) return Q_TIME;
  if(t.running && t.startedAt){
    var elapsed = (Date.now()-t.startedAt)/1000;
    return Math.max(0, t.remainingAtStart - elapsed);
  }
  return t.remainingAtStart;
}
function freezeTimer(qi){
  var t = state.timers[qi];
  if(t && t.running){
    t.remainingAtStart = getRemaining(qi);
    t.running = false;
    t.startedAt = null;
  }
}
function startTimerFor(qi){
  var t = state.timers[qi];
  if(!t) { t = defaultTimerState(); state.timers[qi] = t; }
  if(t.timedOut) return;
  if(state.answers[qi] !== undefined) return;
  if(!t.running){
    t.startedAt = Date.now();
    t.running = true;
  }
}
function stopTickInterval(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }
function startTickInterval(){ stopTickInterval(); tickInterval = setInterval(tickRender, 250); }

function tickRender(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var disp = document.getElementById('qTimerDisplay');
  var pauseBtn = document.getElementById('pauseBtn');
  if(!t) return;
  var remaining = getRemaining(qi);
  disp.classList.remove('warn','danger');
  if(remaining <= 0){
    if(t.running){
      t.running = false;
      t.startedAt = null;
      t.remainingAtStart = 0;
      t.timedOut = true;
      saveState();
      renderOptionsLockState();
    }
    disp.textContent = "0:00";
    disp.classList.add('danger');
    document.getElementById('timeout-box').style.display = (state.answers[qi]===undefined) ? 'block' : 'none';
    pauseBtn.disabled = true;
    return;
  }
  pauseBtn.disabled = false;
  disp.textContent = formatTime(remaining);
  if(remaining <= Q_TIME*0.1) disp.classList.add('danger');
  else if(remaining <= Q_TIME*0.25) disp.classList.add('warn');
  pauseBtn.textContent = t.running ? 'Pause' : 'Resume';
}

function renderOptionsLockState(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var answered = state.answers[qi];
  var btns = document.querySelectorAll('#options .opt-btn');
  btns.forEach(function(btn){
    if(answered !== undefined || (t && t.timedOut)) btn.disabled = true;
  });
}

function togglePause(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(!t || t.timedOut || state.answers[qi]!==undefined) return;
  if(t.running){ freezeTimer(qi); }
  else { startTimerFor(qi); }
  saveState();
  tickRender();
}
window.togglePause=togglePause;

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  var timerBar = document.querySelector('.q-timer-bar');
  if(state.showResults){
    qa.style.display='none';
    timerBar.style.display='none';
    rs.classList.add('show');
    stopTickInterval();
    renderResults();
    return;
  }
  qa.style.display='block';
  timerBar.style.display='flex';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  badge.textContent = q.tag;
  badge.style.background = q.tagcolor || '#185FA5';

  document.getElementById('q-text').innerHTML = q.stem;

  startTimerFor(qi);

  var answered = state.answers[qi];
  var t = state.timers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = (answered !== undefined) || (t && t.timedOut);
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var timeoutBox = document.getElementById('timeout-box');
  timeoutBox.style.display = (t && t.timedOut && answered===undefined) ? 'block' : 'none';

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
  tickRender();
  startTickInterval();
}

function updateNav(){
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi = order[k];
    if(state.answers[qi]!==undefined || (state.timers[qi] && state.timers[qi].timedOut)) done++;
  }
  document.getElementById('nav-count').textContent = done + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (done/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg;
    if(state.answers[qi]===undefined){
      bg = (state.timers[qi] && state.timers[qi].timedOut) ? '#f5a623' : '#d7dde6';
    } else {
      bg = state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A';
    }
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi2 = order[k];
    if(state.answers[qi2]!==undefined || (state.timers[qi2] && state.timers[qi2].timedOut)) done++;
  }
  if(done===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  freezeTimer(order[state.cur]);
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  freezeTimer(order[state.cur]);
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(state.answers[qi] !== undefined) return;
  if(t && t.timedOut) return;
  state.answers[qi] = idx;
  freezeTimer(qi);
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ freezeTimer(order[state.cur]); state.cur--; saveState(); render(); }
}
function goNext(){
  freezeTimer(order[state.cur]);
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0, timedout=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      var a = state.answers[qi];
      var t = state.timers[qi];
      if(a===undefined){
        if(t && t.timedOut) timedout++; else skipped++;
        continue;
      }
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, timedOut: timedout, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
function renderResults(){
  var correct=0, wrong=0, skipped=0, timedout=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a===undefined){
      if(t && t.timedOut) timedout++; else skipped++;
      continue;
    }
    if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+timedout+' timed out, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var card = document.createElement('div');
    if(a===undefined){
      if(t && t.timedOut){ card.className='r-card timedout'; card.textContent='Q'+(pos+1)+' Time'; }
      else { card.className='r-card skipped'; card.textContent='Q'+(pos+1)+' Skip'; }
    } else {
      var ok = a===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var isWrong = (a!==undefined && a!==RAW_QUESTIONS[qi].ci);
    var isTimedOut = (a===undefined && t && t.timedOut);
    if(isWrong || isTimedOut) wrong.push(qi);
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){
    delete state.answers[qi];
    state.timers[qi] = defaultTimerState();
  });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s += (t && t.timedOut) ? 'Timed Out' : 'Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    } else if(a===undefined && t && t.timedOut){
      var q2 = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q2.stem, yourAnswer: '(timed out)', correctAnswer: q2.opts[q2.ci], explanation: q2.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
</script>
