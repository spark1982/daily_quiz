<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Sion] SAT Vocabulary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
.top-bar{background:#fff;text-align:center;padding:10px 12px 4px}
.date-lbl{font-size:2rem;font-weight:800;color:#185FA5}
.title-lbl{font-size:1.25rem;font-weight:700;color:#185FA5;margin-top:2px}
.att-lbl{font-size:0.85rem;color:#555;margin-top:2px;padding-bottom:6px}
.nav-row{background:#fff;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid #e0e7ef;justify-content:center}
.nav-dot{width:32px;height:32px;border-radius:50%;border:2px solid #ccc;background:#e8edf4;font-size:0.72rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333}
.nav-dot.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.nav-dot.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.nav-dot.active{border-color:#185FA5;color:#185FA5}
.nav-dot.results-pill{width:auto;padding:0 12px;border-radius:16px;font-size:0.8rem}
.quiz-area{max-width:700px;margin:16px auto;padding:0 12px 40px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:0.78rem;font-weight:600;margin-bottom:10px}
.q-num{font-size:0.85rem;color:#666;margin-bottom:4px}
.stem-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.word-txt{font-size:1.7rem;font-weight:700;color:#185FA5;font-style:italic}
.speak-btn{background:#e8edf4;border:none;border-radius:8px;padding:6px 12px;font-size:0.85rem;cursor:pointer;color:#185FA5;font-weight:600;white-space:nowrap}
.speak-btn:hover{background:#d0d9e8}
.opts{display:flex;flex-direction:column;gap:10px}
.opt-btn{background:#e8edf4;color:#111111;border:2px solid transparent;border-radius:8px;padding:11px 16px;font-size:0.95rem;text-align:left;cursor:pointer;transition:all 0.15s;font-family:inherit}
.opt-btn:hover{background:#d0d9e8}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn.wrong{background:#FCEBEC;border-color:#E24B4A;color:#501313}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn:disabled{cursor:default}
.exp-box{background:#f7f9fc;border-left:4px solid #185FA5;padding:10px 14px;border-radius:0 8px 8px 0;margin-top:12px;font-size:0.9rem;color:#333;line-height:1.6;display:none}
.nav-btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.nav-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:0.9rem;font-weight:600;cursor:pointer}
.nav-btn.prev-btn{background:#e8edf4;color:#185FA5}
.results-area{max-width:700px;margin:16px auto;padding:0 12px 40px;display:none}
.results-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:16px}
.results-title{font-size:1.3rem;font-weight:700;color:#185FA5;margin-bottom:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.res-item{border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;border:2px solid transparent}
.res-item.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.res-item.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.res-item.skipped{background:#f0f4f8;border-color:#aaa;color:#555}
.score-line{font-size:1.1rem;font-weight:700;color:#185FA5;margin-bottom:8px}
.action-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:0.88rem;font-weight:600;cursor:pointer;margin-right:8px;margin-top:8px}
.action-btn.sec{background:#e8edf4;color:#185FA5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:360px;width:90%;text-align:center}
.modal-box p{font-size:1rem;color:#333;margin-bottom:18px;line-height:1.5}
.btn-blue{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:0.9rem;font-weight:600;cursor:pointer;margin:4px}
.btn-gray{background:#e8edf4;color:#333;border:none;border-radius:8px;padding:9px 22px;font-size:0.9rem;cursor:pointer;margin:4px}
</style>
</head>
<body>
<div class="top-bar">
  <div class="date-lbl">2026-06-12</div>
  <div class="title-lbl">[Sion] SAT Vocabulary</div>
  <div class="att-lbl" id="attLbl">Total Attempts: 0</div>
</div>
<div class="nav-row" id="navRow"></div>
<div class="quiz-area" id="quizArea" style="display:none">
  <div class="card">
    <div class="tag-badge">SAT Vocabulary</div>
    <div class="q-num" id="qNum"></div>
    <div class="stem-row">
      <span class="word-txt" id="wordTxt"></span>
      <button class="speak-btn" onclick="speakWord()">Listen</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="exp-box" id="expBox"></div>
    <div class="nav-btns">
      <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">Next</button>
    </div>
  </div>
</div>
<div class="results-area" id="resultsArea">
  <div class="results-card">
    <div class="results-title">Results</div>
    <div class="score-line" id="scoreLine"></div>
    <div class="res-grid" id="resGrid"></div>
    <div style="margin-top:14px">
      <button class="action-btn" onclick="copyRes()">Copy All Results</button>
      <button class="action-btn" onclick="startRetry()">Retry Wrong Questions</button>
      <button class="action-btn sec" onclick="openFreshModal()">Start Fresh</button>
    </div>
  </div>
</div>
<div id="retryArea" style="display:none;max-width:700px;margin:0 auto;padding:0 12px 40px">
  <div class="results-card">
    <div class="results-title">Retry Wrong Questions</div>
    <div id="retryCard"></div>
    <div id="retryResult" style="margin-top:12px;font-weight:600;color:#185FA5;display:none"></div>
  </div>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p>Reset all progress and start fresh?</p>
    <button class="btn-blue" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="btn-gray" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>
<script>
(function(){
const KEY='quiz_satvocab_15_v1';
const ATT_KEY='quiz_satvocab_attempts_v1';
var qs=[
{word:'anachronistic',opts:['belonging to a different time period than where it appears','showing great enthusiasm or passion','easy to understand; clearly expressed','having a sharp or harshly critical quality'],ci:0,exp:'Anachronistic means something is placed in a time period to which it does not belong. Example: A knight carrying a smartphone would be anachronistic.'},
{word:'antipathy',opts:['a feeling of fondness or warmth','a deep dislike or aversion toward something','a period of pause or inactivity','a strong and contagious enthusiasm'],ci:1,exp:'Antipathy means a strong feeling of dislike or hostility. Example: She felt deep antipathy toward injustice.'},
{word:'appease',opts:['to make a situation worse','to criticize someone harshly','to pacify or satisfy someone by giving in to their demands','to remove all traces of something'],ci:2,exp:'Appease means to calm someone by meeting their demands. Example: He tried to appease the angry crowd by offering a refund.'},
{word:'arbitrary',opts:['extremely precise and systematic','based on solid logic and clear reasoning','based on random choice or personal whim, not reason','showing great skill and expertise'],ci:2,exp:'Arbitrary means based on whim rather than logic. Example: The teacher\'s arbitrary grading confused the students.'},
{word:'ardor',opts:['deep sadness or grief','intense enthusiasm, passion, or zeal','a sharp or sarcastic remark','a complete lack of emotion'],ci:1,exp:'Ardor means great enthusiasm or passion. Example: She pursued her studies with ardor and determination.'},
{word:'acerbic',opts:['extremely kind and gentle in manner','sharp and harshly critical in tone or manner','very brief and economical with words','lasting for only a very short time'],ci:1,exp:'Acerbic describes a tone or manner that is sharply critical or bitter. Example: The critic\'s acerbic review stung the director.'},
{word:'ephemeral',opts:['deeply meaningful and long-lasting','lasting for only a very short time','widespread and commonly encountered','clear and easy to comprehend'],ci:1,exp:'Ephemeral means short-lived or transitory. Example: Fame can be ephemeral — here today, gone tomorrow.'},
{word:'lucid',opts:['confusing, unclear, or hard to follow','extremely intense and passionate','expressed clearly and easy to understand','lasting for only a brief moment'],ci:2,exp:'Lucid means clearly expressed and easy to understand. Example: Her lucid explanation helped everyone grasp the complex topic.'},
{word:'poignant',opts:['extremely harsh and critical in tone','causing only mild or slight irritation','evoking a keen sense of sadness or deep sympathy','dangerously unpredictable and likely to change'],ci:2,exp:'Poignant means evoking a strong sense of sadness or tenderness. Example: The farewell scene in the film was deeply poignant.'},
{word:'volatile',opts:['stable, calm, and consistent','liable to change rapidly and unpredictably','permanent and not subject to change','extremely precise and careful in detail'],ci:1,exp:'Volatile describes something that is likely to change suddenly or explosively. Example: The volatile stock market made investors nervous.'},
{word:'exacerbate',opts:['to improve or make something better','to remove or eliminate something entirely','to make a problem or bad situation worse','to express something in a very brief form'],ci:2,exp:'Exacerbate means to make something worse. Example: Skipping meals can exacerbate feelings of fatigue.'},
{word:'hubris',opts:['extreme humility and self-doubt','excessive pride or self-confidence leading to downfall','deep sadness or prolonged grief','a strong and persistent dislike'],ci:1,exp:'Hubris means dangerous overconfidence or arrogance, often leading to a downfall. Example: His hubris led him to underestimate his competitors.'},
{word:'terse',opts:['using far too many words to express an idea','very emotional and openly expressive','brief and to the point; using few words','showing intense enthusiasm and energy'],ci:2,exp:'Terse means concise and direct, often to the point of seeming rude. Example: His terse reply showed he was in a hurry.'},
{word:'tenuous',opts:['extremely strong and firmly established','clearly defined and immediately obvious','very weak, thin, or slight; lacking substance','having a sharply bitter or critical quality'],ci:2,exp:'Tenuous means thin, weak, or insubstantial. Example: The connection between the two events was tenuous at best.'},
{word:'malleable',opts:['stubbornly resistant to change','extremely unpredictable and unstable','easily shaped, influenced, or controlled','using very few words; concise'],ci:2,exp:'Malleable means capable of being shaped or influenced. Example: Young children are malleable — their habits form early.'}
];

var state={cur:0,answers:{},shuffles:{},showResults:false};
function loadState(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.cur==='number'&&typeof s.answers==='object'&&s.answers!==null&&typeof s.shuffles==='object'&&s.shuffles!==null){if(s.cur<0||s.cur>=qs.length)s.cur=0;state=s;}}catch(e){localStorage.removeItem(KEY);}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
function loadAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
function saveAttempts(n){localStorage.setItem(ATT_KEY,String(n));}
function getShuffled(i){if(!state.shuffles[i]){var arr=qs[i].opts.map((_,j)=>j);for(var k=arr.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var t=arr[k];arr[k]=arr[r];arr[r]=t;}state.shuffles[i]=arr;saveState();}return state.shuffles[i];}

function render(){
  try{
    document.getElementById('attLbl').textContent='Total Attempts: '+loadAttempts();
    buildNav();
    if(state.showResults){document.getElementById('quizArea').style.display='none';document.getElementById('resultsArea').style.display='block';buildResults();}
    else{document.getElementById('quizArea').style.display='block';document.getElementById('resultsArea').style.display='none';buildQ();}
  }catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red">Error. Please refresh.</p></div>';document.getElementById('quizArea').style.display='block';}
}

function buildNav(){
  var row=document.getElementById('navRow');row.innerHTML='';
  for(var i=0;i<qs.length;i++){
    var d=document.createElement('button');d.className='nav-dot';d.textContent=i+1;
    if(state.answers[i]!==undefined)d.className+=(state.answers[i]===qs[i].ci?' correct':' wrong');
    if(!state.showResults&&i===state.cur)d.className+=' active';
    (function(idx){d.onclick=function(){if(state.showResults){state.showResults=false;saveState();}state.cur=idx;saveState();render();};})(i);
    row.appendChild(d);
  }
  if(state.showResults){var p=document.createElement('button');p.className='nav-dot results-pill active';p.textContent='Results';p.onclick=function(){state.showResults=true;saveState();render();};row.appendChild(p);}
}

function buildQ(){
  var q=qs[state.cur];
  document.getElementById('qNum').textContent='Question '+(state.cur+1)+' / '+qs.length;
  document.getElementById('wordTxt').textContent=q.word;
  var shuffled=getShuffled(state.cur);
  var answered=state.answers[state.cur]!==undefined;
  var chosen=state.answers[state.cur];
  var container=document.getElementById('opts');container.innerHTML='';
  shuffled.forEach(function(origIdx){
    var btn=document.createElement('button');btn.className='opt-btn';btn.textContent=q.opts[origIdx];
    if(answered){btn.disabled=true;if(origIdx===q.ci)btn.className='opt-btn revealed';if(origIdx===chosen&&chosen!==q.ci)btn.className='opt-btn wrong';if(origIdx===chosen&&chosen===q.ci)btn.className='opt-btn correct';}
    (function(oIdx){btn.onclick=function(){pick(oIdx);};})(origIdx);
    container.appendChild(btn);
  });
  var exp=document.getElementById('expBox');
  if(answered&&chosen!==q.ci){exp.style.display='block';exp.textContent=q.exp;}else{exp.style.display='none';}
  document.getElementById('nextBtn').textContent=(state.cur===qs.length-1?'See Results →':'Next');
}

function speakWord(){
  var txt=qs[state.cur].word;
  if(window.speechSynthesis){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=0.85;window.speechSynthesis.speak(u);}
}
function pick(origIdx){if(state.answers[state.cur]!==undefined)return;state.answers[state.cur]=origIdx;saveState();render();}
function go(dir){
  if(dir===1&&state.cur===qs.length-1){var att=loadAttempts()+1;saveAttempts(att);state.showResults=true;saveState();render();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));saveState();render();
}
function buildResults(){
  var correct=0;var lines=['[Sion] SAT Vocabulary Results - 2026-06-12'];
  var grid=document.getElementById('resGrid');grid.innerHTML='';
  for(var i=0;i<qs.length;i++){
    var item=document.createElement('div');item.className='res-item';var ans=state.answers[i];
    if(ans===undefined){item.className+=' skipped';item.textContent='Q'+(i+1)+': Skipped';}
    else if(ans===qs[i].ci){item.className+=' correct';item.textContent='Q'+(i+1)+': Correct';correct++;lines.push('Q'+(i+1)+': Correct ('+qs[i].word+')');}
    else{item.className+=' wrong';item.textContent='Q'+(i+1)+': Wrong';lines.push('Q'+(i+1)+': Wrong ('+qs[i].word+')');}
    (function(idx){item.onclick=function(){state.showResults=false;state.cur=idx;saveState();render();};})(i);
    grid.appendChild(item);
  }
  document.getElementById('scoreLine').textContent='Score: '+correct+' / '+qs.length+' correct';
  lines.push('Score: '+correct+'/'+qs.length);window._resText=lines.join('\n');
}
function copyRes(){if(navigator.clipboard){navigator.clipboard.writeText(window._resText||'');}else{var ta=document.createElement('textarea');ta.value=window._resText||'';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
var retryList=[],retryIdx=0,retryAns={};
function startRetry(){
  retryList=[];retryIdx=0;retryAns={};
  for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==qs[i].ci)retryList.push(i);}
  if(!retryList.length)return;
  document.getElementById('retryArea').style.display='block';document.getElementById('retryResult').style.display='none';
  renderRetry();document.getElementById('retryArea').scrollIntoView({behavior:'smooth'});
}
function renderRetry(){
  var qi=retryList[retryIdx];var q=qs[qi];var shuffled=getShuffled(qi);var answered=retryAns[retryIdx]!==undefined;var chosen=retryAns[retryIdx];
  var html='<div class="tag-badge">SAT Vocabulary</div><div class="q-num">Retry '+(retryIdx+1)+' / '+retryList.length+'</div>';
  html+='<div class="stem-row"><span class="word-txt">'+q.word+'</span></div>';
  html+='<div class="opts" id="rOpts"></div><div class="exp-box" id="rExp" style="display:none">'+q.exp+'</div>';
  html+='<div class="nav-btns">';
  if(retryIdx>0)html+='<button class="nav-btn prev-btn" onclick="retryNav(-1)">Prev</button>';
  if(retryIdx<retryList.length-1)html+='<button class="nav-btn" onclick="retryNav(1)">Next</button>';
  else html+='<button class="nav-btn" onclick="finishRetry()">Finish</button>';
  html+='</div>';
  document.getElementById('retryCard').innerHTML=html;
  var optsEl=document.getElementById('rOpts');
  shuffled.forEach(function(origIdx){
    var btn=document.createElement('button');btn.className='opt-btn';btn.textContent=q.opts[origIdx];
    if(answered){btn.disabled=true;if(origIdx===q.ci)btn.className='opt-btn revealed';if(origIdx===chosen&&chosen!==q.ci)btn.className='opt-btn wrong';if(origIdx===chosen&&chosen===q.ci)btn.className='opt-btn correct';}
    (function(oIdx){btn.onclick=function(){retryAns[retryIdx]=oIdx;renderRetry();};})(origIdx);
    optsEl.appendChild(btn);
  });
  if(answered&&chosen!==q.ci){var ex=document.getElementById('rExp');if(ex)ex.style.display='block';}
}
function retryNav(dir){retryIdx+=dir;renderRetry();}
function finishRetry(){var c=0;for(var k in retryAns){if(retryAns[k]===qs[retryList[k]].ci)c++;}var res=document.getElementById('retryResult');res.textContent='Retry complete: '+c+' / '+retryList.length+' correct';res.style.display='block';}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function closeFreshModal(){document.getElementById('freshModal').style.display='none';}
function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false};closeFreshModal();render();}

window.pick=pick;window.go=go;window.speakWord=speakWord;window.copyRes=copyRes;window.startRetry=startRetry;window.retryNav=retryNav;window.finishRetry=finishRetry;window.openFreshModal=openFreshModal;window.closeFreshModal=closeFreshModal;window.confirmFresh=confirmFresh;

loadState();render();
})();
</script>
</body>
</html>
