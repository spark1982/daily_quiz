<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Sion] Math competition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh}
.top-bar{background:#fff;text-align:center;padding:10px 12px 4px}
.date-lbl{font-size:2rem;font-weight:800;color:#185FA5}
.title-lbl{font-size:1.25rem;font-weight:700;color:#185FA5;margin-top:2px}
.att-lbl{font-size:0.85rem;color:#555;margin-top:2px;padding-bottom:6px}
.nav-row{background:#fff;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid #e0e7ef;justify-content:center}
.nav-dot{width:32px;height:32px;border-radius:50%;border:2px solid #ccc;background:#e8edf4;font-size:0.72rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333}
.nav-dot.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.nav-dot.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.nav-dot.active{border-color:#185FA5;color:#185FA5}
.nav-dot.results-pill{width:auto;padding:0 12px;border-radius:16px;font-size:0.8rem}
.quiz-area{max-width:700px;margin:16px auto 0;padding:0 12px 40px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:0.78rem;font-weight:600;margin-bottom:10px}
.q-num{font-size:0.85rem;color:#666;margin-bottom:4px}
.q-text{font-size:1rem;line-height:1.7;margin-bottom:16px;color:#111}
.opts{display:flex;flex-direction:column;gap:10px}
.opt-btn{background:#e8edf4;color:#111;border:2px solid transparent;border-radius:8px;padding:11px 16px;font-size:0.92rem;text-align:left;cursor:pointer;transition:all 0.15s;font-family:inherit;line-height:1.45}
.opt-btn:hover{background:#d0d9e8}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn.wrong{background:#FCEBEC;border-color:#E24B4A;color:#501313}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn:disabled{cursor:default}
.exp-box{background:#f7f9fc;border-left:4px solid #185FA5;padding:10px 14px;border-radius:0 8px 8px 0;margin-top:12px;font-size:0.88rem;color:#333;line-height:1.65;display:none}
.nav-btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.nav-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:0.9rem;font-weight:600;cursor:pointer}
.nav-btn.prev-btn{background:#e8edf4;color:#185FA5}
.results-area{max-width:700px;margin:16px auto;padding:0 12px 40px;display:none}
.results-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.results-title{font-size:1.3rem;font-weight:700;color:#185FA5;margin-bottom:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.res-item{border-radius:8px;padding:8px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;border:2px solid transparent}
.res-item.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.res-item.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.res-item.skipped{background:#f0f4f8;border-color:#aaa;color:#555}
.score-line{font-size:1.1rem;font-weight:700;color:#185FA5;margin-bottom:8px}
.action-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:0.88rem;font-weight:600;cursor:pointer;margin-right:8px;margin-top:8px}
.action-btn.sec{background:#e8edf4;color:#185FA5}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:none;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:360px;width:90%;text-align:center}
.modal-box p{font-size:1rem;color:#333;margin-bottom:18px;line-height:1.5}
.btn-blue{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:9px 22px;font-size:0.9rem;font-weight:600;cursor:pointer;margin:4px}
.btn-gray{background:#e8edf4;color:#333;border:none;border-radius:8px;padding:9px 22px;font-size:0.9rem;cursor:pointer;margin:4px}
</style>
</head>
<body>
<div class="top-bar">
  <div class="date-lbl">2026-06-12</div>
  <div class="title-lbl">[Sion] Math competition</div>
  <div class="att-lbl" id="attLbl">Total Attempts: 0</div>
</div>
<div class="nav-row" id="navRow"></div>
<div class="quiz-area" id="quizArea">
  <div class="card">
    <div class="tag-badge" id="tagBadge"></div>
    <div class="q-num" id="qNum"></div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="opts"></div>
    <div class="exp-box" id="expBox"></div>
    <div class="nav-btns">
      <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">Next</button>
    </div>
  </div>
</div>
<div class="results-area" id="resultsArea">
  <div class="results-card">
    <div class="results-title">Results</div>
    <div class="score-line" id="scoreLine"></div>
    <div class="res-grid" id="resGrid"></div>
    <div style="margin-top:14px">
      <button class="action-btn" onclick="copyRes()">Copy All Results</button>
      <button class="action-btn sec" onclick="openFreshModal()">Start Fresh</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p>Reset all progress and start fresh?</p>
    <button class="btn-blue" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="btn-gray" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>
<script>
(function(){
const KEY='quiz_sionmathcomp_7_v1';
const ATT_KEY='quiz_sionmathcomp_attempts_v1';
var qs=[
{tag:'Invariant',q:'The numbers 1 through 9 are written on a board. In each step, you may erase any two numbers a and b and replace them with |a − b|. After 8 steps, one number remains. Which of the following must be true about the final number?',opts:['It must be odd','It must be even','It could be either odd or even','It must be a multiple of 3'],ci:0,exp:'Track parity (odd/even). The sum of 1+2+...+9 = 45, which is odd. Each operation replaces a and b with |a−b|. Note: a+b and |a−b| have the same parity (both differ by 2b, which is even). So the parity of the sum is preserved. After all steps, the sum equals the final number. Since the sum\'s parity is always odd, the final number must be odd.'},
{tag:'Invariant',q:'2026 tokens are arranged in a circle, alternating black and white (1013 black, 1013 white). Each step: remove 2 adjacent tokens of different colors. Can you reach a state where exactly 1 token remains?',opts:['Yes, it is always possible','No, it is impossible','Only if you start by removing a specific pair','Only if 2026 is prime'],ci:1,exp:'Track the invariant: assign value +1 to white and −1 to black. The total sum is 0 (1013 − 1013 = 0). Each operation removes one white and one black token (one +1 and one −1), keeping the sum at 0. If 1 token remained, the sum would be +1 or −1, not 0. This is a contradiction, so it is impossible.'},
{tag:'Parity',q:'Is it possible to assign + or − signs to each of the numbers 1, 2, 3, ..., 2026 so that ±1 ± 2 ± 3 ± ... ± 2026 = 0?',opts:['Yes, there is always a valid assignment','No, it is impossible','Only for even values of 2026','Yes, but only one such assignment exists'],ci:1,exp:'The sum 1+2+3+...+2026 = 2026×2027/2 = 1013×2027. Since 1013 is odd and 2027 is odd, the total is odd. When you assign ± signs, you are splitting the numbers into two groups A and B where (sum of A) − (sum of B) = 0, which requires total = 2×(sum of A), an even number. But the total is odd, which cannot be even. Impossible.'},
{tag:'Pigeonhole Principle',q:'What is the minimum number of integers you must choose to guarantee that at least two of them share the same units digit (ones digit)?',opts:['10','11','12','13'],ci:1,exp:'The units digits are 0, 1, 2, ..., 9 — exactly 10 possibilities (pigeonholes). If you pick 10 integers, it is possible each has a different units digit. But if you pick 11, by the Pigeonhole Principle, at least two must share a units digit. Minimum = 11.'},
{tag:'Pigeonhole Principle',q:'A club has 30 members. Each member plays between 1 and 10 games per week (inclusive), and each member plays a whole number of games. What is the minimum number of members who must play the same number of games?',opts:['2','3','4','5'],ci:1,exp:'There are 10 possible values (1 through 10) — the pigeonholes. We have 30 members distributed into 10 pigeonholes. By the Pigeonhole Principle, at least one pigeonhole contains at least ⌈30/10⌉ = 3 members. So at least 3 members must play the same number of games.'},
{tag:'Extremal Principle',q:'2027 points are placed in a row. You want to select as many points as possible such that no two selected points are adjacent (next to each other). What is the maximum number of points you can select?',opts:['1012','1014','1013','2026'],ci:1,exp:'To maximize non-adjacent selections from a row of n points, select every other point starting from the first. Pattern: select point 1, skip 2, select 3, skip 4, ... For 2027 points (odd), select all odd-indexed positions: 1, 3, 5, ..., 2027. The number of odd integers from 1 to 2027 is (2027+1)/2 = 1014. Verification: selected points are never adjacent (each selected point is separated by at least one unselected point). Maximum = 1014.'},
{tag:'Game Theory',q:'Two players take turns removing tokens from a pile of 15. On each turn, a player may remove 1 or 3 tokens. The player who takes the last token wins. Who wins with optimal play?',opts:['First player wins','Second player wins','The outcome depends on how many tokens each player takes first','Neither player can guarantee a win'],ci:0,exp:'Classify positions as Winning (W) or Losing (L) for the player about to move. 0 tokens: L (previous player took the last). 1: W (take 1). 2: W (take 1, leave 1 for opponent who takes it — wait, that leaves 1 for them to win). Recount: 0=L, 1=W (take 1→0), 2=L (take 1→1=W for opp; take 3 impossible; so 2=L), 3=W (take 1→2=L), 4=W (take 3→1=W? or take 1→3=W? — both leave W? so 4=L). Pattern: 0=L,1=W,2=L,3=W,4=L → period 2. 15 is odd, so W. First player wins. Strategy: always leave opponent at an even number. From 15: take 1→14(even,L); 14: take 1→13(W) or 3→11(W) — both are odd so W for next. Wait let me redo: L positions are multiples of 2: 0,2,4,6,8,10,12,14. W positions: 1,3,5,7,9,11,13,15. 15 is W. First player wins by taking 1 (→14, which is L for opponent). Confirmed: first player wins.'}
];


var state={cur:0,answers:{},shuffles:{},showResults:false};
function loadState(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s.cur==='number'&&typeof s.answers==='object'&&s.answers!==null&&typeof s.shuffles==='object'&&s.shuffles!==null){if(s.cur<0||s.cur>=qs.length)s.cur=0;state=s;}}catch(e){localStorage.removeItem(KEY);}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
function loadAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
function saveAttempts(n){localStorage.setItem(ATT_KEY,String(n));}
function getShuffled(i){if(!state.shuffles[i]){var arr=qs[i].opts.map((_,j)=>j);for(var k=arr.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1));var t=arr[k];arr[k]=arr[r];arr[r]=t;}state.shuffles[i]=arr;saveState();}return state.shuffles[i];}

function render(){
  try{
    document.getElementById('attLbl').textContent='Total Attempts: '+loadAttempts();
    buildNav();
    if(state.showResults){
      document.getElementById('quizArea').style.display='none';
      document.getElementById('resultsArea').style.display='block';
      buildResults();
    } else {
      document.getElementById('quizArea').style.display='block';
      document.getElementById('resultsArea').style.display='none';
      buildQ();
    }
  }catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red">Error. Please refresh.</p></div>';document.getElementById('quizArea').style.display='block';}
}
function buildNav(){
  var row=document.getElementById('navRow');row.innerHTML='';
  for(var i=0;i<qs.length;i++){
    var d=document.createElement('button');d.className='nav-dot';d.textContent=i+1;
    if(state.answers[i]!==undefined)d.className+=(state.answers[i]===qs[i].ci?' correct':' wrong');
    if(!state.showResults&&i===state.cur)d.className+=' active';
    (function(idx){d.onclick=function(){if(state.showResults){state.showResults=false;saveState();}state.cur=idx;saveState();render();};})(i);
    row.appendChild(d);
  }
  if(state.showResults){var p=document.createElement('button');p.className='nav-dot results-pill active';p.textContent='Results';p.onclick=function(){state.showResults=true;saveState();render();};row.appendChild(p);}
}
function buildQ(){
  var q=qs[state.cur];
  document.getElementById('tagBadge').textContent=q.tag;
  document.getElementById('qNum').textContent='Question '+(state.cur+1)+' / '+qs.length;
  document.getElementById('qText').textContent=q.q;
  var shuffled=getShuffled(state.cur);var answered=state.answers[state.cur]!==undefined;var chosen=state.answers[state.cur];
  var container=document.getElementById('opts');container.innerHTML='';
  shuffled.forEach(function(origIdx){
    var btn=document.createElement('button');btn.className='opt-btn';btn.textContent=q.opts[origIdx];
    if(answered){btn.disabled=true;if(origIdx===q.ci)btn.className='opt-btn revealed';if(origIdx===chosen&&chosen!==q.ci)btn.className='opt-btn wrong';if(origIdx===chosen&&chosen===q.ci)btn.className='opt-btn correct';}
    (function(oIdx){btn.onclick=function(){pick(oIdx);};})(origIdx);
    container.appendChild(btn);
  });
  var exp=document.getElementById('expBox');
  if(answered&&chosen!==q.ci){exp.style.display='block';exp.textContent=q.exp;}else{exp.style.display='none';}
  document.getElementById('nextBtn').textContent=(state.cur===qs.length-1?'See Results →':'Next');
}
function pick(origIdx){if(state.answers[state.cur]!==undefined)return;state.answers[state.cur]=origIdx;saveState();render();}
function go(dir){
  if(dir===1&&state.cur===qs.length-1){var att=loadAttempts()+1;saveAttempts(att);state.showResults=true;saveState();render();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));saveState();render();
}
function buildResults(){
  var correct=0;var lines=['[Sion] Math Competition Results - 2026-06-12'];
  var grid=document.getElementById('resGrid');grid.innerHTML='';
  for(var i=0;i<qs.length;i++){
    var item=document.createElement('div');item.className='res-item';var ans=state.answers[i];
    if(ans===undefined){item.className+=' skipped';item.textContent='Q'+(i+1)+': Skipped';}
    else if(ans===qs[i].ci){item.className+=' correct';item.textContent='Q'+(i+1)+': Correct';correct++;lines.push('Q'+(i+1)+': Correct');}
    else{item.className+=' wrong';item.textContent='Q'+(i+1)+': Wrong';lines.push('Q'+(i+1)+': Wrong');}
    (function(idx){item.onclick=function(){state.showResults=false;state.cur=idx;saveState();render();};})(i);
    grid.appendChild(item);
  }
  document.getElementById('scoreLine').textContent='Score: '+correct+' / '+qs.length+' correct';
  lines.push('Score: '+correct+'/'+qs.length);window._resText=lines.join('\n');
}
function copyRes(){if(navigator.clipboard){navigator.clipboard.writeText(window._resText||'');}else{var ta=document.createElement('textarea');ta.value=window._resText||'';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function closeFreshModal(){document.getElementById('freshModal').style.display='none';}
function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false};closeFreshModal();render();}

window.pick=pick;window.go=go;window.copyRes=copyRes;window.openFreshModal=openFreshModal;window.closeFreshModal=closeFreshModal;window.confirmFresh=confirmFresh;

loadState();render();
})();
</script>
</body>
</html>
