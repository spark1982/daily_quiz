<style>
*{box-sizing:border-box;margin:0;padding:0}

.results-btns{display:flex;flex-direction:column;gap:9px;}

.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}

</style>

<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_20260826_v1";var ATT_KEY = "quiz_sionadvreading_12_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "Which choice completes the text with the most logical and precise word?", "passage": "Although the committee's initial proposal was met with enthusiasm, subsequent budget reviews revealed flaws serious enough that members felt compelled to ______ their support, ultimately voting against the very plan they had praised months earlier.", "opts": ["celebrate", "duplicate", "publicize", "withdraw"], "ci": 3, "exp": "Since the members ultimately \"voted against the very plan they had praised,\" they must have taken back their earlier backing, which matches \"withdraw.\" \"celebrate\" and \"publicize\" both suggest continued or increased support, which contradicts the voting outcome. \"duplicate\" doesn't relate to the idea of support at all.", "tag": "Words in Context", "tagcolor": "#185FA5"}, {"stem": "Which choice best describes the relationship between the two texts?", "passage": "Text 1: Proponents of remote work argue that eliminating daily commutes allows employees to reclaim hours for rest, family, or personal projects, ultimately improving well-being and productivity.<br><br>Text 2: Critics note that without the informal, in-person interactions that occur in shared offices, employees may miss out on mentorship opportunities and the kind of spontaneous collaboration that sparks new ideas.", "opts": ["Text 2 identifies a potential drawback of the benefit that Text 1 emphasizes.", "Text 1 responds directly to criticisms raised in Text 2.", "Text 1 and Text 2 both focus on the financial costs of remote work.", "Text 2 provides additional evidence for the exact claim made in Text 1."], "ci": 0, "exp": "Text 1 emphasizes remote work's benefits for well-being, while Text 2 points out a cost, lost informal interaction, making \"Text 2 identifies a potential drawback of the benefit that Text 1 emphasizes\" the accurate description. Text 2 challenges rather than supports Text 1's claim. Neither text discusses financial costs. Text 1 does not respond to Text 2, since Text 1's claim is presented independently and first.", "tag": "Cross-Text Connections", "tagcolor": "#185FA5"}, {"stem": "The student wants to highlight both the reef's massive scale and its biological diversity in a single sentence. Which choice most effectively combines the relevant information to accomplish this goal?", "passage": "- The Great Barrier Reef is the largest coral reef system in the world.<br>- It stretches over 2,300 kilometers off the coast of Australia.<br>- It is home to thousands of species, including sharks, turtles, and over 1,500 species of fish.", "opts": ["Stretching over 2,300 kilometers off the coast of Australia, the Great Barrier Reef is home to thousands of species, including sharks, turtles, and over 1,500 species of fish.", "The Great Barrier Reef is the largest coral reef system in the world.", "Sharks, turtles, and over 1,500 species of fish live in the waters off the coast of Australia.", "The Great Barrier Reef stretches over 2,300 kilometers off the coast of Australia."], "ci": 0, "exp": "\"Stretching over 2,300 kilometers off the coast of Australia, the Great Barrier Reef is home to thousands of species, including sharks, turtles, and over 1,500 species of fish\" combines the reef's length (its scale) with its variety of species (its diversity) in one sentence. The other choices each present only scale or only diversity, not both together.", "tag": "Rhetorical Synthesis", "tagcolor": "#185FA5"}, {"stem": "Which finding would most strongly support the researcher's hypothesis?", "passage": "A researcher hypothesizes that a particular species of frog changes its mating call depending on the noise level of its environment, using higher-pitched calls in noisier habitats to be heard over background sound.", "opts": ["Frogs near the highway were observed calling less frequently overall than forest frogs.", "Researchers recorded the same number of frog species in both noisy and quiet habitats.", "The average body size of frogs near the highway was smaller than that of forest frogs.", "Frogs recorded near a busy highway consistently used higher-pitched calls than frogs of the same species recorded in quiet forests."], "ci": 3, "exp": "Since the hypothesis specifically predicts higher-pitched calls in noisier environments, direct evidence of that exact pattern, as in \"Frogs recorded near a busy highway consistently used higher-pitched calls than frogs of the same species recorded in quiet forests,\" most strongly supports it. A difference in calling frequency doesn't address pitch. A difference in body size doesn't address call pitch either. An equal number of species in both habitats says nothing about how individual frogs adjust their calls.", "tag": "Command of Evidence", "tagcolor": "#185FA5"}, {"stem": "Which choice best states the main idea of the text?", "passage": "Marine biologists once assumed that octopuses relied primarily on touch to navigate their environment, given the sensitivity of their arms' suckers. Recent research, however, indicates that octopus skin contains light-sensitive proteins similar to those found in eyes, suggesting that octopuses may perceive light directly through their skin even when their eyes are covered. This finding complicates the assumption that vision and touch operate as entirely separate senses in these animals.", "opts": ["Octopuses use their arms exclusively to feel their way through dark environments.", "Marine biologists have proven that octopuses cannot see with their eyes at all.", "New evidence suggests that octopuses may sense light through their skin, blurring the line between touch and vision in these animals.", "Light-sensitive proteins are found only in the eyes of most marine animals."], "ci": 2, "exp": "The text centers on the discovery that octopus skin contains light-sensitive proteins, which complicates the idea that touch and vision are separate senses, matching \"New evidence suggests that octopuses may sense light through their skin, blurring the line between touch and vision in these animals.\" The text never claims octopuses rely exclusively on touch, since that is the older assumption being challenged. It never claims octopuses cannot see with their eyes at all. It never claims light-sensitive proteins exist only in the eyes of most marine animals; the whole point is that they also exist in octopus skin.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}, {"stem": "Which choice most logically completes the text?", "passage": "Despite decades of searching, astronomers have never directly observed a black hole; instead, they infer its presence from the behavior of nearby matter, such as gas that heats up and emits X-rays as it spirals toward the black hole's boundary. Because light itself cannot escape a black hole once matter crosses that boundary, any direct image would show only darkness. If future instruments were to capture direct visual evidence of a black hole itself, rather than the surrounding matter, that evidence would most likely ______.", "opts": ["have no relevance to existing theories about gas and X-rays", "confirm exactly what scientists have always expected to see", "prove that black holes emit more light than nearby stars", "contradict a basic prediction about how black holes interact with light"], "ci": 3, "exp": "Since the passage explains that a black hole should appear only as darkness because light cannot escape it, any direct visual evidence of light coming from the black hole itself would go against that expectation, matching \"contradict a basic prediction about how black holes interact with light.\" It would not confirm what scientists expect, since darkness is expected, not a direct image. It would be highly relevant to existing theories, not irrelevant. The passage never suggests black holes could emit more light than stars.", "tag": "Inferences", "tagcolor": "#185FA5"}, {"stem": "Which choice most logically completes the text?", "passage": "A study tracking coral reefs over twenty years found that reefs located near marine protected areas, where fishing is restricted, recovered from bleaching events roughly twice as quickly as reefs in unprotected waters. Researchers noted that protected reefs retained more herbivorous fish, which graze on algae that would otherwise overgrow and smother recovering coral. If a newly protected reef saw its herbivorous fish population decline sharply due to disease shortly after protection began, researchers would most likely predict that the reef's recovery from a future bleaching event would ______.", "opts": ["be identical to that of other protected reefs with healthy fish populations", "have no connection to the reef's population of grazing fish", "be slower than typical for a protected reef, despite its protected status", "improve dramatically due to reduced competition among coral species"], "ci": 2, "exp": "Since the passage ties fast recovery to a healthy population of algae-grazing fish, a sharp decline in that fish population would most logically predict slower-than-typical recovery, matching \"be slower than typical for a protected reef, despite its protected status.\" It would not be identical to reefs with healthy fish populations, since the key factor is missing. Losing grazing fish would allow algae to overgrow coral, which would hurt rather than improve recovery. The passage directly ties recovery speed to the fish population, so a connection clearly exists.", "tag": "Inferences", "tagcolor": "#185FA5"}, {"stem": "Which choice best states the main purpose of the text?", "passage": "When the printing press spread across Europe in the late 1400s, it did not simply make books more available; it reshaped how ideas moved between regions. Manuscripts that once took months to copy by hand could now be reproduced in days, and merchants carrying printed pamphlets often introduced new scientific and religious ideas to towns long before traveling scholars arrived. The press, in this sense, functioned less as a tool for preserving old knowledge and more as an engine for spreading new claims rapidly, for better or worse.", "opts": ["To argue that the printing press changed the speed and manner in which new ideas circulated, not just the availability of books.", "To argue that merchants were more trustworthy sources of information than traveling scholars.", "To describe the process by which medieval scribes copied manuscripts by hand.", "To explain why religious ideas spread more slowly after the printing press was invented."], "ci": 0, "exp": "The text's central claim is that the press \"reshaped how ideas moved between regions\" and became \"an engine for spreading new claims rapidly,\" matching \"To argue that the printing press changed the speed and manner in which new ideas circulated, not just the availability of books.\" The text mentions hand-copying only briefly for contrast, not as its main purpose. It never argues merchants were more trustworthy than scholars, only that they arrived first. It states the opposite of the fourth choice, since ideas spread faster, not more slowly, after the press was invented.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}, {"stem": "Based on the two texts, how would the economists in Text 2 most likely respond to the claim in Text 1 that minimum wage increases have only marginal effects on employment?", "passage": "Text 1: Some economists argue that raising the minimum wage primarily benefits low-income workers by increasing their take-home pay, with only marginal effects on overall employment levels.<br><br>Text 2: Other economists counter that even modest minimum wage increases can lead small businesses to reduce staff hours or delay hiring, particularly in regions where labor costs already strain thin profit margins.", "opts": ["They would likely argue that minimum wage should be eliminated entirely.", "They would likely argue that the effects on employment can be more significant than Text 1 suggests, especially for small businesses.", "They would likely argue that minimum wage increases have no effect on business decisions.", "They would likely agree completely, since both texts focus on employee take-home pay."], "ci": 1, "exp": "Text 2's claim that businesses \"reduce staff hours or delay hiring\" directly challenges Text 1's claim of only marginal employment effects, supporting \"They would likely argue that the effects on employment can be more significant than Text 1 suggests, especially for small businesses.\" The two texts disagree, so they would not likely agree completely. Text 2 never proposes eliminating minimum wage entirely. Text 2 explicitly argues wage increases do affect business decisions, the opposite of having no effect.", "tag": "Cross-Text Connections", "tagcolor": "#185FA5"}, {"stem": "Which finding, if true, would most directly support the planner's claim?", "passage": "A city planner claims that adding bike lanes to Main Street reduced overall traffic congestion in the downtown area.", "opts": ["The number of bicycles sold at local shops increased by 20 percent that year.", "Residents reported feeling safer walking near Main Street after the change.", "Average car travel times through downtown decreased by 15 percent in the year after the bike lanes were installed.", "The city spent less money on road repairs the following year."], "ci": 2, "exp": "Since the claim is specifically about reduced traffic congestion, a direct measure of car travel times decreasing, as in \"Average car travel times through downtown decreased by 15 percent in the year after the bike lanes were installed,\" most directly supports it. Increased bicycle sales suggests more cycling but doesn't directly measure congestion. Feeling safer while walking doesn't measure traffic congestion either. Reduced road repair spending doesn't demonstrate anything about congestion levels.", "tag": "Command of Evidence", "tagcolor": "#185FA5"}, {"stem": "The student wants to emphasize the unusual scope of Curie's achievement across scientific fields. Which choice most effectively uses the given information to accomplish this goal?", "passage": "- Marie Curie was the first person to win Nobel Prizes in two different sciences.<br>- She won the Physics Prize in 1903 for research on radioactivity.<br>- She won the Chemistry Prize in 1911 for discovering the elements polonium and radium.", "opts": ["Marie Curie won the Nobel Prize in Physics in 1903 for her research on radioactivity.", "Marie Curie was a scientist who conducted research on radioactivity in the early twentieth century.", "In 1911, Marie Curie won the Nobel Prize in Chemistry for discovering polonium and radium.", "Marie Curie remains the only person to win Nobel Prizes in two distinct sciences: physics in 1903 and chemistry in 1911."], "ci": 3, "exp": "Only \"Marie Curie remains the only person to win Nobel Prizes in two distinct sciences: physics in 1903 and chemistry in 1911\" combines both prizes and explicitly frames them as spanning two different sciences, which is exactly the unusual scope the student wants to emphasize. The other choices each mention only one of the two prizes or leave out the two-science comparison entirely, so none of them highlights the cross-field achievement.", "tag": "Rhetorical Synthesis", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the text with the most logical and precise word?", "passage": "The novelist's prose is often praised for its ______ quality: sentences that seem simple on the surface reward readers who look closely with layers of meaning that unfold only after multiple readings.", "opts": ["superficial", "understated", "monotonous", "predictable"], "ci": 1, "exp": "\"understated\" fits the idea of prose that seems simple on the surface but rewards close attention with hidden depth. \"predictable\" and \"monotonous\" both suggest a lack of interest or variety, which contradicts the idea of rewarding, layered meaning. \"superficial\" means lacking depth, which directly contradicts the passage's claim that the prose has layers of meaning.", "tag": "Words in Context", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
