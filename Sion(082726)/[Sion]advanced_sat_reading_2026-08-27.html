<title>[Sion] Advanced SAT Reading</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}
.quiz-title{font-size:1.35rem;font-weight:700;text-align:center;color:#111;background:#fff;padding:10px 0 2px}
.subtitle{text-align:center;font-size:0.85rem;color:#555;background:#fff;padding:2px 0 4px}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:2px 12px 10px}
.timer-bar { background: #fff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; border-radius:10px; margin-bottom:8px;}
.timer-setup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
.timer-setup label { font-weight: 700; }
.timer-setup input[type="number"] { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
.timer-start-btn { background: #185FA5; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
.timer-running { display: flex; align-items: center; gap: 8px; }
.timer-label { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.02em; }
.timer-display { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
.timer-display.warn { color: #f5a623; }
.timer-display.danger { color: #E24B4A; }
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0;background:#fff;padding:8px 12px;border-radius:10px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;border:none;}
.results-pill{display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;border:none;}
.quiz-area{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;}
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.q-num{font-size:0.82rem;color:#888;}
.tag-badge{font-size:0.75rem;padding:2px 10px;border-radius:10px;background:#185FA5;color:#fff;font-weight:600;}
.passage-box,.context-box{background:#f5f7fa;border-left:3px solid #185FA5;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.92rem;color:#333;line-height:1.5;}
.q-text{font-size:1.08rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.5;}
.options{display:flex;flex-direction:column;gap:9px;}
.opt-btn{background:#e8edf4;color:#111;border:2px solid transparent;border-radius:9px;padding:11px 14px;font-size:0.95rem;text-align:left;cursor:pointer;line-height:1.4;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn.revealed{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn:disabled{cursor:default;}
.exp-box{margin-top:12px;padding:10px 12px;background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;font-size:0.88rem;color:#333;display:none;}
.nav-btns{display:flex;justify-content:space-between;margin-top:14px;gap:10px;}
.prev-btn,.next-btn{padding:9px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;}
.prev-btn{background:#e8edf4;color:#333;}
.next-btn{background:#1D9E75;color:#fff;}
.results-screen{background:#fff;border-radius:12px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);margin:8px 0;display:none;}
.results-screen.show{display:block;}
.results-heading{font-size:1.3rem;font-weight:700;color:#1D9E75;text-align:center;margin-bottom:6px;}
.results-score{font-size:1rem;text-align:center;color:#555;margin-bottom:14px;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}
.r-card{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;font-size:0.82rem;font-weight:600;}
.r-card.correct{background:#E1F5EE;color:#085041;}
.r-card.wrong{background:#FCEBEB;color:#501313;}
.r-card.skipped{background:#f5f7fa;color:#555;}
.results-btns{display:flex;flex-direction:column;gap:9px;}
.retry-btn{background:#1D9E75;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px 20px;max-width:320px;width:90%;text-align:center;}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:8px;}
.modal-msg{font-size:0.9rem;color:#555;margin-bottom:18px;}
.modal-btns{display:flex;gap:10px;justify-content:center;}
.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}
</style>
</head>
<body><div class="quiz-title">[Sion] Advanced SAT Reading</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Read each passage, then choose the best answer.</div>

  </div>

      <button class="modal-cancel" onclick="closeFreshModal()">Cancel</button>

    </div>
  </div>
</div>
<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_20260826_v1";var ATT_KEY = "quiz_sionadvreading_12_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "Which choice best describes the relationship between the two texts?", "passage": "Text 1: Advocates of year-round schooling argue that shorter, more frequent breaks throughout the year help students retain information better than the traditional long summer vacation.<br><br>Text 2: Critics point out that year-round schedules can disrupt long-standing family vacation plans and complicate scheduling for families with children in different school systems.", "opts": ["Text 1 responds directly to the scheduling concerns raised in Text 2.", "Text 1 and Text 2 both focus on the cost of building new schools.", "Text 2 raises a practical concern that complicates the benefit Text 1 describes.", "Text 2 provides additional research supporting the claim made in Text 1."], "ci": 2, "exp": "Text 1 emphasizes an academic benefit, while Text 2 raises a family-scheduling drawback, making the correct choice accurate. Text 2 challenges rather than supports Text 1's claim. Neither text discusses building costs. Text 1 is presented independently and does not respond to Text 2's concerns.", "tag": "Cross-Text Connections", "tagcolor": "#185FA5"}, {"stem": "Based on the two texts, how would the historians in Text 2 most likely respond to the claim in Text 1 that standardized time zones were driven primarily by railroad scheduling needs?", "passage": "Text 1: Some historians argue that the introduction of standardized time zones in the late 1800s was driven primarily by the practical needs of railroad scheduling, as inconsistent local times made coordinating trains across regions nearly impossible.<br><br>Text 2: Other historians contend that standardized time zones reflected a broader cultural shift toward valuing punctuality and synchronized labor, a shift that predated and extended well beyond the railroads.", "opts": ["They would likely argue that railroad scheduling was only one part of a larger cultural change, not the primary driving force.", "They would likely agree completely, since both texts focus only on railroad schedules.", "They would likely argue that time zones should be abolished entirely.", "They would likely argue that railroads had no role at all in the adoption of time zones."], "ci": 0, "exp": "Text 2's claim that the shift \"predated and extended well beyond the railroads\" directly challenges Text 1's claim that railroads were the primary driver, supporting the correct choice. The two texts disagree, so they would not likely agree completely. Text 2 never proposes abolishing time zones. Text 2 doesn't deny railroads played any role, only that they weren't the primary cause.", "tag": "Cross-Text Connections", "tagcolor": "#185FA5"}, {"stem": "Which choice most logically completes the text?", "passage": "A twenty-year study of a migratory bird species found that individuals arriving earliest at breeding grounds each spring consistently secured the highest-quality nesting sites and produced more surviving offspring than late arrivals. Researchers also found that early arrival was strongly linked to a bird's body condition at the end of the previous winter. If a harsh winter significantly reduced the body condition of most birds in a population, researchers would most likely predict that the following spring's average arrival time would ______.", "opts": ["remain exactly the same, since arrival time is unrelated to body condition", "have no effect on which nesting sites are claimed", "be earlier than usual, since birds would rush to compensate for the harsh winter", "be later than usual, reducing the number of birds able to claim the highest-quality nesting sites"], "ci": 3, "exp": "Since arrival time is tied to body condition, and the winter harmed body condition broadly, researchers would predict later arrivals and fewer birds securing top sites, matching the correct choice. Poor body condition would not cause earlier arrival, since the study links good condition to early arrival, not urgency. The passage directly ties arrival time to body condition, so it would not remain unrelated. Later arrival would directly affect which sites are claimed, given the study's findings.", "tag": "Inferences", "tagcolor": "#185FA5"}, {"stem": "The student wants to emphasize that Lovelace's contribution went beyond simple calculation. Which choice most effectively uses the given information to accomplish this goal?", "passage": "- Ada Lovelace worked with Charles Babbage on his proposed Analytical Engine.<br>- In 1843, she published notes describing how the machine could go beyond calculation to manipulate symbols according to rules.<br>- Many historians consider her notes the first published description of a computer algorithm.", "opts": ["In 1843, Ada Lovelace published notes showing that Babbage's Analytical Engine could manipulate symbols according to rules, not just perform calculations, a description many historians consider the first computer algorithm.", "Charles Babbage proposed a machine called the Analytical Engine.", "Many historians consider Ada Lovelace's notes the first published description of a computer algorithm.", "Ada Lovelace worked with Charles Babbage on his proposed Analytical Engine."], "ci": 0, "exp": "Only the correct choice explicitly states that the machine could do more than calculate, symbol manipulation, which is exactly the point the student wants to emphasize. The other choices each omit the detail that the machine's ability went beyond calculation, so none of them highlights that specific contribution.", "tag": "Rhetorical Synthesis", "tagcolor": "#185FA5"}, {"stem": "Which choice most logically completes the text?", "passage": "Paleontologists have long relied on fossilized bones to reconstruct the appearance of extinct animals, but bones alone reveal little about soft tissues such as skin color or feather patterns. Recent analysis of pigment-bearing structures preserved in exceptionally well-preserved fossils has allowed researchers to determine the actual coloration of some feathered dinosaurs. If a newly discovered fossil were found to lack any preserved pigment-bearing structures, researchers attempting to determine that animal's coloration would most likely ______.", "opts": ["abandon fossil analysis entirely as a field of study", "have to rely on comparisons with related species rather than direct physical evidence", "be able to determine the coloration with complete certainty regardless", "conclude that the animal had no coloration at all"], "ci": 1, "exp": "Since coloration is determined from preserved pigment-bearing structures, their absence would force researchers to rely on indirect comparisons instead, matching the correct choice. Certainty would not be possible without the direct evidence the passage describes. Lacking evidence of coloration doesn't mean the animal had none. One missing fossil detail wouldn't cause researchers to abandon the entire field.", "tag": "Inferences", "tagcolor": "#185FA5"}, {"stem": "The student wants to highlight both the rainforest's ecological importance and its enormous geographic scale in a single sentence. Which choice most effectively combines the relevant information to accomplish this goal?", "passage": "- The Amazon rainforest produces roughly 20 percent of the world's oxygen.<br>- It spans across nine countries in South America.<br>- It is home to an estimated 10 percent of all known species on Earth.", "opts": ["Spanning nine countries across South America, the Amazon rainforest produces roughly 20 percent of the world's oxygen and shelters an estimated 10 percent of all known species.", "The Amazon rainforest spans across nine countries in South America.", "An estimated 10 percent of all known species live in the Amazon rainforest.", "The Amazon rainforest produces roughly 20 percent of the world's oxygen."], "ci": 0, "exp": "The correct choice combines the reef's, rather the rainforest's, geographic scale (nine countries) with two measures of ecological importance (oxygen production and species diversity) in one sentence. The other choices each present only scale or only one measure of importance, not both together.", "tag": "Rhetorical Synthesis", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the text with the most logical and precise word?", "passage": "Critics initially dismissed the young architect's design as needlessly ______, filled with ornamental flourishes that seemed to serve no structural purpose, until later scholars argued that the details reflected a deliberate artistic philosophy.", "opts": ["practical", "minimalist", "unfinished", "ornate"], "ci": 3, "exp": "\"filled with ornamental flourishes\" directly matches the meaning of \"ornate,\" heavily decorated. \"minimalist\" and \"practical\" both suggest simplicity or function, contradicting the description of unnecessary decoration. \"unfinished\" doesn't fit a design already filled with detailed flourishes.", "tag": "Words in Context", "tagcolor": "#185FA5"}, {"stem": "Which choice best states the main purpose of the text?", "passage": "City planners have long assumed that adding trees to urban neighborhoods primarily improves aesthetics and air quality. Recent thermal-imaging studies of several mid-sized cities, however, reveal that neighborhoods with dense tree canopy can be up to seven degrees cooler during summer heat waves than nearby neighborhoods with little vegetation, a difference large enough to meaningfully reduce heat-related illness. These findings reframe urban trees as a public health tool rather than a purely decorative one.", "opts": ["To explain why some neighborhoods have historically had fewer trees than others.", "To argue that urban trees provide a significant public health benefit by cooling neighborhoods, beyond their decorative value.", "To argue that city planners should stop planting trees for aesthetic reasons.", "To describe how thermal-imaging cameras are manufactured."], "ci": 1, "exp": "The text's central claim is that trees provide a meaningful cooling benefit that reduces illness, reframing them as a health tool, matching the correct choice. The text mentions thermal-imaging only as a research method, not its subject. It never argues planners should stop valuing aesthetics, only that health benefits should also be recognized. It never explains why some neighborhoods historically had fewer trees.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}, {"stem": "Which finding, if true, would most directly support the nutritionist's claim?", "passage": "A nutritionist claims that a new meal-delivery program reduced participants' average weekly grocery spending.", "opts": ["Participants' receipts showed a 12 percent drop in average weekly grocery costs after joining the program.", "Participants reported enjoying the taste of the delivered meals.", "The program's website received more visitors after a marketing campaign.", "Participants exercised more often after starting the program."], "ci": 0, "exp": "Since the claim is specifically about reduced grocery spending, a direct measurement of that spending, as in the drop in receipts, most directly supports it. Enjoying the taste doesn't measure spending. Website visits reflect marketing reach, not spending. Increased exercise is unrelated to grocery costs.", "tag": "Command of Evidence", "tagcolor": "#185FA5"}, {"stem": "Which finding would most strongly support the engineer's hypothesis?", "passage": "An engineer hypothesizes that adding a specific polymer coating extends the lifespan of outdoor park benches exposed to sunlight and rain.", "opts": ["Park visitors rated the coated benches as more comfortable to sit on.", "Coated benches installed in a park showed significantly less cracking and fading after two years than uncoated benches in the same park.", "Coated benches were more expensive to manufacture than uncoated benches.", "The same number of benches were installed in parks across the city that year."], "ci": 1, "exp": "Since the hypothesis is specifically about lifespan under sun and rain exposure, direct evidence of less cracking and fading over time most strongly supports it. Manufacturing cost doesn't address durability. Comfort ratings don't address durability either. The number of benches installed says nothing about how well the coating performs.", "tag": "Command of Evidence", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the text with the most logical and precise word?", "passage": "Although the negotiations had proceeded smoothly for weeks, a single disputed clause proved so ______ that both sides abandoned the talks entirely rather than compromise on it.", "opts": ["forgettable", "trivial", "intractable", "flexible"], "ci": 2, "exp": "Since the disagreement was severe enough to end the talks entirely, the clause must have been extremely difficult to resolve, matching \"intractable.\" \"trivial\" and \"forgettable\" both suggest unimportance, which contradicts the talks collapsing over it. \"flexible\" suggests ease of compromise, the opposite of what happened.", "tag": "Words in Context", "tagcolor": "#185FA5"}, {"stem": "Which choice best states the main idea of the text?", "passage": "For decades, biologists debated whether the waggle dance performed by returning honeybee scouts actually conveyed precise directional information to other bees or merely signaled general excitement about a food source. Careful field experiments, in which researchers displaced dancing bees to artificial locations and tracked where hivemates subsequently searched, demonstrated that the angle and duration of the dance correspond closely to the direction and distance of the food source relative to the sun. This evidence effectively settled the debate in favor of the dance conveying genuine spatial information.", "opts": ["Field experiments confirmed that the honeybee waggle dance communicates precise spatial information about food sources rather than mere excitement.", "The waggle dance was invented by biologists to study bee behavior.", "Honeybees rely entirely on scent, not dance, to locate food sources.", "Researchers have proven that bees cannot sense the position of the sun."], "ci": 0, "exp": "The text centers on experiments showing the dance's angle and duration correspond to real spatial information, matching \"Field experiments confirmed that the honeybee waggle dance communicates precise spatial information about food sources rather than mere excitement.\" The text never claims bees rely entirely on scent instead of dance. It never claims bees cannot sense the sun's position, since the dance is described as relative to the sun. The dance is a natural behavior the text describes, not something biologists invented.", "tag": "Central Ideas and Details", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
