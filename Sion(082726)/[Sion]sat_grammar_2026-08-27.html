<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_siongrammar_20_20260826_v1";var ATT_KEY = "quiz_siongrammar_20_att_20260826_v1";var RAW_QUESTIONS = [{"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The lab results confirmed the initial hypothesis. <u>In contrast</u>, the research team proceeded to the next phase of the study.", "opts": ["In contrast", "Regardless", "Consequently", "Conversely"], "ci": 2, "exp": "Since confirming the hypothesis is the reason the team moved forward, a transition showing a result, like \"Consequently,\" fits best. \"In contrast,\" \"Conversely,\" and \"Regardless\" all signal opposition or contrast, but the two sentences describe a logical cause-and-effect sequence, not a contradiction.", "tag": "Transitions", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "Each of the proposed amendments to the bylaws <u>require</u> a two-thirds majority vote to pass.", "opts": ["are requiring", "require", "requires", "have required"], "ci": 2, "exp": "\"Each\" is always singular, regardless of the plural noun \"amendments\" that follows it, so the singular verb \"requires\" is correct. \"require,\" \"are requiring,\" and \"have required\" are all plural or otherwise mismatched forms that don't agree with the singular subject \"Each.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The museum's newest exhibit<u>, which opened last Friday</u> has already drawn record crowds.", "opts": ["(which opened last Friday)", ", which opened last Friday,", "which opened last Friday,", ", which opened last Friday"], "ci": 1, "exp": "A nonessential clause in the middle of a sentence needs a comma both before and after it. \", which opened last Friday,\" correctly closes off the clause on both sides. \", which opened last Friday\" is missing the closing comma before \"has.\" \"which opened last Friday,\" is missing the opening comma after \"exhibit.\" \"(which opened last Friday)\" uses parentheses instead of the comma pair the surrounding sentence structure calls for.", "tag": "Punctuation - Nonessential Clause", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>Due to the fact that</u> the bridge was closed for repairs, commuters had to take a longer route to work.", "opts": ["Due to the fact that", "Because", "On account of the fact that", "Owing to the fact that"], "ci": 1, "exp": "\"Because\" conveys the same cause-and-effect meaning in a single concise word. \"Due to the fact that,\" \"Owing to the fact that,\" and \"On account of the fact that\" are all wordy phrases that say the same thing with unnecessary extra words.", "tag": "Concision", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The rehearsal ran late<u>, the director decided to cancel the final scene.</u>", "opts": [", however the director decided to cancel the final scene.", ", the director decided to cancel the final scene.", ", so the director decided to cancel the final scene.", "; and the director decided to cancel the final scene."], "ci": 2, "exp": "Two independent clauses joined only by a comma create a comma splice, so the fix must add a coordinating conjunction like \"so\" to show the cause-and-effect relationship. \", the director decided...\" keeps the original comma splice unfixed. \", however the director decided...\" pairs a comma with \"however,\" which still creates a comma splice since \"however\" is not a coordinating conjunction. \"; and the director decided...\" incorrectly combines a semicolon with the conjunction \"and,\" which is redundant punctuation for joining two clauses.", "tag": "Punctuation - Comma Splice", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>Exhausted from the overnight shift, the diagnosis was nearly missed by the resident physician</u>.", "opts": ["Having been exhausted from the overnight shift, the diagnosis was nearly missed by the resident physician", "Exhausted from the overnight shift, the resident physician's diagnosis was nearly missed", "Exhausted from the overnight shift, the resident physician nearly missed the diagnosis", "Exhausted from the overnight shift, the diagnosis was nearly missed by the resident physician"], "ci": 2, "exp": "The opening phrase \"Exhausted from the overnight shift\" must modify the person who was exhausted, so the subject that follows the comma should be \"the resident physician.\" \"Exhausted...the resident physician nearly missed the diagnosis\" correctly places the physician right after the comma. \"the diagnosis was nearly missed by the resident physician\" places the diagnosis, not the physician, right after the modifier, so the sentence illogically suggests the diagnosis was exhausted. \"the resident physician's diagnosis was nearly missed\" makes the same error, since \"diagnosis\" is still the noun the modifier attaches to. \"Having been exhausted...the diagnosis was nearly missed\" repeats the same dangling-modifier problem.", "tag": "Modifier Placement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The chef prepared three courses for the tasting menu<u>;</u> a chilled soup, a seared fish entree, and a citrus tart.", "opts": [":", " -", ";", ","], "ci": 0, "exp": "A colon correctly introduces the list that explains what the three courses were. A semicolon is used to join two independent clauses or separate complex list items, not to introduce a simple list after a complete sentence. A comma alone cannot introduce a list this way. A single dash is not the conventional punctuation for introducing a list following a complete independent clause here.", "tag": "Punctuation - Colon vs. Semicolon", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "Every morning before the store opens, the manager <u>checked</u> the inventory and restocks the shelves.", "opts": ["checks", "has checked", "checked", "was checking"], "ci": 0, "exp": "Since the sentence describes a routine habit in the present tense, shown by \"restocks,\" the first verb must also be present tense: \"checks.\" \"checked\" is past tense and breaks the tense consistency. \"has checked\" and \"was checking\" both introduce different tenses that don't match the simple present routine described by \"restocks.\"", "tag": "Verb Tense Consistency", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "By the end of the semester, most of the <u>students'</u> final projects had exceeded the professor's expectations.", "opts": ["students's", "students'", "student's", "students"], "ci": 1, "exp": "\"students'\" is the correct plural possessive, showing that the final projects belong to more than one student. \"student's\" is singular possessive, which doesn't match \"most of the.\" \"students\" is only plural, with no possessive meaning at all. \"students's\" is not a standard English possessive form.", "tag": "Apostrophes", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "By the time the inspectors arrived at the warehouse, the workers <u>already remove</u> the damaged shipment from the loading dock.", "opts": ["have already removed", "already remove", "already removed", "had already removed"], "ci": 3, "exp": "Because the removal happened before another past event (\"the inspectors arrived\"), the past-perfect \"had already removed\" is required. \"already remove\" is present tense and doesn't fit the past-tense sentence. \"already removed\" is simple past, which doesn't show that the action was completed before the inspectors' arrival. \"have already removed\" is present perfect, which doesn't fit a sentence anchored entirely in the past.", "tag": "Verb Tense Consistency", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The <u>set of blueprints, revised twice by the engineering team after the site inspection, contain</u> a critical measurement error.", "opts": ["sets of blueprints, revised twice by the engineering team after the site inspection, contain", "set of blueprints, having been revised twice by the engineering team after the site inspection, contain", "set of blueprints, revised twice by the engineering team after the site inspection, contains", "set of blueprints, revised twice by the engineering team after the site inspection, contain"], "ci": 2, "exp": "The subject is the singular \"set,\" not the plural object \"blueprints\" inside the intervening phrase, so it needs the singular verb \"contains.\" \"set of blueprints...contain\" pairs a singular subject with a plural verb. \"sets of blueprints...contain\" changes the subject to plural instead of fixing the agreement. \"having been revised...contain\" keeps the same mismatch between the singular subject and the plural verb.", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The city council approved the new bike lanes after months of debate. <u>However</u>, local business owners had raised concerns about reduced parking.", "opts": ["On the other hand", "Indeed", "Nevertheless", "However"], "ci": 1, "exp": "Since the sentence about business owners' concerns supports rather than contradicts the approval described just before it, a transition confirming continuity like \"Indeed\" fits best. \"However,\" \"Nevertheless,\" and \"On the other hand\" all signal contrast, but the surrounding sentences describe a consistent sequence of events rather than opposing ideas.", "tag": "Transitions", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The grant proposal requires applicants to outline their research goals, <u>describing their methodology, and to submit</u> a detailed budget.", "opts": ["to describe their methodology, and submitting", "describe their methodology, and submitting", "describing their methodology, and to submit", "to describe their methodology, and to submit"], "ci": 3, "exp": "All three items in the list must match the infinitive form of \"to outline.\" \"to describe their methodology, and to submit\" keeps every item in the infinitive form. \"describing their methodology, and to submit\" shifts the second item to a gerund. \"to describe their methodology, and submitting\" shifts the third item to a gerund instead. \"describe their methodology, and submitting\" breaks the pattern in two different ways at once.", "tag": "Parallel Structure", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The company revised its policy after receiving <u>customers</u> complaints about the delayed shipments.", "opts": ["customers'", "customers's", "customers", "customer's"], "ci": 0, "exp": "\"customers'\" is the correct plural possessive, showing the complaints belong to multiple customers. \"customers\" alone is just plural, with no possessive meaning. \"customer's\" is singular possessive, which doesn't match the plural meaning implied by a company receiving many complaints. \"customers's\" is not a standard possessive form.", "tag": "Apostrophes", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The workshop taught participants how to negotiate contracts, manage client relationships, and <u>how they can resolve</u> disputes efficiently.", "opts": ["how resolving", "resolving", "how to resolve", "how they can resolve"], "ci": 2, "exp": "To match \"how to negotiate\" and the implied \"how to manage,\" the third item should also use the \"how to\" infinitive pattern: \"how to resolve.\" \"how they can resolve\" breaks the pattern by switching to a full clause. \"resolving\" drops the \"how to\" structure entirely. \"how resolving\" awkwardly combines the two patterns without forming a grammatical phrase.", "tag": "Parallel Structure", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>In spite of the fact that</u> the forecast predicted rain, the outdoor festival continued as planned.", "opts": ["Regardless of the fact that", "In spite of the fact that", "Although", "Despite the fact that"], "ci": 2, "exp": "\"Although\" expresses the same contrast in one concise word. \"In spite of the fact that,\" \"Despite the fact that,\" and \"Regardless of the fact that\" are all needlessly wordy ways of expressing the same contrast.", "tag": "Concision", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>Written in only three weeks, critics praised the novel</u> for its vivid imagery.", "opts": ["Written in only three weeks, critics praised the novel", "Written in only three weeks, the novel earned praise from critics", "Having been written in only three weeks, critics praised the novel", "Written in only three weeks, the novel's praise from critics"], "ci": 1, "exp": "The modifier \"Written in only three weeks\" describes the novel, so the noun right after the comma should be \"the novel.\" \"Written in only three weeks, the novel earned praise from critics\" places \"the novel\" correctly. \"critics praised the novel\" places \"critics\" right after the modifier, illogically suggesting the critics were written in three weeks. \"the novel's praise from critics\" awkwardly turns the sentence into a fragment without a proper verb. \"Having been written...critics praised the novel\" repeats the same dangling-modifier error.", "tag": "Modifier Placement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "After the negotiators and the union representatives finished the meeting, <u>they</u> released a joint statement to the press.", "opts": ["a joint statement was released", "they released a joint statement", "the negotiators released a joint statement", "those individuals released a joint statement"], "ci": 2, "exp": "\"they\" could refer to either \"the negotiators\" or \"the union representatives,\" leaving the sentence ambiguous. \"the negotiators released a joint statement\" removes that ambiguity by naming a specific group. \"they\" keeps the vague pronoun. \"those individuals\" is still vague since it could describe either group. \"a joint statement was released\" drops the actor the sentence needs to identify.", "tag": "Pronoun Reference", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The award will be presented to <u>whoever</u> the committee selects as this year's top volunteer.", "opts": ["whomever", "whoever", "whom", "who"], "ci": 0, "exp": "\"whomever\" is correct because it functions as the object of the verb \"selects\" within its own clause (\"the committee selects whomever\"). \"whoever\" is a subject pronoun and can't serve as the object of \"selects.\" \"who\" and \"whom\" don't match the indefinite meaning needed here, since the sentence isn't referring to one specific, already-identified person.", "tag": "Pronoun Case", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "Neither the coach nor the players <u>was</u> aware of the schedule change until the morning of the match.", "opts": ["is", "has been", "was", "were"], "ci": 3, "exp": "With \"neither...nor,\" the verb agrees with the closer subject, which here is the plural \"players,\" so the plural verb \"were\" is correct. \"was,\" \"is,\" and \"has been\" are all singular forms that don't agree with \"players.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);

  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}

var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
