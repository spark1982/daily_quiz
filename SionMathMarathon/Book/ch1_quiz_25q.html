<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;color:#111;min-height:100vh}
#quiz-wrap{max-width:820px;margin:0 auto;padding:12px}
#date-display{font-size:2rem;font-weight:800;text-align:center;color:#1D9E75;background:#fff;padding:8px 0 2px}
#quiz-title{font-size:1.35rem;font-weight:800;text-align:center;color:#111;padding:4px 0 2px}
#subtitle-bar{text-align:center;font-size:0.9rem;color:#555;padding:2px 0 4px}
.instruction{text-align:center;font-size:0.88rem;color:#555;background:#fff;padding:4px 0 8px}
#nav-bar{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,0.07)}
#progress-row{display:flex;align-items:center;gap:8px}

#prog-track{flex:1;height:6px;background:#d7dde6;border-radius:3px;overflow:hidden}
#prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width 0.2s}
#jump-btn{font-size:0.78rem;padding:3px 10px;border:1px solid #1D9E75;background:#fff;color:#1D9E75;border-radius:12px;cursor:pointer;white-space:nowrap}
#dots-panel{display:none;max-height:170px;overflow-y:auto;padding:8px 4px 4px;flex-wrap:wrap;gap:5px;margin-top:6px}
.dot{width:28px;height:28px;border-radius:50%;font-size:0.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:#d7dde6;color:#555}
.dot.correct{background:#1D9E75;color:#fff}
.dot.wrong{background:#E24B4A;color:#fff}
.dot.results-pill{width:auto;padding:0 10px;border-radius:12px;background:#185FA5;color:#fff;font-size:0.72rem}

#prev-btn,#next-btn{padding:9px 22px;border-radius:7px;border:none;font-size:0.95rem;font-weight:700;cursor:pointer}
#prev-btn{background:#e8edf4;color:#333}
#next-btn{background:#1D9E75;color:#fff}
#results-screen{display:none;background:#fff;border-radius:10px;padding:18px 16px;box-shadow:0 1px 6px rgba(0,0,0,0.08)}
#results-heading{font-size:1.3rem;font-weight:800;color:#1D9E75;text-align:center;margin-bottom:6px}

#results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.res-card{border-radius:8px;padding:8px 10px;font-size:0.82rem;cursor:pointer;background:#f5f7fa}

#modal-box h3{margin-bottom:10px;font-size:1.05rem}
#modal-box p{font-size:0.88rem;color:#555;margin-bottom:16px}

#modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:7px;cursor:pointer;font-weight:700}

</style>

<body>
<div id="quiz-wrap">
  <div id="quiz-title">Chapter 1 Practice Quiz</div>
  <div id="subtitle-bar">Examples &amp; Problems | Total Attempts: <span id="att-display">0</span></div>
  <div class="instruction">Choose the best answer for each problem.</div>
  <div id="nav-bar">
    <div id="progress-row">
      <span id="prog-label">0 / 25</span>
      <div id="prog-track"><div id="prog-fill" style="width:0%"></div></div>
      <button id="jump-btn" onclick="window.toggleDots()">Jump</button>
    </div>
    <div id="dots-panel"></div>
  </div>
  <div id="quiz-area">
    <span class="type-tag" id="type-tag">Invariant</span>
    <div id="q-number"></div>
    <div id="q-text"></div>
    <div id="options"></div>
    <div id="explanation"></div>
    <div id="btn-row">
      <button id="prev-btn" onclick="window.prevQ()">Prev</button>
      <button id="next-btn" onclick="window.nextQ()">Next</button>
    </div>
  </div>
  <div id="results-screen">
    <div id="results-heading">Results</div>
    <div id="results-score"></div>
    <div id="results-grid"></div>
    <div id="res-btn-row">
      <button id="retry-btn" onclick="window.retryWrong()">Retry Wrong Ones</button>
      <button id="copy-btn" onclick="window.copyResults()">Copy All Results</button>
      <button id="fresh-btn-original" class="fresh-btn" onclick="window.askFresh('original')">Start Fresh (Original Order)</button>
      <button id="fresh-btn-random" class="fresh-btn" onclick="window.askFresh('random')">Start Fresh (Random Order)</button>
    </div>
  </div>
</div>
<div id="modal-overlay">
  <div id="modal-box">
    <h3 id="modal-title">Start Fresh (Original Order)?</h3>
    <p id="modal-text">Questions will return to their original order, and all progress will be reset.</p>
    <button id="modal-cancel" onclick="window.closeModal()">Cancel</button>
    <button id="modal-confirm" onclick="window.confirmFresh()">Yes, Start Fresh</button>
  </div>
</div>
<script>
(function(){
const LSKEY='quiz_ch1_25q_v1';
const LSATT='quiz_ch1_25q_att_v1';

const QUESTIONS=[
// --- EXAMPLES ---
{tag:'Invariant',
 text:'In the sequence 2001, 2002, 2003, &hellip;, each term after the third is found by subtracting the previous term from the sum of the two terms that precede that term. For example, the fourth term is 2001 + 2002 &minus; 2003 = 2000. What is the 2004th term in this sequence? (AMC 12)',
 options:['0','2001','2004','1'],
 ci:0,
 explanation:'The sequence has period 6: 2001, 2002, 2003, 2000, 1999, 2000, 2001, &hellip; Since 2004 = 6 &times; 334, the 2004th term equals the 6th term, which is 0.'
},
{tag:'Pigeonhole',
 text:'Fifteen chairs are evenly placed around a circular table on which are name cards for fifteen guests, also evenly spaced. The guests fail to notice these cards until after they have sat down, and it turns out that no one is sitting in front of his own card. Is it possible for the table to be rotated so that at least two of the guests are simultaneously sitting in front of their own cards?',
 options:['possible','impossible'],
 ci:0,
 explanation:'Consider the 15 possible rotations (by 1, 2, &hellip;, 15 positions). For each guest, exactly one rotation places them in front of their card. Summing over all 15 guests gives 15 guest-rotation pairs across 14 nontrivial rotations, so by Pigeonhole some rotation works for at least two guests simultaneously.'
},
{tag:'Invariant',
 text:'A grasshopper jumps along a line. His first jump takes him 1 cm, his second 2 cm, and so on. Each jump can take him to the right or to the left. Is it possible that after 2010 jumps the grasshopper returns to the point at which he started? (Russia)',
 options:['impossible','possible'],
 ci:0,
 explanation:'The total distance 1+2+&hellip;+2010 = 2010&times;2011/2 = 2021055, which is odd. For the grasshopper to return to the start, the sum of rightward jumps must equal the sum of leftward jumps, requiring the total to be even. Since it is odd, it is impossible.'
},
{tag:'Game Theory',
 text:'A box has 300 matches. Two players take turns removing no more than half the matches in the box. The player who can&rsquo;t move loses. Who can guarantee a win?',
 options:['Player 1','Player 2'],
 ci:0,
 explanation:'Player 1 wins by always leaving a power of 2 minus 1 matches. On the first move, take 300 &minus; 255 = 45 matches to leave 255 = 2<sup>8</sup> &minus; 1. Then mirror the opponent&rsquo;s moves to maintain this strategy.'
},
{tag:'Pigeonhole',
 text:'On a large, flat field, 15 people are positioned so that for each person the distances to all the other people are different. Each person holds a water gun and at a given signal fires and hits the person who is closest. Is it possible that everyone gets wet? (CMO)',
 options:['impossible','possible'],
 ci:0,
 explanation:'Consider the pair of people with the smallest distance between them. Each fires at the other, so both get wet. But the person closest to any other player is unique, and this closest-pair argument shows a contradiction if everyone gets wet &mdash; no, it is impossible for everyone to be wet: the person who is nobody&rsquo;s closest neighbor cannot be hit.'
},
// --- PROBLEMS ---
{tag:'Pigeonhole',
 text:'A basket of fruit is arranged out of apples, bananas, and oranges. What is the smallest number of fruit that should be put in the basket to guarantee that there are either at least 8 apples or at least 6 bananas or at least 9 oranges?',
 options:['21','20','22','19'],
 ci:0,
 explanation:'By the Pigeonhole Principle, the worst case is 7 apples, 5 bananas, and 8 oranges = 20 fruit without meeting the condition. So 21 fruit are needed to guarantee it.'
},
{tag:'Pigeonhole',
 text:'Six distinct positive integers are randomly chosen between 1 and 2006, inclusive. What is the probability that some pair of these integers has a difference that is a multiple of 5? (AMC 10)',
 options:['1','0','1/2','3/5'],
 ci:0,
 explanation:'Any integer has one of 5 residues mod 5. Choosing 6 integers, by Pigeonhole two must share the same residue, so their difference is always a multiple of 5. The probability is 1.'
},
{tag:'Pigeonhole',
 text:'Is it true that in any group of 8 people, there are two people in the group who have the same number of friends among the people in the group?',
 options:['true','false'],
 ci:0,
 explanation:'Each person can have 0 to 7 friends in the group, but 0 friends and 7 friends cannot both occur simultaneously. So there are at most 7 possible values for 8 people, and by Pigeonhole at least two share the same number of friends.'
},
{tag:'Combinatorics',
 text:'There are 100 soldiers in a detachment, and every evening three of them are on duty. Can it happen that after a certain period of time each soldier has shared duty with every other soldier exactly once? (Russia)',
 options:['no','yes'],
 ci:0,
 explanation:'Each soldier must share duty with 99 others, and each duty night creates 3 pairs. So the number of duty nights for one soldier is 99/2, which is not an integer. Therefore it is impossible.'
},
{tag:'Pigeonhole',
 text:'The sum of the ages of the 33 students in a class is 430 years. Are there 20 students in the class such that the sum of their ages is greater than 260?',
 options:['there are','there are not'],
 ci:0,
 explanation:'Suppose every group of 20 has sum &le; 260. The 13 remaining students have sum &ge; 430 &minus; 260 = 170, so average age &ge; 170/13 > 13. Then the 20 youngest students have sum &le; 260, but the 20 oldest have sum = 430 minus the 13 youngest. Since the 13 youngest average under 430/33 &approx; 13, the 20 oldest sum exceeds 260. So there are such 20 students.'
},
{tag:'Invariant',
 text:'Pete bought a notebook containing 96 pages, and numbered them from 1 through 192. Victor tore out 25 pages of Pete&rsquo;s notebook, and added the 50 numbers he found on the pages. Could Victor get 1990 as the sum? (Russia)',
 options:['no','yes'],
 ci:0,
 explanation:'Each physical page has two sides numbered n and n+1 (consecutive integers) summing to 2n+1 (odd). The sum of 25 such pairs is the sum of 25 odd numbers, which is odd. Since 1990 is even, Victor could not get 1990.'
},
{tag:'Graph Theory',
 text:'In the Parliament of Sikinia, each member has at most three enemies. Is it possible that the house be separated into two houses, so that each member has at most one enemy in his or her own house? (Engel)',
 options:['possible','impossible'],
 ci:0,
 explanation:'Model as a graph and repeatedly move any member who has more than one enemy in their own house to the other house. Each such move strictly decreases the number of enemy pairs within houses, so the process terminates with the desired partition.'
},
{tag:'Combinatorics',
 text:'There are 51 senators in a senate. The senate needs to be divided into n committees such that each senator is on exactly one committee. Each senator hates exactly three other senators. (If A hates B, then B does not necessarily hate A.) Find the smallest n such that it is always possible to arrange the committees so that no senator hates another senator on his or her committee. (MOP)',
 options:['7','6','8','5'],
 ci:0,
 explanation:'Each senator hates 3 others, so a senator&rsquo;s committee can include none of their 3 enemies. By a greedy coloring argument on a directed graph with max out-degree 3, 4 colors do not always suffice. The answer is 7.'
},
{tag:'Pigeonhole',
 text:'Of 101 coins, 50 are counterfeit, and differ from the genuine coins in weight by 1 gram. Dmitri has a balance scale which shows the difference in weights between the objects placed in each pan. He chooses one coin, and wants to find out in one weighing whether it is counterfeit or not. Can he do this? (Russia)',
 options:['he can','he cannot'],
 ci:0,
 explanation:'Dmitri places 50 coins on each side, keeping his chosen coin aside. If the chosen coin is genuine, the 50 counterfeits are distributed between the two pans; if counterfeit, 49 counterfeits are on one side. The difference in readings between these two cases reveals whether the coin is counterfeit.'
},
{tag:'Invariant',
 text:'There are three piles of stones. The first has 19, the second has 8, and the third has 9 stones. You are allowed to choose two piles and transfer one stone from each of these two piles to the third pile. After several of these operations, is it possible that each of the three piles has 12 stones?',
 options:['impossible','possible'],
 ci:0,
 explanation:'Consider the pile sizes mod 3. Initially: 19 &equiv; 1, 8 &equiv; 2, 9 &equiv; 0 (mod 3). Each operation changes two piles by &minus;1 and one by +2, preserving each pile&rsquo;s residue mod 3 in the multiset. The target (12, 12, 12) has all residues 0, but {0, 1, 2} &ne; {0, 0, 0}, so it is impossible.'
},
{tag:'Invariant',
 text:'Is it true that every polyhedron has at least two faces with the same number of edges? (Engel)',
 options:['true','false'],
 ci:0,
 explanation:'Suppose all faces have distinct numbers of edges. The minimum face has at least 3 edges. If F is the number of faces, the minimum total edge-face incidences is 3+4+&hellip;+(F+2). By Euler&rsquo;s formula and edge-counting, a contradiction arises, so at least two faces must share the same edge count.'
},
{tag:'Invariant',
 text:'There are 13 green, 15 blue, and 17 red chameleons on Camelot Island. Whenever two chameleons of different colors meet, they both swap to the third color. Is it possible for all chameleons to become one color? (Russia)',
 options:['impossible','possible'],
 ci:0,
 explanation:'The differences between the counts modulo 3 are preserved as an invariant. Initially the counts are 13, 15, 17, with differences 13&minus;15=&minus;2, 15&minus;17=&minus;2, 13&minus;17=&minus;4 (mod 3: 1, 1, 2). For all one color (45, 0, 0), the differences mod 3 would be 0, 0, 0. Since the invariant differs, it is impossible.'
},
{tag:'Invariant',
 text:'There is a positive integer in each square of a rectangular table. In each move, you may double each number in a row or subtract 1 from each number of a column. Can you reach a table of zeros with these moves? (Engel)',
 options:['you can','you cannot'],
 ci:0,
 explanation:'To zero out a column, subtract 1 repeatedly. To make all entries equal first, use row doublings. Since all entries are positive integers and doubling always keeps them positive, we can reach any target values by doubling rows appropriately and then subtracting columns down to zero.'
},
{tag:'Invariant',
 text:'Initially, 9 of the 100 squares in a 10 &times; 10 grid are infected. During each unit time interval, each square which has 2 or more infected neighbors (a neighbor being a square which shares an edge) also becomes infected. Is it possible that all 100 squares will eventually become infected?',
 options:['impossible','possible'],
 ci:0,
 explanation:'Consider the perimeter of the infected region. Each newly infected square has at least 2 infected neighbors, so at most 2 new exposed edges are added and at least 2 are removed &mdash; the perimeter never increases. The initial perimeter of 9 squares is at most 36, but the final perimeter of the full grid is 40. So it is impossible.'
},
{tag:'Game Theory',
 text:'In a certain two-person game, each player, in turn, removes 1, 2, 3, 4, or 5 toothpicks from a common pile, until the pile is exhausted. The player who takes the last toothpick loses. If the starting pile contains 300 toothpicks, how many toothpicks must the first player take on the first turn to guarantee a win with perfect subsequent play? (KMCTST)',
 options:['5','1','2','3'],
 ci:0,
 explanation:'The losing positions are multiples of 6. After the first player takes 5, leaving 295 &mdash; wait, 300 mod 6 = 0, so the first player is already in a losing position if they leave a multiple of 6. The first player should take 5, leaving 295. Then whatever the second player takes (k), the first player takes (6&minus;k), maintaining multiples-of-6 control toward leaving 1 for the opponent. Actually: leave positions that are 1 mod 6. Take 5 to leave 295 = 49&times;6+1. The answer is 5.'
},
{tag:'Graph Theory',
 text:'In a ping pong tournament with no ties allowed, each player plays with everyone else exactly once. Is there some unfortunate player such that every other player either beat him or beat someone who beat him? (Engel)',
 options:['there is','there is not'],
 ci:0,
 explanation:'Consider the player with the most wins. Every player who beat this player was in turn beaten by someone the top player beat (or the top player beat them). This player serves as the "unfortunate" player: everyone either beat him or lost to someone he beat.'
},
{tag:'Invariant',
 text:'Starting with the set {3, 4, 12}, you are allowed to replace any two numbers a and b with the new pair 0.6a &minus; 0.8b and 0.8a + 0.6b. Can you transform the set into {4, 6, 12}? (Engel)',
 options:['no','yes'],
 ci:0,
 explanation:'The operation (a, b) &rarr; (0.6a&minus;0.8b, 0.8a+0.6b) is a rotation preserving a<sup>2</sup>+b<sup>2</sup>. In {3,4,12}: 3<sup>2</sup>+4<sup>2</sup>=25, 12<sup>2</sup>=144. In {4,6,12}: 4<sup>2</sup>+6<sup>2</sup>=52, 12<sup>2</sup>=144. Since the third number stays fixed, we need the pair sum of squares to go from 25 to 52, but the operation preserves it. So it is impossible.'
},
{tag:'Pigeonhole',
 text:'A chess player prepares for a tournament by playing some practice games over a period of eight weeks. She plays at least one game per day, but no more than 11 games per week. Is it true that there is a period of consecutive days during which she plays exactly 23 games? (Zeitz)',
 options:['true','false'],
 ci:0,
 explanation:'Let S<sub>i</sub> be the total games after i days (i = 1 to 56). Consider S<sub>i</sub> and S<sub>i</sub>+23. The values S<sub>i</sub> range over 1 to at most 88. By a careful Pigeonhole argument on the 56 values of S<sub>i</sub> and S<sub>i</sub>+23, some pair must coincide, giving exactly 23 games in a consecutive stretch.'
},
{tag:'Invariant',
 text:'There are n identical cars on a circular track. Together they have just enough gas for one car to complete a lap. Is there a car that can complete a lap by collecting gas from the other cars on its way around? (Engel)',
 options:['there is','there is not'],
 ci:0,
 explanation:'Consider starting with one car that has all the gas. It completes the lap. By a rotational argument (or induction on n), there always exists a starting car such that the running total of gas never runs out. That car can complete the lap by collecting gas from all others.'
},
{tag:'Game Theory',
 text:'A king decides to give 100 of his prisoners a test. If they pass, they can go free. Otherwise, the king will execute all of them. The test goes as follows: the prisoners stand in a line, all facing forward. The king puts either a black or a white hat on each prisoner. The prisoners can only see the colors of the hats in front of them. Then, in any order they want, each one guesses the color of the hat on his head. Other than that, the prisoners can not speak. To pass, no more than one of them may guess incorrectly. If they can make their strategy beforehand, can they be assured that they will survive?',
 options:['they can','they cannot'],
 ci:0,
 explanation:'The prisoners agree: the first to guess counts the number of, say, white hats visible and announces a color encoding the parity. This may cost one incorrect guess. Each subsequent prisoner uses the parity information plus what they see to deduce their own hat color exactly. So at most one guess is wrong, and they pass.'
}
];

let state={cur:0,answers:{},shuffles:{},showResults:false,retryMode:false,retryList:[]};
let dotsVisible=false;
const TOTAL=QUESTIONS.length;

const ORDER_KEY=LSKEY+'_order_v1';
function identityOrder(){return QUESTIONS.map((_,i)=>i);}
function isValidOrder(o){if(!Array.isArray(o)||o.length!==TOTAL)return false;const seen=new Set();for(const v of o){if(typeof v!=='number'||v<0||v>=TOTAL||seen.has(v))return false;seen.add(v);}return true;}
function loadOrder(){try{const o=JSON.parse(localStorage.getItem(ORDER_KEY)||'null');return isValidOrder(o)?o:null;}catch(e){return null;}}
function saveOrder(o){localStorage.setItem(ORDER_KEY,JSON.stringify(o));}
function randomOrder(){const a=identityOrder();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let currentOrder=loadOrder()||identityOrder();
saveOrder(currentOrder);
let pendingFreshMode='original';

function loadState(){
  try{
    const raw=localStorage.getItem(LSKEY);
    if(!raw)return;
    const s=JSON.parse(raw);
    if(s.retryMode&&!Array.isArray(s.retryList))throw new Error();
    const listLen=s.retryMode?s.retryList.length:TOTAL;
    if(typeof s.cur!=='number'||s.cur<0||s.cur>=listLen)throw new Error();
    if(typeof s.answers!=='object'||typeof s.shuffles!=='object')throw new Error();
    state=s;
  }catch(e){localStorage.removeItem(LSKEY);}
}
function saveState(){try{localStorage.setItem(LSKEY,JSON.stringify(state));}catch(e){}}
function getAtt(){return parseInt(localStorage.getItem(LSATT)||'0',10);}
function incAtt(){localStorage.setItem(LSATT,String(getAtt()+1));document.getElementById('att-display').textContent=getAtt();}
function getList(){return state.retryMode?state.retryList:currentOrder;}

function getShuffled(qi){
  if(state.shuffles[qi])return state.shuffles[qi];
  const q=QUESTIONS[qi];
  const idxs=q.options.map((_,i)=>i);
  for(let i=idxs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idxs[i],idxs[j]]=[idxs[j],idxs[i]];}
  state.shuffles[qi]=idxs;
  saveState();
  return idxs;
}

function render(){
  try{
    const list=getList();
    const quizArea=document.getElementById('quiz-area');
    const resultsScreen=document.getElementById('results-screen');
    if(state.showResults){
      quizArea.style.display='none';
      resultsScreen.style.display='block';
      renderResults();
      updateNav();
      return;
    }
    resultsScreen.style.display='none';
    quizArea.style.display='block';
    const qi=list[state.cur];
    const q=QUESTIONS[qi];
    document.getElementById('type-tag').textContent=q.tag;
    document.getElementById('q-number').textContent='Question '+(state.cur+1)+' of '+list.length;
    document.getElementById('q-text').innerHTML=q.text;
    const shuffled=getShuffled(qi);
    const answered=state.answers[qi];
    const optDiv=document.getElementById('options');
    optDiv.innerHTML='';
    shuffled.forEach(function(origIdx){
      const btn=document.createElement('button');
      btn.className='opt-btn';
      btn.innerHTML=q.options[origIdx];
      if(answered!==undefined){
        btn.disabled=true;
        if(origIdx===q.ci){btn.classList.add(answered===q.ci?'correct':'revealed');}
        else if(origIdx===answered){btn.classList.add('wrong');}
      } else {
        btn.onclick=function(){window.answer(origIdx);}
      }
      optDiv.appendChild(btn);
    });
    const expDiv=document.getElementById('explanation');
    if(answered!==undefined){
      expDiv.style.display='block';
      expDiv.innerHTML='<b>'+(answered===q.ci?'Correct!':'Wrong.')+'</b> '+q.explanation;
    } else {
      expDiv.style.display='none';
    }
    const nextBtn=document.getElementById('next-btn');
    nextBtn.textContent=(state.cur===list.length-1)?'See Results \u2192':'Next';
    updateNav();
  }catch(e){
    document.getElementById('quiz-area').innerHTML='<p style="color:red">Display error: '+e.message+'</p>';
  }
}

function updateNav(){
  const list=getList();
  const answered=Object.keys(state.answers).filter(k=>list.includes(parseInt(k))).length;
  document.getElementById('prog-label').textContent=answered+' / '+list.length;
  const pct=list.length?Math.round(answered/list.length*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  const panel=document.getElementById('dots-panel');
  panel.innerHTML='';
  list.forEach(function(qi,i){
    const d=document.createElement('button');
    d.className='dot';
    d.textContent=i+1;
    const ans=state.answers[qi];
    if(ans!==undefined){d.classList.add(ans===QUESTIONS[qi].ci?'correct':'wrong');}
    d.onclick=function(){state.cur=i;saveState();render();}
    panel.appendChild(d);
  });
  if(state.showResults){
    const pill=document.createElement('button');
    pill.className='dot results-pill';
    pill.textContent='Results';
    pill.onclick=function(){render();}
    panel.appendChild(pill);
  }
  document.getElementById('att-display').textContent=getAtt();
}

function renderResults(){
  const list=getList();
  let correct=0;
  list.forEach(function(qi){
    const a=state.answers[qi];
    if(a===QUESTIONS[qi].ci)correct++;
  });
  document.getElementById('results-score').textContent=correct+' / '+list.length+' correct';
  const grid=document.getElementById('results-grid');
  grid.innerHTML='';
  list.forEach(function(qi,i){
    const a=state.answers[qi];
    const card=document.createElement('div');
    card.className='res-card '+(a===undefined?'skipped':a===QUESTIONS[qi].ci?'correct':'wrong');
    card.innerHTML='<div class="qn">Q'+(i+1)+'</div><div class="status">'+(a===undefined?'Skipped':a===QUESTIONS[qi].ci?'Correct':'Wrong')+'</div>';
    card.onclick=function(){state.showResults=false;state.cur=i;saveState();render();}
    grid.appendChild(card);
  });
}

window.answer=function(origIdx){
  const list=getList();
  const qi=list[state.cur];
  state.answers[qi]=origIdx;
  saveState();
  render();
};
window.prevQ=function(){if(state.cur>0){state.cur--;saveState();render();}};
window.nextQ=function(){
  const list=getList();
  if(state.cur<list.length-1){state.cur++;saveState();render();}
  else{state.showResults=true;if(!state.retryMode){incAtt();}saveState();render();}
};
window.toggleDots=function(){
  dotsVisible=!dotsVisible;
  document.getElementById('dots-panel').style.display=dotsVisible?'flex':'none';
  document.getElementById('jump-btn').textContent=dotsVisible?'Hide':'Jump';
};
window.retryWrong=function(){
  const list=getList();
  const wrongList=list.filter(qi=>state.answers[qi]!==undefined&&state.answers[qi]!==QUESTIONS[qi].ci);
  if(!wrongList.length){alert('No wrong answers to retry!');return;}
  wrongList.forEach(qi=>{delete state.answers[qi];delete state.shuffles[qi];});
  state.retryMode=true;state.retryList=wrongList;state.cur=0;state.showResults=false;
  saveState();render();
};
window.copyResults=function(){
  const list=getList();
  let txt='Chapter 1 Quiz Results\n';
  list.forEach(function(qi,i){
    const a=state.answers[qi];
    txt+='Q'+(i+1)+': '+(a===undefined?'Skipped':a===QUESTIONS[qi].ci?'Correct':'Wrong')+'\n';
  });
  try{navigator.clipboard.writeText(txt);}catch(e){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  }
};
window.askFresh=function(mode){
  pendingFreshMode=mode;
  const title=document.getElementById('modal-title');
  const text=document.getElementById('modal-text');
  if(mode==='random'){
    title.textContent='Start Fresh (Random Order)?';
    text.textContent='Questions will be reshuffled into a new random order, and all progress will be reset.';
  } else {
    title.textContent='Start Fresh (Original Order)?';
    text.textContent='Questions will return to their original order, and all progress will be reset.';
  }
  document.getElementById('modal-overlay').style.display='flex';
};
window.closeModal=function(){document.getElementById('modal-overlay').style.display='none';};
window.confirmFresh=function(){
  localStorage.removeItem(LSKEY);
  currentOrder=(pendingFreshMode==='random')?randomOrder():identityOrder();
  saveOrder(currentOrder);
  state={cur:0,answers:{},shuffles:{},showResults:false,retryMode:false,retryList:[]};
  document.getElementById('modal-overlay').style.display='none';
  render();
};

loadState();
render();
})();
</script>
</body>
</html>
