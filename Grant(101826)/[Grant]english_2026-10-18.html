ndreds of people squeeze onto the ferries that carried workers across the river to New York City. When fog or ice filled the river, the ferries stopped, and many families lost a day&rsquo;s pay. That was why the city was building the Brooklyn Bridge, a suspension bridge, or a bridge whose roadway hangs from huge cables stretched between tall towers.<br><br>Years earlier, Thomas&rsquo;s father had helped dig the bridge&rsquo;s foundations. He had worked in a caisson, a giant wooden box without a bottom that was sunk to the riverbed and filled with pressed air to keep the water out. Workers who came up too quickly often became sick with a painful illness called caisson disease. The chief engineer, Washington Roebling, became so ill that he could no longer leave his house.<br><br>One afternoon, Thomas delivered a package to the Roebling home. He saw Emily Roebling, the engineer&rsquo;s wife, studying drawings at a cluttered table. She explained that she carried her husband&rsquo;s instructions to the builders every day and had learned the mathematics of cables herself. <u>Mrs. Roebling was the most remarkable person in all of Brooklyn.</u><br><br>From the window, Thomas could see the two stone towers rising above the river like giant gray guardians. Workers were spinning steel wires into four thick cables, each made of more than 5,000 wires. Thomas asked whether a boy could ever learn to build something so enormous. Mrs. Roebling handed him a small notebook and told him to begin by writing down every question he had. On his way home, Thomas stopped at the water&rsquo;s edge, opened the notebook, and stared up at the cables shining in the evening sun."}, {"stem": "Which event happened right after Mrs. Roebling handed Thomas a notebook?", "opts": ["Thomas saw Mrs. Roebling studying drawings at a table.", "Thomas asked whether a boy could learn to build something so enormous.", "Thomas stopped at the water&rsquo;s edge and opened the notebook.", "Thomas delivered a package to the Roebling home."], "ci": 2, "exp": "The order is: Thomas delivered the package, saw Mrs. Roebling studying drawings, asked his question, received the notebook, and then, on his way home, &ldquo;stopped at the water&rsquo;s edge&rdquo; and opened it.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "In the summer of 1881, twelve-year-old Thomas Byrne lived in a crowded apartment near the East River in Brooklyn. Every morning he watched hundreds of people squeeze onto the ferries that carried workers across the river to New York City. When fog or ice filled the river, the ferries stopped, and many families lost a day&rsquo;s pay. That was why the city was building the Brooklyn Bridge, a suspension bridge, or a bridge whose roadway hangs from huge cables stretched between tall towers.<br><br>Years earlier, Thomas&rsquo;s father had helped dig the bridge&rsquo;s foundations. He had worked in a caisson, a giant wooden box without a bottom that was sunk to the riverbed and filled with pressed air to keep the water out. Workers who came up too quickly often became sick with a painful illness called caisson disease. The chief engineer, Washington Roebling, became so ill that he could no longer leave his house.<br><br>One afternoon, Thomas delivered a package to the Roebling home. He saw Emily Roebling, the engineer&rsquo;s wife, studying drawings at a cluttered table. She explained that she carried her husband&rsquo;s instructions to the builders every day and had learned the mathematics of cables herself. <u>Mrs. Roebling was the most remarkable person in all of Brooklyn.</u><br><br>From the window, Thomas could see the two stone towers rising above the river like giant gray guardians. Workers were spinning steel wires into four thick cables, each made of more than 5,000 wires. Thomas asked whether a boy could ever learn to build something so enormous. Mrs. Roebling handed him a small notebook and told him to begin by writing down every question he had. On his way home, Thomas stopped at the water&rsquo;s edge, opened the notebook, and stared up at the cables shining in the evening sun."}, {"stem": "Based on Passage A and Passage B, what is one similarity between Margaret and Jamal?", "opts": ["Both children write letters every Sunday and mail them.", "Both children are working on science projects about volcanoes.", "Both children live on farms in Nebraska.", "Both children stay in touch with a grandparent who lives far away."], "ci": 3, "exp": "Margaret writes letters to her grandmother in Ohio, and Jamal video-calls his grandfather in Atlanta. Both keep in touch with a faraway grandparent. Only Jamal has a volcano project, and only Margaret mails letters.", "tag": "Paired Passage — Synthesis (Similarities)", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br>In 1920, ten-year-old Margaret Hill lived on a farm in Nebraska, far from her grandmother in Ohio. Each Sunday she wrote a long letter describing the harvest and her new calf, then walked two miles to the post office. That year, the U.S. Air Mail Service began flying mail across the country, so letters traveled faster than they could by train alone. Still, Margaret waited many days for each reply. When an envelope finally arrived, she read it aloud to her brothers and saved it in a tin box beneath her bed.<br><br><strong>Passage B</strong><br>Today, eleven-year-old Jamal Price lives in Seattle, while his grandfather lives in Atlanta, more than 2,000 miles away. Every Sunday evening, Jamal opens a laptop and starts a video call. Within seconds, his grandfather&rsquo;s smiling face fills the screen. Jamal shows him a science project about volcanoes, and his grandfather asks questions and tells stories about his own school days. Sometimes the internet connection freezes, and they have to call again. When the call ends, Jamal writes his grandfather&rsquo;s stories in a journal so he will remember them."}, {"passage": "<strong>Masters of Disguise</strong><br><p style=\"margin:0 0 10px\">Few animals can vanish as quickly as the octopus. Although it has no bones and no shell to protect it, this soft-bodied creature survives in oceans crowded with sharks, eels, and hungry seals. Its greatest defense is its skin. Beneath the surface lie thousands of tiny sacs filled with color, and the octopus can stretch or squeeze them in less than a second.</p><p style=\"margin:0 0 10px\">Within moments, a brown octopus resting on a reef can turn mottled orange and white to match the coral around it. Some species can even raise small bumps on their skin, imitating the rough texture of rock or seaweed. Scientists are still puzzled by one remarkable fact: most octopuses appear to be colorblind. Researchers suspect that light-sensing cells in the skin itself may help the animal detect its surroundings.</p><p style=\"margin:0 0 10px\">Camouflage is not the octopus&rsquo;s only trick, however. When concealing itself fails, it can squirt a cloud of dark ink and jet away while the startled predator attacks the murky water. This combination of disguise and escape has allowed octopuses to adapt to nearly every ocean habitat on Earth, from shallow tide pools to the frigid deep sea.</p>", "stem": "As it is used in the passage, what does the word &ldquo;imitating&rdquo; most likely mean?", "opts": ["smoothing out", "hiding underneath", "copying the look of", "changing the color of"], "ci": 2, "exp": "The bumps make the skin look like &ldquo;the rough texture of rock or seaweed,&rdquo; so the octopus is copying how those things look. &ldquo;Changing the color of&rdquo; is tempting, but the bumps change texture, not color.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>A Code Made of Dots</strong><br><p style=\"margin:0 0 10px\">In 1812, a three-year-old boy named Louis Braille was playing in his father&rsquo;s leather workshop in France when a sharp tool slipped and injured his eye. An infection soon spread to his other eye, and by the age of five he was completely blind.</p><p style=\"margin:0 0 10px\">Louis was a determined student, and at ten he earned a place at the Royal Institute for Blind Youth in Paris. The school owned a few books printed with huge raised letters, but they were heavy, expensive, and painfully slow to read by touch. Then, in 1821, a former army captain visited the school to demonstrate a method that soldiers used to read messages in the dark by touching raised dots. The method was too complicated for most students, yet Louis recognized its potential. Over the next three years, he simplified the code until each letter fit beneath a single fingertip.</p><p style=\"margin:0 0 10px\">Teachers at the institute were reluctant to give up the raised letters they had always used, and Braille&rsquo;s system was not officially adopted until 1854, two years after his death. Today, his invention is used by millions of readers in nearly every language.</p>", "stem": "As it is used in the passage, what does the word &ldquo;reluctant&rdquo; most likely mean?", "opts": ["not allowed by law", "unwilling or slow to agree", "too busy", "unable to pay"], "ci": 1, "exp": "The teachers did not want to &ldquo;give up the raised letters they had always used,&rdquo; and the system was not adopted for many years, so <i>reluctant</i> means unwilling. Nothing in the passage mentions laws or money.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>A Code Made of Dots</strong><br><p style=\"margin:0 0 10px\">In 1812, a three-year-old boy named Louis Braille was playing in his father&rsquo;s leather workshop in France when a sharp tool slipped and injured his eye. An infection soon spread to his other eye, and by the age of five he was completely blind.</p><p style=\"margin:0 0 10px\">Louis was a determined student, and at ten he earned a place at the Royal Institute for Blind Youth in Paris. The school owned a few books printed with huge raised letters, but they were heavy, expensive, and painfully slow to read by touch. Then, in 1821, a former army captain visited the school to demonstrate a method that soldiers used to read messages in the dark by touching raised dots. The method was too complicated for most students, yet Louis recognized its potential. Over the next three years, he simplified the code until each letter fit beneath a single fingertip.</p><p style=\"margin:0 0 10px\">Teachers at the institute were reluctant to give up the raised letters they had always used, and Braille&rsquo;s system was not officially adopted until 1854, two years after his death. Today, his invention is used by millions of readers in nearly every language.</p>", "stem": "The word &ldquo;simplified&rdquo; is made from <i>simple</i> + <i>-ify</i>, a suffix that means &ldquo;to make.&rdquo; What does &ldquo;simplified&rdquo; most likely mean in the passage?", "opts": ["made longer and more detailed", "made easier to use", "made more exact", "made more famous"], "ci": 1, "exp": "<i>Simple</i> + <i>-ify</i> = &ldquo;to make simple.&rdquo; Louis took a method that was &ldquo;too complicated&rdquo; and made it easier, so each letter fit &ldquo;beneath a single fingertip.&rdquo; &ldquo;Made more exact&rdquo; is close, but the passage stresses making it less complicated.", "tag": "Word Parts", "tagcolor": "#185FA5"}, {"passage": "<strong>A Code Made of Dots</strong><br><p style=\"margin:0 0 10px\">In 1812, a three-year-old boy named Louis Braille was playing in his father&rsquo;s leather workshop in France when a sharp tool slipped and injured his eye. An infection soon spread to his other eye, and by the age of five he was completely blind.</p><p style=\"margin:0 0 10px\">Louis was a determined student, and at ten he earned a place at the Royal Institute for Blind Youth in Paris. The school owned a few books printed with huge raised letters, but they were heavy, expensive, and painfully slow to read by touch. Then, in 1821, a former army captain visited the school to demonstrate a method that soldiers used to read messages in the dark by touching raised dots. The method was too complicated for most students, yet Louis recognized its potential. Over the next three years, he simplified the code until each letter fit beneath a single fingertip.</p><p style=\"margin:0 0 10px\">Teachers at the institute were reluctant to give up the raised letters they had always used, and Braille&rsquo;s system was not officially adopted until 1854, two years after his death. Today, his invention is used by millions of readers in nearly every language.</p>", "stem": "Which list shows these events in the order they happened?", "opts": ["Louis becomes blind &rarr; Louis simplifies the code &rarr; an army captain visits the school &rarr; the system is officially adopted", "Louis becomes blind &rarr; an army captain visits the school &rarr; Louis simplifies the code &rarr; the system is officially adopted", "Louis becomes blind &rarr; an army captain visits the school &rarr; the system is officially adopted &rarr; Louis simplifies the code", "An army captain visits the school &rarr; Louis becomes blind &rarr; Louis simplifies the code &rarr; the system is officially adopted"], "ci": 1, "exp": "Louis was blind by age five (about 1814), the captain visited in 1821, Louis worked on the code &ldquo;over the next three years,&rdquo; and the system was adopted in 1854. The code could not be simplified before the captain showed it to him.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Last Ten Seconds</strong><br><p style=\"margin:0 0 10px\">Priya stared at the robot lying on its side, one wheel spinning uselessly. The regional competition would resume in twenty minutes, and their team had just lost its first match when the gripper arm snapped off and skidded across the arena floor.</p><p style=\"margin:0 0 10px\">&ldquo;We should just withdraw,&rdquo; muttered Owen, slumping onto a folding chair. &ldquo;We&rsquo;ll never fix it in time.&rdquo;</p><p style=\"margin:0 0 10px\">Priya picked up the broken arm and turned it over in her hands. The plastic joint had cracked cleanly in two, but the motor still hummed when she pressed the switch. &ldquo;It doesn&rsquo;t have to be perfect,&rdquo; she said. &ldquo;It just has to grab one cube.&rdquo;</p><p style=\"margin:0 0 10px\">For the next fifteen minutes, they worked frantically. Owen held the pieces together while Priya wrapped them with zip ties and electrical tape until the joint felt sturdy. When the announcer called their team, the repaired arm wobbled but held.</p><p style=\"margin:0 0 10px\">In the final ten seconds of the match, the robot lurched forward, clamped onto a yellow cube, and dropped it into the scoring zone just as the buzzer sounded. They did not win the trophy, but Owen was grinning as he carried the robot back to the table.</p><p style=\"margin:0 0 10px\">&ldquo;Next year,&rdquo; he said, &ldquo;we&rsquo;re bringing extra zip ties.&rdquo;</p>", "stem": "What happened right after the announcer called the team?", "opts": ["Priya pressed the switch and heard the motor hum.", "Owen said the team should withdraw.", "Owen held the pieces while Priya wrapped them with tape.", "The repaired arm wobbled but held."], "ci": 3, "exp": "The fourth paragraph ends: &ldquo;When the announcer called their team, the repaired arm wobbled but held.&rdquo; The other events happened earlier, while they were still deciding what to do and fixing the arm.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Last Ten Seconds</strong><br><p style=\"margin:0 0 10px\">Priya stared at the robot lying on its side, one wheel spinning uselessly. The regional competition would resume in twenty minutes, and their team had just lost its first match when the gripper arm snapped off and skidded across the arena floor.</p><p style=\"margin:0 0 10px\">&ldquo;We should just withdraw,&rdquo; muttered Owen, slumping onto a folding chair. &ldquo;We&rsquo;ll never fix it in time.&rdquo;</p><p style=\"margin:0 0 10px\">Priya picked up the broken arm and turned it over in her hands. The plastic joint had cracked cleanly in two, but the motor still hummed when she pressed the switch. &ldquo;It doesn&rsquo;t have to be perfect,&rdquo; she said. &ldquo;It just has to grab one cube.&rdquo;</p><p style=\"margin:0 0 10px\">For the next fifteen minutes, they worked frantically. Owen held the pieces together while Priya wrapped them with zip ties and electrical tape until the joint felt sturdy. When the announcer called their team, the repaired arm wobbled but held.</p><p style=\"margin:0 0 10px\">In the final ten seconds of the match, the robot lurched forward, clamped onto a yellow cube, and dropped it into the scoring zone just as the buzzer sounded. They did not win the trophy, but Owen was grinning as he carried the robot back to the table.</p><p style=\"margin:0 0 10px\">&ldquo;Next year,&rdquo; he said, &ldquo;we&rsquo;re bringing extra zip ties.&rdquo;</p>", "stem": "According to the story, what was wrong with the gripper arm?", "opts": ["Its plastic joint had cracked in two.", "One of its wheels had fallen off.", "Its motor had stopped working.", "It was missing its zip ties."], "ci": 0, "exp": "Priya saw that &ldquo;the plastic joint had cracked cleanly in two, but the motor still hummed,&rdquo; so the motor still worked. The spinning wheel belonged to the robot, not the arm.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"passage": "<strong>Warning in the Narrows</strong><br><p style=\"margin:0 0 10px\">Marcus had wanted to hike the slot canyon ever since he saw photographs of its walls glowing orange in the afternoon sun. The canyon was only a few feet wide in places, and the sandstone walls rose so high that the sky looked like a thin blue ribbon.</p><p style=\"margin:0 0 10px\">An hour into the hike, Aunt Rosa stopped and frowned. Far to the west, above the distant mesas, a dark wall of clouds was building. &ldquo;That storm is miles away,&rdquo; Marcus said. &ldquo;It isn&rsquo;t even raining here.&rdquo;</p><p style=\"margin:0 0 10px\">&ldquo;It doesn&rsquo;t need to rain here,&rdquo; she replied. Rain that falls on bare rock miles upstream cannot soak into the ground, she explained, so it rushes downhill and funnels into narrow canyons. A dry streambed can become a swift, dangerous torrent in minutes.</p><p style=\"margin:0 0 10px\">Marcus glanced at the ominous clouds again and, without another word, turned around. They scrambled out of the canyon just as a low rumble echoed off the rocks. From the rim, they watched muddy brown water surge through the passage where they had been walking only twenty minutes earlier.</p>", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Marcus and his aunt watched the flood from the rim.", "The canyon walls were made of sandstone.", "Marcus and his aunt hiked for three hours before turning around.", "The storm clouds were building to the west."], "ci": 2, "exp": "Aunt Rosa stopped &ldquo;an hour into the hike,&rdquo; and they turned around soon after, so they did not hike three hours. The other statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Warning in the Narrows</strong><br><p style=\"margin:0 0 10px\">Marcus had wanted to hike the slot canyon ever since he saw photographs of its walls glowing orange in the afternoon sun. The canyon was only a few feet wide in places, and the sandstone walls rose so high that the sky looked like a thin blue ribbon.</p><p style=\"margin:0 0 10px\">An hour into the hike, Aunt Rosa stopped and frowned. Far to the west, above the distant mesas, a dark wall of clouds was building. &ldquo;That storm is miles away,&rdquo; Marcus said. &ldquo;It isn&rsquo;t even raining here.&rdquo;</p><p style=\"margin:0 0 10px\">&ldquo;It doesn&rsquo;t need to rain here,&rdquo; she replied. Rain that falls on bare rock miles upstream cannot soak into the ground, she explained, so it rushes downhill and funnels into narrow canyons. A dry streambed can become a swift, dangerous torrent in minutes.</p><p style=\"margin:0 0 10px\">Marcus glanced at the ominous clouds again and, without another word, turned around. They scrambled out of the canyon just as a low rumble echoed off the rocks. From the rim, they watched muddy brown water surge through the passage where they had been walking only twenty minutes earlier.</p>", "stem": "The author describes the sky as &ldquo;a thin blue ribbon&rdquo; mainly to &mdash;", "opts": ["describe the color of the sandstone walls", "hint that the weather is about to change", "show how narrow and deep the canyon is", "explain why Marcus wanted to visit the canyon"], "ci": 2, "exp": "The sentence says the canyon was &ldquo;only a few feet wide&rdquo; and the walls &ldquo;rose so high&rdquo; that only a thin strip of sky showed. The image is about the canyon&rsquo;s shape, not the weather.", "tag": "Author's Craft", "tagcolor": "#185FA5"}, {"passage": "<strong>Warning in the Narrows</strong><br><p style=\"margin:0 0 10px\">Marcus had wanted to hike the slot canyon ever since he saw photographs of its walls glowing orange in the afternoon sun. The canyon was only a few feet wide in places, and the sandstone walls rose so high that the sky looked like a thin blue ribbon.</p><p style=\"margin:0 0 10px\">An hour into the hike, Aunt Rosa stopped and frowned. Far to the west, above the distant mesas, a dark wall of clouds was building. &ldquo;That storm is miles away,&rdquo; Marcus said. &ldquo;It isn&rsquo;t even raining here.&rdquo;</p><p style=\"margin:0 0 10px\">&ldquo;It doesn&rsquo;t need to rain here,&rdquo; she replied. Rain that falls on bare rock miles upstream cannot soak into the ground, she explained, so it rushes downhill and funnels into narrow canyons. A dry streambed can become a swift, dangerous torrent in minutes.</p><p style=\"margin:0 0 10px\">Marcus glanced at the ominous clouds again and, without another word, turned around. They scrambled out of the canyon just as a low rumble echoed off the rocks. From the rim, they watched muddy brown water surge through the passage where they had been walking only twenty minutes earlier.</p>", "stem": "Which word means the <b>OPPOSITE</b> of &ldquo;ominous&rdquo; as it is used in the last paragraph?", "opts": ["colorful", "reassuring", "threatening", "distant"], "ci": 1, "exp": "The clouds were a sign of danger, so <i>ominous</i> means threatening; its opposite is <i>reassuring</i>. &ldquo;Threatening&rdquo; is a synonym, and the clouds were also &ldquo;distant,&rdquo; but that describes where they were, not the opposite meaning.", "tag": "Antonym", "tagcolor": "#185FA5"}, {"passage": "<strong>The River&rsquo;s Work</strong><br><p style=\"margin:0 0 10px\">The river owns no hammer,<br>no chisel and no saw,<br>yet every spring it sharpens<br>the canyon&rsquo;s stony jaw.</p><p style=\"margin:0 0 10px\">It carries sand like secrets<br>and pebbles like small change,<br>and rolls them, grinding, seaward<br>through valleys wide and strange.</p><p style=\"margin:0 0 10px\">A storm can make it furious&mdash;<br>it bellows, foams, and leaps&mdash;<br>but mostly it is quiet,<br>and what it takes, it keeps.</p><p style=\"margin:0 0 10px\">A thousand years are nothing<br>to water on the move;<br>the deepest gorge was started<br>by one thin, wandering groove.</p>", "stem": "As it is used in the third stanza, what does &ldquo;bellows&rdquo; most likely mean?", "opts": ["rises slowly", "dries up", "roars loudly", "turns muddy"], "ci": 2, "exp": "In the third stanza the river is &ldquo;furious&rdquo; during a storm and &ldquo;foams, and leaps,&rdquo; so <i>bellows</i> means it makes a loud, angry roar. The next line contrasts this with being &ldquo;quiet.&rdquo;", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>The River&rsquo;s Work</strong><br><p style=\"margin:0 0 10px\">The river owns no hammer,<br>no chisel and no saw,<br>yet every spring it sharpens<br>the canyon&rsquo;s stony jaw.</p><p style=\"margin:0 0 10px\">It carries sand like secrets<br>and pebbles like small change,<br>and rolls them, grinding, seaward<br>through valleys wide and strange.</p><p style=\"margin:0 0 10px\">A storm can make it furious&mdash;<br>it bellows, foams, and leaps&mdash;<br>but mostly it is quiet,<br>and what it takes, it keeps.</p><p style=\"margin:0 0 10px\">A thousand years are nothing<br>to water on the move;<br>the deepest gorge was started<br>by one thin, wandering groove.</p>", "stem": "In the line &ldquo;and pebbles like small change,&rdquo; what does the word &ldquo;change&rdquo; mean?", "opts": ["to become different", "a fresh set of clothes", "coins of little value", "a switch from one thing to another"], "ci": 2, "exp": "The poet compares pebbles to &ldquo;small change&rdquo; &mdash; the little coins that roll around in a pocket. All of the choices are real meanings of <i>change</i>, but only &ldquo;coins&rdquo; fits a comparison to pebbles.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"stem": "Which word means the <b>OPPOSITE</b> of <b>scarce</b> as it is used in the third paragraph?", "opts": ["rare", "harmful", "plentiful", "valuable"], "ci": 2, "exp": "Milkweed has become <i>scarce</i>, hard to find, as farms and towns grow. The opposite is <i>plentiful</i>. <i>Rare</i> means almost the same as scarce, so it is not the opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>The Monarch’s Marathon</strong><br>Each autumn, millions of monarch butterflies leave Canada and the northern United States and fly as far as 3,000 miles to the mountain forests of central Mexico. No single butterfly makes the round trip, which makes this migration especially remarkable. The monarchs that travel south in the fall have never seen Mexico, yet they arrive at the same fir forests their great-great-grandparents left the spring before.<br><br>Scientists have discovered that monarchs use the sun as a compass. Because the sun’s position shifts throughout the day, the butterflies rely on an internal clock in their antennae to adjust their direction. Shorter days also trigger the journey: as autumn approaches, the butterflies stop laying eggs and instead store fat to sustain them on their long flight.<br><br>In Mexico, the monarchs cluster so densely on the trees that branches sag under their weight. In March, they begin flying north again, laying eggs on milkweed plants along the way because monarch caterpillars will eat nothing else. Unfortunately, milkweed has become scarce in many places as farms and towns expand, so volunteers now plant it in gardens and schoolyards to help the monarchs survive."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Mrs. Delgado gave the cousins tomatoes as a reward.", "Some tomatoes were left half-eaten in the dirt.", "Ruby strapped the trail camera to the garden gate.", "The tomatoes disappeared three mornings in a row."], "ci": 2, "exp": "The story says &ldquo;Ben strapped his trail camera to a fence post.&rdquo; Ruby did not do it, and it was not on the gate. The other statements match the story.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Case of the Vanishing Tomatoes</strong><br>For three mornings in a row, Mrs. Delgado discovered that the ripest tomatoes in the community garden had vanished overnight. On the fourth morning, she posted a sign on the gate: REWARD FOR INFORMATION.<br><br>Ben and his cousin Ruby volunteered to investigate. “A person would take the whole tomato,” Ruby reasoned, crouching beside the vines. “Look. These were bitten, and the half-eaten ones are lying in the dirt.”<br><br>Ben pointed at a row of small, five-toed tracks pressed into the mud near the fence. “And whoever left these wasn’t wearing shoes.”<br><br>That evening, Ben strapped his trail camera to a fence post. The next morning, the cousins hurried to check the footage. At 2:14 a.m., a masked face appeared on the screen, followed by a striped tail.<br><br>“A raccoon!” Ruby laughed. “Our thief has a bandit mask built in.”<br><br>Mrs. Delgado was so relieved that she gave them the reward anyway: a basket of the tomatoes the raccoon had missed. Then she asked a neighbor to help her build a taller fence with a wire top."}, {"stem": "Which word means the <b>OPPOSITE</b> of <b>wasteful</b> as it is used in Passage B?", "opts": ["extravagant", "economical", "expensive", "generous"], "ci": 1, "exp": "Buying a tool you use only once or twice is <i>wasteful</i>. The opposite is <i>economical</i>, which means careful not to waste money. <i>Extravagant</i> means almost the same as wasteful.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs."}, {"stem": "How are the libraries in Passage A and Passage B alike?", "opts": ["Both were started by Benjamin Franklin and his friends.", "Both lend mostly tools and musical instruments to families.", "Both opened in Philadelphia during colonial times.", "Both help people share costly things instead of buying them."], "ci": 3, "exp": "In Passage A, books were &ldquo;expensive and rare,&rdquo; so members shared them. In Passage B, families share tools and instruments instead of buying them. The libraries are in different places and times, and only B lends tools.", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs."}, {"stem": "According to Passage A, how did the Library Company get money to buy books?", "opts": ["The colony of Pennsylvania gave the club money.", "Benjamin Franklin paid for all the books himself.", "Each member paid a fee to join.", "Readers paid each time they borrowed a book."], "ci": 2, "exp": "Passage A says, &ldquo;Each member paid a fee to join, and the money was used to purchase books from London.&rdquo; Members paid once to join, not each time they borrowed.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs."}, {"stem": "Which list shows these events in the order they happened?", "opts": ["the Seneca Falls convention &rarr; Anthony is arrested &rarr; the Nineteenth Amendment is ratified &rarr; Wyoming lets women vote", "the Seneca Falls convention &rarr; Wyoming lets women vote &rarr; Anthony is arrested &rarr; the Nineteenth Amendment is ratified", "the Seneca Falls convention &rarr; Anthony is arrested &rarr; Wyoming lets women vote &rarr; the Nineteenth Amendment is ratified", "Wyoming lets women vote &rarr; the Seneca Falls convention &rarr; Anthony is arrested &rarr; the Nineteenth Amendment is ratified"], "ci": 1, "exp": "Use the dates: Seneca Falls was in 1848, Wyoming granted the vote in 1869, Anthony was arrested in 1872, and the amendment was ratified in 1920. The passage tells about Anthony&rsquo;s arrest before Wyoming, but Wyoming&rsquo;s date (1869) is earlier.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Votes for Women</strong><br>For most of the nation&rsquo;s early history, American women could not vote in national elections. They paid taxes and obeyed laws, yet they had no voice in choosing the leaders who wrote those laws. In 1848, about three hundred people gathered in Seneca Falls, New York, for the first convention devoted to women&rsquo;s rights. There, Elizabeth Cady Stanton read a bold declaration insisting that &ldquo;all men and women are created equal.&rdquo;<br><br>The struggle that followed was long and often discouraging. Activists such as Susan B. Anthony made frequent journeys from town to town, delivering speeches and collecting signatures on petitions. In 1872, Anthony was arrested for casting a ballot in Rochester, New York, and she was fined one hundred dollars, a penalty she refused to pay. Progress came first in the West: the Wyoming Territory granted women the vote in 1869, and several western states soon followed.<br><br>Finally, in 1920, enough states ratified the Nine  mainly to &mdash;", "opts": ["help the reader hear the soft, crackling hiss", "tell the reader what Grandpa&rsquo;s roof was made of", "show that a storm had started outside", "suggest that the radio had broken again"], "ci": 0, "exp": "This simile describes the hiss so the reader can imagine its sound. Nothing in the story says it was really raining, and a moment later music plays, so the radio was not broken.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>The Voice in the Box</strong><br>Grandpa Lewis set a dusty wooden radio on the kitchen table and wiped its dial with his sleeve. &ldquo;This was my father&rsquo;s,&rdquo; he said. &ldquo;It hasn&rsquo;t made a sound since before you were born.&rdquo;<br><br>Jada leaned closer. Behind the cracked glass, the numbers were faded but still legible. &ldquo;Can we fix it?&rdquo;<br><br>&ldquo;We can try. But radios don&rsquo;t like to be rushed.&rdquo;<br><br>For three Saturdays they worked side by side. Grandpa showed her how to test each tube, and Jada kept a notebook of every wire they checked, labeling each one with a tiny drawing. Twice she wanted to quit, especially when a new part arrived broken, but Grandpa only shrugged. &ldquo;Then we wait for another one,&rdquo; he said.<br><br>On the fourth Saturday, Jada turned the knob. At first there was only a hiss, like rain on a tin roof. Then, faint but unmistakable, a trumpet melody drifted out of the speaker.<br><br>Grandpa closed his eyes. &ldquo;That&rsquo;s the same station my father listened to,&rdquo; he whispered.<br><br>Jada didn&rsquo;t say anything. She simply opened her notebook to a fresh page and wrote the date at the top, as if she were recording something unique that might never happen again."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
