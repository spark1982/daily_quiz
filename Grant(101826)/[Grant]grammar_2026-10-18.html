<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct. This week's review \u2014 questions you missed recently.";
var TODAY_STR = "20261018";
var RAW_QUESTIONS = [{"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">She had no sooner left the room than everyone started talking.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["No sooner had she left the room than everyone started talking.", "No sooner had she left the room when everyone started talking.", "No sooner she had left the room than everyone started talking.", "No sooner did she leave the room than everyone started talking."], "ci": 0, "exp": "\"No sooner...than\" requires inversion: \"No sooner + had + she + left...\". The conjunction must be \"than\" (not \"when\"), and past perfect \"had\" is correct. The correct form is: No sooner had she left the room than everyone started talking.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>eat</b> &rsaquo; Past: <b>ate</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["ate", "eating", "eated", "eaten"], "ci": 3, "exp": "'eat' is an irregular verb. Its past participle is 'eaten'. Past perfect: had eaten.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "We ________ that film at the cinema last March.", "opts": ["have been watching", "had watched", "have watched", "watched"], "ci": 3, "exp": "Last March is a specific finished time, so use simple past: watched.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "The newspaper report was based _____ eyewitness accounts from people who saw the accident happen.", "opts": ["by", "on", "from", "with"], "ci": 1, "exp": "\"Based on\" is a fixed phrase meaning something was built on or derived from a source. The report used the accounts as its foundation.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["That parking spot is your's for the day.", "The company's profits increased by twenty percent.", "The pilots cockpit was filled with instruments.", "The fans cheered for there team from the stands."], "ci": 1, "exp": "<strong>\"company's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>pilots</em> is missing the apostrophe — should be <em>pilot's</em>.<br>• <em>your's</em> does not exist; the correct form is <em>yours</em>.<br>• <em>there</em> should be <em>their</em> (possessive adjective).", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["A jar of peanut butter in the kitchen cabinet.", "Although the concert started two hours late.", "Carrying heavy grocery bags up the stairs.", "The mayor gave a speech at the town hall."], "ci": 3, "exp": "\"The mayor gave a speech at the town hall.\" is a complete sentence — subject: 'The mayor', predicate: 'gave'. The others are fragments: an 'Although' clause, a noun phrase, and an -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "She looked _____ the window and noticed that dark clouds were gathering on the horizon.", "opts": ["out of", "past", "over", "through"], "ci": 0, "exp": "\"Look out of the window\" is the standard English phrase for looking from the inside to the outside through a window opening. \"Through\" also works but is less idiomatic here.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "She <span style=\"text-decoration:underline;\">______</span> from a prestigious university before she turned twenty.", "opts": ["will have graduated", "has graduated", "graduated", "had graduated"], "ci": 3, "exp": "\"had graduated\" is past perfect — she graduated before turning twenty.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["A pair of gloves were left in the lost and found box after gym class.", "A series of meetings were held to discuss the new school schedule.", "A series of meetings was held to discuss the new school schedule.", "A series of important events have been scheduled for the coming month."], "ci": 2, "exp": "\"A series of\" is singular, so \"was held\" is correct. \"Were held\" is plural — wrong. \"A pair of gloves\" is singular (\"a pair\" is one unit) — use \"was.\" \"A series of events\" is singular — use \"has been.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["Ivy was <b>climbing</b> along the brick wall.", "<b>Climbing</b> is her favorite way to challenge herself outdoors.", "The <b>climbing</b> vine wrapped around the trellis.", "The vine is <b>climbing</b> up the fence."], "ci": 2, "exp": "In \"The climbing vine wrapped around the trellis,\" \"climbing\" comes directly before the noun \"vine\" and describes what the vine is doing - this adjective use of an -ing word is a present participle. In \"The vine is climbing up the fence\" and \"Ivy was climbing along the brick wall,\" \"climbing\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Climbing is her favorite way to challenge herself outdoors,\" \"climbing\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "The citizens of the small town elected the retired schoolteacher their new mayor by a landslide.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["their new mayor", "the retired schoolteacher", "a landslide", "the citizens of the small town"], "ci": 0, "exp": "\"Their new mayor\" is the objective complement — it names the role the town gave to \"the retired schoolteacher.\" \"The retired schoolteacher\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"passage": "<strong>An Email to Grandma</strong><br><i>Dear Grandma,</i><br><b>(1)</b> Our soccer team finally played in the Fall Classic tournament last weekend. <b>(2)</b> <u>Sam and I</u> were both chosen to start in the first game. <b>(3)</b> By halftime, we <u>had ran</u> so much that my legs felt like noodles. <b>(4)</b> Our goalie made three amazing saves. <b>(5)</b> The other team still won by one goal. <b>(6)</b> If we win our next game we will play in the championship. <b>(7)</b> I hope you can come and watch us play!", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "Sam and me", "Sam and myself", "Me and Sam"], "ci": 0, "exp": "<i>Sam and I</i> is the subject of the sentence (they <i>were chosen</i>), so use the subject pronoun <i>I</i>. Test it alone: <i>I were chosen</i> &rarr; <i>I was chosen</i>, never <i>me was chosen</i>. It is already correct.", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"passage": "<strong>An Email to Grandma</strong><br><i>Dear Grandma,</i><br><b>(1)</b> Our soccer team finally played in the Fall Classic tournament last weekend. <b>(2)</b> <u>Sam and I</u> were both chosen to start in the first game. <b>(3)</b> By halftime, we <u>had ran</u> so much that my legs felt like noodles. <b>(4)</b> Our goalie made three amazing saves. <b>(5)</b> The other team still won by one goal. <b>(6)</b> If we win our next game we will play in the championship. <b>(7)</b> I hope you can come and watch us play!", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["had runned", "had run", "NO CHANGE", "have ran"], "ci": 1, "exp": "After <i>had</i>, use the past participle. The past participle of <i>run</i> is <i>run</i>, not <i>ran</i>: <i>By halftime, we <b>had run</b> so much&hellip;</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"passage": "<strong>Camping Journal</strong><br><b>(1)</b> Tonight is our second night camping at Clinton Lake. <b>(2)</b> I <u>have never swam</u> in water as cold as the lake was this morning. <b>(3)</b> After lunch, we hiked to a rocky cliff, and Dad <u>points</u> out a bald eagle&rsquo;s nest. <b>(4)</b> The eagles nest was as big as a bathtub. <b>(5)</b> Our sleeping bags got soaked during the afternoon storm. <b>(6)</b> Because we had left the tent flap open. <b>(7)</b> Tomorrow I will dry everything in the sun.", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["will point", "is pointing", "NO CHANGE", "pointed"], "ci": 3, "exp": "The sentence tells what happened after lunch in the past (<i>we hiked</i>), so the second verb must also be past: <i>Dad <b>pointed</b> out a bald eagle&rsquo;s nest.</i> Don&rsquo;t switch to present or future in the middle.", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5"}, {"passage": "<strong>Camping Journal</strong><br><b>(1)</b> Tonight is our second night camping at Clinton Lake. <b>(2)</b> I <u>have never swam</u> in water as cold as the lake was this morning. <b>(3)</b> After lunch, we hiked to a rocky cliff, and Dad <u>points</u> out a bald eagle&rsquo;s nest. <b>(4)</b> The eagles nest was as big as a bathtub. <b>(5)</b> Our sleeping bags got soaked during the afternoon storm. <b>(6)</b> Because we had left the tent flap open. <b>(7)</b> Tomorrow I will dry everything in the sun.", "stem": "Which of these sentences contains an error in grammar or punctuation?", "opts": ["Tonight is our second night camping at Clinton Lake.", "Our sleeping bags got soaked during the afternoon storm.", "The eagles nest was as big as a bathtub.", "Tomorrow I will dry everything in the sun."], "ci": 2, "exp": "The nest belongs to one eagle, so it needs an apostrophe: <i>The <b>eagle&rsquo;s</b> nest was as big as a bathtub.</i> The other three sentences are correct.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a"}, {"passage": "<strong>Busy Honeybees</strong><br><b>(1)</b> A single honeybee colony can hold more than 50,000 bees. <b>(2)</b> The workers in each hive <u>does</u> almost all of the jobs. <b>(3)</b> The queen, <u>who</u> lays up to 2,000 eggs a day, rarely leaves the hive. <b>(4)</b> Worker bees fly from flower to flower and collect sweet nectar. <b>(5)</b> Back at the hive, they dance <u>good</u> enough to show other bees exactly where the flowers are. <b>(6)</b> Neither the drones nor the queen make honey. <b>(7)</b> Without bees, many fruits and vegetables would be hard to grow.", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["which", "NO CHANGE", "whom", "whose"], "ci": 1, "exp": "Use <i>who</i> for a person or animal treated like a person when it is the subject of the describing part (<i>who lays eggs</i>). It is already correct.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>Busy Honeybees</strong><br><b>(1)</b> A single honeybee colony can hold more than 50,000 bees. <b>(2)</b> The workers in each hive <u>does</u> almost all of the jobs. <b>(3)</b> The queen, <u>who</u> lays up to 2,000 eggs a day, rarely leaves the hive. <b>(4)</b> Worker bees fly from flower to flower and collect sweet nectar. <b>(5)</b> Back at the hive, they dance <u>good</u> enough to show other bees exactly where the flowers are. <b>(6)</b> Neither the drones nor the queen make honey. <b>(7)</b> Without bees, many fruits and vegetables would be hard to grow.", "stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["gooder", "more good", "NO CHANGE", "well"], "ci": 3, "exp": "<i>Dance</i> is an action, so it needs an adverb: <i>they dance <b>well</b> enough</i>. <i>Good</i> describes nouns (a good dancer); <i>well</i> describes how something is done.", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"passage": "<strong>The Runaway Puppy</strong><br><b>(1)</b> Maya searched the whole park for her puppy, Biscuit. <b>(2)</b> She stopped a jogger and asked<u>, &ldquo;have you seen a little brown dog?&rdquo;</u> <b>(3)</b> The jogger pointed toward the pond and said that she <u>had seen</u> a puppy chasing ducks there. <b>(4)</b> Maya raced down the path as fast as she could. <b>(5)</b> When she got there Biscuit was sitting happily in the mud. <b>(6)</b> &ldquo;You <u>could of</u> gotten lost forever,&rdquo; Maya said as she hugged him. <b>(7)</b> That night, Biscuit got a very long bath.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", ", &ldquo;Have you seen a little brown dog?&rdquo;", ", Have you seen a little brown dog?", "&ldquo;Have you seen a little brown dog&rdquo;?"], "ci": 1, "exp": "A quotation starts with a capital letter, and the question mark goes inside the quotation marks because the words in quotes are the question: <i>asked, &ldquo;<b>H</b>ave you seen a little brown dog?&rdquo;</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057"}, {"passage": "<strong>Notice: Book Fair This Week</strong><br><b>(1)</b> Our school&rsquo;s fall Book Fair opens in the library on Wednesday. <b>(2)</b> <u>Hundreds of new books, posters, and bookmarks.</u> <b>(3)</b> This year the library is bigger, so the fair has doubled <u>its</u> space. <b>(4)</b> Students may visit with their class or come after school with a parent. <b>(5)</b> Our librarian asked my friends and I to make the welcome posters. <b>(6)</b> Shoppers can pay with cash. <b>(7)</b> They can also pay with a check from a parent.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "Hundreds of new books, posters, and bookmarks for sale.", "Hundreds of new books, posters, and, bookmarks.", "There will be hundreds of new books, posters, and bookmarks."], "ci": 3, "exp": "Sentence 2 has no verb, so it is     };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
