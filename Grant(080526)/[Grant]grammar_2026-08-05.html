<title>[Grant] Grammar</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
html{margin:0 auto;}
.wrap{max-width:700px;margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.sub-hd{text-align:center;font-size:0.82rem;color:#555;margin-bottom:6px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
.q-tag{display:inline-block;background:#1D9E75;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}

.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}

.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}

.ul{text-decoration:underline;font-style:normal;}
.passage-box{background:#f5f7fa;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:0.92rem;color:#222;line-height:1.7;}

</style>

<body>
<div class="wrap">

  <div class="timer-setup" id="timerSetup">

  </div>

  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>

  <h2 style="text-align:center;color:#1D9E75;margin:16px 0 8px;">Results</h2>

  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="openFreshModalOriginal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:12px;">Start Fresh (Original Order)</button>
  <button onclick="openFreshModalRandom()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh (Random Order)</button>
</div>

    <h3 id="freshModalTitle" style="margin:0 0 10px;color:#185FA5;font-size:1.05rem;">Start Fresh?</h3>
    <p id="freshModalText" style="font-size:0.95rem;color:#444;margin:0 0 16px;">All progress will be cleared.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

</div>
<script>
(function(){

var QUIZ_KEY = "quiz_grantgrammar_20_20260804_v1";
var ATT_KEY = "quiz_grantgrammar_20260804_att_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Grant] Grammar - Results";
var TAG_COLORS = {};
var TIMER_DEFAULT_MIN = 20;

var RAW_QUESTIONS = [{"box": "By the time we arrived, the guests ___ already eaten all the appetizers.", "stem": "Choose the correct verb form.", "opts": ["had", "have", "has", "having"], "ci": 0, "exp": "\"Had\" plus \"eaten\" forms the past perfect tense, which correctly shows an action completed before another past action (arriving). \"Have\" and \"has\" are present tense, and \"having\" is not a complete verb form."}, {"box": "The choir sang ___ during the final performance of the season.", "stem": "Choose the correct adverb.", "opts": ["beautifully", "beautiful", "more beautifuller", "beauty"], "ci": 0, "exp": "An adverb is needed to describe how the choir sang, and \"beautifully\" correctly modifies the verb \"sang.\" \"Beautiful\" is an adjective, \"more beautifuller\" incorrectly doubles the comparative, and \"beauty\" is a noun."}, {"box": "Neither of the twins ___ finished packing for the trip.", "stem": "Choose the verb that agrees with the subject.", "opts": ["has", "have", "were", "are"], "ci": 0, "exp": "\"Neither\" is a singular indefinite pronoun, so it takes the singular verb \"has.\" \"Have,\" \"were,\" and \"are\" are all plural forms that do not agree with the singular subject \"neither.\""}, {"box": "My cousin, who lives in Denver, is visiting us ___ summer.", "stem": "Choose the word that correctly completes the sentence.", "opts": ["this", "this here", "them", "those"], "ci": 0, "exp": "\"This\" correctly and simply points to the specific summer being discussed. \"This here\" is nonstandard and redundant, while \"them\" and \"those\" do not agree in number or fit the singular noun \"summer.\""}, {"box": "The team ___ practicing every day this week to prepare for the tournament.", "stem": "Choose the correct helping verb.", "opts": ["has been", "have been", "having been", "was being"], "ci": 0, "exp": "\"Team\" is a collective noun acting as a single unit here, so it takes the singular helping verb form \"has been.\" \"Have been\" is plural, \"having been\" is not a complete verb, and \"was being\" does not fit the ongoing sense of \"every day this week.\""}, {"box": "___ backpack was left on the bus after the field trip?", "stem": "Choose the correct interrogative pronoun.", "opts": ["Whose", "Who's", "Who", "Whom"], "ci": 0, "exp": "\"Whose\" is the possessive form used to ask who owns the backpack. \"Who's\" is a contraction of \"who is,\" \"who\" and \"whom\" ask about a person acting or receiving an action, not about possession."}, {"box": "The librarian asked us to be quiet, but we ___ kept whispering anyway.", "stem": "Choose the correct verb form.", "opts": ["still", "stiller", "stillest", "stillness"], "ci": 0, "exp": "\"Still\" is an adverb meaning \"continuing as before,\" and it correctly modifies the verb \"kept.\" \"Stiller\" and \"stillest\" are comparative and superlative adjective forms that do not fit here, and \"stillness\" is a noun."}, {"box": "Of the two hiking trails, the one along the ridge is ___.", "stem": "Choose the correct superlative or comparative form.", "opts": ["longer", "longest", "more long", "most longest"], "ci": 0, "exp": "When comparing exactly two things, the comparative form \"longer\" is correct. \"Longest\" is a superlative used for three or more items, \"more long\" incorrectly adds \"more\" to a short adjective, and \"most longest\" doubles the superlative incorrectly."}, {"box": "The old wooden bridge, ___ has stood for over a century, was finally repaired last month.", "stem": "Choose the correct relative pronoun.", "opts": ["which", "who", "whom", "whose"], "ci": 0, "exp": "\"Which\" correctly introduces a nonrestrictive clause describing a thing, the bridge. \"Who\" and \"whom\" refer to people, and \"whose\" shows possession, none of which fit this sentence."}, {"box": "By next June, my sister ___ from college for two full years.", "stem": "Choose the correct verb form.", "opts": ["will have graduated", "will graduate", "graduated", "has graduated"], "ci": 0, "exp": "\"Will have graduated\" uses the future perfect tense, which correctly describes an action that will be completed before a specific future point in time (\"by next June\"). \"Will graduate\" describes a simple future action without that completed-by-then meaning, \"graduated\" is simple past, and \"has graduated\" is present perfect, neither of which fits a future time marker."}, {"box": "Everyone on the girls' soccer team brought ___ own water bottle to practice.", "stem": "Choose the pronoun that agrees with the subject.", "opts": ["her", "their", "his", "hers"], "ci": 0, "exp": "\"Everyone\" is grammatically singular, and since the sentence specifies \"the girls' soccer team,\" the singular feminine pronoun \"her\" correctly agrees in both number and gender. \"Their\" treats \"everyone\" as plural, and \"his\" and \"hers\" do not fit the context of a team made up of girls as precisely as \"her\" does."}, {"box": "The chef, along with two assistants, ___ preparing the banquet for tomorrow night.", "stem": "Choose the verb that agrees with the subject.", "opts": ["is", "are", "were", "have been"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"the chef\"; the phrase \"along with two assistants\" is a parenthetical modifier, not part of a compound subject, so the verb stays singular: \"is.\" \"Are,\" \"were,\" and \"have been\" incorrectly treat the subject as plural."}, {"box": "We couldn't find ___ seats in the crowded theater, so we stood in the back.", "stem": "Choose the word that correctly completes the sentence.", "opts": ["any", "no", "none", "not any"], "ci": 0, "exp": "Since the sentence already contains the negative word \"couldn't,\" the sentence needs \"any\" to avoid a double negative. \"No,\" \"none,\" and \"not any\" would each create a double negative when combined with \"couldn't.\""}, {"box": "The puppy ___ around the yard, chasing butterflies until it grew tired.", "stem": "Choose the correct past tense verb.", "opts": ["ran", "runned", "run", "running"], "ci": 0, "exp": "\"Run\" is an irregular verb, and its correct simple past tense form is \"ran.\" \"Runned\" is not a real word, \"run\" is the present or past participle form, and \"running\" is a present participle that cannot stand alone as the main past tense verb."}, {"box": "Although the forecast predicted rain, ___ the game was not canceled.", "stem": "Choose the transition word that best completes the sentence.", "opts": ["surprisingly", "therefore", "similarly", "meanwhile"], "ci": 0, "exp": "\"Surprisingly\" fits the unexpected outcome introduced by \"although,\" since the game continued despite the rainy forecast. \"Therefore\" would incorrectly suggest the outcome followed logically from the forecast, \"similarly\" would suggest a comparison rather than a contrast, and \"meanwhile\" would suggest simultaneous but unrelated events."}, {"box": "The two brothers argued about ___ turn it was to wash the dishes.", "stem": "Choose the correct possessive pronoun.", "opts": ["whose", "who's", "their", "them"], "ci": 0, "exp": "\"Whose\" correctly asks about possession, in this case, who the turn belongs to. \"Who's\" is a contraction of \"who is,\" \"their\" does not fit the question structure here, and \"them\" is an object pronoun, not a possessive one."}, {"box": "The garden club planted tulips, daffodils, and ___ along the entrance path this spring.", "stem": "Choose the choice that keeps the list parallel.", "opts": ["crocuses", "some crocuses too", "planting crocuses", "they planted crocuses"], "ci": 0, "exp": "\"Crocuses\" matches the simple noun form of the other two items in the list, \"tulips\" and \"daffodils,\" keeping the series parallel. \"Some crocuses too,\" \"planting crocuses,\" and \"they planted crocuses\" each break the parallel structure by adding extra words or shifting to a different grammatical form."}, {"box": "The instructions were confusing, ___ most of the students finished the assignment correctly.", "stem": "Choose the coordinating conjunction that best completes the sentence.", "opts": ["yet", "so", "for", "nor"], "ci": 0, "exp": "\"Yet\" correctly signals the contrast between confusing instructions and students still finishing correctly. \"So\" would incorrectly suggest the confusing instructions caused their success, \"for\" would present a reason rather than a contrast, and \"nor\" requires a negative first clause, which this sentence does not have."}, {"box": "The dog wagged ___ tail excitedly when its owner walked through the door.", "stem": "Choose the correct possessive pronoun.", "opts": ["its", "it's", "their", "his"], "ci": 0, "exp": "\"Its\" is the possessive form of \"it\" and correctly shows that the tail belongs to the dog. \"It's\" is a contraction of \"it is\" and cannot show possession, \"their\" is plural and does not match the singular \"dog,\" and \"his\" assumes a gender not established in the sentence."}, {"box": "After finishing her homework, Maria ___ practiced the piano for an hour before dinner.", "stem": "Choose the word that most clearly shows the correct order of events.", "opts": ["then", "first", "meanwhile", "already"], "ci": 0, "exp": "\"Then\" correctly shows that the piano practice happened after the homework was finished, matching the sequence described by \"after finishing her homework.\" \"First\" would incorrectly suggest the piano practice happened before the homework, \"meanwhile\" would suggest the two actions happened at the same time, and \"already\" would suggest the practice was completed before the stated time frame began."}];

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}
function R(idx,inner){var i=idx?'<span class="radical-index">'+idx+'</span>':'';return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>';}


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(q.tag){
    tagEl.style.display='inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagEl.style.display='none';
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
