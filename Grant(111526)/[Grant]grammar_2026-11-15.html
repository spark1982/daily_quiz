<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct. This week's review — questions you missed recently.";
var TODAY_STR = "20261115";
var RAW_QUESTIONS = [{"passage": "<strong>Fall Garden Cleanup Day</strong><br><b>(1)</b> Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7. <b>(2)</b> Students and parents <u>should</u> bring gloves and a rake if they have them. <b>(3)</b> Each of the volunteers is going to get a free pumpkin muffin. <b>(4)</b> The tools for the job is waiting in the shed behind the gym. <b>(5)</b> We will pull weeds. <b>(6)</b> The weeds grow along the fence. <b>(7)</b> The garden will look <u>beautifuller</u> than ever by lunchtime!", "stem": "Which sentence has an error?", "opts": ["Students and parents should bring gloves and a rake if they have them.", "Each of the volunteers is going to get a free pumpkin muffin.", "The tools for the job is waiting in the shed behind the gym.", "Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7."], "ci": 2, "exp": "The subject is <i>tools</i> (plural), not <i>job</i>, so use <i>are</i>: <i>The tools for the job <b>are</b> waiting in the shed behind the gym.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"stem": "We ________ that film at the cinema last March.", "opts": ["have been watching", "had watched", "watched", "have watched"], "ci": 2, "exp": "Last March is a specific finished time, so use simple past: watched.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"passage": "<strong>Email to Aunt Mei</strong><br><b>(1)</b> Dear Aunt Mei, I joined the robotics club at school this fall. <b>(2)</b> So far our team <u>has builded</u> a small robot that can follow a black line. <b>(3)</b> The box of spare parts <u>sit</u> on a shelf in our classroom. <b>(4)</b> Ms. Ortiz is our coach. <b>(5)</b> She used to work at a car factory. <b>(6)</b> Next month we <u>might</u> enter a contest in Wichita. <b>(7)</b> I will send you a video of our robot soon!", "stem": "What is the best way to combine sentences 4 and 5?", "opts": ["Ms. Ortiz, who used to work at a car factory, is our coach.", "Ms. Ortiz, whose used to work at a car factory, is our coach.", "Ms. Ortiz, which used to work at a car factory, is our coach.", "Ms. Ortiz is our coach, she used to work at a car factory."], "ci": 0, "exp": "Use <i>who</i> for a person: <i>Ms. Ortiz, <b>who</b> used to work at a car factory, is our coach.</i> <i>Which</i> is for things, and a comma alone cannot join two sentences.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>Library LEGO Challenge</strong><br><b>(1)</b> Calling all builders in grades 3 to 5 who love to create! <b>(2)</b> The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7. <b>(3)</b> To get ideas, read the book <u>“build it big”</u> at the front desk. <b>(4)</b> This is the most biggest contest the library has ever held. <b>(5)</b> Bring <u>your</u> own snack and water bottle, and we will supply the bricks. <b>(6)</b> Kids can work alone. <b>(7)</b> They can work with a partner.", "stem": "Which sentence has an error?", "opts": ["This is the most biggest contest the library has ever held.", "Bring your own snack and water bottle.", "The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7.", "Calling all builders in grades 3 to 5 who love to create!"], "ci": 0, "exp": "Never use <i>most</i> with an <i>-est</i> word. Use just one: <i>This is the <b>biggest</b> contest the library has ever held.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"passage": "<strong>Letter to Mrs. Patel</strong><br><b>(1)</b> My family moved to Denver in August, and I really miss your class at Lincoln Elementary. <b>(2)</b> Last week we <u>have went</u> to the mountains for the first time. <b>(3)</b> By the time we got home, we <u>had finished</u> three whole bags of trail mix! <b>(4)</b> <u>My sister and me</u> are also learning to ski this winter. <b>(5)</b> My new school is big. <b>(6)</b> It has a climbing wall in the gym. <b>(7)</b> Please say hello to the class for me.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have gone", "NO CHANGE", "has went", "went"], "ci": 3, "exp": "&ldquo;Last week&rdquo; names a finished time, so use the simple past, not <i>have</i>: <i>Last week we <b>went</b> to the mountains.</i> (<i>Have went</i> is never correct, and <i>have gone</i> does not go with &ldquo;last week.&rdquo;)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"passage": "<strong>Report: Life in a Tide Pool</strong><br><b>(1)</b> A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide. <b>(2)</b> The animals in a tide pool <u>has</u> to survive big changes every day. <b>(3)</b> Hermit crabs live in tide pools. <b>(4)</b> Hermit crabs borrow empty shells from snails. <b>(5)</b> When the tide comes back in, fresh seawater <u>washed</u> over the pool and brings new food. <b>(6)</b> Visitors should never pull a sea star off a rock because its tube feet can tear. <b>(7)</b> Many visitors say they could of stayed for hours watching the crabs.", "stem": "What is the best way to combine sentences 3 and 4?", "opts": ["Hermit crabs live in tide pools, which borrow empty shells from snails.", "Hermit crabs live in tide pools, they borrow empty shells from snails.", "Hermit crabs, which borrow empty shells from snails, live in tide pools.", "Hermit crabs, who’s borrow empty shells from snails, live in tide pools."], "ci": 2, "exp": "Use <i>which</i> right after the noun it describes: <i>Hermit crabs<b>, which</b> borrow empty shells from snails<b>,</b> live in tide pools.</i> Putting <i>which</i> after <i>tide pools</i> makes it sound like the tide pools borrow shells.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>Report: Life in a Tide Pool</strong><br><b>(1)</b> A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide. <b>(2)</b> The animals in a tide pool <u>has</u> to survive big changes every day. <b>(3)</b> Hermit crabs live in tide pools. <b>(4)</b> Hermit crabs borrow empty shells from snails. <b>(5)</b> When the tide comes back in, fresh seawater <u>washed</u> over the pool and brings new food. <b>(6)</b> Visitors should never pull a sea star off a rock because its tube feet can tear. <b>(7)</b> Many visitors say they could of stayed for hours watching the crabs.", "stem": "Which sentence contains an error?", "opts": ["Hermit crabs live in tide pools.", "Many visitors say they could of stayed for hours watching the crabs.", "A tide pool is a small pocket of seawater that is left behind on the rocks when the ocean pulls back at low tide.", "Visitors should never pull a sea star off a rock because its tube feet can tear."], "ci": 1, "exp": "<i>Could of</i> is never correct — it only sounds like <i>could’ve</i>. Write <i>could have</i>: <i>they <b>could have</b> stayed for hours.</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6"}, {"passage": "<strong>Letter to Cousin Ava</strong><br><b>(1)</b> Dear Ava, last Saturday my whole family drove two hours to Hillside Orchard to pick apples and pumpkins. <b>(2)</b> Dad and <u>me</u> filled three huge baskets with shiny red apples before lunch. <b>(3)</b> The trees in the oldest rows were very tall. <b>(4)</b> We needed a ladder to reach the best apples. <b>(5)</b> After we finished picking we drank cold cider and ate warm donuts at the farm stand. <b>(6)</b> Next fall you <u>should of</u> come with us so we can pick even more!", "stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["should", "should have", "NO CHANGE", "shall of"], "ci": 0, "exp": "<i>Should of</i> is never correct; it comes from how <i>should’ve</i> sounds. Because this is about next fall, use <i>should</i> + verb: <i>Next fall you <b>should</b> come with us.</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6"}, {"passage": "<strong>An Email to Grandpa</strong><br>Dear Grandpa,<br><b>(1)</b> Our soccer season is almost over, and I wanted to tell you all about it. <b>(2)</b> We <u>have went</u> to every practice since August. <b>(3)</b> Every Saturday, <u>our coach, Mr. Diaz,</u> brings orange slices for the team. <b>(4)</b> The players on my team is getting faster every week. <b>(5)</b> Last weekend we won our first tournament game 3 to 1 against the Tigers. <b>(6)</b> Yes I scored the second goal with a header!<br>Love, Leo", "stem": "Which sentence contains an error?", "opts": ["Every Saturday, our coach, Mr. Diaz, brings orange slices for the team.", "Last weekend we won our first tournament game 3 to 1 against the Tigers.", "Our soccer season is almost over, and I wanted to tell you all about it.", "The players on my team is getting faster every week."], "ci": 3, "exp": "The subject is <i>players</i> (plural), not <i>team</i>, so the verb must be <i>are</i>: <i>The players on my team <b>are</b> getting faster every week.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>Pretzel Day</strong><br><b>(1)</b> Yesterday Dad and I <u>make</u> soft pretzels for the first time. <b>(2)</b> First, we mixed flour, yeast, and warm water in Dad's biggest bowl. <b>(3)</b> I rolled each piece of dough <u>real careful</u> into a long rope. <b>(4)</b> Then we twisted the ropes into pretzel shapes and sprinkled salt on top. <b>(5)</b> After they baked for fifteen minutes the pretzels were golden brown. <b>(6)</b> The kitchen smelled so good that our dog wagged it's tail by the oven door. <b>(7)</b> Next weekend we're going to make cinnamon ones.", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["really careful", "really carefully", "NO CHANGE", "real carefully"], "ci": 1, "exp": "To describe how someone does an action, use adverbs: <i>carefully</i> (not <i>careful</i>) and <i>really</i> (not <i>real</i>). <i>I rolled each piece of dough <b>really carefully</b>.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"passage": "<strong>How Sea Otters Use Tools</strong><br><b>(1)</b> Sea otters are among the few animals that use tools. <b>(2)</b> An otter floats on its back in the water and smashes clams against a flat rock that it keeps on its chest. <b>(3)</b> Otters also eat sea urchins. <b>(4)</b> Sea urchins damage the giant kelp forests along the coast. <b>(5)</b> At night, a group of otters <u>float</u> together near the shore. <b>(6)</b> They rest in a kelp bed, <u>where</u> long leaves keep them from drifting away. <b>(7)</b> <u>Especially during storms.</u>", "stem": "What is the best way to combine sentences 3 and 4?", "opts": ["Otters also eat sea urchins, who damage the giant kelp forests along the coast.", "Otters also eat sea urchins which, damage the giant kelp forests along the coast.", "Otters also eat sea urchins, they damage the giant kelp forests along the coast.", "Otters also eat sea urchins, which damage the giant kelp forests along the coast."], "ci": 3, "exp": "Use <i>which</i> for animals and things (not <i>who</i>), with the comma before it: <i>Otters also eat sea urchins, <b>which</b> damage the giant kelp forests along the coast.</i> Joining with only a comma and <i>they</i> makes a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>The Great Hamster Hunt</strong><br><b>(1)</b> On Sunday morning, my little sister Mia opened her hamster's cage and gasped. <b>(2)</b> Her tiny brown hamster, Peanut, was gone! <b>(3)</b> <u>&ldquo;Where could he be?&rdquo; asked Mia.</u> <b>(4)</b> Mia and <u>me</u> looked under the couch and behind the tall bookshelf in the living room. <b>(5)</b> We didn't find Peanut in the closet. <b>(6)</b> We didn't find him in the kitchen. <b>(7)</b> Finally, we heard a <u>noise, it</u> came from inside Mia's fuzzy pink slipper by the door.", "stem": "What is the best way to combine sentences 5 and 6?", "opts": ["We didn't find Peanut in the closet or in the kitchen.", "We didn't find Peanut in the closet nor in the kitchen.", "We didn't find Peanut in the closet, we didn't find him in the kitchen.", "We didn't find Peanut either in the closet nor in the kitchen."], "ci": 0, "exp": "After <i>didn't</i>, use <i>or</i> to join the two places. <i>Nor</i> goes with <i>neither</i>, and <i>either</i> goes with <i>or</i>: <i>We didn't find Peanut in the closet <b>or</b> in the kitchen.</i>", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}, {"passage": "<strong>A Letter to Aunt Rosa</strong><br>Dear Aunt Rosa,<br><b>(1)</b> Our school science fair was last Friday, and I <u>have wanted</u> to tell you about it ever since. <b>(2)</b> My project tested which brand of paper towel soaks up the most water. <b>(3)</b> Each of the five brands were tested three times. <b>(4)</b> First I measured the water, and then I <u>dip</u> each towel into a cup for ten seconds. <b>(5)</b> The judges gave me a blue ribbon for careful measuring. <b>(6)</b> Yes I already hung the ribbon above my desk!<br>Love, Nina", "stem": "Which sentence has an error?", "opts": ["Our school science fair was last Friday, and I have wanted to tell you about it ever since.", "Each of the five brands were tested three times.", "The judges gave me a blue ribbon for careful measuring.", "My project tested which brand of paper towel soaks up the most water."], "ci": 1, "exp": "With <i>each</i>, use a singular verb, even when “of the five brands” comes in between: <i>Each of the five brands <b>was</b> tested three times.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>How Hummingbirds Survive Cold Nights</strong><br><b>(1)</b> Hummingbirds are tiny birds <u>whose</u> must eat almost all day long. <b>(2)</b> Their hearts can beat more than a thousand times a minute. <b>(3)</b> A hummingbird burns energy <u>real</u> fast, so it could starve during a long, cold night. <b>(4)</b> To stay alive, the bird slips into a deep sleep called torpor. <b>(5)</b> Its body temperature drops. <b>(6)</b> Its heartbeat slows down. <b>(7)</b> In the morning, the bird warms up and flies off to find <u>it's</u> breakfast.", "stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["where", "whom", "NO CHANGE", "that"], "ci": 3, "exp": "The word must be the subject of “must eat,” and it refers to birds, so use <i>that</i>: <i>tiny birds <b>that</b> must eat almost all day long.</i> <i>Whose</i> shows ownership and needs a noun after it (whose wings).", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>My Journal: Birthday Pancakes</strong><br><b>(1)</b> Early this morning my little sister June and I made a stack of pancakes for Mom's birthday. <b>(2)</b> We had never <u>cooked</u> breakfast by ourselves before. <b>(3)</b> June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl. <b>(4)</b> Mom said the pancakes were the best that her and Dad had ever tasted. <b>(5)</b> We burned the first pancake. <b>(6)</b> Because the pan was too hot. <b>(7)</b> We <u>should of</u> turned the heat down sooner.", "stem": "Which sentence has an error?", "opts": ["We had never cooked breakfast by ourselves before.", "June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl.", "Mom said the pancakes were the best that her and Dad had ever tasted.", "Early this morning my little sister June and I made a stack of pancakes for Mom's birthday."], "ci": 2, "exp": "In “her and Dad had tasted,” the pronoun is part of the subject, so use <i>she</i>. Try it alone: <i>she had tasted</i>, not <i>her had tasted</i>. <i>...the best that <b>she and Dad</b> had ever tasted.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"passage": "<strong>Canned Food Drive Notice</strong><br><b>(1)</b> Our school is holding a canned food drive for the Westside Food Pantry. <b>(2)</b> The drive starts <u>on</u> Monday, November 16. <b>(3)</b> Every class <u>collect</u> cans in a box by its door. <b>(4)</b> Soup, beans, and rice are the most needed items. <b>(5)</b> Please check the dates on the cans. <b>(6)</b> Please do not bring glass jars. <b>(7)</b> The class with the most cans will win a pizza party, and there names will be posted in the hallway.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "since", "in", "at"], "ci": 0, "exp": "It is already correct. Use <i>on</i> with days and dates: <i>The drive starts <b>on</b> Monday, November 16.</i> Use <i>in</i> for months and <i>at</i> for clock times.", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6"}, {"passage": "<strong>How Emperor Penguins Stay Warm</strong><br><b>(1)</b> Emperor penguins live in Antarctica, where winter temperatures can drop far below zero. <b>(2)</b> A thick layer of fat and four layers of feathers <u>protects</u> each bird from the icy wind. <b>(3)</b> In the darkest months, the males huddle together in a giant group. <b>(4)</b> The penguins on the outside edge shuffle slowly toward the center. <b>(5)</b> The center is the warmest spot in the huddle. <b>(6)</b> Because the huddle never stops moving. <b>(7)</b> Last winter, scientists <u>measured</u> temperatures above 90 degrees in the middle of one huddle.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["is protecting", "protect", "NO CHANGE", "has protected"], "ci": 1, "exp": "Two things joined by <i>and</i> (fat <i>and</i> feathers) make a plural subject, so use the plural verb: <i>A thick layer of fat and four layers of feathers <b>protect</b> each bird.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>The Museum Scavenger Hunt</strong><br><b>(1)</b> Ana and Leo raced up the museum steps with their scavenger hunt list. <b>(2)</b> <u>\"We need to find a dinosaur egg first\" said Ana.</u> <b>(3)</b> Leo pointed to a guide <u>which</u> was standing near the fossil hall. <b>(4)</b> The guide said the egg <u>had been</u> discovered in Montana many years ago. <b>(5)</b> Each of the kids were amazed by how small the egg was. <b>(6)</b> By noon, they had checked off every item on the list. <b>(7)</b> Ana grinned and said that they should come back next month.", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["who", "whose", "where", "NO CHANGE"], "ci": 0, "exp": "Use <i>who</i> for people. A guide is a person: <i>Leo pointed to a guide <b>who</b> was standing near the fossil hall.</i> <i>Which</i> is for things and animals.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>Email to Cousin Mia</strong><br><b>(1)</b> Last Saturday, my family went to Hartley Farm for the fall hayride. <b>(2)</b> We <u>climb</u> onto a wagon full of straw, and a tractor pulled us through the apple orchard. <b>(3)</b> I <u>have never rode</u> on a hayride before that day. <b>(4)</b> The ride was bumpy. <b>(5)</b> It was a lot of fun. <b>(6)</b> After the ride we drank warm cider and picked out two pumpkins. <b>(7)</b> I hope you can come with us next year, Mia!", "stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["had never ridden", "have never ridden", "NO CHANGE", "had never rode"], "ci": 0, "exp": "For something that had not happened before a past time, use <i>had</i> + the past participle. The past participle of <i>ride</i> is <i>ridden</i>, not <i>rode</i>: <i>I <b>had never ridden</b> on a hayride before that day.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"passage": "<strong>Report: How Chameleons Change Color</strong><br><b>(1)</b> Many people <u>believes</u> that chameleons change color to match their surroundings. <b>(2)</b> Scientists have learned that this idea is mostly a myth. <b>(3)</b> Chameleons change color to show their mood and to control their body temperature. <b>(4)</b> They can do this. <b>(5)</b> Because their skin has tiny crystals that reflect light in different ways. <b>(6)</b> The colors of a calm chameleon is usually green or brown. <b>(7)</b> Most chameleons live in warm forests <u>where</u> insects are easy to find.", "stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["NO CHANGE", "is believing", "has believed", "believe"], "ci": 3, "exp": "<i>People</i> is plural, so it needs the plural verb <i>believe</i>: <i>Many people <b>believe</b> that chameleons change color to match their surroundings.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>Report: How Chameleons Change Color</strong><br><b>(1)</b> Many people <u>believes</u> that chameleons change color to match their surroundings. <b>(2)</b> Scientists have learned that this idea is mostly a myth. <b>(3)</b> Chameleons change color to show their mood and to control their body temperature. <b>(4)</b> They can do this. <b>(5)</b> Because their skin has tiny crystals that reflect light in different ways. <b>(6)</b> The colors of a calm chameleon is usually green or brown. <b>(7)</b> Most chameleons live in warm forests <u>where</u> insects are easy to find.", "stem": "Which sentence has an error?", "opts": ["Most chameleons live in warm forests where insects are easy to find.", "Scientists have learned that this idea is mostly a myth.", "Chameleons change color to show their mood and to control their body temperature.", "The colors of a calm chameleon is usually green or brown."], "ci": 3, "exp": "The subject is <i>colors</i> (plural), not <i>chameleon</i>, so the verb must be <i>are</i>: <i>The colors of a calm chameleon <b>are</b> usually green or brown.</i> Don't match the verb to the noun closest to it.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>A Field Trip Email</strong><br>Dear Aunt Nora,<br><b>(1)</b> Since September, our class <u>has took</u> three field trips, and yesterday&rsquo;s trip was the best one. <b>(2)</b> We visited the Maple Street Fire Station. <b>(3)</b> The boots that each firefighter wears weighs about ten pounds. <b>(4)</b> Firefighter Sam showed us the ladder truck, and then he <u>lets</u> us sit in the driver&rsquo;s seat. <b>(5)</b> He told us that we <u>must</u> never hide under a bed during a fire. <b>(6)</b> Instead, we should crawl low and get outside as fast as we can. <b>(7)</b> This weekend, I am going to draw an escape map for our house.<br>Love, Owen", "stem": "Which sentence has an error?", "opts": ["This weekend, I am going to draw an escape map for our house.", "The boots that each firefighter wears weighs about ten pounds.", "We visited the Maple Street Fire Station.", "Instead, we should crawl low and get outside as fast as we can."], "ci": 1, "exp": "The subject is <i>boots</i> (plural), not <i>firefighter</i>, so the verb must be <i>weigh</i>: <i>The boots that each firefighter wears <b>weigh</b> about ten pounds.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>Winter Coat Drive</strong><br><b>(1)</b> This month, our school is collecting warm coats for families in our town who need them. <b>(2)</b> The boxes by the front office <u>is</u> for your donations. <b>(3)</b> Please make sure each coat is clean, and check that <u>it&rsquo;s</u> zipper works. <b>(4)</b> A thick coat works <u>good</u> on the coldest mornings. <b>(5)</b> Coats can be dropped off before school. <b>(6)</b> They can also be dropped off after school. <b>(7)</b> The drive ends on Friday, December 4, so please bring your coats soon.", "stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Coats can be dropped off before school, they can also be dropped off after school.", "Coats can be dropped off neither before nor after school.", "Coats can be dropped off both before and after school.", "Coats can be dropped off both before or after school."], "ci": 2, "exp": "Use the pair <i>both &hellip; and</i> to join two choices that are both true: <i>Coats can be dropped off <b>both</b> before <b>and</b> after school.</i> <i>Both</i> never goes with <i>or</i>.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}, {"passage": "<strong>Gingerbread Day Journal</strong><br><b>(1)</b> Last Sunday, my sister Ella and I built a gingerbread house. <b>(2)</b> First, we glued the walls together with thick white icing. <b>(3)</b> Then Ella <u>decides</u> to add a gumdrop path. <b>(4)</b> By the time we finished, she <u>had ate</u> half of the gumdrops! <b>(5)</b> The roof kept sliding off <u>it’s</u> walls, so we propped it up with candy canes. <b>(6)</b> Mom smiled and said, “your house looks better than the one at the bakery.” <b>(7)</b> We’re going to share it with our neighbors on Friday.", "stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["had eaten", "NO CHANGE", "has ate", "had eat"], "ci": 0, "exp": "After <i>had</i>, use the past participle. The past participle of <i>eat</i> is <i>eaten</i> (not <i>ate</i>): <i>she <b>had eaten</b> half of the gumdrops.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"passage": "<strong>The Missing Mitten</strong><br><b>(1)</b> Mia searched the mudroom for her red mitten, but it was nowhere to be found. <b>(2)</b> <u>“Grandpa, have you seen my mitten”? asked Mia.</u> <b>(3)</b> Grandpa smiled and pointed at Rusty, who was curled up by the heater with something red under his paw. <b>(4)</b> <u>Him and Mia</u> laughed when they saw the dog’s guilty face. <b>(5)</b> Rusty <u>had taken</u> the mitten while Mia was eating breakfast. <b>(6)</b> Mia pulled the mitten free. <b>(7)</b> It was wet and a little chewed.", "stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["Him and her", "NO CHANGE", "He and Mia", "Mia and him"], nto young oak trees in the spring. <b>(6)</b> In the coldest weeks squirrels stay in their leafy nests and sleep curled up for warmth.", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["buries", "have buried", "are burying", "NO CHANGE"], "ci": 0, "exp": "The subject is <i>Each</i>, which is singular, so it needs a singular verb. Don’t be fooled by <i>squirrels</i> right before the verb. <i>Each of the squirrels <b>buries</b> hundreds of acorns.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>How Gray Squirrels Get Ready for Winter</strong><br><b>(1)</b> Every fall, the gray squirrels in our neighborhood prepare for the cold months ahead. <b>(2)</b> Each of the squirrels <u>bury</u> hundreds of acorns in different spots around the yard. <b>(3)</b> Scientists have found that squirrels <u>can</u> remember the locations of many of their hiding places. <b>(4)</b> Because some of the acorns are never dug up again. <b>(5)</b> Those forgotten acorns sometimes sprout into young oak trees in the spring. <b>(6)</b> In the coldest weeks squirrels stay in their leafy nests and sleep curled up for warmth.", "stem": "Which sentence has an error?", "opts": ["Scientists have found that squirrels can remember the locations of many of their hiding places.", "Those forgotten acorns sometimes sprout into young oak trees in the spring.", "Every fall, the gray squirrels in our neighborhood prepare for the cold months ahead.", "Because some of the acorns are never dug up again."], "ci": 3, "exp": "A group of words that starts with <i>because</i> cannot stand alone; it is a fragment. Join it to a complete thought: <i>Because some of the acorns are never dug up again, a few of them sprout into oak trees.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}, {"passage": "<strong>Winter Concert Notice</strong><br><b>(1)</b> The fifth-grade choir will perform its winter concert on Thursday, December 10, in the school gym. <b>(2)</b> Last year, the concert <u>is</u> so popular that every seat was filled. <b>(3)</b> <u>Its</u> a good idea to arrive at least fifteen minutes early. <b>(4)</b> The singers have practiced real hard for six weeks. <b>(5)</b> After the concert, families can visit the art room. <b>(6)</b> Student paintings will be on display there. <b>(7)</b> We hope to see you there!", "stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["The fifth-grade choir will perform its winter concert on Thursday, December 10, in the school gym.", "The singers have practiced real hard for six weeks.", "After the concert, families can visit the art room.", "Student paintings will be on display there."], "ci": 1, "exp": "<i>Real</i> is an adjective; to describe how hard they practiced you need the adverb <i>really</i>: <i>The singers have practiced <b>really</b> hard for six weeks.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"passage": "<strong>Winter Concert Notice</strong><br><b>(1)</b> The fifth-grade choir will perform its winter concert on Thursday, December 10, in the school gym. <b>(2)</b> Last year, the concert <u>is</u> so popular that every seat was filled. <b>(3)</b> <u>Its</u> a good idea to arrive at least fifteen minutes early. <b>(4)</b> The singers have practiced real hard for six weeks. <b>(5)</b> After the concert, families can visit the art room. <b>(6)</b> Student paintings will be on display there. <b>(7)</b> We hope to see you there!", "stem": "What is the best way to combine sentences 5 and 6?", "opts": ["After the concert, families can visit the art room, who student paintings will be on display.", "After the concert, families can visit the art room, where student paintings will be on display there.", "After the concert, families can visit the art room, where student paintings will be on display.", "After the concert, families can visit the art room, which student paintings will be on display."], "ci": 2, "exp": "Use <i>where</i> to add information about a <b>place</b>. Because <i>where</i> already means “in that place,” drop the word <i>there</i>: <i>…the art room, <b>where</b> student paintings will be on display.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>A Letter to Cousin Owen</strong><br><b>(1)</b> Last Saturday, my family drove two hours to the big aquarium in Omaha. <b>(2)</b> We walked through a glass tunnel while sharks <u>swim</u> right over our heads. <b>(3)</b> A sea turtle the size of a kitchen table floated slowly past us. <b>(4)</b> Later, <u>Dad and I</u> touched a stingray in the shallow pool. <b>(5)</b> After lunch at the café we watched the penguins dive for fish. <b>(6)</b> One penguin kept flapping <u>it’s</u> wings at the crowd. <b>(7)</b> I hope you can come with us next time!", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["will swim", "NO CHANGE", "swims", "swam"], "ci": 3, "exp": "The letter tells about last Saturday, so every verb should stay in the past tense. <i>We walked through a glass tunnel while sharks <b>swam</b> right over our heads.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5"}, {"passage": "<strong>The Leaky Tent</strong><br><b>(1)</b> Ruby and her brother Theo set up a tent in the backyard for a sleepover. <b>(2)</b> <u>“Do you think it will rain tonight”? asked Theo.</u> <b>(3)</b> Ruby checked the sky and said that the clouds looked harmless. <b>(4)</b> By midnight, a heavy rain <u>had soaked</u> their sleeping bags. <b>(5)</b> The two of them ran inside and stood real quietly by the back door. <b>(6)</b> Their dad found them there. <b>(7)</b> He was holding two warm towels.", "stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["has soaked", "had soaken", "had soak", "NO CHANGE"], "ci": 3, "exp": "<i>Had</i> needs the past participle <i>soaked</i>, and <i>By midnight</i> shows something finished before a past time, so <i>had soaked</i> is right. The sentence is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"passage": "<strong>How Beavers Build Dams</strong><br><b>(1)</b> A family of beavers <u>work</u> together to build a dam across a stream. <b>(2)</b> They do most of their building <u>on night</u>. <b>(3)</b> The dam is made of sticks, rocks, and thick mud from the bottom of the stream. <b>(4)</b> It slows down the water. <b>(5)</b> It creates a deep, quiet pond. <b>(6)</b> In the middle of the pond, the beavers build a lodge with an underwater door. <b>(7)</b> Because wolves and coyotes cannot find the entrance.", "stem": "Which sentence has an error?", "opts": ["Because wolves and coyotes cannot find the entrance.", "It creates a deep, quiet pond.", "In the middle of the pond, the beavers build a lodge with an underwater door.", "The dam is made of sticks, rocks, and thick mud from the bottom of the stream."], "ci": 0, "exp": "A group of words that starts with <i>because</i> cannot stand alone. It is a fragment. One fix: <i>The lodge keeps them safe <b>because</b> wolves and coyotes cannot find the entrance.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}];

      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
