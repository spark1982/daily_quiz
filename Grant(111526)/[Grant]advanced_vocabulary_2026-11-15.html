<style>

  * { box-sizing: border-box; }

  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues. This week's review — questions you missed recently.";
var TODAY_STR = "20261115";
var RAW_QUESTIONS = [{"stem": "Farmers in the dry valley dig long ditches to <b>irrigate</b> their fields with water from the river, so the corn can grow even when it does not rain.<br><br>What does <b>irrigate</b> mean in this sentence?", "opts": ["to clear land by cutting down plants", "to protect fields from flooding", "to measure how much rain has fallen", "to bring water to land so crops can grow"], "ci": 3, "exp": "<i>irrigate</i> (v.) to supply land or crops with water, usually through pipes or ditches. <i>The farmers <b>irrigate</b> their orchards with water from a nearby lake.</i> Family: irrigation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Scientists created a <b>______</b> system that puts living things into groups such as kingdoms, families, and species. Which word best completes the sentence?", "opts": ["emergence", "classification", "tolerance", "prosperity"], "ci": 1, "exp": "<i><b>classification</b></i> (n.) the act or system of sorting things into groups. <i>The <b>classification</b> of animals helps scientists compare them.</i> Family: classify (v.) Only “classification” describes a system for putting things into groups.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "During the fire drill, everyone followed the school's ______: line up quietly, walk to the nearest exit, and meet on the field.", "opts": ["priority", "territory", "procedure", "heritage"], "ci": 2, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>The nurse explained the <b>procedure</b> for getting a flu shot.</i> Family: proceed (v.), procedural (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Before the experiment, the class read the safety ______ step by step: goggles on, gloves on, then measure the vinegar.<br><br>Which word best completes the sentence?", "opts": ["hypothesis", "phenomenon", "statistic", "procedure"], "ci": 3, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>Every fire drill follows the same <b>procedure</b>.</i> Family: procedural (adj.), proceed (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "In the old legend, the knight’s greatest <b>exploit</b> was crossing the frozen mountains alone to rescue the village. Which meaning of <b>exploit</b> is used in this sentence?", "opts": ["to treat someone unfairly to get something for yourself", "to make full use of something, such as a natural resource", "a brave or daring act", "a trick that takes advantage of a weakness in a computer program"], "ci": 2, "exp": "<i>exploit</i> has several meanings. As a noun it can mean a brave, exciting act. As a verb it can mean to use something fully, or to treat someone unfairly. <i>The pilot’s <b>exploits</b> were told in every newspaper.</i> Here it names something the knight did that was daring: “crossing the frozen mountains alone.”", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Her nervousness began to __________ itself in small ways: she tapped her pencil and kept checking the clock.<br><br>Which word best completes the sentence?", "opts": ["execute", "manifest", "sustain", "integrate"], "ci": 1, "exp": "<i>manifest</i> (v.) to show something clearly so that others can see it. Her tapping and clock-checking showed her nerves. <i>The disease <b>manifests</b> itself as a rash.</i> Family: manifestation (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Ben's essay was ______: each sentence connected clearly to the next, and his ideas were easy to follow.", "opts": ["coherent", "fragile", "abundant", "reluctant"], "ci": 0, "exp": "<i>coherent</i> (adj.) clear, logical, and easy to understand because the parts fit together. <i>After a good night's sleep, his answers were much more <b>coherent</b>.</i> Family: coherence (n.), incoherent (adj., opposite)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Each winter, waves <b>erode</b> the sandy cliff a little more, and now the old path is only a foot from the edge.<br><br>What does <b>erode</b> mean in this sentence?", "opts": ["to freeze solid", "to build up higher", "to slowly wear away", "to protect from damage"], "ci": 2, "exp": "<i>erode</i> (v.) to slowly wear away land or rock by water, wind, or ice. The cliff keeps getting closer to the path. <i>Rain can <b>erode</b> a hillside.</i> Family: erosion (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Even after scoring the winning goal, Diego stayed <b>modest</b> and told reporters that the whole team deserved the credit. What does <b>modest</b> mean in this sentence?", "opts": ["not bragging about your own success", "shy and afraid to speak to people", "thankful for help from a coach", "tired after working very hard"], "ci": 0, "exp": "<i><b>modest</b></i> (adj.) not bragging about your abilities or success; also, not large. <i>The champion gave a <b>modest</b> smile and thanked her family.</i> Family: modestly (adv.), modesty (n.) Diego gave the credit to others instead of himself.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Giving up her Saturday to help at the food bank was a ______ choice, but Ana felt proud afterward.", "opts": ["sacrificial", "sacrificed", "sacrifice", "sacrificing"], "ci": 0, "exp": "The blank comes before the noun <i>choice</i>, so it needs an adjective: <i>sacrificial</i> (involving giving something up). <i>sacrifice</i> (n./v.) to give up something you value for something more important. <i>Parents often <b>sacrifice</b> sleep for their babies.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Read the sentence: \"The new stadium has a <b>capacity</b> of 40,000 fans.\" What does <i>capacity</i> mean in this sentence?", "opts": ["a job or role someone has", "a state of being completely full", "the largest amount something can hold", "a person's ability to learn or do something"], "ci": 2, "exp": "<i>capacity</i> has several meanings. Here it means the most that something can hold: the stadium holds up to 40,000 people. <i>The bottle has a <b>capacity</b> of one liter.</i> It can also mean a person's ability (\"a capacity to learn\") or a role (\"in her capacity as coach\"). Family: capable (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "After a month of lessons, Jada became a ______ swimmer who could swim two laps without stopping. Which word best completes the sentence?", "opts": ["reluctant", "hostile", "fragile", "competent"], "ci": 3, "exp": "<i>competent</i> (adj.) able to do something well enough. <i>A <b>competent</b> cook can follow any recipe.</i> Being able to swim two laps shows skill. Family: competence (n.), competently (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"The truck driver had to slowly <b>negotiate</b> the narrow mountain road.\" What does <i>negotiate</i> mean in this sentence?", "opts": ["to argue loudly with another person", "to find a way along or past something difficult", "to discuss something to reach an agreement", "to buy and sell something for a profit"], "ci": 1, "exp": "<i>negotiate</i> usually means to talk with others to reach an agreement (<i>The teams <b>negotiated</b> a trade</i>). But it can also mean to travel carefully along or past something hard, like a narrow road or a sharp turn — that is the meaning here. Family: negotiation (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "A smile is a ______ sign of friendliness; people understand it in every country in the world. Which word best completes the sentence?", "opts": ["rural", "universal", "previous", "fragile"], "ci": 1, "exp": "<i>universal</i> (adj.) true or shared everywhere or by everyone. <i>Music is a <b>universal</b> language.</i> \"In every country in the world\" points to universal. Family: universe (n.), universally (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The bright orange scarf was the perfect ______ to her dark blue coat; the two colors looked great together. Which word best completes the sentence?", "opts": ["priority", "category", "complement", "strategy"], "ci": 2, "exp": "<i>complement</i> (n./v.) something that goes well with another thing and makes it better or complete. <i>Cranberry sauce is a tasty <b>complement</b> to turkey.</i> Do not mix it up with <i>compliment</i> (a kind remark). Family: complementary (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"Scientists studied the <b>composition</b> of the moon rock to learn which minerals it contained.\" What does <b>composition</b> mean in this sentence?", "opts": ["the way a photo is arranged", "a short essay written for school", "a piece of music that someone wrote", "what something is made of"], "ci": 3, "exp": "<i>composition</i> (n.) can mean a piece of music or writing, but here it means the parts or materials that make something up. Family: compose (v.), component (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "As the sun went down, the light began to ______, and soon we could barely see the trail. Which word best completes the sentence?", "opts": ["flourish", "diminish", "expand", "accumulate"], "ci": 1, "exp": "<i>diminish</i> (v.) to become smaller or weaker. <i>The noise will <b>diminish</b> as the train moves away.</i> Fading light gets smaller, so <i>diminish</i> fits; <i>expand</i> and <i>flourish</i> mean to grow.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "After reading the chapter twice, Leo answered every question correctly, which showed his strong ______ of the story. Which form of the word fits the sentence?", "opts": ["comprehensively", "comprehension", "comprehend", "comprehensive"], "ci": 1, "exp": "The blank needs a noun after \"his strong,\" so <i>comprehension</i> (understanding) fits. <i>comprehensive</i> (adj.) means including everything. Family: comprehend (v.), comprehensive (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The company that makes our bikes is a large ______ with factories in three states. Which form of the word fits the sentence?", "opts": ["manufactured", "manufacturing", "manufacturer", "manufacture"], "ci": 2, "exp": "A person or company that makes products is a <i>manufacturer</i> (n.). <i>manufacture</i> (v.) means to make goods, usually in a factory. <i>The <b>manufacturer</b> recalled the faulty toys.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The <b>swift</b> fox darted across the meadow and vanished into the woods before we could take a picture. Which word means the <b>OPPOSITE</b> of <b>swift</b> as it is used in the sentence?", "opts": ["sluggish", "quiet", "clever", "rapid"], "ci": 0, "exp": "<i>swift</i> (adj.) moving very fast. Its opposite is <i>sluggish</i> (slow-moving). <i>Rapid</i> is a synonym, not an opposite. <i>The <b>swift</b> current carried the leaf away.</i>", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Our school started a recycling club to help with the ______ of paper and plastic. Which form of the word best completes the sentence?", "opts": ["conserve", "conserved", "conservative", "conservation"], "ci": 3, "exp": "<i>conserve</i> (v.) to save something by using it carefully. After \"the\" and before \"of\" you need a noun: <i>conservation</i>. <i>Turn off the lights to <b>conserve</b> energy.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The new rule will <b>restrict</b> phone use during class. Which word means the <b>OPPOSITE</b> of “restrict” as it is used in the sentence?", "opts": ["allow", "observe", "limit", "prevent"], "ci": 0, "exp": "<i>restrict</i> (v.) to keep something within limits. Its opposite is <i>allow</i> (to let something happen). <i>Limit</i> and <i>prevent</i> are close to the same meaning, not the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"Kindness adds a new <b>dimension</b> to the story, showing a softer side of the villain.\" What does <b>dimension</b> mean in this sentence?", "opts": ["a different world in science fiction", "the size of a room", "a part or side of something", "a measurement such as length or width"], "ci": 2, "exp": "<i>dimension</i> (n.) can mean a measurement like length or width, but here it means a part, side, or aspect of something. Family: dimensional (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The young inventor was praised for her ______ idea: a backpack that charges a phone while you walk. Which form of the word best completes the sentence?", "opts": ["innovator", "innovate", "innovation", "innovative"], "ci": 3, "exp": "<i>innovation</i> (n.) a new idea, method, or invention. Before the noun \"idea\" you need an adjective: <i>innovative</i> (new and creative). Family: innovate (v.), innovator (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Scientists study how the moon's pull may <b>relate</b> to the rise and fall of ocean tides. Which word means the <b>SAME</b> or nearly the same as “relate” as it is used in the sentence?", "opts": ["compare", "describe", "separate", "connect"], "ci": 3, "exp": "<i>relate</i> (v.) here, to be connected to something. <i>Connect</i> is closest. <i>Separate</i> is the opposite. Family: relation (n.), relationship (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"The new library was built to <b>accommodate</b> two hundred readers at once, with tables on every floor.\" What does <b>accommodate</b> mean in this sentence?", "opts": ["to keep people quiet", "to have enough space for", "to build something quickly", "to make someone feel welcome"], "ci": 1, "exp": "<i>accommodate</i> (v.) to have room for or to provide what someone needs. <i>The bus can <b>accommodate</b> forty students.</i> Family: accommodation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The store offered to <b>compensate</b> us for the broken lamp by giving us a full refund. Which word means the <b>SAME</b> or nearly the same as “compensate” as it is used in the sentence?", "opts": ["charge", "repay", "blame", "warn"], "ci": 1, "exp": "<i>compensate</i> (v.) to give someone something, often money, to make up for a loss or problem. <i>Repay</i> means nearly the same. <i>Charge</i> is close to the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"Our teacher explained the <b>significance</b> of the Fourth of July: it marks the day the colonies declared their independence.\" What does <b>significance</b> mean in this sentence?", "opts": ["a celebration with food and music", "a short summary of a long story", "importance or special meaning", "the exact date when something happened"], "ci": 2, "exp": "<i>significance</i> (n.) importance or meaning. <i>We learned the <b>significance</b> of the old bell.</i> Family: significant (adj.), signify (v.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Most of the council voted yes, but two members spoke up in ______ because they thought the plan cost too much. Which word best completes the sentence?", "opts": ["surplus", "tolerance", "dissent", "refuge"], "ci": 2, "exp": "<i>dissent</i> (n.) disagreement with an idea or decision that most people support. <i>Two members voted no to show their <b>dissent</b>.</i> Family: dissenter (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The directions were <b>explicit</b>: “Write your name in the top right corner and use only a pencil.” Which word means the <b>OPPOSITE</b> of “explicit” as it is used in the sentence?", "opts": ["detailed", "vague", "polite", "clear"], "ci": 1, "exp": "<i>explicit</i> (adj.) stated clearly and in detail, leaving nothing unclear. Its opposite is <i>vague</i> (not clear). <i>Clear</i> and <i>detailed</i> are synonyms, not opposites.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "With dark clouds rolling in and thunder getting closer, rain seemed ______, so we packed up the picnic. Which word best completes the sentence?", "opts": ["tranquil", "voluntary", "inevitable", "ambiguous"], "ci": 2, "exp": "<i>inevitable</i> (adj.) certain to happen; impossible to avoid. <i>With those clouds, rain was <b>inevitable</b>.</i> Family: inevitably (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"The vote was <b>unanimous</b>: every single student raised a hand for the class trip to the science museum.\" What does <b>unanimous</b> mean in this sentence?", "opts": ["decided by most, but not all", "decided quickly without much thought", "agreed on by everyone", "very close and hard to decide"], "ci": 2, "exp": "<i>unanimous</i> (adj.) agreed to by everyone in a group. <i>The team made a <b>unanimous</b> choice for captain.</i> Family: unanimously (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before the debate, Jada wrote down a strong ______ to answer the other team’s claim that recess should be shorter. Which form of the word fits the sentence?", "opts": ["argue", "argumentative", "arguably", "counterargument"], "ci": 3, "exp": "The blank needs a noun after <i>a strong</i>: <i>counterargument</i> (a reason given against someone else’s argument). <i>Argue</i> is a verb, <i>argumentative</i> an adjective, <i>arguably</i> an adverb.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The town voted to <b>abolish</b> the old rule that banned skateboards in the park. Which word means the <b>OPPOSITE</b> of “abolish” as it is used in the sentence?", "opts": ["establish", "announce", "eliminate", "ignore"], "ci": 0, "exp": "<i>abolish</i> (v.) to officially end a law, rule, or system. Its opposite is <i>establish</i> (to set up or create). <i>Eliminate</i> is a synonym, not an opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "During the science lesson, Lila made an interesting <b>observation</b>: the plants near the window were growing taller. Which word means the <b>SAME</b> or nearly the same as “observation” as it is used in the sentence?", "opts": ["remark", "guess", "question", "mistake"], "ci": 0, "exp": "<i>observation</i> (n.) something you notice and say or write down. Here it means a comment about what she noticed, so <i>remark</i> is closest. A <i>guess</i> is not based on what you saw.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
