opts": ["Practicing alone matters more than playing with a group.", "Talented musicians never need help from anyone else.", "A mistake can lead to learning a better way to do something.", "It is better to stop trying than to be embarrassed in front of others."], "ci": 2, "exp": "Leo misses his entrance, learns from Ms. Ferraro to watch her hand, and then plays it correctly and keeps practicing that new method. Practicing alone happens at the end, but the story shows him using what the group rehearsal taught him.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5"}, {"passage": "<strong>The Entrance</strong><br>Leo had practiced the cello part of the overture so many times that he could hear it in his sleep, yet when Ms. Ferraro raised her baton at the first full rehearsal, his hands felt like borrowed gloves. The violins began, bright and quick, and Leo counted under his breath. Four measures. Eight. On the twelfth, he was supposed to come in with the low melody, but he hesitated half a beat, and the cellos beside him surged ahead without him.<br><br>Ms. Ferraro tapped her stand. &ldquo;Again, from letter B.&rdquo;<br><br>Leo felt his face burn. &ldquo;Sorry,&rdquo; he muttered. &ldquo;I lost count.&rdquo;<br><br>&ldquo;Counting is only half of it,&rdquo; she said, not unkindly. &ldquo;Watch my left hand. I'll look at you right before your entrance.&rdquo;<br><br>On the second try, Leo kept one eye on the page and one on her hand. When her glance found him, he drew the bow across the strings, and the melody rose, deep and vivid, beneath the violins. Beside him, Priya nodded once without missing a note.<br><br>After rehearsal, Leo stayed in his seat and practiced the entrance again, this time with his eyes closed, picturing that small, steady glance.", "stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;hesitated&rdquo; as it is used in the story?", "opts": ["whispered", "paused", "rushed", "stumbled"], "ci": 1, "exp": "<i>Hesitated</i> means paused or waited a moment before acting. Leo came in &ldquo;half a beat&rdquo; late. <i>Rushed</i> is the opposite.", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "<strong>The Entrance</strong><br>Leo had practiced the cello part of the overture so many times that he could hear it in his sleep, yet when Ms. Ferraro raised her baton at the first full rehearsal, his hands felt like borrowed gloves. The violins began, bright and quick, and Leo counted under his breath. Four measures. Eight. On the twelfth, he was supposed to come in with the low melody, but he hesitated half a beat, and the cellos beside him surged ahead without him.<br><br>Ms. Ferraro tapped her stand. &ldquo;Again, from letter B.&rdquo;<br><br>Leo felt his face burn. &ldquo;Sorry,&rdquo; he muttered. &ldquo;I lost count.&rdquo;<br><br>&ldquo;Counting is only half of it,&rdquo; she said, not unkindly. &ldquo;Watch my left hand. I'll look at you right before your entrance.&rdquo;<br><br>On the second try, Leo kept one eye on the page and one on her hand. When her glance found him, he drew the bow across the strings, and the melody rose, deep and vivid, beneath the violins. Beside him, Priya nodded once without missing a note.<br><br>After rehearsal, Leo stayed in his seat and practiced the entrance again, this time with his eyes closed, picturing that small, steady glance.", "stem": "Why does Priya most likely nod at Leo during the second try?", "opts": ["to show that she was upset about his first mistake", "to remind him to watch Ms. Ferraro's hand", "to tell him to play faster to catch up", "to show that she noticed he came in at the right time"], "ci": 3, "exp": "Priya nods right after Leo's melody rises on time, &ldquo;without missing a note,&rdquo; which suggests quiet approval. Nothing shows she is upset, and he is already watching the hand.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>A Face in the Fog</strong><br>On October 28, 1886, Nathan Weiss stood at the rail of a crowded ferry in New York Harbor, rain dripping from the brim of his cap. Fog hid the shoreline, and for a long moment the boat seemed to drift through a gray room with no walls. Then the mist thinned, and a copper face appeared above the water, far larger than any face Nathan had imagined.<br><br>&ldquo;She's enormous,&rdquo; whispered his sister, Ruth.<br><br>Their father, who had sailed into this same harbor as a young immigrant from Bavaria twelve years earlier, said nothing. He removed his hat, despite the rain, and held it against his chest. Nathan had heard him describe that first voyage many times: the crowded deck, the seasickness, the uncertainty of starting over. Yet he had never heard his father's voice as quiet as it was now. &ldquo;When I came,&rdquo; he said, &ldquo;there was nothing here to greet us.&rdquo;<br><br>Around them, whistles shrieked and cannons boomed from ships across the harbor. Nathan barely heard them. He was watching his father's face, and for the first time he understood that the statue was not only a gift from France but also a part of his own family's heritage.", "stem": "According to the passage, where did Nathan's father come from?", "opts": ["France", "the Sierra Nevada", "New York", "Bavaria"], "ci": 3, "exp": "The passage says he came &ldquo;as a young immigrant from Bavaria twelve years earlier.&rdquo; France is mentioned only as the country that gave the statue.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"passage": "<strong>Keeping in Touch</strong><br><strong>Passage A</strong><br>Before Rural Free Delivery began in 1896, many farm families had to travel into town, sometimes several miles, just to find out whether a letter had arrived. In the spring of 1898, Clara Hoyt's family in rural Ohio finally got a mailbox at the end of their lane. Every afternoon, Clara eagerly watched for the carrier's buggy. When a letter from her aunt in Chicago came, the whole family gathered at the kitchen table, and Clara read it aloud twice. The letters arrived weeks apart, but each one felt like a visit.<br><br><strong>Passage B</strong><br>Every Sunday evening, Jonah Price props his tablet against the fruit bowl and calls his grandmother in Tucson. Within a few seconds, her face fills the screen, and she holds up whatever she has been working on: a half-finished quilt, a pan of cornbread, a lizard sunning itself on her porch. Each week they read a chapter of the same mystery novel and argue cheerfully about who the culprit might be. Jonah sometimes wishes the calls lasted longer, but he knows his grandmother will be only a tap away next Sunday.", "stem": "How are Clara's letters in Passage A and Jonah's calls in Passage B alike?", "opts": ["Both require the family to travel into town.", "Both are shared with the whole family at the kitchen table.", "Both help a child feel close to a relative who lives far away.", "Both happen every afternoon after school."], "ci": 2, "exp": "Clara's letters from her aunt &ldquo;felt like a visit,&rdquo; and Jonah's weekly calls connect him with his grandmother in Tucson. Only Passage A mentions the kitchen table, and only the time before 1896 required trips to town.", "tag": "Compare Texts", "tagcolor": "#185FA5"}, {"passage": "<strong>Keeping in Touch</strong><br><strong>Passage A</strong><br>Before Rural Free Delivery began in 1896, many farm families had to travel into town, sometimes several miles, just to find out whether a letter had arrived. In the spring of 1898, Clara Hoyt's family in rural Ohio finally got a mailbox at the end of their lane. Every afternoon, Clara eagerly watched for the carrier's buggy. When a letter from her aunt in Chicago came, the whole family gathered at the kitchen table, and Clara read it aloud twice. The letters arrived weeks apart, but each one felt like a visit.<br><br><strong>Passage B</strong><br>Every Sunday evening, Jonah Price props his tablet against the fruit bowl and calls his grandmother in Tucson. Within a few seconds, her face fills the screen, and she holds up whatever she has been working on: a half-finished quilt, a pan of cornbread, a lizard sunning itself on her porch. Each week they read a chapter of the same mystery novel and argue cheerfully about who the culprit might be. Jonah sometimes wishes the calls lasted longer, but he knows his grandmother will be only a tap away next Sunday.", "stem": "According to the passages, which statement is <b>NOT</b> true?", "opts": ["Clara read her aunt's letter aloud twice.", "Clara's family received a letter from her aunt every week.", "Jonah and his grandmother read the same mystery novel.", "Jonah's grandmother lives in Tucson."], "ci": 1, "exp": "Passage A says &ldquo;The letters arrived weeks apart,&rdquo; so they did not come every week. The other three statements match the passages.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Keeping in Touch</strong><br><strong>Passage A</strong><br>Before Rural Free Delivery began in 1896, many farm families had to travel into town, sometimes several miles, just to find out whether a letter had arrived. In the spring of 1898, Clara Hoyt's family in rural Ohio finally got a mailbox at the end of their lane. Every afternoon, Clara eagerly watched for the carrier's buggy. When a letter from her aunt in Chicago came, the whole family gathered at the kitchen table, and Clara read it aloud twice. The letters arrived weeks apart, but each one felt like a visit.<br><br><strong>Passage B</strong><br>Every Sunday evening, Jonah Price props his tablet against the fruit bowl and calls his grandmother in Tucson. Within a few seconds, her face fills the screen, and she holds up whatever she has been working on: a half-finished quilt, a pan of cornbread, a lizard sunning itself on her porch. Each week they read a chapter of the same mystery novel and argue cheerfully about who the culprit might be. Jonah sometimes wishes the calls lasted longer, but he knows his grandmother will be only a tap away next Sunday.", "stem": "In Passage A, Clara's family got a mailbox &ldquo;at the end of their lane.&rdquo; What does &ldquo;lane&rdquo; mean in this sentence?", "opts": ["a section of a pool for one swimmer", "a narrow road leading to a house or farm", "a long wooden alley for bowling", "a marked strip of a highway for one line of cars"], "ci": 1, "exp": "<i>Lane</i> has several meanings, but on a farm, the end of the lane is where the narrow road from the house meets the main road, which is where a mailbox would stand.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by hand, relying on shovels, horses, and occasionally gunpowder to blast through rock. Because the land rises about 570 feet between the Hudson and Lake Erie, engineers built 83 locks to lift boats up the slope one step at a time.<br><br>The canal opened on October 26, 1825, eight years after digging began. Clinton rode a boat from Buffalo to New York City and poured a barrel of Lake Erie water into the Atlantic Ocean. Shipping costs plunged by about ninety percent, and New York City soon became the busiest port in the nation.", "stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did New York City become the busiest port in the nation after 1825?&rdquo;)?<br><br><b>A.</b> &ldquo;shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself&rdquo;<br><b>B.</b> &ldquo;Critics mocked the plan as &lsquo;Clinton&rsquo;s Ditch&rsquo;&rdquo;<br><b>C.</b> &ldquo;Workers, many of them Irish immigrants, dug almost entirely by hand&rdquo;<br><b>D.</b> &ldquo;Shipping costs plunged by about ninety percent&rdquo;<br><b>E.</b> &ldquo;Clinton rode a boat from Buffalo to New York City&rdquo;<br><b>F.</b> &ldquo;engineers built 83 locks to lift boats up the slope&rdquo;", "opts": ["A and F", "C and D", "A and D", "D and E"], "ci": 2, "exp": "<b>A</b> shows how expensive shipping was <i>before</i> the canal, and <b>D</b> shows that the canal made it much cheaper. Together they prove the cause in Part A: cheaper shipping.<br><b>Why not the others:</b> <b>B</b> is about critics; <b>C</b> is about who did the digging; <b>E</b> is Clinton&rsquo;s celebration trip; <b>F</b> explains how the canal was built, not why the port grew. Each is true, but none shows that shipping got cheaper.<br><b>Tip for Part B:</b> the right evidence must prove <i>your Part A answer</i>, not just be a true fact from the passage.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A"}, {"passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by hand, relying on shovels, horses, and occasionally gunpowder to blast through rock. Because the land rises about 570 feet between the Hudson and Lake Erie, engineers built 83 locks to lift boats up the slope one step at a time.<br><br>The canal opened on October 26, 1825, eight years after digging began. Clinton rode a boat from Buffalo to New York City and poured a barrel of Lake Erie water into the Atlantic Ocean. Shipping costs plunged by about ninety percent, and New York City soon became the busiest port in the nation.", "stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Shipping goods by wagon was slow and very expensive.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> Engineers built 83 locks to lift boats up the slope.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> The land rises about 570 feet between the Hudson River and Lake Erie.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> New York City became the busiest port in the nation.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Critics believed the canal could never succeed.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> Governor Clinton persuaded the legislature to pay for a canal.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The canal made shipping goods about ninety percent cheaper.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> People mocked the plan as &ldquo;Clinton&rsquo;s Ditch.&rdquo;</td></tr></table>Which choice matches every cause with its correct effect?", "opts": ["1&ndash;C, 2&ndash;A, 3&ndash;D, 4&ndash;B", "1&ndash;A, 2&ndash;C, 3&ndash;D, 4&ndash;B", "1&ndash;A, 2&ndash;B, 3&ndash;C, 4&ndash;D", "1&ndash;D, 2&ndash;A, 3&ndash;C, 4&ndash;B"], "ci": 0, "exp": "<b>Test each pair with &ldquo;Because ___, ___.&rdquo;</b> The cause goes after <i>because</i>; the effect is what happened next.<br>&bull; <b>1&ndash;C:</b> Because wagons were slow and costly, Clinton pushed for a canal (the first paragraph starts with this problem).<br>&bull; <b>2&ndash;A:</b> Because the land rises 570 feet, engineers needed 83 locks to lift boats up the slope.<br>&bull; <b>3&ndash;D:</b> Because critics thought it would fail, they mocked it as &ldquo;Clinton&rsquo;s Ditch.&rdquo;<br>&bull; <b>4&ndash;B:</b> Because shipping became so much cheaper, New York City soon became the busiest port.<br><b>Watch out:</b> don&rsquo;t just match 1&ndash;A, 2&ndash;B, 3&ndash;C, 4&ndash;D in order. Read each cause, ask &ldquo;So what happened?&rdquo;, and find that effect.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A"}, {"passage": "<strong>How Bats See with Sound</strong><br>On a summer evening, a little brown bat can snatch hundreds of mosquitoes from the air in a single hour, even in near-total darkness. Its eyes are not useless, but it relies on a far more precise tool called echolocation. As the bat flies, it produces rapid, high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how quickly the echoes return and how loud they are, the bat&rsquo;s brain builds a detailed picture of its surroundings. A faint, delayed echo signals something distant, while a loud, quick echo warns of something close. As a bat closes in on an insect, its calls speed up to as many as two hundred per second, allowing it to track the target&rsquo;s every twist and turn.<br><br>Echolocation is so reliable that engineers studied it while developing sonar for ships and submarines. Today, scientists are exploring whether similar tools could help people who are blind move safely through unfamiliar streets.", "stem": "Which choice lists the steps of echolocation in the correct order?", "opts": ["The brain builds a picture &rarr; the bat makes a call &rarr; the call strikes an object &rarr; an echo returns", "The call strikes an object &rarr; the bat makes a call &rarr; the brain builds a picture &rarr; an echo returns", "The bat makes a call &rarr; an echo returns &rarr; the call strikes an object &rarr; the brain builds a picture", "The bat makes a call &rarr; the call strikes an object &rarr; an echo returns &rarr; the brain builds a picture"], "ci": 3, "exp": "The first paragraph gives the order: the bat &ldquo;produces &hellip; calls,&rdquo; then &ldquo;a call strikes an object&rdquo; and &ldquo;bounces back as an echo.&rdquo; Only after the echoes return can the brain compare them and &ldquo;build a detailed picture.&rdquo; An echo cannot return before the call hits something.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Soup-Can Bridge</strong><br>Hana stared at the pile of craft sticks on the kitchen table. She had been eager to begin all week, but the science-club challenge was simple to explain and maddening to solve: build a bridge that could hold a full can of soup.<br><br>&ldquo;Triangles,&rdquo; she insisted. &ldquo;Triangles don&rsquo;t bend.&rdquo;<br><br>Her partner, Diego, shook his head. &ldquo;Arches are stronger. The Romans built arches that are still standing.&rdquo;<br><br>They argued until the glue began to dry in its bottle. Finally, Hana&rsquo;s grandmother, who had been quietly shelling peas at the counter, looked up. &ldquo;Why must the bridge be one idea or the other?&rdquo;<br><br>Hana opened her mouth to object, then closed it. Diego hesitated, too. Slowly, the two of them began sketching an arch reinforced with small triangles along its sides.<br><br>On Friday, their bridge held the soup can, then a second can, then a third. When the teacher balanced a fourth can on top, the sticks creaked but stayed upright.<br><br>Diego grinned. &ldquo;Your triangles kept my arch from sagging.&rdquo;<br><br>&ldquo;And your arch gave my triangles somewhere to go,&rdquo; Hana replied.", "stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;maddening&rdquo; as it is used in the story?", "opts": ["relaxing", "frustrating", "exciting", "simple"], "ci": 1, "exp": "The challenge was &ldquo;simple to explain and maddening to solve,&rdquo; meaning it was very annoying and hard. <i>Frustrating</i> is closest. <i>Relaxing</i> is nearly the opposite, and <i>simple</i> describes explaining it, not solving it.", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "<strong>The Soup-Can Bridge</strong><br>Hana stared at the pile of craft sticks on the kitchen table. She had been eager to begin all week, but the science-club challenge was simple to explain and maddening to solve: build a bridge that could hold a full can of soup.<br><br>&ldquo;Triangles,&rdquo; she insisted. &ldquo;Triangles don&rsquo;t bend.&rdquo;<br><br>Her partner, Diego, shook his head. &ldquo;Arches are stronger. The Romans built arches that are still standing.&rdquo;<br><br>They argued until the glue began to dry in its bottle. Finally, Hana&rsquo;s grandmother, who had been quietly shelling peas at the counter, looked up. &ldquo;Why must the bridge be one idea or the other?&rdquo;<br><br>Hana opened her mouth to object, then closed it. Diego hesitated, too. Slowly, the two of them began sketching an arch reinforced with small triangles along its sides.<br><br>On Friday, their bridge held the soup can, then a second can, then a third. When the teacher balanced a fourth can on top, the sticks creaked but stayed upright.<br><br>Diego grinned. &ldquo;Your triangles kept my arch from sagging.&rdquo;<br><br>&ldquo;And your arch gave my triangles somewhere to go,&rdquo; Hana replied.", "stem": "Why does Hana most likely open her mouth to object and then close it?", "opts": ["She realizes her grandmother has made a good point.", "She is too tired from arguing to say anything else.", "She has forgotten what she wanted to say about triangles.", "She does not want her grandmother to hear her complain."], "ci": 0, "exp": "Right after the grandmother asks why the bridge must be &ldquo;one idea or the other,&rdquo; Hana stops herself, and then the partners start combining their ideas. That shows she sees the question makes sense, not that she is tired or forgetful.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Black Sunday</strong><br>By the spring of 1935, Eli Turner had almost forgotten what rain smelled like. For four years, drought had baked his family&rsquo;s wheat farm near Boise City, Oklahoma, and the wind had stripped away the loose topsoil that the plows had broken up. Every morning, Mama wiped a fresh layer of grit from the windowsills.<br><br>Sunday, April 14, began bright and calm, so Eli and his father drove into town to help a neighbor mend a fence. In the afternoon, the birds suddenly fell silent. Eli glanced north and saw a black wall, thousands of feet high, rolling across the prairie toward them.<br><br>&ldquo;Get in the truck!&rdquo; Papa shouted.<br><br>They raced home ahead of the storm, but within minutes the daylight vanished, and Eli could not see his own hand. Mama had already stuffed wet rags under the doors, yet the dust seeped through every crack.<br><br>The next morning, drifts of dirt buried the fence posts. Another storm seemed inevitable. Papa stood in the field for a long time. &ldquo;We&rsquo;ll plant again,&rdquo; he said at last, though his voice was uncertain.", "stem": "<b>Part A</b><br>Why could Eli not see his own hand on the afternoon of April 14?", "opts": ["because the sun had already set for the night", "because Mama had ed from far away"], "ci": 2, "exp": "<i>Drone</i> has several meanings, but here it goes with &ldquo;beetle,&rdquo; the insect whose wings make a low humming noise that the bat hears. The other choices are real meanings of <i>drone</i> that do not fit this line.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
