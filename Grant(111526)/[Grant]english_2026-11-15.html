<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer. This week's review — questions you missed recently.";
var TODAY_STR = "20261115";
var RAW_QUESTIONS = [{"passage": "<strong>How Bats See with Sound</strong><br>On a summer night, a little brown bat can catch hundreds of mosquitoes in a single hour without bumping into one branch. The bat is not relying on its eyes. Instead, it uses echolocation. As it flies, the bat produces a rapid series of high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how long each echo takes to return, and how loud it is, the bat&rsquo;s brain builds a detailed picture of its surroundings. A close object returns its echo sooner than a distant one. As a bat closes in on an insect, it calls faster and faster, sometimes nearly two hundred times per second, a burst that scientists have nicknamed the &ldquo;feeding buzz.&rdquo;<br><br>Some moths have developed a clever defense. They can hear the calls, and when a bat approaches, they drop toward the ground or make clicking sounds of their own that may confuse the hunter. Still, echolocation is so precise that some bats can detect a wire thinner than a human hair.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["A bat calls faster as it gets closer to an insect.", "A bat calls about two hundred times per second during its whole flight.", "Some moths make clicking sounds when a bat comes near.", "Most bat calls are too high for people to hear."], "ci": 1, "exp": "The passage says a bat calls &ldquo;sometimes nearly two hundred times per second&rdquo; only &ldquo;as a bat closes in on an insect&rdquo; &mdash; not during its whole flight. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Listening for Lindbergh</strong><br>On the afternoon of May 21, 1927, eleven-year-old Mae Hollis sat cross-legged in front of the family radio in Wichita, Kansas, while her father fiddled with the dial. Somewhere over the Atlantic Ocean, a young pilot named Charles Lindbergh was attempting to fly alone, without stopping, from New York to Paris. No one had ever done it.<br><br>&ldquo;He&rsquo;s been in the air more than thirty hours,&rdquo; Papa said, frowning at the crackling speaker. &ldquo;Fog over the ocean, they say.&rdquo;<br><br>Mae thought of the newspaper photograph of Lindbergh&rsquo;s plane, the <i>Spirit of St. Louis</i>, its silver wings so slender they looked fragile. To save weight, the newspaper said, he had left behind his radio and even his parachute.<br><br>Then the static cleared, and an announcer&rsquo;s voice rose with excitement: Lindbergh had landed at Le Bourget Field, and a huge crowd was rushing across the airfield toward his plane.<br><br>Papa let out a whoop that rattled the windows. Mae ran onto the porch, where neighbors were already spilling out of their houses, and looked up at the sky as though she might see the tiny plane herself.", "stem": "Which meaning of <b>dial</b> is used in the first paragraph?", "opts": ["the face of a clock that shows the hours", "a knob that is turned to choose a radio station", "to call someone by pressing numbers on a phone", "a round gauge that shows a measurement, such as speed"], "ci": 1, "exp": "Mae&rsquo;s father &ldquo;fiddled with the dial&rdquo; of the family radio, so it is the knob that tunes the station. A gauge is also a kind of dial, but it only shows a measurement; it is not turned to change anything.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>Prairie Wind</strong><br>At dawn the wind is barely breathing;<br>it combs the wheat with gentle hands<br>and lifts the meadowlark&rsquo;s first music<br>across the waking, golden lands.<br><br>By noon it gathers up its courage;<br>it races fences, rattles doors,<br>it bends the cottonwoods like dancers<br>and sweeps the dust from porch-board floors.<br><br>At dusk it turns impatient, hungry;<br>it howls along the fields of hay,<br>it herds the clouds like restless cattle<br>and chases tumbleweeds away.<br><br>But when the stars come out to listen,<br>the wind lies down in tall, soft grass<br>and hums a low and patient lullaby<br>to every field it used to pass.", "stem": "Which word means the <b>OPPOSITE</b> of <b>restless</b> as it is used in the third stanza?", "opts": ["hungry", "uneasy", "noisy", "settled"], "ci": 3, "exp": "Restless cattle cannot stay still. The opposite is <i>settled</i> (calm and still). <i>Uneasy</i> means almost the same as restless.", "tag": "Antonym", "tagcolor": "#185FA5"}, {"passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Some acorns grow into oaks because squirrels forget where they buried them.", "Witch hazel pods can fling seeds as far as thirty feet.", "A maple seed floats down under a tuft of silky threads, like a parachute.", "Burdock burrs gave an engineer the idea for Velcro."], "ci": 2, "exp": "The silky “tiny parachute” belongs to the dandelion. The passage says a maple seed has “a single papery wing that makes it spin like a helicopter blade.” The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1962, twelve-year-old Gary lived in Huntsville, Alabama, where engineers were designing the giant rockets that would one day carry astronauts toward the Moon. Inspired by the rumble of engine tests that rattled his windows, Gary built model rockets from cardboard tubes and balsa-wood fins. His first three launches failed spectacularly; one rocket spun in circles and crashed into a neighbor’s garden. Rather than quit, Gary persevered, studying each failure and adjusting the fins. When his fourth rocket soared straight up and drifted back down on its parachute, he decided he would become an engineer himself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last spring, Maya’s science club in Wichita, Kansas, launched a weather balloon carrying a small camera and a GPS tracker. As the balloon climbed, the air grew thinner, and the balloon swelled until it burst more than 90,000 feet above the ground. A parachute carried the equipment safely back to a wheat field sixty miles away, where the club located it using the GPS signal. Back at school, the students watched the video in amazement: the sky had turned nearly black, and the curve of Earth stretched across the screen. Maya says the project made space feel close enough to touch.</p>", "stem": "Based on the passages, which statement is <b>NOT</b> true?", "opts": ["Maya’s club used a GPS signal to find its equipment.", "Gary’s fourth rocket crashed into a neighbor’s garden.", "Gary’s first three rocket launches did not succeed.", "Maya’s balloon burst more than 90,000 feet above the ground."], "ci": 1, "exp": "In Passage A, a rocket from the first three failed launches crashed into the garden. The fourth rocket “soared straight up and drifted back down on its parachute.”", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Arm of Liberty</strong><br><p style=\"margin:0 0 8px;\">In the summer of 1876, eleven-year-old Thomas Reilly rode a crowded train from Trenton to Philadelphia with his uncle Patrick, a blacksmith. The whole country, it seemed, had come to the Centennial Exhibition, a fair celebrating one hundred years since the signing of the Declaration of Independence.</p><p style=\"margin:0 0 8px;\">Their first stop was Machinery Hall. There, the colossal Corliss steam engine, taller than a three-story house, turned a flywheel that powered hundreds of other machines through belts and shafts. Uncle Patrick stood in silence for a long time. “Every hammer I own,” he finally murmured, “and none of them could do in a day what this does in a minute.”</p><p style=\"margin:0 0 8px;\">Later, near the lagoon, Thomas spotted something even stranger: a giant copper hand gripping a torch, rising above the crowd. A sign explained that it belonged to a statue that France planned to give the United States, and that visitors could pay to climb a vertical ladder inside the arm to the balcony around the torch. The money would help pay to finish the statue.</p><p style=\"margin:0 0 8px;\">Thomas counted the coins in his pocket, then looked hopefully at his uncle. Uncle Patrick grinned and added a coin of his own. From the balcony, the fairgrounds spread out beneath them, and Thomas tried to imagine how tall the finished statue would be.</p>", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The fair celebrated one hundred years since the Declaration of Independence.", "The Corliss engine powered many other machines.", "Uncle Patrick refused to pay for the climb to the torch.", "The torch belonged to a statue France planned to give the United States."], "ci": 2, "exp": "Uncle Patrick “grinned and added a coin of his own,” so he helped pay. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>How a Tornado Forms</strong><br><p style=\"margin:0 0 8px;\">A tornado is a violently spinning column of air that stretches from a thunderstorm down to the ground. Although tornadoes can strike almost anywhere, they are especially common in the central United States, a region sometimes nicknamed Tornado Alley, because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.</p><p style=\"margin:0 0 8px;\">Most powerful tornadoes are born inside supercells. When winds near the ground blow in a different direction and at a different speed than winds higher up, the air between them begins to roll like a pencil between your palms. A strong updraft inside the storm can tilt this rolling air upright, and the whole storm begins to rotate. If the spinning narrows and tightens, it speeds up, just as a figure skater spins faster when she pulls in her arms, and a funnel may descend toward the earth.</p><p style=\"margin:0 0 8px;\">Tornado winds can exceed 200 miles per hour, causing tremendous damage in seconds. Because no one can prevent a tornado, forecasters concentrate on warning people early. Doppler radar can detect rotation inside a storm before a funnel ever appears, giving families precious minutes to reach a basement or an interior room.</p>", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["A spinning storm speeds up when the spinning narrows.", "Doppler radar can detect rotation before a funnel appears.", "Tornadoes form only in the central United States.", "Tornado winds can be faster than 200 miles per hour."], "ci": 2, "exp": "The passage says tornadoes “can strike almost anywhere,” even though they are especially common in the central United States. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>", "stem": "The poet writes that the wind “came walking down our street / on tall and restless, unseen feet.” What does this language do?", "opts": ["It describes the wind as if it were a person.", "It tells exactly how fast the wind was blowing.", "It compares the wind to embers by using the word “like.”", "It shows that the speaker is afraid of the wind."], "ci": 0, "exp": "Wind cannot really walk or have feet. Giving it human actions is called personification. The poem does use “like” later, but that compares the <i>leaves</i> to embers.", "tag": "Author's Craft", "tagcolor": "#185FA5"}, {"passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>", "stem": "Read this sentence: “He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.” Which word means the <b>SAME</b> or nearly the same as <b>deliberate</b>?", "opts": ["cheerful", "hurried", "intentional", "accidental"], "ci": 2, "exp": "<i>Deliberate</i> means done carefully and on purpose. Jonah chose the section he knew best and played it steadily, so <i>intentional</i> fits. <i>Hurried</i> and <i>accidental</i> mean nearly the opposite.", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "In the summer of 1881, twelve-year-old Thomas Byrne lived in a crowded apartment near the East River in Brooklyn. Every morning he watched hundreds of people squeeze onto the ferries that carried workers across the river to New York City. When fog or ice filled the river, the ferries stopped, and many families lost a day&rsquo;s pay. That was why the city was building the Brooklyn Bridge, a suspension bridge, or a bridge whose roadway hangs from huge cables stretched between tall towers.<br><br>Years earlier, Thomas&rsquo;s father had helped dig the bridge&rsquo;s foundations. He had worked in a caisson, a giant wooden box without a bottom that was sunk to the riverbed and filled with pressed air to keep the water out. Workers who came up too quickly often became sick with a painful illness called caisson disease. The chief engineer, Washington Roebling, became so ill that he could no longer leave his house.<br><br>One afternoon, Thomas delivered a package to the Roebling home. He saw Emily Roebling, the engineer&rsquo;s wife, studying drawings at a cluttered table. She explained that she carried her husband&rsquo;s instructions to the builders every day and had learned the mathematics of cables herself. <u>Mrs. Roebling was the most remarkable person in all of Brooklyn.</u><br><br>From the window, Thomas could see the two stone towers rising above the river like giant gray guardians. Workers were spinning steel wires into four thick cables, each made of more than 5,000 wires. Thomas asked whether a boy could ever learn to build something so enormous. Mrs. Roebling handed him a small notebook and told him to begin by writing down every question he had. On his way home, Thomas stopped at the water&rsquo;s edge, opened the notebook, and stared up at the cables shining in the evening sun.", "stem": "What was the main way in which a caisson kept river water out while men dug?", "opts": ["It was lined with stone from the towers.", "It was covered with wet sheets.", "It was held up by steel cables.", "It was filled with pressed air."], "ci": 3, "exp": "The caisson was &ldquo;sunk to the riverbed and filled with pressed air to keep the water out.&rdquo;", "tag": "Main Way", "tagcolor": "#185FA5"}, {"passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs.", "stem": "How are the libraries in Passage A and Passage B alike?", "opts": ["Both opened in Philadelphia during colonial times.", "Both help people share costly things instead of buying them.", "Both lend mostly tools and musical instruments to families.", "Both were started by Benjamin Franklin and his friends."], "ci": 1, "exp": "In Passage A, books were &ldquo;expensive and rare,&rdquo; so members shared them. In Passage B, families share tools and instruments instead of buying them. The libraries are in different places and times, and only B lends tools.", "tag": "Compare Texts", "tagcolor": "#185FA5"}, {"passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>", "stem": "Which of these does the poem <b>NOT</b> describe the river doing?", "opts": ["cracking its ice in March", "swallowing a fence and a footbridge", "freezing over again in the fall", "humming a gentle tune in July"], "ci": 2, "exp": "The poem moves from March to April to July and never mentions fall. It does say the river “cracks its frozen coat,” “swallows fence and footbridge,” and “hums a gentle tune.”", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>", "stem": "According to the passage, why do wildfires often skip over land near a beaver pond?", "opts": ["Beavers cut down all the trees nearby.", "The dam blocks the wind from reaching the land.", "Farmers clear the land around the pond.", "The ground there stays wet and soggy."], "ci": 3, "exp": "Because the pond holds water, “nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground.” Beavers do cut trees, but the passage links the fires to the wet ground.", "tag": "Cause & Effect", "tagcolor": "#185FA5"}, {"passage": "<strong>Just a Tuesday</strong><br><p style=\"margin:0 0 8px;\">Owen chalked his hands for the third time and stared up at the purple route. It was the final climb of the Riverside Youth Bouldering Contest, and every competitor before him had slipped at the same overhang near the top.</p><p style=\"margin:0 0 8px;\">“You’re stalling,” his friend Jada said, nudging him. “You’ve practiced that move a hundred times.”</p><p style=\"margin:0 0 8px;\">“Practicing is different,” Owen muttered. “Nobody was watching then.”</p><p style=\"margin:0 0 8px;\">Coach Ortiz knelt beside him. “Forget the crowd. Climb it the way you’d climb it on a Tuesday afternoon, one hold at a time.”</p><p style=\"margin:0 0 8px;\">Owen nodded and began. His legs trembled at the overhang, and for a moment his fingers started to slide. Instead of lunging, he paused, shifted his hip closer to the wall, and reached deliberately for the next hold. It held. Three moves later, he slapped the top with both hands.</p><p style=\"margin:0 0 8px;\">The gym erupted, but Owen barely heard it. He was grinning at Coach Ortiz, who simply raised one thumb, as if to say, <i>Just a Tuesday.</i></p>", "stem": "Which word means the <b>SAME</b> or nearly the same as “<b>stalling</b>” as it is used in the story?", "opts": ["complaining", "bragging", "delaying", "hurrying"], "ci": 2, "exp": "Owen has chalked his hands “for the third time” and is staring at the route instead of climbing, so Jada says he is <i>stalling</i>: putting off starting. <i>Hurrying</i> means the opposite.", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>", "stem": "Which event happened <b>right after</b> the two telegraph lines were joined?", "opts": ["Western Union sent out two crews from opposite ends.", "A message from California reached President Lincoln.", "The Pony Express announced that it would close.", "Congress passed a law offering money for the line."], "ci": 1, "exp": "“Within hours” of the joining, the message reached Lincoln. The Pony Express closing came “two days later,” so it was not right after.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Last Move</strong><br><p style=\"margin:0 0 8px;\">Kenji had practiced for weeks, but when the tournament director posted the final pairings, his stomach dropped. His opponent in the championship round was Ava, his best friend and the person who had taught him the game.</p><p style=\"margin:0 0 8px;\">“We don’t have to make this weird,” Ava said, sliding into the chair across from him. “Just play your best.”</p><p style=\"margin:0 0 8px;\">Kenji nodded, though his hands were trembling. For forty minutes the two of them traded pieces in near silence. Then Ava leaned back and frowned. Kenji glanced at the board and saw it: if he moved his knight, her queen would be trapped. He hesitated. Winning would mean defeating the person who had spent an entire summer patiently explaining openings to him at her kitchen table.</p><p style=\"margin:0 0 8px;\">He moved the knight.</p><p style=\"margin:0 0 8px;\">Ava stared at the board for a long moment. Then, to Kenji’s astonishment, she grinned and reached across to shake his hand. “I resign,” she said. “I’ve been waiting all year for you to find a move like that.”</p><p style=\"margin:0 0 8px;\">On the bus ride home, Kenji kept the small trophy in his lap, but what he remembered most was the pride in his friend’s voice.</p>", "stem": "According to the story, which statement is <b>NOT</b> true?", "opts": ["Kenji’s knight move trapped Ava’s king.", "Ava had taught Kenji how to play chess.", "The two players had traded pieces for forty minutes before Kenji saw his move.", "Ava resigned after Kenji moved his knight."], "ci": 0, "exp": "The story says that if Kenji moved his knight, “her queen would be trapped” — the queen, not the king. The other three statements match the story.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>", "stem": "According to the passage, which event happened right after burning embers leaped across the Chicago River?", "opts": ["Rain helped put out the flames.", "The city’s waterworks caught fire.", "A fire broke out in the O’Leary barn.", "Strong winds pushed the flames toward downtown."], "ci": 1, "exp": "The passage says embers “leaped across the Chicago River, and soon the city’s waterworks caught fire.” The barn fire and the winds came before the embers crossed the river; the rain came last, on October 10.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>High Above the Golden Gate</strong><br><p style=\"margin:0 0 8px;\">Every morning in the spring of 1936, eleven-year-old Rosa Delgado climbed the hill near her house to watch her father leave for work. Papa was an ironworker on the Golden Gate Bridge, and from the hill she could see its two orange towers rising out of the fog like the masts of an enormous ship.</p><p style=\"margin:0 0 8px;\">Rosa knew the work was dangerous. Wind whipped through the strait, and the steel beams were often slick with mist. But Papa always reminded her about the net. The bridge’s chief engineer, Joseph Strauss, had ordered a huge rope net strung beneath the deck. “If anyone slips,” Papa said, “the net catches him like a fish.”</p><p style=\"margin:0 0 8px;\">One foggy afternoon, Papa came home later than usual. His friend Mr. Lindqvist had lost his footing on a beam and tumbled into the net, and Papa had helped haul him back up. “He’s fine,” Papa said, setting down his lunch pail. “He says he’s a member of the Halfway to Hell Club now.”</p><p style=\"margin:0 0 8px;\">Rosa laughed, but that night she added one line to her diary: <i>Thank you, net.</i></p>", "stem": "According to the passage, what happened right after Mr. Lindqvist tumbled into the net?", "opts": ["Rosa wrote a line in her diary.", "Papa helped haul him back up.", "Joseph Strauss ordered the net to be strung.", "Papa came home later than usual."], "ci": 1, "exp": "Mr. Lindqvist “tumbled into the net, and Papa had helped haul him back up.” Papa came home afterward, and Rosa wrote in her diary that night. Strauss had ordered the net long before.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1943, with food rationed during World War II, the government urged Americans to plant “victory gardens.” Thirteen-year-old Ruth Kowalski and her neighbors on Chicago’s South Side cleared bricks and broken glass from a vacant lot behind their apartment building. They planted beans, tomatoes, and cabbage in tidy rows, hauling water in buckets from the building’s basement. By August, the lot was producing more vegetables than the families could eat, so Ruth’s mother canned the extra in glass jars to last through the winter. Ruth later said the garden taught her that a neighborhood could feed itself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last year, students at Ridgeview Middle School in Denver turned their flat school roof into a hydroponic garden. Instead of soil, the plants grow in trays of water mixed with nutrients, and sensors send a text message to the students when the water runs low. Seventh grader Leo Martinez checks the lettuce and basil every morning before class. The harvest goes straight to the school cafeteria, where it replaces vegetables that once traveled more than a thousand miles by truck. Leo says the best part is watching classmates eat a salad that was growing above their heads that morning.</p>", "stem": "In Passage B, the prefix <i>hydro-</i> means “water.” Based on this and the passage, what does <b>hydroponic</b> most likely mean?", "opts": ["watering plants with buckets", "growing plants that need very little water", "growing plants in water instead of soil", "growing plants on a flat roof"], "ci": 2, "exp": "Passage B says, “Instead of soil, the plants grow in trays of water mixed with nutrients.” <i>Hydro-</i> (water) matches this. Being on a roof is where the garden is, not what <i>hydroponic</i> means.", "tag": "Word Parts", "tagcolor": "#185FA5"}, {"passage": "<strong>The Race to Nome</strong><br><p style=\"margin:0 0 8px;\">Nellie Pruett pressed her mittened hand against the frosted window and stared down Front Street. For five days, the people of Nome, Alaska, had been waiting. It was the winter of 1925, diphtheria was spreading among the town’s children, and Dr. Welch’s medicine had expired. Nellie’s little brother, Tom, lay in the next room, his breathing rough and shallow.</p><p style=\"margin:0 0 8px;\">Fresh medicine had traveled by train from Anchorage to the town of Nenana. From there, teams of sled dogs were racing it across nearly seven hundred miles of ice, passing the package from one driver to the next like runners in a relay. Airplanes could not fly in such bitter cold, and the frozen sea had closed the harbor to ships.</p><p style=\"margin:0 0 8px;\">Before dawn on February 2, Nellie heard a sound she would never forget: the jingle of harness bells. Out of the darkness came a team of exhausted dogs, frost coating their fur, led by a black husky named Balto. The driver, Gunnar Kaasen, stumbled to the doctor’s door with the precious bundle.</p><p style=\"margin:0 0 8px;\">Nellie ran to Tom’s bedside. “It’s here,” she whispered. “Hold on just a little longer.”</p>", "stem": "According to the story, which statement is <b>NOT</b> true?", "opts": ["Airplanes carried the medicine for part of the trip.", "Balto was the lead dog of Gunnar Kaasen’s team.", "The frozen sea had closed Nome’s harbor to ships.", "The medicine traveled by train before the dogs took it."], "ci": 0, "exp": "The story says “airplanes could not fly in such bitter cold,” so no airplane carried the medicine. The other three statements match the story.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Keepers of the Light</strong><br><strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1886, twelve-year-old Lena Harlow lived at Seal Ledge Light, a stone tower on a rocky island off the coast of Maine. Each evening at sunset, she climbed eighty-one steps behind her father to light the great lamp. Through the night, they took turns trimming the wick and carrying cans of oil up the spiral stairs so that the beam would never diminish. During winter storms, waves sometimes swept across the island, and the family could not reach the mainland for weeks. Lena knew that if the light went out, a ship could strike the ledge.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Today, most American lighthouses operate without keepers. At Point Avery Light, an LED lamp switches on by itself when a sensor detects darkness, and backup batteries keep it glowing if the power fails. Coast Guard technicians visit only a few times a year to inspect the equipment. Many ships now rely chiefly on GPS, yet the Coast Guard still maintains lighthouses, because electronics can fail and a steady light in the right place remains a dependable guide. Some towers that are no longer needed have become museums where visitors can climb the stairs.</p>", "stem": "In Passage A, Lena and her father worked “so that the <b>beam</b> would never diminish.” Which meaning of <b>beam</b> is used here?", "opts": ["a big, happy smile", "a ray of light", "a narrow bar used in gymnastics", "a long, heavy piece of wood or metal"], "ci": 1, "exp": "The sentence is about keeping the lamp burning brightly, so <i>beam</i> means the ray of light from the lamp. The other choices are real meanings of <i>beam</i> that do not fit a lighthouse lamp at night.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>The Last Word</strong><br>Grace Moreno had reached the final round of the county spelling bee, and only one other speller, a tall boy named Theo, remained on the stage. When the pronouncer read the word “rhythm,” Grace spelled it slowly, letter by letter. The judges nodded, and the audience applauded.<br><br>As she returned to her seat, though, Grace's stomach tightened. She replayed the letters in her head and realized she had said “r-h-y-t-h-e-m.” The judges had misheard her.<br><br>“You look pale,” Theo whispered. “Are you nervous?”<br><br>Grace didn't answer. She thought about the gleaming trophy and about her grandmother, who had driven two hours to watch. Then she stood, walked to the judges' table, and explained her mistake.<br><br>The head judge studied her for a long moment. “That took courage,” she said quietly. “Most people would have stayed silent.”<br><br>Theo spelled the next word correctly and won. Afterward, while families crowded around him, Grace's grandmother squeezed her hand. “I came to watch a speller,” she said, “but I'm leaving prouder than if you had won.”", "stem": "Which statement best expresses the theme of the story?", "opts": ["Judges should listen more carefully to young speakers.", "Nervous people often make mistakes under pressure.", "Being honest can matter more than winning.", "Practice is the key to winning any contest."], "ci": 2, "exp": "Grace admits her mistake even though it costs her the trophy, and her grandmother says she is “prouder than if you had won.” Grace's misspelling was not caused by nerves; the story is about what she chose to do afterward.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5"}, {"passage": "<strong>The Race for the Creek</strong><br>At exactly noon on April 22, 1889, a cavalry bugle sounded, and the long line of wagons and horses at the edge of Oklahoma's Unassigned Lands surged forward all at once. Ten-year-old Annie Beckett clutched the wagon seat while Papa slapped the reins. For three weeks the family had camped near the border, and every evening Papa had studied a creased map by lantern light, circling the same bend of a creek where cottonwoods grew. &ldquo;Trees mean water,&rdquo; he had explained, &ldquo;and water means a farm.&rdquo;<br><br>Now dust swallowed everything. A rider on a sleek bay horse galloped past them, and Annie's heart sank; surely every good claim would be taken before their slow mules arrived. But the ambitious rider veered north toward the railroad, and the Becketts' wagon rattled on toward the creek. When they finally reached the cottonwoods, Papa jumped down and drove a wooden stake into the soil, its strip of red cloth snapping in the wind. Annie climbed down beside him, too breathless to speak. The land was theirs, though the real work, Papa reminded her, had only begun.", "stem": "What can the reader infer about how Annie feels when the family reaches the cottonwoods?", "opts": ["She is disappointed that their land is so far from the railroad.", "She is thrilled and relieved that they got the land they hoped for.", "She is frightened that the rider on the bay horse will take their claim.", "She is bored after waiting three weeks near the border."], "ci": 1, "exp": "Annie is \"too breathless to speak\" as the stake goes in and \"The land was theirs.\" Earlier her \"heart sank\" because she feared losing the claim, so now she feels relief. The rider had already \"veered north,\" so she no longer fears him.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Into the Unknown West</strong><br>In 1803, the United States purchased the vast Louisiana Territory from France, roughly doubling the size of the young nation. Yet almost no one in the government knew what lay between the Mississippi River and the Pacific Ocean. President Thomas Jefferson chose Meriwether Lewis, his personal secretary, to lead an expedition, and Lewis invited his former army friend William Clark to share command. Their group, known as the Corps of Discovery, left the St. Louis area in May 1804 and paddled up the Missouri River against a powerful current.<br><br>The explorers spent their first winter among the Mandan people in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them with her husband and infant son. Her help proved invaluable the following summer, when the Corps reached Shoshone lands and desperately needed horses to cross the Rocky Mountains. After a grueling, nearly starving trek through snowy passes, the travelers floated down the Columbia River and glimpsed the Pacific in November 1805. When they returned to St. Louis in 1806, they carried detailed maps, journals describing hundreds of unfamiliar plants and animals, and a far more accurate picture of the continent.", "stem": "Which sentence best states the main idea of the passage?", "opts": ["Sacagawea was the only reason the Corps of Discovery was able to reach the Pacific.", "Lewis and Clark led a long, difficult journey that gave the nation far better knowledge of the West.", "Thomas Jefferson bought the Louisiana Territory in order to double the size of the nation.", "Crossing the Rocky Mountains was harder than paddling up the Missouri River."], "ci": 1, "exp": "The passage follows the whole expedition and ends with what it brought back: “detailed maps, journals … and a far more accurate picture of the continent.” Sacagawea's help and the purchase are important details, but each is only one part, and the passage never says she was the only reason.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5"}, {"passage": "<strong>Into the Unknown West</strong><br>In 1803, the United States purchased the vast Louisiana Territory from France, roughly doubling the size of the young nation. Yet almost no one in the government knew what lay between the Mississippi River and the Pacific Ocean. President Thomas Jefferson chose Meriwether Lewis, his personal secretary, to lead an expedition, and Lewis invited his former army friend William Clark to share command. Their group, known as the Corps of Discovery, left the St. Louis area in May 1804 and paddled up the Missouri River against a powerful current.<br><br>The explorers spent their first winter among the Mandan people in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them with her husband and infant son. Her help proved invaluable the following summer, when the Corps reached Shoshone lands and desperately needed horses to cross the Rocky Mountains. After a grueling, nearly starving trek through snowy passes, the travelers floated down the Columbia River and glimpsed the Pacific in November 1805. When they returned to St. Louis in 1806, they carried detailed maps, journals describing hundreds of unfamiliar plants and animals, and a far more accurate picture of the continent.", "stem": "Which word means the <b>OPPOSITE</b> of “invaluable” as it is used in the passage?", "opts": ["worthless", "priceless", "temporary", "unfamiliar"], "ci": 0, "exp": "Sacagawea's help was “invaluable” because the Corps “desperately needed horses” — her help was extremely valuable. The opposite is <i>worthless</i>. “Priceless” means almost the same as invaluable, so it is a synonym, not an opposite.", "tag": "Antonym", "tagcolor": "#185FA5"}, {"passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops.", "stem": "Read this sentence from the passage: “After that, the lit portion <b>diminishes</b> night after night until the Moon vanishes from view again.” What does <i>diminishes</i> mean?", "opts": ["stays the same", "moves farther away", "becomes brighter", "becomes smaller"], "ci": 3, "exp": "The lit part shrinks “until the Moon vanishes,” so <i>diminishes</i> means becomes smaller. “Moves farther away” is tempting, but the passage explains that the Moon changes how much of its lit half faces us, not its distance.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["During a full moon, Earth lies between the Sun and the Moon.", "A full cycle of the Moon's phases takes about two weeks.", "The Moon shines because sunlight reflects off its surface.", "The Sun always lights up half of the Moon."], "ci": 1, "exp": "The passage says the Moon travels around Earth “over about 29.5 days,” and the full moon comes “about two weeks into the cycle.” So the whole cycle takes about a month, not two weeks. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Flowerpot Knight</strong><br>Maya had sketched the scarecrow for three nights straight: a knight in cardboard armor, holding a shield painted with the school's eagle. When she unrolled the drawing at the garden club meeting, Jordan frowned.<br><br>“It's cool,” he said slowly, “but the contest rules say we can only use recycled materials from the garden shed. Cardboard armor won't survive the first rain.”<br><br>Maya felt her cheeks burn. “So you want to make a boring one with an old shirt and some straw?”<br><br>“I didn't say boring.” Jordan dragged a rusty watering can and a stack of cracked flowerpots out of the shed. “What if the knight's helmet is this can, and the armor is flowerpots strung together? It would still be a knight—just one that can handle the weather.”<br><br>Maya studied the pile, skeptical at first. Then she noticed how the clay pots overlapped like the metal plates on a real suit of armor. She picked up a marker and began redrawing her sketch.<br><br>Two weeks later, the judges awarded the Flowerpot Knight first place and praised its clever design. When a reporter from the school newspaper asked whose idea it had been, Maya and Jordan answered at exactly the same moment: “Ours.”", "stem": "According to the story, what did Jordan suggest using for the knight's helmet?", "opts": ["a cardboard box", "a cracked clay flowerpot", "a rusty watering can", "an old shirt stuffed with straw"], "ci": 2, "exp": "Jordan says, “What if the knight's helmet is this can, and the armor is flowerpots strung together?” — and the can is the “rusty watering can” he pulled from the shed. The flowerpots became the armor, not the helmet.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"passage": "<strong>The Night the City Burned</strong><br>On the evening of October 8, 1871, eleven-year-old Thomas Harper stood on the back steps of his family's boardinghouse on Chicago's North Side and watched an orange glow rise in the sky to the southwest. It had barely rained for weeks, and the city's wooden sidewalks and shingled roofs were as dry as kindling. By midnight, a fierce wind was hurling burning embers across the Chicago River, and the fire was racing toward the heart of the city.<br><br>“Wake the boarders!” his mother shouted. Thomas dashed from room to room, pounding on doors, while his father loaded quilts and the family Bible into a borrowed wagon. Dense smoke stung his eyes as they joined the crowds streaming north toward the lake. They spent the next day huddled on the sandy shore, watching ash drift down like dark snow.<br><br>When rain finally fell late on October 9, the flames died out. Much of the city lay in ruins. Yet within weeks, Thomas watched carpenters and masons begin to restore the neighborhood, this time using brick and stone wherever they could. “We'll build it stronger,” his father said, and Thomas believed him.", "stem": "Which event happened right after Thomas's family joined the crowds heading north toward the lake?", "opts": ["They spent the next day huddled on the sandy shore.", "Thomas pounded on the boarders' doors.", "Carpenters and masons began rebuilding the neighborhood.", "His father loaded quilts into a borrowed wagon."], "ci": 0, "exp": "The story says they “joined the crowds streaming north toward the lake,” and then, “They spent the next day huddled on the sandy shore.” Waking the boarders and loading the wagon happened before they left, and the rebuilding happened weeks later.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Night the City Burned</strong><br>On the evening of October 8, 1871, eleven-year-old Thomas Harper stood on the back steps of his family's boardinghouse on Chicago's North Side and watched an orange glow rise in the sky to the southwest. It had barely rained for weeks, and the city's wooden sidewalks and shingled roofs were as dry as kindling. By midnight, a fierce wind was hurling burning embers across the Chicago River, and the fire was racing toward the heart of the city.<br><br>“Wake the boarders!” his mother shouted. Thomas dashed from room to room, pounding on doors, while his father loaded quilts and the family Bible into a borrowed wagon. Dense smoke stung his eyes as they joined the crowds streaming north toward the lake. They spent the next day huddled on the sandy shore, watching ash drift down like dark snow.<br><br>When rain finally fell late on October 9, the flames died out. Much of the city lay in ruins. Yet within weeks, Thomas watched carpenters and masons begin to restore the neighborhood, this time using brick and stone wherever they could. “We'll build it stronger,” his father said, and Thomas believed him.", "stem": "Why did the builders most likely use brick and stone “wherever they could” when they rebuilt the neighborhood?", "opts": ["The city had run out of carpenters who knew how to build with wood.", "Brick and stone were much cheaper than wood after the fire.", "Brick and stone buildings could be finished more quickly than wooden ones.", "They wanted buildings that would be less likely to burn in another fire."], "ci": 3, "exp": "The fire spread so fast because the city's “wooden sidewalks and shingled roofs were as dry as kindling.” Building with brick and stone, and the father's words “We'll build it stronger,” suggest they wanted safer, fire-resistant buildings. The passage says nothing about cost or speed.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Moon Diary</strong><br>The first night, the sky holds only stars—<br>no Moon at all, just darkness, deep and wide.<br>I search above the rooftops, but it hides,<br>a shy coin tucked inside a velvet purse.<br><br>Within a week, a silver fingernail<br>hooks the horizon where the tall pines lean.<br>Each evening it grows bolder, rounder, brighter,<br>a lantern filling slowly from within.<br><br>Then comes the night it floods the field with light;<br>each fence post lays a shadow on the snow.<br>I could read my diary by its glow.<br>I write: <i>Tonight the whole round face looked in.</i><br><br>But fullness never lingers. Night by night<br>it thins and slips back into dark again.<br>I close my book. I am not sad. I know<br>the Moon will keep its promise. It always has.", "stem": "Read these lines: “But fullness never <b>lingers</b>. Night by night / it thins and slips back into dark again.” What does <i>lingers</i> mean?", "opts": ["grows larger", "returns quickly", "stays for a long time", "shines very brightly"], "ci": 2, "exp": "The next line says the Moon “thins and slips back into dark,” so the full Moon does not stay. <i>Lingers</i> means stays for a long time. “Returns quickly” is about coming back, not staying.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>Why the Ocean Has Tides</strong><br>Along most coastlines, the ocean creeps up the beach and then slowly retreats about twice each day. These tides are caused mainly by the Moon. Although the Moon is about 239,000 miles away, its gravity pulls on everything on Earth, including the oceans. Water on the side of Earth nearest the Moon is pulled toward it and forms a bulge. A second bulge forms on the opposite side of the planet, where the Moon&rsquo;s pull is weakest and the water is, in a sense, left behind. As Earth spins, a coastline passes through both bulges, so it experiences two high tides and two low tides in a little more than a day.<br><br>The Sun influences tides too, but because it is so much farther away, its effect is less than half as strong as the Moon&rsquo;s. When the Sun, Moon, and Earth line up during a new or full moon, their pulls combine to produce especially high and low &ldquo;spring&rdquo; tides, which have nothing to do with the season. When the Sun and Moon pull at right angles, gentler &ldquo;neap&rdquo; tides occur. Fishermen, ship captains, and even tide-pool explorers consult tide tables so they are not caught off guard by the rising water.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The Sun has a stronger effect on tides than the Moon because the Sun is so large.", "Neap tides happen when the Sun and Moon pull at right angles.", "Most coastlines have two high tides in a little more than a day.", "A bulge of water forms on the side of Earth nearest the Moon."], "ci": 0, "exp": "The passage says the Sun's effect \"is less than half as strong as the Moon's\" because the Sun is \"so much farther away.\" The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Island of Hope</strong><br>The ferry bumped against the dock, and eleven-year-old Sofia Russo gripped her little brother&rsquo;s hand. After twelve days crossing the Atlantic in the crowded lower deck of a steamship, the family had finally reached Ellis Island in New York Harbor. It was the spring of 1907. Papa had sailed to America a year earlier, and his letters had promised that a new life waited beyond the inspection hall.<br><br>Inside the enormous Registry Room, thousands of voices echoed in dozens of languages. Sofia had heard rumors on the ship: doctors watched newcomers climb the long staircase, and anyone who stumbled or coughed might be marked with chalk and held for more tests. She straightened her shoulders and climbed steadily, though her knees trembled.<br><br>At the top, a doctor peered at her eyes and waved her on. An inspector asked Mama a series of questions through an interpreter, and the answers seemed to reveal nothing troubling. Hours later, the family hurried down the &ldquo;Stairs of Separation&rdquo; toward the exit for those staying in New York City. Behind the railing stood a thin man in a gray cap, waving his hat with both hands. After a year of hardship and waiting, Sofia finally saw her father again.", "stem": "Sofia \"climbed <b>steadily</b>.\" Which word means the <b>OPPOSITE</b> of <b>steadily</b> as it is used in the passage?", "opts": ["shakily", "quickly", "quietly", "evenly"], "ci": 0, "exp": "<i>Steadily</i> means in a firm, even way. Its opposite is <i>shakily</i>. <i>Evenly</i> means almost the same as <i>steadily</i>, so it is a synonym.", "tag": "Antonym", "tagcolor": "#185FA5"}, {"passage": "<strong>Island of Hope</strong><br>The ferry bumped against the dock, and eleven-year-old Sofia Russo gripped her little brother&rsquo;s hand. After twelve days crossing the Atlantic in the crowded lower deck of a steamship, the family had finally reached Ellis Island in New York Harbor. It was the spring of 1907. Papa had sailed to America a year earlier, and his letters had promised that a new life waited beyond the inspection hall.<br><br>Inside the enormous Registry Room, thousands of voices echoed in dozens of languages. Sofia had heard rumors on the ship: doctors watched newcomers climb the long staircase, and anyone who stumbled or coughed might be marked with chalk and held for more tests. She straightened her shoulders and climbed steadily, though her knees trembled.<br><br>At the top, a doctor peered at her eyes and waved her on. An inspector asked Mama a series of questions through an interpreter, and the answers seemed to reveal nothing troubling. Hours later, the family hurried down the &ldquo;Stairs of Separation&rdquo; toward the exit for those staying in New York City. Behind the railing stood a thin man in a gray cap, waving his hat with both hands. After a year of hardship and waiting, Sofia finally saw her father again.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Doctors watched newcomers as they climbed the long staircase.", "An interpreter helped Mama answer the inspector's questions.", "Sofia's father crossed the Atlantic on the same ship as his family.", "The Registry Room was filled with people speaking many languages."], "ci": 2, "exp": "The passage says, \"Papa had sailed to America a year earlier,\" so he was not on the same ship. The other three statements match details in the second and third paragraphs.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Setting Aside Yellowstone</strong><br>For decades, trappers returning from the remote northern Rockies told stories that most Americans dismissed as tall tales: rivers that boiled, mud that bubbled like porridge, and fountains of steam that erupted on schedule. In 1870, a group of explorers from Montana Territory set out to test those claims, and what they found convinced them that the rumors had been, if anything, too modest. A year later, the federal government sent the geologist Ferdinand Hayden to survey the region scientifically. Hayden brought along two artists who would prove essential to his mission: the photographer William Henry Jackson and the painter Thomas Moran. Their pictures made the region's wonders evident to lawmakers who would never travel there themselves. Members of Congress, many of whom had doubted the written reports, studied Jackson's photographs and Moran's vivid watercolors of the canyon and the hot springs. Persuaded that such a landscape should not be sold off to private owners, Congress passed a bill protecting more than two million acres. On March 1, 1872, President Ulysses S. Grant signed it, creating Yellowstone as the world's first national park. The idea spread steadily, and today more than one hundred nations protect land in national parks.", "stem": "According to the passage, whom did Hayden bring with him on his survey?", "opts": ["members of Congress", "explorers from Montana Territory", "a photographer and a painter", "trappers from the northern Rockies"], "ci": 2, "exp": "The passage says Hayden &ldquo;brought along two artists&rdquo;: &ldquo;the photographer William Henry Jackson and the painter Thomas Moran.&rdquo; The Montana explorers made their trip a year earlier, on their own.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"passage": "<strong>Setting Aside Yellowstone</strong><br>For decades, trappers returning from the remote northern Rockies told stories that most Americans dismissed as tall tales: rivers that boiled, mud that bubbled like porridge, and fountains of steam that erupted on schedule. In 1870, a group of explorers from Montana Territory set out to test those claims, and what they found convinced them that the rumors had been, if anything, too modest. A year later, the federal government sent the geologist Ferdinand Hayden to survey the region scientifically. Hayden brought along two artists who would prove essential to his mission: the photographer William Henry Jackson and the painter Thomas Moran. Their pictures made the region's wonders evident to lawmakers who would never travel there themselves. Members of Congress, many of whom had doubted the written reports, studied Jackson's photographs and Moran's vivid watercolors of the canyon and the hot springs. Persuaded that such a landscape should not be sold off to private owners, Congress passed a bill protecting more than two million acres. On March 1, 1872, President Ulysses S. Grant signed it, creating Yellowstone as the world's first national park. The idea spread steadily, and today more than one hundred nations protect land in national parks.", "stem": "In the first sentence, the stories were &ldquo;dismissed as tall tales.&rdquo; What does <b>dismissed</b> mean as it is used in the passage?", "opts": ["treated as not worth believing", "written down carefully", "repeated to new listeners", "sent away from a meeting"], "ci": 0, "exp": "Most Americans thought the stories were &ldquo;tall tales,&rdquo; so they did not believe them. &ldquo;Sent away from a meeting&rdquo; is another real meaning of <i>dismissed</i>, but it does not fit stories.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>Setting Aside Yellowstone</strong><br>For decades, trappers returning from the remote northern Rockies told stories that most Americans dismissed as tall tales: rivers that boiled, mud that bubbled like porridge, and fountains of steam that erupted on schedule. In 1870, a group of explorers from Montana Territory set out to test those claims, and what they found convinced them that the rumors had been, if anything, too modest. A year later, the federal government sent the geologist Ferdinand Hayden to survey the region scientifically. Hayden brought along two artists who would prove essential to his mission: the photographer William Henry Jackson and the painter Thomas Moran. Their pictures made the region's wonders evident to lawmakers who would never travel there themselves. Members of Congress, many of whom had doubted the written reports, studied Jackson's photographs and Moran's vivid watercolors of the canyon and the hot springs. Persuaded that such a landscape should not be sold off to private owners, Congress passed a bill protecting more than two million acres. On March 1, 1872, President Ulysses S. Grant signed it, creating Yellowstone as the world's first national park. The idea spread steadily, and today more than one hundred nations protect land in national parks.", "stem": "Which event happened right after the explorers from Montana Territory made their trip in 1870?", "opts": ["President Grant signed the bill creating the park.", "Congress studied photographs and watercolors of the region.", "The government sent Ferdinand Hayden to survey the region.", "Trappers began telling stories about boiling rivers."], "ci": 2, "exp": "&ldquo;A year later, the federal government sent the geologist Ferdinand Hayden.&rdquo; The trappers&rsquo; stories came before 1870, and Congress studied the pictures and passed the bill only after Hayden&rsquo;s survey.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Twine Line</strong><br>January 12, 1888, began so mildly at the Nebraska schoolhouse that several children had come to class without coats. Lucy Whitaker, eleven, was reciting her multiplication tables when the window beside her darkened as though someone had drawn a curtain. Within minutes, a roaring wall of snow struck the building, and the temperature plunged. Miss Freeman, the young teacher, peered outside and could not see the fence twenty feet away. The coal bucket was nearly empty.<br>&ldquo;We cannot stay here through the night,&rdquo; she said quietly, so that the youngest pupils would not hear any fear in her voice. &ldquo;The Johnson farmhouse is a quarter mile north. We are going to walk there together.&rdquo;<br>She unwound a ball of twine from her sewing basket and tied it around each child's wrist, binding all thirteen pupils into a single line. Lucy, as the oldest girl, was placed at the very end and told to call out if anyone stumbled. Bent nearly double against the gale, the children trudged forward, unable to navigate by sight. At last Miss Freeman's outstretched hand struck the corner of a woodshed, and moments later the Johnsons' door swung open into warm yellow light.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Miss Freeman tied twine around each child&rsquo;s wrist.", "Lucy was placed at the front of the line to lead the way.", "The coal bucket was nearly empty.", "Some children came to school without coats."], "ci": 1, "exp": "Lucy &ldquo;was placed at the very end and told to call out if anyone stumbled.&rdquo; Miss Freeman led at the front. The other three statements match the story.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Twine Line</strong><br>January 12, 1888, began so mildly at the Nebraska schoolhouse that several children had come to class without coats. Lucy Whitaker, eleven, was reciting her multiplication tables when the window beside her darkened as though someone had drawn a curtain. Within minutes, a roaring wall of snow struck the building, and the temperature plunged. Miss Freeman, the young teacher, peered outside and could not see the fence twenty feet away. The coal bucket was nearly empty.<br>&ldquo;We cannot stay here through the night,&rdquo; she said quietly, so that the youngest pupils would not hear any fear in her voice. &ldquo;The Johnson farmhouse is a quarter mile north. We are going to walk there together.&rdquo;<br>She unwound a ball of twine from her sewing basket and tied it around each child's wrist, binding all thirteen pupils into a single line. Lucy, as the oldest girl, was placed at the very end and told to call out if anyone stumbled. Bent nearly double against the gale, the children trudged forward, unable to navigate by sight. At last Miss Freeman's outstretched hand struck the corner of a woodshed, and moments later the Johnsons' door swung open into warm yellow light.", "stem": "Why does Miss Freeman most likely speak quietly when she says they cannot stay?", "opts": ["She does not want to frighten the youngest pupils.", "She is not sure the plan will work, so she whispers it only to Lucy.", "She does not want the Johnsons to hear her.", "She is too cold to speak loudly."], "ci": 0, "exp": "The story says she spoke quietly &ldquo;so that the youngest pupils would not hear any fear in her voice.&rdquo; She is calm and gives the plan to the whole class, not just to Lucy.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Reef Song</strong><br>Beneath the restless silver tide<br>a city grows, but not of stone&mdash;<br>each tower raised by builders small<br>who leave behind a cup of bone.<br><br>No hammer rings, no foreman calls,<br>yet year by year the ramparts climb;<br>the smallest hands on all the earth<br>are bricklayers of deepest time.<br><br>The parrotfish and drifting ray<br>go wandering through its painted halls,<br>and when the water warms too long<br>a ghostly hush across it falls.<br><br>So guard the sea's slow architects,<br>whose patient work we barely see;<br>a thousand years of tiny lives<br>can vanish in a century.", "stem": "In the line &ldquo;No hammer rings, no foreman calls,&rdquo; what does <b>calls</b> mean?", "opts": ["telephones someone", "shouts out orders or words", "pays a short visit", "decides the result of a game"], "ci": 1, "exp": "A foreman is the boss of a building crew who shouts directions. The poem says the reef is built silently, so no one <i>calls</i> out. The other choices are real meanings of <i>calls</i> that do not fit this line.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close.", "stem": "Which event happened right after workers finished the first telegraph line across the continent?", "opts": ["Mail began reaching Sacramento in about ten days.", "A rider left St. Joseph carrying a pouch of letters.", "Riders began switching horses at relay stations.", "The Pony Express announced that it would close."], "ci": 3, "exp": "The passage says that on October 24, 1861, the telegraph line was finished, and &ldquo;Two days later, the Pony Express announced that it would close.&rdquo; The rider leaving St. Joseph happened first, in April 1860.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Each rider carried the mail along the entire 1,900-mile route.", "Riders switched to fresh horses at relay stations.", "The route crossed prairies, deserts, and mountains.", "The service closed soon after the telegraph line was finished."], "ci": 0, "exp": "The passage says &ldquo;a new rider took over after seventy-five miles or more,&rdquo; so no single rider carried the mail the whole way. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close.", "stem": "As it is used in the first paragraph, what does the word &ldquo;dramatically&rdquo; mean?", "opts": ["in an exciting, theater-like way", "slowly and carefully", "by a very large amount", "for only a short while"], "ci": 2, "exp": "The company planned to turn a trip of &ldquo;more than three weeks&rdquo; into about ten days, which is a very large change. &ldquo;In an exciting, theater-like way&rdquo; is another meaning of <i>dramatic</i>, but it does not fit here.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>Engineers of the Stream</strong><br>Few animals reshape their surroundings as thoroughly as the North American beaver. Using teeth that never stop growing, a beaver can bring down a small tree in a single night. It drags branches, stones, and mud into a stream and weaves them into a dam. Because the dam slows the current, water spreads out behind it and forms a pond deep enough that it rarely freezes to the bottom, so the beaver can reach its underwater store of branches all winter.<br><br>The pond's effects extend far beyond the beaver itself. Slower water drops the soil it was carrying, so the stream below the dam runs clearer. Ducks, frogs, and insects settle in the new wetland, and fish shelter in its cool, deep pools. During droughts, beaver ponds hold water that would otherwise rush away, keeping nearby meadows green while the surrounding land turns brown.<br><br>Not everyone welcomes these builders, however; a dam can flood a road or a farmer's field. Some landowners now install pipes that let water flow through a dam, keeping the pond at a manageable level without driving the beavers away.", "stem": "Which word means the <b>OPPOSITE</b> of &ldquo;thoroughly&rdquo; as it is used in the passage?", "opts": ["carefully", "partly", "quickly", "completely"], "ci": 1, "exp": "<i>Thoroughly</i> means completely, in every way. Its opposite is <i>partly</i>. <i>Completely</i> is a synonym, so it is not the opposite.", "tag": "Antonym", "tagcolor": "#185FA5"}, {"passage": "<strong>The Entrance</strong><br>Leo had practiced the cello part of the overture so many times that he could hear it in his sleep, yet when Ms. Ferraro raised her baton at the first full rehearsal, his hands felt like borrowed gloves. The violins began, bright and quick, and Leo counted under his breath. Four measures. Eight. On the twelfth, he was supposed to come in with the low melody, but he hesitated half a beat, and the cellos beside him surged ahead without him.<br><br>Ms. Ferraro tapped her stand. &ldquo;Again, from letter B.&rdquo;<br><br>Leo felt his face burn. &ldquo;Sorry,&rdquo; he muttered. &ldquo;I lost count.&rdquo;<br><br>&ldquo;Counting is only half of it,&rdquo; she said, not unkindly. &ldquo;Watch my left hand. I'll look at you right before your entrance.&rdquo;<br><br>On the second try, Leo kept one eye on the page and one on her hand. When her glance found him, he drew the bow across the strings, and the melody rose, deep and vivid, beneath the violins. Beside him, Priya nodded once without missing a note.<br><br>After rehearsal, Leo stayed in his seat and practiced the entrance again, this time with his eyes closed, picturing that small, steady glance.", "stem": "Which sentence best states a theme of the story?", "
