<script>
var TITLE = "[Sion] SAT Grammar";
var QUIZ_KEY = "satgrammar_20";
var INSTRUCTION = "Read each text and choose the answer that best completes or revises it.";
var TODAY_STR = "20261007";
var RAW_QUESTIONS = [{"context": "The monarch butterflies that fly from Canada to Mexico each fall do not complete the return trip to Canada themselves. ______ they lay eggs along the way north in the spring, and it is their descendants, several generations later, that finally reach Canada the following summer.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["For example,", "Similarly,", "Instead,", "Thus,"], "ci": 2, "exp": "The first sentence says the butterflies do not finish the trip themselves, and the second tells what happens in place of that: their descendants finish it. &ldquo;Instead&rdquo; signals that replacement. &ldquo;For example&rdquo; and &ldquo;Similarly&rdquo; do not fit, and &ldquo;Thus&rdquo; wrongly presents the egg laying as a result of the first sentence.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "After examining hundreds of tree rings, the researchers concluded that the region&rsquo;s worst drought had occurred in the 1500s and that ______ effects lasted nearly two decades.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["it&rsquo;s", "their", "they&rsquo;re", "its"], "ci": 3, "exp": "The pronoun refers to the singular noun &ldquo;drought&rdquo; and shows possession (the drought&rsquo;s effects), so &ldquo;its&rdquo; is correct. &ldquo;It&rsquo;s&rdquo; means &ldquo;it is,&rdquo; and &ldquo;their&rdquo; is plural.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Poet Gwendolyn Brooks, who in 1950 became the first Black author to win the Pulitzer ______ much of her work on the everyday lives of residents of Chicago&rsquo;s South Side.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Prize focused", "Prize, focused", "Prize, and focused", "Prize; focused"], "ci": 1, "exp": "The clause &ldquo;who in 1950&hellip;Pulitzer Prize&rdquo; is a nonessential element that interrupts the subject &ldquo;Gwendolyn Brooks&rdquo; and the verb &ldquo;focused.&rdquo; It began with a comma, so it must end with a comma. A semicolon or &ldquo;and&rdquo; would separate the subject from its verb.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Neither the hikers nor their guide ______ aware that the trail had been washed out by the previous night&rsquo;s storm.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["being", "were", "was", "are"], "ci": 2, "exp": "With &ldquo;neither&hellip;nor,&rdquo; the verb agrees with the nearer subject, the singular &ldquo;guide,&rdquo; so a singular verb is needed. The past tense matches &ldquo;had been washed out,&rdquo; so &ldquo;was&rdquo; is correct. &ldquo;Were&rdquo; agrees with &ldquo;hikers,&rdquo; &ldquo;are&rdquo; is the wrong tense, and &ldquo;being&rdquo; leaves the sentence without a main verb.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Designed to withstand earthquakes, ______ survived the 1923 Great Kant&omacr; earthquake with only minor damage.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Frank Lloyd Wright&rsquo;s Imperial Hotel in Tokyo", "Tokyo was home to Frank Lloyd Wright&rsquo;s Imperial Hotel, which", "the earthquake left Frank Lloyd Wright&rsquo;s Imperial Hotel in Tokyo, which", "Frank Lloyd Wright designed the Imperial Hotel in Tokyo, which"], "ci": 0, "exp": "The introductory phrase &ldquo;Designed to withstand earthquakes&rdquo; must be followed immediately by the thing that was designed: the Imperial Hotel. The other choices place Wright, the earthquake, or Tokyo there, creating dangling modifiers.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Many people assume that cacti store water in hollow chambers. ______ the water is held within the spongy tissue of the plant&rsquo;s stem, which swells after rain and shrinks during drought.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Additionally,", "In fact,", "Therefore,", "Likewise,"], "ci": 1, "exp": "The second sentence corrects a common but mistaken assumption. &ldquo;In fact&rdquo; introduces the accurate information that contradicts what people assume. The other choices suggest similarity, consequence, or simple addition.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "The city council debated whether the new library should be built downtown, where more residents could walk to it, or near the highway, where parking would be ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["more easier to provide.", "more easy to provide.", "easier to provide.", "easiest to provide."], "ci": 2, "exp": "Two locations are being compared, so the comparative form is needed. &ldquo;Easy&rdquo; forms its comparative with &ldquo;-er&rdquo;: &ldquo;easier.&rdquo; &ldquo;More easier&rdquo; is a double comparative, and &ldquo;easiest&rdquo; is for three or more.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "The collection of letters exchanged between Abigail and John Adams during the American Revolution ______ historians a rare view of daily life on the home front.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["are offering", "offers", "offer", "have offered"], "ci": 1, "exp": "The subject is the singular noun &ldquo;collection,&rdquo; not &ldquo;letters&rdquo; or &ldquo;Abigail and John Adams,&rdquo; which are inside prepositional phrases. A singular subject needs the singular verb &ldquo;offers.&rdquo;", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Marie Curie was the first person to win Nobel Prizes in two different sciences: physics in 1903 and chemistry in 1911. ______ she founded research institutes in Paris and Warsaw that continue to train scientists today.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "Moreover,", "Consequently,", "In contrast,"], "ci": 1, "exp": "The second sentence adds another accomplishment to the first, so &ldquo;Moreover&rdquo; is the logical transition. Nothing in the text contrasts with the prizes, and founding institutes was not a direct consequence of winning them.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "While researching a topic, a student has taken the following notes:<ul style=\"margin:8px 0 0 18px;padding:0;\"><li>Ada Lovelace (1815&ndash;1852) was an English mathematician.</li><li>Charles Babbage designed a mechanical computer called the Analytical Engine.</li><li>Lovelace wrote notes explaining how the machine could calculate Bernoulli numbers.</li><li>Her notes are often considered the first published computer program.</li></ul>", "stem": "The student wants to present Lovelace&rsquo;s achievement to an audience unfamiliar with Babbage. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Ada Lovelace&rsquo;s notes on the Analytical Engine are often considered the first published computer program.", "Charles Babbage designed the Analytical Engine, and Ada Lovelace lived from 1815 to 1852.", "Ada Lovelace was an English mathematician who lived from 1815 to 1852.", "English mathematician Ada Lovelace wrote notes explaining how Charles Babbage&rsquo;s Analytical Engine, a mechanical computer, could calculate Bernoulli numbers&mdash;notes often considered the first published computer program."], "ci": 3, "exp": "An audience unfamiliar with Babbage needs to know who he was and what the Analytical Engine was. Only the correct choice identifies Babbage&rsquo;s machine as &ldquo;a mechanical computer&rdquo; while also stating Lovelace&rsquo;s achievement.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "While researching a topic, a student has taken the following notes:<ul style=\"margin:8px 0 0 18px;padding:0;\"><li>In 1955, Rosa Parks refused to give up her bus seat in Montgomery, Alabama.</li><li>Her arrest sparked the Montgomery Bus Boycott.</li><li>The boycott lasted 381 days.</li><li>In 1956, the U.S. Supreme Court ruled that segregation on public buses was unconstitutional.</li></ul>", "stem": "The student wants to explain the outcome of the Montgomery Bus Boycott. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Rosa Parks&rsquo;s arrest sparked the Montgomery Bus Boycott in 1955.", "In 1955, Rosa Parks refused to give up her bus seat in Montgomery, Alabama.", "The Montgomery Bus Boycott, which lasted 381 days, ended after the U.S. Supreme Court ruled in 1956 that segregation on public buses was unconstitutional.", "The Montgomery Bus Boycott lasted 381 days."], "ci": 2, "exp": "The goal is the boycott&rsquo;s outcome. Only the correct choice states what the boycott led to: the 1956 Supreme Court ruling ending bus segregation. The other choices describe its cause or length.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "While researching a topic, a student has taken the following notes:<ul style=\"margin:8px 0 0 18px;padding:0;\"><li>The Hoover Dam was completed in 1936 on the Colorado River.</li><li>It is 726 feet tall.</li><li>It created Lake Mead, the largest reservoir in the United States by capacity.</li><li>Lake Mead supplies water to about 25 million people in Nevada, Arizona, California, and Mexico.</li></ul>", "stem": "The student wants to emphasize the importance of the Hoover Dam to people today. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Hoover Dam, completed in 1936, is 726 feet tall.", "By creating Lake Mead, the Hoover Dam helps supply water to about 25 million people in Nevada, Arizona, California, and Mexico.", "The Hoover Dam was built on the Colorado River and completed in 1936.", "Lake Mead is the largest reservoir in the United States by capacity."], "ci": 1, "exp": "The goal is to emphasize the dam&rsquo;s importance to people today. Only the choice about supplying water to about 25 million people connects the dam to present-day human needs. The others give height, dates, or size without showing importance to people.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "In 1928, Scottish bacteriologist Alexander Fleming returned from vacation to find that a mold had contaminated one of his culture plates and killed the surrounding ______ that observation eventually led to penicillin, the first widely used antibiotic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["bacteria;", "bacteria", "bacteria,", "bacteria, and,"], "ci": 0, "exp": "Both &ldquo;Alexander Fleming returned&hellip;bacteria&rdquo; and &ldquo;that observation eventually led to penicillin&rdquo; are independent clauses. A semicolon can join them; a comma alone creates a comma splice, no punctuation creates a run-on, and &ldquo;and,&rdquo; with a comma after it is not standard.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "The Andean condor has one of the largest wingspans of any living ______ up to about 10.5 feet, it allows the bird to soar for hours on rising currents of warm air without flapping.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["bird, it measures", "bird, measuring", "bird measuring", "bird. Measuring"], "ci": 3, "exp": "&ldquo;Measuring up to about 10.5 feet, it allows the bird to soar&hellip;&rdquo; is a complete sentence, so it must be separated from the first independent clause with a period. A comma would create a comma splice, and no punctuation would create a run-on.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Historian Annette Gordon-Reed&rsquo;s 2008 book <i>The Hemingses of Monticello</i> traces three generations of an enslaved ______ by combining plantation records, letters, and oral histories, it reconstructs lives that earlier historians had largely ignored.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["family,", "family that", "family", "family;"], "ci": 3, "exp": "Both &ldquo;Historian Annette Gordon-Reed&rsquo;s 2008 book&hellip;traces three generations of an enslaved family&rdquo; and &ldquo;by combining plantation records, letters, and oral histories, it reconstructs lives&hellip;&rdquo; are independent clauses, so a semicolon is needed between them. A comma alone creates a comma splice, no punctuation creates a run-on, and &ldquo;that&rdquo; turns the second clause into a confusing, ungrammatical modifier.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Ecologists studying the Florida Everglades have identified one species as especially ______ the American alligator, whose &ldquo;gator holes&rdquo; hold water during the dry season and shelter fish, turtles, and birds.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["important, and", "important", "important;", "important:"], "ci": 3, "exp": "The material after the blank explains which species is important, so a colon is correct: it introduces an explanation of what came before. A semicolon requires an independent clause after it, and &ldquo;and&rdquo; would wrongly suggest a second, separate idea.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Many deep-sea creatures produce their own light through bioluminescence. The anglerfish, for ______ dangles a glowing lure in front of its mouth to attract curious prey in the darkness.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["example:", "example;", "example", "example,"], "ci": 3, "exp": "&ldquo;For example&rdquo; is a parenthetical phrase inserted between the subject &ldquo;The anglerfish&rdquo; and the verb &ldquo;dangles.&rdquo; It began with a comma, so it must be closed with a comma.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Early computers filled entire rooms and required teams of operators. The invention of the integrated circuit in the late 1950s allowed thousands of components to fit on a single chip. ______ by the 1970s, engineers could build a working computer small enough to sit on a desk.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["As a result,", "However,", "For instance,", "Similarly,"], "ci": 0, "exp": "Smaller desktop computers were a consequence of the integrated circuit, which packed many components onto one chip. &ldquo;As a result&rdquo; signals this cause-and-effect relationship. &ldquo;However&rdquo; signals contrast, &ldquo;For instance&rdquo; an example, and &ldquo;Similarly&rdquo; a comparison.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "While researching a topic, a student has taken the following notes:<ul style=\"margin:8px 0 0 18px;padding:0;\"><li>Emperor penguins and Ad&eacute;lie penguins both live in Antarctica.</li><li>Emperor penguins can grow to about 45 inches tall.</li><li>Ad&eacute;lie penguins grow to about 28 inches tall.</li><li>Emperor penguins breed during the Antarctic winter; Ad&eacute;lie penguins breed during the summer.</li></ul>", "stem": "The student wants to contrast the breeding seasons of the two species. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["While emperor penguins breed during the harsh Antarctic winter, Ad&eacute;lie penguins breed during the summer.", "Emperor penguins, at about 45 inches, are much taller than Ad&eacute;lie penguins, at about 28 inches.", "Emperor penguins and Ad&eacute;lie penguins both live in Antarctica.", "Emperor penguins breed during the Antarctic winter."], "ci": 0, "exp": "Only the correct choice contrasts the two species&rsquo; breeding seasons. One choice shows a similarity, one contrasts height rather than breeding, and one describes only a single species.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "The Great Wall of China was not built all at once. Its many sections were constructed by different ______ over roughly two thousand years, often using whatever local materials were available, from rammed earth to fired brick.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["dynasties;", "dynasties", "dynasties:", "dynasties,"], "ci": 1, "exp": "&ldquo;Over roughly two thousand years&rdquo; is a prepositional phrase that belongs to the main clause, so no punctuation should separate it from &ldquo;dynasties.&rdquo; A semicolon or colon would also leave a fragment after it.", "tag": "Boundaries", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
