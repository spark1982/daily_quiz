<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261007";
var RAW_QUESTIONS = [{"stem": "A manager at Fairfield Manufacturing uses a monthly report comparing each department&rsquo;s actual spending to its budget to decide where to cut costs. This report is an example of managerial accounting because it", "opts": ["is required by law and published for outside investors", "reports only on the company&rsquo;s past cash sales", "is prepared for internal decision-makers and focuses on planning and control", "must follow the exact format used on the company&rsquo;s tax return"], "ci": 2, "exp": "Managerial accounting provides information to people inside the organization to help them plan, control operations, and make decisions. Financial accounting, by contrast, prepares reports for outside users such as investors."}, {"stem": "A client at Oakmont Financial calls her advisor, upset that a transfer between her accounts has not appeared. What is the advisor&rsquo;s most important responsibility in this situation?", "opts": ["Promise the money will appear in an hour without checking", "Tell the client the problem is the bank&rsquo;s fault and end the call", "Ask the client to call back next week when things are less busy", "Listen to the client&rsquo;s concern, investigate the status of the transfer, and follow up with accurate information by an agreed time"], "ci": 3, "exp": "Finance professionals are responsible for responsive, accurate, and honest client service. Making promises without facts, blaming others, or delaying all damage trust."}, {"stem": "A bank&rsquo;s compliance software flags the phrase &ldquo;guaranteed returns&rdquo; in every email, even when an employee writes, &ldquo;We never promise guaranteed returns.&rdquo; Which change would make the software&rsquo;s reasoning more contextual rather than purely symbolic?", "opts": ["Analyzing the meaning of the whole sentence and its surrounding text instead of matching keywords alone", "Adding more keywords to the list of flagged phrases", "Turning off the monitoring software completely", "Flagging every email that contains the word &ldquo;returns&rdquo;"], "ci": 0, "exp": "Symbolic reasoning follows fixed rules, such as matching exact words. Contextual reasoning considers the meaning and situation around those words, so it can tell a warning against promises apart from an actual promise."}, {"stem": "A credit card company uses software to search millions of transactions for unusual patterns, such as a card suddenly being used in three different countries in one hour. This is an example of", "opts": ["a marketing survey of customer satisfaction", "a paper audit performed once every ten years", "manual bookkeeping to record each sale by hand", "data mining to detect possible fraud"], "ci": 3, "exp": "Data mining uses software tools to discover hidden patterns and relationships in large data sets. Banks and card companies use it to flag transactions that do not fit a customer&rsquo;s normal behavior."}, {"stem": "A securities table lists the following for Westbrook Energy stock: 52-week high $64.20, 52-week low $41.75, dividend $1.80, closing price $60.00. What is the stock&rsquo;s dividend yield?", "opts": ["1.8%", "4.3%", "2.8%", "3.0%"], "ci": 3, "exp": "Dividend yield = annual dividend &divide; current price = $1.80 &divide; $60.00 = 0.03, or 3.0%. The 52-week high and low are not used in this calculation."}, {"stem": "The Federal Reserve announces that it is raising interest rates to slow the economy. How are financial markets most likely to respond?", "opts": ["Borrowing becomes cheaper, so businesses expand quickly.", "Financial markets are unaffected by economic conditions.", "Bond prices tend to rise because interest rates have increased.", "Bond prices tend to fall and borrowing becomes more expensive for businesses and consumers."], "ci": 3, "exp": "When interest rates rise, newly issued bonds pay more, so the prices of existing lower-rate bonds fall. Higher rates also make loans more expensive, which slows spending and investment."}, {"stem": "Harbor Bakery spent $4,000 last year on a marketing study that showed a new product would not sell. The owner is now deciding whether to launch a different product. How should the $4,000 be treated in this new decision?", "opts": ["As a sunk cost that should be ignored, because it cannot be recovered no matter what is decided", "As a differential cost that changes depending on the new choice", "As an indirect cost that should be divided among all future products", "As a direct cost that must be added to the price of the new product"], "ci": 0, "exp": "A sunk cost has already been spent and cannot be recovered, so it should not influence future decisions. Differential costs are costs that differ between the alternatives being considered."}, {"stem": "The accounts payable team at Brightwater Credit Union keeps paying some vendors late. Following the problem-solving process, what should the team do first?", "opts": ["Choose a solution and blame the employee who processed the last late payment", "Evaluate the results of a solution they have not chosen yet", "Immediately buy new accounting software", "Clearly define the problem and gather information about why payments are late"], "ci": 3, "exp": "The problem-solving process begins by identifying and defining the problem and collecting information. Only then should the team generate alternatives, choose a solution, carry it out, and evaluate the results."}, {"stem": "A regulation requires banks to report cash deposits over $10,000 to the government. A customer asks a teller to split a $14,000 cash deposit into two $7,000 deposits on different days so no report is filed. What should the teller do?", "opts": ["Accept the deposit and tell the customer how to avoid future reports", "Refuse, because the request tries to avoid the purpose of the law, and follow the bank&rsquo;s procedure for reporting suspicious activity", "Agree, because each separate deposit is technically under $10,000", "Agree, but only if the customer is a long-time client"], "ci": 1, "exp": "Complying with the spirit and intent of a law means not helping anyone get around its purpose. Breaking a deposit into smaller amounts to avoid reporting is itself illegal, so the teller should decline and follow reporting procedures."}, {"stem": "Leah deposits $5,000 in a savings account that earns 4% interest compounded once per year. If she makes no other deposits or withdrawals, how much will be in the account after 2 years?", "opts": ["$5,408.00", "$5,416.32", "$5,200.00", "$5,400.00"], "ci": 0, "exp": "Compound interest: $5,000 &times; 1.04 = $5,200 after year 1; $5,200 &times; 1.04 = $5,408 after year 2. $5,400 would be simple interest, which ignores interest earned on interest."}, {"stem": "After a series of hurricanes damages several orange-growing regions, the supply of orange juice drops sharply while demand stays the same. Prices for orange juice and related products rise across the country. This is an example of which cause of inflation?", "opts": ["Demand-pull inflation caused by too much demand chasing a reduced supply", "Cost savings caused by improved technology", "Deflation caused by falling consumer spending", "A budget surplus caused by higher tax collections"], "ci": 0, "exp": "When available supply falls but buyers still want the same amount, demand outpaces supply and pushes prices up. This pattern, in which demand exceeds what is available, is the demand-pull situation described. Deflation is a general decrease in prices."}, {"stem": "Priya, a tax preparer, feels overwhelmed during the busiest week of tax season. Which response is the healthiest example of stress management?", "opts": ["Prioritizing her tasks, taking short breaks, and asking her supervisor for help with the heaviest workload", "Skipping meals and sleep so she can work around the clock", "Ignoring all deadlines until the stress goes away", "Complaining to clients about how stressed she is"], "ci": 0, "exp": "Stress management involves recognizing stress and using healthy strategies such as prioritizing, resting, and seeking support. Skipping sleep, ignoring deadlines, and venting to clients make the problem worse."}, {"stem": "Jordan, a new analyst at Ridgeline Credit Union, is attending her first weekly staff meeting. The branch manager asks for updates on each team&rsquo;s loan applications. What is Jordan&rsquo;s most appropriate way to participate?", "opts": ["Read emails on her phone until it is her turn to speak.", "Use the time to raise a personal complaint about her desk location.", "Stay silent for the whole meeting so she does not interrupt senior employees.", "Give a brief, prepared update on her assigned applications and listen actively while others speak."], "ci": 3, "exp": "Effective meeting participants prepare relevant information, contribute concisely when it is their turn, and listen actively. Silence, off-topic complaints, and multitasking all reduce a meeting&rsquo;s value."}, {"stem": "Your supervisor at Northgate Credit Union asks you to write a one-page report on why the number of new members dropped last quarter. Which approach best fits a simple written report?", "opts": ["List every member&rsquo;s name and account number", "State the purpose, present the key facts and causes in a clear order, and end with a brief conclusion or recommendation", "Write several pages of personal opinions without data", "Use as much technical vocabulary as possible to sound impressive"], "ci": 1, "exp": "A simple written report is clear, organized, and focused on its purpose: it introduces the topic, presents relevant facts, and concludes. It should never expose confidential data or bury the main points."}, {"stem": "During a walk-through of a bank&rsquo;s back office, an operations supervisor notices a power cord stretched across a walkway, a blocked fire exit, and a stack of heavy file boxes on top of a tall cabinet. Which hazard should be corrected first?", "opts": ["The blocked fire exit, because it could prevent employees from escaping in an emergency", "None of them, because offices are not covered by safety regulations", "The heavy file boxes, because they make the office look messy", "The power cord, because it uses too much electricity"], "ci": 0, "exp": "All three are hazards, but a blocked emergency exit is a serious violation of workplace safety regulations and could cost lives in a fire. Offices are covered by safety regulations just like other workplaces."}, {"stem": "Marcus is meeting a wealthy client at Pinecrest Wealth Advisors to review her retirement portfolio. Which personal-appearance choice is most appropriate?", "opts": ["Wearing very flashy jewelry to show that he is successful", "Wearing clean, well-fitted business attire that matches the firm&rsquo;s professional dress standards", "Wearing whatever is most comfortable, since appearance does not affect trust", "Wearing a sports jersey to show he is friendly and relaxed"], "ci": 1, "exp": "In client-facing finance roles, a neat, professional appearance builds credibility and trust. Overly casual or flashy choices can distract the client or suggest a lack of professionalism."}, {"stem": "The board of Lakeview Mutual Insurance has set a governance objective to reduce the risk of conflicts of interest. How can an entry-level claims processor best support this objective?", "opts": ["Ask a coworker to approve the relative&rsquo;s claim without telling anyone.", "Assume governance objectives apply only to board members and executives.", "Handle a relative&rsquo;s claim quickly so the customer is not kept waiting.", "Disclose to a supervisor any claim filed by a relative or close friend and step away from handling it."], "ci": 3, "exp": "Governance objectives are achieved when employees at every level follow the policies behind them. Disclosing a potential conflict and stepping aside protects the company&rsquo;s integrity; the other choices hide or ignore the conflict."}, {"stem": "At Cedar Valley Bank, one document states, &ldquo;All customer complaints must be resolved fairly and recorded.&rdquo; Another document says, &ldquo;Step 1: Log the complaint in the CRM system within 24 hours. Step 2: Send a written acknowledgment.&rdquo; Which statement is accurate?", "opts": ["Both documents are policies because they were written by the bank.", "Both documents are procedures because they mention complaints.", "The first is a procedure and the second is a policy.", "The first is a policy, a general rule or principle; the second is a procedure, the specific steps for carrying it out."], "ci": 3, "exp": "Policies state broad guidelines or goals; procedures describe the specific, step-by-step methods employees use to follow those policies."}, {"stem": "Dante, a college student interested in a career in investment banking, wants to build professional relationships in finance. Which action is most effective?", "opts": ["Joining his school&rsquo;s finance club and attending local networking events hosted by professional associations", "Waiting until after graduation to meet anyone in the industry", "Sending the same message to hundreds of strangers asking for a job", "Only connecting with classmates who are not interested in finance"], "ci": 0, "exp": "Professional relationships grow through genuine, repeated contact with people in the field, such as through clubs, associations, and events. Mass messages and waiting too long are much less effective."}, {"stem": "Summit Bank collects data on deposits, loan payments, and customer service calls. Which activity best describes information management?", "opts": ["Organizing, storing, protecting, and distributing data so the right people can use it to make decisions", "Deleting old customer records as soon as each month ends", "Printing every report so that no information is stored electronically", "Collecting as much data as possible without deciding how it will be used"], "ci": 0, "exp": "Information management is the process of acquiring, organizing, safeguarding, and delivering information so that it supports decision-making. Simply collecting, deleting, or printing data does not manage it."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
