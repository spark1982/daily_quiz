<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}

.results-btns{display:flex;flex-direction:column;gap:9px;}

.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}

</style>

<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_20260904_v1";var ATT_KEY = "quiz_sionadvreading_12_att_20260904_v1";var RAW_QUESTIONS = [{"tag": "Words in Context", "tagcolor": "#7b61ff", "passage": "The critic's review was notably ______ in its treatment of the young playwright's debut, praising individual scenes while withholding judgment on the work as a whole until further plays had been staged.", "stem": "Which choice completes the text with the most logical and precise word?", "opts": ["effusive", "equivocal", "scathing", "dismissive"], "ci": 1, "exp": "The review praises individual scenes but deliberately withholds an overall judgment, which precisely matches \"equivocal\" (deliberately ambiguous or noncommittal). \"scathing\" and \"dismissive\" both suggest harsh criticism, which contradicts the praise for individual scenes. \"effusive\" implies unrestrained enthusiasm, which contradicts the reviewer's withheld overall judgment."}, {"tag": "Words in Context", "tagcolor": "#7b61ff", "passage": "Despite the coach's optimistic pre-season predictions, the team's performance proved ______, oscillating between decisive wins and embarrassing losses with no discernible pattern.", "stem": "Which choice completes the text with the most logical and precise word?", "opts": ["erratic", "commendable", "predictable", "consistent"], "ci": 0, "exp": "The description of \"oscillating between decisive wins and embarrassing losses with no discernible pattern\" precisely matches \"erratic,\" meaning inconsistent or unpredictable. \"consistent\" and \"predictable\" both directly contradict the described lack of a pattern. \"commendable\" implies praiseworthy performance, which doesn't fit the mix of embarrassing losses described."}, {"tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "The memoir's final chapter breaks from its otherwise linear chronology to circle back to a single afternoon from the author's childhood, described in exhaustive sensory detail: the smell of rain on hot pavement, the particular creak of a screen door, the sound of her grandmother's radio drifting from an open window. Only after several paragraphs does the author reveal why this moment matters: it was the last afternoon before her family's sudden move across the country.", "stem": "Which choice best describes the function of the structural choice described in the passage?", "opts": ["It abruptly ends the narrative in the middle of an argument, leaving central questions unresolved.", "It shifts to a comic tone to relieve tension building throughout the memoir.", "It delays a key revelation to allow the reader to first experience the moment's significance directly, before its full context is explained.", "It presents two conflicting versions of the same event to highlight problems with memory."], "ci": 2, "exp": "The passage describes the author immersing readers in sensory detail (\"the smell of rain on hot pavement,\" \"the particular creak of a screen door\") before revealing, several paragraphs later, that this was \"the last afternoon before her family's sudden move,\" so the structure withholds context to let readers first feel the moment's weight before understanding why it matters. Nothing in the passage suggests an unresolved argument, a shift to comedy, or conflicting versions of the same event."}, {"tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "In her essay on urban noise, the author spends nearly a third of the piece cataloguing pleasant sounds -- birdsong at dawn, distant church bells, the rhythmic clatter of a subway train -- before pivoting, in a single blunt sentence, to declare that \"none of this matters if you cannot sleep.\"", "stem": "Which choice best describes the function of the blunt sentence in the passage?", "opts": ["It reinforces the pleasant impression created by the earlier catalog of sounds.", "It abruptly undercuts the preceding catalog of pleasant sounds to reframe the essay's real concern.", "It summarizes the essay's argument that urban noise is generally underappreciated.", "It introduces a new, unrelated topic that the essay will explore for the remainder of the piece."], "ci": 1, "exp": "After nearly a third of the essay cataloguing pleasant sounds, the blunt declaration \"none of this matters if you cannot sleep\" sharply reverses the mood established by that catalog, redirecting the essay toward the real concern of sleep disruption rather than reinforcing or summarizing the earlier pleasant impression. The sentence stays on the essay's established topic of urban noise rather than introducing something unrelated."}, {"tag": "Text Structure and Purpose", "tagcolor": "#0d9488", "passage": "A recent article on urban beekeeping opens by describing the dramatic decline in wild pollinator populations over the past two decades. It then profiles three city dwellers who installed rooftop hives, detailing the practical challenges they faced -- permits, neighbor complaints, and swarm management. The article closes by citing preliminary data suggesting that neighborhoods with more rooftop hives show modest increases in local plant diversity, while cautioning that more research is needed before drawing firm conclusions.", "stem": "Which choice best describes the overall structure of the passage?", "opts": ["It argues that rooftop beekeeping should be mandated in all major cities.", "It presents two opposing expert opinions and lets the reader decide which is more convincing.", "It moves from a broad problem, through individual case studies, to a cautious assessment of a possible partial solution.", "It compares urban beekeeping practices across several different countries."], "ci": 2, "exp": "The article moves from the broad problem of declining pollinator populations, to profiles of individual beekeepers and the challenges they faced, to a cautious, hedged assessment of preliminary data on plant diversity, matching a problem-to-case-studies-to-cautious-assessment structure. It does not present opposing expert opinions, argue for mandating beekeeping, or compare practices across countries."}, {"tag": "Text Structure and Purpose", "tagcolor": "#0d9488", "passage": "The article begins with a single striking statistic: a particular deep-sea trench has been surveyed only three times since its discovery. It then explains the technical and financial barriers that have limited exploration, before ending with a description of a newly funded expedition scheduled for next year.", "stem": "What is the main purpose of the passage?", "opts": ["To describe in detail the marine life discovered during the trench's three surveys.", "To compare the biodiversity of several different ocean trenches.", "To argue that deep-sea exploration is not a worthwhile use of research funding.", "To explain why a scientifically significant location has remained largely unexplored and to point toward renewed investigation."], "ci": 3, "exp": "The passage opens with the trench's limited survey history, explains the technical and financial barriers behind that scarcity, and closes by describing a newly funded expedition, together explaining why the location has stayed unexplored while pointing toward renewed investigation. It does not argue against research funding, compare multiple trenches, or detail marine life findings."}, {"tag": "Command of Evidence", "tagcolor": "#1D9E75", "passage": "A city official claims that a newly installed traffic roundabout reduced the number of collisions at a dangerous intersection because it forces drivers to slow down before merging.", "stem": "Which finding, if true, would most directly support the official's claim?", "opts": ["Recorded collision data show a significant drop in accidents at the intersection in the year following the roundabout's installation, compared with the year before.", "The cost of maintaining the roundabout is lower than the cost of maintaining the previous traffic light.", "Local residents report that the roundabout is visually more attractive than the traffic light it replaced.", "Traffic volume through the intersection increased by ten percent after the roundabout was installed."], "ci": 0, "exp": "The official's claim is specifically about reduced collisions caused by the roundabout, so direct before-and-after collision data showing a significant drop most directly supports that claim. Aesthetic opinions, traffic volume changes, and maintenance costs don't address the claim about collision rates."}, {"tag": "Command of Evidence", "tagcolor": "#1D9E75", "passage": "A nutrition researcher argues that a specific compound found in a certain type of algae reduces inflammation markers in adults with joint pain.", "stem": "Which finding, if true, would most directly support the researcher's claim?", "opts": ["Adults with joint pain who consumed the algae extract daily for eight weeks showed significantly lower inflammation markers than a control group given a placebo.", "The algae is easy to cultivate in controlled freshwater tanks.", "Surveys show that the algae extract has a mild, earthy taste that some consumers dislike.", "The algae naturally grows in colder coastal waters during winter months."], "ci": 0, "exp": "The claim is specifically about the compound's effect on inflammation markers in adults with joint pain, so a controlled comparison showing significantly lower inflammation markers after regular consumption most directly supports that causal claim. Cultivation ease, taste, and growing conditions don't bear on the claim about inflammation."}, {"tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: Proponents of four-day workweeks argue that compressing full-time hours into fewer days boosts employee focus and reduces burnout, citing pilot programs where productivity per hour increased.<br><br>Text 2: A recent multi-company trial of four-day workweeks found that while employees reported higher satisfaction, overall output on time-sensitive projects declined, as teams struggled to coordinate with clients still operating on five-day schedules.", "stem": "Based on the texts, how would the researchers in Text 2 most likely respond to the claim in Text 1 that four-day workweeks boost focus and reduce burnout?", "opts": ["They would likely complicate the claim by noting that benefits in focus and satisfaction can be offset by coordination problems with outside partners.", "They would likely agree completely, since both texts report improved employee satisfaction.", "They would likely argue that four-day workweeks have no effect on employee satisfaction.", "They would likely argue that productivity per hour decreased in every trial they studied."], "ci": 0, "exp": "Text 2 reports higher employee satisfaction (echoing part of Text 1) but also finds that output on time-sensitive projects declined due to coordination problems with clients on five-day schedules, which complicates rather than fully confirms or fully denies Text 1's claim. Text 2 does report improved satisfaction, so it wouldn't argue for no effect on satisfaction, and it describes declining output on time-sensitive projects specifically, not a decrease in every trial studied."}, {"tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: Historians have traditionally attributed the empire's rapid territorial expansion primarily to superior military technology.<br><br>Text 2: New analysis of administrative records suggests that the empire's expansion depended heavily on absorbing local bureaucracies rather than replacing them, allowing conquered regions to be governed with minimal added personnel.", "stem": "Which choice best describes the relationship between the two texts?", "opts": ["Text 2 was written to summarize the argument first made in Text 1.", "Text 2 confirms Text 1's explanation by providing additional evidence of military superiority.", "Text 1 and Text 2 both focus primarily on administrative records as their main evidence.", "Text 2 complicates Text 1's traditional explanation by highlighting an administrative factor largely absent from that account."], "ci": 3, "exp": "Text 2 introduces an administrative explanation (absorbing local bureaucracies) for the empire's expansion that is separate from and not addressed by Text 1's traditional military-technology explanation, complicating rather than confirming it. Text 1 relies on claims about military technology, not administrative records, and nothing indicates Text 2 merely summarizes Text 1's argument."}, {"tag": "Inferences", "tagcolor": "#f5a623", "passage": "Researchers tracking a population of migratory songbirds found that individuals fitted with slightly heavier tracking devices arrived at their breeding grounds an average of four days later than those with lighter devices, even though both groups departed on the same dates and followed nearly identical routes.", "stem": "Which conclusion about the birds' migration is best supported by the passage?", "opts": ["The tracking devices had no measurable effect on the birds' migration.", "Birds with lighter devices left their wintering grounds earlier than the others.", "The added weight of the heavier tracking devices may have slowed the birds' migration speed.", "The birds with heavier devices took a longer route to their breeding grounds."], "ci": 2, "exp": "Since both groups departed on the same dates and followed nearly identical routes, yet the heavier-device group arrived four days later, the most supported explanation is that the added device weight slowed their migration speed. The passage explicitly states the routes were nearly identical, ruling out a longer route, and the arrival difference shows the devices did have a measurable effect, and both groups departed on the same dates, ruling out an earlier departure for the lighter-device group."}, {"tag": "Inferences", "tagcolor": "#f5a623", "passage": "A survey of remote workers found that those who maintained a fixed daily start time reported higher job satisfaction than those with flexible start times. However, when researchers controlled for total hours worked per week, the difference in reported satisfaction between the two groups nearly disappeared.", "stem": "Which conclusion is best supported by the passage?", "opts": ["A fixed daily start time has no relationship whatsoever to job satisfaction.", "The apparent link between a fixed start time and higher job satisfaction may be explained largely by differences in total hours worked rather than by the fixed schedule itself.", "Remote workers with flexible schedules work significantly more hours than those with fixed schedules.", "Flexible start times always lead to lower total hours worked per week."], "ci": 1, "exp": "Because the satisfaction gap nearly disappeared once total hours worked was controlled for, the passage supports the conclusion that hours worked, not the fixed schedule itself, largely explains the original difference. The passage doesn't state that flexible schedules always lead to fewer hours, doesn't claim a fixed start time has literally no relationship to satisfaction (since an initial correlation was observed), and doesn't indicate flexible workers work more hours than fixed-schedule workers."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';

  qa.style.display='block';

  var qi = order[state.cur];

  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
