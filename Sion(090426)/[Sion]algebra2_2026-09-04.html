<script>var TITLE = "[Sion] Algebra 2";var QUIZ_KEY = "quiz_sionalgebra2_10_20260904_v1";var ATT_KEY = "quiz_sionalgebra2_10_att_20260904_v1";var RAW_QUESTIONS = [{"tag": "Radical Expressions - Rational Exponents", "stem": "Simplify: 16<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span></sup>", "opts": ["4", "64", "12", "8"], "ci": 3, "exp": "16<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span></sup> means take the fourth root of 16, then cube the result: the fourth root of 16 is 2, and 2&sup3; = 8."}, {"tag": "Reciprocal Trig Functions", "stem": "If cos&theta; = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span>, what is sec&theta;?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\">13</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>13</span><span style=\"border-top:1.4px solid #111;\">5</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>13</span><span style=\"border-top:1.4px solid #111;\">5</span></span>"], "ci": 2, "exp": "sec&theta; is the reciprocal of cos&theta;, so sec&theta; = 1 &divide; (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>13</span><span style=\"border-top:1.4px solid #111;\">5</span></span>."}, {"tag": "Sequences & Series - Geometric", "stem": "Find the sum of the first 6 terms of the geometric sequence 3, 6, 12, 24, ...", "opts": ["189", "192", "96", "186"], "ci": 0, "exp": "This geometric series has a1 = 3 and r = 2. The sum of the first 6 terms is a1 &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>r<sup>6</sup> &minus; 1</span><span style=\"border-top:1.4px solid #111;\">r &minus; 1</span></span> = 3 &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>64 &minus; 1</span><span style=\"border-top:1.4px solid #111;\">1</span></span> = 3(63) = 189."}, {"tag": "Radical Functions - Domain & Range", "stem": "What is the domain of f(x) = <span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">x &minus; 3</span></span> + 2, shown in the graph below?<br><svg viewBox=\"0 0 220 160\" width=\"220\" height=\"160\" style=\"background:#f5f7fa;border-radius:8px;margin-top:8px;\"><line x1=\"15\" y1=\"140\" x2=\"210\" y2=\"140\" stroke=\"#aab4c0\" stroke-width=\"1\"/><line x1=\"15\" y1=\"140\" x2=\"15\" y2=\"10\" stroke=\"#aab4c0\" stroke-width=\"1\"/><path d=\"M 60 120 Q 120 60 190 30\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"120\" r=\"5\" fill=\"#E24B4A\"/></svg>", "opts": ["x &ge; &minus;3", "x &ge; 2", "x &le; 3", "x &ge; 3"], "ci": 3, "exp": "The expression under the square root must be non-negative: x &minus; 3 &ge; 0, so x &ge; 3. This matches where the curve begins at (3, 2) on the graph."}, {"tag": "Rational Functions - Asymptotes", "stem": "What are the vertical and horizontal asymptotes of f(x) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3x &minus; 2</span><span style=\"border-top:1.4px solid #111;\">x + 5</span></span>?", "opts": ["x = &minus;5, y = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span>", "x = 5, y = 3", "x = &minus;5, y = 3", "x = &minus;5, y = &minus;2"], "ci": 2, "exp": "The vertical asymptote occurs where the denominator is zero: x + 5 = 0, so x = &minus;5. Since the numerator and denominator have the same degree, the horizontal asymptote is the ratio of leading coefficients: y = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">1</span></span> = 3."}, {"tag": "Ellipses - Equation & Classification", "stem": "Which equation represents the ellipse shown below, centered at the origin?<br><svg viewBox=\"0 0 220 180\" width=\"220\" height=\"180\" style=\"background:#f5f7fa;border-radius:8px;margin-top:8px;\"><line x1=\"10\" y1=\"90\" x2=\"210\" y2=\"90\" stroke=\"#aab4c0\" stroke-width=\"1\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"170\" stroke=\"#aab4c0\" stroke-width=\"1\"/><ellipse cx=\"110\" cy=\"90\" rx=\"90\" ry=\"54\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/><text x=\"183\" y=\"85\" font-size=\"11\" fill=\"#333\">(5,0)</text><text x=\"114\" y=\"40\" font-size=\"11\" fill=\"#333\">(0,3)</text></svg>", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">25</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">9</span></span> = 1", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">9</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">25</span></span> = 1", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">5</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 1", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">25</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">9</span></span> = 1"], "ci": 0, "exp": "The ellipse crosses the x-axis at (5,0) and the y-axis at (0,3), so the horizontal semi-axis is a = 5 and the vertical semi-axis is b = 3. The standard form is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">a&sup2;</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">b&sup2;</span></span> = 1, which gives <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x&sup2;</span><span style=\"border-top:1.4px solid #111;\">25</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>y&sup2;</span><span style=\"border-top:1.4px solid #111;\">9</span></span> = 1."}, {"tag": "Quadratic Functions - Standard to Vertex Form", "stem": "What is the vertex form of f(x) = x&sup2; &minus; 6x + 5? The parabola is shown below for reference.<br><svg viewBox=\"0 0 220 160\" width=\"220\" height=\"160\" style=\"background:#f5f7fa;border-radius:8px;margin-top:8px;\"><line x1=\"15\" y1=\"140\" x2=\"210\" y2=\"140\" stroke=\"#aab4c0\" stroke-width=\"1\"/><line x1=\"15\" y1=\"140\" x2=\"15\" y2=\"10\" stroke=\"#aab4c0\" stroke-width=\"1\"/><path d=\"M 40,20 L 53.33,53.61 L 66.67,81.11 L 80,102.5 L 93.33,117.78 L 106.67,126.94 L 120,130 L 133.33,126.94 L 146.67,117.78 L 160,102.5 L 173.33,81.11 L 186.67,53.61 L 200,20\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"3\"/><circle cx=\"120\" cy=\"130\" r=\"5\" fill=\"#E24B4A\"/></svg>", "opts": ["f(x) = (x + 3)&sup2; &minus; 4", "f(x) = (x &minus; 6)&sup2; &minus; 4", "f(x) = (x &minus; 3)&sup2; + 4", "f(x) = (x &minus; 3)&sup2; &minus; 4"], "ci": 3, "exp": "Completing the square: x&sup2; &minus; 6x + 5 = (x&sup2; &minus; 6x + 9) &minus; 9 + 5 = (x &minus; 3)&sup2; &minus; 4. The vertex of this parabola is (3, &minus;4), which is the lowest point shown on the graph."}, {"tag": "Function Operations", "stem": "If f(x) = x&sup2; + 2x and g(x) = 3x &minus; 1, what is (f + g)(x)?", "opts": ["3x&sup3; + 2x &minus; 1", "x&sup2; + 5x + 1", "x&sup2; + 5x &minus; 1", "x&sup2; &minus; x &minus; 1"], "ci": 2, "exp": "(f + g)(x) = f(x) + g(x) = (x&sup2; + 2x) + (3x &minus; 1) = x&sup2; + 5x &minus; 1."}, {"tag": "Sequences & Series - Arithmetic", "stem": "Find the sum of the first 20 terms of the arithmetic sequence with first term 4 and common difference 3.", "opts": ["620", "680", "650", "600"], "ci": 2, "exp": "The 20th term is a1 + 19d = 4 + 19(3) = 61. The sum is (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>n</span><span style=\"border-top:1.4px solid #111;\">2</span></span>)(a1 + an) = 10 &times; (4 + 61) = 650."}, {"tag": "Exponential Growth/Decay Models", "stem": "A population of bacteria starts at 500 and doubles every 4 hours. Which function models the population P(t), where t is time in hours?", "opts": ["P(t) = 2 &times; 500<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>t</span><span style=\"border-top:1.4px solid #111;\">4</span></span></sup>", "P(t) = 500 &times; 4<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>t</span><span style=\"border-top:1.4px solid #111;\">2</span></span></sup>", "P(t) = 500 &times; 2<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>t</span><span style=\"border-top:1.4px solid #111;\">4</span></span></sup>", "P(t) = 500 &times; 2<sup>4t</sup>"], "ci": 2, "exp": "Doubling every 4 hours means the growth factor is 2 raised to the power of (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>t</span><span style=\"border-top:1.4px solid #111;\">4</span></span>): P(t) = 500 &times; 2<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>t</span><span style=\"border-top:1.4px solid #111;\">4</span></span></sup>."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';

  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
