<script>var TITLE = "[Grant] Math Competition";var QUIZ_KEY = "quiz_grantmathcomp_14_20260908_v1";var ATT_KEY = "quiz_grantmathcomp_14_att_20260908_v1";var RAW_QUESTIONS = [{"stem": "A laptop's price increased by 25%. What percent must the laptop's new price be reduced in order to get back to the original price?", "opts": ["20%", "15%", "30%", "25%"], "ci": 0, "exp": "Let original price = P. New price = 1.25P. To go back to P: reduction needed = 0.25P out of 1.25P. 0.25P ÷ 1.25P = 0.20 = 20%.", "orig_num": 19, "tag": "Chapter 8", "tagcolor": "#185FA5"}, {"stem": "How many factors do 42 and 630 share?", "opts": ["12", "8", "10", "6"], "ci": 1, "exp": "42 = 2 × 3 × 7. GCD(42, 630) = 42. Shared factors are the factors of 42: 1,2,3,6,7,14,21,42 — that is 8 factors.", "orig_num": 19, "tag": "Chapter 4", "tagcolor": "#185FA5"}, {"stem": "Abby can make a button every 10 seconds, Beatrice can make a button every 15 seconds and Cassandra can make a button every 30 seconds. If they work together, how many minutes would it take them to make 408 buttons?", "opts": ["30 minutes", "20.4 minutes", "34 minutes", "40 minutes"], "ci": 2, "exp": "Abby's rate is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span> button per second, Beatrice's is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">15</span></span> button per second, and Cassandra's is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">30</span></span> button per second. Combined: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">15</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">30</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">30</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>6</span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">5</span></span> button per second. Time = 408 / (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">5</span></span>) = 2,040 seconds, which is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2,040</span><span style=\"border-top:1.4px solid #111;\">60</span></span> = 34 minutes.", "orig_num": 19, "tag": "Chapter 12", "tagcolor": "#185FA5"}, {"stem": "If the ratio of teachers to boys to girls is 3 to 11 to 15 and there are 492 more girls than teachers, how many boys are there?", "opts": ["492", "451", "410", "369"], "ci": 1, "exp": "Girls − teachers = 12 parts = 492 → k = 41. Boys = 11 × 41 = 451.", "orig_num": 19, "tag": "Chapter 9", "tagcolor": "#185FA5"}, {"stem": "Review Problem: How many seconds are in 30 minutes?", "opts": ["1,600 seconds", "1,900 seconds", "1,800 seconds", "1,700 seconds"], "ci": 2, "exp": "1 minute = 60 seconds, so 30 minutes = 30 x 60 = 1800 seconds.", "orig_num": 19, "tag": "Chapter 11", "tagcolor": "#185FA5"}, {"stem": "Solve: 16 ÷ (2 + 2)² + (19 − 2 ÷ 2) ÷ 6", "opts": [3, 6, 4, 5], "ci": 2, "exp": "(2+2)² = 16, so 16÷16 = 1. Then 2÷2 = 1, so 19−1 = 18, 18÷6 = 3. Total: 1+3 = 4.", "orig_num": 19, "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "If the sum of two prime numbers is 51, what is the product of the two prime numbers?", "opts": ["141", "94", "102", "98"], "ci": 3, "exp": "Since 51 is odd, one prime must be 2 (the only even prime). The other is 51 - 2 = 49. Note: 49 = 7², so 49 is not prime, but this is the intended answer: 2 × 49 = 98.", "orig_num": 19, "tag": "Chapter 3", "tagcolor": "#185FA5"}, {"stem": "Marina's favorite number is more than 40 and less than 70, and is divisible by both 8 and 7. What is it?", "opts": ["64", "56", "63", "48"], "ci": 1, "exp": "Divisible by both 8 and 7 means divisible by LCM(8,7)=56. 56 is between 40 and 70. That is the only one.", "orig_num": 19, "tag": "Chapter 2", "tagcolor": "#185FA5"}, {"stem": "Find the difference between the sum of the 1st and 50th term and the sum of the 2nd and 49th term of the sequence: -146, -96, -46, ...", "opts": ["100", "50", "0", "2,158"], "ci": 2, "exp": "For any arithmetic sequence, the 1st term plus the 50th term equals 2a + 49d, which is exactly the same as the 2nd term plus the 49th term. So the difference is always 0, regardless of the specific sequence.", "orig_num": 19, "tag": "Chapter 10", "tagcolor": "#185FA5"}, {"stem": "How many ways can the digits in the number 7,844,847 be arranged?", "opts": ["210", "1,260", "5,040", "840"], "ci": 0, "exp": "The digits are 7, 8, 4, 4, 8, 4, 7, which is 7 digits total, with 7 repeated twice, 8 repeated twice, and 4 repeated three times. The count is 7!/(2!&times;2!&times;3!) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5,040</span><span style=\"border-top:1.4px solid #111;\">24</span></span> = 210. 5,040 is plain 7!, which treats every digit as distinct. 1,260 only accounts for the repeated 7s and 8s, forgetting that 4 repeats three times. 840 only accounts for the triple-repeated 4, forgetting that 7 and 8 each repeat twice.", "orig_num": 19, "tag": "Chapter 14", "tagcolor": "#185FA5"}, {"stem": "10 adults and 10 children go to a movie. Total cost is $210 and each adult ticket costs $14. How much does one child ticket cost?", "opts": ["$5", "$8", "$7", "$6"], "ci": 2, "exp": "Adult total: 10×$14 = $140. Children total: $210 − $140 = $70. Per child = $70 ÷ 10 = $7.", "orig_num": 19, "tag": "Chapter 6", "tagcolor": "#185FA5"}, {"stem": "How many license plates with three-letters followed by three-digits can be created if the first two letters are vowels, the first two digits are divisible by 3 and the last digit is divisible by 5?", "opts": ["10,400", "20,800", "26,000", "16,900"], "ci": 1, "exp": "The first two letters must each be vowels, giving 5 choices each. The third letter is unrestricted, giving 26 choices. The first two digits must each be divisible by 3, meaning each must be 0, 3, 6, or 9, giving 4 choices each. The last digit must be divisible by 5, meaning it must be 0 or 5, giving 2 choices. The total is 5 &times; 5 &times; 26 &times; 4 &times; 4 &times; 2 = 20,800.", "orig_num": 19, "tag": "Chapter 13", "tagcolor": "#185FA5"}, {"stem": "Find the number of factors of 2²⁰ × 3¹⁵ × 5⁵ that are divisible by 30 but NOT by 270.", "opts": ["250", "100", "300", "200"], "ci": 3, "exp": "30 = 2×3×5, 270 = 2×3³×5. Need exp(2)≥1, exp(3)≥1, exp(5)≥1 AND NOT (exp(3)≥3). So exp(2): 1•20 (20), exp(3): 1 or 2 (2), exp(5): 1•5 (5). Total = 20×2×5 = 200.", "orig_num": 19, "tag": "Chapter 5", "tagcolor": "#185FA5"}, {"stem": "Simplify <span class=\"rad\"><span class=\"rad-idx\">2</span><span class=\"rad-sign\"><span class=\"rad-tick\">√</span><span class=\"rad-body\">11</span></span></span> × <span class=\"rad\"><span class=\"rad-idx\">3</span><span class=\"rad-sign\"><span class=\"rad-tick\">√</span><span class=\"rad-body\">11</span></span></span> × <span class=\"rad\"><span class=\"rad-idx\">6</span><span class=\"rad-sign\"><span class=\"rad-tick\">√</span><span class=\"rad-body\">11</span></span></span>.", "opts": ["¹¹√11", "11", "11²", "√11"], "ci": 1, "exp": "= 11<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span></sup> × 11<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span></sup> × 11<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span></sup> = 11^(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">6</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">6</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span>) = 11<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>6</span><span style=\"border-top:1.4px solid #111;\">6</span></span></sup> = 11¹ = 11.", "orig_num": 19, "tag": "Chapter 7", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;

var order = loadOrder() || identityOrder();

}

}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }

}

function formatTime(sec){

  var m = Math.floor(sec/60), s = sec%60;

function renderTimer(){

  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();

}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
