var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261024";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have taught", "NO CHANGE", "has teached", "has teach"], "ci": 1, "exp": "<i>Has</i> + past participle: <i>teach → taught → <b>taught</b></i>. One teacher takes <i>has</i>, so <i>Ms. Alvarez <b>has taught</b> pottery for twenty years</i> is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday I took my first pottery class at the community center. <b>(2)</b> Our teacher, Ms. Alvarez, <u>has taught</u> pottery for twenty years. <b>(3)</b> First she showed us how to center the clay on a spinning wheel. <b>(4)</b> My bowl came out lopsided, but it looked <u>real</u> nice after I painted it blue. <b>(5)</b> Ms. Alvarez baked the bowl in a hot oven called a kiln so <u>it’s</u> glaze would turn shiny. <b>(6)</b> I can’t wait to show it to you at Thanksgiving!"}, {"stem": "Where should a comma be added in sentence 3?", "opts": ["First she showed us how to center the clay, on a spinning wheel.", "First she showed us, how to center the clay on a spinning wheel.", "First, she showed us how to center the clay on a spinning wheel.", "First she showed us how to center, the clay on a spinning wheel."], "ci": 2, "exp": "Put a comma after a time-order word that starts a sentence: <i>First<b>,</b> she showed us how to center the clay.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday I took my first pottery class at the community center. <b>(2)</b> Our teacher, Ms. Alvarez, <u>has taught</u> pottery for twenty years. <b>(3)</b> First she showed us how to center the clay on a spinning wheel. <b>(4)</b> My bowl came out lopsided, but it looked <u>real</u> nice after I painted it blue. <b>(5)</b> Ms. Alvarez baked the bowl in a hot oven called a kiln so <u>it’s</u> glaze would turn shiny. <b>(6)</b> I can’t wait to show it to you at Thanksgiving!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["more real", "NO CHANGE", "realest", "really"], "ci": 3, "exp": "<i>Nice</i> is an adjective, and a word that tells <i>how</i> nice must be an adverb: <i>it looked <b>really</b> nice</i>. <i>Real</i> is an adjective (a <i>real</i> dinosaur bone).", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday I took my first pottery class at the community center. <b>(2)</b> Our teacher, Ms. Alvarez, <u>has taught</u> pottery for twenty years. <b>(3)</b> First she showed us how to center the clay on a spinning wheel. <b>(4)</b> My bowl came out lopsided, but it looked <u>real</u> nice after I painted it blue. <b>(5)</b> Ms. Alvarez baked the bowl in a hot oven called a kiln so <u>it’s</u> glaze would turn shiny. <b>(6)</b> I can’t wait to show it to you at Thanksgiving!"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["it is", "its", "its’", "NO CHANGE"], "ci": 1, "exp": "<i>Its</i> (no apostrophe) shows ownership; <i>it’s</i> means <i>it is</i>. The glaze belongs to the bowl: <i>so <b>its</b> glaze would turn shiny.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday I took my first pottery class at the community center. <b>(2)</b> Our teacher, Ms. Alvarez, <u>has taught</u> pottery for twenty years. <b>(3)</b> First she showed us how to center the clay on a spinning wheel. <b>(4)</b> My bowl came out lopsided, but it looked <u>real</u> nice after I painted it blue. <b>(5)</b> Ms. Alvarez baked the bowl in a hot oven called a kiln so <u>it’s</u> glaze would turn shiny. <b>(6)</b> I can’t wait to show it to you at Thanksgiving!"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["when", "which", "who", "NO CHANGE"], "ci": 3, "exp": "Use <i>where</i> to point back to a place. <i>Forests</i> are a place, so <i>mountain forests in Mexico, <b>where</b> the air stays cool</i> is already correct.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: The Monarchs’ Long Trip</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> They fly south to mountain forests in Mexico, <u>where</u> the air stays cool but not freezing. <b>(3)</b> Some of them <u>have flew</u> more than 2,500 miles by the time they arrive. <b>(4)</b> The trip takes about two months. <b>(5)</b> Because the butterflies stop often to drink nectar from flowers. <b>(6)</b> The tall fir trees in the forest protects the monarchs from wind and snow. <b>(7)</b> In spring, the monarchs head north to lay eggs on milkweed."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["have flown", "has flew", "have flied", "NO CHANGE"], "ci": 0, "exp": "After <i>have</i>, use the past participle: <i>fly → flew → <b>flown</b></i>. <i>Some of them <b>have flown</b> more than 2,500 miles.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Report: The Monarchs’ Long Trip</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> They fly south to mountain forests in Mexico, <u>where</u> the air stays cool but not freezing. <b>(3)</b> Some of them <u>have flew</u> more than 2,500 miles by the time they arrive. <b>(4)</b> The trip takes about two months. <b>(5)</b> Because the butterflies stop often to drink nectar from flowers. <b>(6)</b> The tall fir trees in the forest protects the monarchs from wind and snow. <b>(7)</b> In spring, the monarchs head north to lay eggs on milkweed."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["The trip takes about two months. Because the butterflies stop often, to drink nectar from flowers.", "The trip takes about two months, the butterflies stop often to drink nectar from flowers.", "The trip takes about two months because the butterflies stop often to drink nectar from flowers.", "The trip takes about two months, because, the butterflies stop often to drink nectar from flowers."], "ci": 2, "exp": "Sentence 5 is a fragment: a <i>because</i> part cannot stand alone. Join it to the sentence it explains: <i>The trip takes about two months <b>because</b> the butterflies stop often.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Report: The Monarchs’ Long Trip</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> They fly south to mountain forests in Mexico, <u>where</u> the air stays cool but not freezing. <b>(3)</b> Some of them <u>have flew</u> more than 2,500 miles by the time they arrive. <b>(4)</b> The trip takes about two months. <b>(5)</b> Because the butterflies stop often to drink nectar from flowers. <b>(6)</b> The tall fir trees in the forest protects the monarchs from wind and snow. <b>(7)</b> In spring, the monarchs head north to lay eggs on milkweed."}, {"stem": "Which sentence has an error?", "opts": ["Every fall, millions of monarch butterflies leave Canada and the northern United States.", "The tall fir trees in the forest protects the monarchs from wind and snow.", "In spring, the monarchs head north to lay eggs on milkweed.", "They fly south to mountain forests in Mexico, where the air stays cool but not freezing."], "ci": 1, "exp": "The subject is <i>trees</i> (plural), not <i>forest</i>, so the verb must be <i>protect</i>: <i>The tall fir <b>trees</b> in the forest <b>protect</b> the monarchs.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: The Monarchs’ Long Trip</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> They fly south to mountain forests in Mexico, <u>where</u> the air stays cool but not freezing. <b>(3)</b> Some of them <u>have flew</u> more than 2,500 miles by the time they arrive. <b>(4)</b> The trip takes about two months. <b>(5)</b> Because the butterflies stop often to drink nectar from flowers. <b>(6)</b> The tall fir trees in the forest protects the monarchs from wind and snow. <b>(7)</b> In spring, the monarchs head north to lay eggs on milkweed."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["is flipping", "flipped", "will flip", "NO CHANGE"], "ci": 1, "exp": "The journal tells about this morning in the past (<i>poured</i>), so keep the same tense: <i>Dad poured the batter, and then he <b>flipped</b> each pancake.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Journal: Pancake Morning</strong><br><b>(1)</b> This morning, Dad and I made pancakes for the whole family. <b>(2)</b> First, we mixed flour, eggs, and milk in a big blue bowl. <b>(3)</b> Dad poured the batter onto the hot pan, and then he <u>flips</u> each pancake with a spatula. <b>(4)</b> My little sister wanted to help. <b>(5)</b> Even though she is only four years old. <b>(6)</b> Dad let <u>her and I</u> pour the syrup. <b>(7)</b> We <u>could of</u> eaten ten pancakes each, but Mom saved some for Grandma."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["My little sister wanted to help. Even though, she is only four years old.", "My little sister wanted to help even though she is only four years old.", "My little sister, even though wanted to help, she is only four years old.", "My little sister wanted to help, she is only four years old."], "ci": 1, "exp": "Sentence 5 cannot stand alone because it starts with <i>even though</i>. Attach it to sentence 4: <i>My little sister wanted to help <b>even though</b> she is only four years old.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Journal: Pancake Morning</strong><br><b>(1)</b> This morning, Dad and I made pancakes for the whole family. <b>(2)</b> First, we mixed flour, eggs, and milk in a big blue bowl. <b>(3)</b> Dad poured the batter onto the hot pan, and then he <u>flips</u> each pancake with a spatula. <b>(4)</b> My little sister wanted to help. <b>(5)</b> Even though she is only four years old. <b>(6)</b> Dad let <u>her and I</u> pour the syrup. <b>(7)</b> We <u>could of</u> eaten ten pancakes each, but Mom saved some for Grandma."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["her and me", "she and me", "she and I", "NO CHANGE"], "ci": 0, "exp": "<i>Dad let ___ pour</i> needs object pronouns. Try each alone: <i>Dad let <b>her</b></i> and <i>Dad let <b>me</b></i>, so <i>Dad let <b>her and me</b> pour the syrup.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Journal: Pancake Morning</strong><br><b>(1)</b> This morning, Dad and I made pancakes for the whole family. <b>(2)</b> First, we mixed flour, eggs, and milk in a big blue bowl. <b>(3)</b> Dad poured the batter onto the hot pan, and then he <u>flips</u> each pancake with a spatula. <b>(4)</b> My little sister wanted to help. <b>(5)</b> Even though she is only four years old. <b>(6)</b> Dad let <u>her and I</u> pour the syrup. <b>(7)</b> We <u>could of</u> eaten ten pancakes each, but Mom saved some for Grandma."}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["could has", "NO CHANGE", "could had", "could have"], "ci": 3, "exp": "<i>Could of</i> is a mistake that comes from how <i>could’ve</i> sounds. Write <i><b>could have</b> eaten</i>.", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Journal: Pancake Morning</strong><br><b>(1)</b> This morning, Dad and I made pancakes for the whole family. <b>(2)</b> First, we mixed flour, eggs, and milk in a big blue bowl. <b>(3)</b> Dad poured the batter onto the hot pan, and then he <u>flips</u> each pancake with a spatula. <b>(4)</b> My little sister wanted to help. <b>(5)</b> Even though she is only four years old. <b>(6)</b> Dad let <u>her and I</u> pour the syrup. <b>(7)</b> We <u>could of</u> eaten ten pancakes each, but Mom saved some for Grandma."}, {"stem": "Where should a comma be added in sentence 1?", "opts": ["When thunder crashed every light, in the house went dark.", "When, thunder crashed every light in the house went dark.", "When thunder crashed every light in the house, went dark.", "When thunder crashed, every light in the house went dark."], "ci": 3, "exp": "When a sentence starts with a <i>when</i> part, put a comma after that part: <i>When thunder crashed<b>,</b> every light in the house went dark.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Story: The Night the Lights Went Out</strong><br><b>(1)</b> When thunder crashed every light in the house went dark. <b>(2)</b> “Mom, where are the flashlights?” Mia asked. <b>(3)</b> “They’re in the kitchen drawer,” Mom answered, “next to the batteries.” <b>(4)</b> “I’ll get them” said Mia. <b>(5)</b> Mia found them quickly, and her brother said she did a <u>good</u> job. <b>(6)</b> Then Dad read us a chapter of <i>Charlotte’s web</i> by flashlight while rain drummed on the roof. <b>(7)</b> “That was the best blackout ever!” Leo said, smiling."}, {"stem": "Which sentence has an error?", "opts": ["“I’ll get them” said Mia.", "Mia found them quickly, and her brother said she did a good job.", "“Mom, where are the flashlights?” Mia asked.", "“They’re in the kitchen drawer,” Mom answered, “next to the batteries.”"], "ci": 0, "exp": "When the speaker comes after the quote, put a comma inside the closing quotation mark: <i>“I’ll get them<b>,</b>” said Mia.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
