<title>[Grant] Advanced Vocabulary</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }

  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }

  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }

  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }

</style>

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261024";
var RAW_QUESTIONS = [{"stem": "Our teacher handed out a short article to <b>supplement</b> the textbook chapter, since the book left out the newest discoveries. What does <b>supplement</b> mean in this sentence?", "opts": ["to shorten something so it is easier to read", "to replace something that is out of date", "to check something carefully for mistakes", "to add something extra to make it more complete"], "ci": 3, "exp": "<i><b>supplement</b></i> (v.) to add something extra so that it is more complete. <i>Maya <b>supplements</b> her lunch with an apple from the garden.</i> Family: supplement (n.), supplementary (adj.) The article did not take the textbook’s place; it added the newest facts.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The library is <b>adjacent</b> to the fire station, so you can hear the sirens from the reading room. What does <b>adjacent</b> mean in this sentence?", "opts": ["built at the same time as", "much larger than", "right next to; sharing a side or border", "far away from"], "ci": 2, "exp": "<i><b>adjacent</b></i> (adj.) next to or touching. <i>Colorado and Utah are <b>adjacent</b> states.</i> Family: adjacency (n.) Hearing the sirens from inside is the clue that the buildings are close together.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "It was <b>obvious</b> that the dog had found the cake, since there was frosting all over his nose. Which word means the <b>SAME</b> or nearly the same as <b>obvious</b>?", "opts": ["hidden", "clear", "doubtful", "surprising"], "ci": 1, "exp": "<i><b>obvious</b></i> (adj.) easy to see or understand. <i>The answer seemed <b>obvious</b> once she drew a picture.</i> Family: obviously (adv.) “Hidden” and “doubtful” are opposite ideas.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "My great-grandmother was an <b>______</b> who sailed from Italy and settled in New York in 1921. Which word best completes the sentence?", "opts": ["immigrant", "archaeologist", "opponent", "apprentice"], "ci": 0, "exp": "<i><b>immigrant</b></i> (n.) a person who comes to live in a new country. <i>Many <b>immigrants</b> arrived at Ellis Island.</i> Family: immigrate (v.), immigration (n.) Sailing from Italy to settle in New York is what an immigrant does.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The beach cleanup was <b>voluntary</b>, but forty students still showed up on Saturday morning with gloves and trash bags. What does <b>voluntary</b> mean in this sentence?", "opts": ["done by choice, not because you are required to", "paid for by the school or the city", "planned at the last minute", "finished in a short amount of time"], "ci": 0, "exp": "<i><b>voluntary</b></i> (adj.) done because you choose to, not because you must. <i>Joining the chess club is <b>voluntary</b>.</i> Family: volunteer (n./v.), voluntarily (adv.) The word “still” is a clue: students came even though no one made them.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "In her essay about a later bedtime, Priya included a <b>counterargument</b>: some parents worry that kids will be too tired for school. Then she explained why that worry was not a big problem. What is a <b>counterargument</b>?", "opts": ["a fact that proves an essay is correct", "a short summary at the end of an essay", "the strongest reason that supports your own opinion", "a reason someone on the other side might give"], "ci": 3, "exp": "<i><b>counterargument</b></i> (n.) a reason that someone who disagrees with you might give. <i>A strong essay answers the <b>counterargument</b> instead of ignoring it.</i> Family: counter- (against) + argument. Priya’s own side was the later bedtime; the tired-kids worry came from the other side.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "For the science fair, Leo had to <b>classify</b> forty rocks as igneous, sedimentary, or metamorphic. What does <b>classify</b> mean in this sentence?", "opts": ["to give something a new name", "to clean something so it looks new", "to sort things into groups by what they have in common", "to measure how heavy something is"], "ci": 2, "exp": "<i><b>classify</b></i> (v.) to sort things into groups based on shared features. <i>Librarians <b>classify</b> books by subject.</i> Family: classification (n.), class (n.) The three rock types are the groups Leo sorted them into.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The crowd was <b>enthusiastic</b>, cheering and waving signs for the whole race. Which word means the <b>OPPOSITE</b> of <b>enthusiastic</b>?", "opts": ["excited", "noisy", "eager", "uninterested"], "ci": 3, "exp": "<i><b>enthusiastic</b></i> (adj.) full of excitement and interest. <i>Sam was <b>enthusiastic</b> about the camping trip.</i> Family: enthusiasm (n.), enthusiastically (adv.) “Eager” and “excited” mean nearly the same, so they are not the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Dr. Chen is an <b>authority</b> on sea turtles; reporters call her whenever turtles wash up on the beach. Which meaning of <b>authority</b> is used in this sentence?", "opts": ["written permission to do something", "an expert who knows a lot about a subject", "a government group in charge of something", "the power to give orders and make rules"], "ci": 1, "exp": "<i><b>authority</b></i> has several meanings: the power to make rules, a group in charge (like a housing authority), or an expert on a subject. <i>Mr. Ruiz is an <b>authority</b> on local history.</i> Family: authorize (v.), authoritative (adj.) Reporters call her because she knows so much about turtles.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Scientists measured the <b>magnitude</b> of the earthquake and found it was the strongest in fifty years. Which word means the <b>SAME</b> or nearly the same as <b>magnitude</b>?", "opts": ["size", "sound", "location", "smallness"], "ci": 0, "exp": "<i><b>magnitude</b></i> (n.) the great size or strength of something. <i>We didn’t understand the <b>magnitude</b> of the storm until we saw the damage.</i> Family: magnify (v.) “Smallness” is the opposite idea.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Rabbits freeze in place when a hawk flies overhead, because staying still helps them hide from the <b>predator</b>. What is a <b>predator</b>?", "opts": ["an animal that eats only plants", "an animal that moves to a new place each season", "an animal that hunts and eats other animals", "an animal that is hunted by others"], "ci": 2, "exp": "<i><b>predator</b></i> (n.) an animal that hunts other animals for food. <i>The owl is a <b>predator</b> that hunts mice at night.</i> Family: predatory (adj.), predation (n.) The rabbit is the one being hunted (the prey); the hawk is the hunter.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The marker was <b>______</b>, so the ink stayed on the whiteboard even after we scrubbed it. Which word best completes the sentence?", "opts": ["fragile", "gradual", "permanent", "flexible"], "ci": 2, "exp": "<i><b>permanent</b></i> (adj.) lasting forever or for a very long time. <i>The museum’s dinosaur skeleton is a <b>permanent</b> exhibit.</i> Family: permanently (adv.) The ink that would not wash off is the clue.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Grandma wrapped the <b>fragile</b> glass ornaments in tissue paper so they would not crack. Which word means the <b>OPPOSITE</b> of <b>fragile</b>?", "opts": ["shiny", "delicate", "valuable", "sturdy"], "ci": 3, "exp": "<i><b>fragile</b></i> (adj.) easily broken or damaged. <i>Eggs are <b>fragile</b>, so carry the carton carefully.</i> Family: fragility (n.) “Delicate” is a synonym; “sturdy” means strong and hard to break.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Fairness is an important <b>principle</b> on our team: everyone gets a turn to play, even in close games. What does <b>principle</b> mean in this sentence?", "opts": ["a basic rule or belief that guides how you act", "the person in charge of a school", "a prize given to the best player", "a plan made for one special game"], "ci": 0, "exp": "<i><b>principle</b></i> (n.) a basic rule or belief that guides actions. <i>Honesty is a <b>principle</b> my family lives by.</i> Don’t mix it up with <i>principal</i>, the head of a school, which sounds the same.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Workers added steel bars to <b>______</b> the old bridge so it could hold heavier trucks. Which word best completes the sentence?", "opts": ["conceal", "diminish", "reinforce", "abandon"], "ci": 2, "exp": "<i><b>reinforce</b></i> (v.) to make something stronger. <i>The coach used extra practice to <b>reinforce</b> the new play.</i> Family: reinforcement (n.) Making the bridge hold heavier trucks means making it stronger, not smaller, hidden, or left behind.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Ella said she hated vegetables, but she ate three helpings of salad. Her brother pointed out the <b>______</b>. Which word correctly completes the sentence?", "opts": ["contradictory", "contradiction", "contradict", "contradicted"], "ci": 1, "exp": "<i><b>contradiction</b></i> (n.) a statement or action that goes against another one. <i>There is a <b>contradiction</b> between his words and his actions.</i> Family: contradict (v.), contradictory (adj.) After “the,” the sentence needs a noun, and <i>-tion</i> makes the noun.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The directions were <b>explicit</b>: “Write your name in the top right corner and use only a pencil.” No one had to guess what to do. What does <b>explicit</b> mean in this sentence?", "opts": ["stated clearly and fully, leaving nothing to guess", "given in a quiet, polite way", "hinted at but not said directly", "short and easy to forget"], "ci": 0, "exp": "<i><b>explicit</b></i> (adj.) stated clearly and in detail, so nothing has to be guessed. <i>The coach gave <b>explicit</b> instructions about where to stand.</i> Family: explicitly (adv.) “Hinted at but not said directly” is the opposite idea, which is called <i>implicit</i>.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The jury will <b>deliberate</b> for several hours before announcing whether the man is guilty. Which meaning of <b>deliberate</b> is used in this sentence?", "opts": ["to argue loudly in public", "done on purpose, not by accident", "slow and careful in the way you move", "to think about and discuss something carefully before deciding"], "ci": 3, "exp": "<i><b>deliberate</b></i> has more than one meaning. As a verb (dih-LIB-uh-rate) it means to think and talk carefully before deciding. As an adjective (dih-LIB-er-it) it means done on purpose, or slow and careful. <i>The jury will <b>deliberate</b> before the verdict.</i> Family: deliberately (adv.), deliberation (n.) A jury talks it over before deciding.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The new reading program worked <b>______</b>; scores went up in every grade. Which word correctly completes the sentence?", "opts": ["effect", "effective", "effectiveness", "effectively"], "ci": 3, "exp": "<i><b>effective</b></i> (adj.) working well and getting the result you want. <i>Wearing a helmet is an <b>effective</b> way to stay safe.</i> Family: effect (n.), effectively (adv.), effectiveness (n.) The blank describes how the program <i>worked</i> (a verb), so it needs the adverb ending <i>-ly</i>.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Scientists created a <b>______</b> system that puts living things into groups such as kingdoms, families, and species. Which word best completes the sentence?", "opts": ["prosperity", "emergence", "tolerance", "classification"], "ci": 3, "exp": "<i><b>classification</b></i> (n.) the act or system of sorting things into groups. <i>The <b>classification</b> of animals helps scientists compare them.</i> Family: classify (v.) Only “classification” describes a system for putting things into groups.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
