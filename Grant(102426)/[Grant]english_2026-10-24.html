<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261024";
var RAW_QUESTIONS = [{"stem": "Which sentence best states the main idea of the passage?", "opts": ["Thousands of unemployed men moved to Black Canyon because they wanted steady pay during the Great Depression.", "The Colorado River was more useful to farmers before Hoover Dam was built.", "Workers overcame difficult and dangerous conditions to build a dam that controlled a powerful river and still serves millions of people.", "High scalers had the most dangerous job of anyone who worked in Black Canyon."], "ci": 2, "exp": "The whole passage explains why the dam was needed, how it was built, and what it does today. The jobs and the high scalers are true details, but each covers only one part of the passage.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Taming the Colorado</strong><br><p style=\"margin:0 0 8px;\">During the early 1900s, the Colorado River was both a treasure and a threat. Its water could irrigate dry farmland across the Southwest, but spring floods regularly destroyed crops and homes downstream. In 1931, during the Great Depression, workers began building an enormous dam in Black Canyon, on the border between Nevada and Arizona. Thousands of unemployed men traveled there, eager for steady pay.</p><p style=\"margin:0 0 8px;\">First, crews blasted four giant tunnels through the canyon walls so that the river could be redirected around the construction site. Next, they poured concrete into hundreds of separate blocks, one column at a time. Because such a massive amount of concrete would have taken more than a century to cool on its own, engineers ran cold water through pipes buried inside it. The work was perilous. Men known as “high scalers” dangled from ropes hundreds of feet above the canyon floor to chip away loose rock.</p><p style=\"margin:0 0 8px;\">Hoover Dam was completed in 1936, two years ahead of schedule. Rising 726 feet, it created Lake Mead, and it still supplies water and electricity to millions of people in three states.</p>"}, {"stem": "Which list shows the events in the order they happened?", "opts": ["Concrete was poured in blocks → the dam was completed → crews blasted tunnels → the dam supplies water today", "Crews blasted tunnels → concrete was poured in blocks → the dam was completed → the dam supplies water today", "Concrete was poured in blocks → crews blasted tunnels → the dam was completed → the dam supplies water today", "Crews blasted tunnels → the dam was completed → concrete was poured in blocks → the dam supplies water today"], "ci": 1, "exp": "The second paragraph says “<i>First</i>, crews blasted four giant tunnels” and “<i>Next</i>, they poured concrete,” and the third paragraph says the dam was completed in 1936 and “still supplies water.” The tunnels had to come first so the river could be moved out of the way.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Taming the Colorado</strong><br><p style=\"margin:0 0 8px;\">During the early 1900s, the Colorado River was both a treasure and a threat. Its water could irrigate dry farmland across the Southwest, but spring floods regularly destroyed crops and homes downstream. In 1931, during the Great Depression, workers began building an enormous dam in Black Canyon, on the border between Nevada and Arizona. Thousands of unemployed men traveled there, eager for steady pay.</p><p style=\"margin:0 0 8px;\">First, crews blasted four giant tunnels through the canyon walls so that the river could be redirected around the construction site. Next, they poured concrete into hundreds of separate blocks, one column at a time. Because such a massive amount of concrete would have taken more than a century to cool on its own, engineers ran cold water through pipes buried inside it. The work was perilous. Men known as “high scalers” dangled from ropes hundreds of feet above the canyon floor to chip away loose rock.</p><p style=\"margin:0 0 8px;\">Hoover Dam was completed in 1936, two years ahead of schedule. Rising 726 feet, it created Lake Mead, and it still supplies water and electricity to millions of people in three states.</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of “perilous” as it is used in the passage?", "opts": ["lengthy", "safe", "exhausting", "dangerous"], "ci": 1, "exp": "<i>Perilous</i> means full of danger; the next sentence shows men dangling from ropes hundreds of feet up. The opposite is <i>safe</i>. “Dangerous” means the same thing, so it is a synonym, not the opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Taming the Colorado</strong><br><p style=\"margin:0 0 8px;\">During the early 1900s, the Colorado River was both a treasure and a threat. Its water could irrigate dry farmland across the Southwest, but spring floods regularly destroyed crops and homes downstream. In 1931, during the Great Depression, workers began building an enormous dam in Black Canyon, on the border between Nevada and Arizona. Thousands of unemployed men traveled there, eager for steady pay.</p><p style=\"margin:0 0 8px;\">First, crews blasted four giant tunnels through the canyon walls so that the river could be redirected around the construction site. Next, they poured concrete into hundreds of separate blocks, one column at a time. Because such a massive amount of concrete would have taken more than a century to cool on its own, engineers ran cold water through pipes buried inside it. The work was perilous. Men known as “high scalers” dangled from ropes hundreds of feet above the canyon floor to chip away loose rock.</p><p style=\"margin:0 0 8px;\">Hoover Dam was completed in 1936, two years ahead of schedule. Rising 726 feet, it created Lake Mead, and it still supplies water and electricity to millions of people in three states.</p>"}, {"stem": "According to the passage, how did engineers cool the huge amount of concrete?", "opts": ["They waited more than a century for it to cool.", "They ran cold water through pipes buried inside it.", "They mixed blocks of ice into the wet concrete.", "They let the Colorado River flow over the blocks."], "ci": 1, "exp": "The passage says engineers “ran cold water through pipes buried inside it.” Waiting “more than a century” is what would have happened <i>without</i> the pipes.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Taming the Colorado</strong><br><p style=\"margin:0 0 8px;\">During the early 1900s, the Colorado River was both a treasure and a threat. Its water could irrigate dry farmland across the Southwest, but spring floods regularly destroyed crops and homes downstream. In 1931, during the Great Depression, workers began building an enormous dam in Black Canyon, on the border between Nevada and Arizona. Thousands of unemployed men traveled there, eager for steady pay.</p><p style=\"margin:0 0 8px;\">First, crews blasted four giant tunnels through the canyon walls so that the river could be redirected around the construction site. Next, they poured concrete into hundreds of separate blocks, one column at a time. Because such a massive amount of concrete would have taken more than a century to cool on its own, engineers ran cold water through pipes buried inside it. The work was perilous. Men known as “high scalers” dangled from ropes hundreds of feet above the canyon floor to chip away loose rock.</p><p style=\"margin:0 0 8px;\">Hoover Dam was completed in 1936, two years ahead of schedule. Rising 726 feet, it created Lake Mead, and it still supplies water and electricity to millions of people in three states.</p>"}, {"stem": "According to the passage, why do hurricanes weaken after they move over land?", "opts": ["Their supply of moisture from warm water is cut off.", "The eye of the storm fills with violent winds.", "Forecasters warn communities to prepare.", "Earth’s rotation stops the air from spinning."], "ci": 0, "exp": "The second paragraph says hurricanes weaken over land or colder seas, “where their supply of moisture is cut off.” Earth’s rotation is what makes the air spin in the first place, not what weakens the storm.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>How a Hurricane Grows</strong><br><p style=\"margin:0 0 8px;\">A hurricane begins as a cluster of thunderstorms drifting over warm tropical ocean water. When the surface of the sea reaches about 80 degrees Fahrenheit, huge amounts of water evaporate, and the warm, moist air rises rapidly. As this air climbs, it cools and forms towering clouds, releasing heat that pulls even more air upward. Because Earth rotates, the rising air begins to spin, and the storm organizes into a giant spiral. At its center is the eye, where the sky is calm and often cloudless, surrounded by a wall of the most violent winds.</p><p style=\"margin:0 0 8px;\">Once its winds reach 74 miles per hour, the storm is officially classified as a hurricane. Hurricanes gain strength as long as they remain over warm water, but they weaken quickly after moving over land or colder seas, where their supply of moisture is cut off. Even so, a weakening hurricane can push a surge of seawater onto adjacent coastlines and drop more than a foot of rain. Today, forecasters use satellites and specially equipped airplanes to track each storm and warn communities days in advance.</p>"}, {"stem": "In the second paragraph, the passage says a hurricane can push “a surge of seawater” onto the coast. What does “surge” mean?", "opts": ["a wall of thick clouds", "a sudden, powerful rush", "a slow, gentle trickle", "a thin layer of salt"], "ci": 1, "exp": "The surge is something a storm can “push” onto the coastline along with heavy rain, so it is a sudden, powerful rush of water. A “slow, gentle trickle” is the opposite idea.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>How a Hurricane Grows</strong><br><p style=\"margin:0 0 8px;\">A hurricane begins as a cluster of thunderstorms drifting over warm tropical ocean water. When the surface of the sea reaches about 80 degrees Fahrenheit, huge amounts of water evaporate, and the warm, moist air rises rapidly. As this air climbs, it cools and forms towering clouds, releasing heat that pulls even more air upward. Because Earth rotates, the rising air begins to spin, and the storm organizes into a giant spiral. At its center is the eye, where the sky is calm and often cloudless, surrounded by a wall of the most violent winds.</p><p style=\"margin:0 0 8px;\">Once its winds reach 74 miles per hour, the storm is officially classified as a hurricane. Hurricanes gain strength as long as they remain over warm water, but they weaken quickly after moving over land or colder seas, where their supply of moisture is cut off. Even so, a weakening hurricane can push a surge of seawater onto adjacent coastlines and drop more than a foot of rain. Today, forecasters use satellites and specially equipped airplanes to track each storm and warn communities days in advance.</p>"}, {"stem": "The word <i>forecasters</i> is built from <i>fore-</i>, which means “before,” and <i>caster</i>. Based on the passage, a forecaster is most likely a person who —", "opts": ["repairs airplanes after a storm passes", "measures the ocean’s temperature by hand", "builds walls to protect the coast", "tells what the weather will do before it happens"], "ci": 3, "exp": "<i>Fore-</i> means “before,” as in <i>foresee</i>. The passage says forecasters track storms to “warn communities days in advance,” which means telling what will happen before it happens.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>How a Hurricane Grows</strong><br><p style=\"margin:0 0 8px;\">A hurricane begins as a cluster of thunderstorms drifting over warm tropical ocean water. When the surface of the sea reaches about 80 degrees Fahrenheit, huge amounts of water evaporate, and the warm, moist air rises rapidly. As this air climbs, it cools and forms towering clouds, releasing heat that pulls even more air upward. Because Earth rotates, the rising air begins to spin, and the storm organizes into a giant spiral. At its center is the eye, where the sky is calm and often cloudless, surrounded by a wall of the most violent winds.</p><p style=\"margin:0 0 8px;\">Once its winds reach 74 miles per hour, the storm is officially classified as a hurricane. Hurricanes gain strength as long as they remain over warm water, but they weaken quickly after moving over land or colder seas, where their supply of moisture is cut off. Even so, a weakening hurricane can push a surge of seawater onto adjacent coastlines and drop more than a foot of rain. Today, forecasters use satellites and specially equipped airplanes to track each storm and warn communities days in advance.</p>"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Forecasters use satellites and airplanes to track hurricanes.", "A storm is classified as a hurricane once its winds reach 47 miles per hour.", "The sky in the eye of a hurricane is often calm and cloudless.", "Hurricanes begin over ocean water that is about 80 degrees Fahrenheit."], "ci": 1, "exp": "The passage says a storm becomes a hurricane “once its winds reach <b>74</b> miles per hour,” not 47. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>How a Hurricane Grows</strong><br><p style=\"margin:0 0 8px;\">A hurricane begins as a cluster of thunderstorms drifting over warm tropical ocean water. When the surface of the sea reaches about 80 degrees Fahrenheit, huge amounts of water evaporate, and the warm, moist air rises rapidly. As this air climbs, it cools and forms towering clouds, releasing heat that pulls even more air upward. Because Earth rotates, the rising air begins to spin, and the storm organizes into a giant spiral. At its center is the eye, where the sky is calm and often cloudless, surrounded by a wall of the most violent winds.</p><p style=\"margin:0 0 8px;\">Once its winds reach 74 miles per hour, the storm is officially classified as a hurricane. Hurricanes gain strength as long as they remain over warm water, but they weaken quickly after moving over land or colder seas, where their supply of moisture is cut off. Even so, a weakening hurricane can push a surge of seawater onto adjacent coastlines and drop more than a foot of rain. Today, forecasters use satellites and specially equipped airplanes to track each storm and warn communities days in advance.</p>"}, {"stem": "According to the story, what did Ana bring Leo?", "opts": ["a copy of the play’s script", "her spelling-bee trophy", "a three-cornered hat", "a small notebook"], "ci": 3, "exp": "The story says Ana “returned with a small notebook.” The three-cornered hat is part of Leo’s costume the next evening.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Opening Night</strong><br><p style=\"margin:0 0 8px;\">The night before the class play, Leo paced across his bedroom, mumbling the same speech for the twentieth time. Joining the play had been voluntary, and now he almost wished he had never signed up. He was playing Paul Revere, and his longest line was the one he kept forgetting.</p><p style=\"margin:0 0 8px;\">“You know it,” said his older sister, Ana, leaning in the doorway. “You said it perfectly at dinner.”</p><p style=\"margin:0 0 8px;\">“At dinner, nobody was staring at me,” Leo replied, flopping onto his bed. “What if I freeze and the whole auditorium goes silent?”</p><p style=\"margin:0 0 8px;\">Ana thought for a moment. Then she disappeared down the hall and returned with a small notebook. “When I was in the spelling bee, I wrote my hardest words on the first page,” she said. “I never even opened it onstage. Just knowing it was in my pocket kept me calm.”</p><p style=\"margin:0 0 8px;\">The next evening, standing under the hot stage lights in a three-cornered hat, Leo felt the notebook pressing against his leg. When the moment came, the words flowed out, steady and clear, and the applause that followed made his face burn with pride.</p>"}, {"stem": "Which sentence best states a theme of the story?", "opts": ["Older siblings always know the right answer.", "It is better not to sign up for things that seem hard.", "Feeling prepared can give a person the courage to face a fear.", "A play is more difficult than a spelling bee."], "ci": 2, "exp": "Leo never needs to open the notebook; just knowing it is there helps him say his line “steady and clear.” The story shows how feeling ready can help someone be brave.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Opening Night</strong><br><p style=\"margin:0 0 8px;\">The night before the class play, Leo paced across his bedroom, mumbling the same speech for the twentieth time. Joining the play had been voluntary, and now he almost wished he had never signed up. He was playing Paul Revere, and his longest line was the one he kept forgetting.</p><p style=\"margin:0 0 8px;\">“You know it,” said his older sister, Ana, leaning in the doorway. “You said it perfectly at dinner.”</p><p style=\"margin:0 0 8px;\">“At dinner, nobody was staring at me,” Leo replied, flopping onto his bed. “What if I freeze and the whole auditorium goes silent?”</p><p style=\"margin:0 0 8px;\">Ana thought for a moment. Then she disappeared down the hall and returned with a small notebook. “When I was in the spelling bee, I wrote my hardest words on the first page,” she said. “I never even opened it onstage. Just knowing it was in my pocket kept me calm.”</p><p style=\"margin:0 0 8px;\">The next evening, standing under the hot stage lights in a three-cornered hat, Leo felt the notebook pressing against his leg. When the moment came, the words flowed out, steady and clear, and the applause that followed made his face burn with pride.</p>"}, {"stem": "Which word means the <b>SAME</b> or nearly the same as “steady” as it is used in the last paragraph?", "opts": ["hurried", "unshaking", "whispered", "trembling"], "ci": 1, "exp": "The words “flowed out, steady and clear,” so they did not shake or stumble. <i>Unshaking</i> is closest. “Trembling” means the opposite.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>Opening Night</strong><br><p style=\"margin:0 0 8px;\">The night before the class play, Leo paced across his bedroom, mumbling the same speech for the twentieth time. Joining the play had been voluntary, and now he almost wished he had never signed up. He was playing Paul Revere, and his longest line was the one he kept forgetting.</p><p style=\"margin:0 0 8px;\">“You know it,” said his older sister, Ana, leaning in the doorway. “You said it perfectly at dinner.”</p><p style=\"margin:0 0 8px;\">“At dinner, nobody was staring at me,” Leo replied, flopping onto his bed. “What if I freeze and the whole auditorium goes silent?”</p><p style=\"margin:0 0 8px;\">Ana thought for a moment. Then she disappeared down the hall and returned with a small notebook. “When I was in the spelling bee, I wrote my hardest words on the first page,” she said. “I never even opened it onstage. Just knowing it was in my pocket kept me calm.”</p><p style=\"margin:0 0 8px;\">The next evening, standing under the hot stage lights in a three-cornered hat, Leo felt the notebook pressing against his leg. When the moment came, the words flowed out, steady and clear, and the applause that followed made his face burn with pride.</p>"}, {"stem": "Why does Leo say, “At dinner, nobody was staring at me”?", "opts": ["He is upset that Ana interrupted his practice.", "He wants Ana to watch him practice the speech again.", "He can remember the line when he is relaxed, but an audience makes him nervous.", "He thinks his family was not listening when he practiced."], "ci": 2, "exp": "Right after this line, Leo asks, “What if I freeze and the whole auditorium goes silent?” He knows the words at home; his worry is people watching him.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Opening Night</strong><br><p style=\"margin:0 0 8px;\">The night before the class play, Leo paced across his bedroom, mumbling the same speech for the twentieth time. Joining the play had been voluntary, and now he almost wished he had never signed up. He was playing Paul Revere, and his longest line was the one he kept forgetting.</p><p style=\"margin:0 0 8px;\">“You know it,” said his older sister, Ana, leaning in the doorway. “You said it perfectly at dinner.”</p><p style=\"margin:0 0 8px;\">“At dinner, nobody was staring at me,” Leo replied, flopping onto his bed. “What if I freeze and the whole auditorium goes silent?”</p><p style=\"margin:0 0 8px;\">Ana thought for a moment. Then she disappeared down the hall and returned with a small notebook. “When I was in the spelling bee, I wrote my hardest words on the first page,” she said. “I never even opened it onstage. Just knowing it was in my pocket kept me calm.”</p><p style=\"margin:0 0 8px;\">The next evening, standing under the hot stage lights in a three-cornered hat, Leo felt the notebook pressing against his leg. When the moment came, the words flowed out, steady and clear, and the applause that followed made his face burn with pride.</p>"}, {"stem": "According to the story, which statement is <b>NOT</b> true?", "opts": ["The medicine traveled by train before the dogs took it.", "Balto was the lead dog of Gunnar Kaasen’s team.", "Airplanes carried the medicine for part of the trip.", "The frozen sea had closed Nome’s harbor to ships."], "ci": 2, "exp": "The story says “airplanes could not fly in such bitter cold,” so no airplane carried the medicine. The other three statements match the story.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Race to Nome</strong><br><p style=\"margin:0 0 8px;\">Nellie Pruett pressed her mittened hand against the frosted window and stared down Front Street. For five days, the people of Nome, Alaska, had been waiting. It was the winter of 1925, diphtheria was spreading among the town’s children, and Dr. Welch’s medicine had expired. Nellie’s little brother, Tom, lay in the next room, his breathing rough and shallow.</p><p style=\"margin:0 0 8px;\">Fresh medicine had traveled by train from Anchorage to the town of Nenana. From there, teams of sled dogs were racing it across nearly seven hundred miles of ice, passing the package from one driver to the next like runners in a relay. Airplanes could not fly in such bitter cold, and the frozen sea had closed the harbor to ships.</p><p style=\"margin:0 0 8px;\">Before dawn on February 2, Nellie heard a sound she would never forget: the jingle of harness bells. Out of the darkness came a team of exhausted dogs, frost coating their fur, led by a black husky named Balto. The driver, Gunnar Kaasen, stumbled to the doctor’s door with the precious bundle.</p><p style=\"margin:0 0 8px;\">Nellie ran to Tom’s bedside. “It’s here,” she whispered. “Hold on just a little longer.”</p>"}, {"stem": "Which of these events happened <b>first</b>?", "opts": ["Teams of sled dogs raced the medicine across the ice.", "Nellie heard the jingle of harness bells.", "Gunnar Kaasen carried the bundle to the doctor’s door.", "The medicine traveled by train from Anchorage to Nenana."], "ci": 3, "exp": "The story begins with Nellie waiting, but the second paragraph explains what happened earlier: the medicine went “by train from Anchorage to the town of Nenana,” and only “from there” did the dog teams take it.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Race to Nome</strong><br><p style=\"margin:0 0 8px;\">Nellie Pruett pressed her mittened hand against the frosted window and stared down Front Street. For five days, the people of Nome, Alaska, had been waiting. It was the winter of 1925, diphtheria was spreading among the town’s children, and Dr. Welch’s medicine had expired. Nellie’s little brother, Tom, lay in the next room, his breathing rough and shallow.</p><p style=\"margin:0 0 8px;\">Fresh medicine had traveled by train from Anchorage to the town of Nenana. From there, teams of sled dogs were racing it across nearly seven hundred miles of ice, passing the package from one driver to the next like runners in a relay. Airplanes could not fly in such bitter cold, and the frozen sea had closed the harbor to ships.</p><p style=\"margin:0 0 8px;\">Before dawn on February 2, Nellie heard a sound she would never forget: the jingle of harness bells. Out of the darkness came a team of exhausted dogs, frost coating their fur, led by a black husky named Balto. The driver, Gunnar Kaasen, stumbled to the doctor’s door with the precious bundle.</p><p style=\"margin:0 0 8px;\">Nellie ran to Tom’s bedside. “It’s here,” she whispered. “Hold on just a little longer.”</p>"}, {"stem": "Read this sentence from the story: “Airplanes could not fly in such <b>bitter</b> cold.” Which meaning of <i>bitter</i> is used here?", "opts": ["very harsh and painful to feel", "having a sharp, unpleasant taste", "feeling angry about being treated unfairly", "full of sadness after losing something"], "ci": 0, "exp": "<i>Bitter</i> can describe a taste, a feeling of anger, or weather. Here it describes the cold, so it means harsh and painful — cold enough to keep airplanes on the ground.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>The Race to Nome</strong><br><p style=\"margin:0 0 8px;\">Nellie Pruett pressed her mittened hand against the frosted window and stared down Front Street. For five days, the people of Nome, Alaska, had been waiting. It was the winter of 1925, diphtheria was spreading among the town’s children, and Dr. Welch’s medicine had expired. Nellie’s little brother, Tom, lay in the next room, his breathing rough and shallow.</p><p style=\"margin:0 0 8px;\">Fresh medicine had traveled by train from Anchorage to the town of Nenana. From there, teams of sled dogs were racing it across nearly seven hundred miles of ice, passing the package from one driver to the next like runners in a relay. Airplanes could not fly in such bitter cold, and the frozen sea had closed the harbor to ships.</p><p style=\"margin:0 0 8px;\">Before dawn on February 2, Nellie heard a sound she would never forget: the jingle of harness bells. Out of the darkness came a team of exhausted dogs, frost coating their fur, led by a black husky named Balto. The driver, Gunnar Kaasen, stumbled to the doctor’s door with the precious bundle.</p><p style=\"margin:0 0 8px;\">Nellie ran to Tom’s bedside. “It’s here,” she whispered. “Hold on just a little longer.”</p>"}, {"stem": "Why does Nellie whisper, “Hold on just a little longer”?", "opts": ["She knows the doctor has gone home for the night.", "She believes the medicine can help Tom, but it will take a little time.", "She thinks another dog team is still on the way.", "She wants Tom to stay quiet so the dogs can rest."], "ci": 1, "exp": "Tom’s breathing is “rough and shallow,” and the medicine has just arrived. Nellie is hopeful now, but she knows Tom must keep fighting until the medicine works.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Race to Nome</strong><br><p style=\"margin:0 0 8px;\">Nellie Pruett pressed her mittened hand against the frosted window and stared down Front Street. For five days, the people of Nome, Alaska, had been waiting. It was the winter of 1925, diphtheria was spreading among the town’s children, and Dr. Welch’s medicine had expired. Nellie’s little brother, Tom, lay in the next room, his breathing rough and shallow.</p><p style=\"margin:0 0 8px;\">Fresh medicine had traveled by train from Anchorage to the town of Nenana. From there, teams of sled dogs were racing it across nearly seven hundred miles of ice, passing the package from one driver to the next like runners in a relay. Airplanes could not fly in such bitter cold, and the frozen sea had closed the harbor to ships.</p><p style=\"margin:0 0 8px;\">Before dawn on February 2, Nellie heard a sound she would never forget: the jingle of harness bells. Out of the darkness came a team of exhausted dogs, frost coating their fur, led by a black husky named Balto. The driver, Gunnar Kaasen, stumbled to the doctor’s door with the precious bundle.</p><p style=\"margin:0 0 8px;\">Nellie ran to Tom’s bedside. “It’s here,” she whispered. “Hold on just a little longer.”</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of “restless” as it is used in the poem?", "opts": ["uneasy", "fierce", "invisible", "calm"], "ci": 3, "exp": "The restless wind never stops moving: it rattles, tugs, puffs, and hurries. The opposite is <i>calm</i>. “Uneasy” is close to the same meaning, so it is not the opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>"}, {"stem": "In the second stanza, the wind “scattered leaves both young and old.” What does “scattered” mean?", "opts": ["painted in bright colors", "stacked into neat piles", "pulled from the ground", "spread in many different directions"], "ci": 3, "exp": "The wind “swept” the maple and sent its leaves everywhere, so <i>scattered</i> means spread in many directions. The third stanza shows the leaves lying all over the sidewalk.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>"}, {"stem": "The poet writes that the wind “came walking down our street / on tall and restless, unseen feet.” What does this language do?", "opts": ["It describes the wind as if it were a person.", "It shows that the speaker is afraid of the wind.", "It tells exactly how fast the wind was blowing.", "It compares the wind to embers by using the word “like.”"], "ci": 0, "exp": "Wind cannot really walk or have feet. Giving it human actions is called personification. The poem does use “like” later, but that compares the <i>leaves</i> to embers.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>"}, {"stem": "How is the poem “Autumn Wind” different from the article “How a Hurricane Grows”?", "opts": ["Both texts use rhyme to make facts about weather easier to remember.", "“Autumn Wind” uses rhyme and imagination to describe the wind, while “How a Hurricane Grows” explains facts about how storms work.", "“Autumn Wind” explains why wind blows, while “How a Hurricane Grows” tells a story about one family.", "“How a Hurricane Grows” describes the wind as a person, while “Autumn Wind” uses numbers and measurements."], "ci": 1, "exp": "The poem rhymes (“street / feet,” “gate / late”) and imagines the wind walking and knocking. The article gives facts, such as “Once its winds reach 74 miles per hour, the storm is officially classified as a hurricane.”", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p><br><strong>How a Hurricane Grows</strong><br><p style=\"margin:0 0 8px;\">A hurricane begins as a cluster of thunderstorms drifting over warm tropical ocean water. When the surface of the sea reaches about 80 degrees Fahrenheit, huge amounts of water evaporate, and the warm, moist air rises rapidly. As this air climbs, it cools and forms towering clouds, releasing heat that pulls even more air upward. Because Earth rotates, the rising air begins to spin, and the storm organizes into a giant spiral. At its center is the eye, where the sky is calm and often cloudless, surrounded by a wall of the most violent winds.</p><p style=\"margin:0 0 8px;\">Once its winds reach 74 miles per hour, the storm is officially classified as a hurricane. Hurricanes gain strength as long as they remain over warm water, but they weaken quickly after moving over land or colder seas, where their supply of moisture is cut off. Even so, a weakening hurricane can push a surge of seawater onto adjacent coastlines and drop more than a foot of rain. Today, forecasters use satellites and specially equipped airplanes to track each storm and warn communities days in advance.</p>"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function renderResults(){

  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
