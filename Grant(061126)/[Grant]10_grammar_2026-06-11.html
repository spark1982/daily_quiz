<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Grammar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}
.date-label{font-size:2rem;font-weight:800;text-align:center;color:#185FA5;background:#fff;padding:10px 0 2px}
.title{text-align:center;font-size:1.4rem;font-weight:700;color:#185FA5;background:#fff;padding:2px 0 4px}
.attempts{text-align:center;font-size:0.9rem;color:#555;background:#fff;padding:2px 0 10px}
.container{max-width:700px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden}
.dot-nav{display:flex;flex-wrap:wrap;gap:5px;padding:12px 14px;background:#f7f9fc;border-bottom:1px solid #e0e6ef;justify-content:center}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;cursor:pointer;border:2px solid #c5d2e0;background:#e8edf4;color:#333}
.dot.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.dot.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.dot.active{border-color:#185FA5;background:#d0e4f7;color:#185FA5}
.results-pill{background:#185FA5;color:#fff;border-radius:20px;padding:4px 14px;font-size:0.8rem;font-weight:600}
#quizArea{display:none;padding:20px 20px 10px}
.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:0.75rem;font-weight:600;margin-bottom:10px}
.q-counter{font-size:0.85rem;color:#666;margin-bottom:6px}
.sent-box{background:#f0f5ff;border-left:4px solid #185FA5;border-radius:4px;padding:12px 16px;margin-bottom:14px;font-size:1rem;font-style:italic;color:#111;line-height:1.6;font-weight:500}
.sent-label{font-size:0.75rem;font-weight:700;color:#185FA5;margin-bottom:4px;font-style:normal;text-transform:uppercase}
.q-text{font-size:1.05rem;line-height:1.7;color:#111;margin-bottom:16px}
.options{display:grid;gap:10px}
.opt-btn{width:100%;text-align:left;padding:12px 16px;border-radius:8px;border:2px solid transparent;background:#e8edf4;color:#111111;font-size:1rem;cursor:pointer;transition:.15s;line-height:1.5}
.opt-btn:hover{border-color:#185FA5}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.opt-btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.explain{margin-top:14px;padding:12px;background:#f0f5ff;border-left:4px solid #185FA5;border-radius:4px;font-size:0.9rem;color:#222;line-height:1.5}
.nav-btns{display:flex;gap:10px;margin-top:18px;padding-bottom:10px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer}
.btn-blue{background:#185FA5;color:#fff}.btn-gray{background:#e8edf4;color:#333}
#resultsArea{display:none;padding:20px}
.res-header{font-size:1.2rem;font-weight:700;color:#185FA5;margin-bottom:14px;text-align:center}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;margin-bottom:18px}
.res-card{padding:8px;border-radius:8px;background:#f0f4f8;cursor:pointer;text-align:center;font-size:0.82rem;font-weight:600;border:2px solid transparent}
.res-card.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.res-card.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.res-card.skipped{background:#fff3cd;border-color:#e6a817;color:#7a5500}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:28px;max-width:340px;width:90%;text-align:center}
.modal h3{margin-bottom:10px;color:#185FA5}.modal p{margin-bottom:18px;color:#444;font-size:.95rem}
.modal-btns{display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>
<div class="container">
<div class="date-label">2026-06-11</div>
<div class="title">[Grant] Grammar</div>
<div class="attempts" id="attemptsLabel">Total Attempts: 0</div>
<div class="dot-nav" id="dotNav"></div>
<div id="quizArea"></div>
<div id="resultsArea"></div>
</div>
<div class="modal-overlay" id="freshModal">
<div class="modal"><h3>Start Fresh</h3><p>This will reset all progress.</p>
<div class="modal-btns"><button class="btn btn-blue" onclick="doFresh()">Reset</button><button class="btn btn-gray" onclick="closeFreshModal()">Cancel</button></div></div>
</div>
<script>
(function(){
const KEY='quiz_grantgrammar_20_v1';
const ATT_KEY='quiz_grantgrammar_attempts_v1';
var S1='Every summer, my older sister quickly teaches swimming lessons at the nearby community pool.';
var S2='The cheerful students eagerly finished their difficult homework before dinner.';
var qs=[
// Q1-10: Regular grammar
{tag:'Subject-Verb Agreement',sent:null,q:'Choose the sentence with the CORRECT subject-verb agreement.',
 opts:['The team of players are ready for the championship.','The team of players were ready for the championship.','Neither the captain nor the players was ready for the match.','Neither the captain nor the players were ready for the match.'],ci:3,
 exp:'"Neither...nor" pairs two subjects. The verb agrees with the closer subject — "players" (plural), so "were" is correct.'},
{tag:'Pronoun Case',sent:null,q:'Choose the sentence that uses pronouns CORRECTLY.',
 opts:['Between you and I, this assignment is really difficult.','Between you and me, this assignment is really difficult.','Him and I went to the library after school.','Her and me finished the project on time.'],ci:1,
 exp:'"Between" is a preposition, so it takes object pronouns. "You and me" is correct; "I" would be the subject form, which is wrong after a preposition.'},
{tag:'Apostrophes',sent:null,q:'Which sentence uses the apostrophe CORRECTLY for plural possession?',
 opts:['The students\' projects were displayed in the hallway.','The students\'s projects were displayed in the hallway.','The students projects were displayed in the hallway.','The student\'s projects were displayed in the hallway.'],ci:0,
 exp:'For a plural noun already ending in -s (students), add only an apostrophe: students\'. Adding \'s again (students\'s) is incorrect.'},
{tag:'Comma Usage',sent:null,q:'Which sentence uses commas CORRECTLY?',
 opts:['Before leaving for school Marcus ate breakfast, packed his bag and kissed his mom.','Before leaving for school, Marcus ate breakfast packed his bag, and kissed his mom.','Before leaving for school, Marcus ate breakfast, packed his bag and kissed his mom.','Before leaving for school, Marcus ate breakfast, packed his bag, and kissed his mom.'],ci:3,
 exp:'Use a comma after an introductory clause ("Before leaving for school,") and use serial (Oxford) commas to separate all items in a list: "ate, packed, and kissed."'},
{tag:'Verb Tense',sent:null,q:'Choose the correct verb form: "By the time we arrived at the theater, the movie already _____ for twenty minutes."',
 opts:['starts','had been playing','played','will play'],ci:1,
 exp:'When one past action happens before another past action, use the past perfect or past perfect progressive. "Had been playing" shows the movie started and continued before our arrival.'},
{tag:'Run-On Sentences',sent:null,q:'Which of the following is NOT a run-on sentence?',
 opts:['I wanted to go to the party I didn\'t have a ride.','She loves reading mystery novels she reads three a week.','Although it was raining heavily, the game continued without delay.','The store closed early the employees all went home.'],ci:2,
 exp:'"Although it was raining heavily, the game continued without delay" is correct — it has a dependent clause, a comma, and an independent clause. The others are run-ons.'},
{tag:'Sentence Fragments',sent:null,q:'Which of the following is a COMPLETE SENTENCE and not a fragment?',
 opts:['She quickly finished all of her homework before dinner.','The tall red bicycle at the end of the driveway.','Running through the forest in the early morning light.','Whenever the alarm sounds every hour.'],ci:0,
 exp:'"She quickly finished all of her homework before dinner" has a subject (She) and a verb (finished) and expresses a complete thought. The others lack a verb or a complete thought.'},
{tag:'Homophones',sent:null,q:'Choose the CORRECT word: "The hikers left _____ backpacks by the trail entrance."',
 opts:['there','they\'re','their\'s','their'],ci:3,
 exp:'"Their" is the possessive form meaning "belonging to them." "There" is a place, "they\'re" = they are, and "their\'s" is not a real word.'},
{tag:'Adjective vs. Adverb',sent:null,q:'Choose the CORRECT comparative form: "The athlete ran _____ than anyone else on the team."',
 opts:['more quick','more quickly','quicklier','most quickly'],ci:1,
 exp:'"Quickly" is an adverb modifying "ran." To form the comparative of most adverbs ending in -ly, use "more" before them: "more quickly."'},
{tag:'Double Negatives',sent:null,q:'Which sentence is GRAMMATICALLY CORRECT — no double negatives?',
 opts:['I don\'t have no idea what happened.','She never told nobody about the surprise.','He couldn\'t find any clues at the scene.','They didn\'t see nothing unusual.'],ci:2,
 exp:'"He couldn\'t find any clues" uses one negative (couldn\'t) and a positive complement (any). The others use two negatives together, which is a grammatical error.'},
// Q11-15: Sentence Components — shared sentence S1
{tag:'Sentence Components',sent:S1,q:'What is the SUBJECT of this sentence?',
 opts:['my older sister','Every summer','quickly teaches','swimming lessons'],ci:0,
 exp:'The subject is the noun (or noun phrase) that performs the action. "My older sister" is who teaches — that is the subject. "Every summer" is an adverb phrase, and "swimming lessons" is the direct object.'},
{tag:'Sentence Components',sent:S1,q:'What is the SIMPLE PREDICATE (main verb) of this sentence?',
 opts:['quickly teaches swimming lessons','teaches swimming lessons','is teaching','teaches'],ci:3,
 exp:'The simple predicate is just the main verb without any modifiers or objects. The main verb here is "teaches."'},
{tag:'Sentence Components',sent:S1,q:'What is the DIRECT OBJECT of the verb in this sentence?',
 opts:['community pool','swimming lessons','every summer','older sister'],ci:1,
 exp:'The direct object answers "what?" after the verb. "She teaches what? — swimming lessons." That is the direct object.'},
{tag:'Sentence Components',sent:S1,q:'Which word is the ADVERB that directly modifies the verb "teaches"?',
 opts:['older','summer','quickly','nearby'],ci:2,
 exp:'"Quickly" is an adverb that answers "how" she teaches. "Older" and "nearby" are adjectives; "summer" is a noun used in an adverb phrase.'},
{tag:'Sentence Components',sent:S1,q:'Which of the following is a PREPOSITIONAL PHRASE in this sentence?',
 opts:['at the nearby community pool','my older sister','Every summer','swimming lessons'],ci:0,
 exp:'"At the nearby community pool" begins with the preposition "at" followed by the noun phrase "the nearby community pool" — that is a prepositional phrase.'},
// Q16-20: Parts of Speech — shared sentence S2
{tag:'Parts of Speech',sent:S2,q:'What part of speech is the word "cheerful" in this sentence?',
 opts:['Noun','Adverb','Verb','Adjective'],ci:3,
 exp:'"Cheerful" describes the noun "students" — words that describe nouns are adjectives.'},
{tag:'Parts of Speech',sent:S2,q:'What part of speech is the word "eagerly" in this sentence?',
 opts:['Noun','Adverb','Adjective','Verb'],ci:1,
 exp:'"Eagerly" describes how the students finished — it modifies the verb "finished." Words that modify verbs, adjectives, or other adverbs are adverbs.'},
{tag:'Parts of Speech',sent:S2,q:'What part of speech is the word "finished" in this sentence?',
 opts:['Verb','Noun','Adjective','Adverb'],ci:0,
 exp:'"Finished" is the action word — it tells what the students did. Action and state words are verbs.'},
{tag:'Parts of Speech',sent:S2,q:'What part of speech is the word "their" in this sentence?',
 opts:['Noun','Adjective','Pronoun','Conjunction'],ci:2,
 exp:'"Their" stands in place of a noun (the students) and shows possession. Words that substitute for nouns are pronouns — specifically, "their" is a possessive pronoun.'},
{tag:'Parts of Speech',sent:S2,q:'What part of speech is the word "before" as used in "before dinner"?',
 opts:['Adjective','Adverb','Conjunction','Preposition'],ci:3,
 exp:'Here "before" connects a noun object ("dinner") to the rest of the sentence, forming the phrase "before dinner." When followed by a noun, "before" functions as a preposition.'}
];

var state={cur:0,answers:{},shuffles:{},showResults:false};
function loadState(){try{var s=localStorage.getItem(KEY);if(!s)return;var p=JSON.parse(s);if(typeof p.cur!=='number'||typeof p.answers!=='object'||typeof p.shuffles!=='object')throw 0;if(p.cur<0||p.cur>=qs.length)p.cur=0;state=p;}catch(e){localStorage.removeItem(KEY);}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
function getAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
function incAttempts(){localStorage.setItem(ATT_KEY,String(getAttempts()+1));}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function getShuffled(qi){if(!state.shuffles[qi]){state.shuffles[qi]=shuffle([0,1,2,3]);saveState();}return state.shuffles[qi];}
function render(){document.getElementById('attemptsLabel').textContent='Total Attempts: '+getAttempts();buildDots();if(state.showResults){showResults();return;}showQuestion();}
function buildDots(){var nav=document.getElementById('dotNav');var html='';for(var i=0;i<qs.length;i++){var cls='dot';if(state.answers[i]===undefined){}else if(state.answers[i]===qs[i].ci)cls+=' correct';else cls+=' wrong';if(i===state.cur&&!state.showResults)cls+=' active';html+='<div class="'+cls+'" onclick="goToQ('+i+')">'+(i+1)+'</div>';}if(state.showResults)html+='<span class="results-pill">Results</span>';nav.innerHTML=html;}
function showQuestion(){var qa=document.getElementById('quizArea');document.getElementById('resultsArea').style.display='none';qa.style.display='block';var i=state.cur,q=qs[i];var order=getShuffled(i);var ans=state.answers[i];var answered=(ans!==undefined);
var html='<div class="tag-badge">'+q.tag+'</div><div class="q-counter">'+(i+1)+' / '+qs.length+'</div>';
if(q.sent){html+='<div class="sent-box"><div class="sent-label">Sentence</div>'+q.sent+'</div>';}
html+='<div class="q-text">'+q.q+'</div><div class="options">';
for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="pick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';
if(answered&&ans!==q.ci)html+='<div class="explain"><strong>Explanation:</strong> '+q.exp+'</div>';
html+='<div class="nav-btns">';if(i>0)html+='<button class="btn btn-gray" onclick="go(-1)">Prev</button>';if(i<qs.length-1)html+='<button class="btn btn-blue" onclick="go(1)">Next</button>';else html+='<button class="btn btn-blue" onclick="finishQuiz()">See Results &#8594;</button>';html+='</div>';
qa.innerHTML=html;}
function pick(oi){var i=state.cur;if(state.answers[i]!==undefined)return;state.answers[i]=oi;saveState();showQuestion();}
function go(d){state.cur+=d;if(state.cur<0)state.cur=0;if(state.cur>=qs.length)state.cur=qs.length-1;saveState();showQuestion();}
function goToQ(i){if(state.showResults){state.showResults=false;state.cur=i;saveState();render();return;}state.cur=i;saveState();showQuestion();buildDots();}
function finishQuiz(){incAttempts();state.showResults=true;saveState();render();}
function showResults(){var qa=document.getElementById('quizArea');var ra=document.getElementById('resultsArea');qa.style.display='none';ra.style.display='block';var c=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===qs[i].ci)c++;}var html='<div class="res-header">Results: '+c+' / '+qs.length+'</div><div class="res-grid">';for(var i=0;i<qs.length;i++){var a=state.answers[i];var cls='res-card ';var lbl='';if(a===undefined){cls+='skipped';lbl='Skipped';}else if(a===qs[i].ci){cls+='correct';lbl='Correct';}else{cls+='wrong';lbl='Wrong';}html+='<div class="'+cls+'" onclick="goToQ('+i+')">Q'+(i+1)+': '+lbl+'</div>';}html+='</div><div class="res-actions"><button class="btn btn-blue" onclick="startRetry()">Retry Wrong Questions</button><button class="btn btn-gray" onclick="copyRes()">Copy All Results</button><button class="btn btn-gray" onclick="confirmFresh()">Start Fresh</button></div>';ra.innerHTML=html;buildDots();}
var retryList=[],retryIdx=0,retryAnswers={};
function startRetry(){retryList=[];for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==qs[i].ci)retryList.push(i);}if(!retryList.length){alert('No wrong questions!');return;}retryIdx=0;retryAnswers={};showRetry();}
function showRetry(){var el=document.getElementById('retryArea');if(!el){el=document.createElement('div');el.id='retryArea';el.style.cssText='padding:20px';document.querySelector('.container').appendChild(el);}document.getElementById('quizArea').style.display='none';document.getElementById('resultsArea').style.display='none';el.style.display='block';if(retryIdx>=retryList.length){var c=0;for(var x=0;x<retryList.length;x++){if(retryAnswers[x]===qs[retryList[x]].ci)c++;}el.innerHTML='<div style="font-weight:700;color:#185FA5;margin-bottom:14px">Retry Complete: '+c+'/'+retryList.length+' correct</div><button class="btn btn-blue" onclick="backToResults()">Back to Results</button>';return;}var qi=retryList[retryIdx],q=qs[qi];var order=getShuffled(qi);var ans=retryAnswers[retryIdx];var answered=(ans!==undefined);
var html='<div style="font-weight:700;color:#185FA5;margin-bottom:10px">Retry '+(retryIdx+1)+'/'+retryList.length+'</div>';if(q.sent){html+='<div class="sent-box"><div class="sent-label">Sentence</div>'+q.sent+'</div>';}
html+='<div class="tag-badge">'+q.tag+'</div><div class="q-text">'+q.q+'</div><div class="options">';for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="retryPick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';if(answered&&ans!==q.ci)html+='<div class="explain">'+q.exp+'</div>';html+='<div class="nav-btns"><button class="btn btn-blue" onclick="retryNext()">'+(retryIdx<retryList.length-1?'Next':'Finish Retry')+'</button></div>';el.innerHTML=html;}
function retryPick(oi){if(retryAnswers[retryIdx]!==undefined)return;retryAnswers[retryIdx]=oi;showRetry();}
function retryNext(){retryIdx++;showRetry();}
function backToResults(){var r=document.getElementById('retryArea');if(r)r.style.display='none';state.showResults=true;saveState();render();}
function copyRes(){var lines=['[Grant] Grammar 2026-06-11'];var c=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===undefined){lines.push('Q'+(i+1)+': Skipped');}else if(a===qs[i].ci){c++;lines.push('Q'+(i+1)+': Correct');}else{lines.push('Q'+(i+1)+': Wrong');}}lines.splice(1,0,'Score: '+c+'/'+qs.length);var txt=lines.join('\n');if(navigator.clipboard)navigator.clipboard.writeText(txt);else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
function confirmFresh(){document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function doFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false};closeFreshModal();render();}
window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;
window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;
window.closeFreshModal=closeFreshModal;window.doFresh=doFresh;
window.retryPick=retryPick;window.retryNext=retryNext;window.backToResults=backToResults;
loadState();render();
})();
</script>
</body>
</html>
