<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Math</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}
.date-label{font-size:2rem;font-weight:800;text-align:center;color:#185FA5;background:#fff;padding:10px 0 2px}
.title{text-align:center;font-size:1.4rem;font-weight:700;color:#185FA5;background:#fff;padding:2px 0 4px}
.attempts{text-align:center;font-size:0.9rem;color:#555;background:#fff;padding:2px 0 10px}
.container{max-width:700px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden}
.dot-nav{display:flex;flex-wrap:wrap;gap:5px;padding:12px 14px;background:#f7f9fc;border-bottom:1px solid #e0e6ef;justify-content:center}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;cursor:pointer;border:2px solid #c5d2e0;background:#e8edf4;color:#333}
.dot.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.dot.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.dot.active{border-color:#185FA5;background:#d0e4f7;color:#185FA5}
.results-pill{background:#185FA5;color:#fff;border-radius:20px;padding:4px 14px;font-size:0.8rem;font-weight:600}
#quizArea{display:none;padding:20px 20px 10px}
.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:0.75rem;font-weight:600;margin-bottom:10px}
.q-counter{font-size:0.85rem;color:#666;margin-bottom:6px}
.q-text{font-size:1.05rem;line-height:1.7;color:#111;margin-bottom:16px}
.options{display:grid;gap:10px}
.opt-btn{width:100%;text-align:left;padding:12px 16px;border-radius:8px;border:2px solid transparent;background:#e8edf4;color:#111111;font-size:1rem;cursor:pointer;transition:.15s;line-height:1.6}
.opt-btn:hover{border-color:#185FA5}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.opt-btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.explain{margin-top:14px;padding:12px;background:#f0f5ff;border-left:4px solid #185FA5;border-radius:4px;font-size:0.9rem;color:#222;line-height:1.5}
.nav-btns{display:flex;gap:10px;margin-top:18px;padding-bottom:10px}
.btn{padding:10px 22px;border-radius:8px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer}
.btn-blue{background:#185FA5;color:#fff}.btn-gray{background:#e8edf4;color:#333}
#resultsArea{display:none;padding:20px}
.res-header{font-size:1.2rem;font-weight:700;color:#185FA5;margin-bottom:14px;text-align:center}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;margin-bottom:18px}
.res-card{padding:8px;border-radius:8px;background:#f0f4f8;cursor:pointer;text-align:center;font-size:0.82rem;font-weight:600;border:2px solid transparent}
.res-card.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}
.res-card.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}
.res-card.skipped{background:#fff3cd;border-color:#e6a817;color:#7a5500}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:28px;max-width:340px;width:90%;text-align:center}
.modal h3{margin-bottom:10px;color:#185FA5}.modal p{margin-bottom:18px;color:#444;font-size:.95rem}
.modal-btns{display:flex;gap:10px;justify-content:center}
/* Fractions */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.93em;line-height:1.1;margin:0 2px}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 4px;text-align:center;min-width:1.2em}
.frac .den{padding:0 4px;text-align:center;min-width:1.2em}
</style>
</head>
<body>
<div class="container">
<div class="date-label">2026-06-11</div>
<div class="title">[Grant] Math</div>
<div class="attempts" id="attemptsLabel">Total Attempts: 0</div>
<div class="dot-nav" id="dotNav"></div>
<div id="quizArea"></div>
<div id="resultsArea"></div>
</div>
<div class="modal-overlay" id="freshModal">
<div class="modal"><h3>Start Fresh</h3><p>This will reset all progress.</p>
<div class="modal-btns"><button class="btn btn-blue" onclick="doFresh()">Reset</button><button class="btn btn-gray" onclick="closeFreshModal()">Cancel</button></div></div>
</div>
<script>
(function(){
const KEY='quiz_grantmath_20_v1';
const ATT_KEY='quiz_grantmath_attempts_v1';
function fr(n,d){return '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';}
var qs=[
// Fractions
{tag:'Fractions',q:'Compute: '+fr(3,8)+' + '+fr(5,12)+' (Express as a fraction in simplest form.)',
 opts:[fr(19,24),fr(8,20),fr(11,20),fr(2,3)],ci:0,
 exp:'Common denominator of 8 and 12 is 24. '+fr(3,8)+'='+fr(9,24)+'; '+fr(5,12)+'='+fr(10,24)+'. Sum = '+fr(19,24)+'.'},
{tag:'Fractions',q:'Compute: '+fr(7,9)+' &minus; '+fr(1,3)+' (Express as a fraction in simplest form.)',
 opts:[fr(5,18),fr(1,2),fr(4,9),fr(5,3)],ci:2,
 exp:fr(1,3)+'='+fr(3,9)+'. So '+fr(7,9)+'&minus;'+fr(3,9)+'='+fr(4,9)+'.'},
{tag:'Fractions',q:'Compute: 2'+fr(1,3)+' &times; '+fr(3,7)+' (Express as a fraction or whole number in simplest form.)',
 opts:[fr(2,3),'1',fr(6,7),fr(7,9)],ci:1,
 exp:'Convert 2'+fr(1,3)+' = '+fr(7,3)+'. Then '+fr(7,3)+'&times;'+fr(3,7)+'='+fr(21,21)+' = 1.'},
{tag:'Fractions',q:'Compute: '+fr(5,6)+' + '+fr(3,8)+' &minus; '+fr(1,4)+' (Express as a fraction in simplest form.)',
 opts:[fr(7,12),'1'+fr(1,8),fr(4,5),fr(23,24)],ci:3,
 exp:'LCD = 24. '+fr(5,6)+'='+fr(20,24)+', '+fr(3,8)+'='+fr(9,24)+', '+fr(1,4)+'='+fr(6,24)+'. Total = '+fr(20,24)+'+'+fr(9,24)+'&minus;'+fr(6,24)+'='+fr(23,24)+'.'},
// Decimals
{tag:'Decimals',q:'Compute: 3.45 + 1.8',opts:['5.25','5.35','4.25','5.245'],ci:0,exp:'3.45 + 1.80 = 5.25.'},
{tag:'Decimals',q:'Compute: 7.2 &minus; 3.65',opts:['4.45','3.45','3.65','3.55'],ci:3,exp:'7.20 &minus; 3.65 = 3.55.'},
{tag:'Decimals',q:'Compute: 0.4 &times; 2.5',opts:['0.1','1.0','10.0','0.01'],ci:1,exp:'0.4 &times; 2.5 = 1.0. (Or: 4 &times; 25 = 100; shift decimal 2 places.)'},
{tag:'Decimals',q:'Compute: 6.15 &divide; 0.5',opts:['3.08','7.65','12.3','12.03'],ci:2,exp:'Dividing by 0.5 is the same as multiplying by 2. 6.15 &times; 2 = 12.3.'},
// Integers
{tag:'Integers',q:'Compute: (&minus;4)<sup>2</sup> &times; 3 + 60 &divide; (&minus;5) &minus; (&minus;15)',opts:['43','51','55','39'],ci:1,exp:'(&minus;4)<sup>2</sup>=16. 16&times;3=48. 60&divide;(&minus;5)=&minus;12. &minus;(&minus;15)=+15. Total: 48+(−12)+15=51.'},
{tag:'Integers',q:'Compute: 18 &minus; 3 &times; (2 + 4)<sup>2</sup> &divide; 9',opts:['12','0','6','&minus;6'],ci:2,exp:'(2+4)<sup>2</sup>=36. 3&times;36&divide;9=108&divide;9=12. 18&minus;12=6.'},
{tag:'Integers',q:'Compute: (&minus;2)<sup>3</sup> + 5 &times; (&minus;3) &minus; 4 &times; (&minus;2) + 10',opts:['&minus;3','5','3','&minus;5'],ci:3,exp:'(&minus;2)<sup>3</sup>=&minus;8. 5&times;(&minus;3)=&minus;15. 4&times;(&minus;2)=&minus;8 (so &minus;(&minus;8)=+8). 10 stays. Total: &minus;8+(−15)+8+10=&minus;5.'},
{tag:'Integers',q:'Compute: (8 &minus; 15) &times; (&minus;2) + 4<sup>2</sup> &divide; 2 &minus; 3',opts:['19','7','11','15'],ci:0,exp:'8&minus;15=&minus;7. (&minus;7)&times;(&minus;2)=14. 4<sup>2</sup>=16. 16&divide;2=8. 14+8&minus;3=19.'},
// Unit Conversion
{tag:'Unit Conversion',q:'5.5 hours is equal to how many minutes?',opts:['300','315','320','330'],ci:3,exp:'1 hour = 60 min. 5.5 &times; 60 = 330 minutes.'},
{tag:'Unit Conversion',q:'0.4 pounds is equal to how many ounces? (1 pound = 16 ounces)',opts:['6.4 oz','4.0 oz','8.4 oz','6.0 oz'],ci:0,exp:'0.4 &times; 16 = 6.4 ounces.'},
{tag:'Unit Conversion',q:'3 feet 9 inches is equal to how many inches total? (1 foot = 12 inches)',opts:['39 in','45 in','33 in','42 in'],ci:1,exp:'3 &times; 12 = 36 inches. 36 + 9 = 45 inches.'},
{tag:'Unit Conversion',q:'195 minutes is equal to how many hours and minutes?',opts:['3 hr 5 min','2 hr 55 min','3 hr 15 min','3 hr 25 min'],ci:2,exp:'195 &divide; 60 = 3 remainder 15. So 195 minutes = 3 hours 15 minutes.'},
// Exponent Laws
{tag:'Exponent Laws',q:'Simplify: 2<sup>3</sup> &times; 2<sup>5</sup>',opts:['2<sup>8</sup>','2<sup>15</sup>','2<sup>2</sup>','4<sup>8</sup>'],ci:0,exp:'When multiplying same base: add exponents. 2<sup>3+5</sup> = 2<sup>8</sup>.'},
{tag:'Exponent Laws',q:'Simplify: (a<sup>2</sup>b<sup>3</sup>)<sup>4</sup>',opts:['a<sup>6</sup>b<sup>7</sup>','a<sup>8</sup>b<sup>12</sup>','a<sup>8</sup>b<sup>7</sup>','a<sup>6</sup>b<sup>12</sup>'],ci:1,exp:'Power rule: multiply exponents. (a<sup>2</sup>)<sup>4</sup>=a<sup>8</sup>; (b<sup>3</sup>)<sup>4</sup>=b<sup>12</sup>. Answer: a<sup>8</sup>b<sup>12</sup>.'},
{tag:'Exponent Laws',q:'Simplify: (x<sup>4</sup>y<sup>2</sup>)<sup>3</sup>',opts:['x<sup>7</sup>y<sup>5</sup>','x<sup>12</sup>y<sup>5</sup>','x<sup>12</sup>y<sup>6</sup>','x<sup>7</sup>y<sup>6</sup>'],ci:2,exp:'(x<sup>4</sup>)<sup>3</sup>=x<sup>12</sup>; (y<sup>2</sup>)<sup>3</sup>=y<sup>6</sup>. Answer: x<sup>12</sup>y<sup>6</sup>.'},
{tag:'Exponent Laws',q:'Simplify: (2x<sup>3</sup>)<sup>4</sup>',opts:['8x<sup>7</sup>','8x<sup>12</sup>','2x<sup>12</sup>','16x<sup>12</sup>'],ci:3,exp:'2<sup>4</sup>=16; (x<sup>3</sup>)<sup>4</sup>=x<sup>12</sup>. Answer: 16x<sup>12</sup>.'}
];

var state={cur:0,answers:{},shuffles:{},showResults:false};
function loadState(){try{var s=localStorage.getItem(KEY);if(!s)return;var p=JSON.parse(s);if(typeof p.cur!=='number'||typeof p.answers!=='object'||typeof p.shuffles!=='object')throw 0;if(p.cur<0||p.cur>=qs.length)p.cur=0;state=p;}catch(e){localStorage.removeItem(KEY);}}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));}
function getAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
function incAttempts(){localStorage.setItem(ATT_KEY,String(getAttempts()+1));}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function getShuffled(qi){if(!state.shuffles[qi]){state.shuffles[qi]=shuffle([0,1,2,3]);saveState();}return state.shuffles[qi];}
function render(){document.getElementById('attemptsLabel').textContent='Total Attempts: '+getAttempts();buildDots();if(state.showResults){showResults();return;}showQuestion();}
function buildDots(){var nav=document.getElementById('dotNav');var html='';for(var i=0;i<qs.length;i++){var cls='dot';if(state.answers[i]===undefined){}else if(state.answers[i]===qs[i].ci)cls+=' correct';else cls+=' wrong';if(i===state.cur&&!state.showResults)cls+=' active';html+='<div class="'+cls+'" onclick="goToQ('+i+')">'+(i+1)+'</div>';}if(state.showResults)html+='<span class="results-pill">Results</span>';nav.innerHTML=html;}
function showQuestion(){var qa=document.getElementById('quizArea');document.getElementById('resultsArea').style.display='none';qa.style.display='block';var i=state.cur,q=qs[i];var order=getShuffled(i);var ans=state.answers[i];var answered=(ans!==undefined);var html='<div class="tag-badge">'+q.tag+'</div><div class="q-counter">'+(i+1)+' / '+qs.length+'</div><div class="q-text">'+q.q+'</div><div class="options">';for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="pick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';if(answered&&ans!==q.ci)html+='<div class="explain"><strong>Explanation:</strong> '+q.exp+'</div>';html+='<div class="nav-btns">';if(i>0)html+='<button class="btn btn-gray" onclick="go(-1)">Prev</button>';if(i<qs.length-1)html+='<button class="btn btn-blue" onclick="go(1)">Next</button>';else html+='<button class="btn btn-blue" onclick="finishQuiz()">See Results &#8594;</button>';html+='</div>';qa.innerHTML=html;}
function pick(oi){var i=state.cur;if(state.answers[i]!==undefined)return;state.answers[i]=oi;saveState();showQuestion();}
function go(d){state.cur+=d;if(state.cur<0)state.cur=0;if(state.cur>=qs.length)state.cur=qs.length-1;saveState();showQuestion();}
function goToQ(i){if(state.showResults){state.showResults=false;state.cur=i;saveState();render();return;}state.cur=i;saveState();showQuestion();buildDots();}
function finishQuiz(){incAttempts();state.showResults=true;saveState();render();}
function showResults(){var qa=document.getElementById('quizArea');var ra=document.getElementById('resultsArea');qa.style.display='none';ra.style.display='block';var c=0,w=0,s=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===undefined)s++;else if(a===qs[i].ci)c++;else w++;}var html='<div class="res-header">Results: '+c+' / '+qs.length+'</div><div class="res-grid">';for(var i=0;i<qs.length;i++){var a=state.answers[i];var cls='res-card ',lbl='';if(a===undefined){cls+='skipped';lbl='Skipped';}else if(a===qs[i].ci){cls+='correct';lbl='Correct';}else{cls+='wrong';lbl='Wrong';}html+='<div class="'+cls+'" onclick="goToQ('+i+')">Q'+(i+1)+': '+lbl+'</div>';}html+='</div><div class="res-actions"><button class="btn btn-blue" onclick="startRetry()">Retry Wrong Questions</button><button class="btn btn-gray" onclick="copyRes()">Copy All Results</button><button class="btn btn-gray" onclick="confirmFresh()">Start Fresh</button></div>';ra.innerHTML=html;buildDots();}
var retryList=[],retryIdx=0,retryAnswers={};
function startRetry(){retryList=[];for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==qs[i].ci)retryList.push(i);}if(!retryList.length){alert('No wrong questions!');return;}retryIdx=0;retryAnswers={};showRetry();}
function showRetry(){var el=document.getElementById('retryArea');if(!el){el=document.createElement('div');el.id='retryArea';el.style.cssText='padding:20px';document.querySelector('.container').appendChild(el);}document.getElementById('quizArea').style.display='none';document.getElementById('resultsArea').style.display='none';el.style.display='block';if(retryIdx>=retryList.length){var c=0;for(var x=0;x<retryList.length;x++){if(retryAnswers[x]===qs[retryList[x]].ci)c++;}el.innerHTML='<div style="font-weight:700;color:#185FA5;margin-bottom:14px">Retry Complete: '+c+'/'+retryList.length+' correct</div><button class="btn btn-blue" onclick="backToResults()">Back to Results</button>';return;}var qi=retryList[retryIdx],q=qs[qi];var order=getShuffled(qi);var ans=retryAnswers[retryIdx];var answered=(ans!==undefined);var html='<div style="font-weight:700;color:#185FA5;margin-bottom:10px">Retry '+(retryIdx+1)+'/'+retryList.length+'</div><div class="tag-badge">'+q.tag+'</div><div class="q-text">'+q.q+'</div><div class="options">';for(var k=0;k<4;k++){var oi=order[k];var cls='opt-btn';if(answered){if(oi===q.ci)cls+=' reveal';if(oi===ans&&ans!==q.ci)cls+=' wrong';}html+='<button class="'+cls+'" onclick="retryPick('+oi+')">'+q.opts[oi]+'</button>';}html+='</div>';if(answered&&ans!==q.ci)html+='<div class="explain">'+q.exp+'</div>';html+='<div class="nav-btns"><button class="btn btn-blue" onclick="retryNext()">'+(retryIdx<retryList.length-1?'Next':'Finish Retry')+'</button></div>';el.innerHTML=html;}
function retryPick(oi){if(retryAnswers[retryIdx]!==undefined)return;retryAnswers[retryIdx]=oi;showRetry();}
function retryNext(){retryIdx++;showRetry();}
function backToResults(){var r=document.getElementById('retryArea');if(r)r.style.display='none';state.showResults=true;saveState();render();}
function copyRes(){var lines=['[Grant] Math 2026-06-11'];var c=0,w=0,s=0;for(var i=0;i<qs.length;i++){var a=state.answers[i];if(a===undefined){s++;lines.push('Q'+(i+1)+': Skipped');}else if(a===qs[i].ci){c++;lines.push('Q'+(i+1)+': Correct');}else{w++;lines.push('Q'+(i+1)+': Wrong');}}lines.splice(1,0,'Score: '+c+'/'+qs.length);var txt=lines.join('\n');if(navigator.clipboard)navigator.clipboard.writeText(txt);else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}
function confirmFresh(){document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function doFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false};closeFreshModal();render();}
window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;
window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;
window.closeFreshModal=closeFreshModal;window.doFresh=doFresh;
window.retryPick=retryPick;window.retryNext=retryNext;window.backToResults=backToResults;
loadState();render();
})();
</script>
</body>
</html>
