var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261021";
var RAW_QUESTIONS = [{"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The canal was finished in 1817, and boats began using it right away.", "The canal stretched 363 miles through forests, swamps, and hills.", "Some people made fun of the plan before the canal was built.", "Workers dug the canal almost entirely by hand with shovels and picks."], "ci": 0, "exp": "The passage says “Construction began in 1817” and “the canal opened in 1825,” so it was not finished in 1817. The other three statements match the passage, including that people “mocked the plan as ‘Clinton’s Ditch.’”", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Erie Canal</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods across New York was slow and expensive. A wagon pulled by horses could take weeks to haul flour from the Great Lakes region to New York City, and the cost of the trip often doubled the price of the flour. Governor DeWitt Clinton believed a canal could solve this problem, but many people mocked the plan as &ldquo;Clinton&rsquo;s Ditch.&rdquo; They doubted that workers could dig a channel 363 miles long through thick forests, swamps, and hills.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, cleared trees and dug almost entirely by hand with shovels and picks. Because the land rose and fell along the route, engineers designed 83 locks that lifted boats up hills and lowered them on the other side.</p><p style=\"margin:0 0 8px;\">When the canal opened in 1825, Clinton traveled its full length by boat and poured a barrel of Lake Erie water into the Atlantic Ocean. The results were remarkable. Shipping costs fell by about ninety percent, and towns such as Buffalo, Rochester, and Syracuse flourished along the route. Within a few decades, New York City had become the busiest port in the nation.</p>"}, {"stem": "In the third paragraph, the word “flourished” most likely means —", "opts": ["flooded often", "competed with one another", "were left empty", "grew and did well"], "ci": 3, "exp": "Right before this, the passage says “Shipping costs fell by about ninety percent,” and then that New York City became the busiest port — clues that the towns grew and did well. The canal carried boats, but nothing says the towns “flooded often.”", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Erie Canal</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods across New York was slow and expensive. A wagon pulled by horses could take weeks to haul flour from the Great Lakes region to New York City, and the cost of the trip often doubled the price of the flour. Governor DeWitt Clinton believed a canal could solve this problem, but many people mocked the plan as &ldquo;Clinton&rsquo;s Ditch.&rdquo; They doubted that workers could dig a channel 363 miles long through thick forests, swamps, and hills.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, cleared trees and dug almost entirely by hand with shovels and picks. Because the land rose and fell along the route, engineers designed 83 locks that lifted boats up hills and lowered them on the other side.</p><p style=\"margin:0 0 8px;\">When the canal opened in 1825, Clinton traveled its full length by boat and poured a barrel of Lake Erie water into the Atlantic Ocean. The results were remarkable. Shipping costs fell by about ninety percent, and towns such as Buffalo, Rochester, and Syracuse flourished along the route. Within a few decades, New York City had become the busiest port in the nation.</p>"}, {"stem": "Which list shows these events in the order they happened?", "opts": ["Engineers build locks for the hills &rarr; construction begins &rarr; Clinton pours Lake Erie water into the ocean", "Construction begins &rarr; Clinton pours Lake Erie water into the ocean &rarr; engineers build locks for the hills", "Construction begins &rarr; engineers build locks for the hills &rarr; Clinton pours Lake Erie water into the ocean", "Clinton pours Lake Erie water into the ocean &rarr; construction begins &rarr; engineers build locks for the hills"], "ci": 2, "exp": "The passage says “Construction began in 1817,” then describes the locks built along the route, and only “When the canal opened in 1825” did Clinton pour the barrel of water. Pouring the water was part of the opening, so it could not come before the locks were built.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Erie Canal</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods across New York was slow and expensive. A wagon pulled by horses could take weeks to haul flour from the Great Lakes region to New York City, and the cost of the trip often doubled the price of the flour. Governor DeWitt Clinton believed a canal could solve this problem, but many people mocked the plan as &ldquo;Clinton&rsquo;s Ditch.&rdquo; They doubted that workers could dig a channel 363 miles long through thick forests, swamps, and hills.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, cleared trees and dug almost entirely by hand with shovels and picks. Because the land rose and fell along the route, engineers designed 83 locks that lifted boats up hills and lowered them on the other side.</p><p style=\"margin:0 0 8px;\">When the canal opened in 1825, Clinton traveled its full length by boat and poured a barrel of Lake Erie water into the Atlantic Ocean. The results were remarkable. Shipping costs fell by about ninety percent, and towns such as Buffalo, Rochester, and Syracuse flourished along the route. Within a few decades, New York City had become the busiest port in the nation.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["DeWitt Clinton became famous for pouring Lake Erie water into the Atlantic Ocean.", "Irish immigrants did most of the digging on the Erie Canal, using shovels and picks.", "The Erie Canal, once doubted by many people, made shipping cheaper and helped towns and cities across New York grow.", "Wagons were too slow to carry flour from the Great Lakes region to New York City."], "ci": 2, "exp": "The whole passage moves from the doubts about “Clinton’s Ditch,” to the building of the canal, to its “remarkable” results. The sentence about Irish immigrants is true, but it is only one detail from the second paragraph.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Erie Canal</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods across New York was slow and expensive. A wagon pulled by horses could take weeks to haul flour from the Great Lakes region to New York City, and the cost of the trip often doubled the price of the flour. Governor DeWitt Clinton believed a canal could solve this problem, but many people mocked the plan as &ldquo;Clinton&rsquo;s Ditch.&rdquo; They doubted that workers could dig a channel 363 miles long through thick forests, swamps, and hills.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, cleared trees and dug almost entirely by hand with shovels and picks. Because the land rose and fell along the route, engineers designed 83 locks that lifted boats up hills and lowered them on the other side.</p><p style=\"margin:0 0 8px;\">When the canal opened in 1825, Clinton traveled its full length by boat and poured a barrel of Lake Erie water into the Atlantic Ocean. The results were remarkable. Shipping costs fell by about ninety percent, and towns such as Buffalo, Rochester, and Syracuse flourished along the route. Within a few decades, New York City had become the busiest port in the nation.</p>"}, {"stem": "According to the passage, what does the length of each waggle tell the other bees?", "opts": ["how far away the flowers are", "how many workers should leave the hive", "how much nectar the flowers hold", "which direction to fly compared with the sun"], "ci": 0, "exp": "The passage says, “The length of each waggle signals distance: the longer the waggle, the farther the trip.” The direction is shown by the straight run, not by the length of the waggle.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Honeybee&rsquo;s Dance</strong><br><p style=\"margin:0 0 8px;\">When a honeybee discovers a patch of flowers rich in nectar, it does not keep the discovery to itself. It returns to the hive and performs a pattern of movements that scientists call the waggle dance. The bee runs forward in a straight line while shaking its body from side to side, then circles back and repeats the run again and again.</p><p style=\"margin:0 0 8px;\">The dance is remarkably precise. The direction of the straight run reveals where the flowers are compared with the position of the sun. If the bee runs straight up the honeycomb, the food lies toward the sun; if it runs to the right, the flowers are to the right of the sun. The length of each waggle signals distance: the longer the waggle, the farther the trip. A dance that was inaccurate by even a few degrees could send the workers to the wrong field.</p><p style=\"margin:0 0 8px;\">Because the inside of the hive is dark, the other bees cannot simply watch. Instead, they follow the dancer closely and sense its vibrations with their antennae. Within minutes, dozens of workers fly off toward the same flowers. In the 1940s, an Austrian scientist named Karl von Frisch spent years observing marked bees to decode this behavior, and in 1973 he shared a Nobel Prize for his work.</p>"}, {"stem": "In the word “inaccurate,” what does the prefix <i>in-</i> mean?", "opts": ["not", "before", "very", "again"], "ci": 0, "exp": "<i>In-</i> at the start of a word often means “not,” so <i>inaccurate</i> means “not accurate” or “not exact” — a dance that was off “by even a few degrees.” It does not mean “very,” which would change the meaning to “extremely accurate.”", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>The Honeybee&rsquo;s Dance</strong><br><p style=\"margin:0 0 8px;\">When a honeybee discovers a patch of flowers rich in nectar, it does not keep the discovery to itself. It returns to the hive and performs a pattern of movements that scientists call the waggle dance. The bee runs forward in a straight line while shaking its body from side to side, then circles back and repeats the run again and again.</p><p style=\"margin:0 0 8px;\">The dance is remarkably precise. The direction of the straight run reveals where the flowers are compared with the position of the sun. If the bee runs straight up the honeycomb, the food lies toward the sun; if it runs to the right, the flowers are to the right of the sun. The length of each waggle signals distance: the longer the waggle, the farther the trip. A dance that was inaccurate by even a few degrees could send the workers to the wrong field.</p><p style=\"margin:0 0 8px;\">Because the inside of the hive is dark, the other bees cannot simply watch. Instead, they follow the dancer closely and sense its vibrations with their antennae. Within minutes, dozens of workers fly off toward the same flowers. In the 1940s, an Austrian scientist named Karl von Frisch spent years observing marked bees to decode this behavior, and in 1973 he shared a Nobel Prize for his work.</p>"}, {"stem": "What can the reader infer about the waggle dance?", "opts": ["It helps a hive gather food quickly from a newly found patch of flowers.", "It can only be used on days when the sun is hidden.", "Only the oldest bees in a hive know how to perform it.", "Scientists still do not understand what its movements mean."], "ci": 0, "exp": "After the dance, “Within minutes, dozens of workers fly off toward the same flowers,” so the dance lets many bees reach new food fast. Scientists do understand it — von Frisch worked “to decode this behavior” and won a Nobel Prize.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Honeybee&rsquo;s Dance</strong><br><p style=\"margin:0 0 8px;\">When a honeybee discovers a patch of flowers rich in nectar, it does not keep the discovery to itself. It returns to the hive and performs a pattern of movements that scientists call the waggle dance. The bee runs forward in a straight line while shaking its body from side to side, then circles back and repeats the run again and again.</p><p style=\"margin:0 0 8px;\">The dance is remarkably precise. The direction of the straight run reveals where the flowers are compared with the position of the sun. If the bee runs straight up the honeycomb, the food lies toward the sun; if it runs to the right, the flowers are to the right of the sun. The length of each waggle signals distance: the longer the waggle, the farther the trip. A dance that was inaccurate by even a few degrees could send the workers to the wrong field.</p><p style=\"margin:0 0 8px;\">Because the inside of the hive is dark, the other bees cannot simply watch. Instead, they follow the dancer closely and sense its vibrations with their antennae. Within minutes, dozens of workers fly off toward the same flowers. In the 1940s, an Austrian scientist named Karl von Frisch spent years observing marked bees to decode this behavior, and in 1973 he shared a Nobel Prize for his work.</p>"}, {"stem": "Why do the other bees follow the dancer closely?", "opts": ["The dancer will guide them out of the hive to the flowers.", "The hive is dark, so they must sense the dancer’s vibrations with their antennae.", "They are learning how to perform the dance themselves.", "They want to take the nectar the dancer brought back."], "ci": 1, "exp": "The passage explains, “Because the inside of the hive is dark, the other bees cannot simply watch. Instead, they follow the dancer closely and sense its vibrations.” The passage never says the dancer leads them to the flowers; the workers “fly off” on their own.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>The Honeybee&rsquo;s Dance</strong><br><p style=\"margin:0 0 8px;\">When a honeybee discovers a patch of flowers rich in nectar, it does not keep the discovery to itself. It returns to the hive and performs a pattern of movements that scientists call the waggle dance. The bee runs forward in a straight line while shaking its body from side to side, then circles back and repeats the run again and again.</p><p style=\"margin:0 0 8px;\">The dance is remarkably precise. The direction of the straight run reveals where the flowers are compared with the position of the sun. If the bee runs straight up the honeycomb, the food lies toward the sun; if it runs to the right, the flowers are to the right of the sun. The length of each waggle signals distance: the longer the waggle, the farther the trip. A dance that was inaccurate by even a few degrees could send the workers to the wrong field.</p><p style=\"margin:0 0 8px;\">Because the inside of the hive is dark, the other bees cannot simply watch. Instead, they follow the dancer closely and sense its vibrations with their antennae. Within minutes, dozens of workers fly off toward the same flowers. In the 1940s, an Austrian scientist named Karl von Frisch spent years observing marked bees to decode this behavior, and in 1973 he shared a Nobel Prize for his work.</p>"}, {"stem": "Why does Ravi remind Hana of what she told him before his science presentation?", "opts": ["He thinks she has forgotten to announce the book fair.", "He wants to point out that she made a mistake earlier.", "He hopes she will let him read the announcements instead.", "He wants to give her the same encouragement that once helped him."], "ci": 3, "exp": "Ravi repeats her own advice: “Mistakes are only embarrassing if you let the var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
