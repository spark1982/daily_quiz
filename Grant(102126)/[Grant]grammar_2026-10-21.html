<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261021";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have writed", "NO CHANGE", "have written", "has wrote"], "ci": 2, "exp": "After <i>have</i>, use the past participle: <i>write → wrote → <b>written</b></i>. <i>Since Friday, I <b>have written</b> three pages in my nature journal.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Email to Jess</strong><br><b>(1)</b> Hi Jess, I just got back from our camping trip at Pine Lake! <b>(2)</b> Since Friday, I <u>have wrote</u> three pages in my nature journal. <b>(3)</b> Mom gave Ava and <u>I</u> a map of the hiking trails. <b>(4)</b> We wanted to hike to the waterfall. <b>(5)</b> The trail was closed because of a fallen tree. <b>(6)</b> On the last night of the trip we roasted marshmallows by the fire. <b>(7)</b> I hope you can come with us next summer!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "me", "mine", "myself"], "ci": 1, "exp": "Ava and ___ receive the map, so use the object pronoun. Try it alone: “Mom gave <i>me</i> a map.” <i>Mom gave Ava and <b>me</b> a map of the hiking trails.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Email to Jess</strong><br><b>(1)</b> Hi Jess, I just got back from our camping trip at Pine Lake! <b>(2)</b> Since Friday, I <u>have wrote</u> three pages in my nature journal. <b>(3)</b> Mom gave Ava and <u>I</u> a map of the hiking trails. <b>(4)</b> We wanted to hike to the waterfall. <b>(5)</b> The trail was closed because of a fallen tree. <b>(6)</b> On the last night of the trip we roasted marshmallows by the fire. <b>(7)</b> I hope you can come with us next summer!"}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["Because we wanted to hike to the waterfall, the trail was closed because of a fallen tree.", "We wanted to hike to the waterfall, the trail was closed because of a fallen tree.", "We wanted to hike to the waterfall, so the trail was closed because of a fallen tree.", "We wanted to hike to the waterfall, but the trail was closed because of a fallen tree."], "ci": 3, "exp": "The two ideas go against each other (they wanted to go, but they couldn’t), so join them with a comma and <i>but</i>. Using only a comma makes a comma splice, and <i>so</i> wrongly says their wish closed the trail.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Email to Jess</strong><br><b>(1)</b> Hi Jess, I just got back from our camping trip at Pine Lake! <b>(2)</b> Since Friday, I <u>have wrote</u> three pages in my nature journal. <b>(3)</b> Mom gave Ava and <u>I</u> a map of the hiking trails. <b>(4)</b> We wanted to hike to the waterfall. <b>(5)</b> The trail was closed because of a fallen tree. <b>(6)</b> On the last night of the trip we roasted marshmallows by the fire. <b>(7)</b> I hope you can come with us next summer!"}, {"stem": "Where should a comma be added in sentence 6?", "opts": ["On the last night, of the trip we roasted marshmallows by the fire.", "On the last night of the trip, we roasted marshmallows by the fire.", "On the last night of the trip we roasted, marshmallows by the fire.", "On the last night of the trip we roasted marshmallows, by the fire."], "ci": 1, "exp": "Put a comma after a long introductory phrase, before the main part of the sentence begins: <i>On the last night of the trip<b>,</b> we roasted marshmallows by the fire.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Email to Jess</strong><br><b>(1)</b> Hi Jess, I just got back from our camping trip at Pine Lake! <b>(2)</b> Since Friday, I <u>have wrote</u> three pages in my nature journal. <b>(3)</b> Mom gave Ava and <u>I</u> a map of the hiking trails. <b>(4)</b> We wanted to hike to the waterfall. <b>(5)</b> The trail was closed because of a fallen tree. <b>(6)</b> On the last night of the trip we roasted marshmallows by the fire. <b>(7)</b> I hope you can come with us next summer!"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["beat", "is beating", "has beat", "NO CHANGE"], "ci": 0, "exp": "The subject is <i>wings</i> (plural), not <i>hummingbird</i>, so use the plural verb: <i>The wings of a ruby-throated hummingbird <b>beat</b> about fifty times every second.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Tiny Hovering Birds</strong><br><b>(1)</b> Hummingbirds are the smallest birds in North America, and some weigh less than a nickel. <b>(2)</b> The wings of a ruby-throated hummingbird <u>beats</u> about fifty times every second. <b>(3)</b> Scientists <u>have measured</u> their hearts at more than one thousand beats per minute. <b>(4)</b> Hummingbirds drink sweet nectar. <b>(5)</b> Nectar gives them the quick energy they need. <b>(6)</b> Every fall, a hummingbird flies south to spend its winter in Mexico or Central America. <b>(7)</b> Its a long trip for such a tiny bird."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["has measured", "NO CHANGE", "have measure", "measuring"], "ci": 1, "exp": "<i>Scientists</i> is plural, so <i>have</i> is right, and <i>measured</i> is the correct past participle. The sentence is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Tiny Hovering Birds</strong><br><b>(1)</b> Hummingbirds are the smallest birds in North America, and some weigh less than a nickel. <b>(2)</b> The wings of a ruby-throated hummingbird <u>beats</u> about fifty times every second. <b>(3)</b> Scientists <u>have measured</u> their hearts at more than one thousand beats per minute. <b>(4)</b> Hummingbirds drink sweet nectar. <b>(5)</b> Nectar gives them the quick energy they need. <b>(6)</b> Every fall, a hummingbird flies south to spend its winter in Mexico or Central America. <b>(7)</b> Its a long trip for such a tiny bird."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["Hummingbirds drink sweet nectar, which gives them the quick energy they need.", "Hummingbirds drink sweet nectar, it gives them the quick energy they need.", "Hummingbirds drink sweet nectar, where it gives them the quick energy they need.", "Hummingbirds drink sweet nectar, who gives them the quick energy they need."], "ci": 0, "exp": "Use <i>which</i> for a thing like nectar (<i>who</i> is only for people). Joining with “, it” makes a comma splice. <i>Hummingbirds drink sweet nectar, <b>which</b> gives them the quick energy they need.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Tiny Hovering Birds</strong><br><b>(1)</b> Hummingbirds are the smallest birds in North America, and some weigh less than a nickel. <b>(2)</b> The wings of a ruby-throated hummingbird <u>beats</u> about fifty times every second. <b>(3)</b> Scientists <u>have measured</u> their hearts at more than one thousand beats per minute. <b>(4)</b> Hummingbirds drink sweet nectar. <b>(5)</b> Nectar gives them the quick energy they need. <b>(6)</b> Every fall, a hummingbird flies south to spend its winter in Mexico or Central America. <b>(7)</b> Its a long trip for such a tiny bird."}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Hummingbirds are the smallest birds in North America, and some weigh less than a nickel.", "Its a long trip for such a tiny bird.", "Hummingbirds drink sweet nectar.", "Every fall, a hummingbird flies south to spend its winter in Mexico or Central America."], "ci": 1, "exp": "<i>Its</i> shows ownership; <i>it’s</i> means “it is.” The sentence means “It is a long trip,” so write <i><b>It’s</b> a long trip for such a tiny bird.</i> In “its winter,” <i>its</i> is correct because the winter belongs to the hummingbird.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Tiny Hovering Birds</strong><br><b>(1)</b> Hummingbirds are the smallest birds in North America, and some weigh less than a nickel. <b>(2)</b> The wings of a ruby-throated hummingbird <u>beats</u> about fifty times every second. <b>(3)</b> Scientists <u>have measured</u> their hearts at more than one thousand beats per minute. <b>(4)</b> Hummingbirds drink sweet nectar. <b>(5)</b> Nectar gives them the quick energy they need. <b>(6)</b> Every fall, a hummingbird flies south to spend its winter in Mexico or Central America. <b>(7)</b> Its a long trip for such a tiny bird."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["kneaded", "are kneading", "NO CHANGE", "will knead"], "ci": 0, "exp": "The diary tells what already happened (“we <i>mixed</i>”), so stay in the past tense: <i>Then we <b>kneaded</b> the dough for ten whole minutes.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Bread Day</strong><br><b>(1)</b> Dear Diary, today Dad finally taught me how to bake bread. <b>(2)</b> First we mixed flour, water, yeast, and a little salt in a big bowl. <b>(3)</b> Then we <u>knead</u> the dough for ten whole minutes. <b>(4)</b> By the time the timer rang, the dough <u>had rose</u> to twice its size. <b>(5)</b> Because the kitchen smelled so good while it baked. <b>(6)</b> The finished loaf turned out <u>real</u> soft inside. <b>(7)</b> Next weekend, we will try cinnamon rolls!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["had risen", "had raised", "NO CHANGE", "has rised"], "ci": 0, "exp": "After <i>had</i>, use the past participle of <i>rise</i>: <i>rise → rose → <b>risen</b></i>. (<i>Raise</i> needs an object, like “raise your hand.”) <i>The dough <b>had risen</b> to twice its size.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Bread Day</strong><br><b>(1)</b> Dear Diary, today Dad finally taught me how to bake bread. <b>(2)</b> First we mixed flour, water, yeast, and a little salt in a big bowl. <b>(3)</b> Then we <u>knead</u> the dough for ten whole minutes. <b>(4)</b> By the time the timer rang, the dough <u>had rose</u> to twice its size. <b>(5)</b> Because the kitchen smelled so good while it baked. <b>(6)</b> The finished loaf turned out <u>real</u> soft inside. <b>(7)</b> Next weekend, we will try cinnamon rolls!"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["realer", "NO CHANGE", "really", "more real"], "ci": 2, "exp": "<i>Soft</i> is an adjective, so it needs an adverb to describe how soft: <i>really</i>. <i>The finished loaf turned out <b>really</b> soft inside.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Bread Day</strong><br><b>(1)</b> Dear Diary, today Dad finally taught me how to bake bread. <b>(2)</b> First we mixed flour, water, yeast, and a little salt in a big bowl. <b>(3)</b> Then we <u>knead</u> the dough for ten whole minutes. <b>(4)</b> By the time the timer rang, the dough <u>had rose</u> to twice its size. <b>(5)</b> Because the kitchen smelled so good while it baked. <b>(6)</b> The finished loaf turned out <u>real</u> soft inside. <b>(7)</b> Next weekend, we will try cinnamon rolls!"}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Next weekend, we will try cinnamon rolls!", "Because the kitchen smelled so good while it baked.", "Dear Diary, today Dad finally taught me how to bake bread.", "First we mixed flour, water, yeast, and a little salt in a big bowl."], "ci": 1, "exp": "A sentence that starts with <i>Because</i> needs a main idea to finish it. Fix it like this: <i>Because the kitchen smelled so good while it baked, <b>I could hardly wait to taste it.</b></i> The list sentence is correct — it uses commas between the items.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Bread Day</strong><br><b>(1)</b> Dear Diary, today Dad finally taught me how to bake bread. <b>(2)</b> First we mixed flour, water, yeast, and a little salt in a big bowl. <b>(3)</b> Then we <u>knead</u> the dough for ten whole minutes. <b>(4)</b> By the time the timer rang, the dough <u>had rose</u> to twice its size. <b>(5)</b> Because the kitchen smelled so good while it baked. <b>(6)</b> The finished loaf turned out <u>real</u> soft inside. <b>(7)</b> Next weekend, we will try cinnamon rolls!"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["Me and Maya", "Her and I", "Maya and me", "NO CHANGE"], "ci": 3, "exp": "Maya and ___ are doing the running, so use the subject pronoun <i>I</i>. Try it alone: “<i>I</i> ran across the park.” The sentence is already correct.", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Pepper Runs Off</strong><br><b>(1)</b> <u>Maya and I</u> ran across the park as fast as we could. <b>(2)</b> Our neighbor&rsquo;s puppy, Pepper, had slipped out of her collar. <b>(3)</b> &ldquo;We should check by the pond&rdquo; Maya said. <b>(4)</b> We asked the man <u>who</u> walks his poodle there every morning. <b>(5)</b> He pointed to a bench where a small brown puppy was sniffing a sandwich wrapper. <b>(6)</b> I slipped the <u>dogs</u> collar back over her head. <b>(7)</b> Pepper wagged her tail as if nothing had happened."}, {"stem": "Where should a comma be added in sentence 3?", "opts": ["&ldquo;We should check by the pond&rdquo; Maya, said.", "&ldquo;We should check by the pond,&rdquo; Maya said.", "&ldquo;We, should check by the pond&rdquo; Maya said.", "&ldquo;We should check, by the pond&rdquo; Maya said."], "ci": 1, "exp": "When a quotation comes before words like <i>Maya said</i>, put a comma at the end of the spoken words, inside the closing quotation mark: <i>“We should check by the pond<b>,</b>” Maya said.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Pepper Runs Off</strong><br><b>(1)</b> <u>Maya and I</u> ran across the park as fast as we could. <b>(2)</b> Our neighbor&rsquo;s puppy, Pepper, had slipped out of her collar. <b>(3)</b> &ldquo;We should check by the pond&rdquo; Maya said. <b>(4)</b> We asked the man <u>who</u> walks his poodle there every morning. <b>(5)</b> He pointed to a bench where a small brown puppy was sniffing a sandwich wrapper. <b>(6)</b> I slipped the <u>dogs</u> collar back over her head. <b>(7)</b> Pepper wagged her tail as if nothing had happened."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["which", "NO CHANGE", "whom", "whose"], "ci": 1, "exp": "Use <i>who</i> for a person who does the action (the man walks his poodle). The sentence is already correct. <i>Which</i> is for things, and <i>whom</i> is for a person who receives an action.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Pepper Runs Off</strong><br><b>(1)</b> <u>Maya and I</u> ran across the park as fast as we could. <b>(2)</b> Our neighbor&rsquo;s puppy, Pepper, had slipped out of her collar. <b>(3)</b> &ldquo;We should check by the pond&rdquo; Maya said. <b>(4)</b> We asked the man <u>who</u> walks his poodle there every morning. <b>(5)</b> He pointed to a bench where a small brown puppy was sniffing a sandwich wrapper. <b>(6)</b> I slipped the <u>dogs</u> collar back over her head. <b>(7)</b> Pepper wagged her tail as if nothing had happened."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["NO CHANGE", "dog is", "dogs&rsquo;", "dog&rsquo;s"], "ci": 3, "exp": "The collar belongs to one dog, so add an apostrophe and <i>s</i>: <i>I slipped the <b>dog’s</b> collar back over her head.</i> <i>Dogs’</i> would mean more than one dog.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Pepper Runs Off</strong><br><b>(1)</b> <u>Maya and I</u> ran across the park as fast as we could. <b>(2)</b> Our neighbor&rsquo;s puppy, Pepper, had slipped out o Night Is Coming!</strong><br><b>(1)</b> Science Night starts at 6:00 on Thursday. <b>(2)</b> In the school gym. <b>(3)</b> Each of the families <u>is</u> invited to explore hands-on experiments with their children. <b>(4)</b> Our fifth graders have builded a model volcano that really erupts with foamy red lava. <b>(5)</b> Volunteers should arrive <u>on</u> 5:45 to help set up the tables. <b>(6)</b> Free popcorn and lemonade will be served by the front doors of the school. <b>(7)</b> We hope to see you and your whole family there!"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
