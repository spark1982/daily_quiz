<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Grammar</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; background:#ffffff; color:#111111; }
  .dateBar { font-size:2rem; font-weight:800; text-align:center; color:#185FA5; background:#ffffff; padding:14px 10px 0 10px; }
  .titleBar { font-size:1.4rem; font-weight:800; text-align:center; color:#185FA5; padding:6px 10px; }
  .attemptsBar { text-align:center; font-size:0.95rem; color:#185FA5; padding-bottom:8px; }
  .dots { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; padding:8px; max-width:760px; margin:0 auto; }
  .dot { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.78rem; font-weight:700; cursor:pointer; color:#ffffff; background:#9aa4af; border:2px solid transparent; }
  .dot.correct { background:#185FA5; }
  .dot.wrong { background:#E24B4A; }
  .dot.results { background:#185FA5; border-radius:14px; width:auto; padding:0 12px; }
  .container { max-width:760px; margin:0 auto; padding:14px; }
  .tag { display:inline-block; background:#185FA5; color:#ffffff; border-radius:999px; padding:4px 14px; font-size:0.8rem; font-weight:700; margin-bottom:10px; }
  .refSentence { background:#f4f7fb; border-radius:14px; padding:16px; font-size:1rem; font-weight:700; line-height:1.6; margin-bottom:12px; text-align:center; }
  .qBox { background:#f4f7fb; border-radius:14px; padding:22px; font-size:1.08rem; font-weight:700; line-height:1.6; min-height:60px; display:flex; align-items:center; justify-content:center; text-align:center; }
  .options { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .opt { background:#e8edf4; color:#111111; border:2px solid transparent; border-radius:12px; padding:14px 16px; font-size:1rem; text-align:left; cursor:pointer; }
  .opt.correctOpt { background:#E1F5EE; border-color:#1D9E75; color:#085041; }
  .opt.wrongOpt { background:#FCEBEB; border-color:#E24B4A; color:#501313; }
  .explain { margin-top:14px; background:#FCEBEB; border:2px solid #E24B4A; color:#501313; border-radius:12px; padding:14px 16px; font-size:0.95rem; line-height:1.5; display:none; }
  .navRow { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .navBtn { flex:1; background:#185FA5; color:#ffffff; border:none; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; }
  .navBtn:disabled { background:#b7c6d8; cursor:default; }
  .counter { text-align:center; margin-top:10px; font-size:0.95rem; color:#185FA5; font-weight:700; }
  .summaryGrid { display:grid; grid-template-columns: repeat(auto-fill, minmax(48px,1fr)); gap:8px; margin:14px 0; }
  .sumCard { border-radius:10px; padding:10px 4px; text-align:center; font-weight:700; cursor:pointer; font-size:0.78rem; color:#ffffff; }
  .sumCard.c { background:#1D9E75; }
  .sumCard.w { background:#E24B4A; }
  .sumCard.s { background:#9aa4af; }
  .resultBtns { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .resultBtn { background:#185FA5; color:#ffffff; border:none; border-radius:12px; padding:14px; font-size:1rem; font-weight:700; cursor:pointer; }
  .resultBtn.secondary { background:#e8edf4; color:#111111; }
  .modalOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:50; }
  .modalBox { background:#ffffff; border-radius:14px; padding:22px; max-width:340px; width:88%; text-align:center; }
  .modalBtns { display:flex; gap:10px; margin-top:16px; }
  .modalBtns button { flex:1; border:none; border-radius:10px; padding:12px; font-size:0.95rem; font-weight:700; cursor:pointer; }
  .mCancel { background:#e8edf4; color:#111111; }
  .mConfirm { background:#E24B4A; color:#ffffff; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#185FA5; color:#ffffff; padding:10px 20px; border-radius:10px; font-size:0.9rem; display:none; }
  @media (max-width:480px){ .dateBar{font-size:1.5rem;} .titleBar{font-size:1.15rem;} .qBox{font-size:1rem;} }
</style>
</head>
<body>
  <div class="dateBar">June 7, 2026</div>
  <div class="titleBar">[Grant] Grammar</div>
  <div class="attemptsBar" id="attemptsBar">Total Attempts: 0</div>
  <div class="dots" id="dots"></div>
  <div class="container">
    <div id="quizArea" style="display:none;">
      <span class="tag" id="typeTag">Topic</span>
      <div class="refSentence" id="refSentence" style="display:none;"></div>
      <div class="qBox" id="qPrompt"></div>
      <div class="options" id="options"></div>
      <div class="explain" id="explain"></div>
      <div class="navRow">
        <button class="navBtn" id="prevBtn">Prev</button>
        <button class="navBtn" id="nextBtn">Next</button>
      </div>
      <div class="counter" id="counter"></div>
    </div>
    <div id="resultsArea" style="display:none;">
      <h2 style="color:#185FA5;">Results</h2>
      <div class="counter" id="resultSummary"></div>
      <div class="summaryGrid" id="summaryGrid"></div>
      <div class="resultBtns">
        <button class="resultBtn" id="copyBtn">Copy All Results</button>
        <button class="resultBtn" id="retryBtn">Retry Wrong Questions</button>
        <button class="resultBtn secondary" id="freshBtn">Start Fresh</button>
      </div>
    </div>
  </div>

  <div class="modalOverlay" id="modalOverlay">
    <div class="modalBox">
      <p style="font-size:1.05rem; font-weight:700; color:#111111;">Start over and clear all saved progress?</p>
      <div class="modalBtns">
        <button class="mCancel" id="modalCancel">Cancel</button>
        <button class="mConfirm" id="modalConfirm">Start Fresh</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Copied to clipboard</div>

<script>
(function(){
  var TOPIC = 'grammar6';
  var QCOUNT = 20;
  var STATE_KEY = 'quiz_' + TOPIC + '_' + QCOUNT + '_v1';
  var ATTEMPTS_KEY = 'quiz_' + TOPIC + '_attempts_v1';

  var SENTENCE_A = 'After the heavy rainstorm ended, the curious puppy cautiously explored the muddy backyard and discovered a shiny silver coin.';
  var SENTENCE_B = 'Every morning, the talented young musician practiced quietly in the small wooden cabin near the lake.';

  var QUESTIONS = [
    // Irregular noun plurals (2)
    { tag:'Irregular Plural Nouns', q:'What is the correct plural form of the word "child"?',
      correct:'children', distractors:['childs','childes','childrens'],
      explain:'"Child" has an irregular plural form, "children," instead of simply adding -s or -es. Forms like "childs" or "childrens" do not follow standard English usage.' },
    { tag:'Irregular Plural Nouns', q:'What is the correct plural form of the word "mouse" (the small animal)?',
      correct:'mice', distractors:['mouses','mices','meece'],
      explain:'"Mouse" changes its internal vowel sound to form the irregular plural "mice," similar to "goose" → "geese." Adding -s or -es to "mouse" is incorrect.' },
    // Irregular verb past tense (2)
    { tag:'Irregular Verb — Past Tense', q:'What is the correct past tense form of the verb "swim"?',
      correct:'swam', distractors:['swimmed','swum','swimming'],
      explain:'"Swim" is an irregular verb that changes its vowel to form the simple past tense: swim → swam. "Swum" is the past participle (used with helping verbs like "have"), and "swimmed" is not a standard form.' },
    { tag:'Irregular Verb — Past Tense', q:'What is the correct past tense form of the verb "bring"?',
      correct:'brought', distractors:['bringed','brung','brang'],
      explain:'"Bring" is an irregular verb whose past tense is "brought," not formed by adding -ed. "Bringed," "brung," and "brang" are common but incorrect forms.' },
    // Irregular verb 3rd person singular (2)
    { tag:'Irregular Verb — Third-Person Singular', q:'Which sentence correctly uses the third-person singular form of the verb "have"?',
      correct:'She has two dogs.', distractors:['She haves two dogs.','She have two dogs.','She having two dogs.'],
      explain:'The verb "have" changes irregularly in the third-person singular to "has," rather than adding -s to make "haves." "She has two dogs" is the correct present-tense form.' },
    { tag:'Irregular Verb — Third-Person Singular', q:'Which sentence correctly uses the third-person singular form of the verb "go"?',
      correct:'He goes to school every day.', distractors:['He go to school every day.','He goed to school every day.','He going to school every day.'],
      explain:'Verbs ending in -o, like "go," form the third-person singular by adding -es: go → goes. "Goed" is an incorrect attempt at a past tense, and "go"/"going" do not agree with the singular subject "he" in the present tense.' },
    // Verb progressive irregular form (1)
    { tag:'Irregular Progressive Verb Form', q:'What is the correct present progressive (-ing) form of the verb "swim"?',
      correct:'swimming', distractors:['swiming','swimmming','sniming'],
      explain:'When a short verb ends in a single vowel followed by a single consonant (like "swim"), the final consonant is doubled before adding -ing: swim → swimming. "Swiming" is missing the doubled "m," and the other choices are misspelled.' },
    // Possessive (creative)
    { tag:'Possessives', q:'Joy and Mia share one backpack. Which sentence shows the correct possessive form for the backpack that belongs to both of them together?',
      correct:'Joy and Mia’s backpack is bright orange.', distractors:['Joy’s and Mia’s backpack is bright orange.','Joys and Mias’ backpack is bright orange.','Joy and Mia’ backpack is bright orange.'],
      explain:'When two people jointly own one item, the apostrophe + s is added only to the last name: "Joy and Mia’s backpack." Adding ’s to both names would suggest they each own a separate backpack, which does not match the situation described.' },
    // Capitalization & punctuation (1)
    { tag:'Capitalization & Punctuation', q:'Which option correctly capitalizes and punctuates this sentence: "my aunt karen lives in chicago and she visits us every summer"?',
      correct:'My aunt Karen lives in Chicago, and she visits us every summer.', distractors:['my Aunt karen lives in chicago, and She visits us every Summer.','My aunt karen lives in chicago and she visits us every summer.','My Aunt Karen lives in chicago and she visits us every summer'],
      explain:'The sentence needs a capital letter at the start, capitalized proper nouns ("Karen" and "Chicago"), a comma before the coordinating conjunction "and" joining two independent clauses, and a period at the end. Only the first option applies all of these rules correctly.' },
    // Irregular comparative/superlative (1)
    { tag:'Irregular Comparatives', q:'Which word is the correct comparative form of "good," as in "This book is ___ than the last one"?',
      correct:'better', distractors:['gooder','more good','best'],
      explain:'"Good" has an irregular comparative form, "better," rather than adding -er or "more." "Best" is the superlative form, used when comparing three or more things, not the comparative form for two.' },
    // Sentence parts (Q11-15) — all using SENTENCE_A
    { tag:'Sentence Parts', sentence:SENTENCE_A,
      q:'Look at the sentence above. What is the complete subject of the main clause?',
      correct:'the curious puppy', distractors:['the heavy rainstorm','the muddy backyard','a shiny silver coin'],
      explain:'The complete subject includes the simple subject and all the words that describe it. "The curious puppy" names who performed the actions in the main clause — exploring and discovering.' },
    { tag:'Sentence Parts', sentence:SENTENCE_A,
      q:'Look at the sentence above. What is the simple subject of the main clause?',
      correct:'puppy', distractors:['rainstorm','backyard','coin'],
      explain:'The simple subject is the single key noun at the heart of the complete subject, without its describing words. In "the curious puppy," the simple subject is "puppy."' },
    { tag:'Sentence Parts', sentence:SENTENCE_A,
      q:'Look at the sentence above. Which word is the main verb that tells what the puppy did first?',
      correct:'explored', distractors:['ended','discovered','cautiously'],
      explain:'The sentence describes two actions joined by "and": the puppy "explored" the backyard and then "discovered" a coin. "Explored" is the first action the puppy performed, while "ended" belongs to the introductory clause about the rainstorm.' },
    { tag:'Sentence Parts', sentence:SENTENCE_A,
      q:'Look at the sentence above. What is the direct object of the verb "discovered"?',
      correct:'a shiny silver coin', distractors:['the muddy backyard','the curious puppy','the heavy rainstorm'],
      explain:'A direct object receives the action of the verb. The puppy "discovered" something — "a shiny silver coin" — so that phrase is the direct object of "discovered." "The muddy backyard" is instead the direct object of "explored."' },
    { tag:'Sentence Parts', sentence:SENTENCE_A,
      q:'Look at the sentence above. What kind of clause is "After the heavy rainstorm ended"?',
      correct:'An introductory subordinate (dependent) clause that tells when the main action happened', distractors:['An independent clause that could stand alone as its own sentence','A direct object that receives the action of the main verb','A possessive phrase that shows ownership'],
      explain:'"After the heavy rainstorm ended" cannot stand alone as a complete sentence — it depends on the main clause and tells when the puppy explored the yard. This makes it an introductory subordinate (dependent) clause, set off by a comma.' },
    // Parts of speech (Q16-20) — all using SENTENCE_B
    { tag:'Parts of Speech', sentence:SENTENCE_B,
      q:'Look at the sentence above. What part of speech is the word "talented"?',
      correct:'adjective', distractors:['noun','verb','adverb'],
      explain:'"Talented" describes the noun "musician," telling what kind of musician he or she is. A word that describes a noun is an adjective.' },
    { tag:'Parts of Speech', sentence:SENTENCE_B,
      q:'Look at the sentence above. What part of speech is the word "practiced"?',
      correct:'verb', distractors:['noun','adjective','preposition'],
      explain:'"Practiced" tells what the musician did, so it expresses an action. A word that shows an action or state is a verb.' },
    { tag:'Parts of Speech', sentence:SENTENCE_B,
      q:'Look at the sentence above. What part of speech is the word "quietly"?',
      correct:'adverb', distractors:['adjective','noun','conjunction'],
      explain:'"Quietly" describes how the musician practiced — it modifies the verb "practiced" by telling the manner of the action. A word that modifies a verb (often answering "how?") is an adverb.' },
    { tag:'Parts of Speech', sentence:SENTENCE_B,
      q:'Look at the sentence above. What part of speech is the word "musician"?',
      correct:'noun', distractors:['verb','adjective','preposition'],
      explain:'"Musician" names a person, so it functions as a noun. It is also the simple subject of the sentence — the person performing the action.' },
    { tag:'Parts of Speech', sentence:SENTENCE_B,
      q:'Look at the sentence above. What part of speech is the phrase "near the lake"?',
      correct:'a prepositional (adverbial) phrase that tells where the cabin is located', distractors:['a noun phrase that renames the subject','a verb phrase that shows an action','an adjective that directly describes the musician'],
      explain:'"Near the lake" begins with the preposition "near" and answers the question "where?" about the cabin’s location. A group of words beginning with a preposition that modifies another word is a prepositional phrase functioning here as an adverbial phrase of place.' }
  ];
  QUESTIONS.forEach(function(item){
    item.options = [item.correct].concat(item.distractors);
  });

  var state = null;
  function defaultState(){ return { cur: 0, answers: {}, shuffles: {}, showResults: false }; }

  function loadState(){
    try {
      var raw = localStorage.getItem(STATE_KEY);
      if(!raw) return defaultState();
      var s = JSON.parse(raw);
      if(typeof s !== 'object' || s === null) throw new Error('bad');
      if(typeof s.cur !== 'number' || s.cur < 0 || s.cur >= QUESTIONS.length) throw new Error('bad cur');
      if(typeof s.answers !== 'object' || s.answers === null) throw new Error('bad answers');
      if(typeof s.shuffles !== 'object' || s.shuffles === null) throw new Error('bad shuffles');
      if(typeof s.showResults !== 'boolean') s.showResults = false;
      return s;
    } catch(e){
      try { localStorage.removeItem(STATE_KEY); } catch(e2){}
      return defaultState();
    }
  }
  function saveState(){ try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch(e){} }

  function getAttempts(){ try { return parseInt(localStorage.getItem(ATTEMPTS_KEY) || '0', 10) || 0; } catch(e){ return 0; } }
  function incAttempts(){
    var n = getAttempts() + 1;
    try { localStorage.setItem(ATTEMPTS_KEY, String(n)); } catch(e){}
    document.getElementById('attemptsBar').textContent = 'Total Attempts: ' + n;
  }

  function shuffleIndices(n){
    var arr = [];
    for(var i=0;i<n;i++) arr.push(i);
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    return arr;
  }
  function getShuffleFor(qIndex){
    var key = String(qIndex);
    if(!state.shuffles[key]){ state.shuffles[key] = shuffleIndices(QUESTIONS[qIndex].options.length); saveState(); }
    return state.shuffles[key];
  }

  var dotsEl, quizArea, resultsArea, refSentenceEl, qPrompt, optionsEl, explainEl, typeTag, counterEl, prevBtn, nextBtn;

  function buildDots(){
    dotsEl.innerHTML = '';
    for(var i=0;i<QUESTIONS.length;i++){
      var d = document.createElement('div');
      d.className = 'dot';
      d.textContent = String(i+1);
      d.addEventListener('click', (function(idx){ return function(){ goTo(idx); }; })(i));
      dotsEl.appendChild(d);
    }
    var rd = document.createElement('div');
    rd.className = 'dot results';
    rd.id = 'resultsDot';
    rd.textContent = 'Results';
    rd.addEventListener('click', function(){ if(state.showResults){ showResultsScreen(); } });
    dotsEl.appendChild(rd);
  }
  function refreshDots(){
    for(var i=0;i<QUESTIONS.length;i++){
      var d = dotsEl.children[i];
      d.classList.remove('correct','wrong');
      var rec = state.answers[i];
      if(rec){
        if(QUESTIONS[i].options[rec.choiceIndex] === QUESTIONS[i].correct) d.classList.add('correct');
        else d.classList.add('wrong');
      }
    }
    document.getElementById('resultsDot').style.display = state.showResults ? 'flex' : 'none';
  }

  function render(){
    try {
      if(state.showResults){ showResultsScreen(); return; }
      quizArea.style.display = 'block';
      resultsArea.style.display = 'none';
      var idx = state.cur;
      var question = QUESTIONS[idx];
      typeTag.textContent = question.tag;
      if(question.sentence){
        refSentenceEl.textContent = '"' + question.sentence + '"';
        refSentenceEl.style.display = 'block';
      } else {
        refSentenceEl.style.display = 'none';
        refSentenceEl.textContent = '';
      }
      qPrompt.textContent = question.q;
      optionsEl.innerHTML = '';
      explainEl.style.display = 'none';
      explainEl.textContent = '';

      var order = getShuffleFor(idx);
      var rec = state.answers[idx];
      for(var k=0;k<order.length;k++){
        var optIdx = order[k];
        var btn = document.createElement('button');
        btn.className = 'opt';
        btn.textContent = question.options[optIdx];
        (function(optIdx){ btn.addEventListener('click', function(){ selectAnswer(idx, optIdx); }); })(optIdx);
        optionsEl.appendChild(btn);
      }
      if(rec) applyAnswerStyles(idx);

      prevBtn.disabled = (idx === 0);
      nextBtn.textContent = (idx === QUESTIONS.length - 1) ? 'See Results →' : 'Next';
      counterEl.textContent = (idx+1) + ' / ' + QUESTIONS.length;
      refreshDots();
      saveState();
    } catch(e){
      quizArea.innerHTML = '<p style="color:#E24B4A;">Something went wrong loading this question. Please use the dots above to navigate.</p>';
      quizArea.style.display = 'block';
    }
  }

  function applyAnswerStyles(qIdx){
    var question = QUESTIONS[qIdx];
    var rec = state.answers[qIdx];
    var order = getShuffleFor(qIdx);
    var correctIndex = -1;
    for(var i=0;i<question.options.length;i++){ if(question.options[i] === question.correct){ correctIndex = i; break; } }
    var btns = optionsEl.children;
    for(var k=0;k<order.length;k++){
      var optIdx = order[k];
      btns[k].classList.remove('correctOpt','wrongOpt');
      if(optIdx === correctIndex) btns[k].classList.add('correctOpt');
      else if(optIdx === rec.choiceIndex && optIdx !== correctIndex) btns[k].classList.add('wrongOpt');
      btns[k].disabled = true;
    }
    if(rec.choiceIndex !== correctIndex){
      explainEl.textContent = question.explain;
      explainEl.style.display = 'block';
    }
  }

  function selectAnswer(qIdx, optIdx){
    if(state.answers[qIdx]) return;
    state.answers[qIdx] = { choiceIndex: optIdx };
    saveState();
    render();
  }
  function goTo(idx){ state.cur = idx; state.showResults = false; saveState(); render(); }
  function next(){
    if(state.cur === QUESTIONS.length - 1){
      state.showResults = true;
      incAttempts();
      saveState();
      render();
    } else { state.cur += 1; saveState(); render(); }
  }
  function prev(){ if(state.cur > 0){ state.cur -= 1; saveState(); render(); } }

  function showResultsScreen(){
    quizArea.style.display = 'none';
    resultsArea.style.display = 'block';
    var correct=0, wrong=0, skipped=0;
    var grid = document.getElementById('summaryGrid');
    grid.innerHTML = '';
    for(var i=0;i<QUESTIONS.length;i++){
      var rec = state.answers[i];
      var card = document.createElement('div');
      card.textContent = String(i+1);
      if(!rec){ card.className='sumCard s'; skipped++; }
      else if(QUESTIONS[i].options[rec.choiceIndex] === QUESTIONS[i].correct){ card.className='sumCard c'; correct++; }
      else { card.className='sumCard w'; wrong++; }
      card.addEventListener('click', (function(idx){ return function(){ state.showResults=false; state.cur=idx; saveState(); render(); }; })(i));
      grid.appendChild(card);
    }
    document.getElementById('resultSummary').textContent =
      'Correct: ' + correct + '   Wrong: ' + wrong + '   Skipped: ' + skipped + '   (' + correct + ' / ' + QUESTIONS.length + ')';
    refreshDots();
  }

  function copyResults(){
    var correct=0, wrong=0, skipped=0;
    for(var i=0;i<QUESTIONS.length;i++){
      var rec = state.answers[i];
      if(!rec) skipped++;
      else if(QUESTIONS[i].options[rec.choiceIndex] === QUESTIONS[i].correct) correct++;
      else wrong++;
    }
    var text = '[Grant] Grammar — June 7, 2026\nScore: ' + correct + ' / ' + QUESTIONS.length +
      '\nCorrect: ' + correct + '   Wrong: ' + wrong + '   Skipped: ' + skipped;
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try {
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text);
      else document.execCommand('copy');
    } catch(e){ try { document.execCommand('copy'); } catch(e2){} }
    document.body.removeChild(ta);
    var toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(function(){ toast.style.display = 'none'; }, 1800);
  }

  var retrySession = null;
  function startRetry(){
    var wrongIdx = [];
    for(var i=0;i<QUESTIONS.length;i++){
      var rec = state.answers[i];
      if(!rec || QUESTIONS[i].options[rec.choiceIndex] !== QUESTIONS[i].correct) wrongIdx.push(i);
    }
    if(wrongIdx.length === 0){ alertModalText('No wrong or skipped questions to retry.'); return; }
    retrySession = { indices: wrongIdx, cur: 0, answers: {}, shuffles: {} };
    renderRetry();
  }
  function renderRetry(){
    quizArea.style.display = 'block';
    resultsArea.style.display = 'none';
    dotsEl.style.display = 'none';
    var pos = retrySession.cur;
    var qIdx = retrySession.indices[pos];
    var question = QUESTIONS[qIdx];
    typeTag.textContent = question.tag + ' (Retry)';
    if(question.sentence){
      refSentenceEl.textContent = '"' + question.sentence + '"';
      refSentenceEl.style.display = 'block';
    } else {
      refSentenceEl.style.display = 'none';
      refSentenceEl.textContent = '';
    }
    qPrompt.textContent = question.q;
    optionsEl.innerHTML = '';
    explainEl.style.display = 'none';
    explainEl.textContent = '';

    if(!retrySession.shuffles[pos]) retrySession.shuffles[pos] = shuffleIndices(question.options.length);
    var order = retrySession.shuffles[pos];
    var rec = retrySession.answers[pos];
    var correctIndex = -1;
    for(var i=0;i<question.options.length;i++){ if(question.options[i] === question.correct){ correctIndex = i; break; } }

    for(var k=0;k<order.length;k++){
      var optIdx = order[k];
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = question.options[optIdx];
      if(rec){
        btn.disabled = true;
        if(optIdx === correctIndex) btn.classList.add('correctOpt');
        else if(optIdx === rec.choiceIndex) btn.classList.add('wrongOpt');
      } else {
        (function(optIdx){ btn.addEventListener('click', function(){ retrySession.answers[pos] = { choiceIndex: optIdx }; renderRetry(); }); })(optIdx);
      }
      optionsEl.appendChild(btn);
    }
    if(rec && rec.choiceIndex !== correctIndex){ explainEl.textContent = question.explain; explainEl.style.display = 'block'; }
    prevBtn.disabled = (pos === 0);
    nextBtn.textContent = (pos === retrySession.indices.length - 1) ? 'See Results →' : 'Next';
    counterEl.textContent = 'Retry ' + (pos+1) + ' / ' + retrySession.indices.length;
    nextBtn.onclick = function(){
      if(pos === retrySession.indices.length - 1) showRetryMiniResults();
      else { retrySession.cur += 1; renderRetry(); }
    };
    prevBtn.onclick = function(){ if(pos > 0){ retrySession.cur -= 1; renderRetry(); } };
  }
  function showRetryMiniResults(){
    var c=0, w=0;
    for(var i=0;i<retrySession.indices.length;i++){
      var rec = retrySession.answers[i];
      var qIdx = retrySession.indices[i];
      if(rec && QUESTIONS[qIdx].options[rec.choiceIndex] === QUESTIONS[qIdx].correct) c++; else w++;
    }
    quizArea.style.display = 'none';
    resultsArea.style.display = 'block';
    document.getElementById('summaryGrid').innerHTML = '';
    document.getElementById('resultSummary').textContent =
      'Retry session finished — Correct: ' + c + '   Still wrong: ' + w + '   (' + c + ' / ' + retrySession.indices.length + ')';
    var backBtn = document.createElement('button');
    backBtn.className = 'resultBtn';
    backBtn.textContent = 'Back to Full Results';
    backBtn.addEventListener('click', function(){
      retrySession = null;
      dotsEl.style.display = 'flex';
      restoreMainNav();
      showResultsScreen();
    });
    document.querySelector('.resultBtns').insertBefore(backBtn, document.querySelector('.resultBtns').firstChild);
  }
  function restoreMainNav(){ nextBtn.onclick = next; prevBtn.onclick = prev; }

  function alertModalText(msg){
    var overlay = document.getElementById('modalOverlay');
    var box = overlay.querySelector('.modalBox');
    box.innerHTML = '<p style="font-size:1.05rem; font-weight:700; color:#111111;">' + msg + '</p><div class="modalBtns"><button class="mConfirm" id="modalOk" style="flex:1;">OK</button></div>';
    overlay.style.display = 'flex';
    document.getElementById('modalOk').addEventListener('click', function(){ overlay.style.display = 'none'; });
  }

  function startFresh(){
    try { localStorage.removeItem(STATE_KEY); } catch(e){}
    state = defaultState();
    retrySession = null;
    dotsEl.style.display = 'flex';
    restoreMainNav();
    saveState();
    render();
  }

  document.addEventListener('DOMContentLoaded', function(){
    dotsEl = document.getElementById('dots');
    quizArea = document.getElementById('quizArea');
    resultsArea = document.getElementById('resultsArea');
    refSentenceEl = document.getElementById('refSentence');
    qPrompt = document.getElementById('qPrompt');
    optionsEl = document.getElementById('options');
    explainEl = document.getElementById('explain');
    typeTag = document.getElementById('typeTag');
    counterEl = document.getElementById('counter');
    prevBtn = document.getElementById('prevBtn');
    nextBtn = document.getElementById('nextBtn');

    document.getElementById('attemptsBar').textContent = 'Total Attempts: ' + getAttempts();

    buildDots();
    state = loadState();
    restoreMainNav();

    document.getElementById('copyBtn').addEventListener('click', copyResults);
    document.getElementById('retryBtn').addEventListener('click', startRetry);
    document.getElementById('freshBtn').addEventListener('click', function(){ document.getElementById('modalOverlay').style.display = 'flex'; });
    document.getElementById('modalCancel').addEventListener('click', function(){ document.getElementById('modalOverlay').style.display = 'none'; });
    document.getElementById('modalConfirm').addEventListener('click', function(){ document.getElementById('modalOverlay').style.display = 'none'; startFresh(); });

    render();
  });
})();
</script>
</body>
</html>
