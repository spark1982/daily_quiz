<style>
*{box-sizing:border-box;margin:0;padding:0}

</style>

<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_20_20260824_v1";var ATT_KEY = "quiz_grantgrammar_20_att_20260824_v1";var RAW_QUESTIONS = [{"stem": "Choose the correct irregular past-tense verb: Yesterday, the whole class ______ to the science museum.", "opts": ["goed", "went", "gone", "going"], "ci": 1, "exp": "\"went\" is the correct simple past-tense form of \"go.\" \"goed\" is not a real word, \"gone\" needs a helping verb (as in \"had gone\"), and \"going\" is the present participle, not the simple past."}, {"stem": "Which sentence uses the adverb correctly?", "opts": ["She sings beautiful.", "She sings beautifully.", "She beautiful sings.", "She sing beautifully."], "ci": 1, "exp": "\"She sings beautifully\" is correct because \"beautifully\" is an adverb that describes how she sings, and adverbs ending in \"-ly\" are the right choice to modify a verb. \"beautiful\" is an adjective and cannot modify a verb, and the other options have incorrect word order or verb form."}, {"stem": "Choose the sentence with correct subject-verb agreement.", "opts": ["The pack of wolves howl at night.", "The pack of wolves howls at night.", "The pack of wolves are howling at night, and it scare us.", "The packs of wolves howls at night."], "ci": 1, "exp": "\"The pack of wolves howls at night\" is correct because \"pack\" (singular) is the subject, not \"wolves,\" so it takes the singular verb \"howls.\" The other choices mismatch the verb form with the singular subject \"pack\" or its plural form \"packs.\""}, {"stem": "Choose the correct pronoun: My sister and ______ are going to the fair this weekend.", "opts": ["me", "I", "myself", "mine"], "ci": 1, "exp": "\"I\" is correct because the pronoun is part of the subject of the sentence (\"My sister and I are going\"), and subject pronouns like \"I\" are used in the subject position. \"me\" is an object pronoun, \"myself\" is reflexive, and \"mine\" shows possession."}, {"stem": "Which contraction correctly replaces the underlined words: \"<u>They are not</u> going to finish the project on time\"?", "opts": ["Their not", "There not", "They're not", "Theyre not"], "ci": 2, "exp": "\"They're not\" is the correct contraction of \"They are not.\" \"Their\" shows possession, \"There\" refers to a place, and \"Theyre\" is missing the required apostrophe."}, {"stem": "Which sentence is an example of an interrogative sentence?", "opts": ["Close the door before you leave.", "The door is closed.", "Did you close the door?", "What a cold room this is!"], "ci": 2, "exp": "\"Did you close the door?\" is interrogative because it asks a question and ends with a question mark. \"Close the door before you leave\" is imperative (a command), \"The door is closed\" is declarative (a statement), and \"What a cold room this is!\" is exclamatory."}, {"stem": "Which sentence capitalizes proper nouns correctly?", "opts": ["We visited grand canyon national park last Summer.", "We visited Grand Canyon National Park last summer.", "We visited Grand canyon National park last summer.", "we visited Grand Canyon National Park last Summer."], "ci": 1, "exp": "\"Grand Canyon National Park\" is a specific, official name and must be fully capitalized as a proper noun, while \"summer\" is a season and is not capitalized. The other choices either fail to capitalize the full proper noun or incorrectly capitalize the common noun \"summer.\""}, {"stem": "Choose the sentence that uses a comma correctly to join two independent clauses.", "opts": ["I wanted to go outside, but it started raining.", "I wanted to go outside but, it started raining.", "I wanted to go outside but it started, raining.", "I wanted to go outside, but, it started raining."], "ci": 0, "exp": "\"I wanted to go outside, but it started raining\" is correct because a comma belongs directly before the coordinating conjunction \"but\" when it joins two independent clauses. The other choices place the comma in the wrong spot or add an extra, unnecessary comma."}, {"stem": "Which word in this sentence is a linking verb? \"The soup smells delicious after simmering all afternoon.\"", "opts": ["soup", "smells", "delicious", "simmering"], "ci": 1, "exp": "\"smells\" is the linking verb here because it connects the subject \"soup\" to the describing word \"delicious,\" rather than showing a physical action. \"soup\" is the subject, \"delicious\" is the adjective it links to, and \"simmering\" is part of a describing phrase."}, {"stem": "Choose the correct comparative form: This puzzle is ______ than the one we finished last week.", "opts": ["difficulter", "more difficult", "most difficult", "difficultest"], "ci": 1, "exp": "\"more difficult\" is the correct comparative form for a longer adjective like \"difficult,\" since English typically uses \"more\" rather than adding \"-er\" to longer words. \"difficulter\" and \"difficultest\" are not real words, and \"most difficult\" is a superlative used for comparing three or more things, not two."}, {"stem": "Which word correctly completes the sentence as a preposition? The cat hid ______ the old wooden bookshelf.", "opts": ["behind", "quickly", "quiet", "ran"], "ci": 0, "exp": "\"behind\" is a preposition that shows the cat's position relative to the bookshelf. \"quickly\" and \"quiet\" are not prepositions, and \"ran\" is a verb, not a word that can follow \"hid\" to show location in this sentence."}, {"stem": "Which underlined word in the sentence is an abstract noun? \"<u>Her</u> <u>courage</u> <u>inspired</u> everyone on the <u>team</u>.\"", "opts": ["Her", "courage", "inspired", "team"], "ci": 1, "exp": "\"courage\" is an abstract noun because it names a quality or idea that cannot be seen or touched. \"team\" is a concrete noun (a group of people), \"inspired\" is a verb, and \"Her\" is a possessive pronoun."}, {"stem": "Choose the sentence that uses a helping verb correctly.", "opts": ["She has finish her homework already.", "She have finished her homework already.", "She has finished her homework already.", "She has finishing her homework already."], "ci": 2, "exp": "\"She has finished her homework already\" is correct because the helping verb \"has\" pairs with the past participle \"finished\" to form the present perfect tense, and \"has\" correctly agrees with the singular subject \"She.\" The other choices use the wrong verb form or the wrong helping verb."}, {"stem": "Which choice fixes the run-on sentence? \"The rain stopped the sun came out.\"", "opts": ["The rain stopped, the sun came out.", "The rain stopped the sun, came out.", "The rain stopped, and the sun came out.", "The rain, stopped the sun came out."], "ci": 2, "exp": "\"The rain stopped, and the sun came out\" fixes the run-on by joining the two independent clauses with a comma and the coordinating conjunction \"and.\" Simply adding a comma without a conjunction, as in \"The rain stopped, the sun came out,\" creates a comma splice, which is still an error, and the other choices misplace the comma entirely."}, {"stem": "Which sentence is a fragment rather than a complete sentence?", "opts": ["Running through the crowded hallway between classes.", "She ran through the crowded hallway.", "The hallway was crowded.", "Students filled the hallway."], "ci": 0, "exp": "\"Running through the crowded hallway between classes\" is a fragment because it has no clear subject performing a complete action - it is only a participial phrase, not a full sentence. The other three choices all have a subject and a complete verb."}, {"stem": "Choose the coordinating conjunction that best completes the sentence: We wanted to walk to the park, ______ it began to snow heavily.", "opts": ["so", "but", "or", "yet"], "ci": 1, "exp": "\"but\" is correct because it signals a direct contrast between wanting to walk to the park and the snow that stopped it. \"so\" would wrongly suggest the snow resulted from wanting to walk, \"or\" presents an alternative rather than a contrast, and \"yet\" changes the tone in a way that does not fit this straightforward sentence."}, {"stem": "Which sentence correctly uses an object pronoun?", "opts": ["The coach gave I a new jersey.", "The coach gave he a new jersey.", "The coach gave him a new jersey.", "The coach gave he and I a new jersey."], "ci": 2, "exp": "\"The coach gave him a new jersey\" is correct because \"him\" is an object pronoun that correctly receives the action of the verb \"gave.\" \"I\" and \"he\" are subject pronouns and cannot be used as objects, and \"The coach gave he and I a new jersey\" incorrectly mixes subject pronouns into the object position."}, {"stem": "Which sentence uses quotation marks correctly?", "opts": ["Maria said, \"I finished my project early.\"", "Maria said, I finished my project early.", "\"Maria said, I finished my project early.", "Maria said \"I finished my project early\""], "ci": 0, "exp": "\"Maria said, \\\"I finished my project early.\\\"\" is correct because it places a comma before the quotation, opens and closes the quotation marks properly, and includes the period inside the closing quotation mark. The other choices are missing quotation marks, misplace them, or drop required punctuation."}, {"stem": "Choose the sentence that correctly uses a possessive noun.", "opts": ["The dogs bone was buried in the yard.", "The dog's bone was buried in the yard.", "The dogs' bone was buried in the yard.", "The dog bone's was buried in the yard."], "ci": 1, "exp": "\"The dog's bone was buried in the yard\" is correct because a single dog owns the bone, so the apostrophe goes before the \"s\" to show singular possession. \"dogs\" without an apostrophe shows no possession at all, \"dogs'\" would mean more than one dog owns it, and \"The dog bone's was buried in the yard\" misplaces the apostrophe onto the wrong word."}, {"stem": "Which sentence best combines the two short sentences using a subordinating word? \"The game was cancelled. It started raining.\"", "opts": ["The game was cancelled, it started raining.", "The game was cancelled because it started raining.", "The game was cancelled, but it started raining.", "The game was cancelled it started raining."], "ci": 1, "exp": "\"The game was cancelled because it started raining\" correctly uses the subordinating conjunction \"because\" to show a cause-and-effect relationship between the two ideas. The other choices either create a comma splice, suggest the wrong relationship (\"but\" implies contrast, not cause), or run the sentences together with no punctuation at all."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  var ttsBtn = document.getElementById('tts-btn');
  if(q.tts){ ttsBtn.style.display='inline-block'; ttsBtn.setAttribute('data-tts', q.tts); }
  else { ttsBtn.style.display='none'; }

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
function speakStem(){
  var btn = document.getElementById('tts-btn');
  var txt = btn.getAttribute('data-tts');
  if(!txt) return;
  if('speechSynthesis' in window){
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ko-KR';
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
}
window.speakStem=speakStem;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
