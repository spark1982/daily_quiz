<script>var TITLE = "[Grant] English";var QUIZ_KEY = "quiz_grantenglish_25_20260824_v1";var ATT_KEY = "quiz_grantenglish_25_att_20260824_v1";var RAW_QUESTIONS = [{"stem": "What is the main idea of the passage?", "opts": ["Bats are dangerous animals that most people should avoid.", "Bats use a sound-based ability called echolocation to navigate and hunt in the dark.", "Moths are cleverer than bats because they can avoid capture.", "Scientists have only recently discovered that bats exist in caves."], "ci": 1, "exp": "The passage centers on echolocation - what it is, how it works, how it was discovered, and how it helps bats hunt and inspires technology. The other choices focus on minor or incorrect details rather than the passage's central focus.", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>Deep in a limestone cave, a bat glides through total darkness without ever bumping into a wall. It does not rely on sharp eyesight to find its way. Instead, it uses a remarkable ability called echolocation, a skill that lets the bat \"see\" the world through sound.<br><br>Here is how it works. As the bat flies, it emits a rapid stream of high-pitched clicks and squeaks, most of which are far too high for human ears to detect. These sound waves travel outward until they strike an object, such as a cave wall, a fluttering moth, or a low-hanging branch. The sound then bounces back to the bat as an echo. By measuring how long the echo takes to return and how its pitch has changed, the bat's brain builds an incredibly detailed picture of its surroundings, including the size, shape, texture, and speed of nearby objects.<br><br>Scientists first became curious about this ability in the eighteenth century, when an Italian researcher named Lazzaro Spallanzani noticed that blinded bats could still navigate a room full of obstacles with ease, while bats with blocked ears blundered into everything. It took nearly two hundred more years, however, before researchers fully understood that sound, not some mysterious sixth sense, was responsible.<br><br>Echolocation gives bats an extraordinary advantage when hunting at night. A single brown bat can snatch hundreds of mosquitoes and other flying insects out of the air in just one hour, adjusting the rate of its clicks as it closes in on prey, almost like a sonar system growing more precise the closer it gets to its target. Some moths have even evolved their own countermeasures, developing ears tuned specifically to detect a hunting bat's calls so they can dive or freeze before being caught.<br><br>Today, engineers study echolocation for inspiration. Devices that help visually impaired people navigate, along with certain types of sonar used by ships, borrow directly from the same basic principle that allows a small bat to fly confidently through a pitch-black cave."}, {"stem": "According to the passage, which detail supports the idea that echolocation helps bats hunt effectively?", "opts": ["A single brown bat can catch hundreds of insects in one hour.", "Bats live in limestone caves.", "Sound waves are invisible to the human eye.", "Spallanzani was an Italian researcher."], "ci": 0, "exp": "The passage directly states that a single brown bat can snatch hundreds of mosquitoes and other flying insects out of the air in just one hour, which is specific evidence of hunting effectiveness. The other choices are true details from the passage but do not support the hunting claim.", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>Deep in a limestone cave, a bat glides through total darkness without ever bumping into a wall. It does not rely on sharp eyesight to find its way. Instead, it uses a remarkable ability called echolocation, a skill that lets the bat \"see\" the world through sound.<br><br>Here is how it works. As the bat flies, it emits a rapid stream of high-pitched clicks and squeaks, most of which are far too high for human ears to detect. These   if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
