<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261112";
var RAW_QUESTIONS = [{"stem": "The artist painted a <b>permanent</b> mural on the side of the library. Which word means the <b>OPPOSITE</b> of “permanent” as it is used in the sentence?", "opts": ["lasting", "temporary", "colorful", "enormous"], "ci": 1, "exp": "<i>permanent</i> (adj.) meant to last for a very long time or forever. Its opposite is <i>temporary</i> (lasting only a short time). <i>Lasting</i> is a synonym, not an opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"Trees are <b>sparse</b> on the windy hilltop; only a few twisted pines grow far apart from one another.\" What does <b>sparse</b> mean in this sentence?", "opts": ["very tall and strong", "spread out thinly; few and scattered", "crowded close together", "bent by the wind"], "ci": 1, "exp": "<i>sparse</i> (adj.) thinly spread; only a few here and there. The clue is \"only a few ... far apart.\" Its opposite is <i>dense</i>. <i>The desert has <b>sparse</b> grass.</i> Family: sparsely (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Our classroom is ______ to the music room, so we can hear the band practicing through the wall. Which word best completes the sentence?", "opts": ["fragile", "obvious", "meager", "adjacent"], "ci": 3, "exp": "<i>adjacent</i> (adj.) next to or right beside something. The clue is hearing the band \"through the wall.\" <i>The park is <b>adjacent</b> to the river.</i>", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Joining the after-school chess club is <b>voluntary</b>; students can sign up if they want to. Which word means the <b>OPPOSITE</b> of “voluntary” as it is used in the sentence?", "opts": ["optional", "free", "required", "popular"], "ci": 2, "exp": "<i>voluntary</i> (adj.) done because you choose to, not because you must. Its opposite is <i>required</i>. <i>Optional</i> means almost the same as voluntary, so it is not the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"After the long drought, the farmer's harvest was so <b>meager</b> that it barely filled one small basket.\" What does <b>meager</b> mean in this sentence?", "opts": ["late in the season", "healthy and fresh", "hard to carry", "very small in amount; not enough"], "ci": 3, "exp": "<i>meager</i> (adj.) too small in amount; barely enough. The clue is \"barely filled one small basket.\" <i>We shared a <b>meager</b> lunch of crackers.</i> Family: meagerly (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Our teacher gave us a reading <b>supplement</b> with extra stories to go along with the textbook chapter.\" What does <b>supplement</b> mean in this sentence?", "opts": ["a vitamin pill taken for health", "something added to make another thing more complete", "a special section of a newspaper", "a payment made for an extra service"], "ci": 1, "exp": "<i>supplement</i> (n.) can mean a vitamin pill or a newspaper section, but here it means extra material added to complete something. <i>The museum guide was a helpful <b>supplement</b> to our tour.</i> Family: supplementary (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The young inventor was praised for her ______ idea: a backpack that charges a phone while you walk. Which form of the word best completes the sentence?", "opts": ["innovation", "innovate", "innovator", "innovative"], "ci": 3, "exp": "<i>innovation</i> (n.) a new idea, method, or invention. Before the noun \"idea\" you need an adjective: <i>innovative</i> (new and creative). Family: innovate (v.), innovator (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The rabbit froze in the tall grass when it saw the hawk, a ______ that hunts small animals from the sky. Which word best completes the sentence?", "opts": ["frontier", "supplement", "predator", "authority"], "ci": 2, "exp": "<i>predator</i> (n.) an animal that hunts and eats other animals. <i>Owls are <b>predators</b> that hunt at night.</i> Family: predatory (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Please wrap the glass ornaments in paper; they are very ______ and could break in the box. Which word best completes the sentence?", "opts": ["permanent", "adjacent", "fragile", "voluntary"], "ci": 2, "exp": "<i>fragile</i> (adj.) easily broken or damaged. <i>The <b>fragile</b> egg cracked when it rolled off the table.</i> Family: fragility (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "After the first round, the ______ of four teams left only the best eight in the contest. Which form of the word best completes the sentence?", "opts": ["eliminate", "elimination", "eliminated", "eliminating"], "ci": 1, "exp": "<i>eliminate</i> (v.) to remove or get rid of. After \"the\" and before \"of\" you need a noun: <i>elimination</i>. <i>Washing your hands helps <b>eliminate</b> germs.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Scientists study how the moon's pull may <b>relate</b> to the rise and fall of ocean tides. Which word means the <b>SAME</b> or nearly the same as “relate” as it is used in the sentence?", "opts": ["separate", "connect", "compare", "describe"], "ci": 1, "exp": "<i>relate</i> (v.) here, to be connected to something. <i>Connect</i> is closest. <i>Separate</i> is the opposite. Family: relation (n.), relationship (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"Before choosing a route up the mountain, the hikers decided to <b>consult</b> a park ranger who knew the trails well.\" What does <b>consult</b> mean in this sentence?", "opts": ["to argue with", "to ask for advice or information", "to follow closely", "to thank politely"], "ci": 1, "exp": "<i>consult</i> (v.) to go to a person or a book for advice or information. <i>If you are not sure how to spell a word, <b>consult</b> a dictionary.</i> Family: consultant (n.), consultation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "It was <b>obvious</b> that the puppy had found the mud, because there were paw prints all over the kitchen floor. Which word means the <b>SAME</b> or nearly the same as “obvious” as it is used in the sentence?", "opts": ["hidden", "surprising", "clear", "messy"], "ci": 2, "exp": "<i>obvious</i> (adj.) easy to see or understand. <i>Clear</i> is closest. <i>Hidden</i> is the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"Before the job fair, Diego filled out an <b>application</b> with his name, his skills, and why he wanted to work at the zoo.\" What does <b>application</b> mean in this sentence?", "opts": ["a program on a phone or tablet", "a written form asking for a job or a place", "a layer of paint or cream", "a letter thanking someone"], "ci": 1, "exp": "<i>application</i> (n.) here, a form you fill out to ask for a job, a spot in a school, or permission. It can also mean a computer program (an app). Family: apply (v.), applicant (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Maya's story was so <b>vivid</b> that I could almost smell the salty air and hear the gulls over the harbor.\" What does <b>vivid</b> mean in this sentence?", "opts": ["long and hard to follow", "quiet and calm", "sad and gloomy", "clear and full of detail, like real life"], "ci": 3, "exp": "<i>vivid</i> (adj.) very clear, bright, or full of detail. <i>The painting used <b>vivid</b> reds and oranges.</i> Family: vividly (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"For many scientists, the deep ocean is the last great <b>frontier</b>, because so much of it has never been explored.\" What does <b>frontier</b> mean in this sentence?", "opts": ["the border line between two countries", "the edge of settled land in the American West long ago", "the front row of seats in a theater", "an area that is still mostly unknown and waiting to be explored"], "ci": 3, "exp": "<i>frontier</i> (n.) can mean the border of a country or the edge of settled land in the old American West. Here it means an area of knowledge that is still mostly unexplored. <i>Space is often called a new <b>frontier</b>.</i>", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Only the principal has the ______ to cancel school when a snowstorm is coming. Which word best completes the sentence?", "opts": ["authority", "predator", "innovation", "proportion"], "ci": 0, "exp": "<i>authority</i> (n.) the power or right to make decisions or give orders. <i>The referee has the <b>authority</b> to stop the game.</i> Family: authorize (v.), authoritative (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"To make the paint lighter, mix white and blue in the right <b>proportion</b>: two cups of white for every cup of blue.\" What does <b>proportion</b> mean in this sentence?", "opts": ["the total weight of a mixture", "the amount of one thing compared with another", "the color of a paint", "the order in which things are added"], "ci": 1, "exp": "<i>proportion</i> (n.) the amount of one part compared with another or with the whole. <i>The <b>proportion</b> of girls to boys in our class is about one to one.</i> Family: proportional (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"The new library was built to <b>accommodate</b> two hundred readers at once, with tables on every floor.\" What does <b>accommodate</b> mean in this sentence?", "opts": ["to make someone feel welcome", "to build something quickly", "to keep people quiet", "to have enough space for"], "ci": 3, "exp": "<i>accommodate</i> (v.) to have room for or to provide what someone needs. <i>The bus can <b>accommodate</b> forty students.</i> Family: accommodation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"My grandfather <b>seldom</b> drives at night, so when he offered to take us to the late movie, we were surprised.\" What does <b>seldom</b> mean in this sentence?", "opts": ["always carefully", "very slowly", "only alone", "not often; rarely"], "ci": 3, "exp": "<i>seldom</i> (adv.) not often. The clue is that the family was surprised. <i>Snow <b>seldom</b> falls in Florida.</i>", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-12 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
