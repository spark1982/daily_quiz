var RAW_QUESTIONS = [{"stem": "Which event happened right after workers finished the first telegraph line across the continent?", "opts": ["A rider left St. Joseph carrying a pouch of letters.", "The Pony Express announced that it would close.", "Mail began reaching Sacramento in about ten days.", "Riders began switching horses at relay stations."], "ci": 1, "exp": "The passage says that on October 24, 1861, the telegraph line was finished, and &ldquo;Two days later, the Pony Express announced that it would close.&rdquo; The rider leaving St. Joseph happened first, in April 1860.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The route crossed prairies, deserts, and mountains.", "Riders switched to fresh horses at relay stations.", "Each rider carried the mail along the entire 1,900-mile route.", "The service closed soon after the telegraph line was finished."], "ci": 2, "exp": "The passage says &ldquo;a new rider took over after seventy-five miles or more,&rdquo; so no single rider carried the mail the whole way. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close."}, {"stem": "As it is used in the first paragraph, what does the word &ldquo;dramatically&rdquo; mean?", "opts": ["in an exciting, theater-like way", "slowly and carefully", "for only a short while", "by a very large amount"], "ci": 3, "exp": "The company planned to turn a trip of &ldquo;more than three weeks&rdquo; into about ten days, which is a very large change. &ldquo;In an exciting, theater-like way&rdquo; is another meaning of <i>dramatic</i>, but it does not fit here.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close."}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Riders on the Pony Express switched to fresh horses every ten to fifteen miles.", "The telegraph was the most important invention of the 1800s.", "Stagecoaches were too slow to carry mail across the Sierra Nevada.", "The Pony Express carried mail across the West remarkably fast, but the telegraph soon made it unnecessary."], "ci": 3, "exp": "The passage explains how the Pony Express cut delivery time to &ldquo;about ten days&rdquo; and then how the telegraph ended it after only a short time. The fresh-horses detail is true but covers only one part of the passage.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close."}, {"stem": "According to the passage, what do some landowners install to deal with beaver ponds?", "opts": ["fences that keep beavers away from trees", "stone walls that replace the beavers' dams", "gates that drain the pond completely", "pipes that let water flow through a dam"], "ci": 3, "exp": "The last paragraph says, &ldquo;Some landowners now install pipes that let water flow through a dam.&rdquo; The goal is a &ldquo;manageable level,&rdquo; not an empty pond.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Engineers of the Stream</strong><br>Few animals reshape their surroundings as thoroughly as the North American beaver. Using teeth that never stop growing, a beaver can bring down a small tree in a single night. It drags branches, stones, and mud into a stream and weaves them into a dam. Because the dam slows the current, water spreads out behind it and forms a pond deep enough that it rarely freezes to the bottom, so the beaver can reach its underwater store of branches all winter.<br><br>The pond's effects extend far beyond the beaver itself. Slower water drops the soil it was carrying, so the stream below the dam runs clearer. Ducks, frogs, and insects settle in the new wetland, and fish shelter in its cool, deep pools. During droughts, beaver ponds hold water that would otherwise rush away, keeping nearby meadows green while the surrounding land turns brown.<br><br>Not everyone welcomes these builders, however; a dam can flood a road or a farmer's field. Some landowners now install pipes that let water flow through a dam, keeping the pond at a manageable level without driving the beavers away."}, {"stem": "According to the passage, why does the stream below a beaver dam run clearer?", "opts": ["Beavers eat the plants that make the water cloudy.", "Pipes in the dam filter the mud out of the water.", "Fish and insects in the pond clean the water.", "The slower water behind the dam drops the soil it was carrying."], "ci": 3, "exp": "The passage says, &ldquo;Slower water drops the soil it was carrying, so the stream below the dam runs clearer.&rdquo; The pipes are mentioned, but they control the water level, not the mud.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Engineers of the Stream</strong><br>Few animals reshape their surroundings as thoroughly as the North American beaver. Using teeth that never stop growing, a beaver can bring down a small tree in a single night. It drags branches, stones, and mud into a stream and weaves them into a dam. Because the dam slows the current, water spreads out behind it and forms a pond deep enough that it rarely freezes to the bottom, so the beaver can reach its underwater store of branches all winter.<br><br>The pond's effects extend far beyond the beaver itself. Slower water drops the soil it was carrying, so the stream below the dam runs clearer. Ducks, frogs, and insects settle in the new wetland, and fish shelter in its cool, deep pools. During droughts, beaver ponds hold water that would otherwise rush away, keeping nearby meadows green while the surrounding land turns brown.<br><br>Not everyone welcomes these builders, however; a dam can flood a road or a farmer's field. Some landowners now install pipes that let water flow through a dam, keeping the pond at a manageable level without driving the beavers away."}, {"stem": "The word <i>manageable</i> is made of <i>manage</i> + the suffix <i>-able</i>. What does &ldquo;manageable&rdquo; most likely mean in the passage?", "opts": ["able to be handled or controlled", "very hard to control", "in charge of other people", "filled almost to the top"], "ci": 0, "exp": "The suffix <i>-able</i> means &ldquo;able to be,&rdquo; so <i>manageable</i> means able to be managed, or handled. The pipes keep the pond at a level people can control.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Engineers of the Stream</strong><br>Few animals reshape their surroundings as thoroughly as the North American beaver. Using teeth that never stop growing, a beaver can bring down a small tree in a single night. It drags branches, stones, and mud into a stream and weaves them into a dam. Because the dam slows the current, water spreads out behind it and forms a pond deep enough that it rarely freezes to the bottom, so the beaver can reach its underwater store of branches all winter.<br><br>The pond's effects extend far beyond the beaver itself. Slower water drops the soil it was carrying, so the stream below the dam runs clearer. Ducks, frogs, and insects settle in the new wetland, and fish shelter in its cool, deep pools. During droughts, beaver ponds hold water that would otherwise rush away, keeping nearby meadows green while the surrounding land turns brown.<br><br>Not everyone welcomes these builders, however; a dam can flood a road or a farmer's field. Some landowners now install pipes that let water flow through a dam, keeping the pond at a manageable level without driving the beavers away."}, {"stem": "Which word means the <b>OPPOSITE</b> of &ldquo;thoroughly&rdquo; as it is used in the passage?", "opts": ["partly", "completely", "quickly", "carefully"], "ci": 0, "exp": "<i>Thoroughly</i> means completely, in every way. Its opposite is <i>partly</i>. <i>Completely</i> is a synonym, so it is not the opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Engineers of the Stream</strong><br>Few animals reshape their surroundings as thoroughly as the North American beaver. Using teeth that never stop growing, a beaver can bring down a small tree in a single night. It drags branches, stones, and mud into a stream and weaves them into a dam. Because the dam slows the current, water spreads out behind it and forms a pond deep enough that it rarely freezes to the bottom, so the beaver can reach its underwater store of branches all winter.<br><br>The pond's effects extend far beyond the beaver itself. Slower water drops the soil it was carrying, so the stream below the dam runs clearer. Ducks, frogs, and insects settle in the new wetland, and fish shelter in its cool, deep pools. During droughts, beaver ponds hold water that would otherwise rush away, keeping nearby meadows green while the surrounding land turns brown.<br><br>Not everyone welcomes these builders, however; a dam can flood a road or a farmer's field. Some landowners now install pipes that let water flow through a dam, keeping the pond at a manageable level without driving the beavers away."}, {"stem": "Which sentence best states a theme of the story?", "opts": ["A mistake can lead to learning a better way to do something.", "Talented musicians never need help from anyone else.", "It is better to stop trying than to be embarrassed in front of others.", "Practicing alone matters more than playing with a group."], "ci": 0, "exp": "Leo misses his entrance, learns from Ms. Ferraro to watch her hand, and then plays it correctly and keeps practicing that new method. Pract var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-12 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
