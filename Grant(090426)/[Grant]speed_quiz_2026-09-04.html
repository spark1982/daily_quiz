<style>
*{box-sizing:border-box;margin:0;padding:0}

<body><div class="quiz-title">[Grant] Speed Quiz</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Answer as quickly as you can. Each question has a 40 second timer.</div><div id="nav-bar"><span id="nav-count">0 / 30</span><div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div><button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button></div><div id="dot-panel"></div>
<div class="q-timer-bar">
  <span class="q-timer-display" id="qTimerDisplay">0:40</span>
  <button class="pause-btn" id="pauseBtn" onclick="togglePause()">Pause</button>
</div>
<div class="quiz-area" id="quiz-area">
  <div class="q-header">
    <span class="q-num" id="q-num"></span>
    <span class="tag-badge" id="tag-badge"></span>
  </div>
  <div class="q-text" id="q-text"></div>
  <div class="options" id="options"></div>
  <div class="timeout-box" id="timeout-box">Time's up for this question. Click Next to continue.</div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-btns">
    <button class="prev-btn" onclick="goPrev()">Prev</button>
    <button class="next-btn" id="next-btn" onclick="goNext()">Next</button>
  </div>
</div>

<div class="results-screen" id="results-screen">
  <div class="results-heading" id="results-heading">Results</div>
  <div class="results-score" id="results-score"></div>
  <div class="results-grid" id="results-grid"></div>
  <div class="results-btns">
    <button class="retry-btn" onclick="retryWrong()">Retry Wrong &amp; Timed Out</button>
    <button class="copy-btn" onclick="copyRes()">Copy All Results</button>
    <button class="save-btn" onclick="saveWrongAnswers()">Save Wrong Answers</button>
    <button class="fresh-btn" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button>
    <button class="fresh-btn" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button>
  </div>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <div class="modal-title" id="freshModalTitle">Start Fresh?</div>
    <div class="modal-msg" id="freshModalText">All progress will be cleared. This cannot be undone.</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeFreshModal()">Cancel</button>
      <button class="modal-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>
<script>var TITLE = "[Grant] Speed Quiz";var QUIZ_KEY = "quiz_grantspeedquiz_20260904_v1";var ATT_KEY = "quiz_grantspeedquiz_att_20260904_v1";var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};var RAW_QUESTIONS = [{"stem": "2 + 3 + 4 + 5 + 6 + 7 + 8 = ?", "opts": ["36", "33", "38", "35"], "ci": 3, "exp": "Answer: 35.", "tag": "Gauss"}, {"stem": "6 + 7 + 8 + 9 + 10 + 11 = ?", "opts": ["50", "51", "49", "53"], "ci": 1, "exp": "Answer: 51.", "tag": "Gauss"}, {"stem": "4 + 6 + 8 + 10 + 12 + 14 = ?", "opts": ["56", "54", "50", "52"], "ci": 1, "exp": "Answer: 54.", "tag": "Gauss"}, {"stem": "1 + 3 + 5 + 7 + 9 + 11 = ?", "opts": ["40", "38", "34", "36"], "ci": 3, "exp": "Answer: 36.", "tag": "Gauss"}, {"stem": "John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?", "opts": ["95", "90", "100", "85"], "ci": 0, "exp": "Answer: 95.", "tag": "Gauss"}, {"stem": "Compute: 100 &minus; 99 + 98 &minus; 97 + 96 &minus; 95 + &hellip; + 4 &minus; 3 + 2 &minus; 1", "opts": ["50", "100", "51", "49"], "ci": 0, "exp": "Answer: 50.", "tag": "Gauss"}, {"stem": "Joe puts 5 matchsticks on a table. Each matchstick is 10 cm away from another. How far is the fifth matchstick away from the first one?", "opts": ["50", "45", "30", "40"], "ci": 3, "exp": "4 gaps of 10 cm between the 1st and 5th matchstick: 4 &times; 10 = 40 cm.", "tag": "Intervals"}, {"stem": "A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?", "opts": ["105", "99", "100", "101"], "ci": 3, "exp": "500 &divide; 5 = 100 gaps, plus 1 for both ends: 100 + 1 = 101 trees.", "tag": "Intervals"}, {"stem": "25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?", "opts": ["125", "120", "115", "100"], "ci": 1, "exp": "25 trees make 24 gaps: 24 &times; 5 = 120 m.", "tag": "Intervals"}, {"stem": "16 lamp posts are placed at regular intervals along a road that is 300 m long. If lamp posts are placed at both ends of the road as well, how far is one lamp post from another?", "opts": ["20", "25", "15", "18.75"], "ci": 0, "exp": "16 lamp posts make 15 gaps: 300 &divide; 15 = 20 m.", "tag": "Intervals"}, {"stem": "Each side of a football field is planted with 16 flags. There is one flag at each corner. How many flags are planted altogether in the football field?", "opts": ["64", "48", "60", "56"], "ci": 2, "exp": "4 sides &times; 16 flags, minus 4 corners counted twice: 4 &times; 16 &minus; 4 = 60.", "tag": "Intervals"}, {"stem": "A bus leaves the station every 10 minutes, starting at time 0. How many buses would have left the station within 60 minutes (including the one at time 0)?", "opts": ["7", "6", "8", "5"], "ci": 0, "exp": "Buses leave at 0,10,20,30,40,50,60 minutes: that is 7 buses.", "tag": "Intervals"}, {"stem": "22 + 78 = ?", "opts": ["90", "98", "100", "110"], "ci": 2, "exp": "22 + 78 = 100.", "tag": "Add & Subtract"}, {"stem": "15 + 85 = ?", "opts": ["100", "95", "105", "90"], "ci": 0, "exp": "15 + 85 = 100.", "tag": "Add & Subtract"}, {"stem": "17 + 83 = ?", "opts": ["93", "90", "110", "100"], "ci": 3, "exp": "17 + 83 = 100.", "tag": "Add & Subtract"}, {"stem": "54 + 46 = ?", "opts": ["110", "96", "90", "100"], "ci": 3, "exp": "54 + 46 = 100.", "tag": "Add & Subtract"}, {"stem": "64 + 36 = ?", "opts": ["100", "110", "94", "90"], "ci": 0, "exp": "64 + 36 = 100.", "tag": "Add & Subtract"}, {"stem": "33 + 47 = ?", "opts": ["84", "70", "80", "90"], "ci": 2, "exp": "33 + 47 = 80.", "tag": "Add & Subtract"}, {"stem": "24 &times; 25 = ?", "opts": ["700", "650", "600", "500"], "ci": 2, "exp": "24 x 25 = 600.", "tag": "Multiply"}, {"stem": "28 &times; 25 = ?", "opts": ["700", "650", "690", "750"], "ci": 0, "exp": "28 x 25 = 700.", "tag": "Multiply"}, {"stem": "36 &times; 25 = ?", "opts": ["890", "900", "800", "950"], "ci": 1, "exp": "36 x 25 = 900.", "tag": "Multiply"}, {"stem": "16 &times; 25 = ?", "opts": ["350", "390", "400", "450"], "ci": 2, "exp": "16 x 25 = 400.", "tag": "Multiply"}, {"stem": "63 &times; 11 = ?", "opts": ["693", "683", "703", "663"], "ci": 0, "exp": "63 x 11 = 693.", "tag": "Multiply"}, {"stem": "27 &times; 11 = ?", "opts": ["287", "297", "277", "307"], "ci": 1, "exp": "27 x 11 = 297.", "tag": "Multiply"}, {"stem": "The 5 points A, B, C, D, E lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"230\" height=\"70\" viewBox=\"0 0 230 70\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"35\" x2=\"215\" y2=\"35\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"55\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"55\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"110\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"110\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"150\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"150\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"215\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"215\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["9", "5", "15", "10"], "ci": 3, "exp": "With 5 points at all-different spacings, every pair of points gives a distinct length: C(5,2) = 10.", "tag": "Geometry"}, {"stem": "The 6 points A, B, C, D, E, F lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"260\" height=\"70\" viewBox=\"0 0 260 70\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"35\" x2=\"245\" y2=\"35\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"45\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"45\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"90\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"90\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"130\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"130\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"180\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"180\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"245\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"245\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["6", "15", "12", "21"], "ci": 1, "exp": "With 6 points at all-different spacings, every pair gives a distinct length: C(6,2) = 15.", "tag": "Geometry"}, {"stem": "From one vertex of the triangle below, 1 line segment is drawn to the opposite side, splitting the triangle into 2 regions.<br><svg width=\"200\" height=\"130\" viewBox=\"0 0 200 130\" style=\"display:block;margin:10px auto;\"><polygon points=\"100,10 10,110 190,110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many triangles are there in the whole figure?", "opts": ["4", "3", "5", "2"], "ci": 1, "exp": "1 cevian creates 2 regions; the count of triangles is (k+1)(k+2)/2 with k=1: (2)(3)/2 = 3.", "tag": "Geometry"}, {"stem": "From one vertex of the triangle below, 2 line segments are drawn to the opposite side, splitting the triangle into 3 regions.<br><svg width=\"200\" height=\"130\" viewBox=\"0 0 200 130\" style=\"display:block;margin:10px auto;\"><polygon points=\"100,10 10,110 190,110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"10\" x2=\"70\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"130\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many triangles are there in the whole figure?", "opts": ["9", "5", "3", "6"], "ci": 3, "exp": "With k=2 cevians: (k+1)(k+2)/2 = (3)(4)/2 = 6 triangles.", "tag": "Geometry"}, {"stem": "From one vertex of the triangle below, 3 line segments are drawn to the opposite side, splitting the triangle into 4 regions.<br><svg width=\"200\" height=\"130\" viewBox=\"0 0 200 130\" style=\"display:block;margin:10px auto;\"><polygon points=\"100,10 10,110 190,110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"10\" x2=\"55\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"145\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many triangles are there in the whole figure?", "opts": ["10", "7", "12", "15"], "ci": 0, "exp": "With k=3 cevians: (k+1)(k+2)/2 = (4)(5)/2 = 10 triangles.", "tag": "Geometry"}, {"stem": "The strip below is divided into 7 equal cells in a single row.<br><svg width=\"290\" height=\"60\" viewBox=\"0 0 290 60\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"280\" height=\"40\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"170\" y1=\"10\" x2=\"170\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"210\" y1=\"10\" x2=\"210\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"250\" y1=\"10\" x2=\"250\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many rectangles (including squares) can be found in the figure altogether?", "opts": ["28", "36", "7", "21"], "ci": 0, "exp": "For a 1-row, 7-cell strip, the rectangle count is C(8,2) = 28 (choose any 2 of the 8 vertical lines as the rectangle's sides).", "tag": "Geometry"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + "_order_v1";
var Q_TIME = 40;

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<N;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);

    var arr = JSON.parse(raw);

  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultTimerState(){ return { remainingAtStart: Q_TIME, startedAt: null, running: false, timedOut: false }; }
function defaultState(){
  var timers = {};
  for(var i=0;i<N;i++) timers[i] = defaultTimerState();
  return { cur:0, answers:{}, timers: timers, showResults:false };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.timers !== 'object' || s.timers===null) s.timers = {};
    for(var i=0;i<N;i++){ if(!s.timers[i]) s.timers[i] = defaultTimerState(); }
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var tickInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function getRemaining(qi){
  var t = state.timers[qi];
  if(!t) return Q_TIME;
  if(t.running && t.startedAt){
    var elapsed = (Date.now()-t.startedAt)/1000;
    return Math.max(0, t.remainingAtStart - elapsed);
  }
  return t.remainingAtStart;
}
function freezeTimer(qi){
  var t = state.timers[qi];
  if(t && t.running){
    t.remainingAtStart = getRemaining(qi);
    t.running = false;
    t.startedAt = null;
  }
}
function startTimerFor(qi){
  var t = state.timers[qi];
  if(!t) { t = defaultTimerState(); state.timers[qi] = t; }
  if(t.timedOut) return;
  if(state.answers[qi] !== undefined) return;
  if(!t.running){
    t.startedAt = Date.now();
    t.running = true;
  }
}
function stopTickInterval(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }
function startTickInterval(){ stopTickInterval(); tickInterval = setInterval(tickRender, 250); }

function tickRender(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var disp = document.getElementById('qTimerDisplay');
  var pauseBtn = document.getElementById('pauseBtn');
  if(!t) return;
  var remaining = getRemaining(qi);
  disp.classList.remove('warn','danger');
  if(remaining <= 0){
    if(t.running){
      t.running = false;
      t.startedAt = null;
      t.remainingAtStart = 0;
      t.timedOut = true;
      saveState();
      renderOptionsLockState();
    }
    disp.textContent = "0:00";
    disp.classList.add('danger');
    document.getElementById('timeout-box').style.display = (state.answers[qi]===undefined) ? 'block' : 'none';
    pauseBtn.disabled = true;
    return;
  }
  pauseBtn.disabled = false;
  disp.textContent = formatTime(remaining);
  if(remaining <= Q_TIME*0.1) disp.classList.add('danger');
  else if(remaining <= Q_TIME*0.25) disp.classList.add('warn');
  pauseBtn.textContent = t.running ? 'Pause' : 'Resume';
}

function renderOptionsLockState(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var answered = state.answers[qi];
  var btns = document.querySelectorAll('#options .opt-btn');
  btns.forEach(function(btn){
    if(answered !== undefined || (t && t.timedOut)) btn.disabled = true;
  });
}

function togglePause(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(!t || t.timedOut || state.answers[qi]!==undefined) return;
  if(t.running){ freezeTimer(qi); }
  else { startTimerFor(qi); }
  saveState();
  tickRender();
}
window.togglePause=togglePause;

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  var timerBar = document.querySelector('.q-timer-bar');
  if(state.showResults){
    qa.style.display='none';
    timerBar.style.display='none';
    rs.classList.add('show');
    stopTickInterval();
    renderResults();
    return;
  }
  qa.style.display='block';
  timerBar.style.display='flex';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  badge.textContent = q.tag;
  badge.style.background = TAG_COLORS[q.tag] || '#185FA5';

  document.getElementById('q-text').innerHTML = q.stem;

  startTimerFor(qi);

  var answered = state.answers[qi];
  var t = state.timers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = (answered !== undefined) || (t && t.timedOut);
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var timeoutBox = document.getElementById('timeout-box');
  timeoutBox.style.display = (t && t.timedOut && answered===undefined) ? 'block' : 'none';

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
  tickRender();
  startTickInterval();
}

function updateNav(){
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi = order[k];
    if(state.answers[qi]!==undefined || (state.timers[qi] && state.timers[qi].timedOut)) done++;
  }
  document.getElementById('nav-count').textContent = done + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (done/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg;
    if(state.answers[qi]===undefined){
      bg = (state.timers[qi] && state.timers[qi].timedOut) ? '#f5a623' : '#d7dde6';
    } else {
      bg = state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A';
    }
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi2 = order[k];
    if(state.answers[qi2]!==undefined || (state.timers[qi2] && state.timers[qi2].timedOut)) done++;
  }
  if(done===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  freezeTimer(order[state.cur]);
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  freezeTimer(order[state.cur]);
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(state.answers[qi] !== undefined) return;
  if(t && t.timedOut) return;
  state.answers[qi] = idx;
  freezeTimer(qi);
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ freezeTimer(order[state.cur]); state.cur--; saveState(); render(); }
}
function goNext(){
  freezeTimer(order[state.cur]);
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0, timedout=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a===undefined){
      if(t && t.timedOut) timedout++; else skipped++;
      continue;
    }
    if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+timedout+' timed out, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var card = document.createElement('div');
    if(a===undefined){
      if(t && t.timedOut){ card.className='r-card timedout'; card.textContent='Q'+(pos+1)+' Time'; }
      else { card.className='r-card skipped'; card.textContent='Q'+(pos+1)+' Skip'; }
    } else {
      var ok = a===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var isWrong = (a!==undefined && a!==RAW_QUESTIONS[qi].ci);
    var isTimedOut = (a===undefined && t && t.timedOut);
    if(isWrong || isTimedOut) wrong.push(qi);
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){
    delete state.answers[qi];
    state.timers[qi] = defaultTimerState();
  });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s += (t && t.timedOut) ? 'Timed Out' : 'Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    } else if(a===undefined && t && t.timedOut){
      var q2 = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q2.stem, yourAnswer: '(timed out)', correctAnswer: q2.opts[q2.ci], explanation: q2.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
</script>
</body>
