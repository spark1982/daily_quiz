<script>var TITLE = "[Grant] English";var QUIZ_KEY = "quiz_grantenglish_25_20260904_v1";var ATT_KEY = "quiz_grantenglish_25_att_20260904_v1";var RAW_QUESTIONS = [{"tag": "Main Idea", "tagcolor": "#185FA5", "stem": "What is the main idea of the passage?", "opts": ["3M engineers spent years perfecting a new kind of magnetron for use in restaurants.", "Percy Spencer intentionally designed the microwave oven to replace radar equipment in the military.", "Popcorn companies funded Spencer's research into faster cooking methods.", "Percy Spencer's accidental discovery that a magnetron could melt chocolate and pop popcorn led him to invent the microwave oven, which eventually became common in American kitchens."], "ci": 3, "exp": "The passage traces how Spencer's curiosity about a melted chocolate bar led him to test and eventually invent the microwave oven, an idea every paragraph builds toward. The military did not intend for this invention, and no popcorn company is mentioned as funding the research.", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1945, an engineer named Percy Spencer was working for a company that built magnetrons, powerful vacuum tubes used inside military radar equipment. Spencer had never finished elementary school, but he had taught himself so much about electronics that he had become one of the company's most valuable engineers.<br><br>One afternoon, while standing near an active magnetron, Spencer noticed something strange: the chocolate bar in his pocket had completely melted, even though he had not felt any heat at all. Most people might have simply wiped off the mess and moved on, but Spencer grew immediately curious about what could have caused it.<br><br>Suspecting that the microwaves produced by the magnetron were somehow responsible, Spencer decided to test his idea further. He placed a bag of unpopped popcorn kernels near the magnetron, and within moments the kernels began popping across the room. Encouraged by the result, he tried a third experiment, aiming the magnetron at a raw egg. The egg exploded, splattering a nearby colleague with hot yolk, evidence that the microwaves were cooking food from the inside out at a remarkable speed.<br><br>Spencer immediately understood that his accidental discovery might have uses far beyond radar. He built a metal box that trapped the microwaves inside, allowing food placed within it to cook quickly and evenly. In 1947, his company introduced this device to restaurants and ships as the first commercial microwave oven, though it stood nearly six feet tall and cost thousands of dollars, making it impractical for most household kitchens.<br><br>It took nearly two more decades of redesigning before the microwave oven became small and affordable enough for ordinary homes. By the 1970s, compact models finally began appearing on kitchen counters across the country. Today, the microwave oven sits in the vast majority of American kitchens, a common convenience that traces its origin back to a curious engineer and a melted chocolate bar."}, {"tag": "Supporting Details", "tagcolor": "#185FA5", "stem": "According to the passage, what did Spencer notice had happened to the chocolate bar in his pocket?", "opts": ["It had frozen solid from being near the magnetron", "It had completely melted, even though he had not felt any heat", "It had disappeared from his pocket entirely", "It had changed color but remained solid"], "ci": 1, "exp": "The passage states the chocolate bar \"had completely melted, even though he had not felt any heat at all.\" Freezing, color change, and disappearance are never mentioned.", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1945, an engineer named Percy Spencer was working for a company that built magnetrons, powerful vacuum tubes used inside military radar equipment. Spencer had never finished elementary school, but he had taught himself so much about electronics that he had beco ded, splattering a nearby colleague with hot yolk, evidence that the microwaves were cooking food from the inside out at a remarkable speed.<br><br>Spencer immediately understood that his accidental discovery might have uses far beyond radar. He built a metal box that trapped the microwaves inside, allowing food placed within it to cook quickly and evenly. In 1947, his company introduced this device to restaurants and ships as the first commercial microwave oven, though it stood nearly six feet tall and cost thousands of dollars, making it impractical for most household kitchens.<br><br>It took nearly two more decades of redesigning before the microwave oven became small and affordable enough for ordinary homes. By the 1970s, compact models finally began appearing on kitchen counters across the country. Today, the microwave oven sits in the vast majority of American kitchens, a common convenience that traces its origin back to a curious engineer and a melted chocolate bar."}, {"tag": "Sequence of Events", "tagcolor": "#185FA5", "stem": "Which of the following correctly orders the events in the passage?", "opts": ["Spencer noticed the melted chocolate, tested popcorn kernels near the magnetron, exploded an egg with the magnetron, and then built a metal box to trap the microwaves.", "Spencer built a metal box to trap the microwaves, then noticed the melted chocolate, then tested popcorn kernels, and finally exploded an egg.", "Spencer exploded an egg with the magnetron, then tested popcorn kernels, then noticed the melted chocolate, and finally built a metal box.", "Spencer tested popcorn kernels first, then built a metal box, then noticed the melted chocolate, and finally exploded an egg."], "ci": 0, "exp": "The passage describes the melted chocolate first, then the popcorn test, then the exploding egg, and finally the metal box that trapped the microwaves, in that exact order.", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1945, an engineer named Percy Spencer was working for a company that built magnetrons, powerful vacuum tubes used inside military radar equipment. Spencer had never finished elementary school, but he had taught himself so much about electronics that he had become one of the company's most valuable engineers.<br><br>One afternoon, while standing near an active magnetron, Spencer noticed something strange: the chocolate bar in his pocket had completely melted, even though he had not felt any heat at all. Most people might have simply wiped off the mess and moved on, but Spencer grew immediately curious about what could have caused it.<br><br>Suspecting that the microwaves produced by the magnetron were somehow responsible, Spencer decided to test his idea further. He placed a bag of unpopped popcorn kernels near the magnetron, and within moments the kernels began popping across the room. Encouraged by the result, he tried a third experiment, aiming the magnetron at a raw egg. The egg exploded, splattering a nearby colleague with hot yolk, evidence that the microwaves were cooking food from the inside out at a remarkable speed.<br><br>Spencer immediately understood that his accidental discovery might have uses far beyond radar. He built a metal box that trapped the microwaves inside, allowing food placed within it to cook quickly and evenly. In 1947, his company introduced this device to restaurants and ships as the first commercial microwave oven, though it stood nearly six feet tall and cost thousands of dollars, making it impractical for most household kitchens.<br><br>It took nearly two more decades of redesigning before the microwave oven became small and affordable enough for ordinary homes. By the 1970s, compact models finally began appearing on kitchen counters across the country. Today, the microwave oven sits in the vast majority of American kitchens, a common convenience that traces its origin back to a curious engineer and a melted chocolate bar."}, {"tag": "Cause
