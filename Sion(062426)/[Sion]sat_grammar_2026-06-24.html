<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Grammar</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
.q-tag{display:inline-block;background:#185FA5;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:8px;}
.sent-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:1.05rem;line-height:1.55;color:#222;}
.sent-box u{text-decoration:underline;text-decoration-thickness:2px;font-weight:700;color:#185FA5;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#1D9E75;}
.next-btn{background:#1D9E75;color:#fff;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#1D9E75;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
.timer-bar{background:#fff;border-bottom:1px solid #d0dce8;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
</style>
</head>
<body>

<div class="title-hd">[Sion] SAT Grammar</div>
<div class="instruction">Choose the best revision for the underlined portion of each sentence.</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / 20</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #1D9E75;border-radius:14px;background:#fff;color:#1D9E75;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div class="timer-bar" id="timerBar">
  <div class="timer-setup" id="timerSetup">
    <label for="timerMinutesInput">Set Time Limit:</label>
    <input type="number" id="timerMinutesInput" min="1" max="180" value="20"> min
    <button class="timer-start-btn" onclick="startTimer()">Start</button>
  </div>
  <div class="timer-running" id="timerRunning" style="display:none;">
    <span class="timer-label">Time Left</span>
    <span class="timer-display" id="timerDisplay">20:00</span>
  </div>
</div>

<div id="quizArea" style="display:none;">
  <div><span class="q-tag" id="q-tag-label">Grammar</span></div>
  <div class="q-num" id="q-num"></div>
  <div class="sent-box" id="sent-box"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#1D9E75;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){

var QUIZ_KEY   = 'quiz_sionsatgrammar_20_20260623_v1';
var ATT_KEY    = 'quiz_sionsatgrammar_att_20260623_v1';
var QUIZ_LABEL = '[Sion] SAT Grammar - Results';

var qs = [
  { tag:'Subject-Verb Agreement', sentHtml:'The collection of rare manuscripts, which had been hidden in the museum&rsquo;s archive for decades, <u>were finally put</u> on public display last spring.',
    opts:['was finally put','were finally put','had finally put','are finally putting'], ci:0,
    exp:'The subject of the verb is "collection" (singular), not "manuscripts," which is part of the intervening clause. The singular verb "was finally put" agrees correctly with "collection."' },
  { tag:'Pronoun Agreement', sentHtml:'The company announced that <u>they are launching</u> a new product line next quarter.',
    opts:['it is launching','they are launching','it are launching','they is launching'], ci:0,
    exp:'"Company" is a singular noun, so the pronoun referring to it should be singular: "it." "They" incorrectly treats the company as plural.' },
  { tag:'Comma Usage', sentHtml:'My grandmother, who taught piano for forty years<u> inspired</u> my love of music.',
    opts:[', inspired',' inspired','; inspired','. Inspired'], ci:0,
    exp:'The nonrestrictive clause "who taught piano for forty years" must be set off by commas on both sides. A comma is needed before "inspired" to close the clause.' },
  { tag:'Comma Splice', sentHtml:'The rain had not stopped for three days<u>, the river began</u> to rise above its banks.',
    opts:['; the river began',', the river began',' the river began',', but the river began'], ci:0,
    exp:'Two independent clauses ("The rain had not stopped..." and "the river began to rise...") cannot be joined with just a comma. A semicolon correctly joins them without a conjunction.' },
  { tag:'Apostrophe Usage', sentHtml:'The museum updated <u>it&rsquo;s</u> exhibit on ancient Egypt to include several newly discovered artifacts.',
    opts:['its','it&rsquo;s','its&rsquo;','their'], ci:0,
    exp:'"Its" (no apostrophe) is the possessive form. "It\'s" is a contraction meaning "it is," which does not make sense in this sentence.' },
  { tag:'Parallel Structure', sentHtml:'The new policy aims to reduce paper waste, lower printing costs, and <u>it will improve</u> employee efficiency.',
    opts:['improve','it will improve','improving','to improve'], ci:0,
    exp:'The sentence lists three goals in a parallel series: "reduce," "lower," and the verb should match this pattern as simply "improve," not "it will improve."' },
  { tag:'Modifier Placement', sentHtml:'<u>Having finished the marathon in record time,</u> the crowd cheered loudly for the exhausted runner.',
    opts:['After the runner finished the marathon in record time,','Having finished the marathon in record time,','Finishing the marathon in record time, the crowd','The marathon having been finished in record time,'], ci:0,
    exp:'As originally written, the modifying phrase illogically attaches to "the crowd," implying the crowd finished the marathon. Rewording with "After the runner finished..." correctly identifies the runner as the one who completed the race.' },
  { tag:'Verb Tense', sentHtml:'By the time the guests arrived, Maria <u>finishes</u> cooking the entire meal.',
    opts:['had finished','finishes','will finish','is finishing'], ci:0,
    exp:'Because "arrived" is in the simple past and Maria completed cooking before the guests arrived, the past perfect "had finished" is needed to show the earlier action.' },
  { tag:'Colon Usage', sentHtml:'The chef needed only three ingredients to make the sauce<u>, butter, garlic, and fresh basil</u>.',
    opts:[': butter, garlic, and fresh basil',', butter, garlic, and fresh basil','; butter, garlic, and fresh basil',' butter, garlic, and fresh basil'], ci:0,
    exp:'A colon is used to introduce a list after a complete independent clause. Since "The chef needed only three ingredients to make the sauce" is itself a complete sentence, a colon (not a comma) should introduce the list.' },
  { tag:'Semicolon Usage', sentHtml:'The experiment produced unexpected results<u>, however, the team decided</u> to repeat it under stricter conditions.',
    opts:['; however, the team decided',', however, the team decided','. However the team decided',', however the team decided'], ci:0,
    exp:'When a conjunctive adverb like "however" joins two independent clauses, it must be preceded by a semicolon (and followed by a comma): "; however,"' },
  { tag:'Colon vs Semicolon', sentHtml:'After years of careful research, the scientist arrived at a single conclusion<u>; that pollution levels were directly tied to the decline in fish populations</u>.',
    opts:[': that pollution levels were directly tied to the decline in fish populations','; that pollution levels were directly tied to the decline in fish populations',', which was that pollution levels were directly tied to the decline in fish populations','. That pollution levels were directly tied to the decline in fish populations'], ci:0,
    exp:'A semicolon must join two independent clauses, but "that pollution levels were directly tied to the decline in fish populations" is a subordinate clause, not independent. A colon correctly introduces this clause as an explanation of "a single conclusion."' },
  { tag:'Diction', sentHtml:'The new lighting in the gallery had a noticeable <u>affect</u> on how visitors perceived the paintings.',
    opts:['effect','affect','effects','affects'], ci:0,
    exp:'"Effect" (noun) means a result or outcome, which is what the sentence describes. "Affect" is typically used as a verb meaning "to influence."' },
  { tag:'Redundancy', sentHtml:'The report provided a <u>brief summary that was short and concise</u> of the company&rsquo;s financial performance.',
    opts:['brief summary','brief summary that was short and concise','summary that was brief, short, and concise','concise and brief short summary'], ci:0,
    exp:'"Brief," "short," and "concise" all express the same idea, making the phrase redundant. "Brief summary" alone conveys the meaning clearly and concisely.' },
  { tag:'Transitions', sentHtml:'The bridge had been closed for repairs for nearly a month; <u>therefore</u>, traffic on the surrounding streets had actually decreased.',
    opts:['however','therefore','for example','in addition'], ci:0,
    exp:'A month-long bridge closure would normally be expected to increase traffic on surrounding streets, so the fact that it "actually decreased" is a contrast, not a logical result. "However" correctly signals this unexpected contrast, while "therefore" incorrectly implies an expected outcome.' },
  { tag:'Subject-Verb Agreement', sentHtml:'Neither the manager nor the employees <u>was aware</u> of the policy change before the meeting.',
    opts:['were aware','was aware','is aware','have been aware'], ci:0,
    exp:'With "neither...nor" constructions, the verb agrees with the subject closer to it. Here, the nearer subject is "employees" (plural), so the plural verb "were aware" is correct.' },
  { tag:'Modifier Placement', sentHtml:'<u>Eager to impress the judges,</u> the science project was completed three days before the deadline.',
    opts:['Because the students were eager to impress the judges,','Eager to impress the judges,','Being eager to impress the judges, the project','Eager to impress the judges, completing the project'], ci:0,
    exp:'As written, "eager to impress the judges" illogically describes "the science project," which cannot feel eager. Only the revision naming the students as the subject of the modifying clause fixes the dangling modifier.' },
  { tag:'Comparative Form', sentHtml:'Of the two routes to the cabin, the gravel road is <u>the most direct</u> than the paved highway.',
    opts:['more direct','the most direct','more directly','much more directest'], ci:0,
    exp:'When comparing exactly two items, the comparative form ("more direct") is correct, not the superlative ("the most direct"), which is reserved for comparing three or more items.' },
  { tag:'Subjunctive Mood', sentHtml:'If the museum <u>was</u> open on Mondays, more visitors could plan weekday trips.',
    opts:['were','was','is','would be'], ci:0,
    exp:'This sentence describes a hypothetical condition contrary to fact (the museum is not actually open on Mondays), which requires the subjunctive mood: "If the museum were open..."' },
  { tag:'Modifier Placement', sentHtml:'The teacher <u>only gave the assignment</u> to students who attended the review session.',
    opts:['gave the assignment only','only gave the assignment','gave only the assignment','only had given the assignment'], ci:0,
    exp:'The limiting word "only" should sit directly before the phrase it restricts: "to students who attended the review session." Placing it before "gave" incorrectly suggests a limit on the act of giving itself rather than on who received the assignment.' },
  { tag:'Idiom', sentHtml:'The new regulations are <u>different than</u> the ones proposed last year.',
    opts:['different from','different than','differently than','differing than'], ci:0,
    exp:'In formal written English, "different" is conventionally paired with "from," not "than." "Different from" is the standard idiomatic phrase.' }
];

var state = {};

function loadState() {
  try {
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; }
    else { resetState(); }
  } catch(e) { localStorage.removeItem(QUIZ_KEY); resetState(); }
}

function resetState() {
  state = { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}

function saveState() { localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i) {
  if (!state.shuffles[i]) {
    var a=[0,1,2,3];
    for (var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i) { return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts() { return parseInt(localStorage.getItem(ATT_KEY) || '0', 10); }

function updateNav() {
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}

function toggleJump() {
  var p=document.getElementById('dot-panel'); var b=document.getElementById('jump-btn');
  if (p.style.display==='none'||!p.style.display) { p.style.display='block'; b.textContent='Hide ▴'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump ▾'; }
}

function renderDots() {
  var p=document.getElementById('dot-panel');
  if (p.style.display!=='block') return;
  var h='';
  for (var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if (Object.keys(state.answers).length===qs.length) {
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}

function goToQ(i) {
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump ▾';
}

function showResults() {
  state.showResults = true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render() {
  if (state.showResults) { renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();

  var i=state.cur; var q=qs[i];
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  document.getElementById('q-tag-label').textContent=q.tag;
  document.getElementById('sent-box').innerHTML=q.sentHtml;

  var sh=getShuffle(i); var ans=state.answers[i]; var csi=getCSI(i); var html='';
  for (var s=0;s<4;s++){
    var oi=sh[s]; var cls='opt-btn'; var dis='';
    if (ans!==undefined) {
      dis='disabled';
      if (s===csi) cls+=' correct';
      else if (s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+escHtml(q.opts[oi])+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;

  var eb=document.getElementById('exp-box');
  if (ans!==undefined && ans!==csi) { eb.style.display='block'; eb.textContent=q.exp; }
  else { eb.style.display='none'; }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults() {
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i]===undefined) sk++;
    else if (state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for (var i=0;i<qs.length;i++){
    var a=state.answers[i]; var label,bg,tc;
    if (a===undefined) { label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (a===getCSI(i)) { label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
      '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+escHtml(qs[i].tag)+'</span>'+
      '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span>'+
      '</div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}

function pick(qi,si) {
  if (state.answers[qi]!==undefined) return;
  state.answers[qi]=si; saveState(); render();
}

function go(dir) {
  if (dir===1 && state.cur===qs.length-1) { showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}

function retryWrong() {
  var first=-1;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i]!==undefined && state.answers[i]!==getCSI(i)) {
      if (first===-1) first=i;
      delete state.answers[i];
    }
  }
  if (first!==-1) { state.cur=first; state.showResults=false; saveState(); render(); }
}

function copyRes() {
  var lines=[QUIZ_LABEL];
  for (var i=0;i<qs.length;i++){
    var a=state.answers[i];
    lines.push('Q'+(i+1)+' '+qs[i].tag+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt=lines.join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);}); }
  else { fallbackCopy(txt); }
}

function fallbackCopy(txt) {
  var ta=document.createElement('textarea'); ta.value=txt;
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal() { document.getElementById('freshModal').style.display='flex'; }
function confirmFresh() {
  document.getElementById('freshModal').style.display='none';
  localStorage.removeItem(QUIZ_KEY);
  resetState(); saveState(); render(); renderTimer();
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatTime(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60); var s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer() {
  var setupEl=document.getElementById('timerSetup'); var runningEl=document.getElementById('timerRunning'); var displayEl=document.getElementById('timerDisplay');
  if (!state.timerStartedAt) { setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed=(Date.now()-state.timerStartedAt)/1000;
  var remaining=state.timerTotalSec-elapsed;
  displayEl.classList.remove('warn','danger');
  if (remaining<=0) { displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent=formatTime(remaining);
  if (remaining<=state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if (remaining<=state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer() {
  var input=document.getElementById('timerMinutesInput');
  var minutes=parseFloat(input.value);
  if (!minutes||minutes<=0) minutes=20;
  state.timerTotalSec=Math.round(minutes*60);
  state.timerStartedAt=Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval() { stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval() { if (timerInterval) { clearInterval(timerInterval); timerInterval=null; } }

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes;
window.openFreshModal=openFreshModal; window.confirmFresh=confirmFresh; window.showResults=showResults;
window.startTimer=startTimer;
