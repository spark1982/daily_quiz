var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261017";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["sets", "will set", "NO CHANGE", "is setting"], "ci": 2, "exp": "The email tells about &ldquo;last night,&rdquo; so the past tense <i>set</i> is already correct: <i>Last night, Dad <b>set</b> it up in the backyard.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Thank-You Email to Aunt Meg</strong><br><b>(1)</b> Thank you so much for the telescope you sent for my birthday. <b>(2)</b> Last night, Dad <u>set</u> it up in the backyard, and we looked at the moon for an hour. <b>(3)</b> I <u>have saw</u> pictures of craters before, but seeing them myself was amazing. <b>(4)</b> Tomorrow night, <u>my brother and me</u> want to find Saturn. <b>(5)</b> Mom says Saturns rings are easy to spot on a clear night. <b>(6)</b> The telescope&rsquo;s instruction book has helpful star maps, too. <b>(7)</b> I will send you a picture of the moon soon!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "has seen", "had saw", "have seen"], "ci": 3, "exp": "After <i>have</i>, use the past participle <i>seen</i>, not the past tense <i>saw</i>: <i>I <b>have seen</b> pictures of craters before.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Thank-You Email to Aunt Meg</strong><br><b>(1)</b> Thank you so much for the telescope you sent for my birthday. <b>(2)</b> Last night, Dad <u>set</u> it up in the backyard, and we looked at the moon for an hour. <b>(3)</b> I <u>have saw</u> pictures of craters before, but seeing them myself was amazing. <b>(4)</b> Tomorrow night, <u>my brother and me</u> want to find Saturn. <b>(5)</b> Mom says Saturns rings are easy to spot on a clear night. <b>(6)</b> The telescope&rsquo;s instruction book has helpful star maps, too. <b>(7)</b> I will send you a picture of the moon soon!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["my brother and I", "NO CHANGE", "me and my brother", "my brother and myself"], "ci": 0, "exp": "Use <i>I</i> for the person doing the action (the subject). Take away &ldquo;my brother and&rdquo; to test it: <i>I want to find Saturn.</i> So: <i><b>My brother and I</b> want to find Saturn.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Thank-You Email to Aunt Meg</strong><br><b>(1)</b> Thank you so much for the telescope you sent for my birthday. <b>(2)</b> Last night, Dad <u>set</u> it up in the backyard, and we looked at the moon for an hour. <b>(3)</b> I <u>have saw</u> pictures of craters before, but seeing them myself was amazing. <b>(4)</b> Tomorrow night, <u>my brother and me</u> want to find Saturn. <b>(5)</b> Mom says Saturns rings are easy to spot on a clear night. <b>(6)</b> The telescope&rsquo;s instruction book has helpful star maps, too. <b>(7)</b> I will send you a picture of the moon soon!"}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Thank you so much for the telescope you sent for my birthday.", "The telescope&rsquo;s instruction book has helpful star maps, too.", "I will send you a picture of the moon soon!", "Mom says Saturns rings are easy to spot on a clear night."], "ci": 3, "exp": "The rings belong to Saturn, so it needs an apostrophe to show ownership: <i>Mom says <b>Saturn&rsquo;s</b> rings are easy to spot on a clear night.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Thank-You Email to Aunt Meg</strong><br><b>(1)</b> Thank you so much for the telescope you sent for my birthday. <b>(2)</b> Last night, Dad <u>set</u> it up in the backyard, and we looked at the moon for an hour. <b>(3)</b> I <u>have saw</u> pictures of craters before, but seeing them myself was amazing. <b>(4)</b> Tomorrow night, <u>my brother and me</u> want to find Saturn. <b>(5)</b> Mom says Saturns rings are easy to spot on a clear night. <b>(6)</b> The telescope&rsquo;s instruction book has helpful star maps, too. <b>(7)</b> I will send you a picture of the moon soon!"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["floats", "NO CHANGE", "are floating", "have floated"], "ci": 0, "exp": "The subject is <i>group</i> (one group), not <i>otters</i>, so the verb is singular: <i>A group of sea otters <b>floats</b> together in a raft.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: Tool Users of the Sea</strong><br><b>(1)</b> Sea otters live in the cold waters off the coast of California. <b>(2)</b> A group of sea otters <u>float</u> together in a raft so the members do not drift apart. <b>(3)</b> Sea otters eat clams and sea urchins. <b>(4)</b> These animals have hard shells. <b>(5)</b> <u>To crack the shells. An otter</u> bangs them against a flat rock on its chest. <b>(6)</b> Scientists <u>have watched</u> some otters keep a favorite rock for years. <b>(7)</b> Few animals use tools as cleverly as sea otters do."}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["Sea otters eat clams and sea urchins, who have hard shells.", "Sea otters eat clams and sea urchins, they have hard shells.", "Sea otters eat clams and sea urchins, which have hard shells.", "Sea otters, which have hard shells, eat clams and sea urchins."], "ci": 2, "exp": "Use <i>which</i> (not <i>who</i>) for animals and things, and put it right after the words it describes: <i>Sea otters eat clams and sea urchins, <b>which</b> have hard shells.</i> Moving the clause makes it sound like the otters have hard shells.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: Tool Users of the Sea</strong><br><b>(1)</b> Sea otters live in the cold waters off the coast of California. <b>(2)</b> A group of sea otters <u>float</u> together in a raft so the members do not drift apart. <b>(3)</b> Sea otters eat clams and sea urchins. <b>(4)</b> These animals have hard shells. <b>(5)</b> <u>To crack the shells. An otter</u> bangs them against a flat rock on its chest. <b>(6)</b> Scientists <u>have watched</u> some otters keep a favorite rock for years. <b>(7)</b> Few animals use tools as cleverly as sea otters do."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["To crack the shells, an otter", "NO CHANGE", "To crack the shells; an otter", "To crack the shells and an otter"], "ci": 0, "exp": "&ldquo;To crack the shells&rdquo; is not a complete sentence. Join it to the main sentence with a comma: <i><b>To crack the shells, an otter</b> bangs them against a flat rock on its chest.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Report: Tool Users of the Sea</strong><br><b>(1)</b> Sea otters live in the cold waters off the coast of California. <b>(2)</b> A group of sea otters <u>float</u> together in a raft so the members do not drift apart. <b>(3)</b> Sea otters eat clams and sea urchins. <b>(4)</b> These animals have hard shells. <b>(5)</b> <u>To crack the shells. An otter</u> bangs them against a flat rock on its chest. <b>(6)</b> Scientists <u>have watched</u> some otters keep a favorite rock for years. <b>(7)</b> Few animals use tools as cleverly as sea otters do."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["have watch", "has watched", "NO CHANGE", "have watching"], "ci": 2, "exp": "<i>Scientists</i> is plural, so <i>have</i> + the past participle <i>watched</i> is already correct: <i>Scientists <b>have watched</b> some otters keep a favorite rock for years.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Report: Tool Users of the Sea</strong><br><b>(1)</b> Sea otters live in the cold waters off the coast of California. <b>(2)</b> A group of sea otters <u>float</u> together in a raft so the members do not drift apart. <b>(3)</b> Sea otters eat clams and sea urchins. <b>(4)</b> These animals have hard shells. <b>(5)</b> <u>To crack the shells. An otter</u> bangs them against a flat rock on its chest. <b>(6)</b> Scientists <u>have watched</u> some otters keep a favorite rock for years. <b>(7)</b> Few animals use tools as cleverly as sea otters do."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["showed", "NO CHANGE", "will show", "is showing"], "ci": 0, "exp": "The diary tells what happened today in the past tense (<i>taught</i>), so keep the past tense: <i>First, she <b>showed</b> me how to put a spoonful of filling in each wrapper.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Diary: Dumpling Day</strong><br><b>(1)</b> Today Grandma taught me how to fold dumplings in her small, warm kitchen. <b>(2)</b> First, she <u>shows</u> me how to put a spoonful of filling in the middle of each wrapper. <b>(3)</b> My first dumplings were lumpy and a little crooked. <b>(4)</b> They still tasted delicious. <b>(5)</b> I <u>could of</u> eaten twenty of them! <b>(6)</b> When we finished cooking Grandma wrapped the leftovers for my lunch. <b>(7)</b> Next Sunday, we will try a new recipe with Uncle Ray and my cousins."}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["My first dumplings were lumpy and a little crooked, so they still tasted delicious.", "My first dumplings were lumpy and a little crooked, they still tasted delicious.", "My first dumplings were lumpy and a little crooked because they still tasted delicious.", "My first dumplings were lumpy and a little crooked, but they still tasted delicious."], "ci": 3, "exp": "The two ideas are opposite (lumpy, yet delicious), so use <i>but</i> with a comma: <i>My first dumplings were lumpy and a little crooked, <b>but</b> they still tasted delicious.</i> Joining them with only a comma makes a run-on.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Diary: Dumpling Day</strong><br><b>(1)</b> Today Grandma taught me how to fold dumplings in her small, warm kitchen. <b>(2)</b> First, she <u>shows</u> me how to put a spoonful of filling in the middle of each wrapper. <b>(3)</b> My first dumplings were lumpy and a little crooked. <b>(4)</b> They still tasted delicious. <b>(5)</b> I <u>could of</u> eaten twenty of them! <b>(6)</b> When we finished cooking Grandma wrapped the leftovers for my lunch. <b>(7)</b> Next Sunday, we will try a new recipe with Uncle Ray and my cousins."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["could have", "NO CHANGE", "could has", "could had"], "ci": 0, "exp": "&ldquo;Could of&rdquo; is a mistake that comes from how &ldquo;could&rsquo;ve&rdquo; sounds. Write <i>could have</i>: <i>I <b>could have</b> eaten twenty of them!</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Diary: Dumpling Day</strong><br><b>(1)</b> Today Grandma taught me how to fold dumplings in her small, warm kitchen. <b>(2)</b> First, she <u>shows</u> me how to put a spoonful of filling in the middle of each wrapper. <b>(3)</b> My first dumplings were lumpy and a little crooked. <b>(4)</b> They still tasted delicious. <b>(5)</b> I <u>could of</u> eaten twenty of them! <b>(6)</b> When we finished cooking Grandma wrapped the leftovers for my lunch. <b>(7)</b> Next Sunday, we will try a new recipe with Uncle Ray and my cousins."}, {"stem": "Where should a comma be added in sentence 6?", "opts": ["When we finished, cooking Grandma wrapped the leftovers for my lunch.", "When we finished cooking Grandma, wrapped the leftovers for my lunch.", "When we finished cooking, Grandma wrapped the leftovers for my lunch.", "When we finished cooking Grandma wrapped the leftovers, for my lunch."], "ci": 2, "exp": "Put a comma after an introductory part that begins with <i>when</i>: <i>When we finished cooking<b>,</b> Grandma wrapped the leftovers for my lunch.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Diary: Dumpling Day</strong><br><b>(1)</b> Today Grandma taught me how to fold dumplings in her small, warm kitchen. <b>(2)</b> First, she <u>shows</u> me how to put a spoonful of filling in the middle of each wrapper. <b>(3)</b> My first dumplings were lumpy and a little crooked. <b>(4)</b> They still tasted delicious. <b>(5)</b> I <u>could of</u> eaten twenty of them! <b>(6)</b> When we finished cooking Grandma wrapped the leftovers for my lunch. <b>(7)</b> Next Sunday, we will try a new recipe with Uncle Ray and my cousins."}, {"stem": "Where should a comma be added in sentence 2?", "opts": ["&ldquo;Our snowman, needs a carrot nose&rdquo; said Lily.", "&ldquo;Our snowman needs a carrot nose&rdquo; said, Lily.", "&ldquo;Our snowman needs, a carrot nose&rdquo; said Lily.", "&ldquo;Our snowman needs a carrot nose,&rdquo; said Lily."], "ci": 3, "exp": "When a quotation comes before <i>said</i>, put a comma inside the closing quotation mark: <i>&ldquo;Our snowman needs a carrot nose<b>,</b>&rdquo; said Lily.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The Snowman Contest</strong><br><b>(1)</b> On Saturday morning, the whole street entered the snowman contest. <b>(2)</b> &ldquo;Our snowman needs a carrot nose&rdquo; said Lily. <b>(3)</b> Her brother Max and <u>her</u> searched the kitchen until they found one. <b>(4)</b> By noon, they <u>had built</u> a snowman taller than their dad. <b>(5)</b> One judge said the snowman looked real good. <b>(6)</b> Lily and Max won a blue ribbon and two cups of hot cocoa. <b>(7)</b> It was the happiest day of their winter."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "them", "herself", "she"], "ci": 3, "exp": "Max and Lily are doing the searching, so use the subject pronoun <i>she</i>. Test it: <i>She searched the kitchen.</i> So: <i>Her brother Max and <b>she</b> searched the kitchen.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Story: The Snowman Contest</strong><br><b>(1)</b> On Saturday morning, the whole street entered the snowman contest. <b>(2)</b> &ldquo;Our snowman needs a carrot nose&rdquo; said Lily. <b>(3)</b> Her brother Max and <u>her</u> searched the kitchen until they found one. <b>(4)</b> By noon, they <u>had built</u> a snowman taller than their dad. <b>(5)</b> One judge said the snowman looked real good. <b>(6)</b> Lily and Max won a blue ribbon and two cups of hot cocoa. <b>(7)</b> It was the happiest day of their winter."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["had build", "have builded", "NO CHANGE", "had builded"], "ci": 2, "exp": "<i>Had</i> + the past participle <i>built</i> is already correct (not &ldquo;builded&rdquo;): <i>By noon, they <b>had built</b> a snowman taller than their dad.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Story: The Snowman Contest</strong><br><b>(1)</b> On Saturday morning, the whole street entered the snowman contest. <b>(2)</b> &ldquo;Our snowman needs a carrot nose&rdquo; said Lily. <b>(3)</b> Her brother Max and <u>her</u> searched the kitchen until they found one. <b>(4)</b> By noon, they <u>had built</u> a snowman taller than their dad. <b>(5)</b> One judge said the snowman looked real good. <b>(6)</b> Lily and Max won a blue ribbon and two cups of hot cocoa. <b>(7)</b> It was the happiest day of their winter."}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["On Saturday morning, the whole street entered the snowman contest.", "One judge said the snowman looked real good.", "Lily and Max won a blue ribbon and two cups of hot cocoa.", "It was the happiest day of their winter."], "ci": 1, "exp": "<i>Good</i> is described here, so use the adverb <i>really</i> (or <i>very</i>), not <i>real</i>: <i>One judge var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
