ey that is owed to you", "a statement that has not been proven"], "ci": 0, "exp": "The companies would &ldquo;claim the land, build hotels, and charge visitors,&rdquo; which means they would take it for themselves. &ldquo;To say that something is true&rdquo; is another meaning of claim, but it does not fit land.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>America&rsquo;s First National Park</strong><br>In the summer of 1870, a group of explorers traveled into the remote wilderness where the present-day states of Wyoming, Montana, and Idaho meet. They returned with astonishing reports of boiling springs, towering waterfalls, and geysers that hurled scalding water high into the air. Many people in the East refused to believe them. The following year, the geologist Ferdinand Hayden led a government survey to the region, bringing along the photographer William Henry Jackson and the painter Thomas Moran. Their photographs and paintings gave members of Congress something the written reports could not: proof.<br><br>Hayden worried that private companies would soon claim the land, build hotels, and charge visitors to see the geysers. He urged lawmakers to protect it instead. On March 1, 1872, President Ulysses S. Grant signed a law setting aside more than two million acres as Yellowstone National Park, &ldquo;for the benefit and enjoyment of the people.&rdquo;<br><br>No nation had ever done anything quite like it. The idea of giving wild land permanent protection eventually spread across the country and around the world, and today the U.S. National Park System includes more than four hundred areas."}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Explorers in 1870 found boiling springs, waterfalls, and geysers in the area where three states meet.", "Proof gathered by a government survey helped Congress protect Yellowstone, creating the first national park and an idea that spread worldwide.", "Private companie report boiling springs and geysers &rarr; President Grant signs the park law &rarr; Hayden leads a government survey &rarr; the idea spreads around the world", "explorers report boiling springs and geysers &rarr; Hayden leads a government survey &rarr; the idea spreads around the world &rarr; President Grant signs the park law", "explorers report boiling springs and geysers &rarr; Hayden leads a government survey &rarr; President Grant signs the park law &rarr; the idea spreads around the world"], "ci": 3, "exp": "The explorers went in 1870, Hayden&rsquo;s survey came &ldquo;the following year,&rdquo; Grant signed the law on March 1, 1872, and the idea &ldquo;eventually spread.&rdquo; Hayden&rsquo;s survey came after the explorers&rsquo; reports, not before.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>America&rsquo;s First National Park</strong><br>In the summer of 1870, a group of explorers traveled into the remote wilderness where the present-day states of Wyoming, Montana, and Idaho meet. They returned with astonishing reports of boiling springs, towering waterfalls, and geysers that hurled scalding water high into the air. Many people in the East refused to believe them. The following year, the geologist Ferdinand Hayden led a government survey to the region, bringing along the photographer William Henry Jackson and the painter Thomas Moran. Their photographs and paintings gave members of Congress something the written reports could not: proof.<br><br>Hayden worried that private companies would soon claim the land, build hotels, and charge visitors to see the geysers. He urged lawmakers to protect it instead. On March 1, 1872, President Ulysses S. Grant signed a law setting aside more than two million acres as Yellowstone National Park, &ldquo;for the benefit and enjoyment of the people.&rdquo;<br><br>No nation had ever done anything quite like it. The idea of giving wild land permanent protection eventually spread across the country and around the world, and today the U.S. National Park System includes more than four hundred areas."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Each trap can close and reopen hundreds of times.", "The trap snaps shut in less than a second.", "The plant grows naturally in wetlands near Wilmington, North Carolina.", "The leaves release juices that dissolve the soft parts of the insect."], "ci": 0, "exp": "The passage says each trap &ldquo;can close only a handful of times before it dies,&rdquo; not hundreds of times. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>A Plant That Eats Meat</strong><br>Most plants make all the food they need from sunlight, water, and air, but the Venus flytrap also captures insects. This unusual plant grows naturally in only one small region: the boggy wetlands within about seventy-five miles of Wilmington, North Carolina. The soil there is soggy and sour, and it contains very little nitrogen. Without enough of this nutrient, most plants grow weak and pale. By digesting insects, the flytrap obtains the nitrogen the soil cannot provide.<br><br>Each trap is a pair of hinged leaves lined with stiff bristles. On the inner surface are tiny trigger hairs. If an ant brushes against one hair, nothing happens. But if it touches two hairs within about twenty seconds, the trap snaps shut in less than a second. This two-touch system keeps the plant from wasting energy on raindrops or falling leaves. The bristles interlock like fingers, and over the next several days, the leaves release juices that dissolve the insect&rsquo;s soft parts.<br><br>Although flytraps are skilled hunters, the plants themselves are fragile. Each trap can close only a handful of times before it dies, so people who poke the traps for fun can harm them. Because collectors have dug up so many wild plants, it is now a crime in North Carolina to take one from the land without permission."}, {"stem": "The prefix <i>inter-</i> means &ldquo;between&rdquo; or &ldquo;together.&rdquo; What does &ldquo;interlock&rdquo; most likely mean in the second paragraph?", "opts": ["break apart quickly", "lock from the inside only", "move up and down", "fit tightly together"], "ci": 3, "exp": "<i>Inter-</i> (together) + <i>lock</i>: the bristles &ldquo;interlock like fingers,&rdquo; fitting together to close the trap. &ldquo;Lock from the inside only&rdquo; uses the word lock but ignores the meaning of the prefix.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>A Plant That Eats Meat</strong><br>Most plants make all the food they need from sunlight, water, and air, but the Venus flytrap also captures insects. This unusual plant grows naturally in only one small region: the boggy wetlands within about seventy-five miles of Wilmington, North Carolina. The soil there is soggy and sour, and it contains very little nitrogen. Without enough of this nutrient, most plants grow weak and pale. By digesting insects, the flytrap obtains the nitrogen the soil cannot provide.<br><br>Each trap is a pair of hinged leaves lined with stiff bristles. On the inner surface are tiny trigger hairs. If an ant brushes against one hair, nothing happens. But if it touches two hairs within about twenty seconds, the trap snaps shut in less than a second. This two-touch system keeps the plant from wasting energy on raindrops or falling leaves. The bristles interlock like fingers, and over the next several days, the leaves release juices that dissolve the insect&rsquo;s soft parts.<br><br>Although flytraps are skilled hunters, the plants themselves are fragile. Each trap can close only a handful of times before it dies, so people who poke the traps for fun can harm them. Because collectors have dug up so many wild plants, it is now a crime in North Carolina to take one from the land without permission."}, {"stem": "Why would poking a trap &ldquo;for fun&rdquo; most likely harm the plant?", "opts": ["It makes the trap close for no reason, using up one of its few closings.", "It spreads too much nitrogen onto the leaves.", "It breaks the stiff bristles off the edges of the trap.", "It makes the plant release juices that poison the soil."], "ci": 0, "exp": "Each trap can close &ldquo;only a handful of times,&rdquo; so a closing with no insect inside is wasted. The passage never says that poking breaks the bristles.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>A Plant That Eats Meat</strong><br>Most plants make all the food they need from sunlight, water, and air, but the Venus flytrap also captures insects. This unusual plant grows naturally in only one small region: the boggy wetlands within about seventy-five miles of Wilmington, North Carolina. The soil there is soggy and sour, and it contains very little nitrogen. Without enough of this nutrient, most plants grow weak and pale. By digesting insects, the flytrap obtains the nitrogen the soil cannot provide.<br><br>Each trap is a pair of hinged leaves lined with stiff bristles. On the inner surface are tiny trigger hairs. If an ant brushes against one hair, nothing happens. But if it touches two hairs within about twenty seconds, the trap snaps shut in less than a second. This two-touch system keeps the plant from wasting energy on raindrops or falling leaves. The bristles interlock like fingers, and over the next several days, the leaves release juices that dissolve the insect&rsquo;s soft parts.<br><br>Although flytraps are skilled hunters, the plants themselves are fragile. Each trap can close only a handful of times before it dies, so people who poke the traps for fun can harm them. Because collectors have dug up so many wild plants, it is now a crime in North Carolina to take one from the land without permission."}, {"stem": "What is the main effect of the flytrap&rsquo;s two-touch system?", "opts": ["The insect has twenty seconds to escape before the trap closes.", "The plant does not waste energy closing on raindrops or falling leaves.", "The trigger hairs become stiff enough to hold the insect.", "The leaves release juices as soon as one hair is touched."], "ci": 1, "exp": "The passage says, &ldquo;This two-touch system keeps the plant from wasting energy on raindrops or falling leaves.&rdquo; Twenty seconds is the time limit for the second touch, not time for the insect to escape.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>A Plant That Eats Meat</strong><br>Most plants make all the food they need from sunlight, water, and air, but the Venus flytrap also captures insects. This unusual plant grows naturally in only one small region: the boggy wetlands within about seventy-five miles of Wilmington, North Carolina. The soil there is soggy and sour, and it contains very little nitrogen. Without enough of this nutrient, most plants grow weak and pale. By digesting insects, the flytrap obtains the nitrogen the soil cannot provide.<br><br>Each trap is a pair of hinged leaves lined with stiff bristles. On the inner surface are tiny trigger hairs. If an ant brushes against one hair, nothing happens. But if it touches two hairs within about twenty seconds, the trap snaps shut in less than a second. This two-touch system keeps the plant from wasting energy on raindrops or falling leaves. The bristles interlock like fingers, and over the next several days, the leaves release juices that dissolve the insect&rsquo;s soft parts.<br><br>Although flytraps are skilled hunters, the plants themselves are fragile. Each trap can close only a handful of times before it dies, so people who poke the traps for fun can harm them. Because collectors have dug up so many wild plants, it is now a crime in North Carolina to take one from the land without permission."}, {"stem": "What did Nadia do to find out whether the woman was right?", "opts": ["She asked Theo to taste one of the cupcakes.", "She checked var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
