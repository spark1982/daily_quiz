we can look for the constellations together when you visit in December."}, {"stem": "Where should a comma be added in sentence 4?", "opts": ["After the show ended, we bought star maps at the gift shop.", "After the show ended we bought, star maps at the gift shop.", "After the show, ended we bought star maps at the gift shop.", "After the show ended we bought star maps, at the gift shop."], "ci": 0, "exp": "Put a comma after an introductory part that begins with a word like <i>after</i>, <i>when</i>, or <i>because</i>: <i>After the show ended<b>,</b> we bought star maps at the gift shop.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>An Email to Cousin Lucas</strong><br><b>(1)</b> Last Thursday my class took a field trip to the planetarium downtown. <b>(2)</b> I have never <u>saw</u> so many stars in one place. <b>(3)</b> Our guide, <u>who</u> has worked there for twenty years, pointed out the Big Dipper and the North Star. <b>(4)</b> After the show ended we bought star maps at the gift shop. <b>(5)</b> The maps glow in the dark. <b>(6)</b> They show every constellation we learned about. <b>(7)</b> Maybe we can look for the constellations together when you visit in December."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["The maps glow in the dark, they show every constellation we learned about.", "The maps glow in the dark, and they show every constellation we learned about.", "The maps glow in the dark, but they show every constellation we learned about.", "The maps glow in the dark and, they show every constellation we learned about."], "ci": 1, "exp": "Two complete sentences can be joined with a comma plus <i>and</i> when the second idea adds to the first: <i>The maps glow in the dark<b>, and</b> they show every constellation we learned about.</i> A comma alone makes a comma splice, and <i>but</i> wrongly suggests the two ideas are opposites.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>An Email to Cousin Lucas</strong><br><b>(1)</b> Last Thursday my class took a field trip to the planetarium downtown. <b>(2)</b> I have never <u>saw</u> so many stars in one place. <b>(3)</b> Our guide, <u>who</u> has worked there for twenty years, pointed out the Big Dipper and the North Star. <b>(4)</b> After the show ended we bought star maps at the gift shop. <b>(5)</b> The maps glow in the dark. <b>(6)</b> They show every constellation we learned about. <b>(7)</b> Maybe we can look for the constellations together when you visit in December."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["has been", "are", "NO CHANGE", "was"], "ci": 1, "exp": "The subject is <i>wings</i> (plural), not <i>monarch</i>. The phrase <i>of a monarch</i> just describes the wings, so the verb must be plural: <i>The bright wings of a monarch <b>are</b> orange with thin black lines.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>How Monarch Butterflies Travel</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> The bright wings of a monarch <u>is</u> orange with thin black lines. <b>(3)</b> The butterflies fly south to the mountains of central Mexico. <b>(4)</b> Because the northern winter would kill them. <b>(5)</b> There long trip can cover almost 3,000 miles. <b>(6)</b> Monarchs glide on warm air currents, so they can fly <u>farther</u> than you might expect for such small insects. <b>(7)</b> In spring, their children and grandchildren slowly make the trip back north."}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["The butterflies fly south to the mountains of central Mexico because the northern winter would kill them.", "Because the butterflies fly south to the mountains of central Mexico, the northern winter would kill them.", "The butterflies fly south to the mountains of central Mexico, the northern winter would kill them.", "The butterflies fly south to the mountains of central Mexico, because, the northern winter would kill them."], "ci": 0, "exp": "Sentence 4 is a fragment: <i>Because the northern winter would kill them</i> is not a complete thought. Attach it to the sentence it explains: <i>The butterflies fly south to the mountains of central Mexico <b>because</b> the northern winter would kill them.</i> Moving <i>because</i> to the front of the first idea changes the meaning (it would say flying south causes the winter to kill them).", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>How Monarch Butterflies Travel</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> The bright wings of a monarch <u>is</u> orange with thin black lines. <b>(3)</b> The butterflies fly south to the mountains of central Mexico. <b>(4)</b> Because the northern winter would kill them. <b>(5)</b> There long trip can cover almost 3,000 miles. <b>(6)</b> Monarchs glide on warm air currents, so they can fly <u>farther</u> than you might expect for such small insects. <b>(7)</b> In spring, their children and grandchildren slowly make the trip back north."}, {"stem": "Which sentence has an error?", "opts": ["In spring, their children and grandchildren slowly make the trip back north.", "The butterflies fly south to the mountains of central Mexico.", "Every fall, millions of monarch butterflies leave Canada and the northern United States.", "There long trip can cover almost 3,000 miles."], "ci": 3, "exp": "<i>There</i> means a place. To show that the trip belongs to the butterflies, use the possessive <i>their</i>: <i><b>Their</b> long trip can cover almost 3,000 miles.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>How Monarch Butterflies Travel</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> The bright wings of a monarch <u>is</u> orange with thin black lines. <b>(3)</b> The butterflies fly south to the mountains of central Mexico. <b>(4)</b> Because the northern winter would kill them. <b>(5)</b> There long trip can cover almost 3,000 miles. <b>(6)</b> Monarchs glide on warm air currents, so they can fly <u>farther</u> than you might expect for such small insects. <b>(7)</b> In spring, their children and grandchildren slowly make the trip back north."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["NO CHANGE", "farthest", "more farther", "more far"], "ci": 0, "exp": "When you compare two things (how far monarchs fly and how far you expect), use the comparative form <i>farther</i>. Never add <i>more</i> to a word that already ends in <i>-er</i>. The sentence is already correct.", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>How Monarch Butterflies Travel</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> The bright wings of a monarch <u>is</u> orange with thin black lines. <b>(3)</b> The butterflies fly south to the mountains of central Mexico. <b>(4)</b> Because the northern winter would kill them. <b>(5)</b> There long trip can cover almost 3,000 miles. <b>(6)</b> Monarchs glide on warm air currents, so they can fly <u>farther</u> than you might expect for such small insects. <b>(7)</b> In spring, their children and grandchildren slowly make the trip back north."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["“Can I knead the dough,” Noah asked?", "“Can I knead the dough?” Noah asked.", "NO CHANGE", "“Can I knead the dough?”, Noah asked."], "ci": 1, "exp": "The question mark belongs to the spoken words, so it goes <b>inside</b> the closing quotation mark, and no extra comma is needed after it: <i>“Can I knead the dough<b>?”</b> Noah asked.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>The First Loaf</strong><br><b>(1)</b> On Sunday morning, Noah helped Grandma bake bread for the first time. <b>(2)</b> <u>“Can I knead the dough”? Noah asked.</u> <b>(3)</b> Grandma smiled and <u>hands</u> him the big wooden bowl. <b>(4)</b> Noah pushed and folded the sticky dough for ten minutes. <b>(5)</b> Later, Grandma showed his sister and he how to shape the loaves. <b>(6)</b> “We <u>should of</u> let it rise longer,” Grandma said with a laugh when the first loaf came out flat. <b>(7)</b> The second loaf was tall, golden, and perfect."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["is handing", "will hand", "NO CHANGE", "handed"], "ci": 3, "exp": "The story is told in the past tense (<i>helped</i>, <i>smiled</i>, <i>pushed</i>), so this verb must stay in the past too: <i>Grandma smiled and <b>handed</b> him the big wooden bowl.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>The First Loaf</strong><br><b>(1)</b> On Sunday morning, Noah helped Grandma bake bread for the first time. <b>(2)</b> <u>“Can I knead the dough”? Noah asked.</u> <b>(3)</b> Grandma smiled and <u>hands</u> him the big wooden bowl. <b>(4)</b> Noah pushed and folded the sticky dough for ten minutes. <b>(5)</b> Later, Grandma showed his sister and he how to shape the loaves. <b>(6)</b> “We <u>should of</u> let it rise longer,” Grandma said with a laugh when the first loaf came out flat. <b>(7)</b> The second loaf was tall, golden, and perfect."}, {"stem": "Which sentence has an error?", "opts": ["On Sunday morning, Noah helped Grandma bake bread for the first time.", "Noah pushed and folded the sticky dough for ten minutes.", "Later, Grandma showed his sister and he how to shape the loaves.", "The second loaf was tall, golden, and perfect."], "ci": 2, "exp": "After a verb like <i>showed</i>, use an object pronoun. Test it alone: <i>Grandma showed <b>him</b></i>, not <i>showed he</i>. Fixed: <i>Later, Grandma showed his sister and <b>him</b> how to shape the loaves.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>The First Loaf</strong><br><b>(1)</b> On Sunday morning, Noah helped Grandma bake bread for the first time. <b>(2)</b> <u>“Can I knead the dough”? Noah asked.</u> <b>(3)</b> Grandma smiled and <u>hands</u> him the big wooden bowl. <b>(4)</b> Noah pushed and folded the sticky dough for ten minutes. <b>(5)</b> Later, Grandma showed his sister and he how to shape the loaves. <b>(6)</b> “We <u>should of</u> let it rise longer,” Grandma said with a laugh when the first loaf came out flat. <b>(7)</b> The second loaf was tall, golden, and perfect."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["should had", "NO CHANGE", "should've of", "should have"], "ci": 3, "exp": "<i>Should of</i> is a mistake that comes from how <i>should've</i> sounds. The correct words are <i>should have</i>: <i>“We <b>should have</b> let it rise longer,” Grandma said.</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>The First Loaf</strong><br><b>(1)</b> On Sunday morning, Noah helped Grandma bake bread for the first time. <b>(2)</b> <u>“Can I knead the dough”? Noah asked.</u> <b>(3)</b> Grandma smiled and <u>hands</u> him the big wooden bowl. <b>(4)</b> Noah pushed and folded the sticky dough for ten minutes. <b>(5)</b> Later, Grandma showed his sister and he how to shape the loaves. <b>(6)</b> “We <u>should of</u> let it rise longer,” Grandma said with a laugh when the first loaf came out flat. <b>(7)</b> The second loaf was tall, golden, and perfect."}];

      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
