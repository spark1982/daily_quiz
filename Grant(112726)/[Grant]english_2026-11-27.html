<script>/* mission-grade 2026-11-24 */
(function(){
var CFG = {"date": "20261127", "quizzes": [{"key": "grantmath_24_20261127", "label": "Math", "limit": 5}, {"key": "grantenglish_25", "label": "English", "limit": 6}, {"key": "grantcoding_10", "label": "Coding", "limit": 2}, {"key": "grantspanish_10", "label": "Spanish", "limit": 1}, {"key": "bothkorean_srs12", "label": "Korean", "limit": 3}]};
var SELF = "grantenglish_25";
function me(){ var k = SELF; for(var i=0;i<CFG.quizzes.length;i++){ if(CFG.quizzes[i].key===k) return CFG.quizzes[i]; } return null; }
function rk(key){ return 'mission_' + CFG.date + '_' + key; }
function get(key){ try{ var v = localStorage.getItem(rk(key)); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function allowed(q, total){ return (q.pct !== undefined) ? Math.max(0, total - Math.ceil(total * q.pct / 100)) : q.limit; }
function dayStatus(){ var done=0, fails=0, rows=[]; for(var i=0;i<CFG.quizzes.length;i++){ var q=CFG.quizzes[i], r=get(q.key); if(r){ done++; if(!r.cleared) fails++; } rows.push({q:q, r:r}); } return {done:done, n:CFG.quizzes.length, fails:fails, rows:rows}; }
function grade(f){ return ['A','B','C','D'][f] || 'F'; }
var GC = {A:'#1D9E75',B:'#185FA5',C:'#a5720a',D:'#d9480f',F:'#E24B4A'};
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
function card(r, q, popup){
  var ok = r.cleared;
  var h = '<div style="font-size:1.35rem;font-weight:800;color:' + (ok?'#1D9E75':'#E24B4A') + ';">' + (ok ? '&#127942; Mission cleared!' : '&#9888;&#65039; Mission not cleared') + '</div>'
        + '<div style="margin-top:6px;font-size:0.95rem;color:#333;">' + esc(q.label) + ' &mdash; first try: ' + r.wrong + ' wrong (goal: ' + r.allowed + ' or fewer)</div>';
  var d = dayStatus();
  if(d.done === d.n){
    var g = grade(d.fails);
    h += '<div style="margin-top:14px;border-top:1px solid #e3e7ee;padding-top:12px;"><div style="font-size:0.95rem;font-weight:700;color:#333;">Today&rsquo;s grade</div>'
       + '<div style="font-size:3.2rem;font-weight:900;line-height:1.1;color:' + GC[g] + ';">' + g + '</div>'
       + '<div style="font-size:0.85rem;color:#555;">' + (d.n - d.fails) + ' of ' + d.n + ' missions cleared</div><div style="text-align:left;margin-top:8px;font-size:0.85rem;">';
    for(var i=0;i<d.rows.length;i++){ var x=d.rows[i]; h += '<div>' + (x.r.cleared ? '&#9989; ' : '&#10060; ') + esc(x.q.label) + ' (' + x.r.wrong + ' wrong / goal ' + x.r.allowed + ')</div>'; }
    h += '</div></div>';
  } else {
    h += '<div style="margin-top:10px;font-size:0.85rem;color:#555;">Missions finished today: ' + d.done + ' of ' + d.n + '. Finish them all to see today&rsquo;s grade.</div>';
  }
  if(popup) h += '<button onclick="this.parentNode.parentNode.style.display=\'none\'" style="margin-top:14px;background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 22px;font-weight:700;font-size:0.95rem;cursor:pointer;">OK</button>';
  return h;
}
function show(popup){
  var q = me(); if(!q) return; var r = get(q.key); if(!r) return;
  var b = document.getElementById('mission-badge');
  if(!b){ b = document.createElement('div'); b.id='mission-badge'; b.style.cssText='background:#fff;border:2px solid #d7dde6;border-radius:12px;padding:12px 14px;margin:10px auto;max-width:640px;text-align:center;font-family:inherit;'; var t=document.querySelector('.quiz-title') || document.body.firstChild; if(t && t.parentNode) t.parentNode.insertBefore(b, t.nextSibling); else document.body.insertBefore(b, document.body.firstChild); }
  b.style.borderColor = r.cleared ? '#1D9E75' : '#E24B4A'; b.innerHTML = card(r, q, false);
  if(popup){ var o=document.getElementById('mission-pop'); if(!o){ o=document.createElement('div'); o.id='mission-pop'; o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;'; document.body.appendChild(o); }
    o.style.display='flex'; o.innerHTML='<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,0.25);">' + card(r, q, true) + '</div>'; }
}
function record(p){
  var q = me(); if(!q || get(q.key)) return;
  var total = Number(p.total)||0, correct = Number(p.correct)||0, wrong = Math.max(0, total - correct), al = allowed(q, total);
  try{ localStorage.setItem(rk(q.key), JSON.stringify({wrong:wrong, total:total, allowed:al, cleared: wrong <= al})); }catch(e){}
  setTimeout(function(){ show(true); }, 250);
}
var of = window.fetch;
window.fetch = function(u, o){
  try{ if(o && typeof o.body === 'string' && o.body.indexOf('"wrongAnswers"') >= 0){ var p = JSON.parse(o.body); if(p && p.type!=='progress' && p.type!=='essay' && p.wrongAnswers !== undefined) record(p); } }catch(e){}
  return of ? of.apply(this, arguments) : Promise.resolve({});
};
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ show(false); }); else setTimeout(function(){ show(false); }, 0);
})();

<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Some questions say \u201cSelect ALL that apply\u201d \u2014 those have more than one correct answer. Look back at the passage before you answer.";
var TODAY_STR = "20261127";
var RAW_QUESTIONS = [{"passage": "<strong>The Starter</strong><br>Marcus lifted the lid of the glass jar and frowned. Grandma Dee&rsquo;s sourdough starter, which usually rose into a bubbly dome, lay flat and gray, and a thin layer of brown liquid floated on top.<br><br>&ldquo;I think I killed it,&rdquo; he said. &ldquo;I forgot to feed it all week because of soccer tournaments.&rdquo;<br><br>Grandma Dee peered into the jar. &ldquo;It&rsquo;s hungry, not dead. That liquid means the yeast ran out of flour to eat.&rdquo; She handed him a spoon. &ldquo;Pour that off, then stir in fresh flour and water. Every morning and every night, same time.&rdquo;<br><br>For three days Marcus set an alarm on his phone so he wouldn&rsquo;t forget. On the first day, nothing happened, and he was tempted to quit. On the second, he caught a glimpse of a few tiny bubbles along the side of the glass. By the third morning, the starter had climbed nearly to the rim, and it smelled sweet and sour, like fresh yogurt.<br><br>&ldquo;Now it&rsquo;s strong enough to bake with,&rdquo; Grandma Dee said, tying on her apron. &ldquo;A starter is like a friend. Ignore it, and it fades. Show up every day, and it grows strong.&rdquo;", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the story, what happened as a result of Marcus feeding the starter every morning and every night? <b>Select ALL that apply.</b>", "opts": ["A layer of brown liquid formed on top of the starter.", "On the first day, the starter doubled in size.", "Grandma Dee decided to bake the bread without him.", "The starter climbed nearly to the rim of the jar.", "Tiny bubbles appeared along the side of the glass."], "ci": 3, "exp": "Because Marcus fed it on schedule, the starter slowly came back:<br>&#10003; &ldquo;On the second, he caught a glimpse of a few tiny bubbles along the side of the glass.&rdquo;<br>&#10003; &ldquo;By the third morning, the starter had climbed nearly to the rim.&rdquo;<br>&#10007; The brown liquid appeared <i>before</i>, when it was <i>not</i> fed &mdash; that is a cause, not a result of feeding.<br>&#10007; On the first day &ldquo;nothing happened.&rdquo;<br>&#10007; Grandma Dee ties on her apron to bake; nothing says she leaves Marcus out.<br><b>Tip:</b> &ldquo;Select ALL&rdquo; can mean two answers or more. Choose every one the text supports, and only those.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "multi": true, "cis": [3, 4]}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which statement is <b>NOT</b> true?", "opts": ["Sutter became rich by selling food and tools to the miners.", "Marshall saw gold flakes in the water beneath the sawmill.", "California became a state in 1850.", "San Francisco grew to more than twenty thousand people within two years."], "ci": 0, "exp": "The passage says &ldquo;Sutter himself was <i>ruined</i>,&rdquo; and it was <i>merchants</i> who charged high prices for food and tools. The other three statements match the passage: Marshall saw &ldquo;glittering flakes in the water channel beneath the mill,&rdquo; California &ldquo;became the thirty-first state in 1850,&rdquo; and the town &ldquo;swelled to more than twenty thousand within two years.&rdquo;", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The California Gold Rush</strong><br>In January 1848, a carpenter named James Marshall was building a sawmill for John Sutter along the American River in California. One morning he noticed glittering flakes in the water channel beneath the mill. Sutter wanted the discovery kept quiet, but rumors spread swiftly, and by December, President James K. Polk had confirmed to Congress that the reports were true.<br><br>The news set off one of the largest migrations in American history. In 1849, roughly 90,000 people, nicknamed &ldquo;forty-niners,&rdquo; poured into California by wagon and by ship. So many sailors abandoned their vessels to search for gold that hundreds of empty ships crowded San Francisco&rsquo;s harbor. The town, home to about a thousand people in early 1848, swelled to more than twenty thousand within two years.<br><br>Few miners grew wealthy. Because thousands competed for the same streams, the easy gold disappeared quickly, while merchants charged staggering prices for food and tools. Sutter himself was ruined when gold seekers trampled his fields and his workers deserted him. Still, the rush transformed California, which became the thirty-first state in 1850."}, {"passage": "<strong>Listening for Lindbergh</strong><br>On the afternoon of May 21, 1927, eleven-year-old Mae Hollis sat cross-legged in front of the family radio in Wichita, Kansas, while her father fiddled with the dial. Somewhere over the Atlantic Ocean, a young pilot named Charles Lindbergh was attempting to fly alone, without stopping, from New York to Paris. No one had ever done it.<br><br>&ldquo;He&rsquo;s been in the air more than thirty hours,&rdquo; Papa said, frowning at the crackling speaker. &ldquo;Fog over the ocean, they say.&rdquo;<br><br>Mae thought of the newspaper photograph of Lindbergh&rsquo;s plane, the <i>Spirit of St. Louis</i>, its silver wings so slender they looked fragile. To save weight, the newspaper said, he had left behind his radio and even his parachute.<br><br>Then the static cleared, and an announcer&rsquo;s voice rose with excitement: Lindbergh had landed at Le Bourget Field, and a huge crowd was rushing across the airfield toward his plane.<br><br>Papa let out a whoop that rattled the windows. Mae ran onto the porch, where neighbors were already spilling out of their houses, and looked up at the sky as though she might see the tiny plane herself.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which meaning of <b>dial</b> is used in the first paragraph?", "opts": ["a round gauge that shows a measurement, such as speed", "a knob that is turned to choose a radio station", "the face of a clock that shows the hours", "to call someone by pressing numbers on a phone"], "ci": 1, "exp": "Mae&rsquo;s father &ldquo;fiddled with the dial&rdquo; of the family radio, so it is the knob that tunes the station. A gauge is also a kind of dial, but it only shows a measurement; it is not turned to change anything.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which statement is <b>NOT</b> true?", "opts": ["A full cycle of the Moon's phases takes about two weeks.", "The Sun always lights up half of the Moon.", "The Moon shines because sunlight reflects off its surface.", "During a full moon, Earth lies between the Sun and the Moon."], "ci": 0, "exp": "The passage says the Moon travels around Earth “over about 29.5 days,” and the full moon comes “about two weeks into the cycle.” So the whole cycle takes about a month, not two weeks. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Transcontinental Railroad</strong><br>Before 1869, a trip from the East Coast to California was an ordeal. Travelers could spend six months in a wagon or sail all the way around the tip of South America. In 1862, Congress passed the Pacific Railway Act, an ambitious plan to join the nation with a single line of track.<br><br>Two companies raced toward each other. The Central Pacific began in Sacramento, California, and had to blast tunnels through the granite of the Sierra Nevada. Because few local workers would stay for such dangerous labor, the company hired thousands of Chinese immigrants, who carved ledges into cliffs and endured brutal winters. Meanwhile, the Union Pacific started near Omaha, Nebraska, and laid track rapidly across the flat Great Plains. Many of its workers were Irish immigrants and Civil War veterans. The government paid each company for every mile it completed, so both pushed their crews to work faster.<br><br>On May 10, 1869, the two lines met at Promontory Summit, Utah, where a golden spike was tapped into the final tie. A telegraph operator sent a single word, “Done,” across the country. Soon a trip from New York to San Francisco took about a week, and the cost of shipping goods fell sharply.", "stem": "<b>Part A</b><br>Why did travel and shipping across the country become so much faster and cheaper after 1869?", "opts": ["The government paid the railroad companies for every mile of track they completed.", "A single railroad line now connected the East to California, so people and goods no longer needed months-long trips.", "A telegraph message told the country that the railroad was finished.", "Workers carved ledges into the cliffs of the Sierra Nevada."], "ci": 1, "exp": "Before 1869 a trip took up to &ldquo;six months in a wagon,&rdquo; but after the lines met, &ldquo;a trip from New York to San Francisco took about a week, and the cost of shipping goods fell sharply.&rdquo; The connected railroad is the cause. Paying per mile made the companies build <i>faster</i>, but it does not explain why trips became cheaper for travelers.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A"}, {"passage": "<strong>The Transcontinental Railroad</strong><br>Before 1869, a trip from the East Coast to California was an ordeal. Travelers could spend six months in a wagon or sail all the way around the tip of South America. In 1862, Congress passed the Pacific Railway Act, an ambitious plan to join the nation with a single line of track.<br><br>Two companies raced toward each other. The Central Pacific began in Sacramento, California, and had to blast tunnels through the granite of the Sierra Nevada. Because few local workers would stay for such dangerous labor, the company hired thousands of Chinese immigrants, who carved ledges into cliffs and endured brutal winters. Meanwhile, the Union Pacific started near Omaha, Nebraska, and laid track rapidly across the flat Great Plains. Many of its workers were Irish immigrants and Civil War veterans. The government paid each company for every mile it completed, so both pushed their crews to work faster.<br><br>On May 10, 1869, the two lines met at Promontory Summit, Utah, where a golden spike was tapped into the final tie. A telegraph operator sent a single word, “Done,” across the country. Soon a trip from New York to San Francisco took about a week, and the cost of shipping goods fell sharply.", "stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did travel and shipping across the country become so much faster and cheaper after 1869?&rdquo;)?<br><br><b>A.</b> “a trip from the East Coast to California was an ordeal. Travelers could spend six months in a wagon”<br><b>B.</b> “Two companies raced toward each other.”<br><b>C.</b> “the company hired thousands of Chinese immigrants”<br><b>D.</b> “Soon a trip from New York to San Francisco took about a week, and the cost of shipping goods fell sharply.”<br><b>E.</b> “a golden spike was tapped into the final tie”<br><b>F.</b> “The government paid each company for every mile it completed”", "opts": ["A and D", "D and F", "A and E", "B and D"], "ci": 0, "exp": "<b>A</b> shows how slow travel was <i>before</i> the railroad, and <b>D</b> shows how fast and cheap it became <i>after</i>. Together they prove the change in Part A.<br><b>Why not the others:</b> <b>B</b> describes the race to build; <b>E</b> is a ceremony; <b>F</b> explains why the crews worked fast, not why travel became cheaper.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A"}, {"passage": "<strong>The Transcontinental Railroad</strong><br>Before 1869, a trip from the East Coast to California was an ordeal. Travelers could spend six months in a wagon or sail all the way around the tip of South America. In 1862, Congress passed the Pacific Railway Act, an ambitious plan to join the nation with a single line of track.<br><br>Two companies raced toward each other. The Central Pacific began in Sacramento, California, and had to blast tunnels through the granite of the Sierra Nevada. Because few local workers would stay for such dangerous labor, the company hired thousands of Chinese immigrants, who carved ledges into cliffs and endured brutal winters. Meanwhile, the Union Pacific started near Omaha, Nebraska, and laid track rapidly across the flat Great Plains. Many of its workers were Irish immigrants and Civil War veterans. The government paid each company for every mile it completed, so both pushed their crews to work faster.<br><br>On May 10, 1869, the two lines met at Promontory Summit, Utah, where a golden spike was tapped into the final tie. A telegraph operator sent a single word, “Done,” across the country. Soon a trip from New York to San Francisco took about a week, and the cost of shipping goods fell sharply.", "stem": "Which choice shows these events in the order they happened?<br>1. Congress passed the Pacific Railway Act.<br>2. A golden spike was tapped into the final tie.<br>3. Travelers could ride from New York to San Francisco in about a week.<br>4. The Central Pacific blasted tunnels through the Sierra Nevada.", "opts": ["1, 2, 4, 3", "1, 4, 2, 3", "1, 4, 3, 2", "4, 1, 2, 3"], "ci": 1, "exp": "The act came first (&ldquo;In 1862, Congress passed the Pacific Railway Act&rdquo;), then the building, including tunnels through the Sierra Nevada, then the golden spike on May 10, 1869, and only &ldquo;soon&rdquo; after that could people make the trip in a week. The tunnels had to come before the final spike, because the lines were not finished until then.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Transcontinental Railroad</strong><br>Before 1869, a trip from the East Coast to California was an ordeal. Travelers could spend six months in a wagon or sail all the way around the tip of South America. In 1862, Congress passed the Pacific Railway Act, an ambitious plan to join the nation with a single line of track.<br><br>Two companies raced toward each other. The Central Pacific began in Sacramento, California, and had to blast tunnels through the granite of the Sierra Nevada. Because few local workers would stay for such dangerous labor, the company hired thousands of Chinese immigrants, who carved ledges into cliffs and endured brutal winters. Meanwhile, the Union Pacific started near Omaha, Nebraska, and laid track rapidly across the flat Great Plains. Many of its workers were Irish immigrants and Civil War veterans. The government paid each company for every mile it completed, so both pushed their crews to work faster.<br><br>On May 10, 1869, the two lines met at Promontory Summit, Utah, where a golden spike was tapped into the final tie. A telegraph operator sent a single word, “Done,” across the country. Soon a trip from New York to San Francisco took about a week, and the cost of shipping goods fell sharply.", "stem": "According to the passage, which statements about the <b>Union Pacific</b> are true? <b>Select ALL that apply.</b>", "opts": ["It began in Sacramento, California.", "It laid track across the flat Great Plains.", "It started near Omaha, Nebraska.", "It blasted tunnels through the granite of the Sierra Nevada.", "Many of its workers were Irish immigrants and Civil War veterans."], "ci": 1, "cis": [1, 2, 4], "multi": true, "exp": "&#10003; &ldquo;the Union Pacific started near Omaha, Nebraska&rdquo;<br>&#10003; &ldquo;Many of its workers were Irish immigrants and Civil War veterans.&rdquo;<br>&#10003; It &ldquo;laid track rapidly across the flat Great Plains.&rdquo;<br>&#10007; Tunnels through the Sierra Nevada were the <i>Central Pacific</i>&rsquo;s job.<br>&#10007; Sacramento is where the <i>Central Pacific</i> began. <br><b>Tip:</b> test every choice &mdash; there can be two, three, or more right answers.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"passage": "<strong>The Transcontinental Railroad</strong><br>Before 1869, a trip from the East Coast to California was an ordeal. Travelers could spend six months in a wagon or sail all the way around the tip of South America. In 1862, Congress passed the Pacific Railway Act, an ambitious plan to join the nation with a single line of track.<br><br>Two companies raced toward each other. The Central Pacific began in Sacramento, California, and had to blast tunnels through the granite of the Sierra Nevada. Because few local workers would stay for such dangerous labor, the company hired thousands of Chinese immigrants, who carved ledges into cliffs and endured brutal winters. Meanwhile, the Union Pacific started near Omaha, Nebraska, and laid track rapidly across the flat Great Plains. Many of its workers were Irish immigrants and Civil War veterans. The government paid each company for every mile it completed, so both pushed their crews to work faster.<br><br>On May 10, 1869, the two lines met at Promontory Summit, Utah, where a golden spike was tapped into the final tie. A telegraph operator sent a single word, “Done,” across the country. Soon a trip from New York to San Francisco took about a week, and the cost of shipping goods fell sharply.", "stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Few local workers would stay for the dangerous mountain work.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> Both companies pushed their crews to work faster.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> The government paid each company for every mile it completed.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> A telegraph operator sent the word “Done” across the country.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> The Union Pacific’s route crossed the flat Great Plains.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> The Central Pacific hired thousands of Chinese immigrants.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The two lines met at Promontory Summit.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> The Union Pacific laid track rapidly.</td></tr></table>Which choice matches every cause to the correct effect?", "opts": ["1–A, 2–C, 3–D, 4–B", "1–A, 2–B, 3–C, 4–D", "1–C, 2–D, 3–A, 4–B", "1–C, 2–A, 3–D, 4–B"], "ci": 3, "exp": "Test each pair with &ldquo;Because ___, ___.&rdquo; <b>1–C:</b> Because few local workers would stay, &ldquo;the company hired thousands of Chinese immigrants.&rdquo; <b>2–A:</b> Because the government paid for every mile, &ldquo;both pushed their crews to work faster.&rdquo; <b>3–D:</b> Because the plains were flat, the Union Pacific &ldquo;laid track rapidly.&rdquo; <b>4–B:</b> Because the lines met, the operator sent &ldquo;Done.&rdquo; The choice 1–A, 2–B, 3–C, 4–D just follows the letters in order &mdash; a trap; always test each pair.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A"}, {"passage": "<strong>Why Coral Reefs Turn White</strong><br>A coral reef may look like a garden of colorful rocks, but each coral is actually a colony of tiny animals. Inside their soft bodies live microscopic algae. The partnership benefits both sides: the coral provides shelter, and the algae use sunlight to make food, supplying most of the energy the coral needs. The algae also give many corals their brilliant colors.<br><br>This arrangement, however, is fragile. When ocean water stays even a degree or two warmer than normal for several weeks, the stressed coral pushes the algae out. Without them, its white skeleton shows through its clear tissue, and the reef turns ghostly pale. A pale coral is not dead, but it can no longer get adequate food. If the water cools soon enough, the algae can return and the coral may recover. If the heat lasts, the coral weakens and can die, and the fish that depend on the reef for food and hiding places must move away or perish.<br><br>To protect reefs, scientists track ocean temperatures with satellites. Some even grow young corals in underwater nurseries and plant them on damaged reefs.", "stem": "Read this sentence from the passage: &ldquo;This arrangement, however, is <b>fragile</b>.&rdquo; What does <b>fragile</b> mean as it is used here?", "opts": ["carefully planned", "easily damaged or broken", "very old", "hard to notice"], "ci": 1, "exp": "Right after this sentence, the passage shows that just &ldquo;a degree or two warmer&rdquo; water makes the coral push the algae out &mdash; a small change breaks the partnership. So <i>fragile</i> means easily damaged. &ldquo;Carefully planned&rdquo; fits the sentence grammatically, but nothing in the passage says anyone planned it.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>Why Coral Reefs Turn White</strong><br>A coral reef may look like a garden of colorful rocks, but each coral is actually a colony of tiny animals. Inside their soft bodies live microscopic algae. The partnership benefits both sides: the coral provides shelter, and the algae use sunlight to make food, supplying most of the energy the coral needs. The algae also give many corals their brilliant colors.<br><br>This arrangement, however, is fragile. When ocean water stays even a degree or two warmer than normal for several weeks, the stressed coral pushes the algae out. Without them, its white skeleton shows through its clear tissue, and the reef turns ghostly pale. A pale coral is not dead, but it can no longer get adequate food. If the water cools soon enough, the algae can return and the coral may recover. If the heat lasts, the coral weakens and can die, and the fish that depend on the reef for food and hiding places must move away or perish.<br><br>To protect reefs, scientists track ocean temperatures with satellites. Some even grow young corals in underwater nurseries and plant them on damaged reefs.", "stem": "According to the passage, what happens if the water cools soon enough after a coral turns pale?", "opts": ["The coral pushes out even more of its algae.", "The algae can return, and the coral may recover.", "The fish that depend on the reef must move away.", "The coral can no longer get adequate food."], "ci": 1, "exp": "&ldquo;If the water cools soon enough, the algae can return and the coral may recover.&rdquo; The fish moving away happens &ldquo;If the heat lasts&rdquo; &mdash; the opposite situation. Test it: &ldquo;Because the water cooled, the algae returned.&rdquo;", "tag": "Cause & Effect", "tagcolor": "#E24B4A"}, {"passage": "<strong>Why Coral Reefs Turn White</strong><br>A coral reef may look like a garden of colorful rocks, but each coral is actually a colony of tiny animals. Inside their soft bodies live microscopic algae. The partnership benefits both sides: the coral provides shelter, and the algae use sunlight to make food, supplying most of the energy the coral needs. The algae also give many corals their brilliant colors.<br><br>This arrangement, however, is fragile. When ocean water stays even a degree or two warmer than normal for several weeks, the stressed coral pushes the algae out. Without them, its white skeleton shows through its clear tissue, and the reef turns ghostly pale. A pale coral is not dead, but it can no longer get adequate food. If the water cools soon enough, the algae can return and the coral may recover. If the heat lasts, the coral weakens and can die, and the fish that depend on the reef for food and hiding places must move away or perish.<br><br>To protect reefs, scientists track ocean temperatures with satellites. Some even grow young corals in underwater nurseries and plant them on damaged reefs.", "stem": "According to the passage, what causes a coral to push out the algae living inside it?", "opts": ["Fish move away to find new places to hide.", "Scientists plant young corals on damaged reefs.", "Ocean water stays a degree or two warmer than normal for several weeks.", "The coral’s white skeleton shows through its clear tissue."], "ci": 2, "exp": "&ldquo;When ocean water stays even a degree or two warmer than normal for several weeks, the stressed coral pushes the algae out.&rdquo; Warm water is the cause. The white skeleton showing is an <i>effect</i> of losing the algae, not the cause. Clue words: <i>when</i> &hellip; <i>then</i>.", "tag": "Cause & Effect", "tagcolor": "#E24B4A"}, {"passage": "<strong>Why Coral Reefs Turn White</strong><br>A coral reef may look like a garden of colorful rocks, but each coral is actually a colony of tiny animals. Inside their soft bodies live microscopic algae. The partnership benefits both sides: the coral provides shelter, and the algae use sunlight to make food, supplying most of the energy the coral needs. The algae also give many corals their brilliant colors.<br><br>This arrangement, however, is fragile. When ocean water stays even a degree or two warmer than normal for several weeks, the stressed coral pushes the algae out. Without them, its white skeleton shows through its clear tissue, and the reef turns ghostly pale. A pale coral is not dead, but it can no longer get adequate food. If the water cools soon enough, the algae can return and the coral may recover. If the heat lasts, the coral weakens and can die, and the fish that depend on the reef for food and hiding places must move away or perish.<br><br>To protect reefs, scientists track ocean temperatures with satellites. Some even grow young corals in underwater nurseries and plant them on damaged reefs.", "stem": "The passage says that the coral and the algae help each other. Which of these is an <b>example</b> of how they help each other?", "opts": ["Scientists track ocean temperatures with satellites.", "A coral without its algae turns ghostly pale.", "The coral and the algae have a partnership that benefits both sides.", "The algae use sunlight to make food for the coral."], "ci": 3, "exp": "<b>What is an example?</b> An example is <b>one specific thing</b> that shows a bigger idea. Big idea: the coral and algae help each other. A specific way: &ldquo;the algae use sunlight to make food, supplying most of the energy the coral needs.&rdquo;<br><b>Why not the others:</b> &ldquo;a partnership that benefits both sides&rdquo; just says the big idea again in other words. &ldquo;Turns ghostly pale&rdquo; is a <i>result</i> of losing the algae. Satellites are an example of a different idea &mdash; how scientists protect reefs.<br><b>Test:</b> put &ldquo;For example,&rdquo; in front: &ldquo;They help each other. For example, the algae use sunlight to make food for the coral.&rdquo; It fits!", "tag": "Example", "tagcolor": "#185FA5", "hint": "An <b>example</b> is one specific thing, action, or event that shows the bigger idea. It is <i>not</i> the big idea said again in other words, and it is <i>not</i> a result of the idea."}, {"passage": "<strong>Check the Latch</strong><br>Owen was halfway through his cereal when he heard his sister shout from the backyard. He knew that tone. Last night he had been so eager to finish his video game that he had shoved the coop door shut without sliding the latch.<br><br>“Owen, get out here!” Tess called.<br><br>The door was swinging in the wind, and muddy paw prints circled the feeding tray. Feathers were scattered across the frosty grass.<br><br>“A raccoon,” Tess said grimly. “And Pepper is gone.”<br><br>Owen counted the hens twice, hoping he had miscounted, but the speckled hen was missing. His stomach sank. Without a word, he and Tess searched behind the shed and under the porch. At last Owen heard a faint, nervous clucking from the woodpile, and there was Pepper, wedged between two logs, ruffled but unhurt. Owen lifted her out gently and carried her back to the coop himself.<br><br>That evening, before anyone could remind him, he walked to the coop, slid the latch, and tugged the door twice to be sure. Then he taped a note beside the back door: CHECK THE LATCH.", "stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Owen was eager to finish his video game.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> A raccoon got into the coop.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> The coop door was left unlatched.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> Owen found Pepper wedged between two logs.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Owen heard faint clucking from the woodpile.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> He shoved the coop door shut without sliding the latch.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> Owen felt sorry about what had happened.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> He checked the latch that evening without being reminded.</td></tr></table>Which choice matches every cause to the correct effect?", "opts": ["1–C, 2–B, 3–A, 4–D", "1–D, 2–A, 3–B, 4–C", "1–A, 2–B, 3–C, 4–D", "1–C, 2–A, 3–B, 4–D"], "ci": 3, "exp": "Use &ldquo;Because ___, ___.&rdquo; <b>1–C:</b> Because he was &ldquo;so eager to finish his video game,&rdquo; he shoved the door shut without the latch. <b>2–A:</b> Because the door was unlatched, a raccoon got in (&ldquo;muddy paw prints circled the feeding tray&rdquo;). <b>3–B:</b> Because he heard clucking, he found Pepper in the woodpile. <b>4–D:</b> Because he felt sorry, he latched the door &ldquo;before anyone could remind him.&rdquo; The in-order choice 1–A, 2–B, 3–C, 4–D is a trap.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A"}, {"passage": "<strong>Check the Latch</strong><br>Owen was halfway through his cereal when he heard his sister shout from the backyard. He knew that tone. Last night he had been so eager to finish his video game that he had shoved the coop door shut without sliding the latch.<br><br>“Owen, get out here!” Tess called.<br><br>The door was swinging in the wind, and muddy paw prints circled the feeding tray. Feathers were scattered across the frosty grass.<br><br>“A raccoon,” Tess said grimly. “And Pepper is gone.”<br><br>Owen counted the hens twice, hoping he had miscounted, but the speckled hen was missing. His stomach sank. Without a word, he and Tess searched behind the shed and under the porch. At last Owen heard a faint, nervous clucking from the woodpile, and there was Pepper, wedged between two logs, ruffled but unhurt. Owen lifted her out gently and carried her back to the coop himself.<br><br>That evening, before anyone could remind him, he walked to the coop, slid the latch, and tugged the door twice to be sure. Then he taped a note beside the back door: CHECK THE LATCH.", "stem": "Which event happened right after Owen counted the hens twice?", "opts": ["Owen heard faint clucking from the woodpile.", "Owen and Tess searched behind the shed and under the porch.", "Owen taped a note beside the back door.", "Tess called Owen out to the backyard."], "ci": 1, "exp": "After counting (&ldquo;the speckled hen was missing. His stomach sank.&rdquo;), the next thing they did was search: &ldquo;he and Tess searched behind the shed and under the porch.&rdquo; The clucking came later (&ldquo;At last&rdquo;), and Tess called him out before he counted.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>Check the Latch</strong><br>Owen was halfway through his cereal when he heard his sister shout from the backyard. He knew that tone. Last night he had been so eager to finish his video game that he had shoved the coop door shut without sliding the latch.<br><br>“Owen, get out here!” Tess called.<br><br>The door was swinging in the wind, and muddy paw prints circled the feeding tray. Feathers were scattered across the frosty grass.<br><br>“A raccoon,” Tess said grimly. “And Pepper is gone.”<br><br>Owen counted the hens twice, hoping he had miscounted, but the speckled hen was missing. His stomach sank. Without a word, he and Tess searched behind the shed and under the porch. At last Owen heard a faint, nervous clucking from the woodpile, and there was Pepper, wedged between two logs, ruffled but unhurt. Owen lifted her out gently and carried her back to the coop himself.<br><br>That evening, before anyone could remind him, he walked to the coop, slid the latch, and tugged the door twice to be sure. Then he taped a note beside the back door: CHECK THE LATCH.", "stem": "<b>Part A</b><br>Why did Owen tape a note beside the back door?", "opts": ["He wanted to remind himself to latch the coop so the hens would stay safe.", "He wanted to tell his family that Pepper had been found.", "He was worried that Tess would forget to feed the hens.", "Tess told him to write a list of his chores."], "ci": 0, "exp": "The note says &ldquo;CHECK THE LATCH,&rdquo; and the whole problem started because Owen shut the door &ldquo;without sliding the latch.&rdquo; He wants to make sure it never happens again. Pepper being found is true, but the note says nothing about her.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A"}, {"passage": "<strong>Check the Latch</strong><br>Owen was halfway through his cereal when he heard his sister shout from the backyard. He knew that tone. Last night he had been so eager to finish his video game that he had shoved the coop door shut without sliding the latch.<br><br>“Owen, get out here!” Tess called.<br><br>The door was swinging in the wind, and muddy paw prints circled the feeding tray. Feathers were scattered across the frosty grass.<br><br>“A raccoon,” Tess said grimly. “And Pepper is gone.”<br><br>Owen counted the hens twice, hoping he had miscounted, but the speckled hen was missing. His stomach sank. Without a word, he and Tess searched behind the shed and under the porch. At last Owen heard a faint, nervous clucking from the woodpile, and there was Pepper, wedged between two logs, ruffled but unhurt. Owen lifted her out gently and carried her back to the coop himself.<br><br>That evening, before anyone could remind him, he walked to the coop, slid the latch, and tugged the door twice to be sure. Then he taped a note beside the back door: CHECK THE LATCH.", "stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did Owen tape a note beside the back door?&rdquo;)?<br><br><b>A.</b> “he had shoved the coop door shut without sliding the latch”<br><b>B.</b> “‘A raccoon,’ Tess said grimly.”<br><b>C.</b> “he and Tess searched behind the shed and under the porch”<br><b>D.</b> “he walked to the coop, slid the latch, and tugged the door twice to be sure”<br><b>E.</b> “Owen was halfway through his cereal”<br><b>F.</b> “there was Pepper, wedged between two logs, ruffled but unhurt”", "opts": ["A and D", "C and D", "A and E", "B and F"], "ci": 0, "exp": "<b>A</b> shows the mistake that caused the trouble (no latch), and <b>D</b> shows Owen now checking the latch carefully &mdash; the same reason he wrote the note.<br><b>Why not the others:</b> <b>B</b> names the animal; <b>C</b> is the search; <b>E</b> is breakfast; <b>F</b> shows Pepper was safe. All are true, but none explains the note.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A"}, {"passage": "<strong>Check the Latch</strong><br>Owen was halfway through his cereal when he heard his sister shout from the backyard. He knew that tone. Last night he had been so eager to finish his video game that he had shoved the coop door shut without sliding the latch.<br><br>“Owen, get out here!” Tess called.<br><br>The door was swinging in the wind, and muddy paw prints circled the feeding tray. Feathers were scattered across the frosty grass.<br><br>“A raccoon,” Tess said grimly. “And Pepper is gone.”<br><br>Owen counted the hens twice, hoping he had miscounted, but the speckled hen was missing. His stomach sank. Without a word, he and Tess searched behind the shed and under the porch. At last Owen heard a faint, nervous clucking from the woodpile, and there was Pepper, wedged between two logs, ruffled but unhurt. Owen lifted her out gently and carried her back to the coop himself.<br><br>That evening, before anyone could remind him, he walked to the coop, slid the latch, and tugged the door twice to be sure. Then he taped a note beside the back door: CHECK THE LATCH.", "stem": "What can the reader infer from the story? <b>Select ALL that apply.</b>", "opts": ["Owen was not worried about the missing hen.", "Owen knew right away that the trouble was his fault.", "Tess had forgotten to latch the coop before.", "Owen learned to be more careful with his chores.", "The family plans to build a new coop."], "ci": 1, "cis": [1, 3], "multi": true, "exp": "&#10003; &ldquo;He knew that tone&rdquo; and he remembers shoving the door shut &ldquo;without sliding the latch&rdquo; &mdash; he knows it is his fault.<br>&#10003; That evening he latches the door &ldquo;before anyone could remind him&rdquo; and tugs it twice.<br>&#10007; &ldquo;His stomach sank&rdquo; shows he <i>was</i> worried.<br>&#10007; Nothing says Tess ever forgot the latch.<br>&#10007; Nothing mentions a new coop. <br><b>Tip:</b> test every choice &mdash; there can be two, three, or more right answers.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Heron at Dawn</strong><br><i>The heron stands on one thin leg<br>where reeds lean into fog,<br>so still the minnows can’t perceive<br>a hunter by the log.<br><br>The sun climbs up; the water warms;<br>a dragonfly zips past.<br>The heron waits, and waits, and waits&mdash;<br>then strikes, a silver flash.<br><br>Some hunters chase and splash and dive,<br>yet often miss their meal;<br>the heron trusts a patient eye<br>and wins with quiet skill.<br><br>A fish is gone. The ripples spread<br>in rings across the pond.<br>The heron lifts on steady wings<br>to marshes far beyond.</i>", "stem": "What does the poet most likely want readers to understand about the heron?", "opts": ["It is too lazy to hunt for very long.", "Its patience and stillness help it catch food.", "It hunts best by chasing fish quickly.", "It is afraid of the dragonfly that zips past."], "ci": 1, "exp": "The heron &ldquo;waits, and waits, and waits&rdquo; and then catches a fish; the third stanza compares it to hunters who &ldquo;chase and splash&rdquo; but &ldquo;miss their meal,&rdquo; while the heron &ldquo;trusts a patient eye.&rdquo; Waiting is not laziness &mdash; it is how the heron succeeds.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Heron at Dawn</strong><br><i>The heron stands on one thin leg<br>where reeds lean into fog,<br>so still the minnows can’t perceive<br>a hunter by the log.<br><br>The sun climbs up; the water warms;<br>a dragonfly zips past.<br>The heron waits, and waits, and waits&mdash;<br>then strikes, a silver flash.<br><br>Some hunters chase and splash and dive,<br>yet often miss their meal;<br>the heron trusts a patient eye<br>and wins with quiet skill.<br><br>A fish is gone. The ripples spread<br>in rings across the pond.<br>The heron lifts on steady wings<br>to marshes far beyond.</i>", "stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;strikes&rdquo; as it is used in the second stanza?", "opts": ["pauses", "shines", "attacks", "discovers"], "ci": 2, "exp": "After waiting, the heron &ldquo;strikes, a silver flash&rdquo; and in the next stanza &ldquo;a fish is gone&rdquo; &mdash; it attacks quickly. &ldquo;Pauses&rdquo; is close to the opposite (it was pausing before), and &ldquo;shines&rdquo; comes from the word &ldquo;flash,&rdquo; not from &ldquo;strikes.&rdquo;", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "<strong>Heron at Dawn</strong><br><i>The heron stands on one thin leg<br>where reeds lean into fog,<br>so still the minnows can’t perceive<br>a hunter by the log.<br><br>The sun climbs up; the water warms;<br>a dragonfly zips past.<br>The heron waits, and waits, and waits&mdash;<br>then strikes, a silver flash.<br><br>Some hunters chase and splash and dive,<br>yet often miss their meal;<br>the heron trusts a patient eye<br>and wins with quiet skill.<br><br>A fish is gone. The ripples spread<br>in rings across the pond.<br>The heron lifts on steady wings<br>to marshes far beyond.</i>", "stem": "In the first stanza, why can&rsquo;t the minnows perceive the heron?", "opts": ["Thick fog hides the whole pond from view.", "The minnows are busy chasing a dragonfly.", "The heron stands so still that it does not seem like a hunter.", "The heron is hiding underneath a log."], "ci": 2, "exp": "The line says the heron stands &ldquo;so still the minnows can&rsquo;t perceive / a hunter by the log.&rdquo; The words <i>so &hellip; that</i> (here &ldquo;so still&rdquo;) signal a cause: its stillness. The fog is only around the reeds, and the heron stands <i>by</i> the log, not under it.", "tag": "Cause & Effect", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(correctText(qi)), explanation: wrongTxt(q.exp) };
}
/* multi-select 2026-11-20 */
function isMulti(qi){ return !!(RAW_QUESTIONS[qi] && RAW_QUESTIONS[qi].multi); }
function isRight(qi, a){
  var q = RAW_QUESTIONS[qi];
  if(q.multi){
    if(!Array.isArray(a)) return false;
    var c = q.cis.slice().sort(), s = a.slice().sort();
    if(c.length !== s.length) return false;
    for(var i=0;i<c.length;i++) if(c[i]!==s[i]) return false;
    return true;
  }
  return a === q.ci;
}
function ansText(qi, a){
  var q = RAW_QUESTIONS[qi];
  if(Array.isArray(a)) return a.slice().sort().map(function(i){ return q.opts[i]; }).join(' | ');
  return q.opts[a];
}
function correctText(qi){ var q = RAW_QUESTIONS[qi]; return q.multi ? q.cis.slice().sort().map(function(i){ return q.opts[i]; }).join(' | ') : q.opts[q.ci]; }
function checkMulti(){
  var qi = activeOrder()[state.cur];
  if(state.answers[qi] !== undefined) return;
  var p = (state.pending && state.pending[qi]) || [];
  if(!p.length) return;
  state.answers[qi] = p.slice().sort();
  if(state.pending) delete state.pending[qi];
  saveState(); render();
}
window.checkMulti = checkMulti;
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(isRight(qi, state.answers[qi])) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, ansText(qi, state.answers[qi]))); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(isRight(qi, a)) correct++; else wd.push(wrongDetail(qi, ansText(qi, a)));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  var multiQ = !!q.multi, pend = (state.pending && state.pending[qi]) || [];
  if(multiQ){ var mn = document.createElement('div'); mn.className = 'multi-note'; mn.textContent = 'Select ALL that apply \u2014 more than one answer is correct.'; opts.appendChild(mn); }
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(multiQ){
      var mine = answered ? state.answers[qi] : pend, isC = q.cis.indexOf(idx) >= 0, sel = mine.indexOf(idx) >= 0;
      if(answered){
        btn.disabled = true;
        if(sel && isC) btn.className += ' selected-correct';
        else if(sel && !isC) btn.className += ' selected-wrong';
        else if(isC) btn.className += ' reveal-correct';
      } else {
        if(sel) btn.className += ' pending';
        btn.onclick = function(){ pick(idx); };
      }
      opts.appendChild(btn); return;
    }
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });
  if(multiQ && !answered){ var cb2 = document.createElement('button'); cb2.className = 'check-multi'; cb2.textContent = 'Check my answer'; cb2.disabled = !pend.length; cb2.onclick = checkMulti; opts.appendChild(cb2); }

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  if(isMulti(qi)){
    if(!state.pending) state.pending = {};
    var p = state.pending[qi] || [], k = p.indexOf(idx);
    if(k >= 0) p.splice(k, 1); else p.push(idx);
    state.pending[qi] = p; saveState(); render(); return;
  }
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(isRight(qi, state.answers[qi])) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += isRight(qi, state.answers[qi]) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && !isRight(qi, state.answers[qi]); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
