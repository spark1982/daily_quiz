<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261027";
var RAW_QUESTIONS = [{"stem": "Two sandwiches were not _____ for the whole hiking team, so they stopped at a store to buy more food. Which word best completes the sentence?", "opts": ["efficient", "relevant", "durable", "sufficient"], "ci": 3, "exp": "<i>sufficient</i> (adj.) enough for what is needed. Two sandwiches were not enough for the team. <i>Efficient</i> sounds similar but means working well without waste. <i>We had <b>sufficient</b> time to finish the test.</i> Family: insufficient (adj.), sufficiently (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The two neighbors had a long <b>conflict</b> over where the new fence should go. Which word means the <b>OPPOSITE</b> of “conflict”?", "opts": ["dispute", "decision", "argument", "agreement"], "ci": 3, "exp": "<i>conflict</i> (n.) a serious disagreement or fight. Its opposite is <i>agreement</i>. <i>Dispute</i> and <i>argument</i> mean nearly the same as conflict. <i>The friends settled their <b>conflict</b> by talking it out.</i> Family: conflicting (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Everyone waited quietly for the judges to announce the _____ of the spelling bee. Which word best completes the sentence?", "opts": ["hypothesis", "outcome", "obstacle", "assumption"], "ci": 1, "exp": "<i>outcome</i> (n.) the final result of something. Judges announce who won, which is the result. A <i>hypothesis</i> is a guess you test before you know. <i>The <b>outcome</b> of the game surprised everyone.</i>", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Winning a ribbon at the school meet was nice, but Ana’s <b>ultimate</b> goal was to swim in the Olympics someday. In this sentence, what does <b>ultimate</b> mean?", "opts": ["first and easiest", "newest and most recent", "final and most important", "secret and hidden"], "ci": 2, "exp": "<i>ultimate</i> (adj.) last, final, or most important of all. <i>Our <b>ultimate</b> goal is to finish the whole puzzle by Friday.</i> Family: ultimately (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After two summers of swim lessons, Jada was a <b>competent</b> swimmer who could safely cross the lake while the lifeguard watched. In this sentence, what does <b>competent</b> mean?", "opts": ["brand-new at a skill", "nervous and unsure in the water", "having enough skill to do something well", "faster than every other swimmer"], "ci": 2, "exp": "<i>competent</i> (adj.) able to do something well enough because you have the skill. <i>A <b>competent</b> cook can make dinner without a recipe.</i> Family: competence (n.), incompetent (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before the camping trip, Dad gave us a <b>comprehensive</b> list that included every single thing we needed to pack. Which word means the <b>OPPOSITE</b> of “comprehensive”?", "opts": ["detailed", "thorough", "lengthy", "incomplete"], "ci": 3, "exp": "<i>comprehensive</i> (adj.) including everything or nearly everything. Its opposite is <i>incomplete</i> (missing parts). <i>Thorough</i> and <i>detailed</i> mean almost the same as comprehensive. <i>The museum guide gave a <b>comprehensive</b> tour.</i> Family: comprehend (v.), comprehension (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Scientists worry that the tiny tree frog could become _____ if its rainforest home is cut down. Which form of the word best completes the sentence?", "opts": ["extinction", "extinct", "extinctions", "extinguished"], "ci": 1, "exp": "After “become,” the sentence needs an adjective: <i>extinct</i> (adj.) no longer existing. <i>extinction</i> (n.) is when a kind of living thing dies out completely. <i>Dinosaurs are <b>extinct</b>.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "After the spring rains, berries were so <b>abundant</b> in the woods that the bears ate until they could not eat any more. In this sentence, what does <b>abundant</b> mean?", "opts": ["hard to find", "ripe and very sweet", "growing high out of reach", "existing in large amounts; plentiful"], "ci": 3, "exp": "<i>abundant</i> (adj.) more than enough; in large amounts. <i>Fish are <b>abundant</b> in this cold, clean lake.</i> Family: abundance (n.), abundantly (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The numbers on the map <b>correspond</b> to the numbered stops on the tour, so stop 3 is marked with a 3. Which word means the <b>SAME</b> or nearly the same as “correspond”?", "opts": ["match", "repeat", "differ", "explain"], "ci": 0, "exp": "<i>correspond</i> (v.) to match or be connected to something. Here each number matches a stop. <i>Differ</i> is the opposite. <i>Each key <b>corresponds</b> to one lock.</i> Family: correspondence (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "There was a <b>dramatic</b> drop in temperature last night: it went from 70 degrees to 35 degrees in just a few hours. In this sentence, what does <b>dramatic</b> mean?", "opts": ["sudden and very large", "showing feelings in a big, showy way", "having to do with plays and acting", "exciting to watch, like a movie"], "ci": 0, "exp": "<i>dramatic</i> (adj.) can mean (1) about plays and acting, (2) acting in a big, showy way, or (3) sudden and very large. A drop of 35 degrees in a few hours is sudden and very large. <i>The city saw a <b>dramatic</b> rise in visitors.</i> Family: drama (n.), dramatically (adv.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The new bridge made a <b>significant</b> difference for the town; the drive to the hospital went from an hour to just fifteen minutes. In this sentence, what does <b>significant</b> mean?", "opts": ["small and easy to miss", "large or important enough to be noticed", "strange and hard to explain", "planned but not finished yet"], "ci": 1, "exp": "<i>significant</i> (adj.) big or important enough to matter. <i>Practicing every day led to a <b>significant</b> improvement in her reading.</i> Family: significance (n.), significantly (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The small theater has a <b>capacity</b> of 200 people, so the manager stopped selling tickets as soon as 200 were sold. In this sentence, what does <b>capacity</b> mean?", "opts": ["a rule about how people should act", "the largest amount or number something can hold", "the number of people who actually came", "the price of each ticket"], "ci": 1, "exp": "<i>capacity</i> (n.) the most that something can hold or do. <i>The water bottle has a <b>capacity</b> of one liter.</i> Family: capable (adj.), capability (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The factory can <b>manufacture</b> 500 bicycles every day. Which word means the <b>SAME</b> or nearly the same as “manufacture”?", "opts": ["produce", "destroy", "design", "sell"], "ci": 0, "exp": "<i>manufacture</i> (v.) to make things in large numbers, usually with machines. <i>Produce</i> means the same. <i>Destroy</i> is the opposite, and a factory may <i>design</i> or <i>sell</i> bikes, but that is not making them. <i>This plant <b>manufactures</b> cereal boxes.</i> Family: manufacturer (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Only runners who finish the race in under ten minutes will <b>qualify</b> for the state championship. In this sentence, what does <b>qualify</b> mean?", "opts": ["meet the requirements to take part", "train with a famous coach", "be invited to watch from the stands", "pay a fee to enter"], "ci": 0, "exp": "<i>qualify</i> (v.) to meet the rules or standards needed to do something. <i>You must be ten years old to <b>qualify</b> for the art contest.</i> Family: qualification (n.), qualified (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "A <b>colony</b> of ants built a maze of tunnels under the sidewalk. In this sentence, what does <b>colony</b> mean?", "opts": ["an area ruled by a faraway nation", "a settlement started by people who moved from another country", "a system of tunnels dug under the ground", "a large group of the same kind of animal living together"], "ci": 3, "exp": "<i>colony</i> (n.) can mean (1) a settlement started by people from another country, (2) a land ruled by a faraway nation, or (3) a group of the same kind of animal living together. Here it is the group of ants; the tunnels are what the colony built. <i>A <b>colony</b> of bats lives in the old barn.</i> Family: colonist (n.), colonial (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The scientists made a careful _____ of the nest each morning, writing down how many eggs had hatched. Which word best completes the sentence?", "opts": ["observation", "hypothesis", "foundation", "controversy"], "ci": 0, "exp": "<i>observation</i> (n.) the act of watching something closely and noting what you see. They watched and wrote down what happened, so it was an observation, not a <i>hypothesis</i> (a guess made before testing). <i>My <b>observation</b> was that the plant leaned toward the window.</i> Family: observe (v.), observer (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Hikers like these boots because they are <b>durable</b>; one pair can last through years of rocky trails and muddy streams. In this sentence, what does <b>durable</b> mean?", "opts": ["expensive and fancy-looking", "warm enough for snowy days", "strong enough to last a long time", "light and easy to carry"], "ci": 2, "exp": "<i>durable</i> (adj.) able to last a long time without breaking or wearing out. <i>Plastic toys are often more <b>durable</b> than paper ones.</i> Family: durability (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The hurricane caused _____ damage; hundreds of trees fell, and the whole town lost power for a week. Which word best completes the sentence?", "opts": ["gradual", "tremendous", "modest", "sparse"], "ci": 1, "exp": "<i>tremendous</i> (adj.) very great in size or amount. Hundreds of fallen trees and a week without power show the damage was huge, not <i>modest</i> (small). <i>The crowd gave a <b>tremendous</b> cheer.</i> Family: tremendously (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The twins <b>alternate</b> washing the dishes: Maya does them on Monday, Leo on Tuesday, Maya again on Wednesday, and so on. In this sentence, what does <b>alternate</b> mean?", "opts": ["skip a chore whenever possible", "do a job together at the same time", "take turns doing something, one after the other", "do something only once in a while"], "ci": 2, "exp": "<i>alternate</i> (v.) to take turns, first one and then the other. <i>The coaches <b>alternate</b> who leads warm-ups each day.</i> Family: alternative (n.), alternately (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "My teacher wrote a strong _____ to help me get into the advanced art class. Which form of the word best completes the sentence?", "opts": ["recommend", "recommending", "recommendation", "recommended"], "ci": 2, "exp": "After “a strong,” the sentence needs a noun: <i>recommendation</i> (n.) a statement that someone is good for something. <i>recommend</i> (v.) to suggest as a good choice. <i>I <b>recommend</b> this book to every reader.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
