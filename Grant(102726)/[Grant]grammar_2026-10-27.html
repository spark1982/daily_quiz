<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261027";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["I", "NO CHANGE", "myself", "mine"], "ci": 0, "exp": "Use <i>I</i> when it is part of the subject. Try it alone: <i><b>I</b> filled three baskets</i> (not <i>me filled</i>). So: <i>Dad and <b>I</b> filled three huge baskets.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Letter to Cousin Ava</strong><br><b>(1)</b> Dear Ava, last Saturday my whole family drove two hours to Hillside Orchard to pick apples and pumpkins. <b>(2)</b> Dad and <u>me</u> filled three huge baskets with shiny red apples before lunch. <b>(3)</b> The trees in the oldest rows were very tall. <b>(4)</b> We needed a ladder to reach the best apples. <b>(5)</b> After we finished picking we drank cold cider and ate warm donuts at the farm stand. <b>(6)</b> Next fall you <u>should of</u> come with us so we can pick even more!"}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["The trees in the oldest rows were very tall, but we needed a ladder to reach the best apples.", "The trees in the oldest rows were very tall, so we needed a ladder to reach the best apples.", "The trees in the oldest rows were very tall, we needed a ladder to reach the best apples.", "Although the trees in the oldest rows were very tall, we needed a ladder to reach the best apples."], "ci": 1, "exp": "Use <i>so</i> to show a result: the tall trees caused the need for a ladder. <i>But</i> and <i>although</i> show a contrast, and a comma alone cannot join two sentences.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Letter to Cousin Ava</strong><br><b>(1)</b> Dear Ava, last Saturday my whole family drove two hours to Hillside Orchard to pick apples and pumpkins. <b>(2)</b> Dad and <u>me</u> filled three huge baskets with shiny red apples before lunch. <b>(3)</b> The trees in the oldest rows were very tall. <b>(4)</b> We needed a ladder to reach the best apples. <b>(5)</b> After we finished picking we drank cold cider and ate warm donuts at the farm stand. <b>(6)</b> Next fall you <u>should of</u> come with us so we can pick even more!"}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["After we finished, picking we drank cold cider and ate warm donuts at the farm stand.", "After we finished picking, we drank cold cider and ate warm donuts at the farm stand.", "After we finished picking we drank, cold cider and ate warm donuts at the farm stand.", "After we finished picking we drank cold cider, and ate warm donuts at the farm stand."], "ci": 1, "exp": "Put a comma after an opening part that tells <i>when</i>: <i>After we finished picking<b>,</b> we drank cold cider and ate warm donuts at the farm stand.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Letter to Cousin Ava</strong><br><b>(1)</b> Dear Ava, last Saturday my whole family drove two hours to Hillside Orchard to pick apples and pumpkins. <b>(2)</b> Dad and <u>me</u> filled three huge baskets with shiny red apples before lunch. <b>(3)</b> The trees in the oldest rows were very tall. <b>(4)</b> We needed a ladder to reach the best apples. <b>(5)</b> After we finished picking we drank cold cider and ate warm donuts at the farm stand. <b>(6)</b> Next fall you <u>should of</u> come with us so we can pick even more!"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["should", "NO CHANGE", "should have", "shall of"], "ci": 0, "exp": "<i>Should of</i> is never correct; it comes from how <i>should’ve</i> sounds. Because this is about next fall, use <i>should</i> + verb: <i>Next fall you <b>should</b> come with us.</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Letter to Cousin Ava</strong><br><b>(1)</b> Dear Ava, last Saturday my whole family drove two hours to Hillside Orchard to pick apples and pumpkins. <b>(2)</b> Dad and <u>me</u> filled three huge baskets with shiny red apples before lunch. <b>(3)</b> The trees in the oldest rows were very tall. <b>(4)</b> We needed a ladder to reach the best apples. <b>(5)</b> After we finished picking we drank cold cider and ate warm donuts at the farm stand. <b>(6)</b> Next fall you <u>should of</u> come with us so we can pick even more!"}, {"stem": "What is the best way to combine sentences 1 and 2?", "opts": ["The great horned owl, where lives in forests, deserts, and even city parks across North America, is a skilled hunter.", "The great horned owl is a skilled hunter, it lives in forests, deserts, and even city parks across North America.", "The great horned owl, which lives in forests, deserts, and even city parks across North America, is a skilled hunter.", "The great horned owl, which lives in forests, deserts, and even city parks across North America is a skilled hunter."], "ci": 2, "exp": "Use <i>which</i> to add information about an animal or thing, and put commas on both sides of the added part: <i>The great horned owl<b>, which</b> lives in forests, deserts, and even city parks<b>,</b> is a skilled hunter.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Owls Hunt</strong><br><b>(1)</b> The great horned owl is a skilled hunter. <b>(2)</b> It lives in forests, deserts, and even city parks across North America. <b>(3)</b> The feathers on its wings <u>has</u> soft, fringed edges. <b>(4)</b> These edges break up the rushing air, so the owl can fly almost silently toward its prey. <b>(5)</b> Its ears are set at slightly different heights, <u>which</u> helps it find the exact spot of a sound. <b>(6)</b> In winter, it can even catch mice that are hiding under a thick blanket of snow. <b>(7)</b> <u>Because its hearing is so sharp.</u>"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["have", "NO CHANGE", "is having", "was"], "ci": 0, "exp": "The subject is <i>feathers</i> (plural), not <i>wings</i> or the owl. A plural subject takes <i>have</i>: <i>The feathers on its wings <b>have</b> soft, fringed edges.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Owls Hunt</strong><br><b>(1)</b> The great horned owl is a skilled hunter. <b>(2)</b> It lives in forests, deserts, and even city parks across North America. <b>(3)</b> The feathers on its wings <u>has</u> soft, fringed edges. <b>(4)</b> These edges break up the rushing air, so the owl can fly almost silently toward its prey. <b>(5)</b> Its ears are set at slightly different heights, <u>which</u> helps it find the exact spot of a sound. <b>(6)</b> In winter, it can even catch mice that are hiding under a thick blanket of snow. <b>(7)</b> <u>Because its hearing is so sharp.</u>"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["who", "where", "NO CHANGE", "whose"], "ci": 2, "exp": "This sentence is already correct. <i>Which</i> adds information about the ears being set at different heights. <i>Who</i> is for people, <i>where</i> is for places, and <i>whose</i> shows ownership.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Owls Hunt</strong><br><b>(1)</b> The great horned owl is a skilled hunter. <b>(2)</b> It lives in forests, deserts, and even city parks across North America. <b>(3)</b> The feathers on its wings <u>has</u> soft, fringed edges. <b>(4)</b> These edges break up the rushing air, so the owl can fly almost silently toward its prey. <b>(5)</b> Its ears are set at slightly different heights, <u>which</u> helps it find the exact spot of a sound. <b>(6)</b> In winter, it can even catch mice that are hiding under a thick blanket of snow. <b>(7)</b> <u>Because its hearing is so sharp.</u>"}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["NO CHANGE", "This is because its hearing is so sharp.", "Because, its hearing is so sharp.", "Because its hearing is so sharp and."], "ci": 1, "exp": "A sentence that starts with <i>Because</i> and has nothing else is a fragment; it does not finish the thought. Make it complete: <i><b>This is because</b> its hearing is so sharp.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Report: How Owls Hunt</strong><br><b>(1)</b> The great horned owl is a skilled hunter. <b>(2)</b> It lives in forests, deserts, and even city parks across North America. <b>(3)</b> The feathers on its wings <u>has</u> soft, fringed edges. <b>(4)</b> These edges break up the rushing air, so the owl can fly almost silently toward its prey. <b>(5)</b> Its ears are set at slightly different heights, <u>which</u> helps it find the exact spot of a sound. <b>(6)</b> In winter, it can even catch mice that are hiding under a thick blanket of snow. <b>(7)</b> <u>Because its hearing is so sharp.</u>"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["NO CHANGE", "baked", "will bake", "have baking"], "ci": 1, "exp": "This journal tells what already happened today, and the other sentences use past tense (<i>noticed, ran, came</i>). Keep the tense the same: <i>Today I <b>baked</b> banana bread.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Journal: Banana Bread Day</strong><br><b>(1)</b> Today I <u>bake</u> banana bread with my older brother, Luis. <b>(2)</b> We <u>had already mashed</u> the bananas when Luis noticed we had no eggs. <b>(3)</b> He ran next door to borrow two eggs from our neighbor, Mrs. Gomez. <b>(4)</b> An hour later, the bread came out of the oven golden brown and smelled amazing. <b>(5)</b> Its the best thing my brother and I have ever made together. <b>(6)</b> Luis cut thick slices for Mom and <u>Dad, he</u> saved the crunchy end for me because he knows it is my favorite part."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["had already mash", "have already mashed", "had already mashing", "NO CHANGE"], "ci": 3, "exp": "This is already correct. <i>Had</i> + past participle (<i>mashed</i>) shows the mashing happened before Luis noticed. <i>Have mashed</i> does not fit a story told in the past.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Journal: Banana Bread Day</strong><br><b>(1)</b> Today I <u>bake</u> banana bread with my older brother, Luis. <b>(2)</b> We <u>had already mashed</u> the bananas when Luis noticed we had no eggs. <b>(3)</b> He ran next door to borrow two eggs from our neighbor, Mrs. Gomez. <b>(4)</b> An hour later, the bread came out of the oven golden brown and smelled amazing. <b>(5)</b> Its the best thing my brother and I have ever made together. <b>(6)</b> Luis cut thick slices for Mom and <u>Dad, he</u> saved the crunchy end for me because he knows it is my favorite part."}, {"stem": "Which sentence has an error?", "opts": ["We had already mashed the bananas when Luis noticed we had no eggs.", "He ran next door to borrow two eggs from our neighbor, Mrs. Gomez.", "Its the best thing my brother and I have ever made together.", "An hour later, the bread came out of the oven golden brown and smelled amazing."], "ci": 2, "exp": "<i>It’s</i> means <i>it is</i>. <i>Its</i> without an apostrophe shows ownership. The sentence should be: <i><b>It’s</b> the best thing my brother and I have ever made together.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Journal: Banana Bread Day</strong><br><b>(1)</b> Today I <u>bake</u> banana bread with my older brother, Luis. <b>(2)</b> We <u>had already mashed</u> the bananas when Luis noticed we had no eggs. <b>(3)</b> He ran next door to borrow two eggs from our neighbor, Mrs. Gomez. <b>(4)</b> An hour later, the bread came out of the oven golden brown and smelled amazing. <b>(5)</b> Its the best thing my brother and I have ever made together. <b>(6)</b> Luis cut thick slices for Mom and <u>Dad, he</u> saved the crunchy end for me because he knows it is my favorite part."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["NO CHANGE", "Dad he", "Dad. He", "Dad, and him"], "ci": 2, "exp": "Two complete sentences joined with only a comma make a run-on (comma splice). Split them: <i>Luis cut thick slices for Mom and <b>Dad. He</b> saved the crunchy end for me.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Journal: Banana Bread Day</strong><br><b>(1)</b> Today I <u>bake</u> banana bread with my older brother, Luis. <b>(2)</b> We <u>had already mashed</u> the bananas when Luis noticed we had no eggs. <b>(3)</b> He ran next door to borrow two eggs from our neighbor, Mrs. Gomez. <b>(4)</b> An hour later, the bread came out of the oven golden brown and smelled amazing. <b>(5)</b> Its the best thing my brother and I have ever made together. <b>(6)</b> Luis cut thick slices for Mom and <u>Dad, he</u> saved the crunchy end for me because he knows it is my favorite part."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["“who can name the closest star to Earth?”", "NO CHANGE", "“Who can name the closest star to Earth”?", "“Who can name the closest star to Earth?.”"], "ci": 1, "exp": "This is already correct. A quotation starts with a capital letter, and the question mark goes inside the closing quotation marks because the speaker is asking the question.", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The Closest Star</strong><br><b>(1)</b> On Friday, our class visited the planetarium at the science museum downtown. <b>(2)</b> Our guide, Mr. Ellis, asked, <u>“Who can name the closest star to Earth?”</u> <b>(3)</b> Nora raised her hand and said “The sun is the closest star.” <b>(4)</b> Mr. Ellis smiled and gave <u>Nora and I</u> glow-in-the-dark star maps to hang above our var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
