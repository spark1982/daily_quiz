var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261027";
var RAW_QUESTIONS = [{"stem": "Read this sentence from the last paragraph: “Borglum died in March 1941, and his son Lincoln supervised the final months of work.” What does <b>supervised</b> mean?", "opts": ["took photographs of", "was in charge of and directed", "slowed down and delayed", "paid all the costs of"], "ci": 1, "exp": "Lincoln took over after his father died, so he was the one in charge: “his son Lincoln supervised the final months of work.” He did not pay for the work; the passage says the money ran out.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Faces in the Granite</strong><br><p style=\"margin:0 0 8px;\">In 1923, a South Dakota historian named Doane Robinson proposed an unusual way to attract tourists to his state: carving giant figures into the granite cliffs of the Black Hills. He recruited the sculptor Gutzon Borglum, who insisted that the monument honor the entire nation rather than local heroes. Borglum selected four presidents, George Washington, Thomas Jefferson, Theodore Roosevelt, and Abraham Lincoln, to represent the birth, growth, development, and preservation of the United States.</p><p style=\"margin:0 0 8px;\">Work began in 1927. Because granite is extremely hard, roughly ninety percent of the rock was removed with dynamite. Workers then dangled from steel cables in leather harnesses, using jackhammers and chisels to smooth each face. Every face rises about sixty feet, taller than a five-story building. Despite the hazardous conditions, not a single worker died during fourteen years of construction.</p><p style=\"margin:0 0 8px;\">Borglum died in March 1941, and his son Lincoln supervised the final months of work. When the money ran out that October, the figures were left unfinished; Borglum had originally planned to carve each president down to the waist. The Black Hills were also sacred to the Lakota people, and many Lakota still regard the carving as a painful reminder that their land was taken.</p>"}, {"stem": "According to the passage, about how much of the rock was removed with dynamite?", "opts": ["about one-quarter", "about ninety percent", "about half", "about sixty percent"], "ci": 1, "exp": "The passage says, “roughly ninety percent of the rock was removed with dynamite.” The number sixty describes how tall each face is, not how much rock was blasted.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Faces in the Granite</strong><br><p style=\"margin:0 0 8px;\">In 1923, a South Dakota historian named Doane Robinson proposed an unusual way to attract tourists to his state: carving giant figures into the granite cliffs of the Black Hills. He recruited the sculptor Gutzon Borglum, who insisted that the monument honor the entire nation rather than local heroes. Borglum selected four presidents, George Washington, Thomas Jefferson, Theodore Roosevelt, and Abraham Lincoln, to represent the birth, growth, development, and preservation of the United States.</p><p style=\"margin:0 0 8px;\">Work began in 1927. Because granite is extremely hard, roughly ninety percent of the rock was removed with dynamite. Workers then dangled from steel cables in leather harnesses, using jackhammers and chisels to smooth each face. Every face rises about sixty feet, taller than a five-story building. Despite the hazardous conditions, not a single worker died during fourteen years of construction.</p><p style=\"margin:0 0 8px;\">Borglum died in March 1941, and his son Lincoln supervised the final months of work. When the money ran out that October, the figures were left unfinished; Borglum had originally planned to carve each president down to the waist. The Black Hills were also sacred to the Lakota people, and many Lakota still regard the carving as a painful reminder that their land was taken.</p>"}, {"stem": "According to the passage, which event happened right after Gutzon Borglum died?", "opts": ["The money ran out and the figures were left unfinished.", "His son Lincoln took charge of the final months of work.", "Workers began removing rock with dynamite.", "Borglum chose the four presidents for the monument."], "ci": 1, "exp": "“Borglum died in March 1941, and his son Lincoln supervised the final months of work.” The money did not run out until “that October,” several months later.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Faces in the Granite</strong><br><p style=\"margin:0 0 8px;\">In 1923, a South Dakota historian named Doane Robinson proposed an unusual way to attract tourists to his state: carving giant figures into the granite cliffs of the Black Hills. He recruited the sculptor Gutzon Borglum, who insisted that the monument honor the entire nation rather than local heroes. Borglum selected four presidents, George Washington, Thomas Jefferson, Theodore Roosevelt, and Abraham Lincoln, to represent the birth, growth, development, and preservation of the United States.</p><p style=\"margin:0 0 8px;\">Work began in 1927. Because granite is extremely hard, roughly ninety percent of the rock was removed with dynamite. Workers then dangled from steel cables in leather harnesses, using jackhammers and chisels to smooth each face. Every face rises about sixty feet, taller than a five-story building. Despite the hazardous conditions, not a single worker died during fourteen years of construction.</p><p style=\"margin:0 0 8px;\">Borglum died in March 1941, and his son Lincoln supervised the final months of work. When the money ran out that October, the figures were left unfinished; Borglum had originally planned to carve each president down to the waist. The Black Hills were also sacred to the Lakota people, and many Lakota still regard the carving as a painful reminder that their land was taken.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Gutzon Borglum was the most skilled sculptor in American history.", "Dynamite is the safest and fastest tool for carving granite.", "Doane Robinson wanted the monument to honor heroes from South Dakota.", "Mount Rushmore was a huge, dangerous project to honor the nation, but it was left unfinished and is still painful for many Lakota."], "ci": 3, "exp": "The passage covers the idea, the difficult construction, the unfinished ending, and the Lakota view. Doane Robinson wanted tourists, but it was Borglum who “insisted that the monument honor the entire nation rather than local heroes.”", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Faces in the Granite</strong><br><p style=\"margin:0 0 8px;\">In 1923, a South Dakota historian named Doane Robinson proposed an unusual way to attract tourists to his state: carving giant figures into the granite cliffs of the Black Hills. He recruited the sculptor Gutzon Borglum, who insisted that the monument honor the entire nation rather than local heroes. Borglum selected four presidents, George Washington, Thomas Jefferson, Theodore Roosevelt, and Abraham Lincoln, to represent the birth, growth, development, and preservation of the United States.</p><p style=\"margin:0 0 8px;\">Work began in 1927. Because granite is extremely hard, roughly ninety percent of the rock was removed with dynamite. Workers then dangled from steel cables in leather harnesses, using jackhammers and chisels to smooth each face. Every face rises about sixty feet, taller than a five-story building. Despite the hazardous conditions, not a single worker died during fourteen years of construction.</p><p style=\"margin:0 0 8px;\">Borglum died in March 1941, and his son Lincoln supervised the final months of work. When the money ran out that October, the figures were left unfinished; Borglum had originally planned to carve each president down to the waist. The Black Hills were also sacred to the Lakota people, and many Lakota still regard the carving as a painful reminder that their land was taken.</p>"}, {"stem": "According to the passage, why do wildfires often skip over land near a beaver pond?", "opts": ["The ground there stays wet and soggy.", "Beavers cut down all the trees nearby.", "The dam blocks the wind from reaching the land.", "Farmers clear the land around the pond."], "ci": 0, "exp": "Because the pond holds water, “nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground.” Beavers do cut trees, but the passage links the fires to the wet ground.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>"}, {"stem": "Which conclusion is best supported by the passage?", "opts": ["Farmers and beavers usually work well together.", "Beavers build dams mainly to help ducks and moose.", "Removing beavers from an area could harm many other animals.", "Beaver ponds tend to dry up quickly in hot weather."], "ci": 2, "exp": "The passage says that if the beaver is removed “from a valley, ... much of the wildlife there begins to disappear.” Other animals benefit from the pond, but the beavers build it to protect their own family, not to help ducks.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>"}, {"stem": "Read this sentence: “Ducks, frogs, fish, and moose thrive among the abundant wetland plants.” Which word means the <b>OPPOSITE</b> of <b>thrive</b>?", "opts": ["flourish", "prosper", "gather", "struggle"], "ci": 3, "exp": "To <i>thrive</i> is to grow strong and do well, so the opposite is <i>struggle</i>. <i>Flourish</i> and <i>prosper</i> mean almost the same as thrive.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Beaver dams speed up the current of a stream.", "A beaver’s front teeth never stop growing.", "Beavers store branches under the ice to eat in winter.", "Soil near a beaver pond can stay moist during a drought."], "ci": 0, "exp": "The passage says the dam “slows the current and floods the land behind it,” so it does not speed the current up. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>"}, {"stem": "Which sentence best states a theme of the story?", "opts": ["It is better to avoid performing in front of crowds.", "A mistake is not a failure if you keep going.", "Enough practice guarantees a perfect performance.", "Audiences always notice every small mistake."], "ci": 1, "exp": "Jonah forgot the middle but kept playing, and at the end “he didn’t feel defeated by a mistake.” Ms. Bell even says audiences “rarely notice a slip.”", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>"}, {"stem": "The word <b>unbearable</b> is made of <i>un-</i> + <i>bear</i> + <i>-able</i>. Based on its parts and the story, what does <b>unbearable</b> most likely mean?", "opts": ["easy to carry or hold", "calm and peaceful", "happening again and again", "too hard to put up with"], "ci": 3, "exp": "<i>Un-</i> means “not,” <i>bear</i> can mean “put up with,” and <i>-able</i> means “able to be.” So the silent second was “not able to be put up with.” The choice about carrying uses a different meaning of <i>bear</i> and leaves out <i>un-</i>.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>"}, {"stem": "Read this sentence: “He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.” Which word means the <b>SAME</b> or nearly the same as <b>deliberate</b>?", "opts": ["accidental", "intentional", "hurried", "cheerful"], "ci": 1, "exp": "<i>Deliberate</i> means done carefully and on purpose. Jonah chose the section he knew best and played it steadily, so <i>intentional</i> fits. <i>Hurried</i> and <i>accidental</i> mean nearly the opposite.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer g e remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>"}, {"stem": "Read this sentence: “The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer.” In this sentence, what does <b>current</b> mean?", "opts": ["happening now, at the present time", "a flow of electricity through a wire", "the newest or latest version of something", "a strong flow of water moving in one direction"], "ci": 3, "exp": "<i>Current</i> has several meanings. Here it is the moving river water that “tugged” at the boat, so it means a strong flow of water. The other choices are real meanings of <i>current</i> that do not fit a rowboat on a flood.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>High Water in Greenville</strong><br><p style=\"margin:0 0 8px;\">In April 1927, after months of relentless rain, the Mississippi River swelled higher than anyone in Greenville, Mississippi, could remember. Eleven-year-old Henry Jackson watched from the levee as brown water lapped just inches below the top of the earthen wall, and his father doubted it could withstand much more.</p><p style=\"margin:0 0 8px;\">On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning, and within hours the streets had become canals. His father hoisted Henry’s little sister onto the roof of their porch while Henry gathered the family’s quilts and a sack of cornmeal.</p><p style=\"margin:0 0 8px;\">Two days later, a rowboat finally reached their house. The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer around floating fence posts and ruined crops. They carried the family to the top ast brown lake that had once been farmland. His father rested a hand on his shoulder. “The river took a lot,” he said quietly, “but it couldn’t take us.”</p>"}, {"stem": "Why does the author most likely end the story with the father’s words, “The river took a lot, but it couldn’t take us”?", "opts": ["To suggest that the father blamed Mr. Lacey for the damage", "To explain how the levee was built and why it failed", "To show that the family values being safe together more than what they lost", "To predict that the river will flood again next spring"], "ci": 2, "exp": "After losing their farmland, the father points out that the family survived. This ending shows what matters most to them. The story never explains how the levee was built.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>High Water in Greenville</strong><br><p style=\"margin:0 0 8px;\">In April 1927, after months of relentless rain, the Mississippi River swelled higher than anyone in Greenville, Mississippi, could remember. Eleven-year-old Henry Jackson watched from the levee as brown water lapped just inches below the top of the earthen wall, and his father doubted it could withstand much more.</p><p style=\"margin:0 0 8px;\">On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning, and within hours the streets had become canals. His father hoisted Henry’s little sister onto the roof of their porch while Henry gathered the family’s quilts and a sack of cornmeal.</p><p style=\"margin:0 0 8px;\">Two days later, a rowboat finally reached their house. The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer around floating fence posts and ruined crops. They carried the family to the top of the levee, which had become a crowded, muddy camp for thousands of people.</p><p style=\"margin:0 0 8px;\">That night, Henry gazed across the vast brown lake that had once been farmland. His father rested a hand on his shoulder. “The river took a lot,” he said quietly, “but it couldn’t take us.”</p>"}, {"stem": "According to the story, which event happened right after the levee north of town gave way?", "opts": ["Henry watched the water from the top of the levee.", "A rowboat reached the Jacksons’ house.", "The family was carried to the camp on the levee.", "Church bells rang to warn the town."], "ci": 3, "exp": "“On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning.” The rowboat came “two days later.”", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>High Water in Greenville</strong><br><p style=\"margin:0 0 8px;\">In April 1927, after months of relentless rain, the Mississippi River swelled higher than anyone in Greenville, Mississippi, could remember. Eleven-year-old Henry Jackson watched from the levee as brown water lapped just inches below the top of the earthen wall, and his father doubted it could withstand much more.</p><p style=\"margin:0 0 8px;\">On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning, and within hours the streets had become canals. His father hoisted Henry’s little sister onto the roof of their porch while Henry gathered the family’s quilts and a sack of cornmeal.</p><p style=\"margin:0 0 8px;\">Two days later, a rowboat finally reached their house. The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer around floating fence posts and ruined crops. They carried the family to the top of the levee, which had become a crowded, muddy camp for thousands of people.</p><p style=\"margin:0 0 8px;\">That night, Henry gazed across the vast brown lake that had once been farmland. His father rested a hand on his shoulder. “The river took a lot,” he said quietly, “but it couldn’t take us.”</p>"}, {"stem": "How is the river in the second stanza of “The River Wakes” similar to the river in “High Water in Greenville”?", "opts": ["Both describe the river as calm and gentle.", "Both are told by a boy who lives near a levee.", "Both show the river as a powerful force that floods farmland.", "Both end with the river freezing in winter."], "ci": 2, "exp": "In the poem the river “drags the drowning crops beneath,” and in the story the flood turns farmland into “the vast brown lake.” The poem’s July stanza is gentle, but the second stanza is not, and the poem has no narrator who lives by a levee.", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>"}, {"stem": "Read this line from the second stanza: “By April it is restless, broad, and loud.” Which word means the <b>OPPOSITE</b> of <b>restless</b>?", "opts": ["calm", "agitated", "noisy", "uneasy"], "ci": 0, "exp": "In April the river is wild and moving; <i>restless</i> means unable to stay still. The opposite is <i>calm</i>, like the river in July that “hums a gentle tune.” <i>Uneasy</i> and <i>agitated</i> mean almost the same as restless.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>"}, {"stem": "Which of these does the poem <b>NOT</b> describe the river doing?", "opts": ["freezing over again in the fall", "swallowing a fence and a footbridge", "cracking its ice in March", "humming a gentle tune in July"], "ci": 0, "exp": "The poem moves from March to April to July and never mentions fall. It does say the river “cracks its frozen coat,” “swallows fence and footbridge,” and “hums a gentle tune.”", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>"}, {"stem": "Read this line from the first stanza: “and shoulders chunks of white like scattered dice.” What does <b>shoulders</b> mean in this line?", "opts": ["carries gently on its back", "melts slowly in the sun", "pushes forward with force", "breaks into tiny pieces"], "ci": 2, "exp": "The river has just cracked its ice “in two” and is moving the chunks “toward sleeping towns,” so <i>shoulders</i> means pushes hard, the way a person pushes with a shoulder. Nothing in the line is carried gently.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
