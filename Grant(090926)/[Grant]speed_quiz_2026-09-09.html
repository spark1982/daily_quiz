<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;min-height:100vh;padding:12px;max-width:720px;margin:0 auto;}

<script>var TITLE = "[Grant] Speed Quiz";var QUIZ_KEY = "quiz_grantspeedquiz_20260909_v1";var ATT_KEY = "quiz_grantspeedquiz_att_20260909_v1";var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};var RAW_QUESTIONS = [{"stem": "Compute the following.<br>2 + 3 + 4 + 5 + 6 + 7 + 8", "opts": ["33", "34", "35", "36"], "ci": 2, "exp": "This is 7 consecutive terms from 2 to 8: sum = (2 + 8) &times; 7 &divide; 2 = 35.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>6 + 7 + 8 + 9 + 10 + 11", "opts": ["49", "50", "51", "52"], "ci": 2, "exp": "This is 6 consecutive terms from 6 to 11: sum = (6 + 11) &times; 6 &divide; 2 = 51.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?", "opts": ["90", "95", "100", "105"], "ci": 1, "exp": "The weekly amounts form 5, 6, 7, ..., 14 (10 terms): sum = (5 + 14) &times; 10 &divide; 2 = 95 coins.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>1 + 2 + 3 + 4 + &hellip; + 48 + 49 + 50", "opts": ["1225", "1275", "1325", "1250"], "ci": 1, "exp": "This is 50 consecutive terms from 1 to 50: sum = (1 + 50) &times; 50 &divide; 2 = 1275.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>1 + 3 + 5 + 7 + &hellip; + 45 + 47 + 49", "opts": ["600", "625", "650", "576"], "ci": 1, "exp": "There are 25 odd terms from 1 to 49: sum = (1 + 49) &times; 25 &divide; 2 = 625.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Find the sum of all multiples of 4 that are smaller than or equal to 40.", "opts": ["200", "210", "220", "240"], "ci": 2, "exp": "The multiples are 4, 8, 12, ..., 40 (10 terms): sum = (4 + 40) &times; 10 &divide; 2 = 220.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Joe puts 5 matchsticks on a table. Each matchstick is 10 cm away from another. How far is the fifth matchstick away from the first one?", "opts": ["40", "50", "30", "45"], "ci": 0, "exp": "There are 4 gaps between the 1st and 5th matchsticks: 4 &times; 10 = 40 cm.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?", "opts": ["99", "100", "101", "102"], "ci": 2, "exp": "There are 500 &divide; 5 = 100 gaps, so with both ends planted there are 101 trees.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?", "opts": ["120", "125", "100", "115"], "ci": 0, "exp": "With 25 trees (both ends planted), there are 24 gaps: 24 &times; 5 = 120 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "16 lamp posts are placed at regular intervals along a road that is 300 m long. If lamp posts are placed at both ends of the road as well, how far is one lamp post from another?", "opts": ["18.75", "20", "25", "15"], "ci": 1, "exp": "With 16 lamp posts at both ends, there are 15 gaps: 300 &divide; 15 = 20 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "It takes Uncle Sam 50 seconds to bike from the first lamp post to the eleventh lamp post. How many lamp posts would he bike past after 80 seconds?", "opts": ["16", "17", "18", "15"], "ci": 1, "exp": "There are 10 gaps in 50 seconds, so each gap takes 5 seconds. In 80 seconds he covers 80 &divide; 5 = 16 gaps, reaching the 17th lamp post.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Pots of flowers are used to decorate the edges of a square garden. The distance between every two pots of flowers is 3 m. One side of the square garden is 24 m. How many pots of flowers are needed?", "opts": ["30", "31", "32", "36"], "ci": 2, "exp": "The perimeter is 4 &times; 24 = 96 m. Since the pots form a closed loop, the number of pots equals the number of gaps: 96 &divide; 3 = 32.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>24 + 37 + 23 + 16 =", "opts": ["96", "100", "106", "110"], "ci": 1, "exp": "24 + 37 + 23 + 16 = 100.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>55 + 33 + 45 + 27 =", "opts": ["150", "160", "165", "155"], "ci": 1, "exp": "55 + 33 + 45 + 27 = 160.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>24 + 47 + 39 =", "opts": ["100", "105", "110", "115"], "ci": 2, "exp": "24 + 47 + 39 = 110.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>33 + 48 + 59 =", "opts": ["130", "135", "140", "145"], "ci": 2, "exp": "33 + 48 + 59 = 140.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>284 + 118 =", "opts": ["392", "402", "412", "398"], "ci": 1, "exp": "284 + 118 = 402.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>514 + 186 =", "opts": ["690", "700", "710", "680"], "ci": 1, "exp": "514 + 186 = 700.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>24 &times; 25 =", "opts": ["500", "550", "600", "650"], "ci": 2, "exp": "24 &times; 25 = 600.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>28 &times; 25 =", "opts": ["650", "700", "750", "800"], "ci": 1, "exp": "28 &times; 25 = 700.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>36 &times; 25 =", "opts": ["850", "900", "950", "800"], "ci": 1, "exp": "36 &times; 25 = 900.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>16 &times; 25 =", "opts": ["350", "400", "450", "300"], "ci": 1, "exp": "16 &times; 25 = 400.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>40 &times; 99 =", "opts": ["3900", "3960", "4000", "3860"], "ci": 1, "exp": "40 &times; 99 = 40 &times; 100 &minus; 40 = 4000 &minus; 40 = 3960.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>50 &times; 999 =", "opts": ["49500", "49950", "50000", "49900"], "ci": 1, "exp": "50 &times; 999 = 50 &times; 1000 &minus; 50 = 50000 &minus; 50 = 49950.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "The 5 points A, B, C, D, E lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"250\" height=\"70\" viewBox=\"0 0 250 70\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"35\" x2=\"230\" y2=\"35\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"40\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"40\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"90\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"90\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"130\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"130\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"230\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"230\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["10", "9", "8", "12"], "ci": 0, "exp": "With 5 points at all-different spacings, every pair of points gives a distinct length: C(5,2) = 5 &times; 4 &divide; 2 = 10.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The 6 points A, B, C, D, E, F lie on a line at irregular intervals (no two segments have the same length).<br><svg width=\"265\" height=\"70\" viewBox=\"0 0 265 70\" style=\"display:block;margin:10px auto;\"><line x1=\"15\" y1=\"35\" x2=\"245\" y2=\"35\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"15\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"15\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"35\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"35\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"75\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"75\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"110\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"110\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"165\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"165\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"245\" cy=\"35\" r=\"4\" fill=\"#333\"/><text x=\"245\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>How many different line lengths can be measured between pairs of these points?", "opts": ["15", "14", "20", "21"], "ci": 0, "exp": "With 6 points at all-different spacings, every pair of points gives a distinct length: C(6,2) = 6 &times; 5 &divide; 2 = 15.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The grid below is a 5&times;5 grid of unit cells.<br><svg width=\"170\" height=\"170\" viewBox=\"0 0 170 170\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"150\" height=\"150\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"40\" y1=\"10\" x2=\"40\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"40\" x2=\"160\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"70\" x2=\"160\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"10\" x2=\"100\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"100\" x2=\"160\" y2=\"100\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"130\" x2=\"160\" y2=\"130\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many squares (of any size) can be found in the figure altogether?", "opts": ["50", "55", "60", "45"], "ci": 1, "exp": "For an n&times;n grid, the square count is n(n+1)(2n+1) &divide; 6 = 5(6)(11) &divide; 6 = 55 (1&times;1: 25, 2&times;2: 16, 3&times;3: 9, 4&times;4: 4, 5&times;5: 1).", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The grid below is a 4-column, 2-row grid of unit cells.<br><svg width=\"180\" height=\"100\" viewBox=\"0 0 180 100\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"160\" height=\"80\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"50\" y1=\"10\" x2=\"50\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"130\" y1=\"10\" x2=\"130\" y2=\"90\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"50\" x2=\"170\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many rectangles (including squares) can be found in the figure altogether?", "opts": ["24", "30", "36", "20"], "ci": 1, "exp": "For a 4-column, 2-row grid, the rectangle count is C(5,2) &times; C(3,2) = 10 &times; 3 = 30.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "From one vertex of the triangle below, 1 line segment is drawn to the opposite side, splitting the triangle into 2 regions.<br><svg width=\"180\" height=\"130\" viewBox=\"0 0 180 130\" style=\"display:block;margin:10px auto;\"><polygon points=\"90,10 10,110 170,110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"90\" y1=\"10\" x2=\"90\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many triangles are there in the whole figure?", "opts": ["2", "3", "4", "5"], "ci": 1, "exp": "With k=1 cevian: (k+1)(k+2) &divide; 2 = (2)(3) &divide; 2 = 3.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "From one vertex of the triangle below, 3 line segments are drawn to the opposite side, splitting the triangle into 4 regions.<br><svg width=\"230\" height=\"130\" viewBox=\"0 0 230 130\" style=\"display:block;margin:10px auto;\"><polygon points=\"115,10 10,110 220,110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"115\" y1=\"10\" x2=\"62\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"115\" y1=\"10\" x2=\"115\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"115\" y1=\"10\" x2=\"168\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many triangles are there in the whole figure?", "opts": ["8", "9", "10", "12"], "ci": 2, "exp": "With k=3 cevians: (k+1)(k+2) &divide; 2 = (4)(5) &divide; 2 = 10.", "tag": "Geometry", "tagcolor": "#E24B4A"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + "_order_v1";
var Q_TIME = 40;

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }

}
function identityOrder(){ var o=[]; for(var i=0;i<N;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i]!=='number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;

    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultTimerState(){ return { remainingAtStart: Q_TIME, startedAt: null, running: false, timedOut: false }; }
function defaultState(){
  var timers = {};
  for(var i=0;i<N;i++) timers[i] = defaultTimerState();
  return { cur:0, answers:{}, timers: timers, showResults:false };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.timers !== 'object' || s.timers===null) s.timers = {};
    for(var i=0;i<N;i++){ if(!s.timers[i]) s.timers[i] = defaultTimerState(); }
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var tickInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}
function getRemaining(qi){
  var t = state.timers[qi];
  if(!t) return Q_TIME;
  if(t.running && t.startedAt){
    var elapsed = (Date.now()-t.startedAt)/1000;
    return Math.max(0, t.remainingAtStart - elapsed);
  }
  return t.remainingAtStart;
}
function freezeTimer(qi){
  var t = state.timers[qi];
  if(t && t.running){
    t.remainingAtStart = getRemaining(qi);
    t.running = false;
    t.startedAt = null;
  }
}
function startTimerFor(qi){
  var t = state.timers[qi];
  if(!t) { t = defaultTimerState(); state.timers[qi] = t; }
  if(t.timedOut) return;
  if(state.answers[qi] !== undefined) return;
  if(!t.running){
    t.startedAt = Date.now();
    t.running = true;
  }
}
function stopTickInterval(){ if(tickInterval){ clearInterval(tickInterval); tickInterval=null; } }
function startTickInterval(){ stopTickInterval(); tickInterval = setInterval(tickRender, 250); }

function tickRender(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var disp = document.getElementById('qTimerDisplay');
  var pauseBtn = document.getElementById('pauseBtn');
  if(!t) return;
  var remaining = getRemaining(qi);
  disp.classList.remove('warn','danger');
  if(remaining <= 0){
    if(t.running){
      t.running = false;
      t.startedAt = null;
      t.remainingAtStart = 0;
      t.timedOut = true;
      saveState();
      renderOptionsLockState();
    }
    disp.textContent = "0:00";
    disp.classList.add('danger');
    document.getElementById('timeout-box').style.display = (state.answers[qi]===undefined) ? 'block' : 'none';
    pauseBtn.disabled = true;
    return;
  }
  pauseBtn.disabled = false;
  disp.textContent = formatTime(remaining);
  if(remaining <= Q_TIME*0.1) disp.classList.add('danger');
  else if(remaining <= Q_TIME*0.25) disp.classList.add('warn');
  pauseBtn.textContent = t.running ? 'Pause' : 'Resume';
}

function renderOptionsLockState(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var answered = state.answers[qi];
  var btns = document.querySelectorAll('#options .opt-btn');
  btns.forEach(function(btn){
    if(answered !== undefined || (t && t.timedOut)) btn.disabled = true;
  });
}

function togglePause(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(!t || t.timedOut || state.answers[qi]!==undefined) return;
  if(t.running){ freezeTimer(qi); }
  else { startTimerFor(qi); }
  saveState();
  tickRender();
}
window.togglePause=togglePause;

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  var timerBar = document.querySelector('.q-timer-bar');
  if(state.showResults){
    qa.style.display='none';
    timerBar.style.display='none';
    rs.classList.add('show');
    stopTickInterval();
    renderResults();
    return;
  }
  qa.style.display='block';
  timerBar.style.display='flex';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  badge.textContent = q.tag;
  badge.style.background = TAG_COLORS[q.tag] || '#185FA5';

  document.getElementById('q-text').innerHTML = q.stem;

  startTimerFor(qi);

  var answered = state.answers[qi];
  var t = state.timers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = (answered !== undefined) || (t && t.timedOut);
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var timeoutBox = document.getElementById('timeout-box');
  timeoutBox.style.display = (t && t.timedOut && answered===undefined) ? 'block' : 'none';

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
  tickRender();
  startTickInterval();
}

function updateNav(){
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi = order[k];
    if(state.answers[qi]!==undefined || (state.timers[qi] && state.timers[qi].timedOut)) done++;
  }
  document.getElementById('nav-count').textContent = done + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (done/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg;
    if(state.answers[qi]===undefined){
      bg = (state.timers[qi] && state.timers[qi].timedOut) ? '#f5a623' : '#d7dde6';
    } else {
      bg = state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A';
    }
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var done=0;
  for(var k=0;k<order.length;k++){
    var qi2 = order[k];
    if(state.answers[qi2]!==undefined || (state.timers[qi2] && state.timers[qi2].timedOut)) done++;
  }
  if(done===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  freezeTimer(order[state.cur]);
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  freezeTimer(order[state.cur]);
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  var t = state.timers[qi];
  if(state.answers[qi] !== undefined) return;
  if(t && t.timedOut) return;
  state.answers[qi] = idx;
  freezeTimer(qi);
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ freezeTimer(order[state.cur]); state.cur--; saveState(); render(); }
}
function goNext(){
  freezeTimer(order[state.cur]);
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0, timedout=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a===undefined){
      if(t && t.timedOut) timedout++; else skipped++;
      continue;
    }
    if(a===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+timedout+' timed out, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var card = document.createElement('div');
    if(a===undefined){
      if(t && t.timedOut){ card.className='r-card timedout'; card.textContent='Q'+(pos+1)+' Time'; }
      else { card.className='r-card skipped'; card.textContent='Q'+(pos+1)+' Skip'; }
    } else {
      var ok = a===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var isWrong = (a!==undefined && a!==RAW_QUESTIONS[qi].ci);
    var isTimedOut = (a===undefined && t && t.timedOut);
    if(isWrong || isTimedOut) wrong.push(qi);
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){
    delete state.answers[qi];
    state.timers[qi] = defaultTimerState();
  });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s += (t && t.timedOut) ? 'Timed Out' : 'Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var t = state.timers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    } else if(a===undefined && t && t.timedOut){
      var q2 = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q2.stem, yourAnswer: '(timed out)', correctAnswer: q2.opts[q2.ci], explanation: q2.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all answers and timers will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  closeFreshModal();
  render();
}

window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
</script>
</body>
</html>
