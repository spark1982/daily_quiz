<script>var TITLE = "[Grant] English";var QUIZ_KEY = "quiz_grantenglish_25_20260909_v1";var ATT_KEY = "quiz_grantenglish_25_att_20260909_v1";var RAW_QUESTIONS = [{"tag": "Main Idea", "tagcolor": "#185FA5", "stem": "What is the main idea of the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>Beavers are famous for being nature's best builders. These large rodents live near rivers, streams, and ponds across North America. Unlike most animals, beavers do not just live in their environment — they change it to suit their needs.<br><br>A beaver's most impressive skill is building dams. Using its strong front teeth, a beaver can gnaw through a small tree in just a few minutes. It cuts the tree into smaller logs and drags them to a stream. Then it piles up the logs, branches, mud, and rocks until the water can no longer flow freely. Over time, this pile grows into a sturdy wall called a dam.<br><br>Why do beavers build dams? The answer has to do with safety. When a dam blocks a stream, the water backs up and forms a pond. Beavers then build a cozy home in the middle of the pond called a lodge. The lodge has an underwater entrance, which makes it very hard for predators like wolves or coyotes to get inside. The deep pond water also protects the beaver's winter food supply, since beavers store branches underwater to eat when the surface freezes.<br><br>Beavers do not build a dam and stop working. Instead, they repair it constantly. If a hole appears after a heavy rainstorm or a curious animal disturbs it, a beaver will patch the hole that same night. Scientists have even recorded beavers repairing dams a mile long, working long after most other animals have gone to sleep.<br><br>Beaver dams do more than protect beavers. They also change the whole area around them. When a dam floods a forest, it creates a wetland. Wetlands attract fish, frogs, birds, and insects that could not have lived there before. For this reason, many scientists now consider beavers an \"ecosystem engineer,\" a species that reshapes its habitat in ways that help many other living things.<br><br>Today, some cities even use beavers on purpose. By allowing beavers to build dams in certain areas, engineers have found a natural, low-cost way to reduce flooding and create healthier wetlands nearby.", "opts": ["Beavers only build dams during the winter months to store food.", "Beavers build and repair dams to protect themselves and create ponds, which changes their environment and helps other wildlife.", "Beavers are dangerous rodents that destroy forests wherever they live.", "Cities have replaced natural beaver dams with concrete ones to prevent flooding."], "ci": 1, "exp": "The passage explains how and why beavers build and maintain dams, and how this benefits both beavers and other wildlife."}, {"tag": "Supporting Details", "tagcolor": "#185FA5", "stem": "According to the passage, where do beavers typically live?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>Beavers are famous for being nature's best builders. These large rodents live near rivers, streams, and ponds across North America. Unlike most animals, beavers do not just live in their environment — they change it to suit their needs.<br><br>A beaver's most impressive skill is building dams. Using its strong front teeth, a beaver can gnaw through a small tree in just a few minutes. It cuts the tree into smaller logs and drags them to a stream. Then it piles up the logs, branches, mud, and rocks until the water can no longer flow freely. Over time, this pile grows into a sturdy wall called a dam.<br><br>Why do beavers build dams? The answer has to do with safety. When a dam blocks a stream, the water backs up and forms a pond. Beavers then build a cozy home in the middle of the pond called a lodge. The lodge has an underwater entrance, which makes it very hard for predators like wolves or coyotes to get inside. The deep pond water also protec }

}

}

}

function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
