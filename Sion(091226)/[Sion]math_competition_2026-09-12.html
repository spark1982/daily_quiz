.results-btns{display:flex;flex-direction:column;gap:9px;}

<body><div class="quiz-title">[Sion] Math Competition</div><div class="subtitle" id="att-display">Total Attempts: 0</div><div class="instruction">Choose the correct answer for each problem. Two problems are drawn from each of five chapters.</div>

<script>var TITLE = "[Sion] Math Competition";var QUIZ_KEY = "quiz_sionmathcomp_10_2026-09-12_v1";var ATT_KEY = "quiz_sionmathcomp_10_att_2026-09-12_v1";var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';var RAW_QUESTIONS = [{"stem": "If f(<span class=\"frac\"><span class=\"num\">2x&minus;3</span><span class=\"den\">x&minus;2</span></span>) = 5x &minus; 2, compute f<sup>&minus;1</sup>(27). (ARML)", "opts": ["<span class=\"frac\"><span class=\"num\">41</span><span class=\"den\">19</span></span>", "<span class=\"frac\"><span class=\"num\">29</span><span class=\"den\">5</span></span>", "<span class=\"frac\"><span class=\"num\">43</span><span class=\"den\">19</span></span>", "3"], "ci": 2, "exp": "Let f<sup>&minus;1</sup>(27)=t, so f(t)=27. When 5x&minus;2=27, x=<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>29</span><span style=\"border-top:1.4px solid #111;\">5</span></span>. Then t = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>29</span><span style=\"border-top:1.4px solid #111;\">5</span></span>)&minus;3</span><span style=\"border-top:1.4px solid #111;\">(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>29</span><span style=\"border-top:1.4px solid #111;\">5</span></span>)&minus;2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>43</span><span style=\"border-top:1.4px solid #111;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\"><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>19</span><span style=\"border-top:1.4px solid #111;\">5</span></span></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>43</span><span style=\"border-top:1.4px solid #111;\">19</span></span>.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "The solutions of x<sup>3</sup> &minus; 3x<sup>2</sup> + kx + 15 = 0 form an arithmetic sequence. What is the value of k? (MathCounts)", "opts": ["13", "-15", "-13", "-9"], "ci": 2, "exp": "If the roots form an arithmetic sequence a&minus;d, a, a+d, their sum is 3a, which must equal 3 (from the coefficient of x<sup>2</sup>). So a=1 is a root: 1&minus;3+k+15=0, giving k=&minus;13.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "There are n identical cars on a circular track. Together they have just enough gas for one car to complete a lap. Is there a car that can complete a lap by collecting gas from the other cars on its way around? (Engel)", "opts": ["there is not", "there is"], "ci": 1, "exp": "Consider starting with one car that has all the gas. It completes the lap. By a rotational argument (or induction on n), there always exists a starting car such that the running total of gas never runs out. That car can complete the lap by collecting gas from all others.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "The numbers in the sequence 1, 6, 15, 28, 45, &hellip; are called the hexagonal numbers.<div class=\"hexdiagram\"><svg viewBox=\"0 0 480 170\"><circle cx=\"60\" cy=\"85\" r=\"5\" fill=\"#111\"/><text x=\"60\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8321; = 1</text><polygon points=\"200,45 234.6,65 234.6,105 200,125 165.4,105 165.4,65\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><circle cx=\"200\" cy=\"45\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"65\" r=\"4\" fill=\"#111\"/><circle cx=\"234.6\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"200\" cy=\"125\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"105\" r=\"4\" fill=\"#111\"/><circle cx=\"165.4\" cy=\"65\" r=\"4\" fill=\"#111\"/><text x=\"200\" y=\"145\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8322; = 6</text><polygon points=\"380,30 427.6,57.5 427.6,112.5 380,140 332.4,112.5 332.4,57.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><polygon points=\"380,58 403.4,71.5 403.4,98.5 380,112 356.6,98.5 356.6,71.5\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.5\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"30\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"427.6\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"380\" y2=\"140\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"112.5\" stroke=\"#111\" stroke-width=\"1\"/><line x1=\"380\" y1=\"85\" x2=\"332.4\" y2=\"57.5\" stroke=\"#111\" stroke-width=\"1\"/><circle cx=\"380\" cy=\"85\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"30\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"427.6\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"140\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"112.5\" r=\"4\" fill=\"#111\"/><circle cx=\"332.4\" cy=\"57.5\" r=\"4\" fill=\"#111\"/><circle cx=\"380\" cy=\"58\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"403.4\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"380\" cy=\"112\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"98.5\" r=\"3.5\" fill=\"#111\"/><circle cx=\"356.6\" cy=\"71.5\" r=\"3.5\" fill=\"#111\"/><text x=\"380\" y=\"158\" text-anchor=\"middle\" font-size=\"13\" fill=\"#333\">H&#8323; = 15</text></svg></div>What is the 11<sup>th</sup> hexagonal number?", "opts": ["242", "210", "225", "231"], "ci": 3, "exp": "The nth hexagonal number is given by H<sub>n</sub> = n(2n&minus;1). Checking: H<sub>1</sub>=1, H<sub>2</sub>=6, H<sub>3</sub>=15, H<sub>4</sub>=28, H<sub>5</sub>=45, matching the given sequence. So H<sub>11</sub> = 11(2&middot;11&minus;1) = 11&middot;21 = 231.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Evaluate<br><br><span class=\"bigsum\"><span class=\"bs-sup\">&infin;</span><span class=\"bs-sigma\">&Sigma;</span><span class=\"bs-sub\">n=3</span></span> <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n<sup>5</sup> &minus; 5n<sup>3</sup> + 4n</span></span>. (Purple Comet)", "opts": ["<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">72</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">96</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">48</span></span>", "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">120</span></span>"], "ci": 2, "exp": "Factor the denominator: n<sup>5</sup>&minus;5n<sup>3</sup>+4n = n(n<sup>2</sup>&minus;1)(n<sup>2</sup>&minus;4) = (n&minus;2)(n&minus;1)n(n+1)(n+2), the product of 5 consecutive integers. Using the telescoping identity <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">[(n&minus;2)(n&minus;1)n(n+1)(n+2)]</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>&middot;{<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">[(n&minus;2)(n&minus;1)n(n+1)]</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">[(n&minus;1)n(n+1)(n+2)]</span></span>}, the sum from n=3 to &infin; telescopes down to <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">(1&middot;2&middot;3&middot;4)</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Let x and y be real numbers satisfying<br><br>(x<sup>2</sup> + x &minus; 1)(x<sup>2</sup> &minus; x + 1) = 2(y<sup>3</sup> &minus; 2&radic;5 &minus; 1)<br><br>and<br><br>(y<sup>2</sup> + y &minus; 1)(y<sup>2</sup> &minus; y + 1) = 2(x<sup>3</sup> + 2&radic;5 &minus; 1).<br><br>Find 8x<sup>2</sup> + 4y<sup>3</sup>. (Purple Comet)", "opts": ["20", "40", "10", "0"], "ci": 0, "exp": "One real solution is x=(1&minus;&radic;5)/2 and y=(1+&radic;5)/2, both of which satisfy t<sup>2</sup>=t+1. Using x<sup>2</sup>=x+1 gives 8x<sup>2</sup>=8x+8, and using y<sup>3</sup>=2y+1 (which follows from y<sup>2</sup>=y+1) gives 4y<sup>3</sup>=8y+4. Adding: 8x<sup>2</sup>+4y<sup>3</sup>=8(x+y)+12=8(1)+12=20, since x+y=(1&minus;&radic;5)/2+(1+&radic;5)/2=1.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "In the sequence 2001, 2002, 2003, &hellip;, each term after the third is found by subtracting the previous term from the sum of the two terms that precede that term. For example, the fourth term is 2001 + 2002 &minus; 2003 = 2000. What is the 2004th term in this sequence? (AMC 12)", "opts": ["2004", "2001", "0", "1"], "ci": 2, "exp": "The sequence has period 6: 2001, 2002, 2003, 2000, 1999, 2000, 2001, &hellip; Since 2004 = 6 &times; 334, the 2004th term equals the 6th term, which is 0.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "An escalator of n steps descends at constant speed. Ann and Zoe walk down the escalator steadily as it moves. Ann goes twice as many escalator steps per minute as Zoe. Ann reaches the bottom after taking 27 steps while Zoe reaches the bottom after taking 18 steps. What is n? (AHSME)", "opts": ["60", "54", "48", "72"], "ci": 1, "exp": "The answer is 54.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "A certain car drives 40 miles per gallon of gas at a rate of 60 mph. It drives 35 miles per gallon of gas at a rate of 75 mph. So, traveling at the higher speed saves time, but uses more gas. Gas costs $3.50 per gallon. What is the cost for each hour of time saved when traveling at the higher speed? (MathCounts)", "opts": ["$2.50", "$3.00", "$4.00", "$3.75"], "ci": 3, "exp": "The answer is $3.75.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Expanding (1 + 0.2)<sup>1000</sup> by the Binomial Theorem we get<br><br><span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>0</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>0</sup> + <span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>1</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>1</sup> + &hellip; + <span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>1000</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>1000</sup> = A<sub>0</sub> + A<sub>1</sub> + &hellip; + A<sub>1000</sub>,<br><br>where A<sub>k</sub> = <span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>k</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>k</sup><br><br>for k = 0, 1, &hellip;, 1000. For which k is A<sub>k</sub> the largest? (AIME)", "opts": ["165", "200", "166", "167"], "ci": 2, "exp": "The ratio A<sub>k</sub>/A<sub>k&minus;1</sub> = (1001&minus;k)/(5k). This is > 1 iff k < 166.83. So A<sub>k</sub> increases up to k=166 and decreases after. The largest term is at k=166.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;
var hintShown = false;
function toggleHint(){
  hintShown = !hintShown;
  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(hintShown){ hintBox.classList.add('show'); hintBtn.textContent='Hide Hint'; }
  else { hintBox.classList.remove('show'); hintBtn.textContent='Show Hint'; }
}
window.toggleHint=toggleHint;

function speak(){
  try{
    var qi = order[state.cur];
    var q = RAW_QUESTIONS[qi];
    if(!q || !q.tts) return;
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(q.tts);
    u.lang = 'ko-KR';
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak=speak;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }

  var clabel = document.getElementById('context-label');
  if(q.contextLabel){ clabel.style.display='block'; clabel.textContent = q.contextLabel; } else { clabel.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  var ttsBtn = document.getElementById('tts-btn');
  if(ttsBtn){ ttsBtn.style.display = q.tts ? 'inline-block' : 'none'; }

  hintShown = false;
  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(q.hint){
    hintBtn.style.display='inline-block';
    hintBtn.textContent='Show Hint';
    hintBox.innerHTML = q.hint;
    hintBox.classList.remove('show');
  } else {
    hintBtn.style.display='none';
    hintBox.classList.remove('show');
  }

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();

</script>
