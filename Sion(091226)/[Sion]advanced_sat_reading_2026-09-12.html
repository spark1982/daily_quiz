<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_2026-09-12_v1";var ATT_KEY = "quiz_sionadvreading_12_att_2026-09-12_v1";var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';var RAW_QUESTIONS = [{"passage": "For decades, geologists dismissed the notion that a single asteroid impact could account for the abrupt disappearance of dinosaurs from the fossil record, favoring instead gradualist explanations rooted in incremental climate change. Yet the 1980 discovery of an anomalously thick layer of iridium&mdash;an element rare on Earth's surface but common in asteroids&mdash;compelled many skeptics to reconsider. What is striking is not that the evidence eventually persuaded the scientific community, but how doggedly that community had clung to gradualism even as anomalous data accumulated, illustrating the discipline's inherent conservatism when confronted with theories that upend established consensus.", "stem": "In context, what does the author's use of the word \"doggedly\" mainly convey?", "opts": ["careful, methodical review of all available data", "stubborn persistence in the face of contrary evidence", "enthusiastic eagerness to adopt new theories", "indifferent unconcern about the debate's outcome"], "ci": 1, "exp": "\"Doggedly\" describes how the scientific community \"clung to gradualism even as anomalous data accumulated,\" which conveys stubborn persistence despite contrary evidence, not eagerness, careful review, or indifference.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "For decades, geologists dismissed the notion that a single asteroid impact could account for the abrupt disappearance of dinosaurs from the fossil record, favoring instead gradualist explanations rooted in incremental climate change. Yet the 1980 discovery of an anomalously thick layer of iridium&mdash;an element rare on Earth's surface but common in asteroids&mdash;compelled many skeptics to reconsider. What is striking is not that the evidence eventually persuaded the scientific community, but how doggedly that community had clung to gradualism even as anomalous data accumulated, illustrating the discipline's inherent conservatism when confronted with theories that upend established consensus.", "stem": "The author includes the detail about the iridium layer primarily to", "opts": ["to provide the specific evidence that eventually undermined the gradualist explanation", "to argue that gradualist explanations of extinction have now been completely disproven", "to demonstrate that iridium is the most useful element for dating fossil layers", "to prove that asteroid impacts are more common on Earth than scientists previously believed"], "ci": 0, "exp": "The iridium layer is presented as the specific discovery that \"compelled many skeptics to reconsider,\" functioning as the key evidence that challenged the gradualist view, rather than as a claim about asteroid frequency, dating methods, or gradualism being fully disproven.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Urban beekeeping was once championed as an unambiguous boon for local ecosystems, based on the assumption that a proliferation of honeybee colonies would bolster pollination across a city's parks and gardens. Recent longitudinal studies, however, have found that in cities with unusually high densities of managed honeybee hives, populations of native, wild pollinator species&mdash;many of which are more efficient pollinators of native plants&mdash;have measurably declined, suggesting that honeybees may be outcompeting their wild counterparts for limited floral resources.", "stem": "Which finding would most strengthen the passage's implication about competition between honeybees and native pollinators?", "opts": ["Cities with fewer floral resources had higher populations of managed honeybee hives", "Cities that reduced the number of managed honeybee hives saw wild pollinator populations recover", "Cities that reduced the number of managed honeybee hives saw honeybee populations decline further", "Cities with more parks and gardens had higher populations of both honeybees and wild pollinators"], "ci": 1, "exp": "The passage implies honeybees outcompete wild pollinators for floral resources. Evidence that removing honeybee hives allows wild pollinator populations to recover would directly support this competitive relationship.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Urban beekeeping was once championed as an unambiguous boon for local ecosystems, based on the assumption that a proliferation of honeybee colonies would bolster pollination across a city's parks and gardens. Recent longitudinal studies, however, have found that in cities with unusually high densities of managed honeybee hives, populations of native, wild pollinator species&mdash;many of which are more efficient pollinators of native plants&mdash;have measurably declined, suggesting that honeybees may be outcompeting their wild counterparts for limited floral resources.", "stem": "Based on the passage, the author would most likely agree with which statement?", "opts": ["Urban beekeeping should be banned entirely to protect native ecosystems", "Wild pollinator species are generally less efficient than honeybees at pollinating any type of plant", "Increasing the number of managed honeybee hives in a city could unintentionally harm some native plant species", "Honeybees and wild pollinators never compete for the same floral resources"], "ci": 2, "exp": "Since native pollinators are described as \"more efficient pollinators of native plants\" and their decline is linked to rising honeybee density, more hives could reduce pollination of native plants&mdash;an unintended harm. The passage does not call for a total ban, nor does it claim wild pollinators are broadly less efficient or that competition never occurs.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "When a central bank signals that it intends to raise interest rates in the near future, financial markets often react well before the policy actually takes effect, as investors adjust their portfolios in anticipation. This phenomenon, in which expectations about future events shape present behavior, can make monetary policy seem almost prescient, even though the market movements are actually a response to forecasts rather than to any concrete action already taken.", "stem": "As used in the passage, \"prescient\" most nearly means", "opts": ["based on outdated information", "officially approved by the government", "extremely difficult to understand", "able to anticipate what will happen"], "ci": 3, "exp": "The passage explains that markets react \"well before the policy actually takes effect,\" making the policy seem able to anticipate the future, which is the meaning of \"prescient.\"", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "When a central bank signals that it intends to raise interest rates in the near future, financial markets often react well before the policy actually takes effect, as investors adjust their portfolios in anticipation. This phenomenon, in which expectations about future events shape present behavior, can make monetary policy seem almost prescient, even though the market movements are actually a response to forecasts rather than to any concrete action already taken.", "stem": "As used in the passage, \"concrete\" most nearly means", "opts": ["already carried out", "financially valuable", "physically solid or hard", "difficult to measure"], "ci": 0, "exp": "The passage contrasts market reactions to \"forecasts\" with reactions to \"concrete action already taken,\" so \"concrete\" here means an action that has already been carried out, not a building material or a measure of value.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "Historians of technology have long debated why the printing press spread so rapidly through fifteenth-century Europe. One camp emphasizes economic factors, pointing to the relatively low cost of movable type production once initial equipment was acquired. A second camp instead stresses cultural readiness, arguing that rising literacy rates and demand for religious texts created fertile ground for the technology regardless of its price. The passage does not resolve this debate but instead surveys the evidence marshaled by each side, concluding that a satisfying account of the press's diffusion likely requires acknowledging both economic and cultural forces working in tandem.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It presents two competing explanations before suggesting that a complete account may combine elements of both", "It narrates the chronological history of the printing press from invention to widespread adoption", "It presents one explanation and then systematically refutes it using historical evidence", "It argues that economic factors alone are sufficient to explain the press's rapid spread"], "ci": 0, "exp": "The text lays out an economic explanation and a cultural explanation, then concludes that a full account \"likely requires acknowledging both economic and cultural forces working in tandem\"&mdash;presenting two views and synthesizing them rather than refuting one or narrating a chronology.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "Historians of technology have long debated why the printing press spread so rapidly through fifteenth-century Europe. One camp emphasizes economic factors, pointing to the relatively low cost of movable type production once initial equipment was acquired. A second camp instead stresses cultural readiness, arguing that rising literacy rates and demand for religious texts created fertile ground for the technology regardless of its price. The passage does not resolve this debate but instead surveys the evidence marshaled by each side, concluding that a satisfying account of the press's diffusion likely requires acknowledging both economic and cultural forces working in tandem.", "stem": "What is the main purpose of the final sentence?", "opts": ["To dismiss both economic and cultural explanations as inadequate", "To propose that both explanations discussed earlier likely contribute to a complete understanding", "To declare that the cultural readiness camp has won the historical debate", "To introduce a brand new, third explanation not discussed anywhere else in the text"], "ci": 1, "exp": "The final sentence proposes that \"a satisfying account...likely requires acknowledging both economic and cultural forces working in tandem,\" synthesizing the two explanations already introduced rather than adding a new one or declaring either side the winner.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "Marine biologists have documented a troubling rise in ocean temperatures over the past three decades. ______ coral bleaching events, once considered rare, now occur almost annually in some reef systems.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["For example,", "As a result,", "In contrast,", "Nevertheless,"], "ci": 1, "exp": "The rise in ocean temperatures is presented as the cause of increasingly frequent coral bleaching events, so a transition showing a cause-and-effect relationship, \"As a result,\" fits best. \"In contrast\" and \"Nevertheless\" wrongly suggest opposition, and \"For example\" wrongly suggests the bleaching is just one instance of the temperature rise rather than a consequence of it.", "tag": "Expression of Ideas", "tagcolor": "#495057"}, {"passage": "Coral reefs support approximately twenty-five percent of all marine species. They cover less than one percent of the ocean floor.", "stem": "Which choice most effectively combines the two sentences?", "opts": ["Coral reefs support approximately twenty-five percent of all marine species, and afterward they cover less than one percent of the ocean floor.", "Because coral reefs support approximately twenty-five percent of all marine species, they cover less than one percent of the ocean floor.", "Despite covering less than one percent of the ocean floor, coral reefs support approximately twenty-five percent of all marine species.", "Coral reefs cover less than one percent of the ocean floor, so they support approximately twenty-five percent of all marine species."], "ci": 2, "exp": "\"Despite\" correctly signals the surprising contrast between a tiny area of ocean floor and a disproportionately large share of marine species. The other choices use \"so\" or \"because,\" which wrongly imply a cause-and-effect relationship between the two facts, or \"and afterward,\" which wrongly implies a sequence in time.", "tag": "Expression of Ideas", "tagcolor": "#495057"}, {"passage": "<strong>Text A</strong><br>Some economists argue that a universal basic income would reduce poverty by providing an unconditional cash floor beneath every citizen, eliminating gaps left by fragmented, means-tested welfare programs.<br><br><strong>Text B</strong><br>Critics contend that a universal basic income, precisely because it is unconditional, would prove more expensive and less targeted than existing programs, diverting resources away from those who need them most toward those who do not.", "stem": "Based on the two texts, how would the author of Text B most likely respond to the proposal described in Text A?", "opts": ["By praising the proposal for eliminating fragmented, means-tested welfare programs", "By arguing that its unconditional nature makes it wasteful rather than a strength", "By agreeing that an unconditional cash floor would close the gaps left by current programs", "By proposing an entirely different solution to poverty that neither text mentions"], "ci": 1, "exp": "Text A treats the unconditional nature of the proposal as a strength that closes gaps in existing programs, while Text B treats that same unconditional nature as a weakness that makes the program \"more expensive and less targeted.\" Text B's author would most likely respond by arguing the unconditional design is wasteful rather than beneficial.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "<strong>Text A</strong><br>Some economists argue that a universal basic income would reduce poverty by providing an unconditional cash floor beneath every citizen, eliminating gaps left by fragmented, means-tested welfare programs.<br><br><strong>Text B</strong><br>Critics contend that a universal basic income, precisely because it is unconditional, would prove more expensive and less targeted than existing programs, diverting resources away from those who need them most toward those who do not.", "stem": "Which choice best describes a difference in the two authors' central concerns?", "opts": ["Both texts focus exclusively on the financial cost of implementing the proposal", "Both texts focus exclusively on which citizens would be eligible to receive payments", "Text A focuses on closing coverage gaps, while Text B focuses on efficient targeting of resources", "Text A focuses on efficient targeting of resources, while Text B focuses on closing coverage gaps"], "ci": 2, "exp": "Text A is centrally concerned with \"eliminating gaps left by fragmented, means-tested welfare programs,\" while Text B is centrally concerned with resources being \"less targeted\" and diverted from those who need them most. These reflect different central concerns: coverage gaps versus targeting efficiency.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';

    u.lang = 'ko-KR';
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak=speak;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }

  var clabel = document.getElementById('context-label');
  if(q.contextLabel){ clabel.style.display='block'; clabel.textContent = q.contextLabel; } else { clabel.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  var ttsBtn = document.getElementById('tts-btn');
  if(ttsBtn){ ttsBtn.style.display = q.tts ? 'inline-block' : 'none'; }

  hintShown = false;
  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(q.hint){
    hintBtn.style.display='inline-block';
    hintBtn.textContent='Show Hint';
    hintBox.innerHTML = q.hint;
    hintBox.classList.remove('show');
  } else {
    hintBtn.style.display='none';
    hintBox.classList.remove('show');
  }

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();

</script>
</body>
</html>
