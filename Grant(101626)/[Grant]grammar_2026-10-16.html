var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261016";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["has gone", "NO CHANGE", "have goed", "have gone"], "ci": 3, "exp": "After <i>have</i>, use the past participle. The past participle of <i>go</i> is <i>gone</i>: <i>We <b>have gone</b> there every October since second grade.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>A Letter to My Pen Pal</strong><br><i>Dear Kenji,</i><br><b>(1)</b> Last Friday my class took a field trip to Miller&rsquo;s Pumpkin Patch. <b>(2)</b> We <u>have went</u> there every October since second grade. <b>(3)</b> <u>My friend Leo and me</u> found the biggest pumpkin in the whole field. <b>(4)</b> After we weighed it the farmer gave us each a cup of apple cider. <b>(5)</b> Then we <u>rode</u> a wagon back to the bus while everyone sang songs. <b>(6)</b> I wish you could come with us next year!<br><i>Your pen pal, Owen</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["My friend Leo and myself", "My friend Leo and I", "NO CHANGE", "Me and my friend Leo"], "ci": 1, "exp": "Use <i>I</i> for a subject. Test it by dropping the other person: <i>I found</i> (not <i>me found</i>). <i>My friend Leo <b>and I</b> found the biggest pumpkin.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>A Letter to My Pen Pal</strong><br><i>Dear Kenji,</i><br><b>(1)</b> Last Friday my class took a field trip to Miller&rsquo;s Pumpkin Patch. <b>(2)</b> We <u>have went</u> there every October since second grade. <b>(3)</b> <u>My friend Leo and me</u> found the biggest pumpkin in the whole field. <b>(4)</b> After we weighed it the farmer gave us each a cup of apple cider. <b>(5)</b> Then we <u>rode</u> a wagon back to the bus while everyone sang songs. <b>(6)</b> I wish you could come with us next year!<br><i>Your pen pal, Owen</i>"}, {"stem": "Where should a comma be added in sentence 4?", "opts": ["After we weighed it, the farmer gave us each a cup of apple cider.", "After we weighed it the farmer gave us, each a cup of apple cider.", "After, we weighed it the farmer gave us each a cup of apple cider.", "After we weighed it the farmer, gave us each a cup of apple cider."], "ci": 0, "exp": "Put a comma after an introductory part that comes before the main sentence: <i>After we weighed it<b>,</b> the farmer gave us each a cup of apple cider.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>A Letter to My Pen Pal</strong><br><i>Dear Kenji,</i><br><b>(1)</b> Last Friday my class took a field trip to Miller&rsquo;s Pumpkin Patch. <b>(2)</b> We <u>have went</u> there every October since second grade. <b>(3)</b> <u>My friend Leo and me</u> found the biggest pumpkin in the whole field. <b>(4)</b> After we weighed it the farmer gave us each a cup of apple cider. <b>(5)</b> Then we <u>rode</u> a wagon back to the bus while everyone sang songs. <b>(6)</b> I wish you could come with us next year!<br><i>Your pen pal, Owen</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["rides", "are riding", "ride", "NO CHANGE"], "ci": 3, "exp": "The letter tells about last Friday, so the past tense is already correct: <i>Then we <b>rode</b> a wagon back to the bus while everyone sang songs.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>A Letter to My Pen Pal</strong><br><i>Dear Kenji,</i><br><b>(1)</b> Last Friday my class took a field trip to Miller&rsquo;s Pumpkin Patch. <b>(2)</b> We <u>have went</u> there every October since second grade. <b>(3)</b> <u>My friend Leo and me</u> found the biggest pumpkin in the whole field. <b>(4)</b> After we weighed it the farmer gave us each a cup of apple cider. <b>(5)</b> Then we <u>rode</u> a wagon back to the bus while everyone sang songs. <b>(6)</b> I wish you could come with us next year!<br><i>Your pen pal, Owen</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["has survived", "have surviving", "have survive", "NO CHANGE"], "ci": 3, "exp": "<i>Have</i> + the past participle <i>survived</i> is correct, and plural <i>birds</i> takes <i>have</i>: <i>These birds <b>have survived</b> there for thousands of years.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Report: Emperor Penguins</strong><br><b>(1)</b> Emperor penguins live in Antarctica, the coldest place on Earth. <b>(2)</b> These birds <u>have survived</u> there for thousands of years. <b>(3)</b> During winter storms, a group of fathers huddle together to stay warm. <b>(4)</b> Each father keeps an egg balanced on his feet. <b>(5)</b> The mother penguin returns in spring. <b>(6)</b> She has been feeding at sea for two months. <b>(7)</b> Emperor penguins can&rsquo;t fly, but they swim <u>real good</u> and can dive more than 1,500 feet deep."}, {"stem": "Which sentence has an error?", "opts": ["She has been feeding at sea for two months.", "Emperor penguins live in Antarctica, the coldest place on Earth.", "Each father keeps an egg balanced on his feet.", "During winter storms, a group of fathers huddle together to stay warm."], "ci": 3, "exp": "The subject is <i>a group</i> (one group), not <i>fathers</i>, so the verb must be singular: <i>During winter storms, a group of fathers <b>huddles</b> together to stay warm.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: Emperor Penguins</strong><br><b>(1)</b> Emperor penguins live in Antarctica, the coldest place on Earth. <b>(2)</b> These birds <u>have survived</u> there for thousands of years. <b>(3)</b> During winter storms, a group of fathers huddle together to stay warm. <b>(4)</b> Each father keeps an egg balanced on his feet. <b>(5)</b> The mother penguin returns in spring. <b>(6)</b> She has been feeding at sea for two months. <b>(7)</b> Emperor penguins can&rsquo;t fly, but they swim <u>real good</u> and can dive more than 1,500 feet deep."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["The mother penguin who returns in spring, she has been feeding at sea for two months.", "The mother penguin returns in spring, she has been feeding at sea for two months.", "The mother penguin, who has been feeding at sea for two months, returns in spring.", "The mother penguin, whose has been feeding at sea for two months, returns in spring."], "ci": 2, "exp": "Use <i>who</i> to add information about the penguin, with commas around the extra part: <i>The mother penguin<b>, who</b> has been feeding at sea for two months, returns in spring.</i> <i>Whose</i> shows ownership, and joining two sentences with only a comma makes a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: Emperor Penguins</strong><br><b>(1)</b> Emperor penguins live in Antarctica, the coldest place on Earth. <b>(2)</b> These birds <u>have survived</u> there for thousands of years. <b>(3)</b> During winter storms, a group of fathers huddle together to stay warm. <b>(4)</b> Each father keeps an egg balanced on his feet. <b>(5)</b> The mother penguin returns in spring. <b>(6)</b> She has been feeding at sea for two months. <b>(7)</b> Emperor penguins can&rsquo;t fly, but they swim <u>real good</u> and can dive more than 1,500 feet deep."}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["really good", "really well", "NO CHANGE", "real well"], "ci": 1, "exp": "To describe <i>how</i> they swim, use the adverbs <i>really</i> and <i>well</i>: <i>they swim <b>really well</b>.</i> <i>Good</i> and <i>real</i> describe nouns, not actions.", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Report: Emperor Penguins</strong><br><b>(1)</b> Emperor penguins live in Antarctica, the coldest place on Earth. <b>(2)</b> These birds <u>have survived</u> there for thousands of years. <b>(3)</b> During winter storms, a group of fathers huddle together to stay warm. <b>(4)</b> Each father keeps an egg balanced on his feet. <b>(5)</b> The mother penguin returns in spring. <b>(6)</b> She has been feeding at sea for two months. <b>(7)</b> Emperor penguins can&rsquo;t fly, but they swim <u>real good</u> and can dive more than 1,500 feet deep."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["will grab", "grab", "am grabbing", "NO CHANGE"], "ci": 3, "exp": "The diary tells what happened earlier today, and <i>wobbled</i> is past tense, so <i>grabbed</i> matches: <i>At first I wobbled so much that I <b>grabbed</b> the fence every few feet.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>My Skateboard Diary</strong><br><b>(1)</b> Today I tried my cousin&rsquo;s skateboard for the very first time. <b>(2)</b> At first I wobbled so much that I <u>grabbed</u> the fence every few feet. <b>(3)</b> My cousin held my hand, she told me to bend my knees. <b>(4)</b> Bending my knees helped. <b>(5)</b> I still fell twice. <b>(6)</b> By the end of the afternoon, I could roll all the way down the driveway. <b>(7)</b> The board has a crack, but <u>its</u> still my favorite thing in the garage."}, {"stem": "Which sentence has an error?", "opts": ["Today I tried my cousin&rsquo;s skateboard for the very first time.", "Bending my knees helped.", "My cousin held my hand, she told me to bend my knees.", "By the end of the afternoon, I could roll all the way down the driveway."], "ci": 2, "exp": "Two complete sentences joined by only a comma make a run-on (a comma splice). Add <i>and</i>: <i>My cousin held my hand<b>, and</b> she told me to bend my knees.</i> <i>Bending my knees helped</i> is short, but it is a complete sentence.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>My Skateboard Diary</strong><br><b>(1)</b> Today I tried my cousin&rsquo;s skateboard for the very first time. <b>(2)</b> At first I wobbled so much that I <u>grabbed</u> the fence every few feet. <b>(3)</b> My cousin held my hand, she told me to bend my knees. <b>(4)</b> Bending my knees helped. <b>(5)</b> I still fell twice. <b>(6)</b> By the end of the afternoon, I could roll all the way down the driveway. <b>(7)</b> The board has a crack, but <u>its</u> still my favorite thing in the garage."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["Bending my knees helped, but I still fell twice.", "Bending my knees helped, I still fell twice.", "Bending my knees helped, so I still fell twice.", "Because bending my knees helped, I still fell twice."], "ci": 0, "exp": "The second idea is a surprise after the first, so use <i>but</i> with a comma: <i>Bending my knees helped<b>, but</b> I still fell twice.</i> <i>So</i> and <i>because</i> wrongly say that bending his knees caused the falls.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>My Skateboard Diary</strong><br><b>(1)</b> Today I tried my cousin&rsquo;s skateboard for the very first time. <b>(2)</b> At first I wobbled so much that I <u>grabbed</u> the fence every few feet. <b>(3)</b> My cousin held my hand, she told me to bend my knees. <b>(4)</b> Bending my knees helped. <b>(5)</b> I still fell twice. <b>(6)</b> By the end of the afternoon, I could roll all the way down the driveway. <b>(7)</b> The board has a crack, but <u>its</u> still my favorite thing in the garage."}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["it&rsquo;s", "its&rsquo;", "NO CHANGE", "they&rsquo;re"], "ci": 0, "exp": "<i>It&rsquo;s</i> means <i>it is</i>; <i>its</i> shows ownership. Here we mean <i>it is still my favorite</i>: <i>The board has a crack, but <b>it&rsquo;s</b> still my favorite thing in the garage.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>My Skateboard Diary</strong><br><b>(1)</b> Today I tried my cousin&rsquo;s skateboard for the very first time. <b>(2)</b> At first I wobbled so much that I <u>grabbed</u> the fence every few feet. <b>(3)</b> My cousin held my hand, she told me to bend my knees. <b>(4)</b> Bending my knees helped. <b>(5)</b> I still fell twice. <b>(6)</b> By the end of the afternoon, I could roll all the way down the driveway. <b>(7)</b> The board has a crack, but <u>its</u> still my favorite thing in the garage."}, {"stem": "Where should a comma be added in sentence 2?", "opts": ["&ldquo;Sam look out for the string!&rdquo; Maya, yelled.", "&ldquo;Sam look out, for the string!&rdquo; Maya yelled.", "&ldquo;Sam, look out for the string!&rdquo; Maya yelled.", "&ldquo;Sam look, out for the string!&rdquo; Maya yelled."], "ci": 2, "exp": "Use a comma after the name of the person someone is talking to: <i>&ldquo;Sam<b>,</b> look out for the string!&rdquo; Maya yelled.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>The Runaway Kite</strong><br><b>(1)</b> A strong gust yanked the string out of Maya&rsquo;s hands, and her kite sailed toward the oak trees. <b>(2)</b> &ldquo;Sam look out for the string!&rdquo; Maya yelled. <b>(3)</b> Her little brother <u>had ran</u> ahead, and he grabbed the string just before it slipped into the pond. <b>(4)</b> <u>&ldquo;I&rsquo;ve got it&rdquo; Sam called</u> as he reeled the kite back in. <b>(5)</b> The kite had a torn tail but was otherwise fine. <b>(6)</b> Their dad laughed and bought ice cream for <u>Sam and her</u>."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["had run", "had runned", "has ran", "NO CHANGE"], "ci": 0, "exp": "After <i>had</i>, use the past participle. The past participle of <i>run</i> is <i>run</i>: <i>Her little brother <b>had run</b> ahead.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>The Runaway Kite</strong><br><b>(1)</b> A strong gust yanked the string out of Maya&rsquo;s hands, and her kite sailed toward the oa var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
