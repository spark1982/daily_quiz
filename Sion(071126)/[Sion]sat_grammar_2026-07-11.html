<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Grammar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#222;min-height:100vh;}
#app{max-width:700px;margin:0 auto;padding:16px;}
h1{text-align:center;font-size:1.35rem;font-weight:800;color:#185FA5;padding:14px 0 4px;}
.instr{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;min-width:52px;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:6px;}
.timer-bar{background:white;border:1px solid #d0dce8;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;}

#att-bar{text-align:center;font-size:0.8rem;color:#888;margin-bottom:8px;}
#att-bar span{font-weight:700;color:#185FA5;}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:20px 18px;margin-bottom:12px;}
.q-num{font-size:0.78rem;color:#888;margin-bottom:8px;}
.topic-tag{display:inline-block;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#e3f0ff;color:#185FA5;margin-bottom:8px;}
.context-box{background:#f5f9ff;border-left:3px solid #185FA5;padding:11px 14px;border-radius:4px;font-size:0.95rem;line-height:1.75;color:#222;margin-bottom:12px;}
.q-text{font-size:0.95rem;line-height:1.5;margin-bottom:14px;color:#333;font-weight:600;}
.opts{display:grid;gap:8px;}
.opt{padding:11px 14px;border:2px solid #d7dde6;border-radius:8px;cursor:pointer;font-size:0.92rem;background:white;text-align:left;line-height:1.4;transition:border-color 0.15s,background 0.15s;}
.opt:hover:not(:disabled){border-color:#185FA5;background:#f0f6ff;}
.opt.correct{border-color:#1D9E75;background:#e6f7f1;color:#0d6b50;font-weight:700;}
.opt.wrong{border-color:#E24B4A;background:#fdf0f0;color:#b03030;}
.opt:disabled{cursor:default;}
.exp{margin-top:12px;padding:11px;background:#f5f9ff;border-left:3px solid #185FA5;border-radius:4px;font-size:0.86rem;line-height:1.55;color:#333;display:none;}
.nav-btns{display:flex;gap:8px;margin-top:8px;}
.nav-btns button{flex:1;padding:10px;border:1.5px solid #d7dde6;border-radius:8px;background:white;cursor:pointer;font-size:0.9rem;color:#444;}
.nav-btns button:hover:not(:disabled){border-color:#185FA5;color:#185FA5;}
.nav-btns button:disabled{opacity:0.4;cursor:not-allowed;}
.results{background:white;border-radius:12px;padding:28px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.score-big{font-size:3rem;font-weight:900;color:#185FA5;}
.score-lbl{color:#888;font-size:0.9rem;margin-bottom:16px;}
.stats-row{display:flex;justify-content:center;gap:28px;margin-bottom:22px;}
.stat-n{font-size:1.5rem;font-weight:800;}
.stat-lbl{font-size:0.75rem;color:#888;}
.res-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;}
.btn-copy{background:#7b61ff;color:white;}
.btn-retry{background:#1D9E75;color:white;}
.btn-fresh{background:#e8ecf0;color:#444;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-ov.show{display:flex;}
.modal-box{background:white;border-radius:14px;padding:24px;max-width:360px;width:90%;text-align:center;}
.modal-box h3{color:#185FA5;margin-bottom:10px;font-size:1.05rem;}
.modal-box p{font-size:0.88rem;color:#555;margin-bottom:18px;line-height:1.5;}
.modal-acts{display:flex;gap:10px;}
.modal-acts button{flex:1;padding:10px;border:none;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;}
.modal-acts .cancel{background:#e8ecf0;color:#444;}
.modal-acts .confirm{background:#E24B4A;color:white;}
</style>
</head>
<body>
<div id="app">
  <h1>[Sion] SAT Grammar</h1>
  <div class="instr">Read each passage excerpt and choose the best answer.</div>
  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>
  <div class="timer-bar" id="timerBar">
    <div class="timer-setup" id="timerSetup">
      <label for="timerMin">Set Time Limit:</label>
      <input type="number" id="timerMin" min="1" max="180" value="25"> min
      <button class="timer-start-btn" onclick="startTimer()">Start</button>
    </div>
    <div class="timer-running" id="timerRunning" style="display:none;">
      <span class="timer-label">Time Left</span>
      <span class="timer-display" id="timerDisplay">25:00</span>
    </div>
  </div>
  <div id="att-bar">Total Attempts: <span id="attCount">0</span></div>
  <div id="qcard"></div>
  <div id="freshModal" class="modal-ov">
    <div class="modal-box">
      <h3 id="freshTitle">Start Fresh?</h3>
      <p id="freshText">All progress will be cleared. This cannot be undone.</p>
      <div class="modal-acts">
        <button class="cancel" onclick="closeFreshModal()">Cancel</button>
        <button class="confirm" onclick="confirmFresh()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>
<script>
var DATE = '20260710';
var QUIZ_KEY = 'quiz_siongrammar_20_' + DATE + '_v1';
var ATT_KEY  = 'quiz_siongrammar_att_' + DATE + '_v1';
var ORDER_KEY = QUIZ_KEY + '_order_v1';

var RAW_QUESTIONS = [
  {topic:'Transitions',
   ctx:'A marine biologist spent three seasons tagging reef sharks near the atoll, recording no significant change in their migration routes. _____ the water temperature around the atoll had risen by nearly two degrees over the same period, a shift that typically forces reef species to relocate.',
   q:'Which choice completes the text with the most logical and precise transition?',
   opts:['Therefore,','Yet,','For example,','Similarly,'], ci:1,
   exp:'"Yet" signals the surprising contrast between the stable migration routes and the two-degree rise in water temperature that would normally cause relocation. "Therefore" would wrongly suggest the temperature rise resulted from the unchanged routes. "For example" would only work if the temperature detail illustrated a claim just made about migration. "Similarly" would imply the two facts support each other rather than conflict.'},
  {topic:'Subject-Verb Agreement',
   ctx:'Either the lead violinist or the two substitute musicians who joined the orchestra last month [_____] required to attend every rehearsal before the spring concert.',
   q:'Which choice most accurately completes the sentence according to the conventions of Standard English?',
   opts:['is','are','was','has been'], ci:1,
   exp:'In an "either...or" construction, the verb agrees with the nearer subject, here the plural "the two substitute musicians," so "are" is correct. "Is," "was," and "has been" are all singular forms that fail to match that closer plural noun.'},
  {topic:'Parallel Structure',
   ctx:'The apprenticeship required candidates to measure each beam precisely, to record every temperature reading, and [_____] a full inspection log before the foreman\'s morning review.',
   q:'Which choice completes the text so that it conforms to the conventions of Standard English?',
   opts:['submitting','they had to submit','to submit','with a submission of'], ci:2,
   exp:'"To submit" matches the infinitive form set up by "to measure" and "to record," keeping the three-part list parallel. "Submitting" shifts to a gerund, "they had to submit" adds an unneeded clause with a repeated subject, and "with a submission of" shifts into a prepositional phrase, each breaking the established pattern.'},
  {topic:'Punctuation',
   ctx:'The pharmaceutical trial produced a result the researchers had not anticipated[_____] a fourteen percent drop in reported side effects among participants who also received the placebo briefing.',
   q:'Which choice completes the text with correct punctuation?',
   opts:[',',';',' :',' -'], ci:2,
   exp:'A colon correctly introduces the phrase "a fourteen percent drop...," which renames and explains the unanticipated result named just before it. A comma alone is too weak to connect a clause to this kind of weighty appositive. A semicolon requires an independent clause on both sides, and the phrase after it is not one. A dash would clash with the formal register the rest of the passage maintains.'},
  {topic:'Pronoun Reference',
   ctx:'When the glacier researcher handed the intern the core sample next to the field technician, [_____] warned that the ice would begin melting within the hour.',
   q:'Which choice most clearly identifies who issued the warning?',
   opts:['she','they','the field technician','one'], ci:2,
   exp:'"She" is ambiguous because the researcher, the intern, and the technician could all plausibly be female in this context, so the pronoun does not clarify who spoke. "They" is grammatically plural and does not resolve which single person is meant. "One" is a generic reference that names no one in particular. Only "the field technician" removes the ambiguity and specifies exactly who gave the warning.'},
  {topic:'Modifier Placement',
   ctx:'Stained by decades of ink spills and cigarette smoke, [_____].',
   q:'Which choice completes the sentence without creating a dangling modifier?',
   opts:['the editor discarded the old printing press within a week','the newsroom decided to discard the old printing press','the old printing press was finally hauled away by the editor','a decision to discard the old printing press was made quickly'], ci:2,
   exp:'Only "the old printing press" can be the subject the opening phrase describes, since it is the press that is stained with ink and smoke. In the other choices, the grammatical subject named right after the comma (the editor, the newsroom, a decision) is not the thing described by the modifier, so the modifier is left dangling.'},
  {topic:'Apostrophes',
   ctx:'The two rival airlines had spent months quietly undercutting [_____] fares, each hoping to win over budget travelers before the holiday season began.',
   q:'Which choice completes the text so that it conforms to the conventions of Standard English?',
   opts:['each other\'s','each others','each\'s other','each others\''], ci:0,
   exp:'"Each other\'s" is the correct possessive form of the reciprocal phrase "each other," showing that the fares belong mutually to both airlines. "Each others" omits the necessary apostrophe entirely. "Each\'s other" reverses the word order incorrectly. "Each others\'" places the apostrophe after a plural form that does not exist in standard usage.'},
  {topic:'Concision',
   ctx:'The forensic accountant explained that, <span style="text-decoration:underline">in light of the fact that</span> the ledger had not been reconciled in over a year, the audit took far longer than expected.',
   q:'Which choice most effectively revises the underlined portion to eliminate wordiness while keeping the intended meaning?',
   opts:['Because','due to the reason that','owing to the circumstance that','in view of the fact that'], ci:0,
   exp:'"Because" conveys the identical causal relationship as the underlined phrase in a single word, eliminating the wordiness without losing meaning. "Due to the reason that," "owing to the circumstance that," and "in view of the fact that" are all inflated substitutes for "because" that add length without adding meaning.'},
  {topic:'Verb Tense',
   ctx:'By the time the lighthouse keeper finishes logging every ship that passes tonight, the storm [_____] the coastline for nearly six hours, yet the relief crew will not arrive until dawn.',
   q:'Which choice most accurately completes the sentence?',
   opts:['battered','has battered','will have battered','batters'], ci:2,
   exp:'The future perfect "will have battered" correctly marks an action that will be completed before a specified future point, "by the time the keeper finishes logging tonight." "Battered" is simple past and does not fit a future deadline. "Has battered" is present perfect, suited to actions extending into the present rather than projected forward. "Batters" is simple present and cannot express an action completed relative to a future milestone.'},
  {topic:'Comma Splices',
   ctx:'The marathon organizers had mapped the course twice that spring, [_____] a sudden road closure still forced hundreds of runners to reroute on race morning.',
   q:'Which choice completes the text so that it conforms to the conventions of Standard English?',
   opts:['yet','however,','nevertheless,','it was that'], ci:0,
   exp:'"Yet" is a coordinating conjunction that can properly join two independent clauses after a comma, correctly linking the mapping to the unexpected closure. "However," and "nevertheless," are conjunctive adverbs that cannot join two independent clauses with only a comma; using either here would still produce a comma splice. "It was that" is not a grammatical connector at all and would leave the sentence garbled.'},
  {topic:'Dangling Modifiers',
   ctx:'Exhausted after translating testimony for nine straight hours, [_____].',
   q:'Which choice completes the sentence without creating a dangling modifier?',
   opts:['a short recess was called by the court reporter','the court reporter asked for a short recess','the courtroom grew quiet as a recess was called','it was decided that a recess would be called'], ci:1,
   exp:'Only "the court reporter" can be the subject the opening phrase logically modifies, since it is the reporter who became exhausted from translating testimony. In the other options, the grammatical subject introduced after the comma (a recess, the courtroom, it) is not capable of becoming exhausted, so the modifier has nothing sensible to attach to.'},
  {topic:'Coordination vs Subordination',
   ctx:'The vineyard\'s irrigation system had passed its spring inspection only days earlier[_____] it began leaking steadily along the eastern rows almost as soon as the new pump was installed.',
   q:'Which choice most effectively combines the two ideas while making the relationship between them clear?',
   opts:[', and','; although','yet','despite the fact that'], ci:2,
   exp:'"Yet" is a coordinating conjunction that directly signals contrast between the recent passing inspection and the sudden leak, and it correctly joins two independent clauses without requiring extra punctuation before it in this construction. ", and" suggests simple addition rather than the contrast actually intended. "; although" pairs a semicolon with a subordinating conjunction, which cannot introduce an independent clause after a semicolon in this way. "Despite the fact that" would need to attach to a noun phrase or be restructured, and simply inserting it here does not form a grammatical sentence.'},
  {topic:'Agreement with Collective Nouns',
   ctx:'The debate team, still split after weeks of disagreement over which resolution to argue, [_____] scheduled to submit its final topic to the tournament committee by Friday.',
   q:'Which choice most accurately completes the sentence?',
   opts:['are','is','have been','were'], ci:1,
   exp:'"Team" is being treated as a single unit acting together to submit one topic, so it takes the singular verb "is." "Are," "have been," and "were" all treat the team as a collection of separately acting individuals, which does not match the sentence\'s emphasis on the team submitting as a single body.'},
  {topic:'Correlative Conjunctions',
   ctx:'The renovation plan called for the library\'s reading room to be [_____] restored to its original wood paneling nor converted into a modern study space.',
   q:'Which choice completes the text so that it conforms to the conventions of Standard English?',
   opts:['neither','not only','either','not'], ci:0,
   exp:'"Neither" correctly pairs with the "nor" that appears later in the sentence, forming the standard correlative construction "neither...nor." "Not only" would require a following "but also," not "nor." "Either" pairs with "or," not "nor." "Not" alone cannot form a grammatical correlative pair with "nor" in this construction.'},
  {topic:'Nonrestrictive vs Restrictive Clauses',
   ctx:'The sculptures [_____] survived the warehouse flood were sent immediately to a specialist for structural assessment before any further handling.',
   q:'Which choice completes the text so that it conforms to the conventions of Standard English?',
   opts:[', which,','that','which',', that,'], ci:1,
   exp:'"That" introduces a restrictive clause here, since the sentence needs to specify which particular sculptures are meant, namely only the ones that survived, not all the sculptures. "Which," whether or not set off by commas, is reserved for nonrestrictive clauses that add extra, non-essential information, and using it here would incorrectly imply all the sculptures survived. "That" set off by commas is never standard, since restrictive clauses introduced by "that" do not take commas.'},
  {topic:'Logical Comparison',
   ctx:'The new hive design allows beekeepers to inspect the frames far more efficiently [_____], cutting inspection time nearly in half during the summer months.',
   q:'Which choice completes the text so that it conforms to the conventions of Standard English?',
   opts:['than the older design','than the older design did','than that of the older design','than previously'], ci:1,
   exp:'"Than the older design did" clearly compares the new hive\'s inspection efficiency to the action of the older design\'s inspection process, keeping the comparison logically complete and parallel. "Than the older design" alone could be misread as comparing the hive to the design as an object rather than comparing inspection efficiency. "Than that of the older design" awkwardly implies a comparison to "that," an ambiguous stand-in with no clear antecedent action. "Than previously" is vague about what specifically is being compared to what.'},
  {topic:'Diction/Word Choice in Context',
   ctx:'The translator\'s footnotes were careful to [_____] between the author\'s literal word choices and the broader cultural meaning those words carried in the original language.',
   q:'Which choice completes the text with the most precise word?',
   opts:['differentiate','denote','delineate','distinguish'], ci:3,
   exp:'"Distinguish" is the precise idiomatic choice when marking a difference "between" two things, matching the preposition already in the sentence. "Differentiate" typically pairs with "from" rather than "between" in this construction and sounds imprecise here. "Denote" means to signify or represent, which does not fit the act of separating two categories. "Delineate" means to describe or outline in detail, not to mark a contrast between two things.'},
  {topic:'Sentence Boundaries',
   ctx:'The chess coach arrived at the tournament hall nearly two hours before the first match was scheduled to begin. [_____], reviewing the opening lines her strongest players were most likely to face.',
   q:'Which choice completes the text so that it conforms to the conventions of Standard English?',
   opts:['Having spent that time','She spent that time','Spending that time','That time having been spent'], ci:1,
   exp:'"She spent that time" supplies the independent clause this sentence needs, since "reviewing the opening lines..." functions as a modifying phrase attached to it rather than as a complete sentence on its own. "Having spent that time," "Spending that time," and "That time having been spent" are all participial or non-finite constructions that leave this sentence a fragment with no main verb carrying a subject.'},
  {topic:'Emphasis/Rhetorical Effect',
   ctx:'The student wants to emphasize that the bakery\'s new hygiene protocol was adopted only after a health inspector\'s surprise citation, not as part of routine planning.',
   q:'Which choice most effectively emphasizes that the protocol resulted from a specific incident rather than routine planning?',
   opts:['The bakery updated its hygiene protocol as part of its seasonal review process.','The bakery updated its hygiene protocol, a change that occurred sometime during the fall.','It was only after a surprise citation from a health inspector that the bakery updated its hygiene protocol.','The bakery, like most local shops, periodically updates its hygiene protocol.'], ci:2,
   exp:'"It was only after a surprise citation from a health inspector that the bakery updated its hygiene protocol" directly foregrounds the citation as the specific trigger, matching the intended emphasis on a single incident rather than routine planning. The version citing "its seasonal review process" frames the change as routine, the version naming only a season gives a timeframe without any causal trigger, and the version comparing the bakery to "most local shops" frames the update as a generic, recurring practice rather than a response to one incident.'},
  {topic:'Redundancy',
   ctx:'The astronomer\'s final report included [_____] that had never appeared in any of the earlier data sets submitted to the observatory.',
   q:'Which choice completes the text most effectively, without introducing redundancy?',
   opts:['new findings','findings that were new','completely new findings','findings'], ci:3,
   exp:'"Findings" alone conveys the necessary meaning, since a finding is by definition something newly discovered; no further modifier is needed. "New findings" and "completely new findings" both redundantly restate that a finding is new, with the latter compounding the redundancy further. "Findings that were new" repeats the same redundant idea in a wordier clause structure.'}
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function identityOrder(){var o=[];for(var i=0;i<RAW_QUESTIONS.length;i++)o.push(i);return o;}
function isValidOrder(arr){if(!Array.isArray(arr)||arr.length!==RAW_QUESTIONS.length)return false;var s=arr.slice().sort(function(a,b){return a-b;});for(var i=0;i<s.length;i++)if(s[i]!==i)return false;return true;}
function loadOrder(){try{var r=localStorage.getItem(ORDER_KEY);if(!r)return null;var a=JSON.parse(r);if(!isValidOrder(a))throw new Error('bad');return a;}catch(e){localStorage.removeItem(ORDER_KEY);return null;}}
function saveOrder(o){try{localStorage.setItem(ORDER_KEY,JSON.stringify(o));}catch(e){}}
function buildQuestions(raw,order){var out=[];for(var i=0;i<order.length;i++)out.push(raw[order[i]]);return out;}
var currentOrder=loadOrder()||identityOrder();
var QUESTIONS=buildQuestions(RAW_QUESTIONS,currentOrder);

function defaultState(){return{cur:0,answers:{},showResults:false,timerStartedAt:null,timerTotalSec:null};}
function saveState(s){try{localStorage.setItem(QUIZ_KEY,JSON.stringify(s));}catch(e){}}
function loadState(){try{var r=localStorage.getItem(QUIZ_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
var state=loadState()||defaultState();

function loadAtt(){try{return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0;}catch(e){return 0;}}
function saveAtt(n){try{localStorage.setItem(ATT_KEY,String(n));}catch(e){}}
function renderAtt(){var el=document.getElementById('attCount');if(el)el.textContent=loadAtt();}

var timerInterval=null;
function formatTime(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function renderTimer(){
  var setup=document.getElementById('timerSetup'),run=document.getElementById('timerRunning'),disp=document.getElementById('timerDisplay');
  if(!setup)return;
  if(!state.timerStartedAt){setup.style.display='flex';run.style.display='none';return;}
  setup.style.display='none';run.style.display='flex';
  var elapsed=(Date.now()-state.timerStartedAt)/1000,rem=state.timerTotalSec-elapsed;
  disp.classList.remove('warn','danger');
  if(rem<=0){disp.textContent="Time's Up";disp.classList.add('danger');stopTimerInterval();return;}
  disp.textContent=formatTime(rem);
  if(rem<=state.timerTotalSec*0.1)disp.classList.add('danger');
  else if(rem<=state.timerTotalSec*0.25)disp.classList.add('warn');
}
function startTimer(){var inp=document.getElementById('timerMin');var m=parseFloat(inp.value)||25;state.timerTotalSec=Math.round(m*60);state.timerStartedAt=Date.now();saveState(state);renderTimer();startTimerInterval();}
function startTimerInterval(){stopTimerInterval();timerInterval=setInterval(renderTimer,1000);}
function stopTimerInterval(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+QUESTIONS.length;
  document.getElementById('prog-fill').style.width=(ans/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel=document.getElementById('dot-panel');if(panel.style.display==='none')return;
  var h='';
  for(var i=0;i<QUESTIONS.length;i++){
    var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===QUESTIONS[i].ci?'#185FA5':'#E24B4A');
    h+='<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
  }
  panel.innerHTML=h;
}
function toggleJump(){
  var p=document.getElementById('dot-panel'),b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}
  else{p.style.display='none';b.textContent='Jump ▾';}
}
function goToQ(i){state.cur=i;state.showResults=false;saveState(state);document.getElementById('dot-panel').style.display='none';document.getElementById('jump-btn').textContent='Jump ▾';render();}
function pick(optIdx){if(state.answers[state.cur]!==undefined)return;state.answers[state.cur]=optIdx;saveState(state);render();}
function goPrev(){if(state.cur>0){state.cur--;saveState(state);render();}}
function goNext(){
  if(state.cur<QUESTIONS.length-1){state.cur++;saveState(state);render();}
  else{if(!state.showResults){var a=loadAtt()+1;saveAtt(a);renderAtt();}state.showResults=true;saveState(state);render();}
}
function render(){
  var c=document.getElementById('qcard');
  if(state.showResults){renderResults();return;}
  var q=QUESTIONS[state.cur],ans=state.answers[state.cur],done=ans!==undefined;
  var isLast=state.cur===QUESTIONS.length-1;
  var optsH='';
  for(var i=0;i<q.opts.length;i++){
    var cls='opt';
    if(done){if(i===q.ci)cls+=' correct';else if(i===ans)cls+=' wrong';}
    optsH+='<button class="'+cls+'"'+(done?' disabled':'')+' onclick="pick('+i+')">'+q.opts[i]+'</button>';
  }
  var expH=done&&ans!==q.ci?'<div class="exp" style="display:block">'+q.exp+'</div>':'';
  var nextLbl=isLast?'See Results &#8594;':'Next &#8594;';
  c.innerHTML='<div class="card"><div class="q-num">Q'+(state.cur+1)+' of '+QUESTIONS.length+'</div><span class="topic-tag">'+q.topic+'</span><div class="context-box">'+q.ctx+'</div><div class="q-text">'+q.q+'</div><div class="opts">'+optsH+'</div>'+expH+'</div><div class="nav-btns"><button '+(state.cur===0?'disabled':'')+' onclick="goPrev()">&#8592; Prev</button><button onclick="goNext()">'+nextLbl+'</button></div>';
  updateNav();
}
function renderResults(){
  var correct=0,wrong=0,skip=0;
  for(var i=0;i<QUESTIONS.length;i++){if(state.answers[i]===undefined)skip++;else if(state.answers[i]===QUESTIONS[i].ci)correct++;else wrong++;}
  var pct=Math.round(correct/QUESTIONS.length*100);
  document.getElementById('qcard').innerHTML='<div class="results"><div class="score-big">'+correct+'/'+QUESTIONS.length+'</div><div class="score-lbl">'+pct+'% correct</div><div class="stats-row"><div><div class="stat-n" style="color:#1D9E75">'+correct+'</div><div class="stat-lbl">Correct</div></div><div><div class="stat-n" style="color:#E24B4A">'+wrong+'</div><div class="stat-lbl">Wrong</div></div><div><div class="stat-n" style="color:#888">'+skip+'</div><div class="stat-lbl">Skipped</div></div></div><button class="res-btn btn-copy" onclick="copyRes()">Copy All Results</button><button class="res-btn btn-retry" onclick="retryWrong()">Retry Wrong Ones</button><button class="res-btn btn-fresh" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button><button class="res-btn btn-fresh" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button></div>';
  updateNav();
}
function copyRes(){
  var correct=0,lines=['[Sion] SAT Grammar Results'];
  for(var i=0;i<QUESTIONS.length;i++){var q=QUESTIONS[i],a=state.answers[i],ok=a===q.ci;if(ok)correct++;lines.push('Q'+(i+1)+' ['+q.topic+'] '+(a===undefined?'SKIP':ok?'OK':'WRONG')+' ('+q.opts[q.ci]+')');}
  lines.push('Score: '+correct+'/'+QUESTIONS.length);
  try{navigator.clipboard.writeText(lines.join('\n'));}catch(e){alert(lines.join('\n'));}
}
function retryWrong(){
  var wrong=[];
  for(var i=0;i<QUESTIONS.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==QUESTIONS[i].ci){wrong.push(i);delete state.answers[i];}}
  if(wrong.length>0){state.cur=wrong[0];state.showResults=false;saveState(state);render();}
}
var pendingFreshMode='original';
function openFreshModalOriginal(){pendingFreshMode='original';document.getElementById('freshTitle').textContent='Start Fresh (Original Order)?';document.getElementById('freshText').textContent='Questions return to their original order and all progress is cleared.';document.getElementById('freshModal').classList.add('show');}
function openFreshModalRandom(){pendingFreshMode='random';document.getElementById('freshTitle').textContent='Start Fresh (Random Order)?';document.getElementById('freshText').textContent='Questions will be reshuffled and all progress is cleared.';document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function confirmFresh(){currentOrder=(pendingFreshMode==='random')?shuffle(identityOrder()):identityOrder();saveOrder(currentOrder);QUESTIONS=buildQuestions(RAW_QUESTIONS,currentOrder);state=defaultState();saveState(state);stopTimerInterval();closeFreshModal();render();renderTimer();}
window.toggleJump=toggleJump;window.goToQ=goToQ;window.pick=pick;window.goPrev=goPrev;window.goNext=goNext;
window.startTimer=startTimer;window.copyRes=copyRes;window.retryWrong=retryWrong;
window.openFreshModalOriginal=openFreshModalOriginal;window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;window.confirmFresh=confirmFresh;
render();renderTimer();if(state.timerStartedAt)startTimerInterval();renderAtt();
</script>
</body>
