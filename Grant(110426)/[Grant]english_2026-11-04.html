rk and Brooklyn.", "Ferries were the safest way to cross the East River in the 1800s."], "ci": 2, "exp": "The whole passage follows the Roebling family through John's death and Washington's paralysis until the bridge opened in 1883. The rooster detail is true but too small to be the main idea, and the passage shows caissons were harmful, not safe.", "passage": "<strong>The Bridge That Linked Two Cities</strong><br>In 1869, New York and Brooklyn were separate cities divided by the East River, and thousands of commuters depended on crowded ferries that stalled whenever ice clogged the water. Engineer John A. Roebling designed a suspension bridge of unprecedented magnitude, with a main span nearly 1,600 feet long. Before construction began, however, a ferry crushed Roebling's foot against a dock, and he died of tetanus a few weeks later. His son, Washington Roebling, assumed command of the project.<br><br>To anchor the towers, workers labored deep beneath the river inside caissons that were pumped full of compressed air to hold back the water. Many men who climbed back to the surface too rapidly developed crippling pains, and in 1872 Washington himself became partially paralyzed. Confined to his apartment, he followed the progress through a telescope while his wife, Emily Warren Roebling, carried his instructions to the site. Emily studied engineering so thoroughly that officials began consulting her directly.<br><br>When the bridge opened on May 24, 1883, Emily rode across first, holding a rooster as a symbol of victory. Within a single day, more than 150,000 people had strolled along its promenade.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Emily Roebling carried her husband's instructions to the site.", "Ferries could stall when ice filled the river.", "Washington Roebling was injured when a ferry crushed his foot.", "The bridge's main span was nearly 1,600 feet long."], "ci": 2, "exp": "It was John A. Roebling, the father, whose foot was crushed by a ferry. Washington was hurt later while working in the caissons. The other three statements match the passage.", "passage": "<strong>The Bridge That Linked Two Cities</strong><br>In 1869, New York and Brooklyn were separate cities divided by the East River, and thousands of commuters depended on crowded ferries that stalled whenever ice clogged the water. Engineer John A. Roebling designed a suspension bridge of unprecedented magnitude, with a main span nearly 1,600 feet long. Before construction began, however, a ferry crushed Roebling's foot against a dock, and he died of tetanus a few weeks later. His son, Washington Roebling, assumed command of the project.<br><br>To anchor the towers, workers labored deep beneath the river inside caissons that were pumped full of compressed air to hold back the water. Many men who climbed back to the surface too rapidly developed crippling pains, and in 1872 Washington himself became partially paralyzed. Confined to his apartment, he followed the progress through a telescope while his wife, Emily Warren Roebling, carried his instructions to the site. Emily studied engineering so thoroughly that officials began consulting her directly.<br><br>When the bridge opened on May 24, 1883, Emily rode across first, holding a rooster as a symbol of victory. Within a single day, more than 150,000 people had strolled along its promenade.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"stem": "What can the reader infer about how monarchs find their way to Mexico?", "opts": ["They memorize the path during their trip north in the spring.", "They must rely on instinct, since none of the fall travelers has made the trip before.", "They follow the milkweed gardens that schools have planted.", "Older monarchs lead the younger ones along the route."], "ci": 1, "exp": "The fall butterflies are “the great-grandchildren” of the ones that left Mexico, and none “has ever made it before,” so no one can show them the way. They must be born knowing how to use the sun and their inner clock. The “older monarchs lead” choice cannot be right, because the older generations have already died.", "passage": "<strong>The Monarch's Long Journey</strong><br>Each autumn, millions of monarch butterflies leave Canada and the northern United States and fly as far as 3,000 miles to the mountains of central Mexico. The trip is remarkable because no monarch flying south has ever made it before; the butterflies that migrate in fall are the great-grandchildren of the ones that left Mexico the previous spring. Scientists believe monarchs navigate by tracking the position of the sun with the help of an internal clock in their antennae, and they may also sense Earth's magnetic field.<br><br>Along the way, monarchs depend on flowering plants for nectar, which fuels their flight. In Mexico they cluster by the thousands on oyamel fir trees, where the cool, moist air slows their bodies so that they use little energy all winter. In spring they mate and head north, laying eggs only on milkweed, the one plant their caterpillars can eat.<br><br>Over recent decades, however, milkweed has become far less abundant as farm fields and roadsides have been sprayed and cleared. Because fewer caterpillars survive, the number of monarchs reaching Mexico has dropped sharply. Many families and schools now plant milkweed gardens to help restore the route.", "tag": "Inference", "tagcolor": "#185FA5"}, {"stem": "According to the passage, where do monarchs lay their eggs?", "opts": ["on any flowering plant that has nectar", "on oyamel fir trees in Mexico", "only on milkweed plants", "on grasses along roadsides and farm fields"], "ci": 2, "exp": "The passage says monarchs head north “laying eggs only on milkweed, the one plant their caterpillars can eat.” The fir trees are where they spend the winter, and flowers give them nectar for flying.", "passage": "<strong>The Monarch's Long Journey</strong><br>Each autumn, millions of monarch butterflies leave Canada and the northern United States and fly as far as 3,000 miles to the mountains of central Mexico. The trip is remarkable because no monarch flying south has ever made it before; the butterflies that migrate in fall are the great-grandchildren of the ones that left Mexico the previous spring. Scientists believe monarchs navigate by tracking the position of the sun with the help of an internal clock in their antennae, and they may also sense Earth's magnetic field.<br><br>Along the way, monarchs depend on flowering plants for nectar, which fuels their flight. In Mexico they cluster by the thousands on oyamel fir trees, where the cool, moist air slows their bodies so that they use little energy all winter. In spring they mate and head north, laying eggs only on milkweed, the one plant their caterpillars can eat.<br><br>Over recent decades, however, milkweed has become far less abundant as farm fields and roadsides have been sprayed and cleared. Because fewer caterpillars survive, the number of monarchs reaching Mexico has dropped sharply. Many families and schools now plant milkweed gardens to help restore the route.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"stem": "According to the passage, why has the number of monarchs reaching Mexico dropped?", "opts": ["Milkweed has been sprayed and cleared, so fewer caterpillars survive.", "Monarchs have lost the internal clock in their antennae.", "Monarchs now stop to rest more often during the trip.", "The air in the Mexican mountains has become too cool and moist."], "ci": 0, "exp": "The passage explains that milkweed became “far less abundant” and “Because fewer caterpillars survive, the number of monarchs reaching Mexico has dropped sharply.” The cool, moist air actually helps monarchs save energy.", "passage": "<strong>The Monarch's Long Journey</strong><br>Each autumn, millions of monarch butterflies leave Canada and the northern United States and fly as far as 3,000 miles to the mountains of central Mexico. The trip is remarkable because no monarch flying south has ever made it before; the butterflies that migrate in fall are the great-grandchildren of the ones that left Mexico the previous spring. Scientists believe monarchs navigate by tracking the position of the sun with the help of an internal clock in their antennae, and they may also sense Earth's magnetic field.<br><br>Along the way, monarchs depend on flowering plants for nectar, which fuels their flight. In Mexico they cluster by the thousands on oyamel fir trees, where the cool, moist air slows their bodies so that they use little energy all winter. In spring they mate and head north, laying eggs only on milkweed, the one plant their caterpillars can eat.<br><br>Over recent decades, however, milkweed has become far less abundant as farm fields and roadsides have been sprayed and cleared. Because fewer caterpillars survive, the number of monarchs reaching Mexico has dropped sharply. Many families and schools now plant milkweed gardens to help restore the route.", "tag": "Cause & Effect", "tagcolor": "#185FA5"}, {"stem": "Which word means the <b>OPPOSITE</b> of “abundant” as it is used in the third paragraph?", "opts": ["plentiful", "healthy", "valuable", "rare"], "ci": 3, "exp": "Milkweed has become “far less abundant” because fields and roadsides were sprayed and cleared, so abundant means existing in large amounts. The opposite is <i>rare</i>. “Plentiful” means the same as abundant, not the opposite.", "passage": "<strong>The Monarch's Long Journey</strong><br>Each autumn, millions of monarch butterflies leave Canada and the northern United States and fly as far as 3,000 miles to the mountains of central Mexico. The trip is remarkable because no monarch flying south has ever made it before; the butterflies that migrate in fall are the great-grandchildren of the ones that left Mexico the previous spring. Scientists believe monarchs navigate by tracking the position of the sun with the help of an internal clock in their antennae, and they may also sense Earth's magnetic field.<br><br>Along the way, monarchs depend on flowering plants for nectar, which fuels their flight. In Mexico they cluster by the thousands on oyamel fir trees, where the cool, moist air slows their bodies so that they use little energy all winter. In spring they mate and head north, laying eggs only on milkweed, the one plant their caterpillars can eat.<br><br>Over recent decades, however, milkweed has become far less abundant as farm fields and roadsides have been sprayed and cleared. Because fewer caterpillars survive, the number of monarchs reaching Mexico has dropped sharply. Many families and schools now plant milkweed gardens to help restore the route.", "tag": "Antonym", "tagcolor": "#185FA5"}, {"stem": "Why does the author most likely include Theo's question, “Are you nervous?”", "opts": ["to show that Theo was trying to trick Grace into quitting", "to show that Grace's worry could be seen, even though Theo did not know its real cause", "to reveal that Theo had also misspelled a word", "to explain why the judges misheard Grace's spelling"], "ci": 1, "exp": "Theo notices she looks “pale” and guesses she is nervous, but the reader knows she is upset about her secret mistake. This builds tension. Nothing in the story suggests Theo was being tricky.", "passage": "<strong>The Last Word</strong><br>Grace Moreno had reached the final round of the county spelling bee, and only one other speller, a tall boy named Theo, remained on the stage. When the pronouncer read the word “rhythm,” Grace spelled it slowly, letter by letter. The judges nodded, and the audience applauded.<br><br>As she returned to her seat, though, Grace's stomach tightened. She replayed the letters in her head and realized she had said “r-h-y-t-h-e-m.” The judges had misheard her.<br><br>“You look pale,” Theo whispered. “Are you nervous?”<br><br>Grace didn't answ mily camped on the far side, Clara wrote in her journal: “Today the river tested us, and we did not fail.”", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Which meaning of “plain” is used in the line “the ditches now lie bare and mowed and plain”?", "opts": ["honest and direct when speaking", "simple, with nothing growing or added", "clear and easy to understand", "a wide, flat area of land"], "ci": 1, "exp": "In the poem, <i>plain</i> describes ditches that are bare and mowed, with nothing growing in them. “A wide, flat area of land” is a real meaning of the noun <i>plain</i>, but here the word is an adjective describing the ditches.", "passage": "<strong>Monarch Road</strong><br>A thread of orange stitched across the sky,<br>they ride the wind on paper-thin wings,<br>past cornfields stripped and highways humming by,<br>toward mountains none of them remembers.<br><br>They sip from asters, purple, late, and low,<br>then rise again before the sun is high;<br>no map, no elder flying out in front to show,<br>just something whispering inside them: <i>fly</i>.<br><br>Where milkweed once grew thick along the fence,<br>the ditches now lie bare and mowed and plain;<br>yet in a schoolyard, planted rows commence<br>to offer leaves for caterpillars once again.<br><br>So if you see one drifting, light and slow,<br>remember all the miles it has to go.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"stem": "According to the poem, which statement is <b>NOT</b> true?", "opts": ["An older monarch leads the others toward the mountains.", "A schoolyard has planted rows for caterpillars.", "Milkweed once grew thickly along the fence.", "The monarchs drink from asters along the way."], "ci": 0, "exp": "The poem says there is “no map, no elder flying out in front to show,” so no older monarch leads them. The other three statements come straight from the second and third stanzas.", "passage": "<strong>Monarch Road</strong><br>A thread of orange stitched a var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
