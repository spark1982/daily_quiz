var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["has wanted", "have want", "NO CHANGE", "wanting"], "ci": 2, "exp": "It is already correct. <i>Have</i> + the past participle <i>wanted</i> shows something that started in the past and is still true: <i>I <b>have wanted</b> to tell you about it ever since.</i> With <i>I</i>, use <i>have</i>, not <i>has</i>.", "passage": "<strong>A Letter to Aunt Rosa</strong><br>Dear Aunt Rosa,<br><b>(1)</b> Our school science fair was last Friday, and I <u>have wanted</u> to tell you about it ever since. <b>(2)</b> My project tested which brand of paper towel soaks up the most water. <b>(3)</b> Each of the five brands were tested three times. <b>(4)</b> First I measured the water, and then I <u>dip</u> each towel into a cup for ten seconds. <b>(5)</b> The judges gave me a blue ribbon for careful measuring. <b>(6)</b> Yes I already hung the ribbon above my desk!<br>Love, Nina", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "dipped", "have dipped", "will dip"], "ci": 1, "exp": "The sentence already uses the past tense (<i>measured</i>), so the second verb should be past too: <i>First I measured the water, and then I <b>dipped</b> each towel into a cup.</i>", "passage": "<strong>A Letter to Aunt Rosa</strong><br>Dear Aunt Rosa,<br><b>(1)</b> Our school science fair was last Friday, and I <u>have wanted</u> to tell you about it ever since. <b>(2)</b> My project tested which brand of paper towel soaks up the most water. <b>(3)</b> Each of the five brands were tested three times. <b>(4)</b> First I measured the water, and then I <u>dip</u> each towel into a cup for ten seconds. <b>(5)</b> The judges gave me a blue ribbon for careful measuring. <b>(6)</b> Yes I already hung the ribbon above my desk!<br>Love, Nina", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5"}, {"stem": "Which sentence has an error?", "opts": ["My project tested which brand of paper towel soaks up the most water.", "Each of the five brands were tested three times.", "The judges gave me a blue ribbon for careful measuring.", "Our school science fair was last Friday, and I have wanted to tell you about it ever since."], "ci": 1, "exp": "With <i>each</i>, use a singular verb, even when “of the five brands” comes in between: <i>Each of the five brands <b>was</b> tested three times.</i>", "passage": "<strong>A Letter to Aunt Rosa</strong><br>Dear Aunt Rosa,<br><b>(1)</b> Our school science fair was last Friday, and I <u>have wanted</u> to tell you about it ever since. <b>(2)</b> My project tested which brand of paper towel soaks up the most water. <b>(3)</b> Each of the five brands were tested three times. <b>(4)</b> First I measured the water, and then I <u>dip</u> each towel into a cup for ten seconds. <b>(5)</b> The judges gave me a blue ribbon for careful measuring. <b>(6)</b> Yes I already hung the ribbon above my desk!<br>Love, Nina", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"stem": "Where should a comma be added in sentence 6?", "opts": ["Yes, I already hung the ribbon above my desk!", "Yes I already hung the ribbon, above my desk!", "Yes I already hung, the ribbon above my desk!", "Yes I, already hung the ribbon above my desk!"], "ci": 0, "exp": "Put a comma after <i>yes</i> or <i>no</i> at the start of a sentence: <i><b>Yes,</b> I already hung the ribbon above my desk!</i>", "passage": "<strong>A Letter to Aunt Rosa</strong><br>Dear Aunt Rosa,<br><b>(1)</b> Our school science fair was last Friday, and I <u>have wanted</u> to tell you about it ever since. <b>(2)</b> My project tested which brand of paper towel soaks up the most water. <b>(3)</b> Each of the five brands were tested three times. <b>(4)</b> First I measured the water, and then I <u>dip</u> each towel into a cup for ten seconds. <b>(5)</b> The judges gave me a blue ribbon for careful measuring. <b>(6)</b> Yes I already hung the ribbon above my desk!<br>Love, Nina", "tag": "Commas", "tagcolor": "#d6336c"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["whom", "where", "NO CHANGE", "that"], "ci": 3, "exp": "The word must be the subject of “must eat,” and it refers to birds, so use <i>that</i>: <i>tiny birds <b>that</b> must eat almost all day long.</i> <i>Whose</i> shows ownership and needs a noun after it (whose wings).", "passage": "<strong>How Hummingbirds Survive Cold Nights</strong><br><b>(1)</b> Hummingbirds are tiny birds <u>whose</u> must eat almost all day long. <b>(2)</b> Their hearts can beat more than a thousand times a minute. <b>(3)</b> A hummingbird burns energy <u>real</u> fast, so it could starve during a long, cold night. <b>(4)</b> To stay alive, the bird slips into a deep sleep called torpor. <b>(5)</b> Its body temperature drops. <b>(6)</b> Its heartbeat slows down. <b>(7)</b> In the morning, the bird warms up and flies off to find <u>it's</u> breakfast.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "more real", "realer", "really"], "ci": 3, "exp": "To describe the adverb <i>fast</i>, use the adverb <i>really</i>, not the adjective <i>real</i>: <i>A hummingbird burns energy <b>really</b> fast.</i>", "passage": "<strong>How Hummingbirds Survive Cold Nights</strong><br><b>(1)</b> Hummingbirds are tiny birds <u>whose</u> must eat almost all day long. <b>(2)</b> Their hearts can beat more than a thousand times a minute. <b>(3)</b> A hummingbird burns energy <u>real</u> fast, so it could starve during a long, cold night. <b>(4)</b> To stay alive, the bird slips into a deep sleep called torpor. <b>(5)</b> Its body temperature drops. <b>(6)</b> Its heartbeat slows down. <b>(7)</b> In the morning, the bird warms up and flies off to find <u>it's</u> breakfast.", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Its body temperature drops, but its heartbeat slows down.", "Its body temperature drops, and its heartbeat slows down.", "Its body temperature drops, or its heartbeat slows down.", "Its body temperature drops, its heartbeat slows down."], "ci": 1, "exp": "Both things happen together, so join them with a comma and <i>and</i>: <i>Its body temperature drops, <b>and</b> its heartbeat slows down.</i> A comma alone makes a run-on, <i>or</i> means only one happens, and <i>but</i> shows a contrast that isn't there.", "passage": "<strong>How Hummingbirds Survive Cold Nights</strong><br><b>(1)</b> Hummingbirds are tiny birds <u>whose</u> must eat almost all day long. <b>(2)</b> Their hearts can beat more than a thousand times a minute. <b>(3)</b> A hummingbird burns energy <u>real</u> fast, so it could starve during a long, cold night. <b>(4)</b> To stay alive, the bird slips into a deep sleep called torpor. <b>(5)</b> Its body temperature drops. <b>(6)</b> Its heartbeat slows down. <b>(7)</b> In the morning, the bird warms up and flies off to find <u>it's</u> breakfast.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["it is", "its", "NO CHANGE", "its'"], "ci": 1, "exp": "<i>Its</i> (no apostrophe) shows belonging; <i>it's</i> means “it is.” <i>The bird flies off to find <b>its</b> breakfast.</i>", "passage": "<strong>How Hummingbirds Survive Cold Nights</strong><br><b>(1)</b> Hummingbirds are tiny birds <u>whose</u> must eat almost all day long. <b>(2)</b> Their hearts can beat more than a thousand times a minute. <b>(3)</b> A hummingbird burns energy <u>real</u> fast, so it could starve during a long, cold night. <b>(4)</b> To stay alive, the bird slips into a deep sleep called torpor. <b>(5)</b> Its body temperature drops. <b>(6)</b> Its heartbeat slows down. <b>(7)</b> In the morning, the bird warms up and flies off to find <u>it's</u> breakfast.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["cooks", "cook", "cooking", "NO CHANGE"], "ci": 3, "exp": "It is already correct. <i>Had</i> + the past participle <i>cooked</i> shows something that had not happened before that morning: <i>We had never <b>cooked</b> breakfast by ourselves before.</i>", "passage": "<strong>My Journal: Birthday Pancakes</strong><br><b>(1)</b> Early this morning my little sister June and I made a stack of pancakes for Mom's birthday. <b>(2)</b> We had never <u>cooked</u> breakfast by ourselves before. <b>(3)</b> June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl. <b>(4)</b> Mom said the pancakes were the best that her and Dad had ever tasted. <b>(5)</b> We burned the first pancake. <b>(6)</b> Because the pan was too hot. <b>(7)</b> We <u>should of</u> turned the heat down sooner.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"stem": "Which sentence has an error?", "opts": ["June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl.", "We had never cooked breakfast by ourselves before.", "Early this morning my little sister June and I made a stack of pancakes for Mom's birthday.", "Mom said the pancakes were the best that her and Dad had ever tasted."], "ci": 3, "exp": "In “her and Dad had tasted,” the pronoun is part of the subject, so use <i>she</i>. Try it alone: <i>she had tasted</i>, not <i>her had tasted</i>. <i>...the best that <b>she and Dad</b> had ever tasted.</i>", "passage": "<strong>My Journal: Birthday Pancakes</strong><br><b>(1)</b> Early this morning my little sister June and I made a stack of pancakes for Mom's birthday. <b>(2)</b> We had never <u>cooked</u> breakfast by ourselves before. <b>(3)</b> June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl. <b>(4)</b> Mom said the pancakes were the best that her and Dad had ever tasted. <b>(5)</b> We burned the first pancake. <b>(6)</b> Because the pan was too hot. <b>(7)</b> We <u>should of</u> turned the heat down sooner.", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Because we burned the first pancake, the pan was too hot.", "We burned the first pancake, the pan was too hot.", "We burned the first pancake. Because, the pan was too hot.", "We burned the first pancake because the pan was too hot."], "ci": 3, "exp": "Sentence 6 is a fragment; it can't stand alone. Attach it to the sentence it explains: <i>We burned the first pancake <b>because</b> the pan was too hot.</i> Putting <i>because</i> before “we burned” flips the cause and the effect.", "passage": "<strong>My Journal: Birthday Pancakes</strong><br><b>(1)</b> Early this morning my little sister June and I made a stack of pancakes for Mom's birthday. <b>(2)</b> We had never <u>cooked</u> breakfast by ourselves before. <b>(3)</b> June carefully measured the flour and milk, and I cracked three eggs into a big blue bowl. <b>(4)</b> Mom said the pancakes were the best that her and Dad had ever tasted. <b>(5)</b> We burned the first pancake. <b>(6)</b> Because the pan was too hot. <b>(7)</b> We <u>should of</u> turned the heat down sooner.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["NO CHANGE", "should of had", "should have", "should had"], "ci": 2, "exp": "“Should of” is a mistake that comes from how “should’ve” sounds. Write <i>should have</i>: <i>We <b>should have</b> turned the heat down sooner.</i>", "passage": "<strong>My Journal: Birthday Pancakes</strong><br><b>(1)</b> Early this morning my little sister June and I made a stack of pancakes for Mom's birthday. <b>(2)</b> We had never <u>cooked</u> breakfast by var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
