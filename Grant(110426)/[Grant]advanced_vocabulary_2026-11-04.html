<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261104";
var RAW_QUESTIONS = [{"stem": "Water is <b>abundant</b> in the rainforest. Which word means the <b>OPPOSITE</b> of <i>abundant</i>?", "opts": ["ample", "generous", "scarce", "plentiful"], "ci": 2, "exp": "<i>abundant</i> (adj.) existing in large amounts; more than enough. The opposite is <i>scarce</i> (hard to find, not enough). \"Plentiful\" and \"ample\" mean almost the <i>same</i> as abundant. Family: abundance (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Giving up her Saturday to help at the food bank was a ______ choice, but Ana felt proud afterward.", "opts": ["sacrificed", "sacrifice", "sacrificing", "sacrificial"], "ci": 3, "exp": "The blank comes before the noun <i>choice</i>, so it needs an adjective: <i>sacrificial</i> (involving giving something up). <i>sacrifice</i> (n./v.) to give up something you value for something more important. <i>Parents often <b>sacrifice</b> sleep for their babies.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The pool has a sign that <b>prohibits</b> running, so the lifeguard blew her whistle when two kids raced along the edge.", "opts": ["makes easier", "sometimes permits", "does not allow", "strongly suggests"], "ci": 2, "exp": "<i>prohibit</i> (v.) to officially not allow something; to forbid. <i>The library <b>prohibits</b> food near the computers.</i> Family: prohibition (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The weather app was not <b>accurate</b> today: it promised sunshine, but we got soaked on the walk home.", "opts": ["correct and exact", "popular with people", "easy to use", "fast to load"], "ci": 0, "exp": "<i>accurate</i> (adj.) correct and exact, with no mistakes. <i>Measure twice so your numbers are <b>accurate</b>.</i> Family: accuracy (n.), accurately (adv.), inaccurate (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The town hoped the new park would be an <b>incentive</b> for families to move there, since many people want green space nearby.", "opts": ["a cost that people must pay", "a problem that worries people", "something that encourages a person to act", "a rule that people must follow"], "ci": 2, "exp": "<i>incentive</i> (n.) something that encourages you to do something. <i>Extra recess was an <b>incentive</b> to finish our work.</i> Family: incentivize (v.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The river forms the <b>boundary</b> between the two states. Which word means the <b>SAME</b> or nearly the same as <i>boundary</i>?", "opts": ["source", "bridge", "border", "center"], "ci": 2, "exp": "<i>boundary</i> (n.) a line that marks the edge of an area. A <i>border</i> is the same idea. The \"center\" is the opposite part of an area, the middle. Family: bound (n./v.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "It took months of practice, but Jada finally learned to ______ her fear of speaking in front of the class.", "opts": ["prohibit", "inherit", "overcome", "transmit"], "ci": 2, "exp": "<i>overcome</i> (v.) to succeed in dealing with a problem or fear. <i>She <b>overcame</b> her fear of heights on the climbing wall.</i> \"Inherit\" means to receive from family, and \"prohibit\" means to not allow, so neither fits a fear you beat. Family: overcame (past), overcoming.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Radio towers <b>transmit</b> signals across the city. Which word means the <b>OPPOSITE</b> of <i>transmit</i>?", "opts": ["deliver", "receive", "broadcast", "send"], "ci": 1, "exp": "<i>transmit</i> (v.) to send something from one place or person to another. The opposite is <i>receive</i> (to get what is sent). \"Send\" and \"broadcast\" are close to the <i>same</i> meaning. Family: transmission (n.), transmitter (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "When her grandfather passed away, Maya <b>inherited</b> his old pocket watch, which had been in the family for a hundred years.", "opts": ["borrowed for a short time", "received something from a family member who died", "bought at a low price", "found by accident"], "ci": 1, "exp": "<i>inherit</i> (v.) to receive money, things, or traits from a parent or relative, often after they die. <i>He <b>inherited</b> his mother's curly hair.</i> Family: inheritance (n.), heir (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The crowd was so ______ that people cheered, clapped, and waved signs for the entire game.", "opts": ["timid", "enthusiastic", "chronological", "durable"], "ci": 1, "exp": "<i>enthusiastic</i> (adj.) showing great excitement and interest. <i>The <b>enthusiastic</b> fans sang the team song.</i> Family: enthusiasm (n.), enthusiastically (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The new reading program has worked well, and the teachers are pleased with its ______.", "opts": ["effectiveness", "effectively", "effective", "ineffective"], "ci": 0, "exp": "The blank needs a noun that means <i>how well something works</i>: <i>effectiveness</i>. \"Effective\" is an adjective and \"effectively\" is an adverb. \"Ineffective\" is an adjective meaning not working well. <i>effective</i> (adj.) producing the result you want.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Read the sentence: <i>\"After the touchdown, the kicker tried to <b>convert</b> the extra point.\"</i> What does <b>convert</b> mean in this sentence?", "opts": ["change from one form into another", "score a point after a touchdown in football", "trade one kind of money for another", "persuade someone to change a belief"], "ci": 1, "exp": "<i>convert</i> has several meanings: to change something into another form (<i>solar panels <b>convert</b> sunlight into power</i>), to change someone's belief, or in football to score the extra point after a touchdown. The words \"touchdown\" and \"kicker\" show the sports meaning. Family: conversion (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "There was a <b>contradiction</b> in his story: first he said he was home, and then he said he was at the park. Which word means the <b>SAME</b> or nearly the same as <i>contradiction</i>?", "opts": ["exaggeration", "agreement", "explanation", "inconsistency"], "ci": 3, "exp": "<i>contradiction</i> (n.) two statements that cannot both be true. An <i>inconsistency</i> is the same idea. \"Agreement\" is the opposite. Family: contradict (v.), contradictory (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Lena is <b>ambitious</b>; she already plans to build her own robot and enter it in the state science fair.", "opts": ["happy to let others take the lead", "careful to follow every rule", "feeling nervous about trying new things", "having a strong wish to succeed or do something big"], "ci": 3, "exp": "<i>ambitious</i> (adj.) having a strong wish to achieve something big. <i>His <b>ambitious</b> plan was to read 100 books this year.</i> Family: ambition (n.), ambitiously (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Scientists measured the ______ of the earthquake to find out just how strong it had been.", "opts": ["boundary", "incentive", "principle", "magnitude"], "ci": 3, "exp": "<i>magnitude</i> (n.) the size, strength, or importance of something. <i>Nobody expected a storm of that <b>magnitude</b>.</i> \"Boundary\" is a dividing line, which cannot tell how strong a quake was.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Our report had to be <b>chronological</b>, so we started with the colonists' arrival in 1607 and ended with the colony's growth in the 1700s.", "opts": ["arranged in the order that events happened", "organized by where each event took place", "sorted from most to least important", "grouped by the people involved"], "ci": 0, "exp": "<i>chronological</i> (adj.) arranged in time order, from first to last. <i>A timeline lists events in <b>chronological</b> order.</i> Family: chronologically (adv.), chronology (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: <i>\"The two teams <b>alternate</b> between batting and fielding each inning.\"</i> What does <b>alternate</b> mean in this sentence?", "opts": ["happening on every second day", "take turns, one after the other", "stop doing something for a while", "another choice that can be used instead"], "ci": 1, "exp": "<i>alternate</i> can be a verb meaning to take turns (<i>We <b>alternate</b> chores each week.</i>), or an adjective meaning another choice (<i>an <b>alternate</b> route</i>) or every other one (<i>on <b>alternate</b> days</i>). Here the teams take turns, so it is the verb meaning.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Marcus <b>hesitated</b> at the top of the high dive, looking down at the water for a long moment before he finally jumped.", "opts": ["turned around and left", "shouted for help", "moved forward quickly", "paused because he was unsure"], "ci": 3, "exp": "<i>hesitate</i> (v.) to pause before doing something because you are unsure or nervous. <i>Don't <b>hesitate</b> to ask a question.</i> The clue is \"for a long moment before he finally jumped.\" Family: hesitation (n.), hesitant (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Our class agreed on one important ______: everyone gets a fair turn to speak.", "opts": ["magnitude", "contradiction", "incentive", "principle"], "ci": 3, "exp": "<i>principle</i> (n.) a basic rule or belief that guides how people act. <i>Honesty is a <b>principle</b> our family lives by.</i> Don't mix it up with <i>principal</i>, the head of a school.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The <b>timid</b> kitten hid under the couch for two days and only came out when the house was completely quiet.", "opts": ["curious and playful", "hungry and loud", "shy and easily frightened", "sick and weak"], "ci": 2, "exp": "<i>timid</i> (adj.) shy and easily frightened; not brave. <i>The <b>timid</b> deer ran off at the smallest sound.</i> Family: timidly (adv.), timidity (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
