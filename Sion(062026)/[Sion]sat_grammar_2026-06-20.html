<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Grammar</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#f0f3f7; margin:0; padding:0; color:#222; }
  .wrap { max-width:640px; margin:0 auto; padding:18px 14px 60px; }
  h1 { font-size:1.25rem; text-align:center; color:#6B3FA0; margin:6px 0 2px; }
  .date { text-align:center; font-size:0.82rem; color:#888; margin-bottom:6px; }
  .instruction { text-align:center; font-size:0.88rem; color:#555; padding:6px 12px 10px; background:#f0f3f7; }
  #nav-bar { display:flex; align-items:center; gap:8px; margin:12px 0; }
  #nav-count { font-size:13px; white-space:nowrap; color:#555; }
  .prog-track { background:#d7dde6; border-radius:3px; height:6px; flex:1; margin:0 10px; }
  .prog-fill { background:#6B3FA0; border-radius:3px; height:6px; width:0%; transition:width 0.2s; }
  #jump-btn { font-size:12px; padding:4px 10px; border:1px solid #6B3FA0; border-radius:14px; background:#fff; color:#6B3FA0; cursor:pointer; white-space:nowrap; }
  #dot-panel { display:none; max-height:170px; overflow-y:auto; padding:8px; background:#fff; border-radius:8px; margin-bottom:8px; }
  .card { background:#fff; border-radius:14px; padding:18px 16px; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:14px; }
  .tag-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .tag-badge { display:inline-block; font-size:0.7rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; background:#6B3FA0; }
  .q-prompt { font-size:0.92rem; color:#555; margin-bottom:10px; }
  .sentence-box { background:#f6f1fb; border-left:3px solid #6B3FA0; padding:12px 14px; border-radius:6px; margin-bottom:14px; font-size:1rem; color:#222; line-height:1.6; }
  .sentence-box u { text-decoration:underline; text-decoration-color:#6B3FA0; text-decoration-thickness:2px; font-weight:600; }
  .opt-btn { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px; border:1.5px solid #d7dde6; border-radius:9px; background:#fff; font-size:0.95rem; cursor:pointer; }
  .opt-btn.correct { background:#E1F5EE; border-color:#1D9E75; color:#0c5132; font-weight:600; }
  .opt-btn.wrong { background:#FBE9E7; border-color:#E24B4A; color:#7a1d1c; font-weight:600; }
  .opt-btn.disabledbtn { cursor:default; }
  .exp-box { margin-top:6px; padding:11px 13px; background:#fff7e6; border-left:3px solid #f5a623; border-radius:6px; font-size:0.88rem; color:#5a4310; line-height:1.5; }
  .nav-btns { display:flex; gap:10px; margin-top:14px; }
  .nav-btns button { flex:1; padding:11px; border:none; border-radius:9px; background:#6B3FA0; color:#fff; font-size:0.95rem; cursor:pointer; }
  .nav-btns button:disabled { background:#b9c6d4; cursor:default; }
  .results-card { text-align:center; }
  .score-big { font-size:2.4rem; font-weight:800; color:#6B3FA0; margin:8px 0; }
  #retryWrongBtn { display:block; width:100%; padding:13px; background:#1D9E75; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .res-btn-copy { display:block; width:100%; padding:13px; background:#7b61ff; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .res-btn-fresh { display:block; width:100%; padding:13px; background:#888; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; }
  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; z-index:50; }
  .modal-box { background:#fff; border-radius:14px; padding:22px; max-width:300px; text-align:center; }
  .modal-box p { font-size:0.95rem; color:#333; margin-bottom:18px; }
  .modal-btns { display:flex; gap:10px; }
  .modal-btns button { flex:1; padding:10px; border:none; border-radius:8px; font-size:0.9rem; cursor:pointer; }
  .modal-btn-cancel { background:#e5e8ec; color:#333; }
  .modal-btn-confirm { background:#E24B4A; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>[Sion] SAT Grammar</h1>
  <div class="date">2026-06-20</div>
  <div class="instruction">Read each underlined portion and choose the option that fixes any error, or keep it as is if it is already correct.</div>

  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>

  <div id="quiz-area"></div>
  <div id="results-area" style="display:none;"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <p>Are you sure you want to clear all progress and start fresh?</p>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="closeFreshModal()">Cancel</button>
      <button class="modal-btn-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>

<script>
(function(){
  var DATE_GEN = '20260619';
  var QUIZ_KEY = 'quiz_sionsatgrammar_20_' + DATE_GEN + '_v1';
  var ATT_KEY  = 'quiz_sionsatgrammar_att_' + DATE_GEN + '_v1';

  var qs = [
    { tag:"Semicolon Usage",
      sentence:"The committee reviewed every proposal carefully, <u>however, they rejected</u> the budget request on the grounds that it lacked sufficient detail.",
      opts:["however, they rejected","however they rejected","; however, they rejected",", and however, they rejected"], ci:2,
      exp:"\"However\" is a conjunctive adverb, not a coordinating conjunction, so it cannot join two independent clauses with only a comma. The two clauses need a semicolon before it, giving \"; however, they rejected.\"" },
    { tag:"Colon Usage",
      sentence:"Years of careful study led the geologist to a single conclusion<u>, the volcano was nowhere near as dormant as residents believed</u>.",
      opts:[", the volcano was nowhere near as dormant as residents believed",": the volcano was nowhere near as dormant as residents believed",", and that the volcano was nowhere near as dormant as residents believed","; the volcano was nowhere near as dormant as residents believed, however"], ci:1,
      exp:"A colon properly introduces the explanation of \"a single conclusion,\" so the sentence should read \"a single conclusion: the volcano was nowhere near as dormant as residents believed.\"" },
    { tag:"Parallel Series",
      sentence:"The internship taught her to manage a budget, <u>negotiating with vendors, and how to present</u> quarterly results to the board.",
      opts:["negotiating with vendors, and how to present","negotiate with vendors, and presenting","how to negotiate with vendors, and presented","to negotiate with vendors, and to present"], ci:3,
      exp:"Since the list begins \"to manage a budget,\" the remaining items must match that infinitive form, giving \"to negotiate with vendors, and to present quarterly results.\"" },
    { tag:"Collective Noun Agreement",
      sentence:"The jury, despite reviewing the same evidence for nearly a week, <u>remain divided</u> on whether the defendant acted with intent.",
      opts:["remain divided","remains divided","are remaining divided","have remained divide"], ci:1,
      exp:"\"Jury\" is treated as a single unit acting together in this sentence, so it takes the singular verb \"remains divided.\"" },
    { tag:"Pronoun-Antecedent Agreement",
      sentence:"Every applicant must submit <u>his or her</u> portfolio no later than Friday at noon.",
      opts:["his or her","their","its","one's own"], ci:0,
      exp:"\"Every applicant\" is a singular antecedent, so \"his or her portfolio\" already agrees correctly in number. Switching to \"their\" would mismatch the strictly singular antecedent \"every applicant.\"" },
    { tag:"Vague Pronoun Reference",
      sentence:"The new policy reduced printing costs, simplified the filing process, and shortened approval times, <u>which most employees appreciated</u> almost immediately.",
      opts:["which most employees appreciated","which most employees appreciated it","a combination that most employees appreciated","this most employees appreciated"], ci:2,
      exp:"\"Which\" has no single clear noun to refer to after three separate improvements are listed. Replacing it with the explicit noun phrase \"a combination\" fixes the vague reference." },
    { tag:"Misplaced Modifier",
      sentence:"Reviewers <u>only praised the film's score</u>, not its screenplay or its visual effects, despite expecting to like every aspect equally.",
      opts:["only praised the film's score","praised the film's only score","only the film's score praised","praised only the film's score"], ci:3,
      exp:"Because the sentence contrasts \"its screenplay or its visual effects,\" the limiting word \"only\" must sit directly before \"the film's score,\" giving \"praised only the film's score.\"" },
    { tag:"Conditional Mood",
      sentence:"If the engineers <u>would have tested</u> the bridge's support beams more rigorously, inspectors might have caught the structural flaw months earlier.",
      opts:["would have tested","had tested","would test","have tested"], ci:1,
      exp:"A past hypothetical \"if\" clause needs the past perfect \"had tested\" rather than \"would have tested,\" which belongs only in the result clause." },
    { tag:"Illogical Comparison",
      sentence:"The novelist's prose style is far more economical than <u>her contemporaries</u>, who often favor long, winding sentences.",
      opts:["her contemporaries","those of her contemporaries","that of her contemporaries","her contemporaries' "], ci:2,
      exp:"The sentence compares one prose style to another, so it needs the placeholder \"that,\" as in \"that of her contemporaries,\" rather than comparing a style directly to a group of people." },
    { tag:"Diction: Fewer vs Less",
      sentence:"Since the factory upgraded its equipment, it has produced <u>fewer defective units</u> each month than it did before the renovation.",
      opts:["fewer defective units","less defective units","lesser defective units","few defective units"], ci:0,
      exp:"\"Units\" can be counted individually, so the original comparative form \"fewer defective units\" is already correct. \"Less,\" reserved for uncountable amounts, would not fit here." },
    { tag:"Idiomatic Preposition",
      sentence:"The committee's final recommendation was strikingly <u>different than what</u> most analysts had predicted at the start of the hearings.",
      opts:["different than what","different of what","differently than what","different from what"], ci:3,
      exp:"The standard idiom is \"different from,\" so the sentence should read \"different from what most analysts had predicted.\"" },
    { tag:"Restrictive vs Nonrestrictive",
      sentence:"The proposal <u>which the board rejected without a single dissenting vote</u> would have shifted nearly a third of the budget toward marketing.",
      opts:["which the board rejected without a single dissenting vote",", which the board rejected without a single dissenting vote,","that the board rejected without a single dissenting vote",", that the board rejected without a single dissenting vote"], ci:1,
      exp:"The clause simply adds extra detail about one already-identified proposal, so it is nonrestrictive and must be set off with commas, as in \", which the board rejected without a single dissenting vote,\"." },
    { tag:"Run-on Sentence",
      sentence:"The storm knocked out power across the county <u>residents relied on generators and flashlights</u> for nearly three days.",
      opts:["residents relied on generators and flashlights",", residents relied on generators and flashlights",", so residents relied on generators and flashlights","and so residents relied on generators and flashlights"], ci:2,
      exp:"Two complete sentences are fused together with no punctuation. Adding a comma before the coordinating conjunction \"so\" correctly joins them as \", so residents relied on generators and flashlights.\"" },
    { tag:"Sentence Fragment",
      sentence:"<u>Even though the museum's east wing has been closed for renovations since spring.</u> Visitors can still tour the main galleries and the sculpture garden.",
      opts:["Even though the museum's east wing has been closed for renovations since spring.","The museum's east wing has been closed for renovations since spring, even though","Even though the museum's east wing being closed for renovations since spring.","Even though the museum's east wing has been closed for renovations since spring,"], ci:3,
      exp:"The subordinate clause cannot stand alone as a sentence. Replacing the period with a comma attaches it correctly to the independent clause that follows, \"Visitors can still tour the main galleries.\"" },
    { tag:"Parallel Verb Forms",
      sentence:"The new manager's responsibilities include training new hires, <u>overseeing inventory</u>, and approving weekly schedules.",
      opts:["overseeing inventory","to oversee inventory","oversee inventory","the overseeing of inventory"], ci:0,
      exp:"The list already keeps a consistent gerund pattern with \"training,\" \"overseeing,\" and \"approving,\" so the original phrasing \"overseeing inventory\" is correct as written." },
    { tag:"Neither/Nor Agreement",
      sentence:"Neither the marketing director nor the regional managers <u>was</u> able to attend the emergency meeting on such short notice.",
      opts:["was","were","is","had been"], ci:1,
      exp:"In a \"neither...nor\" construction, the verb agrees with the nearer subject, the plural \"regional managers,\" so \"were\" is correct." },
    { tag:"Redundancy",
      sentence:"The new safety protocol requires <u>each and every single individual employee</u> to complete the certification course annually.",
      opts:["each and every single individual employee","each and every employee individually","every employee","every single each employee"], ci:2,
      exp:"\"Each,\" \"every,\" \"single,\" and \"individual\" all repeat the same idea, so the sentence should be trimmed to a concise term such as \"every employee.\"" },
    { tag:"Adjective vs Adverb",
      sentence:"After the long flight, the entire team felt <u>bad</u> about the missed connection, even though the delay was not their fault.",
      opts:["bad","badly","more badly","ill"], ci:0,
      exp:"\"Felt\" functions as a linking verb describing the team's emotional state, so the adjective \"bad\" is already correct. \"Badly\" would incorrectly describe the act of feeling itself." },
    { tag:"Double Negative",
      sentence:"The auditors couldn't find <u>no discrepancies</u> in the quarterly report, which surprised the finance committee given the company's recent financial troubles.",
      opts:["no discrepancies","not any discrepancies","none discrepancies","any discrepancies"], ci:3,
      exp:"Pairing \"couldn't\" with \"no discrepancies\" creates a double negative that contradicts the sentence's intended meaning. \"Any discrepancies\" correctly conveys that none were found." },
    { tag:"Diction: Number vs Amount",
      sentence:"Despite hiring additional staff, the clinic still receives a surprising <u>amount of patient complaints</u> about long wait times each week.",
      opts:["amount of patient complaints","number of patient complaints","amounts of patient complaints","amount of patient complaint"], ci:1,
      exp:"Because \"complaints\" can be counted individually, the sentence calls for \"number of,\" not \"amount of.\"" }
  ];

  var state = { idx:0, answers:{} };
  function loadState(){
    try {
      var raw = localStorage.getItem(QUIZ_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.idx = parsed.idx || 0;
        state.answers = parsed.answers || {};
      }
    } catch(e){}
  }
  function saveState(){
    try { localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); } catch(e){}
  }
  function bumpAttempt(){
    try {
      var n = parseInt(localStorage.getItem(ATT_KEY) || '0', 10);
      localStorage.setItem(ATT_KEY, String(n+1));
    } catch(e){}
  }

  function getShuffle(i){ return [0,1,2,3]; }

  function answered(){ return Object.keys(state.answers).length; }

  function updateNav(){
    var a = answered();
    document.getElementById('nav-count').textContent = a + ' / ' + qs.length;
    document.getElementById('prog-fill').style.width = (a/qs.length*100).toFixed(1)+'%';
    renderDots();
  }

  function renderDots(){
    var panel = document.getElementById('dot-panel');
    var html = '';
    qs.forEach(function(q,i){
      var picked = state.answers[i];
      var bg = picked===undefined ? '#d7dde6' : (picked===q.ci ? '#6B3FA0' : '#E24B4A');
      html += '<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
    });
    panel.innerHTML = html;
  }

  function toggleJump(){
    var panel = document.getElementById('dot-panel');
    var btn = document.getElementById('jump-btn');
    if (panel.style.display === 'none' || !panel.style.display) {
      panel.style.display = 'block'; btn.textContent = 'Hide ▴'; renderDots();
    } else {
      panel.style.display = 'none'; btn.textContent = 'Jump ▾';
    }
  }

  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(){
    if (answered() >= qs.length && state.showResults) { renderResults(); return; }
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('results-area').style.display = 'none';
    var i = state.idx;
    var q = qs[i];
    var picked = state.answers[i];
    var order = getShuffle(i);
    var html = '<div class="card">';
    html += '<div class="tag-row"><span class="tag-badge">'+escHtml(q.tag)+'</span></div>';
    html += '<div class="q-prompt">Question '+(i+1)+' of '+qs.length+'. Choose the best version of the underlined portion.</div>';
    html += '<div class="sentence-box">'+q.sentence+'</div>';
    order.forEach(function(oi){
      var cls = 'opt-btn';
      if (picked !== undefined) {
        cls += ' disabledbtn';
        if (oi === q.ci) cls += ' correct';
        else if (oi === picked) cls += ' wrong';
      }
      var label = oi === 0 ? 'NO CHANGE' : escHtml(q.opts[oi]);
      html += '<button class="'+cls+'" onclick="pick('+oi+')" '+(picked!==undefined?'disabled':'')+'>'+label+'</button>';
    });
    if (picked !== undefined && picked !== q.ci) {
      html += '<div class="exp-box">'+escHtml(q.exp)+'</div>';
    }
    html += '</div>';
    html += '<div class="nav-btns">';
    html += '<button onclick="go(-1)" '+(i===0?'disabled':'')+'>Prev</button>';
    if (i === qs.length-1) {
      html += '<button onclick="finishQuiz()">See Results &rarr;</button>';
    } else {
      html += '<button onclick="go(1)">Next</button>';
    }
    html += '</div>';
    document.getElementById('quiz-area').innerHTML = html;
    updateNav();
  }

  function pick(oi){
    var i = state.idx;
    if (state.answers[i] !== undefined) return;
    state.answers[i] = oi;
    saveState();
    render();
  }
  function go(dir){
    var ni = state.idx + dir;
    if (ni < 0 || ni > qs.length-1) return;
    state.idx = ni;
    saveState();
    render();
  }
  function goToQ(i){
    state.idx = i;
    state.showResults = false;
    saveState();
    render();
  }
  function finishQuiz(){
    state.showResults = true;
    saveState();
    bumpAttempt();
    renderResults();
  }

  function renderResults(){
    document.getElementById('quiz-area').style.display = 'none';
    var area = document.getElementById('results-area');
    area.style.display = 'block';
    var correct = 0;
    qs.forEach(function(q,i){ if (state.answers[i] === q.ci) correct++; });
    var html = '<div class="card results-card">';
    html += '<div>Your Score</div>';
    html += '<div class="score-big">'+correct+' / '+qs.length+'</div>';
    html += '<div style="margin-bottom:16px;color:#888;font-size:0.85rem;">SAT Grammar &middot; 2026-06-20</div>';
    html += '<button id="retryWrongBtn" onclick="retryWrong()">Retry Wrong Ones</button>';
    html += '<button class="res-btn-copy" onclick="copyRes()">Copy All Results</button>';
    html += '<button class="res-btn-fresh" onclick="openFreshModal()">Start Fresh</button>';
    html += '</div>';
    area.innerHTML = html;
    updateNav();
  }

  function retryWrong(){
    var wrong = [];
    qs.forEach(function(q,i){
      if (state.answers[i] !== undefined && state.answers[i] !== q.ci) wrong.push(i);
    });
    wrong.forEach(function(i){ delete state.answers[i]; });
    if (wrong.length > 0) {
      state.idx = wrong[0];
      state.showResults = false;
      saveState();
      render();
    }
  }

  function copyRes(){
    var lines = ['[Sion] SAT Grammar - 2026-06-20'];
    var correct = 0;
    qs.forEach(function(q,i){
      var ok = state.answers[i] === q.ci;
      if (ok) correct++;
      lines.push((i+1)+'. '+q.tag+' - '+(ok?'Correct':'Incorrect'));
    });
    lines.push('Score: '+correct+' / '+qs.length);
    var text = lines.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){
        alert('Results copied to clipboard.');
      }).catch(function(){ alert(text); });
    } else {
      alert(text);
    }
  }

  function openFreshModal(){
    document.getElementById('modal-overlay').style.display = 'flex';
  }
  function closeFreshModal(){
    document.getElementById('modal-overlay').style.display = 'none';
  }
  function confirmFresh(){
    state = { idx:0, answers:{}, showResults:false };
    saveState();
    closeFreshModal();
    render();
  }

  window.pick = pick;
  window.go = go;
  window.goToQ = goToQ;
  window.finishQuiz = finishQuiz;
  window.retryWrong = retryWrong;
  window.copyRes = copyRes;
  window.openFreshModal = openFreshModal;
  window.closeFreshModal = closeFreshModal;
  window.confirmFresh = confirmFresh;
  window.toggleJump = toggleJump;

  loadState();
  render();
})();
</script>
</body>
</html>
