<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261103";
var RAW_QUESTIONS = [{"stem": "The argument over the last slice of pizza started small, but it began to ______ until both brothers were shouting.", "opts": ["recede", "escalate", "diminish", "reconcile"], "ci": 1, "exp": "<i>escalate</i> (v.) to grow bigger, worse, or more serious. <i>The teacher stepped in before the argument could <b>escalate</b>.</i> Family: escalation (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The old lighthouse keeper lived a <b>solitary</b> life on the rocky island, sometimes going weeks without seeing another person.<br><br>Which word means the <b>OPPOSITE</b> of <b>solitary</b> as it is used in the sentence?", "opts": ["social", "lonely", "peaceful", "isolated"], "ci": 0, "exp": "<i>solitary</i> (adj.) alone or living alone. The opposite is <i>social</i>, which means spending time with others. <i>Lonely</i> and <i>isolated</i> mean almost the same as solitary. <i>A <b>solitary</b> wolf wandered away from its pack.</i>", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Every morning, students stand and face the flag to say the Pledge of <b>Allegiance</b>, promising to be faithful to their country.<br><br>What does <b>allegiance</b> mean in this sentence?", "opts": ["respect for older people in a family", "loyalty to a person, group, or country", "the right to vote in an election", "a song that celebrates a holiday"], "ci": 1, "exp": "<i>allegiance</i> (n.) loyalty to a person, group, or country. <i>The knights swore <b>allegiance</b> to their king.</i> Family: ally (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "At the end of the meeting, the students made a <b>declaration</b> that their class would pick up litter every Friday, and they all signed it.<br><br>What does <b>declaration</b> mean in this sentence?", "opts": ["an official or public statement", "a quiet promise kept secret from others", "a short vote to choose a leader", "a list of questions for the teacher"], "ci": 0, "exp": "<i>declaration</i> (n.) an official or public statement. <i>The <b>Declaration</b> of Independence announced that the colonies were free.</i> Family: declare (v.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Inside the old clock, a <b>mechanism</b> of tiny gears and springs turns the hands so they move one minute at a time.<br><br>What does <b>mechanism</b> mean in this sentence?", "opts": ["a loud sound made when a machine starts", "a small tool used to repair broken machines", "a careful plan for fixing a problem", "a set of moving parts that work together to do a job"], "ci": 3, "exp": "<i>mechanism</i> (n.) a set of moving parts that work together to do a job. <i>The bike's brake <b>mechanism</b> squeezes the wheel to stop it.</i> Family: mechanical (adj.), mechanic (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "When Grandma asked if I liked her very spicy soup, I gave a <b>diplomatic</b> answer: “The flavor is really bold!”<br><br>Which meaning of <b>diplomatic</b> is used in this sentence?", "opts": ["working in an embassy in another country", "following strict rules about manners at dinner", "careful not to hurt someone's feelings", "having to do with relations between countries"], "ci": 2, "exp": "<i>diplomatic</i> (adj.) has two main meanings: having to do with talks between countries, or careful and polite so you don't upset someone. Here it means careful and polite. <i>The two nations held <b>diplomatic</b> talks.</i> Family: diplomacy (n.), diplomat (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The coach warned the team not to judge the new player before seeing him play, because <b>prejudice</b> can keep us from seeing what someone can really do.<br><br>What does <b>prejudice</b> mean in this sentence?", "opts": ["a reward given for working hard", "a rule that every player must follow", "an unfair opinion formed without knowing the facts", "a strong feeling of being nervous before a game"], "ci": 2, "exp": "<i>prejudice</i> (n.) an unfair opinion about someone formed before you know the facts. <i>Getting to know people helps us overcome <b>prejudice</b>.</i> Family: prejudiced (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Scientists warn that if people ______ the hillside, heavy rains will wash the soil away.", "opts": ["deforestation", "deforested", "forestry", "deforest"], "ci": 3, "exp": "After <i>people</i>, the blank needs a present-tense verb, so <i>deforest</i> is correct. <i>deforestation</i> (n.) the cutting down of large areas of trees. <i><b>Deforestation</b> takes away animals' homes.</i> Family: forest (n.), deforest (v.), deforestation (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "After the storm, the Red Cross set up a <b>distribution</b> center where workers handed out water, blankets, and food to every family that came.<br><br>What does <b>distribution</b> mean in this sentence?", "opts": ["the act of giving or sharing things out to many people", "the act of storing supplies for later", "the act of building a shelter", "the act of collecting money for a cause"], "ci": 0, "exp": "<i>distribution</i> (n.) the act of giving or sharing things out among many people. <i>The <b>distribution</b> of report cards happens on Friday.</i> Family: distribute (v.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Over the summer, volunteers worked to <b>transform</b> the empty, weedy lot into a bright garden full of vegetables and flowers.<br><br>What does <b>transform</b> mean in this sentence?", "opts": ["to protect something from harm", "to change something completely", "to move something to another place", "to clean something quickly"], "ci": 1, "exp": "<i>transform</i> (v.) to change something completely in form or appearance. <i>A caterpillar will <b>transform</b> into a butterfly.</i> Family: transformation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "As the train sped past the forest, I caught a <b>glimpse</b> of a deer before the trees hid it again.<br><br>What does <b>glimpse</b> mean in this sentence?", "opts": ["a quick look at something", "a long, careful study of something", "a loud call to get attention", "a clear photograph of something"], "ci": 0, "exp": "<i>glimpse</i> (n.) a quick, short look at something. <i>We got a <b>glimpse</b> of the singer as her car drove by.</i> Family: glimpse (v.) to see something for a moment", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Houses near the coast are built on tall posts so they can ______ the strong waves of a hurricane.", "opts": ["inhabit", "withstand", "generate", "conceal"], "ci": 1, "exp": "<i>withstand</i> (v.) to hold up against something strong without breaking. <i>The sturdy tent could <b>withstand</b> heavy rain.</i> Family: withstood (past tense)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Over many years, the small village began to <b>evolve</b>, slowly growing roads, shops, and a school.<br><br>Which word or phrase means the <b>OPPOSITE</b> of <b>evolve</b> as it is used in the sentence?", "opts": ["slowly grow", "develop", "stay the same", "get louder"], "ci": 2, "exp": "<i>evolve</i> (v.) to change and develop slowly over time. The opposite is to <i>stay the same</i>. <i>Develop</i> and <i>slowly grow</i> mean almost the same as evolve. <i>Phones have <b>evolved</b> a lot since your grandparents were young.</i> Family: evolution (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The town had three tiny libraries, so the council decided to <b>consolidate</b> them into one large library downtown.<br><br>What does <b>consolidate</b> mean in this sentence?", "opts": ["to close something for a short time", "to move something to a new town", "to combine several things into one", "to divide one thing into smaller parts"], "ci": 2, "exp": "<i>consolidate</i> (v.) to combine several things into one bigger, stronger thing. <i>Mom told me to <b>consolidate</b> my markers into one box.</i> Family: consolidation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Students voted to ______ the class rules by adding one new rule about cleaning up the art table.", "opts": ["amendable", "amended", "amendment", "amend"], "ci": 3, "exp": "After <i>to</i>, the blank needs a base verb, so <i>amend</i> is correct. <i>amendment</i> (n.) a change or addition to a law or rule. <i>The First <b>Amendment</b> protects freedom of speech.</i> Family: amend (v.), amendment (n.), amended (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The editor decided to ______ my first story because it was too long, but she said I could send a shorter one next month.", "opts": ["inhabit", "dedicate", "recommend", "reject"], "ci": 3, "exp": "<i>reject</i> (v.) to refuse to accept something. <i>The vending machine will <b>reject</b> a torn dollar bill.</i> Family: rejection (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Showing great <b>compassion</b>, Maya sat with the crying kindergartner and helped him find his lost backpack.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>compassion</b>?", "opts": ["courage", "kindness", "patience", "cruelty"], "ci": 1, "exp": "<i>compassion</i> (n.) caring about someone who is hurting and wanting to help. <i>Kindness</i> is closest. <i>Cruelty</i> is the opposite. <i>The nurse treated every patient with <b>compassion</b>.</i> Family: compassionate (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "After reading the long chapter, our teacher asked us to ______ it in just three sentences, telling only the most important events.", "opts": ["navigate", "exaggerate", "summarize", "manufacture"], "ci": 2, "exp": "<i>summarize</i> (v.) to tell the most important ideas in a short way. <i>Can you <b>summarize</b> the movie without giving away the ending?</i> Family: summary (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The pilot spoke over the speaker to <b>assure</b> the passengers that the bumpy air was normal and the plane was safe.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>assure</b>?", "opts": ["question", "worry", "warn", "promise"], "ci": 3, "exp": "<i>assure</i> (v.) to tell someone something firmly so they stop worrying. <i>Promise</i> is closest. <i>Worry</i> is the opposite. <i>I <b>assure</b> you the dog is friendly.</i> Family: assurance (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Before the big election in November, each party holds a <b>primary</b> so voters can choose which candidate will run.<br><br>Which meaning of <b>primary</b> is used in this sentence?", "opts": ["an election to choose a party's candidate", "first in order or time", "describing the basic colors red, yellow, and blue", "most important; main"], "ci": 0, "exp": "<i>primary</i> has several meanings: (adj.) main or most important; (adj.) first in time or order; (n.) an election in which a party chooses its candidate. Here it is the election meaning. <i>Our <b>primary</b> goal is to finish the project.</i>", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
