<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Vocabulary</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.date-hd{text-align:center;font-size:2rem;font-weight:800;color:#185FA5;padding:6px 0;}
.title-hd{text-align:center;font-size:1.3rem;font-weight:700;margin:4px 0 2px;color:#111;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
.attempts-hd{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;}
.q-word{font-size:2rem;font-weight:800;color:#185FA5;text-align:center;margin:10px 0 4px;}
.speak-wrap{text-align:center;margin-bottom:6px;}
.speak-btn{background:#e8edf4;border:none;border-radius:20px;padding:6px 18px;font-size:0.88rem;cursor:pointer;color:#185FA5;font-weight:600;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;text-align:center;}
.q-context{font-size:0.93rem;color:#444;background:#f5f7fa;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-style:italic;line-height:1.5;}
.opt-btn{display:block;width:100%;padding:11px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.93rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.6;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
</style>
</head>
<body>
<div class="date-hd">2026-06-16</div>
<div class="title-hd">[Sion] SAT Vocabulary</div>
<div class="instruction">Choose the best meaning for the word shown.</div>
<div class="attempts-hd" id="att-display">Total Attempts: 0</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / 15</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;">Jump ▾</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div class="q-num" id="q-num"></div>
  <div class="q-word" id="q-word"></div>
  <div class="speak-wrap"><button class="speak-btn" onclick="speak()">Listen</button></div>
  <div class="q-context" id="q-context"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#185FA5;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){
var QUIZ_KEY='quiz_satvocab_15_20260615_v1';
var ATT_KEY='quiz_satvocab_att_20260615_v1';
var TTS_LANG='en-US';

var qs=[
 {word:'abstain',
  ctx:'During the diet, she chose to abstain from sugar entirely.',
  opts:['to consume in large quantities',
        'to refrain voluntarily from doing something',
        'to increase one\'s intake gradually',
        'to substitute one food for another'],
  ci:1,exp:'"Abstain" means to deliberately refrain from something. A person on a diet abstains from certain foods by choosing not to consume them.'},
 {word:'absolution',
  ctx:'After confessing his mistake, the young man sought absolution from those he had wronged.',
  opts:['formal punishment for a serious offense',
        'a written record of wrongdoing',
        'official forgiveness or release from guilt or blame',
        'a long delay before judgment is rendered'],
  ci:2,exp:'"Absolution" is formal forgiveness or release from guilt. In the sentence, the young man seeks to be released from blame by those he hurt.'},
 {word:'abstruse',
  ctx:'The philosopher\'s argument was so abstruse that even her graduate students struggled to follow it.',
  opts:['widely understood and immediately clear to everyone',
        'unnecessarily long and repetitive in style',
        'emotionally charged and deeply controversial',
        'difficult to understand; obscure and complex'],
  ci:3,exp:'"Abstruse" describes something that is hard to comprehend due to its complexity or obscurity. Graduate students struggling to follow it shows the idea is not accessible to even advanced learners.'},
 {word:'accede',
  ctx:'After hours of negotiation, the union agreed to accede to the company\'s final offer.',
  opts:['to reject firmly and without explanation',
        'to postpone a decision indefinitely',
        'to agree to or comply with a request or demand',
        'to demand additional compensation before proceeding'],
  ci:2,exp:'"Accede" means to agree to or go along with a request. After negotiation, the union accepted (acceded to) the offer.'},
 {word:'accolade',
  ctx:'Winning the Nobel Prize is one of the highest accolades a scientist can receive.',
  opts:['an award or honor given in recognition of achievement',
        'a severe criticism or public rebuke',
        'a lengthy and demanding examination process',
        'a financial penalty for failing to meet standards'],
  ci:0,exp:'"Accolade" is an award, honor, or expression of praise. The Nobel Prize is cited as one of the highest such honors for scientists.'},
 {word:'acquiesce',
  ctx:'Though she disagreed with the decision, she acquiesced rather than start an argument.',
  opts:['to protest loudly and persistently until heard',
        'to accept something without protest, even if reluctantly',
        'to withdraw from a situation entirely',
        'to argue persuasively until others agree with you'],
  ci:1,exp:'"Acquiesce" means to accept or go along with something passively, without actively agreeing or resisting. She chose not to argue despite her disagreement.'},
 {word:'acerbic',
  ctx:'The critic was known for his acerbic wit, which often left performers stung by his reviews.',
  opts:['gentle and encouraging in tone',
        'long-winded and unnecessarily detailed',
        'sharp, biting, and harshly critical',
        'humorous and lighthearted in nature'],
  ci:2,exp:'"Acerbic" describes a sharp, cutting, or bitter quality—especially in speech or writing. Reviews that leave performers "stung" suggest a sharp and hurtful style.'},
 {word:'acrimony',
  ctx:'The divorce was filled with acrimony, as neither party could agree on even the smallest details.',
  opts:['great generosity and lasting goodwill between parties',
        'bitterness and ill feeling between people',
        'careful planning and methodical preparation',
        'a formal legal agreement between two parties'],
  ci:1,exp:'"Acrimony" is bitterness or hostility between people. A contentious divorce where even small matters become disputes reflects deep acrimony.'},
 {word:'acumen',
  ctx:'Her financial acumen allowed her to spot profitable investments that others had overlooked.',
  opts:['a natural lack of confidence in decision-making',
        'formal training received at a prestigious institution',
        'the ability to make sharp, sound judgments quickly',
        'an overly cautious approach to taking risks'],
  ci:2,exp:'"Acumen" is keenness of insight or the ability to make quick, sound judgments. Spotting investments others missed demonstrates exceptional financial acumen.'},
 {word:'adamant',
  ctx:'The coach was adamant that the team practice every day, regardless of the weather.',
  opts:['flexible and open to many different approaches',
        'uncertain and easily swayed by the opinions of others',
        'enthusiastic but inconsistent in following through',
        'firm and absolutely unwilling to change one\'s position'],
  ci:3,exp:'"Adamant" means refusing to be persuaded or to change one\'s mind. The coach\'s insistence on daily practice regardless of weather shows an inflexible stance.'},
 {word:'admonish',
  ctx:'The judge admonished the witness to answer only what was asked, without elaborating.',
  opts:['to praise highly and publicly',
        'to ignore completely and without comment',
        'to firmly warn or reprimand someone',
        'to request politely with great formality'],
  ci:2,exp:'"Admonish" means to warn or scold someone firmly but not harshly. The judge\'s firm instruction to the witness is a form of admonishment.'},
 {word:'adroit',
  ctx:'The negotiator was adroit at finding compromises that satisfied both sides of the dispute.',
  opts:['clumsy and prone to making frequent errors',
        'overly aggressive and unnecessarily confrontational',
        'skillful and clever, especially in difficult situations',
        'hesitant and slow to act when under pressure'],
  ci:2,exp:'"Adroit" means skilled or clever, especially at handling difficult matters with ease. Successfully finding compromises that please both parties is an adroit achievement.'},
 {word:'adulation',
  ctx:'The young pop star was overwhelmed by the adulation of thousands of fans.',
  opts:['harsh criticism from professional reviewers',
        'excessive admiration and flattery from others',
        'polite but distant public acknowledgment',
        'financial compensation for an artistic performance'],
  ci:1,exp:'"Adulation" is excessive admiration or flattery. Thousands of adoring fans showering a celebrity with praise is a classic example of adulation.'},
 {word:'adverse',
  ctx:'The hikers had to turn back due to adverse weather conditions on the mountain.',
  opts:['ideal and perfectly suited for outdoor activity',
        'surprisingly mild and unusually pleasant',
        'unfavorable, harmful, or working against success',
        'temporary and expected to improve very soon'],
  ci:2,exp:'"Adverse" means preventing success or development; harmful or unfavorable. Weather that forces hikers to abandon their trip is adverse—it works against their goal.'},
 {word:'affable',
  ctx:'The new principal was affable and always made time to chat with students in the hallway.',
  opts:['strict and constantly demanding of perfect behavior',
        'reserved and generally difficult to approach',
        'overly formal and stiff in all social situations',
        'friendly, warm, and easy to talk to'],
  ci:3,exp:'"Affable" describes someone who is friendly, pleasant, and approachable. A principal who chats easily with students in the hallway is an affable person.'}
];

var state={};
function loadState(){try{var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<qs.length&&s.answers&&s.shuffles)state=s;else resetState();}catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}}
function resetState(){state={cur:0,answers:{},shuffles:{},showResults:false};}
function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}
function getShuffle(i){if(!state.shuffles[i]){var a=[0,1,2,3];for(var k=3;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}state.shuffles[i]=a;saveState();}return state.shuffles[i];}
function getCSI(i){return getShuffle(i).indexOf(qs[i].ci);}
function loadAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0',10);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function speak(){var q=qs[state.cur];var u=new SpeechSynthesisUtterance(q.word);u.lang=TTS_LANG;speechSynthesis.speak(u);}
function updateNav(){var ans=Object.keys(state.answers).length;document.getElementById('nav-count').textContent=ans+' / '+qs.length;document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';var p=document.getElementById('dot-panel');if(p.style.display!=='none')renderDots();}
function toggleJump(){var p=document.getElementById('dot-panel');var b=document.getElementById('jump-btn');if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}else{p.style.display='none';b.textContent='Jump ▾';}}
function renderDots(){var p=document.getElementById('dot-panel');var h='';for(var i=0;i<qs.length;i++){var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===getCSI(i)?'#185FA5':'#E24B4A');h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';}if(Object.keys(state.answers).length===qs.length){h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';}p.innerHTML=h;}
function goToQ(i){state.cur=i;state.showResults=false;saveState();render();document.getElementById('dot-panel').style.display='none';document.getElementById('jump-btn').textContent='Jump ▾';}
function showResults(){state.showResults=true;localStorage.setItem(ATT_KEY,loadAtt()+1);saveState();render();}
function render(){
  document.getElementById('att-display').textContent='Total Attempts: '+loadAtt();
  if(state.showResults){renderResults();return;}
  document.getElementById('quizArea').style.display='block';document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur;var q=qs[i];
  document.getElementById('q-num').textContent='Word '+(i+1)+' of '+qs.length;
  document.getElementById('q-word').textContent=q.word;
  document.getElementById('q-context').textContent=q.ctx;
  var sh=getShuffle(i);var ans=state.answers[i];var csi=getCSI(i);
  var html='';
  for(var s=0;s<4;s++){var oi=sh[s];var cls='opt-btn';var dis='';if(ans!==undefined){dis='disabled ';if(s===csi)cls+=' correct';else if(s===ans)cls+=' wrong';}html+='<button class="'+cls+'" '+dis+'onclick="pick('+i+','+s+')">'+esc(q.opts[oi])+'</button>';}
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');
  if(ans!==undefined&&ans!==csi){eb.style.display='block';eb.textContent=q.exp;}else{eb.style.display='none';}
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.querySelector('.prev-btn').disabled=(i===0);
}
function renderResults(){
  document.getElementById('quizArea').style.display='none';document.getElementById('resultsArea').style.display='block';updateNav();
  var c=0,w=0,sk=0;for(var i=0;i<qs.length;i++){if(state.answers[i]===undefined)sk++;else if(state.answers[i]===getCSI(i))c++;else w++;}
  document.getElementById('results-summary').innerHTML='<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';for(var i=0;i<qs.length;i++){var a=state.answers[i];var label,bg,tc;if(a===undefined){label='Skipped';bg='#d7dde6';tc='#555';}else if(a===getCSI(i)){label='Correct';bg='#E1F5EE';tc='#085041';}else{label='Wrong';bg='#FCEBEB';tc='#501313';}html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;color:#333;">'+esc(qs[i].word)+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';}
  document.getElementById('results-cards').innerHTML=html;
}
function pick(qi,si){if(state.answers[qi]!==undefined)return;state.answers[qi]=si;saveState();render();}
function go(dir){if(dir===1&&state.cur===qs.length-1){showResults();return;}state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));saveState();render();}
function retryWrong(){var first=-1;for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==getCSI(i)){if(first===-1)first=i;delete state.answers[i];}}if(first!==-1){state.cur=first;state.showResults=false;saveState();render();}}
function copyRes(){var lines=['[Sion] SAT Vocabulary - Results (2026-06-16)'];for(var i=0;i<qs.length;i++){var a=state.answers[i];var label=a===undefined?'Skipped':(a===getCSI(i)?'Correct':'Wrong');lines.push((i+1)+'. '+qs[i].word+': '+label);}var txt=lines.join('\n');if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);});}else fallbackCopy(txt);}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){document.getElementById('freshModal').style.display='none';localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();}

window.pick=pick;window.go=go;window.goToQ=goToQ;window.toggleJump=toggleJump;
window.speak=speak;window.retryWrong=retryWrong;window.copyRes=copyRes;
window.openFreshModal=openFreshModal;window.confirmFresh=confirmFresh;window.showResults=showResults;

loadState();saveState();render();
})();
</script>
</body>
</html>
