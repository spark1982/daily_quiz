<style>

.timer-start-btn { background: #185FA5; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }

.timer-label { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.02em; }
.timer-display { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }

.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:16px;}

.copy-btn{background:#185FA5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.save-btn{background:#f5a623;color:#fff;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;}
.fresh-btn{background:#e8edf4;color:#111;border:none;padding:13px;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;}

.modal-cancel{background:#e8edf4;color:#333;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;cursor:pointer;}
.modal-confirm{background:#E24B4A;color:#fff;border:none;padding:9px 20px;border-radius:8px;font-size:0.93rem;font-weight:600;cursor:pointer;}
</style>
</head>

</div>
<script>var TITLE = "[Grant] Advanced Vocabulary";var QUIZ_KEY = "quiz_grantvocab_20_20260918_v1";var ATT_KEY = "quiz_grantvocab_20_att_20260918_v1";var RAW_QUESTIONS = [{"stem": "factor", "opts": ["a formal written record of daily events", "a sudden unexpected event that causes fear", "a person hired to represent a company abroad", "one of several things that contribute to a result, or a number that divides another number exactly"], "ci": 3, "exp": "\"factor\" means: one of several things that contribute to a result, or a number that divides another number exactly.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "heritage", "opts": ["a scientific method used to measure age", "a legal document listing a person's belongings", "the traditions, achievements, and beliefs that are part of the history of a group or nation", "the process of moving to a new country permanently"], "ci": 2, "exp": "\"heritage\" means: the traditions, achievements, and beliefs that are part of the history of a group or nation.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "hypothesis", "opts": ["a formal complaint filed with an official", "a final conclusion that has been proven true beyond doubt", "a detailed record of past experiments", "an idea or explanation proposed as a starting point for further investigation, not yet proven"], "ci": 3, "exp": "\"hypothesis\" means: an idea or explanation proposed as a starting point for further investigation, not yet proven.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "governance", "opts": ["the physical building where officials work", "the way in which an organization, country, or system is controlled and its rules are set and applied", "a formal ceremony to celebrate a new leader", "the total amount of money a government spends in one year"], "ci": 1, "exp": "\"governance\" means: the way in which an organization, country, or system is controlled and its rules are set and applied.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "relevant", "opts": ["extremely rare and difficult to find", "closely connected to the matter being discussed", "occurring only under specific weather conditions", "officially certified by a government agency"], "ci": 1, "exp": "\"relevant\" means: closely connected to the matter being discussed.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "classification", "opts": ["the act of destroying documents that are no longer needed", "a formal ceremony held to honor an achievement", "the process of translating spoken words into writing", "the act of arranging things into groups or categories based on shared characteristics"], "ci": 3, "exp": "\"classification\" means: the act of arranging things into groups or categories based on shared characteristics.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "assign", "opts": ["to combine two separate teams into one", "to remove someone from a position of responsibility", "to give a specific task, duty, or role to someone", "to sign a legal document on someone else's behalf"], "ci": 2, "exp": "\"assign\" means: to give a specific task, duty, or role to someone.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "enforce", "opts": ["to make sure a law, rule, or requirement is obeyed", "to permanently remove a rule from a system", "to translate a rule into another language", "to gently suggest a possible course of action"], "ci": 0, "exp": "\"enforce\" means: to make sure a law, rule, or requirement is obeyed.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "conclude", "opts": ["to decide something is true after considering the facts, or to bring something to an end", "to postpone a decision until more information arrives", "to disagree strongly with a previously stated fact", "to repeat an experiment under different conditions"], "ci": 0, "exp": "\"conclude\" means: to decide something is true after considering the facts, or to bring something to an end.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "landscape", "opts": ["a legal boundary between two properties", "a detailed map used for navigation at sea", "a large area of land with its natural or human-made features as seen from a distance, or the general state of a field or situation", "a formal painting technique using only dark colors"], "ci": 2, "exp": "\"landscape\" means: a large area of land with its natural or human-made features as seen from a distance, or the general state of a field or situation.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "adapt", "opts": ["to change one's behavior or something else in order to suit new conditions", "to officially approve a new law", "to translate a text word for word", "to strongly criticize an idea in public"], "ci": 0, "exp": "\"adapt\" means: to change one's behavior or something else in order to suit new conditions.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "undergo", "opts": ["to place an object underneath another", "to give up control of something to another person", "to secretly plan something without others knowing", "to experience or be subjected to a process, change, or test"], "ci": 3, "exp": "\"undergo\" means: to experience or be subjected to a process, change, or test.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "anonymity", "opts": ["the ability to change one's physical appearance at will", "the state of being extremely famous and widely recognized", "the process of legally changing one's name", "the state of being unknown or unnamed to most people"], "ci": 3, "exp": "\"anonymity\" means: the state of being unknown or unnamed to most people.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "distribution", "opts": ["the way in which something is shared out or spread among a group or area", "the process of shrinking an object to a smaller size", "the study of how languages change over centuries", "a formal apology issued after a mistake"], "ci": 0, "exp": "\"distribution\" means: the way in which something is shared out or spread among a group or area.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "widespread", "opts": ["kept secret from most people on purpose", "extremely expensive to produce or maintain", "existing or happening in many places, or among many people", "limited to a single small area or a short period of time"], "ci": 2, "exp": "\"widespread\" means: existing or happening in many places, or among many people.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "conform", "opts": ["to behave according to socially expected standards or to comply with rules or norms", "to invent a brand-new solution to a problem", "to formally cancel a plan that has already begun", "to openly rebel against authority figures"], "ci": 0, "exp": "\"conform\" means: to behave according to socially expected standards or to comply with rules or norms.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "validate", "opts": ["to check or prove that something is accurate, well-founded, or officially acceptable", "to translate a document into another language", "to reject a claim without offering any explanation", "to combine several smaller items into a single unit"], "ci": 0, "exp": "\"validate\" means: to check or prove that something is accurate, well-founded, or officially acceptable.", "tag": "Review", "tagcolor": "#f5a623"}, {"stem": "exclude", "opts": ["to include every possible option available", "to repeat a statement for emphasis", "to reduce the price of an item significantly", "to deliberately leave someone or something out"], "ci": 3, "exp": "\"exclude\" means: to deliberately leave someone or something out.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "alternate", "opts": ["occurring or existing by turns, one after another; also, a substitute", "happening only once in a lifetime", "completely identical to something else in every way", "permanently broken or unusable"], "ci": 0, "exp": "\"alternate\" means: occurring or existing by turns, one after another; also, a substitute.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "annotation", "opts": ["a total sum calculated from several numbers", "a note added to a text or diagram to explain or comment on it", "a formal announcement made to a large audience", "a legal punishment for breaking a rule"], "ci": 1, "exp": "\"annotation\" means: a note added to a text or diagram to explain or comment on it.", "tag": "New", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }
  var clabel = document.getElementById('context-label');
  if(clabel){ if(q.contextLabel){ clabel.style.display='block'; clabel.textContent = q.contextLabel; } else { clabel.style.display='none'; } }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(hintBtn && hintBox){
    hintShown = false;
    hintBox.classList.remove('show');
    if(q.hint){ hintBtn.style.display='inline-block'; hintBtn.textContent='Show Hint'; hintBox.innerHTML = q.hint; }
    else { hintBtn.style.display='none'; }
  }

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}
var hintShown=false;
function toggleHint(){hintShown=!hintShown; var b=document.getElementById('hint-btn'),x=document.getElementById('hint-box'); if(hintShown){x.classList.add('show'); b.textContent='Hide Hint';} else {x.classList.remove('show'); b.textContent='Show Hint';}}
window.toggleHint=toggleHint;

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
