<script>var TITLE = "[Sion] Algebra 2";var QUIZ_KEY = "quiz_sionalgebra2_10_20260829_v1";var ATT_KEY = "quiz_sionalgebra2_10_att_20260829_v1";var RAW_QUESTIONS = [{"stem": "Which equation represents the graph of f(x) = x&sup2; after it is shifted 3 units right and 2 units down?<br><svg width=\"220\" height=\"180\" viewBox=\"0 0 220 180\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"90\" x2=\"210\" y2=\"90\" stroke=\"#999\" stroke-width=\"1\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/><path d=\"M 40 20 Q 145 170 205 30\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"2.5\"/><circle cx=\"145\" cy=\"150\" r=\"4\" fill=\"#E24B4A\"/><text x=\"145\" y=\"168\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\">(3, &minus;2)</text><text x=\"70\" y=\"24\" font-size=\"10\" fill=\"#666\">y</text><text x=\"200\" y=\"102\" font-size=\"10\" fill=\"#666\">x</text></svg>", "opts": ["g(x) = (x &minus; 3)&sup2; + 2", "g(x) = (x + 3)&sup2; &minus; 2", "g(x) = (x &minus; 3)&sup2; &minus; 2", "g(x) = (x &minus; 2)&sup2; &minus; 3"], "ci": 2, "exp": "Shifting right by h units replaces x with (x &minus; h), and shifting down by k units subtracts k from the whole function. Shifting 3 right and 2 down gives g(x) = (x &minus; 3)&sup2; &minus; 2, matching the vertex at (3, &minus;2) shown in the graph.", "tag": "Quadratic Functions - Vertex Form & Transformations", "tagcolor": "#185FA5"}, {"stem": "Evaluate: log<sub>3</sub>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span>)", "opts": ["2", "&minus;3", "9", "&minus;2"], "ci": 3, "exp": "Rewrite <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span> as 3<sup>&minus;2</sup>, since 3<sup>&minus;2</sup> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span>. So log<sub>3</sub>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span>) = log<sub>3</sub>(3<sup>&minus;2</sup>) = &minus;2.", "tag": "Logarithm Evaluation", "tagcolor": "#185FA5"}, {"stem": "Multiply: (x + 3)(x&sup2; &minus; 2x + 4)", "opts": ["x&sup3; &minus; x&sup2; + 2x + 12", "x&sup3; + x&sup2; &minus; 2x + 12", "x&sup3; + 5x&sup2; &minus; 2x + 12", "x&sup3; + x&sup2; + 2x + 12"], "ci": 1, "exp": "Distribute each term: x(x&sup2; &minus; 2x + 4) = x&sup3; &minus; 2x&sup2; + 4x, and 3(x&sup2; &minus; 2x + 4) = 3x&sup2; &minus; 6x + 12. Adding these gives x&sup3; + (&minus;2x&sup2; + 3x&sup2;) + (4x &minus; 6x) + 12 = x&sup3; + x&sup2; &minus; 2x + 12.", "tag": "Polynomial Function Operations", "tagcolor": "#185FA5"}, {"stem": "Classify the conic section given by the equation x&sup2; &minus; 4y&sup2; = 16.", "opts": ["Parabola", "Hyperbola", "Ellipse", "Circle"], "ci": 1, "exp": "When the x&sup2; and y&sup2; terms have opposite signs, as in x&sup2; &minus; 4y&sup2; = 16, the equation represents a hyperbola. An ellipse or circle requires both squared terms to have the same sign, and a parabola has only one squared variable.", "tag": "Conic Classification", "tagcolor": "#185FA5"}, {"stem": "Solve the inequality: |2x &minus; 5| &le; 7<br><svg width=\"240\" height=\"70\" viewBox=\"0 0 240 70\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"35\" x2=\"230\" y2=\"35\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"35\" r=\"5\" fill=\"#185FA5\" stroke=\"#185FA5\" stroke-width=\"2\"/><text x=\"70\" y=\"55\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">&minus;1</text><circle cx=\"180\" cy=\"35\" r=\"5\" fill=\"#185FA5\" stroke=\"#185FA5\" stroke-width=\"2\"/><text x=\"180\" y=\"55\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">6</text><line x1=\"70\" y1=\"35\" x2=\"180\" y2=\"35\" stroke=\"#1D9E75\" stroke-width=\"4\"/></svg>", "opts": ["&minus;6 &le; x &le; 1", "&minus;1 &le; x &le; 7", "&minus;1 &le; x &le; 6", "x &le; &minus;1 or x &ge; 6"], "ci": 2, "exp": "Since |2x &minus; 5| &le; 7 means &minus;7 &le; 2x &minus; 5 &le; 7, add 5 to all three parts to get &minus;2 &le; 2x &le; 12, then divide by 2 to get &minus;1 &le; x &le; 6, matching the shaded interval shown on the number line.", "tag": "Absolute Value Equations/Inequalities", "tagcolor": "#185FA5"}, {"stem": "If f(x) = 2x + 1 and g(x) = x&sup2; &minus; 3, find (f &#8728; g)(x).", "opts": ["2x&sup2; &minus; 5", "4x&sup2; + 4x &minus; 2", "2x&sup2; &minus; 6", "2x&sup2; &minus; 2"], "ci": 0, "exp": "(f &#8728; g)(x) means f(g(x)). Substitute g(x) = x&sup2; &minus; 3 into f: f(x&sup2; &minus; 3) = 2(x&sup2; &minus; 3) + 1 = 2x&sup2; &minus; 6 + 1 = 2x&sup2; &minus; 5. Note that 4x&sup2; + 4x &minus; 2 is actually (g &#8728; f)(x), the composition in the opposite order.", "tag": "Function Composition", "tagcolor": "#185FA5"}, {"stem": "Which angle measure between 0&deg; and 360&deg; is coterminal with &minus;100&deg;?", "opts": ["460&deg;", "260&deg;", "&minus;260&deg;", "100&deg;"], "ci": 1, "exp": "To find a coterminal angle between 0&deg; and 360&deg;, add 360&deg; to &minus;100&deg;: &minus;100&deg; + 360&deg; = 260&deg;, which lands in the required range.", "tag": "Coterminal Angles", "tagcolor": "#185FA5"}, {"stem": "Solve for x: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x</span><span style=\"border-top:1.4px solid #111;\">x &minus; 2</span></span> + 1 = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>6</span><span style=\"border-top:1.4px solid #111;\">x &minus; 2</span></span>", "opts": ["x = 4", "x = 2", "x = 3", "x = 6"], "ci": 0, "exp": "Multiply every term by (x &minus; 2) to clear denominators: x + (x &minus; 2) = 6, so 2x &minus; 2 = 6, giving 2x = 8 and x = 4. Checking x = 4 in the original denominators gives 4 &minus; 2 = 2, which is not zero, so x = 4 is valid (x = 2 would make the denominators zero and must always be excluded).", "tag": "Rational Equations - Solving", "tagcolor": "#185FA5"}, {"stem": "Convert f(x) = x&sup2; &minus; 6x + 5 to vertex form.<br><svg width=\"220\" height=\"180\" viewBox=\"0 0 220 180\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"150\" x2=\"210\" y2=\"150\" stroke=\"#999\" stroke-width=\"1\"/><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"170\" stroke=\"#999\" stroke-width=\"1\"/><path d=\"M 20 20 Q 130 175 200 30\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.5\"/><circle cx=\"130\" cy=\"150\" r=\"4\" fill=\"#E24B4A\"/><text x=\"130\" y=\"168\" font-size=\"11\" fill=\"#333\" text-anchor=\"middle\">(3, &minus;4)</text><text x=\"30\" y=\"24\" font-size=\"10\" fill=\"#666\">y</text><text x=\"200\" y=\"162\" font-size=\"10\" fill=\"#666\">x</text></svg>", "opts": ["f(x) = (x &minus; 6)&sup2; &minus; 4", "f(x) = (x &minus; 3)&sup2; &minus; 4", "f(x) = (x &minus; 3)&sup2; + 4", "f(x) = (x + 3)&sup2; &minus; 4"], "ci": 1, "exp": "Complete the square: x&sup2; &minus; 6x + 5 = (x&sup2; &minus; 6x + 9) &minus; 9 + 5 = (x &minus; 3)&sup2; &minus; 4, matching the vertex at (3, &minus;4) shown in the graph.", "tag": "Quadratic Functions - Standard to Vertex Form", "tagcolor": "#185FA5"}, {"stem": "Evaluate: 27<sup>2/3</sup>", "opts": ["18", "9", "729", "6"], "ci": 1, "exp": "27<sup>2/3</sup> means take the cube root of 27 first, then square the result: 27<sup>1/3</sup> = 3, and 3&sup2; = 9.", "tag": "Radical Expressions - Rational Exponents", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';

  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));

function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}

}

function renderTimer(){

    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
