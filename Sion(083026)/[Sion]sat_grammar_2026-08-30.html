<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_siongrammar_20_20260829_v1";var ATT_KEY = "quiz_siongrammar_20_att_20260829_v1";var RAW_QUESTIONS = [{"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The <u>committees</u> final recommendation, reached only after several subcommittees submitted conflicting reports, surprised even the board members who had proposed the review.", "opts": ["committee's", "committee's", "committees'", "committees"], "ci": 0, "exp": "\"committee's\" is the correct singular possessive, showing the recommendation belongs to one committee. \"committees\" is only plural, with no possessive meaning at all. Note that \"committee's\" also appears among the choices in a different form below; the version needed here has the apostrophe placed before the final s because \"committee\" is singular. \"committees'\" would be correct only if there were multiple committees sharing one recommendation, which the sentence does not describe.", "tag": "Apostrophes", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>Exhausted from weeks of rehearsal, the opening night performance nonetheless delighted the cast</u>.", "opts": ["Exhausted from weeks of rehearsal, the opening night performance nonetheless delighted the cast", "Exhausted from weeks of rehearsal, the cast's opening night performance was nonetheless delightful", "Having been exhausted from weeks of rehearsal, the opening night performance nonetheless delighted the cast", "Exhausted from weeks of rehearsal, the cast nonetheless delighted the audience on opening night"], "ci": 3, "exp": "The opening phrase \"Exhausted from weeks of rehearsal\" must modify the cast, so the noun right after the comma should be \"the cast.\" \"Exhausted...the cast nonetheless delighted the audience\" places \"the cast\" correctly. \"the opening night performance nonetheless delighted the cast\" places \"the performance\" right after the modifier, illogically suggesting the performance was exhausted. \"the cast's opening night performance was nonetheless delightful\" places \"the cast's,\" a possessive, right after the modifier rather than the cast itself, repeating the same problem. \"Having been exhausted...the opening night performance nonetheless delighted the cast\" repeats the same dangling-modifier error.", "tag": "Modifier Placement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The proposed merger<u>, which two board members had quietly opposed for months</u> was announced to shareholders without warning.", "opts": [", which two board members had quietly opposed for months,", "(which two board members had quietly opposed for months)", "which two board members had quietly opposed for months,", ", which two board members had quietly opposed for months"], "ci": 0, "exp": "A nonessential clause in the middle of a sentence needs a comma both before and after it. \", which two board members had quietly opposed for months,\" correctly closes off the clause on both sides. \", which two board members had quietly opposed for months\" is missing the closing comma before \"was.\" \"which two board members had quietly opposed for months,\" is missing the opening comma after \"merger.\" \"(which two board members had quietly opposed for months)\" uses parentheses instead of the comma pair the surrounding sentence structure calls for.", "tag": "Punctuation - Nonessential Clause", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>Weakened by decades of erosion, geologists have grown concerned about the cliffside's stability</u>.", "opts": ["Weakened by decades of erosion, the cliffside has become a growing concern to geologists", "Weakened by decades of erosion, the geologists' concern about the cliffside has grown", "Having been weakened by decades of erosion, geologists have grown concerned about the cliffside's stability", "Weakened by decades of erosion, geologists have grown concerned about the cliffside's stability"], "ci": 0, "exp": "The modifier \"Weakened by decades of erosion\" describes the cliffside, so the noun right after the comma should be \"the cliffside.\" \"Weakened...the cliffside has become a growing concern\" places \"the cliffside\" correctly. \"geologists have grown concerned\" places \"geologists\" right after the modifier, illogically suggesting the geologists were weakened by erosion. \"the geologists' concern about the cliffside has grown\" places \"the geologists',\" a possessive, right after the modifier rather than the cliffside itself, repeating the same problem. \"Having been weakened...geologists have grown concerned\" repeats the same dangling-modifier problem with a different opening verb form.", "tag": "Modifier Placement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The archive of handwritten letters, discovered inside crates that had sat untouched in the basement for generations, <u>reveal</u> details about the family's early years in the city.", "opts": ["reveal", "have revealed", "reveals", "are revealing"], "ci": 2, "exp": "The subject is the singular \"archive,\" not the plural \"crates\" or \"generations\" inside the intervening phrase, so the singular verb \"reveals\" is required. \"reveal\" pairs a singular subject with a plural verb. \"are revealing\" is a plural progressive form that still disagrees with the singular subject. \"have revealed\" is a plural present-perfect form with the same disagreement.", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The generator failed during the storm<u>, the hospital's backup systems activated within seconds.</u>", "opts": [", therefore the hospital's backup systems activated within seconds.", ", so the hospital's backup systems activated within seconds.", "; and the hospital's backup systems activated within seconds.", ", the hospital's backup systems activated within seconds."], "ci": 1, "exp": "Two independent clauses joined only by a comma create a comma splice, so the fix must add a coordinating conjunction like \"so\" to show the cause-and-effect relationship. \", the hospital's backup systems activated...\" keeps the original comma splice unfixed. \", therefore the hospital's backup systems activated...\" pairs a comma with \"therefore,\" which still creates a comma splice since \"therefore\" is not a coordinating conjunction. \"; and the hospital's backup systems activated...\" incorrectly combines a semicolon with the conjunction \"and,\" which is redundant punctuation for joining two clauses.", "tag": "Punctuation - Comma Splice", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The lab required exactly four pieces of equipment<u>,</u> a centrifuge, a microscope, a pipette set, and a scale.", "opts": [":", " -", ";", ","], "ci": 0, "exp": "A colon correctly introduces the list that explains what the four pieces of equipment were. A comma alone cannot introduce a list this way after a complete independent clause. A semicolon is used to join two independent clauses or separate complex list items, not to introduce a simple list. A single dash is not the conventional punctuation for introducing a list following a complete sentence here.", "tag": "Punctuation - Colon vs. Comma", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "Neither the coach nor the players <u>was</u> aware of the schedule change until the morning of the game.", "opts": ["has been", "is", "were", "was"], "ci": 2, "exp": "With \"neither...nor,\" the verb agrees with the closer subject, which here is the plural \"players,\" so the plural verb \"were\" is correct. \"was,\" \"is,\" and \"has been\" are all singular forms that don't agree with \"players.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "Each morning, the night-shift supervisor <u>compiled</u> an incident log and hands it to the day-shift manager.", "opts": ["was compiling", "compiles", "has compiled", "compiled"], "ci": 1, "exp": "Since the sentence describes a routine habit in the present tense, shown by \"hands,\" the first verb must also be present tense: \"compiles.\" \"compiled\" is past tense and breaks the tense consistency. \"has compiled\" and \"was compiling\" both introduce different tenses that don't match the simple present routine described by \"hands.\"", "tag": "Verb Tense Consistency", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The city council approved funding for the new transit line after years of delay. <u>However</u>, ridership on the existing bus routes climbed sharply within the first month of the announcement.", "opts": ["However", "Nevertheless", "In fact", "On the other hand"], "ci": 2, "exp": "The rise in ridership is an intensifying, supporting detail rather than a contradiction of the funding approval, so a transition like \"In fact\" fits best. \"However,\" \"Nevertheless,\" and \"On the other hand\" all signal contrast, but the two sentences do not present a contradiction.", "tag": "Transitions", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>In spite of the fact that</u> the vaccine required two separate doses, public health officials still considered the rollout a success.", "opts": ["In spite of the fact that", "Although", "Despite the fact that", "Regardless of the fact that"], "ci": 1, "exp": "\"Although\" conveys the same concessive meaning in a single concise word. \"In spite of the fact that,\" \"Despite the fact that,\" and \"Regardless of the fact that\" are all wordy phrases that express the same concessive meaning with unnecessary extra words.", "tag": "Concision", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "Successful negotiators aim to listen actively, to ask clarifying questions, and <u>staying calm under</u> pressure.", "opts": ["remain calm under", "staying calm under", "to stay calm under", "to remaining calm under"], "ci": 2, "exp": "To match \"to listen\" and \"to ask,\" the third item should also use the infinitive form: \"to stay calm under.\" \"staying calm under\" breaks the pattern by switching to a gerund. \"remain calm under\" drops the required \"to\" and no longer matches the infinitive pattern. \"to remaining calm under\" awkwardly combines the infinitive marker with a gerund, which is not a grammatical phrase.", "tag": "Parallel Structure", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "Economics, though often paired with mathematics in university course catalogs, <u>are</u> considered by many students to be more about human behavior than numbers.", "opts": ["were", "have been", "is", "are"], "ci": 2, "exp": "When \"economics\" refers to a single academic subject, it takes a singular verb: \"is.\" \"are,\" \"were,\" and \"have been\" all treat the word as a plural count noun, which doesn't match its use here as the name of one subject.", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The grant application required applicants to outline their research goals, <u>describing their prior fieldwork, and to list</u> potential funding partners.", "opts": ["to describe their prior fieldwork, and listing", "describing their prior fieldwork, and listing", "describing their prior fieldwork, and to list", "to describe their prior fieldwork, and to list"], "ci": 3, "exp": "All three items in the list must match the infinitive form of \"to outline.\" \"to describe their prior fieldwork, and to list\" keeps every item in the infinitive form. \"describing their prior fieldwork, and to list\" shifts the second item to a gerund. \"to describe their prior fieldwork, and listing\" shifts the third item to a gerund instead. \"describing their prior fieldwork, and listing\" breaks the pattern in two places at once.", "tag": "Parallel Structure", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "By the time the auditors finished reviewing the ledgers, the accountant <u>already corrects</u> the discrepancy from the previous quarter.", "opts": ["had already corrected", "already corrected", "already corrects", "has already corrected"], "ci": 0, "exp": "Because the correction happened before another past event (\"the auditors finished reviewing\"), the past-perfect \"had already corrected\" is required. \"already corrects\" is present tense and doesn't fit the past-tense sentence. \"already corrected\" is simple past, which doesn't show the action was completed before the auditors finished. \"has already corrected\" is present perfect, which doesn't fit a sentence anchored entirely in the past.", "tag": "Verb Tense Consistency", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "After the editor sent her draft back to the junior writer with extensive notes, <u>she</u> spent the entire weekend revising the piece.", "opts": ["she spent the entire weekend revising the piece", "the entire weekend was spent revising the piece", "the junior writer spent the entire weekend revising the piece", "the individual spent the entire weekend revising the piece"], "ci": 2, "exp": "\"she\" could refer to either the editor or the junior writer, so the sentence is ambiguous. \"the junior writer spent the entire weekend revising the piece\" resolves the ambiguity by naming a specific person. \"she\" keeps the vague pronoun. \"the individual\" is still vague, since either person in the sentence could be described that way. \"the entire weekend was spent revising the piece\" drops the actor entirely, leaving the sentence without a clear subject.", "tag": "Pronoun Reference", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "<u>Due to the fact that</u> the bridge remained closed for repairs, commuters were forced to take a longer route to work.", "opts": ["Because", "Owing to the fact that", "Due to the fact that", "In light of the fact that"], "ci": 0, "exp": "\"Because\" conveys the same causal meaning in a single concise word. \"Due to the fact that,\" \"Owing to the fact that,\" and \"In light of the fact that\" are all wordier phrases that express the same causal meaning with unnecessary extra words.", "tag": "Concision", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The museum's east wing has remained closed for renovation since spring. <u>Similarly</u>, attendance at the museum's public lecture series has fallen sharply over the same period.", "opts": ["Meanwhile", "Similarly", "Likewise", "In the same way"], "ci": 0, "exp": "The two events are simply happening during the same period rather than resembling each other in kind, so a transition showing simultaneity, like \"Meanwhile,\" fits best. \"Similarly,\" \"Likewise,\" and \"In the same way\" all signal that two things are alike in nature, but the sentence is only noting that both are occurring at once, not that they are similar situations.", "tag": "Transitions", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "The foundation will grant the fellowship to <u>whomever</u> presents the most rigorous proposal to the review board.", "opts": ["who's", "whom", "whomever", "whoever"], "ci": 3, "exp": "\"whoever\" is correct because it functions as the subject of the verb \"presents\" within its own clause (\"whoever presents the most rigorous proposal\"), regardless of the preposition \"to\" that comes before it. \"whomever\" is an object pronoun and can't serve as the subject of \"presents.\" \"whom\" is also an object pronoun and has the same problem. \"who's\" is a contraction of \"who is\" and doesn't fit grammatically in this position at all.", "tag": "Pronoun Case", "tagcolor": "#185FA5"}, {"stem": "Which choice completes the underlined portion so that it conforms to standard English conventions?", "context": "By the close of trading, the two firms' combined <u>earning's</u> had surpassed every analyst's forecast for the quarter.", "opts": ["earnings", "earning's", "earnings'", "earnings's"], "ci": 0, "exp": "\"earnings\" functions here as a plural noun referring to total income, so it needs no apostrophe at all. \"earning's\" incorrectly adds a possessive apostrophe to the singular form where no possession is being shown. \"earnings'\" treats the word as a possessive plural, which doesn't fit its use as a simple plural-noun subject. \"earnings's\" is not a standard English form at all.", "tag": "Apostrophes", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';

}

    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
