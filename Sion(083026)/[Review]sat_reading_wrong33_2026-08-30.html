<script>var TITLE = "[Review] SAT Reading - Wrong Answers";var QUIZ_KEY = "quiz_reviewwrong33_5_20260829_v1";var ATT_KEY = "quiz_reviewwrong33_5_att_20260829_v1";var RAW_QUESTIONS = [{"stem": "Based on the texts, how would the author of Text 1 most likely respond to the claim in Text 2 that Tesla produced ball lightning?", "passage": "Text 1: Ball lightning is a rare atmospheric effect that has been reported multiple times over the centuries, but which has not been scientifically explained. Part of the problem is that the event is unpredictable, so it is impossible to set up a controlled experiment that incorporates all of the relevant variables. Eyewitness accounts vary, but describe balls of light associated with lightning storms that travel in unpredictable trajectories for several seconds before exploding or vanishing, often amid the odor of sulfur.<br><br>Text 2: The Serbian-American inventor Nikola Tesla, apparently out of curiosity, decided to recreate the effect known as ball lightning. He managed to produce balls of light with the same appearance as ball lightning multiple times in laboratory settings, but it is unclear whether such balls actually form in the same fashion as the actual phenomenon does.", "opts": ["By doubting the accuracy of the report", "By claiming that such results are irreplicable", "By conceding that the argument in Text 1 is flawed", "By agreeing that such a demonstration is possible"], "ci": 0, "exp": "Text 1 stresses that no controlled experiment can capture all the relevant variables of true ball lightning, so its author would likely doubt whether Tesla's lab-produced balls are accurately the same natural phenomenon, matching choice A.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Based on the texts, if the author of Text 1 and the author of Text 2 were aware of each other's findings, they would most likely agree with which statement?", "passage": "Text 1: Based on a study conducted by Dr Heath Grayson and his team, parasitic infections, caused by intestinal helminths and protozoan parasites, are among the most prevalent infections in humans in developing countries. In developed countries, protozoan parasites more commonly cause gastrointestinal infections compared to helminths. Intestinal parasites cause significant morbidity and mortality in endemic countries.<br><br>Text 2: Studies have shown that the most common protozoan parasites are G. intestinalis, Entamoeba histolytica, and Cryptosporidium spp. G. intestinalis is the most prevalent parasitic cause of gastrointestinal diseases like diarrhea in the developed world, and this infection is also very common in developing countries.", "opts": ["Efforts to destroy parasitic infections must be increased.", "The frequency of parasitic infections is increasing.", "Endemic countries are at risk of intestinal parasites.", "Protozoan parasites can frequently cause gastrointestinal infections, resulting in diarrhea."], "ci": 3, "exp": "Text 1 states protozoan parasites commonly cause gastrointestinal infections, and Text 2 specifies that a common protozoan parasite (G. intestinalis) is the most prevalent cause of diarrhea; combined, both authors would agree that protozoan parasites frequently cause gastrointestinal infections resulting in diarrhea.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "What would the author of Text 2 most likely respond to the author of Text 1?", "passage": "Text 1: \"Continental drift\" describes one of the earliest ways geologists thought continents moved over time. Today, the theory of continental drift has been replaced by the science of plate tectonics. The theory of continental drift is most associated with the scientist Alfred Wegener. In the early 20th century, Wegener published a paper explaining his theory that the continental landmasses were \"drifting\" across the earth, sometimes plowing through oceans and into each other. He called this movement continental drift.<br><br>Text 2: One of the elements lacking in the theory of continental drift was the mechanism for how it works -- why did the continents drift and what patterns did they follow? Wegener suggested that perhaps the rotation of the earth caused the continents to shift towards and apart from each other. (It doesn't.) Today, we know that the continents rest on massive slabs of rock called tectonic plates. The plates are always moving and interacting in a process called \"plate tectonics.\"", "opts": ["With understanding because Wegener's theory was correct", "With disagreement because scientists did not accept Wegener's theory of continental drift", "With hesitance because alternate theories disproved Wegener's theory", "With appreciation because Wegener was one of the earliest geologists"], "ci": 3, "exp": "Text 2 corrects only Wegener's specific proposed mechanism (earth's rotation) while affirming the underlying concept that continents move, consistent with viewing Wegener favorably as an early pioneer of the idea, matching choice D, rather than claiming his whole theory was disproved.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Based on the texts, how would the author of Text 2 most likely respond to Lincoln's behaviour as illustrated in Text 1?", "passage": "Text 1: It is stated that Abraham Lincoln \"had an almost morbid dislike to an escort, or guard, and daily exposed himself to the deadly aim of an assassin.\" ... On more than one occasion he the President had gone through the streets of Washington at a late hour of the night, without escort, or even the company of a servant, walking all the way, going and returning.<br><br>Text 2: Bancroft's eulogy on Lincoln never pleased the latter's lifelong friends ... February 16, 1866, David Davis, who had heard it, wrote me: \"His analysis of Mr. Lincoln's character is superficial.\" On the 22nd he again wrote: \"Mr. Bancroft totally misconceived Mr. Lincoln's character in applying 'unsteadiness' and confusion to it. Mr. Lincoln grew more steady and resolute, and his ideas were never confused. I thought him always master of his subject. He was a much more self-possessed man than I thought.\"", "opts": ["By conceding the importance of protection but asserting the greater significance of Lincoln's belief that \"assassination is always possible\"", "By concurring that Lincoln rarely deviated from his personal convictions and exhibited stability and equanimity.", "By acknowledging that Lincoln had a morbid dislike of any form of security.", "By challenging the supposition that Lincoln consistently \"exposed himself to the deadly aim of an assassin.\""], "ci": 1, "exp": "Text 2 portrays Lincoln as steady, resolute, and self-possessed. This characterization aligns with (rather than challenges) Text 1's account of his calm, unescorted walks, framing that behavior as an expression of his steady personal conviction, matching choice B.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"stem": "Based on the two texts, how would the author of Text 2 most likely react to Text 1?", "passage": "Text 1: In a recent study, the melting rates of nearly all glaciers worldwide, excluding the Greenland and Antarctic ice sheets, were examined, totaling approximately 200,000 glaciers. The study analyzed the loss of mass and thickness of these glaciers from 2000 to 2019. The findings revealed a significant increase in the annual rates of glacier thinning, with rates nearly doubling from 36cm in 2000 to 69 cm in 2019.<br><br>Text 2: According to scientific estimates, a significant portion of the acceleration in sea level rise during the 21st century, ranging from 6% to 19%, is attributed to the loss of mass from glaciers. Additionally, researchers estimate that approximately 21% of the overall sea level rise is caused by the melting of glaciers. The consequences of rising sea levels encompass permanent flooding of low-lying regions, heightened frequency, extent of tidal inundation, and increased depth of inundation.", "opts": ["In agreement, since sea level rise is largely due to the accelerated rates of glacier thinning", "In disbelief, since the rate at which glaciers are melting does not correspond to the rates at which sea levels are rising", "In support, since the impacts of sea level rise are severe and often permanent", "In surprise, since the global acceleration in sea levels is a result of multiple factors and not only due to the melting of glaciers and ice sheets"], "ci": 2, "exp": "Text 2 emphasizes that glacier melt significantly contributes to sea level rise and that the consequences (permanent flooding, increased tidal inundation) are severe. Text 1's finding of accelerating glacier thinning would reinforce this concern, making support (given the severity Text 2 already describes) the most consistent reaction.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();
var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
