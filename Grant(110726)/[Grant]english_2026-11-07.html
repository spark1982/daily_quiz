var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261107";
var RAW_QUESTIONS = [{"stem": "According to the passage, where did the Corps of Discovery spend its first winter?", "opts": ["on the coast where the Columbia meets the Pacific", "at the St. Louis area camp on the Mississippi", "among the Mandan people in present-day North Dakota", "in Shoshone lands near the Rocky Mountains"], "ci": 2, "exp": "The passage states, “The explorers spent their first winter among the Mandan people in present-day North Dakota.” They reached Shoshone lands the following summer and the Pacific in November 1805.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Into the Unknown West</strong><br>In 1803, the United States purchased the vast Louisiana Territory from France, roughly doubling the size of the young nation. Yet almost no one in the government knew what lay between the Mississippi River and the Pacific Ocean. President Thomas Jefferson chose Meriwether Lewis, his personal secretary, to lead an expedition, and Lewis invited his former army friend William Clark to share command. Their group, known as the Corps of Discovery, left the St. Louis area in May 1804 and paddled up the Missouri River against a powerful current.<br><br>The explorers spent their first winter among the Mandan people in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them with her husband and infant son. Her help proved invaluable the following summer, when the Corps reached Shoshone lands and desperately needed horses to cross the Rocky Mountains. After a grueling, nearly starving trek through snowy passes, the travelers floated down the Columbia River and glimpsed the Pacific in November 1805. When they returned to St. Louis in 1806, they carried detailed maps, journals describing hundreds of unfamiliar plants and animals, and a far more accurate picture of the continent."}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Crossing the Rocky Mountains was harder than paddling up the Missouri River.", "Thomas Jefferson bought the Louisiana Territory in order to double the size of the nation.", "Sacagawea was the only reason the Corps of Discovery was able to reach the Pacific.", "Lewis and Clark led a long, difficult journey that gave the nation far better knowledge of the West."], "ci": 3, "exp": "The passage follows the whole expedition and ends with what it brought back: “detailed maps, journals … and a far more accurate picture of the continent.” Sacagawea's help and the purchase are important details, but each is only one part, and the passage never says she was the only reason.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Into the Unknown West</strong><br>In 1803, the United States purchased the vast Louisiana Territory from France, roughly doubling the size of the young nation. Yet almost no one in the government knew what lay between the Mississippi River and the Pacific Ocean. President Thomas Jefferson chose Meriwether Lewis, his personal secretary, to lead an expedition, and Lewis invited his former army friend William Clark to share command. Their group, known as the Corps of Discovery, left the St. Louis area in May 1804 and paddled up the Missouri River against a powerful current.<br><br>The explorers spent their first winter among the Mandan people in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them with her husband and infant son. Her help proved invaluable the following summer, when the Corps reached Shoshone lands and desperately needed horses to cross the Rocky Mountains. After a grueling, nearly starving trek through snowy passes, the travelers floated down the Columbia River and glimpsed the Pacific in November 1805. When they returned to St. Louis in 1806, they carried detailed maps, journals describing hundreds of unfamiliar plants and animals, and a far more accurate picture of the continent."}, {"stem": "Which event happened right before the explorers glimpsed the Pacific Ocean?", "opts": ["They floated down the Columbia River.", "They returned to St. Louis with their maps.", "They paddled up the Missouri River.", "They spent the winter among the Mandan."], "ci": 0, "exp": "The passage says that after crossing the snowy passes, “the travelers floated down the Columbia River and glimpsed the Pacific in November 1805.” Returning to St. Louis came afterward, in 1806, and the Mandan winter and the Missouri River trip came much earlier.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Into the Unknown West</strong><br>In 1803, the United States purchased the vast Louisiana Territory from France, roughly doubling the size of the young nation. Yet almost no one in the government knew what lay between the Mississippi River and the Pacific Ocean. President Thomas Jefferson chose Meriwether Lewis, his personal secretary, to lead an expedition, and Lewis invited his former army friend William Clark to share command. Their group, known as the Corps of Discovery, left the St. Louis area in May 1804 and paddled up the Missouri River against a powerful current.<br><br>The explorers spent their first winter among the Mandan people in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them with her husband and infant son. Her help proved invaluable the following summer, when the Corps reached Shoshone lands and desperately needed horses to cross the Rocky Mountains. After a grueling, nearly starving trek through snowy passes, the travelers floated down the Columbia River and glimpsed the Pacific in November 1805. When they returned to St. Louis in 1806, they carried detailed maps, journals describing hundreds of unfamiliar plants and animals, and a far more accurate picture of the continent."}, {"stem": "Which word means the <b>OPPOSITE</b> of “invaluable” as it is used in the passage?", "opts": ["unfamiliar", "worthless", "temporary", "priceless"], "ci": 1, "exp": "Sacagawea's help was “invaluable” because the Corps “desperately needed horses” — her help was extremely valuable. The opposite is <i>worthless</i>. “Priceless” means almost the same as invaluable, so it is a synonym, not an opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Into the Unknown West</strong><br>In 1803, the United States purchased the vast Louisiana Territory from France, roughly doubling the size of the young nation. Yet almost no one in the government knew what lay between the Mississippi River and the Pacific Ocean. President Thomas Jefferson chose Meriwether Lewis, his personal secretary, to lead an expedition, and Lewis invited his former army friend William Clark to share command. Their group, known as the Corps of Discovery, left the St. Louis area in May 1804 and paddled up the Missouri River against a powerful current.<br><br>The explorers spent their first winter among the Mandan people in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them with her husband and infant son. Her help proved invaluable the following summer, when the Corps reached Shoshone lands and desperately needed horses to cross the Rocky Mountains. After a grueling, nearly starving trek through snowy passes, the travelers floated down the Columbia River and glimpsed the Pacific in November 1805. When they returned to St. Louis in 1806, they carried detailed maps, journals describing hundreds of unfamiliar plants and animals, and a far more accurate picture of the continent."}, {"stem": "Read this sentence from the passage: “After that, the lit portion <b>diminishes</b> night after night until the Moon vanishes from view again.” What does <i>diminishes</i> mean?", "opts": ["stays the same", "becomes brighter", "becomes smaller", "moves farther away"], "ci": 2, "exp": "The lit part shrinks “until the Moon vanishes,” so <i>diminishes</i> means becomes smaller. “Moves farther away” is tempting, but the passage explains that the Moon changes how much of its lit half faces us, not its distance.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops."}, {"stem": "The word <i>predictable</i> is made of <i>pre-</i> + <i>dict</i> + <i>-able</i>. The prefix <i>pre-</i> means “before,” and the root <i>dict</i> means “say.” What does <i>predictable</i> most likely mean in the passage?", "opts": ["said again and again", "impossible to know ahead of time", "able to be told before it happens", "spoken in a loud voice"], "ci": 2, "exp": "<i>pre-</i> (before) + <i>dict</i> (say) + <i>-able</i> (able to be) = able to be said or told before it happens. That is why ancient cultures could use the Moon's cycle “to monitor the passing of time.” “Impossible to know ahead of time” is the opposite meaning.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The Moon shines because sunlight reflects off its surface.", "During a full moon, Earth lies between the Sun and the Moon.", "A full cycle of the Moon's phases takes about two weeks.", "The Sun always lights up half of the Moon."], "ci": 2, "exp": "The passage says the Moon travels around Earth “over about 29.5 days,” and the full moon comes “about two weeks into the cycle.” So the whole cycle takes about a month, not two weeks. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops."}, {"stem": "According to the passage, why do we see a dark new moon?", "opts": ["The Moon's lit side faces away from Earth when the Moon passes between Earth and the Sun.", "The Moon moves so far from Earth that its light becomes too faint to see.", "The Moon stops reflecting sunlight for a few days during each cycle.", "Earth's shadow completely covers the Moon when Earth is between the Sun and the Moon."], "ci": 0, "exp": "The passage explains, “When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon.” When Earth is between the Sun and the Moon, the passage says we see a full moon, not a new moon.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops."}, {"stem": "According to the story, what did Jordan suggest using for the knight's helmet?", "opts": ["an old shirt stuffed with straw", "a cracked clay flowerpot", "a cardboard box", "a rusty watering can"], "ci": 3, "exp": "Jordan says, “What if the knight's helmet is this can, and the armor is flowerpots strung together?” — and the can is the “rusty watering can” he pulled from the shed. The flowerpots became the armor, not the helmet.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Flowerpot Knight</strong><br>Maya had sketched the scarecrow for three nights straight: a knight in cardboard armor, holding a shield painted with the school's eagle. When she unrolled the drawing at the garden club meeting, Jordan frowned.<br><br>“It's cool,” he said slowly, “but the contest rules say we can only use recycled materials from the garden shed. Cardboard armor won't survive the first rain.”<br><br>Maya felt her cheeks burn. “So you want to make a boring one with an old shirt and some straw?”<br><br>“I didn't say boring.” Jordan dragged a rusty watering can and a stack of cracked flowerpots out of the shed. “What if the knight's helmet is this can, and the armor is flowerpots strung together? It would still be a knight—just one that can handle the weather.”<br><br>Maya studied the pile, skeptical at first. Then she noticed how the clay pots overlapped like the metal plates on a real suit of armor. She picked up a marker and began redrawing her sketch.<br><br>Two weeks later, the judges awarded the Flowerpot Knight first place and praised its clever design. When a reporter from the school newspaper asked whose idea it had been, Maya and Jordan answered at exactly the same moment: “Ours.”"}, {"stem": "Why did Maya most likely feel her cheeks burn after Jordan spoke?", "opts": ["She was angry because Jordan had broken the contest rules.", "She was excited because Jordan liked her knight drawing.", "She felt embarrassed and defensive that her design was being criticized.", "She was too warm from working in the garden shed."], "ci": 2, "exp": "Maya had worked on the sketch “for three nights straight,” and right after Jordan points out a problem, she snaps, “So you want to make a boring one…?” Her sharp reply shows she felt hurt and defensive. Jordan was following the rules, not breaking them.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Flowerpot Knight</strong><br>Maya had sketched the scarecrow for three nights straight: a knight in cardboard armor, holding a shield painted with the school's eagle. When she unrolled the drawing at the garden club meeting, Jordan frowned.<br><br>“It's cool,” he said slowly, “but the contest rules say we can only use recycled materials from the garden shed. Cardboard armor won't survive the first rain.”<br><br>Maya felt her cheeks burn. “So you want to make a boring one with an old shirt and some straw?”<br><br>“I didn't say boring.” Jordan dragged a rusty watering can and a stack of cracked flowerpots out of the shed. “What if the knight's helmet is this can, and the armor is flowerpots strung together? It would still be a knight—just one that can handle the weather.”<br><br>Maya studied the pile, skeptical at first. Then she noticed how the clay pots overlapped like the metal plates on a real suit of armor. She picked up a marker and began redrawing her sketch.<br><br>Two weeks later, the judges awarded the Flowerpot Knight first place and praised its clever design. When a reporter from the school newspaper asked whose idea it had been, Maya and Jordan answered at exactly the same moment: “Ours.”"}, {"stem": "Which sentence best states the theme of the story?", "opts": ["Combining different ideas can create something better than either idea alone.", "Recycled materials are more beautiful than new materials.", "It is always best to follow your own plan without changing it.", "Winning a contest matters more than having fun with friends."], "ci": 0, "exp": "Maya's knight idea and Jordan's weatherproof materials together win first place, and both answer “Ours.” The story shows that changing her plan helped, so “always follow your own plan” is the opposite of the message.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Flowerpot Knight</strong><br>Maya had sketched the scarecrow for three nights straight: a knight in cardboard armor, holding a shield painted with the school's eagle. When she unrolled the drawing at the garden club meeting, Jordan frowned.<br><br>“It's cool,” he said slowly, “but the contest rules say we can only use recycled materials from the garden shed. Cardboard armor won't survive the first rain.”<br><br>Maya felt her cheeks burn. “So you want to make a boring one with an old shirt and some straw?”<br><br>“I didn't say boring.” Jordan dragged a rusty watering can and a stack of cracked flowerpots out of the shed. “What if the knight's helmet is this can, and the armor is flowerpots strung together? It would still be a knight—just one that can handle the weather.”<br><br>Maya studied the pile, skeptical at first. Then she noticed how the clay pots overlapped like the metal plates on a real suit of armor. She picked up a marker and began redrawing her sketch.<br><br>Two weeks later, the judges awarded the Flowerpot Knight first place var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
