<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261107";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["will climb", "climbed", "are climbing", "NO CHANGE"], "ci": 1, "exp": "Keep verbs in the same time. The tractor <i>pulled</i> (past), and the trip was last Saturday, so use the past tense: <i>We <b>climbed</b> onto a wagon full of straw, and a tractor pulled us through the apple orchard.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Email to Cousin Mia</strong><br><b>(1)</b> Last Saturday, my family went to Hartley Farm for the fall hayride. <b>(2)</b> We <u>climb</u> onto a wagon full of straw, and a tractor pulled us through the apple orchard. <b>(3)</b> I <u>have never rode</u> on a hayride before that day. <b>(4)</b> The ride was bumpy. <b>(5)</b> It was a lot of fun. <b>(6)</b> After the ride we drank warm cider and picked out two pumpkins. <b>(7)</b> I hope you can come with us next year, Mia!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "have never ridden", "had never rode", "had never ridden"], "ci": 3, "exp": "For something that had not happened before a past time, use <i>had</i> + the past participle. The past participle of <i>ride</i> is <i>ridden</i>, not <i>rode</i>: <i>I <b>had never ridden</b> on a hayride before that day.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Email to Cousin Mia</strong><br><b>(1)</b> Last Saturday, my family went to Hartley Farm for the fall hayride. <b>(2)</b> We <u>climb</u> onto a wagon full of straw, and a tractor pulled us through the apple orchard. <b>(3)</b> I <u>have never rode</u> on a hayride before that day. <b>(4)</b> The ride was bumpy. <b>(5)</b> It was a lot of fun. <b>(6)</b> After the ride we drank warm cider and picked out two pumpkins. <b>(7)</b> I hope you can come with us next year, Mia!"}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["The ride was bumpy, but it was a lot of fun.", "The ride was bumpy, so it was a lot of fun.", "The ride was bumpy, it was a lot of fun.", "The ride was bumpy it was a lot of fun."], "ci": 0, "exp": "Use <i>but</i> to join two ideas that contrast (bumpy, yet fun), with a comma before it. <i>So</i> would mean the bumps caused the fun; the other two choices are run-ons. <i>The ride was bumpy, <b>but</b> it was a lot of fun.</i>", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Email to Cousin Mia</strong><br><b>(1)</b> Last Saturday, my family went to Hartley Farm for the fall hayride. <b>(2)</b> We <u>climb</u> onto a wagon full of straw, and a tractor pulled us through the apple orchard. <b>(3)</b> I <u>have never rode</u> on a hayride before that day. <b>(4)</b> The ride was bumpy. <b>(5)</b> It was a lot of fun. <b>(6)</b> After the ride we drank warm cider and picked out two pumpkins. <b>(7)</b> I hope you can come with us next year, Mia!"}, {"stem": "Where should a comma be added in sentence 6?", "opts": ["After the ride we drank, warm cider and picked out two pumpkins.", "After the ride, we drank warm cider and picked out two pumpkins.", "After the ride we drank warm cider, and picked out two pumpkins.", "After, the ride we drank warm cider and picked out two pumpkins."], "ci": 1, "exp": "Put a comma after an introductory phrase that comes before the main part of the sentence: <i>After the ride<b>,</b> we drank warm cider and picked out two pumpkins.</i> No comma is needed before <i>and</i> here, because <i>picked out two pumpkins</i> has no subject of its own.", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Email to Cousin Mia</strong><br><b>(1)</b> Last Saturday, my family went to Hartley Farm for the fall hayride. <b>(2)</b> We <u>climb</u> onto a wagon full of straw, and a tractor pulled us through the apple orchard. <b>(3)</b> I <u>have never rode</u> on a hayride before that day. <b>(4)</b> The ride was bumpy. <b>(5)</b> It was a lot of fun. <b>(6)</b> After the ride we drank warm cider and picked out two pumpkins. <b>(7)</b> I hope you can come with us next year, Mia!"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["is believing", "believe", "has believed", "NO CHANGE"], "ci": 1, "exp": "<i>People</i> is plural, so it needs the plural verb <i>believe</i>: <i>Many people <b>believe</b> that chameleons change color to match their surroundings.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Chameleons Change Color</strong><br><b>(1)</b> Many people <u>believes</u> that chameleons change color to match their surroundings. <b>(2)</b> Scientists have learned that this idea is mostly a myth. <b>(3)</b> Chameleons change color to show their mood and to control their body temperature. <b>(4)</b> They can do this. <b>(5)</b> Because their skin has tiny crystals that reflect light in different ways. <b>(6)</b> The colors of a calm chameleon is usually green or brown. <b>(7)</b> Most chameleons live in warm forests <u>where</u> insects are easy to find."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["They can do this, their skin has tiny crystals that reflect light in different ways.", "Because they can do this, their skin has tiny crystals that reflect light in different ways.", "They can do this. Because of their skin has tiny crystals that reflect light in different ways.", "They can do this because their skin has tiny crystals that reflect light in different ways."], "ci": 3, "exp": "Sentence 5 is a fragment — a <i>because</i> part cannot stand alone. Attach it to sentence 4: <i>They can do this <b>because</b> their skin has tiny crystals that reflect light in different ways.</i> Starting with “Because they can do this” flips the meaning: the crystals cause the color change, not the other way around.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Report: How Chameleons Change Color</strong><br><b>(1)</b> Many people <u>believes</u> that chameleons change color to match their surroundings. <b>(2)</b> Scientists have learned that this idea is mostly a myth. <b>(3)</b> Chameleons change color to show their mood and to control their body temperature. <b>(4)</b> They can do this. <b>(5)</b> Because their skin has tiny crystals that reflect light in different ways. <b>(6)</b> The colors of a calm chameleon is usually green or brown. <b>(7)</b> Most chameleons live in warm forests <u>where</u> insects are easy to find."}, {"stem": "Which sentence has an error?", "opts": ["Most chameleons live in warm forests where insects are easy to find.", "Chameleons change color to show their mood and to control their body temperature.", "Scientists have learned that this idea is mostly a myth.", "The colors of a calm chameleon is usually green or brown."], "ci": 3, "exp": "The subject is <i>colors</i> (plural), not <i>chameleon</i>, so the verb must be <i>are</i>: <i>The colors of a calm chameleon <b>are</b> usually green or brown.</i> Don't match the verb to the noun closest to it.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Chameleons Change Color</strong><br><b>(1)</b> Many people <u>believes</u> that chameleons change color to match their surroundings. <b>(2)</b> Scientists have learned that this idea is mostly a myth. <b>(3)</b> Chameleons change color to show their mood and to control their body temperature. <b>(4)</b> They can do this. <b>(5)</b> Because their skin has tiny crystals that reflect light in different ways. <b>(6)</b> The colors of a calm chameleon is usually green or brown. <b>(7)</b> Most chameleons live in warm forests <u>where</u> insects are easy to find."}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["NO CHANGE", "what", "which", "when"], "ci": 0, "exp": "<i>Where</i> is correct because it tells about a place (forests). <i>When</i> is for times, <i>which</i> would need a different sentence (“in which”), and <i>what</i> does not fit: <i>Most chameleons live in warm forests <b>where</b> insects are easy to find.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Chameleons Change Color</strong><br><b>(1)</b> Many people <u>believes</u> that chameleons change color to match their surroundings. <b>(2)</b> Scientists have learned that this idea is mostly a myth. <b>(3)</b> Chameleons change color to show their mood and to control their body temperature. <b>(4)</b> They can do this. <b>(5)</b> Because their skin has tiny crystals that reflect light in different ways. <b>(6)</b> The colors of a calm chameleon is usually green or brown. <b>(7)</b> Most chameleons live in warm forests <u>where</u> insects are easy to find."}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["me", "mine", "myself", "NO CHANGE"], "ci": 3, "exp": "<i>I</i> is correct because it is part of the subject (Grandpa and I made…). Test it by dropping “Grandpa and”: <i>I made apple cider</i>, not <i>me made</i>. <i>Today Grandpa and <b>I</b> made apple cider in his garage.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Journal: Cider Day with Grandpa</strong><br><b>(1)</b> Today Grandpa and <u>I</u> made apple cider in his garage. <b>(2)</b> First, we washed a whole bushel of apples from his trees. <b>(3)</b> Grandpa showed me how to turn the <u>presses</u> heavy handle. <b>(4)</b> The juice dripped <u>slowly</u> into a big metal bucket. <b>(5)</b> When we finished Grandma poured the cider into tall glasses. <b>(6)</b> It was the best drink I have ever tasted. <b>(7)</b> Next fall, Grandpa says I can turn the handle all by myself."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["press’s", "presses’", "pressing", "NO CHANGE"], "ci": 0, "exp": "To show that the handle belongs to one press, add an apostrophe and <i>s</i>: <i>press’s</i>. <i>Presses’</i> would mean more than one press. <i>Grandpa showed me how to turn the <b>press’s</b> heavy handle.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Journal: Cider Day with Grandpa</strong><br><b>(1)</b> Today Grandpa and <u>I</u> made apple cider in his garage. <b>(2)</b> First, we washed a whole bushel of apples from his trees. <b>(3)</b> Grandpa showed me how to turn the <u>presses</u> heavy handle. <b>(4)</b> The juice dripped <u>slowly</u> into a big metal bucket. <b>(5)</b> When we finished Grandma poured the cider into tall glasses. <b>(6)</b> It was the best drink I have ever tasted. <b>(7)</b> Next fall, Grandpa says I can turn the handle all by myself."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["slowest", "more slowlier", "slow", "NO CHANGE"], "ci": 3, "exp": "Use an adverb (<i>-ly</i>) to describe how the juice <i>dripped</i>, so <i>slowly</i> is already correct. <i>More slowlier</i> is a double comparison. <i>The juice dripped <b>slowly</b> into a big metal bucket.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Journal: Cider Day with Grandpa</strong><br><b>(1)</b> Today Grandpa and <u>I</u> made apple cider in his garage. <b>(2)</b> First, we washed a whole bushel of apples from his trees. <b>(3)</b> Grandpa showed me how to turn the <u>presses</u> heavy handle. <b>(4)</b> The juice dripped <u>slowly</u> into a big metal bucket. <b>(5)</b> When we finished Grandma poured the cider into tall glasses. <b>(6)</b> It was the best drink I have ever tasted. <b>(7)</b> Next fall, Grandpa says I can turn the handle all by myself."}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["When we finished, Grandma poured the cider into tall glasses.", "When, we finished Grandma poured the cider into tall glasses.", "When we finished Grandma poured the cider, into tall glasses.", "When we finished Grandma poured, the cider into tall glasses."], "ci": 0, "exp": "Put a comma after an introductory clause that starts with <i>when</i>: <i>When we finished<b>,</b> Grandma poured the cider into tall glasses.</i> Without it, a reader might think “we finished Grandma.”", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Journal: Cider Day with Grandpa</strong><br><b>(1)</b> Today Grandpa and <u>I</u> made apple cider in his garage. <b>(2)</b> First, we washed a whole bushel of apples from his trees. <b>(3)</b> Grandpa showed me how to turn the <u>presses</u> heavy handle. <b>(4)</b> The juice dripped <u>slowly</u> into a big metal bucket. <b>(5)</b> When we finished Grandma poured the cider into tall glasses. <b>(6)</b> It was the best drink I have ever tasted. <b>(7)</b> Next fall, Grandpa says I can turn the handle all by myself."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["“Where is the top hat?,” asked Rosa.", "“Where is the top hat”? asked Rosa.", "NO CHANGE", "“Where is the top hat,” asked Rosa?"], "ci": 2, "exp": "When the quote is a question, the question mark goes inside the closing quotation marks, and no comma is added after it. The sentence is already correct: <i>“Where is the top hat<b>?”</b> asked Rosa.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The Talent Show Mix-Up</strong><br><b>(1)</b> Ten minutes before the talent show, Kai and Rosa were practicing their magic act backstage. <b>(2)</b> <u>“Where is the top hat?” asked Rosa.</u> <b>(3)</b> <u>“I can’t find it anywhere” Kai said.</u> <b>(4)</b> Rosa wanted to cancel the act because the whole trick depended on the hat. <b>(5)</b> Kai had another idea. <b>(6)</b> <u>Pulling a rabbit puppet out of his sleeve.</u> <b>(7)</b> That night, the audience laughed and cheered louder than they had for any other act."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["“I can’t find it anywhere,” Kai said.", "NO CHANGE", "“I can’t find it anywhere.” Kai said.", "“I can’t find it anywhere”, Kai said."], "ci": 0, "exp": "When a statement in quotation marks is followed by words like <i>Kai said</i>, end the quote with a comma inside the quotation marks: <i>“I can’t find it anywhere<b>,”</b> Kai said.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The Talent Show Mix-Up</strong><br><b>(1)</b> Ten minutes before the talent show, Kai and Rosa were practicing their magic act backstage. <b>(2)</b> <u>“Where is the top hat?” asked Rosa.</u> <b>(3)</b> <u>“I can’t find it anywhere” Kai said.</u> <b>(4)</b> Rosa wanted to cancel the act because the whole trick depended on the hat. <b>(5)</b> Kai had another idea. <b>(6)</b> <u>Pulling a rabbit puppet out of his sleeve.</u> <b>(7)</b> That night, the audience laughed and cheered louder than they had for any other act."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["Rosa wanted to cancel the act because the whole trick depended on the hat, but Kai had another idea.", "Rosa wanted to cancel the act because the whole trick depended on the hat, and Kai had another idea.", "Rosa wanted to cancel the act because the whole trick depended on the hat, so Kai had another idea.", "Rosa wanted to cancel the act because the whole trick depended on the hat Kai had another idea."], "ci": 0, "exp": "Rosa and Kai want different things, so join the ideas with <i>but</i>, which shows contrast: <i>…depended on the hat, <b>but</b> Kai had another idea.</i> <i>So</i> means one thing caused the other, and <i>and</i> hides the contrast. The last choice is a run-on.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Story: The Talent Show Mix-Up</strong><br><b>(1)</b> Ten minutes before the talent show, Kai and Rosa were practicing their magic act backstage. <b>(2)</b> <u>“Where is the top hat?” asked Rosa.</u> <b>(3)</b> <u>“I can’t find it anywhere” Kai said.</u> <b>(4)</b> Rosa wanted to cancel the act because the whole trick depended on the hat. <b>(5)</b> Kai had another idea. <b>(6)</b> <u>Pulling a rabbit puppet out of his sleeve.</u> <b>(7)</b> That night, the audience laughed and cheered louder than they had for any other act."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["Pulled a rabbit puppet out of his sleeve.", "While pulling a rabbit puppet out of his sleeve.", "He pulled a rabbit puppet out of his sleeve.", "NO CHANGE"], "ci": 2, "exp": "A sentence needs a subject and a complete verb. “Pulling a rabbit puppet out of his sleeve” has neither, so it is a fragment. Add a subject and a past-tense verb: <i><b>He pulled</b> a rabbit puppet out of his sleeve.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Story: The Talent Show Mix-Up</strong><br><b>(1)</b> Ten minutes before the talent show, Kai and Rosa were practicing their magic act backstage. <b>(2)</b> <u>“Where is the top hat?” asked Rosa.</u> <b>(3)</b> <u>“I can’t find it anywhere” Kai said.</u> <b>(4)</b> Rosa wanted to cancel the act because the whole trick depended on the hat. <b>(5)</b> Kai had another idea. <b>(6)</b> <u>Pulling a rabbit puppet out of his sleeve.</u> <b>(7)</b> That night, the audience laughed and cheered louder than they had for any other act."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["must have", "NO CHANGE", "must had", "must has"], "ci": 0, "exp": "After a helping verb like <i>must</i>, <i>could</i>, or <i>should</i>, write <i>have</i>, never <i>of</i> (they sound alike when spoken). Use the base form <i>have</i>: <i>each book <b>must have</b> been read during the challenge.</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Notice: Winter Reading Challenge</strong><br><b>(1)</b> T var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
