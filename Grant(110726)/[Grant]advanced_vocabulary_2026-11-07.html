<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261107";
var RAW_QUESTIONS = [{"stem": "The twins dress alike, but their teacher can <b>differentiate</b> them because Ava has a small scar on her chin. What does <b>differentiate</b> mean in this sentence?", "opts": ["to tell the difference between things", "to forget who someone is", "to describe someone in great detail", "to treat two people exactly the same"], "ci": 0, "exp": "<i>differentiate</i> (v.) to see or show how things are different. <i>Can you <b>differentiate</b> between a frog and a toad?</i> The scar is what lets the teacher tell them apart. Family: difference (n.), different (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"The truck driver had to slowly <b>negotiate</b> the narrow mountain road.\" What does <i>negotiate</i> mean in this sentence?", "opts": ["to argue loudly with another person", "to discuss something to reach an agreement", "to buy and sell something for a profit", "to find a way along or past something difficult"], "ci": 3, "exp": "<i>negotiate</i> usually means to talk with others to reach an agreement (<i>The teams <b>negotiated</b> a trade</i>). But it can also mean to travel carefully along or past something hard, like a narrow road or a sharp turn — that is the meaning here. Family: negotiation (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Grandpa sat on the porch to <b>ponder</b> the chess problem for a long time before he moved a single piece. Which word means the <b>SAME</b> or nearly the same as <i>ponder</i>?", "opts": ["ignore", "announce", "consider", "rush"], "ci": 2, "exp": "<i>ponder</i> (v.) to think about something carefully. <i>She <b>pondered</b> which book to choose.</i> Thinking \"for a long time\" is the opposite of rushing or ignoring. Family: ponderous (adj. — slow and heavy)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Which sentence uses <b>sustain</b> to mean \"to suffer or receive an injury or loss\"?", "opts": ["The band sustained the last note for ten whole seconds.", "Thick wooden beams sustain the weight of the barn roof.", "The goalie sustained a sprained wrist during the second half.", "The food we packed will sustain us for the three-day hike."], "ci": 2, "exp": "<i>sustain</i> has several meanings: to suffer an injury or loss (the goalie's wrist), to give enough food or energy to keep going (the hike), to hold up the weight of something (the beams), and to keep something going (the note). <i>The house <b>sustained</b> damage in the storm.</i> Family: sustainable (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Even when her science project failed twice, Nia chose to <b>persevere</b> until her model volcano finally worked. Which word means the <b>OPPOSITE</b> of <i>persevere</i>?", "opts": ["persist", "continue", "quit", "insist"], "ci": 2, "exp": "<i>persevere</i> (v.) to keep trying even when something is hard. The opposite is <i>quit</i>. \"Continue\" and \"persist\" mean almost the same as persevere. <i>Climbers must <b>persevere</b> through cold and wind.</i> Family: perseverance (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The <b>enormous</b> whale was longer than two school buses parked end to end. Which word means the <b>OPPOSITE</b> of <i>enormous</i>?", "opts": ["gigantic", "massive", "tiny", "heavy"], "ci": 2, "exp": "<i>enormous</i> (adj.) very, very large. The opposite is <i>tiny</i>. \"Gigantic\" and \"massive\" are synonyms, not opposites. <i>An <b>enormous</b> wave crashed onto the rocks.</i> Family: enormously (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "After the neighbors helped clear the fallen tree from their driveway, the Wongs were so <b>grateful</b> that they baked cookies for everyone on the street. What does <b>grateful</b> mean in this sentence?", "opts": ["feeling tired after hard work", "feeling proud of your own work", "feeling worried about what might happen", "feeling thankful for something someone did"], "ci": 3, "exp": "<i>grateful</i> (adj.) feeling or showing thanks. <i>I am <b>grateful</b> for my friends' help.</i> Baking cookies for the helpers shows thanks. Family: gratitude (n.), gratefully (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The forest was so <b>dense</b> that the hikers could barely squeeze between the trees, and almost no sunlight reached the ground. What does <b>dense</b> mean in this sentence?", "opts": ["spread far apart", "dry and easy to burn", "crowded closely together", "very tall and old"], "ci": 2, "exp": "<i>dense</i> (adj.) having parts crowded closely together; thick. <i>A <b>dense</b> fog covered the bridge.</i> The hikers \"could barely squeeze between the trees.\" Family: density (n.), densely (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before opening his own bakery, Marco worked for three years as an <b>apprentice</b> to a master baker, learning every recipe by watching and helping. What does <b>apprentice</b> mean in this sentence?", "opts": ["a person who learns a skill by working for an expert", "a judge who decides which baker is best", "a customer who buys the same thing every day", "a person who owns and runs a small business"], "ci": 0, "exp": "<i>apprentice</i> (n.) a person who learns a job or skill by working with someone who is already an expert. <i>The young <b>apprentice</b> helped the blacksmith shape the horseshoes.</i> The clue is \"learning every recipe by watching and helping.\" Family: apprenticeship (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "When the curtain was pulled away, it <b>revealed</b> the statue the class had been building in secret all year. What does <b>revealed</b> mean in this sentence?", "opts": ["showed something that had been hidden", "moved something to a new place", "broke something into small pieces", "covered something to protect it"], "ci": 0, "exp": "<i>reveal</i> (v.) to show or make known something that was hidden or secret. <i>The magician <b>revealed</b> the card under the cup.</i> The statue was secret until the curtain was pulled away. Family: revelation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "A smile is a ______ sign of friendliness; people understand it in every country in the world. Which word best completes the sentence?", "opts": ["previous", "fragile", "universal", "rural"], "ci": 2, "exp": "<i>universal</i> (adj.) true or shared everywhere or by everyone. <i>Music is a <b>universal</b> language.</i> \"In every country in the world\" points to universal. Family: universe (n.), universally (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Before we tried the experiment ourselves, Ms. Rivera used a balloon to ______ how static electricity can make hair stand up. Which word best completes the sentence?", "opts": ["diminish", "collapse", "demonstrate", "sustain"], "ci": 2, "exp": "<i>demonstrate</i> (v.) to show how something works or that something is true. <i>The coach will <b>demonstrate</b> the correct way to dribble.</i> The teacher showed the class before they tried it. Family: demonstration (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "During the storm, the scientists used radar to <b>monitor</b> the hurricane, checking its path every hour. What does <b>monitor</b> mean in this sentence?", "opts": ["to warn people by sounding an alarm", "to watch and check something over a period of time", "to measure something only one time", "to stop something before it can happen"], "ci": 1, "exp": "<i>monitor</i> (v.) to watch or check something carefully over time. <i>The nurse will <b>monitor</b> your temperature all night.</i> \"Checking its path every hour\" is the clue. It can also be a noun: a computer screen. Family: monitoring (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Even though Leo is only eleven, he acted very <b>mature</b> when he calmly helped the younger kids find their parents after the fire drill. What does <b>mature</b> mean in this sentence?", "opts": ["quiet because he was frightened", "fully grown, like ripe fruit", "behaving in a sensible, grown-up way", "too old to play children's games"], "ci": 2, "exp": "<i>mature</i> (adj.) acting in a responsible, grown-up way. <i>It was <b>mature</b> of her to apologize first.</i> \"Calmly helped the younger kids\" is the clue. It can also describe fully grown plants or animals. Family: maturity (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Max didn't mean to break the vase; he knocked it over by accident, not ______. Which form of the word fits the sentence?", "opts": ["intentionally", "intention", "intend", "intentional"], "ci": 0, "exp": "The sentence needs an adverb that describes how he did it, so use <i>intentionally</i> (adv.) — on purpose. <i>intention</i> (n.) is a plan or purpose. <i>Her <b>intention</b> was to help.</i> Family: intend (v.), intentional (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Volunteers spent the summer sanding, painting, and fixing the old carousel to <b>restore</b> it to the way it looked in 1920. What does <b>restore</b> mean in this sentence?", "opts": ["to move something to a safer location", "to replace something old with a brand-new design", "to take something apart so it can be stored", "to bring something back to an earlier, better condition"], "ci": 3, "exp": "<i>restore</i> (v.) to bring back to a former condition. <i>The museum worked to <b>restore</b> the faded painting.</i> \"The way it looked in 1920\" shows they were bringing it back, not replacing it. Family: restoration (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The scientist kept careful notes and photos to ______ every step of the experiment. Which form of the word fits the sentence?", "opts": ["document", "documented", "documentary", "documentation"], "ci": 0, "exp": "After \"to,\" the sentence needs a verb, so use <i>document</i> (v.) — to record facts in writing or pictures. <i>documentation</i> (n.) is the written proof itself. <i>Bring your <b>documentation</b> to the office.</i> Family: documentary (n./adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The bright orange scarf was the perfect ______ to her dark blue coat; the two colors looked great together. Which word best completes the sentence?", "opts": ["strategy", "priority", "category", "complement"], "ci": 3, "exp": "<i>complement</i> (n./v.) something that goes well with another thing and makes it better or complete. <i>Cranberry sauce is a tasty <b>complement</b> to turkey.</i> Do not mix it up with <i>compliment</i> (a kind remark). Family: complementary (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The photographer waited by the pond for hours to ______ a picture of the heron catching a fish. Which word best completes the sentence?", "opts": ["abandon", "capture", "restrict", "conceal"], "ci": 1, "exp": "<i>capture</i> (v.) to catch or take hold of; to record in a photo or words. <i>The net helped them <b>capture</b> the butterfly.</i> Taking the picture records the moment. Family: capture (n.), captive (n./adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "After months of practice, Sam finally <b>conquered</b> his fear of diving off the high board. Which word means the <b>SAME</b> or nearly the same as <i>conquered</i>?", "opts": ["surrendered to", "defeated", "avoided", "explained"], "ci": 1, "exp": "<i>conquer</i> (v.) to defeat or overcome. <i>The team worked together to <b>conquer</b> the steep trail.</i> \"Surrendered to\" is the opposite — giving in. Family: conqueror (n.), conquest (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
