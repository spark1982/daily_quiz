<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Math Competition</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#185FA5;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;min-height:1px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:10px 0;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:140px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.q-tag{display:inline-block;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.passage-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.88rem;color:#222;line-height:1.6;max-height:260px;overflow-y:auto;}
.context-label{font-size:0.92rem;font-weight:600;color:#333;margin-bottom:8px;line-height:1.4;}
.context-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;line-height:1.6;}
.q-text{font-size:1.05rem;font-weight:700;color:#111;margin-bottom:12px;line-height:1.5;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;}
.hint-btn{background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block;}
.hint-box{background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none;}
.hint-box.show{display:block;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
.timer-box{text-align:center;font-size:1.1rem;font-weight:800;margin-bottom:8px;}
.timer-box.warn{color:#E24B4A;}
.pause-btn{background:#e8edf4;color:#185FA5;border:none;border-radius:8px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.pause-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.96);z-index:90;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:#185FA5;}

.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;}
.frac .den{border-top:1.4px solid #111;}
.bigsum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 3px;font-size:0.85em;}
.bigsum .bs-sup{font-size:0.75em;}
.bigsum .bs-sigma{font-size:1.6em;line-height:0.9;}
.bigsum .bs-sub{font-size:0.75em;}
.hexdiagram{margin:10px 0;text-align:center;}

</style>
</head>
<body>

<div class="title-hd">[Grant] Math Competition</div>
<div class="instruction" id="instruction">Choose the correct answer for each problem.</div>
<div id="nav-bar">
  <span id="nav-count">0 / N</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>
<div id="quizArea" style="display:none;">
  <div><span class="q-tag" id="q-tag-label"></span></div>
  <div class="q-num" id="q-num"></div>
  <div class="context-label" id="context-label" style="display:none;"></div>
  <div class="passage-box" id="passage-box" style="display:none;"></div>
  <div class="context-box" id="context-box" style="display:none;"></div>
  <div class="q-text" id="q-text" style="display:inline;"></div>
  <button id="tts-btn" onclick="speakCurrent()" title="Listen" style="display:none;background:#e8edf4;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:0.95rem;margin-left:6px;vertical-align:middle;">&#128264;</button>
  <button class="hint-btn" id="hint-btn" onclick="toggleHint()" style="display:none;">Show Hint</button>
  <div class="hint-box" id="hint-box"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>
<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#185FA5;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="saveWrong()" style="display:block;width:100%;padding:13px;background:#f5a623;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Save Wrong Answers</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal(false)" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){
var TITLE = "[Grant] Math Competition";
var QUIZ_KEY = "grantmathcomp";
var LS_KEY = "quiz_grantmathcomp_20260916";
var ATT_KEY = "quiz_grantmathcomp_att_20260916";
var TAG_COLORS = {"Chapter 1": "#185FA5", "Chapter 2": "#185FA5", "Chapter 3": "#185FA5", "Chapter 4": "#185FA5", "Chapter 5": "#185FA5", "Chapter 6": "#185FA5", "Chapter 7": "#185FA5", "Chapter 8": "#185FA5", "Chapter 9": "#185FA5", "Chapter 10": "#185FA5", "Chapter 11": "#185FA5", "Chapter 12": "#185FA5", "Chapter 13": "#185FA5", "Chapter 14": "#185FA5"};
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
var RAW_QUESTIONS = [{"stem": "How many integers are between −34 and 89, inclusive?", "opts": ["124", "123", "125", "122"], "ci": 0, "exp": "Count: 89 − (−34) + 1 = 89 + 34 + 1 = 124.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "What is the largest two-digit number that is divisible by both 7 and 6?", "opts": ["84", "42", "78", "90"], "ci": 0, "exp": "Divisible by both 7 and 6 means divisible by LCM(7,6)=42. Multiples of 42: 42, 84, 126… The largest two-digit one is 84.", "tag": "Chapter 2", "tagcolor": "#185FA5"}, {"stem": "If a³ × b² = 200, and a and b are prime numbers, what is a + b?", "opts": ["7", "9", "10", "12"], "ci": 0, "exp": "200 = 8 × 25 = 2³ × 5². So a=2 and b=5 (both prime). a + b = 2 + 5 = 7.", "tag": "Chapter 3", "tagcolor": "#185FA5"}, {"stem": "Find the number of factors for 11³ × 13¹ × 17¹⁴.", "opts": ["120", "60", "90", "240"], "ci": 0, "exp": "Number of factors = (3+1)(1+1)(14+1) = 4 × 2 × 15 = 120.", "tag": "Chapter 4", "tagcolor": "#185FA5"}, {"stem": "Find the sum of all EVEN factors for 2² × 3² × 5².", "opts": ["2418", "2821", "403", "1209"], "ci": 0, "exp": "Sum of all factors = (1+2+4)(1+3+9)(1+5+25) = 7×13×31 = 2821. Sum of odd factors = 1×13×31 = 403. Even = 2821 − 403 = 2418.", "tag": "Chapter 5", "tagcolor": "#185FA5"}, {"stem": "A phone company charges $15/month plus 50¢/minute for long distance. Josie's July bill was $99. How many long-distance minutes did she use?", "opts": ["168 minutes", "160 minutes", "180 minutes", "148 minutes"], "ci": 0, "exp": "Long distance charges = $99 − $15 = $84. Minutes = $84 ÷ $0.50 = 168 minutes.", "tag": "Chapter 6", "tagcolor": "#185FA5"}, {"stem": "How many perfect squares are between 100 and 1,000, inclusive?", "opts": ["22", "21", "23", "20"], "ci": 0, "exp": "√100 = 10 and √1000 ≈ 31.6, so integers 10 through 31 each give a perfect square in range. Count = 31 − 10 + 1 = 22.", "tag": "Chapter 7", "tagcolor": "#185FA5"}, {"stem": "On an exam with 275 problems, Ruth answered 76% of the questions correct, left 4% of the questions blank and got the remaining questions incorrect. If she receives 1 point for every correct answer, 0 points for every blank answer and loses <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span> of a point for every incorrect answer, what was her score on the test?", "opts": ["198", "195", "200", "193"], "ci": 0, "exp": "Correct: 76% × 275 = 209. Blank: 4% × 275 = 11. Wrong: 20% × 275 = 55. Score = 209(1) + 11(0) + 55(−<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">5</span></span>) = 209 − 11 = 198.", "tag": "Chapter 8", "tagcolor": "#185FA5"}, {"stem": "If the ratio of teachers to boys to girls is 2 to 8 to 7, what fraction of the school population is students?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">17</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">17</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>8</span><span style=\"border-top:1.4px solid #111;\">17</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>7</span><span style=\"border-top:1.4px solid #111;\">15</span></span>"], "ci": 0, "exp": "Total parts = 17. Students (boys + girls) = 15 parts → <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">17</span></span>.", "tag": "Chapter 9", "tagcolor": "#185FA5"}, {"stem": "A store has a stack of soda cans. The top row has 1 can, the second row has 8 cans, and so on in an arithmetic sequence until the final row with 50 cans. How many cans in total are in the stack?", "opts": ["204", "200", "196", "210"], "ci": 0, "exp": "The common difference is 7. Solving 1 + (n-1)(7) = 50 gives n = 8 rows. The sum is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>8</span><span style=\"border-top:1.4px solid #111;\">2</span></span> × (1 + 50) = 4 × 51 = 204.", "tag": "Chapter 10", "tagcolor": "#185FA5"}, {"stem": "Review Problem: How many hours are in 7 days?", "opts": ["168 hours", "144 hours", "156 hours", "180 hours"], "ci": 0, "exp": "1 day = 24 hours, so 7 days = 7 x 24 = 168 hours.", "tag": "Chapter 11", "tagcolor": "#185FA5"}, {"stem": "Wally can make 6 pens in one hour. Jay can make 10 pens in half an hour. Barry can make 12 pens in 45 minutes. How many pens can they make together in 2 hours?", "opts": ["76 pens", "64 pens", "96 pens", "84 pens"], "ci": 3, "exp": "Wally's rate is 6 pens per hour. Jay's rate is 10 pens per 0.5 hour = 20 pens per hour. Barry's rate is 12 pens per 0.75 hour = 16 pens per hour. Combined rate = 6 + 20 + 16 = 42 pens per hour. In 2 hours: 42 &times; 2 = 84 pens.", "tag": "Chapter 12", "tagcolor": "#185FA5"}, {"stem": "*Max wants to buy a sandwich. He can choose from 5 types of bread, 7 types of meat, 6 types of vegetables and 3 types of cheese. If he is allowed to pick one from each category with the option of omitting meat, vegetable and/or cheese, how many different sandwich combinations can he make?", "opts": ["1,120", "630", "840", "1,344"], "ci": 0, "exp": "Bread must still be chosen, giving 5 options. Since meat, vegetables, and cheese can each be omitted, those categories effectively gain an extra \"none\" option: meat has 7 + 1 = 8 options, vegetables have 6 + 1 = 7 options, and cheese has 3 + 1 = 4 options. The total is 5 &times; 8 &times; 7 &times; 4 = 1,120.", "tag": "Chapter 13", "tagcolor": "#185FA5"}, {"stem": "How many ways can the digits in the number 12,556 be arranged?", "opts": ["60", "120", "24", "30"], "ci": 0, "exp": "The digits are 1, 2, 5, 5, 6, which is 5 digits total, with the digit 5 repeated twice. The count of distinguishable arrangements is 5!/2! = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>120</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 60. 120 is plain 5!, which treats the two 5s as if they were different digits. 24 is 4!, which undercounts the total number of digits. 30 divides by an extra factor of 2, as though another digit were also repeated.", "tag": "Chapter 14", "tagcolor": "#185FA5"}];
var DEBATE_MODE = false;
var TIMED = false;
var TIME_LIMIT = 40;
var TTS_LANG = "ko-KR";

var order = [];
var state = {};
var hintShown = false;
var paused = false;
var timerHandle = null;

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }
function incAttempts(){ localStorage.setItem(ATT_KEY, loadAttempts()+1); }

function defaultOrder(){ var a=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) a.push(i); return a; }

function resetState(randomOrder){
  order = defaultOrder();
  if (randomOrder) {
    for (var k=order.length-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=order[k]; order[k]=order[j]; order[j]=t; }
  }
  state = { cur:0, answers:{}, shuffles:{}, showResults:false, order:order.slice() };
  if (TIMED) {
    state.timers = {};
    for (var i=0;i<RAW_QUESTIONS.length;i++) state.timers[i] = { remaining: TIME_LIMIT, timedOut:false, running:false };
  }
}

function loadState(){
  try {
    var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.order) {
      state = s;
      order = s.order;
    } else {
      resetState(false);
    }
  } catch(e) {
    localStorage.removeItem(LS_KEY);
    resetState(false);
  }
}

function saveState(){
  state.order = order;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function getShuffle(qi){
  if (!state.shuffles[qi]) {
    var n = RAW_QUESTIONS[qi].opts.length;
    var a = []; for (var i=0;i<n;i++) a.push(i);
    for (var k=n-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[qi] = a;
  }
  return state.shuffles[qi];
}
function getCSI(qi){ return getShuffle(qi).indexOf(RAW_QUESTIONS[qi].ci); }

function isTimedOut(qi){ return TIMED && state.timers && state.timers[qi] && state.timers[qi].timedOut; }
function isAnswered(qi){ return state.answers[qi] !== undefined || isTimedOut(qi); }
function isCorrectAns(qi){ return state.answers[qi] !== undefined && state.answers[qi] === getCSI(qi); }

function updateNav(){
  var ans = 0;
  for (var p=0;p<order.length;p++) if (isAnswered(order[p])) ans++;
  document.getElementById('nav-count').textContent = ans + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (order.length? (ans/order.length*100):0).toFixed(1) + '%';
  renderDots();
}

function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'none' || !p.style.display) {
    p.style.display = 'block'; b.innerHTML = 'Hide &#9652;'; renderDots();
  } else {
    p.style.display = 'none'; b.innerHTML = 'Jump &#9662;';
  }
}

function renderDots(){
  var p = document.getElementById('dot-panel');
  if (p.style.display === 'none' || !p.style.display) return;
  var h = '';
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var bg = !isAnswered(qi) ? '#d7dde6' : (isCorrectAns(qi) ? '#185FA5' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+qi+')">' + (pos+1) + '</span>';
  }
  var allAns = true;
  for (var pos2=0; pos2<order.length; pos2++) if (!isAnswered(order[pos2])) { allAns = false; break; }
  if (allAns && order.length>0) {
    h += '<br><span onclick="finishQuiz()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}

function goToQ(qi){
  var pos = order.indexOf(qi);
  if (pos === -1) pos = 0;
  state.cur = pos; state.showResults = false; saveState(); render();
  document.getElementById('dot-panel').style.display = 'none';
  document.getElementById('jump-btn').innerHTML = 'Jump &#9662;';
}

function speak(text, lang){
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function speakCurrent(){
  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  if (q && q.tts) speak(q.tts, TTS_LANG);
}
window.speakCurrent = speakCurrent;

function updateAttDisplay(){ /* no-op placeholder for subtitle; title fixed */ }


function render(){
  if (state.showResults) { renderResults(); return; }
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  updateNav();

  var pos = state.cur;
  var qi = order[pos];
  var q = RAW_QUESTIONS[qi];

  document.getElementById('q-num').textContent = 'Question ' + (pos+1) + ' of ' + order.length;

  var tagEl = document.getElementById('q-tag-label');
  if (q.tag) {
    tagEl.style.display = 'inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = q.tagcolor || TAG_COLORS[q.tag] || '#185FA5';
  } else {
    tagEl.style.display = 'none';
  }

  var clEl = document.getElementById('context-label');
  if (q.contextLabel) { clEl.style.display='block'; clEl.textContent = q.contextLabel; } else { clEl.style.display='none'; }

  var cbEl = document.getElementById('context-box');
  if (q.context) { cbEl.style.display='block'; cbEl.innerHTML = q.context; } else { cbEl.style.display='none'; }

  var pb = document.getElementById('passage-box');
  if (q.passage) { pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;
  var ttsBtn = document.getElementById('tts-btn');
  if (q.tts) { ttsBtn.style.display = 'inline-block'; } else { ttsBtn.style.display = 'none'; }

  hintShown = false;
  var hintBtn = document.getElementById('hint-btn'), hintBox = document.getElementById('hint-box');
  if (q.hint) { hintBtn.style.display='inline-block'; hintBtn.textContent='Show Hint'; hintBox.innerHTML=q.hint; hintBox.classList.remove('show'); } else { hintBtn.style.display='none'; hintBox.classList.remove('show'); }

  var sh = getShuffle(qi);
  var ans = state.answers[qi];
  var csi = getCSI(qi);
  var timedOut = TIMED && state.timers[qi] && state.timers[qi].timedOut;
  var html = '';
  for (var s=0; s<sh.length; s++) {
    var oi = sh[s];
    var cls = 'opt-btn';
    var dis = '';
    if (ans !== undefined || timedOut) {
      dis = 'disabled';
      if (s === csi) cls += ' correct';
      else if (s === ans) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+qi+','+s+')">' + q.opts[oi] + '</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if ((ans !== undefined && ans !== csi) || timedOut) {
    eb.style.display = 'block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display = 'none';
  }

  document.getElementById('next-btn').textContent = (pos === order.length-1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (pos === 0);

}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  if (TIMED && state.timers[qi] && state.timers[qi].timedOut) return;
  state.answers[qi] = si;
  saveState(); render();
}

function finishQuiz(){
  state.showResults = true;
  incAttempts();
  saveState(); render(); reportResult();
}

function goNext(){
  if (state.cur === order.length-1) { finishQuiz(); return; }
  state.cur = Math.min(order.length-1, state.cur+1);
  saveState(); render();
}

function go(dir){
  if (dir === 1) {
    if (state.cur === order.length - 1) {
      state.showResults = true; incAttempts(); saveState(); render(); reportResult();
      return;
    }
    state.cur = Math.min(order.length-1, state.cur+1);
    saveState(); render();
    return;
  }
  state.cur = Math.max(0, state.cur-1);
  saveState(); render();
}

function renderResults(){
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  updateAttDisplay();
  updateNav();

  var c=0,w=0,sk=0;
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (!isAnswered(qi)) sk++;
    else if (isCorrectAns(qi)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;' +
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;' +
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html = '';
  for (var pos2=0; pos2<order.length; pos2++) {
    var qi2 = order[pos2];
    var label,bg,tc;
    if (!isAnswered(qi2)) { label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (isCorrectAns(qi2)) { label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label = isTimedOut(qi2) ? 'Timed Out' : 'Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var stemText = String(RAW_QUESTIONS[qi2].stem).replace(/<[^>]*>/g,'').substring(0,60);
    html += '<div class="results-card" onclick="goToQ('+qi2+')">' +
      '<span style="font-size:0.95rem;font-weight:600;color:#333;">Q'+(pos2+1)+'. '+stemText+'</span>' +
      '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>' +
      '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function retryWrong(){
  var wrongQi = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      wrongQi.push(qi);
    }
  }
  if (wrongQi.length === 0) return;
  for (var i=0;i<wrongQi.length;i++) {
    delete state.answers[wrongQi[i]];
    delete state.shuffles[wrongQi[i]];
    if (TIMED && state.timers) { state.timers[wrongQi[i]] = { remaining: TIME_LIMIT, timedOut:false, running:false }; }
  }
  order = wrongQi;
  state.order = order;
  state.cur = 0; state.showResults = false;
  saveState(); render();
}

function toggleHint(){
  hintShown = !hintShown;
  var b = document.getElementById('hint-btn'), x = document.getElementById('hint-box');
  if (hintShown) { x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function stripTags(s){ return String(s).replace(/<[^>]*>/g,''); }

function copyRes(){
  var lines = [TITLE + ' - Results'];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var lbl = !isAnswered(qi) ? 'Skipped' : (isCorrectAns(qi) ? 'Correct' : (isTimedOut(qi) ? 'Timed Out' : 'Wrong'));
    lines.push('Q'+(pos+1)+' '+stripTags(RAW_QUESTIONS[qi].stem)+': '+lbl);
  }
  var txt = lines.join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}

function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

function saveWrong(){
  var wrongAnswers = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var a = state.answers[qi];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      var q = RAW_QUESTIONS[qi];
      var sh = getShuffle(qi);
      wrongAnswers.push({
        question: stripTags(q.stem),
        yourAnswer: (a===undefined) ? '(no answer - time ran out)' : stripTags(q.opts[sh[a]]),
        correctAnswer: stripTags(q.opts[q.ci]),
        explanation: stripTags(q.exp)
      });
    }
  }
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  try {
    var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a2 = document.createElement('a');
    a2.href = url;
    a2.download = QUIZ_KEY + '_wrong.json';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e){}
}

var freshRandom = false;
function openFreshModal(randomOrder){ freshRandom = !!randomOrder; document.getElementById('freshModal').style.display='flex'; }
function confirmFresh(){
  document.getElementById('freshModal').style.display='none';
  localStorage.removeItem(LS_KEY);
  resetState(freshRandom);
  saveState(); render();
}

function reportResult(){
  try {
    var correct=0, wrong=0, skipped=0, timedout=0;
    for (var pos=0; pos<order.length; pos++) {
      var qi = order[pos];
      var a = state.answers[qi];
      var t = state.timers ? state.timers[qi] : null;
      if (a===undefined) {
        if (t && t.timedOut) timedout++; else skipped++;
        continue;
      }
      if (a===getCSI(qi)) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if (TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if (TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if (TITLE.indexOf('[Both]')===0) childName='Both';
    else if (TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY,
      attemptNumber: loadAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, timedOut: timedout, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  } catch(e){}
}

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;
window.copyRes = copyRes;
window.saveWrong = saveWrong;
window.openFreshModal = openFreshModal;
window.confirmFresh = confirmFresh;
window.speak = speak;

loadState(); saveState(); render();
})();
</script>
</body>
</html>
