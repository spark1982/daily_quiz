<!DOCTYPE html>

<head>

<title>[Grant] Speed Quiz</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#185FA5;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;min-height:1px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:10px 0;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:140px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.q-tag{display:inline-block;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.passage-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.88rem;color:#222;line-height:1.6;max-height:260px;overflow-y:auto;}
.context-label{font-size:0.92rem;font-weight:600;color:#333;margin-bottom:8px;line-height:1.4;}
.context-box{background:#f5f7fa;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;line-height:1.6;}
.q-text{font-size:1.05rem;font-weight:700;color:#111;margin-bottom:12px;line-height:1.5;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;}
.hint-btn{background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block;}
.hint-box{background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none;}
.hint-box.show{display:block;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
.timer-box{text-align:center;font-size:1.1rem;font-weight:800;margin-bottom:8px;}
.timer-box.warn{color:#E24B4A;}
.pause-btn{background:#e8edf4;color:#185FA5;border:none;border-radius:8px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.pause-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.96);z-index:90;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;color:#185FA5;}

.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;}
.frac .den{border-top:1.4px solid #111;}
.bigsum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 3px;font-size:0.85em;}
.bigsum .bs-sup{font-size:0.75em;}
.bigsum .bs-sigma{font-size:1.6em;line-height:0.9;}
.bigsum .bs-sub{font-size:0.75em;}
.hexdiagram{margin:10px 0;text-align:center;}
</style>

<body>
<div class="title-hd">[Grant] Speed Quiz</div>
<div class="instruction" id="instruction">Answer each problem before time runs out. Numbers are taken exactly as given — work carefully and quickly!</div>

<div id="resultsArea" style="display:none;">

  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal(false)" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

</div>

var TAG_COLORS = {"Gauss": "#185FA5", "Intervals": "#1D9E75", "Add & Subtract": "#f5a623", "Multiply": "#8e44ad", "Geometry": "#E24B4A"};
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
var RAW_QUESTIONS = [{"stem": "Compute the following.<br>2 + 3 + 4 + 5 + 6 + 7 + 8", "opts": ["30", "35", "40", "32"], "ci": 1, "exp": "Pair ends: (2+8)+(3+7)+(4+6)+5 = 10+10+10+5 = 35.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>6 + 7 + 8 + 9 + 10 + 11", "opts": ["48", "51", "54", "45"], "ci": 1, "exp": "Sum = (6+11)&times;6&divide;2 = 17&times;3 = 51.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>4 + 6 + 8 + 10 + 12 + 14", "opts": ["52", "50", "54", "56"], "ci": 2, "exp": "Sum = (4+14)&times;6&divide;2 = 18&times;3 = 54.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following.<br>1 + 3 + 5 + 7 + 9 + 11", "opts": ["30", "32", "38", "36"], "ci": 3, "exp": "The sum of the first n odd numbers is n&sup2;. There are 6 odd numbers, so the sum is 6&sup2; = 36.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>100 &minus; 99 + 98 &minus; 97 + 96 &minus; 95 + &hellip; + 4 &minus; 3 + 2 &minus; 1", "opts": ["50", "48", "52", "100"], "ci": 0, "exp": "Group into 50 pairs: (100&minus;99)+(98&minus;97)+&hellip;+(2&minus;1) = 50 pairs of 1 = 50.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "Compute the following series.<br>200 &minus; 199 + 198 &minus; 197 + &hellip; + 4 &minus; 3 + 2 &minus; 1", "opts": ["100", "98", "200", "102"], "ci": 0, "exp": "Group into 100 pairs: (200&minus;199)+(198&minus;197)+&hellip;+(2&minus;1) = 100 pairs of 1 = 100.", "tag": "Gauss", "tagcolor": "#185FA5"}, {"stem": "A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?", "opts": ["100", "101", "99", "105"], "ci": 1, "exp": "500 &divide; 5 = 100 gaps. With trees at both ends, the number of trees is gaps + 1 = 101.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "21 trees are to be planted at regular intervals along a road that is 800 m long. If both ends of the road are planted with trees as well, how far is one tree from another?", "opts": ["38", "40", "42", "36"], "ci": 1, "exp": "21 trees at both ends create 20 gaps, so each gap is 800 &divide; 20 = 40 m.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Melvin lives on the 5th floor of an apartment building. Nick lives on the next floor. The staircases leading to Melvin's apartment have 80 steps. How many steps have the staircases leading to Nick's apartment?", "opts": ["96", "100", "90", "120"], "ci": 1, "exp": "Floor 1 to floor 5 is 4 flights = 80 steps, so each flight is 20 steps. Floor 1 to floor 6 (Nick's floor) is 5 flights = 100 steps.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "My grandfather clock takes 6 seconds to chime 3 times at 3 o'clock. How long does it take to chime 6 times at 6 o'clock?", "opts": ["12", "15", "18", "10"], "ci": 1, "exp": "3 chimes have 2 gaps in 6 seconds, so each gap is 3 seconds. 6 chimes have 5 gaps, so it takes 5 &times; 3 = 15 seconds.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "It takes Uncle Sam 50 seconds to bike from the first lamp post to the eleventh lamp post. How many lamp posts would he bike past after 80 seconds?", "opts": ["14", "15", "16", "18"], "ci": 2, "exp": "11 lamp posts have 10 gaps in 50 seconds, so each gap is 5 seconds. In 80 seconds he covers 80 &divide; 5 = 16 gaps, passing 16 lamp posts after the first.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Each side of a football field is planted with 16 flags. There is one flag at each corner. How many flags are planted altogether in the football field?", "opts": ["64", "56", "60", "58"], "ci": 2, "exp": "Each side has 16 flags but the 4 corner flags are each shared by two sides. Total = 4 &times; (16&minus;1) = 60 flags.", "tag": "Intervals", "tagcolor": "#1D9E75"}, {"stem": "Compute the following.<br>24 + 55 + 76 =", "opts": ["145", "150", "160", "155"], "ci": 3, "exp": "Group 24 and 76 first: 24 + 76 = 100. Then 100 + 55 = 155.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>56 + 66 + 44 =", "opts": ["166", "150", "160", "156"], "ci": 0, "exp": "Group 66 and 44 first: 66 + 44 = 110. Then 110 + 56 = 166.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>86 + 34 + 14 =", "opts": ["134", "124", "144", "130"], "ci": 0, "exp": "Group 86 and 14 first: 86 + 14 = 100. Then 100 + 34 = 134.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>78 + 52 + 22 =", "opts": ["142", "152", "150", "148"], "ci": 1, "exp": "Group 78 and 22 first: 78 + 22 = 100. Then 100 + 52 = 152.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>567 &minus; 134 &minus; 133 =", "opts": ["300", "310", "290", "320"], "ci": 0, "exp": "Group the subtractions: 134 + 133 = 267. Then 567 &minus; 267 = 300.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>388 &minus; 144 &minus; 44 =", "opts": ["210", "200", "190", "220"], "ci": 1, "exp": "Group the subtractions: 144 + 44 = 188. Then 388 &minus; 188 = 200.", "tag": "Add & Subtract", "tagcolor": "#f5a623"}, {"stem": "Compute the following.<br>48 &times; 125 =", "opts": ["6000", "5600", "6400", "5000"], "ci": 0, "exp": "48 &times; 125 = 6 &times; 8 &times; 125 = 6 &times; 1,000 = 6,000.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>64 &times; 25 =", "opts": ["1500", "1600", "1400", "1700"], "ci": 1, "exp": "64 &times; 25 = 16 &times; 4 &times; 25 = 16 &times; 100 = 1,600.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>64 &times; 125 =", "opts": ["8000", "7500", "8500", "7000"], "ci": 0, "exp": "64 &times; 125 = 8 &times; 8 &times; 125 = 8 &times; 1,000 = 8,000.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>25 &times; 12 =", "opts": ["250", "300", "350", "280"], "ci": 1, "exp": "25 &times; 12 = 25 &times; 4 &times; 3 = 100 &times; 3 = 300.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>53 &times; 7 + 47 &times; 7 =", "opts": ["700", "650", "750", "600"], "ci": 0, "exp": "Factor out the 7: (53 + 47) &times; 7 = 100 &times; 7 = 700.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "Compute the following.<br>27 &times; 6 + 73 &times; 6 =", "opts": ["550", "600", "650", "500"], "ci": 1, "exp": "Factor out the 6: (27 + 73) &times; 6 = 100 &times; 6 = 600.", "tag": "Multiply", "tagcolor": "#8e44ad"}, {"stem": "5 points A, B, C, D, and E are marked on a straight line so that no two of the segments between any pair of points have the same length.<br><svg width=\"260\" height=\"80\" viewBox=\"0 0 260 80\" style=\"display:block;margin:10px auto;\"><line x1=\"20\" y1=\"50\" x2=\"240\" y2=\"50\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"20\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"55\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"55\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"150\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"150\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"175\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"175\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"240\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"240\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>How many different lengths of line segments are formed in total (counting every pair of points)?", "opts": ["8", "9", "10", "12"], "ci": 2, "exp": "The number of segments formed by choosing any 2 of the 5 points is C(5,2) = (5&times;4)&divide;2 = 10. Since no two segments share a length, there are 10 different lengths.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "6 points A, B, C, D, E, and F are marked on a straight line so that no two of the segments between any pair of points have the same length.<br><svg width=\"260\" height=\"80\" viewBox=\"0 0 260 80\" style=\"display:block;margin:10px auto;\"><line x1=\"20\" y1=\"50\" x2=\"240\" y2=\"50\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"20\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"20\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"48\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"48\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"95\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"95\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"140\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"140\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"190\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"190\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"240\" cy=\"50\" r=\"5\" fill=\"#185FA5\"/><text x=\"240\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>How many different lengths of line segments are formed in total (counting every pair of points)?", "opts": ["15", "12", "18", "20"], "ci": 0, "exp": "The number of segments formed by choosing any 2 of the 6 points is C(6,2) = (6&times;5)&divide;2 = 15. Since no two segments share a length, there are 15 different lengths.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The figure below is a 2&times;2 grid of unit squares.<br><svg width=\"140\" height=\"140\" viewBox=\"0 0 140 140\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"120\" height=\"120\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"70\" y1=\"10\" x2=\"70\" y2=\"130\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"70\" x2=\"130\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many squares of any size can be found in the figure in total?", "opts": ["4", "5", "6", "8"], "ci": 1, "exp": "1&times;1 squares: 4. 2&times;2 squares: 1. Total = 4 + 1 = 5.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The figure below is a rectangle divided into a 3&times;2 grid of unit squares (3 columns, 2 rows).<br><svg width=\"180\" height=\"120\" viewBox=\"0 0 180 120\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"160\" height=\"100\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"63.3\" y1=\"10\" x2=\"63.3\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"116.7\" y1=\"10\" x2=\"116.7\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"60\" x2=\"170\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many squares of any size can be found in the figure in total?", "opts": ["7", "9", "6", "8"], "ci": 3, "exp": "1&times;1 squares: 6 (3 columns &times; 2 rows). 2&times;2 squares: 2 (2 positions across &times; 1 position down). Total = 6 + 2 = 8.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "The figure below is a square divided into a 3&times;3 grid of unit squares.<br><svg width=\"180\" height=\"180\" viewBox=\"0 0 180 180\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"160\" height=\"160\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"63.3\" y1=\"10\" x2=\"63.3\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"116.7\" y1=\"10\" x2=\"116.7\" y2=\"170\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"63.3\" x2=\"170\" y2=\"63.3\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"116.7\" x2=\"170\" y2=\"116.7\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>How many rectangles of any size (including squares) can be found in the figure in total?", "opts": ["30", "33", "36", "39"], "ci": 2, "exp": "A 3&times;3 grid has 4 vertical lines and 4 horizontal lines. Choosing any 2 of each gives C(4,2) &times; C(4,2) = 6 &times; 6 = 36 rectangles.", "tag": "Geometry", "tagcolor": "#E24B4A"}, {"stem": "In the triangle below, three line segments are drawn from the top vertex down to the base, dividing the triangle into 4 smaller regions.<br><svg width=\"220\" height=\"160\" viewBox=\"0 0 220 160\" style=\"display:block;margin:10px auto;\"><polygon points=\"110,10 20,150 200,150\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"110\" y1=\"10\" x2=\"65\" y2=\"150\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"150\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"110\" y1=\"10\" x2=\"155\" y2=\"150\" stroke=\"#333\" stroke-width=\"2\"/></svg>How many triangles of any size are in the figure in total?", "opts": ["9", "10", "12", "8"], "ci": 1, "exp": "With k=3 cevians from one vertex, the base is split into k+1=4 regions, and the total number of triangles is (k+1)(k+2)&divide;2 = 4&times;5&divide;2 = 10.", "tag": "Geometry", "tagcolor": "#E24B4A"}];

  order = defaultOrder();
  if (randomOrder) {
    for (var k=order.length-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=order[k]; order[k]=order[j]; order[j]=t; }
  }
  state = { cur:0, answers:{}, shuffles:{}, showResults:false, order:order.slice() };
  if (TIMED) {
    state.timers = {};
    for (var i=0;i<RAW_QUESTIONS.length;i++) state.timers[i] = { remaining: TIME_LIMIT, timedOut:false, running:false };
  }
}

function loadState(){
  try {
    var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.order) {
      state = s;
      order = s.order;
    } else {
      resetState(false);
    }
  } catch(e) {
    localStorage.removeItem(LS_KEY);
    resetState(false);
  }
}

function saveState(){
  state.order = order;
  localStorage.setItem(LS_KEY, JSON.stringify(state));
}

function getShuffle(qi){
  if (!state.shuffles[qi]) {
    var n = RAW_QUESTIONS[qi].opts.length;
    var a = []; for (var i=0;i<n;i++) a.push(i);
    for (var k=n-1;k>0;k--) { var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[qi] = a;
  }
  return state.shuffles[qi];
}
function getCSI(qi){ return getShuffle(qi).indexOf(RAW_QUESTIONS[qi].ci); }

function isTimedOut(qi){ return TIMED && state.timers && state.timers[qi] && state.timers[qi].timedOut; }
function isAnswered(qi){ return state.answers[qi] !== undefined || isTimedOut(qi); }
function isCorrectAns(qi){ return state.answers[qi] !== undefined && state.answers[qi] === getCSI(qi); }

function updateNav(){
  var ans = 0;
  for (var p=0;p<order.length;p++) if (isAnswered(order[p])) ans++;
  document.getElementById('nav-count').textContent = ans + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (order.length? (ans/order.length*100):0).toFixed(1) + '%';
  renderDots();
}

function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'none' || !p.style.display) {
    p.style.display = 'block'; b.innerHTML = 'Hide &#9652;'; renderDots();
  } else {
    p.style.display = 'none'; b.innerHTML = 'Jump &#9662;';
  }
}

function renderDots(){
  var p = document.getElementById('dot-panel');
  if (p.style.display === 'none' || !p.style.display) return;
  var h = '';
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var bg = !isAnswered(qi) ? '#d7dde6' : (isCorrectAns(qi) ? '#185FA5' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+qi+')">' + (pos+1) + '</span>';
  }
  var allAns = true;
  for (var pos2=0; pos2<order.length; pos2++) if (!isAnswered(order[pos2])) { allAns = false; break; }
  if (allAns && order.length>0) {
    h += '<br><span onclick="finishQuiz()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}

function goToQ(qi){
  var pos = order.indexOf(qi);
  if (pos === -1) pos = 0;
  state.cur = pos; state.showResults = false; saveState(); render();
  document.getElementById('dot-panel').style.display = 'none';
  document.getElementById('jump-btn').innerHTML = 'Jump &#9662;';
}

function speak(text, lang){
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function speakCurrent(){
  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  if (q && q.tts) speak(q.tts, TTS_LANG);
}
window.speakCurrent = speakCurrent;

function updateAttDisplay(){ /* no-op placeholder for subtitle; title fixed */ }


function clearTimerHandle(){ if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
function startTimerFor(qi){
  clearTimerHandle();
  if (!state.timers[qi]) state.timers[qi] = { remaining: TIME_LIMIT, timedOut:false, running:false };
  var t = state.timers[qi];
  if (state.answers[qi] !== undefined || t.timedOut) { renderTimerDisplay(); return; }
  t.running = true;
  timerHandle = setInterval(function(){
    if (paused) return;
    t.remaining--;
    if (t.remaining <= 0) {
      t.remaining = 0; t.timedOut = true; t.running = false;
      clearTimerHandle();
      saveState(); render();
      return;
    }
    saveState();
    renderTimerDisplay();
  }, 1000);
  renderTimerDisplay();
}
function renderTimerDisplay(){
  var qi = order[state.cur];
  var t = state.timers[qi];
  var box = document.getElementById('timer-box');
  if (!t) { box.textContent=''; return; }
  if (state.answers[qi] !== undefined) { box.textContent = ''; box.className='timer-box'; return; }
  box.textContent = t.timedOut ? "Time's up!" : ('Time left: ' + t.remaining + 's');
  box.className = 'timer-box' + (t.remaining <= 10 && !t.timedOut ? ' warn' : '');
}
function togglePause(){
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? 'Resume' : 'Pause';
  document.getElementById('pauseOverlay').style.display = paused ? 'flex' : 'none';
}


function render(){
  if (state.showResults) { renderResults(); return; }
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  updateNav();

  var pos = state.cur;
  var qi = order[pos];
  var q = RAW_QUESTIONS[qi];

  document.getElementById('q-num').textContent = 'Question ' + (pos+1) + ' of ' + order.length;

  var tagEl = document.getElementById('q-tag-label');
  if (q.tag) {
    tagEl.style.display = 'inline-block';
    tagEl.textContent = q.tag;
    tagEl.style.background = q.tagcolor || TAG_COLORS[q.tag] || '#185FA5';
  } else {
    tagEl.style.display = 'none';
  }

  var clEl = document.getElementById('context-label');
  if (q.contextLabel) { clEl.style.display='block'; clEl.textContent = q.contextLabel; } else { clEl.style.display='none'; }

  var cbEl = document.getElementById('context-box');
  if (q.context) { cbEl.style.display='block'; cbEl.innerHTML = q.context; } else { cbEl.style.display='none'; }

  var pb = document.getElementById('passage-box');
  if (q.passage) { pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;
  var ttsBtn = document.getElementById('tts-btn');
  if (q.tts) { ttsBtn.style.display = 'inline-block'; } else { ttsBtn.style.display = 'none'; }

  hintShown = false;
  var hintBtn = document.getElementById('hint-btn'), hintBox = document.getElementById('hint-box');
  if (q.hint) { hintBtn.style.display='inline-block'; hintBtn.textContent='Show Hint'; hintBox.innerHTML=q.hint; hintBox.classList.remove('show'); } else { hintBtn.style.display='none'; hintBox.classList.remove('show'); }

  var sh = getShuffle(qi);
  var ans = state.answers[qi];
  var csi = getCSI(qi);
  var timedOut = TIMED && state.timers[qi] && state.timers[qi].timedOut;
  var html = '';
  for (var s=0; s<sh.length; s++) {
    var oi = sh[s];
    var cls = 'opt-btn';
    var dis = '';
    if (ans !== undefined || timedOut) {
      dis = 'disabled';
      if (s === csi) cls += ' correct';
      else if (s === ans) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+qi+','+s+')">' + q.opts[oi] + '</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if ((ans !== undefined && ans !== csi) || timedOut) {
    eb.style.display = 'block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display = 'none';
  }

  document.getElementById('next-btn').textContent = (pos === order.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (pos === 0);

  startTimerFor(qi);
}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  if (TIMED && state.timers[qi] && state.timers[qi].timedOut) return;
  clearTimerHandle();
    state.answers[qi] = si;
  saveState(); render();
}

function finishQuiz(){
  state.showResults = true;
  incAttempts();
  saveState(); render(); reportResult();
}

function goNext(){
  if (state.cur === order.length-1) { finishQuiz(); return; }
  state.cur = Math.min(order.length-1, state.cur+1);
  saveState(); render();
}

function go(dir){
  clearTimerHandle();
  if (dir === 1) {
    if (state.cur === order.length - 1) {
      state.showResults = true; incAttempts(); saveState(); render(); reportResult();
      return;
    }
    state.cur = Math.min(order.length-1, state.cur+1);
    saveState(); render();
    return;
  }
  state.cur = Math.max(0, state.cur-1);
  saveState(); render();
}

function renderResults(){
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  clearTimerHandle();
  updateAttDisplay();
  updateNav();

  var c=0,w=0,sk=0;
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (!isAnswered(qi)) sk++;
    else if (isCorrectAns(qi)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;' +
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;' +
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html = '';
  for (var pos2=0; pos2<order.length; pos2++) {
    var qi2 = order[pos2];
    var label,bg,tc;
    if (!isAnswered(qi2)) { label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (isCorrectAns(qi2)) { label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label = isTimedOut(qi2) ? 'Timed Out' : 'Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var stemText = String(RAW_QUESTIONS[qi2].stem).replace(/<[^>]*>/g,'').substring(0,60);
    html += '<div class="results-card" onclick="goToQ('+qi2+')">' +
      '<span style="font-size:0.95rem;font-weight:600;color:#333;">Q'+(pos2+1)+'. '+stemText+'</span>' +
      '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>' +
      '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function retryWrong(){
  var wrongQi = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      wrongQi.push(qi);
    }
  }
  if (wrongQi.length === 0) return;
  for (var i=0;i<wrongQi.length;i++) {
    delete state.answers[wrongQi[i]];
    delete state.shuffles[wrongQi[i]];
    if (TIMED && state.timers) { state.timers[wrongQi[i]] = { remaining: TIME_LIMIT, timedOut:false, running:false }; }
  }
  order = wrongQi;
  state.order = order;
  state.cur = 0; state.showResults = false;
  saveState(); render();
}

function toggleHint(){
  hintShown = !hintShown;
  var b = document.getElementById('hint-btn'), x = document.getElementById('hint-box');
  if (hintShown) { x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function stripTags(s){ return String(s).replace(/<[^>]*>/g,''); }

function copyRes(){
  var lines = [TITLE + ' - Results'];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var lbl = !isAnswered(qi) ? 'Skipped' : (isCorrectAns(qi) ? 'Correct' : (isTimedOut(qi) ? 'Timed Out' : 'Wrong'));
    lines.push('Q'+(pos+1)+' '+stripTags(RAW_QUESTIONS[qi].stem)+': '+lbl);
  }
  var txt = lines.join('\n');
  if (navigator.clipboard) { navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}

function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

function saveWrong(){
  var wrongAnswers = [];
  for (var pos=0; pos<order.length; pos++) {
    var qi = order[pos];
    var a = state.answers[qi];
    if (isAnswered(qi) && !isCorrectAns(qi)) {
      var q = RAW_QUESTIONS[qi];
      var sh = getShuffle(qi);
      wrongAnswers.push({
        question: stripTags(q.stem),
        yourAnswer: (a===undefined) ? '(no answer - time ran out)' : stripTags(q.opts[sh[a]]),
        correctAnswer: stripTags(q.opts[q.ci]),
        explanation: stripTags(q.exp)
      });
    }
  }
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  try {
    var blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a2 = document.createElement('a');
    a2.href = url;
    a2.download = QUIZ_KEY + '_wrong.json';
    document.body.appendChild(a2);
    a2.click();
    document.body.removeChild(a2);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  } catch(e){}
}

var freshRandom = false;
function openFreshModal(randomOrder){ freshRandom = !!randomOrder; document.getElementById('freshModal').style.display='flex'; }
function confirmFresh(){
  document.getElementById('freshModal').style.display='none';
  localStorage.removeItem(LS_KEY);
  clearTimerHandle(); paused=false; document.getElementById('pauseOverlay').style.display='none'; document.getElementById('pause-btn').textContent='Pause';
  resetState(freshRandom);
  saveState(); render();
}

function reportResult(){
  try {
    var correct=0, wrong=0, skipped=0, timedout=0;
    for (var pos=0; pos<order.length; pos++) {
      var qi = order[pos];
      var a = state.answers[qi];
      var t = state.timers ? state.timers[qi] : null;
      if (a===undefined) {
        if (t && t.timedOut) timedout++; else skipped++;
        continue;
      }
      if (a===getCSI(qi)) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if (TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if (TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if (TITLE.indexOf('[Both]')===0) childName='Both';
    else if (TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY,
      attemptNumber: loadAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, timedOut: timedout, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  } catch(e){}
}

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;
window.copyRes = copyRes;
window.saveWrong = saveWrong;
window.openFreshModal = openFreshModal;
window.confirmFresh = confirmFresh;
window.speak = speak;
window.togglePause = togglePause;

loadState(); saveState(); render();
})();
</script>
</body>
</html>
