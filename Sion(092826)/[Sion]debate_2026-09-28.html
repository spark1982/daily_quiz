  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Sion] Debate";
var QUIZ_KEY = "siondebate";
var INSTRUCTION = "";
var TODAY_STR = "20260928";
var RAW_QUESTIONS = [{"contextLabel": "During a city council meeting about funding a new public pool in Millbrook, a council member argues:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Either the town builds this pool, or every child in Millbrook will grow up without ever learning how to swim.&rdquo;</span>", "stem": "What logical fallacy is the council member committing?", "opts": ["Slippery Slope &mdash; claiming that one small step will inevitably lead to a chain of extreme consequences without evidence", "False Dilemma &mdash; presenting only two options when more possibilities actually exist", "Appeal to Emotion &mdash; trying to win an argument by stirring up feelings such as fear or pity instead of giving evidence", "Hasty Generalization &mdash; drawing a broad conclusion from a sample that is too small or unrepresentative"], "ci": 1, "exp": "The council member talks as if building this specific pool is the only way any child could ever learn to swim, ignoring other real options such as private lessons, YMCA programs, or pools in neighboring towns. Presenting only two extreme options when more actually exist is a False Dilemma. The argument does not describe an escalating chain of consequences (Slippery Slope), mainly appeal to feelings (Appeal to Emotion), or generalize from a small sample (Hasty Generalization).", "hint": "Ask whether building this one pool is really the only possible way for any child to learn to swim."}, {"contextLabel": "During a school board debate about installing artificial turf on the high school football field, a supporter argues:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Coach Daniels has been coaching football for twenty years, and he says turf is safer for players, so we should trust his word and approve it.&rdquo;</span>", "stem": "What logical fallacy is the supporter committing?", "opts": ["Bandwagon Fallacy &mdash; arguing that something is true or good simply because many people believe or do it", "Appeal to Authority &mdash; treating someone's opinion as proof because of who they are, even when the topic is outside their expertise", "Special Pleading &mdash; applying a rule to others while making an unjustified exception for oneself or one's side", "Genetic Fallacy &mdash; judging an idea only by where it came from rather than by its merits"], "ci": 1, "exp": "Coach Daniels's decades of coaching experience do not make him an expert on the medical or engineering research behind field-surface injury rates. Treating his opinion as proof simply because of who he is, on a question outside his expertise, is an Appeal to Authority. The supporter does not cite popularity (Bandwagon), make an unjustified exception (Special Pleading), or judge the idea by its source (Genetic Fallacy).", "hint": "Ask whether the person being cited is actually an expert on the specific question of field-surface safety, or just experienced in a related job."}, {"contextLabel": "During a city council debate about a proposed midnight curfew for minors, a council member argues:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Teenagers out on the street after midnight are inherently a danger to public safety, which is exactly why we need a curfew law making it illegal for them to be out that late.&rdquo;</span>", "stem": "What logical fallacy is the council member committing?", "opts": ["Complex Question &mdash; asking a question that contains a hidden assumption, so any direct answer seems to accept it", "Begging the Question &mdash; using the conclusion itself as a premise, so the argument goes in a circle", "Moralistic Fallacy &mdash; assuming that because something ought to be a certain way, the facts must match it", "Appeal to Emotion &mdash; trying to win an argument by stirring up feelings such as fear or pity instead of giving evidence"], "ci": 1, "exp": "The council member's reason for the curfew &mdash; that being out after midnight is inherently dangerous &mdash; is really just a restatement of the conclusion that a law against it is needed, with no independent evidence that harm actually results. Using the conclusion as its own premise is Begging the Question. This is not a loaded question aimed at someone else (Complex Question), an assumption that facts must match what ought to be true (Moralistic Fallacy), or a mainly emotional appeal (Appeal to Emotion).", "hint": "Check whether the reason given for the rule is really just another way of restating the rule's own conclusion."}, {"contextLabel": "During a company town hall about a new five-day return-to-office mandate at Brightline Tech, an employee objects, and the CEO responds:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;You worked from home for two full years during the pandemic, so you don't really have any standing to complain about coming back to the office now.&rdquo;</span>", "stem": "What logical fallacy is the CEO committing?", "opts": ["Straw Man Fallacy &mdash; misrepresenting an opponent's argument as something weaker or more extreme so it is easier to attack", "Red Herring &mdash; introducing an unrelated topic to distract from the real issue being debated", "Ad Hominem &mdash; attacking the person making an argument instead of the argument itself", "Tu Quoque &mdash; dismissing a criticism by pointing out that the critic is guilty of the same thing"], "ci": 3, "exp": "Instead of addressing the employee's objection to the new mandate, the CEO points out that the employee also worked from home in the past. Deflecting a criticism by accusing the critic of the same thing is Tu Quoque. The CEO does not distort the objection into something more extreme (Straw Man), change the subject entirely (Red Herring), or attack an unrelated personal trait (Ad Hominem).", "hint": "Notice that the CEO answers the objection by pointing at the employee's own past behavior rather than responding to the objection itself."}, {"contextLabel": "At a press conference about a new toll on Route 9, a reporter asks the mayor:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Why does your administration want to make it harder for working families to get to their jobs?&rdquo;</span>", "stem": "What logical fallacy is the reporter committing with this question?", "opts": ["Ad Hominem &mdash; attacking the person making an argument instead of the argument itself", "Complex Question &mdash; asking a question that contains a hidden assumption, so any direct answer seems to accept it", "False Dilemma &mdash; presenting only two options when more possibilities actually exist", "Begging the Question &mdash; using the conclusion itself as a premise, so the argument goes in a circle"], "ci": 1, "exp": "The question assumes, without ever establishing it, that the administration's actual goal in adding the toll is to make commuting harder for working families. Any direct answer the mayor gives seems to accept that hidden assumption. A question that smuggles in an assumption like this is a Complex Question. It is not a personal attack (Ad Hominem), a choice between only two options (False Dilemma), or a circular argument (Begging the Question).", "hint": "Look at what the question already assumes to be true before the mayor even has a chance to answer."}, {"contextLabel": "During a debate over a city council candidate's zoning proposal, an opponent says:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Why should we listen to anything he says about zoning? He's only lived in this town for two years.&rdquo;</span>", "stem": "What logical fallacy is the opponent committing?", "opts": ["Genetic Fallacy &mdash; judging an idea only by where it came from rather than by its merits", "Ad Hominem &mdash; attacking the person making an argument instead of the argument itself", "Tu Quoque &mdash; dismissing a criticism by pointing out that the critic is guilty of the same thing", "Special Pleading &mdash; applying a rule to others while making an unjustified exception for oneself or one's side"], "ci": 1, "exp": "Rather than addressing the merits of the zoning proposal itself, the opponent dismisses it by pointing to how long the candidate has lived in town. Attacking the person instead of the argument is Ad Hominem. This is not about judging an idea by where it originated (Genetic Fallacy), accusing the candidate of hypocrisy (Tu Quoque), or making an unjustified exception for someone (Special Pleading).", "hint": "Notice that the objection is about the candidate himself, not about anything actually wrong with the zoning proposal."}, {"contextLabel": "In a debate about neighborhood safety in the Oakview district, a resident argues:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Blocks with more streetlights installed also have more noise complaints filed. Streetlights must be causing the noise.&rdquo;</span>", "stem": "What logical fallacy is the resident committing?", "opts": ["Hasty Generalization &mdash; drawing a broad conclusion from a sample that is too small or unrepresentative", "Cum Hoc Ergo Propter Hoc (Correlation vs Causation) &mdash; assuming that because two things occur together, one must cause the other", "Post Hoc Ergo Propter Hoc &mdash; assuming that because one event happened after another, the first event caused the second", "Anecdotal Evidence &mdash; relying on a personal story or single example as proof, while ignoring broader or more systematic evidence"], "ci": 1, "exp": "The resident notices that streetlights and noise complaints tend to occur together and concludes that one causes the other, without ruling out other explanations, such as busier blocks simply attracting both more streetlights and more activity. Treating correlation between two co-occurring things as proof of causation is Cum Hoc Ergo Propter Hoc. Unlike Post Hoc, this isn't about one event following another in time, but about two things existing together. It also isn't a conclusion from too small a sample (Hasty Generalization) or a single personal story (Anecdotal Evidence).", "hint": "Ask whether the two things happening together in the same blocks proves that one causes the other, or whether something else could explain both."}, {"contextLabel": "During a city council debate about noise ordinances, a resident who runs late-night outdoor concerts argues:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Everyone has a right to free speech, so the city can't stop me from running loudspeaker concerts in my backyard at 3 a.m. — free speech is free speech.&rdquo;</span>", "stem": "What logical fallacy is the resident committing?", "opts": ["False Equivalence &mdash; treating two things as equal when they differ in important ways", "Special Pleading &mdash; applying a rule to others while making an unjustified exception for oneself or one's side", "Equivocation &mdash; switching between two different meanings of the same word within one argument", "Straw Man Fallacy &mdash; misrepresenting an opponent's argument as something weaker or more extreme so it is easier to attack"], "ci": 2, "exp": "The resident starts with \"free speech\" meaning the right to express opinions without government censorship, then slides into using the same phrase to mean an unlimited right to make any amount of noise at any hour. Switching between two different meanings of the same word within one argument is Equivocation. This is not treating two unequal things as the same (False Equivalence), making an unjustified exception for oneself (Special Pleading), or distorting an opponent's position (Straw Man).", "hint": "Check whether \"free speech\" means the same thing at the start of the argument as it does by the end."}, {"contextLabel": "During a public hearing about building a shopping center on a wetland, an opponent argues:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Think of all the baby ducks who will lose their home if this shopping center gets built. How could anyone let that happen?&rdquo;</span>", "stem": "What logical fallacy is the opponent committing?", "opts": ["Red Herring &mdash; introducing an unrelated topic to distract from the real issue being debated", "Slippery Slope &mdash; claiming that one small step will inevitably lead to a chain of extreme consequences without evidence", "Appeal to Emotion &mdash; trying to win an argument by stirring up feelings such as fear or pity instead of giving evidence", "Bandwagon Fallacy &mdash; arguing that something is true or good simply because many people believe or do it"], "ci": 2, "exp": "Rather than presenting evidence about the wetland's ecological value, the opponent tries to win the argument by making the audience feel sympathy for baby ducks. Trying to win through feelings like pity rather than evidence is Appeal to Emotion. The opponent does not change the subject to something unrelated (Red Herring), predict a chain of extreme consequences (Slippery Slope), or appeal to what most people already believe (Bandwagon).", "hint": "Notice that the argument is aimed at how the audience feels rather than at any evidence about the wetland itself."}, {"contextLabel": "During a town meeting about banning gas-powered leaf blowers, a resident argues:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Half the towns in the county have already banned gas-powered leaf blowers, so our town should ban them too.&rdquo;</span>", "stem": "What logical fallacy is the resident committing?", "opts": ["Genetic Fallacy &mdash; judging an idea only by where it came from rather than by its merits", "Bandwagon Fallacy &mdash; arguing that something is true or good simply because many people believe or do it", "Appeal to Authority &mdash; treating someone's opinion as proof because of who they are, even when the topic is outside their expertise", "Middle Ground Fallacy &mdash; assuming the compromise between two positions must be correct just because it is in the middle"], "ci": 1, "exp": "The resident's reason for banning leaf blowers is simply that other towns have already done it, not any evidence about noise, pollution, or effectiveness. Arguing that something is right just because many others do it is the Bandwagon Fallacy. This is not judging the idea by its origin (Genetic Fallacy), citing an expert's opinion (Appeal to Authority), or assuming a middle position must be correct (Middle Ground).", "hint": "Ask what evidence, if any, is given about leaf blowers themselves, versus what other towns happen to be doing."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
