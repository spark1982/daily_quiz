var TODAY_STR = "20260928";
var RAW_QUESTIONS = [{"passage": "The following text is from a short story.<br><br>Captain Elana Voss had commanded the ferry for thirty-one years, and in all that time she had let no one else take the wheel through the strait's final turn, where a submerged shelf of rock forced every vessel into a narrow, current-swept channel. Tonight, watching her daughter's hands tighten and then loosen on the wheel exactly as her own once had, she said nothing, though her right foot pressed instinctively against a deck that offered no brake to press.", "stem": "The text mainly portrays Elana as someone who", "opts": ["recognizes her daughter's growing skill but cannot fully suppress her own instinct to control the situation.", "doubts that her daughter is ready to navigate the strait alone.", "regrets having spent so many years refusing to let anyone else take the wheel.", "is indifferent to whether her daughter succeeds in navigating the strait."], "ci": 0, "exp": "Elana &ldquo;said nothing&rdquo; as her daughter took the wheel, showing restraint and trust, yet her foot pressed &ldquo;instinctively against a deck that offered no brake to press,&rdquo; showing that her old habit of control has not fully faded. The text gives no sign of doubt about her daughter's readiness, no stated regret about her past refusal to share the wheel, and her physical reaction shows she is far from indifferent.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Urban planners have begun requiring new sidewalks to include gaps for tree roots, a costly change that some city budgets have resisted. <u>Yet studies measuring surface temperatures on streets with mature tree canopies found readings as much as 11 degrees Fahrenheit cooler than on comparably busy streets without canopy cover, a difference wide enough to affect how long residents without air conditioning can safely remain outdoors.</u> Advocates now cite these measurements whenever a budget committee questions the expense.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It provides a measurement that helps justify the expense described earlier in the text.", "It challenges the accuracy of the temperature studies mentioned earlier in the text.", "It introduces a new expense that city budgets must also cover.", "It shows that the costly change described earlier in the text has been abandoned by most cities."], "ci": 0, "exp": "The text opens by noting that the root-gap requirement is costly and that some budgets have resisted it. The underlined sentence supplies a concrete temperature measurement, and the final sentence confirms that &ldquo;advocates now cite these measurements&rdquo; to answer budget objections, so the sentence functions as supporting justification. It does not challenge the studies, introduce a new expense, or indicate the change was abandoned.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "<strong>Text 1</strong><br>For much of the twentieth century, archaeologists held that only Homo sapiens possessed the cognitive capacity for symbolic behavior such as painting on cave walls, since no securely dated non-human hominin site had ever produced such imagery.<br><br><strong>Text 2</strong><br>In 2018, a team led by archaeologist Dirk Hoffmann used a new uranium-thorium dating method to show that red pigment markings in three Spanish caves were at least 64,000 years old&mdash;more than 20,000 years before Homo sapiens is known to have reached the Iberian Peninsula. Hoffmann argues that the markings must therefore be the work of Neanderthals, the only hominins present in the region at that time.", "stem": "Based on the texts, how would Hoffmann (Text 2) most likely respond to the view presented in Text 1?", "opts": ["He would agree with it, since his dating method could not rule out that Homo sapiens made the markings.", "He would argue that it cannot be correct, since his findings indicate that hominins other than Homo sapiens produced symbolic imagery.", "He would argue that the view understates how long Homo sapiens has occupied the Iberian Peninsula.", "He would reject the new dating method as unreliable for markings this old."], "ci": 1, "exp": "Text 1 claims only Homo sapiens could produce symbolic imagery. Hoffmann's dating places the markings &ldquo;more than 20,000 years before Homo sapiens is known to have reached the Iberian Peninsula&rdquo; and attributes them to Neanderthals, &ldquo;the only hominins present in the region at that time.&rdquo; That directly contradicts Text 1's view rather than supporting it, and Hoffmann relies on the dating method himself rather than doubting it; the passage says nothing about Homo sapiens occupying the peninsula longer than believed.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "<strong>Text 1</strong><br>Economist Priya Nair contends that the shift to remote work has permanently reduced revenue at restaurants near downtown office districts, since fewer office workers are present on weekdays to buy lunch.<br><br><strong>Text 2</strong><br>A 2024 analysis of point-of-sale records from 200 downtown restaurants found that in-person weekday lunch sales did fall after 2021, but total weekday revenue, including delivery and takeout orders placed by remote workers still living nearby, was statistically indistinguishable from pre-2021 levels at most locations.", "stem": "Based on the texts, how would the authors of the analysis described in Text 2 most likely characterize Nair's claim in Text 1?", "opts": ["As accurate, since in-person lunch sales are the only category of revenue that matters to downtown restaurants.", "As incomplete, since it considers only one category of sales and overlooks revenue from delivery and takeout orders that offset the decline.", "As irrelevant, since remote workers no longer live near the downtown office districts they once worked in.", "As premature, since point-of-sale records have not yet been collected for enough restaurants to draw any conclusion."], "ci": 1, "exp": "Text 2 reports that although in-person lunch sales fell, total weekday revenue including delivery and takeout &ldquo;was statistically indistinguishable from pre-2021 levels,&rdquo; because remote workers were &ldquo;still living nearby.&rdquo; That shows Nair's claim, based only on in-person sales, leaves out revenue that offsets the decline. The analysis does not treat in-person sales as the only relevant category, does not say remote workers moved away, and did draw a conclusion from 200 restaurants' records.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "Ancient Roman piers built from marine concrete have withstood two thousand years of pounding waves, and engineers have long wondered why the material has not crumbled the way modern marine concrete often does within decades. Researchers hypothesized that pale mineral deposits called lime clasts, found scattered through the ancient concrete, react with seawater seeping into small cracks and precipitate calcium carbonate that seals the cracks shut. To test this, the team examined a nearby Roman structure built using a modified local recipe that lacked lime clasts entirely. Despite identical seawater exposure, cracks in that structure had not healed and had instead widened over time. This finding suggests that ____", "stem": "Which choice most logically completes the text?", "opts": ["seawater exposure alone is sufficient to seal cracks in Roman marine concrete.", "the presence of lime clasts, rather than seawater exposure alone, is responsible for the self-healing of Roman marine concrete.", "modern marine concrete contains more lime clasts than ancient Roman concrete does.", "the modified recipe produced concrete that was more resistant to cracking than the original recipe."], "ci": 1, "exp": "Both structures had &ldquo;identical seawater exposure,&rdquo; yet only the one lacking lime clasts failed to heal, with cracks that &ldquo;widened over time.&rdquo; That isolates the lime clasts, not seawater alone, as the cause of self-healing. The text already shows seawater exposure alone did not seal the modified structure's cracks, says nothing about modern concrete's composition, and the modified recipe's widening cracks show it was less resistant, not more.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Naked mole rats live in densely packed underground burrows where oxygen levels regularly fall far below what most mammals can tolerate; a mouse deprived of oxygen for even a few minutes suffers fatal brain damage as neurons flood with the signaling chemical glutamate. Naked mole rats, by contrast, survive up to eighteen minutes without oxygen by switching their neurons to run on fructose instead of glucose, a shift that limits glutamate buildup. In a follow-up experiment, researchers blocked the neurons' fructose transporters before depriving the animals of oxygen. The treated mole rats died within minutes, at roughly the same rate as ordinary mice. This result indicates that ____", "stem": "Which choice most logically completes the text?", "opts": ["naked mole rats' large body size, rather than any change in how their neurons use energy, explains their tolerance for low oxygen.", "mice could survive extended oxygen deprivation if they also lived in underground burrows.", "the ability to metabolize fructose rather than glucose during oxygen deprivation is specifically responsible for naked mole rats' unusual tolerance.", "blocking glutamate production directly caused the treated mole rats to die more quickly than untreated mole rats."], "ci": 2, "exp": "Blocking the neurons' fructose transporters, without changing the animals' size or burrow, caused mole rats to die &ldquo;at roughly the same rate as ordinary mice.&rdquo; Removing the fructose pathway removed the tolerance, which points to that metabolic shift, not body size, as the cause. The text never suggests burrow living alone would help mice, and the experiment blocked fructose transporters, not glutamate production directly.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Marine biologists hypothesized that fish swimming in larger schools face a lower risk of being caught by an individual predator, an effect sometimes attributed to the &ldquo;confusion&rdquo; created when a predator faces many simultaneous, similarly patterned targets. To test the hypothesis, researchers released a single predatory fish into tanks containing schools of prey fish of varying sizes and recorded the percentage of attacks that ended in a successful capture.<table style=\"border-collapse:collapse;margin:10px 0;font-size:0.88rem;\"><tr><th style=\"border:1px solid #999;padding:4px 8px;\">School size</th><th style=\"border:1px solid #999;padding:4px 8px;\">Attacks recorded</th><th style=\"border:1px solid #999;padding:4px 8px;\">Percent of attacks resulting in capture</th></tr><tr><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">5 fish</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">40</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">42%</td></tr><tr><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">20 fish</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">40</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">27%</td></tr><tr><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">50 fish</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">40</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">15%</td></tr></table>", "stem": "Which choice best describes data from the table that support the researchers' hypothesis?", "opts": ["As school size increased from 5 to 50 fish, the percentage of attacks resulting in capture steadily decreased.", "The number of attacks recorded was the same across all three school sizes.", "Schools of 20 fish experienced fewer total attacks than schools of 5 fish did.", "Predators were unable to capture any fish when school size reached 50."], "ci": 0, "exp": "The hypothesis predicts that larger schools lower an individual fish's risk of capture. The table shows the percentage of attacks resulting in capture falling from 42% at 5 fish to 27% at 20 fish to 15% at 50 fish, directly supporting that prediction. The number of attacks recorded (40) was held constant across school sizes, which is a feature of the experiment's design rather than evidence for the hypothesis, the attack counts were equal rather than different across sizes, and captures still occurred, at 15%, even in schools of 50.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "An urban planner claims that installing protected bike lanes along a commercial corridor increases foot traffic to nearby shops, arguing that cyclists and pedestrians linger and browse more than drivers searching for parking do.", "stem": "Which finding, if true, would most directly support the planner's claim?", "opts": ["Sales tax revenue on a comparable commercial corridor without new bike lanes remained flat over the same period that sales on the corridor with new bike lanes rose by 15 percent.", "Cyclists reported feeling safer on streets with protected bike lanes than on streets without them.", "The corridor with new bike lanes had fewer available parking spaces after the lanes were installed than it had before.", "Shop owners on the corridor with new bike lanes were surveyed and said they supported the bike lane project before it was built."], "ci": 0, "exp": "The planner's claim is about foot traffic and shop revenue. A comparison showing sales rising 15 percent on the corridor with new bike lanes while a similar corridor without them stayed flat directly links the lanes to increased business. Cyclists' sense of safety does not address shopping behavior, reduced parking describes a possible downside rather than support for the claim, and owners' opinions expressed before construction say nothing about the lanes' actual effect on foot traffic.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "When the philosopher's theory of justice first appeared, colleagues dismissed it as ____, insisting that its narrow focus on procedural fairness ignored the deeper structural inequalities that shaped who could even participate in those procedures to begin with. Decades later, legal scholars returned to the theory and argued that its narrowness was in fact a strength: by isolating procedural questions, the theory allowed for precise arguments that broader theories could not sustain.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["myopic", "plagiarized", "impartial", "celebrated"], "ci": 0, "exp": "Colleagues criticized the theory's &ldquo;narrow focus&rdquo; for ignoring larger structural issues, a criticism the word &ldquo;myopic&rdquo; (short-sighted or narrowly focused) captures precisely. &ldquo;Plagiarized&rdquo; concerns originality, which is not at issue; &ldquo;impartial&rdquo; describes fairness of procedure, not the scope colleagues criticized; and &ldquo;celebrated&rdquo; contradicts the dismissive reaction the text describes.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "Meteorologists have long noted that a sudden, localized drop in barometric pressure can presage the arrival of a major storm system within the next twenty-four hours, though the same kind of pressure drop far more often precedes nothing more than an ordinary afternoon shower.", "stem": "As used in the text, what does the word &ldquo;presage&rdquo; most nearly mean?", "opts": ["prevent", "cause", "signal in advance", "disprove"], "ci": 2, "exp": "The text says the pressure drop &ldquo;precedes&rdquo; either a major storm or, more often, an ordinary shower, meaning it can indicate what is coming without guaranteeing it. &ldquo;Signal in advance&rdquo; captures this sense of &ldquo;presage.&rdquo; The pressure drop does not prevent or cause the storm, and nothing in the text is being disproved.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "For more than a century, physicians regarded the human appendix as a vestigial organ with no remaining function, citing the fact that removing it causes no obvious health problems. In 2007, however, immunologists proposed that the appendix serves as a protected reservoir for beneficial gut bacteria, sheltering them from illnesses such as severe diarrhea that can otherwise wipe out the gut's microbial population. Subsequent studies comparing recovery times after such illnesses found that patients whose appendix had been removed took longer, on average, to restore normal gut bacteria than patients whose appendix remained intact.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It presents a long-held view, describes a proposal that complicates it, and cites evidence consistent with the proposal.", "It describes a medical procedure and then argues that the procedure should no longer be performed.", "It compares two organs with similar functions and explains why one is more essential than the other.", "It summarizes a study and then identifies a flaw in how the study measured recovery times."], "ci": 0, "exp": "The text opens with the long-held view that the appendix is vestigial, introduces the 2007 proposal that it shelters beneficial bacteria, and closes with recovery-time studies consistent with that proposal.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "Engineers addressing the risk of earthquake damage to tall buildings have generally pursued one of two strategies. Base isolation places flexible bearings between a building and its foundation, allowing the ground to shift beneath the structure while the building above moves comparatively little; this approach is highly effective but requires expensive bearings and is difficult to retrofit into existing buildings. Tuned mass dampers instead place an enormous counterweight near the top of a building, using motors to shift it against the building's sway; this approach can be installed after construction is complete but generally reduces motion less dramatically than base isolation does.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To argue that tuned mass dampers should replace base isolation as the standard method of earthquake protection", "To describe two engineering approaches to reducing earthquake damage and the trade-off each involves", "To explain why older buildings are more vulnerable to earthquake damage than newer buildings are", "To trace the historical development of base isolation technology from its earliest use to the present"], "ci": 1, "exp": "The text presents base isolation and tuned mass dampers as two distinct strategies, noting for each what it accomplishes and what it costs: base isolation is effective but expensive and hard to retrofit, while tuned mass dampers are easier to install but reduce motion less. It does not argue for replacing one with the other, does not discuss older versus newer buildings, and gives no historical timeline.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}];

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];

  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
