var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261118";
var RAW_QUESTIONS = [{"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Sutter became rich by selling food and tools to the miners.", "Marshall saw gold flakes in the water beneath the sawmill.", "California became a state in 1850.", "San Francisco grew to more than twenty thousand people within two years."], "ci": 0, "exp": "The passage says &ldquo;Sutter himself was <i>ruined</i>,&rdquo; and it was <i>merchants</i> who charged high prices for food and tools. The other three statements match the passage: Marshall saw &ldquo;glittering flakes in the water channel beneath the mill,&rdquo; California &ldquo;became the thirty-first state in 1850,&rdquo; and the town &ldquo;swelled to more than twenty thousand within two years.&rdquo;", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The California Gold Rush</strong><br>In January 1848, a carpenter named James Marshall was building a sawmill for John Sutter along the American River in California. One morning he noticed glittering flakes in the water channel beneath the mill. Sutter wanted the discovery kept quiet, but rumors spread swiftly, and by December, President James K. Polk had confirmed to Congress that the reports were true.<br><br>The news set off one of the largest migrations in American history. In 1849, roughly 90,000 people, nicknamed &ldquo;forty-niners,&rdquo; poured into California by wagon and by ship. So many sailors abandoned their vessels to search for gold that hundreds of empty ships crowded San Francisco&rsquo;s harbor. The town, home to about a thousand people in early 1848, swelled to more than twenty thousand within two years.<br><br>Few miners grew wealthy. Because thousands competed for the same streams, the easy gold disappeared quickly, while merchants charged staggering prices for food and tools. Sutter himself was ruined when gold seekers trampled his fields and his workers deserted him. Still, the rush transformed California, which became the thirty-first state in 1850."}, {"stem": "<b>Part A</b><br>According to the passage, why did few miners grow wealthy?", "opts": ["Sutter kept the discovery a secret, so most miners arrived too late.", "The government collected most of the gold that the miners found.", "Crowds of miners used up the easy gold, and supplies cost a great deal.", "Most miners spent their money on ships to sail back home."], "ci": 2, "exp": "The third paragraph gives two reasons right after &ldquo;Few miners grew wealthy&rdquo;: &ldquo;Because thousands competed for the same streams, the easy gold disappeared quickly, while merchants charged staggering prices for food and tools.&rdquo;<br><b>Why not the others:</b> Sutter <i>wanted</i> it kept quiet, but &ldquo;rumors spread swiftly,&rdquo; so the secret did not last; the passage never mentions the government collecting gold or miners buying ships home.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A", "passage": "<strong>The California Gold Rush</strong><br>In January 1848, a carpenter named James Marshall was building a sawmill for John Sutter along the American River in California. One morning he noticed glittering flakes in the water channel beneath the mill. Sutter wanted the discovery kept quiet, but rumors spread swiftly, and by December, President James K. Polk had confirmed to Congress that the reports were true.<br><br>The news set off one of the largest migrations in American history. In 1849, roughly 90,000 people, nicknamed &ldquo;forty-niners,&rdquo; poured into California by wagon and by ship. So many sailors abandoned their vessels to search for gold that hundreds of empty ships crowded San Francisco&rsquo;s harbor. The town, home to about a thousand people in early 1848, swelled to more than twenty thousand within two years.<br><br>Few miners grew wealthy. Because thousands competed for the same streams, the easy gold disappeared quickly, while merchants charged staggering prices for food and tools. Sutter himself was ruined when gold seekers trampled his fields and his workers deserted him. Still, the rush transformed California, which became the thirty-first state in 1850."}, {"stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did few miners grow wealthy?&rdquo;)?<br><br><b>A.</b> &ldquo;rumors spread swiftly&rdquo;<br><b>B.</b> &ldquo;Because thousands competed for the same streams, the easy gold disappeared quickly&rdquo;<br><b>C.</b> &ldquo;merchants charged staggering prices for food and tools&rdquo;<br><b>D.</b> &ldquo;Few miners grew wealthy.&rdquo;<br><b>E.</b> &ldquo;the rush transformed California&rdquo;<br><b>F.</b> &ldquo;hundreds of empty ships crowded San Francisco&rsquo;s harbor&rdquo;", "opts": ["B and C", "A and B", "D and F", "C and E"], "ci": 0, "exp": "<b>B</b> shows that the easy gold ran out, and <b>C</b> shows that supplies were very expensive &mdash; together they explain why miners stayed poor.<br><b>Why not the others:</b> <b>A</b> explains how the news got out; <b>D</b> is the claim itself, not evidence for it; <b>E</b> is about California as a whole; <b>F</b> is about sailors leaving their ships.<br><b>Tip:</b> evidence must explain <i>why</i>, not just repeat <i>what</i>.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A", "passage": "<strong>The California Gold Rush</strong><br>In January 1848, a carpenter named James Marshall was building a sawmill for John Sutter along the American River in California. One morning he noticed glittering flakes in the water channel beneath the mill. Sutter wanted the discovery kept quiet, but rumors spread swiftly, and by December, President James K. Polk had confirmed to Congress that the reports were true.<br><br>The news set off one of the largest migrations in American history. In 1849, roughly 90,000 people, nicknamed &ldquo;forty-niners,&rdquo; poured into California by wagon and by ship. So many sailors abandoned their vessels to search for gold that hundreds of empty ships crowded San Francisco&rsquo;s harbor. The town, home to about a thousand people in early 1848, swelled to more than twenty thousand within two years.<br><br>Few miners grew wealthy. Because thousands competed for the same streams, the easy gold disappeared quickly, while merchants charged staggering prices for food and tools. Sutter himself was ruined when gold seekers trampled his fields and his workers deserted him. Still, the rush transformed California, which became the thirty-first state in 1850."}, {"stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Many sailors left their ships to look for gold.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> Sutter was ruined.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> Thousands of miners searched the same streams.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> Hundreds of empty ships crowded the harbor.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Gold seekers trampled Sutter&rsquo;s fields, and his workers deserted him.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> The easy gold disappeared quickly.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> President Polk told Congress the reports of gold were true.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> Huge numbers of people headed to California.</td></tr></table>Which choice matches every cause with the correct effect?", "opts": ["1–A, 2–B, 3–C, 4–D", "1–B, 2–C, 3–A, 4–D", "1–C, 2–B, 3–A, 4–D", "1–B, 2–D, 3–A, 4–C"], "ci": 1, "exp": "Test each pair with &ldquo;Because ___, ___.&rdquo; <b>1–B:</b> Because sailors abandoned their vessels, &ldquo;hundreds of empty ships crowded San Francisco&rsquo;s harbor.&rdquo; <b>2–C:</b> &ldquo;<i>Because</i> thousands competed for the same streams, the easy gold disappeared quickly.&rdquo; <b>3–A:</b> &ldquo;Sutter himself was ruined <i>when</i> gold seekers trampled his fields.&rdquo; <b>4–D:</b> after Polk confirmed the reports, &ldquo;the news set off one of the largest migrations in American history.&rdquo; Matching 1–A, 2–B, 3–C, 4–D just in order is the trap &mdash; a cause and its effect are almost never in the same row.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A", "passage": "<strong>The California Gold Rush</strong><br>In January 1848, a carpenter named James Marshall was building a sawmill for John Sutter along the American River in California. One morning he noticed glittering flakes in the water channel beneath the mill. Sutter wanted the discovery kept quiet, but rumors spread swiftly, and by December, President James K. Polk had confirmed to Congress that the reports were true.<br><br>The news set off one of the largest migrations in American history. In 1849, roughly 90,000 people, nicknamed &ldquo;forty-niners,&rdquo; poured into California by wagon and by ship. So many sailors abandoned their vessels to search for gold that hundreds of empty ships crowded San Francisco&rsquo;s harbor. The town, home to about a thousand people in early 1848, swelled to more than twenty thousand within two years.<br><br>Few miners grew wealthy. Because thousands competed for the same streams, the easy gold disappeared quickly, while merchants charged staggering prices for food and tools. Sutter himself was ruined when gold seekers trampled his fields and his workers deserted him. Still, the rush transformed California, which became the thirty-first state in 1850."}, {"stem": "Read this sentence from the passage.<br><br>&ldquo;Ordinarily the air keeps the two charges apart, but the difference <b>persists</b> and grows until the air can no longer hold them back.&rdquo;<br><br>What does <b>persists</b> mean as it is used in this sentence?", "opts": ["slowly weakens", "moves toward the ground", "continues to exist", "changes direction"], "ci": 2, "exp": "The difference &ldquo;persists <i>and grows</i>&rdquo; until it is too big to hold back, so it must keep going &mdash; it <b>continues to exist</b>. &ldquo;Slowly weakens&rdquo; is the opposite of what happens, because the difference ends up strong enough to make a spark.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>How Lightning Forms</strong><br>Inside a towering thundercloud, powerful currents of air carry water droplets upward, where they freeze. As the air keeps churning, tiny ice crystals collide with heavier pellets of soft hail. These collisions knock electric charges loose. The lightweight crystals, which become positively charged, are swept to the top of the cloud, while the heavier, negatively charged pellets sink toward the bottom.<br><br>Ordinarily the air keeps the two charges apart, but the difference persists and grows until the air can no longer hold them back. Then a giant spark leaps between the charges, either inside the cloud or down to the ground. That spark is lightning.<br><br>A bolt is extraordinarily hot, about five times hotter than the surface of the sun. It heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder. Because light travels much faster than sound, you see the flash before you hear the rumble. Counting the seconds between them reveals how far away the strike was: roughly five seconds for every mile."}, {"stem": "According to the passage, which event happens right <b>after</b> the difference between the charges grows too large for the air to hold back?", "opts": ["The air expands and makes a boom.", "Ice crystals collide with pellets of soft hail.", "Water droplets are carried upward and freeze.", "A giant spark leaps between the charges."], "ci": 3, "exp": "The second paragraph says the difference grows &ldquo;until the air can no longer hold them back. <i>Then</i> a giant spark leaps between the charges.&rdquo; The boom of thunder comes later, after the spark heats the air. The collisions and freezing droplets happen earlier, before the charges separate.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>How Lightning Forms</strong><br>Inside a towering thundercloud, powerful currents of air carry water droplets upward, where they freeze. As the air keeps churning, tiny ice crystals collide with heavier pellets of soft hail. These collisions knock electric charges loose. The lightweight crystals, which become positively charged, are swept to the top of the cloud, while the heavier, negatively charged pellets sink toward the bottom.<br><br>Ordinarily the air keeps the two charges apart, but the difference persists and grows until the air can no longer hold them back. Then a giant spark leaps between the charges, either inside the cloud or down to the ground. That spark is lightning.<br><br>A bolt is extraordinarily hot, about five times hotter than the surface of the sun. It heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder. Because light travels much faster than sound, you see the flash before you hear the rumble. Counting the seconds between them reveals how far away the strike was: roughly five seconds for every mile."}, {"stem": "Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Ice crystals collide with pellets of soft hail.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> A giant spark leaps between the charges.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> Lightning heats the air extremely fast.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> Electric charges are knocked loose.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Light travels much faster than sound.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> You see the flash before you hear the thunder.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The difference between the charges grows too large for the air to hold back.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> The air expands with a boom called thunder.</td></tr></table>Which choice matches every cause with the correct effect?", "opts": ["1–B, 2–D, 3–C, 4–A", "1–A, 2–B, 3–C, 4–D", "1–B, 2–C, 3–D, 4–A", "1–A, 2–D, 3–C, 4–B"], "ci": 0, "exp": "<b>1–B:</b> &ldquo;These collisions knock electric charges loose.&rdquo; <b>2–D:</b> the bolt &ldquo;heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder.&rdquo; <b>3–C:</b> &ldquo;<i>Because</i> light travels much faster than sound, you see the flash before you hear the rumble.&rdquo; <b>4–A:</b> when the air &ldquo;can no longer hold them back,&rdquo; &ldquo;a giant spark leaps between the charges.&rdquo; Watch for the trap that swaps 2 and 3: thunder is the effect of the <i>heat</i>, while the delay is the effect of <i>speed</i>.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A", "passage": "<strong>How Lightning Forms</strong><br>Inside a towering thundercloud, powerful currents of air carry water droplets upward, where they freeze. As the air keeps churning, tiny ice crystals collide with heavier pellets of soft hail. These collisions knock electric charges loose. The lightweight crystals, which become positively charged, are swept to the top of the cloud, while the heavier, negatively charged pellets sink toward the bottom.<br><br>Ordinarily the air keeps the two charges apart, but the difference persists and grows until the air can no longer hold them back. Then a giant spark leaps between the charges, either inside the cloud or down to the ground. That spark is lightning.<br><br>A bolt is extraordinarily hot, about five times hotter than the surface of the sun. It heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder. Because light travels much faster than sound, you see the flash before you hear the rumble. Counting the seconds between them reveals how far away the strike was: roughly five seconds for every mile."}, {"stem": "According to the passage, what causes the lightweight ice crystals to end up at the top of the cloud?", "opts": ["The negative charges at the bottom of the cloud push the crystals away.", "The churning air sweeps the light crystals upward while heavier pellets sink.", "The crystals melt into droplets that are lighter than air.", "The heat from lightning lifts the crystals to the top."], "ci": 1, "exp": "The passage explains that &ldquo;powerful currents of air carry water droplets upward&rdquo; and that the &ldquo;lightweight crystals&rdquo; are &ldquo;swept to the top of the cloud, while the heavier&hellip; pellets sink.&rdquo; Weight and moving air sort them. The passage never says the charges push the crystals, and lightning happens <i>after</i> the charges are separated, so it cannot be the cause.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "passage": "<strong>How Lightning Forms</strong><br>Inside a towering thundercloud, powerful currents of air carry water droplets upward, where they freeze. As the air keeps churning, tiny ice crystals collide with heavier pellets of soft hail. These collisions knock electric charges loose. The lightweight crystals, which become positively charged, are swept to the top of the cloud, while the heavier, negatively charged pellets sink toward the bottom.<br><br>Ordinarily the air keeps the two charges apart, but the difference persists and grows until the air can no longer hold them back. Then a giant spark leaps between the charges, either inside the cloud or down to the ground. That spark is lightning.<br><br>A bolt is extraordinarily hot, about five times hotter than the surface of the sun. It heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder. Because light travels much faster than sound, you see the flash before you hear the rumble. Counting the seconds between them reveals how far away the strike was: roughly five seconds for every mile."}, {"stem": "Which event happens right <b>after</b> Mr. Okafor explains why cold air settles in low spots?", "opts": ["Mr. Okafor brings out bedsheets and a tray of seedlings.", "Amara says that she will have to start over.", "Amara drapes a sheet over the new seedlings.", "Amara notices that her seedlings are drooping."], "ci": 1, "exp": "Right after Mr. Okafor says &ldquo;cold air sinks and settles in low spots,&rdquo; Amara &ldquo;poked at a ruined stem&rdquo; and said, &ldquo;So I have to start over.&rdquo; Only then does he go to his garage for the sheets and seedlings. Amara noticed the drooping leaves at the very beginning, and she covered the new plants at the end.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Thirty-Four Degrees</strong><br>Amara knelt beside the raised bed and stared at her tomato seedlings. Yesterday their leaves had been a glossy green; this morning they drooped, dark and limp, like wet paper.<br><br>&ldquo;Frost,&rdquo; said Mr. Okafor, leaning on the fence between their yards. &ldquo;It dipped below freezing around three in the morning.&rdquo;<br><br>Amara&rsquo;s throat tightened. &ldquo;The forecast said thirty-four degrees. I almost covered them, but I decided it wasn&rsquo;t worth the trouble.&rdquo;<br><br>Mr. Okafor nodded slowly. &ldquo;A forecast is a guess, not a promise. Thirty-four at the airport can mean thirty at the bottom of a garden, because cold air sinks and settles in low spots.&rdquo;<br><br>She poked at a ruined stem. &ldquo;So I have to start over.&rdquo;<br><br>&ldquo;You do,&rdquo; he said, &ldquo;but not from nothing.&rdquo; He disappeared into his garage and returned with an armful of old bedsheets and a tray of sturdy seedlings he had raised under a lamp. &ldquo;Plant these tomorrow. And when the forecast is close to freezing, assume the worst.&rdquo;<br><br>The next afternoon, Amara planted the new seedlings. That night she draped a sheet over them even though the sky looked perfectly clear. Frost glittered on the lawn the following morning, but beneath the sheet, every leaf was green."}, {"stem": "Which word means the <b>SAME</b> or nearly the same as <b>sturdy</b> as it is used in the story?", "opts": ["tiny", "strong", "young", "expensive"], "ci": 1, "exp": "The new seedlings were &ldquo;sturdy&rdquo; because Mr. Okafor had raised them carefully under a lamp, unlike Amara&rsquo;s seedlings, which were &ldquo;limp.&rdquo; <i>Sturdy</i> means <b>strong</b> and hard to damage. The seedlings were young, but <i>young</i> describes their age, not what <i>sturdy</i> means.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>Thirty-Four Degrees</strong><br>Amara knelt beside the raised bed and stared at her tomato seedlings. Yesterday their leaves had been a glossy green; this morning they drooped, dark and limp, like wet paper.<br><br>&ldquo;Frost,&rdquo; said Mr. Okafor, leaning on the fence between their yards. &ldquo;It dipped below freezing around three in the morning.&rdquo;<br><br>Amara&rsquo;s throat tightened. &ldquo;The forecast said thirty-four degrees. I almost covered them, but I decided it wasn&rsquo;t worth the trouble.&rdquo;<br><br>Mr. Okafor nodded slowly. &ldquo;A forecast is a guess, not a promise. Thirty-four at the airport can mean thirty at the bottom of a garden, because cold air sinks and settles in low spots.&rdquo;<br><br>She poked at a ruined stem. &ldquo;So I have to start over.&rdquo;<br><br>&ldquo;You do,&rdquo; he said, &ldquo;but not from nothing.&rdquo; He disappeared into his garage and returned with an armful of old bedsheets and a tray of sturdy seedlings he had raised under a lamp. &ldquo;Plant these tomorrow. And when the forecast is close to freezing, assume the worst.&rdquo;<br><br>The next afternoon, Amara planted the new seedlings. That night she draped a sheet over them even though the sky looked perfectly clear. Frost glittered on the lawn the following morning, but beneath the sheet, every leaf was green."}, {"stem": "What can the reader infer about Mr. Okafor?", "opts": ["He is angry that Amara ignored his advice.", "He believes weather forecasts are useless.", "He works as a weather reporter at the airport.", "He is an experienced gardener who plans ahead for problems."], "ci": 3, "exp": "He knows that &ldquo;cold air sinks and settles in low spots,&rdquo; and he already has old bedsheets and &ldquo;a tray of sturdy seedlings he had raised under a lamp&rdquo; ready to share. He calls a forecast &ldquo;a guess, not a promise,&rdquo; which means forecasts are not perfect &mdash; not that they are useless. He never sounds angry, and nothing says he works at the airport.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong     else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
