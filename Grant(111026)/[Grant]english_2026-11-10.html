var RAW_QUESTIONS = [{"stem": "Which event happened right after Lincoln signed the Pacific Railway Act?", "opts": ["A cross-country trip could be made in about a week.", "The Union Pacific began laying track westward from Omaha.", "The Central Pacific began laying track eastward from Sacramento.", "The two lines met at Promontory Summit in Utah."], "ci": 2, "exp": "The act was signed in 1862, and \"The Central Pacific began laying track eastward from Sacramento in 1863.\" The Union Pacific started \"two years later,\" so it came after the Central Pacific.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Joining a Continent by Rail</strong><br>In 1862, President Abraham Lincoln signed the Pacific Railway Act, a law that promised land and money to companies willing to connect the eastern railroad network to California. Two companies accepted the challenge. The Central Pacific began laying track eastward from Sacramento in 1863, while the Union Pacific started laying track westward from Omaha, Nebraska, two years later.<br><br>The Central Pacific faced the steeper obstacle: the granite peaks of the Sierra Nevada. Because few local workers stayed with the dangerous job, the company hired thousands of Chinese immigrants, who blasted tunnels through solid rock and endured winters buried under deep snow. Meanwhile, Union Pacific crews, many of them Irish immigrants and Civil War veterans, raced across the open plains, sometimes laying several miles of track in a single day.<br><br>On May 10, 1869, the two lines finally met at Promontory Summit in Utah, where a ceremonial golden spike was tapped into the last tie. A journey across the country that had once required months by wagon could now be completed in about a week."}, {"stem": "In the third paragraph, the author writes that \"a <b>ceremonial</b> golden spike was tapped into the last tie.\" What does <b>ceremonial</b> most likely mean?", "opts": ["paid for by the president of the United States", "used as part of a special, formal event", "made by hand by the workers who built the line", "made to hold the last piece of track firmly in place"], "ci": 1, "exp": "The spike was \"tapped\" in on the day the lines \"finally met,\" which marks a special event, so <i>ceremonial</i> means used for a formal celebration. A golden spike would be too soft to hold track firmly, so \"made to hold the track in place\" does not fit.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Joining a Continent by Rail</strong><br>In 1862, President Abraham Lincoln signed the Pacific Railway Act, a law that promised land and money to companies willing to connect the eastern railroad network to California. Two companies accepted the challenge. The Central Pacific began laying track eastward from Sacramento in 1863, while the Union Pacific started laying track westward from Omaha, Nebraska, two years later.<br><br>The Central Pacific faced the steeper obstacle: the granite peaks of the Sierra Nevada. Because few local workers stayed with the dangerous job, the company hired thousands of Chinese immigrants, who blasted tunnels through solid rock and endured winters buried under deep snow. Meanwhile, Union Pacific crews, many of them Irish immigrants and Civil War veterans, raced across the open plains, sometimes laying several miles of track in a single day.<br><br>On May 10, 1869, the two lines finally met at Promontory Summit in Utah, where a ceremonial golden spike was tapped into the last tie. A journey across the country that had once required months by wagon could now be completed in about a week."}, {"stem": "According to the passage, how long did a trip across the country take once the railroad was finished?", "opts": ["about a month", "several months", "about two days", "about a week"], "ci": 3, "exp": "The passage says the journey \"could now be completed in about a week.\" \"Several months\" describes the trip by wagon before the railroad.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Joining a Continent by Rail</strong><br>In 1862, President Abraham Lincoln signed the Pacific Railway Act, a law that promised land and money to companies willing to connect the eastern railroad network to California. Two companies accepted the challenge. The Central Pacific began laying track eastward from Sacramento in 1863, while the Union Pacific started laying track westward from Omaha, Nebraska, two years later.<br><br>The Central Pacific faced the steeper obstacle: the granite peaks of the Sierra Nevada. Because few local workers stayed with the dangerous job, the company hired thousands of Chinese immigrants, who blasted tunnels through solid rock and endured winters buried under deep snow. Meanwhile, Union Pacific crews, many of them Irish immigrants and Civil War veterans, raced across the open plains, sometimes laying several miles of track in a single day.<br><br>On May 10, 1869, the two lines finally met at Promontory Summit in Utah, where a ceremonial golden spike was tapped into the last tie. A journey across the country that had once required months by wagon could now be completed in about a week."}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["The Union Pacific finished first because the plains were easier to cross than the mountains.", "The golden spike ceremony in Utah was the most important event that happened in 1869.", "Two companies, building from opposite directions with the help of immigrant workers, created a railroad that greatly shortened travel across the country.", "Chinese immigrants were the only workers who helped build the railroad across the country."], "ci": 2, "exp": "The whole passage explains how the two companies built toward each other and how the finished line cut travel from months to \"about a week.\" The Union Pacific choice uses true details about the plains, but the passage never says either company \"finished first.\"", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Joining a Continent by Rail</strong><br>In 1862, President Abraham Lincoln signed the Pacific Railway Act, a law that promised land and money to companies willing to connect the eastern railroad network to California. Two companies accepted the challenge. The Central Pacific began laying track eastward from Sacramento in 1863, while the Union Pacific started laying track westward from Omaha, Nebraska, two years later.<br><br>The Central Pacific faced the steeper obstacle: the granite peaks of the Sierra Nevada. Because few local workers stayed with the dangerous job, the company hired thousands of Chinese immigrants, who blasted tunnels through solid rock and endured winters buried under deep snow. Meanwhile, Union Pacific crews, many of them Irish immigrants and Civil War veterans, raced across the open plains, sometimes laying several miles of track in a single day.<br><br>On May 10, 1869, the two lines finally met at Promontory Summit in Utah, where a ceremonial golden spike was tapped into the last tie. A journey across the country that had once required months by wagon could now be completed in about a week."}, {"stem": "According to the passage, what causes especially high \"spring\" tides?", "opts": ["The Sun, Moon, and Earth line up, so the pulls of the Sun and Moon combine.", "The Moon moves much closer to Earth during the spring months.", "The Sun and the Moon pull on Earth at right angles to each other.", "Warmer spring weather melts ice and adds water to the ocean."], "ci": 0, "exp": "The passage says, \"When the Sun, Moon, and Earth line up&hellip; their pulls combine to produce especially high and low &lsquo;spring&rsquo; tides.\" Pulling \"at right angles\" causes the gentler neap tides instead.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Why the Ocean Has Tides</strong><br>Along most coastlines, the ocean creeps up the beach and then slowly retreats about twice each day. These tides are caused mainly by the Moon. Although the Moon is about 239,000 miles away, its gravity pulls on everything on Earth, including the oceans. Water on the side of Earth nearest the Moon is pulled toward it and forms a bulge. A second bulge forms on the opposite side of the planet, where the Moon&rsquo;s pull is weakest and the water is, in a sense, left behind. As Earth spins, a coastline passes through both bulges, so it experiences two high tides and two low tides in a little more than a day.<br><br>The Sun influences tides too, but because it is so much farther away, its effect is less than half as strong as the Moon&rsquo;s. When the Sun, Moon, and Earth line up during a new or full moon, their pulls combine to produce especially high and low &ldquo;spring&rdquo; tides, which have nothing to do with the season. When the Sun and Moon pull at right angles, gentler &ldquo;neap&rdquo; tides occur. Fishermen, ship captains, and even tide-pool explorers consult tide tables so they are not caught off guard by the rising water."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The Sun has a stronger effect on tides than the Moon because the Sun is so large.", "Neap tides happen when the Sun and Moon pull at right angles.", "A bulge of water forms on the side of Earth nearest the Moon.", "Most coastlines have two high tides in a little more than a day."], "ci": 0, "exp": "The passage says the Sun's effect \"is less than half as strong as the Moon's\" because the Sun is \"so much farther away.\" The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Why the Ocean Has Tides</strong><br>Along most coastlines, the ocean creeps up the beach and then slowly retreats about twice each day. These tides are caused mainly by the Moon. Although the Moon is about 239,000 miles away, its gravity pulls on everything on Earth, including the oceans. Water on the side of Earth nearest the Moon is pulled toward it and forms a bulge. A second bulge forms on the opposite side of the planet, where the Moon&rsquo;s pull is weakest and the water is, in a sense, left behind. As Earth spins, a coastline passes through both bulges, so it experiences two high tides and two low tides in a little more than a day.<br><br>The Sun influences tides too, but because it is so much farther away, its effect is less than half as strong as the Moon&rsquo;s. When the Sun, Moon, and Earth line up during a new or full moon, their pulls combine to produce especially high and low &ldquo;spring&rdquo; tides, which have nothing to do with the season. When the Sun and Moon pull at right angles, gentler &ldquo;neap&rdquo; tides occur. Fishermen, ship captains, and even tide-pool explorers consult tide tables so they are not caught off guard by the rising water."}, {"stem": "Why does the author point out that spring tides \"have nothing to do with the season\"?", "opts": ["to compare the strength of the Sun with the Moon", "to keep readers from misunderstanding the name of the tide", "to show that tides are strongest during the spring", "to explain why ship captains use tide tables"], "ci": 1, "exp": "A reader might think \"spring\" tides happen only in springtime, so the author adds that the name has \"nothing to do with the season.\" The sentence does not say tides are strongest in spring; it says the opposite.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Why the Ocean Has Tides</strong><br>Along most coastlines, the ocean creeps up the beach and then slowly retreats about twice each day. These tides are caused mainly by the Moon. Although the Moon is about 239,000 miles away, its gravity pulls on everything on Earth, including the oceans. Water on the side of Earth nearest the Moon is pulled toward it and forms a bulge. A second bulge forms on the opposite side of the planet, where the Moon&rsquo;s pull is weakest and the water is, in a sense, left behind. As Earth spins, a coastline passes through both bulges, so it experiences two high tides and two low tides in a little more than a day.<br><br>The Sun influences tides too, but because it is so much farther away, its effect is less than half as strong as the Moon&rsquo;s. When the Sun, Moon, and Earth line up during a new or full moon, their pulls combine to produce especially high and low &ldquo;spring&rdquo; tides, which have nothing to do with the season. When the Sun and Moon pull at right angles, gentler &ldquo;neap&rdquo; tides occur. Fishermen, ship captains, and even tide-pool explorers consult tide tables so they are not caught off guard by the rising water."}, {"stem": "In the first paragraph, the ocean \"slowly <b>retreats</b>.\" Which word means the <b>OPPOSITE</b> of <b>retreats</b> as it is used in the passage?", "opts": ["sparkles", "settles", "withdraws", "advances"], "ci": 3, "exp": "Here <i>retreats</i> means moves back down the beach. The opposite is <i>advances</i> (moves forward). <i>Withdraws</i> means nearly the same as <i>retreats</i>, so it is a synonym, not an opposite.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Why the Ocean Has Tides</strong><br>Along most coastlines, the ocean creeps up the beach and then slowly retreats about twice each day. These tides are caused mainly by the Moon. Although the Moon is about 239,000 miles away, its gravity pulls on everything on Earth, including the oceans. Water on the side of Earth nearest the Moon is pulled toward it and forms a bulge. A second bulge forms on the opposite side of the planet, where the Moon&rsquo;s pull is weakest and the water is, in a sense, left behind. As Earth spins, a coastline passes through both bulges, so it experiences two high tides and two low tides in a little more than a day.<br><br>The Sun influences tides too, but because it is so much farther away, its effect is less than half as strong as the Moon&rsquo;s. When the Sun, Moon, and Earth line up during a new or full moon, their pulls combine to produce especially high and low &ldquo;spring&rdquo; tides, which have nothing to do with the season. When the Sun and Moon pull at right angles, gentler &ldquo;neap&rdquo; tides occur. Fishermen, ship captains, and even tide-pool explorers consult tide tables so they are not caught off guard by the rising water."}, {"stem": "Which event happened right after the canoe's surface became as smooth as a river stone?", "opts": ["Ben and Grandpa carried the canoe to the pond.", "Ben asked Grandpa, \"How much longer?\"", "A heron lifted into the air near the reeds.", "Grandpa showed Ben how to fill the cracks and press strips of cloth into place."], "ci": 3, "exp": "\"By Thursday the surface was as smooth as a river stone, and Grandpa showed him how to fill the cracks with resin and press strips of cloth into place.\" The question \"How much longer?\" came earlier, on the third afternoon.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Canoe in the Barn</strong><br>Ben had expected his first week at Grandpa Walt&rsquo;s farm to involve fishing, not sandpaper. Yet here he was in the drafty barn, rubbing the hull of a cracked cedar canoe while his arm throbbed.<br><br>&ldquo;How much longer?&rdquo; he asked on the third afternoon.<br><br>Grandpa ran his palm along the wood. &ldquo;Feel that rough patch near the bow? Not yet.&rdquo;<br><br>Ben sighed and kept sanding. By Thursday the surface was as smooth as a river stone, and Grandpa showed him how to fill the cracks with resin and press strips of cloth into place. Twice Ben rushed and trapped a bubble beneath the cloth, and twice Grandpa calmly peeled it back so they could begin again.<br><br>On Saturday morning they carried the canoe to the pond. Ben braced for water to seep through the old cracks, but the floor stayed dry. He dipped his paddle and glided toward the reeds, where a heron lifted into the air.<br><br>&ldquo;Wort var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
