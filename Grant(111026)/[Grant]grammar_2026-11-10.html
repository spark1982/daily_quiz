var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261110";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["has taken", "have took", "NO CHANGE", "had took"], "ci": 0, "exp": "Use <i>has</i> + the past participle. The past participle of <i>take</i> is <i>taken</i>: <i>Our class <b>has taken</b> three field trips.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>A Field Trip Email</strong><br>Dear Aunt Nora,<br><b>(1)</b> Since September, our class <u>has took</u> three field trips, and yesterday&rsquo;s trip was the best one. <b>(2)</b> We visited the Maple Street Fire Station. <b>(3)</b> The boots that each firefighter wears weighs about ten pounds. <b>(4)</b> Firefighter Sam showed us the ladder truck, and then he <u>lets</u> us sit in the driver&rsquo;s seat. <b>(5)</b> He told us that we <u>must</u> never hide under a bed during a fire. <b>(6)</b> Instead, we should crawl low and get outside as fast as we can. <b>(7)</b> This weekend, I am going to draw an escape map for our house.<br>Love, Owen"}, {"stem": "Which sentence has an error?", "opts": ["Instead, we should crawl low and get outside as fast as we can.", "This weekend, I am going to draw an escape map for our house.", "We visited the Maple Street Fire Station.", "The boots that each firefighter wears weighs about ten pounds."], "ci": 3, "exp": "The subject is <i>boots</i> (plural), not <i>firefighter</i>, so the verb must be <i>weigh</i>: <i>The boots that each firefighter wears <b>weigh</b> about ten pounds.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>A Field Trip Email</strong><br>Dear Aunt Nora,<br><b>(1)</b> Since September, our class <u>has took</u> three field trips, and yesterday&rsquo;s trip was the best one. <b>(2)</b> We visited the Maple Street Fire Station. <b>(3)</b> The boots that each firefighter wears weighs about ten pounds. <b>(4)</b> Firefighter Sam showed us the ladder truck, and then he <u>lets</u> us sit in the driver&rsquo;s seat. <b>(5)</b> He told us that we <u>must</u> never hide under a bed during a fire. <b>(6)</b> Instead, we should crawl low and get outside as fast as we can. <b>(7)</b> This weekend, I am going to draw an escape map for our house.<br>Love, Owen"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "will let", "let", "letting"], "ci": 2, "exp": "The email tells about yesterday, so stay in the past tense. <i>Showed</i> is past, so the second verb should be past too: <i>&hellip;and then he <b>let</b> us sit in the driver&rsquo;s seat.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>A Field Trip Email</strong><br>Dear Aunt Nora,<br><b>(1)</b> Since September, our class <u>has took</u> three field trips, and yesterday&rsquo;s trip was the best one. <b>(2)</b> We visited the Maple Street Fire Station. <b>(3)</b> The boots that each firefighter wears weighs about ten pounds. <b>(4)</b> Firefighter Sam showed us the ladder truck, and then he <u>lets</u> us sit in the driver&rsquo;s seat. <b>(5)</b> He told us that we <u>must</u> never hide under a bed during a fire. <b>(6)</b> Instead, we should crawl low and get outside as fast as we can. <b>(7)</b> This weekend, I am going to draw an escape map for our house.<br>Love, Owen"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["must to", "musts", "should of", "NO CHANGE"], "ci": 3, "exp": "<i>Must</i> is already correct. Helping verbs like <i>must</i> are followed by the base verb (<i>must never hide</i>) and never take <i>to</i> or <i>-s</i>.", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>A Field Trip Email</strong><br>Dear Aunt Nora,<br><b>(1)</b> Since September, our class <u>has took</u> three field trips, and yesterday&rsquo;s trip was the best one. <b>(2)</b> We visited the Maple Street Fire Station. <b>(3)</b> The boots that each firefighter wears weighs about ten pounds. <b>(4)</b> Firefighter Sam showed us the ladder truck, and then he <u>lets</u> us sit in the driver&rsquo;s seat. <b>(5)</b> He told us that we <u>must</u> never hide under a bed during a fire. <b>(6)</b> Instead, we should crawl low and get outside as fast as we can. <b>(7)</b> This weekend, I am going to draw an escape map for our house.<br>Love, Owen"}, {"stem": "Where should a comma be added in sentence 2?", "opts": ["Using Earth&rsquo;s, magnetic field turtles can sense where they are.", "Using Earth&rsquo;s magnetic field turtles can sense, where they are.", "Using, Earth&rsquo;s magnetic field turtles can sense where they are.", "Using Earth&rsquo;s magnetic field, turtles can sense where they are."], "ci": 3, "exp": "Put a comma after an introductory phrase that comes before the main part of the sentence: <i>Using Earth&rsquo;s magnetic field<b>,</b> turtles can sense where they are.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>How Sea Turtles Find Their Way</strong><br><b>(1)</b> Loggerhead sea turtles can travel thousands of miles across the open ocean during their long lives. <b>(2)</b> Using Earth&rsquo;s magnetic field turtles can sense where they are. <b>(3)</b> Baby turtles crawl toward the water very <u>quick</u> after they hatch from their sandy nests. <b>(4)</b> Years later, many females swim back to lay their eggs on the same beach <u>where</u> they hatched. <b>(5)</b> Dr. Lena Ortiz studies these amazing ocean travelers. <b>(6)</b> She works at a sea turtle lab in Florida."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["more quicker", "quickest", "quickly", "NO CHANGE"], "ci": 2, "exp": "To tell <i>how</i> the turtles crawl, use an adverb: <i>Baby turtles crawl toward the water very <b>quickly</b>.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>How Sea Turtles Find Their Way</strong><br><b>(1)</b> Loggerhead sea turtles can travel thousands of miles across the open ocean during their long lives. <b>(2)</b> Using Earth&rsquo;s magnetic field turtles can sense where they are. <b>(3)</b> Baby turtles crawl toward the water very <u>quick</u> after they hatch from their sandy nests. <b>(4)</b> Years later, many females swim back to lay their eggs on the same beach <u>where</u> they hatched. <b>(5)</b> Dr. Lena Ortiz studies these amazing ocean travelers. <b>(6)</b> She works at a sea turtle lab in Florida."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "when", "which", "who"], "ci": 0, "exp": "<i>Where</i> is already correct. Use <i>where</i> to talk about a place: <i>the same beach <b>where</b> they hatched</i>.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>How Sea Turtles Find Their Way</strong><br><b>(1)</b> Loggerhead sea turtles can travel thousands of miles across the open ocean during their long lives. <b>(2)</b> Using Earth&rsquo;s magnetic field turtles can sense where they are. <b>(3)</b> Baby turtles crawl toward the water very <u>quick</u> after they hatch from their sandy nests. <b>(4)</b> Years later, many females swim back to lay their eggs on the same beach <u>where</u> they hatched. <b>(5)</b> Dr. Lena Ortiz studies these amazing ocean travelers. <b>(6)</b> She works at a sea turtle lab in Florida."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Dr. Lena Ortiz, whose works at a sea turtle lab in Florida, studies these amazing ocean travelers.", "Dr. Lena Ortiz, which works at a sea turtle lab in Florida, studies these amazing ocean travelers.", "Dr. Lena Ortiz, who works at a sea turtle lab in Florida, studies these amazing ocean travelers.", "Dr. Lena Ortiz studies these amazing ocean travelers, she works at a sea turtle lab in Florida."], "ci": 2, "exp": "Use <i>who</i> for a person: <i>Dr. Lena Ortiz, <b>who</b> works at a sea turtle lab in Florida, studies these amazing ocean travelers.</i> Joining two sentences with only a comma makes a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>How Sea Turtles Find Their Way</strong><br><b>(1)</b> Loggerhead sea turtles can travel thousands of miles across the open ocean during their long lives. <b>(2)</b> Using Earth&rsquo;s magnetic field turtles can sense where they are. <b>(3)</b> Baby turtles crawl toward the water very <u>quick</u> after they hatch from their sandy nests. <b>(4)</b> Years later, many females swim back to lay their eggs on the same beach <u>where</u> they hatched. <b>(5)</b> Dr. Lena Ortiz studies these amazing ocean travelers. <b>(6)</b> She works at a sea turtle lab in Florida."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["see", "seen", "NO CHANGE", "seeing"], "ci": 1, "exp": "After <i>had</i>, use the past participle. The past participle of <i>see</i> is <i>seen</i>: <i>We had never <b>seen</b> so much dust in one place!</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Journal: Garage Day</strong><br><b>(1)</b> This morning, Dad and I finally cleaned out our messy garage. <b>(2)</b> We had never <u>saw</u> so much dust in one place! <b>(3)</b> Behind a stack of boxes, I found my old roller skates, and I <u>try</u> them on right away. <b>(4)</b> Sadly, the skates were much too small for my feet now. <b>(5)</b> Their wheels still spun perfectly, and there laces were bright green. <b>(6)</b> We drove the skates to my cousins&rsquo; house. <b>(7)</b> Because they love to skate."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["tried", "NO CHANGE", "will try", "trying"], "ci": 0, "exp": "The journal tells what happened this morning, so keep the past tense. <i>Found</i> is past, so use <i>tried</i>: <i>&hellip;and I <b>tried</b> them on right away.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Journal: Garage Day</strong><br><b>(1)</b> This morning, Dad and I finally cleaned out our messy garage. <b>(2)</b> We had never <u>saw</u> so much dust in one place! <b>(3)</b> Behind a stack of boxes, I found my old roller skates, and I <u>try</u> them on right away. <b>(4)</b> Sadly, the skates were much too small for my feet now. <b>(5)</b> Their wheels still spun perfectly, and there laces were bright green. <b>(6)</b> We drove the skates to my cousins&rsquo; house. <b>(7)</b> Because they love to skate."}, {"stem": "Which sentence has an error?", "opts": ["This morning, Dad and I finally cleaned out our messy garage.", "Sadly, the skates were much too small for my feet now.", "Their wheels still spun perfectly, and there laces were bright green.", "We drove the skates to my cousins&rsquo; house."], "ci": 2, "exp": "<i>There</i> means a place. To show the laces belong to the skates, use <i>their</i>: <i>&hellip;and <b>their</b> laces were bright green.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Journal: Garage Day</strong><br><b>(1)</b> This morning, Dad and I finally cleaned out our messy garage. <b>(2)</b> We had never <u>saw</u> so much dust in one place! <b>(3)</b> Behind a stack of boxes, I found my old roller skates, and I <u>try</u> them on right away. <b>(4)</b> Sadly, the skates were much too small for my feet now. <b>(5)</b> Their wheels still spun perfectly, and there laces were bright green. <b>(6)</b> We drove the skates to my cousins&rsquo; house. <b>(7)</b> Because they love to skate."}, {"stem": "What is the best way to combine sentences 6 and 7?", "opts": ["We drove the skates to my cousins&rsquo; house they love to skate.", "We drove the skates to my cousins&rsquo; house, because, they love to skate.", "Because we drove the skates to my cousins&rsquo; house, they love to skate.", "We drove the skates to my cousins&rsquo; house because they love to skate."], "ci": 3, "exp": "Sentence 7 is var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
