  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261110";
var RAW_QUESTIONS = [{"stem": "If you don't know a word, read the sentences around it; the ______ often gives clues to what it means. Which word best completes the sentence?", "opts": ["summit", "refuge", "context", "surplus"], "ci": 2, "exp": "<i>context</i> (n.) the words, facts, or situation around something that help explain it. <i>In this <b>context</b>, \"bank\" means the side of a river.</i>", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The new ramp at the library entrance will ______ the movement of people in wheelchairs, making it much easier for them to get inside. Which word best completes the sentence?", "opts": ["exaggerate", "restrict", "facilitate", "prohibit"], "ci": 2, "exp": "<i>facilitate</i> (v.) to make an action or process easier. <i>A map will <b>facilitate</b> our search.</i> Family: facilitator (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"Scientists studied the <b>composition</b> of the moon rock to learn which minerals it contained.\" What does <b>composition</b> mean in this sentence?", "opts": ["a short essay written for school", "what something is made of", "the way a photo is arranged", "a piece of music that someone wrote"], "ci": 1, "exp": "<i>composition</i> (n.) can mean a piece of music or writing, but here it means the parts or materials that make something up. Family: compose (v.), component (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "As the sun went down, the light began to ______, and soon we could barely see the trail. Which word best completes the sentence?", "opts": ["flourish", "expand", "diminish", "accumulate"], "ci": 2, "exp": "<i>diminish</i> (v.) to become smaller or weaker. <i>The noise will <b>diminish</b> as the train moves away.</i> Fading light gets smaller, so <i>diminish</i> fits; <i>expand</i> and <i>flourish</i> mean to grow.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "When Mia asked for a later bedtime, her parents told her she would have to <b>justify</b> the change with good reasons, not just say \"everyone else does it.\" What does <b>justify</b> mean in this sentence?", "opts": ["to ask for something politely more than once", "to complain until someone finally agrees", "to show that something is fair or right by giving reasons", "to compare your rules with other families' rules"], "ci": 2, "exp": "<i>justify</i> (v.) to give good reasons that show something is fair or right. <i>Can you <b>justify</b> spending all your allowance on one game?</i> Family: justification (n.), justified (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After reading the chapter twice, Leo answered every question correctly, which showed his strong ______ of the story. Which form of the word fits the sentence?", "opts": ["comprehensively", "comprehend", "comprehensive", "comprehension"], "ci": 3, "exp": "The blank needs a noun after \"his strong,\" so <i>comprehension</i> (understanding) fits. <i>comprehensive</i> (adj.) means including everything. Family: comprehend (v.), comprehensive (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The company that makes our bikes is a large ______ with factories in three states. Which form of the word fits the sentence?", "opts": ["manufacturing", "manufactured", "manufacture", "manufacturer"], "ci": 3, "exp": "A person or company that makes products is a <i>manufacturer</i> (n.). <i>manufacture</i> (v.) means to make goods, usually in a factory. <i>The <b>manufacturer</b> recalled the faulty toys.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The fireworks finale made a <b>tremendous</b> boom that shook the windows of every house on the street. Which word means the <b>SAME</b> or nearly the same as <b>tremendous</b> as it is used in the sentence?", "opts": ["huge", "tiny", "distant", "sudden"], "ci": 0, "exp": "<i>tremendous</i> (adj.) very great in size, amount, or strength. <i>Huge</i> is a synonym; <i>tiny</i> is the opposite. <i>The team made a <b>tremendous</b> effort.</i>", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Staying up past midnight can <b>affect</b> how well you think during a test the next morning. What does <b>affect</b> mean in this sentence?", "opts": ["to measure exactly", "to prove something is true", "to make someone forget", "to have an influence on or cause a change in"], "ci": 3, "exp": "<i>affect</i> (v.) to influence or change something. <i>Cold weather can <b>affect</b> how fast plants grow.</i> Do not mix it up with the noun <i>effect</i> (a result).", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "We packed <b>sufficient</b> water for the whole hike, so nobody got thirsty. Which word means the <b>OPPOSITE</b> of <b>sufficient</b> as it is used in the sentence?", "opts": ["fresh", "inadequate", "enough", "extra"], "ci": 1, "exp": "<i>sufficient</i> (adj.) as much as is needed; enough. Its opposite is <i>inadequate</i> (not enough). <i>Enough</i> means the same thing. Family: sufficiently (adv.), insufficient (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Of all the parts of camping, the <b>aspect</b> Jordan liked best was cooking dinner over the fire, though he also enjoyed the night hike. What does <b>aspect</b> mean in this sentence?", "opts": ["one part or feature of something", "a place where people gather", "a plan made ahead of time", "the main reason something happens"], "ci": 0, "exp": "<i>aspect</i> (n.) one part, side, or feature of something. <i>Teamwork is an important <b>aspect</b> of the game.</i>", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The pioneers had to <b>endure</b> weeks of freezing wind and little food before spring finally arrived on the prairie. What does <b>endure</b> mean in this sentence?", "opts": ["to complain about a problem loudly", "to put up with something hard or painful for a long time", "to escape from something dangerous", "to prepare carefully for a trip"], "ci": 1, "exp": "<i>endure</i> (v.) to go through something difficult without giving up. <i>The runners had to <b>endure</b> the summer heat.</i> Family: endurance (n.), enduring (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The town of Leadville sits at an <b>elevation</b> of over 10,000 feet, so visitors sometimes get out of breath on a short walk. Which word means the <b>SAME</b> or nearly the same as <b>elevation</b> as it is used in the sentence?", "opts": ["population", "distance", "height", "depth"], "ci": 2, "exp": "<i>elevation</i> (n.) height above sea level. <i>Depth</i> is the opposite direction. <i>The camp is at a high <b>elevation</b>.</i> Family: elevate (v.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The museum showed <b>primitive</b> tools from thousands of years ago, such as sharpened stones and bone needles, long before metal was used. What does <b>primitive</b> mean in this sentence?", "opts": ["simple and from an early stage of development", "borrowed from another culture", "carefully decorated and valuable", "broken and no longer useful"], "ci": 0, "exp": "<i>primitive</i> (adj.) simple and belonging to an early stage of development. <i>Early people used <b>primitive</b> boats made from hollowed logs.</i>", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"My schedule is <b>flexible</b> on Saturday, so we can meet in the morning or the afternoon.\" What does <b>flexible</b> mean in this sentence?", "opts": ["able to change easily to fit new plans", "very busy with many activities", "made of soft, stretchy material", "able to bend without breaking"], "ci": 0, "exp": "<i>flexible</i> (adj.) has two common meanings: (1) able to bend easily, like a rubber ruler, and (2) able to change easily. Here a schedule can change, so it means able to change to fit new plans. Family: flexibility (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The science fair project will <b>involve</b> three steps: growing the plants, measuring them every day, and graphing the results. What does <b>involve</b> mean in this sentence?", "opts": ["to explain something to an audience", "to remove a step that is not needed", "to make something quicker and easier", "to include something as a necessary part"], "ci": 3, "exp": "<i>involve</i> (v.) to include as a needed part. <i>Being on the team will <b>involve</b> practice twice a week.</i> Family: involvement (n.), involved (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After the stray cat was chased by a dog, it stayed ______ of strangers and would only come close when no one moved. Which word best completes the sentence?", "opts": ["generous", "wary", "eager", "humble"], "ci": 1, "exp": "<i>wary</i> (adj.) careful because you think there might be danger. <i>Deer are <b>wary</b> of loud noises.</i> Family: warily (adv.), wariness (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The <b>swift</b> fox darted across the meadow and vanished into the woods before we could take a picture. Which word means the <b>OPPOSITE</b> of <b>swift</b> as it is used in the sentence?", "opts": ["clever", "rapid", "quiet", "sluggish"], "ci": 3, "exp": "<i>swift</i> (adj.) moving very fast. Its opposite is <i>sluggish</i> (slow-moving). <i>Rapid</i> is a synonym, not an opposite. <i>The <b>swift</b> current carried the leaf away.</i>", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The two friends had a <b>conflict</b> over who would be team captain, but they settled it by taking turns each week. What does <b>conflict</b> mean in this sentence?", "opts": ["a contest that has a prize", "a promise made between friends", "a disagreement or struggle between people", "a plan for sharing a job"], "ci": 2, "exp": "<i>conflict</i> (n.) a disagreement, argument, or struggle. <i>The story's main <b>conflict</b> is between the brothers.</i> Family: conflicting (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "When the storm clouds turned black and the wind began to howl, the hikers had to <b>abandon</b> their plan to reach the summit and hurry back down. What does <b>abandon</b> mean in this sentence?", "opts": ["to put something off until later", "to finish something earlier than planned", "to give up on something completely", "to change something just a little"], "ci": 2, "exp": "<i>abandon</i> (v.) to give up on or leave behind completely. <i>The crew had to <b>abandon</b> the sinking ship.</i> Family: abandoned (adj.), abandonment (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
