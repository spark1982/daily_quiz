<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_24";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20261010";
var RAW_QUESTIONS = [{"stem": "We <span style=\"text-decoration:underline;\">______</span> every window of the house by sunset today.", "opts": ["had washed", "have washed", "will have washed", "wash"], "ci": 2, "exp": "\"will have washed\" is future perfect — all windows will be washed before sunset.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["He is one of those students who studies every single night before a test.", "She is one of those players who runs extra laps before every practice.", "He is one of those students who study every single night before a test.", "She is one of those teachers who always gives the same quiz twice a year."], "ci": 2, "exp": "\"One of those students who\" — \"who\" refers to \"those students\" (plural), so \"study\" is correct. \"Studies\" is singular — wrong. \"Runs\" is singular — wrong for plural \"those players.\" \"Gives\" is singular — wrong for plural \"those teachers.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The editor <b>corrects</b> the errors.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The errors ______ by the editor.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["is corrected", "are corrected", "are correcting", "are correct"], "ci": 1, "exp": "The new subject \"the errors\" is plural and the action is in the present, so use are + the past participle \"corrected\": are corrected.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "The citizens of the small town elected the retired schoolteacher their new mayor by a landslide.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["the retired schoolteacher", "their new mayor"], "ci": 0, "exp": "\"The retired schoolteacher\" is the object (who was elected). \"Their new mayor\" is the objective complement (the role assigned by the vote).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "He taught her math.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["her", "math"], "ci": 0, "exp": "\"Her\" is the indirect object (who was taught). \"Math\" is the direct object (what was taught).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">She had no sooner left the room than everyone started talking.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["No sooner had she left the room when everyone started talking.", "No sooner did she leave the room than everyone started talking.", "No sooner had she left the room than everyone started talking.", "No sooner she had left the room than everyone started talking."], "ci": 2, "exp": "\"No sooner...than\" requires inversion: \"No sooner + had + she + left...\". The conjunction must be \"than\" (not \"when\"), and past perfect \"had\" is correct. The correct form is: No sooner had she left the room than everyone started talking.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>eat</b> &rsaquo; Past: <b>ate</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["eated", "ate", "eating", "eaten"], "ci": 3, "exp": "'eat' is an irregular verb. Its past participle is 'eaten'. Past perfect: had eaten.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "He grew <u>stronger</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Stronger\" follows the linking verb \"grew\" and describes the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "She _____ improved her English a lot this semester.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" (has) is correct. This semester is still in progress.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "dirty<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["dirtier / dirtiest", "dirtyer / dirtyest", "more dirty / most dirty", "dirtir / dirtist"], "ci": 0, "exp": "dirty → dirtier / dirtiest (consonant + y: change -y to -i, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["The childrens playground equipment was replaced last spring.", "The children's playground equipment was replaced last spring.", "The childrens' playground equipment was replaced last spring.", "The children's Playground equipment was replaced last Spring."], "ci": 1, "exp": "\"Children\" is already an irregular plural (not \"childrens\"). To show possession for an irregular plural not ending in s, add apostrophe + s: \"children's.\" \"Playground\" and \"spring\" are common nouns and are not capitalized.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>build</b>?", "opts": ["built", "builded", "builden", "buildted"], "ci": 0, "exp": "The past tense of <b>build</b> is <b>built</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "He <u>stay</u> after school to practice.", "opts": ["stays", "stayes", "stais", "sties"], "ci": 0, "exp": "stay → stays (vowel + y: just add -s)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["expensive antique British clock", "antique expensive British clock", "British expensive antique clock", "expensive British antique clock"], "ci": 0, "exp": "Correct order: opinion (expensive) → age (antique) → origin (British) → noun\n✔ expensive antique British clock", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "We ________ that film at the cinema last March.", "opts": ["watched", "have watched"], "ci": 0, "exp": "Last March is a specific finished time, so use simple past: watched.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["He is passionate about <b>playing</b> the violin.", "The children are <b>playing</b> in the yard.", "They were <b>playing</b> video games all night.", "She will be <b>playing</b> in the orchestra tomorrow."], "ci": 0, "exp": "In \"He is passionate about playing the violin,\" \"playing\" is the object of the preposition \"about\" - a noun role - which makes it a gerund. In the other three sentences, \"playing\" follows \"are / were / will be\" and is part of the progressive verb tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The <b>jumping</b> kangaroo bounded across the outback.", "The kangaroo is <b>jumping</b> over the fence.", "The kangaroos were <b>jumping</b> through the tall grass.", "<b>Jumping</b> into cold water takes courage."], "ci": 0, "exp": "In \"The jumping kangaroo bounded across the outback,\" \"jumping\" comes directly before the noun \"kangaroo\" and describes what the kangaroo is doing - this adjective use of an -ing word is a present participle. In \"The kangaroo is jumping over the fence\" and \"The kangaroos were jumping through the tall grass,\" \"jumping\" is the main verb paired with \"is / were,\" making it part of the progressive tense. In \"Jumping into cold water takes courage,\" \"jumping\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "The newspaper report was based _____ eyewitness accounts from people who saw the accident happen.", "opts": ["on", "from", "with", "by"], "ci": 0, "exp": "\"Based on\" is a fixed phrase meaning something was built on or derived from a source. The report used the accounts as its foundation.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Our team is <u>win</u> the championship.", "opts": ["winning", "wining", "winn", "winned"], "ci": 0, "exp": "win → winning (short vowel + single consonant: double the -n, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "The colorful autumn leaves, scattered across the quiet neighborhood sidewalks, created a stunning natural carpet.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["The colorful autumn leaves", "the quiet neighborhood", "natural carpet", "sidewalks"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The pilots cockpit was filled with instruments.", "That parking spot is your's for the day.", "The fans cheered for there team from the stands.", "The company's profits increased by twenty percent."], "ci": 3, "exp": "<strong>\"company's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>pilots</em> is missing the apostrophe — should be <em>pilot's</em>.<br>• <em>your's</em> does not exist; the correct form is <em>yours</em>.<br>• <em>there</em> should be <em>their</em> (possessive adjective).", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>hoof</b>?", "opts": ["hoofs", "hoofes", "hooves", "hoovs"], "ci": 2, "exp": "hoof → hooves (-f changes to -ves). Hooves are the hard feet of horses and cows.", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Although the concert started two hours late.", "A jar of peanut butter in the kitchen cabinet.", "The mayor gave a speech at the town hall.", "Carrying heavy grocery bags up the stairs."], "ci": 2, "exp": "\"The mayor gave a speech at the town hall.\" is a complete sentence — subject: 'The mayor', predicate: 'gave'. The others are fragments: an 'Although' clause, a noun phrase, and an -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "She nervously handed the carefully written letter to her strict but fair supervisor.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADVERBS in this sentence, and only the adverbs?</span>", "opts": ["nervously, carefully", "nervously, carefully, strict", "nervously, carefully, fair", "nervously"], "ci": 0, "exp": "'Nervously' modifies 'handed'; 'carefully' modifies 'written'.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
