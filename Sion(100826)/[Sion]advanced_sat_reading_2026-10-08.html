  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Sion] Advanced SAT Reading";
var QUIZ_KEY = "sionadvreading";
var INSTRUCTION = "Read each passage and choose the best answer.";
var TODAY_STR = "20261008";
var RAW_QUESTIONS = [{"passage": "Urban heat islands form because pavement and rooftops absorb more sunlight than vegetation does. To test whether reflective &ldquo;cool roofs&rdquo; reduce indoor temperatures enough to matter for residents&rsquo; health, a research team coated the roofs of 40 single-story homes in Phoenix, Arizona, with white reflective paint and left 40 similar nearby homes unchanged. The team hypothesized that cool roofs would reduce the number of hours each summer that indoor temperatures exceed 90&deg;F, a level associated with heat illness.", "stem": "Which finding, if true, would most directly support the team&rsquo;s hypothesis?", "opts": ["Outdoor air temperatures were nearly identical in the two groups of neighborhoods.", "Residents of coated homes reported that their roofs looked cleaner than before.", "Roof surfaces on the coated homes were 40&deg;F cooler at noon than roof surfaces on the unchanged homes.", "Over the summer, homes with coated roofs averaged 112 hours above 90&deg;F indoors, compared with 287 hours for the unchanged homes."], "ci": 3, "exp": "The hypothesis is specifically about hours of indoor temperature above 90&deg;F. Only the first finding measures that outcome and shows a large reduction. Cooler roof surfaces do not by themselves show indoor temperatures changed, and appearance or outdoor air temperature does not address the hypothesis.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "Researchers studying octopus cognition often face a methodological problem: tests designed for mammals reward behaviors, such as pressing a lever repeatedly, that octopuses rarely perform. <u>An octopus that ignores a lever may not be failing the test so much as declining to take it.</u> Biologist Jennifer Mather has therefore argued for experiments built around behaviors octopuses perform naturally, such as exploring crevices and manipulating shells.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It provides experimental evidence that octopuses are more intelligent than mammals.", "It describes a specific experiment that Mather conducted with shells.", "It argues that octopuses cannot be studied scientifically.", "It suggests that a common way of measuring octopus intelligence may misinterpret what the animals&rsquo; behavior shows."], "ci": 3, "exp": "The underlined sentence proposes that ignoring a lever may reflect lack of interest rather than lack of ability, which questions mammal-based tests. That sets up Mather&rsquo;s call for different experiments. It offers no experimental data and does not say octopuses cannot be studied.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "When economist Elinor Ostrom began studying shared resources such as fisheries and grazing lands, the dominant view held that such &ldquo;commons&rdquo; would inevitably be overused unless they were privatized or controlled by government. Ostrom documented dozens of communities, from Swiss alpine villages to Philippine irrigation cooperatives, that had managed common resources sustainably for centuries through rules they designed themselves. Her work, which earned her the 2009 Nobel Prize in Economics, showed that the &ldquo;inevitable&rdquo; outcome was far from inevitable.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To explain how Ostrom&rsquo;s research challenged a widely accepted prediction about shared resources", "To compare the economies of Switzerland and the Philippines", "To describe the farming methods used in Swiss alpine villages", "To argue that all shared resources should be privatized"], "ci": 0, "exp": "The text presents the dominant view that commons would &ldquo;inevitably be overused,&rdquo; then shows how Ostrom&rsquo;s evidence overturned it. The examples serve that purpose; the text does not argue for privatization or compare national economies.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "The following text is adapted from Willa Cather&rsquo;s 1918 novel <i>My &Aacute;ntonia</i>. The narrator, a boy newly arrived in Nebraska, rides in a wagon at night.<br><br>There seemed to be nothing to see; no fences, no creeks or trees, no hills or fields. If there was a road, I could not make it out in the faint starlight. There was nothing but land: not a country at all, but the material out of which countries are made.", "stem": "Which choice best describes the function of the final sentence in the text as a whole?", "opts": ["It recasts the emptiness the narrator has described as raw potential rather than mere absence.", "It explains why the narrator&rsquo;s family decided to move to Nebraska.", "It contradicts the narrator&rsquo;s earlier claim that the night was dark.", "It reveals that the narrator has finally found the road he was looking for."], "ci": 0, "exp": "The earlier sentences list what is missing (&ldquo;no fences, no creeks or trees&rdquo;). The final sentence reframes that blankness as &ldquo;the material out of which countries are made,&rdquo; something unformed but full of possibility. It does not mention finding the road or the family&rsquo;s reasons for moving.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "In the 1840s, Hungarian physician Ignaz Semmelweis observed that a Vienna maternity ward staffed by doctors, who often came directly from performing autopsies, had a death rate from childbed fever several times higher than a ward staffed by midwives, who performed no autopsies. When Semmelweis required doctors to wash their hands in a chlorinated lime solution before examining patients, the doctors&rsquo; ward&rsquo;s death rate fell to roughly match the midwives&rsquo;. Many physicians nonetheless rejected his conclusions, since germ theory had not yet been established. This history implies that Semmelweis&rsquo;s critics", "stem": "Which choice most logically completes the text?", "opts": ["were resisting evidence for an effect partly because no accepted explanation existed for why it occurred.", "accepted that handwashing worked but objected to the cost of chlorinated lime.", "believed that autopsies had no connection to medical training.", "proved that the midwives&rsquo; ward had a higher death rate than the doctors&rsquo; ward."], "ci": 0, "exp": "The text says physicians rejected his conclusions &ldquo;since germ theory had not yet been established&rdquo;: the result was real, but no accepted mechanism explained it. Nothing supports claims about cost, about the midwives&rsquo; ward being worse, or about autopsies and training.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Although early reviewers dismissed the painter&rsquo;s late works as careless, recent technical analysis has shown that their rough, unfinished-looking surfaces were built up through dozens of carefully planned layers. The apparent spontaneity of the paintings, in other words, was ______.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["entirely accidental", "deliberately constructed", "widely praised", "immediately obvious"], "ci": 1, "exp": "The analysis found &ldquo;dozens of carefully planned layers&rdquo; behind surfaces that looked careless, so the spontaneous look was deliberately constructed. &ldquo;Entirely accidental&rdquo; contradicts this, and the text says early reviewers dismissed rather than praised the works.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "For decades, geologists assumed that the deep-sea floor was a nearly lifeless desert, since sunlight cannot reach it and photosynthesis is impossible there. In 1977, however, scientists aboard the submersible <i>Alvin</i> discovered dense communities of tube worms, clams, and crabs clustered around hydrothermal vents near the Gal&aacute;pagos Islands. These ecosystems, researchers later determined, are powered by bacteria that convert chemicals such as hydrogen sulfide from the vents into energy, a process called chemosynthesis.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It lists the animals found near the Gal&aacute;pagos Islands in order of their size.", "It compares two competing theories about photosynthesis and declares one of them correct.", "It describes a long-held assumption, presents a discovery that challenged it, and then explains the process behind that discovery.", "It describes a problem with submersibles and proposes a solution."], "ci": 2, "exp": "The text moves from the assumption (&ldquo;a nearly lifeless desert&rdquo;) to the 1977 discovery to the explanation (chemosynthesis). It does not weigh two photosynthesis theories, rank animals by size, or discuss submersible problems.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "<table style=\"border-collapse:collapse;margin:6px 0 10px;font-size:0.92rem;\"><tr><th style=\"text-align:left;padding:3px 10px 3px 0;\">Library branch</th><th style=\"padding:3px 10px;\">Weekly visits before extended hours</th><th style=\"padding:3px 10px;\">Weekly visits after extended hours</th><th style=\"padding:3px 10px;\">Share of new visits after 6 p.m.</th></tr><tr><td style=\"padding:3px 10px 3px 0;\">Eastside</td><td style=\"text-align:center;\">2,100</td><td style=\"text-align:center;\">2,650</td><td style=\"text-align:center;\">81%</td></tr><tr><td style=\"padding:3px 10px 3px 0;\">Riverview</td><td style=\"text-align:center;\">1,480</td><td style=\"text-align:center;\">1,870</td><td style=\"text-align:center;\">77%</td></tr><tr><td style=\"padding:3px 10px 3px 0;\">Hillcrest</td><td style=\"text-align:center;\">3,300</td><td style=\"text-align:center;\">3,360</td><td style=\"text-align:center;\">24%</td></tr></table>A city library system extended evening hours at three branches. A city analyst concluded that the longer hours drew in people who could not visit earlier in the day at most, but not all, of the branches.", "stem": "Which choice best describes data from the table that support the analyst&rsquo;s conclusion?", "opts": ["Hillcrest had more weekly visits than Eastside both before and after the change.", "All three branches had more weekly visits after the change than before it.", "Eastside and Riverview gained hundreds of weekly visits, mostly after 6 p.m., while Hillcrest gained only 60 visits, mostly before 6 p.m.", "Riverview had the fewest weekly visits of the three branches before the change."], "ci": 2, "exp": "The conclusion has two parts: new evening visitors at most branches, but not at all. Eastside (+550, 81% after 6 p.m.) and Riverview (+390, 77%) show the first part; Hillcrest (+60, only 24% after 6 p.m.) shows the exception. The other choices are accurate but do not address evening visitors or the exception.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "The following text is adapted from Frederick Douglass&rsquo;s 1855 autobiography <i>My Bondage and My Freedom</i>.<br><br>The more I read, the more I was led to abhor and detest slavery and my enslavers. Knowledge had opened my eyes to the horrible pit, but it offered no ladder upon which to get out, and this very knowledge, which I had so ardently sought, became for a time a <u>burden</u> to my spirit.", "stem": "As used in the text, what does the word &ldquo;burden&rdquo; most nearly mean?", "opts": ["heavy package", "official duty", "main theme", "source of anguish"], "ci": 3, "exp": "Douglass says knowledge showed him &ldquo;the horrible pit&rdquo; but no way out, so it weighed painfully on his spirit. Here &ldquo;burden&rdquo; means a source of emotional distress, not a physical load, a duty, or a theme.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "Monarch butterflies that migrate from Canada to central Mexico each fall navigate using a &ldquo;sun compass&rdquo; that depends on an internal clock in their antennae. Ecologist Patrick Guerra and colleagues found that monarchs whose antennae were painted black, blocking light to the clock, flew in random directions, while those painted with clear paint flew normally. Yet monarchs reared indoors under artificial light cycles that were shifted six hours from natural daylight oriented southeast instead of southwest. Together, these results suggest that", "stem": "Which choice most logically completes the text?", "opts": ["the monarchs&rsquo; sense of direction relies on light cues that keep the antennal clock synchronized with the actual time of day.", "clear paint interferes with monarchs&rsquo; ability to detect the sun&rsquo;s position.", "monarchs can navigate accurately without any information about the time of day.", "monarchs reared indoors lose the ability to fly long distances."], "ci": 0, "exp": "Blocking light to the antennae destroyed orientation, and shifting the light cycle shifted the flight direction. Both point to a clock that must be set by light and must match real time. The clear-paint group flew normally, and nothing indicates indoor monarchs could not fly far.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "<strong>Text 1</strong><br>Many urban planners argue that adding lanes to congested highways relieves traffic only briefly. According to the principle of &ldquo;induced demand,&rdquo; new capacity makes driving more attractive, so people take trips they previously avoided, and congestion soon returns to its former level.<br><br><strong>Text 2</strong><br>Transportation economist Clifford Winston acknowledges that widened highways attract new traffic, but he argues that judging projects only by whether congestion returns misses their value. If a widened highway carries 30 percent more travelers at the same speed as before, he notes, the road is serving many more people&rsquo;s needs, even though drivers still experience the same delays.", "stem": "Based on the texts, how would Winston (Text 2) most likely respond to the conclusion in Text 1?", "opts": ["He would agree that adding lanes is never worth the cost.", "He would reject the idea that new lanes attract additional drivers.", "He would agree that congestion tends to return but dispute that this shows the added lanes provided little benefit.", "He would argue that widened highways permanently eliminate congestion."], "ci": 2, "exp": "Winston &ldquo;acknowledges that widened highways attract new traffic,&rdquo; accepting induced demand, but says a road serving 30 percent more travelers has value even if delays stay the same. He does not deny induced demand or claim congestion disappears.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "<strong>Text 1</strong><br>Literary scholars have often read Emily Dickinson&rsquo;s reluctance to publish as evidence that she wrote mainly for herself, indifferent to an audience. On this view, her unusual dashes and capitalizations were private habits never meant for readers&rsquo; eyes.<br><br><strong>Text 2</strong><br>Scholar Martha Nell Smith points out that Dickinson sent more than a third of her nearly 1,800 poems to friends and family in letters, sometimes revising a poem to suit a particular recipient. For Smith, these letters were a deliberate form of circulation, and Dickinson&rsquo;s distinctive punctuation was part of how she chose to present poems to readers.", "stem": "Based on the texts, how would Smith (Text 2) most likely respond to the scholars&rsquo; view in Text 1?", "opts": ["By arguing that Dickinson&rsquo;s punctuation was added later by editors", "By agreeing that Dickinson never shared her poems with anyone", "By arguing that Dickinson&rsquo;s letters show she did write for an audience, just not through conventional publication", "By claiming that Dickinson published most of her poems in newspapers"], "ci": 2, "exp": "Smith emphasizes that Dickinson sent many poems to readers and even tailored them to recipients, so she wrote for an audience through letters rather than publication. Nothing in Text 2 says Dickinson published in newspapers or that editors added her punctuation.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
