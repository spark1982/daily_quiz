var RAW_QUESTIONS = [
 {
  "passage": "<strong>Text 1</strong><br>Many psychologists have argued that multitasking harms learning. In a frequently cited experiment, students who texted during a lecture scored lower on a later quiz than students who did not. Such results suggest that attention is a limited resource and that dividing it always carries a cost.<br><br><strong>Text 2</strong><br>Researcher Dana Okafor agrees that dividing attention often reduces performance, but she argues that the cost depends heavily on the tasks involved. In her studies, participants who listened to instrumental music while solving simple arithmetic problems performed as well as those who worked in silence. Okafor concludes that when one task is highly automatic, pairing it with another may carry little or no cost.",
  "stem": "Based on the texts, how would Okafor (Text 2) most likely respond to the conclusion in Text 1 that dividing attention &ldquo;always carries a cost&rdquo;?",
  "opts": [
   "She would reject it, because she believes that multitasking generally improves learning.",
   "She would argue that the conclusion is too broad, because some combinations of tasks cause little or no drop in performance.",
   "She would argue that it applies only to studies conducted in classrooms rather than in laboratories.",

  ],
  "ci": 1,
  "exp": "Okafor accepts that dividing attention often hurts performance but found no cost when music was paired with simple arithmetic. She would therefore say &ldquo;always&rdquo; overstates the case. Her participants did not perform worse, she never claims multitasking improves learning, and she says nothing about classrooms versus laboratories.",
  "tag": "Cross-Text Connections",
  "tagcolor": "#d6336c"
 },
 {
  "passage": "Many people imagine deserts as empty places. Yet a single square meter of desert soil can hold thousands of tiny organisms, including bacteria, fungi, and lichens that bind together into a dark crust. This crust traps moisture after rare rains, keeps soil from blowing away, and adds nutrients that allow larger plants to take root. When the crust is crushed by footsteps or tires, it may take decades to recover.",
  "stem": "Which choice best states the main purpose of the text?",
  "opts": [
   "To explain the ecological importance of an often-overlooked feature of desert environments",
   "To argue that deserts should be closed to all human visitors",
   "To describe how scientists count the organisms in desert soil",

  ],
  "ci": 0,
  "exp": "The text corrects the idea that deserts are empty by describing the soil crust and the ways it helps desert ecosystems. It mentions damage from footsteps but does not call for closing deserts, and it neither explains counting methods nor discusses forest soils.",
  "tag": "Text Structure and Purpose",
  "tagcolor": "#0d9488"
 },
 {
  "passage": "In the early twentieth century, many American towns built public libraries with money donated by industrialist Andrew Carnegie. Carnegie's grants came with conditions: each town had to provide land for the building and promise to pay for the library's operation every year. Historian Grace Liu found that several towns that were offered grants never built libraries, even though local residents had petitioned for them. Because these towns showed no less interest in reading than towns that accepted grants, Liu's findings suggest that ______",
  "stem": "Which choice most logically completes the text?",
  "opts": [
   "Carnegie refused to give grants to towns whose residents had petitioned for libraries.",
   "the cost of meeting Carnegie's conditions may have kept some interested towns from accepting the grants.",
   "towns that built libraries had lower literacy rates than towns that did not.",
   "residents of those towns preferred to buy books rather than borrow them from libraries."
  ],
  "ci": 1,
  "exp": "The towns wanted libraries but did not build them, and the only obstacle the text mentions is the requirement to supply land and pay yearly costs. The text says these towns were offered grants, so Carnegie did not refuse them, and it offers no evidence about buying books or literacy rates.",
  "tag": "Inferences",
  "tagcolor": "#f5a623"
 },
 {
  "passage": "<strong>Text 1</strong><br>Early histories of the printing press often credit Johannes Gutenberg's movable type with sparking a rapid spread of literacy across fifteenth-century Europe. Because printed books were far cheaper than hand-copied manuscripts, these accounts suggest, ordinary people could suddenly afford to read.<br><br><strong>Text 2</strong><br>Historian Lucia Brandt points out that for decades after Gutenberg, most printed books were religious and legal texts in Latin, a language few ordinary Europeans could read. Literacy rates, she notes, rose significantly only in the sixteenth and seventeenth centuries, when printers began producing inexpensive pamphlets in local languages and schools expanded.",
  "stem": "Based on the texts, Brandt (Text 2) would most likely characterize the account in Text 1 as",
  "opts": [
   "correct in suggesting that literacy increased immediately after the invention of movable type.",
   "mistaken about the cost of hand-copied manuscripts compared with printed books.",
   "overlooking factors other than the cost of books that limited ordinary people's ability to read.",
   "focused too narrowly on religious texts rather than on legal texts."
  ],
  "ci": 2,
  "exp": "Text 1 treats cheaper books as the key to literacy, but Brandt stresses language (most books were in Latin) and schooling, and she says literacy rose only much later. She does not dispute that printed books were cheaper, and she clearly rejects the idea of an immediate rise.",
  "tag": "Cross-Text Connections",
  "tagcolor": "#d6336c"
 },
 {
  "passage": "A team of biologists studied whether the color of a feeder affects how often hummingbirds visit it. They placed feeders of four colors, each containing the same sugar solution, in a garden and recorded visits. The researchers hypothesized that hummingbirds are drawn more strongly to colors at the long-wavelength (red and orange) end of the visible spectrum than to shorter-wavelength colors such as blue.<table style=\"border-collapse:collapse;margin:10px auto;font-size:0.9rem;\"><tr><th style=\"border:1px solid #bbb;padding:4px 10px;\">Feeder color</th><th style=\"border:1px solid #bbb;padding:4px 10px;\">Average visits per hour</th></tr><tr><td style=\"border:1px solid #bbb;padding:4px 10px;\">Red</td><td style=\"border:1px solid #bbb;padding:4px 10px;text-align:center;\">14.2</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 10px;\">Orange</td><td style=\"border:1px solid #bbb;padding:4px 10px;text-align:center;\">11.8</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 10px;\">Yellow</td><td style=\"border:1px solid #bbb;padding:4px 10px;text-align:center;\">6.1</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 10px;\">Blue</td><td style=\"border:1px solid #bbb;padding:4px 10px;text-align:center;\">3.4</td></tr></table>",
  "stem": "Which choice best describes data from the table that support the researchers' hypothesis?",
  "opts": [
   "The red and orange feeders each received more than twice as many visits per hour as the blue feeder did.",
   "The orange feeder received more visits per hour than the red feeder did.",
   "Each feeder received between 10 and 15 visits per hour.",
   "The yellow feeder received the fewest visits per hour of the four feeders."
  ],
  "ci": 0,
  "exp": "The red feeder (14.2) and the orange feeder (11.8) each had more than twice the visits of the blue feeder (3.4), which supports a preference for long-wavelength colors. The orange feeder had fewer visits than the red one, yellow and blue both fell below 10 visits, and blue, not yellow, had the fewest visits.",
  "tag": "Command of Evidence",
  "tagcolor": "#1D9E75"
 },
 {
  "passage": "In her study of letters written by workers in New England textile mills during the 1840s, historian Rhea Montag cautions against reading the letters as spontaneous outpourings of feeling. Many writers, she notes, knew their letters would be read aloud to entire households, so they adjusted each detail with care: complaints about long hours were softened, and requests for money were placed after reassuring news. The letters, in Montag's view, were ______ documents.",
  "stem": "Which choice completes the text with the most logical and precise word or phrase?",
  "opts": [
   "impulsive",
   "fragmentary",
   "obscure",
   "calculated"
  ],
  "ci": 3,
  "exp": "Montag says the writers adjusted each detail with care, softening complaints and placing requests strategically, so the letters were carefully planned, or calculated. &ldquo;Impulsive&rdquo; contradicts the text's point that the letters were not spontaneous, and nothing suggests the letters were incomplete (&ldquo;fragmentary&rdquo;) or hard to understand (&ldquo;obscure&rdquo;).",
  "tag": "Words in Context",
  "tagcolor": "#7b61ff"
 },
 {
  "passage": "For decades, architects assumed that tall buildings needed steel or concrete frames. Wood, they believed, was too weak and too likely to burn. In recent years, however, engineers have developed cross-laminated timber: panels made by gluing layers of wood at right angles to one another. Tests show that these panels can support heavy loads and, when thick enough, char on the outside during a fire while their inner layers stay strong. As a result, buildings more than fifteen stories tall have now been built largely from wood.",
  "stem": "Which choice best describes the overall structure of the text?",
  "opts": [
   "It compares two building materials and concludes that neither is suitable for tall buildings.",
   "It explains why architects prefer steel and argues that wood should be used only for small homes.",
   "It describes a long-held assumption, explains a development that challenges it, and notes a result of that development.",
   "It outlines the steps for manufacturing timber panels and then lists their disadvantages."
  ],
  "ci": 2,
  "exp": "The text opens with the belief that wood could not support tall buildings, introduces cross-laminated timber as a challenge to that belief, and ends with tall wooden buildings as the result. It does not reject both materials, argue for steel, or list disadvantages of the panels.",
  "tag": "Text Structure and Purpose",
  "tagcolor": "#0d9488"
 },
 {
  "passage": "Sea otters feed heavily on sea urchins, which graze on kelp. In a study of coastal sites in Alaska, marine biologist Tomas Reyes found that sites where otters had recently returned had dense kelp forests, while nearby sites without otters had few kelp plants but large numbers of urchins. At one site, however, otters were present but kelp remained sparse. Reyes found that the urchins there belonged to a heavily spined species that otters rarely eat. These findings suggest that ______",
  "stem": "Which choice most logically completes the text?",
  "opts": [
   "the presence of otters promotes kelp growth only when the urchins at a site are ones that otters actually eat.",
   "heavily spined urchins grow more quickly than other urchin species do.",
   "otters prefer to hunt in dense kelp forests rather than in open water.",
   "kelp forests can recover only at sites from which otters were never absent."
  ],
  "ci": 0,
  "exp": "Otters normally protect kelp by eating urchins, but at the one site where they could not easily eat the local urchins, kelp stayed sparse. So the benefit depends on otters actually eating the urchins. The text says kelp was dense where otters had recently returned, and it gives no information about urchin growth rates or otters' preferred hunting areas.",
  "tag": "Inferences",
  "tagcolor": "#f5a623"
 },
 {
  "passage": "Linguist Paulo Mendes hypothesizes that speakers of a language tend to shorten the words they use most frequently, because constant repetition makes long forms feel inefficient.",
  "stem": "Which finding, if true, would most directly support Mendes's hypothesis?",
  "opts": [
   "Words that a language borrows from other languages are usually longer than native words.",
   "Children tend to learn short words before they learn long words.",
   "Across several languages, the words that appear most often in everyday conversation are, on average, shorter than words that appear rarely.",
   "Some of the most common words in a language, such as greetings, have kept the same length for centuries."
  ],
  "ci": 2,
  "exp": "The hypothesis links frequency of use to shortness, so a finding that frequent words are shorter across languages supports it directly. Borrowed words and children's learning order do not involve frequency of use, and common words that never shortened would weaken the hypothesis.",
  "tag": "Command of Evidence",
  "tagcolor": "#1D9E75"
 },
 {
  "passage": "When the eclipse began, the chatter along the riverbank stopped at once. The slow disappearance of the sun seemed to <u>arrest</u> every person on the shore; fishermen let their lines go slack, and children who had been racing along the mud stood perfectly still, faces turned upward.",
  "stem": "As used in the text, what does the word &ldquo;arrest&rdquo; most nearly mean?",
  "opts": [
   "Hold the attention of",
   "Take into custody",
   "Frighten away",
   "Slow the development of"
  ],
  "ci": 0,
  "exp": "The people stop what they are doing and stare upward, which shows the eclipse captured, or held, their attention. No one is taken into custody or driven away, and the text is not about slowing anyone's growth.",
  "tag": "Words in Context",
  "tagcolor": "#7b61ff"
 },
 {
  "passage": "The following text is from a short story. Mireille is waiting to hear whether she has been accepted to a music conservatory.<br><br>Mireille told everyone she had stopped thinking about the letter. She said it at breakfast and again at dinner, and she said it to the mail carrier, who had not asked. Each afternoon she happened to be sweeping the front step at exactly the moment the mail truck turned the corner.",
  "stem": "The text mainly portrays Mireille as someone who",
  "opts": [
   "claims to be unconcerned about an outcome while revealing through her actions that she is anxious about it.",
   "has forgotten about an important decision because she is busy with household chores.",
   "is annoyed by the mail carrier's repeated questions about the letter.",
   "has already learned the result but is keeping it a secret from her family."
  ],
  "ci": 0,
  "exp": "Mireille keeps insisting she has stopped thinking about the letter, even to someone who did not ask, and she is always outside when the mail arrives. These details show that her words hide real anxiety. The mail carrier never asks her anything, and nothing suggests she already knows the result.",
  "tag": "Craft and Structure",
  "tagcolor": "#E24B4A"
 },
 {
  "passage": "Ecologists have long described oak trees as &ldquo;mast&rdquo; producers: in some years a tree drops almost no acorns, and in others it releases enormous quantities. A common explanation is that trees simply produce more acorns when weather allows. <u>But this explanation cannot account for a striking pattern: oaks spread across hundreds of kilometers, experiencing very different local weather, often mast in the very same year.</u> Some researchers now propose that synchronized masting overwhelms seed-eating animals, ensuring that some acorns survive to sprout.",
  "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?",
  "opts": [
   "It presents an observation that challenges a commonly offered explanation.",
   "It summarizes the consequences of masting for seed-eating animals.",
   "It provides evidence that directly supports the idea that weather determines acorn production.",
   "It describes the method researchers used to measure acorn production."
  ],
  "ci": 0,
  "exp": "The sentence begins with &ldquo;But&rdquo; and points out that oaks with different local weather mast in the same year, which the weather explanation cannot account for. It therefore challenges that explanation rather than supporting it, and it does not describe a research method or the effects on animals.",
  "tag": "Craft and Structure",
  "tagcolor": "#E24B4A"
 }
];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){

}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){

      var qi = ao[pos];

      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }

    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';

      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
