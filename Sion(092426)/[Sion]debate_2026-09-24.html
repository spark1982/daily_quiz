var RAW_QUESTIONS = [
 {
  "contextLabel": "During a debate about requiring bicycle helmets for teens, an opponent of the rule argues:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;My uncle rode his bike without a helmet for forty years and never got hurt once. Helmet laws are obviously unnecessary.&rdquo;</span>",
  "stem": "What logical fallacy is the opponent committing?",

   "False Equivalence &mdash; treating two things as equal when they differ in important ways",
   "Appeal to Authority &mdash; treating someone's opinion as proof because of who they are, even when the topic is outside their expertise",

  "ci": 3,
  "exp": "The opponent uses one person's experience to dismiss a safety rule, ignoring broader data on bike injuries. Relying on a single personal story in place of reliable evidence is Anecdotal Evidence. The uncle is not presented as an expert (Appeal to Authority), nothing is falsely treated as equal (False Equivalence), and the rule is not judged by where it came from (Genetic Fallacy).",
  "hint": "Ask whether one person's experience is enough to show what is true for most riders."
 },
 {
  "contextLabel": "During cross-examination in a debate about a new downtown parking garage, the opponent says:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;I say the new garage will triple the number of shoppers downtown. Unless you can prove it won't, you have to accept my number.&rdquo;</span>",
  "stem": "What logical fallacy is the opponent committing?",
  "opts": [
   "Post Hoc Ergo Propter Hoc &mdash; assuming that because one event followed another, the first caused the second",
   "Burden of Proof Fallacy &mdash; demanding that the other side disprove a claim instead of supporting the claim oneself",
   "Hasty Generalization &mdash; drawing a broad conclusion from too few examples",
   "Ad Hominem &mdash; attacking the person making an argument instead of the argument itself"
  ],
  "ci": 1,
  "exp": "The opponent makes a bold claim and then demands that the other side disprove it instead of offering evidence for it. That is the Burden of Proof Fallacy: the person who makes a claim is responsible for supporting it. No small sample is generalized (Hasty Generalization), no cause is assumed from timing (Post Hoc Ergo Propter Hoc), and no one is attacked personally (Ad Hominem).",
  "hint": "Ask who made the claim, and who the speaker is asking to do the work of proving it."
 },
 {
  "contextLabel": "During a student government debate about a no-phones policy at assemblies, the class president says:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Every student must turn in their phone before assemblies, no exceptions. Of course, student council members should keep theirs, because we are the ones who wrote the rule.&rdquo;</span>",
  "stem": "What logical fallacy is the class president committing?",
  "opts": [
   "False Dilemma &mdash; presenting only two options when other possibilities exist",

  ],

  "exp": "The president insists the rule applies to everyone, then exempts the council without a relevant reason (writing a rule is not a reason to be excused from it). That is Special Pleading. The speaker does not limit a choice to two options (False Dilemma), the argument does not change the subject (Red Herring), and no word shifts meaning (Equivocation).",

 },
 {
  "contextLabel": "In a debate about when the high school day should start, a moderator suggests:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;One side wants school to start at 7:15, and the other side wants 8:45. The truth must be somewhere in between, so 8:00 is obviously the right answer.&rdquo;</span>",
  "stem": "What logical fallacy is the moderator committing?",
  "opts": [
   "Appeal to Emotion &mdash; using feelings rather than facts or reasons to persuade",

  "exp": "The moderator assumes the best start time is simply the midpoint of the two proposals, without looking at evidence such as research on teen sleep. Assuming a compromise must be correct is the Middle Ground Fallacy. The moderator actually proposes another possible time, so it is not a False Dilemma, and no popularity (Bandwagon Fallacy) or feelings (Appeal to Emotion) are used.",
  "hint": "Consider whether being halfway between two positions actually makes an answer correct."
 },
 {
  "contextLabel": "During a city council debate about a new water treatment plant, a council member argues:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;A famous Hollywood actor posted that fluoride in drinking water is dangerous. If someone that successful says so, our city should stop adding it immediately.&rdquo;</span>",
  "stem": "What logical fallacy is the council member committing?",
  "opts": [
   "Bandwagon Fallacy &mdash; claiming something is right or true because many people believe it or do it",
   "Appeal to Authority &mdash; treating someone's opinion as proof because of who they are, even when the topic is outside their expertise",
   "Ad Hominem &mdash; attacking the person making an argument instead of the argument itself",
   "Genetic Fallacy &mdash; judging an idea only by where it came from rather than by its merits"
  ],
  "ci": 1,
  "exp": "The council member treats an actor's opinion as proof about a public-health question, even though acting fame gives no expertise in water chemistry. That is an Appeal to Authority. The argument does not judge the idea by its origin in general (Genetic Fallacy), does not rely on how many people agree (Bandwagon Fallacy), and does not attack an opponent personally (Ad Hominem).",
  "hint": "Ask whether the person being quoted actually has any special knowledge about the topic being debated."
 },
 {
  "contextLabel": "In a debate about a proposal to extend library hours, a speaker argues:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;The library board says the new hours are a fair plan. But the county fair already happens every summer, and we don't need another fair. So we should reject the plan.&rdquo;</span>",
  "stem": "What logical fallacy is the speaker committing?",
  "opts": [
   "Red Herring &mdash; bringing up an unrelated issue to distract from the real question",
   "Straw Man Fallacy &mdash; misrepresenting an opponent's argument to make it easier to attack",
   "Slippery Slope &mdash; claiming that one small step will inevitably lead to a chain of extreme consequences",
   "Equivocation &mdash; switching between two different meanings of the same word within one argument"
  ],
  "ci": 3,
  "exp": "The speaker switches the meaning of &ldquo;fair&rdquo; from &ldquo;just and reasonable&rdquo; to &ldquo;a festival or carnival&rdquo; and draws a conclusion from that switch. Using one word with two meanings in the same argument is Equivocation. The confusion comes from the double meaning, not from a separate topic (Red Herring), a distorted opposing view (Straw Man Fallacy), or a predicted chain of events (Slippery Slope).",
  "hint": "Look closely at one word the speaker uses twice. Does it mean the same thing both times?"
 },
 {
  "contextLabel": "In a debate about the school budget, a student council officer argues:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Either we cancel the spring dance, or we won't be able to buy any new books for the library. The choice is that simple.&rdquo;</span>",
  "stem": "What logical fallacy does this argument contain?",
  "opts": [
   "False Dilemma &mdash; presenting only two options when other possibilities exist",
   "Slippery Slope &mdash; claiming that one small step will inevitably lead to a chain of extreme consequences",
   "Red Herring &mdash; bringing up an unrelated issue to distract from the real question",
   "Middle Ground Fallacy &mdash; assuming that a compromise between two positions must be the correct answer"

  "exp": "The officer presents only two possibilities, even though the council could raise funds, trim other costs, or hold a cheaper dance. Limiting the choice to two options is a False Dilemma. No chain of escalating events is described (Slippery Slope), no compromise is being assumed correct (Middle Ground Fallacy), and the argument stays on topic (Red Herring).",
  "hint": "Think about whether there are other ways to solve the budget problem that the speaker has left out."
 },
 {
  "contextLabel": "During a debate about adopting a four-day school week, a parent argues:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Dozens of districts in Colorado and Missouri have already switched to a four-day week. So many schools can't be wrong, so we should switch too.&rdquo;</span>",
  "stem": "What logical fallacy is the parent committing?",
  "opts": [
   "False Equivalence &mdash; treating two things as equal when they differ in important ways",
   "Appeal to Authority &mdash; treating someone's opinion as proof because of who they are, even when the topic is outside their expertise",
   "Bandwagon Fallacy &mdash; claiming something is right or true because many people believe it or do it",
   "Hasty Generalization &mdash; drawing a broad conclusion from too few examples"
  ],
  "ci": 2,
  "exp": "The parent argues that the four-day week is a good idea mainly because many districts have adopted it, not because of evidence about its results. That is the Bandwagon Fallacy. No expert is cited (Appeal to Authority), no broad conclusion is drawn from a handful of examples about those districts' results (Hasty Generalization), and the argument does not claim two different things are equal (False Equivalence).",
  "hint": "Notice what reason is actually given for switching. Is it evidence about student learning, or something else?"
 },
 {
  "contextLabel": "In a debate about expanding the city zoo, a speaker argues:",
  "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Picture a lonely elephant pacing a tiny concrete pen, looking up at the children with sad eyes. How can anyone with a heart vote against giving these animals a bigger home?&rdquo;</span>",
  "stem": "What logical fallacy does this argument rely on?",
  "opts": [
   "Begging the Question &mdash; using the conclusion itself as a reason for the conclusion",
   "Straw Man Fallacy &mdash; misrepresenting an opponent's argument to make it easier to attack",
   "Appeal to Emotion &mdash; using feelings rather than facts or reasons to persuade",
   "Tu Quoque &mdash; dismissing criticism by pointing out that the critic does the same thing"

  "hint": "Look at the kind of language used. Is the speaker giving reasons, or trying to make the audience feel something?"
 },
 {

  "stem": "What logical fallacy is the speaker committing?",
  "opts": [
   "No True Scotsman &mdash; redefining a group after the fact to exclude any example that contradicts a claim",
   "Straw Man Fallacy &mdash; misrepresenting an opponent's argument to make it easier to attack",
   "Begging the Question &mdash; using the conclusion itself as a reason for the conclusion",
   "Hasty Generalization &mdash; drawing a broad conclusion from too few examples"

  "hint": "Watch what the speaker does when someone points out an example that doesn't fit the claim."

];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
