var TODAY_STR = "20261113";
var RAW_QUESTIONS = [{"stem": "Read the sentence: \"Ben stayed up late playing video games, and the <b>consequence</b> was that he could hardly stay awake in class the next day.\" What does <b>consequence</b> mean in this sentence?", "opts": ["a reward for working hard", "a rule that everyone has to follow", "a result that happens because of an action", "a reason for doing something"], "ci": 2, "exp": "<i>consequence</i> (n.) something that happens as a result of an action. <i>Getting wet was the <b>consequence</b> of forgetting his umbrella.</i> Family: consequently (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The store offered to <b>compensate</b> us for the broken lamp by giving us a full refund. Which word means the <b>SAME</b> or nearly the same as “compensate” as it is used in the sentence?", "opts": ["blame", "repay", "warn", "charge"], "ci": 1, "exp": "<i>compensate</i> (v.) to give someone something, often money, to make up for a loss or problem. <i>Repay</i> means nearly the same. <i>Charge</i> is close to the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The puppy was so ______ to go outside that it waited by the door with its leash in its mouth. Which word best completes the sentence?", "opts": ["eager", "reluctant", "timid", "feeble"], "ci": 0, "exp": "<i>eager</i> (adj.) wanting to do something very much. <i>The puppy was <b>eager</b> to go for a walk.</i> Family: eagerly (adv.), eagerness (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The town voted to <b>abolish</b> the old rule that banned skateboards in the park. Which word means the <b>OPPOSITE</b> of “abolish” as it is used in the sentence?", "opts": ["establish", "eliminate", "announce", "ignore"], "ci": 0, "exp": "<i>abolish</i> (v.) to officially end a law, rule, or system. Its opposite is <i>establish</i> (to set up or create). <i>Eliminate</i> is a synonym, not an opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"After the storm, Dad called the company that sold us our home insurance <b>policy</b> to ask about fixing the roof.\" What does <b>policy</b> mean in this sentence?", "opts": ["a written agreement with an insurance company", "a rule that a school or business follows", "a habit that a person has every day", "a plan of action chosen by a government"], "ci": 0, "exp": "<i>policy</i> usually means a rule or plan (a school <b>policy</b>), but an insurance <b>policy</b> is a written contract with an insurance company. <i>Our <b>policy</b> pays for storm damage.</i>", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "During the science lesson, Lila made an interesting <b>observation</b>: the plants near the window were growing taller. Which word means the <b>SAME</b> or nearly the same as “observation” as it is used in the sentence?", "opts": ["mistake", "question", "remark", "guess"], "ci": 2, "exp": "<i>observation</i> (n.) something you notice and say or write down. Here it means a comment about what she noticed, so <i>remark</i> is closest. A <i>guess</i> is not based on what you saw.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"The northern lights are a natural <b>phenomenon</b> in which glowing ribbons of green and pink appear in the night sky.\" What does <b>phenomenon</b> mean in this sentence?", "opts": ["a dangerous storm that damages buildings", "something that happens and can be seen or studied", "a scientific test that people set up on purpose", "a story people tell to explain nature"], "ci": 1, "exp": "<i>phenomenon</i> (n.) an event or fact that can be observed, especially an unusual one. <i>A rainbow is a <b>phenomenon</b> caused by sunlight and raindrops.</i> Plural: phenomena", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Our teacher explained the <b>significance</b> of the Fourth of July: it marks the day the colonies declared their independence.\" What does <b>significance</b> mean in this sentence?", "opts": ["a celebration with food and music", "the exact date when something happened", "importance or special meaning", "a short summary of a long story"], "ci": 2, "exp": "<i>significance</i> (n.) importance or meaning. <i>We learned the <b>significance</b> of the old bell.</i> Family: significant (adj.), signify (v.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Most of the council voted yes, but two members spoke up in ______ because they thought the plan cost too much. Which word best completes the sentence?", "opts": ["surplus", "tolerance", "refuge", "dissent"], "ci": 3, "exp": "<i>dissent</i> (n.) disagreement with an idea or decision that most people support. <i>Two members voted no to show their <b>dissent</b>.</i> Family: dissenter (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The directions were <b>explicit</b>: “Write your name in the top right corner and use only a pencil.” Which word means the <b>OPPOSITE</b> of “explicit” as it is used in the sentence?", "opts": ["detailed", "clear", "polite", "vague"], "ci": 3, "exp": "<i>explicit</i> (adj.) stated clearly and in detail, leaving nothing unclear. Its opposite is <i>vague</i> (not clear). <i>Clear</i> and <i>detailed</i> are synonyms, not opposites.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The two friends sat down and talked calmly to ______ their argument about whose turn it was. Which word best completes the sentence?", "opts": ["conceal", "resolve", "exaggerate", "inherit"], "ci": 1, "exp": "<i>resolve</i> (v.) to find an answer to a problem or end a disagreement. <i>They talked it out to <b>resolve</b> the argument.</i> Family: resolution (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"Workers added steel bars to <b>reinforce</b> the old bridge so it could hold the heavy trucks.\" What does <b>reinforce</b> mean in this sentence?", "opts": ["to paint and decorate", "to take apart", "to make stronger", "to make longer"], "ci": 2, "exp": "<i>reinforce</i> (v.) to make something stronger or more solid. <i>Practicing every day will <b>reinforce</b> what you learned.</i> Family: reinforcement (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"The <b>archaeologist</b> brushed the dirt away carefully and lifted out a clay pot that had been buried for two thousand years.\" What does <b>archaeologist</b> mean in this sentence?", "opts": ["a scientist who studies dinosaurs and other ancient animals", "a scientist who studies the past by digging up old objects and places", "a scientist who studies rocks and how the earth changes", "a person who collects and sells rare old things"], "ci": 1, "exp": "<i>archaeologist</i> (n.) a scientist who learns about people of the past by studying the objects and places they left behind. <i>The <b>archaeologist</b> found tools at the old village.</i> Family: archaeology (n.), archaeological (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Ms. Grant tried a new <b>approach</b> to teaching fractions: she used pizza slices instead of drawings.\" What does <b>approach</b> mean in this sentence?", "opts": ["a first try at speaking to someone", "the act of coming closer to a place", "a way of doing or dealing with something", "a path or road that leads to a building"], "ci": 2, "exp": "<i>approach</i> has several meanings: (v.) to come near, (n.) a road leading to a place, and (n.) a way of doing something. Here it means a way of teaching. <i>Her new <b>approach</b> made fractions easy.</i>", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "With dark clouds rolling in and thunder getting closer, rain seemed ______, so we packed up the picnic. Which word best completes the sentence?", "opts": ["voluntary", "inevitable", "tranquil", "ambiguous"], "ci": 1, "exp": "<i>inevitable</i> (adj.) certain to happen; impossible to avoid. <i>With those clouds, rain was <b>inevitable</b>.</i> Family: inevitably (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"The loud hammering next door finally <b>ceased</b> at nine o’clock, and the whole street became quiet.\" What does <b>ceased</b> mean in this sentence?", "opts": ["grew louder", "slowed down a little", "started again", "stopped"], "ci": 3, "exp": "<i>cease</i> (v.) to stop or come to an end. <i>The rain <b>ceased</b>, and the sun came out.</i> Family: ceaseless (adj.), ceaselessly (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"To explain how the heart works, Mr. Lopez used an <b>analogy</b>: the heart is like a pump that pushes water through the pipes of a house.\" What does <b>analogy</b> mean in this sentence?", "opts": ["a comparison that explains one thing by showing how it is like another", "a drawing that shows the parts of something with labels", "a short story that teaches a lesson about right and wrong", "a list of facts that proves an idea is true"], "ci": 0, "exp": "<i>analogy</i> (n.) a comparison that explains something by showing how it is like something else. <i>Comparing the heart to a pump is a helpful <b>analogy</b>.</i> Family: analogous (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"The vote was <b>unanimous</b>: every single student raised a hand for the class trip to the science museum.\" What does <b>unanimous</b> mean in this sentence?", "opts": ["decided quickly without much thought", "very close and hard to decide", "agreed on by everyone", "decided by most, but not all"], "ci": 2, "exp": "<i>unanimous</i> (adj.) agreed to by everyone in a group. <i>The team made a <b>unanimous</b> choice for captain.</i> Family: unanimously (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before the debate, Jada wrote down a strong ______ to answer the other team’s claim that recess should be shorter. Which form of the word fits the sentence?", "opts": ["argue", "arguably", "counterargument", "argumentative"], "ci": 2, "exp": "The blank needs a noun after <i>a strong</i>: <i>counterargument</i> (a reason given against someone else’s argument). <i>Argue</i> is a verb, <i>argumentative</i> an adjective, <i>arguably</i> an adverb.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "In the 1900s, millions of people came to America through Ellis Island; this wave of ______ changed many cities. Which form of the word fits the sentence?", "opts": ["immigration", "immigrated", "immigrant", "immigrate"], "ci": 0, "exp": "The blank needs a noun that names the process: <i>immigration</i> (moving to a new country). <i>Immigrant</i> (n.) is a person who moves, and <i>immigrate</i> is the verb. Family: immigrant (n.), immigrate (v.), immigration (n.)", "tag": "Word Family", "tagcolor": "#f5a623"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-13 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
