var TODAY_STR = "20261112";

44<sup>2</sup> = 1936, which is too small, and 45<sup>2</sup> = 2025, which is enough. So <i>n</i>+1 = 45, which gives <i>n</i> = 44.<br><br><b>Answer check:</b> for <i>n</i> = 43 there are 44<sup>2</sup> = 1936 terms (fewer than 1996); for <i>n</i> = 44 there are 45<sup>2</sup> = 2025 terms (at least 1996). A computer expansion of the original expression gives the same counts, 1936 and 2025.<br><br><b>Trap:</b> 45 comes from forgetting the &ldquo;+1&rdquo; (using <i>n</i><sup>2</sup> &ge; 1996 instead of (<i>n</i>+1)<sup>2</sup>), and 43 or 42 come from rounding the square root of 1996 (about 44.7) the wrong way.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Find all real roots of<br><br>(2<i>x</i> + 1)(3<i>x</i> + 1)(5<i>x</i> + 1)(30<i>x</i> + 1) = 10.", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;2 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>"], "ci": 2, "exp": "<b>What we need:</b> every real <i>x</i> with (2<i>x</i>+1)(3<i>x</i>+1)(5<i>x</i>+1)(30<i>x</i>+1) = 10.<br><br><b>Step 1 — Pair the factors so the middle terms match.</b> Expanding all four at once gives a messy degree-4 equation. Instead, pair the outer and inner factors: (2<i>x</i>+1)(30<i>x</i>+1) = 60<i>x</i><sup>2</sup>+32<i>x</i>+1 and (3<i>x</i>+1)(5<i>x</i>+1) = 15<i>x</i><sup>2</sup>+8<i>x</i>+1. Notice that 60<i>x</i><sup>2</sup>+32<i>x</i> is exactly 4 times 15<i>x</i><sup>2</sup>+8<i>x</i>. That is why this pairing works (2&middot;30 = 60 = 4&middot;15 and 2+30 = 32 = 4&middot;8).<br><br><b>Step 2 — Substitute.</b> Let <i>u</i> = 15<i>x</i><sup>2</sup>+8<i>x</i>. Then the first pair is 4<i>u</i>+1 and the second pair is <i>u</i>+1, so the equation becomes (4<i>u</i>+1)(<i>u</i>+1) = 10.<br><br><b>Step 3 — Solve for <i>u</i>.</b> Expand: 4<i>u</i><sup>2</sup>+5<i>u</i>+1 = 10, so 4<i>u</i><sup>2</sup>+5<i>u</i>&minus;9 = 0. This factors as (4<i>u</i>+9)(<i>u</i>&minus;1) = 0, so <i>u</i> = 1 or <i>u</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span>.<br><br><b>Step 4 — Throw out the case with no real roots.</b> If <i>u</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span>, then 15<i>x</i><sup>2</sup>+8<i>x</i>+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = 0. Its discriminant is 8<sup>2</sup> &minus; 4&middot;15&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = 64 &minus; 135 = &minus;71 &lt; 0, so there are no real solutions here.<br><br><b>Step 5 — Solve the remaining quadratic.</b> If <i>u</i> = 1, then 15<i>x</i><sup>2</sup>+8<i>x</i>&minus;1 = 0. The quadratic formula gives <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">8<sup>2</sup>+4&middot;15</span></span></span><span style=\"border-top:1.4px solid #111;\">2&middot;15</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">124</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span>. Since <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">124</span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">4&middot;31</span></span> = 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span>, this simplifies to <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>.<br><br><b>Answer check:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span> &asymp; 0.1045 and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span> &asymp; &minus;0.6379. Plugging each back into the original product gives exactly 10 (checked symbolically). The other two roots of the degree-4 equation are complex, so these are the only real roots.<br><br><b>Trap:</b> forgetting to cancel the 2 when simplifying <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8 &plusmn; 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span> gives a denominator of 30; flipping the sign of the 8 gives 4 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span> on top; dividing only one term by 2 gives &minus;2 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">31</span></span>.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "There are <i>n</i> identical cars on a circular track. Together they have just enough gas for one car to complete a lap. Is there a car that can complete a lap by collecting gas from the other cars on its way around? (Engel)", "opts": ["there is not", "there is"], "ci": 1, "exp": "<b>What we need:</b> decide whether some car can always start, drive around the track in its direction, and pick up each other car's gas as it passes, without ever running out before finishing the lap.<br><br><b>Step 1 — Turn it into a running total.</b> Measure gas in &ldquo;laps&rdquo;: all the gas together is exactly 1 lap. Going around the track, car <i>k</i> has gas <i>g</i><sub><i>k</i></sub>, and the road from car <i>k</i> to the next car has length <i>d</i><sub><i>k</i></sub> (as a fraction of the lap). Then <i>g</i><sub>1</sub>+…+<i>g</i><sub><i>n</i></sub> = 1 and <i>d</i><sub>1</sub>+…+<i>d</i><sub><i>n</i></sub> = 1. Each stop changes the tank by <i>g</i><sub><i>k</i></sub> &minus; <i>d</i><sub><i>k</i></sub>, and these changes add up to 0 around the whole lap.<br><br><b>Step 2 — Imagine a pretend trip with borrowing.</b> Start anywhere and pretend the tank is allowed to go below zero. Write down the tank level after each stretch of road. Because the total change around the lap is 0, after one full lap the level comes back to where it started.<br><br><b>Step 3 — Start where the pretend level is lowest.</b> Among these <i>n</i> recorded levels, pick the lowest one, and look at the car at that point. Now let that car really start there with an empty tank. Every later level on its trip is the pretend level minus the lowest level, which is never negative. So the real tank never drops below zero, and the car gets all the way around.<br><br><b>Step 4 — Conclusion.</b> No matter how the gas is split or how the cars are spaced, such a starting car exists. So the answer is: there is.<br><br><b>Answer check:</b> a computer test with thousands of random gas amounts and random spacings (1 to 8 cars) always found a car that could finish. Small case: with 1 car it has all the gas and finishes; with 2 cars, at least one of them has enough gas to reach the other, and then it has all the gas.<br><br><b>Trap:</b> &ldquo;there is not&rdquo; comes from picturing one bad starting car that runs dry. One bad start does not matter; the question only asks whether at least one good start exists.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "Four friends took a multiple-choice test. Their papers are shown below. Each of them has exactly two correct answers. Using their answers, what are the correct answers to questions 1, 2, 3, and 4, in that order? (MathCounts)\n\nJerry: 1.A  2.<i>B</i>  3.A  4.<i>C</i>\nJim:   1.<i>B</i>  2.A  3.<i>D</i>  4.<i>B</i>\nJohn:  1.<i>B</i>  2.A  3.A  4.<i>C</i>\nJeremy: 1.A  2.<i>C</i>  3.<i>D</i>  4.A", "opts": ["<i>A</i>, <i>A</i>, <i>D</i>, <i>C</i>", "<i>B</i>, <i>A</i>, <i>A</i>, <i>C</i>", "<i>B</i>, <i>A</i>, <i>D</i>, <i>C</i>", "<i>A</i>, <i>B</i>, <i>D</i>, <i>C</i>"], "ci": 0, "exp": "<b>What we need:</b> the answer key for questions 1&ndash;4, knowing that each of the four papers has exactly two correct answers.<br><br><b>Step 1 — Compare John with Jerry.</b> Jerry: <i>A</i>, <i>B</i>, <i>A</i>, <i>C</i>. John: <i>B</i>, <i>A</i>, <i>A</i>, <i>C</i>. They agree on questions 3 (<i>A</i>) and 4 (<i>C</i>) and disagree on questions 1 and 2. Suppose question 3 really is <i>A</i> and question 4 really is <i>C</i>. Then both already have 2 correct, so both must be wrong on 1 and 2.<br><br><b>Step 2 — Test that guess with Jim.</b> Jim: <i>B</i>, <i>A</i>, <i>D</i>, <i>B</i>. If 3 is <i>A</i> and 4 is <i>C</i>, Jim is wrong on 3 and 4, so he needs 1 = <i>B</i> and 2 = <i>A</i>. But then John (<i>B</i> on 1, <i>A</i> on 2) would have 4 correct, which breaks the rule. So 3 = <i>A</i> and 4 = <i>C</i> cannot both be true.<br><br><b>Step 3 — Use Jeremy and Jim on question 3.</b> Jim and Jeremy both answered <i>D</i> on question 3. Try 3 = <i>D</i> (so 3 is not <i>A</i>). Then Jerry and John each lose question 3, so each needs 2 correct among the other three questions.<br><br><b>Step 4 — Finish the key.</b> Jerry (1 <i>A</i>, 2 <i>B</i>, 4 <i>C</i>) and John (1 <i>B</i>, 2 <i>A</i>, 4 <i>C</i>) both need two of their remaining three. They disagree on 1 and 2, so they cannot both get 1 and 2 right; the only way both reach 2 is that 4 = <i>C</i> for both, plus one each from questions 1 and 2. Jeremy (1 <i>A</i>, 2 <i>C</i>, 3 <i>D</i>, 4 <i>A</i>) already has 3 = <i>D</i>, and 4 = <i>C</i> makes his 4 wrong, so he needs exactly one of 1 = <i>A</i> or 2 = <i>C</i>. Jim (1 <i>B</i>, 2 <i>A</i>, 3 <i>D</i>, 4 <i>B</i>) has 3 = <i>D</i>, 4 wrong, so he needs exactly one of 1 = <i>B</i> or 2 = <i>A</i>. Choosing 1 = <i>A</i> and 2 = <i>A</i> works for everyone: Jerry gets 1 and 4, John gets 2 and 4, Jim gets 2 and 3, Jeremy gets 1 and 3.<br><br><b>Answer check:</b> a computer test of every possible key (<i>A</i>&ndash;<i>E</i> for each of the 4 questions, 625 keys) finds exactly one key that gives each friend exactly two correct: <i>A</i>, <i>A</i>, <i>D</i>, <i>C</i>.<br><br><b>Trap:</b> the key <i>B</i>, <i>A</i>, <i>A</i>, <i>C</i> copies John's paper (it would give John 4 correct), and <i>B</i>, <i>A</i>, <i>D</i>, <i>C</i> gives John 3 correct; always recount every friend's score for a key before choosing it.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "A computer system considers a string of decimal digits a valid codeword if it contains an even number of 0<i>s</i>. Find a closed form for <i>a</i><sub><i>n</i></sub>, the number of valid <i>n</i>-digit codewords.", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>"], "ci": 0, "exp": "<b>What we need:</b> a formula for <i>a</i><sub><i>n</i></sub>, the number of strings of <i>n</i> decimal digits (0–9, any digit allowed in any place) that contain an even number of zeros.<br><br><b>Step 1 — Pair it with the opposite count.</b> Let <i>b</i><sub><i>n</i></sub> be the number of <i>n</i>-digit strings with an odd number of zeros. Every string is one or the other, so <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup>.<br><br><b>Step 2 — Build a string one digit at a time.</b> Add one more digit to a string of length <i>n</i> &minus; 1. If the new digit is one of the 9 nonzero digits, the number of zeros keeps its parity. If the new digit is 0, the parity flips. So<br><i>a</i><sub><i>n</i></sub> = 9<i>a</i><sub><i>n</i> &minus; 1</sub> + <i>b</i><sub><i>n</i> &minus; 1</sub>, and <i>b</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i> &minus; 1</sub> + 9<i>b</i><sub><i>n</i> &minus; 1</sub>.<br><br><b>Step 3 — Look at the difference.</b> Let <i>d</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub>. Subtracting the two lines: <i>d</i><sub><i>n</i></sub> = 8<i>a</i><sub><i>n</i> &minus; 1</sub> &minus; 8<i>b</i><sub><i>n</i> &minus; 1</sub> = 8<i>d</i><sub><i>n</i> &minus; 1</sub>. The empty string (length 0) has zero zeros, which is even, so <i>d</i><sub>0</sub> = 1 &minus; 0 = 1. Therefore <i>d</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>.<br><br><b>Step 4 — Solve the two equations.</b> <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> and <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>. Adding them: 2<i>a</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> + 8<sup><i>n</i></sup>, so <i>a</i><sub><i>n</i></sub> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>).<br><br><b>Answer check:</b> <i>n</i> = 1: the 9 one-digit strings 1–9 have zero zeros, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8 + 10) = 9 ✔. <i>n</i> = 2: 81 strings with no 0 plus the string 00 = 82, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(64 + 100) = 82 ✔. A computer count for <i>n</i> = 1 to 5 gives 9, 82, 756, 7048, 66384, matching the formula each time.<br><br><b>Trap:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>) is <i>b</i><sub><i>n</i></sub>, the count with an <i>odd</i> number of zeros. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>) comes from using 9 instead of 8 in Step 3 — forgetting that the one choice of 0 sends a string to the other group.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
