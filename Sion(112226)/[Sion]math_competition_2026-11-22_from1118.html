  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10_from1118";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"stem": "What is the sum of all real numbers <i>x</i> such that (<i>x</i><sup>2</sup>&minus;5<i>x</i>+5)<sup>(<i>x</i><sup>2</sup>&minus;7<i>x</i>+12)</sup> = 1? (MathCounts)", "opts": ["9", "12", "10", "8"], "ci": 2, "exp": "<b>What we need</b><br>Find every real <i>x</i> with (<i>x</i><sup>2</sup> &minus; 5<i>x</i> + 5)<sup>(<i>x</i><sup>2</sup> &minus; 7<i>x</i> + 12)</sup> = 1, then add them.<br><br><b>Step 1: Know the three ways a power can equal 1.</b> For a real base <i>b</i> and exponent <i>e</i>, <i>b</i><sup><i>e</i></sup> = 1 happens when (i) the base is 1, (ii) the exponent is 0 and the base is not 0, or (iii) the base is &minus;1 and the exponent is an even integer. (A positive base other than 1 needs exponent 0, which is case (ii).)<br><br><b>Step 2: Base = 1.</b> <i>x</i><sup>2</sup> &minus; 5<i>x</i> + 5 = 1 &rArr; <i>x</i><sup>2</sup> &minus; 5<i>x</i> + 4 = 0 &rArr; (<i>x</i> &minus; 1)(<i>x</i> &minus; 4) = 0, so <i>x</i> = 1 or <i>x</i> = 4.<br><br><b>Step 3: Exponent = 0.</b> <i>x</i><sup>2</sup> &minus; 7<i>x</i> + 12 = 0 &rArr; (<i>x</i> &minus; 3)(<i>x</i> &minus; 4) = 0, so <i>x</i> = 3 or <i>x</i> = 4. Check the base is not 0: at <i>x</i> = 3 the base is 9 &minus; 15 + 5 = &minus;1, and at <i>x</i> = 4 it is 16 &minus; 20 + 5 = 1. Both are fine.<br><br><b>Step 4: Base = &minus;1 with an even exponent.</b> <i>x</i><sup>2</sup> &minus; 5<i>x</i> + 5 = &minus;1 &rArr; <i>x</i><sup>2</sup> &minus; 5<i>x</i> + 6 = 0 &rArr; (<i>x</i> &minus; 2)(<i>x</i> &minus; 3) = 0. At <i>x</i> = 2 the exponent is 4 &minus; 14 + 12 = 2 (even), so (&minus;1)<sup>2</sup> = 1 works. At <i>x</i> = 3 the exponent is 0, which we already have.<br><br><b>Step 5: Collect distinct solutions.</b> <i>x</i> &isin; {1, 2, 3, 4}. Each value is counted once, even though 3 and 4 appeared twice. The sum is 1 + 2 + 3 + 4 = <b>10</b>.<br><br><b>Answer check</b> Substituting: <i>x</i> = 1 gives 1<sup>6</sup> = 1; <i>x</i> = 2 gives (&minus;1)<sup>2</sup> = 1; <i>x</i> = 3 gives (&minus;1)<sup>0</sup> = 1; <i>x</i> = 4 gives 1<sup>0</sup> = 1. A fine numerical scan of other <i>x</i> values with a positive base found no further solutions.<br><br><b>Trap</b> Solving only &ldquo;base = 1&rdquo; and &ldquo;exponent = 0&rdquo; gives 1 + 4 + 3 = 8 (counting 4 once) and misses <i>x</i> = 2; counting 4 twice instead of once leads to 12.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Let <i>x</i>, <i>y</i>, and <i>z</i> be three distinct complex numbers satisfying<br><br><i>x</i><sup>3</sup> + 5<i>y</i> + 5<i>z</i> = <i>y</i><sup>3</sup> + 5<i>x</i> + 5<i>z</i> = <i>z</i><sup>3</sup> + 5<i>x</i> + 5<i>y</i> = 5.<br><br>What is <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> + <i>z</i><sup>2</sup>?", "opts": ["5", "10", "25", "15"], "ci": 1, "exp": "<b>What we need</b><br>Three <b>distinct</b> numbers satisfy <i>x</i><sup>3</sup> + 5<i>y</i> + 5<i>z</i> = <i>y</i><sup>3</sup> + 5<i>x</i> + 5<i>z</i> = <i>z</i><sup>3</sup> + 5<i>x</i> + 5<i>y</i> = 5. Find <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> + <i>z</i><sup>2</sup>.<br><br><b>Step 1: Rewrite each equation the same way.</b> Let <i>S</i> = <i>x</i> + <i>y</i> + <i>z</i>. Then 5<i>y</i> + 5<i>z</i> = 5(<i>S</i> &minus; <i>x</i>), so the first equation is <i>x</i><sup>3</sup> + 5(<i>S</i> &minus; <i>x</i>) = 5, that is, <i>x</i><sup>3</sup> &minus; 5<i>x</i> + (5<i>S</i> &minus; 5) = 0. The other two equations become the same thing with <i>y</i> and <i>z</i>.<br><br><b>Step 2: All three numbers are roots of one cubic.</b> So <i>x</i>, <i>y</i>, <i>z</i> all satisfy <i>t</i><sup>3</sup> &minus; 5<i>t</i> + (5<i>S</i> &minus; 5) = 0. A cubic has at most three roots, and <i>x</i>, <i>y</i>, <i>z</i> are distinct, so they are <b>exactly</b> its three roots. (This is why the word &ldquo;distinct&rdquo; matters.)<br><br><b>Step 3: Use Vieta&rsquo;s formulas.</b> The cubic has no <i>t</i><sup>2</sup> term, so the sum of its roots is 0: <i>S</i> = <i>x</i> + <i>y</i> + <i>z</i> = 0. Then the constant term is 5&middot;0 &minus; 5 = &minus;5, and the cubic is <i>t</i><sup>3</sup> &minus; 5<i>t</i> &minus; 5 = 0. Its coefficient of <i>t</i> gives the sum of products two at a time: <i>x</i><i>y</i> + <i>y</i><i>z</i> + <i>z</i><i>x</i> = &minus;5.<br><br><b>Step 4: Compute the sum of squares.</b> <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> + <i>z</i><sup>2</sup> = (<i>x</i> + <i>y</i> + <i>z</i>)<sup>2</sup> &minus; 2(<i>x</i><i>y</i> + <i>y</i><i>z</i> + <i>z</i><i>x</i>) = 0<sup>2</sup> &minus; 2(&minus;5) = <b>10</b>.<br><br><b>Answer check</b> Numerically, the roots of <i>t</i><sup>3</sup> &minus; 5<i>t</i> &minus; 5 = 0 are about 2.627 and &minus;1.314 &plusmn; 0.421<i>i</i> (one real root and two complex ones &mdash; that is why the problem says <i>complex</i> numbers). Plugging them into each of the three original expressions gives 5 every time, and their squares add to 10.000.<br><br><b>Trap</b> Choosing 5 comes from using <i>x</i><i>y</i> + <i>y</i><i>z</i> + <i>z</i><i>x</i> = &minus;5 but forgetting the factor 2 (or the sign); 25 comes from squaring the 5.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Before a soccer game between North and South, there were five predictions:\n<i>a</i>) There won't be a draw.\n<i>b</i>) North will score against South.\n<i>c</i>) North will win.\n<i>d</i>) North won't lose.\n<i>e</i>) Three goals will be made in total.\nAfter the match, it turned out that exactly three of these predictions were true. How many goals did South make in the game? (Moscow)", "opts": ["3 goals", "0 goals", "2 goals", "1 goal"], "ci": 2, "exp": "<b>What we need</b><br>Exactly three of the five predictions came true. Use that to find the score, then read off South&rsquo;s goals.<br><br><b>Step 1: Suppose North won.</b> Then (c) &ldquo;North will win&rdquo; is true, (d) &ldquo;North won&rsquo;t lose&rdquo; is true, and (a) &ldquo;no draw&rdquo; is true. A team that wins must score, so (b) &ldquo;North will score&rdquo; is true too. That is already four true predictions &mdash; too many. So North did <b>not</b> win.<br><br><b>Step 2: Suppose it was a draw.</b> Then (a) is false and (c) is false, while (d) is true. To reach exactly three true, both (b) and (e) must be true: North scored, and the total was 3 goals. But in a draw both teams score the same number, so the total is even &mdash; it can never be 3. Contradiction, so it was not a draw.<br><br><b>Step 3: So North lost.</b> Then (a) is true, (c) is false, and (d) is false. Exactly three true means (b) and (e) must both be true: North scored at least one goal, and there were 3 goals in total. With North losing, the only split is North 1, South 2 (North 0, South 3 would make (b) false).<br><br><b>Step 4: Answer.</b> South scored <b>2 goals</b>.<br><br><b>Answer check</b> Score 1&ndash;2: (a) no draw &#10003;, (b) North scored &#10003;, (c) North won &#10007;, (d) North didn&rsquo;t lose &#10007;, (e) 3 goals &#10003; &mdash; exactly three true. A computer check of every score from 0&ndash;0 to 5&ndash;5 found 1&ndash;2 to be the only score with exactly three true predictions.<br><br><b>Trap</b> Choosing 3 goals comes from the 0&ndash;3 score, which forgets prediction (b) would then be false (only two true).", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "A king decides to give 100 of his prisoners a test. If they pass, they can go free. Otherwise, the king will execute all of them. The test goes as follows: the prisoners stand in a line, all facing forward. The king puts either a black or a white hat on each prisoner. The prisoners can only see the colors of the hats in front of them. Then, in any order they want, each one guesses the color of the hat on his head. Other than that, the prisoners can not speak. To pass, no more than one of them may guess incorrectly. If they can make their strategy beforehand, can they be assured that they will survive?", "opts": ["they can", "they cannot"], "ci": 0, "exp": "<b>What we need</b><br>We must decide whether 100 prisoners, each seeing only the hats in front of him and hearing the earlier guesses, can plan a strategy so that <b>at most one</b> guess is wrong &mdash; no matter how the king places the hats.<br><br><b>Step 1: Choose who speaks first.</b> Let the prisoners guess from the back of the line to the front. The prisoner at the back sees all 99 hats in front of him; every later prisoner sees the hats ahead of him and has <i>heard</i> every guess made behind him.<br><br><b>Step 2: The first guess is a signal, not a real guess.</b> Before the test they agree: the back prisoner counts the white hats he sees. If that number is odd he says &ldquo;white&rdquo;; if it is even he says &ldquo;black.&rdquo; His own hat is random, so this guess may be wrong &mdash; it is the one mistake they are allowed. What matters is that everyone now knows the <b>parity</b> (odd or even) of the number of white hats on prisoners 2 through 100.<br><br><b>Step 3: Every other prisoner can work out his hat exactly.</b> Take any prisoner after the first. He knows the parity of white hats among prisoners 2&ndash;100. He can <i>see</i> the white hats in front of him, and he has <i>heard</i> the guesses of the prisoners between the first one and himself &mdash; and (by induction) all of those guesses were correct, so he knows exactly how many of them wore white. The only hat in prisoners 2&ndash;100 he does not know is his own. If the white hats he can account for (seen + heard) already match the announced parity, his hat is black; if not, it is white. So he guesses correctly.<br><br><b>Step 4: Conclusion.</b> Prisoners 2 through 100 are all correct, and only the first prisoner might be wrong. That is at most one incorrect guess, so they are assured to survive.<br><br><b>Answer check</b> A computer tried this exact strategy on <i>every</i> possible arrangement of hats for lines of 1 to 8 prisoners: the largest number of wrong guesses was always 1. (Small example with 3 prisoners whose hats, from back to front, are white, black, white: the back prisoner sees one white hat (odd), so he says &ldquo;white.&rdquo; The middle prisoner sees one white hat ahead; that already makes the count odd, so his own hat must be black &mdash; correct. The front prisoner sees no hats and heard &ldquo;black&rdquo; from the middle, so the only way to make the count odd is a white hat on himself &mdash; correct.)<br><br><b>Trap</b> It feels impossible because no one can see his own hat. The trick is that one sacrificed guess can carry one bit of information (odd/even) that unlocks everyone else.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "A computer system considers a string of decimal digits a valid codeword if it contains an even number of 0<i>s</i>. Find a closed form for <i>a</i><sub><i>n</i></sub>, the number of valid <i>n</i>-digit codewords.", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>)", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>)"], "ci": 0, "exp": "<b>What we need:</b> a formula for <i>a</i><sub><i>n</i></sub>, the number of strings of <i>n</i> decimal digits (0–9, any digit allowed in any place) that contain an even number of zeros.<br><br><b>Step 1 — Pair it with the opposite count.</b> Let <i>b</i><sub><i>n</i></sub> be the number of <i>n</i>-digit strings with an odd number of zeros. Every string is one or the other, so <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup>.<br><br><b>Step 2 — Build a string one digit at a time.</b> Add one more digit to a string of length <i>n</i> &minus; 1. If the new digit is one of the 9 nonzero digits, the number of zeros keeps its parity. If the new digit is 0, the parity flips. So<br><i>a</i><sub><i>n</i></sub> = 9<i>a</i><sub><i>n</i> &minus; 1</sub> + <i>b</i><sub><i>n</i> &minus; 1</sub>, and <i>b</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i> &minus; 1</sub> + 9<i>b</i><sub><i>n</i> &minus; 1</sub>.<br><br><b>Step 3 — Look at the difference.</b> Let <i>d</i><sub><i>n</i></sub> = <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub>. Subtracting the two lines: <i>d</i><sub><i>n</i></sub> = 8<i>a</i><sub><i>n</i> &minus; 1</sub> &minus; 8<i>b</i><sub><i>n</i> &minus; 1</sub> = 8<i>d</i><sub><i>n</i> &minus; 1</sub>. The empty string (length 0) has zero zeros, which is even, so <i>d</i><sub>0</sub> = 1 &minus; 0 = 1. Therefore <i>d</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>.<br><br><b>Step 4 — Solve the two equations.</b> <i>a</i><sub><i>n</i></sub> + <i>b</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> and <i>a</i><sub><i>n</i></sub> &minus; <i>b</i><sub><i>n</i></sub> = 8<sup><i>n</i></sup>. Adding them: 2<i>a</i><sub><i>n</i></sub> = 10<sup><i>n</i></sup> + 8<sup><i>n</i></sup>, so <i>a</i><sub><i>n</i></sub> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8<sup><i>n</i></sup> + 10<sup><i>n</i></sup>).<br><br><b>Answer check:</b> <i>n</i> = 1: the 9 one-digit strings 1–9 have zero zeros, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(8 + 10) = 9 ✔. <i>n</i> = 2: 81 strings with no 0 plus the string 00 = 82, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(64 + 100) = 82 ✔. A computer count for <i>n</i> = 1 to 5 gives 9, 82, 756, 7048, 66384, matching the formula each time.<br><br><b>Trap:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(10<sup><i>n</i></sup> &minus; 8<sup><i>n</i></sup>) is <i>b</i><sub><i>n</i></sub>, the count with an <i>odd</i> number of zeros. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(9<sup><i>n</i></sup> + 10<sup><i>n</i></sup>) comes from using 9 instead of 8 in Step 3 — forgetting that the one choice of 0 sends a string to the other group.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
