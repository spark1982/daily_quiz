var INSTRUCTION = "Choose the correct answer for each problem. A calculator (Desmos) is allowed, as on the real SAT.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"stem": "Line <i>ℓ</i> in the <i>xy</i>-plane passes through the points (&minus;2, 5) and (4, &minus;7). What is the <i>y</i>-intercept of line <i>ℓ</i>?", "opts": ["&minus;2", "&minus;3", "9", "1"], "ci": 3, "exp": "<b>What we need:</b> the value of <i>b</i> in <i>y</i> = <i>mx</i> + <i>b</i>.<br><br><b>Step 1.</b> Slope: <i>m</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;7 &minus; 5</span><span style=\"border-top:1.4px solid #111;\">4 &minus; (&minus;2)</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;12</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = &minus;2.<br><br><b>Step 2.</b> Substitute (&minus;2, 5): 5 = &minus;2(&minus;2) + <i>b</i> = 4 + <i>b</i>, so <i>b</i> = 1.<br><br><b>Answer check:</b> Use the other point: &minus;2(4) + 1 = &minus;7 ✓. The line is <i>y</i> = &minus;2<i>x</i> + 1.<br><br><b>Traps:</b> &minus;2 is the slope, not the intercept. 9 comes from using slope +2 (<i>a</i> sign error): 5 = 2(&minus;2) + <i>b</i>. &minus;3 comes from 5 &minus; 8, mishandling the product &minus;2 &middot; &minus;2.<br><br><b>Desmos:</b> Type the two points and the line <i>y</i> = <i>mx</i> + <i>b</i> with sliders, or use a regression <i>y</i><sub>1</sub> ~ <i>mx</i><sub>1</sub> + <i>b</i> on a two-point table.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "A delivery van can safely carry at most 1,800 pounds, including the driver and all cargo. The driver weighs 180 pounds, a hand truck kept in the van weighs 135 pounds, and each box weighs 45 pounds. What is the maximum number of boxes the van can carry?", "opts": ["37", "36", "40", "33"], "ci": 3, "exp": "<b>What we need:</b> the largest whole number <i>n</i> with 180 + 135 + 45<i>n</i> &le; 1,800.<br><br><b>Step 1.</b> Combine the fixed weights: 180 + 135 = 315.<br><br><b>Step 2.</b> 45<i>n</i> &le; 1,800 &minus; 315 = 1,485.<br><br><b>Step 3.</b> <i>n</i> &le; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1,485</span><span style=\"border-top:1.4px solid #111;\">45</span></span> = 33. Since 33 is a whole number, the maximum is 33 boxes.<br><br><b>Answer check:</b> 33 boxes: 315 + 45(33) = 315 + 1,485 = 1,800 ✓ (exactly at the limit). 34 boxes would give 1,845 &gt; 1,800.<br><br><b>Traps:</b> 36 forgets the hand truck (1,620 &divide; 45). 37 forgets the driver (1,665 &divide; 45). 40 ignores both fixed weights (1,800 &divide; 45).", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "4<i>x</i> &minus; <i>ky</i> = 10<br>6<i>x</i> &minus; 9<i>y</i> = 15<br>In the system of equations above, <i>k</i> is a constant. For what value of <i>k</i> does the system have infinitely many solutions?", "opts": ["9", "4", "6", "&minus;6"], "ci": 2, "exp": "<b>What we need:</b> the value of <i>k</i> that makes the two equations describe the same line.<br><br><b>Step 1.</b> Infinitely many solutions means one equation is a constant multiple of the other.<br><br><b>Step 2.</b> Multiply the second equation by <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>: 4<i>x</i> &minus; 6<i>y</i> = 10.<br><br><b>Step 3.</b> This matches 4<i>x</i> &minus; <i>ky</i> = 10 exactly when <i>k</i> = 6.<br><br><b>Answer check:</b> Ratios: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>6</span><span style=\"border-top:1.4px solid #111;\">9</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>10</span><span style=\"border-top:1.4px solid #111;\">15</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> ✓ — all three ratios agree, so the lines coincide.<br><br><b>Traps:</b> 9 copies the coefficient from the second equation without scaling. &minus;6 drops the minus sign already written in &minus;<i>ky</i>. 4 matches the <i>x</i>-coefficient instead of the <i>y</i>-coefficient.<br><br><b>Desmos:</b> Graph both lines with a slider for <i>k</i>; at <i>k</i> = 6 the lines overlap.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "Which expression is equivalent to <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i><sup>2</sup> &minus; 9</span><span style=\"border-top:1.4px solid #111;\"><i>x</i><sup>2</sup> + <i>x</i> &minus; 6</span></span> for <i>x</i> &ne; &minus;3 and <i>x</i> &ne; 2?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> + 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>"], "ci": 2, "exp": "<b>What we need:</b> a simplified form of the rational expression.<br><br><b>Step 1.</b> Factor the numerator (difference of squares): <i>x</i><sup>2</sup> &minus; 9 = (<i>x</i> &minus; 3)(<i>x</i> + 3).<br><br><b>Step 2.</b> Factor the denominator: <i>x</i><sup>2</sup> + <i>x</i> &minus; 6 = (<i>x</i> + 3)(<i>x</i> &minus; 2).<br><br><b>Step 3.</b> Cancel the common factor (<i>x</i> + 3): the result is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> &minus; 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>.<br><br><b>Answer check:</b> Test <i>x</i> = 4: original <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>16 &minus; 9</span><span style=\"border-top:1.4px solid #111;\">16 + 4 &minus; 6</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>7</span><span style=\"border-top:1.4px solid #111;\">14</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>; simplified <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4 &minus; 3</span><span style=\"border-top:1.4px solid #111;\">4 &minus; 2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> ✓.<br><br><b>Traps:</b> Cancelling the wrong factor gives <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i> + 3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span>. Factoring the denominator as (<i>x</i> &minus; 3)(<i>x</i> + 2) gives a sign error. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> comes from illegally cancelling the <i>x</i><sup>2</sup> terms and dividing &minus;9 by &minus;6.<br><br><b>Desmos:</b> Graph the original and each choice; only the correct one overlaps everywhere except the hole at <i>x</i> = &minus;3.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "A population of bacteria triples every 4 hours. At 9:00 a.<i>m</i>. there are 500 bacteria. Which function gives the number of bacteria, <i>P</i>(<i>h</i>), <i>h</i> hours after 9:00 a.<i>m</i>.?", "opts": ["<i>P</i>(<i>h</i>) = 500(3)<sup>4<i>h</i></sup>", "<i>P</i>(<i>h</i>) = 500(3)<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>h</i></span><span style=\"border-top:1.4px solid #111;\">4</span></span></sup>", "<i>P</i>(<i>h</i>) = 500(4)<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>h</i></span><span style=\"border-top:1.4px solid #111;\">3</span></span></sup>", "<i>P</i>(<i>h</i>) = 500(1 + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3<i>h</i></span><span style=\"border-top:1.4px solid #111;\">4</span></span>)"], "ci": 1, "exp": "<b>What we need:</b> an exponential model with initial value 500 that multiplies by 3 every 4 hours.<br><br><b>Step 1.</b> Exponential form: <i>P</i>(<i>h</i>) = (initial) &middot; (growth factor)<sup>number of periods</sup>.<br><br><b>Step 2.</b> Initial value 500; growth factor 3; the number of 4-hour periods in <i>h</i> hours is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>h</i></span><span style=\"border-top:1.4px solid #111;\">4</span></span>.<br><br><b>Step 3.</b> So <i>P</i>(<i>h</i>) = 500(3)<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>h</i></span><span style=\"border-top:1.4px solid #111;\">4</span></span></sup>.<br><br><b>Answer check:</b> <i>h</i> = 0 gives 500 ✓; <i>h</i> = 4 gives 500 &middot; 3 = 1,500 ✓; <i>h</i> = 8 gives 4,500 ✓ (tripled twice).<br><br><b>Traps:</b> 500(3)<sup>4<i>h</i></sup> triples 4 times every hour. 500(4)<sup><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>h</i></span><span style=\"border-top:1.4px solid #111;\">3</span></span></sup> swaps the roles of 3 and 4. The last choice is linear, not exponential: it adds a fixed amount instead of multiplying.<br><br><b>Desmos:</b> Graph each choice and check the points (0, 500) and (4, 1500).", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> + <i>px</i> + <i>q</i>, where <i>p</i> and <i>q</i> are constants. The graph of <i>y</i> = <i>f</i>(<i>x</i>) in the <i>xy</i>-plane has its vertex at (5, &minus;16). If <i>g</i>(<i>x</i>) = <i>f</i>(<i>x</i> + 3), what is the smaller of the two zeros of <i>g</i>?", "opts": ["6", "1", "4", "&minus;2"], "ci": 3, "exp": "<b>What we need:</b> the zeros of <i>g</i>, which is <i>f</i> shifted horizontally.<br><br><b>Step 1.</b> A monic quadratic with vertex (5, &minus;16) is <i>f</i>(<i>x</i>) = (<i>x</i> &minus; 5)<sup>2</sup> &minus; 16 (so <i>p</i> = &minus;10, <i>q</i> = 9).<br><br><b>Step 2.</b> Zeros of <i>f</i>: (<i>x</i> &minus; 5)<sup>2</sup> = 16 &rArr; <i>x</i> &minus; 5 = &plusmn;4 &rArr; <i>x</i> = 1 or <i>x</i> = 9.<br><br><b>Step 3.</b> <i>g</i>(<i>x</i>) = <i>f</i>(<i>x</i> + 3) is zero when <i>x</i> + 3 = 1 or <i>x</i> + 3 = 9, so <i>x</i> = &minus;2 or <i>x</i> = 6. Replacing <i>x</i> with <i>x</i> + 3 shifts the graph 3 units to the <b>left</b>.<br><br><b>Step 4.</b> The smaller zero is &minus;2.<br><br><b>Answer check:</b> <i>g</i>(<i>x</i>) = (<i>x</i> + 3 &minus; 5)<sup>2</sup> &minus; 16 = (<i>x</i> &minus; 2)<sup>2</sup> &minus; 16; <i>g</i>(&minus;2) = 16 &minus; 16 = 0 ✓ and <i>g</i>(6) = 16 &minus; 16 = 0 ✓.<br><br><b>Traps:</b> 1 is the smaller zero of <i>f</i>, not <i>g</i> (forgetting the shift). 4 shifts the wrong way (1 + 3 instead of 1 &minus; 3). 6 is the larger zero of <i>g</i>.<br><br><b>Desmos:</b> Enter <i>f</i>(<i>x</i>) = (<i>x</i> &minus; 5)<sup>2</sup> &minus; 16 and <i>g</i>(<i>x</i>) = <i>f</i>(<i>x</i> + 3); click the <i>x</i>-intercepts of <i>g</i>.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "Each of 200 students chose exactly one after-school club, as summarized in the table above. If one student is selected at random from the students who chose robotics, what is the probability that the student is in 10<i>th</i> grade?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">20</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">5</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">50</span></span>"], "ci": 0, "exp": "<b>What we need:</b> a conditional probability: <i>P</i>(10<i>th</i> grade | robotics).<br><br><b>Step 1.</b> The condition &ldquo;chose robotics&rdquo; restricts the group to the Robotics column: 80 students.<br><br><b>Step 2.</b> Of those, 36 are in 10<i>th</i> grade.<br><br><b>Step 3.</b> Probability = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>36</span><span style=\"border-top:1.4px solid #111;\">80</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">20</span></span>.<br><br><b>Answer check:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">20</span></span> = 0.45, and 0.45 &times; 80 = 36 ✓.<br><br><b>Traps:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">50</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>36</span><span style=\"border-top:1.4px solid #111;\">200</span></span> uses all 200 students as the denominator. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>36</span><span style=\"border-top:1.4px solid #111;\">60</span></span> answers a different question (the probability a 10<i>th</i> grader chose robotics). <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">5</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>80</span><span style=\"border-top:1.4px solid #111;\">200</span></span> is the probability of choosing robotics at all.", "tag": "Problem-Solving and Data Analysis", "tagcolor": "#1D9E75", "passage": "<table style=\"border-collapse:collapse;margin:8px 0;font-size:0.92rem;\"><tr><th style=\"border:1px solid #bbb;padding:4px 8px;\"></th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Robotics</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Art</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Total</th></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">9<i>th</i> grade</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">28</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">42</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">70</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">10<i>th</i> grade</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">36</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">24</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">60</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">11<i>th</i> grade</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">16</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">54</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">70</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Total</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">80</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">120</td><td style=\"border:1px solid #bbb;padding:4px 8px;text-align:right;\">200</td></tr></table>"}, {"stem": "In right triangle <i>ABC</i>, angle <i>C</i> is a right angle and sin <i>A</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span>. If <i>BC</i> = 15, what is the perimeter of triangle <i>ABC</i>?", "opts": ["90", "117", "54", "30"], "ci": 0, "exp": "<b>What we need:</b> all three side lengths.<br><br><b>Step 1.</b> sin <i>A</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>opposite</span><span style=\"border-top:1.4px solid #111;\">hypotenuse</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>BC</i></span><span style=\"border-top:1.4px solid #111;\"><i>AB</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span>.<br><br><b>Step 2.</b> <i>BC</i> = 15 = 5 &times; 3, so the triangle is a 5-12-13 triangle scaled by 3: <i>AB</i> = 13 &times; 3 = 39.<br><br><b>Step 3.</b> <i>AC</i> = 12 &times; 3 = 36 (check: 36<sup>2</sup> + 15<sup>2</sup> = 1,296 + 225 = 1,521 = 39<sup>2</sup>).<br><br><b>Step 4.</b> Perimeter = 15 + 36 + 39 = 90.<br><br><b>Answer check:</b> Pythagorean check above ✓, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">39</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span> ✓.<br><br><b>Traps:</b> 30 is the perimeter of the unscaled 5-12-13 triangle. 54 adds only <i>BC</i> and <i>AB</i>. 117 = 3 &times; 39 wrongly treats all three sides as equal to the hypotenuse.", "tag": "Geometry and Trigonometry", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ if(window.SAT_TIMEUP && SAT_TIMEUP() && !(activeSet && activeSet.length)){ wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, "(time's up)")); } else skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* exam-mode 2026-11-14 */
(function(){
  function examActive(){ return !state.reported && !(activeSet && activeSet.length); }
  window.EXAM_ACTIVE = examActive;
  var banner = document.createElement('div'); banner.className = 'exam-banner'; banner.id = 'exam-banner';
  banner.innerHTML = '&#128221; <b>Test mode</b> &mdash; like a real test: no answers or explanations until you finish. You can change your answers until you press Finish.';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(banner, card);
  var _pick = window.pick;
  window.pick = function(idx){
    if(!examActive()) return _pick(idx);
    if(state.showResults) return;
    var qi = activeOrder()[state.cur];
    state.answers[qi] = idx; saveState(); render();
  };
  function maskDots(){
    var ds = document.querySelectorAll('#dots-panel .dot');
    for(var i=0;i<ds.length;i++){ var d=ds[i]; if(d.classList.contains('answered-correct')||d.classList.contains('answered-wrong')){ d.classList.remove('answered-correct','answered-wrong'); d.classList.add('answered-exam'); } }
  }
  function mask(){
    var on = examActive() && !state.showResults;
    banner.style.display = on ? 'block' : 'none';
    if(!on) return;
    var qi = activeOrder()[state.cur];
    var btns = document.querySelectorAll('#options .opt-btn');
    for(var i=0;i<btns.length;i++){ (function(b, idx){
      b.classList.remove('reveal-correct','selected-wrong','selected-correct','exam-selected');
      b.disabled = false;
      b.onclick = function(){ window.pick(idx); };
      if(state.answers[qi] === idx) b.classList.add('exam-selected');
    })(btns[i], i); }
    var eb = document.getElementById('exp-box'); if(eb){ eb.style.display='none'; eb.innerHTML=''; }
    maskDots();
  }
  var _render = window.render;
  window.render = function(){ var r = _render.apply(this, arguments); try{ mask(); }catch(e){} return r; };
  var _tj = window.toggleJump;
  window.toggleJump = function(){ var r = _tj.apply(this, arguments); try{ if(examActive() && !state.showResults) maskDots(); }catch(e){} return r; };
  render();
})();
</script>
<script>
/* sat-timer 2026-11-06 */
(function(){
  var PER_Q = 80;
  var LIMIT = PER_Q * RAW_QUESTIONS.length;
  var TK = STORAGE_KEY + '_timer';
  function blank(){ return {el:0, per:{}, up:false}; }
  function load(){ try{ return JSON.parse(localStorage.getItem(TK)) || blank(); }catch(e){ return blank(); } }
  var T = load(), paused = false, last = Date.now();
  function save(){ try{ localStorage.setItem(TK, JSON.stringify(T)); }catch(e){} }
  function retrying(){ return !!(activeSet && activeSet.length); }
  window.SAT_TIMEUP = function(){ return !!T.up; };
  var bar = document.createElement('div'); bar.className = 'sat-timer'; bar.id = 'sat-timer';
  bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function curAnswered(){ if(window.EXAM_ACTIVE && EXAM_ACTIVE()) return false; var q = activeOrder()[state.cur]; return q !== undefined && state.answers[q] !== undefined; } /* sat-timer-pause-on-answer 2026-11-14 */
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && !curAnswered() && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
