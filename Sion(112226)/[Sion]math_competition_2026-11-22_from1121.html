var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10_from1121";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"stem": "Abe can paint the room in 15 hours, Bea can paint 50 percent faster than Abe, and Coe can paint twice as fast as Abe. Abe begins to paint the room and works alone for the first hour and a half. Then Bea joins Abe, and they work together until half the room is painted. Then Coe joins Abe and Bea, and they work together until the entire room is painted. Find the number of minutes after Abe begins for the three of them to finish painting the room. (AIME)", "opts": ["334 minutes", "300 minutes", "320 minutes", "274 minutes"], "ci": 0, "exp": "<b>What we need:</b> the total time, in minutes, from when Abe starts until the room is finished. Work with rates in <i>rooms per hour</i>.<br><br><b>Step 1 — Rates.</b> Abe: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">15</span></span> room per hour. &ldquo;50 percent faster&rdquo; means Bea&rsquo;s <i>rate</i> is 1.5 times Abe&rsquo;s: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">15</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span>. Coe is twice as fast: 2 &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">15</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">15</span></span>.<br><br><b>Step 2 — Abe alone for 1.5 hours.</b> Work done = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">15</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span> of the room.<br><br><b>Step 3 — Abe and Bea until half is painted.</b> Combined rate = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">15</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">30</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span>. Work still needed to reach half: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">5</span></span>. Time = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">5</span></span> &divide; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\">5</span></span> hours = 2.4 hours = 144 minutes.<br><br><b>Step 4 — All three for the second half.</b> Combined rate = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">30</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">30</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">30</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">10</span></span>. Time = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &divide; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">10</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">3</span></span> hours = 100 minutes.<br><br><b>Step 5 — Total.</b> 90 + 144 + 100 = 334 minutes.<br><br><b>Answer check:</b> Work done: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span> &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\">5</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">10</span></span> &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">10</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">5</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 1 room ✓.<br><br><b>Trap:</b> Reading &ldquo;50 percent faster&rdquo; as &ldquo;takes 50 percent less time&rdquo; (7.5 hours, rate <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">15</span></span>) makes Bea as fast as Coe and leads to 90 + 120 + 90 = 300 minutes. Faster refers to the rate, not the time.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "What is the sum of all real values of <i>x</i> that are solutions to the equation <br>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span><i>x</i><sup>2</sup> &minus; <i>x</i> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)<sup>(<i>x</i><sup>2</sup>&minus;9<i>x</i>+20)</sup> = 1?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>23</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "10", "12", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>21</span><span style=\"border-top:1.4px solid #111;\">2</span></span>"], "ci": 0, "exp": "<b>What we need:</b> every real <i>x</i> that makes a power equal to 1, then their sum. A real power <i>b</i><sup><i>e</i></sup> equals 1 in exactly three ways: (i) the exponent is 0 and the base is not 0; (ii) the base is 1; (iii) the base is &minus;1 and the exponent is an even integer.<br><br>Let the base be <i>b</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span><i>x</i><sup>2</sup> &minus; <i>x</i> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> and the exponent be <i>e</i> = <i>x</i><sup>2</sup> &minus; 9<i>x</i> + 20 = (<i>x</i> &minus; 4)(<i>x</i> &minus; 5).<br><br><b>Step 1 — Exponent 0.</b> <i>e</i> = 0 gives <i>x</i> = 4 or <i>x</i> = 5. Check the base is not 0: at <i>x</i> = 4, <i>b</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>32</span><span style=\"border-top:1.4px solid #111;\">3</span></span> &minus; 4 &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 10 &minus; 4 = 6; at <i>x</i> = 5, <i>b</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>50</span><span style=\"border-top:1.4px solid #111;\">3</span></span> &minus; 5 &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 16 &minus; 5 = 11. Both are fine, so <i>x</i> = 4 and <i>x</i> = 5 count.<br><br><b>Step 2 — Base 1.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span><i>x</i><sup>2</sup> &minus; <i>x</i> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 1. Multiply by 3: 2<i>x</i><sup>2</sup> &minus; 3<i>x</i> &minus; 2 = 3, so 2<i>x</i><sup>2</sup> &minus; 3<i>x</i> &minus; 5 = 0, which factors as (2<i>x</i> &minus; 5)(<i>x</i> + 1) = 0. So <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">2</span></span> or <i>x</i> = &minus;1. (1 to any power is 1, so no exponent check is needed.)<br><br><b>Step 3 — Base &minus;1.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span><i>x</i><sup>2</sup> &minus; <i>x</i> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = &minus;1. Multiply by 3: 2<i>x</i><sup>2</sup> &minus; 3<i>x</i> + 1 = 0, so (2<i>x</i> &minus; 1)(<i>x</i> &minus; 1) = 0 and <i>x</i> = 1 or <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>. Now the exponent must be an even integer: at <i>x</i> = 1, <i>e</i> = 1 &minus; 9 + 20 = 12 (even ✓); at <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, <i>e</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">2</span></span> + 20 = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>63</span><span style=\"border-top:1.4px solid #111;\">4</span></span>, not an integer, so (&minus;1) raised to the power <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>63</span><span style=\"border-top:1.4px solid #111;\">4</span></span> is not a real number equal to 1 — reject <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>.<br><br><b>Step 4 — Add.</b> The solutions are 4, 5, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, &minus;1, and 1. Sum = 4 + 5 + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &minus; 1 + 1 = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>23</span><span style=\"border-top:1.4px solid #111;\">2</span></span>.<br><br><b>Answer check:</b> Substituting each value: <i>x</i> = 4 gives 6<sup>0</sup> = 1; <i>x</i> = 5 gives 11<sup>0</sup> = 1; <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">2</span></span> and <i>x</i> = &minus;1 give base 1; <i>x</i> = 1 gives (&minus;1)<sup>12</sup> = 1 ✓.<br><br><b>Trap:</b> 12 comes from wrongly keeping <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> (adds <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>). <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>21</span><span style=\"border-top:1.4px solid #111;\">2</span></span> comes from forgetting the base = &minus;1 case (missing <i>x</i> = 1). 10 comes from forgetting the base = 1 case (4 + 5 + 1).", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Suppose that <i>P</i>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\">3</span></span>) = <i>x</i><sup>2</sup> + <i>x</i> + 1. What is the sum of all values of <i>x</i> for which <i>P</i>(3<i>x</i>) = 7? (AMC 10)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">9</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>"], "ci": 1, "exp": "<b>What we need:</b> a formula for <i>P</i> itself, then the sum of the solutions of <i>P</i>(3<i>x</i>) = 7.<br><br><b>Step 1 — Find <i>P</i>(<i>u</i>).</b> We know <i>P</i>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\">3</span></span>) = <i>x</i><sup>2</sup> + <i>x</i> + 1. Let <i>u</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\">3</span></span>, so <i>x</i> = 3<i>u</i>. Then <i>P</i>(<i>u</i>) = (3<i>u</i>)<sup>2</sup> + 3<i>u</i> + 1 = 9<i>u</i><sup>2</sup> + 3<i>u</i> + 1.<br><br><b>Step 2 — Evaluate <i>P</i>(3<i>x</i>).</b> Replace <i>u</i> with 3<i>x</i>: <i>P</i>(3<i>x</i>) = 9(3<i>x</i>)<sup>2</sup> + 3(3<i>x</i>) + 1 = 81<i>x</i><sup>2</sup> + 9<i>x</i> + 1.<br><br><b>Step 3 — Solve.</b> 81<i>x</i><sup>2</sup> + 9<i>x</i> + 1 = 7 gives 81<i>x</i><sup>2</sup> + 9<i>x</i> &minus; 6 = 0. The discriminant is 9<sup>2</sup> + 4 &middot; 81 &middot; 6 = 81 + 1944 = 2025 &gt; 0, so there are two real solutions.<br><br><b>Step 4 — Sum of roots.</b> For <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i> = 0 the sum of the roots is &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>b</i></span><span style=\"border-top:1.4px solid #111;\"><i>a</i></span></span> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">81</span></span> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span>.<br><br><b>Answer check:</b> 2025 = 45<sup>2</sup>, so the roots are <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;9 &plusmn; 45</span><span style=\"border-top:1.4px solid #111;\">162</span></span>: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>36</span><span style=\"border-top:1.4px solid #111;\">162</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">9</span></span> and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;54</span><span style=\"border-top:1.4px solid #111;\">162</span></span> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>. Their sum is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">9</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">9</span></span> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span> ✓. Also <i>P</i>(3 &middot; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">9</span></span>) = <i>P</i>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>) = 9 &middot; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">9</span></span> + 3 &middot; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> + 1 = 4 + 2 + 1 = 7 ✓.<br><br><b>Trap:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">9</span></span> drops the minus sign in &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>b</i></span><span style=\"border-top:1.4px solid #111;\"><i>a</i></span></span>. &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span> is only one of the two roots (and is also what you get if you wrongly use <i>P</i>(3<i>x</i>) = 9<i>x</i><sup>2</sup> + 3<i>x</i> + 1, forgetting to substitute 3<i>x</i>). &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">9</span></span> flips the sign of the other root.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "There are 13 green, 15 blue, and 17 red chameleons on Camelot Island. Whenever two chameleons of different colors meet, they both swap to the third color. Is it possible for all chameleons to become one color? (Russia)", "opts": ["possible", "impossible"], "ci": 1, "exp": "<b>What we need:</b> starting from 13 green, 15 blue and 17 red chameleons (45 in all), can a sequence of meetings ever make all 45 the same color?<br><br><b>Step 1 — See what one meeting does.</b> When two chameleons of different colors meet, those two colors each lose 1 and the third color gains 2. Write the counts as (<i>G</i>, <i>B</i>, <i>R</i>). For example, a green–blue meeting changes (<i>G</i>, <i>B</i>, <i>R</i>) into (<i>G</i> &minus; 1, <i>B</i> &minus; 1, <i>R</i> + 2).<br><br><b>Step 2 — Find something that never changes (an invariant).</b> Look at the difference of any two counts. In the green–blue meeting, <i>G</i> &minus; <i>B</i> does not change at all, while <i>G</i> &minus; <i>R</i> and <i>B</i> &minus; <i>R</i> each drop by 3. Every kind of meeting works the same way: each pairwise difference changes by 0 or by 3. So every pairwise difference keeps the <b>same remainder when divided by 3</b>.<br><br><b>Step 3 — Start values.</b> 13, 15, 17 leave remainders 1, 0, 2 when divided by 3 — three different remainders. So no two counts ever have a difference divisible by 3. In particular <i>G</i> &minus; <i>B</i> = 13 &minus; 15 = &minus;2 is never a multiple of 3, and it never will be.<br><br><b>Step 4 — Compare with the goal.</b> If all 45 chameleons were one color, the counts would be 45, 0, 0 in some order. Then the two colors with 0 would have difference 0, which <i>is</i> a multiple of 3. That contradicts Step 3, so this can never happen.<br><br><b>Answer:</b> impossible.<br><br><b>Answer check:</b> a computer search of every count triple reachable from (13, 15, 17) finds 360 reachable triples and none of them has two zeros.<br><br><b>Trap:</b> checking only the total (45 is fine) or trying a few meetings by hand does not prove anything. You need a quantity that every meeting preserves.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "A sequence of three real numbers forms an arithmetic progression with a first term of 9. If 2 is added to the 2<sup>nd</sup> term and 20 is added to the 3<sup>rd</sup> term, the three resulting numbers form a geometric progression. What is the smallest possible value for the 3<sup>rd</sup> term of the geometric progression? (AMC 12)", "opts": ["&minus;3", "1", "49", "9"], "ci": 1, "exp": "<b>What we need:</b> the smallest possible third term of the geometric progression made from the arithmetic progression 9, 9 + <i>d</i>, 9 + 2<i>d</i>.<br><br><b>Step 1 &mdash; Write both progressions.</b> Arithmetic progression with first term 9 and common difference <i>d</i>: 9, 9 + <i>d</i>, 9 + 2<i>d</i>. Add 2 to the second term and 20 to the third: 9, 11 + <i>d</i>, 29 + 2<i>d</i>. These form a geometric progression.<br><br><b>Step 2 &mdash; Use the geometric-progression rule.</b> In a geometric progression the middle term squared equals the product of its neighbors: (11 + <i>d</i>)<sup>2</sup> = 9(29 + 2<i>d</i>).<br><br><b>Step 3 &mdash; Solve.</b> Left side: 121 + 22<i>d</i> + <i>d</i><sup>2</sup>. Right side: 261 + 18<i>d</i>. So <i>d</i><sup>2</sup> + 4<i>d</i> &minus; 140 = 0, which factors as (<i>d</i> &minus; 10)(<i>d</i> + 14) = 0. Thus <i>d</i> = 10 or <i>d</i> = &minus;14.<br><br><b>Step 4 &mdash; Find each third term.</b> <i>d</i> = 10: AP 9, 19, 29 &rarr; GP 9, 21, 49 (ratio <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>7</span><span style=\"border-top:1.4px solid #111;\">3</span></span>); third term 49. <i>d</i> = &minus;14: AP 9, &minus;5, &minus;19 &rarr; GP 9, &minus;3, 1 (ratio &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>); third term 1. The smaller value is <b>1</b>.<br><br><b>Answer check:</b> 21<sup>2</sup> = 441 = 9 &times; 49 and (&minus;3)<sup>2</sup> = 9 = 9 &times; 1, so both are true geometric progressions.<br><br><b>Trap:</b> 49 is the other valid third term (not the smallest). &minus;3 is the second term of the GP, and 9 is the first term &mdash; neither is the third term.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}];

  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* exam-mode 2026-11-14 */
(function(){
  function examActive(){ return !state.reported && !(activeSet && activeSet.length); }
  window.EXAM_ACTIVE = examActive;
  var banner = document.createElement('div'); banner.className = 'exam-banner'; banner.id = 'exam-banner';
  banner.innerHTML = '&#128221; <b>Test mode</b> &mdash; like a real test: no answers or explanations until you finish. You can change your answers until you press Finish.';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(banner, card);
  var _pick = window.pick;
  window.pick = function(idx){
    if(!examActive()) return _pick(idx);
    if(state.showResults) return;
    var qi = activeOrder()[state.cur];
    state.answers[qi] = idx; saveState(); render();
  };
  function maskDots(){
    var ds = document.querySelectorAll('#dots-panel .dot');
    for(var i=0;i<ds.length;i++){ var d=ds[i]; if(d.classList.contains('answered-correct')||d.classList.contains('answered-wrong')){ d.classList.remove('answered-correct','answered-wrong'); d.classList.add('answered-exam'); } }
  }
  function mask(){
    var on = examActive() && !state.showResults;
    banner.style.display = on ? 'block' : 'none';
    if(!on) return;
    var qi = activeOrder()[state.cur];
    var btns = document.querySelectorAll('#options .opt-btn');
    for(var i=0;i<btns.length;i++){ (function(b, idx){
      b.classList.remove('reveal-correct','selected-wrong','selected-correct','exam-selected');
      b.disabled = false;
      b.onclick = function(){ window.pick(idx); };
      if(state.answers[qi] === idx) b.classList.add('exam-selected');
    })(btns[i], i); }
    var eb = document.getElementById('exp-box'); if(eb){ eb.style.display='none'; eb.innerHTML=''; }
    maskDots();
  }
  var _render = window.render;
  window.render = function(){ var r = _render.apply(this, arguments); try{ mask(); }catch(e){} return r; };
  var _tj = window.toggleJump;
  window.toggleJump = function(){ var r = _tj.apply(this, arguments); try{ if(examActive() && !state.showResults) maskDots(); }catch(e){} return r; };
  render();
})();
</script>
