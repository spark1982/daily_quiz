<script>
var TITLE = "[Sion] Spanish";
var QUIZ_KEY = "sionspanish_10_from1120";
var INSTRUCTION = "Choose the best answer. Read each sentence carefully \u2014 look for clue words about time and who is doing the action.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"stem": "Cuando vivíamos en el campo, mis abuelos ______ muchos animales.<br><br>Choose the correct form.", "opts": ["tenían", "tenía", "teníamos", "tienen"], "ci": 0, "exp": "<b>Rule:</b> the imperfect describes what used to be true in the past (&ldquo;cuando vivíamos&rdquo;). <i>Tener</i> is an -ER verb: drop -er and add <b>-ía, -ías, -ía, -íamos, -íais, -ían</b>. The subject <i>mis abuelos</i> is <b>ellos</b>, so: <i>mis abuelos <b>tenían</b> muchos animales</i>.<br><br><b>Why not the others:</b> <i>tenía</i> is the yo / él form (one person); <i>teníamos</i> is nosotros (&ldquo;we had&rdquo;), but the ones who had the animals are the grandparents; <i>tienen</i> is the present tense (&ldquo;they have now&rdquo;), which does not fit &ldquo;when we lived in the country.&rdquo;<br><br><b>Memory tip:</b> every -ER/-IR imperfect ending has an accented <b>í</b>: tenía, tenían, comíamos.", "tag": "Imperfect", "tagcolor": "#185FA5"}, {"stem": "Cuando estabais en la escuela primaria, vosotros ______ en la biblioteca todas las tardes.<br><br>Choose the correct form.", "opts": ["estudiábais", "estudiabais", "estudiaban", "estudiábamos"], "ci": 1, "exp": "<b>Rule:</b> -AR imperfect endings are <b>-aba, -abas, -aba, -ábamos, -abais, -aban</b>. Only the <b>nosotros</b> form (-ábamos) has a written accent. The subject here is <b>vosotros</b>, so the form is <i><b>estudiabais</b></i> &mdash; with <b>no</b> accent.<br><br><b>Why not the others:</b> <i>estudiábais</i> adds an accent that the vosotros form never has (a common slip on the worksheets); <i>estudiábamos</i> is nosotros (&ldquo;we studied&rdquo;); <i>estudiaban</i> is ellos / ustedes.<br><br><b>Memory tip:</b> &ldquo;Only <b>we</b> wear the hat&rdquo; &mdash; the accent goes only on -<b>á</b>bamos.", "tag": "Imperfect", "tagcolor": "#185FA5"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Es sábado y estoy muy cansado. No quiero ______ temprano.<br><br>Choose the correct form.", "opts": ["levantarte", "levantarse", "me levanto", "levantarme"], "ci": 3, "exp": "<b>Rule:</b> after a conjugated verb like <i>quiero</i>, use the <b>infinitive</b>, and attach the reflexive pronoun that matches the subject. The subject is <b>yo</b> (quiero), so the pronoun is <b>me</b>: <i>No quiero <b>levantarme</b> temprano.</i><br><br><b>Why not the others:</b> <i>levantarse</i> keeps the dictionary pronoun <i>se</i>, which would mean he/she &mdash; it does not match yo; <i>me levanto</i> is a conjugated verb, and two conjugated verbs cannot sit side by side (<i>quiero me levanto</i>); <i>levantarte</i> matches tú, not yo.<br><br><b>Memory tip:</b> &ldquo;I want to get <b>my</b>self up&rdquo; &rarr; quiero levantar<b>me</b>; &ldquo;she wants to get <b>her</b>self up&rdquo; &rarr; quiere levantar<b>se</b>.", "tag": "Reflexive Verbs", "tagcolor": "#f5a623"}, {"stem": "Los domingos mis hermanos y yo ______ muy tarde porque vemos películas hasta la medianoche.<br><br>Choose the correct form.", "opts": ["se duermen", "nos dormimos", "nos dormamos", "nos duermimos"], "ci": 1, "exp": "<b>Rule:</b> <i>dormirse</i> (to fall asleep) is reflexive and stem-changing <b>o &rarr; ue</b> &mdash; but the stem change does <b>not</b> happen in the nosotros and vosotros forms (the &ldquo;boot&rdquo;). The subject <i>mis hermanos y yo</i> = <b>nosotros</b>, so the pronoun is <b>nos</b> and the verb keeps <b>o</b>: <i><b>nos dormimos</b></i>.<br><br><b>Why not the others:</b> <i>nos duermimos</i> puts the ue change inside the nosotros form, which is outside the boot; <i>se duermen</i> is ellos (&ldquo;they fall asleep&rdquo;), but &ldquo;yo&rdquo; is part of the subject; <i>nos dormamos</i> is not a present-tense form (it is the subjunctive, which we have not studied).<br><br><b>Memory tip:</b> boot verbs: me <b>due</b>rmo, te <b>due</b>rmes, se <b>due</b>rme, nos <b>do</b>rmimos, os <b>do</b>rmís, se <b>due</b>rmen.", "tag": "Reflexive Verbs", "tagcolor": "#f5a623"}, {"stem": "Antes de comer, yo siempre me lavo ______ manos.<br><br>Choose the word that best completes the sentence.", "opts": ["mis", "unas", "las", "los"], "ci": 2, "exp": "<b>Rule:</b> with reflexive verbs and body parts, Spanish uses the <b>definite article</b> (el, la, los, las), not a possessive word, because <i>me</i> already shows whose hands they are. <i>Manos</i> is feminine plural, so: <i>me lavo <b>las</b> manos</i>.<br><br><b>Why not the others:</b> <i>mis</i> copies English (&ldquo;my hands&rdquo;), but with <i>me lavo</i> it repeats the owner; <i>unas</i> means &ldquo;some&rdquo; hands, which makes no sense; <i>los</i> is masculine &mdash; <i>mano</i> ends in -o but is a feminine word (<i>la mano</i>).<br><br><b>Memory tip:</b> me cepillo <b>los</b> dientes, me lavo <b>la</b> cara, me seco <b>el</b> pelo &mdash; the pronoun owns it, the article just points to it.", "tag": "Reflexive Verbs", "tagcolor": "#f5a623"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Cuando éramos niños, mis primos y yo ______ al fútbol todos los sábados.<br><br>Choose the correct form.", "opts": ["jugabámos", "jugábamos", "juegábamos", "jugabamos"], "ci": 1, "exp": "<b>Rule:</b> repeated past actions (<i>todos los sábados</i> when we were kids) use the imperfect. Subject <i>mis primos y yo</i> = <b>nosotros</b>.<br><b>-AR imperfect:</b> jugaba, jugabas, jugaba, <b>jugábamos</b>, jugabais, jugaban.<br><br><b>Why not the others:</b> <i>jugabamos</i> is missing the accent &mdash; the nosotros form always has an accent on the <b>á</b> before -bamos; <i>juegábamos</i> uses the u&rarr;ue stem change, but the imperfect has <b>no stem changes</b>; <i>jugabámos</i> puts the accent on the wrong syllable.<br><br><b>Memory tip:</b> only the <b>nosotros</b> form of -AR imperfect gets an accent: <i>-ábamos</i>.", "tag": "Imperfect", "tagcolor": "#185FA5"}, {"stem": "Después de ducharse, Ana usa una toalla para ______ el pelo.<br><br>Choose the word that makes the most sense.", "opts": ["despertarse", "maquillarse", "secarse", "afeitarse"], "ci": 2, "exp": "<b>Meaning:</b> <i>secarse</i> = to dry oneself. A towel (<i>una toalla</i>) is used to dry your hair after a shower: <i>usa una toalla para <b>secarse</b> el pelo</i>.<br><br><b>Why not the others:</b> <i>maquillarse</i> = to put on makeup (you do not use a towel for that, and not on your hair); <i>afeitarse</i> = to shave; <i>despertarse</i> = to wake up &mdash; you cannot wake up your hair.<br><br><b>Memory tip:</b> <i>seco</i> means &ldquo;dry,&rdquo; so <i>secarse</i> = &ldquo;to get yourself dry.&rdquo;", "tag": "Daily Routine Vocabulary", "tagcolor": "#d6336c"}, {"stem": "Cuando yo era niño, ______ dibujos animados todas las mañanas antes de la escuela.<br><br>Choose the correct form.", "opts": ["vi", "veía", "vía", "veo"], "ci": 1, "exp": "<b>Rule:</b> <i>ver</i> is one of the three irregular verbs in the imperfect (ser, ir, ver). It keeps the <b>e</b>: <b>veía, veías, veía, veíamos, veíais, veían</b>. &ldquo;Cuando yo era niño &hellip; todas las mañanas&rdquo; is a past habit, so: <i>yo <b>veía</b> dibujos animados</i>.<br><br><b>Why not the others:</b> <i>vía</i> drops the e as if <i>ver</i> were regular (v- + -ía), which is the mistake the irregular rule warns about; <i>veo</i> is the present (&ldquo;I watch now&rdquo;); <i>vi</i> is the preterite (one completed time), which does not match &ldquo;every morning.&rdquo;<br><br><b>Memory tip:</b> only three imperfect irregulars: <b>era</b> (ser), <b>iba</b> (ir), <b>veía</b> (ver).", "tag": "Imperfect", "tagcolor": "#185FA5"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Tengo un examen muy importante mañana; ______, voy a estudiar toda la tarde.<br><br>Choose the word or phrase that makes the most sense.", "opts": ["por la noche", "sin embargo", "pero", "por lo tanto"], "ci": 3, "exp": "<b>Meaning:</b> <i>por lo tanto</i> = <b>therefore</b>. Having a big test is the <b>reason</b>, and studying all afternoon is the <b>result</b>.<br><br><b>Why not the others:</b> <i>sin embargo</i> (however) and <i>pero</i> (but) signal a contrast, but studying is exactly what you&rsquo;d expect before a test; <i>por la noche</i> (at night) clashes with <i>toda la tarde</i> (all afternoon).<br><br><b>Memory tip:</b> <i>por lo tanto</i> is <b>not</b> &ldquo;for instance&rdquo; &mdash; it means &ldquo;therefore / so.&rdquo;", "tag": "Sequence Words", "tagcolor": "#7b61ff"}, {"stem": "According to the text, what was different about Saturdays for Tomás?", "opts": ["He woke up at five and washed his face with cold water.", "He walked to work with his brother.", "He got up very late because he did not work.", "He played soccer in the square in the morning."], "ci": 2, "exp": "<b>Evidence:</b> &ldquo;Sin embargo, los sábados no trabajaban, y <b>por lo tanto</b> se levantaban muy tarde.&rdquo; &mdash; on Saturdays they did not work, and <b>therefore</b> they got up very late.<br><br><b>Why not the others:</b> walking to work (<i>caminaba al trabajo</i>) is what he did every day, not on Saturdays; soccer was <i>por la tarde</i> (in the afternoon), not the morning, and it was not only on Saturdays; waking at five and washing with cold water is his normal daily routine (&ldquo;todos los días&rdquo;).<br><br><b>Strategy:</b> <i>sin embargo</i> (however) signals a contrast &mdash; look right after it for what is different.", "tag": "Reading", "tagcolor": "#495057", "passage": "<strong>El abuelo Tomás</strong><br>Cuando mi abuelo Tomás era joven, vivía en un pueblo pequeño. Todos los días se despertaba a las cinco de la mañana. Primero, se lavaba la cara con agua fría y se vestía rápidamente. Luego, caminaba al trabajo con su hermano. Por la tarde, los dos jugaban al fútbol en la plaza. Sin embargo, los sábados no trabajaban, y por lo tanto se levantaban muy tarde. Finalmente, por la noche, mi abuelo escribía cartas a su familia."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-13 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
