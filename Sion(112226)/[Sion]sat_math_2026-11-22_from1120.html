<style>

  * { box-sizing: border-box; }

<script>
var TITLE = "[Sion] SAT Math";
var QUIZ_KEY = "sionsatmath_10_from1120";
var INSTRUCTION = "Choose the correct answer for each problem. A calculator (Desmos) is allowed, as on the real SAT.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"stem": "(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)(<i>x</i> &minus; 6) + (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)<i>x</i> = <i>x</i> &minus; 5<br><br>What is the solution to the equation above?", "opts": ["&minus;108", "12", "54", "&minus;12"], "ci": 1, "exp": "<b>What it asks:</b> the value of <i>x</i> that makes both sides equal.<br><br><b>Step 1:</b> Clear the fractions by multiplying every term by 12, the least common denominator of 3 and 4: 12 &middot; (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)(<i>x</i> &minus; 6) + 12 &middot; (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)<i>x</i> = 12<i>x</i> &minus; 60, which gives 8(<i>x</i> &minus; 6) + 3<i>x</i> = 12<i>x</i> &minus; 60.<br><br><b>Step 2:</b> Distribute: 8<i>x</i> &minus; 48 + 3<i>x</i> = 12<i>x</i> &minus; 60, so 11<i>x</i> &minus; 48 = 12<i>x</i> &minus; 60.<br><br><b>Step 3:</b> Move <i>x</i> terms to the right and constants to the left: &minus;48 + 60 = 12<i>x</i> &minus; 11<i>x</i>, so <i>x</i> = 12.<br><br><b>Answer check:</b> Left side: (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)(12 &minus; 6) + (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)(12) = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)(6) + 3 = 4 + 3 = 7. Right side: 12 &minus; 5 = 7. &#10003;<br><br><b>Traps:</b><br>&bull; &minus;12 comes from multiplying only the <i>x</i> by <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> (writing (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)<i>x</i> &minus; 6), so the &minus;6 is never scaled.<br>&bull; 54 comes from writing 8(<i>x</i> &minus; 6) as 8<i>x</i> &minus; 6 (distributing to only the first term).<br>&bull; &minus;108 comes from a sign slip, writing &minus;60 as +60 on the right side.<br><br><b>Desmos:</b> Graph <i>y</i> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>)(<i>x</i> &minus; 6) + (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)<i>x</i> and <i>y</i> = <i>x</i> &minus; 5; they cross at (12, 7).", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "A water tank holds 240 liters. Water drains from the tank at a constant rate, and after 15 minutes the tank holds 165 liters. Which function gives the number of liters, <i>V</i>(<i>t</i>), in the tank <i>t</i> minutes after it starts draining?", "opts": ["<i>V</i>(<i>t</i>) = 240 &minus; 15<i>t</i>", "<i>V</i>(<i>t</i>) = 165 &minus; 5<i>t</i>", "<i>V</i>(<i>t</i>) = 240 &minus; 5<i>t</i>", "<i>V</i>(<i>t</i>) = 240 &minus; 11<i>t</i>"], "ci": 2, "exp": "<b>What it asks:</b> a linear function with the correct starting value and rate.<br><br><b>Step 1:</b> The starting amount (<i>t</i> = 0) is 240 liters, so the constant term is 240.<br><br><b>Step 2:</b> In 15 minutes the tank lost 240 &minus; 165 = 75 liters, so the rate is 75 &divide; 15 = 5 liters per minute.<br><br><b>Step 3:</b> The amount goes down by 5 each minute: <i>V</i>(<i>t</i>) = 240 &minus; 5<i>t</i>.<br><br><b>Answer check:</b> <i>V</i>(15) = 240 &minus; 75 = 165 &#10003; and <i>V</i>(0) = 240 &#10003;.<br><br><b>Traps:</b><br>&bull; 240 &minus; 15<i>t</i> uses the number of minutes (15) as the rate.<br>&bull; 165 &minus; 5<i>t</i> uses the amount at 15 minutes as the starting amount.<br>&bull; 240 &minus; 11<i>t</i> comes from 165 &divide; 15 = 11, dividing the remaining amount instead of the amount lost.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "A school play sold 150 tickets for a total of $1,405. Adult tickets cost $12 each, and student tickets cost $7 each. How many adult tickets were sold?", "opts": ["71", "79", "117", "74"], "ci": 0, "exp": "<b>What it asks:</b> the number of adult tickets.<br><br><b>Step 1:</b> Let <i>a</i> = adult tickets and <i>s</i> = student tickets. Then <i>a</i> + <i>s</i> = 150 and 12<i>a</i> + 7<i>s</i> = 1,405.<br><br><b>Step 2:</b> Substitute <i>s</i> = 150 &minus; a: 12<i>a</i> + 7(150 &minus; a) = 1,405, so 12<i>a</i> + 1,050 &minus; 7<i>a</i> = 1,405.<br><br><b>Step 3:</b> Then 5<i>a</i> = 355, so <i>a</i> = 71 (and <i>s</i> = 79).<br><br><b>Answer check:</b> 71 + 79 = 150 &#10003;; 12(71) + 7(79) = 852 + 553 = 1,405 &#10003;.<br><br><b>Traps:</b><br>&bull; 79 is the number of <i>student</i> tickets (or what you get if the prices are swapped).<br>&bull; 74 comes from 1,405 &divide; (12 + 7) &asymp; 73.9, which treats every ticket as one adult plus one student.<br>&bull; 117 comes from 1,405 &divide; 12, as if every ticket were an adult ticket.<br><br><b>Desmos:</b> Graph <i>x</i> + <i>y</i> = 150 and 12<i>x</i> + 7<i>y</i> = 1405; the intersection is (71, 79).", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "Which expression is equivalent to (2<i>x</i> + 3)<sup>2</sup> &minus; (<i>x</i> &minus; 1)<sup>2</sup>?", "opts": ["3<i>x</i><sup>2</sup> + 10<i>x</i> + 10", "3<i>x</i><sup>2</sup> + 14<i>x</i> + 8", "3<i>x</i><sup>2</sup> + 2<i>x</i> + 8", "3<i>x</i><sup>2</sup> + 14<i>x</i> + 10"], "ci": 1, "exp": "<b>What it asks:</b> an expanded form of the difference of two squares of binomials.<br><br><b>Step 1:</b> Expand: (2<i>x</i> + 3)<sup>2</sup> = 4<i>x</i><sup>2</sup> + 12<i>x</i> + 9 and (<i>x</i> &minus; 1)<sup>2</sup> = <i>x</i><sup>2</sup> &minus; 2<i>x</i> + 1.<br><br><b>Step 2:</b> Subtract the <b>whole</b> second expression: 4<i>x</i><sup>2</sup> + 12<i>x</i> + 9 &minus; <i>x</i><sup>2</sup> + 2<i>x</i> &minus; 1.<br><br><b>Step 3:</b> Combine like terms: 3<i>x</i><sup>2</sup> + 14<i>x</i> + 8.<br><br><b>Answer check:</b> Other method: it is a difference of squares, <i>A</i><sup>2</sup> &minus; <i>B</i><sup>2</sup> = (<i>A</i> &minus; B)(<i>A</i> + B) = (<i>x</i> + 4)(3<i>x</i> + 2) = 3<i>x</i><sup>2</sup> + 14<i>x</i> + 8 &#10003;. Test <i>x</i> = 1: 25 &minus; 0 = 25 and 3 + 14 + 8 = 25 &#10003;.<br><br><b>Traps:</b><br>&bull; 3<i>x</i><sup>2</sup> + 10<i>x</i> + 10 subtracts <i>x</i><sup>2</sup> but adds 2<i>x</i> and 1 with the wrong signs (the minus sign was not distributed to &minus;2<i>x</i> and +1).<br>&bull; 3<i>x</i><sup>2</sup> + 14<i>x</i> + 10 distributes the minus to &minus;2<i>x</i> but not to +1.<br>&bull; 3<i>x</i><sup>2</sup> + 2<i>x</i> + 8 squares 2<i>x</i> + 3 as 4<i>x</i><sup>2</sup> + 9, forgetting the middle term 12<i>x</i>.<br><br><b>Desmos:</b> Graph both the original and a choice; the correct one overlaps exactly.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = 2<i>x</i><sup>2</sup> &minus; 12<i>x</i> + <i>c</i>, where <i>c</i> is a constant. If the minimum value of <i>f</i> is 5, what is the value of <i>c</i>?", "opts": ["41", "23", "5", "&minus;13"], "ci": 1, "exp": "<b>What it asks:</b> the constant that makes the lowest output equal 5.<br><br><b>Step 1:</b> For <i>f</i>(<i>x</i>) = <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i> with a &gt; 0, the minimum is at the vertex, <i>x</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>b</i></span><span style=\"border-top:1.4px solid #111;\">2<i>a</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = 3.<br><br><b>Step 2:</b> The minimum value is <i>f</i>(3) = 2(9) &minus; 12(3) + <i>c</i> = 18 &minus; 36 + <i>c</i> = <i>c</i> &minus; 18.<br><br><b>Step 3:</b> Set <i>c</i> &minus; 18 = 5, so <i>c</i> = 23.<br><br><b>Answer check:</b> <i>f</i>(<i>x</i>) = 2<i>x</i><sup>2</sup> &minus; 12<i>x</i> + 23 = 2(<i>x</i> &minus; 3)<sup>2</sup> + 5, whose minimum is clearly 5 &#10003;.<br><br><b>Traps:</b><br>&bull; 5 confuses the minimum value with the constant <i>c</i> (true only if the vertex were at <i>x</i> = 0).<br>&bull; &minus;13 comes from <i>c</i> = 5 &minus; 18, solving <i>c</i> &minus; 18 = 5 with the wrong sign.<br>&bull; 41 comes from <i>c</i> = 5 + 36, forgetting the 2(9) = 18 term.<br><br><b>Desmos:</b> Type <i>f</i>(<i>x</i>) = 2<i>x</i><sup>2</sup> &minus; 12<i>x</i> + <i>c</i> with a slider for <i>c</i> and drag until the vertex is at <i>y</i> = 5.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "<i>y</i> = <i>x</i><sup>2</sup> + <i>bx</i> + 10<br><i>y</i> = 3<i>x</i> + 1<br><br>In the system of equations above, <i>b</i> is a positive constant. If the system has exactly one real solution (<i>x</i>, y), what is the value of <i>x</i>?", "opts": ["&minus;3", "&minus;6", "3", "9"], "ci": 0, "exp": "<b>What it asks:</b> the <i>x</i>-coordinate of the single intersection point.<br><br><b>Step 1:</b> Set the expressions equal: <i>x</i><sup>2</sup> + <i>bx</i> + 10 = 3<i>x</i> + 1, so <i>x</i><sup>2</sup> + (<i>b</i> &minus; 3)<i>x</i> + 9 = 0.<br><br><b>Step 2:</b> Exactly one solution means the discriminant is 0: (<i>b</i> &minus; 3)<sup>2</sup> &minus; 4(1)(9) = 0, so (<i>b</i> &minus; 3)<sup>2</sup> = 36 and <i>b</i> &minus; 3 = 6 or &minus;6, giving <i>b</i> = 9 or <i>b</i> = &minus;3.<br><br><b>Step 3:</b> <i>b</i> is positive, so <i>b</i> = 9. The equation becomes <i>x</i><sup>2</sup> + 6<i>x</i> + 9 = 0, that is, (<i>x</i> + 3)<sup>2</sup> = 0, so <i>x</i> = &minus;3.<br><br><b>Answer check:</b> With <i>b</i> = 9: at <i>x</i> = &minus;3, the parabola gives 9 &minus; 27 + 10 = &minus;8 and the line gives &minus;9 + 1 = &minus;8 &#10003;; the double root confirms one point (the line is tangent).<br><br><b>Traps:</b><br>&bull; 3 is the <i>x</i>-value for <i>b</i> = &minus;3, the root the problem rules out (<i>b</i> must be positive).<br>&bull; 9 is the value of <i>b</i>, not of <i>x</i>.<br>&bull; &minus;6 is the coefficient <i>b</i> &minus; 3 with a sign flip, taken as the answer instead of solving (<i>x</i> + 3)<sup>2</sup> = 0.<br><br><b>Desmos:</b> Graph <i>y</i> = <i>x</i><sup>2</sup> + <i>bx</i> + 10 with a slider for <i>b</i> and <i>y</i> = 3<i>x</i> + 1; at <i>b</i> = 9 the line just touches the parabola at (&minus;3, &minus;8).", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "The price of a jacket was increased by 20%. Later, the new price was decreased by 25%, and the jacket then sold for $81.00. What was the original price of the jacket?", "opts": ["$85.26", "$101.25", "$90.00", "$97.20"], "ci": 2, "exp": "<b>What it asks:</b> the price before both changes.<br><br><b>Step 1:</b> A 20% increase multiplies the price by 1.20; a 25% decrease multiplies by 0.75.<br><br><b>Step 2:</b> So the final price is <i>p</i> &times; 1.20 &times; 0.75 = 0.90<i>p</i>.<br><br><b>Step 3:</b> 0.90<i>p</i> = 81, so <i>p</i> = 81 &divide; 0.90 = 90.<br><br><b>Answer check:</b> 90 &times; 1.2 = 108, and 108 &times; 0.75 = 81 &#10003;.<br><br><b>Traps:</b><br>&bull; $85.26 treats the changes as a net 5% decrease (20% &minus; 25%) and computes 81 &divide; 0.95; percents of different bases cannot be added.<br>&bull; $97.20 multiplies 81 by 1.2, undoing only the increase in the wrong direction.<br>&bull; $101.25 divides 81 by 0.80, undoing a 20% decrease instead of the actual changes.<br><br><b>Desmos:</b> Solve <i>p</i>&middot;1.2&middot;0.75 = 81 by graphing <i>y</i> = 0.9<i>x</i> and <i>y</i> = 81.", "tag": "Problem-Solving and Data Analysis", "tagcolor": "#1D9E75"}, {"stem": "<i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> &minus; 6<i>x</i> + 8<i>y</i> = 11<br><br>The equation above defines a circle in the xy-plane. What is the area of the circle?", "opts": ["12&pi;", "36&pi;", "6&pi;", "11&pi;"], "ci": 1, "exp": "<b>What it asks:</b> the area, which needs the radius.<br><br><b>Step 1:</b> Group and complete the square: (<i>x</i><sup>2</sup> &minus; 6<i>x</i> + 9) + (<i>y</i><sup>2</sup> + 8<i>y</i> + 16) = 11 + 9 + 16.<br><br><b>Step 2:</b> So (<i>x</i> &minus; 3)<sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = 36: center (3, &minus;4), radius <i>r</i> = 6.<br><br><b>Step 3:</b> Area = &pi;<i>r</i><sup>2</sup> = 36&pi;.<br><br><b>Answer check:</b> Expanding (<i>x</i> &minus; 3)<sup>2</sup> + (<i>y</i> + 4)<sup>2</sup> = 36 gives <i>x</i><sup>2</sup> &minus; 6<i>x</i> + 9 + <i>y</i><sup>2</sup> + 8<i>y</i> + 16 = 36, <i>i</i>.<i>e</i>. <i>x</i><sup>2</sup> + <i>y</i><sup>2</sup> &minus; 6<i>x</i> + 8<i>y</i> = 11 &#10003;.<br><br><b>Traps:</b><br>&bull; 12&pi; is the circumference 2&pi;<i>r</i>, not the area.<br>&bull; 11& var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ if(window.SAT_TIMEUP && SAT_TIMEUP() && !(activeSet && activeSet.length)){ wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, "(time's up)")); } else skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* sat-timer 2026-11-06 */
(function(){
  var PER_Q = 80;
  var LIMIT = PER_Q * RAW_QUESTIONS.length;
  var TK = STORAGE_KEY + '_timer';
  function blank(){ return {el:0, per:{}, up:false}; }
  function load(){ try{ return JSON.parse(localStorage.getItem(TK)) || blank(); }catch(e){ return blank(); } }
  var T = load(), paused = false, last = Date.now();
  function save(){ try{ localStorage.setItem(TK, JSON.stringify(T)); }catch(e){} }
  function retrying(){ return !!(activeSet && activeSet.length); }
  window.SAT_TIMEUP = function(){ return !!T.up; };
  var bar = document.createElement('div'); bar.className = 'sat-timer'; bar.id = 'sat-timer';
  bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function curAnswered(){ if(window.EXAM_ACTIVE && EXAM_ACTIVE()) return false; var q = activeOrder()[state.cur]; return q !== undefined && state.answers[q] !== undefined; } /* sat-timer-pause-on-answer 2026-11-14 */
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && !curAnswered() && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
