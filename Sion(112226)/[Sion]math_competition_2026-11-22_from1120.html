<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10_from1120";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"stem": "Of 101 coins, 50 are counterfeit, and differ from the genuine coins in weight by 1 gram. Dmitri has a balance scale which shows the difference in weights between the objects placed in each pan. He chooses one coin, and wants to find out in one weighing whether it is counterfeit or not. Can he do this? (Russia)", "opts": ["he cannot", "he can"], "ci": 1, "exp": "<b>What we need:</b> a single weighing whose result tells Dmitri whether his chosen coin is genuine or counterfeit. The scale shows the <i>difference</i> in weight between the two pans, so we should look for a property of that number that changes depending on the chosen coin.<br><br><b>Step 1 &mdash; Set aside the chosen coin and weigh all the others.</b> Put the remaining 100 coins on the scale, 50 in each pan.<br><br><b>Step 2 &mdash; Count the counterfeits on the scale.</b> If the chosen coin is genuine, all 50 counterfeits are among the 100 coins on the scale. If the chosen coin is counterfeit, only 49 counterfeits are on the scale.<br><br><b>Step 3 &mdash; Look at the parity (odd/even) of the reading.</b> Every genuine coin weighs the same, so genuine coins cancel out pan by pan. Each counterfeit changes the difference by exactly 1 gram. Suppose <i>k</i> counterfeits are in the left pan and <i>m</i> in the right pan. Then the reading is |<i>k</i> &minus; <i>m</i>| grams. Since <i>k</i> &minus; <i>m</i> and <i>k</i> + <i>m</i> always have the same parity, the reading is even exactly when the total number of counterfeits on the scale, <i>k</i> + <i>m</i>, is even.<br>&bull; Chosen coin genuine: <i>k</i> + <i>m</i> = 50 (even), so the reading is an even number of grams.<br>&bull; Chosen coin counterfeit: <i>k</i> + <i>m</i> = 49 (odd), so the reading is an odd number of grams.<br><br><b>Step 4 &mdash; Conclude.</b> Dmitri reads the scale: even &rarr; his coin is genuine; odd &rarr; his coin is counterfeit. So <b>he can</b> do it in one weighing.<br><br><b>Answer check:</b> try a small example. Genuine chosen coin, with 30 counterfeits on the left and 20 on the right: reading 10 (even). Counterfeit chosen coin, with 30 on the left and 19 on the right: reading 11 (odd). The argument does not even need to know whether counterfeits are lighter or heavier, because each one shifts the difference by exactly 1 gram either way.<br><br><b>Trap:</b> it is tempting to say &ldquo;he cannot,&rdquo; because one weighing cannot tell <i>which</i> coins are counterfeit. But the question asks only about the chosen coin, and the parity of the reading answers that.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "Find all real roots of <i>x</i><sup>4</sup> + (2 &minus; <i>x</i>)<sup>4</sup> = 34. (HMMT)", "opts": ["1 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>", "1 &plusmn; 2", "2 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>", "<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>"], "ci": 0, "exp": "<b>What we need</b><br>All real <i>x</i> with <i>x</i><sup>4</sup> + (2 &minus; <i>x</i>)<sup>4</sup> = 34.<br><br><b>Step 1: Use the symmetry.</b> The two bases <i>x</i> and 2 &minus; <i>x</i> add to 2, so their average is 1. Center everything at 1: let <i>u</i> = <i>x</i> &minus; 1. Then <i>x</i> = 1 + <i>u</i> and 2 &minus; <i>x</i> = 1 &minus; <i>u</i>. The equation becomes (1 + <i>u</i>)<sup>4</sup> + (1 &minus; <i>u</i>)<sup>4</sup> = 34.<br><br><b>Step 2: Expand.</b> (1 + <i>u</i>)<sup>4</sup> = 1 + 4<i>u</i> + 6<i>u</i><sup>2</sup> + 4<i>u</i><sup>3</sup> + <i>u</i><sup>4</sup> and (1 &minus; <i>u</i>)<sup>4</sup> = 1 &minus; 4<i>u</i> + 6<i>u</i><sup>2</sup> &minus; 4<i>u</i><sup>3</sup> + <i>u</i><sup>4</sup>. Adding, the odd powers cancel: 2 + 12<i>u</i><sup>2</sup> + 2<i>u</i><sup>4</sup> = 34.<br><br><b>Step 3: Solve the quadratic in <i>u</i><sup>2</sup>.</b> Divide by 2: <i>u</i><sup>4</sup> + 6<i>u</i><sup>2</sup> + 1 = 17, so <i>u</i><sup>4</sup> + 6<i>u</i><sup>2</sup> &minus; 16 = 0. Let <i>v</i> = <i>u</i><sup>2</sup>: <i>v</i><sup>2</sup> + 6<i>v</i> &minus; 16 = 0, which factors as (<i>v</i> + 8)(<i>v</i> &minus; 2) = 0. So <i>v</i> = 2 or <i>v</i> = &minus;8. Since <i>v</i> = <i>u</i><sup>2</sup> &ge; 0 for real <i>u</i>, only <i>v</i> = 2 works.<br><br><b>Step 4: Go back to <i>x</i>.</b> <i>u</i><sup>2</sup> = 2 gives <i>u</i> = &plusmn;<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>, so <i>x</i> = 1 + <i>u</i> = 1 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>.<br><br><b>Answer check</b><br>For <i>x</i> = 1 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>: (1 + <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>)<sup>4</sup> + (1 &minus; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>)<sup>4</sup> = 2(1 + 6&middot;2 + 4) = 2 &times; 17 = 34 &#10003; (using 2 + 12<i>u</i><sup>2</sup> + 2<i>u</i><sup>4</sup> with <i>u</i><sup>2</sup> = 2). Numerically, 2.414<sup>4</sup> + 0.414<sup>4</sup> &asymp; 33.97 + 0.03 = 34.<br><br><b>Trap</b><br>&ldquo;1 &plusmn; 2&rdquo; comes from taking <i>u</i><sup>2</sup> = 4 or forgetting the square root; &ldquo;2 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>&rdquo; centers at 2 instead of 1 (forgetting <i>u</i> = <i>x</i> &minus; 1); &ldquo;<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">2</span></span>&rdquo; alone gives <i>u</i> instead of <i>x</i>. The root <i>v</i> = &minus;8 would give non-real <i>x</i>, so it is thrown out.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Let <i>f</i> be a function such that for <i>x</i> &isin; {&minus;1, 0, 1}, <i>f</i>(<i>x</i><sup>2</sup>) = 2(<i>f</i>(<i>x</i>))<sup>2</sup> &minus; 1. Compute all possible values of <i>f</i>(&minus;1). (ARML)", "opts": ["&plusmn;1 only", "&plusmn;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> only", "&plusmn;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, &plusmn;1", "0, &plusmn;1"], "ci": 2, "exp": "<b>What we need</b><br>The rule <i>f</i>(<i>x</i><sup>2</sup>) = 2(<i>f</i>(<i>x</i>))<sup>2</sup> &minus; 1 is only promised for <i>x</i> = &minus;1, 0, 1. We must list <b>every</b> value <i>f</i>(&minus;1) could have.<br><br><b>Step 1: Name the unknowns.</b> Let <i>a</i> = <i>f</i>(1) and <i>b</i> = <i>f</i>(&minus;1). (The value <i>f</i>(0) only appears in the <i>x</i> = 0 equation, so it never affects <i>b</i>.)<br><br><b>Step 2: Use <i>x</i> = 1.</b> Since 1<sup>2</sup> = 1, the rule says <i>f</i>(1) = 2(<i>f</i>(1))<sup>2</sup> &minus; 1, that is, <i>a</i> = 2<i>a</i><sup>2</sup> &minus; 1. Rearranging: 2<i>a</i><sup>2</sup> &minus; <i>a</i> &minus; 1 = 0, which factors as (2<i>a</i> + 1)(<i>a</i> &minus; 1) = 0. So <i>a</i> = 1 or <i>a</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>.<br><br><b>Step 3: Use <i>x</i> = &minus;1.</b> Since (&minus;1)<sup>2</sup> = 1, the rule says <i>f</i>(1) = 2(<i>f</i>(&minus;1))<sup>2</sup> &minus; 1, that is, <i>a</i> = 2<i>b</i><sup>2</sup> &minus; 1. Notice the left side is <i>f</i>(1) = <i>a</i>, <b>not</b> <i>b</i> &mdash; this is the key point. Solving for <i>b</i><sup>2</sup>: <i>b</i><sup>2</sup> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>a</i> + 1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>.<br><br><b>Step 4: Go through both cases.</b><br>&bull; If <i>a</i> = 1: <i>b</i><sup>2</sup> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 + 1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 1, so <i>b</i> = 1 or <i>b</i> = &minus;1.<br>&bull; If <i>a</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>: <i>b</i><sup>2</sup> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> + 1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>, so <i>b</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> or <i>b</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>.<br><br><b>Step 5: Every case really happens.</b> For each pair, pick <i>f</i>(0) = 1 (it works, since 1 = 2&middot;1<sup>2</sup> &minus; 1). Then all three equations hold, so none of the four values is fake.<br><br><b>Answer check</b><br><i>b</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>: then <i>a</i> = 2&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; 1 = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, and <i>a</i> = 2<i>a</i><sup>2</sup> &minus; 1 gives 2&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; 1 = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> &#10003;. <i>b</i> = &minus;1: then <i>a</i> = 2&middot;1 &minus; 1 = 1, and 1 = 2&middot;1 &minus; 1 &#10003;. So <i>f</i>(&minus;1) = &plusmn;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> or &plusmn;1.<br><br><b>Trap</b><br>Writing the <i>x</i> = &minus;1 equation as <i>b</i> = 2<i>b</i><sup>2</sup> &minus; 1 (putting <i>f</i>(&minus;1) on the left) gives only <i>b</i> = 1 or &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, and misses half the answers. The left side is <i>f</i>(<i>x</i><sup>2</sup>) = <i>f</i>(1). Choosing &ldquo;&plusmn;1 only&rdquo; forgets the case <i>a</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Alice, Betty, and Carol took the same series of exams. For each exam there was one score of <i>x</i>, one score of <i>y</i>, and one score of <i>z</i>, where <i>x</i>, <i>y</i>, and <i>z</i> are distinct positive integers. The total of the scores obtained by each of the girls was: Alice 20, Betty 10, and Carol 9. If Betty placed first in the algebra exam, who placed second in the geometry exam?", "opts": ["Carol", "Cannot be determined", "Betty", "Alice"], "ci": 0, "exp": "<b>What we need</b><br>In every exam the three girls get the three scores <i>x</i>, <i>y</i>, <i>z</i> (one each), with <i>x</i> &gt; <i>y</i> &gt; <i>z</i> &ge; 1 integers. Totals: Alice 20, Betty 10, Carol 9. Betty was first in algebra. Who was second (got <i>y</i>) in geometry?<br><br><b>Step 1: Count the exams.</b> Each exam hands out <i>x</i> + <i>y</i> + <i>z</i> points in total. If there are <i>n</i> exams, then <i>n</i>(<i>x</i> + <i>y</i> + <i>z</i>) = 20 + 10 + 9 = 39. Since 39 = 3 &times; 13, and there are at least 2 exams (algebra and geometry), and <i>x</i> + <i>y</i> + <i>z</i> &ge; 3 + 2 + 1 = 6, the only choice is <i>n</i> = 3 exams with <i>x</i> + <i>y</i> + <i>z</i> = 13.<br><br><b>Step 2: Bound <i>x</i>.</b> Alice scored 20 in 3 exams, so 3<i>x</i> &ge; 20, giving <i>x</i> &ge; 7. Betty got <i>x</i> in algebra and at least <i>z</i> &ge; 1 in each other exam, so <i>x</i> + 2<i>z</i> &le; 10, giving <i>x</i> &le; 8.<br><br><b>Step 3: Test <i>x</i> = 7.</b> Then <i>y</i> + <i>z</i> = 6, and Alice needs 20 from three scores that are each at most 7, but she cannot get 7 in algebra (Betty did), so her best is 6 + 7 + 7 = 20 only if <i>y</i> = 6 and <i>z</i> = 0 &mdash; impossible since <i>z</i> &ge; 1. So <i>x</i> &ne; 7.<br><br><b>Step 4: Use <i>x</i> = 8.</b> Then <i>y</i> + <i>z</i> = 5. Betty: 8 + (two scores) = 10, so her other two scores add to 2, which forces <i>z</i> = 1 twice. So <i>y</i> = 4. Alice: in algebra she did not get 8, so she got at most 4 there; to reach 20 she needs 4 + 8 + 8 = 20 &mdash; so Alice got <i>y</i> = 4 in algebra and <i>x</i> = 8 in both other exams. Carol gets what is left: 1 in algebra, and 4 in each of the other two exams (check: 1 + 4 + 4 = 9 &#10003;).<br><br><b>Step 5: Read off geometry.</b> Geometry is one of the two non-algebra exams. In both of them Alice got 8 (first), Carol got 4 (second), Betty got 1 (third). So <b>Carol</b> placed second in geometry.<br><br><b>Answer check</b><br>Totals: Alice 4 + 8 + 8 = 20, Betty 8 + 1 + 1 = 10, Carol 1 + 4 + 4 = 9, and 8 + 4 + 1 = 13 &#10003;. A computer search over all exam counts and score assignments finds this as the only solution.<br><br><b>Trap</b><br>&ldquo;Cannot be determined&rdquo; is tempting because we never learn which exam is geometry &mdash; but the two non-algebra exams have the same result, so it does not matter. Picking Alice confuses &ldquo;second&rdquo; with the girl who has the second-largest total.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Compute the unique positive integer <i>n</i> such that<br><br>2&middot;2<sup>2</sup> + 3&middot;2<sup>3</sup> + 4&middot;2<sup>4</sup> + &hellip; + <i>n</i>&middot;2<sup><i>n</i></sup> = 2<sup><i>n</i>+10</sup>.", "opts": ["514", "512", "511", "513"], "ci": 3, "exp": "<b>What we need:</b> the positive integer <i>n</i> with 2·2<sup>2</sup> + 3·2<sup>3</sup> + … + <i>n</i>·2<sup><i>n</i></sup> = 2<sup><i>n</i>+10</sup>.<br><br><b>Step 1 — A formula for the full sum.</b> Let <i>S</i> = 1·2 + 2·2<sup>2</sup> + 3·2<sup>3</sup> + … + <i>n</i>·2<sup><i>n</i></sup>. Double it: 2<i>S</i> = 1·2<sup>2</sup> + 2·2<sup>3</sup> + … + (<i>n</i> &minus; 1)·2<sup><i>n</i></sup> + <i>n</i>·2<sup><i>n</i>+1</sup>. Subtract <i>S</i> from 2<i>S</i>: the matching powers of 2 leave one copy each, so<br>2<i>S</i> &minus; <i>S</i> = <i>n</i>·2<sup><i>n</i>+1</sup> &minus; (2 + 2<sup>2</sup> + 2<sup>3</sup> + … + 2<sup><i>n</i></sup>).<br><br><b>Step 2 — Add the powers of 2.</b> 2 + 2<sup>2</sup> + … + 2<sup><i>n</i></sup> = 2<sup><i>n</i>+1</sup> &minus; 2. So <i>S</i> = <i>n</i>·2<sup><i>n</i>+1</sup> &minus; 2<sup><i>n</i>+1</sup> + 2 = (<i>n</i> &minus; 1)·2<sup><i>n</i>+1</sup> + 2.<br>Quick test: <i>n</i> = 3 gives 2 + 8 + 24 = 34, and (3 &minus; 1)·2<sup>4</sup> + 2 = 32 + 2 = 34 ✓.<br><br><b>Step 3 — Our sum starts at 2·2<sup>2</sup>, not 1·2.</b> Remove the first term 1·2 = 2: 2·2<sup>2</sup> + … + <i>n</i>·2<sup><i>n</i></sup> = (<i>n</i> &minus; 1)·2<sup><i>n</i>+1</sup>.<br><br><b>Step 4 — Solve.</b> (<i>n</i> &minus; 1)·2<sup><i>n</i>+1</sup> = 2<sup><i>n</i>+10</sup>. Divide both sides by 2<sup><i>n</i>+1</sup>: <i>n</i> &minus; 1 = 2<sup>9</sup> = 512, so <i>n</i> = <b>513</b>.<br><br><b>Answer check:</b> a computer adds 2·2<sup>2</sup> + … + 513·2<sup>513</sup> and gets exactly 2<sup>523</sup> ✓ (and 512 or 514 do not work). <b>Trap:</b> stopping at <i>n</i> &minus; 1 = 512 and choosing 512.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
