<style>

  * { box-sizing: border-box; }

  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }

<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_24";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20261008";
var RAW_QUESTIONS = [{"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["It is the teachers who decides which books are used in the classroom.", "It is the teachers who decide which books are used in the classroom.", "It is the boys on the team who decides the order of the batting lineup.", "It is the students who chooses the topic for the science fair project."], "ci": 1, "exp": "\"Who\" refers to \"teachers\" (plural), so \"decide\" is correct. \"Decides\" is singular — wrong for plural teachers. In 'the students who chooses,' \"students\" is plural — use \"choose.\" In 'the boys who decides,' \"boys\" is plural — use \"decide.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "easy<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["more easy / most easy", "easir / easist", "easier / easiest", "easyer / easyest"], "ci": 2, "exp": "easy → easier / easiest (consonant + y: change -y to -i, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "He is <u>drag</u> the heavy box across the floor.", "opts": ["dragging", "dragng", "dragged", "draging"], "ci": 0, "exp": "drag → dragging (short vowel + single consonant: double the -g, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["\"Stop right there!\" the officer Commanded.", "\"Stop right there!\" the officer commanded.", "\"Stop right there\"! the officer commanded.", "\"Stop right there!\" The officer commanded."], "ci": 1, "exp": "The exclamation mark goes inside the closing quotation mark. After a complete exclamatory direct quote, the dialogue tag (\"the officer commanded\") begins with a lowercase letter. The dialogue tag is not a new sentence.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>mean</b>?", "opts": ["meand", "meaned", "meant", "meanted"], "ci": 2, "exp": "The past tense of <b>mean</b> is <b>meant</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The baby's first word surprised everyone.", "The championship belt was her's to defend.", "Marks score was the highest in the class.", "The players left there equipment on the field."], "ci": 0, "exp": "<strong>\"baby's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>there</em> should be <em>their</em> (possessive adjective).<br>• <em>her's</em> does not exist; the correct form is <em>hers</em>.<br>• <em>Marks</em> is missing the apostrophe — should be <em>Mark's</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>choose</b> &rsaquo; Past: <b>chose</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["chose", "choosed", "chosen", "choosing"], "ci": 2, "exp": "'choose' is an irregular verb. Its past participle is 'chosen'. Past perfect: had chosen.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["blue enormous empty ocean", "empty enormous blue ocean", "enormous empty blue ocean", "enormous blue empty ocean"], "ci": 2, "exp": "Correct order: size (enormous) → condition (empty) → color (blue) → noun\n✔ enormous empty blue ocean", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "She lent me her bike.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["her bike", "me"], "ci": 1, "exp": "\"Me\" is the indirect object (who borrowed it). \"Her bike\" is the direct object (what was lent).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "We <span style=\"text-decoration:underline;\">______</span> the car thoroughly before the muddy rain started.", "opts": ["have washed", "had washed", "washed", "will have washed"], "ci": 1, "exp": "\"had washed\" is past perfect — washing was done before the rain started.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "The documentary about ocean pollution left many viewers deeply troubled and uncertain about the future.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["many viewers", "deeply troubled and uncertain about the future"], "ci": 0, "exp": "\"Many viewers\" is the object (who was left). \"Deeply troubled and uncertain about the future\" is the objective complement (their emotional state).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The smoke detector was <b>beeping</b> all night.", "The alarm is <b>beeping</b> loudly.", "<b>Beeping</b> constantly is what smoke detectors do when the battery is low.", "The <b>beeping</b> alarm woke up the whole house."], "ci": 3, "exp": "In \"The beeping alarm woke up the whole house,\" \"beeping\" comes directly before the noun \"alarm\" and describes what the alarm is doing - this adjective use of an -ing word is a present participle. In \"The alarm is beeping loudly\" and \"The smoke detector was beeping all night,\" \"beeping\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Beeping constantly is what smoke detectors do when the battery is low,\" \"beeping\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "He always <u>hurry</u> to catch the bus.", "opts": ["hurres", "hurryes", "hurrys", "hurries"], "ci": 3, "exp": "hurry → hurries (consonant + y: drop -y, add -ies)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Inside the old cardboard box in the attic.", "Perched on a branch high in the oak tree.", "If the roads are clear by morning.", "The firefighters rescued the family from the burning building."], "ci": 3, "exp": "\"The firefighters rescued the family from the burning building.\" is a complete sentence — subject: 'The firefighters', predicate: 'rescued'. The others are fragments: an 'If' clause, a participial phrase, and a prepositional phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "The coach asked the players to run three laps _____ the entire track before warming up further.", "opts": ["over", "across", "around", "along"], "ci": 2, "exp": "\"Around\" means moving in a circular or looping path enclosing the track. Running laps means going around the track repeatedly. \"Along\" would mean running in a straight line beside the track.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">The boy had scarcely started eating when the bell rang.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Scarcely had the boy started eating that the bell rang.", "Scarcely did the boy start eating when the bell rang.", "Scarcely the boy had started eating when the bell rang.", "Scarcely had the boy started eating when the bell rang."], "ci": 3, "exp": "\"Scarcely\" triggers inversion with past perfect: \"Scarcely + had + the boy + started...\". The conjunction is \"when\" (not \"that\"). The correct form is: Scarcely had the boy started eating when the bell rang.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "Before the invention of smartphones, people relied on printed maps and phone books to find information.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["printed maps", "smartphones", "people", "information"], "ci": 2, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "She is a <u>nurse</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Nurse\" follows the linking verb \"is\" and renames the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "The remarkably talented young musician performed flawlessly before a completely silent, awestruck audience.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the NOUNS in this sentence, and only the nouns?</span>", "opts": ["audience", "musician", "musician, audience", "musician, audience, silent"], "ci": 2, "exp": "'Musician' and 'audience' are the nouns.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>Doctors <b>treat</b> the patients.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The patients ______ by doctors.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["are treating", "are treated", "is treated", "are treat"], "ci": 1, "exp": "The new subject \"the patients\" is plural and the action is in the present, so use are + the past participle \"treated\": are treated.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "I ________ coffee every morning when I worked there.", "opts": ["drank", "have drunk"], "ci": 0, "exp": "When I worked there is a finished period in the past, so use simple past: drank.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>dwarf</b>?", "opts": ["dwarves", "dwarfes", "dwarvs", "dwarfs"], "ci": 0, "exp": "dwarf → dwarves (-f changes to -ves)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["She enjoys <b>performing</b> in front of large crowds.", "He will be <b>performing</b> at the talent show.", "The band is <b>performing</b> on stage tonight.", "They were <b>performing</b> when the power went out."], "ci": 0, "exp": "In \"She enjoys performing in front of large crowds,\" \"performing\" is the object of the verb \"enjoys\" - a noun role - which makes it a gerund. In the other three sentences, \"performing\" follows \"is / were / will be\" and is part of the progressive verb tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "They _____ decided to cancel the meeting.", "opts": ["had", "have"], "ci": 1, "exp": "\"Have\" is correct. The decision is recent and affects what happens now.", "tag": "Have vs Had", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
