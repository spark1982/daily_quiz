var TITLE = "[Grant] Grammar";

var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct. This week's review — questions you missed recently.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"passage": "<strong>Fall Garden Cleanup Day</strong><br><b>(1)</b> Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7. <b>(2)</b> Students and parents <u>should</u> bring gloves and a rake if they have them. <b>(3)</b> Each of the volunteers is going to get a free pumpkin muffin. <b>(4)</b> The tools for the job is waiting in the shed behind the gym. <b>(5)</b> We will pull weeds. <b>(6)</b> The weeds grow along the fence. <b>(7)</b> The garden will look <u>beautifuller</u> than ever by lunchtime!", "stem": "Which sentence has an error?", "opts": ["Students and parents should bring gloves and a rake if they have them.", "Ravenwood Elementary is holding a Fall Garden Cleanup Day on Saturday, November 7.", "Each of the volunteers is going to get a free pumpkin muffin.", "The tools for the job is waiting in the shed behind the gym."], "ci": 3, "exp": "The subject is <i>tools</i> (plural), not <i>job</i>, so use <i>are</i>: <i>The tools for the job <b>are</b> waiting in the shed behind the gym.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"passage": "<strong>Library LEGO Challenge</strong><br><b>(1)</b> Calling all builders in grades 3 to 5 who love to create! <b>(2)</b> The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7. <b>(3)</b> To get ideas, read the book <u>“build it big”</u> at the front desk. <b>(4)</b> This is the most biggest contest the library has ever held. <b>(5)</b> Bring <u>your</u> own snack and water bottle, and we will supply the bricks. <b>(6)</b> Kids can work alone. <b>(7)</b> They can work with a partner.", "stem": "Which sentence has an error?", "opts": ["This is the most biggest contest the library has ever held.", "Bring your own snack and water bottle.", "Calling all builders in grades 3 to 5 who love to create!", "The Maple Street Library will hold a LEGO Challenge in the community room on Saturday, November 7."], "ci": 0, "exp": "Never use <i>most</i> with an <i>-est</i> word. Use just one: <i>This is the <b>biggest</b> contest the library has ever held.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"passage": "<strong>How Sea Otters Use Tools</strong><br><b>(1)</b> Sea otters are among the few animals that use tools. <b>(2)</b> An otter floats on its back in the water and smashes clams against a flat rock that it keeps on its chest. <b>(3)</b> Otters also eat sea urchins. <b>(4)</b> Sea urchins damage the giant kelp forests along the coast. <b>(5)</b> At night, a group of otters <u>float</u> together near the shore. <b>(6)</b> They rest in a kelp bed, <u>where</u> long leaves keep them from drifting away. <b>(7)</b> <u>Especially during storms.</u>", "stem": "What is the best way to combine sentences 3 and 4?", "opts": ["Otters also eat sea urchins, who damage the giant kelp forests along the coast.", "Otters also eat sea urchins, they damage the giant kelp forests along the coast.", "Otters also eat sea urchins which, damage the giant kelp forests along the coast.", "Otters also eat sea urchins, which damage the giant kelp forests along the coast."], "ci": 3, "exp": "Use <i>which</i> for animals and things (not <i>who</i>), with the comma before it: <i>Otters also eat sea urchins, <b>which</b> damage the giant kelp forests along the coast.</i> Joining with only a comma and <i>they</i> makes a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"passage": "<strong>Winter Coat Drive</strong><br><b>(1)</b> This month, our school is collecting warm coats for families in our town who need them. <b>(2)</b> The boxes by the front office <u>is</u> for your donations. <b>(3)</b> Please make sure each coat is clean, and check that <u>it&rsquo;s</u> zipper works. <b>(4)</b> A thick coat works <u>good</u> on the coldest mornings. <b>(5)</b> Coats can be dropped off before school. <b>(6)</b> They can also be dropped off after school. <b>(7)</b> The drive ends on Friday, December 4, so please bring your coats soon.", "stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Coats can be dropped off both before and after school.", "Coats can be dropped off neither before nor after school.", "Coats can be dropped off before school, they can also be dropped off after school.", "Coats can be dropped off both before or after school."], "ci": 0, "exp": "Use the pair <i>both &hellip; and</i> to join two choices that are both true: <i>Coats can be dropped off <b>both</b> before <b>and</b> after school.</i> <i>Both</i> never goes with <i>or</i>.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}, {"passage": "<strong>Winter Concert Notice</strong><br><b>(1)</b> The fifth-grade choir will perform its winter concert on Thursday, December 10, in the school gym. <b>(2)</b> Last year, the concert <u>is</u> so popular that every seat was filled. <b>(3)</b> <u>Its</u> a good idea to arrive at least fifteen minutes early. <b>(4)</b> The singers have practiced real hard for six weeks. <b>(5)</b> After the concert, families can visit the art room. <b>(6)</b> Student paintings will be on display there. <b>(7)</b> We hope to see you there!", "stem": "What is the best way to combine sentences 5 and 6?", "opts": ["After the concert, families can visit the art room, where student paintings will be on display.", "After the concert, families can visit the art room, where student paintings will be on display there.", "After the concert, families can visit the art room, which student paintings will be on display.", "After the concert, families can visit the art room, who student paintings will be on display."], "ci": 0, "exp": "Use <i>where</i> to add information about a <b>place</b>. Because <i>where</i> already means “in that place,” drop the word <i>there</i>: <i>…the art room, <b>where</b> student paintings will be on display.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"stem": "Which sentence has an error?", "opts": ["The butterflies fly south to the mountains of central Mexico.", "In spring, their children and grandchildren slowly make the trip back north.", "Every fall, millions of monarch butterflies leave Canada and the northern United States.", "There long trip can cover almost 3,000 miles."], "ci": 3, "exp": "<i>There</i> means a place. To show that the trip belongs to the butterflies, use the possessive <i>their</i>: <i><b>Their</b> long trip can cover almost 3,000 miles.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>How Monarch Butterflies Travel</strong><br><b>(1)</b> Every fall, millions of monarch butterflies leave Canada and the northern United States. <b>(2)</b> The bright wings of a monarch <u>is</u> orange with thin black lines. <b>(3)</b> The butterflies fly south to the mountains of central Mexico. <b>(4)</b> Because the northern winter would kill them. <b>(5)</b> There long trip can cover almost 3,000 miles. <b>(6)</b> Monarchs glide on warm air currents, so they can fly <u>farther</u> than you might expect for such small insects. <b>(7)</b> In spring, their children and grandchildren slowly make the trip back north."}, {"stem": "Which sentence has an error?", "opts": ["The second loaf was tall, golden, and perfect.", "On Sunday morning, Noah helped Grandma bake bread for the first time.", "Later, Grandma showed his sister and he how to shape the loaves.", "Noah pushed and folded the sticky dough for ten minutes."], "ci": 2, "exp": "After a verb like <i>showed</i>, use an object pronoun. Test it alone: <i>Grandma showed <b>him</b></i>, not <i>showed he</i>. Fixed: <i>Later, Grandma showed his sister and <b>him</b> how to shape the loaves.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>The First Loaf</strong><br><b>(1)</b> On Sunday morning, Noah helped Grandma bake bread for the first time. <b>(2)</b> <u>“Can I knead the dough”? Noah asked.</u> <b>(3)</b> Grandma smiled and <u>hands</u> him the big wooden bowl. <b>(4)</b> Noah pushed and folded the sticky dough for ten minutes. <b>(5)</b> Later, Grandma showed his sister and he how to shape the loaves. <b>(6)</b> “We <u>should of</u> let it rise longer,” Grandma said with a laugh when the first loaf came out flat. <b>(7)</b> The second loaf was tall, golden, and perfect."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["mine", "I", "myself", "NO CHANGE"], "ci": 3, "exp": "It is already correct. Cover up <i>my partner and</i>: <i>He gave <b>me</b> a clipboard</i> sounds right, so <i>my partner and me</i> is correct after the verb <i>gave</i>.", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>An Email to Cousin Ivy</strong><br><b>(1)</b> This fall I joined the Green Team at Lincoln Elementary. <b>(2)</b> Last Friday, we <u>collect</u> cans and paper from every classroom. <b>(3)</b> Our teacher, Mr. Hill, <u>has chose</u> me to be a team leader. <b>(4)</b> He gave my partner and <u>me</u> a bright green clipboard. <b>(5)</b> At the end of the day, we weighed everything on a big scale. <b>(6)</b> The paper alone weighed forty-two pounds. <b>(7)</b> Mr. Hill smiled and said, <u>&ldquo;this is our best week yet!&rdquo;</u>"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
