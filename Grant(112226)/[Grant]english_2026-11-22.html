<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Some questions say “Select ALL that apply” — those have more than one correct answer. Look back at the passage before you answer. This week's review — questions you missed recently.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"passage": "<strong>Listening for Lindbergh</strong><br>On the afternoon of May 21, 1927, eleven-year-old Mae Hollis sat cross-legged in front of the family radio in Wichita, Kansas, while her father fiddled with the dial. Somewhere over the Atlantic Ocean, a young pilot named Charles Lindbergh was attempting to fly alone, without stopping, from New York to Paris. No one had ever done it.<br><br>&ldquo;He&rsquo;s been in the air more than thirty hours,&rdquo; Papa said, frowning at the crackling speaker. &ldquo;Fog over the ocean, they say.&rdquo;<br><br>Mae thought of the newspaper photograph of Lindbergh&rsquo;s plane, the <i>Spirit of St. Louis</i>, its silver wings so slender they looked fragile. To save weight, the newspaper said, he had left behind his radio and even his parachute.<br><br>Then the static cleared, and an announcer&rsquo;s voice rose with excitement: Lindbergh had landed at Le Bourget Field, and a huge crowd was rushing across the airfield toward his plane.<br><br>Papa let out a whoop that rattled the windows. Mae ran onto the porch, where neighbors were already spilling out of their houses, and looked up at the sky as though she might see the tiny plane herself.", "stem": "Which meaning of <b>dial</b> is used in the first paragraph?", "opts": ["to call someone by pressing numbers on a phone", "a round gauge that shows a measurement, such as speed", "the face of a clock that shows the hours", "a knob that is turned to choose a radio station"], "ci": 3, "exp": "Mae&rsquo;s father &ldquo;fiddled with the dial&rdquo; of the family radio, so it is the knob that tunes the station. A gauge is also a kind of dial, but it only shows a measurement; it is not turned to change anything.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Some acorns grow into oaks because squirrels forget where they buried them.", "Burdock burrs gave an engineer the idea for Velcro.", "A maple seed floats down under a tuft of silky threads, like a parachute.", "Witch hazel pods can fling seeds as far as thirty feet."], "ci": 2, "exp": "The silky “tiny parachute” belongs to the dandelion. The passage says a maple seed has “a single papery wing that makes it spin like a helicopter blade.” The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>", "stem": "The poet writes that the wind “came walking down our street / on tall and restless, unseen feet.” What does this language do?", "opts": ["It describes the wind as if it were a person.", "It shows that the speaker is afraid of the wind.", "It compares the wind to embers by using the word “like.”", "It tells exactly how fast the wind was blowing."], "ci": 0, "exp": "Wind cannot really walk or have feet. Giving it human actions is called personification. The poem does use “like” later, but that compares the <i>leaves</i> to embers.", "tag": "Author's Craft", "tagcolor": "#185FA5"}, {"passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>", "stem": "Read this sentence: “He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.” Which word means the <b>SAME</b> or nearly the same as <b>deliberate</b>?", "opts": ["intentional", "hurried", "accidental", "cheerful"], "ci": 0, "exp": "<i>Deliberate</i> means done carefully and on purpose. Jonah chose the section he knew best and played it steadily, so <i>intentional</i> fits. <i>Hurried</i> and <i>accidental</i> mean nearly the opposite.", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "In the summer of 1881, twelve-year-old Thomas Byrne lived in a crowded apartment near the East River in Brooklyn. Every morning he watched hundreds of people squeeze onto the ferries that carried workers across the river to New York City. When fog or ice filled the river, the ferries stopped, and many families lost a day&rsquo;s pay. That was why the city was building the Brooklyn Bridge, a suspension bridge, or a bridge whose roadway hangs from huge cables stretched between tall towers.<br><br>Years earlier, Thomas&rsquo;s father had helped dig the bridge&rsquo;s foundations. He had worked in a caisson, a giant wooden box without a bottom that was sunk to the riverbed and filled with pressed air to keep the water out. Workers who came up too quickly often became sick with a painful illness called caisson disease. The chief engineer, Washington Roebling, became so ill that he could no longer leave his house.<br><br>One afternoon, Thomas delivered a package to the Roebling home. He saw Emily Roebling, the engineer&rsquo;s wife, studying drawings at a cluttered table. She explained that she carried her husband&rsquo;s instructions to the builders every day and had learned the mathematics of cables herself. <u>Mrs. Roebling was the most remarkable person in all of Brooklyn.</u><br><br>From the window, Thomas could see the two stone towers rising above the river like giant gray guardians. Workers were spinning steel wires into four thick cables, each made of more than 5,000 wires. Thomas asked whether a boy could ever learn to build something so enormous. Mrs. Roebling handed him a small notebook and told him to begin by writing down every question he had. On his way home, Thomas stopped at the water&rsquo;s edge, opened the notebook, and stared up at the cables shining in the evening sun.", "stem": "What was the main way in which a caisson kept river water out while men dug?", "opts": ["It was covered with wet sheets.", "It was lined with stone from the towers.", "It was filled with pressed air.", "It was held up by steel cables."], "ci": 2, "exp": "The caisson was &ldquo;sunk to the riverbed and filled with pressed air to keep the water out.&rdquo;", "tag": "Main Way", "tagcolor": "#185FA5"}, {"passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>", "stem": "Which of these does the poem <b>NOT</b> describe the river doing?", "opts": ["cracking its ice in March", "swallowing a fence and a footbridge", "freezing over again in the fall", "humming a gentle tune in July"], "ci": 2, "exp": "The poem moves from March to April to July and never mentions fall. It does say the river “cracks its frozen coat,” “swallows fence and footbridge,” and “hums a gentle tune.”", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>", "stem": "Which event happened <b>right after</b> the two telegraph lines were joined?", "opts": ["Congress passed a law offering money for the line.", "A message from California reached President Lincoln.", "Western Union sent out two crews from opposite ends.", "The Pony Express announced that it would close."], "ci": 1, "exp": "“Within hours” of the joining, the message reached Lincoln. The Pony Express closing came “two days later,” so it was not right after.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>", "stem": "According to the passage, which event happened right after burning embers leaped across the Chicago River?", "opts": ["A fire broke out in the O’Leary barn.", "Rain helped put out the flames.", "Strong winds pushed the flames toward downtown.", "The city’s waterworks caught fire."], "ci": 3, "exp": "The passage says embers “leaped across the Chicago River, and soon the city’s waterworks caught fire.” The barn fire and the winds came before the embers crossed the river; the rain came last, on October 10.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1943, with food rationed during World War II, the government urged Americans to plant “victory gardens.” Thirteen-year-old Ruth Kowalski and her neighbors on Chicago’s South Side cleared bricks and broken glass from a vacant lot behind their apartment building. They planted beans, tomatoes, and cabbage in tidy rows, hauling water in buckets from the building’s basement. By August, the lot was producing more vegetables than the families could eat, so Ruth’s mother canned the extra in glass jars to last through the winter. Ruth later said the garden taught her that a neighborhood could feed itself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last year, students at Ridgeview Middle School in Denver turned their flat school roof into a hydroponic garden. Instead of soil, the plants grow in trays of water mixed with nutrients, and sensors send a text message to the students when the water runs low. Seventh grader Leo Martinez checks the lettuce and basil every morning before class. The harvest goes straight to the school cafeteria, where it replaces vegetables that once traveled more than a thousand miles by truck. Leo says the best part is watching classmates eat a salad that was growing above their heads that morning.</p>", "stem": "In Passage B, the prefix <i>hydro-</i> means “water.” Based on this and the passage, what does <b>hydroponic</b> most likely mean?", "opts": ["growing plants that need very little water", "growing plants in water instead of soil", "watering plants with buckets", "growing plants on a flat roof"], "ci": 1, "exp": "Passage B says, “Instead of soil, the plants grow in trays of water mixed with nutrients.” <i>Hydro-</i> (water) matches this. Being on a roof is where the garden is, not what <i>hydroponic</i> means.", "tag": "Word Parts", "tagcolor": "#185FA5"}, {"passage": "<strong>Into the Unknown West</strong><br>In 1803, the United States purchased the vast Louisiana Territory from France, roughly doubling the size of the young nation. Yet almost no one in the government knew what lay between the Mississippi River and the Pacific Ocean. President Thomas Jefferson chose Meriwether Lewis, his personal secretary, to lead an expedition, and Lewis invited his former army friend William Clark to share command. Their group, known as the Corps of Discovery, left the St. Louis area in May 1804 and paddled up the Missouri River against a powerful current.<br><br>The explorers spent their first winter among the Mandan people in present-day North Dakota, where they met Sacagawea, a young Shoshone woman who joined them with her husband and infant son. Her help proved invaluable the following summer, when the Corps reached Shoshone lands and desperately needed horses to cross the Rocky Mountains. After a grueling, nearly starving trek through snowy passes, the travelers floated down the Columbia River and glimpsed the Pacific in November 1805. When they returned to St. Louis in 1806, they carried detailed maps, journals describing hundreds of unfamiliar plants and animals, and a far more accurate picture of the continent.", "stem": "Which word means the <b>OPPOSITE</b> of “invaluable” as it is used in the passage?", "opts": ["temporary", "priceless", "worthless", "unfamiliar"], "ci": 2, "exp": "Sacagawea's help was “invaluable” because the Corps “desperately needed horses” — her help was extremely valuable. The opposite is <i>worthless</i>. “Priceless” means almost the same as invaluable, so it is a synonym, not an opposite.", "tag": "Antonym", "tagcolor": "#185FA5"}, {"passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The Moon shines because sunlight reflects off its surface.", "The Sun always lights up half of the Moon.", "A full cycle of the Moon's phases takes about two weeks.", "During a full moon, Earth lies between the Sun and the Moon."], "ci": 2, "exp": "The passage says the Moon travels around Earth “over about 29.5 days,” and the full moon comes “about two weeks into the cycle.” So the whole cycle takes about a month, not two weeks. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Flowerpot Knight</strong><br>Maya had sketched the scarecrow for three nights straight: a knight in cardboard armor, holding a shield painted with the school's eagle. When she unrolled the drawing at the garden club meeting, Jordan frowned.<br><br>“It's cool,” he said slowly, “but the contest rules say we can only use recycled materials from the garden shed. Cardboard armor won't survive the first rain.”<br><br>Maya felt her cheeks burn. “So you want to make a boring one with an old shirt and some straw?”<br><br>“I didn't say boring.” Jordan dragged a rusty watering can and a stack of cracked flowerpots out of the shed. “What if the knight's helmet is this can, and the armor is flowerpots strung together? It would still be a knight—just one that can handle the weather.”<br><br>Maya studied the pile, skeptical at first. Then she noticed how the clay pots overlapped like the metal plates on a real suit of armor. She picked up a marker and began redrawing her sketch.<br><br>Two weeks later, the judges awarded the Flowerpot Knight first place and praised its clever design. When a reporter from the school newspaper asked whose idea it had been, Maya and Jordan answered at exactly the same moment: “Ours.”", "stem": "According to the story, what did Jordan suggest using for the knight's helmet?", "opts": ["a rusty watering can", "a cracked clay flowerpot", "an old shirt stuffed with straw", "a cardboard box"], "ci": 0, "exp": "Jordan says, “What if the knight's helmet is this can, and the armor is flowerpots strung together?” — and the can is the “rusty watering can” he pulled from the shed. The flowerpots became the armor, not the helmet.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"passage": "<strong>The Night the City Burned</strong><br>On the evening of October 8, 1871, eleven-year-old Thomas Harper stood on the back steps of his family's boardinghouse on Chicago's North Side and watched an orange glow rise in the sky to the southwest. It had barely rained for weeks, and the city's wooden sidewalks and shingled roofs were as dry as kindling. By midnight, a fierce wind was hurling burning embers across the Chicago River, and the fire was racing toward the heart of the city.<br><br>“Wake the boarders!” his mother shouted. Thomas dashed from room to room, pounding on doors, while his father loaded quilts and the family Bible into a borrowed wagon. Dense smoke stung his eyes as they joined the crowds streaming north toward the lake. They spent the next day huddled on the sandy shore, watching ash drift down like dark snow.<br><br>When rain finally fell late on October 9, the flames died out. Much of the city lay in ruins. Yet within weeks, Thomas watched carpenters and masons begin to restore the neighborhood, this time using brick and stone wherever they could. “We'll build it stronger,” his father said, and Thomas believed him.", "stem": "Why did the builders most likely use brick and stone “wherever they could” when they rebuilt the neighborhood?", "opts": ["Brick and stone buildings could be finished more quickly than wooden ones.", "Brick and stone were much cheaper than wood after the fire.", "They wanted buildings that would be less likely to burn in another fire.", "The city had run out of carpenters who knew how to build with wood."], "ci": 2, "exp": "The fire spread so fast because the city's “wooden sidewalks and shingled roofs were as dry as kindling.” Building with brick and stone, and the father's words “We'll build it stronger,” suggest they wanted safer, fire-resistant buildings. The passage says nothing about cost or speed.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>Moon Diary</strong><br>The first night, the sky holds only stars—<br>no Moon at all, just darkness, deep and wide.<br>I search above the rooftops, but it hides,<br>a shy coin tucked inside a velvet purse.<br><br>Within a week, a silver fingernail<br>hooks the horizon where the tall pines lean.<br>Each evening it grows bolder, rounder, brighter,<br>a lantern filling slowly from within.<br><br>Then comes the night it floods the field with light;<br>each fence post lays a shadow on the snow.<br>I could read my diary by its glow.<br>I write: <i>Tonight the whole round face looked in.</i><br><br>But fullness never lingers. Night by night<br>it thins and slips back into dark again.<br>I close my book. I am not sad. I know<br>the Moon will keep its promise. It always has.", "stem": "Read these lines: “But fullness never <b>lingers</b>. Night by night / it thins and slips back into dark again.” What does <i>lingers</i> mean?", "opts": ["returns quickly", "stays for a long time", "shines very brightly", "grows larger"], "ci": 1, "exp": "The next line says the Moon “thins and slips back into dark,” so the full Moon does not stay. <i>Lingers</i> means stays for a long time. “Returns quickly” is about coming back, not staying.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>Island of Hope</strong><br>The ferry bumped against the dock, and eleven-year-old Sofia Russo gripped her little brother&rsquo;s hand. After twelve days crossing the Atlantic in the crowded lower deck of a steamship, the family had finally reached Ellis Island in New York Harbor. It was the spring of 1907. Papa had sailed to America a year earlier, and his letters had promised that a new life waited beyond the inspection hall.<br><br>Inside the enormous Registry Room, thousands of voices echoed in dozens of languages. Sofia had heard rumors on the ship: doctors watched newcomers climb the long staircase, and anyone who stumbled or coughed might be marked with chalk and held for more tests. She straightened her shoulders and climbed steadily, though her knees trembled.<br><br>At the top, a doctor peered at her eyes and waved her on. An inspector asked Mama a series of questions through an interpreter, and the answers seemed to reveal nothing troubling. Hours later, the family hurried down the &ldquo;Stairs of Separation&rdquo; toward the exit for those staying in New York City. Behind the railing stood a thin man in a gray cap, waving his hat with both hands. After a year of hardship and waiting, Sofia finally saw her father again.", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The Registry Room was filled with people speaking many languages.", "An interpreter helped Mama answer the inspector's questions.", "Doctors watched newcomers as they climbed the long staircase.", "Sofia's father crossed the Atlantic on the same ship as his family."], "ci": 3, "exp": "The passage says, \"Papa had sailed to America a year earlier,\" so he was not on the same ship. The other three statements match details in the second and third paragraphs.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Setting Aside Yellowstone</strong><br>For decades, trappers returning from the remote northern Rockies told stories that most Americans dismissed as tall tales: rivers that boiled, mud that bubbled like porridge, and fountains of steam that erupted on schedule. In 1870, a group of explorers from Montana Territory set out to test those claims, and what they found convinced them that the rumors had been, if anything, too modest. A year later, the federal government sent the geologist Ferdinand Hayden to survey the region scientifically. Hayden brought along two artists who would prove essential to his mission: the photographer William Henry Jackson and the painter Thomas Moran. Their pictures made the region's wonders evident to lawmakers who would never travel there themselves. Members of Congress, many of whom had doubted the written reports, studied Jackson's photographs and Moran's vivid watercolors of the canyon and the hot springs. Persuaded that such a landscape should not be sold off to private owners, Congress passed a bill protecting more than two million acres. On March 1, 1872, President Ulysses S. Grant signed it, creating Yellowstone as the world's first national park. The idea spread steadily, and today more than one hundred nations protect land in national parks.", "stem": "Which event happened right after the explorers from Montana Territory made their trip in 1870?", "opts": ["President Grant signed the bill creating the park.", "Trappers began telling stories about boiling rivers.", "Congress studied photographs and watercolors of the region.", "The government sent Ferdinand Hayden to survey the region."], "ci": 3, "exp": "&ldquo;A year later, the federal government sent the geologist Ferdinand Hayden.&rdquo; The trappers&rsquo; stories came before 1870, and Congress studied the pictures and passed the bill only after Hayden&rsquo;s survey.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Twine Line</strong><br>January 12, 1888, began so mildly at the Nebraska schoolhouse that several children had come to class without coats. Lucy Whitaker, eleven, was reciting her multiplication tables when the window beside her darkened as though someone had drawn a curtain. Within minutes, a roaring wall of snow struck the building, and the temperature plunged. Miss Freeman, the young teacher, peered outside and could not see the fence twenty feet away. The coal bucket was nearly empty.<br>&ldquo;We cannot stay here through the night,&rdquo; she said quietly, so that the youngest pupils would not hear any fear in her voice. &ldquo;The Johnson farmhouse is a quarter mile north. We are going to walk there together.&rdquo;<br>She unwound a ball of twine from her sewing basket and tied it around each child's wrist, binding all thirteen pupils into a single line. Lucy, as the oldest girl, was placed at the very end and told to call out if anyone stumbled. Bent nearly double against the gale, the children trudged forward, unable to navigate by sight. At last Miss Freeman's outstretched hand struck the corner of a woodshed, and moments later the Johnsons' door swung open into warm yellow light.", "stem": "Why does Miss Freeman most likely speak quietly when she says they cannot stay?", "opts": ["She is too cold to speak loudly.", "She does not want the Johnsons to hear her.", "She does not want to frighten the youngest pupils.", "She is not sure the plan will work, so she whispers it only to Lucy."], "ci": 2, "exp": "The story says she spoke quietly &ldquo;so that the youngest pupils would not hear any fear in her voice.&rdquo; She is calm and gives the plan to the whole class, not just to Lucy.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close.", "stem": "Which event happened right after workers finished the first telegraph line across the continent?", "opts": ["Mail began reaching Sacramento in about ten days.", "A rider left St. Joseph carrying a pouch of letters.", "Riders began switching horses at relay stations.", "The Pony Express announced that it would close."], "ci": 3, "exp": "The passage says that on October 24, 1861, the telegraph line was finished, and &ldquo;Two days later, the Pony Express announced that it would close.&rdquo; The rider leaving St. Joseph happened first, in April 1860.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Entrance</strong><br>Leo had practiced the cello part of the overture so many times that he could hear it in his sleep, yet when Ms. Ferraro raised her baton at the first full rehearsal, his hands felt like borrowed gloves. The violins began, bright and quick, and Leo counted under his breath. Four measures. Eight. On the twelfth, he was supposed to come in with the low melody, but he hesitated half a beat, and the cellos beside him surged ahead without him.<br><br>Ms. Ferraro tapped her stand. &ldquo;Again, from letter B.&rdquo;<br><br>Leo felt his face burn. &ldquo;Sorry,&rdquo; he muttered. &ldquo;I lost count.&rdquo;<br><br>&ldquo;Counting is only half of it,&rdquo; she said, not unkindly. &ldquo;Watch my left hand. I'll look at you right before your entrance.&rdquo;<br><br>On the second try, Leo kept one eye on the page and one on her hand. When her glance found him, he drew the bow across the strings, and the melody rose, deep and vivid, beneath the violins. Beside him, Priya nodded once without missing a note.<br><br>After rehearsal, Leo stayed in his seat and practiced the entrance again, this time with his eyes closed, picturing that small, steady glance.", "stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;hesitated&rdquo; as it is used in the story?", "opts": ["stumbled", "rushed", "paused", "whispered"], "ci": 2, "exp": "<i>Hesitated</i> means paused or waited a moment before acting. Leo came in &ldquo;half a beat&rdquo; late. <i>Rushed</i> is the opposite.", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "<strong>A Face in the Fog</strong><br>On October 28, 1886, Nathan Weiss stood at the rail of a crowded ferry in New York Harbor, rain dripping from the brim of his cap. Fog hid the shoreline, and for a long moment the boat seemed to drift through a gray room with no walls. Then the mist thinned, and a copper face appeared above the water, far larger than any face Nathan had imagined.<br><br>&ldquo;She's enormous,&rdquo; whispered his sister, Ruth.<br><br>Their father, who had sailed into this same harbor as a young immigrant from Bavaria twelve years earlier, said nothing. He removed his hat, despite the rain, and held it against his chest. Nathan had heard him describe that first voyage many times: the crowded deck, the seasickness, the uncertainty of starting over. Yet he had never heard his father's voice as quiet as it was now. &ldquo;When I came,&rdquo; he said, &ldquo;there was nothing here to greet us.&rdquo;<br><br>Around them, whistles shrieked and cannons boomed from ships across the harbor. Nathan barely heard them. He was watching his father's face, and for the first time he understood that the statue was not only a gift from France but also a part of his own family's heritage.", "stem": "According to the passage, where did Nathan's father come from?", "opts": ["the Sierra Nevada", "France", "New York", "Bavaria"], "ci": 3, "exp": "The passage says he came &ldquo;as a young immigrant from Bavaria twelve years earlier.&rdquo; France is mentioned only as the country that gave the statue.", "tag": "Fact Retrieval", "tagcolor": "#185FA5"}, {"passage": "<strong>Keeping in Touch</strong><br><strong>Passage A</strong><br>Before Rural Free Delivery began in 1896, many farm families had to travel into town, sometimes several miles, just to find out whether a letter had arrived. In the spring of 1898, Clara Hoyt's family in rural Ohio finally got a mailbox at the end of their lane. Every afternoon, Clara eagerly watched for the carrier's buggy. When a letter from her aunt in Chicago came, the whole family gathered at the kitchen table, and Clara read it aloud twice. The letters arrived weeks apart, but each one felt like a visit.<br><br><strong>Passage B</strong><br>Every Sunday evening, Jonah Price props his tablet against the fruit bowl and calls his grandmother in Tucson. Within a few seconds, her face fills the screen, and she holds up whatever she has been working on: a half-finished quilt, a pan of cornbread, a lizard sunning itself on her porch. Each week they read a chapter of the same mystery novel and argue cheerfully about who the culprit might be. Jonah sometimes wishes the calls lasted longer, but he knows his grandmother will be only a tap away next Sunday.", "stem": "According to the passages, which statement is <b>NOT</b> true?", "opts": ["Clara read her aunt's letter aloud twice.", "Jonah's grandmother lives in Tucson.", "Clara's family received a letter from her aunt every week.", "Jonah and his grandmother read the same mystery novel."], "ci": 2, "exp": "Passage A says &ldquo;The letters arrived weeks apart,&rdquo; so they did not come every week. The other three statements match the passages.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by hand, relying on shovels, horses, and occasionally gunpowder to blast through rock. Because the land rises about 570 feet between the Hudson and Lake Erie, engineers built 83 locks to lift boats up the slope one step at a time.<br><br>The canal opened on October 26, 1825, eight years after digging began. Clinton rode a boat from Buffalo to New York City and poured a barrel of Lake Erie water into the Atlantic Ocean. Shipping costs plunged by about ninety percent, and New York City soon became the busiest port in the nation.", "stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did New York City become the busiest port in the nation after 1825?&rdquo;)?<br><br><b>A.</b> &ldquo;shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself&rdquo;<br><b>B.</b> &ldquo;Critics mocked the plan as &lsquo;Clinton&rsquo;s Ditch&rsquo;&rdquo;<br><b>C.</b> &ldquo;Workers, many of them Irish immigrants, dug almost entirely by hand&rdquo;<br><b>D.</b> &ldquo;Shipping costs plunged by about ninety percent&rdquo;<br><b>E.</b> &ldquo;Clinton rode a boat from Buffalo to New York City&rdquo;<br><b>F.</b> &ldquo;engineers built 83 locks to lift boats up the slope&rdquo;", "opts": ["C and D", "A and D", "A and F", "D and E"], "ci": 1, "exp": "<b>A</b> shows how expensive shipping was <i>before</i> the canal, and <b>D</b> shows that the canal made it much cheaper. Together they prove the cause in Part A: cheaper shipping.<br><b>Why not the others:</b> <b>B</b> is about critics; <b>C</b> is about who did the digging; <b>E</b> is Clinton&rsquo;s celebration trip; <b>F</b> explains how the canal was built, not why the port grew. Each is true, but none shows that shipping got cheaper.<br><b>Tip for Part B:</b> the right evidence must prove <i>your Part A answer</i>, not just be a true fact from the passage.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A"}, {"stem": "<b>Part B</b><br>Which <b>TWO</b> pieces of evidence from the passage support the answer to Part A (&ldquo;Why did Emily Roebling carry instructions to the engineers?&rdquo;)?<br><br><b>A.</b> &ldquo;His son, Washington Roebling, took charge.&rdquo;<br><b>B.</b> &ldquo;Washington himself became so ill that he could no longer visit the site&rdquo;<br><b>C.</b> &ldquo;a ferry crushed Roebling&rsquo;s foot at the dock&rdquo;<br><b>D.</b> &ldquo;he watched through a telescope while his wife, Emily, carried his instructions to the engineers&rdquo;<br><b>E.</b> &ldquo;Emily Roebling was the first person to ride across it&rdquo;<br><b>F.</b> &ldquo;ice on the East River could halt the boats for days&rdquo;", "opts": ["B and D", "B and E", "C and D", "A and D"], "ci": 0, "exp": "<b>B</b> shows the cause (Washington was too ill to go to the bridge), and <b>D</b> shows the effect (Emily carried his instructions while he watched from home). Together they prove the Part A answer.<br><b>Why not the others:</b> <b>A</b> tells who took over the project, not why Emily helped; <b>C</b> is about John&rsquo;s accident; <b>E</b> is about the opening day; <b>F</b> explains why a bridge was needed.<br><b>Tip:</b> the two right pieces of evidence should work like a &ldquo;because&rdquo; sentence &mdash; one cause, one effect.", "tag": "Cause & Effect (Part B)", "tagcolor": "#E24B4A", "passage": "<strong>The Brooklyn Bridge</strong><br>In the 1860s, the only way to travel between Manhattan and Brooklyn was by ferry, and in winter, ice on the East River could halt the boats for days. An engineer named John A. Roebling proposed a bridge hung from steel wire cables, a design that critics considered reckless for such a wide river.<br><br>In 1869, just as the project began, a ferry crushed Roebling&rsquo;s foot at the dock, and he died of an infection a few weeks later. His son, Washington Roebling, took charge. Workers dug the foundations for the two towers inside giant wooden chambers sunk to the river bottom, where pumps forced in air to hold back the water. Many workers who climbed out too quickly suffered caisson disease, and Washington himself became so ill that he could no longer visit the site.<br><br>From his apartment window, he watched through a telescope while his wife, Emily, carried his instructions to the engineers. Emily studied engineering so intensely that the crews began to treat her as the real chief. When the bridge opened on May 24, 1883, Emily Roebling was the first person to ride across it. A year later, a circus owner marched twenty-one elephants over the span to make it evident that the bridge was safe."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Papa worked at a rail yard.", "Electric bulbs lit up the fairgrounds at night.", "Each car on the wheel could hold thirty-six riders.", "George Ferris designed the wheel to rival the Eiffel Tower."], "ci": 2, "exp": "The passage says the wheel had &ldquo;thirty-six cars&rdquo; and each car &ldquo;could hold sixty riders.&rdquo; The false statement mixes up those two numbers. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Wheel in the Sky</strong><br>On a June morning in 1893, eleven-year-old Ida Novak clutched her father&rsquo;s hand as they entered the World&rsquo;s Columbian Exposition in Chicago. Papa had saved his wages from the rail yard for months so that the family could see the fair. Everywhere Ida looked, white buildings gleamed beside lagoons, and at night thousands of electric bulbs made the grounds glow brighter than any street she had ever walked.<br><br>But it was the giant wheel that made her stop. George Ferris had designed it to rival the Eiffel Tower, which had amazed visitors in Paris four years earlier. It rose 264 feet, and each of its thirty-six cars could hold sixty riders.<br><br>&ldquo;Fifty cents each,&rdquo; Papa said, counting coins slowly. Ida knew that was half a day&rsquo;s pay for him. She started to say they could skip it, but Papa pressed the coins into the ticket seller&rsquo;s palm.<br><br>As the wheel lifted them above the fairgrounds, Ida pressed her forehead to the glass. Lake Michigan stretched to the horizon, and the city looked like a toy village. She glanced at Papa, who was smiling at her instead of at the view, and she understood that the ride was his gift."}, {"stem": "In Passage A, why did June have to break the ice with a hammer?", "opts": ["because her father wanted the cows to drink from the creek", "because the water pipes in the barn had burst", "because her lantern did not give off enough heat", "because the water in the trough froze during the night"], "ci": 3, "exp": "Passage A says, &ldquo;The water in the cows&rsquo; trough often froze overnight, <i>so</i> June had to break the ice with a hammer.&rdquo; The word <i>so</i> signals the effect. Pipes, a creek, and the lantern&rsquo;s heat are never given as reasons.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "passage": "<strong>Winter Mornings on the Farm</strong><br><strong>Passage A</strong><br>In the winter of 1958, ten-year-old June Larsen woke at five o&rsquo;clock every morning on her family&rsquo;s Iowa farm. Before breakfast, she pulled on two pairs of wool socks and trudged to the barn with a lantern. The water in the cows&rsquo; trough often froze overnight, so June had to break the ice with a hammer before the animals could drink. Her fingers stung in the bitter cold, but she never complained, because her father could not finish the milking alone. By the time the school bus rumbled down the gravel road, June had already worked for two hours.<br><br><strong>Passage B</strong><br>Today, eleven-year-old Caleb Ortiz helps on his family&rsquo;s dairy farm in Wisconsin, but his mornings look very different. A heated trough keeps the cows&rsquo; water from freezing, even when the temperature drops below zero. Robotic milking machines let each cow walk in to be milked whenever she is ready, and a computer records how much milk she gives. Caleb&rsquo;s job is to check the screen and report any cow that seems sick. &ldquo;The robots do the heavy work,&rdquo; he says, &ldquo;but someone still has to notice when something is wrong.&rdquo;"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Marshall saw gold flakes in the water beneath the sawmill.", "California became a state in 1850.", "San Francisco grew to more than twenty thousand people within two years.", "Sutter became rich by selling food and tools to the miners."], "ci": 3, "exp": "The passage says &ldquo;Sutter himself was <i>ruined</i>,&rdquo; and it was <i>merchants</i> who charged high prices for food and tools. The other three statements match the passage: Marshall saw &ldquo;glittering flakes in the water channel beneath the mill,&rdquo; Ca  giant spark leaps between the charges.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> Lightning heats the air extremely fast.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> Electric charges are knocked loose.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Light travels much faster than sound.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> You see the flash before you hear the thunder.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The difference between the charges grows too large for the air to hold back.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> The air expands with a boom called thunder.</td></tr></table>Which choice matches every cause with the correct effect?", "opts": ["1–A, 2–D, 3–C, 4–B", "1–B, 2–C, 3–D, 4–A", "1–A, 2–B, 3–C, 4–D", "1–B, 2–D, 3–C, 4–A"], "ci": 3, "exp": "<b>1–B:</b> &ldquo;These collisions knock electric charges loose.&rdquo; <b>2–D:</b> the bolt &ldquo;heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder.&rdquo; <b>3–C:</b> &ldquo;<i>Because</i> light travels much faster than sound, you see the flash before you hear the rumble.&rdquo; <b>4–A:</b> when the air &ldquo;can no longer hold them back,&rdquo; &ldquo;a giant spark leaps between the charges.&rdquo; Watch for the trap that swaps 2 and 3: thunder is the effect of the <i>heat</i>, while the delay is the effect of <i>speed</i>.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A", "passage": "<strong>How Lightning Forms</strong><br>Inside a towering thundercloud, powerful currents of air carry water droplets upward, where they freeze. As the air keeps churning, tiny ice crystals collide with heavier pellets of soft hail. These collisions knock electric charges loose. The lightweight crystals, which become positively charged, are swept to the top of the cloud, while the heavier, negatively charged pellets sink toward the bottom.<br><br>Ordinarily the air keeps the two charges apart, but the difference persists and grows until the air can no longer hold them back. Then a giant spark leaps between the charges, either inside the cloud or down to the ground. That spark is lightning.<br><br>A bolt is extraordinarily hot, about five times hotter than the surface of the sun. It heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder. Because light travels much faster than sound, you see the flash before you hear the rumble. Counting the seconds between them reveals how far away the strike was: roughly five seconds for every mile."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(correctText(qi)), explanation: wrongTxt(q.exp) };
}
/* multi-select 2026-11-22 */
function isMulti(qi){ return !!(RAW_QUESTIONS[qi] && RAW_QUESTIONS[qi].multi); }
function isRight(qi, a){
  var q = RAW_QUESTIONS[qi];
  if(q.multi){
    if(!Array.isArray(a)) return false;
    var c = q.cis.slice().sort(), s = a.slice().sort();
    if(c.length !== s.length) return false;
    for(var i=0;i<c.length;i++) if(c[i]!==s[i]) return false;
    return true;
  }
  return a === q.ci;
}
function ansText(qi, a){
  var q = RAW_QUESTIONS[qi];
  if(Array.isArray(a)) return a.slice().sort().map(function(i){ return q.opts[i]; }).join(' | ');
  return q.opts[a];
}
function correctText(qi){ var q = RAW_QUESTIONS[qi]; return q.multi ? q.cis.slice().sort().map(function(i){ return q.opts[i]; }).join(' | ') : q.opts[q.ci]; }
function checkMulti(){
  var qi = activeOrder()[state.cur];
  if(state.answers[qi] !== undefined) return;
  var p = (state.pending && state.pending[qi]) || [];
  if(!p.length) return;
  state.answers[qi] = p.slice().sort();
  if(state.pending) delete state.pending[qi];
  saveState(); render();
}
window.checkMulti = checkMulti;
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(isRight(qi, state.answers[qi])) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, ansText(qi, state.answers[qi]))); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(isRight(qi, a)) correct++; else wd.push(wrongDetail(qi, ansText(qi, a)));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  var multiQ = !!q.multi, pend = (state.pending && state.pending[qi]) || [];
  if(multiQ){ var mn = document.createElement('div'); mn.className = 'multi-note'; mn.textContent = 'Select ALL that apply \u2014 more than one answer is correct.'; opts.appendChild(mn); }
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(multiQ){
      var mine = answered ? state.answers[qi] : pend, isC = q.cis.indexOf(idx) >= 0, sel = mine.indexOf(idx) >= 0;
      if(answered){
        btn.disabled = true;
        if(sel && isC) btn.className += ' selected-correct';
        else if(sel && !isC) btn.className += ' selected-wrong';
        else if(isC) btn.className += ' reveal-correct';
      } else {
        if(sel) btn.className += ' pending';
        btn.onclick = function(){ pick(idx); };
      }
      opts.appendChild(btn); return;
    }
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });
  if(multiQ && !answered){ var cb2 = document.createElement('button'); cb2.className = 'check-multi'; cb2.textContent = 'Check my answer'; cb2.disabled = !pend.length; cb2.onclick = checkMulti; opts.appendChild(cb2); }

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  if(isMulti(qi)){
    if(!state.pending) state.pending = {};
    var p = state.pending[qi] || [], k = p.indexOf(idx);
    if(k >= 0) p.splice(k, 1); else p.push(idx);
    state.pending[qi] = p; saveState(); render(); return;
  }
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(isRight(qi, state.answers[qi])) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += isRight(qi, state.answers[qi]) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && !isRight(qi, state.answers[qi]); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
