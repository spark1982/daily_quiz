<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }

  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

  .results-card h2 { text-align:center; margin-top:0; }

  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }

  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }

  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }

<script>
var TITLE = "[Grant] Math Competition";
var QUIZ_KEY = "grantmathcomp_14";
var INSTRUCTION = "Choose the correct answer for each problem. This week's review — questions you missed recently.";
var TODAY_STR = "20261122";
var RAW_QUESTIONS = [{"stem": "Find the number of factors for 630.", "opts": ["30", "20", "18", "24"], "ci": 3, "exp": "630 = 2 × 3² × 5 × 7. Number of factors = (1+1)(2+1)(1+1)(1+1) = 2×3×2×2 = 24.", "tag": "Chapter 4", "tagcolor": "#185FA5"}, {"stem": "At the toy store, 8 different toys ranged in prices of $19, $45, $104, $99, $9, $12, $13 and $19. Let A be the mean, <i>B</i> be the mode and <i>C</i> be the median. Find the median of the set: {<i>A</i>, <i>B</i>, <i>C</i>}.", "opts": ["32", "40", "19", "26"], "ci": 2, "exp": "A (mean): $19 + $45 + $104 + $99 + $9 + $12 + $13 + $19 = $320, and 320 &divide; 8 = 40. <i>B</i> (mode): 19 appears twice, so <i>B</i> = 19. <i>C</i> (median): in order 9, 12, 13, 19, 19, 45, 99, 104, the middle two are 19 and 19, so <i>C</i> = 19. The set {40, 19, 19} in order is 19, 19, 40, so its median is 19. 40 is <i>A</i>, 26 is the mean of {<i>A</i>, <i>B</i>, <i>C</i>}, and 32 comes from using 45 as the median.", "tag": "Chapter 15", "tagcolor": "#185FA5"}, {"stem": "How many ways are there to make $20 using $10-bills, $5-bills, and/or $1-bills?", "opts": ["11", "9", "10", "8"], "ci": 1, "exp": "0 tens: 5-bills can be 0–4 (5 ways). 1 ten: 5-bills can be 0–2 (3 ways). 2 tens: 5-bills = 0 (1 way). Total = 5+3+1 = 9 ways.", "tag": "Chapter 6", "tagcolor": "#185FA5"}, {"stem": "Jack and Jill are 1080 miles apart. They drive at different speeds toward each other to meet up. If Jack drives at an average speed of 37 mph and Jill drives at an average speed of 53 mph, how many hours will it take them to meet up?", "opts": ["29.2 hours", "10 hours", "12 hours", "20 hours"], "ci": 2, "exp": "<span>Since they are driving toward each other, their speeds add together: 37 + 53 = 90 mph. Time to close the 1,080-mile gap = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1,080</span><span style=\"border-top:1.4px solid #111;\">90</span></span> = 12 hours.</span>", "tag": "Chapter 12", "tagcolor": "#185FA5"}, {"stem": "Find the sum of all factors of 2⁵ × 3³ × 5³ that are both perfect squares AND divisible by 4.", "opts": ["10400", "1300", "5200", "2600"], "ci": 2, "exp": "Perfect square AND divisible by 4 (=2²): exponent of 2 must be even and ≥2 → {2,4}; exponent of 3 even → {0,2}; exponent of 5 even → {0,2}. Sum = (4+16)(1+9)(1+25) = 20 × 10 × 26 = 5200.", "tag": "Chapter 5", "tagcolor": "#185FA5"}, {"stem": "Five movies have feature-lengths of 144 minutes, 126 minutes, 125 minutes, 131 minutes and 154 minutes. What is the sum of the mean and the range of the movies' feature-lengths?", "opts": ["160", "136", "107", "165"], "ci": 3, "exp": "Mean: (144 + 126 + 125 + 131 + 154) &divide; 5 = 680 &divide; 5 = 136. Range: 154 &minus; 125 = 29. Sum: 136 + 29 = 165. 136 is the mean alone, 107 is the difference (136 &minus; 29) instead of the sum, and 160 uses the median (131) instead of the mean (131 + 29).", "tag": "Chapter 15", "tagcolor": "#185FA5"}, {"stem": "Find the number of factors of 2² × 3⁴ × 5³ that are divisible by 12.", "opts": ["12", "16", "8", "24"], "ci": 1, "exp": "12 = 2² × 3. Need exp(2)≥2 → {2} (1 choice), exp(3)≥1 → {1,2,3,4} (4 choices), exp(5): 0•3 (4 choices). Total = 1×4×4 = 16.", "tag": "Chapter 5", "tagcolor": "#185FA5"}, {"stem": "How many ways can the letters in the word AARDVARK be arranged?", "opts": ["6,720", "20,160", "40,320", "3,360"], "ci": 3, "exp": "<span>AARDVARK has 8 letters, with A repeated three times and <i>R</i> repeated twice (<i>D</i>, <i>V</i>, and <i>K</i> each appear once). The count is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>8!</span><span style=\"border-top:1.4px solid #111;\">3!&times;2!</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>40,320</span><span style=\"border-top:1.4px solid #111;\">12</span></span> = 3,360. 40,320 is plain 8!, which treats every letter as distinct. 20,160 only divides out the repeated <i>R</i> once, forgetting that A repeats three times. 6,720 only divides out the repeated A's, forgetting that <i>R</i> also repeats.</span>", "tag": "Chapter 14", "tagcolor": "#185FA5"}, {"stem": "Concert tickets cost $154 for two or $83 for one. How much do Cassie and Jacob save by buying the two-ticket deal?", "opts": ["$12", "$8", "$15", "$10"], "ci": 0, "exp": "Buying individually: 2 × $83 = $166. Two-ticket deal: $154. Savings = $166 − $154 = $12.", "tag": "Chapter 6", "tagcolor": "#185FA5"}, {"stem": "Robin is driving ahead of Will by 20 miles traveling in the same direction. If Robin is driving at a constant speed of 39 miles per hour and Will is driving at a constant speed of 51 miles per hour, how many minutes will it take Will to catch up to Robin?", "opts": ["20 minutes", "240 minutes", "100 minutes", "60 minutes"], "ci": 2, "exp": "Will closes the gap at a rate of 51 &minus; 39 = 12 miles per hour. Time to close the 20-mile gap = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>20</span><span style=\"border-top:1.4px solid #111;\">12</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">3</span></span> hours, which is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">3</span></span> &times; 60 = 100 minutes.", "tag": "Chapter 12", "tagcolor": "#185FA5"}, {"stem": "A bag has orange and green marbles with a ratio of orange to green equal to 9 to 5. If 71 orange marbles are removed, there would still be 5 more orange marbles than green marbles. How many marbles are there before the orange marbles were removed from the bag?", "opts": ["266", "238", "252", "280"], "ci": 0, "exp": "Orange=9<i>k</i>, green=5<i>k</i>. After: 9<i>k</i>−71=5<i>k</i>+5 → 4<i>k</i>=76 → <i>k</i>=19. Total=14×19=266.", "tag": "Chapter 9", "tagcolor": "#185FA5"}, {"stem": "If three coins are flipped, what is the probability that there are two heads and one tail?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">8</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">8</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>"], "ci": 2, "exp": "<span>Three coins have 2 &times; 2 &times; 2 = 8 equally likely outcomes. Two heads and one tail: HHT, HTH, THH &mdash; 3 outcomes. Probability = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">8</span></span>. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">8</span></span> counts only one order (HHT), and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> treats &ldquo;0, 1, 2, 3 heads&rdquo; as equally likely.</span>", "tag": "Chapter 16", "tagcolor": "#185FA5"}, {"stem": "Find the number of factors for 12,000.", "opts": ["60", "48", "36", "40"], "ci": 1, "exp": "12000 = 12 × 1000 = (2² × 3) × (2³ × 5³) = 2⁵ × 3 × 5³. Number of factors = (5+1)(1+1)(3+1) = 6×2×4 = 48.", "tag": "Chapter 4", "tagcolor": "#185FA5"}, {"stem": "Find the number of EVEN factors for 2² × 3⁴ × 5² × 7⁴.", "opts": ["225", "180", "75", "150"], "ci": 3, "exp": "Total = (2+1)(4+1)(2+1)(4+1) = 225. Odd = (4+1)(2+1)(4+1) = 75. Even = 225 − 75 = 150.", "tag": "Chapter 5", "tagcolor": "#185FA5"}, {"stem": "A marathon runner ran distances: 25 miles, 13 miles, 17 miles, 12 miles and 18 miles. What was the average distance that the runner ran?", "opts": ["25 miles", "13 miles", "85 miles", "17 miles"], "ci": 3, "exp": "Average (mean) = (25 + 13 + 17 + 12 + 18) &divide; 5 = 85 &divide; 5 = 17 miles. 85 is the total before dividing, 13 is the range (25 &minus; 12), and 25 is the longest single run.", "tag": "Chapter 15", "tagcolor": "#185FA5"}, {"stem": "Find the sum of the factors that are factors of 60 but NOT factors of 30.", "opts": ["72", "84", "96", "48"], "ci": 2, "exp": "Factors of 60 not in 30 are: 4, 12, 20, 60. Sum = 4+12+20+60 = 96.", "tag": "Chapter 4", "tagcolor": "#185FA5"}, {"stem": "How many factors do 42 and 630 share?", "opts": ["8", "6", "12", "10"], "ci": 0, "exp": "42 = 2 × 3 × 7. GCD(42, 630) = 42. Shared factors are the factors of 42: 1,2,3,6,7,14,21,42 — that is 8 factors.", "tag": "Chapter 4", "tagcolor": "#185FA5"}, {"stem": "How many whole numbers less than 20 have an odd number of factors?", "opts": ["6", "3", "5", "4"], "ci": 3, "exp": "A number has an odd number of factors only if it is a perfect square. Perfect squares less than 20: 1, 4, 9, 16. That is 4 numbers.", "tag": "Chapter 3", "tagcolor": "#185FA5"}, {"stem": "Find the two consecutive integers closest to <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><span style=\"font-size:0.62em;align-self:flex-start;margin-right:-0.45em;position:relative;top:0.05em;\">3</span><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">150</span></span>.", "opts": ["3 and 4", "4 and 5", "5 and 6", "6 and 7"], "ci": 2, "exp": "5³ = 125 < 150 < 216 = 6³. So <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><span style=\"font-size:0.62em;align-self:flex-start;margin-right:-0.45em;position:relative;top:0.05em;\">3</span><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">150</span></span> is between 5 and 6.", "tag": "Chapter 7", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
