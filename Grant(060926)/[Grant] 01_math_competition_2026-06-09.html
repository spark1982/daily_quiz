    var QUESTIONS=[{"tag": "Chapter 1", "q": "Solve: (1 + 2) &times; 2", "options": ["6", "8", "7", "5"], "correct": 0, "explain": "(1+2)&times;2 = 3&times;2 = 6"}, {"tag": "Chapter 1", "q": "How many integers are between &minus;10 and 10? (not inclusive)", "options": ["18", "20", "21", "19"], "correct": 3, "explain": "Integers from &minus;9 to 9 inclusive: that is 9+1+9 = 19 integers."}, {"tag": "Chapter 1", "q": "Solve: 20(50 + 4) &minus; 1000", "options": ["80", "480", "1080", "1000"], "correct": 0, "explain": "20&times;54 = 1080, then 1080 &minus; 1000 = 80"}, {"tag": "Chapter 1", "q": "Solve: 720 &divide; 6 &divide; 5 &divide; 4 &divide; 3 &divide; 2 &divide; 1", "options": ["720", "1", "6", "120"], "correct": 1, "explain": "720 &divide; 6 = 120, &divide;5 = 24, &divide;4 = 6, &divide;3 = 2, &divide;2 = 1, &divide;1 = 1"}, {"tag": "Chapter 2", "q": "What is the largest two-digit whole number divisible by 6?", "options": ["98", "90", "94", "96"], "correct": 3, "explain": "96 &divide; 6 = 16. The next multiple, 102, has three digits. So 96 is the largest two-digit multiple of 6."}, {"tag": "Chapter 2", "q": "Jerry thinks of a number between 1 and 100 that is a multiple of both 11 and 5. What is the number?", "options": ["110", "55", "65", "50"], "correct": 1, "explain": "LCM(11,5) = 55. The only multiple of 55 between 1 and 100 is 55."}, {"tag": "Chapter 2", "q": "The five-digit number A5,2A1 is divisible by 3 and must be as large as possible. What is the value of A?", "options": ["6", "9", "8", "3"], "correct": 2, "explain": "Sum of digits = 2A+8 must be divisible by 3. Testing A=9: 26 (no). A=8: 24 (yes). So the largest valid value is A=8."}, {"tag": "Chapter 2", "q": "Marina&rsquo;s favorite number is greater than 40, less than 70, and divisible by both 8 and 7. What is it?", "options": ["56", "49", "48", "63"], "correct": 0, "explain": "LCM(8,7) = 56. 56 is between 40 and 70. So Marina&rsquo;s number is 56."}, {"tag": "Chapter 3", "q": "What is the largest prime number less than 100?", "options": ["91", "93", "99", "97"], "correct": 3, "explain": "97 is prime (not divisible by 2,3,5,7). 99=9&times;11, 93=3&times;31, 91=7&times;13. So 97 is the answer."}, {"tag": "Chapter 3", "q": "Is 163 a prime number? (Hint: 169 = 13 &times; 13)", "options": ["No, 163 = 7 &times; 23", "No, 163 = 11 &times; 13 + 10", "Yes, 163 is prime.", "No, 163 = 3 &times; 51 + 10"], "correct": 2, "explain": "Since 169 = 13&sup2;, we only need to check primes up to 13. 163 is not divisible by 2,3,5,7,11, or 13. Therefore 163 is prime."}, {"tag": "Chapter 3", "q": "What is the smallest three-digit prime number?", "options": ["103", "100", "107", "101"], "correct": 3, "explain": "100 = 4&times;25 (not prime). 101 is not divisible by 2,3,5,7 and 11&sup2; &gt; 101, so 101 is prime."}, {"tag": "Chapter 3", "q": "Express 252 as a product of prime factors using exponents.", "options": ["2&times;3<sup>2</sup>&times;7<sup>2</sup>", "2<sup>2</sup>&times;3&times;7<sup>2</sup>", "2<sup>2</sup>&times;3<sup>2</sup>&times;7", "2<sup>3</sup>&times;3<sup>2</sup>&times;7"], "correct": 2, "explain": "252 = 4&times;63 = 4&times;9&times;7 = 2<sup>2</sup>&times;3<sup>2</sup>&times;7"}, {"tag": "Chapter 4", "q": "How many factors does 6 have?", "options": ["3", "2", "6", "4"], "correct": 3, "explain": "Factors of 6: 1, 2, 3, 6. Total: 4 factors."}, {"tag": "Chapter 4", "q": "What is the prime factorization of 60?", "options": ["2&times;3&times;5<sup>2</sup>", "2<sup>2</sup>&times;3&times;5", "2<sup>3</sup>&times;5", "2<sup>2</sup>&times;3<sup>2</sup>&times;5"], "correct": 1, "explain": "60 = 4&times;15 = 2<sup>2</sup>&times;3&times;5"}, {"tag": "Chapter 4", "q": "Find the sum of all factors for 8, 16, 32, and 64 (list each).", "options": ["15, 31, 63, 127", "16, 32, 64, 128", "15, 31, 62, 126", "14, 30, 62, 126"], "correct": 0, "explain": "8: 1+2+4+8=15. 16: 1+2+4+8+16=31. 32: 1+2+4+8+16+32=63. 64: 1+2+4+8+16+32+64=127."}, {"tag": "Chapter 4", "q": "How many factors does 11<sup>3</sup>&times;13<sup>1</sup>&times;17<sup>14</sup> have?", "options": ["60", "90", "120", "240"], "correct": 2, "explain": "Number of factors = (3+1)(1+1)(14+1) = 4&times;2&times;15 = 120"}, {"tag": "Chapter 5", "q": "How many odd factors does 2<sup>5</sup>&times;3<sup>8</sup>&times;7<sup>4</sup> have?", "options": ["40", "50", "45", "36"], "correct": 2, "explain": "Odd factors have no factor of 2. Count factors from 3<sup>8</sup>&times;7<sup>4</sup>: (8+1)(4+1) = 9&times;5 = 45"}, {"tag": "Chapter 5", "q": "How many perfect squares are between 1 and 100 inclusive?", "options": ["9", "10", "8", "11"], "correct": 1, "explain": "1<sup>2</sup>=1 through 10<sup>2</sup>=100. That&rsquo;s 10 perfect squares."}, {"tag": "Chapter 5", "q": "How many factors of 2<sup>2</sup>&times;3<sup>4</sup>&times;5<sup>3</sup> are perfect squares?", "options": ["18", "12", "6", "9"], "correct": 1, "explain": "For a perfect square, each prime&rsquo;s exponent must be even. For 2<sup>2</sup>: choices 0,2 (2 options). For 3<sup>4</sup>: choices 0,2,4 (3 options). For 5<sup>3</sup>: choices 0,2 (2 options). Total: 2&times;3&times;2 = 12"}, {"tag": "Chapter 5", "q": "Find the sum of all factors of 2<sup>5</sup>&times;3<sup>3</sup>&times;5<sup>3</sup> that are both perfect squares <b>and</b> divisible by 4.", "options": ["1040", "5200", "2600", "10400"], "correct": 1, "explain": "Perfect square factors: exponents must be even. Divisible by 4 means 2-exponent &ge; 2. So 2-exponent &isin; {2,4}, 3-exponent &isin; {0,2}, 5-exponent &isin; {0,2}. Sum = (2<sup>2</sup>+2<sup>4</sup>)(3<sup>0</sup>+3<sup>2</sup>)(5<sup>0</sup>+5<sup>2</sup>) = (4+16)(1+9)(1+25) = 20&times;10&times;26 = 5200"}, {"tag": "Chapter 6", "q": "Sasha has 3 half-dollars, 8 quarters, 11 dimes, 7 nickels, and 13 pennies. How much money does she have? (in dollars)", "options": ["$5.18", "$5.28", "$4.98", "$5.08"], "correct": 3, "explain": "3&times;0.50 + 8&times;0.25 + 11&times;0.10 + 7&times;0.05 + 13&times;0.01 = 1.50+2.00+1.10+0.35+0.13 = $5.08"}, {"tag": "Chapter 6", "q": "Alex bought 4 chocolate bars at $2 each and 5 lollipops at $0.50 each. He had a $20 bill. How much was left? (in dollars)", "options": ["$11.50", "$8.00", "$10.00", "$9.50"], "correct": 3, "explain": "4&times;2 + 5&times;0.5 = 8 + 2.5 = $10.50 spent. $20 &minus; $10.50 = $9.50 remaining."}, {"tag": "Chapter 6", "q": "A taxi charges $4.50 to start the meter and $1.10 per mile. Julie travels 15 miles. How much does she pay? (in dollars)", "options": ["$20.00", "$19.50", "$21.00", "$16.50"], "correct": 2, "explain": "$4.50 + 15&times;$1.10 = $4.50 + $16.50 = $21.00"}, {"tag": "Chapter 6", "q": "4 adults ($14 each) and 2 children ($5 each) visit an aquarium. What is the total cost? (in dollars)", "options": ["$58", "$66", "$70", "$62"], "correct": 1, "explain": "4&times;14 + 2&times;5 = 56 + 10 = $66"}, {"tag": "Chapter 7", "q": "Simplify: <span class=\"rad\"><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">100</span></span></span>", "options": ["10", "50", "20", "5"], "correct": 0, "explain": "<span class=\"rad\"><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">100</span></span></span> = 10, since 10<sup>2</sup> = 100"}, {"tag": "Chapter 7", "q": "Find the integer portion of the decimal representation of <span class=\"rad\"><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">19</span></span></span>.", "options": ["3", "9", "5", "4"], "correct": 3, "explain": "Since 4<sup>2</sup>=16 and 5<sup>2</sup>=25, we know 4 &lt; &radic;19 &lt; 5. The integer part is 4."}, {"tag": "Chapter 7", "q": "Simplify: (<span class=\"rad\"><span class=\"rad-idx\">3</span><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">27000000</span></span></span>)<sup>2</sup>", "options": ["90000", "9000", "900", "300"], "correct": 0, "explain": "27,000,000 = 3<sup>3</sup>&times;10<sup>6</sup>. &sup3;&radic;(27,000,000) = 3&times;10<sup>2</sup> = 300. 300<sup>2</sup> = 90,000"}, {"tag": "Chapter 7", "q": "Simplify: <span class=\"rad\"><span class=\"rad-idx\">2</span><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">11</span></span></span> &times; <span class=\"rad\"><span class=\"rad-idx\">3</span><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">11</span></span></span> &times; <span class=\"rad\"><span class=\"rad-idx\">6</span><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">11</span></span></span>", "options": ["11", "11<sup>2</sup>", "<span class=\"rad\"><span class=\"rad-sign\"><span class=\"rad-tick\">&radic;</span><span class=\"rad-body\">11</span></span></span>", "1"], "correct": 0, "explain": "11<sup>1/2</sup>&times;11<sup>1/3</sup>&times;11<sup>1/6</sup> = 11<sup>(3+2+1)/6</sup> = 11<sup>1</sup> = 11"}];
    
    var KEY='quiz_math_comp_28_v1',ATT_KEY='quiz_math_comp_attempts_v1';
    var state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};
    function loadState(){try{var r=localStorage.getItem(KEY);if(!r)return;var s=JSON.parse(r);if(typeof s.cur!=='number'||s.cur<0||s.cur>=QUESTIONS.length){localStorage.removeItem(KEY);return;}if(typeof s.answers!=='object'||Array.isArray(s.answers)){localStorage.removeItem(KEY);return;}if(typeof s.shuffles!=='object'||Array.isArray(s.shuffles)){localStorage.removeItem(KEY);return;}state=s;}catch(e){localStorage.removeItem(KEY);}}
    function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
    function getAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
    function incAtt(){localStorage.setItem(ATT_KEY,getAtt()+1);}
    function updAtt(){document.getElementById('attBar').textContent='Total Attempts: '+getAtt();}
    function getShuffle(qi){if(!state.shuffles[qi]){var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.shuffles[qi]=arr;saveState();}return state.shuffles[qi];}
    function getRetryShuffle(pos){if(!state.retry.shuffles[pos]){var qi=state.retry.indices[pos];var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.retry.shuffles[pos]=arr;saveState();}return state.retry.shuffles[pos];}
    function aAns(){return(state.mode==='retry'&&state.retry)?state.retry.answers:state.answers;}
    function aShuf(pos,qi){return(state.mode==='retry'&&state.retry)?getRetryShuffle(pos):getShuffle(qi);}
    function buildDots(){var nd=document.getElementById('navDots');nd.innerHTML='';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var label=state.showResults?'Results':(state.cur+1)+' / '+total;var pill=document.createElement('span');pill.style.cssText='background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;align-self:center;';pill.textContent=label;nd.appendChild(pill);var ans=aAns();indices.forEach(function(qi,pos){var d=document.createElement('button');d.className='dot';d.textContent=pos+1;var a=ans[pos];if(a!==undefined&&a!==null){d.className+=(QUESTIONS[qi].correct===a)?' correct':' wrong';}if(!state.showResults&&pos===state.cur)d.className+=' current';d.onclick=(function(p){return function(){state.cur=p;state.showResults=false;saveState();render();};})(pos);nd.appendChild(d);});}
    function render(){try{buildDots();if(state.showResults){showResults();return;}document.getElementById('resultsArea').style.display='none';var qa=document.getElementById('quizArea');qa.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var pos=state.cur;var qi=indices[pos];var q=QUESTIONS[qi];var shuffle=aShuf(pos,qi);var ans=aAns();var chosen=ans[pos];var answered=chosen!==undefined&&chosen!==null;var html='<div class="card">';html+='<span class="tag-badge">'+q.tag+'</span>';html+='<div class="qnum">Question '+(pos+1)+' of '+total+'</div>';html+='<div class="qtext">'+q.q+'</div>';html+='<div class="options">';shuffle.forEach(function(oi){var opt=q.options[oi];var cls='opt-btn';if(answered){if(oi===q.correct)cls+=' reveal';if(oi===chosen&&chosen!==q.correct)cls+=' wrong';}html+='<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="pick('+pos+','+oi+')">'+opt+'</button>';});html+='</div>';if(answered&&chosen!==q.correct){html+='<div class="explain-box" style="display:block;">'+q.explain+'</div>';}html+='<div class="nav-btns">';html+='<button class="nav-btn" onclick="go(-1)"'+(pos===0?' disabled':'')+'>Prev</button>';if(pos<total-1){html+='<button class="nav-btn" onclick="go(1)">Next</button>';}else{html+='<button class="nav-btn" onclick="finishQuiz()">See Results &rarr;</button>';}html+='</div></div>';qa.innerHTML=html;}catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red;">Render error: '+e.message+'</p></div>';}}
    function pick(pos,oi){var ans=aAns();if(ans[pos]!==undefined)return;ans[pos]=oi;saveState();render();}
    function go(dir){var total=state.mode==='retry'?state.retry.indices.length:QUESTIONS.length;state.cur=Math.max(0,Math.min(total-1,state.cur+dir));saveState();render();}
    function finishQuiz(){state.showResults=true;incAtt();updAtt();saveState();render();}
    function showResults(){document.getElementById('quizArea').style.display='none';var ra=document.getElementById('resultsArea');ra.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var c=0,w=0,s=0;indices.forEach(function(qi,pos){var a=ans[pos];if(a===undefined||a===null)s++;else if(QUESTIONS[qi].correct===a)c++;else w++;});var html='<div class="results-card"><div class="results-title">Results</div>';html+='<p style="text-align:center;margin-bottom:12px;font-size:1rem;">Correct: <b style="color:#1D9E75;">'+c+'</b> / '+indices.length+' &nbsp; Wrong: <b style="color:#E24B4A;">'+w+'</b> &nbsp; Skipped: <b style="color:#888;">'+s+'</b></p>';html+='<div class="results-grid">';indices.forEach(function(qi,pos){var a=ans[pos];var cls=(a===undefined||a===null)?'skipped':(QUESTIONS[qi].correct===a?'correct':'wrong');var lbl=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');html+='<div class="res-item '+cls+'" onclick="goToQ('+pos+')">Q'+(pos+1)+': '+lbl+'</div>';});html+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">';if(w>0)html+='<button class="action-btn" onclick="startRetry()">Retry Wrong Questions</button>';html+='<button class="action-btn secondary" onclick="copyRes()">Copy All Results</button>';html+='<button class="action-btn secondary" onclick="document.getElementById(\'freshModal\').classList.add(\'show\')">Start Fresh</button>';html+='</div></div>';ra.innerHTML=html;}
    function goToQ(pos){state.cur=pos;state.showResults=false;saveState();render();}
    function startRetry(){var wrong=[];state.answers&&Object.keys(state.answers).forEach(function(p){var pos=parseInt(p);var indices=QUESTIONS.map(function(_,i){return i;});var qi=indices[pos];var a=state.answers[pos];if(a!==undefined&&a!==null&&QUESTIONS[qi].correct!==a)wrong.push(qi);});if(!wrong.length)return;state.mode='retry';state.retry={indices:wrong,answers:{},shuffles:{}};state.cur=0;state.showResults=false;saveState();render();}
    function copyRes(){var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var lines=['[Grant] Math Competition — 2026-06-09'];indices.forEach(function(qi,pos){var a=ans[pos];var st=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');lines.push('Q'+(pos+1)+': '+st);});var text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
    function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
    function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};document.getElementById('freshModal').classList.remove('show');saveState();render();}
    function speak(text,lang){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}

    window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;window.speak=speak;
    loadState();updAtt();render();
  }catch(e){document.body.innerHTML+='<div style="color:red;padding:20px;">Fatal error: '+e.message+'</div>';}
})();
