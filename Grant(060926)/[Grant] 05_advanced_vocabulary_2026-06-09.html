<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}.container{max-width:800px;margin:0 auto}.date-header{text-align:center;font-size:2rem;font-weight:800;color:#185FA5;background:#fff;padding:12px 20px 4px;border-radius:12px 12px 0 0}.quiz-title{text-align:center;font-size:1.3rem;font-weight:700;color:#185FA5;background:#fff;padding:4px 20px 8px}.attempts-bar{text-align:center;font-size:.9rem;color:#555;background:#fff;padding:4px 20px 12px;border-radius:0 0 12px 12px;margin-bottom:12px}.nav-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;padding:12px;background:#fff;border-radius:12px}.dot{width:34px;height:34px;border-radius:50%;border:2px solid #185FA5;background:#e8edf4;color:#185FA5;font-weight:700;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}.dot.correct{background:#1D9E75;border-color:#1D9E75;color:#fff}.dot.wrong{background:#E24B4A;border-color:#E24B4A;color:#fff}.dot.current{border-width:3px}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:12px}.tag-badge{display:inline-block;background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;margin-bottom:10px}.qnum{font-size:.85rem;color:#888;margin-bottom:6px}.qtext{font-size:1.05rem;line-height:1.6;color:#111;margin-bottom:16px}.options{display:flex;flex-direction:column;gap:8px}.opt-btn{background:#e8edf4;color:#111111;border:2px solid transparent;border-radius:8px;padding:10px 14px;font-size:.95rem;cursor:pointer;text-align:left;transition:all .15s;line-height:1.4}.opt-btn:hover:not(:disabled){border-color:#185FA5}.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041}.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313}.opt-btn.reveal{background:#E1F5EE;border-color:#1D9E75;color:#085041}.explain-box{margin-top:12px;background:#f8f0e8;border-left:4px solid #185FA5;border-radius:6px;padding:10px 14px;font-size:.9rem;color:#333;line-height:1.5;display:none}.nav-btns{display:flex;gap:10px;justify-content:space-between;margin-top:16px}.nav-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:.95rem;font-weight:600;cursor:pointer}.nav-btn:disabled{background:#ccc;cursor:not-allowed}.results-card{background:#fff;border-radius:12px;padding:20px}.results-title{font-size:1.4rem;font-weight:800;color:#185FA5;margin-bottom:16px;text-align:center}.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}.res-item{border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.85rem}.res-item.correct{background:#E1F5EE;border:1.5px solid #1D9E75;color:#085041}.res-item.wrong{background:#FCEBEB;border:1.5px solid #E24B4A;color:#501313}.res-item.skipped{background:#f5f5f5;border:1.5px solid #aaa;color:#555}.action-btn{background:#185FA5;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.9rem;font-weight:600;cursor:pointer;margin:4px}.action-btn.secondary{background:#e8edf4;color:#185FA5}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}.modal-overlay.show{display:flex}.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:340px;width:90%;text-align:center}.modal-box p{margin-bottom:16px;font-size:1rem}.speakbtn{background:none;border:none;cursor:pointer;color:#185FA5;font-size:1.1rem;padding:0 6px;vertical-align:middle}.fraction{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.1}.fraction .num{border-bottom:1.5px solid currentColor;padding:0 3px}.fraction .den{padding:0 3px}.rad{display:inline-flex;align-items:center;vertical-align:middle;line-height:1}.rad-idx{font-size:.6em;line-height:1;align-self:flex-start;margin-top:.1em;margin-right:1px}.rad-sign{display:inline-flex;align-items:center;line-height:1}.rad-tick{font-size:1.35em;line-height:1;position:relative;top:.06em}.rad-body{border-top:2px solid currentColor;padding:1px 5px 1px 1px;display:inline-flex;align-items:center;line-height:1.25;flex-wrap:nowrap;gap:2px}.passage-box{background:#f9f9f9;border:1px solid #d0d8e8;border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:.95rem;line-height:1.7;color:#222}@media(max-width:600px){.qtext{font-size:.97rem}.opt-btn{font-size:.9rem}}</style>
</head>
<body>
<div class="container">
  <div class="date-header">2026-06-09</div>
  <div class="quiz-title">[Grant] Advanced Vocabulary</div>
  <div class="attempts-bar" id="attBar">Total Attempts: 0</div>
  <div class="nav-dots" id="navDots"></div>
  <div id="quizArea" style="display:none;"></div>
  <div id="resultsArea" style="display:none;"></div>
</div>
<div class="modal-overlay" id="freshModal">
  <div class="modal-box"><p>Start fresh and reset all progress?</p>
  <button class="action-btn" onclick="confirmFresh()">Yes, Start Fresh</button>
  <button class="action-btn secondary" onclick="document.getElementById('freshModal').classList.remove('show')">Cancel</button>
  </div>
</div>
<script>
(function(){
  try{
    var QUESTIONS=[{"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">supplement</span> <button class=\"speakbtn\" onclick=\"speak('supplement','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a document of formal protest", "a competing alternative", "something added to complete, enhance, or extend something else", "the main core component"], "correct": 2, "explain": "<b>supplement</b>: something added to complete, enhance, or extend something else"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">initiative</span> <button class=\"speakbtn\" onclick=\"speak('initiative','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["an inability to make decisions", "the ability to assess and act independently; a new plan or action", "complete dependence on others", "a failure to act when needed"], "correct": 1, "explain": "<b>initiative</b>: the ability to assess and act independently; a new plan or action"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">legislation</span> <button class=\"speakbtn\" onclick=\"speak('legislation','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["an informal community agreement", "laws considered collectively; the process of making and enacting laws", "a personal opinion on public affairs", "a voluntary code of conduct"], "correct": 1, "explain": "<b>legislation</b>: laws considered collectively; the process of making and enacting laws"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">elaborate</span> <button class=\"speakbtn\" onclick=\"speak('elaborate','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["disorganized and incomplete", "brief and easy to understand", "simple and straightforward", "involving many carefully arranged parts; to develop in detail"], "correct": 3, "explain": "<b>elaborate</b>: involving many carefully arranged parts; to develop in detail"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">demonstrate</span> <button class=\"speakbtn\" onclick=\"speak('demonstrate','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["to conceal or hide information", "clearly show the existence or truth of something by evidence or example", "to formally disagree with findings", "to delay or postpone indefinitely"], "correct": 1, "explain": "<b>demonstrate</b>: clearly show the existence or truth of something by evidence or example"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">governance</span> <button class=\"speakbtn\" onclick=\"speak('governance','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["the action or manner of governing a state, organization, or people", "a method of artistic expression", "the process of scientific discovery", "a technique of physical construction"], "correct": 0, "explain": "<b>governance</b>: the action or manner of governing a state, organization, or people"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">fundamental</span> <button class=\"speakbtn\" onclick=\"speak('fundamental','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["forming a necessary base or core; of central importance", "minor and unimportant", "temporary and changeable", "optional and decorative"], "correct": 0, "explain": "<b>fundamental</b>: forming a necessary base or core; of central importance"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">apprentice</span> <button class=\"speakbtn\" onclick=\"speak('apprentice','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a senior expert in a field", "an appointed government official", "a person learning a skilled trade from an experienced employer", "an elected community leader"], "correct": 2, "explain": "<b>apprentice</b>: a person learning a skilled trade from an experienced employer"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">deliberate</span> <button class=\"speakbtn\" onclick=\"speak('deliberate','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["done without thinking; accidental", "done consciously and intentionally; careful and unhurried in manner", "extremely fast and impulsive", "vague and poorly defined"], "correct": 1, "explain": "<b>deliberate</b>: done consciously and intentionally; careful and unhurried in manner"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">perspective</span> <button class=\"speakbtn\" onclick=\"speak('perspective','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a particular attitude toward or way of regarding a situation or problem", "an absolute universal truth", "a definitive factual conclusion", "a mandatory official position"], "correct": 0, "explain": "<b>perspective</b>: a particular attitude toward or way of regarding a situation or problem"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">mechanism</span> <button class=\"speakbtn\" onclick=\"speak('mechanism','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["an official legal ruling", "a written record of decisions", "a system of parts that work together; a natural or established process", "a formal public debate"], "correct": 2, "explain": "<b>mechanism</b>: a system of parts that work together; a natural or established process"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">evaluate</span> <button class=\"speakbtn\" onclick=\"speak('evaluate','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["to ignore completely", "assess or judge the value, quality, or significance of something", "to accept without question", "to create from nothing"], "correct": 1, "explain": "<b>evaluate</b>: assess or judge the value, quality, or significance of something"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">conflict</span> <button class=\"speakbtn\" onclick=\"speak('conflict','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a gradual process of change", "a formal written agreement", "a serious disagreement or prolonged struggle between opposing forces", "a state of mutual cooperation"], "correct": 2, "explain": "<b>conflict</b>: a serious disagreement or prolonged struggle between opposing forces"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">hallmark</span> <button class=\"speakbtn\" onclick=\"speak('hallmark','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["an error in official documentation", "a distinctive feature or characteristic that identifies something", "a random coincidence", "a temporary setback"], "correct": 1, "explain": "<b>hallmark</b>: a distinctive feature or characteristic that identifies something"}, {"tag": "Advanced Vocabulary", "q": "<span style=\"font-size:1.3rem;font-weight:700;\">ideology</span> <button class=\"speakbtn\" onclick=\"speak('ideology','en-US')\" title=\"Listen\">&#128264;</button><br><small style=\"color:#555;\">Choose the best definition.</small>", "options": ["a purely technical procedure", "a system of ideas and ideals forming the basis of a political or economic policy", "a single isolated opinion", "a random collection of facts"], "correct": 1, "explain": "<b>ideology</b>: a system of ideas and ideals forming the basis of a political or economic policy"}];
    
    var KEY='quiz_adv_vocab_15_v1',ATT_KEY='quiz_adv_vocab_attempts_v1';
    var state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};
    function loadState(){try{var r=localStorage.getItem(KEY);if(!r)return;var s=JSON.parse(r);if(typeof s.cur!=='number'||s.cur<0||s.cur>=QUESTIONS.length){localStorage.removeItem(KEY);return;}if(typeof s.answers!=='object'||Array.isArray(s.answers)){localStorage.removeItem(KEY);return;}if(typeof s.shuffles!=='object'||Array.isArray(s.shuffles)){localStorage.removeItem(KEY);return;}state=s;}catch(e){localStorage.removeItem(KEY);}}
    function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
    function getAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0');}
    function incAtt(){localStorage.setItem(ATT_KEY,getAtt()+1);}
    function updAtt(){document.getElementById('attBar').textContent='Total Attempts: '+getAtt();}
    function getShuffle(qi){if(!state.shuffles[qi]){var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.shuffles[qi]=arr;saveState();}return state.shuffles[qi];}
    function getRetryShuffle(pos){if(!state.retry.shuffles[pos]){var qi=state.retry.indices[pos];var arr=QUESTIONS[qi].options.map(function(o,i){return i;});for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}state.retry.shuffles[pos]=arr;saveState();}return state.retry.shuffles[pos];}
    function aAns(){return(state.mode==='retry'&&state.retry)?state.retry.answers:state.answers;}
    function aShuf(pos,qi){return(state.mode==='retry'&&state.retry)?getRetryShuffle(pos):getShuffle(qi);}
    function buildDots(){var nd=document.getElementById('navDots');nd.innerHTML='';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var label=state.showResults?'Results':(state.cur+1)+' / '+total;var pill=document.createElement('span');pill.style.cssText='background:#185FA5;color:#fff;border-radius:20px;padding:3px 12px;font-size:.78rem;font-weight:600;align-self:center;';pill.textContent=label;nd.appendChild(pill);var ans=aAns();indices.forEach(function(qi,pos){var d=document.createElement('button');d.className='dot';d.textContent=pos+1;var a=ans[pos];if(a!==undefined&&a!==null){d.className+=(QUESTIONS[qi].correct===a)?' correct':' wrong';}if(!state.showResults&&pos===state.cur)d.className+=' current';d.onclick=(function(p){return function(){state.cur=p;state.showResults=false;saveState();render();};})(pos);nd.appendChild(d);});}
    function render(){try{buildDots();if(state.showResults){showResults();return;}document.getElementById('resultsArea').style.display='none';var qa=document.getElementById('quizArea');qa.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var total=indices.length;var pos=state.cur;var qi=indices[pos];var q=QUESTIONS[qi];var shuffle=aShuf(pos,qi);var ans=aAns();var chosen=ans[pos];var answered=chosen!==undefined&&chosen!==null;var html='<div class="card">';html+='<span class="tag-badge">'+q.tag+'</span>';html+='<div class="qnum">Question '+(pos+1)+' of '+total+'</div>';html+='<div class="qtext">'+q.q+'</div>';html+='<div class="options">';shuffle.forEach(function(oi){var opt=q.options[oi];var cls='opt-btn';if(answered){if(oi===q.correct)cls+=' reveal';if(oi===chosen&&chosen!==q.correct)cls+=' wrong';}html+='<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="pick('+pos+','+oi+')">'+opt+'</button>';});html+='</div>';if(answered&&chosen!==q.correct){html+='<div class="explain-box" style="display:block;">'+q.explain+'</div>';}html+='<div class="nav-btns">';html+='<button class="nav-btn" onclick="go(-1)"'+(pos===0?' disabled':'')+'>Prev</button>';if(pos<total-1){html+='<button class="nav-btn" onclick="go(1)">Next</button>';}else{html+='<button class="nav-btn" onclick="finishQuiz()">See Results &rarr;</button>';}html+='</div></div>';qa.innerHTML=html;}catch(e){document.getElementById('quizArea').innerHTML='<div class="card"><p style="color:red;">Render error: '+e.message+'</p></div>';}}
    function pick(pos,oi){var ans=aAns();if(ans[pos]!==undefined)return;ans[pos]=oi;saveState();render();}
    function go(dir){var total=state.mode==='retry'?state.retry.indices.length:QUESTIONS.length;state.cur=Math.max(0,Math.min(total-1,state.cur+dir));saveState();render();}
    function finishQuiz(){state.showResults=true;incAtt();updAtt();saveState();render();}
    function showResults(){document.getElementById('quizArea').style.display='none';var ra=document.getElementById('resultsArea');ra.style.display='block';var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var c=0,w=0,s=0;indices.forEach(function(qi,pos){var a=ans[pos];if(a===undefined||a===null)s++;else if(QUESTIONS[qi].correct===a)c++;else w++;});var html='<div class="results-card"><div class="results-title">Results</div>';html+='<p style="text-align:center;margin-bottom:12px;font-size:1rem;">Correct: <b style="color:#1D9E75;">'+c+'</b> / '+indices.length+' &nbsp; Wrong: <b style="color:#E24B4A;">'+w+'</b> &nbsp; Skipped: <b style="color:#888;">'+s+'</b></p>';html+='<div class="results-grid">';indices.forEach(function(qi,pos){var a=ans[pos];var cls=(a===undefined||a===null)?'skipped':(QUESTIONS[qi].correct===a?'correct':'wrong');var lbl=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');html+='<div class="res-item '+cls+'" onclick="goToQ('+pos+')">Q'+(pos+1)+': '+lbl+'</div>';});html+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">';if(w>0)html+='<button class="action-btn" onclick="startRetry()">Retry Wrong Questions</button>';html+='<button class="action-btn secondary" onclick="copyRes()">Copy All Results</button>';html+='<button class="action-btn secondary" onclick="document.getElementById(\'freshModal\').classList.add(\'show\')">Start Fresh</button>';html+='</div></div>';ra.innerHTML=html;}
    function goToQ(pos){state.cur=pos;state.showResults=false;saveState();render();}
    function startRetry(){var wrong=[];state.answers&&Object.keys(state.answers).forEach(function(p){var pos=parseInt(p);var indices=QUESTIONS.map(function(_,i){return i;});var qi=indices[pos];var a=state.answers[pos];if(a!==undefined&&a!==null&&QUESTIONS[qi].correct!==a)wrong.push(qi);});if(!wrong.length)return;state.mode='retry';state.retry={indices:wrong,answers:{},shuffles:{}};state.cur=0;state.showResults=false;saveState();render();}
    function copyRes(){var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var lines=['[Grant] Advanced Vocabulary — 2026-06-09'];indices.forEach(function(qi,pos){var a=ans[pos];var st=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');lines.push('Q'+(pos+1)+': '+st);});var text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
    function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
    function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};document.getElementById('freshModal').classList.remove('show');saveState();render();}
    function speak(text,lang){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}

    window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;window.speak=speak;
    loadState();updAtt();render();
  }catch(e){document.body.innerHTML+='<div style="color:red;padding:20px;">Fatal error: '+e.message+'</div>';}
})();
</script>
</body></html>
