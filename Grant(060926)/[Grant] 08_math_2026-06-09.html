5 + 0.375 &times; 0.8", "options": ["1.000", "0.875", "0.800", "0.925"], "correct": 3, "explain": "Multiply first: 0.375 &times; 0.8 = 0.300. Then: 0.625 + 0.300 = 0.925"}, {"tag": "Integers", "q": "Compute: (&minus;3)<sup>2</sup> &times; 4 &minus; 20 &divide; (&minus;5) + (&minus;6)", "options": ["18", "40", "24", "34"], "correct": 3, "explain": "(&minus;3)<sup>2</sup>=9, 9&times;4=36, 20&divide;(&minus;5)=&minus;4, so 36&minus;(&minus;4)+(&minus;6)=36+4&minus;6=34"}, {"tag": "Integers", "q": "Compute: (&minus;8 + 3) &times; (&minus;2)<sup>2</sup> + 15 &divide; (&minus;3)", "options": ["&minus;15", "25", "&minus;25", "&minus;5"], "correct": 2, "explain": "(&minus;8+3)=&minus;5, (&minus;2)<sup>2</sup>=4, &minus;5&times;4=&minus;20, 15&divide;(&minus;3)=&minus;5, total=&minus;25"}, {"tag": "Integers", "q": "Compute: 6 &times; (&minus;4 + 7) &minus; (&minus;3)<sup>2</sup> &times; 2", "options": ["36", "0", "&minus;18", "18"], "correct": 1, "explain": "&minus;4+7=3, 6&times;3=18, (&minus;3)<sup>2</sup>=9, 9&times;2=18, 18&minus;18=0"}, {"tag": "Integers", "q": "Compute: (&minus;4)<sup>2</sup> &divide; 8 + (&minus;3) &times; 6 &minus; (&minus;5)", "options": ["&minus;11", "&minus;6", "&minus;3", "&minus;18"], "correct": 0, "explain": "(&minus;4)<sup>2</sup>=16, 16&divide;8=2, (&minus;3)&times;6=&minus;18, 2&minus;18&minus;(&minus;5)=2&minus;18+5=&minus;11"}, {"tag": "Unit Conversion", "q": "How many ounces are in 3.5 pounds? (1 pound = 16 ounces)", "options": ["60 oz", "48 oz", "56 oz", "52 oz"], "correct": 2, "explain": "3.5 &times; 16 = 56 ounces"}, {"tag": "Unit Conversion", "q": "How many minutes are in 2<span class=\"fraction\"><span class=\"num\">3</span><span class=\"den\">4</span></span> hours?", "options": ["155 min", "175 min", "165 min", "160 min"], "correct": 2, "explain": "2<span class=\"fraction\"><span class=\"num\">3</span><span class=\"den\">4</span></span> = <span class=\"fraction\"><span class=\"num\">11</span><span class=\"den\">4</span></span> hours     function goToQ(pos){state.cur=pos;state.showResults=false;saveState();render();}
    function startRetry(){var wrong=[];state.answers&&Object.keys(state.answers).forEach(function(p){var pos=parseInt(p);var indices=QUESTIONS.map(function(_,i){return i;});var qi=indices[pos];var a=state.answers[pos];if(a!==undefined&&a!==null&&QUESTIONS[qi].correct!==a)wrong.push(qi);});if(!wrong.length)return;state.mode='retry';state.retry={indices:wrong,answers:{},shuffles:{}};state.cur=0;state.showResults=false;saveState();render();}
    function copyRes(){var indices=state.mode==='retry'?state.retry.indices:QUESTIONS.map(function(_,i){return i;});var ans=aAns();var lines=['[Grant] Math — 2026-06-09'];indices.forEach(function(qi,pos){var a=ans[pos];var st=(a===undefined||a===null)?'Skipped':(QUESTIONS[qi].correct===a?'Correct':'Wrong');lines.push('Q'+(pos+1)+': '+st);});var text=lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(function(){fallbackCopy(text);});}else{fallbackCopy(text);}}
    function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
    function confirmFresh(){localStorage.removeItem(KEY);state={cur:0,answers:{},shuffles:{},showResults:false,mode:'normal',retry:null};document.getElementById('freshModal').classList.remove('show');saveState();render();}
    function speak(text,lang){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;window.speechSynthesis.speak(u);}

    window.pick=pick;window.go=go;window.finishQuiz=finishQuiz;window.goToQ=goToQ;window.startRetry=startRetry;window.copyRes=copyRes;window.confirmFresh=confirmFresh;window.speak=speak;
    loadState();updAtt();render();
  }catch(e){document.body.innerHTML+='<div style="color:red;padding:20px;">Fatal error: '+e.message+'</div>';}
})();
</script>
