They want Asian chestnuts to replace every American chestnut in the forest.", "They want the young trees to drop even more nuts than the old giants did.", "They hope a new tree will be tall like the American chestnut and able to fight off the fungus like the Asian chestnut.", "They believe American chestnuts were never as tall as people remember."], "ci": 2, "exp": "The passage gives two clues: Asian chestnuts &ldquo;could resist&rdquo; the fungus, and the scientists hope for a seedling &ldquo;that is both tall and able to survive the fungus.&rdquo; Putting the clues together, each kind of tree gives one strength: height from the American chestnut, protection from the Asian chestnut. The goal is to <i>bring the giant back</i>, not replace it, and nothing says scientists doubt how tall the trees were or want more nuts.", "tag": "Inference", "tagcolor": "#185FA5"}, {"passage": "<strong>The Lost Giants of the Forest</strong><br>A century ago, one of every four trees in the forests of the Appalachian Mountains was an American chestnut. These towering giants could grow more than one hundred feet tall, and every autumn they dropped so many nuts that the forest floor was buried beneath them. Deer, wild turkeys, and squirrels depended on the nuts to survive the winter, and mountain families gathered them by the bushel to sell in town.<br><br>Then, in 1904, a worker at the Bronx Zoo in New York noticed that several chestnut trees had strange orange spots on their bark. The cause was a fungus that had arrived on chestnut trees imported from Asia. Asian chestnuts had lived alongside the fungus for thousands of years and could resist it, but American chestnuts had no defense. Carried by wind, rain, and even the feet of birds, the fungus spread from forest to forest, and within forty years nearly four billion trees had died.<br><br>Because the chestnuts vanished, the animals that relied on them had to search for other food, and many mountain families lost an important source of income. Today, diligent scientists are trying to bring the giant back. Some cultivate young trees that combine American and Asian chestnuts, hoping a seedling will emerge that is both tall and able to survive the fungus.", "stem": "Read this sentence from the passage.<br>&ldquo;Because the chestnuts vanished, the animals that relied on them had to search for other food, and many mountain families lost an important source of <b>income</b>.&rdquo;<br>What does <b>income</b> mean?", "opts": ["food that people store for the winter", "wood that people burn for heat", "money that people earn", "land where people build their homes"], "ci": 2, "exp": "Earlier the passage says families &ldquo;gathered them by the bushel to <b>sell</b> in town.&rdquo; Selling nuts brings in money, so <b>income</b> means money people earn. &ldquo;Food stored for the winter&rdquo; is tempting because animals needed the nuts for food, but the sentence is about what the <i>families</i> lost when they could no longer sell nuts.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>A Shortcut Between Oceans</strong><br>For centuries, ships traveling between the Atlantic and Pacific Oceans had to sail around the southern tip of South America, a voyage that could take months. In the 1880s, a French company attempted to dig a canal across the narrow Isthmus of Panama, but the effort collapsed. Heavy rains triggered mudslides that buried completed work, and tropical diseases spread by mosquitoes killed thousands of laborers.<br><br>When the United States took over the project in 1904, officials were determined to ensure that those failures would not be repeated. Dr. William Gorgas, an army physician, persuaded leaders that the mosquitoes themselves had to be defeated. His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred. Within a few years, yellow fever had vanished from the canal zone, and far fewer workers fell ill.<br><br>Engineers also changed the plan. Rather than cutting a channel all the way down to sea level, they dammed a river to create an enormous lake and built giant locks that raise ships about 85 feet to reach it. When the canal opened in 1914, a voyage from New York to San Francisco became roughly 8,000 miles shorter.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>The passage says that Dr. Gorgas&rsquo;s crews worked to defeat the mosquitoes. Which of these is an <b>example</b> of something the crews did to defeat the mosquitoes?", "opts": ["Yellow fever vanished from the canal zone.", "They decided that the mosquitoes had to be defeated.", "Engineers dammed a river to make a lake.", "They covered windows with screens."], "tag": "Example", "tagcolor": "#185FA5", "hint": "An <b>example</b> is one specific thing, action, or event that shows the bigger idea. It is <i>not</i> the big idea said again in other words, and it is <i>not</i> a result of the idea.", "exp": "<b>What is an example?</b> An example is <b>one specific case</b> that shows a bigger idea. Big idea: the crews worked to defeat the mosquitoes. A specific action they took: &ldquo;covered windows with screens.&rdquo; That is an example.<br><b>Why not the others:</b> &ldquo;They decided the mosquitoes had to be defeated&rdquo; just says the big idea again &mdash; it is not one specific thing they did; &ldquo;Yellow fever vanished from the canal zone&rdquo; is a <i>result</i> of their work, not an example of it; &ldquo;Engineers dammed a river to make a lake&rdquo; is true, but it is an example of a different idea (changing the canal plan).<br><b>Test:</b> put &ldquo;For example,&rdquo; in front: &ldquo;The crews fought the mosquitoes. <i>For example,</i> they covered windows with screens.&rdquo; If it sounds right and shows the idea, it is an example.", "ci": 3}, {"passage": "<strong>A Shortcut Between Oceans</strong><br>For centuries, ships traveling between the Atlantic and Pacific Oceans had to sail around the southern tip of South America, a voyage that could take months. In the 1880s, a French company attempted to dig a canal across the narrow Isthmus of Panama, but the effort collapsed. Heavy rains triggered mudslides that buried completed work, and tropical diseases spread by mosquitoes killed thousands of laborers.<br><br>When the United States took over the project in 1904, officials were determined to ensure that those failures would not be repeated. Dr. William Gorgas, an army physician, persuaded leaders that the mosquitoes themselves had to be defeated. His crews drained standing water, covered windows with screens, and sprayed oil on ponds where insects bred. Within a few years, yellow fever had vanished from the canal zone, and far fewer workers fell ill.<br><br>Engineers also changed the plan. Rather than cutting a channel all the way down to sea level, they dammed a river to create an enormous lake and built giant locks that raise ships about 85 feet to reach it. When the canal opened in 1914, a voyage from New York to San Francisco became roughly 8,000 miles shorter.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Heavy rains soaked the isthmus.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> Yellow fever vanished from the canal zone.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> Mosquitoes spread tropical diseases.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> The trip from New York to San Francisco became about 8,000 miles shorter.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Crews drained standing water and sprayed oil on ponds.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> Mudslides buried work that was already finished.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The canal opened in 1914.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> Thousands of laborers died.</td></tr></table>Which choice matches every cause with the correct effect?", "opts": ["1–D, 2–C, 3–A, 4–B", "1–C, 2–A, 3–D, 4–B", "1–A, 2–B, 3–C, 4–D", "1–C, 2–D, 3–A, 4–B"], "ci": 3, "exp": "Test each pair with &ldquo;Because ___, ___.&rdquo; <b>1–C:</b> Because heavy rains fell, &ldquo;mudslides &hellip; buried completed work.&rdquo; <b>2–D:</b> Because mosquitoes spread disease, they &ldquo;killed thousands of laborers.&rdquo; <b>3–A:</b> Because crews drained water and sprayed ponds, &ldquo;yellow fever had vanished from the canal zone.&rdquo; <b>4–B:</b> Because the canal opened, the voyage &ldquo;became roughly 8,000 miles shorter.&rdquo;<br><b>Watch out:</b> the letters are not in the same order as the numbers &mdash; matching 1–A, 2–B, 3–C, 4–D just copies the order. Read each effect and ask which cause made it happen.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A"}, {"passage": "<strong>The Starter</strong><br>Marcus lifted the lid of the glass jar and frowned. Grandma Dee&rsquo;s sourdough starter, which usually rose into a bubbly dome, lay flat and gray, and a thin layer of brown liquid floated on top.<br><br>&ldquo;I think I killed it,&rdquo; he said. &ldquo;I forgot to feed it all week because of soccer tournaments.&rdquo;<br><br>Grandma Dee peered into the jar. &ldquo;It&rsquo;s hungry, not dead. That liquid means the yeast ran out of flour to eat.&rdquo; She handed him a spoon. &ldquo;Pour that off, then stir in fresh flour and water. Every morning and every night, same time.&rdquo;<br><br>For three days Marcus set an alarm on his phone so he wouldn&rsquo;t forget. On the first day, nothing happened, and he was tempted to quit. On the second, he caught a glimpse of a few tiny bubbles along the side of the glass. By the third morning, the starter had climbed nearly to the rim, and it smelled sweet and sour, like fresh yogurt.<br><br>&ldquo;Now it&rsquo;s strong enough to bake with,&rdquo; Grandma Dee said, tying on her apron. &ldquo;A starter is like a friend. Ignore it, and it fades. Show up every day, and it grows strong.&rdquo;", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Read this sentence from the story.<br><br>&ldquo;On the first day, nothing happened, and he was <b>tempted</b> to quit.&rdquo;<br><br>Which word means the <b>SAME</b> or nearly the same as <i>tempted</i> as it is used in the sentence?", "opts": ["forbidden", "reluctant", "inclined", "proud"], "ci": 2, "exp": "<i>Tempted</i> means feeling a pull to do something. When nothing happened, Marcus felt like quitting &mdash; he was <i>inclined</i> (leaning toward) to quit.<br><b>Why not the others:</b> <i>reluctant</i> is the trap: it means <i>unwilling</i>, nearly the opposite; <i>forbidden</i> means not allowed; <i>proud</i> does not fit someone who wants to give up.", "tag": "Synonym", "tagcolor": "#185FA5"}, {"passage": "<strong>The Starter</strong><br>Marcus lifted the lid of the glass jar and frowned. Grandma Dee&rsquo;s sourdough starter, which usually rose into a bubbly dome, lay flat and gray, and a thin layer of brown liquid floated on top.<br><br>&ldquo;I think I killed it,&rdquo; he said. &ldquo;I forgot to feed it all week because of soccer tournaments.&rdquo;<br><br>Grandma Dee peered into the jar. &ldquo;It&rsquo;s hungry, not dead. That liquid means the yeast ran out of flour to eat.&rdquo; She handed him a spoon. &ldquo;Pour that off, then stir in fresh flour and water. Every morning and every night, same time.&rdquo;<br><br>For three days Marcus set an alarm on his phone so he wouldn&rsquo;t forget. On the first day, nothing happened, and he was tempted to quit. On the second, he caught a glimpse of a few tiny bubbles along the side of the glass. By the third morning, the starter had climbed nearly to the rim, and it smelled sweet and sour, like fresh yogurt.<br><br>&ldquo;Now it&rsquo;s strong enough to bake with,&rdquo; Grandma Dee said, tying on her apron. &ldquo;A starter is like a friend. Ignore it, and it fades. Show up every day, and it grows strong.&rdquo;", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the story, what happened as a result of Marcus feeding the starter every morning and every night? <b>Select ALL that apply.</b>", "opts": ["Tiny bubbles appeared along the side of the glass.", "On the first day, the starter doubled in size.", "The starter climbed nearly to the rim of the jar.", "A layer of brown liquid formed on top of the starter.", "Grandma Dee decided to bake the bread without him."], "ci": 0, "exp": "Because Marcus fed it on schedule, the starter slowly came back:<br>&#10003; &ldquo;On the second, he caught a glimpse of a few tiny bubbles along the side of the glass.&rdquo;<br>&#10003; &ldquo;By the third morning, the starter had climbed nearly to the rim.&rdquo;<br>&#10007; The brown liquid appeared <i>before</i>, when it was <i>not</i> fed &mdash; that is a cause, not a result of feeding.<br>&#10007; On the first day &ldquo;nothing happened.&rdquo;<br>&#10007; Grandma Dee ties on her apron to bake; nothing says she leaves Marcus out.<br><b>Tip:</b> &ldquo;Select ALL&rdquo; can mean two answers or more. Choose every one the text supports, and only those.", "tag": "Cause & Effect", "tagcolor": "#E24B4A", "multi": true, "cis": [0, 2]}, {"passage": "<strong>When the River Came</strong><br>All through April of 1927, the rain would not stop. In Greenville, Mississippi, eleven-year-old Ruthie Bell watched her father leave each evening with the other men to stack sandbags along the levee. One gray morning, the church bells began ringing in the middle of the week, something Ruthie had never heard before.<br><br>&ldquo;The levee broke upstream,&rdquo; Papa announced, bursting through the door. &ldquo;Water&rsquo;s coming. Grab what you can carry.&rdquo;<br><br>Ruthie wrapped her mother&rsquo;s Bible and the family photographs in an oilcloth while her little brother, Amos, chased the hens into a crate. By noon, brown water was swirling around the porch steps. A neighbor rowed up in a flat-bottomed boat, and the family climbed in, leaving behind the piano Ruthie had practiced on every afternoon.<br><br>That night, from the crowded second floor of the brick courthouse, Ruthie gazed at the rooftops poking above the water like stepping stones. Amos was trembling, so she pulled him close and hummed the song she had been learning on the piano, softly, so as not to wake the babies sleeping nearby.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which event happened right after Papa burst through the door with the news?", "opts": ["Ruthie wrapped her mother&rsquo;s Bible and the photographs in an oilcloth.", "Ruthie hummed a song to Amos at the courthouse.", "The church bells began ringing in the middle of the week.", "A neighbor rowed up in a flat-bottomed boat."], "ci": 0, "exp": "Order of events: the bells ring &rarr; Papa bursts in with the news &rarr; Ruthie wraps the Bible and photographs (while Amos catches the hens) &rarr; water reaches the porch by noon &rarr; the neighbor arrives with a boat &rarr; that night, at the courthouse, Ruthie hums to Amos.<br><b>Why not the others:</b> the bells rang <i>before</i> Papa came in; the boat arrives later, after the water reaches the porch; humming happens that night.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>When the River Came</strong><br>All through April of 1927, the rain would not stop. In Greenville, Mississippi, eleven-year-old Ruthie Bell watched her father leave each evening with the other men to stack sandbags along the levee. One gray morning, the church bells began ringing in the middle of the week, something Ruthie had never heard before.<br><br>&ldquo;The levee broke upstream,&rdquo; Papa announced, bursting through the door. &ldquo;Water&rsquo;s coming. Grab what you can carry.&rdquo;<br><br>Ruthie wrapped her mother&rsquo;s Bible and the family photographs in an oilcloth while her little brother, Amos, chased the hens into a crate. By noon, brown water was swirling around the porch steps. A neighbor rowed up in a flat-bottomed boat, and the family climbed in, leaving behind the piano Ruthie had practiced on every afternoon.<br><br>That night, from the crowded second floor of the brick courthouse, Ruthie gazed at the rooftops poking above the water like stepping stones. Amos was trembling, so she pulled him close and hummed the song she had been learning on the piano, softly, so as not to wake the babies sleeping nearby.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>What can the reader infer about Ruthie? <b>Select ALL that apply.</b>", "opts": ["She thinks about other people&rsquo;s needs.", "She cares deeply about her little brother.", "She is angry at her father for making the family leave.", "She is too frightened to help her family pack.", "She stays calm on a frightening night."], "ci": 0, "exp": "Use clues from the story:<br>&#10003; She &ldquo;pulled him close and hummed&rdquo; when Amos was trembling &mdash; she cares about her brother.<br>&#10003; Humming softly in a crowded courthouse while floodwater covers the town shows she stays calm.<br>&#10003; She hums &ldquo;softly, so as not to wake the babies sleeping nearby&rdquo; &mdash; she thinks of others.<br>&#10007; Nothing shows anger at Papa.<br>&#10007; She <i>does</i> help: she &ldquo;wrapped her mother&rsquo;s Bible and the family photographs.&rdquo;<br><b>Tip:</b> Don&rsquo;t stop after finding one right answer &mdash; check every choice.", "tag": "Inference", "tagcolor": "#185FA5", "multi": true, "cis": [0, 1, 4]}, {"passage": "<strong>Passage A: The Family Radio</strong><br>In 1938, ten-year-old Walter Kaminski&rsquo;s family owned one radio, a wooden cabinet nearly as tall as Walter himself. Each evening after supper, his parents, grandmother, and three sisters gathered in the living room to hear the news and their favorite adventure serials. Because everyone listened together, the family argued about what would happen next to the heroes for days afterward. During the news, however, Walter&rsquo;s father allowed no talking, since prices and jobs were on every adult&rsquo;s mind. On Saturday mornings, Walter had the radio to himself for one program, and he never missed it.<br><br><strong>Passage B: Mia&rsquo;s Earbuds</strong><br>Today, eleven-year-old Mia Torres listens to stories through a tiny pair of earbuds. She downloads episodes of a mystery podcast to her tablet and plays them whenever she wants: on the bus, while folding laundry, or before bed. If she misses a clue, she simply rewinds. Her older brother follows an entirely different podcast about space, and her parents prefer the news. Mia often wishes someone else in her house were following her mystery, because she has no one to share her guesses with. Last month, she persuaded her best friend to start the series, which transformed their walks to school into detective meetings.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Based on Passage B, which statement is <b>NOT</b> true?", "opts": ["Mia can rewind an episode if she misses a clue.", "Mia&rsquo;s best friend started listening to the mystery series.", "Mia&rsquo;s brother follows a podcast about space.", "Mia&rsquo;s parents listen to the mystery podcast with her every night."], "ci": 3, "exp": "Passage B says her parents &ldquo;prefer the news,&rdquo; and Mia wishes someone in her house were following her mystery &mdash; so her parents do <i>not</i> listen with her.<br><b>The others are true:</b> &ldquo;If she misses a clue, she simply rewinds&rdquo;; her brother &ldquo;follows an entirely different podcast about space&rdquo;; she &ldquo;persuaded her best friend to start the series.&rdquo;", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Passage A: The Family Radio</strong><br>In 1938, ten-year-old Walter Kaminski&rsquo;s family owned one radio, a wooden cabinet nearly as tall as Walter himself. Each evening after supper, his parents, grandmother, and three sisters gathered in the living room to hear the news and their favorite adventure serials. Because everyone listened together, the family argued about what would happen next to the heroes for days afterward. During the news, however, Walter&rsquo;s father allowed no talking, since prices and jobs were on every adult&rsquo;s mind. On Saturday mornings, Walter had the radio to himself for one program, and he never missed it.<br><br><strong>Passage B: Mia&rsquo;s Earbuds</strong><br>Today, eleven-year-old Mia Torres listens to stories through a tiny pair of earbuds. She downloads episodes of a mystery podcast to her tablet and plays them whenever she wants: on the bus, while folding laundry, or before bed. If she misses a clue, she simply rewinds. Her older brother follows an entirely different podcast about space, and her parents prefer the news. Mia often wishes someone else in her house were following her mystery, because she has no one to share her guesses with. Last month, she persuaded her best friend to start the series, which transformed their walks to school into detective meetings.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to Passage A, which statements about the Kaminski family&rsquo;s radio are true? <b>Select ALL that apply.</b>", "opts": ["It was a wooden cabinet nearly as tall as Walter.", "Walter&rsquo;s father let everyone talk during the news.", "Walter had it to himself for one program on Saturday mornings.", "The family gathered around it each evening after supper.", "The family mostly listened to music on it."], "ci": 0, "exp": "Check each statement against Passage A:<br>&#10003; &ldquo;a wooden cabinet nearly as tall as Walter himself&rdquo; &mdash; true.<br>&#10003; &ldquo;Each evening after supper, his parents, grandmother, and three sisters gathered&rdquo; &mdash; true.<br>&#10003; &ldquo;On Saturday mornings, Walter had the radio to himself for one program&rdquo; &mdash; true.<br>&#10007; During the news his father &ldquo;allowed no talking&rdquo; &mdash; the opposite.<br>&#10007; They listened to &ldquo;the news and their favorite adventure serials,&rdquo; not mostly music.<br><b>Tip:</b> In &ldquo;Select ALL&rdquo; questions, test <i>every</i> choice one by one &mdash; there can be two, three, or more right answers.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "multi": true, "cis": [0, 2, 3]}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which statement is <b>NOT</b> true?", "opts": ["Sutter became rich by selling food and tools to the miners.", "Marshall saw gold flakes in the water beneath the sawmill.", "California became a state in 1850.", "San Francisco grew to more than twenty thousand people within two years."], "ci": 0, "exp": "The passage says &ldquo;Sutter himself was <i>ruined</i>,&rdquo; and it was <i>merchants</i> who charged high prices for food and tools. The other three statements match the passage: Marshall saw &ldquo;glittering flakes in the water channel beneath the mill,&rdquo; California &ldquo;became the thirty-first state in 1850,&rdquo; and the town &ldquo;swelled to more than twenty thousand within two years.&rdquo;", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The California Gold Rush</strong><br>In January 1848, a carpenter named James Marshall was building a sawmill for John Sutter along the American River in California. One morning he noticed glittering flakes in the water channel beneath the mill. Sutter wanted the discovery kept quiet, but rumors spread swiftly, and by December, President James K. Polk had confirmed to Congress that the reports were true.<br><br>The news set off one of the largest migrations in American history. In 1849, roughly 90,000 people, nicknamed &ldquo;forty-niners,&rdquo; poured into California by wagon and by ship. So many sailors abandoned their vessels to search for gold that hundreds of empty ships crowded San Francisco&rsquo;s harbor. The town, home to about a thousand people in early 1848, swelled to more than twenty thousand within two years.<br><br>Few miners grew wealthy. Because thousands competed for the same streams, the easy gold disappeared quickly, while merchants charged staggering prices for food and tools. Sutter himself was ruined when gold seekers trampled his fields and his workers deserted him. Still, the rush transformed California, which became the thirty-first state in 1850."}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which event happens right <b>after</b> the difference between the charges grows too large for the air to hold back?", "opts": ["Water droplets are carried upward and freeze.", "Ice crystals collide with pellets of soft hail.", "The air expands and makes a boom.", "A giant spark leaps between the charges."], "ci": 3, "exp": "The second paragraph says the difference grows &ldquo;until the air can no longer hold them back. <i>Then</i> a giant spark leaps between the charges.&rdquo; The boom of thunder comes later, after the spark heats the air. The collisions and freezing droplets happen earlier, before the charges separate.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>How Lightning Forms</strong><br>Inside a towering thundercloud, powerful currents of air carry water droplets upward, where they freeze. As the air keeps churning, tiny ice crystals collide with heavier pellets of soft hail. These collisions knock electric charges loose. The lightweight crystals, which become positively charged, are swept to the top of the cloud, while the heavier, negatively charged pellets sink toward the bottom.<br><br>Ordinarily the air keeps the two charges apart, but the difference persists and grows until the air can no longer hold them back. Then a giant spark leaps between the charges, either inside the cloud or down to the ground. That spark is lightning.<br><br>A bolt is extraordinarily hot, about five times hotter than the surface of the sun. It heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder. Because light travels much faster than sound, you see the flash before you hear the rumble. Counting the seconds between them reveals how far away the strike was: roughly five seconds for every mile."}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Match each <b>cause</b> to its <b>effect</b>.<br><table style=\"border-collapse:collapse;font-size:0.9rem;margin:8px 0;width:100%\"><tr style=\"background:#e8eef7\"><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Cause (why it happened)</th><th style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\">Effect (what happened)</th></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>1.</b> Ice crystals collide with pellets of soft hail.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>A.</b> A giant spark leaps between the charges.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>2.</b> Lightning heats the air extremely fast.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>B.</b> Electric charges are knocked loose.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>3.</b> Light travels much faster than sound.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>C.</b> You see the flash before you hear the thunder.</td></tr><tr><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>4.</b> The difference between the charges grows too large for the air to hold back.</td><td style=\"border:1px solid #bbb;padding:5px 8px;vertical-align:top\"><b>D.</b> The air expands with a boom called thunder.</td></tr></table>Which choice matches every cause with the correct effect?", "opts": ["1–A, 2–D, 3–C, 4–B", "1–B, 2–D, 3–C, 4–A", "1–B, 2–C, 3–D, 4–A", "1–A, 2–B, 3–C, 4–D"], "ci": 1, "exp": "<b>1–B:</b> &ldquo;These collisions knock electric charges loose.&rdquo; <b>2–D:</b> the bolt &ldquo;heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder.&rdquo; <b>3–C:</b> &ldquo;<i>Because</i> light travels much faster than sound, you see the flash before you hear the rumble.&rdquo; <b>4–A:</b> when the air &ldquo;can no longer hold them back,&rdquo; &ldquo;a giant spark leaps between the charges.&rdquo; Watch for the trap that swaps 2 and 3: thunder is the effect of the <i>heat</i>, while the delay is the effect of <i>speed</i>.", "tag": "Cause & Effect Matching", "tagcolor": "#E24B4A", "passage": "<strong>How Lightning Forms</strong><br>Inside a towering thundercloud, powerful currents of air carry water droplets upward, where they freeze. As the air keeps churning, tiny ice crystals collide with heavier pellets of soft hail. These collisions knock electric charges loose. The lightweight crystals, which become positively charged, are swept to the top of the cloud, while the heavier, negatively charged pellets sink toward the bottom.<br><br>Ordinarily the air keeps the two charges apart, but the difference persists and grows until the air can no longer hold them back. Then a giant spark leaps between the charges, either inside the cloud or down to the ground. That spark is lightning.<br><br>A bolt is extraordinarily hot, about five times hotter than the surface of the sun. It heats the surrounding air so rapidly that the air expands with explosive force, producing the boom we call thunder. Because light travels much faster than sound, you see the flash before you hear the rumble. Counting the seconds between them reveals how far away the strike was: roughly five seconds for every mile."}, {"passage": "<strong>Listening for Lindbergh</strong><br>On the afternoon of May 21, 1927, eleven-year-old Mae Hollis sat cross-legged in front of the family radio in Wichita, Kansas, while her father fiddled with the dial. Somewhere over the Atlantic Ocean, a young pilot named Charles Lindbergh was attempting to fly alone, without stopping, from New York to Paris. No one had ever done it.<br><br>&ldquo;He&rsquo;s been in the air more than thirty hours,&rdquo; Papa said, frowning at the crackling speaker. &ldquo;Fog over the ocean, they say.&rdquo;<br><br>Mae thought of the newspaper photograph of Lindbergh&rsquo;s plane, the <i>Spirit of St. Louis</i>, its silver wings so slender they looked fragile. To save weight, the newspaper said, he had left behind his radio and even his parachute.<br><br>Then the static cleared, and an announcer&rsquo;s voice rose with excitement: Lindbergh had landed at Le Bourget Field, and a huge crowd was rushing across the airfield toward his plane.<br><br>Papa let out a whoop that rattled the windows. Mae ran onto the porch, where neighbors were already spilling out of their houses, and looked up at the sky as though she might see the tiny plane herself.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which meaning of <b>dial</b> is used in the first paragraph?", "opts": ["a knob that is turned to choose a radio station", "to call someone by pressing numbers on a phone", "a round gauge that shows a measurement, such as speed", "the face of a clock that shows the hours"], "ci": 0, "exp": "Mae&rsquo;s father &ldquo;fiddled with the dial&rdquo; of the family radio, so it is the knob that tunes the station. A gauge is also a kind of dial, but it only shows a measurement; it is not turned to change anything.", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5"}, {"passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which statement is <b>NOT</b> true?", "opts": ["A maple seed floats down under a tuft of silky threads, like a parachute.", "Some acorns grow into oaks because squirrels forget where they buried them.", "Burdock burrs gave an engineer the idea for Velcro.", "Witch hazel pods can fling seeds as far as thirty feet."], "ci": 0, "exp": "The silky “tiny parachute” belongs to the dandelion. The passage says a maple seed has “a single papery wing that makes it spin like a helicopter blade.” The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>The poet writes that the wind “came walking down our street / on tall and restless, unseen feet.” What does this language do?", "opts": ["It tells exactly how fast the wind was blowing.", "It compares the wind to embers by using the word “like.”", "It describes the wind as if it were a person.", "It shows that the speaker is afraid of the wind."], "ci": 2, "exp": "Wind cannot really walk or have feet. Giving it human actions is called personification. The poem does use “like” later, but that compares the <i>leaves</i> to embers.", "tag": "Author's Craft", "tagcolor": "#185FA5"}, {"passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which event happened <b>right after</b> the two telegraph lines were joined?", "opts": ["A message from California reached President Lincoln.", "The Pony Express announced that it would close.", "Congress passed a law offering money for the line.", "Western Union sent out two crews from opposite ends."], "ci": 0, "exp": "“Within hours” of the joining, the message reached Lincoln. The Pony Express closing came “two days later,” so it was not right after.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which event happened right after burning embers leaped across the Chicago River?", "opts": ["Rain helped put out the flames.", "The city’s waterworks caught fire.", "A fire broke out in the O’Leary barn.", "Strong winds pushed the flames toward downtown."], "ci": 1, "exp": "The passage says embers “leaped across the Chicago River, and soon the city’s waterworks caught fire.” The barn fire and the winds came before the embers crossed the river; the rain came last, on October 10.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>Why the Moon Changes Shape</strong><br>Although the Moon seems to change shape over the course of a month, its shape never actually changes. The Moon produces no light of its own; it shines only because sunlight reflects off its rocky, dusty surface. At every moment, the Sun lights up exactly half of the Moon, just as it lights up half of Earth, creating day on one side and night on the other. What changes is how much of that sunlit half faces us.<br><br>As the Moon travels around Earth over about 29.5 days, our viewing angle slowly shifts. When the Moon passes between Earth and the Sun, its lit side faces away from us, and we see a dark new moon. A few days later, a thin crescent appears, followed by a half-lit quarter moon. About two weeks into the cycle, Earth lies between the Sun and the Moon, and the entire lit half faces us as a full moon. After that, the lit portion diminishes night after night until the Moon vanishes from view again. Because the cycle is so predictable, many ancient cultures used it to monitor the passing of time and to decide when to plant and harvest crops.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which statement is <b>NOT</b> true?", "opts": ["The Moon shines because sunlight reflects off its surface.", "A full cycle of the Moon's phases takes about two weeks.", "During a full moon, Earth lies between the Sun and the Moon.", "The Sun always lights up half of the Moon."], "ci": 1, "exp": "The passage says the Moon travels around Earth “over about 29.5 days,” and the full moon comes “about two weeks into the cycle.” So the whole cycle takes about a month, not two weeks. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Island of Hope</strong><br>The ferry bumped against the dock, and eleven-year-old Sofia Russo gripped her little brother&rsquo;s hand. After twelve days crossing the Atlantic in the crowded lower deck of a steamship, the family had finally reached Ellis Island in New York Harbor. It was the spring of 1907. Papa had sailed to America a year earlier, and his letters had promised that a new life waited beyond the inspection hall.<br><br>Inside the enormous Registry Room, thousands of voices echoed in dozens of languages. Sofia had heard rumors on the ship: doctors watched newcomers climb the long staircase, and anyone who stumbled or coughed might be marked with chalk and held for more tests. She straightened her shoulders and climbed steadily, though her knees trembled.<br><br>At the top, a doctor peered at her eyes and waved her on. An inspector asked Mama a series of questions through an interpreter, and the answers seemed to reveal nothing troubling. Hours later, the family hurried down the &ldquo;Stairs of Separation&rdquo; toward the exit for those staying in New York City. Behind the railing stood a thin man in a gray cap, waving his hat with both hands. After a year of hardship and waiting, Sofia finally saw her father again.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>According to the passage, which statement is <b>NOT</b> true?", "opts": ["Sofia's father crossed the Atlantic on the same ship as his family.", "The Registry Room was filled with people speaking many languages.", "Doctors watched newcomers as they climbed the long staircase.", "An interpreter helped Mama answer the inspector's questions."], "ci": 0, "exp": "The passage says, \"Papa had sailed to America a year earlier,\" so he was not on the same ship. The other three statements match details in the second and third paragraphs.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>Setting Aside Yellowstone</strong><br>For decades, trappers returning from the remote northern Rockies told stories that most Americans dismissed as tall tales: rivers that boiled, mud that bubbled like porridge, and fountains of steam that erupted on schedule. In 1870, a group of explorers from Montana Territory set out to test those claims, and what they found convinced them that the rumors had been, if anything, too modest. A year later, the federal government sent the geologist Ferdinand Hayden to survey the region scientifically. Hayden brought along two artists who would prove essential to his mission: the photographer William Henry Jackson and the painter Thomas Moran. Their pictures made the region's wonders evident to lawmakers who would never travel there themselves. Members of Congress, many of whom had doubted the written reports, studied Jackson's photographs and Moran's vivid watercolors of the canyon and the hot springs. Persuaded that such a landscape should not be sold off to private owners, Congress passed a bill protecting more than two million acres. On March 1, 1872, President Ulysses S. Grant signed it, creating Yellowstone as the world's first national park. The idea spread steadily, and today more than one hundred nations protect land in national parks.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which event happened right after the explorers from Montana Territory made their trip in 1870?", "opts": ["The government sent Ferdinand Hayden to survey the region.", "Trappers began telling stories about boiling rivers.", "President Grant signed the bill creating the park.", "Congress studied photographs and watercolors of the region."], "ci": 0, "exp": "&ldquo;A year later, the federal government sent the geologist Ferdinand Hayden.&rdquo; The trappers&rsquo; stories came before 1870, and Congress studied the pictures and passed the bill only after Hayden&rsquo;s survey.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"passage": "<strong>The Pony Express</strong><br>In the spring of 1860, a letter traveling from Missouri to California by stagecoach could take more than three weeks to arrive. A private company believed it could shorten that time dramatically. On April 3, 1860, a rider galloped west out of St. Joseph, Missouri, carrying a leather pouch of letters, and the Pony Express was born.<br><br>The route stretched about 1,900 miles across prairies, deserts, and the snowy Sierra Nevada. Rather than exhausting a single horse, riders switched to a fresh mount at relay stations spaced roughly ten to fifteen miles apart, and a new rider took over after seventy-five miles or more. In good weather, mail reached Sacramento in about ten days. The riders had to endure blizzards, scorching heat, and long stretches without sleep, yet the service rarely lost a delivery.<br><br>Its success, however, was brief. On October 24, 1861, workers finished connecting the first telegraph line across the continent, and messages that had taken days now crossed the country in minutes. Two days later, the Pony Express announced that it would close.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which event happened right after workers finished the first telegraph line across the continent?", "opts": ["Mail began reaching Sacramento in about ten days.", "A rider left St. Joseph carrying a pouch of letters.", "The Pony Express announced that it would close.", "Riders began switching horses at relay stations."], "ci": 2, "exp": "The passage says that on October 24, 1861, the telegraph line was finished, and &ldquo;Two days later, the Pony Express announced that it would close.&rdquo; The rider leaving St. Joseph happened first, in April 1860.", "tag": "Sequence of Events", "tagcolor": "#185FA5"}, {"stem": "<b>Part A</b><br>Why did New York City become the busiest port in the nation after 1825?", "opts": ["because wagons could finally travel on smooth new roads", "because many Irish immigrants settled in New York City", "because the canal made shipping goods between the Great Lakes and the coast much cheaper", "because Clinton poured Lake Erie water into the Atlantic Ocean"], "ci": 2, "exp": "The last paragraph links the two ideas: &ldquo;Shipping costs plunged by about ninety percent, and New York City soon became the busiest port.&rdquo; Cheaper shipping is the cause; the busy port is the effect.<br><b>Why not the others:</b> pouring the water was a celebration, not a reason for trade; the Irish workers dug the canal but are not given as the reason for the port; the passage never says roads improved.", "tag": "Cause & Effect (Part A)", "tagcolor": "#E24B4A", "passage": "<strong>The Erie Canal</strong><br>In the early 1800s, moving goods from the Atlantic coast to the Great Lakes was slow and costly. Wagons pulled by horses crept over rough roads, and shipping a ton of flour from Buffalo to New York City could cost as much as the flour itself. In 1817, New York governor DeWitt Clinton persuaded the state legislature to pay for an ambitious project: a canal stretching 363 miles from Albany, on the Hudson River, to Buffalo, on Lake Erie.<br><br>Critics mocked the plan as &ldquo;Clinton&rsquo;s Ditch,&rdquo; insisting it could never succeed. Workers, many of them Irish immigrants, dug almost entirely by   var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += isRight(qi, state.answers[qi]) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && !isRight(qi, state.answers[qi]); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
