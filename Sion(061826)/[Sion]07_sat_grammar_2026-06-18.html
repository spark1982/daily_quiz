<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Grammar</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.date-hd{text-align:center;font-size:2rem;font-weight:800;color:#6B3FA0;padding:6px 0;}
.title-hd{text-align:center;font-size:1.3rem;font-weight:700;margin:4px 0 2px;color:#111;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
.attempts-hd{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;}
.tag-badge{display:inline-block;background:#6B3FA0;color:#fff;font-size:0.74rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:10px;}
.sentence-box{background:#f5f0fa;border-left:4px solid #6B3FA0;border-radius:8px;padding:14px 16px;margin-bottom:14px;font-size:1rem;color:#222;line-height:1.7;}
.sentence-box u{text-decoration:underline;color:#6B3FA0;font-weight:700;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.q-text{font-size:0.93rem;font-weight:600;color:#444;margin-bottom:10px;}
.opt-btn{display:block;width:100%;padding:11px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#f3eef9;color:#111;font-size:0.93rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.6;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#f3eef9;color:#6B3FA0;}
.next-btn{background:#6B3FA0;color:#fff;}
.prog-track{background:#e2d8ef;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#6B3FA0;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f0fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#f5f0fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
</style>
</head>
<body>
<div class="date-hd">2026-06-18</div>
<div class="title-hd">[Sion] SAT Grammar</div>
<div class="instruction">Choose the best replacement for the underlined portion. Choose "NO CHANGE" if the original is already correct.</div>
<div class="attempts-hd" id="att-display">Total Attempts: 0</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / 10</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #6B3FA0;border-radius:14px;background:#fff;color:#6B3FA0;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div class="tag-badge" id="tag-badge"></div>
  <div class="sentence-box" id="sentence-main"></div>
  <div class="q-num" id="q-num"></div>
  <div class="q-text" id="q-text"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#6B3FA0;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#6B3FA0;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal()" style="display:block;width:100%;padding:13px;background:#f3eef9;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#f3eef9;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){
var QUIZ_KEY='quiz_satgrammar_10_20260617_v1';
var ATT_KEY='quiz_satgrammar_att_20260617_v1';

var qs=[
 {tag:'Subject-Verb Agreement',
  sentence:'The committee of scientists <u>have reached</u> a unanimous decision about the funding proposal.',
  opts:['NO CHANGE: have reached','is reaching','has reached','were reaching'],
  ci:2,exp:'The subject is "committee," a singular collective noun, so it requires the singular verb "has reached," not the plural "have reached."'},
 {tag:'Run-on Sentences / Comma Splices',
  sentence:'The museum closed early today, <u>visitors were disappointed and left quickly</u>.',
  opts:['NO CHANGE: visitors were disappointed and left quickly','when visitors were disappointed and left quickly','so visitors were disappointed and left quickly','visitors, disappointed, and left quickly'],
  ci:2,exp:'The original creates a comma splice by joining two independent clauses with only a comma. Adding the coordinating conjunction "so" correctly joins the clauses.'},
 {tag:'Possessives & Apostrophes',
  sentence:"Each of the students submitted <u>their's</u> assignment before the deadline.",
  opts:["NO CHANGE: their's",'theirs','their',"there's"],
  ci:2,exp:'Before a noun ("assignment"), the possessive determiner "their" is required. "Theirs" stands alone without a following noun, and "their\\'s" is never a correct spelling.'},
 {tag:'Pronoun Case (Who/Whoever)',
  sentence:'The award will be given to <u>whomever</u> submits the best essay.',
  opts:['NO CHANGE: whomever','who','whoever','whom'],
  ci:2,exp:'Because the pronoun functions as the subject of the verb "submits," the subjective form "whoever" is correct, not the objective form "whomever."'},
 {tag:'Parallel Structure',
  sentence:'Her hobbies include painting, hiking, and <u>to swim</u> in the lake.',
  opts:['NO CHANGE: to swim','swam','swimming','she swims'],
  ci:2,exp:'The list should maintain parallel grammatical form. Since the other items are gerunds ("painting," "hiking"), the third item should also be a gerund: "swimming."'},
 {tag:'Misplaced/Dangling Modifiers',
  sentence:'Walking to school in the rain, <u>the umbrella protected Maria from getting soaked</u>.',
  opts:['NO CHANGE: the umbrella protected Maria from getting soaked','getting soaked was avoided by Maria with the umbrella','Maria was protected from getting soaked by the umbrella',"Maria's umbrella, which protected her from getting soaked"],
  ci:2,exp:'The introductory phrase "Walking to school in the rain" must logically modify the subject that follows. Maria, not the umbrella, was walking, so the clause should begin with "Maria."'},
 {tag:'Verb Tense Consistency',
  sentence:'Last summer, she traveled to Spain, visited several museums, and <u>eats</u> at famous restaurants.',
  opts:['NO CHANGE: eats','is eating','ate','has eaten'],
  ci:2,exp:'The sentence describes a sequence of past events ("traveled," "visited"), so the verb must remain in the past tense: "ate," not the present tense "eats."'},
 {tag:'Comma with Introductory Clauses',
  sentence:'<u>After the long meeting ended</u> everyone left the office in a hurry.',
  opts:['NO CHANGE: After the long meeting ended','After, the long meeting ended','After the long meeting ended,','After the long meeting, ended'],
  ci:2,exp:'An introductory dependent clause should be followed by a comma to separate it from the main clause: "After the long meeting ended,".'},
 {tag:'Semicolons with Independent Clauses',
  sentence:'The experiment produced unexpected results<u>, the team decided to repeat it</u> under different conditions.',
  opts:['NO CHANGE: , the team decided to repeat it',', so the team it decided to repeat','; the team decided to repeat it','the team deciding to repeat it'],
  ci:2,exp:'Two independent clauses with no coordinating conjunction must be joined by a semicolon, not a comma: "; the team decided to repeat it."'},
 {tag:'Commonly Confused Words',
  sentence:'The new policy will <u>effect</u> how employees schedule their vacation time.',
  opts:['NO CHANGE: effect','effects','affect','effected'],
  ci:2,exp:'The verb meaning "to influence" is "affect," not "effect" (which is typically a noun or means "to bring about"). "Affect" is the correct verb here.'}
];

var state={};
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');
    if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<qs.length&&s.answers){state=s;}
    else resetState();
  }catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}
}
function resetState(){state={cur:0,answers:{},showResults:false};}
function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}
function getShuffle(i){return [0,1,2,3];}
function getCSI(i){return qs[i].ci;}
function loadAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0',10);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';
  var p=document.getElementById('dot-panel');
  if(p.style.display!=='none')renderDots();
}

function toggleJump(){
  var p=document.getElementById('dot-panel');
  var b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.innerHTML='Hide &#9652;';renderDots();}
  else{p.style.display='none';b.innerHTML='Jump &#9662;';}
}

function renderDots(){
  var p=document.getElementById('dot-panel');
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg=state.answers[i]===undefined?'#e2d8ef':(state.answers[i]===getCSI(i)?'#6B3FA0':'#E24B4A');
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#6B3FA0;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML=h;
}

function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY,loadAtt()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent='Total Attempts: '+loadAtt();
  if(state.showResults){renderResults();return;}
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur; var q=qs[i];
  document.getElementById('tag-badge').textContent=q.tag;
  document.getElementById('sentence-main').innerHTML=q.sentence;
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  document.getElementById('q-text').textContent='Which choice best fixes the underlined portion?';
  var ans=state.answers[i]; var csi=getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var cls='opt-btn'; var dis='';
    if(ans!==undefined){dis='disabled ';if(s===csi)cls+=' correct';else if(s===ans)cls+=' wrong';}
    html+='<button class="'+cls+'" '+dis+'onclick="pick('+i+','+s+')">'+esc(q.opts[s])+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');
  if(ans!==undefined){eb.style.display='block';eb.textContent=q.exp;}
  else{eb.style.display='none';}
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.querySelector('.prev-btn').disabled=(i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined)sk++;
    else if(state.answers[i]===getCSI(i))c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML=
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i]; var label,bg,tc;
    if(a===undefined){label='Skipped';bg='#e2d8ef';tc='#555';}
    else if(a===getCSI(i)){label='Correct';bg='#E1F5EE';tc='#085041';}
    else{label='Wrong';bg='#FCEBEB';tc='#501313';}
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;color:#333;">Q'+(i+1)+': '+esc(qs[i].tag)+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}

function pick(qi,si){if(state.answers[qi]!==undefined)return;state.answers[qi]=si;saveState();render();}
function go(dir){
  if(dir===1&&state.cur===qs.length-1){showResults();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));
  saveState();render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined&&state.answers[i]!==getCSI(i)){
      if(first===-1)first=i; delete state.answers[i];
    }
  }
  if(first!==-1){state.cur=first;state.showResults=false;saveState();render();}
}
function copyRes(){
  var lines=['[Sion] SAT Grammar - Results (2026-06-18)'];
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    var label=a===undefined?'Skipped':(a===getCSI(i)?'Correct':'Wrong');
    lines.push('Q'+(i+1)+' ('+qs[i].tag+'): '+label);
  }
  var txt=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);});}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){document.getElementById('freshModal').style.display='none';localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();}

window.pick=pick;window.go=go;window.goToQ=goToQ;window.toggleJump=toggleJump;
window.retryWrong=retryWrong;window.copyRes=copyRes;window.openFreshModal=openFreshModal;
window.confirmFresh=confirmFresh;window.showResults=showResults;

loadState();saveState();render();
})();
</script>
</body>
</html>
