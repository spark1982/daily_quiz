President Grant signs the park law &rarr; Hayden leads a government survey &rarr; the idea spreads around the world"], "ci": 1, "exp": "The explorers went in 1870, Hayden&rsquo;s survey came &ldquo;the following year,&rdquo; Grant signed the law on March 1, 1872, and the idea &ldquo;eventually spread.&rdquo; Hayden&rsquo;s survey came after the explorers&rsquo; reports, not before."}, {"stem": "In Passage B, what does the word &ldquo;resented&rdquo; mean in &ldquo;At first Omar resented the idea&rdquo;?", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1955, Linda&rsquo;s father carried a heavy wooden cabinet into the living room of their Ohio farmhouse, and the whole family gathered around their first television. Each evening after supper, they watched the same programs together, since the set received only two channels. Neighbors who had no television often came over, crowding onto the sofa and the floor. Linda&rsquo;s mother worried that the glowing screen would replace conversation, but Linda noticed the opposite: the family laughed at the same jokes and argued cheerfully about the shows long after the set was turned off.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Omar&rsquo;s family in San Diego owns four screens, yet they rarely look at the same one. His sister watches videos in her room, his father reads the news on his tablet, and Omar plays games on his laptop. Last spring his parents announced a new rule: every Sunday evening would be screen-free. At first Omar resented the idea and counted the minutes until Monday. Gradually, though, the family began cooking dinner together and playing board games, and Omar realized he knew more about his sister&rsquo;s week than he had in months.</p>", "opts": ["felt annoyed and unhappy about", "explained carefully", "completely forgot about", "was excited about"], "ci": 0, "exp": "Omar &ldquo;counted the minutes until Monday,&rdquo; which shows he did not like the rule at first. &ldquo;Was excited about&rdquo; is the opposite of his feeling."}, {"stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;meager&rdquo; as it is used in the story?", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>Panning on the American River</strong><br>In the spring of 1849, twelve-year-old Samuel Price and his uncle reached the gold fields of California after five months on the overland trail. The camp along the American River was a crowded tangle of canvas tents, and the miners spoke a dozen languages. Uncle Josiah had sold his Ohio farm to pay for the journey, so Samuel knew how much depended on their luck.<br><br>On their first morning, an experienced miner named Mr. Ortega showed them how to pan. He scooped gravel and water into a shallow metal pan, then swirled it in slow circles, letting the lighter sand wash over the rim. Gold is heavy, he explained, so it sinks to the bottom. Samuel practiced until his fingers were numb from the icy water, but at sunset his pan held only a few glittering flakes.<br><br>For weeks the results were meager. Prices in camp were outrageous: a single egg cost a dollar, and a pair of boots cost forty. Uncle Josiah grew quiet and discouraged. Then Samuel had an idea. Instead of digging, they could sell fresh bread to the hungry miners. By autumn, their little bakery earned more in a week than their pan had earned all summer.", "opts": ["plentiful", "risky", "slim", "steady"], "ci": 2, "exp": "After his first day Samuel had &ldquo;only a few glittering flakes,&rdquo; and the results stayed &ldquo;meager,&rdquo; or slim and small. <i>Plentiful</i> means the opposite."}, {"stem": "Which of these events happened <b>LAST</b>?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Clinton’s Ditch</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods from the Great Lakes to New York City was slow and expensive. Wagons crept along muddy roads, and shipping a ton of flour could cost more than the flour itself. New York governor DeWitt Clinton proposed an ambitious solution: a canal connecting Lake Erie to the Hudson River, which flowed south to the city. Many people mocked the plan as “Clinton’s Ditch,” because the route stretched across 363 miles of forest, swamp, and rock.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, dug the channel with shovels, axes, and horse-drawn plows. At Lockport, crews blasted through a ridge of solid stone and built a staircase of locks that raised boats about 60 feet.</p><p style=\"margin:0 0 8px;\">In 1825, the canal finally opened, and Clinton celebrated by pouring a barrel of Lake Erie water into New York Harbor. Shipping costs plummeted by about 90 percent, and towns along the route, such as Buffalo and Rochester, flourished. Before long, New York City had become the busiest port in the nation.</p>", "opts": ["DeWitt Clinton proposed a canal from Lake Erie to the Hudson River.", "Crews blasted through a ridge of solid stone at Lockport.", "Laborers began digging the canal in 1817.", "Clinton poured a barrel of Lake Erie water into New York Harbor."], "ci": 3, "exp": "The third paragraph says that when the canal “finally opened” in 1825, “Clinton celebrated by pouring a barrel of Lake Erie water into New York Harbor.” The Lockport blasting happened during construction, before the opening."}, {"stem": "In the second stanza, what causes the “tiny parachutes” to go drifting into flight?", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Dandelion Clock</strong><br><p style=\"margin:0 0 8px;\">Yesterday it was a yellow sun<br>stitched low against the lawn;<br>today it is a silver globe,<br>a moon that waits for dawn.</p><p style=\"margin:0 0 8px;\">I pluck it, hold it to my lips,<br>and blow with all my might—<br>a hundred tiny parachutes<br>go drifting into flight.</p><p style=\"margin:0 0 8px;\">They sail above the garden fence,<br>past chimney, roof, and tree,<br>too swift for me to follow them,<br>too light for me to see.</p><p style=\"margin:0 0 8px;\">Next spring, in someone else’s yard,<br>where no one planted one,<br>a stubborn little dandelion<br>will lift its face to the sun.</p>", "opts": ["The sun dries out the yellow petals.", "A strong wind shakes the garden fence.", "The speaker drops the dandelion on the lawn.", "The speaker blows on the dandelion."], "ci": 3, "exp": "The speaker says, “I pluck it, hold it to my lips, / and blow with all my might,” and then the seeds go “drifting into flight.” The fence appears later, as something the seeds sail above."}, {"stem": "The word <b>globe</b> has more than one meaning. Which meaning is used in the first stanza?", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>Dandelion Clock</strong><br><p style=\"margin:0 0 8px;\">Yesterday it was a yellow sun<br>stitched low against the lawn;<br>today it is a silver globe,<br>a moon that waits for dawn.</p><p style=\"margin:0 0 8px;\">I pluck it, hold it to my lips,<br>and blow with all my might—<br>a hundred tiny parachutes<br>go drifting into flight.</p><p style=\"margin:0 0 8px;\">They sail above the garden fence,<br>past chimney, roof, and tree,<br>too swift for me to follow them,<br>too light for me to see.</p><p style=\"margin:0 0 8px;\">Next spring, in someone else’s yard,<br>where no one planted one,<br>a stubborn little dandelion<br>will lift its face to the sun.</p>", "opts": ["the whole world and its people", "a model of Earth on a stand", "a glass cover over a lamp", "a round, ball-shaped object"], "ci": 3, "exp": "The dandelion has turned from a flat yellow flower into a fluffy “silver globe,” described as “a moon,” so <i>globe</i> means a round shape. A model of Earth is a real meaning of globe, but not the one used here."}, {"stem": "What can the reader infer about the small local school near Eli&rsquo;s ranch?", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1910, nine-year-old Hattie walked two miles each morning to a one-room schoolhouse in rural Iowa. Inside, twenty students between the ages of six and fourteen shared a single teacher, Miss Pruitt. Because she could not teach every grade at once, the older students often helped the younger ones practice reading and arithmetic. In winter, Hattie arrived early to carry in wood for the iron stove, since the building had no other heat. Lessons were simple and books were scarce, but Hattie treasured her hours there. For a farm girl who was needed at home every afternoon, school was a precious chance to learn.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Eli lives on a cattle ranch in Montana, forty miles from the nearest town. Instead of riding a bus, he opens a laptop at the kitchen table, where his teacher appears on the screen along with classmates scattered across the state. When the internet connection drops during a storm, Eli has to wait and reconnect, which can be frustrating. Still, online school gives him access to classes, such as robotics, that his small local school could never offer. In the afternoons, Eli helps feed the cattle, and in the evenings he finishes assignments that his teacher reviews from more than a hundred miles away.</p>", "opts": ["It closed because the internet connection kept dropping.", "It is located on Eli&rsquo;s family&rsquo;s ranch.", "It offers fewer classes than Eli&rsquo;s online school.", "It has a better robotics program than the online school."], "ci": 2, "exp": "Passage B says online school gives Eli &ldquo;classes, such as robotics, that his small local school could never offer.&rdquo; This suggests the local school has fewer choices."}, {"stem": "The suffix <b>-ling</b> means “a young or small one.” What does <b>seedling</b> in the first paragraph most likely mean?", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>", "opts": ["a young plant that has just sprouted", "a person who plants seeds for a living", "a group of seeds inside one pod", "a seed that an animal has buried"], "ci": 0, "exp": "seed + -ling = a young one that comes from a seed. The passage says a seedling “sprouts,” which shows it is a young plant, not a buried seed."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Seeds on the Move</strong><br><p style=\"margin:0 0 8px;\">A plant cannot walk, yet its seeds often end up far from the parent plant. This journey matters, because a seedling that sprouts directly beneath its parent must compete with it for sunlight, water, and nutrients. Over millions of years, plants have developed ingenious ways to send their seeds traveling.</p><p style=\"margin:0 0 8px;\">Some plants depend on the wind. A dandelion seed dangles beneath a tuft of silky threads that works like a tiny parachute, while a maple seed has a single papery wing that makes it spin like a helicopter blade as it drifts down. Other plants recruit animals. Burdock seeds are wrapped in hooked burrs that cling to fur; in 1941, a Swiss engineer named George de Mestral examined the burrs stuck to his dog and used the idea to invent Velcro. Squirrels bury acorns to eat later, and the ones they forget may grow into oaks.</p><p style=\"margin:0 0 8px;\">Water carries seeds, too. A coconut can float across an ocean and take root on a distant beach. Perhaps the most dramatic method belongs to the witch hazel, whose pods dry out and burst, flinging seeds as far as thirty feet.</p>", "opts": ["Witch hazel pods can fling seeds as far as thirty feet.", "Burdock burrs gave an engineer the idea for Velcro.", "Some acorns grow into oaks because squirrels forget where they buried them.", "A maple seed floats down under a tuft of silky threads, like a parachute."], "ci": 3, "exp": "The silky “tiny parachute” belongs to the dandelion. The passage says a maple seed has “a single papery wing that makes it spin like a helicopter blade.” The other three statements match the passage."}, {"stem": "Based on the passages, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1962, twelve-year-old Gary lived in Huntsville, Alabama, where engineers were designing the giant rockets that would one day carry astronauts toward the Moon. Inspired by the rumble of engine tests that rattled his windows, Gary built model rockets from cardboard tubes and balsa-wood fins. His first three launches failed spectacularly; one rocket spun in circles and crashed into a neighbor’s garden. Rather than quit, Gary persevered, studying each failure and adjusting the fins. When his fourth rocket soared straight up and drifted back down on its parachute, he decided he would become an engineer himself.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Last spring, Maya’s science club in Wichita, Kansas, launched a weather balloon carrying a small camera and a GPS tracker. As the balloon climbed, the air grew thinner, and the balloon swelled until it burst more than 90,000 feet above the ground. A parachute carried the equipment safely back to a wheat field sixty miles away, where the club located it using the GPS signal. Back at school, the students watched the video in amazement: the sky had turned nearly black, and the curve of Earth stretched across the screen. Maya says the project made space feel close enough to touch.</p>", "opts": ["Gary’s first three rocket launches did not succeed.", "Maya’s club used a GPS signal to find its equipment.", "Maya’s balloon burst more than 90,000 feet above the ground.", "Gary’s fourth rocket crashed into a neighbor’s garden."], "ci": 3, "exp": "In Passage A, a rocket from the first three failed launches crashed into the garden. The fourth rocket “soared straight up and drifted back down on its parachute.”"}, {"stem": "Which word means the <b>OPPOSITE</b> of “<b>dormant</b>” as it is used in the passage?", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Islands from a Hot Spot</strong><br><p style=\"margin:0 0 8px;\">The Hawaiian Islands stretch across the Pacific Ocean for about 1,500 miles, yet no collision of continents created them. Deep beneath the Pacific Plate, a column of unusually hot rock rises from far inside Earth. Geologists call this place a hot spot.</p><p style=\"margin:0 0 8px;\">Where the rising rock nears the surface, some of it melts into magma that erupts through the seafloor. Layer upon layer of cooled lava gradually builds a mountain, and after hundreds of thousands of years, its summit breaks through the waves as a new island.</p><p style=\"margin:0 0 8px;\">The hot spot, however, stays in place while the Pacific Plate creeps northwest about three to four inches each year. As the plate moves, each volcano is carried away from its supply of magma. It becomes dormant and slowly erodes, while a new volcano begins to grow above the hot spot. This explains why the oldest large islands, such as Kauai, lie to the northwest, while the Big Island, which still has active volcanoes, lies to the southeast.</p>", "opts": ["ancient", "inactive", "sleeping", "active"], "ci": 3, "exp": "A <i>dormant</i> volcano is quiet and no longer erupting. The passage contrasts it with the Big Island, “which still has active volcanoes,” so the opposite is <i>active</i>. <i>Inactive</i> and <i>sleeping</i> mean nearly the same as dormant."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Arm of Liberty</strong><br><p style=\"margin:0 0 8px;\">In the summer of 1876, eleven-year-old Thomas Reilly rode a crowded train from Trenton to Philadelphia with his uncle Patrick, a blacksmith. The whole country, it seemed, had come to the Centennial Exhibition, a fair celebrating one hundred years since the signing of the Declaration of Independence.</p><p style=\"margin:0 0 8px;\">Their first stop was Machinery Hall. There, the colossal Corliss steam engine, taller than a three-story house, turned a flywheel that powered hundreds of other machines through belts and shafts. Uncle Patrick stood in silence for a long time. “Every hammer I own,” he finally murmured, “and none of them could do in a day what this does in a minute.”</p><p style=\"margin:0 0 8px;\">Later, near the lagoon, Thomas spotted something even stranger: a giant copper hand gripping a torch, rising above the crowd. A sign explained that it belonged to a statue that France planned to give the United States, and that visitors could pay to climb a vertical ladder inside the arm to the balcony around the torch. The money would help pay to finish the statue.</p><p style=\"margin:0 0 8px;\">Thomas counted the coins in his pocket, then looked hopefully at his uncle. Uncle Patrick grinned and added a coin of his own. From the balcony, the fairgrounds spread out beneath them, and Thomas tried to imagine how tall the finished statue would be.</p>", "opts": ["Uncle Patrick refused to pay for the climb to the torch.", "The fair celebrated one hundred years since the Declaration of Independence.", "The torch belonged to a statue France planned to give the United States.", "The Corliss engine powered many other machines."], "ci": 0, "exp": "Uncle Patrick “grinned and added a coin of his own,” so he helped pay. The other three statements match the passage."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>How a Tornado Forms</strong><br><p style=\"margin:0 0 8px;\">A tornado is a violently spinning column of air that stretches from a thunderstorm down to the ground. Although tornadoes can strike almost anywhere, they are especially common in the central United States, a region sometimes nicknamed Tornado Alley, because warm, moist air from the Gulf of Mexico often collides there with cool, dry air from Canada.</p><p style=\"margin:0 0 8px;\">Most powerful tornadoes are born inside supercells. When winds near the ground blow in a different direction and at a different speed than winds higher up, the air between them begins to roll like a pencil between your palms. A strong updraft inside the storm can tilt this rolling air upright, and the whole storm begins to rotate. If the spinning narrows and tightens, it speeds up, just as a figure skater spins faster when she pulls in her arms, and a funnel may descend toward the earth.</p><p style=\"margin:0 0 8px;\">Tornado winds can exceed 200 miles per hour, causing tremendous damage in seconds. Because no one can prevent a tornado, forecasters concentrate on warning people early. Doppler radar can detect rotation inside a storm before a funnel ever appears, giving families precious minutes to reach a basement or an interior room.</p>", "opts": ["Tornadoes form only in the central United States.", "Doppler radar can detect rotation before a funnel appears.", "Tornado winds can be faster than 200 miles per hour.", "A spinning storm speeds up when the spinning narrows."], "ci": 0, "exp": "The passage says tornadoes “can strike almost anywhere,” even though they are especially common in the central United States. The other three statements match the passage."}, {"stem": "Why did few people most likely believe Johnny’s news?", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Twelve Seconds at Kill Devil Hills</strong><br><p style=\"margin:0 0 8px;\">Johnny Moore was a teenager in December 1903, and he had seen plenty of odd sights on the windswept dunes of Kill Devil Hills, North Carolina. Still, nothing seemed stranger than the two brothers from Dayton, Ohio, who had built a wooden shed on the sand and spent their days fussing over a contraption of spruce and muslin.</p><p style=\"margin:0 0 8px;\">On the bitter morning of December 17, a flag fluttered near the shed, the brothers’ signal that they wanted help. Johnny joined several men from the nearby lifesaving station to haul the machine to its launching rail. The wind gusted at more than twenty miles an hour, and Johnny was wary, half expecting the whole thing to flip over.</p><p style=\"margin:0 0 8px;\">At about 10:35, Orville Wright lay flat on the lower wing while the engine clattered. The machine rolled down the rail, lifted, and wobbled forward for twelve seconds before settling onto the sand about 120 feet away. One of the lifesaving men, John Daniels, snapped the photograph Orville had set up.</p><p style=\"margin:0 0 8px;\">Johnny hurried off to tell everyone he met, though few people believed a word of it.</p>", "opts": ["Most people had never imagined that a machine could really fly.", "The flight happened at night when no one could see.", "People did not trust the men from the lifesaving station.", "Johnny was known for making up stories."], "ci": 0, "exp": "The passage stresses how strange the brothers’ work seemed, and a flying machine was something new in 1903, so people doubted it. Nothing says Johnny told made-up stories, and the flight happened in the morning."}, {"stem": "Read this sentence: “The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer.” In this sentence, what does <b>current</b> mean?", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>High Water in Greenville</strong><br><p style=\"margin:0 0 8px;\">In April 1927, after months of relentless rain, the Mississippi River swelled higher than anyone in Greenville, Mississippi, could remember. Eleven-year-old Henry Jackson watched from the levee as brown water lapped just inches below the top of the earthen wall, and his father doubted it could withstand much more.</p><p style=\"margin:0 0 8px;\">On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning, and within hours the streets had become canals. His father hoisted Henry’s little sister onto the roof of their porch while Henry gathered the family’s quilts and a sack of cornmeal.</p><p style=\"margin:0 0 8px;\">Two days later, a rowboat finally reached their house. The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer around floating fence posts and ruined crops. They carried the family to the top of the levee, which had become a crowded, muddy camp for thousands of people.</p><p style=\"margin:0 0 8px;\">That night, Henry gazed across the vast brown lake that had once been farmland. His father rested a hand on his shoulder. “The river took a lot,” he said quietly, “but it couldn’t take us.”</p>", "opts": ["a flow of electricity through a wire", "the newest or latest version of something", "happening now, at the present time", "a strong flow of water moving in one direction"], "ci": 3, "exp": "<i>Current</i> has several meanings. Here it is the moving river water that “tugged” at the boat, so it means a strong flow of water. The other choices are real meanings of <i>current</i> that do not fit a rowboat on a flood."}, {"stem": "According to the story, which event happened right after the levee north of town gave way?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>High Water in Greenville</strong><br><p style=\"margin:0 0 8px;\">In April 1927, after months of relentless rain, the Mississippi River swelled higher than anyone in Greenville, Mississippi, could remember. Eleven-year-old Henry Jackson watched from the levee as brown water lapped just inches below the top of the earthen wall, and his father doubted it could withstand much more.</p><p style=\"margin:0 0 8px;\">On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning, and within hours the streets had become canals. His father hoisted Henry’s little sister onto the roof of their porch while Henry gathered the family’s quilts and a sack of cornmeal.</p><p style=\"margin:0 0 8px;\">Two days later, a rowboat finally reached their house. The current tugged so fiercely that the boatman, Mr. Lacey, needed Henry to help steer around floating fence posts and ruined crops. They carried the family to the top of the levee, which had become a crowded, muddy camp for thousands of people.</p><p style=\"margin:0 0 8px;\">That night, Henry gazed across the vast brown lake that had once been farmland. His father rested a hand on his shoulder. “The river took a lot,” he said quietly, “but it couldn’t take us.”</p>", "opts": ["Henry watched the water from the top of the levee.", "A rowboat reached the Jacksons’ house.", "The family was carried to the camp on the levee.", "Church bells rang to warn the town."], "ci": 3, "exp": "“On the morning of April 21, the levee north of town gave way. Henry heard church bells clanging a warning.” The rowboat came “two days later.”"}, {"stem": "Which word means the <b>SAME</b> or nearly the same as “reluctant” as it is used in the story?", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Poster Problem</strong><br><p style=\"margin:0 0 8px;\">Ruby had already outlined the title of their science-fair poster in tall purple letters when Dev slid into the seat beside her.</p><p style=\"margin:0 0 8px;\">“Purple?” he said, frowning. “Our project is about how plants grow under different colors of light. Shouldn’t the title be green?”</p><p style=\"margin:0 0 8px;\">Ruby kept her marker pressed to the paper. “Purple light made our bean plants grow tallest. That’s the whole point.”</p><p style=\"margin:0 0 8px;\">Dev was reluctant to argue, but he had spent three weekends measuring those plants. “Then at least let me make the graph,” he said quietly. “I know exactly where every number goes.”</p><p style=\"margin:0 0 8px;\">Ruby hesitated. She had planned to draw the graph herself, because her handwriting was neater. Then she glanced at Dev’s notebook, its pages crowded with careful columns of measurements and tiny dated sketches. She had never once seen him skip a day of watering.</p><p style=\"margin:0 0 8px;\">“Okay,” she said, sliding the ruler across the table. “You do the graph, and I’ll finish the title. But you have to pick the color for the bars.”</p><p style=\"margin:0 0 8px;\">Dev grinned for the first time all afternoon. “Green,” he said. “Obviously.”</p>", "opts": ["proud", "unwilling", "eager", "careful"], "ci": 1, "exp": "“Dev was reluctant to argue,” so he spoke “quietly” and did not push hard — he was not willing to start a fight. <i>Unwilling</i> means nearly the same; <i>eager</i> is close to the opposite."}, {"stem": "According to the story, what does Dev ask Ruby to let him do?", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Poster Problem</strong><br><p style=\"margin:0 0 8px;\">Ruby had already outlined the title of their science-fair poster in tall purple letters when Dev slid into the seat beside her.</p><p style=\"margin:0 0 8px;\">“Purple?” he said, frowning. “Our project is about how plants grow under different colors of light. Shouldn’t the title be green?”</p><p style=\"margin:0 0 8px;\">Ruby kept her marker pressed to the paper. “Purple light made our bean plants grow tallest. That’s the whole point.”</p><p style=\"margin:0 0 8px;\">Dev was reluctant to argue, but he had spent three weekends measuring those plants. “Then at least let me make the graph,” he said quietly. “I know exactly where every number goes.”</p><p style=\"margin:0 0 8px;\">Ruby hesitated. She had planned to draw the graph herself, because her handwriting was neater. Then she glanced at Dev’s notebook, its pages crowded with careful columns of measurements and tiny dated sketches. She had never once seen him skip a day of watering.</p><p style=\"margin:0 0 8px;\">“Okay,” she said, sliding the ruler across the table. “You do the graph, and I’ll finish the title. But you have to pick the color for the bars.”</p><p style=\"margin:0 0 8px;\">Dev grinned for the first time all afternoon. “Green,” he said. “Obviously.”</p>", "opts": ["measure the bean plants again", "change the title to green letters", "make the graph for the poster", "water the plants every weekend"], "ci": 2, "exp": "Dev says, “Then at least let me make the graph.” He does question the purple title, but what he actually asks to do is the graph."}, {"stem": "The poet writes that the wind “came walking down our street / on tall and restless, unseen feet.” What does this language do?", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Autumn Wind</strong><br><p style=\"margin:0 0 8px;\">The wind came walking down our street<br>on tall and restless, unseen feet;<br>it rattled every garden gate<br>and told the oak trees, “Don’t be late!”</p><p style=\"margin:0 0 8px;\">It tugged the scarves from children’s throats,<br>it puffed the sails of toy-pond boats,<br>it swept the maple’s red and gold<br>and scattered leaves both young and old.</p><p style=\"margin:0 0 8px;\">At dusk it hurried up the hill,<br>then, all at once, the world was still —<br>the branches bare, the sidewalk bright<br>with leaves like embers in the night.</p><p style=\"margin:0 0 8px;\">Tomorrow, when it comes once more<br>to knock and whistle at my door,<br>I’ll grab my coat and run outside<br>and let the restless wind decide.</p>", "opts": ["It tells exactly how fast the wind was blowing.", "It compares the wind to embers by using the word “like.”", "It shows that the speaker is afraid of the wind.", "It describes the wind as if it were a person."], "ci": 3, "exp": "Wind cannot really walk or have feet. Giving it human actions is called personification. The poem does use “like” later, but that compares the <i>leaves</i> to embers."}, {"stem": "Which sentence best states a theme of the story?", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>", "opts": ["Enough practice guarantees a perfect performance.", "Audiences always notice every small mistake.", "A mistake is not a failure if you keep going.", "It is better to avoid performing in front of crowds."], "ci": 2, "exp": "Jonah forgot the middle but kept playing, and at the end “he didn’t feel defeated by a mistake.” Ms. Bell even says audiences “rarely notice a slip.”"}, {"stem": "Read this sentence: “He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.” Which word means the <b>SAME</b> or nearly the same as <b>deliberate</b>?", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Middle Part</strong><br><p style=\"margin:0 0 8px;\">Jonah’s fingers felt numb as he waited backstage for his first piano recital. Through the curtain he could hear the girl before him finishing a flawless sonata, and the applause sounded like rain on a tin roof.</p><p style=\"margin:0 0 8px;\">“What if I forget the middle part again?” he whispered to Ms. Bell, his teacher.</p><p style=\"margin:0 0 8px;\">She tapped the music folder he was clutching. “Then you keep your hands moving and find the next phrase you know. Audiences rarely notice a slip. They notice when a performer gives up.”</p><p style=\"margin:0 0 8px;\">Jonah walked to the bench and began. The opening measures went smoothly, but halfway through, his mind went blank, exactly as he had feared. For one long, unbearable second, the hall was silent. Then he remembered Ms. Bell’s advice. He skipped ahead to the final section he had practiced most and played it with deliberate, steady confidence.</p><p style=\"margin:0 0 8px;\">Afterward, a woman in the front row told him the piece was lovely. Jonah grinned sheepishly. He knew it hadn’t been perfect, but for the first time, he didn’t feel defeated by a mistake.</p>", "opts": ["cheerful", "accidental", "hurried", "intentional"], "ci": 3, "exp": "<i>Deliberate</i> means done carefully and on purpose. Jonah chose the section he knew best and played it steadily, so <i>intentional</i> fits. <i>Hurried</i> and <i>accidental</i> mean nearly the opposite."}, {"stem": "What was the main way in which a caisson kept river water out while men dug?", "tag": "Main Way", "tagcolor": "#185FA5", "passage": "In the summer of 1881, twelve-year-old Thomas Byrne lived in a crowded apartment near the East River in Brooklyn. Every morning he watched hundreds of people squeeze onto the ferries that carried workers across the river to New York City. When fog or ice filled the river, the ferries stopped, and many families lost a day&rsquo;s pay. That was why the city was building the Brooklyn Bridge, a suspension bridge, or a bridge whose roadway hangs from huge cables stretched between tall towers.<br><br>Years earlier, Thomas&rsquo;s father had helped dig the bridge&rsquo;s foundations. He had worked in a caisson, a giant wooden box without a bottom that was sunk to the riverbed and filled with pressed air to keep the water out. Workers who came up too quickly often became sick with a painful illness called caisson disease. The chief engineer, Washington Roebling, became so ill that he could no longer leave his house.<br><br>One afternoon, Thomas delivered a package to the Roebling home. He saw Emily Roebling, the engineer&rsquo;s wife, studying drawings at a cluttered table. She explained that she carried her husband&rsquo;s instructions to the builders every day and had learned the mathematics of cables herself. <u>Mrs. Roebling was the most remarkable person in all of Brooklyn.</u><br><br>From the window, Thomas could see the two stone towers rising above the river like giant gray guardians. Workers were spinning steel wires into four thick cables, each made of more than 5,000 wires. Thomas asked whether a boy could ever learn to build something so enormous. Mrs. Roebling handed him a small notebook and told him to begin by writing down every question he had. On his way home, Thomas stopped at the water&rsquo;s edge, opened the notebook, and stared up at the cables shining in the evening sun.", "opts": ["It was held up by steel cables.", "It was covered with wet sheets.", "It was lined with stone from the towers.", "It was filled with pressed air."], "ci": 3, "exp": "The caisson was &ldquo;sunk to the riverbed and filled with pressed air to keep the water out.&rdquo;"}, {"stem": "Why did Ada most likely toss the comet pill into the pigpen?", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Night of the Comet</strong><br><p style=\"margin:0 0 8px;\">In May 1910, everyone in Harlan County, Nebraska, seemed to be talking about Halley’s Comet. The newspapers reported that Earth would pass through the comet’s glowing tail on the night of May 18, and some people were convinced the tail contained poisonous gas. In town, a traveling salesman was selling “comet pills” that he claimed would protect anyone who swallowed them.</p><p style=\"margin:0 0 8px;\">Ada Lindqvist, who was eleven, did not know what to believe. At supper she pushed her potatoes around her plate until her father set down his fork.</p><p style=\"margin:0 0 8px;\">“The tail is thinner than the air in this kitchen,” Papa said. “Astronomers have measured it. We will be fine.”</p><p style=\"margin:0 0 8px;\">“Then why is Mrs. Becker sealing her windows with wet towels?” Ada asked.</p><p style=\"margin:0 0 8px;\">Papa smiled. “Fear spreads faster than facts.”</p><p style=\"margin:0 0 8px;\">After dark, the whole family climbed onto the roof of the barn. The comet hung above the cornfields like a silver brushstroke, its tail stretching across a wide swath of sky. Ada held her breath at first, then let it out slowly. Nothing happened, except that the crickets kept singing.</p><p style=\"margin:0 0 8px;\">The next morning, she tossed the comet pill her friend had given her into the pigpen.</p>", "opts": ["Her friend asked her to get rid of it.", "She wanted the pigs to be protected from the gas.", "Papa told her that the pills were poisonous.", "She now believed the comet was harmless and the pill was useless."], "ci": 3, "exp": "Ada was afraid at first, but when “nothing happened,” she saw that Papa was right about the comet. Throwing the pill away shows she no longer believed she needed it. The story never says Papa called the pills poisonous."}, {"stem": "Read this sentence from “The Night of the Comet.”<br><br>“Fear <b>spreads</b> faster than facts.”<br><br>In this sentence, what does <b>spreads</b> mean?", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>The Night of the Comet</strong><br><p style=\"margin:0 0 8px;\">In May 1910, everyone in Harlan County, Nebraska, seemed to be talking about Halley’s Comet. The newspapers reported that Earth would pass through the comet’s glowing tail on the night of May 18, and some people were convinced the tail contained poisonous gas. In town, a traveling salesman was selling “comet pills” that he claimed would protect anyone who swallowed them.</p><p style=\"margin:0 0 8px;\">Ada Lindqvist, who was eleven, did not know what to believe. At supper she pushed her potatoes around her plate until her father set down his fork.</p><p style=\"margin:0 0 8px;\">“The tail is thinner than the air in this kitchen,” Papa said. “Astronomers have measured it. We will be fine.”</p><p style=\"margin:0 0 8px;\">“Then why is Mrs. Becker sealing her windows with wet towels?” Ada asked.</p><p style=\"margin:0 0 8px;\">Papa smiled. “Fear spreads faster than facts.”</p><p style=\"margin:0 0 8px;\">After dark, the whole family climbed onto the roof of the barn. The comet hung above the cornfields like a silver brushstroke, its tail stretching across a wide swath of sky. Ada held her breath at first, then let it out slowly. Nothing happened, except that the crickets kept singing.</p><p style=\"margin:0 0 8px;\">The next morning, she tossed the comet pill her friend had given her into the pigpen.</p>", "opts": ["passes quickly from person to person", "covers a surface with a thin layer", "opens out wide, like wings", "lays out a large meal on a table"], "ci": 0, "exp": "Papa means that scary ideas move from one person to another, like Mrs. Becker sealing her windows. The other choices are real meanings of <i>spread</i>, like spreading butter or a bird spreading its wings, but they do not fit here."}, {"stem": "How are the libraries in Passage A and Passage B alike?", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs.", "opts": ["Both help people share costly things instead of buying them.", "Both were started by Benjamin Franklin and his friends.", "Both lend mostly tools and musical instruments to families.", "Both opened in Philadelphia during colonial times."], "ci": 0, "exp": "In Passage A, books were &ldquo;expensive and rare,&rdquo; so members shared them. In Passage B, families share tools and instruments instead of buying them. The libraries are in different places and times, and only B lends tools."}, {"stem": "According to Passage A, how did the Library Company get money to buy books?", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs.", "opts": ["Readers paid each time they borrowed a book.", "The colony of Pennsylvania gave the club money.", "Benjamin Franklin paid for all the books himself.", "Each member paid a fee to join."], "ci": 3, "exp": "Passage A says, &ldquo;Each member paid a fee to join, and the money was used to purchase books from London.&rdquo; Members paid once to join, not each time they borrowed."}, {"stem": "Which list shows the events in the order they happened?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>", "opts": ["Hunters sell bison hides to factories → the American Bison Society is founded → Hornaday finds about a thousand bison left → Congress names the bison the national mammal", "Hornaday finds about a thousand bison left → hunters sell bison hides to factories → the American Bison Society is founded → Congress names the bison the national mammal", "Hunters sell bison hides to factories → Hornaday finds about a thousand bison left → Congress names the bison the national mammal → the American Bison Society is founded", "Hunters sell bison hides to factories → Hornaday finds about a thousand bison left → the American Bison Society is founded → Congress names the bison the national mammal"], "ci": 3, "exp": "The hunting happened in the 1870s and 1880s, Hornaday’s count was in 1889, the Society was founded in 1905, and Congress acted in 2016."}, {"stem": "According to the passage, what did the American Bison Society do?", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>", "opts": ["It counted the bison that were left in 1889.", "It sent bison to new wildlife refuges.", "It named the bison the national mammal.", "It bought the hides that hunters sold."], "ci": 1, "exp": "The passage says the Society “sent animals to new wildlife refuges.” Hornaday’s count happened in 1889, before the Society existed, and Congress (not the Society) named the national mammal in 2016."}, {"stem": "Read this sentence from “The Return of the Buffalo.”<br><br>“In the 1870s and 1880s, however, the herds <b>collapsed</b>.”<br><br>What does <b>collapsed</b> mean in this sentence?", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Return of the Buffalo</strong><br><p style=\"margin:0 0 8px;\">For thousands of years, enormous herds of American bison roamed the Great Plains. Early travelers described herds so vast that they took days to pass, and scientists estimate that tens of millions of bison once lived in North America. For many Plains nations, including the Lakota and the Comanche, the bison supplied food, clothing, tools, and shelter.</p><p style=\"margin:0 0 8px;\">In the 1870s and 1880s, however, the herds collapsed. Hunters shot bison by the millions to sell their hides to factories in the East, and new railroads carried the hides away by the trainload. By 1889, a count by the naturalist William Hornaday found that barely a thousand bison remained. The species was on the edge of extinction.</p><p style=\"margin:0 0 8px;\">A small group of people refused to let the animals vanish. Ranchers protected a few surviving herds, and in 1905 Hornaday helped found the American Bison Society, which sent animals to new wildlife refuges. Slowly, the numbers recovered. Today, hundreds of thousands of bison live on ranches, in parks, and on tribal lands, and in 2016 Congress named the bison the national mammal of the United States.</p>", "opts": ["shrank suddenly to a very small number", "joined together into one giant herd", "moved to a new part of the country", "fell down because they were tired"], "ci": 0, "exp": "The next sentences explain that hunters killed bison “by the millions” until “barely a thousand bison remained,” so the herds shrank very quickly. They did not move or join together, and the bison did not fall from tiredness."}, {"stem": "Read this line from the second stanza: “By April it is restless, broad, and loud.” Which word means the <b>OPPOSITE</b> of <b>restless</b>?", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>", "opts": ["uneasy", "noisy", "agitated", "calm"], "ci": 3, "exp": "In April the river is wild and moving; <i>restless</i> means unable to stay still. The opposite is <i>calm</i>, like the river in July that “hums a gentle tune.” <i>Uneasy</i> and <i>agitated</i> mean almost the same as restless."}, {"stem": "Which of these does the poem <b>NOT</b> describe the river doing?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>", "opts": ["swallowing a fence and a footbridge", "cracking its ice in March", "humming a gentle tune in July", "freezing over again in the fall"], "ci": 3, "exp": "The poem moves from March to April to July and never mentions fall. It does say the river “cracks its frozen coat,” “swallows fence and footbridge,” and “hums a gentle tune.”"}, {"stem": "Read this line from the first stanza: “and shoulders chunks of white like scattered dice.” What does <b>shoulders</b> mean in this line?", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The River Wakes</strong><br><p style=\"margin:0 0 8px;\">In March the river stirs beneath its ice;<br>it stretches, cracks its frozen coat in two,<br>and shoulders chunks of white like scattered dice<br>toward sleeping towns that never knew.</p><p style=\"margin:0 0 8px;\">By April it is restless, broad, and loud;<br>it gnaws the muddy banks with hungry teeth,<br>it swallows fence and footbridge, barn and plowed<br>brown earth, and drags the drowning crops beneath.</p><p style=\"margin:0 0 8px;\">But in July it hums a gentle tune,<br>a lazy ribbon, green and slow and thin,<br>where children wade beneath the summer moon<br>and herons wait to pull the minnows in.</p>", "opts": ["melts slowly in the sun", "carries gently on its back", "breaks into tiny pieces", "pushes forward with force"], "ci": 3, "exp": "The river has just cracked its ice “in two” and is moving the chunks “toward sleeping towns,” so <i>shoulders</i> means pushes hard, the way a person pushes with a shoulder. Nothing in the line is carried gently."}, {"stem": "According to the passage, why do wildfires often skip over land near a beaver pond?", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>", "opts": ["The dam blocks the wind from reaching the land.", "Farmers clear the land around the pond.", "Beavers cut down all the trees nearby.", "The ground there stays wet and soggy."], "ci": 3, "exp": "Because the pond holds water, “nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground.” Beavers do cut trees, but the passage links the fires to the wet ground."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Nature’s Engineers</strong><br><p style=\"margin:0 0 8px;\">Few animals reshape their surroundings as dramatically as the North American beaver. When a beaver family settles along a stream, it fells trees with its sharp orange front teeth, which never stop growing. The beavers then weave branches, stones, and mud into a dam that slows the current and floods the land behind it.</p><p style=\"margin:0 0 8px;\">The new pond serves several purposes. Deep water surrounds the family’s dome-shaped lodge of sticks, and because its entrances lie underwater, coyotes and wolves cannot easily reach the kits inside. During winter, the beavers store branches beneath the ice so they have food until spring.</p><p style=\"margin:0 0 8px;\">The effects reach far beyond the beavers themselves. Because the pond holds water that would otherwise rush downstream, nearby soil stays moist even during droughts, and wildfires often skip over the soggy ground. Ducks, frogs, fish, and moose thrive among the abundant wetland plants. Scientists call the beaver a keystone species; remove it from a valley, and much of the wildlife there begins to disappear. Not everyone welcomes these persistent rodents, however. Farmers sometimes discover their fields flooded or their fruit trees chewed down to stumps.</p>", "opts": ["Beaver dams speed up the current of a stream.", "Soil near a beaver pond can stay moist during a drought.", "A beaver’s front teeth never stop growing.", "Beavers store branches under the ice to eat in winter."], "ci": 0, "exp": "The passage says the dam “slows the current and floods the land behind it,” so it does not speed the current up. The other three statements match the passage."}, {"stem": "Which word means the <b>SAME</b> or nearly the same as “<b>stalling</b>” as it is used in the story?", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>Just a Tuesday</strong><br><p style=\"margin:0 0 8px;\">Owen chalked his hands for the third time and stared up at the purple route. It was the final climb of the Riverside Youth Bouldering Contest, and every competitor before him had slipped at the same overhang near the top.</p><p style=\"margin:0 0 8px;\">“You’re stalling,” his friend Jada said, nudging him. “You’ve practiced that move a hundred times.”</p><p style=\"margin:0 0 8px;\">“Practicing is different,” Owen muttered. “Nobody was watching then.”</p><p style=\"margin:0 0 8px;\">Coach Ortiz knelt beside him. “Forget the crowd. Climb it the way you’d climb it on a Tuesday afternoon, one hold at a time.”</p><p style=\"margin:0 0 8px;\">Owen nodded and began. His legs trembled at the overhang, and for a moment his fingers started to slide. Instead of lunging, he paused, shifted his hip closer to the wall, and reached deliberately for the next hold. It held. Three moves later, he slapped the top with both hands.</p><p style=\"margin:0 0 8px;\">The gym erupted, but Owen barely heard it. He was grinning at Coach Ortiz, who simply raised one thumb, as if to say, <i>Just a Tuesday.</i></p>", "opts": ["delaying", "bragging", "hurrying", "complaining"], "ci": 0, "exp": "Owen has chalked his hands “for the third time” and is staring at the route instead of climbing, so Jada says he is <i>stalling</i>: putting off starting. <i>Hurrying</i> means the opposite."}, {"stem": "The suffix <i>-ward</i> means &ldquo;in the direction of.&rdquo; What does &ldquo;downward&rdquo; most likely mean in &ldquo;water seeps downward through tiny cracks&rdquo;?", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>How Limestone Caves Form</strong><br><p style=\"margin:0 0 8px;\">Many of the world&rsquo;s largest caves were carved not by rushing rivers but by slow, quiet chemistry. As rain falls and soaks into the soil, it absorbs carbon dioxide and becomes a weak acid. This slightly acidic water seeps downward through tiny cracks in limestone, a rock made mostly of the shells and skeletons of ancient sea creatures. Little by little, the acid dissolves the rock, widening the cracks into tunnels and, after hundreds of thousands of years, into enormous rooms.</p><p style=\"margin:0 0 8px;\">Once a cave has formed, it continues to change. When water drips from the ceiling, it releases some of its carbon dioxide into the cave air, and a tiny ring of limestone is left behind. Over centuries, these rings build stalactites that hang down like icicles, while drops that splash on the floor build stalagmites that rise upward. Where the two meet, they form a column.</p><p style=\"margin:0 0 8px;\">Because many formations grow only about an inch every hundred years, they are fragile treasures. A single careless touch can leave skin oils that stop a formation from growing, which is why visitors to caves such as Mammoth Cave in Kentucky are asked to keep their hands to themselves.</p>", "opts": ["all the way to the bottom", "in a slow and quiet way", "deep under the ground", "toward a lower place"], "ci": 3, "exp": "<i>Down</i> + <i>-ward</i> (&ldquo;in the direction of&rdquo;) means &ldquo;in the direction of down,&rdquo; or toward a lower place. &ldquo;All the way to the bottom&rdquo; is too strong &mdash; the word tells only the direction."}, {"stem": "Read this sentence from the story.<br><br>“Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was <b>flawless</b>.”<br><br>Which word means the <b>OPPOSITE</b> of <b>flawless</b>?", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>The Leaky Lightning</strong><br><p style=\"margin:0 0 8px;\">Elena pressed the last strip of duct tape along the seam of the cardboard boat and stepped back. “It looks like a giant cereal box,” her little brother Sam said doubtfully.</p><p style=\"margin:0 0 8px;\">“It’s a racing boat,” Elena corrected him. “And it’s called the <i>Lightning</i>.”</p><p style=\"margin:0 0 8px;\">The rules of the Riverside Pool Cardboard Regatta were simple: build a boat from cardboard and tape, then paddle it across the pool. Elena had spent two weekends measuring and folding the most durable cardboard she could find, certain that her design was flawless.</p><p style=\"margin:0 0 8px;\">Five seconds after the starting whistle, cold water began seeping through the bottom. Sam’s knees were soaked. “We’re sinking!” he wailed.</p><p style=\"margin:0 0 8px;\">Elena’s stomach dropped. Every other boat was already halfway across. Then she remembered the extra roll of tape in her pocket. “Keep paddling,” she said. “I’ll patch it.”</p><p style=\"margin:0 0 8px;\">While Sam paddled furiously, Elena slapped tape over the widest crack. The leak slowed to a trickle. Inch by inch, the <i>Lightning</i> crept forward until its nose bumped the far wall.</p><p style=\"margin:0 0 8px;\">They finished last, but the crowd cheered louder for them than for the winners. Sam grinned and wiped the water off his face. “Next year,” he announced, “we use twice as much tape.”</p>", "opts": ["perfect", "faulty", "clever", "sturdy"], "ci": 1, "exp": "<i>Flawless</i> means having no mistakes. The opposite is <i>faulty</i>, which means having something wrong with it, and the leaky boat proves the design had a problem. <i>Perfect</i> means the same as flawless."}, {"stem": "Which event happened <b>right after</b> the two telegraph lines were joined?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Talking Wire</strong><br><p style=\"margin:0 0 8px;\">In 1860, sending news from New York to California took about ten days, even with Pony Express riders galloping in relays across the frontier. That year, Congress passed a law offering money to any company that could string a telegraph line across the continent. The Western Union company accepted the challenge and sent two crews toward each other, one heading west from Omaha, Nebraska, and the other heading east from California.</p><p style=\"margin:0 0 8px;\">The obstacles were formidable. On the treeless Great Plains, workers had to haul wooden poles for hundreds of miles by wagon. Bison sometimes rubbed their itchy hides against the poles until the poles toppled, and winter storms coated the wire with ice. Still, the crews advanced at a remarkable pace, frequently setting more than ten miles of poles in a single day.</p><p style=\"margin:0 0 8px;\">On October 24, 1861, the two lines were joined in Salt Lake City, Utah. Within hours, a message from California reached President Abraham Lincoln, assuring him that the state remained loyal to the Union during the Civil War. Two days later, the Pony Express announced that it would close. A journey that had demanded ten days now required only minutes.</p>", "opts": ["Western Union sent out two crews from opposite ends.", "Congress passed a law offering money for the line.", "The Pony Express announced that it would close.", "A message from California reached President Lincoln."], "ci": 3, "exp": "“Within hours” of the joining, the message reached Lincoln. The Pony Express closing came “two days later,” so it was not right after."}, {"stem": "According to the story, which statement is <b>NOT</b> true?", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>The Last Move</strong><br><p style=\"margin:0 0 8px;\">Kenji had practiced for weeks, but when the tournament director posted the final pairings, his stomach dropped. His opponent in the championship round was Ava, his best friend and the person who had taught him the game.</p><p style=\"margin:0 0 8px;\">“We don’t have to make this weird,” Ava said, sliding into the chair across from him. “Just play your best.”</p><p style=\"margin:0 0 8px;\">Kenji nodded, though his hands were trembling. For forty minutes the two of them traded pieces in near silence. Then Ava leaned back and frowned. Kenji glanced at the board and saw it: if he moved his knight, her queen would be trapped. He hesitated. Winning would mean defeating the person who had spent an entire summer patiently explaining openings to him at her kitchen table.</p><p style=\"margin:0 0 8px;\">He moved the knight.</p><p style=\"margin:0 0 8px;\">Ava stared at the board for a long moment. Then, to Kenji’s astonishment, she grinned and reached across to shake his hand. “I resign,” she said. “I’ve been waiting all year for you to find a move like that.”</p><p style=\"margin:0 0 8px;\">On the bus ride home, Kenji kept the small trophy in his lap, but what he remembered most was the pride in his friend’s voice.</p>", "opts": ["Ava had taught Kenji how to play chess.", "Kenji’s knight move trapped Ava’s king.", "The two players had traded pieces for forty minutes before Kenji saw his move.", "Ava resigned after Kenji moved his knight."], "ci": 1, "exp": "The story says that if Kenji moved his knight, “her queen would be trapped” — the queen, not the king. The other three statements match the story."}, {"stem": "According to the passage, which event happened right after burning embers leaped across the Chicago River?", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>The Night Chicago Burned</strong><br><p style=\"margin:0 0 8px;\">By October 1871, Chicago had become one of the fastest-growing cities in the United States. Most of its buildings, sidewalks, and even many of its streets were made of wood, and a long summer drought had left the entire city parched. Firefighters had battled dozens of blazes that autumn, and the exhausted crews were short on equipment.</p><p style=\"margin:0 0 8px;\">On the night of October 8, a fire broke out in a barn behind the home of Patrick and Catherine O’Leary on the city’s southwest side. Strong winds pushed the flames northeast toward the crowded downtown. Burning embers leaped across the Chicago River, and soon the city’s ity’s waterworks caught fire, cutting off the water that firefighters desperately needed. The blaze raged for more than a day until rain finally helped extinguish it on October 10.</p><p style=\"margin:0 0 8px;\">The destruction was tremendous: roughly 300 people died, and about 100,000 lost their homes. Yet Chicagoans refused to abandon their city. Within a few years, they had rebuilt with brick, stone, and iron, and new fire laws required sturdier materials downtown. Some of the architects who came to help went on to design the world’s first skyscrapers.</p>", "opts": ["very crowded", "badly damaged", "extremely dry", "nearly empty"], "ci": 2, "exp": "A drought is a long time without rain, and the dry wood is why the fire spread so fast. So <i>parched</i> means extremely dry. The city was crowded, but a drought does not make a city crowded."}, {"stem": "Read this sentence: “The bridge’s chief engineer, Joseph Strauss, had ordered a huge rope net strung beneath the <b>deck</b>.” Which meaning of <b>deck</b> is used in this sentence?", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>High Above the Golden Gate</strong><br><p style=\"margin:0 0 8px;\">Every morning in the spring of 1936, eleven-year-old Rosa Delgado climbed the hill near her house to watch her father leave for work. Papa was an ironworker on the Golden Gate Bridge, and from the hill she could see its two orange towers rising out of the fog like the masts of an enormous ship.</p><p style=\"margin:0 0 8px;\">Rosa knew the work was dangerous. Wind whipped through the strait, and the steel beams were often slick with mist. But Papa always reminded her about the net. The bridge’s chief engineer, Joseph Strauss, had ordered a huge rope net strung beneath the deck. “If anyone slips,” Papa said, “the net catches him like a fish.”</p><p style=\"margin:0 0 8px;\">One foggy afternoon, Papa came home later than usual. His friend Mr. Lindqvist had lost his footing on a beam and tumbled i ": "<strong>Taming the Colorado</strong><br><p style=\"margin:0 0 8px;\">During the early 1900s, the Colorado River was both a treasure and a threat. Its water could irrigate dry farmland across the Southwest, but spring floods regularly destroyed crops and homes downstream. In 1931, during the Great Depression, workers began building an enormous dam in Black Canyon, on the border between Nevada and Arizona. Thousands of unemployed men traveled there, eager for steady pay.</p><p style=\"margin:0 0 8px;\">First, crews blasted four giant tunnels through the canyon walls so that the river could be redirected around the construction site. Next, they poured concrete into hundreds of separate blocks, one column at a time. Because such a massive amount of concrete would have taken more than a century to cool on its own, engineers ran cold water through pipes buried inside it. The work was perilous. Men known as “high scalers” dangled from ropes hundreds of feet above the canyon floor to chip away loose rock.</p><p style=\"margin:0 0 8px;\">Hoover Dam was completed in 1936, two years ahead of schedule. Rising 726 feet, it created Lake Mead, and it still supplies water and electricity to millions of people in three states.</p>", "opts": ["safe", "exhausting", "lengthy", "dangerous"], "ci": 0, "exp": "<i>Perilous</i> means full of danger; the next sentence shows men dangling from ropes hundreds of feet up. The opposite is <i>safe</i>. “Dangerous” means the same thing, so it is a synonym, not the opposite."}, {"stem": "In Passage A, Lena and her father worked “so that the <b>beam</b> would never diminish.” Which meaning of <b>beam</b> is used here?", "tag": "Multiple-Meaning Word", "tagcolor": "#185FA5", "passage": "<strong>Keepers of the Light</strong><br><strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1886, twelve-year-old Lena Harlow lived at Seal Ledge Light, a stone tower on a rocky island off the coast of Maine. Each evening at sunset, she climbed eighty-on var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){

    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;

    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},

    }).catch(function(){});
  }catch(e){}
}

function reportProgress(){

    var answered=0, correct=0, wd=[];

      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];

var state = { answers:{}, cur:0, showResults:false };

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){

}

}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){

    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';

  }
  updateNav();
}

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';

    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);

  var hb = document.getElementById('hint-btn');

  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){

  saveState();

window.pick = pick;

}
window.prevQ = prevQ;
window.go = prevQ;

  state.showResults = true;

  var correct=0, wrong=0, skipped=0;

  var total = ord.length;

function updateNav(){

  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();

  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
