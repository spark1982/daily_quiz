<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct. This week's review — questions you missed recently.";
var TODAY_STR = "20261101";
var RAW_QUESTIONS = [{"stem": "We ________ that film at the cinema last March.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5", "opts": ["have watched", "watched", "had watched", "have been watching"], "ci": 1, "exp": "Last March is a specific finished time, so use simple past: watched."}, {"stem": "She <span style=\"text-decoration:underline;\">______</span> from a prestigious university before she turned twenty.", "tag": "Perfect Tense", "tagcolor": "#185FA5", "opts": ["had graduated", "graduated", "has graduated", "will have graduated"], "ci": 0, "exp": "\"had graduated\" is past perfect — she graduated before turning twenty."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Letter to Grandma</strong><br><b>(1)</b> Dear Grandma, last Saturday my class visited Miller Farm for our fall field trip. <b>(2)</b> Before that day, we <u>had never went</u> through a real corn maze. <b>(3)</b> My friend Jake and <u>me</u> got lost twice among the tall, dry stalks. <b>(4)</b> After a while, each of the paths <u>look</u> exactly the same. <b>(5)</b> Finally, a farmer standing on a wooden tower pointed us toward the exit. <b>(6)</b> When you visit next month, we <u>can</u> look at all my photos together. <b>(7)</b> Love, Marco", "opts": ["looks", "NO CHANGE", "are looking", "have looked"], "ci": 0, "exp": "The subject is <i>each</i>, which is always singular, not <i>paths</i>. So: <i>each of the paths <b>looks</b> exactly the same.</i>"}, {"stem": "What is the best way to combine sentences 3 and 4?", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Notice: Fall Fun Run</strong><br><b>(1)</b> Get ready for the Oakwood Elementary Fall Fun Run on Saturday, November 7, at Riverside Park! <b>(2)</b> Every runner should bring a water bottle a jacket, and comfortable shoes. <b>(3)</b> Parents can cheer at the finish line. <b>(4)</b> They can also help at the snack table. <b>(5)</b> Every runner who finishes. <b>(6)</b> Will get a shiny medal shaped like a maple leaf. <b>(7)</b> Please return you’re signed permission slip to the front office by Wednesday, November 4.", "opts": ["Parents can cheer at the finish line, but help at the snack table.", "Parents can cheer at the finish line, they can also help at the snack table.", "Parents can cheer at the finish line or help at the snack table.", "Parents can cheer at the finish line because they help at the snack table."], "ci": 2, "exp": "Join the two choices with <i>or</i>: <i>Parents can cheer at the finish line <b>or</b> help at the snack table.</i> A comma alone cannot join two sentences, and <i>because</i> changes the meaning."}, {"stem": "Which sentence has an error?", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Story: The Night the Lights Went Out</strong><br><b>(1)</b> When thunder crashed every light in the house went dark. <b>(2)</b> “Mom, where are the flashlights?” Mia asked. <b>(3)</b> “They’re in the kitchen drawer,” Mom answered, “next to the batteries.” <b>(4)</b> “I’ll get them” said Mia. <b>(5)</b> Mia found them quickly, and her brother said she did a <u>good</u> job. <b>(6)</b> Then Dad read us a chapter of <i>Charlotte’s web</i> by flashlight while rain drummed on the roof. <b>(7)</b> “That was the best blackout ever!” Leo said, smiling.", "opts": ["“That was the best blackout ever!” Leo said, smiling.", "“Mom, where are the flashlights?” Mia asked.", "Then Dad read us a chapter of <i>Charlotte’s web</i> by flashlight while rain drummed on the roof.", "“They’re in the kitchen drawer,” Mom answered, “next to the batteries.”"], "ci": 2, "exp": "In a book title, capitalize the important words: <i><b>Charlotte’s Web</b></i>."}, {"stem": "What is the best way to combine sentences 3 and 4?", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Journal: Taco Night</strong><br><b>(1)</b> Tonight I helped Mom cook chicken tacos for the whole family, including Grandpa. <b>(2)</b> First, I <u>chopped</u> the tomatoes while Mom browned the meat. <b>(3)</b> My little sister, Rosa, set the table with our blue plates. <b>(4)</b> She forgot to put out the forks. <b>(5)</b> At dinner, Dad said the tacos tasted <u>real</u> good. <b>(6)</b> I already want to cook again next Friday, and this time I will make the salsa. <b>(7)</b> <u>Because it was so much fun.</u>", "opts": ["My little sister, Rosa, set the table with our blue plates, but she forgot to put out the forks.", "My little sister, Rosa, set the table with our blue plates, so she forgot to put out the forks.", "My little sister, Rosa, set the table with our blue plates but, she forgot to put out the forks.", "My little sister, Rosa, set the table with our blue plates, she forgot to put out the forks."], "ci": 0, "exp": "Use a comma + <i>but</i> to join two sentences that show a contrast: she set the table, <b>but</b> she forgot the forks. <i>So</i> would mean the plates caused her to forget, and a comma alone cannot join two sentences."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>The Runaway Kite</strong><br><b>(1)</b> On a windy afternoon, Lily and her cousins took a red kite to Prairie Hill. <b>(2)</b> Neither Lily nor her cousins <u>was</u> ready for how hard the wind pulled. <b>(3)</b> The kite flew higher and higher. <b>(4)</b> Until the string snapped. <b>(5)</b> “Look up there” Lily cried as it drifted toward the pond. <b>(6)</b> Luckily, it landed in a short tree by the shore. <b>(7)</b> “We <u>could of</u> lost it forever,” her cousin Max said with a laugh.", "opts": ["were", "has been", "NO CHANGE", "is"], "ci": 0, "exp": "With <i>neither … nor</i>, the verb matches the subject closer to it. <i>Cousins</i> is plural, so: <i>Neither Lily nor her cousins <b>were</b> ready.</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Report: How Owls Hunt</strong><br><b>(1)</b> The great horned owl is a skilled hunter. <b>(2)</b> It lives in forests, deserts, and even city parks across North America. <b>(3)</b> The feathers on its wings <u>has</u> soft, fringed edges. <b>(4)</b> These edges break up the rushing air, so the owl can fly almost silently toward its prey. <b>(5)</b> Its ears are set at slightly different heights, <u>which</u> helps it find the exact spot of a sound. <b>(6)</b> In winter, it can even catch mice that are hiding under a thick blanket of snow. <b>(7)</b> <u>Because its hearing is so sharp.</u>", "opts": ["Because, its hearing is so sharp.", "NO CHANGE", "Because its hearing is so sharp and.", "This is because its hearing is so sharp."], "ci": 3, "exp": "A sentence that starts with <i>Because</i> and has nothing else is a fragment; it does not finish the thought. Make it complete: <i><b>This is because</b> its hearing is so sharp.</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Journal: Pancake Morning</strong><br><b>(1)</b> This morning, Dad and I made pancakes for the whole family. <b>(2)</b> First, we mixed flour, eggs, and milk in a big blue bowl. <b>(3)</b> Dad poured the batter onto the hot pan, and then he <u>flips</u> each pancake with a spatula. <b>(4)</b> My little sister wanted to help. <b>(5)</b> Even though she is only four years old. <b>(6)</b> Dad let <u>her and I</u> pour the syrup. <b>(7)</b> We <u>could of</u> eaten ten pancakes each, but Mom saved some for Grandma.", "opts": ["she and I", "she and me", "her and me", "NO CHANGE"], "ci": 2, "exp": "<i>Dad let ___ pour</i> needs object pronouns. Try each alone: <i>Dad let <b>her</b></i> and <i>Dad let <b>me</b></i>, so <i>Dad let <b>her and me</b> pour the syrup.</i>"}, {"stem": "What is the best way to combine sentences 4 and 5?", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Email to Aunt Mei</strong><br><b>(1)</b> Dear Aunt Mei, I joined the robotics club at school this fall. <b>(2)</b> So far our team <u>has builded</u> a small robot that can follow a black line. <b>(3)</b> The box of spare parts <u>sit</u> on a shelf in our classroom. <b>(4)</b> Ms. Ortiz is our coach. <b>(5)</b> She used to work at a car factory. <b>(6)</b> Next month we <u>might</u> enter a contest in Wichita. <b>(7)</b> I will send you a video of our robot soon!", "opts": ["Ms. Ortiz is our coach, she used to work at a car factory.", "Ms. Ortiz, which used to work at a car factory, is our coach.", "Ms. Ortiz, who used to work at a car factory, is our coach.", "Ms. Ortiz, whose used to work at a car factory, is our coach."], "ci": 2, "exp": "Use <i>who</i> for a person: <i>Ms. Ortiz, <b>who</b> used to work at a car factory, is our coach.</i> <i>Which</i> is for things, and a comma alone cannot join two sentences."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday I took my first pottery class at the community center. <b>(2)</b> Our teacher, Ms. Alvarez, <u>has taught</u> pottery for twenty years. <b>(3)</b> First she showed us how to center the clay on a spinning wheel. <b>(4)</b> My bowl came out lopsided, but it looked <u>real</u> nice after I painted it blue. <b>(5)</b> Ms. Alvarez baked the bowl in a hot oven called a kiln so <u>it’s</u> glaze would turn shiny. <b>(6)</b> I can’t wait to show it to you at Thanksgiving!", "opts": ["it is", "NO CHANGE", "its’", "its"], "ci": 3, "exp": "<i>Its</i> (no apostrophe) shows ownership; <i>it’s</i> means <i>it is</i>. The glaze belongs to the bowl: <i>so <b>its</b> glaze would turn shiny.</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Tiny Hovering Birds</strong><br><b>(1)</b> Hummingbirds are the smallest birds in North America, and some weigh less than a nickel. <b>(2)</b> The wings of a ruby-throated hummingbird <u>beats</u> about fifty times every second. <b>(3)</b> Scientists <u>have measured</u> their hearts at more than one thousand beats per minute. <b>(4)</b> Hummingbirds drink sweet nectar. <b>(5)</b> Nectar gives them the quick energy they need. <b>(6)</b> Every fall, a hummingbird flies south to spend its winter in Mexico or Central America. <b>(7)</b> Its a long trip for such a tiny bird.", "opts": ["NO CHANGE", "measuring", "have measure", "has measured"], "ci": 0, "exp": "<i>Scientists</i> is plural, so <i>have</i> is right, and <i>measured</i> is the correct past participle. The sentence is already correct."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Thank-You Email to Aunt Meg</strong><br><b>(1)</b> Thank you so much for the telescope you sent for my birthday. <b>(2)</b> Last night, Dad <u>set</u> it up in the backyard, and we looked at the moon for an hour. <b>(3)</b> I <u>have saw</u> pictures of craters before, but seeing them myself was amazing. <b>(4)</b> Tomorrow night, <u>my brother and me</u> want to find Saturn. <b>(5)</b> Mom says Saturns rings are easy to spot on a clear night. <b>(6)</b> The telescope&rsquo;s instruction book has helpful star maps, too. <b>(7)</b> I will send you a picture of the moon soon!", "opts": ["NO CHANGE", "have seen", "has seen", "had saw"], "ci": 1, "exp": "After <i>have</i>, use the past participle <i>seen</i>, not the past tense <i>saw</i>: <i>I <b>have seen</b> pictures of craters before.</i>"}, {"stem": "Which sentence has an error?", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Diary: My First Time Ice Skating</strong><br><b>(1)</b> Today Mom took my sister and me to the ice rink downtown. <b>(2)</b> I <u>had never wore</u> ice skates before. <b>(3)</b> At first, I held on to the wall and moved very slow. <b>(4)</b> My sister said, “You <u>should</u> bend your knees a little.” <b>(5)</b> I fell twice, but by the end of the hour I could skate across the whole rink. <b>(6)</b> When the music <u>stops</u>, we took off our skates and drank hot cocoa.", "opts": ["I fell twice, but by the end of the hour I could skate across the whole rink.", "At first, I held on to the wall and moved very slow.", "My sister said, “You should bend your knees a little.”", "Today Mom took my sister and me to the ice rink downtown."], "ci": 1, "exp": "<i>Slow</i> describes a thing; to tell <i>how</i> I moved, use the adverb <i>slowly</i>: <i>I held on to the wall and moved very <b>slowly</b>.</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Notice: Pajama Read-In</strong><br><b>(1)</b> The Lincoln Elementary library is hosting a Pajama Read-In next Friday night. <b>(2)</b> Students may wear <u>they’re</u> favorite pajamas and bring a pillow. <b>(3)</b> Each of the classrooms are going to set up a cozy reading corner. <b>(4)</b> The event starts at 6:00 in the evening. <b>(5)</b> It ends at 8:00 when families pick up their children. <b>(6)</b> Hot cocoa and cookies will be served in the gym before the reading begins. <b>(7)</b> Please read <u>quiet</u> so others can enjoy their books too.", "opts": ["theirs", "their", "there", "NO CHANGE"], "ci": 1, "exp": "<i>They’re</i> means <i>they are</i>. To show the pajamas belong to the students, use <i>their</i>: <i>Students may wear <b>their</b> favorite pajamas.</i>"}, {"stem": "Which sentence has an error?", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Notice: Pajama Read-In</strong><br><b>(1)</b> The Lincoln Elementary library is hosting a Pajama Read-In next Friday night. <b>(2)</b> Students may wear <u>they’re</u> favorite pajamas and bring a pillow. <b>(3)</b> Each of the classrooms are going to set up a cozy reading corner. <b>(4)</b> The event starts at 6:00 in the evening. <b>(5)</b> It ends at 8:00 when families pick up their children. <b>(6)</b> Hot cocoa and cookies will be served in the gym before the reading begins. <b>(7)</b> Please read <u>quiet</u> so others can enjoy their books too.", "opts": ["Each of the classrooms are going to set up a cozy reading corner.", "Hot cocoa and cookies will be served in the gym before the reading begins.", "The event starts at 6:00 in the evening.", "The Lincoln Elementary library is hosting a Pajama Read-In next Friday night."], "ci": 0, "exp": "With <i>each</i>, use a singular verb, even when a plural word like <i>classrooms</i> comes after it: <i>Each of the classrooms <b>is</b> going to set up a cozy reading corner.</i>"}, {"stem": "What is the best way to combine sentences 2 and 3?", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Picture Day Notice</strong><br><b>(1)</b> School Picture Day is Thursday, November 5, in the gym. <b>(2)</b> Students should wear their brightest smiles. <b>(3)</b> They should bring a comb. <b>(4)</b> Mr. Bell, <u>who</u> takes our school photos every year, will set up his camera at 8:00. <b>(5)</b> If you want a retake, you can talk to Mrs. Ford or I in the front office. <b>(6)</b> Picture packets will be sent home <u>quick</u>, usually within three weeks. <b>(7)</b> Please return the order form to your teacher by Monday.", "opts": ["Students should wear their brightest smiles, they should bring a comb.", "Students should wear their brightest smiles, bring a comb.", "Students should wear their brightest smiles or bring a comb.", "Students should wear their brightest smiles and bring a comb."] ttle brother covers his ears.</i>"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>The Robot Kit</strong><br><b>(1)</b> On Saturday, Nora and her grandpa opened a robot kit on the kitchen table. <b>(2)</b> The box of tiny screws and wires <u>was</u> heavier than Nora expected. <b>(3)</b> \"Where do we start\"? Nora asked. <b>(4)</b> Grandpa pointed to the instruction book and said, \"Page one, of course.\" <b>(5)</b> They worked for two hours and the robot finally rolled across the floor. <b>(6)</b> Grandpa smiled at Nora. <b>(7)</b> Grandpa had once built robots for a car factory.", "opts": ["NO CHANGE", "were", "have been", "are"], "ci": 0, "exp": "The subject is <i>box</i> (one box), not <i>screws and wires</i>, which are inside the phrase <i>of tiny screws and wires</i>. One box takes <i>was</i>, so the sentence is already correct."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Letter to Cousin Ava</strong><br><b>(1)</b> Dear Ava, last Saturday my whole family drove two hours to Hillside Orchard to pick apples and pumpkins. <b>(2)</b> Dad and <u>me</u> filled three huge baskets with shiny red apples before lunch. <b>(3)</b> The trees in the oldest rows were very tall. <b>(4)</b> We needed a ladder to reach the best apples. <b>(5)</b> After we finished picking we drank cold cider and ate warm donuts at the farm stand. <b>(6)</b> Next fall you <u>should of</u> come with us so we can pick even more!", "opts": ["NO CHANGE", "should", "shall of", "should have"], "ci": 1, "exp": "<i>Should of</i> is never correct; it comes from how <i>should’ve</i> sounds. Because this is about next fall, use <i>should</i> + verb: <i>Next fall you <b>should</b> come with us.</i>"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
