<style>

  * { box-sizing: border-box; }

  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }

  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues. This week's review — questions you missed recently.";
var TODAY_STR = "20261101";
var RAW_QUESTIONS = [{"stem": "There was a <b>dramatic</b> drop in temperature last night: it went from 70 degrees to 35 degrees in just a few hours. In this sentence, what does <b>dramatic</b> mean?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["exciting to watch, like a movie", "showing feelings in a big, showy way", "having to do with plays and acting", "sudden and very large"], "ci": 3, "exp": "<i>dramatic</i> (adj.) can mean (1) about plays and acting, (2) acting in a big, showy way, or (3) sudden and very large. A drop of 35 degrees in a few hours is sudden and very large. <i>The city saw a <b>dramatic</b> rise in visitors.</i> Family: drama (n.), dramatically (adv.)"}, {"stem": "Instead of looking everywhere at once, the detective made a _____ search, checking the house one room at a time from top to bottom.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["systematic", "reluctant", "abundant", "frequent"], "ci": 0, "exp": "<i>systematic</i> (adj.) done in a careful, step-by-step order. <i>A <b>systematic</b> search checks every room in order.</i> Family: system (n.), systematically (adv.)."}, {"stem": "The puppy was <b>eager</b> to go outside and wagged its tail at the door. Which word means the <b>OPPOSITE</b> of <b>eager</b>?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["excited", "keen", "patient", "reluctant"], "ci": 3, "exp": "<i><b>eager</b></i> (adj.) wanting very much to do something. The opposite is <i>reluctant</i> — not wanting to do it. <i>Keen</i> is a trap — it means nearly the same as eager. Family: eagerly (adv.), eagerness (n.)."}, {"stem": "The numbers on the map <b>correspond</b> to the numbered stops on the tour, so stop 3 is marked with a 3. Which word means the <b>SAME</b> or nearly the same as “correspond”?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["differ", "match", "repeat", "explain"], "ci": 1, "exp": "<i>correspond</i> (v.) to match or be connected to something. Here each number matches a stop. <i>Differ</i> is the opposite. <i>Each key <b>corresponds</b> to one lock.</i> Family: correspondence (n.)"}, {"stem": "Scientists created a <b>______</b> system that puts living things into groups such as kingdoms, families, and species. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["emergence", "prosperity", "classification", "tolerance"], "ci": 2, "exp": "<i><b>classification</b></i> (n.) the act or system of sorting things into groups. <i>The <b>classification</b> of animals helps scientists compare them.</i> Family: classify (v.) Only “classification” describes a system for putting things into groups."}, {"stem": "“When the council voted, there was only one voice of <b>dissent</b>; everyone else said yes.”<br><br>Which word means the <b>SAME</b> or nearly the same as <b>dissent</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["approval", "silence", "agreement", "disagreement"], "ci": 3, "exp": "<i>dissent</i> (n.) disagreeing with what most people think or decide. One person said no while everyone else said yes. <i>Agreement</i> and <i>approval</i> are opposites. Family: dissenter (n.)"}, {"stem": "The invention of the smartphone caused a <b>revolution</b> in the way people talk to each other. What does <b>revolution</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a small improvement", "a long argument", "a careful plan", "a huge change"], "ci": 3, "exp": "<i>revolution</i> (n.) a very big change in the way people live or do things. <i>The printing press started a <b>revolution</b> in reading.</i> Family: revolutionary (adj.)"}, {"stem": "The school <b>administration</b> decided to add a second recess on Fridays. Which meaning of <b>administration</b> is used here?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["the people who run and manage an organization", "a test given to a whole class", "the act of giving someone medicine", "the group of leaders working with a country’s president"], "ci": 0, "exp": "<i><b>administration</b></i> can mean the people who manage a place like a school or company, a president’s team of leaders (<i>the Lincoln <b>administration</b></i>), or the act of giving something out, like medicine. Here it is the school’s managers. Family: administer (v.), administrator (n.)."}, {"stem": "The coach wanted to <b>integrate</b> the new players into the team, so everyone practiced and ate lunch together.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>integrate</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["combine", "separate", "train", "select"], "ci": 0, "exp": "<i>integrate</i> (v.) to bring parts or people together so they work as one whole. <i>Separate</i> is the opposite. <i>Our teacher <b>integrates</b> art into science lessons.</i> Family: integration (n.)"}, {"stem": "Frederick Douglass traveled across the country, giving speeches that called for the ______ of slavery.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["legislation", "abolition", "expansion", "revolution"], "ci": 1, "exp": "<i>abolition</i> (n.) the act of officially ending something, especially slavery. Douglass wanted slavery ended, so <i>abolition</i> fits; <i>expansion</i> would mean making slavery bigger. <i>The <b>abolition</b> of slavery came with the 13th Amendment in 1865.</i> Family: abolish (v.), abolitionist (n.)"}, {"stem": "Jordan's story was finally _____ after he put the events in order, so his listeners could follow what happened first, next, and last.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["coherent", "fragile", "reluctant", "obvious"], "ci": 0, "exp": "<i>coherent</i> (adj.) clear and logical, with parts that fit together. <i>A <b>coherent</b> paragraph has ideas in a sensible order.</i> Family: coherence (n.)."}, {"stem": "After losing the spelling bee, Maya <b>resolved</b> to practice ten new words every day. Which meaning of <b>resolve</b> is used here?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["to find the answer to a problem", "to make a promise to someone else", "to settle an argument between people", "to decide firmly to do something"], "ci": 3, "exp": "<i><b>resolve</b></i> (v.) to decide firmly to do something; also, to solve or settle a problem. <i>I <b>resolved</b> to go to bed earlier this week.</i> Family: resolution (n.) Maya made a strong decision about her own plan."}, {"stem": "The author’s novel was <b>adapted</b> into a movie, so some scenes were shortened and new music was added. Which meaning of <b>adapt</b> is used in this sentence?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["changed a tool or machine so it can be used in a new way", "rewritten in a new form, such as a movie or play", "changed over many generations to survive in a habitat", "got used to a new place or situation"], "ci": 1, "exp": "<i>adapt</i> (v.) can mean to change to fit a new place, to change over generations to survive, or to rewrite a story in a new form. <i>The class <b>adapted</b> the fairy tale into a short play.</i> Family: adaptation (n.), adaptable (adj.). The novel became a movie, so it was rewritten in a new form."}, {"stem": "To <b>illustrate</b> how a volcano erupts, Mr. Ortiz poured vinegar into a clay mountain filled with baking soda. What does <b>illustrate</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["to prove that an idea is wrong", "to show or explain something by giving an example", "to measure something very exactly", "to draw pictures for a book or magazine"], "ci": 1, "exp": "<i><b>illustrate</b></i> (v.) to make an idea clear by showing an example. <i>The coach drew a play on the board to <b>illustrate</b> his plan.</i> Family: illustration (n.), illustrator (n.) <i>Illustrate</i> can also mean “draw pictures for a book,” but Mr. Ortiz did not draw anything — he showed an example."}, {"stem": "The scientists made a careful _____ of the nest each morning, writing down how many eggs had hatched. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["hypothesis", "foundation", "observation", "controversy"], "ci": 2, "exp": "<i>observation</i> (n.) the act of watching something closely and noting what you see. They watched and wrote down what happened, so it was an observation, not a <i>hypothesis</i> (a guess made before testing). <i>My <b>observation</b> was that the plant leaned toward the window.</i> Family: observe (v.), observer (n.)"}, {"stem": "To keep the sick hamster from spreading the illness, the vet told us to <b>isolate</b> it in a separate cage for a week. What does <b>isolate</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["to keep warm and quiet", "to feed on a special diet", "to keep apart from others", "to check often for signs of sickness"], "ci": 2, "exp": "<i><b>isolate</b></i> (v.) to set apart or keep away from others. <i>The island was <b>isolated</b>, so supplies came only once a month.</i> Family: isolated (adj.), isolation (n.) A separate cage keeps the hamster away from the others."}, {"stem": "The word <b>construct</b> has more than one meaning. Which meaning is used in this sentence?<br><br>“In math class, we used a ruler and a compass to <b>construct</b> a triangle with three equal sides.”", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["an idea that people have made up (noun)", "to draw a shape exactly, using tools", "to build a large structure such as a bridge", "to put words together into a sentence or argument"], "ci": 1, "exp": "<i>construct</i> can mean to build a structure, to put ideas or words together, or (in math) to draw a figure exactly with tools. A ruler, a compass, and a triangle show the math meaning. Family: construction (n.), constructive (adj.)"}, {"stem": "After many complaints about long lunch lines, the principal promised to _____ the way the cafeteria worked. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["reform", "inherit", "evacuate", "conceal"], "ci": 0, "exp": "<i><b>reform</b></i> (v.) to change something in order to make it better. <i>The city wants to <b>reform</b> its bus system.</i> Family: reformer (n.) The complaints show that the cafeteria needed to be improved."}, {"stem": "“Fairness is an <b>abstract</b> idea, so you cannot touch it or hold it in your hand.”<br><br>Which word means the <b>OPPOSITE</b> of <b>abstract</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["general", "concrete", "theoretical", "complex"], "ci": 1, "exp": "<i>abstract</i> (adj.) existing as an idea, not as a real object you can touch. The opposite is <i>concrete</i>: something real you can see or touch. <i>Theoretical</i> and <i>general</i> are close in meaning to abstract."}, {"stem": "During the fire drill, everyone followed the school's ______: line up quietly, walk to the nearest exit, and meet on the field.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["procedure", "priority", "heritage", "territory"], "ci": 0, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>The nurse explained the <b>procedure</b> for getting a flu shot.</i> Family: proceed (v.), procedural (adj.)"}, {"stem": "The class voted to _____ half of the bake-sale money to the animal shelter and the other half to new library books. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["allocate", "exaggerate", "examine", "abandon"], "ci": 0, "exp": "<i><b>allocate</b></i> (v.) to give a share of something for a certain purpose. <i>The school <b>allocated</b> two hours a week for art.</i> Family: allocation (n.) The class decided which part of the money would go where."}, {"stem": "The team practiced the trick play all week, and on Saturday they <b>executed</b> it perfectly to score the winning goal.<br><br>What does <b>execute</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["carried out or performed", "changed at the last minute", "explained in words", "forgot about"], "ci": 0, "exp": "<i>execute</i> (v.) to carry out a plan or perform an action. They did the play perfectly in the game. <i>The gymnast <b>executed</b> a flawless flip.</i> Family: execution (n.)"}, {"stem": "Maya’s essay argued for a longer recess. To make it stronger, her teacher told her to add a ______ — one reason someone might disagree — and then explain why that reason does not work.<br><br>Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["heritage", "benchmark", "hypothesis", "counterargument"], "ci": 3, "exp": "<i>counterargument</i> (n.) a reason someone might give against your idea. Strong writers answer it. <i>Ben answered the <b>counterargument</b> that recess wastes class time.</i> A <i>hypothesis</i> is a guess you test in science."}, {"stem": "Our teacher asked us to <b>incorporate</b> at least two facts from the article into our own paragraphs, so the facts became part of what we wrote.<br><br>What does <b>incorporate</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["to check whether something is true", "to leave something out on purpose", "to include something as part of a larger whole", "to copy something word for word"], "ci": 2, "exp": "<i>incorporate</i> (v.) to take something in and make it part of a bigger thing. <i>The chef <b>incorporated</b> fresh herbs into the soup.</i> Family: incorporation (n.)"}, {"stem": "A <b>colony</b> of ants built a maze of tunnels under the sidewalk. In this sentence, what does <b>colony</b> mean?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["a settlement started by people who moved from another country", "an area ruled by a faraway nation", "a system of tunnels dug under the ground", "a large group of the same kind of animal living together"], "ci": 3, "exp": "<i>colony</i> (n.) can mean (1) a settlement started by people from another country, (2) a land ruled by a faraway nation, or (3) a group of the same kind of animal living together. Here it is the group of ants; the tunnels are what the colony built. <i>A <b>colony</b> of bats lives in the old barn.</i> Family: colonist (n.), colonial (adj.)"}, {"stem": "Before the experiment, the class read the safety ______ step by step: goggles on, gloves on, then measure the vinegar.<br><br>Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["procedure", "hypothesis", "statistic", "phenomenon"], "ci": 0, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>Every fire drill follows the same <b>procedure</b>.</i> Family: procedural (adj.), proceed (v.)"}, {"stem": "In the old legend, the knight’s greatest <b>exploit</b> was crossing the frozen mountains alone to rescue the village. Which meaning of <b>exploit</b> is used in this sentence?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["to treat someone unfairly to get something for yourself", "to make full use of something, such as a natural resource", "a brave or daring act", "a trick that takes advantage of a weakness in a computer program"], "ci": 2, "exp": "<i>exploit</i> has several meanings. As a noun it can mean a brave, exciting act. As a verb it can mean to use something fully, or to treat someone unfairly. <i>The pilot’s <b>exploits</b> were told in every newspaper.</i> Here it names something the knight did that was daring: “crossing the frozen mountains alone.”"}, {"stem": "This orange juice is made from <b>concentrate</b>, so you mix it with three cans of water before you drink it. Which meaning of <b>concentrate</b> is used in this sentence?", "tag": "Multiple Meanings", "tagcolor": "#7b61ff", "opts": ["to mix two liquids together evenly", "a strong liquid that has had most of its water taken out", "to bring many people or things together in one place", "to focus all your attention on one thing"], "ci": 1, "exp": "<i><b>concentrate</b></i> has several meanings. Here it is a noun: a strong liquid with most of the water removed — that is why you add water back. <i>I need quiet so I can <b>concentrate</b> on my homework</i> uses the “focus your attention” meaning. Family: concentration (n.)"}, {"stem": "The book had a <b>profound</b> effect on Marcus; after reading it, he decided to become a doctor. Which word means the <b>OPPOSITE</b> of <b>profound</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["lasting", "deep", "powerful", "slight"], "ci": 3, "exp": "<i><b>profound</b></i> (adj.) very deep or strong. <i>The music had a <b>profound</b> effect on the crowd.</i> The opposite is <i>slight</i> (very small). “Deep” and “powerful” mean nearly the same as <i>profound</i>."}, {"stem": "Our school has a strict _____: phones must stay in lockers during class.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["hypothesis", "policy", "phenomenon", "tributary"], "ci": 1, "exp": "<i><b>policy</b></i> (n.) a rule or plan that a group, school, or government follows. <i>The store’s return <b>policy</b> gives you 30 days to bring items back.</i> Family: policies (n.)"}, {"stem": "Her nervousness began to __________ itself in small ways: she tapped her pencil and kept checking the clock.<br><br>Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["manifest", "sustain", "integrate", "execute"], "ci": 0, "exp": "<i>manifest</i> (v.) to show something clearly so that others can see it. Her tapping and clock-checking showed her nerves. <i>The disease <b>manifests</b> itself as a rash.</i> Family: manifestation (n.)"}, {"stem": "Ben's essay was ______: each sentence connected clearly to the next, and his ideas were easy to follow.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["abundant", "coherent", "reluctant", "fragile"], "ci": 1, "exp": "<i>coherent</i> (adj.) clear, logical, and easy to understand because the parts fit together. <i>After a good night's sleep, his answers were much more <b>coherent</b>.</i> Family: coherence (n.), incoherent (adj., opposite)"}, {"stem": "Like many <b>immigrants</b> in the early 1900s, Rosa’s great-grandfather arrived at Ellis Island with one suitcase, hoping to build a new life in America. What does <b>immigrant</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a person who visits a place for a short vacation", "a person who works on a ship that crosses the ocean", "a person who explores lands no one has mapped", "a person who comes to live in a new country"], "ci": 3, "exp": "<i>immigrant</i> (n.) a person who comes to live permanently in a new country. <i>The city’s first bakery was opened by an <b>immigrant</b> from Italy.</i> Family: immigrate (v.), immigration (n.). He came “hoping to build a new life,” so he planned to stay, not just visit."}, {"stem": "When Ella turned eleven, her parents gave her more _____: she could choose her own after-school activities and plan her own homework time.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["legislation", "boundary", "autonomy", "procedure"], "ci": 2, "exp": "<i>autonomy</i> (n.) the freedom to make your own choices and control your own actions. <i>Older students get more <b>autonomy</b> in choosing projects.</i> Family: autonomous (adj.)."}, {"stem": "When smoke filled the hallway, the teachers had to <b>evacuate</b> the building. Which word means the <b>OPPOSITE</b> of <b>evacuate</b>?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["empty", "clear", "enter", "leave"], "ci": 2, "exp": "<i><b>evacuate</b></i> (v.) to leave or move people out of a dangerous place. The opposite is <i>enter</i>. <i>Empty</i> and <i>leave</i> are traps — they mean nearly the same as evacuate. Family: evacuation (n.)."}, {"stem": "The store gave each shopper a free gift card to <b>compensate</b> them for the long wait at the checkout. What does <b>compensate</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["reward for being loyal over many years", "charge an extra fee to", "make up for a loss or a problem", "apologize in writing to"], "ci": 2, "exp": "<i>compensate</i> (v.) to give something to make up for a loss, harm, or trouble. <i>The airline offered meals to <b>compensate</b> passengers for the delay.</i> Family: compensation (n.)"}, {"stem": "The recipe gave ______ directions: “Bake at 350 degrees for exactly 25 minutes.” Nobody had to guess.<br><br>Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["ominous", "explicit", "fragile", "vague"], "ci": 1, "exp": "<i>explicit</i> (adj.) stated clearly and exactly, leaving nothing unclear. The recipe gave an exact temperature and time. <i>Vague</i> means the opposite. Family: explicitly (adv.)"}, {"stem": "Nora ______ left the last cookie on the plate so her little brother could have it.<br><br>Which word correctly completes the sentence?", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["deliberated", "deliberation", "deliberate", "deliberately"], "ci": 3, "exp": "The blank describes how she left it, so it needs an adverb: <i>deliberately</i> (on purpose). <i>Deliberate</i> is the adjective (a <i>deliberate</i> choice). Family: deliberate (adj./v.), deliberation (n.)"}, {"stem": "At the science fair, Ben’s volcano was placed in the Earth Science _____, next to projects about rocks and earthquakes. Which word best completes the sentence?", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["fortune", "category", "summit", "hazard"], "ci": 1, "exp": "<i><b>category</b></i> (n.) a group of things that are alike in some way. <i>Apples and pears belong in the fruit <b>category</b>.</i> Family: categorize (v.) The volcano was grouped with other Earth Science projects."}, {"stem": "Leaders from many countries rushed to _____ the attack on the peaceful village.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["condemn", "migrate", "compensate", "commence"], "ci": 0, "exp": "<i><b>condemn</b></i> (v.) to say strongly that something is wrong or bad. <i>The principal <b>condemned</b> the bullying in a letter to families.</i> Family: condemnation (n.)."}, {"stem": "The nurse will __________ the flu shots to every student on Friday morning.<br><br>Which form of the word correctly completes the sentence?", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["administration", "administrative", "administrator", "administer"], "ci": 3, "exp": "The blank needs a verb after <i>will</i>, so use <i>administer</i> (v.) to give or manage something officially. <i>Administration</i> (n.) is the group that runs something, <i>administrator</i> (n.) is a person, and <i>administrative</i> is an adjective. <i>The school <b>administration</b> planned the event.</i>"}, {"stem": "The new bike lanes had a big <b>impact</b> on the town: twice as many kids now ride their bikes to school. What does <b>impact</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a high cost to pay", "a sudden crash between two objects", "a long delay", "a strong effect"], "ci": 3, "exp": "<i>impact</i> (n.) a strong effect or influence; it can also mean the force of one thing hitting another. <i>Planting trees had a huge <b>impact</b> on how cool the street felt.</i> Family: impactful (adj.). Here nothing crashed — the bike lanes changed how many kids ride, which is an effect."}, {"stem": "Many people in the 1800s worked hard to ______ slavery, and in 1865 the Thirteenth Amendment finally ended it.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["abolish", "endure", "restore", "acquire"], "ci": 0, "exp": "<i>abolish</i> (v.) to officially end a law or system. The sentence says slavery was <i>finally ended</i>. <i>Endure</i> (put up with), <i>acquire</i> (get), and <i>restore</i> (bring back) do not fit. Family: abolition (n.)"}, {"stem": "At dinner, Grandpa loves to <b>recount</b> the day he caught a twelve-pound catfish, telling every detail just as it happened.<br><br>What does <b>recount</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["count again", "tell the story of", "try hard to remember", "make bigger than it really was"], "ci": 1, "exp": "<i>recount</i> (v.) to tell the story of something that happened. (It can also mean &ldquo;count again,&rdquo; but here Grandpa is <i>telling every detail</i>.) <i>The book <b>recounts</b> the journey of the first pioneers.</i> Family: recounting (n.)"}, {"stem": "Because Anchorage lies at a much higher <b>latitude</b> than Miami, it is farther north and gets far less sunlight in winter.<br><br>What does <b>latitude</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["height above sea level", "distance east or west of a starting line", "distance north or south of the equator", "amount of land a city covers"], "ci": 2, "exp": "<i>latitude</i> (n.) how far a place is north or south of the equator, measured in degrees. <i>Places near the equator have a low <b>latitude</b> and warm weather.</i> Related: longitude (east&ndash;west), latitudinal (adj.)"}, {"stem": "Scientists _____ animals by putting them into groups, such as mammals, birds, and reptiles.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["evacuate", "conceal", "classify", "persist"], "ci": 2, "exp": "<i>classify</i> (v.) to sort things into groups by type. <i>We <b>classified</b> the rocks by color and size.</i> Family: classification (n.)"}, {"stem": "Voting in free elections is an important part of a _____ government.", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["democracy", "democratic", "democratically", "democrat"], "ci": 1, "exp": "<i><b>democratic</b></i> (adj.) run by the people, who choose leaders by voting. <i>Our class made a <b>democratic</b> choice by voting on the field trip.</i> Family: democracy (n.), democratically (adv.) The blank describes the noun “government,” so it needs the adjective."}, {"stem": "With dark clouds rolling in and the thunder getting louder, a storm seemed <b>inevitable</b>. Which word means the <b>OPPOSITE</b> of <b>inevitable</b> as it is used in the sentence?", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A", "opts": ["avoidable", "sudden", "certain", "dangerous"], "ci": 0, "exp": "<i><b>inevitable</b></i> (adj.) sure to happen; impossible to stop. <i>Getting wet was <b>inevitable</b> once we forgot the umbrellas.</i> The opposite is <i>avoidable</i>. “Certain” means nearly the same thing. Family: inevitably (adv.)"}, {"stem": "As teenagers grow older, they become more ______ and can make many of their own decisions.", "tag": "Word Family", "tagcolor": "#f5a623", "opts": ["autonomous", "autonomously", "autonomy", "autonomies"], "ci": 0, "exp": "After <i>become more</i>, you need an adjective: <i>autonomous</i> (able to decide and act on your own). <i>autonomy</i> (n.) the freedom to make your own choices. <i>The club has <b>autonomy</b> to plan its own events.</i> Family: autonomy (n.), autonomous (adj.), autonomously (adv.)"}, {"stem": "In her essay about a later bedtime, Priya included a <b>counterargument</b>: some parents worry that kids will be too tired for school. Then she explained why that worry was not a big problem. What is a <b>counterargument</b>?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a short summary at the end of an essay", "a reason someone on the other side might give", "a fact that proves an essay is correct", "the strongest reason that supports your own opinion"], "ci": 1, "exp": "<i><b>counterargument</b></i> (n.) a reason that someone who disagrees with you might give. <i>A strong essay answers the <b>counterargument</b> instead of ignoring it.</i> Family: counter- (against) + argument. Priya’s own side was the later bedtime; the tired-kids worry came from the other side."}, {"stem": "Each winter, waves <b>erode</b> the sandy cliff a little more, and now the old path is only a foot from the edge.<br><br>What does <b>erode</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["to slowly wear away", "to build up higher", "to protect from damage", "to freeze solid"], "ci": 0, "exp": "<i>erode</i> (v.) to slowly wear away land or rock by water, wind, or ice. The cliff keeps getting closer to the path. <i>Rain can <b>erode</b> a hillside.</i> Family: erosion (n.)"}, {"stem": "After six hours of hiking, we finally reached the <b>summit</b>. From the very top, we could see three states.<br><br>What does <b>summit</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["a flat valley between two hills", "the highest point of a mountain", "a shelter where hikers rest", "a narrow trail along a cliff"], "ci": 1, "exp": "<i>summit</i> (n.) the top of a mountain; also an important meeting of leaders. <i>Clouds covered the <b>summit</b> of Pikes Peak.</i>"}, {"stem": "Even after scoring the winning goal, Diego stayed <b>modest</b> and told reporters that the whole team deserved the credit. What does <b>modest</b> mean in this sentence?", "tag": "Meaning in Context", "tagcolor": "#185FA5", "opts": ["thankful for help from a coach", "tired after working very hard", "shy and afraid to speak to people", "not bragging about your own success"], "ci": 3, "exp": "<i><b>modest</b></i> (adj.) not bragging about your abilities or success; also, not large. <i>The champion gave a <b>modest</b> smile and thanked her family.</i> Family: modestly (adv.), modesty (n.) Diego gave the credit to others instead of himself."}, {"stem": "From the tree house, Jamal had a new ______ on the backyard: the garden looked like a tiny map from up there.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75", "opts": ["obstacle", "perspective", "hypothesis", "sequence"], "ci": 1, "exp": "<i>perspective</i> (n.) a way of seeing or thinking about something, often from a certain position. Seeing the yard from above gave Jamal a new view."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
