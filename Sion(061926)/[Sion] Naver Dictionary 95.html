<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Naver Dictionary</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; }

/* TOP NAV */
#top-nav {
  background: #fff;
  border-bottom: 2px solid #d7dde6;
  padding: 8px 14px;
  position: sticky;
  top: 0;
  z-index: 100;
}
#nav-row1 {
  display: flex;
  align-items: center;
  gap: 10px;
}
#progress-label {
  font-size: 13px;
  font-weight: 600;
  color: #333;
  white-space: nowrap;
  min-width: 62px;
}
#progress-bar-wrap {
  flex: 1;
  background: #d7dde6;
  border-radius: 6px;
  height: 8px;
  overflow: hidden;
}
#progress-bar-fill {
  height: 100%;
  background: #4A90C4;
  border-radius: 6px;
  width: 0%;
  transition: width 0.3s;
}
#jump-toggle {
  background: #4A90C4;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 4px 11px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
#jump-panel {
  display: none;
  margin-top: 8px;
  max-height: 170px;
  overflow-y: auto;
  padding: 6px 2px;
}
#jump-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #d7dde6;
  color: #333;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  transition: background 0.2s;
}
.dot.correct { background: #1D9E75; color: #fff; }
.dot.wrong   { background: #E24B4A; color: #fff; }
#results-pill {
  display: none;
  margin-top: 8px;
  text-align: center;
}
#results-pill button {
  background: #1D9E75;
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 7px 28px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

/* MAIN */
#quiz-wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}
#question-card {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 28px 24px 22px;
}
#q-number {
  font-size: 12px;
  color: #888;
  margin-bottom: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
#word-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}
#q-word {
  font-size: 28px;
  font-weight: 800;
  color: #1a2a3a;
}
#speaker-btn {
  background: none;
  border: 2px solid #4A90C4;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4A90C4;
  font-size: 16px;
  flex-shrink: 0;
  transition: background 0.15s;
}
#speaker-btn:hover { background: #e8f0fb; }
#q-prompt {
  font-size: 15px;
  color: #555;
  margin-bottom: 20px;
}
.choice-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: #f7f9fb;
  border: 2px solid #d7dde6;
  border-radius: 10px;
  padding: 13px 16px;
  margin-bottom: 10px;
  font-size: 15px;
  color: #222;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  line-height: 1.4;
}
.choice-btn:hover:not(:disabled) { border-color: #4A90C4; background: #eef4fc; }
.choice-btn.correct-ans { background: #e6f8f1; border-color: #1D9E75; color: #145c3e; }
.choice-btn.wrong-ans   { background: #fde8e8; border-color: #E24B4A; color: #7a1212; }
.choice-btn:disabled { cursor: default; }

/* EXPLANATION */
#explanation {
  display: none;
  margin-top: 14px;
  background: #fffbe6;
  border: 1.5px solid #f0c040;
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 14px;
  color: #5a4200;
  line-height: 1.6;
}

/* BOTTOM NAV */
#bottom-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 22px;
  gap: 10px;
}
.nav-btn {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
}
#prev-btn {
  background: #e2e8f0;
  color: #555;
}
#prev-btn:disabled { opacity: 0.35; cursor: default; }
#next-btn {
  background: #4A90C4;
  color: #fff;
}

/* RESULTS */
#results-screen {
  display: none;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 32px 24px;
  text-align: center;
}
#results-screen h2 { font-size: 24px; color: #1a2a3a; margin-bottom: 8px; }
#score-display { font-size: 52px; font-weight: 800; color: #4A90C4; margin: 16px 0 4px; }
#score-sub { font-size: 15px; color: #777; margin-bottom: 24px; }
#retry-btn {
  background: #4A90C4;
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px 40px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 10px;
}
#wrong-list { text-align: left; margin-top: 24px; }
#wrong-list h3 { font-size: 16px; color: #E24B4A; margin-bottom: 12px; }
.wrong-item {
  background: #fde8e8;
  border-radius: 8px;
  padding: 11px 14px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.6;
}
.wrong-item strong { color: #1a2a3a; font-size: 16px; }

/* MODAL */
#modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 999;
  align-items: center;
  justify-content: center;
}
#modal-overlay.show { display: flex; }
#modal-box {
  background: #fff;
  border-radius: 14px;
  padding: 28px 24px;
  max-width: 340px;
  width: 90%;
  text-align: center;
}
#modal-box p { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.5; }
#modal-box .modal-btns { display: flex; gap: 10px; justify-content: center; }
#modal-box .modal-btns button {
  flex: 1; padding: 11px; border: none; border-radius: 8px;
  font-size: 15px; font-weight: 700; cursor: pointer;
}
#modal-confirm { background: #4A90C4; color: #fff; }
#modal-cancel  { background: #e2e8f0; color: #555; }
</style>
</head>

</div>

<!-- Modal -->
<div id="modal-overlay">

    <div class="modal-btns">
      <button id="modal-confirm">Yes</button>
      <button id="modal-cancel" onclick="window.closeModal()">Cancel</button>
    </div>
  </div>
</div>

  var QUESTIONS = [{"word": "defer", "meaning": "to delay or postpone something", "choices": ["showing a superior attitude toward others", "to delay or postpone something", "having a strong wish or desire for something", "to emphasize or highlight something"], "correct": 1}, {"word": "shilling", "meaning": "a former British coin worth one twentieth of a pound", "choices": ["a former British coin worth one twentieth of a pound", "a decisive defeat; severe criticism", "a great difference or inequality", "threats or force used to make someone do something"], "correct": 0}, {"word": "underscore", "meaning": "to emphasize or highlight something", "choices": ["to emphasize or highlight something", "the quality of being appropriate or suitable", "seeming contradictory but possibly true", "a former British coin worth one twentieth of a pound"], "correct": 0}, {"word": "paradoxical", "meaning": "seeming contradictory but possibly true", "choices": ["familiar with or knowledgeable about something", "to struggle or compete; to assert strongly", "dignity and seriousness of manner", "seeming contradictory but possibly true"], "correct": 3}, {"word": "peter", "meaning": "to gradually diminish and come to an end", "choices": ["very attentive to accuracy and detail; difficult to please", "to gradually diminish and come to an end", "to delay or postpone something", "a humble and earnest prayer or request"], "correct": 1}, {"word": "foible", "meaning": "a minor weakness or character flaw", "choices": ["a question asked for effect, not expecting an answer", "the process of bringing someone into a position or group", "a minor weakness or character flaw", "a humble and earnest prayer or request"], "correct": 2}, {"word": "aptness", "meaning": "the quality of being appropriate or suitable", "choices": ["a minor weakness or character flaw", "the quality of being appropriate or suitable", "a prediction or forecast about the future", "a great difference or inequality"], "correct": 1}, {"wor   var TOTAL = QUESTIONS.length;
  var state = loadState();

  function loadState() {
    try {
      var s = localStorage.getItem('sion_naver_dict_v1');
      if (s) return JSON.parse(s);
    } catch(e) {}
    return { cur: 0, answers: {}, shown: false };
  }
  function saveState() {
    try { localStorage.setItem('sion_naver_dict_v1', JSON.stringify(state)); } catch(e) {}
  }

  function answeredCount() {
    return Object.keys(state.answers).length;
  }
  function allAnswered() {
    return answeredCount() === TOTAL;
  }

  function updateNav() {
    var ans = answeredCount();
    document.getElementById('progress-label').textContent = ans + ' / ' + TOTAL;
    var pct = (ans / TOTAL) * 100;
    document.getElementById('progress-bar-fill').style.width = pct + '%';

    // dots
    var dotsEl = document.getElementById('jump-dots');
    dotsEl.innerHTML = '';
    for (var i = 0; i < TOTAL; i++) {
      var d = document.createElement('button');
      d.className = 'dot';
      d.textContent = i + 1;
      if (state.answers[i] !== undefined) {
        var q = QUESTIONS[i];
        d.className += (state.answers[i] === q.correct) ? ' correct' : ' wrong';
      }
      (function(idx){ d.onclick = function() { state.cur = idx; render(); }; })(i);
      dotsEl.appendChild(d);
    }

    // results pill
    document.getElementById('results-pill').style.display = allAnswered() ? 'block' : 'none';

    // prev/next
    document.getElementById('prev-btn').disabled = (state.cur === 0);
    var nextBtn = document.getElementById('next-btn');
    if (state.cur === TOTAL - 1) {
      nextBtn.textContent = 'See Results ✓';
    } else {
      nextBtn.textContent = 'Next →';
    }
  }

  function render() {
    if (state.shown) { showResults(); return; }
    var q = QUESTIONS[state.cur];
    document.getElementById('q-number').textContent = 'Question ' + (state.cur + 1) + ' of ' + TOTAL;
    document.getElementById('q-word').textContent = q.word;

    var choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    var answered = state.answers[state.cur] !== undefined;

    q.choices.forEach(function(ch, idx) {
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = (idx + 1) + '. ' + ch;
      if (answered) {
        btn.disabled = true;
        if (idx === q.correct) btn.classList.add('correct-ans');
        if (idx === state.answers[state.cur] && idx !== q.correct) btn.classList.add('wrong-ans');
      } else {
        (function(i){
          btn.onclick = function() { answer(i); };
        })(idx);
      }
      choicesEl.appendChild(btn);
    });

    // explanation
    var expEl = document.getElementById('explanation');
    if (answered && state.answers[state.cur] !== q.correct) {
      expEl.style.display = 'block';
      expEl.innerHTML = '<strong>Explanation:</strong> The correct answer is <em>"' + q.meaning + '"</em>. '
        + 'The word <strong>' + q.word + '</strong> means: ' + q.meaning + '.';
    } else {
      expEl.style.display = 'none';
    }

    updateNav();
    window.scrollTo(0, 0);
  }

  function answer(idx) {
    if (state.answers[state.cur] !== undefined) return;
    state.answers[state.cur] = idx;
    saveState();
    render();
  }

  window.speakWord = function() {
    var w = QUESTIONS[state.cur].word;
    var u = new SpeechSynthesisUtterance(w);
    u.lang = 'en-US';
    u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  };

  window.toggleJump = function() {
    var panel = document.getElementById('jump-panel');
    var btn = document.getElementById('jump-toggle');
    if (panel.style.display === 'block') {
      panel.style.display = 'none';
      btn.textContent = 'Jump';
    } else {
      panel.style.display = 'block';
      btn.textContent = 'Hide';
      updateNav();
    }
  };

  window.goPrev = function() {
    if (state.cur > 0) { state.cur--; saveState(); render(); }
  };

  window.goNext = function() {
    if (state.cur === TOTAL - 1) {
      window.goResults();
    } else {
      state.cur++;
      saveState();
      render();
    }
  };

  window.goResults = function() {
    state.shown = true;
    saveState();
    showResults();
  };

  function showResults() {
    document.getElementById('question-card').style.display = 'none';
    document.getElementById('bottom-nav').style.display = 'none';
    var rs = document.getElementById('results-screen');
    rs.style.display = 'block';

    var correct = 0;
    var wrongItems = [];
    for (var i = 0; i < TOTAL; i++) {
      var q = QUESTIONS[i];
      if (state.answers[i] === q.correct) {
        correct++;
      } else {
        wrongItems.push({ q: q, given: state.answers[i] });
      }
    }

    document.getElementById('score-display').textContent = correct + ' / ' + TOTAL;
    var pct = Math.round((correct / TOTAL) * 100);
    document.getElementById('score-sub').textContent = pct + '% correct';

    var wl = document.getElementById('wrong-list');
    if (wrongItems.length === 0) {
      wl.innerHTML = '<p style="color:#1D9E75;font-weight:700;text-align:center;font-size:16px;">Perfect score! 🎉</p>';
    } else {
      var html = '<h3>Words to Review (' + wrongItems.length + ')</h3>';
      wrongItems.forEach(function(item) {
        var given = item.given !== undefined ? item.q.choices[item.given] : 'No answer';
        html += '<div class="wrong-item">'
          + '<strong>' + item.q.word + '</strong><br>'
          + '✗ Your answer: ' + given + '<br>'
          + '✓ Correct: ' + item.q.meaning
          + '</div>';
      });
      wl.innerHTML = html;
    }
    updateNav();
  }

  window.retryQuiz = function() {
    showModal('Start over? All your answers will be cleared.', function() {
      state = { cur: 0, answers: {}, shown: false };
      saveState();
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('question-card').style.display = 'block';
      document.getElementById('bottom-nav').style.display = 'flex';
      render();
    });
  };

  // Modal
  var modalCallback = null;
  function showModal(msg, cb) {
    document.getElementById('modal-msg').textContent = msg;
    modalCallback = cb;
    document.getElementById('modal-overlay').classList.add('show');
  }
  window.closeModal = function() {
    document.getElementById('modal-overlay').classList.remove('show');
    modalCallback = null;
  };
  document.getElementById('modal-confirm').onclick = function() {
    window.closeModal();
    if (modalCallback) modalCallback();
  };

  render();
})();
</script>
</body>
</html>
