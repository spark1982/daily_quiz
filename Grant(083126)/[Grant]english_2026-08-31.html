<script>var TITLE = "[Grant] English";var QUIZ_KEY = "quiz_grantenglish_25_20260830_v1";var ATT_KEY = "quiz_grantenglish_25_att_20260830_v1";var RAW_QUESTIONS = [{"stem": "What is the main idea of the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1965, a chemist named Stephanie Kwolek was searching for a new type of strong, lightweight fiber that could be used in car tires, hoping to help reduce the weight of vehicles and save fuel. Working at a chemical company, she spent long hours mixing polymer solutions and testing how they behaved when spun into fiber.<br><br>One day, one of her experiments produced a solution that looked unusual, thin, cloudy, and almost watery, rather than thick and clear like the solutions chemists normally expected to work with. Many researchers would have poured out such an odd-looking mixture without a second thought, assuming it had failed. Kwolek, however, grew curious about why the solution behaved so differently from anything she had made before.<br><br>She asked a technician to spin the strange solution into fiber anyway, even though he worried the unusual liquid might damage the expensive spinning equipment. When he finally agreed and spun a sample, the resulting fiber surprised everyone in the laboratory: it was far stiffer and stronger than any fiber Kwolek had tested before, yet it remained remarkably lightweight.<br><br>Kwolek tested the new fiber extensively and found that, ounce for ounce, it was about five times stronger than steel. She realized her discovery could be useful for far more than car tires. Over the next several years, researchers explored dozens of possible uses for the material, which came to be known as Kevlar.<br><br>By 1971, police departments began using Kevlar to make lightweight bulletproof vests, replacing older vests that were heavy and difficult to wear for a full shift. The lighter, flexible vests allowed officers to move freely while staying protected, an haved when spun into fiber.<br><br>One day, one of her experiments produced a solution that looked unusual, thin, cloudy, and almost watery, rather than thick and clear like the solutions chemists normally expected to work with. Many researchers would have poured out such an odd-looking mixture without a second thought, assuming it had failed. Kwolek, however, grew curious about why the solution behaved so differently from anything she had made before.<br><br>She asked a technician to spin the strange solution into fiber anyway, even though he worried the unusual liquid might damage the expensive spinning equipment. When he finally agreed and spun a sample, the resulting fiber surprised everyone in the laboratory: it was far stiffer and stronger than any fiber Kwolek had tested before, yet it remained remarkably lightweight.<br><br>Kwolek tested the new fiber extensively and found that, ounce for ounce, it was about five times stronger than steel. She realized her discovery could be useful for far more than car tires. Over the next several years, researchers explored dozens of possible uses for the material, which came to be known as Kevlar.<br><br>By 1971, police departments began using Kevlar to make lightweight bulletproof vests, replacing older vests that were heavy and difficult to wear for a full shift. The lighter, flexible vests allowed officers to move freely while staying protected, and the material was soon adopted for firefighter gear, protective gloves, and even parts of spacecraft. What began as an unpromising, cloudy solution that most chemists would have discarded had become one of the most important protective materials of the twentieth century.", "opts": ["It produced a fiber that was far stiffer and stronger than any fiber Kwolek had tested before, yet remarkably lightweight.", "It had no noticeable effect on the properties of the resulting fiber.", "It produced a fiber that was heavier than steel and difficult to bend.", "It caused the spinning equipment to break down completely."], "ci": 0, "exp": "The passage states the resulting fiber \"was far stiffer and stronger than any fiber Kwolek had tested before, yet it remained remarkably lightweight.\" The equipment is never described as breaking down. The passage describes the fiber as lightweight, not heavier than steel. The passage clearly shows a major, noticeable effect, not no effect."}, {"stem": "Which sequence correctly reflects the order of events described in the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1965, a chemist named Stephanie Kwolek was searching for a new type of strong, lightweight fiber that could be used in car tires, hoping to help reduce the weight of vehicles and save fuel. Working at a chemical company, she spent long hours mixing polymer solutions and testing how they behaved when spun into fiber.<br><br>One day, one of her experiments produced a solution that looked unusual, thin, cloudy, and almost watery, rather than thick and clear like the solutions chemists normally expected to work with. Many researchers would have poured out such an odd-looking mixture without a second thought, assuming it had failed. Kwolek, however, grew curious about why the solution behaved so differently from anything she had made before.<br><br>She asked a technician to spin the strange solution into fiber anyway, even though he worried the unusual liquid might damage the expensive spinning equipment. When he finally agreed and spun a sample, the resulting fiber surprised everyone in the laboratory: it was far stiffer and stronger than any fiber Kwolek had tested before, yet it remained remarkably lightweight.<br><br>Kwolek tested the new fiber extensively and found that, ounce for ounce, it was about five times stronger than steel. She realized her discovery could be useful for far more than car tires. Over the next several years, researchers explored dozens of possible uses for the material, which cam o important discoveries. The passage actually shows the value of pursuing an outcome that wasn't guaranteed, the opposite of the wrong choice. The passage never discusses companies testing materials before national release. Searching for a tire fiber is where this one idea originated, not a general claim about most discoveries."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;
  for(var i=0;i<arr.length;i++){ if(typeof arr[i] !== 'number' || arr[i]<0 || arr[i]>=N) return false; }
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }

var order = loadOrder() || identityOrder();
if(!loadOrder()) saveOrder(order);

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(typeof s.cur !== 'number' || s.cur<0 || s.cur>=order.length) s.cur = 0;
    if(typeof s.answers !== 'object' || s.answers===null) s.answers = {};
    if(typeof s.showResults !== 'boolean') s.showResults = false;
    if(typeof s.timerTotalSec === 'undefined') s.timerTotalSec = null;
    if(typeof s.timerStartedAt === 'undefined') s.timerStartedAt = null;
    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

var state = loadState();

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';

    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');

  var cbox = document.getElementById('context-box');

  document.getElementById('q-text').innerHTML = q.stem;

  

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');

    var btn = document.createElement('button');

      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');

    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;

    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');

  updateNav();

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();

function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];

    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;

function goToQ(pos){

}
function chooseAnswer(idx){

}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){

function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;

function retryWrong(){
  var wrong=[];

    var qi = order[pos];

      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;

  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){

  }catch(e){}
}
