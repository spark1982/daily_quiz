<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct. This week's review — questions you missed recently.";
var TODAY_STR = "20261025";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["has come", "NO CHANGE", "have come", "have coming"], "ci": 2, "exp": "After <i>have</i>, use the past participle. The past participle of <i>come</i> is <i>come</i>: <i>My parents <b>have come</b> to every one of my shows.</i> (<i>Has</i> goes with one person, not <i>parents</i>.)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>An Email to My Cousin</strong><br><i>Dear Ava,</i><br><b>(1)</b> Our class performed the play <i>Charlotte&rsquo;s Web</i> last night, and I played Wilbur the pig. <b>(2)</b> My parents <u>have came</u> to every one of my shows since kindergarten. <b>(3)</b> At the end, the audience <u>stood</u> up and clapped for a long time. <b>(4)</b> Grandma brought roses for Mia and <u>I</u>. <b>(5)</b> After the show ended we all went out for ice cream. <b>(6)</b> I wish you could have been there!<br><i>Love, Sam</i>"}, {"passage": "<strong>An Email to Grandma</strong><br><i>Dear Grandma,</i><br><b>(1)</b> Our soccer team finally played in the Fall Classic tournament last weekend. <b>(2)</b> <u>Sam and I</u> were both chosen to start in the first game. <b>(3)</b> By halftime, we <u>had ran</u> so much that my legs felt like noodles. <b>(4)</b> Our goalie made three amazing saves. <b>(5)</b> The other team still won by one goal. <b>(6)</b> If we win our next game we will play in the championship. <b>(7)</b> I hope you can come and watch us play!", "stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["Sam and myself", "Sam and me", "NO CHANGE", "Me and Sam"], "ci": 2, "exp": "<i>Sam and I</i> is the subject of the sentence (they <i>were chosen</i>), so use the subject pronoun <i>I</i>. Test it alone: <i>I were chosen</i> &rarr; <i>I was chosen</i>, never <i>me was chosen</i>. It is already correct.", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["has known", "have knew", "NO CHANGE", "have knowed"], "ci": 2, "exp": "<i>Scientists</i> is plural, so use <i>have</i>, and after <i>have</i> use the past participle <i>known</i>. <i>Scientists <b>have known</b> for many years.</i> The sentence is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Report: How Salmon Find Their Way Home</strong><br><b>(1)</b> Pacific salmon begin their lives in small streams far from the ocean. <b>(2)</b> After a year or two, the young fish swim downstream to the sea. <b>(3)</b> Each of the salmon <u>spend</u> several years in the salty ocean water. <b>(4)</b> <u>Then, without a map. They travel</u> hundreds of miles back to the stream where they hatched. <b>(5)</b> Scientists <u>have known</u> for many years that salmon use smell to find their way. <b>(6)</b> On the trip, the fish swim past many other streams. <b>(7)</b> Those streams smell different from home."}, {"stem": "What is the best way to combine sentences 6 and 7?", "opts": ["On the trip, the fish swim past many other streams, which smell different from home.", "On the trip, the fish swim past many other streams, who smell different from home.", "On the trip, the fish swim past many other streams, they smell different from home.", "On the trip, the fish swim past many other streams, where smell different from home."], "ci": 0, "exp": "Use <i>which</i> to add information about a thing (<i>streams</i>). <i>Who</i> is only for people, <i>where</i> needs its own subject, and a comma alone between two sentences makes a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Salmon Find Their Way Home</strong><br><b>(1)</b> Pacific salmon begin their lives in small streams far from the ocean. <b>(2)</b> After a year or two, the young fish swim downstream to the sea. <b>(3)</b> Each of the salmon <u>spend</u> several years in the salty ocean water. <b>(4)</b> <u>Then, without a map. They travel</u> hundreds of miles back to the stream where they hatched. <b>(5)</b> Scientists <u>have known</u> for many years that salmon use smell to find their way. <b>(6)</b> On the trip, the fish swim past many other streams. <b>(7)</b> Those streams smell different from home."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["tooken", "taken", "taking", "NO CHANGE"], "ci": 1, "exp": "After <i>had</i>, use the past participle. For <i>take</i> it is <i>taken</i>: <i>we had already <b>taken</b> every pillow.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>My Diary: A Rainy Saturday</strong><br><b>(1)</b> It rained all morning, so my brother Max and I built a blanket fort in the living room. <b>(2)</b> First, we pushed two chairs together. <b>(3)</b> Then we <u>drag</u> the couch cushions over to make walls. <b>(4)</b> By lunchtime, we had already <u>took</u> every pillow in the house. <b>(5)</b> <u>Reading comics with our flashlights.</u> <b>(6)</b> When Mom brought us a bowl of popcorn, Max and I ate them in five minutes. <b>(7)</b> It was the best rainy day ever."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["she", "NO CHANGE", "herself", "them"], "ci": 0, "exp": "Max and Lily are doing the searching, so use the subject pronoun <i>she</i>. Test it: <i>She searched the kitchen.</i> So: <i>Her brother Max and <b>she</b> searched the kitchen.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Story: The Snowman Contest</strong><br><b>(1)</b> On Saturday morning, the whole street entered the snowman contest. <b>(2)</b> &ldquo;Our snowman needs a carrot nose&rdquo; said Lily. <b>(3)</b> Her brother Max and <u>her</u> searched the kitchen until they found one. <b>(4)</b> By noon, they <u>had built</u> a snowman taller than their dad. <b>(5)</b> One judge said the snowman looked real good. <b>(6)</b> Lily and Max won a blue ribbon and two cups of hot cocoa. <b>(7)</b> It was the happiest day of their winter."}, {"stem": "Which sentence has an error?", "opts": ["Every minute you read helps your class win.", "Our school library is holding a Reading Marathon from October 20 to November 14.", "Each of the classes have a poster to track its reading minutes.", "You can read at home."], "ci": 2, "exp": "With <i>each</i>, use a singular verb, even when a plural noun comes after it: <i>Each of the classes <b>has</b> a poster.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Notice: Fall Reading Marathon</strong><br><b>(1)</b> Our school library is holding a Reading Marathon from October 20 to November 14. <b>(2)</b> Students who <u>have chose</u> a reading goal can pick up a reading log at the front desk. <b>(3)</b> Each of the classes have a poster to track its reading minutes. <b>(4)</b> The library will give a prize to every class that meets <u>its</u> goal. <b>(5)</b> You can read at home. <b>(6)</b> You can read in the library during lunch. <b>(7)</b> Every minute you read helps your class win."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["You can read neither at home nor in the library during lunch.", "You can read either at home nor in the library during lunch.", "You can read both at home and in the library during lunch.", "You can read at home, you can read in the library during lunch."], "ci": 2, "exp": "<i>Both&hellip;and</i> keeps the meaning that you may read in either place. <i>Neither&hellip;nor</i> changes the meaning to &ldquo;not anywhere,&rdquo; <i>either</i> must go with <i>or</i>, and a comma alone cannot join two sentences.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Notice: Fall Reading Marathon</strong><br><b>(1)</b> Our school library is holding a Reading Marathon from October 20 to November 14. <b>(2)</b> Students who <u>have chose</u> a reading goal can pick up a reading log at the front desk. <b>(3)</b> Each of the classes have a poster to track its reading minutes. <b>(4)</b> The library will give a prize to every class that meets <u>its</u> goal. <b>(5)</b> You can read at home. <b>(6)</b> You can read in the library during lunch. <b>(7)</b> Every minute you read helps your class win."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["have become", "has become", "NO CHANGE", "have becomed"], "ci": 0, "exp": "After <i>have</i>, use the past participle <i>become</i> (not <i>became</i>). The subject <i>forty gallons</i> is plural, so use <i>have</i>: <i>forty gallons of sap <b>have become</b> one gallon of syrup.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>How Maple Syrup Is Made</strong><br><b>(1)</b> Maple syrup comes from the sap of sugar maple trees. <b>(2)</b> Each spring, farmers drill small holes into the trunks. <b>(3)</b> A bucket full of the clear sap <u>weighs</u> about twenty pounds. <b>(4)</b> The farmers pour the sap into a large pan. <b>(5)</b> The pan sits over a hot fire. <b>(6)</b> By the time the water boils away, forty gallons of sap <u>have became</u> just one gallon of syrup. <b>(7)</b> Pancakes topped with the warm syrup tastes delicious."}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["The farmers pour the sap into a large pan, who sits over a hot fire.", "The farmers pour the sap into a large pan and sits over a hot fire.", "The farmers pour the sap into a large pan, it sits over a hot fire.", "The farmers pour the sap into a large pan that sits over a hot fire."], "ci": 3, "exp": "Use <i>that</i> or <i>which</i> for things and <i>who</i> for people: <i>a large pan <b>that</b> sits over a hot fire.</i> Joining with only a comma makes a run-on, and &ldquo;and sits&rdquo; makes it sound like the farmers sit over the fire.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>How Maple Syrup Is Made</strong><br><b>(1)</b> Maple syrup comes from the sap of sugar maple trees. <b>(2)</b> Each spring, farmers drill small holes into the trunks. <b>(3)</b> A bucket full of the clear sap <u>weighs</u> about twenty pounds. <b>(4)</b> The farmers pour the sap into a large pan. <b>(5)</b> The pan sits over a hot fire. <b>(6)</b> By the time the water boils away, forty gallons of sap <u>have became</u> just one gallon of syrup. <b>(7)</b> Pancakes topped with the warm syrup tastes delicious."}, {"stem": "Which sentence contains an error?", "opts": ["Each spring, farmers drill small holes into the trunks.", "Pancakes topped with the warm syrup tastes delicious.", "The pan sits over a hot fire.", "Maple syrup comes from the sap of sugar maple trees."], "ci": 1, "exp": "The subject <i>Pancakes</i> is plural, so the verb must be <i>taste</i>: <i>Pancakes topped with the warm syrup <b>taste</b> delicious.</i> Do not match the verb to <i>syrup</i>, which is just part of the describing phrase.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>How Maple Syrup Is Made</strong><br><b>(1)</b> Maple syrup comes from the sap of sugar maple trees. <b>(2)</b> Each spring, farmers drill small holes into the trunks. <b>(3)</b> A bucket full of the clear sap <u>weighs</u> about twenty pounds. <b>(4)</b> The farmers pour the sap into a large pan. <b>(5)</b> The pan sits over a hot fire. <b>(6)</b> By the time the water boils away, forty gallons of sap <u>have became</u> just one gallon of syrup. <b>(7)</b> Pancakes topped with the warm syrup tastes delicious."}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Next week we get to learn a real song!", "Maybe I will practice in the garage instead.", "Because my little brother covers his ears whenever I play.", "Mr. Hall showed us how to press our lips together and buzz."], "ci": 2, "exp": "A group of words that starts with <i>because</i> cannot stand alone — it is a fragment. Join it to a complete sentence: <i>Maybe I will practice in the garage <b>because</b> my little brother covers his ears.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Band Diary</strong><br><b>(1)</b> Yesterday I <u>have played</u> the trumpet in band class for the first time. <b>(2)</b> Mr. Hall showed us how to press our lips together and buzz. <b>(3)</b> At first, my trumpet <u>sounds</u> like an angry goose. <b>(4)</b> Mr. Hall said we <u>should</u> practice for twenty minutes every day. <b>(5)</b> Because my little brother covers his ears whenever I play. <b>(6)</b> Maybe I will practice in the garage instead. <b>(7)</b> Next week we get to learn a real song!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["myself", "mine", "me", "NO CHANGE"], "ci": 2, "exp": "Ava and ___ receive the map, so use the object pronoun. Try it alone: “Mom gave <i>me</i> a map.” <i>Mom gave Ava and <b>me</b> a map of the hiking trails.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Email to Jess</strong><br><b>(1)</b> Hi Jess, I just got back from our camping trip at Pine Lake! <b>(2)</b> Since Friday, I <u>have wrote</u> three pages in my nature journal. <b>(3)</b> Mom gave Ava and <u>I</u> a map of the hiking trails. <b>(4)</b> We wanted to hike to the waterfall. <b>(5)</b> The trail was closed because of a fallen tree. <b>(6)</b> On the last night of the trip we roasted marshmallows by the fire. <b>(7)</b> I hope you can come with us next summer!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["are kneading", "kneaded", "NO CHANGE", "will knead"], "ci": 1, "exp": "The diary tells what already happened (“we <i>mixed</i>”), so stay in the past tense: <i>Then we <b>kneaded</b> the dough for ten whole minutes.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Bread Day</strong><br><b>(1)</b> Dear Diary, today Dad finally taught me how to bake bread. <b>(2)</b> First we mixed flour, water, yeast, and a little salt in a big bowl. <b>(3)</b> Then we <u>knead</u> the dough for ten whole minutes. <b>(4)</b> By the time the timer rang, the dough <u>had rose</u> to twice its size. <b>(5)</b> Because the kitchen smelled so good while it baked. <b>(6)</b> The finished loaf turned out <u>real</u> soft inside. <b>(7)</b> Next weekend, we will try cinnamon rolls!"}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Next weekend, we will try cinnamon rolls!", "First we mixed flour, water, yeast, and a little salt in a big bowl.", "Dear Diary, today Dad finally taught me how to bake bread.", "Because the kitchen smelled so good while it baked."], "ci": 3, "exp": "A sentence that starts with <i>Because</i> needs a main idea to finish it. Fix it like this: <i>Because the kitchen smelled so good while it baked, <b>I could hardly wait to taste it.</b></i> The list sentence is correct — it uses commas between the items.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Bread Day</strong><br><b>(1)</b> Dear Diary, today Dad finally taught me how to bake bread. <b>(2)</b> First we mixed flour, water, yeast, and a little salt in a big bowl. <b>(3)</b> Then we <u>knead</u> the dough for ten whole minutes. <b>(4)</b> By the time the timer rang, the dough <u>had rose</u> to twice its size. <b>(5)</b> Because the kitchen smelled so good while it baked. <b>(6)</b> The finished loaf turned out <u>real</u> soft inside. <b>(7)</b> Next weekend, we will try cinnamon rolls!"}, {"stem": "<div>Present: <b>eat</b> &rsaquo; Past: <b>ate</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["eating", "eated", "ate", "eaten"], "ci": 3, "exp": "'eat' is an irregular verb. Its past participle is 'eaten'. Past perfect: had eaten.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "We ________ that film at the cinema last March.", "opts": ["watched", "have watched", "have been watching", "had watched"], "ci": 0, "exp": "Last March is a specific finished time, so use simple past: watched.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "The newspaper report was based _____ eyewitness accounts from people who saw the accident happen.", "opts": ["from", "on", "with", "by"], "ci": 1, "exp": "\"Based on\" is a fixed phrase meaning something was built on or derived from a source. The report used the accounts as its foundation.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Carrying heavy grocery bags up the stairs.", "A jar of peanut butter in the kitchen cabinet.", "The mayor gave a speech at the town hall.", "Although the concert started two hours late."], "ci": 2, "exp": "\"The mayor gave a speech at the town hall.\" is a complete sentence — subject: 'The mayor', predicate: 'gave'. The others are fragments: an 'Although' clause, a noun phrase, and an -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "She <span style=\"text-decoration:underline;\">______</span> from a prestigious university before she turned twenty.", "opts": ["has graduated", "graduated", "will have graduated", "had graduated"], "ci": 3, "exp": "\"had graduated\" is past perfect — she graduated before turning twenty.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["A series of meetings was held to discuss the new school schedule.", "A series of meetings were held to discuss the new school schedule.", "A series of important events have been scheduled for the coming month.", "A pair of gloves were left in the lost and found box after gym class."], "ci": 0, "exp": "\"A series of\" is singular, so \"was held\" is correct. \"Were held\" is plural — wrong. \"A pair of gloves\" is singular (\"a pair\" is one unit) — use \"was.\" \"A series of events\" is singular — use \"has been.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "floats", "are floating", "have floated"], "ci": 1, "exp": "The subject is <i>group</i> (one group), not <i>otters</i>, so the verb is singular: <i>A group of sea otters <b>floats</b> together in a raft.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: Tool Users of the Sea</strong><br><b>(1)</b> Sea otters live in the cold waters off the coast of California. <b>(2)</b> A group of sea otters <u>float</u> together in a raft so the members do not drift apart. <b>(3)</b> Sea otters eat clams and sea urchins. <b>(4)</b> These animals have hard shells. <b>(5)</b> <u>To crack the shells. An otter</u> bangs them against a flat rock on its chest. <b>(6)</b> Scientists <u>have watched</u> some otters keep a favorite rock for years. <b>(7)</b> Few animals use tools as cleverly as sea otters do."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["classs", "class&rsquo;s", "NO CHANGE", "classes&rsquo;"], "ci": 1, "exp": "To show that the bin belongs to one class, add <i>&rsquo;s</i>: <i>each <b>class&rsquo;s</b> bin.</i> <i>Each</i> tells us there is only one class at a time, so the plural <i>classes&rsquo;</i> does not fit.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Join the Recycling Challenge!</strong><br><b>(1)</b> Starting next Monday, every class at Maple Grove Elementary can join the Recycling Challenge. <b>(2)</b> Each class will collect cans, plastic bottles, and old newspapers in a special blue bin near the classroom door. <b>(3)</b> <u>The class with the most recycling by Friday.</u> <b>(4)</b> Please bring empty bottles from home. <b>(5)</b> Rinse them out first. <b>(6)</b> Mrs. Kim will check each <u>classes</u> bin every afternoon. <b>(7)</b> Its going to be a fun way to help our planet!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["has seen", "NO CHANGE", "have seen", "had saw"], "ci": 2, "exp": "After <i>have</i>, use the past participle <i>seen</i>, not the past tense <i>saw</i>: <i>I <b>have seen</b> pictures of craters before.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Thank-You Email to Aunt Meg</strong><br><b>(1)</b> Thank you so much for the telescope you sent for my birthday. <b>(2)</b> Last night, Dad <u>set</u> it up in the backyard, and we looked at the moon for an hour. <b>(3)</b> I <u>have saw</u> pictures of craters before, but seeing them myself was amazing. <b>(4)</b> Tomorrow night, <u>my brother and me</u> want to find Saturn. <b>(5)</b> Mom says Saturns rings are easy to spot on a clear night. <b>(6)</b> The telescope&rsquo;s instruction book has helpful star maps, too. <b>(7)</b> I will send you a picture of the moon soon!"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["are working", "works", "NO CHANGE", "were working"], "ci": 1, "exp": "The subject is <i>family</i> (one family), not <i>beavers</i>. A singular subject needs a singular verb: <i>A family of beavers <b>works</b> together.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Beavers Build Dams</strong><br><b>(1)</b> A family of beavers <u>work</u> together to build a dam across a stream. <b>(2)</b> They gather sticks mud and stones from the riverbank. <b>(3)</b> Beavers have sharp front teeth. <b>(4)</b> The teeth never stop growing. <b>(5)</b> The finished dam slows the moving water and creates a deep pond. <b>(6)</b> The pond is a safe place <u>where</u> beavers can hide from wolves and bears. <b>(7)</b> Their lodge has an underwater door, so predators cannot get inside easily."}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["Beavers have sharp front teeth, which they never stop growing.", "Beavers have sharp front teeth who never stop growing.", "Beavers have sharp front teeth, the teeth never stop growing.", "Beavers have sharp front teeth that never stop growing."], "ci": 3, "exp": "Use <i>that</i> (or <i>which</i>) for things and <i>who</i> for people: <i>sharp front teeth <b>that</b> never stop growing.</i> Two sentences joined with only a comma make a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Beavers Build Dams</strong><br><b>(1)</b> A family of beavers <u>work</u> together to build a dam across a stream. <b>(2)</b> They gather sticks mud and stones from the riverbank. <b>(3)</b> Beavers have sharp front teeth. <b>(4)</b> The teeth never stop growing. <b>(5)</b> The finished dam slows the moving water and creates a deep pond. <b>(6)</b> The pond is a safe place <u>where</u> beavers can hide from wolves and bears. <b>(7)</b> Their lodge has an underwater door, so predators cannot get inside easily."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have gone", "has went", "went", "NO CHANGE"], "ci": 2, "exp": "&ldquo;Last week&rdquo; names a finished time, so use the simple past, not <i>have</i>: <i>Last week we <b>went</b> to the mountains.</i> (<i>Have went</i> is never correct, and <i>have gone</i> does not go with &ldquo;last week.&rdquo;)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Letter to Mrs. Patel</strong><br><b>(1)</b> My family moved to Denver in August, and I really miss your class at Lincoln Elementary. <b>(2)</b> Last week we <u>have went</u> to the mountains for the first time. <b>(3)</b> By the time we got home, we <u>had finished</u> three whole bags of trail mix! <b>(4)</b> <u>My sister and me</u> are also learning to ski this winter. <b>(5)</b> My new school is big. <b>(6)</b> It has a climbing wall in the gym. <b>(7)</b> Please say hello to the class for me."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Jamal opened the car door then spotted, the book under the front seat.", "Jamal opened the car door, and then he spotted the book under the front seat.", "Jamal opened the car door, then he spotted the book under the front seat.", "Jamal opened the car door, and then he spotted, the book under the front seat."], "ci": 1, "exp": "Two complete sentences can be joined with a comma <b>and</b> a joining word: <i>&hellip;the car door<b>, and then</b> he spotted the book&hellip;</i> <i>Then</i> by itself is not a joining word, so a comma before it makes a comma splice. The other choices put a comma between the verb and what Jamal spotted.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>The Missing Library Book</strong><br><b>(1)</b> Jamal searched under his bed, in his backpack, and behind the couch, but the book was nowhere. <b>(2)</b> His library book about sharks was due <u>in</u> Tuesday, and he did not want to pay a late fee. <b>(3)</b> He asked his sister for <u>help she</u> told him to check the car. <b>(4)</b> Mom walked <u>him and I</u> out to the driveway to look. <b>(5)</b> Jamal opened the car door. <b>(6)</b> Then he spotted the book under the front seat."}, {"stem": "Which sentence has an error?", "opts": ["Today Mom took my sister and me to the ice rink downtown.", "At first, I held on to the wall and moved very slow.", "I fell twice, but by the end of the hour I could skate across the whole rink.", "My sister said, “You should bend your knees a little.”"], "ci": 1, "exp": "<i>Slow</i> describes a thing; to tell <i>how</i> I moved, use the adverb <i>slowly</i>: <i>I held on to the wall and moved very <b>slowly</b>.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Diary: My First Time Ice Skating</strong><br><b>(1)</b> Today Mom took my sister and me to the ice rink downtown. <b>(2)</b> I <u>had never wore</u> ice skates before. <b>(3)</b> At first, I held on to the wall and moved very slow. <b>(4)</b> My sister said, “You <u>should</u> bend your knees a little.” <b>(5)</b> I fell twice, but by the end of the hour I could skate across the whole rink. <b>(6)</b> When the music <u>stops</u>, we took off our skates and drank hot cocoa."}, {"stem": "Which sentence has an error?", "opts": ["My cousin held my hand, she told me to bend my knees.", "Today I tried my cousin&rsquo;s skateboard for the very first time.", "Bending my knees helped.", "By the end of the afternoon, I could roll all the way down the driveway."], "ci": 0, "exp": "Two complete sentences joined by only a comma make a run-on (a comma splice). Add <i>and</i>: <i>My cousin held my hand<b>, and</b> she told me to bend my knees.</i> <i>Bending my knees helped</i> is short, but it is a complete sentence.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>My Skateboard Diary</strong><br><b>(1)</b> Today I tried my cousin&rsquo;s skateboard for the very first time. <b>(2)</b> At first I wobbled so much that I <u>grabbed</u> the fence every few feet. <b>(3)</b> My cousin held my hand, she told me to bend my knees. <b>(4)</b> Bending my knees helped. <b>(5)</b> I still fell twice. <b>(6)</b> By the end of the afternoon, I could roll all the way down the driveway. <b>(7)</b> The board has a crack, but <u>its</u> still my favorite thing in the garage."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["whom", "whose", "which", "NO CHANGE"], "ci": 3, "exp": "Use <i>who</i> for a person who does the action (the man walks his poodle). The sentence is already correct. <i>Which</i> is for things, and <i>whom</i> is for a person who receives an action.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<stron age": "<strong>Tiny Hovering Birds</strong><br><b>(1)</b> Hummingbirds are the smallest birds in North America, and some weigh less than a nickel. <b>(2)</b> The wings of a ruby-throated hummingbird <u>beats</u> about fifty times every second. <b>(3)</b> Scientists <u>have measured</u> their hearts at more than one thousand beats per minute. <b>(4)</b> Hummingbirds drink sweet nectar. <b>(5)</b> Nectar gives them the quick energy they need. <b>(6)</b> Every fall, a hummingbird flies south to spend its winter in Mexico or Central America. <b>(7)</b> Its a long trip for such a tiny bird."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["have measure", "NO CHANGE", "measuring", "has measured"], "ci": 1, "exp": "<i>Scientists</i> is plural, so <i>have</i> is right, and <i>measured</i> is the correct past participle. The sentence is already correct.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Tiny Hovering Birds</strong><br><b>(1)</b> Hummingbirds are the smallest birds in North America, and some weigh less than a nickel. <b>(2)</b> The wings of a ruby-throated hummingbird <u>beats</u> about fifty times every second. <b>(3)</b> Scientists <u>have measured</u> their hearts at more than one thousand beats per minute. <b>(4)</b> Hummingbirds drink sweet nectar. <b>(5)</b> Nectar gives them the quick energy they need. <b>(6)</b> Every fall, a hummingbird flies south to spend its winter in Mexico or Central America. <b>(7)</b> Its a long trip for such a tiny bird."}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Every student who rides in the bike parade need a helmet.", "Parents are welcome to watch from the bleachers.", "Our school will hold a Bike Safety Day on Friday afternoon.", "The bike club has painted a practice course on the blacktop, and its lines show riders where to stop."], "ci": 0, "exp": "The subject is <i>Every student</i>, which is singular, so the verb needs -s: <i>Every student who rides in the bike parade <b>needs</b> a helmet.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Notice: Bike Safety Day</strong><br><b>(1)</b> Our school will hold a Bike Safety Day on Friday afternoon. <b>(2)</b> Students should bring their <u>bikes the police officers</u> will check the brakes and tires. <b>(3)</b> Every student who rides in the bike parade need a helmet. <b>(4)</b> You can wear your own helmet. <b>(5)</b> You can borrow one from the nurse&rsquo;s office. <b>(6)</b> The bike club has painted a practice course on the blacktop, and <u>its</u> lines show riders where to stop. <b>(7)</b> Parents are welcome to watch from the bleachers."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["have been", "are", "were", "NO CHANGE"], "ci": 3, "exp": "The subject is <i>Each</i>, which is singular, even though <i>families</i> comes right before the verb. So <i>is</i> is correct — the sentence is already correct.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Science Night Is Coming!</strong><br><b>(1)</b> Science Night starts at 6:00 on Thursday. <b>(2)</b> In the school gym. <b>(3)</b> Each of the families <u>is</u> invited to explore hands-on experiments with their children. <b>(4)</b> Our fifth graders have builded a model volcano that really erupts with foamy red lava. <b>(5)</b> Volunteers should arrive <u>on</u> 5:45 to help set up the tables. <b>(6)</b> Free popcorn and lemonade will be served by the front doors of the school. <b>(7)</b> We hope to see you and your whole family there!"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["at", "in", "during", "NO CHANGE"], "ci": 0, "exp": "Use <i>at</i> for an exact clock time: <i>Volunteers should arrive <b>at</b> 5:45 to help set up the tables.</i> Use <i>on</i> for days, like “on Thursday.”", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Science Night Is Coming!</strong><br><b>(1)</b> Science Night starts at 6:00 on Thursday. <b>(2)</b> In the school gym. <b>(3)</b> Each of the families <u>is</u> invited to explore hands-on experiments with their children. <b>(4)</b> Our fifth graders have builded a model volcano that really erupts with foamy red lava. <b>(5)</b> Volunteers should arrive <u>on</u> 5:45 to help set up the tables. <b>(6)</b> Free popcorn and lemonade will be served by the front doors of the school. <b>(7)</b> We hope to see you and your whole family there!"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
