var TODAY_STR = "20261025";
var RAW_QUESTIONS = [{"stem": "The suffix <i>-ward</i> means &ldquo;in the direction of.&rdquo; What does &ldquo;downward&rdquo; most likely mean in &ldquo;water seeps downward through tiny cracks&rdquo;?", "opts": ["deep under the ground", "all the way to the bottom", "in a slow and quiet way", "toward a lower place"], "ci": 3, "exp": "<i>Down</i> + <i>-ward</i> (&ldquo;in the direction of&rdquo;) means &ldquo;in the direction of down,&rdquo; or toward a lower place. &ldquo;All the way to the bottom&rdquo; is too strong &mdash; the word tells only the direction.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>How Limestone Caves Form</strong><br><p style=\"margin:0 0 8px;\">Many of the world&rsquo;s largest caves were carved not by rushing rivers but by slow, quiet chemistry. As rain falls and soaks into the soil, it absorbs carbon dioxide and becomes a weak acid. This slightly acidic water seeps downward through tiny cracks in limestone, a rock made mostly of the shells and skeletons of ancient sea creatures. Little by little, the acid dissolves the rock, widening the cracks into tunnels and, after hundreds of thousands of years, into enormous rooms.</p><p style=\"margin:0 0 8px;\">Once a cave has formed, it continues to change. When water drips from the ceiling, it releases some of its carbon dioxide into the cave air, and a tiny ring of limestone is left behind. Over centuries, these rings build stalactites that hang down like icicles, while drops that splash on the floor build stalagmites that rise upward. Where the two meet, they form a column.</p><p style=\"margin:0 0 8px;\">Because many formations grow only about an inch every hundred years, they are fragile treasures. A single careless touch can leave skin oils that stop a formation from growing, which is why visitors to caves such as Mammoth Cave in Kentucky are asked to keep their hands to themselves.</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of <b>wasteful</b> as it is used in Passage B?", "opts": ["extravagant", "economical", "generous", "expensive"], "ci": 1, "exp": "Buying a tool you use only once or twice is <i>wasteful</i>. The opposite is <i>economical</i>, which means careful not to waste money. <i>Extravagant</i> means almost the same as wasteful.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs."}, {"stem": "How are the libraries in Passage A and Passage B alike?", "opts": ["Both opened in Philadelphia during colonial times.", "Both help people share costly things instead of buying them.", "Both lend mostly tools and musical instruments to families.", "Both were started by Benjamin Franklin and his friends."], "ci": 1, "exp": "In Passage A, books were &ldquo;expensive and rare,&rdquo; so members shared them. In Passage B, families share tools and instruments instead of buying them. The libraries are in different places and times, and only B lends tools.", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs."}, {"stem": "According to Passage A, how did the Library Company get money to buy books?", "opts": ["The colony of Pennsylvania gave the club money.", "Benjamin Franklin paid for all the books himself.", "Each member paid a fee to join.", "Readers paid each time they borrowed a book."], "ci": 2, "exp": "Passage A says, &ldquo;Each member paid a fee to join, and the money was used to purchase books from London.&rdquo; Members paid once to join, not each time they borrowed.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Two Kinds of Libraries</strong><br><strong>Passage A: America’s First Lending Library</strong><br>In 1731, books were expensive and rare in the American colonies, so few people could afford to own more than a handful. Benjamin Franklin and a group of friends in Philadelphia devised a solution. Each member paid a fee to join, and the money was used to purchase books from London that all members could borrow. They called their club the Library Company of Philadelphia. The idea spread quickly, and similar libraries opened in other towns. Franklin later wrote that these libraries made ordinary tradesmen and farmers as intelligent as most gentlemen in other countries.<br><br><strong>Passage B: Borrow a Cake Pan?</strong><br>At one public library in California, you can check out far more than books. Since 2015, the library has lent sewing machines, ukuleles, telescopes, and video cameras through what it calls a “Library of Things.” Librarians point out that many families need a tool or an instrument only once or twice, so buying one would be wasteful. Borrowing also lets people try a new hobby before spending money on it. Hundreds of libraries across the country now lend unusual items, from cake pans to gardening tools, showing that libraries keep adapting to meet their communities’ needs."}, {"stem": "In the third paragraph, the word “flourished” most likely means —", "opts": ["were left empty", "grew and did well", "flooded often", "competed with one another"], "ci": 1, "exp": "Right before this, the passage says “Shipping costs fell by about ninety percent,” and then that New York City became the busiest port — clues that the towns grew and did well. The canal carried boats, but nothing says the towns “flooded often.”", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Erie Canal</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods across New York was slow and expensive. A wagon pulled by horses could take weeks to haul flour from the Great Lakes region to New York City, and the cost of the trip often doubled the price of the flour. Governor DeWitt Clinton believed a canal could solve this problem, but many people mocked the plan as &ldquo;Clinton&rsquo;s Ditch.&rdquo; They doubted that workers could dig a channel 363 miles long through thick forests, swamps, and hills.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, cleared trees and dug almost entirely by hand with shovels and picks. Because the land rose and fell along the route, engineers designed 83 locks that lifted boats up hills and lowered them on the other side.</p><p style=\"margin:0 0 8px;\">When the canal opened in 1825, Clinton traveled its full length by boat and poured a barrel of Lake Erie water into the Atlantic Ocean. The results were remarkable. Shipping costs fell by about ninety percent, and towns such as Buffalo, Rochester, and Syracuse flourished along the route. Within a few decades, New York City had become the busiest port in the nation.</p>"}, {"stem": "What was the main way in which a caisson kept river water out while men dug?", "opts": ["It was held up by steel cables.", "It was lined with stone from the towers.", "It was covered with wet sheets.", "It was filled with pressed air."], "ci": 3, "exp": "The caisson was &ldquo;sunk to the riverbed and filled with pressed air to keep the water out.&rdquo;", "tag": "Main Way", "tagcolor": "#185FA5", "passage": "In the summer of 1881, twelve-year-old Thomas Byrne lived in a crowded apartment near the East River in Brooklyn. Every morning he watched hundreds of people squeeze onto the ferries that carried workers across the river to New York City. When fog or ice filled the river, the ferries stopped, and many families lost a day&rsquo;s pay. That was why the city was building the Brooklyn Bridge, a suspension bridge, or a bridge whose roadway hangs from huge cables stretched between tall towers.<br><br>Years earlier, Thomas&rsquo;s father had helped dig the bridge&rsquo;s foundations. He had worked in a caisson, a giant wooden box without a bottom that was sunk to the riverbed and filled with pressed air to keep the water out. Workers who came up too quickly often became sick with a painful illness called caisson disease. The chief engineer, Washington Roebling, became so ill that he could no longer leave his house.<br><br>One afternoon, Thomas delivered a package to the Roebling home. He saw Emily Roebling, the engineer&rsquo;s wife, studying drawings at a cluttered table. She explained that she carried her husband&rsquo;s instructions to the builders every day and had learned the mathematics of cables herself. <u>Mrs. Roebling was the most remarkable person in all of Brooklyn.</u><br><br>From the window, Thomas could see the two stone towers rising above the river like giant gray guardians. Workers were spinning steel wires into four thick cables, each made of more than 5,000 wires. Thomas asked whether a boy could ever learn to build something so enormous. Mrs. Roebling handed him a small notebook and told him to begin by writing down every question he had. On his way home, Thomas stopped at the water&rsquo;s edge, opened the notebook, and stared up at the cables shining in the evening sun."}, {"stem": "Which word means the <b>SAME</b> or nearly the same as &ldquo;meager&rdquo; as it is used in the story?", "opts": ["plentiful", "steady", "risky", "slim"], "ci": 3, "exp": "After his first day Samuel had &ldquo;only a few glittering flakes,&rdquo; and the results stayed &ldquo;meager,&rdquo; or slim and small. <i>Plentiful</i> means the opposite.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>Panning on the American River</strong><br>In the spring of 1849, twelve-year-old Samuel Price and his uncle reached the gold fields of California after five months on the overland trail. The camp along the American River was a crowded tangle of canvas tents, and the miners spoke a dozen languages. Uncle Josiah had sold his Ohio farm to pay for the journey, so Samuel knew how much depended on their luck.<br><br>On their first morning, an experienced miner named Mr. Ortega showed them how to pan. He scooped gravel and water into a shallow metal pan, then swirled it in slow circles, letting the lighter sand wash over the rim. Gold is heavy, he explained, so it sinks to the bottom. Samuel practiced until his fingers were numb from the icy water, but at sunset his pan held only a few glittering flakes.<br><br>For weeks the results were meager. Prices in camp were outrageous: a single egg cost a dollar, and a pair of boots cost forty. Uncle Josiah grew quiet and discouraged. Then Samuel had an idea. Instead of digging, they could sell fresh bread to the hungry miners. By autumn, their little bakery earned more in a week than their pan had earned all summer."}, {"stem": "Why did the bakery most likely earn more money than panning for gold?", "opts": ["Mr. Ortega bought most of the bread for his own crew.", "Bread could be sold in Ohio for much more than in California.", "The river had run out of gold by the end of the summer.", "Many hungry miners needed food and were used to paying high prices in camp."], "ci": 3, "exp": "The story says prices were &ldquo;outrageous&rdquo; (a dollar for one egg) and calls the miners &ldquo;hungry,&rdquo; so fresh bread could sell for a lot. Nothing says the river ran out of gold.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Panning on the American River</strong><br>In the spring of 1849, twelve-year-old Samuel Price and his uncle reached the gold fields of California after five months on the overland trail. The camp along the American River was a crowded tangle of canvas tents, and the miners spoke a dozen languages. Uncle Josiah had sold his Ohio farm to pay for the journey, so Samuel knew how much depended on their luck.<br><br>On their first morning, an experienced miner named Mr. Ortega showed them how to pan. He scooped gravel and water into a shallow metal pan, then swirled it in slow circles, letting the lighter sand wash over the rim. Gold is heavy, he explained, so it sinks to the bottom. Samuel practiced until his fingers were numb from the icy water, but at sunset his pan held only a few glittering flakes.<br><br>For weeks the results were meager. Prices in camp were outrageous: a single egg cost a dollar, and a pair of boots cost forty. Uncle Josiah grew quiet and discouraged. Then Samuel had an idea. Instead of digging, they could sell fresh bread to the hungry miners. By autumn, their little bakery earned more in a week than their pan had earned all summer."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["About three hundred people attended the meeting at Seneca Falls.", "The Wyoming Territory allowed women to vote before 1920.", "Susan B. Anthony lived to see the Nineteenth Amendment ratified.", "Anthony refused to pay the fine she was given."], "ci": 2, "exp": "The last paragraph says &ldquo;Anthony had died fourteen years earlier,&rdquo; so she did not live to see the 1920 victory. The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Votes for Women</strong><br>For most of the nation&rsquo;s early history, American women could not vote in national elections. They paid taxes and obeyed laws, yet they had no voice in choosing the leaders who wrote those laws. In 1848, about three hundred people gathered in Seneca Falls, New York, for the first convention devoted to women&rsquo;s rights. There, Elizabeth Cady Stanton read a bold declaration insisting that &ldquo;all men and women are created equal.&rdquo;<br><br>The struggle that followed was long and often discouraging. Activists such as Susan B. Anthony made frequent journeys from town to town, delivering speeches and collecting signatures on petitions. In 1872, Anthony was arrested for casting a ballot in Rochester, New York, and she was fined one hundred dollars, a penalty she refused to pay. Progress came first in the West: the Wyoming Territory granted women the vote in 1869, and several western states soon followed.<br><br>Finally, in 1920, enough states ratified the Nineteenth Amendment to make it part of the Constitution. The amendment declared that no citizen could be denied the right to vote because of sex. Anthony had died fourteen years earlier, but her persistence helped make the victory possible."}, {"stem": "Based on Passage A and Passage B, what is one similarity between Margaret and Jamal?", "opts": ["Both children live on farms in Nebraska.", "Both children stay in touch with a grandparent who lives far away.", "Both children are working on science projects about volcanoes.", "Both children write letters every Sunday and mail them."], "ci": 1, "exp": "Margaret writes letters to her grandmother in Ohio, and Jamal video-calls his grandfather in Atlanta. Both keep in touch with a faraway grandparent. Only Jamal has a volcano project, and only Margaret mails letters.", "tag": "Paired Passage — Synthesis (Similarities)", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br>In 1920, ten-year-old Margaret Hill lived on a farm in Nebraska, far from her grandmother in Ohio. Each Sunday she wrote a long letter describing the harvest and her new calf, then walked two miles to the post office. That year, the U.S. Air Mail Service began flying mail across the country, so letters traveled faster than they could by train alone. Still, Margaret waited many days for each reply. When an envelope finally arrived, she read it aloud to her brothers and saved it in a tin box beneath her bed.<br><br><strong>Passage B</strong><br>Today, eleven-year-old Jamal Price lives in Seattle, while his grandfather lives in Atlanta, more than 2,000 miles away. Every Sunday evening, Jamal opens a laptop and starts a video call. Within seconds, his grandfather&rsquo;s smiling face fills the screen. Jamal shows him a science project about volcanoes, and his grandfather asks questions and tells stories about his own school days. Sometimes the internet connection freezes, and they have to call again. When the call ends, Jamal writes his grandfather&rsquo;s stories in a journal so he will remember them."}, {"stem": "Which word means the <b>OPPOSITE</b> of “precise” as it is used in the second paragraph?", "opts": ["rapid", "exact", "inaccurate", "silent"], "ci": 2, "exp": "The passage shows echolocation is “precise” because bats can find a wire “thinner than a human hair” — it is very exact. The opposite is <i>inaccurate</i>; <i>exact</i> means almost the SAME as precise.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Seeing with Sound</strong><br><p style=\"margin:0 0 8px;\">On a summer evening, a little brown bat can snatch hundreds of mosquitoes in a single hour, even in complete darkness. Its secret is a skill called echolocation. As it flies, the bat produces rapid, high-pitched calls, most of them far too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo. By sensing how long each echo takes to return, the bat judges how far away an insect is, and by comparing the echoes that reach its left and right ears, it can tell which direction the insect is moving.</p><p style=\"margin:0 0 8px;\">Echolocation is remarkably precise. Some bats can detect a wire thinner than a human hair. As a bat closes in on its prey, it calls faster and faster, until the clicks blur into a sound scientists have nicknamed the “feeding buzz.”</p><p style=\"margin:0 0 8px;\">Bats are not the only creatures that hunt this way. Dolphins send clicks through the water, and engineers modeled early sonar systems for ships on the same principle. Still, bats remain among the most skilled echolocators on Earth, which is one reason scientists are cautious about disturbing the caves where they roost.</p>"}, {"stem": "What can the reader infer about Mrs. Peterson from the last sentence of the story?", "opts": ["She was expecting the teacher to visit for dinner that night.", "She was afraid of the dark and lit the lantern for herself.", "She had watched the children leave the schoolhouse earlier.", "She guessed that people might be lost in the storm and wanted to guide them."], "ci": 3, "exp": "She hung the lantern “hoping someone would see it,” which shows she was thinking of people caught outside in the blizzard. Nothing in the story says she saw the children leave.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>The Twine Line</strong><br><p style=\"margin:0 0 8px;\">The morning of January 12, 1888, was so mild that nine-year-old Anna Larsen walked to the prairie schoolhouse without her heavy scarf. By early afternoon, however, the sky to the northwest had turned the color of slate, and Miss Carver, the young teacher, studied it through the window with a frown.</p><p style=\"margin:0 0 8px;\">Within minutes the storm struck. Wind slammed against the walls, and snow as fine as flour hissed through every crack. The temperature plunged so quickly that the ink froze in its wells. When the coal ran low, Miss Carver made a difficult decision. The Peterson farmhouse stood only a quarter mile away, but in the whirling snow the children could not even see the fence beside the road.</p><p style=\"margin:0 0 8px;\">She unrolled a ball of twine and knotted it from wrist to wrist, linking all eleven students into a single line. “Keep one hand on the twine and the other on the shoulder in front of you,” she commanded. Anna, near the end, felt the cord jerk tight whenever someone stumbled.</p><p style=\"margin:0 0 8px;\">They persisted for nearly an hour, groping from one fence post to the next, until a lantern glowed through the white. Mrs. Peterson had hung it on her porch, hoping someone would see it.</p>"}, {"stem": "According to the passage, by about how many miles did the canal shorten the trip from New York to San Francisco?", "opts": ["roughly 13,000 miles", "about 5,000 miles", "about 1,914 miles", "nearly 8,000 miles"], "ci": 3, "exp": "The last paragraph says the trip &ldquo;shrank by nearly 8,000 miles.&rdquo; Roughly 13,000 miles was the length of the whole old voyage around South America, not the amount saved.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Cutting a Path Between Two Oceans</strong><br>For centuries, ships traveling between New York and San Francisco had to sail all the way around the southern tip of South America, a voyage of roughly 13,000 miles. Many leaders dreamed of slicing a shortcut through Panama, where a narrow strip of land separates the Atlantic and Pacific Oceans. A French company attempted the project in 1881, but tropical diseases and landslides overwhelmed its workers, and the effort collapsed within a decade.<br><br>In 1904, the United States took over the work. Before digging could resume, Dr. William Gorgas led a campaign to drain standing water and screen windows, because mosquitoes were spreading yellow fever and malaria. Once the illnesses faded, tens of thousands of laborers, many from Caribbean islands, excavated mountains of rock and soil. Engineers dammed the Chagres River to create Gatun Lake and built enormous locks that lift ships up to the lake and lower them back to sea level.<br><br>When the canal opened in 1914, the trip from New York to San Francisco shrank by nearly 8,000 miles. Even today, cargo ships make frequent trips through it."}, {"passage": "<strong>The River&rsquo;s Work</strong><br><p style=\"margin:0 0 10px\">The river owns no hammer,<br>no chisel and no saw,<br>yet every spring it sharpens<br>the canyon&rsquo;s stony jaw.</p><p style=\"margin:0 0 10px\">It carries sand like secrets<br>and pebbles like small change,<br>and rolls them, grinding, seaward<br>through valleys wide and strange.</p><p style=\"margin:0 0 10px\">A storm can make it furious&mdash;<br>it bellows, foams, and leaps&mdash;<br>but mostly it is quiet,<br>and what it takes, it keeps.</p><p style=\"margin:0 0 10px\">A thousand years are nothing<br>to water on the move;<br>the deepest gorge was started<br>by one thin, wandering groove.</p>", "stem": "As it is used in the third stanza, what does &ldquo;bellows&rdquo; most likely mean?", "opts": ["roars loudly", "dries up", "rises slowly", "turns muddy"], "ci": 0, "exp": "In the third stanza the river is &ldquo;furious&rdquo; during a storm and &ldquo;foams, and leaps,&rdquo; so <i>bellows</i> means it makes a loud, angry roar. The next line contrasts this with being &ldquo;quiet.&rdquo;", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "How are the families in Passage A and Passage B alike?", "opts": ["Both families owned more than one television.", "Both families lived on farms in Ohio.", "In both families, a change involving screens ended up bringing people closer.", "In both passages, a parent worried that screens would replace conversation."], "ci": 2, "exp": "Linda&rsquo;s family laughed and argued about shows together, and Omar&rsquo;s family began cooking and playing games together. Only Linda&rsquo;s mother worried about conversation, and only Linda lived on an Ohio farm.", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1955, Linda&rsquo;s father carried a heavy wooden cabinet into the living room of their Ohio farmhouse, and the whole family gathered around their first television. Each evening after supper, they watched the same programs together, since the set received only two channels. Neighbors who had no television often came over, crowding onto the sofa and the floor. Linda&rsquo;s mother worried that the glowing screen would replace conversation, but Linda noticed the opposite: the family laughed at the same jokes and argued cheerfully about the shows long after the set was turned off.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Omar&rsquo;s family in San Diego owns four screens, yet they rarely look at the same one. His sister watches videos in her room, his father reads the news on his tablet, and Omar plays games on his laptop. Last spring his parents announced a new rule: every Sunday evening would be screen-free. At first Omar resented the idea and counted the minutes until Monday. Gradually, though, the family began cooking dinner together and playing board games, and Omar realized he knew more about his sister&rsquo;s week than he had in months.</p>"}, {"stem": "In Passage B, what does the word &ldquo;resented&rdquo; mean in &ldquo;At first Omar resented the idea&rdquo;?", "opts": ["completely forgot about", "explained carefully", "felt annoyed and unhappy about", "was excited about"], "ci": 2, "exp": "Omar &ldquo;counted the minutes until Monday,&rdquo; which shows he did not like the rule at first. &ldquo;Was excited about&rdquo; is the opposite of his feeling.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1955, Linda&rsquo;s father carried a heavy wooden cabinet into the living room of their Ohio farmhouse, and the whole family gathered around their first television. Each evening after supper, they watched the same programs together, since the set received only two channels. Neighbors who had no television often came over, crowding onto the sofa and the floor. Linda&rsquo;s mother worried that the glowing screen would replace conversation, but Linda noticed the opposite: the family laughed at the same jokes and argued cheerfully about the shows long after the set was turned off.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Omar&rsquo;s family in San Diego owns four screens, yet they rarely look at the same one. His sister watches videos in her room, his father reads the news on his tablet, and Omar plays games on his laptop. Last spring his parents announced a new rule: every Sunday evening would be screen-free. At first Omar resented the idea and counted the minutes until Monday. Gradually, though, the family began cooking dinner together and playing board games, and Omar realized he knew more about his sister&rsquo;s week than he had in months.</p>"}, {"stem": "According to the passage, what causes a thick glacier to move downhill?", "opts": ["gravity", "rivers flowing beneath the ice", "the weight of the boulders it carries", "melting snow each summer"], "ci": 0, "exp": "The passage states, &ldquo;When the mass becomes thick enough, gravity causes it to creep slowly downhill.&rdquo; Melting snow is mentioned, but only to explain where glaciers form.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Rivers of Ice</strong><br><p style=\"margin:0 0 8px;\">A glacier forms in places where more snow falls each winter than melts each summer. Year after year, the snow piles up, and the weight of the upper layers presses the lower layers into dense, bluish ice. When the mass becomes thick enough, gravity causes it to creep slowly downhill. Although most glaciers move only a few inches or feet a day, their force is tremendous.</p><p style=\"margin:0 0 8px;\">As a glacier advances, it plucks boulders from the ground and drags them along its base, scraping the bedrock like enormous sandpaper. Over thousands of years, this grinding carves narrow, V-shaped river valleys into wide valleys shaped like the letter U. When the climate warms and a glacier retreats, it leaves behind ridges of rock and gravel, scattered boulders, and sometimes deep basins that fill with water. Many of the lakes in Minnesota and Wisconsin formed this way.</p><p style=\"margin:0 0 8px;\">Today, scientists measure how quickly glaciers are shrinking, because melting ice can raise sea levels and reduce the fresh water that some communities depend on.</p>"}, {"passage": "<strong>Masters of Disguise</strong><br><p style=\"margin:0 0 10px\">Few animals can vanish as quickly as the octopus. Although it has no bones and no shell to protect it, this soft-bodied creature survives in oceans crowded with sharks, eels, and hungry seals. Its greatest defense is its skin. Beneath the surface lie thousands of tiny sacs filled with color, and the octopus can stretch or squeeze them in less than a second.</p><p style=\"margin:0 0 10px\">Within moments, a brown octopus resting on a reef can turn mottled orange and white to match the coral around it. Some species can even raise small bumps on their skin, imitating the rough texture of rock or seaweed. Scientists are still puzzled by one remarkable fact: most octopuses appear to be colorblind. Researchers suspect that light-sensing cells in the skin itself may help the animal detect its surroundings.</p><p style=\"margin:0 0 10px\">Camouflage is not the octopus&rsquo;s only trick, however. When concealing itself fails, it can squirt a cloud of dark ink and jet away while the startled predator attacks the murky water. This combination of disguise and escape has allowed octopuses to adapt to nearly every ocean habitat on Earth, from shallow tide pools to the frigid deep sea.</p>", "stem": "As it is used in the passage, what does the word &ldquo;imitating&rdquo; most likely mean?", "opts": ["changing the color of", "hiding underneath", "smoothing out", "copying the look of"], "ci": 3, "exp": "The bumps make the skin look like &ldquo;the rough texture of rock or seaweed,&rdquo; so the octopus is copying how those things look. &ldquo;Changing the color of&rdquo; is tempting, but the bumps change texture, not color.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5"}, {"passage": "<strong>Warning in the Narrows</strong><br><p style=\"margin:0 0 10px\">Marcus had wanted to hike the slot canyon ever since he saw photographs of its walls glowing orange in the afternoon sun. The canyon was only a few feet wide in places, and the sandstone walls rose so high that the sky looked like a thin blue ribbon.</p><p style=\"margin:0 0 10px\">An hour into the hike, Aunt Rosa stopped and frowned. Far to the west, above the distant mesas, a dark wall of clouds was building. &ldquo;That storm is miles away,&rdquo; Marcus said. &ldquo;It isn&rsquo;t even raining here.&rdquo;</p><p style=\"margin:0 0 10px\">&ldquo;It doesn&rsquo;t need to rain here,&rdquo; she replied. Rain that falls on bare rock miles upstream cannot soak into the ground, she explained, so it rushes downhill and funnels into narrow canyons. A dry streambed can become a swift, dangerous torrent in minutes.</p><p style=\"margin:0 0 10px\">Marcus glanced at the ominous clouds again and, without another word, turned around. They scrambled out of the canyon just as a low rumble echoed off the rocks. From the rim, they watched muddy brown water surge through the passage where they had been walking only twenty minutes earlier.</p>", "stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The canyon walls were made of sandstone.", "Marcus and his aunt watched the flood from the rim.", "The storm clouds were building to the west.", "Marcus and his aunt hiked for three hours before turning around."], "ci": 3, "exp": "Aunt Rosa stopped &ldquo;an hour into the hike,&rdquo; and they turned around soon after, so they did not hike three hours. The other statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5"}, {"passage": "<strong>A Code Made of Dots</strong><br><p style=\"margin:0 0 10px\">In 1812, a three-year-old boy named Louis Braille was playing in his father&rsquo;s leather workshop in France when a sharp tool slipped and injured his eye. An infection soon spread to his other eye, and by the age of five he was completely blind.</p><p style=\"margin:0 0 10px\">Louis was a determined student, and at ten he earned a place at the Royal Institute for Blind Youth in Paris. The school owned a few books printed with huge raised letters, but they were heavy, expensive, and painfully slow to read by touch. Then, in 1821, a former army captain visited the school to demonstrate a method that soldiers used to read messages in the dark by touching raised dots. The method was too complicated for most students, yet Louis recognized its potential. Over the next three years, he simplified the code until each letter fit beneath a single fingertip.</p><p style=\"margin:0 0 10px\">Teachers at the institute were reluctant to give up the raised letters they had always used, and Braille&rsquo;s system was not officially adopted until 1854, two years after his death. Today, his invention is used by millions of readers in nearly every language.</p>", "stem": "The word &ldquo;simplified&rdquo; is made from <i>simple</i> + <i>-ify</i>, a suffix that means &ldquo;to make.&rdquo; What does &ldquo;simplified&rdquo; most likely mean in the passage?", "opts": ["made easier to use", "made more exact", "made longer and more detailed", "made more famous"], "ci": 0, "exp": "<i>Simple</i> + <i>-ify</i> = &ldquo;to make simple.&rdquo; Louis took a method that was &ldquo;too complicated&rdquo; and made it easier, so each letter fit &ldquo;beneath a single fingertip.&rdquo; &ldquo;Made more exact&rdquo; is close, but the passage stresses making it less complicated.", "tag": "Word Parts", "tagcolor": "#185FA5"}, {"stem": "Why does the author describe the dust as “a black wall of dust, taller than any building he had ever seen”?", "opts": ["to suggest that Walter was exaggerating to scare his sister", "to explain how dust storms form on the plains", "to show how huge and frightening the storm looked to Walter", "to compare buildings in Oklahoma with buildings in cities"], "ci": 2, "exp": "Right after seeing it, Walter “froze,” so the description helps the reader feel his fear and the storm’s size. The passage never explains how dust storms form.", "tag": "Author's Craft", "tagcolor": "#185FA5", "passage": "<strong>Black Sunday</strong><br><p style=\"margin:0 0 8px;\">On the afternoon of April 14, 1935, the sky over the Oklahoma Panhandle was the clearest it had been in weeks. Walter Briggs and his little sister, June, were walking home from church when the birds suddenly went quiet. Walter glanced north and froze. A black wall of dust, taller than any building he had ever seen, was rolling across the plains toward them.</p><p style=\"margin:0 0 8px;\">&ldquo;Run for the Hendersons&rsquo; barn!&rdquo; he shouted, grabbing June&rsquo;s hand. Within minutes, daylight vanished. Walter could barely see his own fingers, and grit stung his eyes and cheeks. He pressed his scarf over June&rsquo;s nose and mouth and kept one hand on the fence wire, following it step by step until his shoulder bumped the barn door.</p><p style=\"margin:0 0 8px;\">Inside, the children huddled in the dark beside the Hendersons&rsquo; frightened mules. Hours passed before the howling wind finally softened. When their father arrived with a lantern, his face was coated gray, but his voice was steady. &ldquo;You used your head, son,&rdquo; he said quietly. Walter did not feel brave&mdash;only exhausted&mdash;but he did not let go of June&rsquo;s hand the whole way home.</p>"}, {"stem": "What can the reader infer about the small local school near Eli&rsquo;s ranch?", "opts": ["It has a better robotics program than the online school.", "It is located on Eli&rsquo;s family&rsquo;s ranch.", "It closed because the internet connection kept dropping.", "It offers fewer classes than Eli&rsquo;s online school."], "ci": 3, "exp": "Passage B says online school gives Eli &ldquo;classes, such as robotics, that his small local school could never offer.&rdquo; This suggests the local school has fewer choices.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1910, nine-year-old Hattie walked two miles each morning to a one-room schoolhouse in rural Iowa. Inside, twenty students between the ages of six and fourteen shared a single teacher, Miss Pruitt. Because she could not teach every grade at once, the older students often helped the younger ones practice reading and arithmetic. In winter, Hattie arrived early to carry in wood for the iron stove, since the building had no other heat. Lessons were simple and books were scarce, but Hattie treasured her hours there. For a farm girl who was needed at home every afternoon, school was a precious chance to learn.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Eli lives on a cattle ranch in Montana, forty miles from the nearest town. Instead of riding a bus, he opens a laptop at the kitchen table, where his teacher appears on the screen along with classmates scattered across the state. When the internet connection drops during a storm, Eli has to wait and reconnect, which can be frustrating. Still, online school gives him access to classes, such as robotics, that his small local school could never offer. In the afternoons, Eli helps feed the cattle, and in the evenings he finishes assignments that his teacher reviews from more than a hundred miles away.</p>"}, {"stem": "Which list shows these events in the order they happened?", "opts": ["Hayden leads a government survey &rarr; explorers report boiling springs and geysers &rarr; President Grant signs the park law &rarr; the idea spreads around the world", "explorers report boiling springs and geysers &rarr; Hayden leads a government survey &rarr; the idea spreads around the world &rarr; President Grant signs the park law", "explorers report boiling springs and geysers &rarr; President Grant signs the park law &rarr; Hayden leads a government survey &rarr; the idea spreads around the world", "explorers report boiling springs and geysers &rarr; Hayden leads a government survey &rarr; President Grant signs the park law &rarr; the idea spreads around the world"], "ci": 3, "exp": "The explorers went in 1870, Hayden&rsquo;s survey came &ldquo;the following year,&rdquo; Grant signed the law on March 1, 1872, and the idea &ldquo;eventually spread.&rdquo; Hayden&rsquo;s survey came after the explorers&rsquo; reports, not before.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>America&rsquo;s First National Park</strong><br>In the summer of 1870, a group of explorers traveled into the remote wilderness where the present-day states of Wyoming, Montana, and Idaho meet. They returned with astonishing reports of boiling springs, towering waterfalls, and geysers that hurled scalding water high into the air. Many people in the East refused to believe them. The following year, the geologist Ferdinand Hayden led a government survey to the region, bringing along the photographer William Henry Jackson and the painter Thomas Moran. Their photographs and paintings gave members of Congress something the written reports could not: proof.<br><br>Hayden worried that private companies would soon claim the land, build hotels, and charge visitors to see the geysers. He urged lawmakers to protect it instead. On March 1, 1872, President Ulysses S. Grant signed a law setting aside more than two million acres as Yellowstone National Park, &ldquo;for the benefit and enjoyment of the people.&rdquo;<br><br>No nation had ever done anything quite like it. The idea of giving wild land permanent protection eventually spread across the country and around the world, and today the U.S. National Park System includes more than four hundred areas."}, {"stem": "Which word means the <b>SAME</b> or nearly the same as “reluctant” as it is used in the story?", "opts": ["careful", "eager", "proud", "unwilling"], "ci": 3, "exp": "“Dev was reluctant to argue,” so he spoke “quietly” and did not push hard — he was not willing to start a fight. <i>Unwilling</i> means nearly the same; <i>eager</i> is close to the opposite.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>The Poster Problem</strong><br><p style=\"margin:0 0 8px;\">Ruby had already outlined the title of their science-fair poster in tall purple letters when Dev slid into the seat beside her.</p><p style=\"margin:0 0 8px;\">“Purple?” he said, frowning. “Our project is about how plants grow under different colors of light. Shouldn’t the title be green?”</p><p style=\"margin:0 0 8px;\">Ruby kept her marker pressed to the paper. “Purple light made our bean plants grow tallest. That’s the whole point.”</p><p style=\"margin:0 0 8px;\">Dev was reluctant to argue, but he had spent three weekends measuring those plants. “Then at least let me make the graph,” he said quietly. “I know exactly where every number goes.”</p><p style=\"margin:0 0 8px;\">Ruby hesitated. She had planned to draw the graph herself, because her handwriting was neater. Then she glanced at Dev’s notebook, its pages crowded with careful columns of measurements and tiny dated sketches. She had never once seen him skip a day of watering.</p><p style=\"margin:0 0 8px;\">“Okay,” she said, sliding the ruler across the table. “You do the graph, and I’ll finish the title. But you have to pick the color for the bars.”</p><p style=\"margin:0 0 8px;\">Dev grinned for the first time all afternoon. “Green,” he said. “Obviously.”</p>"}, {"stem": "According to the story, what does Dev ask Ruby to let him do?", "opts": ["measure the bean plants again", "water the plants every weekend", "make the graph for the poster", "change the title to green letters"], "ci": 2, "exp": "Dev says, “Then at least let me make the graph.” He does question the purple title, but what he actually asks to do is the graph.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>The Poster Problem</strong><br><p style=\"margin:0 0 8px;\">Ruby had already outlined the title of their science-fair poster in tall purple letters when Dev slid into the seat beside her.</p><p style=\"margin:0 0 8px;\">“Purple?” he said, frowning. “Our project is about how plants grow under different colors of light. Shouldn’t the title be green?”</p><p style=\"margin:0 0 8px;\">Ruby kept her marker pressed to the paper. “Purple light made our bean plants grow tallest. That’s the whole point.”</p><p style=\"margin:0 0 8px;\">Dev was reluctant to argue, but he had spent three weekends measuring those plants. “Then at least let me make the graph,” he said quietly. “I know exactly where every number goes.”</p><p style=\"margin:0 0 8px;\">Ruby hesitated. She had planned to draw the graph herself, because her handwriting was neater. Then she glanced at Dev’s notebook, its pages crowded with careful columns of measurements and tiny dated sketches. She had never once seen him skip a day of watering.</p><p style=\"margin:0 0 8px;\">“Okay,” she said, sliding the ruler across the table. “You do the graph, and I’ll finish the title. But you have to pick the color for the bars.”</p><p style=\"margin:0 0 8px;\">Dev grinned for the first time all afternoon. “Green,” he said. “Obviously.”</p>"}];

      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
