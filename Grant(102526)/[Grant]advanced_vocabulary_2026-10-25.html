<style>

  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues. This week's review — questions you missed recently.";
var TODAY_STR = "20261025";
var RAW_QUESTIONS = [{"stem": "The new bike lanes had a big <b>impact</b> on the town: twice as many kids now ride their bikes to school. What does <b>impact</b> mean in this sentence?", "opts": ["a high cost to pay", "a long delay", "a strong effect", "a sudden crash between two objects"], "ci": 2, "exp": "<i>impact</i> (n.) a strong effect or influence; it can also mean the force of one thing hitting another. <i>Planting trees had a huge <b>impact</b> on how cool the street felt.</i> Family: impactful (adj.). Here nothing crashed — the bike lanes changed how many kids ride, which is an effect.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Voting in free elections is an important part of a _____ government.", "opts": ["democrat", "democracy", "democratic", "democratically"], "ci": 2, "exp": "<i><b>democratic</b></i> (adj.) run by the people, who choose leaders by voting. <i>Our class made a <b>democratic</b> choice by voting on the field trip.</i> Family: democracy (n.), democratically (adv.) The blank describes the noun “government,” so it needs the adjective.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "After losing the spelling bee, Maya <b>resolved</b> to practice ten new words every day. Which meaning of <b>resolve</b> is used here?", "opts": ["to decide firmly to do something", "to settle an argument between people", "to find the answer to a problem", "to make a promise to someone else"], "ci": 0, "exp": "<i><b>resolve</b></i> (v.) to decide firmly to do something; also, to solve or settle a problem. <i>I <b>resolved</b> to go to bed earlier this week.</i> Family: resolution (n.) Maya made a strong decision about her own plan.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "To keep the sick hamster from spreading the illness, the vet told us to <b>isolate</b> it in a separate cage for a week. What does <b>isolate</b> mean in this sentence?", "opts": ["to keep apart from others", "to check often for signs of sickness", "to keep warm and quiet", "to feed on a special diet"], "ci": 0, "exp": "<i><b>isolate</b></i> (v.) to set apart or keep away from others. <i>The island was <b>isolated</b>, so supplies came only once a month.</i> Family: isolated (adj.), isolation (n.) A separate cage keeps the hamster away from the others.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "In 1918, a flu <b>epidemic</b> spread through cities so quickly that many schools and theaters were closed. Which word means the <b>SAME</b> or nearly the same as “epidemic” as it is used in the sentence?", "opts": ["outbreak", "shortage", "rumor", "cure"], "ci": 0, "exp": "<i>epidemic</i> (n.) a disease that spreads quickly to many people in an area. <i>Doctors worked to stop the measles <b>epidemic</b> before it reached more towns.</i> Family: epidemic (adj.). An <i>outbreak</i> is a sudden spread of disease; a <i>cure</i> is close to the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The store gave each shopper a free gift card to <b>compensate</b> them for the long wait at the checkout. What does <b>compensate</b> mean in this sentence?", "opts": ["make up for a loss or a problem", "reward for being loyal over many years", "charge an extra fee to", "apologize in writing to"], "ci": 0, "exp": "<i>compensate</i> (v.) to give something to make up for a loss, harm, or trouble. <i>The airline offered meals to <b>compensate</b> passengers for the delay.</i> Family: compensation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before the experiment, the class read the safety ______ step by step: goggles on, gloves on, then measure the vinegar.<br><br>Which word best completes the sentence?", "opts": ["phenomenon", "procedure", "hypothesis", "statistic"], "ci": 1, "exp": "<i>procedure</i> (n.) a set of steps for doing something the right way. <i>Every fire drill follows the same <b>procedure</b>.</i> Family: procedural (adj.), proceed (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Everyone in the class will _____ one food item to the holiday party, so there will be plenty to share.", "opts": ["inherit", "retreat", "contribute", "prohibit"], "ci": 2, "exp": "<i>contribute</i> (v.) to give something, along with others, to help a group or reach a goal. <i>Each neighbor <b>contributed</b> $5 to buy new swings for the park.</i> Family: contribution (n.), contributor (n.). Each student gives one item so everyone can share.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "original", "opts": ["made in a factory by the thousands", "the first of its kind, not a copy", "very old and broken", "copied from someone else"], "ci": 1, "exp": "\"original\" means: the first of its kind, not a copy.", "tag": "New", "tagcolor": "#185FA5"}, {"stem": "The puppy was <b>eager</b> to go outside and wagged its tail at the door. Which word means the <b>OPPOSITE</b> of <b>eager</b>?", "opts": ["keen", "patient", "excited", "reluctant"], "ci": 3, "exp": "<i><b>eager</b></i> (adj.) wanting very much to do something. The opposite is <i>reluctant</i> — not wanting to do it. <i>Keen</i> is a trap — it means nearly the same as eager. Family: eagerly (adv.), eagerness (n.).", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "When Ella turned eleven, her parents gave her more _____: she could choose her own after-school activities and plan her own homework time.", "opts": ["boundary", "autonomy", "legislation", "procedure"], "ci": 1, "exp": "<i>autonomy</i> (n.) the freedom to make your own choices and control your own actions. <i>Older students get more <b>autonomy</b> in choosing projects.</i> Family: autonomous (adj.).", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The <b>abolition</b> of the school&rsquo;s old dress code meant students could finally wear hoodies to class.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>abolition</b> as it is used in the sentence?", "opts": ["ending", "creation", "approval", "explanation"], "ci": 0, "exp": "<i>abolition</i> (n.) the act of officially ending a law, rule, or system. <i>Creation</i> is its opposite. <i>The <b>abolition</b> of slavery in the United States came in 1865.</i> Family: abolish (v.), abolitionist (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Even after scoring the winning goal, Diego stayed <b>modest</b> and told reporters that the whole team deserved the credit. What does <b>modest</b> mean in this sentence?", "opts": ["shy and afraid to speak to people", "thankful for help from a coach", "not bragging about your own success", "tired after working very hard"], "ci": 2, "exp": "<i><b>modest</b></i> (adj.) not bragging about your abilities or success; also, not large. <i>The champion gave a <b>modest</b> smile and thanked her family.</i> Family: modestly (adv.), modesty (n.) Diego gave the credit to others instead of himself.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The nurse will __________ the flu shots to every student on Friday morning.<br><br>Which form of the word correctly completes the sentence?", "opts": ["administrator", "administrative", "administration", "administer"], "ci": 3, "exp": "The blank needs a verb after <i>will</i>, so use <i>administer</i> (v.) to give or manage something officially. <i>Administration</i> (n.) is the group that runs something, <i>administrator</i> (n.) is a person, and <i>administrative</i> is an adjective. <i>The school <b>administration</b> planned the event.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Our school has a strict _____: phones must stay in lockers during class.", "opts": ["policy", "tributary", "phenomenon", "hypothesis"], "ci": 0, "exp": "<i><b>policy</b></i> (n.) a rule or plan that a group, school, or government follows. <i>The store’s return <b>policy</b> gives you 30 days to bring items back.</i> Family: policies (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Because Anchorage lies at a much higher <b>latitude</b> than Miami, it is farther north and gets far less sunlight in winter.<br><br>What does <b>latitude</b> mean in this sentence?", "opts": ["distance east or west of a starting line", "amount of land a city covers", "height above sea level", "distance north or south of the equator"], "ci": 3, "exp": "<i>latitude</i> (n.) how far a place is north or south of the equator, measured in degrees. <i>Places near the equator have a low <b>latitude</b> and warm weather.</i> Related: longitude (east&ndash;west), latitudinal (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The long climb up the mountain will <b>exhaust</b> even the strongest campers. Which meaning of <b>exhaust</b> is used here?", "opts": ["the smoke and gas that come out of an engine", "to let air out of a room", "to make very tired", "to use up all of a supply"], "ci": 2, "exp": "<i><b>exhaust</b></i> (v./n.) to make someone very tired; also, to use something up completely; also (n.) gas from an engine. <i>Running laps in the heat will <b>exhaust</b> you.</i> Family: exhausted (adj.), exhaustion (n.) The campers are people, so the climb makes them very tired.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The invention of the smartphone caused a <b>revolution</b> in the way people talk to each other. What does <b>revolution</b> mean in this sentence?", "opts": ["a careful plan", "a long argument", "a small improvement", "a huge change"], "ci": 3, "exp": "<i>revolution</i> (n.) a very big change in the way people live or do things. <i>The printing press started a <b>revolution</b> in reading.</i> Family: revolutionary (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "In the old legend, the knight’s greatest <b>exploit</b> was crossing the frozen mountains alone to rescue the village. Which meaning of <b>exploit</b> is used in this sentence?", "opts": ["a trick that takes advantage of a weakness in a computer program", "to treat someone unfairly to get something for yourself", "to make full use of something, such as a natural resource", "a brave or daring act"], "ci": 3, "exp": "<i>exploit</i> has several meanings. As a noun it can mean a brave, exciting act. As a verb it can mean to use something fully, or to treat someone unfairly. <i>The pilot’s <b>exploits</b> were told in every newspaper.</i> Here it names something the knight did that was daring: “crossing the frozen mountains alone.”", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The new student's _____ into the class was easy because everyone invited him to play at recess.", "opts": ["integrated", "integrates", "integration", "integrate"], "ci": 2, "exp": "After &ldquo;The new student's,&rdquo; the blank needs a noun, so <i>integration</i> fits. <i>integrate</i> (v.) to bring people or parts together into one group. Family: integration (n.), integrated (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Jordan's story was finally _____ after he put the events in order, so his listeners could follow what happened first, next, and last.", "opts": ["obvious", "fragile", "reluctant", "coherent"], "ci": 3, "exp": "<i>coherent</i> (adj.) clear and logical, with parts that fit together. <i>A <b>coherent</b> paragraph has ideas in a sensible order.</i> Family: coherence (n.).", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Her nervousness began to __________ itself in small ways: she tapped her pencil and kept checking the clock.<br><br>Which word best completes the sentence?", "opts": ["execute", "sustain", "integrate", "manifest"], "ci": 3, "exp": "<i>manifest</i> (v.) to show something clearly so that others can see it. Her tapping and clock-checking showed her nerves. <i>The disease <b>manifests</b> itself as a rash.</i> Family: manifestation (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "At dinner, Grandpa loves to <b>recount</b> the day he caught a twelve-pound catfish, telling every detail just as it happened.<br><br>What does <b>recount</b> mean in this sentence?", "opts": ["try hard to remember", "count again", "make bigger than it really was", "tell the story of"], "ci": 3, "exp": "<i>recount</i> (v.) to tell the story of something that happened. (It can also mean &ldquo;count again,&rdquo; but here Grandpa is <i>telling every detail</i>.) <i>The book <b>recounts</b> the journey of the first pioneers.</i> Family: recounting (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Leaders from many countries rushed to _____ the attack on the peaceful village.", "opts": ["compensate", "migrate", "commence", "condemn"], "ci": 3, "exp": "<i><b>condemn</b></i> (v.) to say strongly that something is wrong or bad. <i>The principal <b>condemned</b> the bullying in a letter to families.</i> Family: condemnation (n.).", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "When smoke filled the hallway, the teachers had to <b>evacuate</b> the building. Which word means the <b>OPPOSITE</b> of <b>evacuate</b>?", "opts": ["clear", "empty", "leave", "enter"], "ci": 3, "exp": "<i><b>evacuate</b></i> (v.) to leave or move people out of a dangerous place. The opposite is <i>enter</i>. <i>Empty</i> and <i>leave</i> are traps — they mean nearly the same as evacuate. Family: evacuation (n.).", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Like many <b>immigrants</b> in the early 1900s, Rosa’s great-grandfather arrived at Ellis Island with one suitcase, hoping to build a new life in America. What does <b>immigrant</b> mean in this sentence?", "opts": ["a person who visits a place for a short vacation", "a person who works on a ship that crosses the ocean", "a person who explores lands no one has mapped", "a person who comes to live in a new country"], "ci": 3, "exp": "<i>immigrant</i> (n.) a person who comes to live permanently in a new country. <i>The city’s first bakery was opened by an <b>immigrant</b> from Italy.</i> Family: immigrate (v.), immigration (n.). He came “hoping to build a new life,” so he planned to stay, not just visit.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The author’s novel was <b>adapted</b> into a movie, so some scenes were shortened and new music was added. Which meaning of <b>adapt</b> is used in this sentence?", "opts": ["changed a tool or machine so it can be used in a new way", "changed over many generations to survive in a habitat", "got used to a new place or situation", "rewritten in a new form, such as a movie or play"], "ci": 3, "exp": "<i>adapt</i> (v.) can mean to change to fit a new place, to change over generations to survive, or to rewrite a story in a new form. <i>The class <b>adapted</b> the fairy tale into a short play.</i> Family: adaptation (n.), adaptable (adj.). The novel became a movie, so it was rewritten in a new form.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The state _____, a group of lawmakers elected by the people, voted to pass the new bicycle safety law.", "opts": ["legislation", "legislative", "legislature", "legislate"], "ci": 2, "exp": "The blank needs a noun for a group of people, so <i>legislature</i> fits. <i>legislation</i> (n.) laws; <i>legislate</i> (v.) to make laws; <i>legislative</i> (adj.) having to do with making laws. <i>The <b>legislature</b> meets in the capitol building.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Scientists _____ animals by putting them into groups, such as mammals, birds, and reptiles.", "opts": ["evacuate", "persist", "classify", "conceal"], "ci": 2, "exp": "<i>classify</i> (v.) to sort things into groups by type. <i>We <b>classified</b> the rocks by color and size.</i> Family: classification (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The school <b>administration</b> decided to add a second recess on Fridays. Which m var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
