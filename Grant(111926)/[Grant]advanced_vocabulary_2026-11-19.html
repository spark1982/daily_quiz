<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully \u2014 the words around the bold word are clues.";
var TODAY_STR = "20261119";
var RAW_QUESTIONS = [{"stem": "The map shows the <b>distribution</b> of cactus plants across the desert, with most of them growing near dry riverbeds.<br><br>Which meaning of <b>distribution</b> is used in this sentence?", "opts": ["a share of money paid to a company&rsquo;s owners", "the way something is spread out over an area", "the act of handing things out to people", "a company that delivers goods to stores"], "ci": 1, "exp": "<i>distribution</i> (n.) can mean handing things out, or the way something is spread over an area. The map shows <i>where</i> the cactus plants grow, so it is the second meaning. <i>The <b>distribution</b> of rain is uneven across the state.</i> Family: distribute (v.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Cutting down the forest caused serious <b>ecological</b> damage: birds lost their nests, and the stream filled with mud.<br><br>What does <b>ecological</b> mean in this sentence?", "opts": ["having to do with living things and the places where they live", "happening slowly over many years", "caused by stormy weather", "costing a very large amount of money"], "ci": 0, "exp": "<i>ecological</i> (adj.) having to do with how plants, animals, and their environment affect each other. <i>Planting native flowers has <b>ecological</b> benefits for bees.</i> Family: ecology (n.), ecologist (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The lawyer gave such a ______ argument that the jury agreed with her right away.<br><br>Which form of the word best completes the sentence?", "opts": ["convinces", "convinced", "convince", "convincing"], "ci": 3, "exp": "Before the noun <i>argument</i>, the sentence needs a describing word: <i>convincing</i> (adj.) able to make people believe something. <i>convince</i> (v.) to make someone believe. <i>She <b>convinced</b> me to join the team.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The principal must <b>authorize</b> every field trip before teachers can plan it.<br><br>Which word means the <b>OPPOSITE</b> of <b>authorize</b> as it is used in the sentence?", "opts": ["announce", "forbid", "approve", "schedule"], "ci": 1, "exp": "<i>authorize</i> (v.) to give official permission. The opposite is <i>forbid</i> (to say something is not allowed). <i>Approve</i> means almost the same as authorize, so it is not the opposite. Family: authority (n.), authorization (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The state passed new <b>legislation</b> that requires bike riders under sixteen to wear helmets.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>legislation</b> as it is used in the sentence?", "opts": ["elections", "laws", "taxes", "chaos"], "ci": 1, "exp": "<i>legislation</i> (n.) laws, or the making of laws, by a government. <i>Congress debated the new <b>legislation</b> for months.</i> Family: legislate (v.), legislature (n.). <i>Chaos</i> (no order at all) is closer to the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Finding fresh water is the <b>primary</b> need of every camper in the desert.<br><br>Which word means the <b>OPPOSITE</b> of <b>primary</b> as it is used in the sentence?", "opts": ["minor", "secret", "sudden", "main"], "ci": 0, "exp": "<i>primary</i> (adj.) main or most important. The opposite is <i>minor</i> (small, not very important). <i>Main</i> means the same as primary. Family: primarily (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The real diary of a young sailor was the <b>basis</b> for the author&rsquo;s adventure novel.<br><br>What does <b>basis</b> mean in this sentence?", "opts": ["a prize given for excellent work", "a review written by someone who read it", "the last chapter of a book", "the main facts or ideas that something is built on"], "ci": 3, "exp": "<i>basis</i> (n.) the facts or ideas that something starts from or is built on. <i>Your notes will be the <b>basis</b> for your report.</i> Family: base (n./v.), basic (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before the big science fair, every student had to pass a <b>preliminary</b> round in their own classroom.<br><br>What does <b>preliminary</b> mean in this sentence?", "opts": ["extremely difficult and tiring", "final and most important", "coming before the main event, to get ready for it", "optional and just for fun"], "ci": 2, "exp": "<i>preliminary</i> (adj.) coming first, before the main part, often to prepare for it. <i>The <b>preliminary</b> races decide who runs in the final.</i> Family: preliminaries (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Disliking someone before you even know them, just because of where they come from, is a kind of ______.<br><br>Which word best completes the sentence?", "opts": ["tolerance", "prejudice", "conflict", "compassion"], "ci": 1, "exp": "<i>prejudice</i> (n.) an unfair opinion about someone formed before knowing the facts about them. <i>The book shows how <b>prejudice</b> can hurt people.</i> Family: prejudiced (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "In 1776, the thirteen colonies ______ their independence from Great Britain.<br><br>Which form of the word best completes the sentence?", "opts": ["declaring", "declares", "declaration", "declared"], "ci": 3, "exp": "The sentence needs a past-tense verb (it happened in 1776): <i>declared</i>. <i>Declaration</i> (n.) is the thing that was written: <i>the <b>Declaration</b> of Independence</i>. <i>declare</i> (v.) to say something officially.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The library had a calm, friendly <b>atmosphere</b> that made everyone want to stay and read.<br><br>Which meaning of <b>atmosphere</b> is used in this sentence?", "opts": ["the layer of gases that surrounds a planet", "a unit used to measure air pressure", "the mood or feeling of a place", "the air inside a room, such as stuffy or smoky air"], "ci": 2, "exp": "<i>atmosphere</i> (n.) has several meanings. Here, <i>calm, friendly</i> describe a feeling, so it means the mood of a place. <i>The party had a cheerful <b>atmosphere</b>.</i> In science, the atmosphere is the layer of gases around Earth.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Through the crowd, I caught only a quick ______ of the parade float before it turned the corner.<br><br>Which word best completes the sentence?", "opts": ["priority", "glimpse", "boundary", "summit"], "ci": 1, "exp": "<i>glimpse</i> (n.) a quick look at something for only a moment. <i>We caught a <b>glimpse</b> of a deer before it ran into the trees.</i> Family: glimpse (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "To <b>minimize</b> the mess, Dad spread old newspaper over the whole table before we started painting.<br><br>What does <b>minimize</b> mean in this sentence?", "opts": ["to notice something quickly", "to clean something up completely afterward", "to make something as small as possible", "to hide something from other people"], "ci": 2, "exp": "<i>minimize</i> (v.) to make something as small or as little as possible. <i>Wearing a helmet can <b>minimize</b> injuries.</i> Family: minimum (n.), minimal (adj.); opposite: maximize", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Shorts and flip-flops are not <b>appropriate</b> for a hike up a snowy mountain, so Dad told us to pack warm boots.<br><br>What does <b>appropriate</b> mean in this sentence?", "opts": ["expensive and hard to find", "required by the rules of the park", "suitable or right for the situation", "comfortable to wear for a long time"], "ci": 2, "exp": "<i>appropriate</i> (adj.) suitable or right for a certain time, place, or situation. <i>A quiet voice is <b>appropriate</b> in the library.</i> Family: appropriately (adv.), inappropriate (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Before you share a surprising fact online, <b>verify</b> it by checking two websites you trust.<br><br>What does <b>verify</b> mean in this sentence?", "opts": ["to check or prove that something is true", "to argue against something", "to repeat something many times", "to explain something in your own words"], "ci": 0, "exp": "<i>verify</i> (v.) to check or prove that something is true or correct. <i>The teacher used a calculator to <b>verify</b> the answer.</i> Family: verification (n.), verified (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Thick fur is an <b>adaptation</b> that helps polar bears survive in the freezing Arctic.<br><br>What does <b>adaptation</b> mean in this sentence?", "opts": ["a body part or behavior that helps a living thing survive where it lives", "a sickness caused by very cold weather", "a habit that a young animal copies from its parents", "a supply of food that an animal stores for winter"], "ci": 0, "exp": "<i>adaptation</i> (n.) a feature or behavior that helps a living thing survive in its environment. <i>A cactus&rsquo;s thick, waxy skin is an <b>adaptation</b> for dry deserts.</i> Family: adapt (v.), adaptable (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After watching the ants for a whole week, Leo gained new ______ into how they share food with each other.<br><br>Which word best completes the sentence?", "opts": ["territory", "boundary", "insight", "summit"], "ci": 2, "exp": "<i>insight</i> (n.) a clear, deep understanding of something. <i>The scientist&rsquo;s talk gave us <b>insight</b> into how volcanoes form.</i> Family: insightful (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Maya felt <b>anxious</b> the night before her piano recital and kept checking that her music was still in her bag.<br><br>What does <b>anxious</b> mean in this sentence?", "opts": ["excited and cheerful", "proud and confident", "worried and nervous about something that might happen", "tired and sleepy"], "ci": 2, "exp": "<i>anxious</i> (adj.) worried or nervous, usually about something that is going to happen. <i>Max was <b>anxious</b> about his first day at a new school.</i> Family: anxiety (n.), anxiously (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The graduation ceremony will <b>commence</b> at noon, right after the band plays.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>commence</b> as it is used in the sentence?", "opts": ["continue", "begin", "end", "pause"], "ci": 1, "exp": "<i>commence</i> (v.) to begin or start. <i>The race will <b>commence</b> when the whistle blows.</i> Family: commencement (n.). <i>End</i> is the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "When the flu spread quickly to thousands of people across the state, health officials said the state was facing a flu ______.<br><br>Which word best completes the sentence?", "opts": ["territory", "colony", "priority", "epidemic"], "ci": 3, "exp": "<i>epidemic</i> (n.) a sickness that spreads quickly to many people in one area. <i>Doctors worked hard to stop the <b>epidemic</b>.</i> Family: epidemic (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
