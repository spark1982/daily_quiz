  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261010";
var RAW_QUESTIONS = [{"stem": "Harbor Logistics plans to fire a warehouse supervisor accused of stealing inventory. Before deciding, the company tells the supervisor the specific accusation, shows him the inventory records, and lets him explain his side at a meeting. This approach best reflects the principle of", "opts": ["caveat emptor, which places the risk of a purchase on the buyer", "eminent domain, which lets the government take private property for public use", "strict liability, which holds a party responsible regardless of fault", "due process, which requires fair procedures before someone is penalized"], "ci": 3, "exp": "Due process means a person is given notice of the accusation and a fair chance to respond before a decision is made. Harbor Logistics gave the supervisor the specific charge, the evidence, and a hearing."}, {"stem": "An office manager at Brightline Dental receives twelve tasks on Monday morning. She sorts them into four groups: urgent and important, important but not urgent, urgent but not important, and neither. Which method of organizing information is she using?", "opts": ["Organizing tasks alphabetically by client name", "Prioritizing tasks by urgency and importance", "Arranging tasks by the date each file was first created", "Grouping tasks by the color of the folder they arrived in"], "ci": 1, "exp": "Sorting tasks into urgent/important categories is a priority-based system (often called an urgency-importance matrix). It helps workers decide what to do first, unlike alphabetical or file-date systems."}, {"stem": "A small landscaping company sends invoices to 140 homeowners on the first day of every month. Which accounting software feature would save the bookkeeper the most time?", "opts": ["A bank reconciliation tool that matches deposits", "Batch invoicing, which creates and sends many invoices in one step", "A payroll tax calculator for employees", "A fixed-asset depreciation schedule"], "ci": 1, "exp": "Batch invoicing lets the bookkeeper generate a large group of invoices at once instead of creating 140 separately. The other features are useful but do not speed up monthly customer billing."}, {"stem": "Two companies sell similar products. Pine Ridge Foods is a family-owned business with five employees, while Summit Grocers is a publicly traded corporation with thousands of shareholders. Which factor most explains why Summit Grocers needs a more formal governance structure with an independent board of directors?", "opts": ["It sells food, which is never regulated by the government", "Its managers are all members of the same family", "Its ownership is spread among many shareholders who need their interests protected", "It has fewer employees than Pine Ridge Foods"], "ci": 2, "exp": "Ownership structure strongly shapes governance. When thousands of shareholders own a company, a formal board is needed to oversee managers on their behalf. A small family business can be governed more informally."}, {"stem": "During a sudden rush at Lakeside Caf&eacute;, shift lead Marcus calmly assigns each worker a clear role, jumps in to help at the register, and thanks the team after the rush ends. Which statement best describes what Marcus is showing?", "opts": ["Micromanagement: controlling every small detail of others&rsquo; work", "Leadership: guiding and motivating others toward a shared goal", "Conformity: following the group without taking any initiative", "Delegation without responsibility: avoiding work by giving it to others"], "ci": 1, "exp": "Leadership is the ability to influence and guide others toward a goal. Marcus organizes the team, models hard work, and recognizes effort, which are key leadership behaviors."}, {"stem": "A salesperson at Crestview Motors knows a customer cannot afford a car&rsquo;s extended warranty but could earn a large bonus by talking her into it. Which choice reflects ethical customer relationship management?", "opts": ["Tell the customer the warranty is required by law", "Explain the warranty honestly and respect the customer&rsquo;s decision not to buy it", "Add the warranty to the contract without mentioning it", "Pressure the customer until she agrees so the bonus is earned"], "ci": 1, "exp": "Ethical CRM builds long-term trust through honesty and respect for the customer&rsquo;s interests. Misleading or pressuring a customer may earn one sale but damages the relationship and the company&rsquo;s reputation."}, {"stem": "Jordan records every sale and expense for Riverbend Bikes and prepares its income statement. Priya uses those statements to decide whether the company should borrow money to open a second store. Which statement best describes their roles?", "opts": ["Jordan works in accounting, which records and reports past financial activity; Priya works in finance, which uses that information to plan and make decisions about money", "Both Jordan and Priya work in marketing", "Jordan works in finance and Priya works in accounting", "Accounting and finance are the same field, so their roles are identical"], "ci": 0, "exp": "Accounting focuses on recording, classifying, and reporting financial transactions. Finance uses accounting information to make forward-looking decisions such as raising money or investing."}, {"stem": "Copperleaf Furniture sets a target of $85 in materials and $40 in labor for each chair it builds. These planned amounts are an example of", "opts": ["a cash receipt journal that records money received", "a cost accounting budget that sets standard costs for production", "a sales forecast that predicts customer demand", "a balance sheet that lists assets and liabilities"], "ci": 1, "exp": "Cost accounting budgets set planned (standard) costs for producing goods, such as materials and labor per unit. Managers later compare actual costs with these standards."}, {"stem": "A customer calls Evergreen Insurance to file a claim, but the agent finds that her address and policy number in the system are three years out of date. What is the most likely result of these inaccurate records?", "opts": ["Lower costs because fewer records need to be stored", "Faster claim processing because the system has less data", "Delays and errors in serving the customer, which can hurt trust and satisfaction", "No effect, since customers never notice record errors"], "ci": 2, "exp": "Accurate, current customer records allow a business to serve customers quickly and correctly. Outdated information causes delays, mistakes, and frustration, and may even create legal problems."}, {"stem": "A sporting goods store compares its monthly sales data for the past three years and notices that sales of running shoes rise every March and April. How can the store best use this information?", "opts": ["Raise prices on all products every January", "Ignore the pattern, since past data cannot help with planning", "Stop selling running shoes because sales go up and down", "Stock more running shoes and plan promotions before spring each year"], "ci": 3, "exp": "Businesses analyze financial and sales data to spot trends, such as seasonal patterns. Recognizing a spring increase lets the store plan inventory and marketing ahead of time."}, {"stem": "Bluewater Marina installs security cameras and requires two employees to count the cash register each night. It also buys flood insurance and watches weather forecasts for storms. Which statement correctly classifies these risks?", "opts": ["Theft is an external risk, while flooding is an internal risk", "Theft by employees is an internal risk, while flooding from storms is an external risk", "Both theft and flooding are internal risks", "Both theft and flooding are external risks"], "ci": 1, "exp": "Internal risks come from inside the organization, such as employee errors or theft, and are controlled with procedures like dual cash counts. External risks, such as weather, come from outside and are managed with tools like insurance and monitoring."}, {"stem": "Which of the following is a routine security precaution an employee at a bank branch should follow every day?", "opts": ["Leave the back door propped open for deliveries all day", "Let visitors into staff-only areas if they say they know a manager", "Lock computer screens when stepping away and never share passwords", "Post the safe&rsquo;s combination near the safe so it is not forgotten"], "ci": 2, "exp": "Routine security precautions protect people, property, and information. Locking screens and protecting passwords prevent unauthorized access, while the other actions create security risks."}, {"stem": "At Northgate Manufacturing, any purchase over $50,000 must be approved by a committee rather than by one manager. How does this governance process most likely affect decision-making?", "opts": ["Decisions are made randomly without any review", "Employees no longer need to follow any company policies", "Managers can make large purchases instantly on their own", "Large decisions take longer but receive more review, which reduces costly mistakes"], "ci": 3, "exp": "Governance processes such as approval committees add checks and balances. They may slow decisions down, but they improve accountability and reduce the chance of poor or dishonest choices."}, {"stem": "After investors learned that the managers of Valor Tech had hidden large losses, the company&rsquo;s stock price fell sharply. Which statement best explains why strong corporate governance matters?", "opts": ["It guarantees that a company will always make a profit", "It removes the need for audits and financial reports", "It holds leaders accountable and promotes transparency, which builds investor trust", "It allows managers to keep financial results secret"], "ci": 2, "exp": "Corporate governance is the system of rules and oversight that directs a company. Strong governance makes leaders accountable and requires honest reporting, which protects shareholders and maintains trust."}, {"stem": "A hospital must send accurate patient billing data to a government agency each quarter. Which situation is the biggest challenge to maintaining data quality for this regulatory requirement?", "opts": ["The hospital stores its data on a secure server", "Different departments enter the same information in different formats, creating duplicates and errors", "The hospital checks its reports before sending them", "Employees receive training on data entry rules"], "ci": 1, "exp": "Inconsistent data entry across departments leads to duplicates, missing fields, and errors that can cause compliance violations. Secure storage, training, and review are solutions, not challenges."}, {"stem": "Instead of letting each department handle its own risks separately, the leaders of Granite Bank create one company-wide system to identify, rank, and respond to all major risks. This approach is called", "opts": ["self-insurance", "enterprise risk management (ERM)", "risk avoidance", "a single-department insurance policy"], "ci": 1, "exp": "Enterprise risk management looks at risks across the entire organization in a coordinated way, so leaders can see how risks connect and set priorities. It is broader than any single tool like insurance or avoidance."}, {"stem": "A new state law requires restaurants to list calorie counts on their menus starting next year. What is the best way for Maple Street Diner to help its employees adapt to this change?", "opts": ["Wait until an inspector issues a fine before telling employees", "Provide training that explains the new rule and how to answer customer questions about it", "Tell employees the law does not apply to small restaurants", "Replace all employees with new workers who already know the rule"], "ci": 1, "exp": "Businesses help employees adapt to regulatory change through clear communication and training. Preparing staff early avoids violations and helps them serve customers confidently."}, {"stem": "A clothing store&rsquo;s CRM system shows that a loyal customer buys hiking gear every fall and recently opened an email about rain jackets. How should the sales team best use this CRM information?", "opts": ["Send her a personalized offer on new rain jackets and fall hiking gear", "Send her the same generic flyer that everyone receives", "Delete her record because she already shops at the store", "Call her every day until she makes a purchase"], "ci": 0, "exp": "CRM technology stores customer history and preferences so a business can personalize its communication. A targeted offer based on her buying pattern is more useful to her and more likely to lead to a sale."}, {"stem": "Sunrise Bakery budgeted $2,000 for flour in May but actually spent $2,600. The manager investigates why the cost was $600 higher than planned. This process is called", "opts": ["depreciation", "break-even analysis", "bank reconciliation", "variance analysis"], "ci": 3, "exp": "Variance analysis compares budgeted (planned) amounts with actual results and investigates the differences. Here the unfavorable variance of $600 tells the manager to look into flour prices or waste."}, {"stem": "An analyst searches a customer database for every last name that begins with &ldquo;Mc,&rdquo; such as McCarthy and McDonald. Which search term uses a wildcard correctly to find all of them?", "opts": ["McCarthy", "Mc", "*Mc*Donald", "Mc*"], "ci": 3, "exp": "A wildcard symbol such as the asterisk (*) stands for any number of characters. Searching &ldquo;Mc*&rdquo; returns every name that starts with &ldquo;Mc,&rdquo; no matter what letters follow."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
