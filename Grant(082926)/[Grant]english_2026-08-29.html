<script>var TITLE = "[Grant] English";var QUIZ_KEY = "quiz_grantenglish_25_20260828_v1";var ATT_KEY = "quiz_grantenglish_25_att_20260828_v1";var RAW_QUESTIONS = [{"stem": "What is the main idea of the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1809, a boy named Louis Braille was born in a small French town where his father worked as a leatherworker, crafting saddles and harnesses for a living. At just three years old, Louis was playing in his father's workshop when he accidentally injured his eye with a sharp tool. The wound became infected, and the infection eventually spread to his other eye, leaving him completely blind by the age of five.<br><br>Despite his blindness, Louis was an unusually curious and determined child. His parents refused to let his condition limit him, and at age ten he earned a scholarship to attend the Royal Institute for Blind Youth in Paris, one of the first schools of its kind in the world.<br><br>At the school, students learned to read using a system of large, raised letters that mimicked ordinary printed text. However, this method was painfully slow, since each letter had to be traced by touch one at a time, and the heavy books needed to hold the bulky letters were far too expensive to produce in large numbers.<br><br>Everything changed when a former soldier named Charles Barbier visited the school. Barbier had invented a code called night writing, a system of raised dots that soldiers could read silently in the dark without lighting a lamp, which might reveal their position to the enemy. Although Barbier's military code was far too complicated for everyday reading, twelve-year-old Louis became fascinated by the underlying idea of representing language through touchable dots.<br><br>Louis spent years refining Barbier's design, eventually creating a system built from just six raised dots arranged in a small rectangle. By experimenting tirelessly, he discovered that different combinations of these six dots could represent every letter, number, and punctuation mark needed for reading.<br><br>By 1824, when Louis was only fifteen years old, his system was essentially complete. It would take decades for the method, eventually named Braille in his honor, to gain widespread acceptance among teachers who doubted a blind teenager's invention, but today it remains the primary reading system used by blind people around the world.", "opts": ["Louis Braille worked as a leatherworker alongside his father for most of his life.", "The passage mainly describes how soldiers communicated silently during nighttime battles.", "Charles Barbier invented the Braille reading system used by blind people today.", "A blind teenager named Louis Braille simplified a complicated military code into a simple system of raised dots that became the reading method used by blind people worldwide."], "ci": 3, "exp": "The passage traces how Louis simplified Barbier's military code into the six-dot system that became Braille, an idea every paragraph builds toward. Barbier invented night writing, not the Braille system itself, that credit belongs to Louis. Louis attended a school for the blind rather than working as a leatherworker himself. Nighttime battle communication is only background for Barbier's invention, not the passage's main idea."}, {"stem": "According to the passage, how did Louis Braille become blind?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1809, a boy named Louis Braille was born in a small French town where his father worked as a leatherworker, crafting saddles and harnesses for a living. At just three years old, Louis was playing in his father's workshop when he accidentally injured his eye with a sharp tool. The wound became infected, and the infection eventually spread to his other eye, leaving him completely blind by the age of five.<br><br>Despite his blindness, Louis was an unusually curious and determined child. His parents ref  essentially complete. It would take decades for the method, eventually named Braille in his honor, to gain widespread acceptance among teachers who doubted a blind teenager's invention, but today it remains the primary reading system used by blind people around the world.", "opts": ["The system required electricity that the school did not have access to.", "The raised letters could only be read by teachers, not by students.", "The school did not allow students to use the raised-letter books at all.", "Each letter had to be traced by touch one at a time, and the books needed to hold the large letters were too expensive to produce in large numbers."], "ci": 3, "exp": "The passage directly explains the method \"was painfully slow\" because each letter had to be traced individually, and the necessary books were too costly to produce widely. The passage shows students did use this system, just slowly. It never says only teachers could read the letters. It never mentions electricity as a factor at all."}, {"stem": "What effect did Charles Barbier's visit to the school have on Louis, according to the passage?", "passage": "<b>Read the passage, then answer the questions below.</b><br><br>In 1809, a boy named Louis Braille was born in a small French town where his father worked as a leatherworker, crafting saddles and harnesses for a living. At just three years old, Louis was playing in his father's workshop when he accidentally injured his eye with a sharp tool. The wound became infected, and the infection eventually spread to his other eye, leaving him completely blind by the age of five.<br><br>Despite his blindness, Louis was an unusually curious and determined child. His parents refused to let his condition limit him, and at age ten he earned a scholarship to attend the Royal Institute for Blind Youth in Paris, one of the first schools of its kind in the world.<br><br>At the school, students learned to read using a system of large, raised letters that mimicked ordinary function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
