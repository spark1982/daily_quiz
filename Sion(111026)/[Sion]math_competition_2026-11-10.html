<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Math Competition</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Sion] Math Competition</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>
    <div class="dots-panel" id="dots-panel" style="display:none;"></div>
  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>
    <button class="hint-btn" id="hint-btn" onclick="toggleHint()" style="display:none;">Show Hint</button>
    <div class="hint-box" id="hint-box"></div>
    <div class="exp-box" id="exp-box"></div>
    <div class="nav-btns">
      <button id="prev-btn" onclick="prevQ()">Prev</button>
      <button id="next-btn" onclick="goNext()">Next</button>
    </div>
  </div>

  <div class="results-card" id="results-card" style="display:none;">
    <h2>Results</h2>
    <div class="score-big" id="score-big"></div>
    <div id="score-detail" style="text-align:center;color:#555;font-size:0.9rem;"></div>
    <div class="action-row">
      <button class="btn-retry" onclick="startRetry()">Retry Wrong Ones</button>
      <button class="btn-fresh" onclick="openFreshModal()">Start Fresh</button>
    </div>
  </div>

  <button class="fresh-btn-bottom" onclick="openFreshModal()">Start Fresh</button>
</div>

<div class="modal-overlay" id="fresh-modal" style="display:none;">
  <div class="modal-box">
    <p>Reset all progress and start over?</p>
    <button class="modal-yes" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="modal-no" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261110";
var RAW_QUESTIONS = [{"stem": "There are 100 soldiers in a detachment, and every evening three of them are on duty. Can it happen that after a certain period of time each soldier has shared duty with every other soldier exactly once? (Russia)", "opts": ["yes", "no"], "ci": 1, "exp": "<b>What we need</b><br>We must decide whether the soldiers can be put on duty in groups of 3 so that every pair of soldiers is on duty together exactly once.<br><br><b>Step 1: Look at one soldier.</b> Pick any soldier, say Soldier A. There are 99 other soldiers, and A must share duty with each of them exactly once. So A needs exactly 99 &ldquo;partners.&rdquo;<br><br><b>Step 2: Count partners per night.</b> On a night when A is on duty, the other two people on duty are both new partners for A. So every night A works gives A exactly 2 partners, and no partner can repeat.<br><br><b>Step 3: Compare.</b> If A works on <i>d</i> nights, A gets 2<i>d</i> partners. We would need 2<i>d</i> = 99, so <i>d</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>99</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 49.5. A number of nights cannot be 49.5, so this is impossible. (The same is true for every soldier.)<br><br><b>Answer check</b><br>Notice that the overall count does <i>not</i> rule it out: there are <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>100 &times; 99</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 4950 pairs, and each night covers 3 pairs, giving 4950 &divide; 3 = 1650 nights, a whole number. That is why we needed the one-soldier argument, where 99 is odd.<br><br><b>Trap</b><br>Checking only the total (4950 is divisible by 3) makes it look possible and leads to the wrong answer &ldquo;yes.&rdquo;<br><br><b>Answer:</b> no", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "In a mathematics contest, 100 students had to solve four problems. No student solved all four problems. The first problem was solved by 90 students, the second problem was solved by 80 students, the third problem was solved by 70 students, and the fourth problem was solved by 60 students. How many students solved both the third and fourth problems? (PMWC)", "opts": ["35 students", "25 students", "30 students", "20 students"], "ci": 2, "exp": "<b>What we need</b><br>Find how many of the 100 students solved both problem 3 and problem 4.<br><br><b>Step 1: Count all the solutions.</b> Add the number of students who solved each problem: 90 + 80 + 70 + 60 = 300 solved problems in total.<br><br><b>Step 2: Use &ldquo;no one solved all four.&rdquo;</b> Each student solved at most 3 problems, so the 100 students solved at most 3 &times; 100 = 300 problems. The total is exactly 300, so every student must have solved <i>exactly</i> 3 problems. That means each student missed exactly one problem.<br><br><b>Step 3: Count who missed each problem.</b> Problem 1 was missed by 100 &minus; 90 = 10 students, problem 2 by 100 &minus; 80 = 20, problem 3 by 100 &minus; 70 = 30, and problem 4 by 100 &minus; 60 = 40. Check: 10 + 20 + 30 + 40 = 100, so every student is counted once.<br><br><b>Step 4: Who solved both 3 and 4?</b> A student solved both problem 3 and problem 4 exactly when the one problem they missed was problem 1 or problem 2. That is 10 + 20 = 30 students.<br><br><b>Answer check</b><br>Problem 3 was solved by 70 students. Of these, the ones who missed problem 4 (40 students, all of whom solved problem 3) do not count: 70 &minus; 40 = 30. Same answer.<br><br><b>Trap</b><br>Using only &ldquo;70 + 60 &minus; 100 = 30&rdquo; gives the right number here, but only as a minimum; the key fact that makes it exact is that every student solved exactly three problems.<br><br><b>Answer:</b> 30 students", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Let <i>p</i>(<i>x</i>) be a polynomial with degree <i>n</i> and<br><br><i>p</i>(<i>k</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i></span><span style=\"border-top:1.4px solid #111;\"><i>k</i>+1</span></span>,&nbsp;&nbsp;&nbsp;<i>k</i> = 0, 1, &hellip;, <i>n</i>.<br><br>What is <i>p</i>(<i>n</i> + 1)? (USAMO)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i>+2</span><span style=\"border-top:1.4px solid #111;\"><i>n</i></span></span> if <i>n</i> is even, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i>+2</span></span> if <i>n</i> is odd", "1 if <i>n</i> is odd, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i>+2</span></span> if <i>n</i> is even", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i>+2</span></span> for every <i>n</i>", "1 for every <i>n</i>"], "ci": 1, "exp": "<b>What we need</b><br>A polynomial <i>p</i>(<i>x</i>) of degree <i>n</i> matches <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i></span><span style=\"border-top:1.4px solid #111;\"><i>k</i> + 1</span></span> at <i>k</i> = 0, 1, &hellip;, <i>n</i>. We want <i>p</i>(<i>n</i> + 1).<br><br><b>Step 1: Clear the fraction.</b> The condition <i>p</i>(<i>k</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i></span><span style=\"border-top:1.4px solid #111;\"><i>k</i> + 1</span></span> means (<i>k</i> + 1)<i>p</i>(<i>k</i>) = <i>k</i>, or (<i>k</i> + 1)<i>p</i>(<i>k</i>) &minus; <i>k</i> = 0. So define a new polynomial<br><i>q</i>(<i>x</i>) = (<i>x</i> + 1)<i>p</i>(<i>x</i>) &minus; <i>x</i>.<br>Its degree is <i>n</i> + 1, and <i>q</i>(<i>k</i>) = 0 for <i>k</i> = 0, 1, &hellip;, <i>n</i>.<br><br><b>Step 2: Write <i>q</i> using its roots.</b> A polynomial of degree <i>n</i> + 1 with the <i>n</i> + 1 roots 0, 1, &hellip;, <i>n</i> must be<br><i>q</i>(<i>x</i>) = <i>C</i> &middot; <i>x</i>(<i>x</i> &minus; 1)(<i>x</i> &minus; 2)&hellip;(<i>x</i> &minus; <i>n</i>)<br>for some constant <i>C</i>.<br><br><b>Step 3: Find <i>C</i> using <i>x</i> = &minus;1.</b> From the definition, <i>q</i>(&minus;1) = 0 &middot; <i>p</i>(&minus;1) &minus; (&minus;1) = 1. From Step 2, <i>q</i>(&minus;1) = <i>C</i> &middot; (&minus;1)(&minus;2)&hellip;(&minus;<i>n</i> &minus; 1). That product has <i>n</i> + 1 negative factors, so it equals (&minus;1)<sup><i>n</i>+1</sup>(<i>n</i> + 1)!. Therefore <i>C</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(&minus;1)<sup><i>n</i>+1</sup></span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> + 1)!</span></span>.<br><br><b>Step 4: Plug in <i>x</i> = <i>n</i> + 1.</b> Then <i>x</i>(<i>x</i> &minus; 1)&hellip;(<i>x</i> &minus; <i>n</i>) = (<i>n</i> + 1)<i>n</i>&hellip;1 = (<i>n</i> + 1)!, so <i>q</i>(<i>n</i> + 1) = <i>C</i> &middot; (<i>n</i> + 1)! = (&minus;1)<sup><i>n</i>+1</sup>.<br>Also, by the definition, <i>q</i>(<i>n</i> + 1) = (<i>n</i> + 2)<i>p</i>(<i>n</i> + 1) &minus; (<i>n</i> + 1). Setting these equal:<br>(<i>n</i> + 2)<i>p</i>(<i>n</i> + 1) = <i>n</i> + 1 + (&minus;1)<sup><i>n</i>+1</sup>.<br><br><b>Step 5: Split into cases.</b> If <i>n</i> is odd, <i>n</i> + 1 is even, so (&minus;1)<sup><i>n</i>+1</sup> = 1 and <i>p</i>(<i>n</i> + 1) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i> + 2</span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span> = 1. If <i>n</i> is even, (&minus;1)<sup><i>n</i>+1</sup> = &minus;1 and <i>p</i>(<i>n</i> + 1) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span>.<br><br><b>Answer check</b><br><i>n</i> = 1: the line through (0, 0) and (1, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>) is <i>p</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\">2</span></span>, so <i>p</i>(2) = 1 (odd case). <i>n</i> = 2: the parabola through (0, 0), (1, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>), (2, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>) gives <i>p</i>(3) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">4</span></span> (even case, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span>). A computer check of <i>n</i> = 1 to 7 agrees.<br><br><b>Trap</b><br>Guessing the pattern continues, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i> + 1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span>, or ignoring the sign (&minus;1)<sup><i>n</i>+1</sup> leads to an answer that is the same for every <i>n</i>; the sign is what makes odd and even different.<br><br><b>Answer:</b> 1 if <i>n</i> is odd, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i></span><span style=\"border-top:1.4px solid #111;\"><i>n</i> + 2</span></span> if <i>n</i> is even", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "You have 8 cubes of size 1 through 8. A tower is to be built using all 8 cubes according to the following rules: <i>a</i>) Any cube may be the bottom cube in the tower. <i>b</i>) The cube immediately on top of a cube with size <i>k</i> must have size at most <i>k</i> + 2. How many different towers can be constructed?", "opts": ["1440", "1512", "1458", "972"], "ci": 2, "exp": "<b>What we need:</b> the number of orders (bottom to top) of cubes 1, 2, …, 8 in which the cube directly on top of cube <i>k</i> always has size at most <i>k</i> + 2.<br><br><b>Step 1 — Build the tower by adding the largest cube last.</b> Let <i>T</i>(<i>n</i>) be the number of good towers that use cubes 1 through <i>n</i>. Take any good tower of cubes 1 through <i>n</i> and lift out cube <i>n</i> (the biggest). The cube that was above it drops onto the cube that was below it. The cube above was smaller than <i>n</i>, and the cube below was at least <i>n</i> &minus; 2. So the new jump is at most (<i>n</i> &minus; 1) &minus; (<i>n</i> &minus; 2) = 1, which is allowed. That means every good tower of 1…<i>n</i> comes from a good tower of 1…(<i>n</i> &minus; 1) by inserting cube <i>n</i>.<br><br><b>Step 2 — Where can cube <i>n</i> be inserted?</b> Cube <i>n</i> may sit directly on top of a cube of size at least <i>n</i> &minus; 2, so only on cube <i>n</i> &minus; 1 or cube <i>n</i> &minus; 2. It may also be the bottom cube (rule a). Anything placed on top of cube <i>n</i> is smaller, so that is always fine. So for <i>n</i> ≥ 3 there are exactly <b>3</b> places, and each gives a different tower: <i>T</i>(<i>n</i>) = 3 · <i>T</i>(<i>n</i> &minus; 1).<br><br><b>Step 3 — Starting values.</b> <i>T</i>(1) = 1. With cubes 1 and 2, both orders work, so <i>T</i>(2) = 2.<br><br><b>Step 4 — Multiply.</b> <i>T</i>(3) = 6, <i>T</i>(4) = 18, <i>T</i>(5) = 54, <i>T</i>(6) = 162, <i>T</i>(7) = 486, <i>T</i>(8) = 1458. In one line: 2 × 3<sup>6</sup> = 2 × 729 = 1458.<br><br><b>Answer check:</b> a computer check of all 8! = 40320 orders finds exactly 1458 good towers. Also <i>T</i>(3) = 6 = 3! makes sense: with cubes 1, 2, 3 no jump is bigger than 2, so every order works.<br><br><b>Trap:</b> 972 = 4 × 3<sup>5</sup> comes from starting the chain with the wrong value (4 towers for three cubes). Remember that being the bottom cube is always allowed.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Positive integers <i>x</i> and <i>y</i> satisfy <i>x</i> < y and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span>. What is the sum of all possible <i>x</i> values?", "opts": ["7", "6", "9", "8"], "ci": 0, "exp": "<b>What we need</b><br>Find every pair of positive integers with <i>x</i> &lt; <i>y</i> and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span>, then add the possible values of <i>x</i>.<br><br><b>Step 1: Trap <i>x</i> between two numbers.</b> Because <i>x</i> &lt; <i>y</i>, the fraction <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> is the bigger of the two, so it is more than half of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span>: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> &gt; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">24</span></span>, which gives <i>x</i> &lt; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>24</span><span style=\"border-top:1.4px solid #111;\">5</span></span> = 4.8. Also <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> must be less than the whole sum: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span> &lt; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span>, which gives <i>x</i> &gt; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\">5</span></span> = 2.4. So <i>x</i> = 3 or <i>x</i> = 4.<br><br><b>Step 2: Test <i>x</i> = 3.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">12</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">12</span></span>, so <i>y</i> = 12. This works, and 3 &lt; 12.<br><br><b>Step 3: Test <i>x</i> = 4.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">12</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">12</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">12</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span>, so <i>y</i> = 6. This works, and 4 &lt; 6.<br><br><b>Step 4: Add.</b> The possible values of <i>x</i> are 3 and 4, so the sum is 3 + 4 = 7.<br><br><b>Answer check</b><br>Another way: multiply both sides by 12<i>x</i><i>y</i> to get 12<i>y</i> + 12<i>x</i> = 5<i>x</i><i>y</i>. Multiply by 5 and add 144 to both sides to factor: (5<i>x</i> &minus; 12)(5<i>y</i> &minus; 12) = 144. For (3, 12): 3 &times; 48 = 144. For (4, 6): 8 &times; 18 = 144. Both check.<br><br><b>Trap</b><br>Forgetting the condition <i>x</i> &lt; <i>y</i> lets you also count <i>x</i> = 6 and <i>x</i> = 12, giving the wrong sum 25; adding the <i>y</i> values instead gives 18.<br><br><b>Answer:</b> 7", "tag": "Chapter 2", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
