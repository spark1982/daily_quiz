var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261019";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["went", "has went", "NO CHANGE", "have gone"], "ci": 0, "exp": "&ldquo;Last week&rdquo; names a finished time, so use the simple past, not <i>have</i>: <i>Last week we <b>went</b> to the mountains.</i> (<i>Have went</i> is never correct, and <i>have gone</i> does not go with &ldquo;last week.&rdquo;)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Letter to Mrs. Patel</strong><br><b>(1)</b> My family moved to Denver in August, and I really miss your class at Lincoln Elementary. <b>(2)</b> Last week we <u>have went</u> to the mountains for the first time. <b>(3)</b> By the time we got home, we <u>had finished</u> three whole bags of trail mix! <b>(4)</b> <u>My sister and me</u> are also learning to ski this winter. <b>(5)</b> My new school is big. <b>(6)</b> It has a climbing wall in the gym. <b>(7)</b> Please say hello to the class for me."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["had finish", "have finished", "NO CHANGE", "had finishing"], "ci": 2, "exp": "This is already correct. <i>Had</i> + the past participle <i>finished</i> shows the trail mix was gone before they got home: <i>By the time we got home, we <b>had finished</b> three bags.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Letter to Mrs. Patel</strong><br><b>(1)</b> My family moved to Denver in August, and I really miss your class at Lincoln Elementary. <b>(2)</b> Last week we <u>have went</u> to the mountains for the first time. <b>(3)</b> By the time we got home, we <u>had finished</u> three whole bags of trail mix! <b>(4)</b> <u>My sister and me</u> are also learning to ski this winter. <b>(5)</b> My new school is big. <b>(6)</b> It has a climbing wall in the gym. <b>(7)</b> Please say hello to the class for me."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["Me and my sister", "My sister and I", "NO CHANGE", "My sister and myself"], "ci": 1, "exp": "Use <i>I</i> for the subject of a sentence. Test it by taking out &ldquo;my sister&rdquo;: <i>I am learning</i>, not <i>me am learning</i>. <i><b>My sister and I</b> are learning to ski.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Letter to Mrs. Patel</strong><br><b>(1)</b> My family moved to Denver in August, and I really miss your class at Lincoln Elementary. <b>(2)</b> Last week we <u>have went</u> to the mountains for the first time. <b>(3)</b> By the time we got home, we <u>had finished</u> three whole bags of trail mix! <b>(4)</b> <u>My sister and me</u> are also learning to ski this winter. <b>(5)</b> My new school is big. <b>(6)</b> It has a climbing wall in the gym. <b>(7)</b> Please say hello to the class for me."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["My new school is big, it has a climbing wall in the gym.", "My new school is big, but it has a climbing wall in the gym.", "My new school is big and, it has a climbing wall in the gym.", "My new school is big, and it has a climbing wall in the gym."], "ci": 3, "exp": "Join two complete sentences with a comma <i>before</i> a joining word. <i>And</i> adds information; <i>but</i> would wrongly show a contrast: <i>My new school is big<b>, and</b> it has a climbing wall.</i>", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Letter to Mrs. Patel</strong><br><b>(1)</b> My family moved to Denver in August, and I really miss your class at Lincoln Elementary. <b>(2)</b> Last week we <u>have went</u> to the mountains for the first time. <b>(3)</b> By the time we got home, we <u>had finished</u> three whole bags of trail mix! <b>(4)</b> <u>My sister and me</u> are also learning to ski this winter. <b>(5)</b> My new school is big. <b>(6)</b> It has a climbing wall in the gym. <b>(7)</b> Please say hello to the class for me."}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["NO CHANGE", "were working", "are working", "works"], "ci": 3, "exp": "The subject is <i>family</i> (one family), not <i>beavers</i>. A singular subject needs a singular verb: <i>A family of beavers <b>works</b> together.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Beavers Build Dams</strong><br><b>(1)</b> A family of beavers <u>work</u> together to build a dam across a stream. <b>(2)</b> They gather sticks mud and stones from the riverbank. <b>(3)</b> Beavers have sharp front teeth. <b>(4)</b> The teeth never stop growing. <b>(5)</b> The finished dam slows the moving water and creates a deep pond. <b>(6)</b> The pond is a safe place <u>where</u> beavers can hide from wolves and bears. <b>(7)</b> Their lodge has an underwater door, so predators cannot get inside easily."}, {"stem": "Where should a comma be added in sentence 2?", "opts": ["They gather, sticks mud and stones from the riverbank.", "They gather sticks, mud and, stones from the riverbank.", "They gather sticks mud, and stones, from the riverbank.", "They gather sticks, mud, and stones from the riverbank."], "ci": 3, "exp": "Use commas to separate three or more things in a list: <i>sticks<b>,</b> mud<b>,</b> and stones</i>.", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Report: How Beavers Build Dams</strong><br><b>(1)</b> A family of beavers <u>work</u> together to build a dam across a stream. <b>(2)</b> They gather sticks mud and stones from the riverbank. <b>(3)</b> Beavers have sharp front teeth. <b>(4)</b> The teeth never stop growing. <b>(5)</b> The finished dam slows the moving water and creates a deep pond. <b>(6)</b> The pond is a safe place <u>where</u> beavers can hide from wolves and bears. <b>(7)</b> Their lodge has an underwater door, so predators cannot get inside easily."}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["Beavers have sharp front teeth, the teeth never stop growing.", "Beavers have sharp front teeth, which they never stop growing.", "Beavers have sharp front teeth that never stop growing.", "Beavers have sharp front teeth who never stop growing."], "ci": 2, "exp": "Use <i>that</i> (or <i>which</i>) for things and <i>who</i> for people: <i>sharp front teeth <b>that</b> never stop growing.</i> Two sentences joined with only a comma make a run-on.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Beavers Build Dams</strong><br><b>(1)</b> A family of beavers <u>work</u> together to build a dam across a stream. <b>(2)</b> They gather sticks mud and stones from the riverbank. <b>(3)</b> Beavers have sharp front teeth. <b>(4)</b> The teeth never stop growing. <b>(5)</b> The finished dam slows the moving water and creates a deep pond. <b>(6)</b> The pond is a safe place <u>where</u> beavers can hide from wolves and bears. <b>(7)</b> Their lodge has an underwater door, so predators cannot get inside easily."}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["who", "which", "when", "NO CHANGE"], "ci": 3, "exp": "This is already correct. Use <i>where</i> to talk about a place: <i>a safe place <b>where</b> beavers can hide.</i> (<i>When</i> is for times, <i>who</i> is for people.)", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Beavers Build Dams</strong><br><b>(1)</b> A family of beavers <u>work</u> together to build a dam across a stream. <b>(2)</b> They gather sticks mud and stones from the riverbank. <b>(3)</b> Beavers have sharp front teeth. <b>(4)</b> The teeth never stop growing. <b>(5)</b> The finished dam slows the moving water and creates a deep pond. <b>(6)</b> The pond is a safe place <u>where</u> beavers can hide from wolves and bears. <b>(7)</b> Their lodge has an underwater door, so predators cannot get inside easily."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["dragged", "will drag", "NO CHANGE", "are dragging"], "ci": 0, "exp": "The diary tells about this morning in the past (<i>rained</i>, <i>pushed</i>), so keep the past tense: <i>Then we <b>dragged</b> the cushions over.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>My Diary: A Rainy Saturday</strong><br><b>(1)</b> It rained all morning, so my brother Max and I built a blanket fort in the living room. <b>(2)</b> First, we pushed two chairs together. <b>(3)</b> Then we <u>drag</u> the couch cushions over to make walls. <b>(4)</b> By lunchtime, we had already <u>took</u> every pillow in the house. <b>(5)</b> <u>Reading comics with our flashlights.</u> <b>(6)</b> When Mom brought us a bowl of popcorn, Max and I ate them in five minutes. <b>(7)</b> It was the best rainy day ever."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["tooken", "NO CHANGE", "taking", "taken"], "ci": 3, "exp": "After <i>had</i>, use the past participle. For <i>take</i> it is <i>taken</i>: <i>we had already <b>taken</b> every pillow.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>My Diary: A Rainy Saturday</strong><br><b>(1)</b> It rained all morning, so my brother Max and I built a blanket fort in the living room. <b>(2)</b> First, we pushed two chairs together. <b>(3)</b> Then we <u>drag</u> the couch cushions over to make walls. <b>(4)</b> By lunchtime, we had already <u>took</u> every pillow in the house. <b>(5)</b> <u>Reading comics with our flashlights.</u> <b>(6)</b> When Mom brought us a bowl of popcorn, Max and I ate them in five minutes. <b>(7)</b> It was the best rainy day ever."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["And reading comics with our flashlights.", "We read comics with our flashlights.", "Reading comics, with our flashlights.", "NO CHANGE"], "ci": 1, "exp": "A sentence needs a subject and a verb. &ldquo;Reading comics with our flashlights&rdquo; has no subject, so it is a fragment: <i><b>We read</b> comics with our flashlights.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>My Diary: A Rainy Saturday</strong><br><b>(1)</b> It rained all morning, so my brother Max and I built a blanket fort in the living room. <b>(2)</b> First, we pushed two chairs together. <b>(3)</b> Then we <u>drag</u> the couch cushions over to make walls. <b>(4)</b> By lunchtime, we had already <u>took</u> every pillow in the house. <b>(5)</b> <u>Reading comics with our flashlights.</u> <b>(6)</b> When Mom brought us a bowl of popcorn, Max and I ate them in five minutes. <b>(7)</b> It was the best rainy day ever."}, {"stem": "Which sentence has an error?", "opts": ["When Mom brought us a bowl of popcorn, Max and I ate them in five minutes.", "First, we pushed two chairs together.", "It was the best rainy day ever.", "It rained all morning, so my brother Max and I built a blanket fort in the living room."], "ci": 0, "exp": "<i>Popcorn</i> is one thing (a bowl of it), so the pronoun should be <i>it</i>, not <i>them</i>: <i>Max and I ate <b>it</b> in five minutes.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>My Diary: A Rainy Saturday</strong><br><b>(1)</b> It rained all morning, so my brother Max and I built a blanket fort in the living room. <b>(2)</b> First, we pushed two chairs together. <b>(3)</b> Then we <u>drag</u> the couch cushions over to make walls. <b>(4)</b> By lunchtime, we had already <u>took</u> every pillow in the house. <b>(5)</b> <u>Reading comics with our flashlights.</u> <b>(6)</b> When Mom brought us a bowl of popcorn, Max and I ate them in five minutes. <b>(7)</b> It was the best rainy day ever."}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["NO CHANGE", "really hardly", "real hard", "more harder"], "ci": 0, "exp": "This is already correct. <i>Really</i> (an adverb) tells how hard he kicked. <i>Real hard</i> uses an adjective by mistake, and <i>more harder</i> is a double comparison.", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Story: Over the Fence</strong><br><b>(1)</b> Leo kicked the soccer ball <u>really hard</u>, and it sailed over the fence into Mr. Ruiz&rsquo;s yard. <b>(2)</b> &ldquo;I <u>should of</u> kicked it more gently,&rdquo; Leo groaned. <b>(3)</b> Leo knocked on the gate, and Mr. Ruiz opened it with the ball in his hand. <b>(4)</b> Mr. Ruiz smiled and said &ldquo;I used to play goalie when I was your age.&rdquo; <b>(5)</b> Then he showed Leo how to aim, they practiced until dinner. <b>(6)</b> Leo walked home with a big grin. <b>(7)</b> He couldn&rsquo;t wait to try the new trick at practice."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["should had", "should have", "NO CHANGE", "should has"], "ci": 1, "exp": "&ldquo;Should of&rdquo; is a common mistake because &ldquo;should&rsquo;ve&rdquo; sounds like it. The correct form is <i>should <b>have</b></i> + past participle: <i>I <b>should have</b> kicked it more gently.</i>", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Story: Over the Fence</strong><br><b>(1)</b> Leo kicked the soccer ball <u>really hard</u>, and it sailed over the fence into Mr. Ruiz&rsquo;s yard. <b>(2)</b> &ldquo;I <u>should of</u> kicked it more gently,&rdquo; Leo groaned. <b>(3)</b> Leo knocked on the gate, and Mr. Ruiz opened it with the ball in his hand. <b>(4)</b> Mr. Ruiz smiled and said &ldquo;I used to play goalie when I was your age.&rdquo; <b>(5)</b> Then he showed Leo how to aim, they practiced until dinner. <b>(6)</b> Leo walked home with a big grin. <b>(7)</b> He couldn&rsquo;t wait to try the new trick at practice."}, {"stem": "Where should a comma be added in sentence 4?", "opts": ["Mr. Ruiz smiled and said, &ldquo;I used to play goa thon from October 20 to November 14. <b>(2)</b> Students who <u>have chose</u> a reading goal can pick up a reading log at the front desk. <b>(3)</b> Each of the classes have a poster to track its reading minutes. <b>(4)</b> The library will give a prize to every class that meets <u>its</u> goal. <b>(5)</b> You can read at home. <b>(6)</b> You can read in the library during lunch. <b>(7)</b> Every minute you read helps your class win."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
