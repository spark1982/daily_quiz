<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261014";
var RAW_QUESTIONS = [{"stem": "A regional bank sets the goal &ldquo;Increase mobile-app users by 20% by the end of next year.&rdquo; Why is this a well-written business goal?", "opts": ["It focuses only on the bank&rsquo;s values", "It is specific, measurable, and has a deadline", "It avoids using numbers that could be missed", "It applies to every department equally"], "ci": 1, "exp": "Good goals are <b>SMART</b>: specific, measurable, achievable, relevant, and time-bound. &ldquo;20%&rdquo; is measurable and &ldquo;by the end of next year&rdquo; is the deadline."}, {"stem": "A tax-preparation office keeps running out of printer paper during its busiest weeks in March and April. Which action would best fix this operations problem?", "opts": ["Ask employees to bring paper from home when it runs out", "Order a full year of paper every January no matter the cost", "Stop printing documents for customers", "Track how much paper is used each week and reorder when supplies reach a set level"], "ci": 3, "exp": "Setting a <b>reorder point</b> based on usage keeps inventory available without overstocking. Ordering a year&rsquo;s supply ties up money and space; the other options hurt service."}, {"stem": "When the Federal Reserve raises interest rates, which result is most likely for a family thinking about buying a home with a mortgage?", "opts": ["Home prices immediately double in value", "Monthly loan payments become more expensive, so the family may delay buying", "Banks stop offering mortgages altogether", "The family&rsquo;s savings account pays less interest"], "ci": 1, "exp": "Higher interest rates make <b>borrowing more expensive</b>, which tends to reduce demand for loans such as mortgages. Savings accounts usually pay <i>more</i> interest when rates rise."}, {"stem": "An investment firm wants to fill a financial-analyst position. Which document lists the duties, skills, and qualifications needed for that job?", "opts": ["employee handbook", "performance appraisal", "job description", "pay stub"], "ci": 2, "exp": "A <b>job description</b> outlines a position&rsquo;s duties and required qualifications and is used for recruiting. A performance appraisal evaluates a current employee."}, {"stem": "A small bakery owner wants to be sure that, if the business is sued, her personal home and savings cannot be taken to pay business debts. Which form of ownership best protects her personal assets?", "opts": ["sole proprietorship", "general partnership", "franchise agreement", "limited liability company (LLC)"], "ci": 3, "exp": "An <b>LLC</b> separates the owner&rsquo;s personal assets from business debts (limited liability). Sole proprietors and general partners have unlimited personal liability."}, {"stem": "A company&rsquo;s balance sheet shows assets of $250,000 and liabilities of $90,000. What is the owner&rsquo;s equity?", "opts": ["$340,000", "$90,000", "$160,000", "$250,000"], "ci": 2, "exp": "The accounting equation is <b>Assets = Liabilities + Owner&rsquo;s Equity</b>, so equity = $250,000 &minus; $90,000 = $160,000."}, {"stem": "A city has only one company that provides cable internet, and no other company is allowed to compete. This market structure is called a", "opts": ["oligopoly", "perfect competition", "monopoly", "monopolistic competition"], "ci": 2, "exp": "A <b>monopoly</b> has a single seller with no close competitors. An oligopoly has a few large sellers."}, {"stem": "Maya, a team leader at a bank, notices she becomes short-tempered with coworkers every time a deadline approaches. Which action best shows self-management?", "opts": ["Avoiding her coworkers until the deadline passes", "Telling coworkers that deadlines make everyone grumpy", "Asking her manager to remove all deadlines from her job", "Planning work earlier and pausing to calm down before responding when she feels stressed"], "ci": 3, "exp": "<b>Self-management</b> is controlling your own emotions and behavior. Planning ahead and pausing before responding manage the stress; avoiding people or blaming the deadline does not."}, {"stem": "<i>Role-play skill &mdash; the judge&rsquo;s follow-up question.</i> In a role-play, the judge plays a frustrated branch manager who says sharply, &ldquo;I&rsquo;ve heard plans like yours before, and they never work. Why should I believe you?&rdquo; Which response shows the best emotional intelligence?", "opts": ["&ldquo;With respect, my plan is different from those, and I&rsquo;m confident it will work if you just give it a chance.&rdquo;", "&ldquo;I&rsquo;m sorry you feel that way. Maybe I should come back when you are in a better mood.&rdquo;", "&ldquo;Other managers have liked my ideas, so I think you will change your mind once you see the results.&rdquo;", "&ldquo;I understand. It&rsquo;s frustrating to try ideas that don&rsquo;t pay off. What&rsquo;s different here is that we&rsquo;ll test it at one branch for 30 days and only expand if sign-ups rise 15%.&rdquo;"], "ci": 3, "exp": "Emotional intelligence means <b>recognizing the other person&rsquo;s feelings and responding calmly with substance</b>. Acknowledging the frustration and then offering a low-risk, measurable test addresses the concern; the others are defensive or avoid the issue."}, {"stem": "<i>Role-play skill &mdash; addressing a performance indicator.</i> A judge&rsquo;s performance indicator is &ldquo;Explain the nature of positive customer relations.&rdquo; You are a teller at a credit union in the role-play. Which statement would best address this indicator?", "opts": ["&ldquo;Customer relations is the relationship between a business and its customers.&rdquo;", "&ldquo;Positive customer relations means building trust so members keep coming back. For example, if I remember that you&rsquo;re saving for a car and suggest our auto-loan rates, you feel valued and are more likely to stay with us.&rdquo;", "&ldquo;Our credit union has the lowest fees in town, so customers don&rsquo;t really need extra attention.&rdquo;", "&ldquo;Positive customer relations means always agreeing with customers, even when they ask for things we cannot offer.&rdquo;"], "ci": 1, "exp": "Judges reward explaining the concept <b>and applying it to the situation</b>. A bare definition earns little credit, and always agreeing with customers is not what positive customer relations means."}, {"stem": "Which statement best describes the risk an entrepreneur takes on when starting a business?", "opts": ["She is guaranteed a steady salary from the start", "She may lose the money and time she invested if the business fails", "She is protected by the government from any losses", "She shares no responsibility for the business&rsquo;s debts"], "ci": 1, "exp": "Entrepreneurs accept <b>risk</b>: they invest their own resources with no guarantee of profit. There is no guaranteed salary or government protection from losses."}, {"stem": "Harbor Point Credit Union hires a local print shop to make 5,000 brochures for $1,200, and both sides sign an agreement. The print shop delivers only 3,000 brochures. In legal terms, the print shop has most likely committed a", "opts": ["tort of negligence", "breach of contract", "violation of antitrust law", "case of copyright infringement"], "ci": 1, "exp": "A <b>breach of contract</b> happens when one party fails to do what a valid agreement requires. Negligence is a tort (a careless act that injures someone), not a failure to fulfill an agreement."}, {"stem": "An entry-level bank teller wants to become a loan officer in three years. Which step is the best example of setting a career goal and planning for it?", "opts": ["Waiting for a manager to suggest a promotion", "Taking a finance course and asking a loan officer to be a mentor", "Applying for every open job at other companies", "Working extra hours without discussing goals"], "ci": 1, "exp": "Career planning means taking <b>specific actions</b> (education, mentorship) toward a goal. Waiting passively or working more without direction is not a plan."}, {"stem": "<i>Role-play skill &mdash; the judge&rsquo;s follow-up question.</i> You just presented a plan to the manager of a regional bank for a new student checking account. The judge (manager) asks: &ldquo;How will we know if this account is successful after six months?&rdquo; Which response is best?", "opts": ["&ldquo;Success can mean many different things, so it really depends on how you look at it. I think customers will like it.&rdquo;", "&ldquo;That&rsquo;s a great question. I would need to do more research before I could give you an answer on that.&rdquo;", "&ldquo;We&rsquo;ll track three numbers: new student accounts opened, the share that stay active after 90 days, and how many add a savings account. If we reach 400 accounts with 70% still active, that&rsquo;s success.&rdquo;", "&ldquo;We will also add a mobile game, free T-shirts, and a social media contest so that even more students sign up.&rdquo;"], "ci": 2, "exp": "Strong answers to a judge&rsquo;s question are <b>specific and tied to the situation</b>, with measurable goals. Vague answers, putting off the question, or piling on new promises that don&rsquo;t answer it all lose points."}, {"stem": "A manager at an insurance office needs to tell 40 employees about a new policy for submitting expense reports, which takes effect next month and includes a step-by-step form. Which channel is most appropriate?", "opts": ["a quick announcement over the office intercom", "a text message sent to each employee&rsquo;s personal phone", "an email with the written steps and the form attached, followed by a brief meeting for questions", "a sticky note placed on the break-room refrigerator"], "ci": 2, "exp": "Detailed procedures should be in <b>writing</b> so employees can refer back to them, and a follow-up meeting allows two-way communication. Intercom announcements and notes are easily missed and can&rsquo;t hold step-by-step detail."}, {"stem": "A bank&rsquo;s customer-service team wants to know which questions customers ask most often so it can update its website FAQ. Which source of information is most useful?", "opts": ["a news article about national banking trends", "the bank&rsquo;s annual report to shareholders", "records of calls and chats sorted by topic over the past six months", "a competitor&rsquo;s advertising brochure"], "ci": 2, "exp": "The team needs <b>internal data</b> about its own customers&rsquo; questions. Call and chat logs answer exactly that; the other sources are general or about other companies."}, {"stem": "Before opening a mobile phone-repair business, Jordan surveys 200 high school students about how often their screens crack and what they would pay for a repair. Jordan is mainly", "opts": ["testing whether there is enough demand for the business idea", "writing the business&rsquo;s mission statement", "applying for a patent on the repair method", "calculating the company&rsquo;s depreciation"], "ci": 0, "exp": "Surveying potential customers is <b>market research</b> to check demand (feasibility) before launching. It is not a mission statement, a patent, or an accounting task."}, {"stem": "A smoothie shop has total revenue of $80,000 and total expenses of $68,000 for the year. What is its net income?", "opts": ["$148,000", "$68,000", "$12,000", "$8,000"], "ci": 2, "exp": "<b>Net income = revenue &minus; expenses</b> = $80,000 &minus; $68,000 = $12,000."}, {"stem": "A customer at a tax-preparation office is angry because his refund was delayed by an error the office made. What should the employee do first?", "opts": ["Listen without interrupting and acknowledge his frustration", "Explain that the tax agency causes most delays", "Offer a discount before he finishes speaking", "Transfer him to a manager immediately"], "ci": 0, "exp": "The first step in handling a complaint is to <b>listen and show empathy</b>. Blaming others or jumping to a solution before understanding the problem makes customers feel unheard."}, {"stem": "A credit union offers a savings account designed only for teens ages 13&ndash;17, with a free budgeting app. Focusing on this group of customers is an example of", "opts": ["mass marketing to every possible customer", "target marketing to a specific market segment", "setting prices based on competitors", "selling through a wholesale channel"], "ci": 1, "exp": "Choosing one group (teens) and designing a product for them is <b>target marketing</b>. Mass marketing aims one message at everyone."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
