var P1="Bioluminescence is the ability of living things to produce their own light, and it ranks among the most spectacular phenomena in the natural world. Deep in the ocean, where sunlight cannot reach, countless creatures glow in shades of blue, green, and red. On warm summer evenings, fireflies transform meadows into natural light shows. Even certain types of fungi cast a soft glow across dark forest floors. Far from being a mere curiosity, bioluminescence is a biological tool that organisms have evolved for specific purposes over millions of years.";
var P2="At the chemical level, bioluminescence results from a reaction between a molecule called luciferin and an enzyme called luciferase. When these two compounds interact in the presence of oxygen, energy is released as visible light rather than heat. Unlike a light bulb, which wastes much of its energy as heat, a bioluminescent organism converts nearly all of its chemical energy directly into cold, bright light. Scientists call this kind of efficient light production 'cold light.' This high efficiency explains why bioluminescence has evolved independently in dozens of unrelated species, from deep-sea fish to land-dwelling insects.";
var P3="Scientists have identified at least three main purposes that bioluminescence serves in nature. First, many deep-sea creatures use light to attract prey, dangling glowing lures near their mouths in the pitch-black depths. Second, some species use bioluminescence for communication. Fireflies, for example, flash distinctive patterns to attract mates of the same species. Third, several marine organisms produce sudden bright flashes to startle or confuse predators, buying precious seconds to escape. The same remarkable ability thus serves very different survival strategies depending on the organism.";
var P4="Humans have learned to harness bioluminescence for remarkable scientific purposes. Researchers insert the luciferase gene into bacteria or cancer cells, causing those cells to glow so they can be tracked under a microscope. Medical scientists use bioluminescent markers to study how diseases spread through the body without invasive surgery. Environmental scientists have also used bioluminescent bacteria as pollution detectors, since these organisms dim or stop glowing when exposed to toxic chemicals. As scientists continue to unlock the secrets of nature's living light, new applications in medicine, environmental science, and engineering continue to emerge.";
var PExtra="While bioluminescence occurs naturally throughout the animal kingdom, researchers have recently begun creating artificially glowing plants through genetic engineering. By inserting the luciferase gene into common houseplants such as tobacco and petunia, scientists at several universities produced plants that emit a steady, faint green glow in darkness. These engineered plants require no electricity and produce no heat. If the technology could be scaled up, such living lamps might one day provide soft, eco-friendly lighting in public spaces or along sidewalks. The experiment demonstrates that natural bioluminescence, once considered a curiosity of the deep ocean, can be repurposed by human ingenuity for entirely new goals.";

var state={};
function loadState(){try{var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<qs.length&&s.answers&&typeof s.answers==='object'&&s.shuffles&&typeof s.shuffles==='object'){state=s;}else{resetState();}}catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}}

function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}
function getShuffle(i){if(!state.shuffles[i]){var a=[0,1,2,3];for(var k=3;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}state.shuffles[i]=a;}return state.shuffles[i];}

  updateNav();
  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){if(state.answers[i]===undefined)sk++;else if(state.answers[i]===getCSI(i))c++;else w++;}
  document.getElementById('results-summary').innerHTML='<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){var a=state.answers[i];var label,bg,tc;if(a===undefined){label='Skipped';bg='#d7dde6';tc='#555';}else if(a===getCSI(i)){label='Correct';bg='#E1F5EE';tc='#085041';}else{label='Wrong';bg='#FCEBEB';tc='#501313';}html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;color:#333;">Q'+(i+1)+': '+escHtml(qs[i].tag)+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';}
  document.getElementById('results-cards').innerHTML=html;
}
function pick(qi,si){if(state.answers[qi]!==undefined)return;state.answers[qi]=si;saveState();render();}
function go(dir){if(dir===1&&state.cur===qs.length-1){showResults();return;}state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));saveState();render();}
function retryWrong(){var first=-1;for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==getCSI(i)){if(first===-1)first=i;delete state.answers[i];}}if(first!==-1){state.cur=first;state.showResults=false;saveState();render();}}
function copyRes(){var lines=['[Grant] English - Results (2026-06-14)'];for(var i=0;i<qs.length;i++){var a=state.answers[i];var label=a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong';lines.push('Q'+(i+1)+' ('+qs[i].tag+'): '+label);}var txt=lines.join('\n');if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);});}else{fallbackCopy(txt);}}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){document.getElementById('freshModal').style.display='none';localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.pick=pick;window.go=go;window.goToQ=goToQ;window.toggleJump=toggleJump;
window.retryWrong=retryWrong;window.copyRes=copyRes;window.openFreshModal=openFreshModal;
window.confirmFresh=confirmFresh;window.showResults=showResults;

loadState();saveState();render();
})();
</script>
