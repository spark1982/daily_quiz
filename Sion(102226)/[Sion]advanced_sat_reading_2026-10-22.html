<style>

  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<script>
var TITLE = "[Sion] Advanced SAT Reading";
var QUIZ_KEY = "sionadvreading";
var INSTRUCTION = "Read each passage and choose the best answer.";
var TODAY_STR = "20261022";
var RAW_QUESTIONS = [{"passage": "<strong>Text 1</strong><br>For many years, historians explained the disappearance of the Norse settlements in Greenland, abandoned by the fifteenth century, chiefly as a consequence of climate. As summers grew colder, the argument goes, the settlers&rsquo; livestock could not be fed through the long winters, and the colonies starved.<br><br><strong>Text 2</strong><br>Recent studies of the settlements&rsquo; trash heaps show that the Norse adapted to cooler conditions by eating far more seal meat. Some researchers argue that a more decisive blow came from Europe: the settlements depended on exporting walrus ivory, and demand for that ivory fell sharply as elephant ivory became more available.", "stem": "Based on the texts, how would the researchers mentioned in Text 2 most likely characterize the explanation in Text 1?", "opts": ["As correct, because colder summers would have made walrus hunting impossible", "As incomplete, because it overlooks evidence that the settlers adapted to the climate and that economic changes may have mattered more", "As irrelevant, because the Norse settlements were abandoned before the climate cooled", "As accurate about livestock but mistaken about when the settlements were abandoned"], "ci": 1, "exp": "Text 2 says the Norse adapted their diet to the cold and points to the collapse of the ivory trade as &ldquo;a more decisive blow,&rdquo; so the researchers would see a climate-only account as incomplete. Text 2 never disputes when the settlements were abandoned or claims the climate did not cool.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "<strong>Text 1</strong><br>Supporters of the four-day school week argue that it allows rural districts to save substantial money on transportation, heating, and staffing while having little effect on what students learn. Some districts that adopted the schedule also report that teachers are less likely to leave.<br><br><strong>Text 2</strong><br>Economist Rachel Kim compared districts that switched to a four-day week with similar districts that did not. The switching districts saved only about two percent of their budgets on average, and their students&rsquo; math scores grew slightly more slowly than those of students in comparison districts, with the largest gaps among younger students.", "stem": "Based on the texts, how would Kim (Text 2) most likely respond to the supporters&rsquo; argument in Text 1?", "opts": ["She would agree that the schedule saves substantial money but question whether teachers are less likely to leave.", "She would argue that the schedule harms older students more than younger students.", "She would agree with the supporters, since math scores in the switching districts continued to grow.", "She would argue that the savings have been overstated and that the effect on learning is not as small as supporters claim."], "ci": 3, "exp": "Text 1 claims &ldquo;substantial&rdquo; savings and &ldquo;little effect&rdquo; on learning. Kim found savings of &ldquo;only about two percent&rdquo; and slower math growth, which challenges both claims. Her study says nothing about teacher turnover, and the largest gaps were among <i>younger</i> students.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "In the nineteenth century, ice was one of New England&rsquo;s major exports. Each winter, workers sawed blocks from frozen ponds, packed them in sawdust to slow melting, and loaded them onto ships bound for distant ports, some as far away as India. Within a few decades, however, the trade had nearly vanished, as mechanical refrigeration allowed ice to be manufactured almost anywhere.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To argue that naturally harvested ice was superior to manufactured ice", "To describe a once-thriving industry and explain what led to its decline", "To compare sawdust with other materials used to keep ice from melting", "To explain in detail how mechanical refrigeration works"], "ci": 1, "exp": "The text first describes how the ice trade operated and how far it reached, then explains that refrigeration made it nearly vanish. It never claims natural ice was better, mentions sawdust only once, and does not describe how refrigeration works.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "It is often assumed that the tallest trees in a forest are simply the ones that grew fastest. Yet when ecologist Tom&aacute;s Reyes measured trees in a coastal forest over twenty years, he found that the tallest individuals had not grown fastest; instead, many had spent decades growing slowly in deep shade before a gap in the canopy finally opened above them. Reyes suggests that this slow early growth produces denser wood, which can later support greater height.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It presents a common assumption, describes research that challenges it, and offers a possible explanation for the research findings.", "It presents a hypothesis, describes an experiment that confirms it, and then raises a new question.", "It describes two competing explanations and argues that both are partly correct.", "It explains how canopy gaps form and then describes their effect on forest animals."], "ci": 0, "exp": "&ldquo;It is often assumed&rdquo; introduces a common belief; &ldquo;Yet when ecologist Tom&aacute;s Reyes measured&rdquo; introduces research that contradicts it; and &ldquo;Reyes suggests&rdquo; offers an explanation (denser wood). The research challenges, rather than confirms, the opening idea.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "The archivist&rsquo;s catalog of the explorer&rsquo;s letters is remarkably ______: it records not only each letter&rsquo;s date and recipient but also the type of paper, the color of the ink, and every note that family members later added in the margins.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["cursory", "exhaustive", "ambiguous", "partisan"], "ci": 1, "exp": "The colon introduces a long list of details the catalog records, so the catalog must be thorough and complete — <i>exhaustive</i>. <i>Cursory</i> (hasty, superficial) is the opposite, <i>ambiguous</i> (unclear) is not supported, and <i>partisan</i> (biased toward one side) has nothing to do with the level of detail.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "Fossil pollen preserved in lake sediments reveals which plants grew near a lake in the past. In cores taken from Lake Harlow, oak pollen is abundant in layers dated before about 1850 but nearly absent from layers dated afterward, while pollen from grasses and corn rises sharply in the post-1850 layers. These findings suggest that ______", "stem": "Which choice most logically completes the text?", "opts": ["oak pollen does not preserve well in lake sediments.", "the land around the lake was largely cleared of forest and planted with crops beginning around the middle of the nineteenth century.", "corn grew wild around Lake Harlow before 1850.", "the lake itself did not exist until about 1850."], "ci": 1, "exp": "Oak (forest) pollen disappears while grass and corn (farm) pollen surges after 1850, which points to forest being replaced by farmland. Oak pollen is abundant in older layers, so it clearly preserves well; corn pollen rises only after 1850; and the older layers show the lake existed before 1850.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Glassmakers in eighteenth-century Venice guarded their techniques closely. <u>Some workshops even forbade their artisans from leaving the island of Murano without official permission.</u> Despite such measures, knowledge of Venetian methods gradually spread to workshops in Bohemia and England, where artisans adapted the techniques to local materials.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It explains why Venetian methods eventually spread to other countries.", "It gives an example of how strictly Venetian glassmakers tried to protect their methods.", "It describes a result of the spread of Venetian techniques to Bohemia and England.", "It suggests that Venetian artisans preferred to remain on Murano."], "ci": 1, "exp": "The first sentence makes a general claim (techniques were &ldquo;guarded closely&rdquo;), and the underlined sentence supports it with a specific, extreme example (&ldquo;even forbade&rdquo; leaving). The spread of the methods happens &ldquo;despite such measures,&rdquo; so the sentence does not explain or result from that spread, and nothing indicates what artisans preferred.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Reviewers have often called the novelist&rsquo;s prose plain, even thin. Literary scholar Lena Ortiz disagrees. The novelist&rsquo;s short, unadorned sentences, Ortiz argues, are carefully calibrated: by withholding description at the most painful moments of each story, the novelist forces readers to supply the emotional weight of the scene themselves.", "stem": "Which choice best describes how Ortiz characterizes the novelist&rsquo;s short sentences?", "opts": ["as a habit the novelist adopted to make the books easier for young readers", "as a deliberate technique that draws readers into the work rather than a weakness", "as evidence that the novelist was more interested in plot than in emotion", "as a flaw that reviewers have exaggerated but that still weakens the stories"], "ci": 1, "exp": "Ortiz calls the sentences &ldquo;carefully calibrated&rdquo; and says they make readers &ldquo;supply the emotional weight,&rdquo; presenting them as an intentional strength. The &ldquo;flaw that reviewers have exaggerated&rdquo; option is tempting because it mentions reviewers, but Ortiz does not concede any flaw; neither young readers nor plot is mentioned.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Many early reviewers dismissed the composer&rsquo;s use of recorded street noise in her symphonies as a passing gimmick. Decades later, however, so many composers had adopted the technique that critics began to describe it as ______ rather than eccentric.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["conventional", "ephemeral", "frivolous", "clandestine"], "ci": 0, "exp": "The word must contrast with <i>eccentric</i> (odd, unusual) and reflect that &ldquo;so many composers had adopted the technique.&rdquo; A widely used technique is <i>conventional</i>. <i>Ephemeral</i> (short-lived) fits the reviewers&rsquo; old view, not the later one; <i>frivolous</i> and <i>clandestine</i> (secret) do not contrast with eccentric.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "<table style=\"border-collapse:collapse;font-size:0.9rem;margin-bottom:8px;\"><tr><th style=\"border:1px solid #bbb;padding:4px 8px;\">Branch</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Near a school?</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Average weekend visitors before</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Average weekend visitors after</th></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">North</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">Yes</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">310</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">455</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">East</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">Yes</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">280</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">410</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">West</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">No</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">295</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">305</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">South</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">No</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">260</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">268</td></tr></table>Last year, the Lakeview Public Library extended its weekend hours at all four of its branches. A city analyst concludes that the change mainly benefited branches located near schools.", "stem": "Which choice most effectively uses data from the table to support the analyst&rsquo;s conclusion?", "opts": ["Average weekend visits rose by more than 100 at both the North and East branches, which are near schools, but by fewer than 15 at the West and South branches, which are not.", "The North branch had the most weekend visitors both before and after the hours were extended.", "The South branch had the fewest weekend visitors after the hours were extended.", "Before the change, the West branch had more weekend visitors than the East branch did."], "ci": 0, "exp": "The conclusion compares branches near schools with branches not near schools, so the support must compare the size of the increases across those two groups: North +145 and East +130 versus West +10 and South +8. The other choices describe single branches without comparing the change between the two groups.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "In many songbird species, young males learn their songs by imitating adult males during a limited period early in life. To test how firm that limit is, researchers raised a group of zebra finches without adult tutors until well after the learning period would normally have ended and then housed them with singing adults for several months. If the learning period is truly fixed, the researchers would most likely have found that ______", "stem": "Which choice most logically completes the text?", "opts": ["the songs of the late-tutored finches remained noticeably different from the songs of the adults they lived with.", "the late-tutored finches quickly learned to copy the adults&rsquo; songs exactly.", "the late-tutored finches sang more often than finches raised with tutors.", "the late-tutored finches stopped singing entirely once they were housed with adults."], "ci": 0, "exp": "If learning can happen only during a fixed early window, birds exposed to tutors after the window closed should fail to copy the adults well, so their songs would stay different. Quick, exact copying would show the window is <i>not</i> fixed; the text gives no basis for predictions about how often they sing or for them falling silent.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Ecologist Ana Pereira studies hummingbirds in a high mountain valley where both red and white wildflowers bloom. She hypothesizes that the birds choose which flowers to visit based mainly on color rather than on the amount of nectar a flower contains.", "stem": "Which finding, if true, would most directly support Pereira&rsquo;s hypothesis?", "opts": ["When red and white flowers held equal amounts of nectar, the hummingbirds visited each color about equally often.", "When red flowers holding little nectar were placed beside white flowers holding abundant nectar, the hummingbirds still visited the red flowers more often.", "Hummingbirds in the valley visited flowers with more nectar more often, regardless of color.", "Red wildflowers are far more common in the valley than white wildflowers are."], "ci": 1, "exp": "To show that color matters more than nectar, the two must be pitted against each other: the birds favored red even when red offered less nectar. Equal visits would not show a color preference, a nectar-driven pattern would weaken the hypothesis, and red being more common is an alternative explanation for more visits.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
