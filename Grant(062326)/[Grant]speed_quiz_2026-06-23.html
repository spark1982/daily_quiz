<title>[Grant] Speed Quiz</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.date-hd{text-align:center;font-size:2rem;font-weight:800;color:#185FA5;padding:6px 0;}
.title-hd{text-align:center;font-size:1.3rem;font-weight:700;margin:4px 0 2px;color:#111;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
.attempts-hd{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;}
.tag-badge{display:inline-block;color:#fff;font-size:0.74rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:10px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.timer-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-bottom:10px;}
.timer-label{font-size:0.82rem;color:#888;}
.timer-val{font-size:1.6rem;font-weight:800;min-width:2.2ch;text-align:right;}
.pause-btn{font-size:0.78rem;padding:4px 12px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;}
.pause-btn:disabled{opacity:0.4;cursor:default;}
.q-text{font-size:1rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.6;white-space:pre-line;}
.opt-btn{display:block;width:100%;padding:11px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#eaf1f7;color:#111;font-size:0.93rem;text-align:left;cursor:pointer;font-family:inherit;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.6;}
.timeout-note{text-align:center;color:#E24B4A;font-weight:700;font-size:0.9rem;margin-bottom:8px;display:none;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#eaf1f7;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.prog-track{background:#d6e2ec;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#eaf1f7;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#eaf1f7;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.chapter-row{display:flex;justify-content:space-between;align-items:center;background:#f4f7fa;border-radius:8px;padding:8px 14px;margin:4px 0;font-size:0.88rem;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
</style>

<body>
<div class="date-hd">2026-06-23</div>
<div class="title-hd">[Grant] Speed Quiz</div>
<div class="instruction">Each question has its own 40-second countdown. Pause it any time, and use Next / Prev to move at your own pace.</div>
<div class="attempts-hd" id="att-display">Total Attempts: 0</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / 30</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div class="tag-badge" id="tag-badge"></div>
  <div class="q-num" id="q-num"></div>
  <div class="timer-row">
    <span class="timer-label">Time Left:</span><span class="timer-val" id="timer-val">40</span><span class="timer-label">s</span>
    <button class="pause-btn" id="pause-btn" onclick="togglePause()">Pause</button>
  </div>
  <div class="timeout-note" id="timeout-note">Time's up!</div>
  <div class="q-text" id="q-text"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" id="prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#185FA5;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.05rem;margin-bottom:14px;"></div>
  <div id="chapter-breakdown"></div>
  <div id="results-cards" style="margin-top:10px;"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;margin-top:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#7b61ff;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal()" style="display:block;width:100%;padding:13px;background:#eaf1f7;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#eaf1f7;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

function getShuffle(i){return [0,1,2,3];}
function getCSI(i){return qs[i].ci;}
function loadAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0',10);}

var state={};
var timerInterval=null;
var paused=false;
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');
    if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<qs.length&&s.answers){state=s;}
    else resetState();
  }catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}
}
function resetState(){state={cur:0,answers:{},showResults:false};}
function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}

function toggleJump(){
  var p=document.getElementById('dot-panel');
  var b=document.getElementById('jump-btn');
  if(p.style.display==='block'){p.style.display='none';b.innerHTML='Jump &#9662;';}
  else{p.style.display='block';b.innerHTML='Hide &#9652;';renderDots();}
}

function renderDots(){
  var p=document.getElementById('dot-panel');
  if(p.style.display!=='block')return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    var bg='#d6e2ec';
    if(a){if(a.correct)bg='#1D9E75';else if(a.timedOut)bg='#c07800';else bg='#E24B4A';}
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML=h;
}

function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  clearInterval(timerInterval);
  state.showResults=true;
  localStorage.setItem(ATT_KEY,loadAtt()+1);
  saveState(); render();
}

function startTimer(){
  clearInterval(timerInterval);
  paused=false;
  state.timerVal=40;
  var pb=document.getElementById('pause-btn');
  pb.textContent='Pause'; pb.disabled=false;
  renderTimerDisplay();
  timerInterval=setInterval(tick,1000);
}

function tick(){
  state.timerVal--;
  if(state.timerVal<=0){
    clearInterval(timerInterval);
    handleTimeout();
  } else {
    renderTimerDisplay();
  }
}

function togglePause(){
  if(state.answers[state.cur]!==undefined)return;
  var pb=document.getElementById('pause-btn');
  if(paused){
    paused=false; pb.textContent='Pause';
    timerInterval=setInterval(tick,1000);
  } else {
    paused=true; pb.textContent='Resume';
    clearInterval(timerInterval);
  }
}

function renderTimerDisplay(){
  var t=document.getElementById('timer-val');
  t.textContent=state.timerVal;
  var color = state.timerVal>=22?'#1D9E75':(state.timerVal>=11?'#f5a623':'#E24B4A');
  t.style.color=color;
}

function render(){
  document.getElementById('att-display').textContent='Total Attempts: '+loadAtt();
  if(state.showResults){
    clearInterval(timerInterval);
    document.getElementById('quizArea').style.display='none';
    renderResults();
    return;
  }
  document.getElementById('resultsArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  updateNav();
  var i=state.cur;
  var q=qs[i];
  var badge=document.getElementById('tag-badge');
  badge.textContent=q.tag;
  badge.style.background=TAG_COLORS[q.tag];
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  document.getElementById('q-text').innerHTML=q.q;
  var a=state.answers[i];
  var csi=getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var cls='opt-btn'; var dis='';
    if(a!==undefined){dis='disabled ';if(s===csi)cls+=' correct';else if(s===a.selected)cls+=' wrong';}
    html+='<button class="'+cls+'" '+dis+'onclick="pick('+s+')">'+q.opts[s]+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');
  var tn=document.getElementById('timeout-note');
  var pb=document.getElementById('pause-btn');
  if(a!==undefined){
    eb.style.display='block'; eb.innerHTML=q.exp;
    tn.style.display=a.timedOut?'block':'none';
    clearInterval(timerInterval);
    state.timerVal=(typeof a.timeLeft==='number')?a.timeLeft:0;
    renderTimerDisplay();
    pb.disabled=true; pb.textContent='Pause';
  } else {
    eb.style.display='none';
    tn.style.display='none';
    startTimer();
  }
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.getElementById('prev-btn').disabled=(i===0);
}

function pick(si){
  var i=state.cur;
  if(state.answers[i]!==undefined)return;
  clearInterval(timerInterval);
  var q=qs[i]; var csi=getCSI(i);
  var correct=(si===csi);
  state.answers[i]={selected:si,csi:csi,correct:correct,timedOut:false,timeLeft:state.timerVal};
  saveState();
  render();
}

function handleTimeout(){
  var i=state.cur;
  if(state.answers[i]!==undefined)return;
  var q=qs[i]; var csi=getCSI(i);
  state.answers[i]={selected:null,csi:csi,correct:false,timedOut:true,timeLeft:0};
  saveState();
  render();
}

function go(dir){
  if(dir===1&&state.cur===qs.length-1){showResults();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));
  saveState();render();
}

function renderResults(){
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,t=0,sk=0;
  var chapterStats={};
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i]; var tag=qs[i].tag;
    if(!chapterStats[tag])chapterStats[tag]={correct:0,total:0};
    chapterStats[tag].total++;
    if(a&&a.correct){c++;chapterStats[tag].correct++;}
    else if(a&&a.timedOut)t++;
    else if(a)w++;
    else sk++;
  }
  document.getElementById('results-summary').innerHTML=
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#c07800;font-weight:700;">'+t+'</span> timed out &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var chHtml='';
  var order=['Gauss','Intervals','Add & Sub','Multiply','Geometry'];
  for(var oi=0;oi<order.length;oi++){
    var tg=order[oi]; var st=chapterStats[tg]||{correct:0,total:0};
    chHtml+='<div class="chapter-row"><span style="font-weight:600;color:'+TAG_COLORS[tg]+';">'+tg+'</span><span>'+st.correct+' / '+st.total+'</span></div>';
  }
  document.getElementById('chapter-breakdown').innerHTML=chHtml;
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i]; var label,bg,tc;
    if(a&&a.correct){label='Correct';bg='#E1F5EE';tc='#085041';}
    else if(a&&a.timedOut){label='Timed Out';bg='#fff3e0';tc='#7a4a00';}
    else if(a){label='Wrong';bg='#FCEBEB';tc='#501313';}
    else{label='Skipped';bg='#d6e2ec';tc='#555';}
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;color:#333;">Q'+(i+1)+': '+qs[i].tag+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}

function retryWrong(){
  var wrongIdx=[];
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    if(a&&!a.correct){wrongIdx.push(i);delete state.answers[i];}
  }
  if(wrongIdx.length===0)return;
  state.cur=Math.min.apply(null,wrongIdx);
  state.showResults=false;
  saveState(); render();
}

function copyRes(){
  var lines=['[Grant] Speed Quiz - Results (2026-06-23)'];
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    var label=a?(a.correct?'Correct':(a.timedOut?'Timed Out':'Wrong')):'Skipped';
    lines.push('Q'+(i+1)+' ('+qs[i].tag+'): '+label);
  }
  var txt=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);});}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){
  document.getElementById('freshModal').style.display='none';
  clearInterval(timerInterval);
  localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();
}

window.pick=pick;window.toggleJump=toggleJump;window.goToQ=goToQ;window.go=go;
window.retryWrong=retryWrong;window.copyRes=copyRes;window.openFreshModal=openFreshModal;
window.confirmFresh=confirmFresh;window.showResults=showResults;window.togglePause=togglePause;

loadState();saveState();render();
})();
</script>
</body>
</html>
