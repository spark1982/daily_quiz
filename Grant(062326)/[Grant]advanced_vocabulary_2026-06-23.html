<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Advanced Vocabulary</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:#f0f3f7; margin:0; padding:0; color:#222; }
  .wrap { max-width:640px; margin:0 auto; padding:18px 14px 60px; }
  h1 { font-size:1.25rem; text-align:center; color:#1D9E75; margin:6px 0 2px; }
  .date { text-align:center; font-size:0.82rem; color:#888; margin-bottom:6px; }
  .instruction { text-align:center; font-size:0.88rem; color:#555; padding:6px 12px 10px; background:#f0f3f7; }
  #nav-bar { display:flex; align-items:center; gap:8px; margin:12px 0; }
  #nav-count { font-size:13px; white-space:nowrap; color:#555; }
  .prog-track { background:#d7dde6; border-radius:3px; height:6px; flex:1; margin:0 10px; }
  .prog-fill { background:#1D9E75; border-radius:3px; height:6px; width:0%; transition:width 0.2s; }
  #jump-btn { font-size:12px; padding:4px 10px; border:1px solid #1D9E75; border-radius:14px; background:#fff; color:#1D9E75; cursor:pointer; white-space:nowrap; }
  #dot-panel { display:none; max-height:170px; overflow-y:auto; padding:8px; background:#fff; border-radius:8px; margin-bottom:8px; }
  .card { background:#fff; border-radius:14px; padding:18px 16px; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:14px; }
  .word-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .word-text { font-size:1.5rem; font-weight:700; color:#1D9E75; }
  .tag-badge { display:inline-block; font-size:0.7rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-left:6px; vertical-align:middle; }
  .speak-btn { border:none; background:#e5f6ef; color:#1D9E75; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:0.95rem; }
  .q-context { font-style:italic; background:#f3faf6; border-left:3px solid #1D9E75; padding:10px 12px; border-radius:6px; margin-bottom:14px; font-size:0.95rem; color:#333; }
  .q-prompt { font-size:0.92rem; color:#555; margin-bottom:10px; }
  .opt-btn { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px; border:1.5px solid #d7dde6; border-radius:9px; background:#fff; font-size:0.95rem; cursor:pointer; }
  .opt-btn.correct { background:#E1F5EE; border-color:#1D9E75; color:#0c5132; font-weight:600; }
  .opt-btn.wrong { background:#FBE9E7; border-color:#E24B4A; color:#7a1d1c; font-weight:600; }
  .opt-btn.disabledbtn { cursor:default; }
  .exp-box { margin-top:6px; padding:11px 13px; background:#fff7e6; border-left:3px solid #f5a623; border-radius:6px; font-size:0.88rem; color:#5a4310; line-height:1.5; }
  .nav-btns { display:flex; gap:10px; margin-top:14px; }
  .nav-btns button { flex:1; padding:11px; border:none; border-radius:9px; background:#1D9E75; color:#fff; font-size:0.95rem; cursor:pointer; }
  .nav-btns button:disabled { background:#b9c6d4; cursor:default; }
  .results-card { text-align:center; }
  .score-big { font-size:2.4rem; font-weight:800; color:#1D9E75; margin:8px 0; }
  #retryWrongBtn { display:block; width:100%; padding:13px; background:#1D9E75; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .res-btn-copy { display:block; width:100%; padding:13px; background:#7b61ff; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .res-btn-fresh { display:block; width:100%; padding:13px; background:#888; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; }
  .modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; z-index:50; }
  .modal-box { background:#fff; border-radius:14px; padding:22px; max-width:300px; text-align:center; }
  .modal-box p { font-size:0.95rem; color:#333; margin-bottom:18px; }
  .modal-btns { display:flex; gap:10px; }
  .modal-btns button { flex:1; padding:10px; border:none; border-radius:8px; font-size:0.9rem; cursor:pointer; }
  .modal-btn-cancel { background:#e5e8ec; color:#333; }
  .modal-btn-confirm { background:#E24B4A; color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>[Grant] Advanced Vocabulary</h1>
  <div class="date">2026-06-23</div>
  <div class="instruction">Choose the best meaning of each word based on its context.</div>

  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>

  <div id="quiz-area"></div>
  <div id="results-area" style="display:none;"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <p>Are you sure you want to clear all progress and start fresh?</p>
    <div class="modal-btns">
      <button class="modal-btn-cancel" onclick="closeFreshModal()">Cancel</button>
      <button class="modal-btn-confirm" onclick="confirmFresh()">Start Fresh</button>
    </div>
  </div>
</div>

<script>
(function(){
  var DATE_GEN = '20260622';
  var QUIZ_KEY = 'quiz_grantadvvocab_20_' + DATE_GEN + '_v1';
  var ATT_KEY  = 'quiz_grantadvvocab_att_' + DATE_GEN + '_v1';

  var qs = [
    { tag:'New', stem:'annotation', sent:"Each annotation in the margin explained why the author had chosen that particular word.",
      opts:['a formal request to publish a new book','a short note added to explain or comment on something','a brief summary placed at the very end of a chapter','an agreement signed by two or more authors'], ci:1,
      exp:"An annotation is a short note added to explain or comment on a text, matching the margin notes explaining word choice." },
    { tag:'Review', stem:'mandate', sent:"The city council issued a mandate requiring all new buildings to include solar panels.",
      opts:['an official order or instruction to do something','a voluntary suggestion that carries no real authority','a yearly report on a company’s profits','an informal agreement with no legal force'], ci:0,
      exp:"A mandate is an official order or instruction, matching the council's required rule for new buildings." },
    { tag:'New', stem:'authorization', sent:"The nurse could not give the new medicine without written authorization from a doctor.",
      opts:['a written record describing past mistakes','official permission to do something','a public announcement made to a large crowd','a financial penalty charged for breaking a rule'], ci:1,
      exp:"Authorization is official permission to do something, matching the doctor's required approval before giving medicine." },
    { tag:'New', stem:'counterpart', sent:"The American ambassador met with her counterpart from the French government to discuss trade.",
      opts:['a person who strongly opposes another’s ideas','an assistant who takes notes during a meeting','a person or thing with the same role or position elsewhere','a former employee who has since retired'], ci:2,
      exp:"A counterpart is a person or thing holding the same role elsewhere, matching the French official with the same job as the American ambassador." },
    { tag:'New', stem:'ambitious', sent:"The school announced an ambitious plan to build three new science labs within a single year.",
      opts:['requiring great effort or skill to be successfully achieved','requiring almost no planning or resources at all','guaranteed to fail without any extra effort','based on outdated methods no longer used'], ci:0,
      exp:"Ambitious describes a plan requiring great effort or skill, matching the difficulty of building three labs in one year." },
    { tag:'New', stem:'critical', sent:"Getting enough sleep is critical to doing well on tomorrow's exam.",
      opts:['mildly helpful but not very important','extremely important; essential','completely unrelated to the outcome','interesting but ultimately unnecessary'], ci:1,
      exp:"Critical means extremely important or essential, matching how necessary sleep is for doing well on the exam." },
    { tag:'Review', stem:'conflict', sent:"The conflict between the two departments slowed down the entire project.",
      opts:['a serious disagreement or struggle','a friendly agreement between two parties','a formal celebration of a shared success','a detailed plan for future cooperation'], ci:0,
      exp:"A conflict is a serious disagreement or struggle, matching the departments' dispute that slowed the project." },
    { tag:'Review', stem:'aesthetic', sent:"The architect chose curved windows purely for aesthetic reasons, not for any practical benefit.",
      opts:['relating to cost and budgeting','relating to safety regulations','relating to beauty or appearance','relating to the speed of construction'], ci:2,
      exp:"Aesthetic means relating to beauty or appearance, matching the architect's choice made for looks rather than practicality." },
    { tag:'New', stem:'analogy', sent:"The teacher used an analogy comparing the heart to a pump to help students understand circulation.",
      opts:['a comparison made between two things to explain an idea','a strict rule that must always be followed','a list of vocabulary words to memorize','a formal disagreement between two scientists'], ci:0,
      exp:"An analogy is a comparison between two things used to explain an idea, matching the heart-to-pump comparison." },
    { tag:'New', stem:'accountability', sent:"The new policy increased accountability by requiring managers to explain every major decision.",
      opts:['being completely free from any rules','being responsible and answerable for one’s actions','being recognized publicly for an achievement','being trained to perform a specific task'], ci:1,
      exp:"Accountability means being responsible and answerable for one's actions, matching managers having to explain their decisions." },
    { tag:'New', stem:'atmosphere', sent:"Soft lighting and quiet music gave the restaurant a relaxed atmosphere.",
      opts:['the total amount of money a business earns each year','the overall mood or feeling of a place','a written menu describing each dish in detail','the number of customers a business can hold at once'], ci:1,
      exp:"Atmosphere here means the overall mood or feeling of a place, matching the relaxed mood created by lighting and music." },
    { tag:'New', stem:'inequality', sent:"The report highlighted the growing inequality between wealthy and low-income school districts.",
      opts:['unfair differences in opportunity, wealth, or treatment','an exact balance between two opposing forces','a temporary shortage of school supplies','a new method of teaching mathematics'], ci:0,
      exp:"Inequality means unfair differences in opportunity or wealth, matching the gap between wealthy and low-income districts." },
    { tag:'New', stem:'ecological', sent:"Removing the dam could have a major ecological impact on the fish that live in the river.",
      opts:['relating to the cost of building materials','relating to a region’s legal system','relating to the environment and living things','relating to a company’s hiring practices'], ci:2,
      exp:"Ecological means relating to the environment and living things, matching the dam's effect on the river's fish." },
    { tag:'New', stem:'cultivate', sent:"Reading widely as a child helped her cultivate a lifelong love of storytelling.",
      opts:['to develop or nurture something over time','to delete something no longer considered useful','to copy an idea directly from another person','to argue against an established belief'], ci:0,
      exp:"To cultivate means to develop or nurture something over time, matching how childhood reading grew her love of stories." },
    { tag:'New', stem:'escalate', sent:"What started as a small disagreement quickly escalated into a heated argument.",
      opts:['to come to a peaceful and quiet resolution','to increase rapidly in size, intensity, or seriousness','to remain exactly the same over time','to be forgotten almost immediately'], ci:1,
      exp:"To escalate means to increase rapidly in intensity, matching the small disagreement growing into a heated argument." },
    { tag:'Review', stem:'adaptation', sent:"The desert fox's thick fur is an adaptation that helps it survive cold nights.",
      opts:['a change that helps something survive or fit new conditions','a sudden and unexpected illness','a complete failure to adjust to a new environment','a temporary shelter built for emergencies'], ci:0,
      exp:"An adaptation is a change that helps something survive new conditions, matching the fox's fur helping it endure cold nights." },
    { tag:'Review', stem:'biodiversity', sent:"The rainforest is famous for its incredible biodiversity, home to thousands of unique species.",
      opts:['the total weight of all living things combined','the variety of plant and animal life found in an area','a list of endangered animals kept by scientists','the average temperature of a region over a year'], ci:1,
      exp:"Biodiversity means the variety of plant and animal life in an area, matching the rainforest's thousands of unique species." },
    { tag:'New', stem:'accumulate', sent:"Over the years, dust had accumulated on every shelf in the abandoned house.",
      opts:['to gradually gather or build up over time','to disappear suddenly without explanation','to be sold at a significant discount','to be cleaned on a regular schedule'], ci:0,
      exp:"To accumulate means to gradually gather or build up, matching the dust collecting over the years in the empty house." },
    { tag:'New', stem:'administration', sent:"The school administration announced a new policy about cell phone use during class.",
      opts:['a final exam given at the end of the school year','the group responsible for managing and running an organization','a club run entirely by student volunteers','a yearly award given to the top student'], ci:1,
      exp:"Administration refers to the group that manages and runs an organization, matching the school officials who set the new policy." },
    { tag:'New', stem:'withstand', sent:"The new bridge was designed to withstand even the strongest earthquakes.",
      opts:['to collapse quickly under very little pressure','to be rebuilt every few years on a fixed schedule','to resist or endure something successfully without giving way','to be measured using specialized scientific tools'], ci:2,
      exp:"To withstand means to resist or endure something without giving way, matching the bridge's ability to survive strong earthquakes." }
  ];

  var state = { idx:0, answers:{} };
  function loadState(){
    try {
      var raw = localStorage.getItem(QUIZ_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.idx = parsed.idx || 0;
        state.answers = parsed.answers || {};
      }
    } catch(e){}
  }
  function saveState(){
    try { localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); } catch(e){}
  }
  function bumpAttempt(){
    try {
      var n = parseInt(localStorage.getItem(ATT_KEY) || '0', 10);
      localStorage.setItem(ATT_KEY, String(n+1));
    } catch(e){}
  }

  function speak(word){
    try {
      if ('speechSynthesis' in window) {
        var u = new SpeechSynthesisUtterance(word);
        window.speechSynthesis.speak(u);
      }
    } catch(e){}
  }

  function answered(){ return Object.keys(state.answers).length; }

  function updateNav(){
    var a = answered();
    document.getElementById('nav-count').textContent = a + ' / ' + qs.length;
    document.getElementById('prog-fill').style.width = (a/qs.length*100).toFixed(1)+'%';
    renderDots();
  }

  function renderDots(){
    var panel = document.getElementById('dot-panel');
    var html = '';
    qs.forEach(function(q,i){
      var picked = state.answers[i];
      var bg = picked===undefined ? '#d7dde6' : (picked===q.ci ? '#1D9E75' : '#E24B4A');
      html += '<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
    });
    panel.innerHTML = html;
  }

  function toggleJump(){
    var panel = document.getElementById('dot-panel');
    var btn = document.getElementById('jump-btn');
    if (panel.style.display === 'none' || !panel.style.display) {
      panel.style.display = 'block'; btn.textContent = 'Hide ▴'; renderDots();
    } else {
      panel.style.display = 'none'; btn.textContent = 'Jump ▾';
    }
  }

  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(){
    if (answered() >= qs.length && state.showResults) { renderResults(); return; }
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('results-area').style.display = 'none';
    var i = state.idx;
    var q = qs[i];
    var picked = state.answers[i];
    var tagColor = q.tag === 'Review' ? '#f5a623' : '#1D9E75';
    var html = '<div class="card">';
    html += '<div class="word-row"><span class="word-text">'+escHtml(q.stem)+'</span>';
    html += '<button class="speak-btn" onclick="speak(\''+q.stem.replace(/'/g,"\\'")+'\')">&#128266;</button>';
    html += '<span class="tag-badge" style="background:'+tagColor+'">'+q.tag+'</span></div>';
    html += '<div class="q-prompt">Question '+(i+1)+' of '+qs.length+'. What does this word mean in context?</div>';
    html += '<div class="q-context">'+escHtml(q.sent)+'</div>';
    q.opts.forEach(function(opt, oi){
      var cls = 'opt-btn';
      if (picked !== undefined) {
        cls += ' disabledbtn';
        if (oi === q.ci) cls += ' correct';
        else if (oi === picked) cls += ' wrong';
      }
      html += '<button class="'+cls+'" onclick="pick('+oi+')" '+(picked!==undefined?'disabled':'')+'>'+escHtml(opt)+'</button>';
    });
    if (picked !== undefined && picked !== q.ci) {
      html += '<div class="exp-box">'+escHtml(q.exp)+'</div>';
    }
    html += '</div>';
    html += '<div class="nav-btns">';
    html += '<button onclick="go(-1)" '+(i===0?'disabled':'')+'>Prev</button>';
    if (i === qs.length-1) {
      html += '<button onclick="finishQuiz()">See Results &rarr;</button>';
    } else {
      html += '<button onclick="go(1)">Next</button>';
    }
    html += '</div>';
    document.getElementById('quiz-area').innerHTML = html;
    updateNav();
  }

  function pick(oi){
    var i = state.idx;
    if (state.answers[i] !== undefined) return;
    state.answers[i] = oi;
    saveState();
    render();
  }
  function go(dir){
    var ni = state.idx + dir;
    if (ni < 0 || ni > qs.length-1) return;
    state.idx = ni;
    saveState();
    render();
  }
  function goToQ(i){
    state.idx = i;
    state.showResults = false;
    saveState();
    render();
  }
  function finishQuiz(){
    state.showResults = true;
    saveState();
    bumpAttempt();
    renderResults();
  }

  function renderResults(){
    document.getElementById('quiz-area').style.display = 'none';
    var area = document.getElementById('results-area');
    area.style.display = 'block';
    var correct = 0;
    qs.forEach(function(q,i){ if (state.answers[i] === q.ci) correct++; });
    var html = '<div class="card results-card">';
    html += '<div>Your Score</div>';
    html += '<div class="score-big">'+correct+' / '+qs.length+'</div>';
    html += '<div style="margin-bottom:16px;color:#888;font-size:0.85rem;">Advanced Vocabulary &middot; 2026-06-23</div>';
    html += '<button id="retryWrongBtn" onclick="retryWrong()">Retry Wrong Ones</button>';
    html += '<button class="res-btn-copy" onclick="copyRes()">Copy All Results</button>';
    html += '<button class="res-btn-fresh" onclick="openFreshModal()">Start Fresh</button>';
    html += '</div>';
    area.innerHTML = html;
    updateNav();
  }

  function retryWrong(){
    var wrong = [];
    qs.forEach(function(q,i){
      if (state.answers[i] !== undefined && state.answers[i] !== q.ci) wrong.push(i);
    });
    wrong.forEach(function(i){ delete state.answers[i]; });
    if (wrong.length > 0) {
      state.idx = wrong[0];
      state.showResults = false;
      saveState();
      render();
    }
  }

  function copyRes(){
    var lines = ['[Grant] Advanced Vocabulary - 2026-06-23'];
    var correct = 0;
    qs.forEach(function(q,i){
      var ok = state.answers[i] === q.ci;
      if (ok) correct++;
      lines.push((i+1)+'. '+q.stem+' ['+q.tag+'] - '+(ok?'Correct':'Incorrect'));
    });
    lines.push('Score: '+correct+' / '+qs.length);
    var text = lines.join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(txt){
    var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  function openFreshModal(){
    document.getElementById('modal-overlay').style.display = 'flex';
  }
  function closeFreshModal(){
    document.getElementById('modal-overlay').style.display = 'none';
  }
  function confirmFresh(){
    state = { idx:0, answers:{}, showResults:false };
    saveState();
    closeFreshModal();
    render();
  }

  window.pick = pick;
  window.go = go;
  window.goToQ = goToQ;
  window.finishQuiz = finishQuiz;
  window.retryWrong = retryWrong;
  window.copyRes = copyRes;
  window.openFreshModal = openFreshModal;
  window.closeFreshModal = closeFreshModal;
  window.confirmFresh = confirmFresh;
  window.toggleJump = toggleJump;
  window.speak = speak;

  loadState();
  render();
})();
</script>
</body>
</html>
