<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
html{margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:2px 12px 8px;background:#fff;}
#attbar{text-align:center;font-size:0.8rem;color:#888;margin-bottom:6px;}

.timer-bar{background:#fff;border-bottom:1px solid #d0dce8;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}

#nav-bar{display:flex;align-items:center;gap:8px;margin:10px 0;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#1D9E75;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}

.q-tag{display:inline-block;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:6px;}
.box-ctx{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.92rem;color:#222;line-height:1.6;}
.q-stem{font-size:1.05rem;font-weight:700;color:#111;margin-bottom:14px;line-height:1.5;}
.ul{text-decoration:underline;font-style:normal;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.speak-btn{background:#e8edf4;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;line-height:1.4;}

.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}

.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.5;}

.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}

<body>

<div class="title-hd">[Sion] Advanced SAT Reading</div>
<div class="instruction">Read each passage or graphic carefully, then choose the best answer.</div>
<div id="attbar"></div>

<div class="timer-bar" id="timerBar">
  <div class="timer-setup" id="timerSetup">
    <label for="timerMinutesInput">Set Time Limit:</label>

  <div class="timer-running" id="timerRunning" style="display:none;">
    <span class="timer-label">Time Left</span>
    <span class="timer-display" id="timerDisplay">20:00</span>
  </div>
</div>

<div id="nav-bar">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / N</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #1D9E75;border-radius:14px;background:#fff;color:#1D9E75;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div id="tagWrap"><span class="q-tag" id="q-tag-label"></span></div>
  <div class="q-num" id="q-num"></div>
  <div class="box-ctx" id="box-ctx" style="display:none;"></div>
  <div class="word-row" id="word-row" style="display:none;">
    <span class="q-stem" id="q-stem-word" style="margin-bottom:0;"></span>
    <button class="speak-btn" onclick="speakStem()" title="Listen">&#128264;</button>
  </div>
  <div class="q-stem" id="q-stem"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" id="prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#1D9E75;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="saveWrongAnswers()" style="display:block;width:100%;padding:13px;background:#7b61ff;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Save Wrong Answers</button>
  <button onclick="openFreshModalOriginal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:12px;">Start Fresh (Original Order)</button>
  <button onclick="openFreshModalRandom()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh (Random Order)</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <h3 id="freshModalTitle" style="margin:0 0 10px;color:#185FA5;font-size:1.05rem;">Start Fresh?</h3>
    <p id="freshModalText" style="font-size:0.95rem;color:#444;margin:0 0 16px;">All progress will be cleared.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

var RAW_QUESTIONS = [{"tag": "Command of Evidence: If True", "box": "A team of urban ecologists is studying the number of coyote sightings reported in a mid-sized city over a five-year period, shown in the graph below. The researchers claim that a citywide ban on residential trash left overnight, enacted in 2021, failed to reduce coyote activity in the city.<br><svg width=\"280\" height=\"200\" viewBox=\"0 0 280 200\" style=\"display:block;margin:10px auto;\"><line x1=\"35\" y1=\"165\" x2=\"245\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"35\" y1=\"35\" x2=\"35\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"43.4\" y=\"107.4\" width=\"25.2\" height=\"57.6\" fill=\"#185FA5\"/><text x=\"56.0\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">2019</text><text x=\"56.0\" y=\"102.4\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">42</text><rect x=\"85.4\" y=\"112.9\" width=\"25.2\" height=\"52.1\" fill=\"#185FA5\"/><text x=\"98.0\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">2020</text><text x=\"98.0\" y=\"107.9\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">38</text><rect x=\"127.4\" y=\"95.1\" width=\"25.2\" height=\"69.9\" fill=\"#185FA5\"/><text x=\"140.0\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">2021</text><text x=\"140.0\" y=\"90.1\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">51</text><rect x=\"169.4\" y=\"77.2\" width=\"25.2\" height=\"87.8\" fill=\"#185FA5\"/><text x=\"182.0\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">2022</text><text x=\"182.0\" y=\"72.2\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">64</text><rect x=\"211.4\" y=\"56.7\" width=\"25.2\" height=\"108.3\" fill=\"#185FA5\"/><text x=\"224.0\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">2023</text><text x=\"224.0\" y=\"51.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">79</text></svg>", "stem": "Which finding, if true, would most directly support the researchers' claim?", "opts": ["Coyote sightings continued to rise in the years following the trash ordinance, even in neighborhoods with the highest rates of compliance.", "Coyote sightings were highest in 2023 among neighborhoods that had not yet adopted the trash ordinance.", "The city's coyote population declined sharply in regions bordering undeveloped parkland.", "Residents reported feeling safer walking at night after the ordinance was enacted."], "ci": 0, "exp": "The claim is that the trash ban failed to reduce coyote activity. A finding showing sightings kept rising even where the ordinance was followed most closely would directly support that the ban did not work, unlike the other choices, which either point to areas without the ordinance, an unrelated population decline, or unrelated resident perceptions."}, {"tag": "Command of Evidence: If True", "box": "A public health researcher compares the number of reported cases of a seasonal illness across four testing sites, shown in the graph below. The researcher hypothesizes that Site C's unusually high case count is the result of a data collection error rather than an actual outbreak.<br><svg width=\"280\" height=\"200\" viewBox=\"0 0 280 200\" style=\"display:block;margin:10px auto;\"><line x1=\"35\" y1=\"165\" x2=\"245\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"35\" y1=\"35\" x2=\"35\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"45.5\" y=\"98.1\" width=\"31.5\" height=\"66.9\" fill=\"#7b61ff\"/><text x=\"61.2\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">Site A</text><text x=\"61.2\" y=\"93.1\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">210</text><rect x=\"98.0\" y=\"134.7\" width=\"31.5\" height=\"30.3\" fill=\"#7b61ff\"/><text x=\"113.8\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">Site B</text><text x=\"113.8\" y=\"129.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">95</text><rect x=\"150.5\" y=\"56.7\" width=\"31.5\" height=\"108.3\" fill=\"#7b61ff\"/><text x=\"166.2\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">Site C</text><text x=\"166.2\" y=\"51.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">340</text><rect x=\"203.0\" y=\"107.6\" width=\"31.5\" height=\"57.4\" fill=\"#7b61ff\"/><text x=\"218.8\" y=\"180\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">Site D</text><text x=\"218.8\" y=\"102.6\" font-size=\"11\" text-anchor=\"middle\" fill=\"#222\">180</text></svg>", "stem": "Which finding, if true, would most directly undermine the researcher's hypothesis?", "opts": ["An independent audit found that Site C used the same testing procedures and equipment as the other three sites, all of which passed quality checks.", "Site C submitted its case counts several days later than the other sites.", "Site B, which reported the fewest cases, is located in a rural area with a smaller population.", "The four sites use different electronic record-keeping systems."], "ci": 0, "exp": "The researcher believes Site C's high count is due to a data error. Evidence that Site C's testing procedures and equipment were verified as accurate and consistent with the other sites would undermine the idea that an error caused the high number, unlike the other choices, which don't address whether the data itself is flawed."}, {"tag": "Central Ideas and Details", "box": "The following is adapted from a novel. The narrator recalls her grandmother's kitchen.<br><br>\"Even now, decades removed from that narrow kitchen with its cracked linoleum, I can summon the smell of cardamom the instant I close my eyes. My grandmother never measured anything; she cooked by instinct, by the sound a pan made when it was ready, by some private arithmetic she never bothered to explain. I used to think this careless as a habit. Now I understand it was a kind of trust, in her hands, in the years of practice behind them, that no recipe could replicate.\"", "stem": "Which choice best states the central idea of the passage?", "opts": ["The narrator has come to view her grandmother's intuitive cooking as an earned form of expertise rather than carelessness.", "The narrator regrets never learning her grandmother's exact recipes before she passed away.", "The narrator believes cooking without measurements always produces better results than following a recipe.", "The narrator is primarily describing the physical layout of her grandmother's kitchen."], "ci": 0, "exp": "The passage shifts from the narrator's earlier assumption that her grandmother's approach was \"careless\" to her present understanding that it reflected \"trust\" built from years of practice, showing a reevaluation of the grandmother's skill as genuine expertise, not a claim about all recipes or details about the kitchen's layout."}, {"tag": "Central Ideas and Details", "box": "The following is adapted from a memoir about the author's first year teaching in a rural school.<br><br>\"I had arrived that September armed with color-coded lesson plans and a conviction, borrowed from some education textbook, that structure alone could tame a classroom. By November, half my binders sat unopened on a shelf. What worked, I discovered almost by accident, was simpler and far less tidy: I stopped lecturing and started asking the students what they were curious about, then built the lessons around their questions instead of my outline.\"", "stem": "Which choice best describes a central detail that supports the passage's main point about the author's teaching?", "opts": ["The author's shift from relying on rigid, pre-planned lessons to building lessons around students' own questions.", "The author's decision to buy new binders at the start of the school year.", "The exact number of students enrolled in the author's classroom.", "The rural location of the school where the author was teaching."], "ci": 0, "exp": "The passage's main point is that flexible, student-driven teaching worked better than the author's original rigid plan, and the detail about abandoning the outline to build lessons from students' questions directly supports that point, unlike the unrelated details about binders, enrollment numbers, or the school's location."}, {"tag": "Command of Evidence: Textual Evidence", "box": "Historians have long debated whether the introduction of the printing press in fifteenth-century Europe primarily accelerated the spread of new ideas or primarily entrenched existing ones by making it cheaper to mass-produce religious texts already in wide circulation.<br><br>Passage: \"In its first fifty years of use, the printing press produced a far greater number of Bibles, psalters, and devotional texts than works of original scholarship. Print shops, driven by profit rather than by any mission to spread novel ideas, gravitated toward manuscripts with guaranteed audiences -- and nothing sold more reliably than texts the Church had already sanctioned for centuries.\"", "stem": "Which quotation from the passage most directly supports the claim that the printing press initially reinforced existing ideas rather than spreading new ones?", "opts": ["\"nothing sold more reliably than texts the Church had already sanctioned for centuries\"", "\"the printing press produced a far greater number of Bibles, psalters, and devotional texts\"", "\"Print shops, driven by profit rather than by any mission to spread novel ideas\"", "\"In its first fifty years of use\""], "ci": 0, "exp": "The strongest direct evidence for reinforcing existing ideas is the detail explaining why print shops favored already-sanctioned texts: because those texts \"sold more reliably,\" directly connecting the press's early output to entrenching established material rather than spreading new ideas."}, {"tag": "Command of Evidence: Textual Evidence", "box": "A marine biologist argues that coral bleaching events, though triggered by rising ocean temperatures, do not always result in the permanent death of a reef.<br><br>Passage: \"When water temperatures spike, corals expel the colorful algae living in their tissues, turning stark white -- a process called bleaching. Bleached coral is not dead coral. If temperatures drop again within a matter of weeks, many colonies can reabsorb algae and slowly regain both their color and their health, though repeated bleaching events in close succession leave far less room for this kind of recovery.\"", "stem": "Which quotation from the passage most directly supports the biologist's claim?", "opts": ["\"many colonies can reabsorb algae and slowly regain both their color and their health\"", "\"When water temperatures spike, corals expel the colorful algae living in their tissues\"", "\"repeated bleaching events in close succession leave far less room for this kind of recovery\"", "\"turning stark white -- a process called bleaching\""], "ci": 0, "exp": "The claim is that bleaching does not always cause permanent death. The strongest direct support is the statement that colonies \"can reabsorb algae and slowly regain both their color and their health,\" which describes actual recovery, unlike the other quotations, which describe the bleaching process itself or a limit on recovery."}, {"tag": "Inferences", "box": "The following is adapted from a short story. A violinist, once celebrated, now teaches beginners in a small studio.<br><br>\"She no longer corrected her students' posture with her hands, the way her own teacher once had, guiding an elbow or a wrist into place with brisk, wordless confidence. Instead she demonstrated from across the room, bow lifted, and waited. It took her students longer to learn this way. She told herself it was a better method, one that built independence rather than dependence. She did not tell them why her hands, these days, could no longer hold a position for very long.\"", "stem": "Which inference about the violinist is most strongly supported by the passage?", "opts": ["Her change in teaching method is likely connected to a physical limitation she has not disclosed to her students.", "She believes her new teaching method is objectively worse than her former teacher's approach.", "She has decided her students are not talented enough to deserve hands-on correction.", "She plans to stop teaching violin entirely within the near future."], "ci": 0, "exp": "The passage juxtaposes her stated reason (\"a better method\") with the withheld detail that her hands \"could no longer hold a position for very long,\" strongly implying her teaching change is connected to an undisclosed physical limitation, rather than a genuine belief the new method is worse, a judgment about her students' talent, or a plan to quit."}, {"tag": "Inferences", "box": "The following is adapted from a nonfiction account of a small-town newspaper.<br><br>\"The paper had run without interruption for ninety-one years, through two mill closures and a flood that swallowed half of Main Street, but its editor now found herself checking, every quarter, whether the ad revenue would cover printing costs for another season. She had stopped ordering new office furniture two years ago. She still smiled, every Friday, when the delivery van pulled away loaded with the week's edition.\"", "stem": "Which inference is most strongly supported by the passage?", "opts": ["The editor takes pride in the paper's continued publication even as she quietly manages its uncertain financial future.", "The editor is certain the newspaper will close within the next year.", "The mill closures and flood caused more financial damage to the paper than its current advertising shortfall.", "The editor no longer values the newspaper's history or legacy."], "ci": 0, "exp": "Details like tracking ad revenue \"every quarter\" and avoiding new furniture purchases show quiet financial strain, while her smile each Friday shows continued pride in the paper's publication, together supporting the inference of pride paired with quiet concern -- not certainty of closure, an unsupported financial comparison, or indifference to the paper's legacy."}, {"tag": "Cross-Text Connections", "box": "Text 1: Economist Rina Patel argues that remote work arrangements, adopted widely after 2020, have permanently reduced worker productivity by eliminating the spontaneous, informal exchanges that occur in shared office spaces.<br><br>Text 2: Economist David Ostrander argues that productivity data collected since 2020 show no consistent decline associated with remote work, and that any measured drops are better explained by broader economic disruptions occurring during the same period.", "stem": "How would Ostrander (Text 2) most likely respond to Patel's argument (Text 1)?", "opts": ["He would question whether the productivity decline Patel attributes to remote work can be separated from other economic disruptions happening at the same time.", "He would agree that informal office exchanges are essential but argue they can be fully replicated online.", "He would argue that remote work has increased productivity in every industry without exception.", "He would concede that Patel's data collection methods were flawed from the start."], "ci": 0, "exp": "Ostrander's position, that measured drops are \"better explained by broader economic disruptions,\" directly challenges Patel's causal claim by questioning whether remote work itself, rather than other factors, truly explains the change, which the other choices misrepresent or overstate."}, {"tag": "Cross-Text Connections", "box": "Text 1: A city planner contends that building more highway lanes is an effective long-term solution to traffic congestion because it immediately increases the road's capacity to handle vehicles.<br><br>Text 2: A transportation researcher argues that expanding highways tends to induce additional driving over time, a phenomenon known as induced demand, so that congestion levels often return to previous levels within a few years of construction.", "stem": "Which choice best describes the relationship between the two texts?", "opts": ["Text 2 challenges the long-term effectiveness of the solution proposed in Text 1 by introducing a factor Text 1 does not address.", "Text 2 provides additional statistical support for the claim made in Text 1.", "Text 1 and Text 2 describe the same phenomenon using different terminology but reach identical conclusions.", "Text 2 focuses on a completely unrelated transportation issue not addressed in Text 1."], "ci": 0, "exp": "Text 2 introduces \"induced demand,\" a concept absent from Text 1, to argue that the short-term capacity increase Text 1 praises does not hold up long-term, which directly challenges Text 1's claim rather than supporting it, restating it identically, or ignoring it."}, {"tag": "Transitions", "box": "Researchers initially assumed that the newly discovered cave system was completely unexplored. ___, faint charcoal markings near the entrance suggested that people had ventured at least partway into the cave centuries earlier.", "stem": "Which choice most logically completes the sentence?", "opts": ["Subsequent evidence indicated otherwise:", "In a similar vein,", "As a further illustration,", "Correspondingly,"], "ci": 0, "exp": "The second sentence presents evidence that contradicts the initial assumption stated in the first sentence, so a transition signaling a correction or contrast, \"Subsequent evidence indicated otherwise,\" is needed rather than one signaling similarity, illustration, or correspondence."}, {"tag": "Transitions", "box": "The committee's proposal promised to cut administrative costs within a single fiscal year. ___, the plan required hiring an entirely new compliance department, a cost the original proposal never accounted for.", "stem": "Which choice most logically completes the sentence?", "opts": ["Yet in practice,", "As a result,", "In the same way,", "To that end,"], "ci": 0, "exp": "The second clause reveals a hidden cost that undercuts the promise made in the first sentence, so a transition signaling contrast between the claim and the reality, \"Yet in practice,\" fits best rather than one signaling a result, a similarity, or a shared purpose."}];

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; }
    else { state = defaultState(); }
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }
function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10) || 0; }catch(e){ return 0; } }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if (!state.timerStartedAt) { setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now() - state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if (remaining <= 0){ displayEl.textContent = "Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if (remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if (remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if (!minutes || minutes<=0) minutes = 20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function resetTimer(){ state.timerTotalSec=null; state.timerStartedAt=null; saveState(); stopTimerInterval(); renderTimer(); }

function getShuffle(i){
  if (!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel'); var b=document.getElementById('jump-btn');
  if (p.style.display==='none' || !p.style.display){ p.style.display='block'; b.textContent='Hide ▴'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump ▾'; }
}
function renderDots(){
  var p=document.getElementById('dot-panel');
  if (p.style.display!=='block') return;
  var h='';
  for (var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if (Object.keys(state.answers).length === qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump ▾';
}

function speakStem(){
  try{
    window.speechSynthesis.cancel();
    var txt = qs[state.cur].speak || qs[state.cur].stemText || qs[state.cur].stem;
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = TTS_LANG;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function showResults(){
  state.showResults = true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('attbar').textContent = 'Total Attempts: ' + loadAttempts();
  if (state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;

  var tagWrap = document.getElementById('tagWrap');
  var tagEl = document.getElementById('q-tag-label');
  if (q.tag){
    tagWrap.style.display='block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagWrap.style.display='none';
  }

  var bc = document.getElementById('box-ctx');
  if (q.box){ bc.style.display='block'; bc.innerHTML = q.box; }
  else { bc.style.display='none'; bc.innerHTML=''; }

  var wr = document.getElementById('word-row');
  var qsw = document.getElementById('q-stem-word');
  var qs2 = document.getElementById('q-stem');
  if (HAS_SPEAK){
    wr.style.display='flex';
    qsw.innerHTML = q.stem;
    qs2.style.display='none';
    qs2.innerHTML='';
  } else {
    wr.style.display='none';
    qs2.style.display='block';
    qs2.innerHTML = q.stem;
  }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for (var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn'; var dis='';
    if (ans !== undefined){
      dis='disabled';
      if (s===csi) cls+=' correct';
      else if (s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if (ans !== undefined && ans !== csi){ eb.style.display='block'; eb.innerHTML = q.exp; }
  else { eb.style.display='none'; }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'Show Results →' : 'Next';
  document.getElementById('prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i]===undefined) sk++;
    else if (state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if (a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Question '+(i+1)+(qs[i].tag?' ('+qs[i].tag+')':'')+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = si;
  saveState(); render();
}
function go(dir){
  if (dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i] !== undefined && state.answers[i] !== getCSI(i)){
      if (first===-1) first=i;
      delete state.answers[i];
    }
  }
  if (first !== -1){ state.cur=first; state.showResults=false; saveState(); render(); }
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    lines.push('Q'+(i+1)+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if (navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}

function saveWrongAnswers(){
  try{
    var wrong=[];
    for (var i=0;i<qs.length;i++){
      var a = state.answers[i];
      if (a===undefined) continue;
      var csi = getCSI(i);
      if (a===csi) continue;
      var sh = getShuffle(i);
      var pickedOriginal = sh[a];
      wrong.push({ q: qs[i].stem, opts: qs[i].opts, ci: qs[i].ci, picked: pickedOriginal });
    }
    if (wrong.length === 0){ alert('No wrong answers to save.'); return; }
    var payload = { child: QUIZ_CHILD, subject: QUIZ_SUBJECT, date: QUIZ_DATE, wrong: wrong };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'wronganswers_' + QUIZ_CHILD + '_' + QUIZ_DATE + '_' + QUIZ_KEY + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }catch(e){
    try{ alert('Could not save wrong answers.'); }catch(e2){}
  }
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if (mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.saveWrongAnswers=saveWrongAnswers; window.speakStem=speakStem;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.startTimer=startTimer;

var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again/i;
document.addEventListener('click', function(ev){
  var el = ev.target, depth=0;
  while (el && depth<4){
    var isClickable = el.tagName==='BUTTON' || el.tagName==='A';
    if (isClickable){
      var txt = (el.textContent||'').trim();
      if (txt.length>0 && txt.length<40 && qzRetryRe.test(txt)){ resetTimer(); return; }
    }
    el = el.parentElement; depth++;
  }
}, true);

loadState(); saveState();
render();
if (state.timerStartedAt) startTimerInterval();

})();
</script>
</body>
</html>
