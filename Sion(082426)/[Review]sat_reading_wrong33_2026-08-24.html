var RAW_QUESTIONS = [{"tag": "Information and Ideas", "box": "Excerpt from Little Women (Louisa May Alcott, 1868)<br><br>\"I wish I had my little violin here,\" said Beth, \"but Papa says it's not worth mending, and I really don't think it's worth much. But I like it,\" she continued, in a voice which had a plaintive little quaver in it, and which showed that in spite of her wish, the old song did not seem more cheerful.", "stem": "Based on the text, what is true about the two oldest March girls?", "opts": ["They were discouraged by their parents from seeking outside employment.", "They looked for jobs despite their parents' reservations about the idea.", "They voluntarily accepted lower wages than they were promised.", "They lost their money because of a mistake they made at work."], "ci": 1, "exp": "The passage indicates the two oldest girls went out to work even though their parents had reservations about it, matching choice B. Nothing in the text supports the other options being true.", "orig": 6}, {"tag": "Information and Ideas", "box": "Excerpt from The Innocents Abroad (Mark Twain, 1869)<br><br>The ship plows through heavy seas under gray, lowering skies as it makes its way toward a destination known for cold winds and frequent storms.", "stem": "Which choice best states the main idea of the text?", "opts": ["The narrator regrets choosing to take this particular voyage.", "The ship's crew is unprepared for the conditions ahead.", "The weather is unpleasant where the ship is heading.", "The passengers are excited about reaching their destination."], "ci": 2, "exp": "The description of gray skies, heavy seas, and a destination known for cold winds and storms centers on unpleasant weather conditions, making C the main idea.", "orig": 9}, {"tag": "Command of Evidence", "box": "A team of astrophysicists studied the ages of stars in the Milky Way's thin disk and thick disk using asteroseismology. Thin disk stars are typically younger and located closer to the galactic plane, while thick disk stars are older and more dispersed vertically.", "stem": "Which finding, if true, would most directly support the astrophysicists' claim?", "opts": ["Stars in the thin disk and thick disk share nearly identical chemical compositions.", "The average age of stars in the thin disk differs from that of the thick disk by about 2 billion years.", "Both disks contain roughly the same number of stars.", "Stars closer to the galactic plane move at similar velocities to those farther away."], "ci": 1, "exp": "A measurable age gap of about 2 billion years between the two populations directly supports the claim that thin disk stars are younger than thick disk stars.", "orig": 35}, {"tag": "Command of Evidence", "box": "Claim: In The Bell Jar, Sylvia Plath uses Esther's observations of Doreen to highlight Esther's feelings of being an outsider among her peers.", "stem": "Which quotation from The Bell Jar most effectively illustrates the claim?", "opts": ["\"Doreen singled me out right away. She made me feel I was that much sharper than the others, and she really was very funny.\"", "\"I liked looking on at other people in crucial situations.\"", "\"I felt myself shrinking to a small black dot against all those red and white rugs.\"", "\"Doreen had bright white hair standing out in a cotton candy fuzz around her head.\""], "ci": 0, "exp": "This quotation directly shows Esther observing Doreen and reflecting on how Doreen makes her feel different from the others, illustrating Esther's sense of being an outsider.", "orig": 37}, {"tag": "Command of Evidence", "box": "A study measured the average shelf life of unopened champagne in various bottle sizes: 750 mL bottles lasted about 40 years, 1.5 L bottles (magnums) about 82 years, and 3 L bottles (jeroboams) about 132 years, before the champagne was judged to have degraded in quality.", "stem": "Which finding, if true, would most directly undermine the researchers' claim that larger bottles preserve champagne quality longer?", "opts": ["750 mL bottles were found to last 40 years, 1.5 L bottles 82 years, and 3 L bottles 132 years.", "Bottle size had no measurable effect on the rate of oxidation in any of the samples tested.", "All bottle sizes were stored in identical cellar conditions throughout the study.", "Champagne quality was assessed by the same panel of tasters for every bottle size."], "ci": 1, "exp": "The question asks which finding would UNDERMINE the claim that larger bottles preserve champagne longer. A finding that bottle size had no measurable effect on oxidation would directly contradict (undermine) that claim, unlike the reported shelf-life data, which actually supports it.", "orig": 38}, {"tag": "Command of Evidence", "box": "Researchers tracked the timing of spring arrival and bird breeding over several decades, finding that spring conditions now begin about 7 days earlier than in the past, while birds have shifted their breeding to begin about 25 days earlier.", "stem": "Which finding, if true, would most directly support the researchers' claim that birds' breeding schedules are outpacing the shift in spring's arrival?", "opts": ["Spring now begins about 7 days earlier than before, while birds breed about 25 days earlier than before.", "Bird populations have declined steadily over the same time period.", "Spring and bird breeding have shifted by the same number of days.", "Birds in warmer climates breed earlier than birds in colder climates."], "ci": 0, "exp": "A 25-day shift in breeding compared to only a 7-day shift in spring's arrival shows breeding schedules changing faster than spring itself, directly supporting the claim.", "orig": 40}, {"tag": "Command of Evidence", "box": "A study compared glial cell activity in students during online versus offline (in-person) learning, finding that offline learning was associated with a 15% increase in glutamate levels linked to synaptic plasticity, compared to online learning.", "stem": "Which finding, if true, would most directly undermine the researchers' hypothesis that offline learning promotes greater synaptic plasticity than online learning?", "opts": ["Offline learning was associated with a 15% increase in glutamate levels compared to online learning.", "Glutamate levels were unrelated to any measure of learning outcomes in either group.", "Students in both groups reported similar levels of engagement.", "The study included an equal number of participants in each group."], "ci": 1, "exp": "The question asks which finding would UNDERMINE the hypothesis that offline learning promotes greater synaptic plasticity. A finding that glutamate levels were unrelated to any learning outcome would undermine the hypothesis by breaking the link between the measured glutamate increase and actual plasticity/learning benefit.", "orig": 42}, {"tag": "Information and Ideas", "box": "A study of chili pepper farms in Benin found that salt stress from irrigation practices was reducing crop yields, but many local farmers continued the same irrigation methods.", "stem": "Which choice best describes a problem faced by chili pepper farmers in Benin, as presented in the text?", "opts": ["Farmers do not realize the problem of salt stress affecting their crops.", "Farmers lack access to irrigation systems entirely.", "Farmers are unable to grow chili peppers in Benin's climate.", "Farmers have switched to crops that require less water."], "ci": 0, "exp": "The text indicates farmers keep using the same irrigation practices despite the salt stress problem, implying they are not aware of the issue, matching choice A.", "orig": 64}, {"tag": "Inferences", "box": "Bergmann's Rule states that within a species, populations in colder climates tend to have larger body sizes than populations in warmer climates, in part because a larger body has a lower surface-area-to-volume ratio.", "stem": "Which choice most logically completes the text?<br><br>Animals living in warmer climates tend to be smaller because ___", "opts": ["they require more surface area to disperse excess body heat.", "they do not need to store as much fat for warmth.", "they have access to more abundant food resources.", "they migrate more frequently than animals in colder climates."], "ci": 1, "exp": "Smaller body size in warm climates is linked to reduced need for fat insulation used to retain heat in cold climates, matching choice B.", "orig": 71}, {"tag": "Information and Ideas", "box": "Radiocarbon dating and dendrochronology (tree-ring dating) are both used to estimate the age of wood samples. Dendrochronology relies on the pattern of annual growth rings, which can vary by species and region.", "stem": "According to the text, what is an advantage of dendrochronology over radiocarbon dating?", "opts": ["It requires a smaller sample of wood to analyze.", "It can be used on materials other than wood.", "It produces results more quickly than radiocarbon dating.", "The species of the tree can also be determined."], "ci": 3, "exp": "Because dendrochronology depends on ring patterns that vary by species and region, analysis of those patterns can also reveal the species of the tree, an advantage not offered by radiocarbon dating alone.", "orig": 79}, {"tag": "Inferences", "box": "A study of napping habits and brain volume was conducted using a sample of participants from a single country, finding a correlation between regular napping and greater brain volume.", "stem": "Which choice most logically completes the text?<br><br>A limitation of the study is that ___", "opts": ["napping was not clearly defined for participants.", "the study's implications may not apply to individuals of different nationalities.", "brain volume was measured using outdated equipment.", "participants were not monitored over a long period of time."], "ci": 1, "exp": "Since the sample was drawn from a single country, the findings may not generalize to people of other nationalities, which is the limitation identified in choice B.", "orig": 83}, {"tag": "Inferences", "box": "A bill required 60 votes to pass in the US Senate, a supermajority threshold intended to ensure broader agreement before legislation advances.", "stem": "Which choice most logically completes the text?<br><br>Requiring 60 votes rather than a simple majority ensures that a passed bill ___", "opts": ["is supported unanimously by all senators.", "reflects the views of only the majority party.", "accurately represents the overall sentiment of the Senate.", "can be passed more quickly than under simple majority rules."], "ci": 2, "exp": "A supermajority requirement is meant to ensure broader agreement, so a bill that clears this threshold better reflects overall Senate sentiment, matching choice C.", "orig": 84}, {"tag": "Words in Context", "box": "In Timbulsloko, Indonesia, rising sea levels have caused water to gradually ___ rice fields, forcing many farmers to abandon crops that once thrived in the area.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["nurture", "overlook", "vanquish", "replenish"], "ci": 2, "exp": "\"Vanquish\" conveys the idea of the rising water overtaking and destroying the rice fields, consistent with farmers abandoning crops.", "orig": 98}, {"tag": "Words in Context", "box": "NASA's Artemis program included a mannequin ___ \"Commander Moonikin Campos,\" equipped with sensors to measure radiation exposure during the mission.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["disguised", "renamed", "resembled", "termed"], "ci": 3, "exp": "\"Termed\" fits naturally with giving the mannequin a specific name, indicating what it was called.", "orig": 104}, {"tag": "Words in Context", "box": "Cuba's literacy campaign of the 1960s ___ its efforts over several years, ultimately raising the national literacy rate dramatically.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["abandoned", "interrupted", "sustained", "reduced"], "ci": 2, "exp": "\"Sustained\" reflects the campaign continuing its efforts over several years, consistent with the dramatic rise in literacy described.", "orig": 106}, {"tag": "Words in Context", "box": "Knitting relies on just two basic stitches, knit and purl, though these two basic stitches can be combined in ___ ways to create an infinite number of complex patterns.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["sizeable", "immense", "impervious", "myriad"], "ci": 3, "exp": "\"Myriad,\" meaning countless or innumerable, fits best with describing the vast number of ways two basic stitches can be combined to create complex patterns.", "orig": 111}, {"tag": "Craft and Structure", "box": "Excerpt from The Beautiful and Damned (F. Scott Fitzgerald, 1922)<br><br>Anthony was astonishing in that role, playing it with an ease that made those around him seem clumsy and slow by comparison.", "stem": "In the text, what is the function of the word \"astonishing\"?", "opts": ["It suggests that Anthony's performance was unexpected given his reputation.", "It implies that others doubted Anthony's abilities beforehand.", "It contrasts Anthony's role with a role he played previously.", "It emphasizes Anthony's talent."], "ci": 3, "exp": "Describing Anthony as \"astonishing\" in a role he performs with ease, making others look clumsy by comparison, functions to emphasize how talented he is.", "orig": 128}, {"tag": "Text Structure and Purpose", "box": "Sarah Mann's research on vegan diets found that, contrary to common assumptions, participants following a vegan diet had comparable protein intake to non-vegan participants when meals were properly planned.", "stem": "Which choice best describes the function of the underlined portion of the text?", "opts": ["It presents a hypothesis that the researcher later disproves.", "It challenges a popular stereotype regarding a certain diet.", "It summarizes the methodology used in the study.", "It introduces a competing study with different findings."], "ci": 1, "exp": "The finding runs counter to a common assumption about vegan diets lacking adequate protein, functioning to challenge a popular stereotype, per choice B.", "orig": 134}, {"tag": "Text Structure and Purpose", "box": "Hibiscadelphus wilderianus, a plant species once native to Hawaii, is now extinct. Its flowers were shaped specifically to be pollinated by a particular curved-beaked bird species, which itself later went extinct.", "stem": "Which choice best describes the function of the underlined portion of the text?", "opts": ["It provides a counterexample to the claim made in the previous sentence.", "It gives the logic for the following claim.", "It restates the main idea of the passage in different words.", "It introduces a new topic unrelated to the rest of the passage."], "ci": 1, "exp": "Explaining that the flower shape was specific to a particular pollinator sets up the logic for the claim (implied to follow) about why the plant went extinct once its pollinator disappeared.", "orig": 135}, {"tag": "Craft and Structure", "box": "Excerpt from Bleak House (Charles Dickens, 1853)<br><br>Fog everywhere. Fog up the river, where it flows among green aits and meadows; fog down the river, where it rolls defiled among the tiers of shipping.", "stem": "Which choice best describes the function of the underlined portion of the text?", "opts": ["It establishes the typical weather pattern of an area.", "It foreshadows a dramatic plot twist later in the novel.", "It introduces a character central to the story.", "It contrasts the city with the countryside."], "ci": 0, "exp": "The repeated descriptions of fog across various locations along the river establish this pervasive fog as the typical, characteristic weather condition of the setting.", "orig": 136}, {"tag": "Craft and Structure", "box": "Excerpt from Villette (Charlotte Bronte, 1853)<br><br>My godmother's house was a very calm, quiet, well-ordered place, though the peace it offered was soon to change in ways I could not have foreseen.", "stem": "Which choice best describes the function of the underlined portion of the text?", "opts": ["It emphasizes the narrator's fondness for her godmother.", "It provides a detailed physical description of the house.", "It hints at a change in circumstances to come.", "It contrasts the narrator's godmother with her own parents."], "ci": 2, "exp": "Noting that the peaceful household was \"soon to change in ways I could not have foreseen\" hints at upcoming changes in the narrator's circumstances.", "orig": 139}, {"tag": "Text Structure and Purpose", "box": "Excerpt from Christina Alberta's Father (H.G. Wells, 1925)<br><br>Mr. Preemby found himself beset on all sides: by his landlady's complaints, by his daughter's demands, and by his own uncertainty about what path to take next.", "stem": "Which choice best describes the function of the underlined portion of the text?", "opts": ["It discusses many challenges facing a character.", "It highlights a single conflict central to the plot.", "It introduces a resolution to the character's problems.", "It shifts the narrative focus to a secondary character."], "ci": 0, "exp": "Listing several distinct sources of difficulty (landlady's complaints, daughter's demands, his own uncertainty) functions to discuss the many challenges facing this character.", "orig": 146}, {"tag": "Craft and Structure", "box": "Excerpt from To Kill a Mockingbird (Harper Lee, 1960)<br><br>Maycomb was an old town, but it was a tired old town when I first knew it. Somehow, it was hotter then; men's stiff collars wilted by nine in the morning.", "stem": "Which choice best describes the function of the underlined portion of the text as a whole?", "opts": ["To provide a historical account of Maycomb's founding.", "To introduce a conflict between two central characters.", "To argue that Maycomb has changed for the better over time.", "To flashback at moments that will affect the novel's plot."], "ci": 3, "exp": "Opening with a retrospective, scene-setting description signals a narrative that will flash back to establish moments and context relevant to the novel's plot.", "orig": 147}, {"tag": "Text Structure and Purpose", "box": "Researchers at UC San Francisco studying basketball free throws found that repeated practice of a specific motion strengthens the neural pathways associated with that motion, forming what is known as motor memory.", "stem": "Which choice best describes the function of the underlined portion of the text?", "opts": ["It begins with an analogy meant to explain the process that creates motor memories.", "It presents a counterargument to the study's main claim.", "It summarizes the study's overall conclusion.", "It questions the validity of the researchers' methodology."], "ci": 0, "exp": "Using basketball free throws as a concrete, relatable example functions as an analogy to explain the abstract process by which motor memories are formed.", "orig": 148}, {"tag": "Cross-Text Connections", "box": "Text 1: Some scientists argue that subsurface oceans on icy moons could harbor conditions suitable for microbial life, based on the presence of liquid water and chemical energy sources.<br><br>Text 2: A separate team contends that many exoplanets, despite lacking Earth-like surface conditions, may have subsurface regions with similar water and energy characteristics to those icy moons.", "stem": "Based on the texts, how would the scientists in Text 2 most likely respond to the argument in Text 1?", "opts": ["By arguing that subsurface life is impossible without direct sunlight.", "By dismissing the relevance of icy moons to the search for life.", "It is plausible, as many planets could contain life in subsurface regions similar to those described in Text 1.", "By insisting that only moons, not planets, can suppo function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; }
    else { state = defaultState(); }
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }
function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10) || 0; }catch(e){ return 0; } }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if (!state.timerStartedAt) { setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now() - state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if (remaining <= 0){ displayEl.textContent = "Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if (remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if (remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if (!minutes || minutes<=0) minutes = 35;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function resetTimer(){ state.timerTotalSec=null; state.timerStartedAt=null; saveState(); stopTimerInterval(); renderTimer(); }

function getShuffle(i){
  if (!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel'); var b=document.getElementById('jump-btn');
  if (p.style.display==='none' || !p.style.display){ p.style.display='block'; b.textContent='Hide ▴'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump ▾'; }
}
function renderDots(){
  var p=document.getElementById('dot-panel');
  if (p.style.display!=='block') return;
  var h='';
  for (var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if (Object.keys(state.answers).length === qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump ▾';
}

function showResults(){
  state.showResults = true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('attbar').textContent = 'Total Attempts: ' + loadAttempts();
  if (state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length + ' (Book #' + q.orig + ')';

  var tagWrap = document.getElementById('tagWrap');
  var tagEl = document.getElementById('q-tag-label');
  if (q.tag){
    tagWrap.style.display='block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagWrap.style.display='none';
  }

  var bc = document.getElementById('box-ctx');
  if (q.box){ bc.style.display='block'; bc.innerHTML = q.box; }
  else { bc.style.display='none'; bc.innerHTML=''; }

  document.getElementById('q-stem').innerHTML = q.stem;

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for (var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn'; var dis='';
    if (ans !== undefined){
      dis='disabled';
      if (s===csi) cls+=' correct';
      else if (s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if (ans !== undefined && ans !== csi){ eb.style.display='block'; eb.innerHTML = q.exp; }
  else { eb.style.display='none'; }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'Show Results →' : 'Next';
  document.getElementById('prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i]===undefined) sk++;
    else if (state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if (a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Question '+(i+1)+(qs[i].tag?' ('+qs[i].tag+')':'')+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = si;
  saveState(); render();
}
function go(dir){
  if (dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i] !== undefined && state.answers[i] !== getCSI(i)){
      if (first===-1) first=i;
      delete state.answers[i];
    }
  }
  if (first !== -1){ state.cur=first; state.showResults=false; saveState(); render(); }
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    lines.push('Q'+(i+1)+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if (navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}

function saveWrongAnswers(){
  try{
    var wrong=[];
    for (var i=0;i<qs.length;i++){
      var a = state.answers[i];
      if (a===undefined) continue;
      var csi = getCSI(i);
      if (a===csi) continue;
      var sh = getShuffle(i);
      var pickedOriginal = sh[a];
      wrong.push({ q: qs[i].stem, opts: qs[i].opts, ci: qs[i].ci, picked: pickedOriginal });
    }
    if (wrong.length === 0){ alert('No wrong answers to save.'); return; }
    var payload = { child: QUIZ_CHILD, subject: QUIZ_SUBJECT, date: QUIZ_DATE, wrong: wrong };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'wronganswers_' + QUIZ_CHILD + '_' + QUIZ_DATE + '_' + QUIZ_KEY + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }catch(e){
    try{ alert('Could not save wrong answers.'); }catch(e2){}
  }
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if (mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.startTimer=startTimer;

var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again/i;
document.addEventListener('click', function(ev){
  var el = ev.target, depth=0;
  while (el && depth<4){
    var isClickable = el.tagName==='BUTTON' || el.tagName==='A';
    if (isClickable){
      var txt = (el.textContent||'').trim();
      if (txt.length>0 && txt.length<40 && qzRetryRe.test(txt)){ resetTimer(); return; }
    }
    el = el.parentElement; depth++;
  }
}, true);

loadState(); saveState();
render();
if (state.timerStartedAt) startTimerInterval();

})();
</script>
