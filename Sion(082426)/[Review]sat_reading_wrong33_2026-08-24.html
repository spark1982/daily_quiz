.", "stem": "What is the main idea of the text?", "opts": ["A voyage has a very inauspicious beginning.", "The weather is unpleasant where the ship is going.", "It is busy and exciting as people prepare for a journey.", "Many people are worried about what will happen."], "ci": 0, "exp": "The passage describes a supposed \"pleasure excursion\" that instead looks gloomy, chaotic, and disheartened (drizzling rain, droopy passengers, a limp flag), directly matching the idea of an inauspicious (unlucky/unpromising) beginning to the voyage, choice A.", "orig": 9}, {"tag": "Command of Evidence", "box": "A team of astrophysicists believe that the Milky Way's Galactic disk has both a late phase and an earlier phase of formation. The discovery was made by reconstructing the ages of the stars in the Milky Way galaxy. For the study, the astrophysicists referred to data collected during the Gaia mission and the LAMOST survey, covering a total of more than 1.5 billion stars and information about their positions, temperature, and chemical compositions.", "stem": "Which finding, if true, would most directly support the astrophysicists' claim?", "opts": ["The stars observed in the Milky Way have similar temperatures and relative distances.", "The age of the stars in the thin disk differ from that of the stars in the thick disk by about 2 billion years.", "The age of some stars in the thick disk differs from that of other stars in the thick disk by about 2 billion years.", "The formation process of all stars observed in the thick disk share many similarities."], "ci": 1, "exp": "A measurable age gap of about 2 billion years specifically between the thin disk and thick disk populations directly supports the claim of two distinct formation phases (an earlier and a later one).", "orig": 35}, {"tag": "Command of Evidence", "box": "The Bell Jar is a 1963 novel by American author Sylvia Plath. In the novel, the narrator describes her inability to relate to the fellow girls in her New York stem": "Which finding, if true, would most directly undermine the conclusion of the study?", "opts": ["750-milliliter bottles have an estimated shelf life of 40 years, 1.5-liter bottles can last for 82 years, and 3-liter bottles can remain carbonated for 132 years.", "750-milliliter bottles have an estimated shelf life of 132 years, 1.5-liter bottles can last for 82 years, and 3-liter bottles can remain carbonated for 40 years.", "Bottles of any size that are sealed with corks remain carbonated for 12 years longer than bottles of any size that are sealed with caps.", "Bottles of any size that are sealed with caps remain carbonated for 12 years longer than bottles of any size that are sealed with corks."], "ci": 1, "exp": "The study concludes larger bottles retain carbonation longer than smaller ones. A finding showing the opposite pattern -- smaller bottles (750 mL) lasting far longer (132 years) than larger ones (3 L lasting only 40 years) -- directly reverses and undermines that conclusion.", "orig": 38}, {"tag": "Command of Evidence", "box": "A recent study reveals that rising global temperatures are affecting birds' ability to recognize the start of spring and breed accordingly. Typically, birds begin breeding when the first signs of spring appear, such as budding flowers. Breeding at the wrong time leads to decreased productivity in producing young; with climate change causing spring-like conditions earlier than expected, birds are struggling to keep up. This mismatch between spring and birds' readiness to reproduce is expected to worsen with further warming, posing catastrophic consequences for many bird populations.", "stem": "Which finding, if true, would most directly support the findings of the study?", "opts": ["Spring is expected to occur 7 days earlier by the end of the century, but birds will start breeding approximately 25 days earlier.", "Spring is expected to occur 25 days earlier by the end of the century, but birds will only start breeding approximately 7 days earlier.", "Spring is expected to occur 25 days later by the end of the century, but birds will only start breeding approximately 7 days earlier.", "Spring is expected to occur 25 days later by the end of the century, but birds will start breeding approximately 7 days later."], "ci": 1, "exp": "The study claims birds are \"struggling to keep up\" with spring's earlier arrival. A finding where spring shifts by a large amount (25 days) while birds only manage a smaller shift (7 days) shows birds falling behind, directly supporting the study's claim of a worsening mismatch.", "orig": 40}, {"tag": "Command of Evidence", "box": "Researchers have discovered that online and offline learning are distinct processes governed by different cellular mechanisms. Glial cells, previously thought to simply fill gaps between neurons, play a role in information processing in the brain. They release gliotransmitters like glutamate, which can influence memory formation and modulate plasticity. In an experiment using mice, activating glial cells enhanced online learning, while inhibiting them suppressed it.", "stem": "Which finding, if true, would most directly undermine the conclusion of the study?", "opts": ["Offline learning performing outcomes increased by 15% when excess levels of glutamate were released in the brain.", "Offline learning performing outcomes decreased by 15% when excess levels of glutamate were released in the brain.", "Online learning performing outcomes increased by 15% when excess levels of glutamate were released in the brain.", "Online learning performing outcomes decreased by 15% when excess levels of glutamate were released in the brain."], "ci": 3, "exp": "The study concludes that activating glial cells (which release glutamate) enhances online learning. A finding that excess glutamate actually decreased online learning performance directly contradicts and undermines that conclusion.", "orig": 42}, {"tag": "Information and Ideas", "box": "Salt stress, too much salt in the soil for plants to thrive, is one of the major environmental constraints limiting agricultural productivity and influencing the concentration of bioactive compounds of vegetables. A recent study assessed the effect of NaCl salt stress on flowering, fructification and fruit nutritional quality of a local cultivar of chili pepper. Chili pepper belongs to the crops grown throughout the world for their nutraceutical (nutritional and medicinal) and economic virtue. In Benin, chili is the second cash gardening crop after the tomato. Its annual production is about 47.162 tons. Pepper plants produce the compound capsaicin, primarily in the fruits, possibly to deter mammalian herbivores. In Benin, chili pepper is grown only for food partially in the cultivable lands of the coastal areas, where soil salinity and water irrigation are a reality. Therefore, it is most likely true about chili pepper production in Benin that ____", "stem": "Which choice most logically completes the text?", "opts": ["farmers do not realize the problem of salt stress.", "it is an important source of income for many farmers.", "it is one of the largest sectors of the economy.", "most plants produce no fruits because of salt."], "ci": 1, "exp": "The passage establishes chili as an important cash crop (second cash gardening crop after tomato, with substantial annual production of over 47,000 tons) grown in areas facing real salinity constraints, so it logically follows that it remains an important income source for farmers despite the challenge.", "orig": 64}, {"tag": "Inferences", "box": "Bergmann's Rule is a biological observation made in 1847 which points out that within a species, body mass increases as the climate gets colder, so animals at higher latitudes have less surface area compared to the mass. For example, Canadian deer in regions with snow in the winter are bulkier than southern deer of the same species in order to conserve heat. By contrast, the southern deer have lighter builds because ____", "stem": "Which choice most logically completes the text?", "opts": ["the extra surface area allows them to disperse heat in the warmer climate.", "they do not need to store as much fat to carry them through the winter months.", "food is more readily available and they do not need to migrate as far.", "they have not yet replaced the weight for their return to the north."], "ci": 0, "exp": "The passage's established mechanism is the surface-area-to-mass ratio: less relative surface area conserves heat in the cold, so lighter southern deer would have more relative surface area, allowing them to disperse heat in the warmer climate, consistent with the rule's stated logic.", "orig": 71}, {"tag": "Information and Ideas", "box": "Radiocarbon dating offers archaeologists and other scientists a range of dates rather than a precise year in which an object was made. By contrast, dendrochronology, or the science of tree-ring dating, can offer more specific information. Trees add growth every year in predictable patterns called rings, but the exact width of the ring varies depending on certain climatic conditions such as abundance of rain. Comparing rings of different trees allows scientists to determine when the tree lived, and by extension, ____", "stem": "Which choice most logically completes the text?", "opts": ["it is also possible to determine the ages more generally using other techniques.", "European oak trees from Germany have extremely long lives if not cut", "when the wood for an object like a panel painting or a historical building was harvested.", "the species of the tree can also be determined by scientific analysis."], "ci": 2, "exp": "The passage opens by noting archaeologists use these methods to date objects. Extending \"when the tree lived\" to human use of its wood, the logical completion is determining when the wood was harvested for an object like a panel painting or building, tying back to the archaeological dating purpose.", "orig": 79}, {"tag": "Inferences", "box": "A new study examined the relationship between regularly napping during the day and total brain volume, a measure of brain health. Upon studying the cognitive health of people across a range of predispositions to nap, the scientists found that those more likely to nap regularly had brains that were around 3 to 6 years \"younger\" than those less likely to nap regularly. The scientists acknowledged that all 378,932 participants had white European ancestry, so ____", "stem": "Which choice most logically completes the text?", "opts": ["future studies should consider accounting for both age and gender variations as well.", "the study's implications may not apply to those with different nationalities.", "the study's implications may not apply to those with different propensities to nap regularly.", "the limitation of the study is the lack of generalizability of the study's findings."], "ci": 1, "exp": "Since all participants shared white European ancestry, the logical limitation is that findings may not generalize to people of different ancestries/nationalities, directly following from the detail just stated.", "orig": 83}, {"tag": "Inferences", "box": "To pass a bill in the US Senate, the bill must first be introduced to the relevant committee for discussions. After any amendments are made and the bill passes the majority vote in the committee, the bill can then progress to the entire Senate for debate. The debate ends when there are 60 votes to stop the debate and begin voting on the bill. The bill is officially passed when it gains a majority of the votes, which is equivalent to at least 51 votes. Therefore, 60 votes ____.", "stem": "Which choice most logically completes the text?", "opts": ["has effectively become the minimum needed to pass legislation.", "is a super majority, while 51 votes is a simple majority.", "accurately represents the overall sentiment of the Senate.", "can be difficult to gather as debate can persist across weeks."], "ci": 1, "exp": "The passage establishes two distinct thresholds: 60 votes to end debate and 51 votes (a majority) to pass the bill. The logical numeric conclusion is that 60 constitutes a super majority while 51 is a simple majority, directly following from the math just given.", "orig": 84}, {"tag": "Words in Context", "box": "In Timbulsloko, Indonesia, the rice crops failed in the 1990s because the land was sinking and the saline ocean water entered the rice paddies. Residents changed to raising milkfish and tiger prawns in the brackish pond water. However, they can no longer survive on aquaculture because the ocean continues to ____ and the region is now about one mile away from the mainland area.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["encroach", "conquer", "vanquish", "subjugate"], "ci": 0, "exp": "\"Encroach\" precisely describes the ocean's gradual advance into the land, consistent with the region now being about one mile away from the mainland; \"conquer,\" \"vanquish,\" and \"subjugate\" all imply forcefully defeating something, which doesn't fit describing a gradual physical advance of water.", "orig": 98}, {"tag": "Words in Context", "box": "NASA's Artemis I mission will feature a mannequin ____ Campos to record such information as seat vibrations, gravity, and radiation as part of the preparations for another manned mission to the Moon.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["entitled", "granted", "dubbed", "termed"], "ci": 2, "exp": "\"Dubbed\" is the standard, idiomatic word for informally naming or nicknaming something (the mannequin was named \"Commander Moonikin Campos\"); \"entitled\" applies to titles of works, and \"granted\"/\"termed\" don't fit naming a mannequin.", "orig": 104}, {"tag": "Words in Context", "box": "Though Cuba is known for censorship, it is ironically also known for having one of the highest literacy rates in the world because in 1961, the government sent out \"literary brigades\" to the countryside to build schools and educate the locals. The result was that 700,000 people ____ basic reading skills in less than one year.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["obtained", "collected", "sustained", "derived"], "ci": 0, "exp": "\"Obtained\" precisely describes people acquiring a new skill (reading) for the first time through the literacy campaign; \"sustained\" implies maintaining something already possessed, which doesn't fit people learning to read from scratch.", "orig": 106}, {"tag": "Words in Context", "box": "Knitting is actually based on two basic stitches, a knit stitch through the back of a loop and a purl stitch through the front, though these two basic stitches can be combined in ____ ways to create an infinite number of complex patterns.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["sizeable", "immense", "impervious", "myriad"], "ci": 3, "exp": "\"Myriad,\" meaning countless or innumerable, precisely fits describing the vast number of ways two basic stitches can be combined to create an infinite number of complex patterns; \"impervious\" (unaffected by) does not fit the sentence's meaning at all.", "orig": 111}, {"tag": "Craft and Structure", "box": "The following text is adapted from F. Scott Fitzgerald's 1922 novel, The Beautiful and the Damned.<br><br>Early in his career Adam Patch had married an anemic lady of thirty, Alicia Withers, who brought him one hundred thousand dollars and an impeccable entree into the banking circles of New York. Immediately and rather spunkily she had borne him a son and, as if completely devitalized by the magnificence of this performance, she had thenceforth effaced herself within the shadowy dimensions of the nursery. The boy, Adam Ulysses Patch, became an inveterate joiner of clubs, connoisseur of good form, and driver of tandems -- at the astonishing age of twenty-six he began his memoirs under the title \"New York Society as I Have Seen It.\" On the rumor of its conception this work was eagerly bid for among publishers, but as it proved after his death to be immoderately verbose and overpoweringly dull, it never obtained even a private printing.", "stem": "What is the main function of the word \"astonishing\" in the overall structure of the text?", "opts": ["It indicates irony.", "It expresses admiration.", "It highlights respect.", "It emphasizes talent."], "ci": 0, "exp": "Calling the age \"astonishing\" for beginning memoirs sets up an ironic contrast: the supposedly impressive undertaking turns out to be \"immoderately verbose and overpoweringly dull\" and never even privately printed, so the word signals irony rather than genuine admiration or talent.", "orig": 128}, {"tag": "Text Structure and Purpose", "box": "The vegan diet has gained momentum in recent years, with more people transitioning to the diet, whether for health or more ethically-based reasons. The vegan diet, often characterized as very restrictive, is associated with health benefits but raises concerns. Controversy regarding the diet exists within the public sphere, with some actively supporting and advocating for it, and others questioning its purpose and proposed benefits, even disparaging its existence. A study led by Sarah Mann aimed to provide a fuller picture of the vegan diet in which no animal products are eaten, encompassing both the nutrition and health of the vegan diet. The study also delved into related ethical beliefs by studying scientific and popular literature in tandem. Furthermore, the study aimed to provide an insider's perspective of the vegan diet as a means of combating stereotypes and making the diet more relatable to those who are not vegan.", "stem": "What is the main purpose of the text?", "opts": ["It presents rationale for adopting g lying out on the yards and hovering in the rigging of great ships; fog drooping on the gunwales of barges and small boats. Fog in the eyes and throats of ancient Greenwich pensioners, wheezing by the firesides of their wards; fog in the stem and bowl of the afternoon pipe of the wrathful skipper, down in his close cabin; fog cruelly pinching the toes and fingers of his shivering little 'prentice boy on deck.", "stem": "What is the main purpose of the text?", "opts": ["It establishes the typical weather pattern of an area.", "It introduces the range of industry in an area.", "It shows the activities of a variety of characters.", "It uses a metaphor to instill a sense of oppression."], "ci": 0, "exp": "The exhaustive, repeated listing of fog across many specific locations along the river establishes fog as the pervasive, characteristic weather condition of the setting.", "orig": 136}, {"tag": "Craft and Structure", "box": "The following text is adapted from Charlotte Bronte's 1853 novel, Villette.<br><br>My godmother lived in a handsome house in the clean and ancient town of Bretton. Her husband's family had been residents there for generations, and bore, indeed, the name of their birthplace -- Bretton of Bretton: whether by coincidence, or because some remote ancestor had been a personage of sufficient importance to leave his name to his neighbourhood, I know not. When I was a girl I went to Bretton about twice a year, and well I liked the visit. The house and its inmates specially suited me. The large peaceful rooms, the well-arranged furniture, the clear wide windows, the balcony outside, looking down on a fine antique street, where Sundays and holidays seemed always to abide -- so quiet was its atmosphere, so clean its pavement -- these things pleased me well.", "stem": "What is the main purpose of the text?", "opts": ["It describes a character's appearance.", "It establishes an agreeable setting.", "It hints at a change in circumstances.", "It shows where the narrator resides."], "ci": 1, "exp": "The passage is dense with pleasant, peaceful descriptive detail (large peaceful rooms, clear windows, quiet atmosphere, clean pavement, \"these things pleased me well\"), establishing an agreeable setting rather than hinting at any upcoming change.", "orig": 139}, {"tag": "Text Structure and Purpose", "box": "The following text is adapted from H.G. Wells's 1925 novel, Christina Alberta's Father.<br><br>Young Albert Edward Preemby was then a good-looking, slender youth of sixteen, with his father's curliness and his mother's fair hair and eyes of horizon blue, dreamy and indisposed for regular employment. Even as a child he had been given to reverie; at school he would sit with sums or book neglected before him, looking beyond them at unknown things; his early experiences in business were disappointing by reason of this abstraction. After a number of unsuccessful attempts to exploit his gifts at some favourable point in the complex machinery of our civilization, he came to rest for several years in the office of a house-agent and coal-merchant in Norwich to whom his mother was distantly related.", "stem": "What is the main purpose of the text?", "opts": ["It discusses many challenges facing a character.", "It hints at the personality of a character.", "It establishes the career of a character.", "It describes the appearance of a character."], "ci": 1, "exp": "Most of the passage focuses on Albert's dreamy, distracted temperament (given to reverie, indisposed for regular employment, abstracted) and how it shaped his path, primarily hinting at his personality rather than detailing distinct challenges, a settled career, or physical appearance.", "orig": 146}, {"tag": "Craft and Structure", "box": "The following passage is adapted from Harper Lee's To Kill a Mockingbird written in 1960.<br><br>When he was nearly thirteen, my brother Jem got his arm badly broken at the elbow. When it healed, and Jem's fears of never being able to play throw, his or her brain is using a motor memory to complete the task.\") in the text as a whole?", "opts": ["It begins with an analogy meant to explain the process that creates motor memories.", "It shows an example that contradicts the results on the function of the brain.", "It details a metaphor that explains how the brain can behave subconsciously in a beneficial manner.", "It illustrates a better understanding of the complicated findings on motor memory."], "ci": 0, "exp": "The opening sentence introduces a familiar, concrete example (a free throw) before explaining the underlying research on motor memory, functioning as an accessible illustration meant to explain the process discussed in the rest of the passage.", "orig": 148}, {"tag": "Cross-Text Connections", "box": "Text 1: Astronomers from the University of California-Berkeley worked out there could be as many as 40 billion Earth-sized exoplanets in the so-called \"habitable zone\" around their star, where temperatures are mild enough for liquid water to exist on the surface. There's even a potentially Earth-like world orbiting our nearest neighboring star, Proxima Centauri. At just four light years away, that system might be close enough for us to reach using current technology. The ancient question, \"Are we alone?\" has graduated from being a philosophical musing to a testable hypothesis. We should be prepared for an answer.<br><br>Text 2: Our observations suggest increasingly that earth-size planets orbiting within the habitable zone may be common in the galaxy. But are any of them inhabited? With no ability to send probes there to sample, we will have to derive the answer from the light and other radiation that come to us from these faraway systems. We also might not be able to detect biospheres even if they exist. Life has flourished on Earth for perhaps 3.5 billion years, but the atmospheric \"biosignatures\" that, today, would supply good evidence of life to distant astronomers have not been present for all of that time.", "stem": "Based on the texts, how would the author of Text 2 most likely respond to the claim in Text 1: that encountering extraterrestrial life is now a testable hypothesis?", "opts": ["It is farfetched, as there is no method of exploring places where life might exist.", "It is fallacious, as the only planet with a detectable biosphere is Earth.", "It is plausible, as many planets could contain life in subsurface regions.", "It is inconceivable, as there is no evidence that extraterrestrial life exists."], "ci": 0, "exp": "Text 2 emphasizes that we cannot send probes to sample distant systems directly and might not detect biospheres even if life exists, reflecting deep skepticism about our current ability to actually test/confirm the hypothesis, closest to choice A's framing of it as farfetched given the lack of a reliable method.", "orig": 154}, {"tag": "Cross-Text Connections", "box": "Text 1: Ball lightning is a rare atmospheric effect that has been reported multiple times over the centuries, but which has not been scientifically explained. Part of the problem is that the event is unpredictable, so it is impossible to set up a controlled experiment that incorporates all of the relevant variables. Eyewitness accounts vary, but describe balls of light associated with lightning storms that travel in unpredictable trajectories for several seconds before exploding or vanishing, often amid the odor of sulfur.<br><br>Text 2: The Serbian-American inventor Nikola Tesla, apparently out of curiosity, decided to recreate the effect known as ball lightning. He managed to produce balls of light with the same appearance as ball lightning multiple times in laboratory settings, but it is unclear whether such balls actually form in the same fashion as the actual phenomenon does.", "stem": "Based on the texts, how would the author of Text 1 most likely respond to the claim in Text 2 that Tesla produced ball lightning?", "opts": ["By doubting the accuracy of the report", "By claiming that such results are irreplicable", "By conceding that the argument in Text 1 is flawed", "By agreeing that such a demonstration is possible"], "ci": 0, "exp": "Text 1 stresses that no controlled experiment can capture all the relevant variables of true ball lightning, so its author would likely doubt whether Tesla's lab-produced balls are accurately the same natural phenomenon, matching choice A.", "orig": 158}, {"tag": "Cross-Text Connections", "box": "Text 1: Based on a study conducted by Dr Heath Grayson and his team, parasitic infections, caused by intestinal helminths and protozoan parasites, are among the most prevalent infections in humans in developing countries. In developed countries, protozoan parasites more commonly cause gastrointestinal infections compared to helminths. Intestinal parasites cause significant morbidity and mortality in endemic countries.<br><br>Text 2: Studies have shown that the most common protozoan parasites are G. intestinalis, Entamoeba histolytica, and Cryptosporidium spp. G. intestinalis is the most prevalent parasitic cause of gastrointestinal diseases like diarrhea in the developed world, and this infection is also very common in developing countries.", "stem": "Based on the texts, if the author of Text 1 and the author of Text 2 were aware of each other's findings, they would most likely agree with which statement?", "opts": ["Efforts to destroy parasitic infections must be increased.", "The frequency of parasitic infections is increasing.", "Endemic countries are at risk of intestinal parasites.", "Protozoan parasites can frequently cause gastrointestinal infections, resulting in diarrhea."], "ci": 3, "exp": "Text 1 states protozoan parasites commonly cause gastrointestinal infections, and Text 2 specifies that a common protozoan parasite (G. intestinalis) is the most prevalent cause of diarrhea; combined, both authors would agree that protozoan parasites frequently cause gastrointestinal infections resulting in diarrhea.", "orig": 161}, {"tag": "Cross-Text Connections", "box": "Text 1: \"Continental drift\" describes one of the earliest ways geologists thought continents moved over time. Today, the theory of continental drift has been replaced by the science of plate tectonics. The theory of continental drift is most associated with the scientist Alfred Wegener. In the early 20th century, Wegener published a paper explaining his theory that the continental landmasses were \"drifting\" across the earth, sometimes plowing through oceans and into each other. He called this movement continental drift.<br><br>Text 2: One of the elements lacking in the theory of continental drift was the mechanism for how it works -- why did the continents drift and what patterns did they follow? Wegener suggested that perhaps the rotation of the earth caused the continents to shift towards and apart from each other. (It doesn't.) Today, we know that the continents rest on massive slabs of rock called tectonic plates. The plates are always moving and interacting in a process called \"plate tectonics.\"", "stem": "What would the author of Text 2 most likely respond to the author of Text 1?", "opts": ["With understanding because Wegener's theory was correct", "With disagreement because scientists did not accept Wegener's theory of continental drift", "With hesitance because alternate theories disproved Wegener's theory", "With appreciation because Wegener was one of the earliest geologists"], "ci": 3, "exp": "Text 2 corrects only Wegener's specific proposed mechanism (earth's rotation) while affirming the underlying concept that continents move, consistent with viewing Wegener favorably as an early pioneer of the idea, matching choice D, rather than claiming his whole theory was disproved.", "orig": 162}, {"tag": "Craft and Structure", "box": "Text 1: It is stated that Abraham Lincoln \"had an almost morbid dislike to an escort, or guard, and daily exposed himself to the deadly aim of an assassin.\" ... On more than one occasion he the President had gone through the streets of Washington at a late hour of the night, without escort, or even the company of a servant, walking all the way, going and returning.<br><br>Text 2: Bancroft's eulogy on Lincoln never pleased the latter's lifelong friends ... February 16, 1866, David Davis, who had heard it, wrote me: \"His analysis of Mr. Lincoln's character is superficial.\" On the 22nd he again wrote: \"Mr. Bancroft totally misconceived Mr. Lincoln's character in applying 'unsteadiness' and confusion to it. Mr. Lincoln grew more steady and resolute, and his ideas were never confused. I thought him always master of his subject. He was a much more self-possessed man than I thought.\"", "stem": "Based on the texts, how would the author of Text 2 most likely respond to Lincoln's behaviour as illustrated in Text 1?", "opts": ["By conceding the importance of protection but asserting the greater significance of Lincoln's belief that \"assassination is always possible\"", "By concurring that Lincoln rarely deviated from his personal convictions and exhibited stability and equanimity.", "By acknowledging that Lincoln had a morbid dislike of any form of security.", "By challenging the supposition that Lincoln consistently \"exposed himself to the deadly aim of an assassin.\""], "ci": 1, "exp": "Text 2 portrays Lincoln as steady, resolute, and self-possessed. This characterization aligns with (rather than challenges) Text 1's account of his calm, unescorted walks, framing that behavior as an expression of his steady personal conviction, matching choice B.", "orig": 168}, {"tag": "Cross-Text Connections", "box": "Text 1: In a recent study, the melting rates of nearly all glaciers worldwide, excluding the Greenland and Antarctic ice sheets, were examined, totaling approximately 200,000 glaciers. The study analyzed the loss of mass and thickness of these glaciers from 2000 to 2019. The findings revealed a significant increase in the annual rates of glacier thinning, with rates nearly doubling from 36cm in 2000 to 69 cm in 2019.<br><br>Text 2: According to scientific estimates, a significant portion of the acceleration in sea level rise during the 21st century, ranging from 6% to 19%, is attributed to the loss of mass from glaciers. Additionally, researchers estimate that approximately 21% of the overall sea level rise is caused by the melting of glaciers. The consequences of rising sea levels encompass permanent flooding of low-lying regions, heightened frequency, extent of tidal inundation, and increased depth of inundation.", "stem": "Based on the two texts, how would the author of Text 2 most likely react to Text 1?", "opts": ["In agreement, since sea level rise is largely due to the accelerated rates of glacier thinning", "In disbelief, since the rate at which glaciers are melting does not correspond to the rates at which sea levels are rising", "In support, since the impacts of sea level rise are severe and often permanent", "In surprise, since the global acceleration in sea levels is a result of multiple factors and not only due to the melting of glaciers and ice sheets"], "ci": 2, "exp": "Text 2 emphasizes that glacier melt significantly contributes to sea level rise and that the consequences (permanent flooding, increased tidal inundation) are severe. Text 1's finding of accelerating glacier thinning would reinforce this concern, making support (given the severity Text 2 already describes) the most consistent reaction.", "orig": 170}, {"tag": "Cross-Text Connections", "box": "Text 1: An international archaeological research team has isolated ancient human DNA from a deer tooth found in Siberia. Their invention and usage of a nondestructive technique to extract DNA from the tooth facilitated its preservation. This enabled the reconstruction of a detailed genetic profile of both the individual who used the pendant and the deer from which the tooth originated.<br><br>Text 2: Bone and tooth artifacts offer valuable glimpses into the subsistence strategies and behavior of early humans. However, their attribution to specific individuals has been challenging due to the scarcity of burials and graves during the Paleolithic Age. Artifacts that have been found are either extremely fragile or contaminated. This has constrained our ability to draw conclusions about life during that era.", "stem": "Based on the texts, what would the author of Text 2 most likely say about the invention described in Text 1?", "opts": ["The invention of the nondestructive DNA extraction technique is a groundbreaking achievement that allows for the analysis of ancient artifacts.", "The scarcity of burials and grave goods in the Paleolithic Age renders the invention of a DNA extraction technique insignificant for understanding early human subsistence strategies.", "The novel technique described in Text 1 fails to address the challenges of attributing bone and tooth artifacts to specific individuals due to contamination issues.", "The detailed genetic profile obtained through the novel technique contradicts the scarcity of burials imposed by limitations of burials and grave goods during the Paleolithic Age."], "ci": 0, "exp": "Text 2 identifies fragility as a key obstacle to studying ancient artifacts. Text 1's nondestructive technique directly addresses that obstacle by preserving a fragile tooth while still yielding a detailed genetic profile, so Text 2's author would most likely view it as a groundbreaking, welcome achievement.", "orig": 173}, {"tag": "Expression of Ideas", "box": "A student has taken the following notes:<br>- There are over 200,000 glaciers on Earth, covering about one fourth of the planet.<br>- Glaciers are an essential source of fresh water in places such as the Andes and Asia.<br>- Global warming is accelerating the melting process, and manmade greenhouse gasses might be responsible for all of the glacial ice loss since 1850.<br>- Between 2000 and 2019, the world's glaciers were melting at a rate of about 267 billion metric tons of water per year.<br>- The sea level has risen about half an inch since 2000, due to the extra water from glaciers.<br><br>The student wants to explain how fast the glacial ice is melting.", "stem": "Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Covering about a fourth of Earth's surface, the 200,000 glaciers have been melting due to greenhouse gasses since 1850.", "Since 1850, greenhouse gasses have contributed to glacial melting, causing glaciers to disappear at the rate of about 267 billion metric tons of water every year.", "About 267 billion metric tons of water have been melting from glaciers annually since 2000, enough to make the ocean levels rise by half an inch.", "As glacial ice melts, people in the Andes and Asia will not have as much fresh water and people by the oceans will have problems as the sea level rises."], "ci": 2, "exp": "The goal is specifically to explain HOW FAST the ice is melting. Choice C gives the precise rate (267 billion metric tons annually) with the correct matching time frame (since 2000) and its measurable effect (half an inch of sea level rise), most directly and accurately accomplishing that goal.", "orig": 195}, {"tag": "Expression of Ideas", "box": "A flamingo is a filter feeder that holds the top of its mouth underwater until it fills with water, then shuts its mouth and pushes out the liquid through comb-like structures. ____ the bird has to stand with its head upside-down to eat this way.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Consequently,", "However,", "Finally,", "To illustrate,"], "ci": 0, "exp": "The upside-down feeding posture is a direct result (not a contrast) of the filtering mechanism just described, so the cause-and-effect transition \"Consequently,\" is the most logical choice.", "orig": 227}];

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; }
    else { state = defaultState(); }
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }
function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10) || 0; }catch(e){ return 0; } }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if (!state.timerStartedAt) { setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now() - state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if (remaining <= 0){ displayEl.textContent = "Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if (remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if (remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if (!minutes || minutes<=0) minutes = 35;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function resetTimer(){ state.timerTotalSec=null; state.timerStartedAt=null; saveState(); stopTimerInterval(); renderTimer(); }

function getShuffle(i){
  if (!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel'); var b=document.getElementById('jump-btn');
  if (p.style.display==='none' || !p.style.display){ p.style.display='block'; b.textContent='Hide ▴'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump ▾'; }
}
function renderDots(){
  var p=document.getElementById('dot-panel');
  if (p.style.display!=='block') return;
  var h='';
  for (var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if (Object.keys(state.answers).length === qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump ▾';
}

function showResults(){
  state.showResults = true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('attbar').textContent = 'Total Attempts: ' + loadAttempts();
  if (state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length + ' (Book #' + q.orig + ')';

  var tagWrap = document.getElementById('tagWrap');
  var tagEl = document.getElementById('q-tag-label');
  if (q.tag){
    tagWrap.style.display='block';
    tagEl.textContent = q.tag;
    tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
  } else {
    tagWrap.style.display='none';
  }

  var bc = document.getElementById('box-ctx');
  if (q.box){ bc.style.display='block'; bc.innerHTML = q.box; }
  else { bc.style.display='none'; bc.innerHTML=''; }

  document.getElementById('q-stem').innerHTML = q.stem;

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for (var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn'; var dis='';
    if (ans !== undefined){
      dis='disabled';
      if (s===csi) cls+=' correct';
      else if (s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if (ans !== undefined && ans !== csi){ eb.style.display='block'; eb.innerHTML = q.exp; }
  else { eb.style.display='none'; }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'Show Results →' : 'Next';
  document.getElementById('prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i]===undefined) sk++;
    else if (state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if (a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if (a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Question '+(i+1)+(qs[i].tag?' ('+qs[i].tag+')':'')+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = si;
  saveState(); render();
}
function go(dir){
  if (dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for (var i=0;i<qs.length;i++){
    if (state.answers[i] !== undefined && state.answers[i] !== getCSI(i)){
      if (first===-1) first=i;
      delete state.answers[i];
    }
  }
  if (first !== -1){ state.cur=first; state.showResults=false; saveState(); render(); }
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for (var i=0;i<qs.length;i++){
    var a = state.answers[i];
    lines.push('Q'+(i+1)+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if (navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
}

function saveWrongAnswers(){
  try{
    var wrong=[];
    for (var i=0;i<qs.length;i++){
      var a = state.answers[i];
      if (a===undefined) continue;
      var csi = getCSI(i);
      if (a===csi) continue;
      var sh = getShuffle(i);
      var pickedOriginal = sh[a];
      wrong.push({ q: qs[i].stem, opts: qs[i].opts, ci: qs[i].ci, picked: pickedOriginal });
    }
    if (wrong.length === 0){ alert('No wrong answers to save.'); return; }
    var payload = { child: QUIZ_CHILD, subject: QUIZ_SUBJECT, date: QUIZ_DATE, wrong: wrong };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'wronganswers_' + QUIZ_CHILD + '_' + QUIZ_DATE + '_' + QUIZ_KEY + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }catch(e){
    try{ alert('Could not save wrong answers.'); }catch(e2){}
  }
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if (mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.startTimer=startTimer;

var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again/i;
document.addEventListener('click', function(ev){
  var el = ev.target, depth=0;
  while (el && depth<4){
    var isClickable = el.tagName==='BUTTON' || el.tagName==='A';
    if (isClickable){
      var txt = (el.textContent||'').trim();
      if (txt.length>0 && txt.length<40 && qzRetryRe.test(txt)){ resetTimer(); return; }
    }
    el = el.parentElement; depth++;
  }
}, true);

loadState(); saveState();
render();
if (state.timerStartedAt) startTimerInterval();

})();
</script>
</body>
</html>
