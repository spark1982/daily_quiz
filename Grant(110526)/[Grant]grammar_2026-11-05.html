<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261105";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have go", "have gone", "had went", "NO CHANGE"], "ci": 1, "exp": "After <i>have</i>, use the past participle. The past participle of <i>go</i> is <i>gone</i>, not <i>went</i>: <i>I <b>have gone</b> to the Riverside Rink three times.</i>", "passage": "<strong>An Email to Uncle Ray</strong><br>Dear Uncle Ray,<br><b>(1)</b> Thank you for the ice skates you sent for my birthday! <b>(2)</b> I <u>have went</u> to the Riverside Rink three times since they arrived. <b>(3)</b> On my first try I fell so often that my jeans were soaked. <b>(4)</b> Then a coach showed my friend Leo and <u>me</u> how to bend our knees. <b>(5)</b> Now I can glide all the way around the rink without grabbing the wall. <b>(6)</b> <u>Its the most fun</u> I have had all fall, and I can't wait to show you!<br>Your nephew, Sam", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"stem": "Where should a comma be added in sentence 3?", "opts": ["On my first, try I fell so often that my jeans were soaked.", "On my first try I fell so often, that my jeans were soaked.", "On my first try, I fell so often that my jeans were soaked.", "On my first try I fell, so often that my jeans were soaked."], "ci": 2, "exp": "Put a comma after an opening phrase that comes before the main part of the sentence: <i>On my first try<b>,</b> I fell so often that my jeans were soaked.</i>", "passage": "<strong>An Email to Uncle Ray</strong><br>Dear Uncle Ray,<br><b>(1)</b> Thank you for the ice skates you sent for my birthday! <b>(2)</b> I <u>have went</u> to the Riverside Rink three times since they arrived. <b>(3)</b> On my first try I fell so often that my jeans were soaked. <b>(4)</b> Then a coach showed my friend Leo and <u>me</u> how to bend our knees. <b>(5)</b> Now I can glide all the way around the rink without grabbing the wall. <b>(6)</b> <u>Its the most fun</u> I have had all fall, and I can't wait to show you!<br>Your nephew, Sam", "tag": "Commas", "tagcolor": "#d6336c"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["myself", "I", "mine", "NO CHANGE"], "ci": 3, "exp": "It is already correct. <i>Me</i> is right after the action word <i>showed</i>. Test it by taking out \"my friend Leo and\": <i>a coach showed <b>me</b></i>, not <i>a coach showed I</i>.", "passage": "<strong>An Email to Uncle Ray</strong><br>Dear Uncle Ray,<br><b>(1)</b> Thank you for the ice skates you sent for my birthday! <b>(2)</b> I <u>have went</u> to the Riverside Rink three times since they arrived. <b>(3)</b> On my first try I fell so often that my jeans were soaked. <b>(4)</b> Then a coach showed my friend Leo and <u>me</u> how to bend our knees. <b>(5)</b> Now I can glide all the way around the rink without grabbing the wall. <b>(6)</b> <u>Its the most fun</u> I have had all fall, and I can't wait to show you!<br>Your nephew, Sam", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["It's the most fun", "NO CHANGE", "It's the more fun", "Its' the most fun"], "ci": 0, "exp": "<i>It's</i> is short for <i>it is</i>, so it needs an apostrophe: <i><b>It's</b> (It is) the most fun I have had all fall.</i> <i>Its</i> without an apostrophe means \"belonging to it.\" Use <i>most</i> because you are comparing with everything else this fall.", "passage": "<strong>An Email to Uncle Ray</strong><br>Dear Uncle Ray,<br><b>(1)</b> Thank you for the ice skates you sent for my birthday! <b>(2)</b> I <u>have went</u> to the Riverside Rink three times since they arrived. <b>(3)</b> On my first try I fell so often that my jeans were soaked. <b>(4)</b> Then a coach showed my friend Leo and <u>me</u> how to bend our knees. <b>(5)</b> Now I can glide all the way around the rink without grabbing the wall. <b>(6)</b> <u>Its the most fun</u> I have had all fall, and I can't wait to show you!<br>Your nephew, Sam", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["is protecting", "NO CHANGE", "protect", "has protected"], "ci": 2, "exp": "Two things joined by <i>and</i> (fat <i>and</i> feathers) make a plural subject, so use the plural verb: <i>A thick layer of fat and four layers of feathers <b>protect</b> each bird.</i>", "passage": "<strong>How Emperor Penguins Stay Warm</strong><br><b>(1)</b> Emperor penguins live in Antarctica, where winter temperatures can drop far below zero. <b>(2)</b> A thick layer of fat and four layers of feathers <u>protects</u> each bird from the icy wind. <b>(3)</b> In the darkest months, the males huddle together in a giant group. <b>(4)</b> The penguins on the outside edge shuffle slowly toward the center. <b>(5)</b> The center is the warmest spot in the huddle. <b>(6)</b> Because the huddle never stops moving. <b>(7)</b> Last winter, scientists <u>measured</u> temperatures above 90 degrees in the middle of one huddle.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["The penguins on the outside edge shuffle slowly toward the center, who is the warmest spot in the huddle.", "The penguins on the outside edge shuffle slowly toward the center, which is the warmest spot in the huddle.", "The penguins on the outside edge shuffle slowly toward the center, the center is the warmest spot in the huddle.", "The penguins on the outside edge, which is the warmest spot in the huddle, shuffle slowly toward the center."], "ci": 1, "exp": "Use <i>which</i> to add information about a thing (the center): <i>…toward the center, <b>which</b> is the warmest spot in the huddle.</i> <i>Who</i> is only for people, and joining two sentences with just a comma makes a run-on.", "passage": "<strong>How Emperor Penguins Stay Warm</strong><br><b>(1)</b> Emperor penguins live in Antarctica, where winter temperatures can drop far below zero. <b>(2)</b> A thick layer of fat and four layers of feathers <u>protects</u> each bird from the icy wind. <b>(3)</b> In the darkest months, the males huddle together in a giant group. <b>(4)</b> The penguins on the outside edge shuffle slowly toward the center. <b>(5)</b> The center is the warmest spot in the huddle. <b>(6)</b> Because the huddle never stops moving. <b>(7)</b> Last winter, scientists <u>measured</u> temperatures above 90 degrees in the middle of one huddle.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["have measured", "will measure", "NO CHANGE", "measure"], "ci": 2, "exp": "It is already correct. \"Last winter\" tells us the action is finished in the past, so the simple past <i>measured</i> is right: <i>Last winter, scientists <b>measured</b> temperatures above 90 degrees.</i>", "passage": "<strong>How Emperor Penguins Stay Warm</strong><br><b>(1)</b> Emperor penguins live in Antarctica, where winter temperatures can drop far below zero. <b>(2)</b> A thick layer of fat and four layers of feathers <u>protects</u> each bird from the icy wind. <b>(3)</b> In the darkest months, the males huddle together in a giant group. <b>(4)</b> The penguins on the outside edge shuffle slowly toward the center. <b>(5)</b> The center is the warmest spot in the huddle. <b>(6)</b> Because the huddle never stops moving. <b>(7)</b> Last winter, scientists <u>measured</u> temperatures above 90 degrees in the middle of one huddle.", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5"}, {"stem": "Which sentence has an error?", "opts": ["Last winter, scientists measured temperatures above 90 degrees in the middle of one huddle.", "Emperor penguins live in Antarctica, where winter temperatures can drop far below zero.", "In the darkest months, the males huddle together in a giant group.", "Because the huddle never stops moving."], "ci": 3, "exp": "A group of words that starts with <i>Because</i> needs another part to finish the thought. Fix it by joining it to a full sentence: <i>Because the huddle never stops moving, every penguin gets a turn in the warm center.</i>", "passage": "<strong>How Emperor Penguins Stay Warm</strong><br><b>(1)</b> Emperor penguins live in Antarctica, where winter temperatures can drop far below zero. <b>(2)</b> A thick layer of fat and four layers of feathers <u>protects</u> each bird from the icy wind. <b>(3)</b> In the darkest months, the males huddle together in a giant group. <b>(4)</b> The penguins on the outside edge shuffle slowly toward the center. <b>(5)</b> The center is the warmest spot in the huddle. <b>(6)</b> Because the huddle never stops moving. <b>(7)</b> Last winter, scientists <u>measured</u> temperatures above 90 degrees in the middle of one huddle.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["have seen", "sees", "NO CHANGE", "saw"], "ci": 3, "exp": "The journal tells about this morning, and <i>woke</i> is past tense, so the second verb must be past too: <i>I woke up and <b>saw</b> snow.</i> Don't switch from past to present in the same sentence.", "passage": "<strong>My Journal: The First Snow</strong><br><b>(1)</b> This morning I woke up and <u>see</u> snow covering our whole backyard. <b>(2)</b> My sister Lily and I pulled on our boots and raced outside. <b>(3)</b> We built a snowman in the middle of the yard. <b>(4)</b> We gave him a carrot nose and two button eyes. <b>(5)</b> By lunchtime, our snowman looked <u>real good</u>. <b>(6)</b> Then Mom made hot chocolate for Lily and I. <b>(7)</b> It was the best snow day of the whole year, and I hope it snows again tomorrow.", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5"}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["We built a snowman in the middle of the yard, but we gave him a carrot nose and two button eyes.", "Although we built a snowman in the middle of the yard, we gave him a carrot nose and two button eyes.", "We built a snowman in the middle of the yard and gave him a carrot nose and two button eyes.", "We built a snowman in the middle of the yard, gave him a carrot nose and two button eyes."], "ci": 2, "exp": "Both sentences have the same subject (<i>We</i>), so join the two actions with <i>and</i>: <i>We built a snowman in the middle of the yard <b>and</b> gave him a carrot nose and two button eyes.</i> <i>But</i> and <i>Although</i> show a contrast, which does not make sense here.", "passage": "<strong>My Journal: The First Snow</strong><br><b>(1)</b> This morning I woke up and <u>see</u> snow covering our whole backyard. <b>(2)</b> My sister Lily and I pulled on our boots and raced outside. <b>(3)</b> We built a snowman in the middle of the yard. <b>(4)</b> We gave him a carrot nose and two button eyes. <b>(5)</b> By lunchtime, our snowman looked <u>real good</u>. <b>(6)</b> Then Mom made hot chocolate for Lily and I. <b>(7)</b> It was the best snow day of the whole year, and I hope it snows again tomorrow.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["real well", "NO CHANGE", "really good", "more good"], "ci": 2, "exp": "Use <i>really</i> (an adverb) to tell how good: <i>Our snowman looked <b>really good</b>.</i> <i>Real</i> describes things (a real diamond), and <i>more good</i> should be <i>better</i>.", "passage": "<strong>My Journal: The First Snow</strong><br><b>(1)</b> This morning I woke up and <u>see</u> snow covering our whole backyard. <b>(2)</b> My sister Lily and I pulled on our boots and raced outside. <b>(3)</b> We built a snowman in the middle of the yard. <b>(4)</b> We gave him a carrot nose and two button eyes. <b>(5)</b> By lunchtime, our snowman looked <u>real good</u>. <b>(6)</b> Then Mom made hot chocolate for Lily and I. <b>(7)</b> It was the best snow day of the whole year, and I hope it snows again tomorrow.", "tag": "Modifiers", "tagcolor": "#2f9e44"}, {"stem": "Which sentence has an error?", "opts": ["We built a snowman in the middle of the yard.", "Then Mom made hot chocolate for Lily and I.", "My sister Lily and I pulled on our boots and raced outside.", "It was the best snow day of the whole year, and I hope it snows again tomorrow."], "ci": 1, "exp": "After <i>for</i>, use <i>me</i>, not <i>I</i>. Test it by taking out \"Lily and\": you would say <i>made hot chocolate for <b>me</b></i>. Correct: <i>Then Mom made hot chocolate for Lily and <b>me</b>.</i>", "passage": "<strong>My Journal: The First Snow</strong><br><b>(1)</b> This morning I woke up and <u>see</u> snow covering our whole backyard. <b>(2)</b> My sister Lily and I pulled on our boots and raced outside. <b>(3)</b> We built a snowman in the middle of the yard. <b>(4)</b> We gave him a carrot nose and two button eyes. <b>(5)</b> By lunchtime, our snowman looked <u>real good</u>. <b>(6)</b> Then Mom made hot chocolate for Lily and I. <b>(7)</b> It was the best snow day of the whole year, and I hope it snows again tomorrow.", "tag": "Pronouns", "tagcolor": "#7b61ff"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["\"We need to find a dinosaur egg first.\" said Ana.", "NO CHANGE", "\"We need to find a dinosaur egg first\", said Ana.", "\"We need to find a dinosaur egg first,\" said Ana."], "ci": 3, "exp": "When a quotation comes before words like <i>said Ana</i>, end it with a comma <b>inside</b> the closing quotation mark: <i>\"We need to find a dinosaur egg first<b>,</b>\" said Ana.</i>", "passage": "<strong>The Museum Scavenger Hunt</strong><br><b>(1)</b> Ana and Leo raced up the museum steps with their scavenger hunt list. <b>(2)</b> <u>\"We need to find a dinosaur egg first\" said Ana.</u> <b>(3)</b> Leo pointed to a guide <u>which</u> was standing near the fossil hall. <b>(4)</b> The guide said the egg <u>had been</u> discovered in Montana many years ago. <b>(5)</b> Each of the kids were amazed by how small the egg was. <b>(6)</b> By noon, they had checked off every item on the list. <b>(7)</b> Ana grinned and said that they should come back next month.", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "who", "whose", "where"], "ci": 1, "exp": "Use <i>who</i> for people. A guide is a person: <i>Leo pointed to a guide <b>who</b> was standing near the fossil hall.</i> <i>Which</i> is for things and animals.", "passage": "<strong>The Museum Scavenger Hunt</strong><br><b>(1)</b> Ana and Leo raced up the museum steps with their scavenger hunt list. <b>(2)</b> <u>\"We need to find a dinosaur egg first\" said Ana.</u> <b>(3)</b> Leo pointed to a guide <u>which</u> was standing near the fossil hall. <b>(4)</b> The guide said the egg <u>had been</u> discovered in Montana many years ago. <b>(5)</b> Each of the kids were amazed by how small the egg was. <b>(6)</b> By noon, they had checked off every item on the list. <b>(7)</b> Ana grinned and said that they should come back next month.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["had being", "had be", "NO CHANGE", "has been"], "ci": 2, "exp": "It is already correct. The egg was discovered before the guide spoke, so use <i>had been</i> (had + past participle): <i>The guide said the egg <b>had been</b> discovered in Montana many years ago.</i>", "passage": "<strong>The Museum Scavenger Hunt</strong><br><b>(1)</b> Ana and Leo raced up the museum steps with their scavenger hunt list. <b>(2)</b> <u>\"We need to find a dinosaur egg first\" said Ana.</u> <b>(3)</b> Leo pointed to a guide <u>which</u> was standing near the fossil hall. <b>(4)</b> The guide said the egg <u>had been</u> discovered in Montana many years ago. <b>(5)</b> Each of the kids were amazed by how small the egg was. <b>(6)</b> By noon, they had checked off every item on the list. <b>(7)</b> Ana grinned and said that they should come back next month.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75"}, {"stem": "Which sentence has an error?", "opts": ["Each of the kids were amazed by how small the egg was.", "Ana grinned and said that they should come back next month.", "Ana and Leo raced up the museum steps with their scavenger hunt list.", "By noon, they had checked off every item on the list."], "ci": 0, "exp": "The subject is <i>Each</i>, which is singular, so use <i>was</i>. Don't be fooled by <i>kids</i> right before the verb: <i>Each of the kids <b>was</b> amazed.</i>", "passage": "<strong>The Museum Scavenger Hunt</strong><br><b>(1)</b> Ana and Leo raced up the museum steps with their scavenger hunt list. <b>(2)</b> <u>\"We need to find a dinosaur egg first\" said Ana.</u> <b>(3)</b> Leo pointed to a guide <u>which</u> was standing near the fossil hall. <b>(4)</b> The guide said the egg <u>had been</u> discovered in Montana many years ago. <b>(5)</b> Each of the kids were amazed by how small the egg was. <b>(6)</b> By noon, they had checked off every item on the list. <b>(7)</b> Ana grinned and said that they should come back next month.", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623"}, {"stem": "What is the best way to combine sentences 2 and 3?", "opts": ["Families may bring their favorite games because they may borrow games from the school library.", "Families may bring their favorite games or they may borrow games, from the school library.", "Families may bring their favorite games, they may borrow games from the school library.", "Families may bring their favorite games, or they may borrow games from the school library."], "ci": 3, "exp": "The sentences give two choices, so join them with a comma and <i>or</i>: <i>Families may bring their favorite games<b>, or</b> they may borrow games from the school library.</i> A comma alone makes a run-on, and <i>because</i> does not make sense.", "passage": "<strong>Notice: Family Board Game Night</strong><br><b>(1)</b> Ravenwood Elementary will hold a Family Board Game Night in the school gym on Friday, November 20. <b>(2)</b> Families may bring their favorite games. <b>(3)</b> They may also borrow games from the school library. <b>(4)</b> If you have a game that is fun for all ages please bring it. <b>(5)</b> Last year, some families said they <u>could of</u> stayed all night. <b>(6)</b> <u>Doors open at 6:00 p.m., and games begin at 6:30.</u> <b>(7)</b> We hope to see you and your whole family there!", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad"}, {"stem": "Where should a comma be added in sentence 4?", "opts": ["If you have, a game that is fun for all ages please bring it.", "If you have a game, that is fun for all ages please bring it.", "If you have a game that is fun, for all ages please bring it.", "If you have a game that is fun for all ages, please bring it."], "ci": 3, "exp": "When a sentence starts with an <i>If</i> part, put a comma where that part ends: <i>If you have a game that is fun for all ages<b>,</b> please bring it.</i>", "passage": "<strong>Notice: Family Board Game Night</strong><br><b>(1)</b> Ravenwood Elementary will hold a Family Board Game Night in the school gym on Friday, November 20. <b>(2)</b> Families may bring their favorite games. <b>(3)</b> They may also borrow games from the school library. <b>(4)</b> If you have a game that is fun for all ages please bring it. <b>(5)</b> Last year, some families said they <u>could of</u> stayed all night. <b>(6)</b> <u>Doors open at 6:00 p.m., and games begin at 6:30.</u> <b>(7)</b> We hope to see you and your whole family there!", "tag": "Commas", "tagcolor": "#d6336c"}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["could had", "could of had", "could have", "NO CHANGE"], "ci": 2, "exp": "<i>Could of</i> is a mistake that comes from how <i>could've</i> sounds. Write <i>could have</i>: <i>some families said they <b>could have</b> stayed all night.</i>", "passage": "<strong>Notice: Family Board Game Night</strong><br><b>(1)</b> Ravenwood Elementary will hold a Family Board Game Night in the school gym on Friday, November 20. <b>(2)</b> Families may bring their favorite games. <b>(3)</b> They may also borrow games from the school library. <b>(4)</b> If you have a game that is fun for all ages please bring it. <b>(5)</b> Last year, some families said they <u>could of</u> stayed all night. <b>(6)</b> <u>Doors open at 6:00 p.m., and games begin at 6:30.</u> <b>(7)</b> We hope to see you and your whole family there!", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["Doors open at 6:00 p.m., games begin at 6:30.", "NO CHANGE", "Doors open at 6:00 p.m. games begin at 6:30.", "Doors opening at 6:00 p.m., and games at 6:30."], "ci": 1, "exp": "It is already correct. Two complete sentences are joined with a comma and <i>and</i>. Without <i>and</i>, it becomes a run-on, and \"Doors opening…\" is not a complete sentence.", "passage": "<strong>Notice: Family Board Game Night</strong><br><b>(1)</b> Ravenwood Elementary will hold a Family Board Game Night in the school gym on Friday, November 20. <b>(2)</b> Families may bring their favorite games. <b>(3)</b> They may also borrow games from the school library. <b>(4)</b> If you have a game that is fun for all ages please bring it. <b>(5)</b> Last year, some families said they <u>could of</u> stayed all night. <b>(6)</b> <u>Doors open at 6:00 p.m., and games begin at 6:30.</u> <b>(7)</b> We hope to see you and your whole family there!", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
