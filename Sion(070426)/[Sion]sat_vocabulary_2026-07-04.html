<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Vocabulary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#222;min-height:100vh;}
#app{max-width:680px;margin:0 auto;padding:16px;}
h1{text-align:center;font-size:1.35rem;font-weight:800;color:#185FA5;padding:14px 0 4px;}
.instr{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;min-width:52px;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:6px;}
.timer-bar{background:white;border:1px solid #d0dce8;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
#att-bar{text-align:center;font-size:0.8rem;color:#888;margin-bottom:8px;}
#att-bar span{font-weight:700;color:#185FA5;}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:22px 20px;margin-bottom:12px;}
.q-num{font-size:0.78rem;color:#888;margin-bottom:6px;}
.tag{display:inline-block;font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:8px;}
.tag-review{background:#fff3e0;color:#f5a623;}
.tag-new{background:#e3f0ff;color:#185FA5;}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:16px;color:#1a1a2e;}
.opts{display:grid;gap:8px;}
.opt{padding:12px 16px;border:2px solid #d7dde6;border-radius:8px;cursor:pointer;font-size:0.95rem;background:white;text-align:left;transition:border-color 0.15s,background 0.15s;}
.opt:hover:not(:disabled){border-color:#185FA5;background:#f0f6ff;}
.opt.correct{border-color:#1D9E75;background:#e6f7f1;color:#0d6b50;font-weight:700;}
.opt.wrong{border-color:#E24B4A;background:#fdf0f0;color:#b03030;}
.opt:disabled{cursor:default;}
.exp{margin-top:14px;padding:12px;background:#f5f9ff;border-left:3px solid #185FA5;border-radius:4px;font-size:0.88rem;line-height:1.5;color:#333;display:none;}
.nav-btns{display:flex;gap:8px;margin-top:8px;}
.nav-btns button{flex:1;padding:10px;border:1.5px solid #d7dde6;border-radius:8px;background:white;cursor:pointer;font-size:0.9rem;color:#444;}
.nav-btns button:hover:not(:disabled){border-color:#185FA5;color:#185FA5;}
.nav-btns button:disabled{opacity:0.4;cursor:not-allowed;}
.results{background:white;border-radius:12px;padding:28px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.score-big{font-size:3rem;font-weight:900;color:#185FA5;}
.score-lbl{color:#888;font-size:0.9rem;margin-bottom:16px;}
.stats-row{display:flex;justify-content:center;gap:28px;margin-bottom:22px;}
.stat-n{font-size:1.5rem;font-weight:800;}
.stat-lbl{font-size:0.75rem;color:#888;}
.res-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;}
.btn-copy{background:#7b61ff;color:white;}
.btn-retry{background:#1D9E75;color:white;}
.btn-fresh{background:#e8ecf0;color:#444;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-ov.show{display:flex;}
.modal-box{background:white;border-radius:14px;padding:24px;max-width:340px;width:90%;text-align:center;}
.modal-box h3{color:#185FA5;margin-bottom:10px;font-size:1.05rem;}
.modal-box p{font-size:0.88rem;color:#555;margin-bottom:18px;line-height:1.5;}
.modal-acts{display:flex;gap:10px;}
.modal-acts button{flex:1;padding:10px;border:none;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;}
.modal-acts .cancel{background:#e8ecf0;color:#444;}
.modal-acts .confirm{background:#E24B4A;color:white;}
</style>
</head>
<body>
<div id="app">
  <h1>[Sion] SAT Vocabulary</h1>
  <div class="instr">Choose the word that best completes each sentence.</div>
  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>
  <div class="timer-bar" id="timerBar">
    <div class="timer-setup" id="timerSetup">
      <label for="timerMin">Set Time Limit:</label>
      <input type="number" id="timerMin" min="1" max="180" value="20"> min
      <button class="timer-start-btn" onclick="startTimer()">Start</button>
    </div>
    <div class="timer-running" id="timerRunning" style="display:none;">
      <span class="timer-label">Time Left</span>
      <span class="timer-display" id="timerDisplay">20:00</span>
    </div>
  </div>
  <div id="att-bar">Total Attempts: <span id="attCount">0</span></div>
  <div id="qcard"></div>
  <div id="freshModal" class="modal-ov">
    <div class="modal-box">
      <h3 id="freshTitle">Start Fresh?</h3>
      <p id="freshText">All progress will be cleared. This cannot be undone.</p>
      <div class="modal-acts">
        <button class="cancel" onclick="closeFreshModal()">Cancel</button>
        <button class="confirm" onclick="confirmFresh()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>
<script>
var DATE = '20260703';
var QUIZ_KEY = 'quiz_satvocab_20_' + DATE + '_v1';
var ATT_KEY  = 'quiz_satvocab_att_' + DATE + '_v1';
var ORDER_KEY = QUIZ_KEY + '_order_v1';

var RAW_QUESTIONS = [
  {tag:'New',  q:'The senator issued a formal _____ against her colleague for accepting gifts from lobbyists, though no criminal charge followed.',
   opts:['censure','endorsement','commendation','pardon'], ci:0,
   exp:'Censure means a formal, official expression of strong disapproval. A formal statement of disapproval issued against a colleague, short of a criminal charge, is a censure.'},
  {tag:'New',  q:'After the funeral, old friends offered quiet _____, sitting with her for hours so she would not grieve alone.',
   opts:['solace','ridicule','indifference','provocation'], ci:0,
   exp:'Solace means comfort in a time of grief or distress. Friends sitting with someone so she would not grieve alone are offering solace.'},
  {tag:'Review', q:'Despite his imposing job title, the new CEO proved _____, stopping to chat with janitors and interns alike.',
   opts:['affable','haughty','brusque','condescending'], ci:0,
   exp:'Affable means friendly, warm, and easy to talk to. Stopping to chat warmly with staff at every level shows affability.'},
  {tag:'New',  q:'Officers were sent to _____ the fugitive before he could cross the border into another jurisdiction.',
   opts:['apprehend','release','commend','ignore'], ci:0,
   exp:'To apprehend means to arrest or seize someone, typically a suspect. Sending officers to catch a fugitive before he escapes is apprehending him.'},
  {tag:'Review', q:'Two of the twelve jurors chose to _____ rather than declare the defendant guilty or innocent.',
   opts:['abstain','testify','deliberate','vote'], ci:0,
   exp:'To abstain means to deliberately not take part in a vote or decision. Choosing neither guilty nor innocent, and not casting a vote at all, is abstaining.'},
  {tag:'New',  q:'The war-torn family was finally granted _____ in a country that agreed to protect them from persecution.',
   opts:['asylum','deportation','isolation','surveillance'], ci:0,
   exp:'Asylum means protection granted by a country to refugees fleeing persecution. Being sheltered from persecution in a new country is being granted asylum.'},
  {tag:'New',  q:'The old hound moved with a _____ gait, barely lifting its paws as it crossed the porch in the afternoon heat.',
   opts:['languid','frantic','brisk','vigorous'], ci:0,
   exp:'Languid means slow-moving and lacking energy or vigor. Barely lifting its paws in the heat describes a languid gait.'},
  {tag:'Review', q:'The nurse\'s soft voice helped _____ the child\'s fear before the injection.',
   opts:['allay','provoke','ignore','magnify'], ci:0,
   exp:'To allay means to reduce the intensity of a fear or worry. A soft voice that eases a child\'s fear is allaying it.'},
  {tag:'Review', q:'The young sculptor tried to _____ the bold, oversized style of her favorite modernist, right down to the rough, unfinished edges.',
   opts:['emulate','disregard','mock','avoid'], ci:0,
   exp:'Emulate means to imitate someone admired in an effort to match their achievement. Copying a favorite artist\'s style down to small details is emulating that artist.'},
  {tag:'New',  q:'To fit the article into the allotted space, the editor had to _____ the interview, cutting it from twenty pages to five.',
   opts:['abridge','expand','translate','publish'], ci:0,
   exp:'To abridge means to shorten a text while keeping its main content. Cutting an interview from twenty pages to five is abridging it.'},
  {tag:'New',  q:'The intern\'s _____ was so extreme that he corrected the Nobel laureate\'s grammar in front of the entire lab.',
   opts:['hubris','humility','timidity','deference'], ci:0,
   exp:'Hubris means excessive pride or self-confidence, often leading to overstepping. Correcting a Nobel laureate\'s grammar in front of everyone reflects extreme hubris.'},
  {tag:'New',  q:'The footnotes were so _____ that even the professor\'s graduate students needed a separate guide to follow them.',
   opts:['abstruse','straightforward','simple','accessible'], ci:0,
   exp:'Abstruse means difficult to understand, obscure. Footnotes that require a separate guide even for graduate students are abstruse.'},
  {tag:'New',  q:'The rainbow after the storm was _____, fading from the sky within a mere two minutes.',
   opts:['ephemeral','permanent','enduring','everlasting'], ci:0,
   exp:'Ephemeral means lasting for a very short time. A rainbow that fades within two minutes is ephemeral.'},
  {tag:'Review', q:'Ignoring the doctor\'s advice to rest only served to _____ his back injury, turning a two-week recovery into a two-month one.',
   opts:['exacerbate','soothe','cure','minimize'], ci:0,
   exp:'To exacerbate means to make a problem or condition worse. Ignoring rest and turning a short recovery into a long one is exacerbating the injury.'},
  {tag:'New',  q:'The general sought to _____ his rival publicly, forcing him to kneel before the entire court.',
   opts:['abase','honor','elevate','flatter'], ci:0,
   exp:'To abase means to humiliate or lower someone in dignity or rank. Forcing a rival to kneel publicly is abasing him.'},
  {tag:'New',  q:'Grandpa always opened dinner with an _____ about the time he met a famous singer at a gas station in 1974.',
   opts:['anecdote','equation','indictment','census'], ci:0,
   exp:'An anecdote is a short, entertaining account of a real incident, often personal. A brief personal story about meeting a singer is an anecdote.'},
  {tag:'New',  q:'The hikers grew _____ of the shortcut, since the trail map had been wrong twice already that day.',
   opts:['wary','enthusiastic','oblivious','careless'], ci:0,
   exp:'Wary means cautious or distrustful, especially due to prior experience. Being suspicious of a shortcut after two earlier map errors is being wary.'},
  {tag:'New',  q:'The nonprofit worked for a decade to _____ trust between the two communities, one small joint project at a time.',
   opts:['cultivate','destroy','undermine','ridicule'], ci:0,
   exp:'To cultivate means to develop or nurture something carefully over time. Building trust gradually through small joint projects over a decade is cultivating it.'},
  {tag:'New',  q:'The drummer set a steady _____ that let the dancers anticipate each step before it came.',
   opts:['cadence','silence','chaos','stillness'], ci:0,
   exp:'Cadence means a rhythmic flow or beat, often in music or speech. A steady drum rhythm that dancers can anticipate is a cadence.'},
  {tag:'New',  q:'The smugglers planned to _____ the heiress from the gala and demand a ransom by midnight.',
   opts:['abduct','escort','applaud','interview'], ci:0,
   exp:'To abduct means to seize and carry someone away by force, typically for ransom or harm. Planning to seize the heiress and demand ransom is planning to abduct her.'}
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function identityOrder(){var o=[];for(var i=0;i<RAW_QUESTIONS.length;i++)o.push(i);return o;}
function isValidOrder(arr){if(!Array.isArray(arr)||arr.length!==RAW_QUESTIONS.length)return false;var s=arr.slice().sort(function(a,b){return a-b;});for(var i=0;i<s.length;i++)if(s[i]!==i)return false;return true;}
function loadOrder(){try{var r=localStorage.getItem(ORDER_KEY);if(!r)return null;var a=JSON.parse(r);if(!isValidOrder(a))throw new Error('bad');return a;}catch(e){localStorage.removeItem(ORDER_KEY);return null;}}
function saveOrder(o){try{localStorage.setItem(ORDER_KEY,JSON.stringify(o));}catch(e){}}
function buildQuestions(raw,order){var out=[];for(var i=0;i<order.length;i++)out.push(raw[order[i]]);return out;}
var currentOrder=loadOrder()||identityOrder();
var QUESTIONS=buildQuestions(RAW_QUESTIONS,currentOrder);

function defaultState(){return{cur:0,answers:{},showResults:false,timerStartedAt:null,timerTotalSec:null};}
function saveState(s){try{localStorage.setItem(QUIZ_KEY,JSON.stringify(s));}catch(e){}}
function loadState(){try{var r=localStorage.getItem(QUIZ_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
var state=loadState()||defaultState();

function loadAtt(){try{return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0;}catch(e){return 0;}}
function saveAtt(n){try{localStorage.setItem(ATT_KEY,String(n));}catch(e){}}
function renderAtt(){var el=document.getElementById('attCount');if(el)el.textContent=loadAtt();}

var timerInterval=null;
function formatTime(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function renderTimer(){
  var setup=document.getElementById('timerSetup'),run=document.getElementById('timerRunning'),disp=document.getElementById('timerDisplay');
  if(!setup)return;
  if(!state.timerStartedAt){setup.style.display='flex';run.style.display='none';return;}
  setup.style.display='none';run.style.display='flex';
  var elapsed=(Date.now()-state.timerStartedAt)/1000,rem=state.timerTotalSec-elapsed;
  disp.classList.remove('warn','danger');
  if(rem<=0){disp.textContent="Time's Up";disp.classList.add('danger');stopTimerInterval();return;}
  disp.textContent=formatTime(rem);
  if(rem<=state.timerTotalSec*0.1)disp.classList.add('danger');
  else if(rem<=state.timerTotalSec*0.25)disp.classList.add('warn');
}
function startTimer(){var inp=document.getElementById('timerMin');var m=parseFloat(inp.value)||20;state.timerTotalSec=Math.round(m*60);state.timerStartedAt=Date.now();saveState(state);renderTimer();startTimerInterval();}
function startTimerInterval(){stopTimerInterval();timerInterval=setInterval(renderTimer,1000);}
function stopTimerInterval(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+QUESTIONS.length;
  document.getElementById('prog-fill').style.width=(ans/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel=document.getElementById('dot-panel');if(panel.style.display==='none')return;
  var h='';
  for(var i=0;i<QUESTIONS.length;i++){
    var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===QUESTIONS[i].ci?'#185FA5':'#E24B4A');
    h+='<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
  }
  panel.innerHTML=h;
}
function toggleJump(){
  var p=document.getElementById('dot-panel'),b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}
  else{p.style.display='none';b.textContent='Jump ▾';}
}
function goToQ(i){
  state.cur=i;state.showResults=false;saveState(state);
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').textContent='Jump ▾';
  render();
}

function pick(optIdx){
  if(state.answers[state.cur]!==undefined)return;
  state.answers[state.cur]=optIdx;
  saveState(state);render();
}
function goPrev(){if(state.cur>0){state.cur--;saveState(state);render();}}
function goNext(){
  if(state.cur<QUESTIONS.length-1){state.cur++;saveState(state);render();}
  else{
    if(!state.showResults){var a=loadAtt()+1;saveAtt(a);renderAtt();}
    state.showResults=true;saveState(state);render();
  }
}

function render(){
  var c=document.getElementById('qcard');
  if(state.showResults){renderResults();return;}
  var q=QUESTIONS[state.cur];
  var ans=state.answers[state.cur];
  var done=ans!==undefined;
  var isLast=state.cur===QUESTIONS.length-1;
  var tagCls=q.tag==='Review'?'tag-review':'tag-new';
  var optsH='';
  for(var i=0;i<q.opts.length;i++){
    var cls='opt';
    if(done){if(i===q.ci)cls+=' correct';else if(i===ans)cls+=' wrong';}
    optsH+='<button class="'+cls+'"'+(done?' disabled':'')+' onclick="pick('+i+')">'+q.opts[i]+'</button>';
  }
  var expH=done&&ans!==q.ci?'<div class="exp" style="display:block">'+q.exp+'</div>':'<div class="exp"></div>';
  var nextLbl=isLast?'See Results &#8594;':'Next &#8594;';
  c.innerHTML='<div class="card"><div class="q-num">Q'+(state.cur+1)+' of '+QUESTIONS.length+'</div><span class="tag '+tagCls+'">'+q.tag+'</span><div class="q-text">'+q.q+'</div><div class="opts">'+optsH+'</div>'+expH+'</div><div class="nav-btns"><button '+(state.cur===0?'disabled':'')+' onclick="goPrev()">&#8592; Prev</button><button onclick="goNext()">'+nextLbl+'</button></div>';
  updateNav();
}

function renderResults(){
  var correct=0,wrong=0,skip=0;
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]===undefined)skip++;
    else if(state.answers[i]===QUESTIONS[i].ci)correct++;
    else wrong++;
  }
  var pct=Math.round(correct/QUESTIONS.length*100);
  var c=document.getElementById('qcard');
  c.innerHTML='<div class="results"><div class="score-big">'+correct+'/'+QUESTIONS.length+'</div><div class="score-lbl">'+pct+'% correct</div><div class="stats-row"><div><div class="stat-n" style="color:#1D9E75">'+correct+'</div><div class="stat-lbl">Correct</div></div><div><div class="stat-n" style="color:#E24B4A">'+wrong+'</div><div class="stat-lbl">Wrong</div></div><div><div class="stat-n" style="color:#888">'+skip+'</div><div class="stat-lbl">Skipped</div></div></div><button class="res-btn btn-copy" onclick="copyRes()">Copy All Results</button><button class="res-btn btn-retry" onclick="retryWrong()">Retry Wrong Ones</button><button class="res-btn btn-fresh" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button><button class="res-btn btn-fresh" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button></div>';
  updateNav();
}

function copyRes(){
  var correct=0,lines=['[Sion] SAT Vocabulary Results'];
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i],a=state.answers[i],ok=a===q.ci;
    if(ok)correct++;
    lines.push('Q'+(i+1)+' ['+(q.tag==='Review'?'R':'N')+'] '+(a===undefined?'SKIP':ok?'OK':'WRONG')+' ('+q.opts[q.ci]+')');
  }
  lines.push('Score: '+correct+'/'+QUESTIONS.length);
  try{navigator.clipboard.writeText(lines.join('\n'));}catch(e){alert(lines.join('\n'));}
}

function retryWrong(){
  var wrong=[];
  for(var i=0;i<QUESTIONS.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==QUESTIONS[i].ci){wrong.push(i);delete state.answers[i];}}
  if(wrong.length>0){state.cur=wrong[0];state.showResults=false;saveState(state);render();}
}

var pendingFreshMode='original';
function openFreshModalOriginal(){pendingFreshMode='original';document.getElementById('freshTitle').textContent='Start Fresh (Original Order)?';document.getElementById('freshText').textContent='Questions return to their original order and all progress is cleared. This cannot be undone.';document.getElementById('freshModal').classList.add('show');}
function openFreshModalRandom(){pendingFreshMode='random';document.getElementById('freshTitle').textContent='Start Fresh (Random Order)?';document.getElementById('freshText').textContent='Questions will be reshuffled and all progress is cleared. This cannot be undone.';document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function confirmFresh(){
  currentOrder=(pendingFreshMode==='random')?shuffle(identityOrder()):identityOrder();
  saveOrder(currentOrder);QUESTIONS=buildQuestions(RAW_QUESTIONS,currentOrder);
  state=defaultState();saveState(state);stopTimerInterval();closeFreshModal();render();renderTimer();
}

window.toggleJump=toggleJump;window.goToQ=goToQ;window.pick=pick;window.goPrev=goPrev;window.goNext=goNext;
window.startTimer=startTimer;window.copyRes=copyRes;window.retryWrong=retryWrong;
window.openFreshModalOriginal=openFreshModalOriginal;window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;window.confirmFresh=confirmFresh;

render();renderTimer();if(state.timerStartedAt)startTimerInterval();renderAtt();
</script>
</body>
</html>
