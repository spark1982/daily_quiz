<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Deca Role playing quiz</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Sion] Deca Role playing quiz</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>
    <div class="dots-panel" id="dots-panel" style="display:none;"></div>
  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

  <div class="quiz-card" id="quiz-card">
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>
    <button class="hint-btn" id="hint-btn" onclick="toggleHint()" style="display:none;">Show Hint</button>
    <div class="hint-box" id="hint-box"></div>
    <div class="exp-box" id="exp-box"></div>
    <div class="nav-btns">
      <button id="prev-btn" onclick="prevQ()">Prev</button>
      <button id="next-btn" onclick="goNext()">Next</button>
    </div>
  </div>

  <div class="results-card" id="results-card" style="display:none;">
    <h2>Results</h2>
    <div class="score-big" id="score-big"></div>
    <div id="score-detail" style="text-align:center;color:#555;font-size:0.9rem;"></div>
    <div class="action-row">
      <button class="btn-retry" onclick="startRetry()">Retry Wrong Ones</button>
      <button class="btn-save" onclick="saveWrong()">Save Wrong Answers</button>
      <button class="btn-fresh" onclick="openFreshModal()">Start Fresh</button>
    </div>
  </div>

  <button class="fresh-btn-bottom" onclick="openFreshModal()">Start Fresh</button>
</div>

<div class="modal-overlay" id="fresh-modal" style="display:none;">
  <div class="modal-box">
    <p>Reset all progress and start over?</p>
    <button class="modal-yes" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="modal-no" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>

<script>
var TITLE = "[Sion] Deca Role playing quiz";
var QUIZ_KEY = "siondecaroleplay";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20260921";
var RAW_QUESTIONS = [{"stem": "You are a guest services associate at Pinewood Appliances. A customer arrives holding a washing machine that stopped working two weeks after delivery. She is visibly frustrated and says the repair delay has ruined her week. What should you do first?", "opts": ["Acknowledge her frustration, apologize for the inconvenience, and listen fully to what happened before offering any solution", "Immediately offer a full refund to end the conversation as quickly as possible", "Explain the store's return policy in detail before she finishes describing the problem", "Tell her the manufacturer, not the store, is responsible, so she should contact them instead"], "ci": 0, "exp": "In a service recovery situation, the best first move is to acknowledge the customer's frustration, apologize, and listen fully before jumping to a solution; offering a refund immediately, reciting policy, or deflecting responsibility before hearing her out can make the customer feel dismissed rather than heard."}, {"stem": "You are a marketing associate at Lumen Athletic, a brand launching a new running shoe aimed at busy working parents aged 30-45 who value convenience and quick, effective workouts. Which marketing channel and approach best fits this target audience?", "opts": ["A short-form video campaign on social platforms showing how the shoe fits into fast, 20-minute workouts around a busy schedule", "A campaign built entirely around a print ad in a skateboarding magazine", "A promotion that only targets teenage gaming influencers with no connection to fitness", "An approach with no target audience research, using the same ad for every demographic"], "ci": 0, "exp": "Effective marketing channel choice depends on matching the message and platform to the audience's habits and values; busy working parents responding to convenience and efficiency are well reached through relatable short-form video content about fitting workouts into a hectic schedule, unlike channels aimed at unrelated demographics or a one-size-fits-all approach."}, {"stem": "You manage visual merchandising for Solstice Home Goods. Sales data show customers rarely browse past the store's entrance display before leaving. Which layout change is most likely to increase browsing and cross-selling?", "opts": ["Place a rotating collection of new and complementary products along a clear path leading customers deeper into the store", "Keep the entrance display exactly the same, since layout has no effect on customer browsing behavior", "Remove all signage throughout the store so customers are not distracted while walking", "Block the main aisle with a large stack of unrelated clearance items"], "ci": 0, "exp": "Thoughtful store layout, such as placing an inviting, complementary product path near the entrance, encourages customers to move further into the store and discover more items, increasing dwell time and cross-selling; leaving the layout unchanged, removing helpful signage, or obstructing the main aisle would not address the browsing problem."}, {"stem": "As part of a strategic planning session for Brightleaf Tea Co., the team is classifying factors affecting the business. A competitor just launched a similar product line at a lower price point. How should this factor be classified in a SWOT analysis?", "opts": ["A Threat, since it is an external factor that could negatively affect the company's market position", "A Weakness, since it directly describes something wrong inside Brightleaf's own operations", "A Strength, since competitor activity always benefits the company that reacts to it", "An Opportunity, since lower competitor prices automatically increase Brightleaf's own sales"], "ci": 0, "exp": "A competitor's lower-priced product line is an external factor working against the company, which makes it a Threat in SWOT terms; Weaknesses and Strengths describe internal factors, and this development does not represent a favorable Opportunity for Brightleaf."}, {"stem": "You are a sales representative for Ferro Industrial Supply. A long-standing client, Delacroix Manufacturing, says they will only continue purchasing from you if you cut prices by 15%. Which response best reflects sound B2B negotiation practice?", "opts": ["Offer to hold the current price but add value through faster delivery terms or a modest volume-based discount instead of a flat 15% cut", "Agree to the full 15% price cut immediately to avoid losing the account", "Refuse to discuss the request at all and end the conversation", "Raise prices further in response to the client's request"], "ci": 0, "exp": "Strong B2B negotiation looks for ways to add value, such as improved delivery terms or a targeted volume discount, rather than simply capitulating to a price demand or refusing to engage at all; both extremes -- full concession or flat refusal -- tend to damage the relationship or the company's margins."}, {"stem": "You are co-founding a startup, Nimbus Meal Kits, and are preparing to approach investors for seed funding. Before the pitch, what should be your top priority?", "opts": ["Developing a clear business plan with a validated minimum viable product and evidence of early customer demand", "Designing an elaborate office space to impress investors during the pitch meeting", "Skipping market research since investors only care about the founders' personalities", "Promising investors guaranteed high returns to make the opportunity sound more appealing"], "ci": 0, "exp": "Investors want to see a credible business plan, a validated minimum viable product, and evidence that real customers want the offering; an impressive office, skipped market research, or guaranteed-return promises do not substitute for demonstrated demand and a sound business plan, and guaranteeing returns is also misleading."}, {"stem": "You manage pricing for Coral Bay Surf Shop. A new documentary made a specific wetsuit brand extremely popular, and demand has surged while your current inventory remains limited. What is the most likely economic effect if you keep prices exactly the same?", "opts": ["The wetsuits will likely sell out quickly, since demand now exceeds the limited supply at the current price", "Demand will automatically decrease on its own until it matches the existing supply at the same price", "Prices will fall permanently on their own without you making any pricing decision", "Supply will instantly expand to match new demand at no additional cost to the shop"], "ci": 0, "exp": "When demand rises sharply while supply stays limited and price is held constant, the product is likely to sell out quickly, since shoppers rushing to buy will exhaust available inventory before supply or price naturally adjusts; supply does not expand instantly and demand does not fall on its own."}, {"stem": "You are the operations director at Harvest Grain Snacks. A quality control test reveals a labeling error that omitted a common allergen on a batch already shipped to stores. What should be your first responsible action?", "opts": ["Initiate a recall process and notify retailers and regulators promptly about the labeling error", "Wait to see if any customer complaints come in before taking any action", "Quietly correct the labeling on future batches without addressing the batches already shipped", "Deny the issue publicly if asked, to protect the company's short-term reputation"], "ci": 0, "exp": "When a safety-related labeling error is discovered, the responsible first action is to initiate a recall and promptly notify retailers and regulators, since delaying action, ignoring the already-shipped batches, or denying the issue could put consumers with allergies at serious risk and expose the company to greater harm."}, {"stem": "You are a team lead at Bellcrest Financial Services. One of your team members has missed several project deadlines over the past month, which is unusual for them. What is the most appropriate first step in managing this performance issue?", "opts": ["Have a private conversation with the employee to understand the cause and discuss a plan for improvement", "Immediately issue a formal termination notice without any conversation", "Publicly call out the missed deadlines during the next full team meeting", "Ignore the pattern completely since it might resolve itself without any intervention"], "ci": 0, "exp": "Effective performance management starts with a private, direct conversation to understand what's causing the change in performance and to set a clear improvement plan; jumping to termination, publicly embarrassing the employee, or ignoring a clear pattern are all less constructive and can damage trust and morale."}, {"stem": "You are a new supervisor at Ridgeway Auto Repair and have just been given a small monthly budget to order shop supplies. Which practice best reflects sound financial literacy in this role?", "opts": ["Tracking expenses against the budget throughout the month and adjusting orders to avoid overspending", "Spending the entire budget in the first week regardless of actual need, since it is allocated anyway", "Ignoring the budget entirely and ordering based only on personal preference", "Assuming the company will always cover any amount spent beyond the budget without consequence"], "ci": 0, "exp": "Sound financial literacy in a workplace role means actively tracking spending against an assigned budget and adjusting purchases to stay within it, rather than spending impulsively, ignoring the budget, or assuming overspending carries no consequences for the business."}];
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;



loadState();
render();
</script>
