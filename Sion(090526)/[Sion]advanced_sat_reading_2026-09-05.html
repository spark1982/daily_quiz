<script>var TITLE = "[Sion] Advanced SAT Reading";var QUIZ_KEY = "quiz_sionadvreading_12_20260905_v1";var ATT_KEY = "quiz_sionadvreading_12_att_20260905_v1";var RAW_QUESTIONS = [{"stem": "What is the main purpose of this passage?", "passage": "The following text is adapted from a scientific article on bat echolocation.<br><br>Most descriptions of echolocation focus on the bat's ears, the organs that receive the returning sound. Far less attention goes to the muscles bats use to control the pitch and direction of their outgoing calls in the first place, muscles that researchers now believe do as much to shape a bat's hunting success as its famously sensitive hearing.", "opts": ["To provide a complete history of how echolocation was first discovered.", "To argue that bats do not actually rely on hearing at all to hunt.", "To compare bat echolocation to sonar systems used in submarines.", "To redirect attention from a commonly emphasized aspect of echolocation toward a less-studied but comparably important one."], "ci": 3, "exp": "The passage explicitly contrasts the commonly emphasized ears (\"most descriptions...focus on the bat's ears\") with the less-discussed muscles controlling outgoing calls, aiming to redirect the reader's attention toward this comparably important but overlooked aspect.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"stem": "What can reasonably be inferred about the expedition's situation by the fourth week?", "passage": "The following text is adapted from a historical account of an early 20th-century expedition.<br><br>By the fourth week, the crew had stopped speaking of the ship's return date. Rations were recalculated not in meals per day but in days per remaining sack of flour, and the captain's log, once filled with observations of ice formations, now recorded only wind direction and the crew's health.", "opts": ["The crew had come to expect a significantly longer, more precarious delay than they had originally planned for.", "The crew had already run out of all their food supplies entirely.", "The captain had decided to abandon the ship and expedition altogether.", "The expedition had successfully completed its original mission ahead of schedule."], "ci": 0, "exp": "The shift from discussing a return date to rationing flour by the day, along with the log's narrowed focus on survival details like wind direction and health, suggests the crew now anticipated a longer and more uncertain ordeal than originally expected, though it does not indicate supplies were already exhausted or that the mission was abandoned or completed.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "The following text is adapted from a profile of a long-serving diplomat.<br><br>Even her harshest critics conceded that the ambassador's ____ approach to negotiation, weighing every clause for years if necessary rather than rushing toward a deal, had prevented at least two treaties from collapsing under later legal challenges.", "opts": ["careless", "indifferent", "impulsive", "painstaking"], "ci": 3, "exp": "\"Painstaking\" precisely captures an approach defined by weighing every clause carefully and taking years if necessary, consistent with preventing treaties from later legal collapse; \"careless,\" \"impulsive,\" and \"indifferent\" all describe the opposite of such deliberate, thorough negotiation.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"stem": "What is the main effect of the phrase \"it had grown teeth\" in the passage?", "passage": "The following text is adapted from a novel. The narrator describes returning to her childhood home after many years away.<br><br>I had expected the house to have shrunk, the way childhood places always do when memory has been left alone with them too long. Instead, it had grown teeth. The porch sagged like a mouth left open mid-sentence, and the ivy that had once seemed decorative now gripped the brick as though it intended never to let go.", "opts": ["It emphasizes that the narrator plans to renovate the house using modern materials.", "It shows that the narrator no longer recognizes the house as her childhood home at all.", "It literally describes structural damage caused by termites eating through the house's foundation.", "It suggests the house now seems menacing rather than merely smaller, subverting the narrator's expectation of a shrunken, harmless place."], "ci": 3, "exp": "The narrator expects the house to seem smaller and less imposing, as memory often distorts places that way; instead, describing it as having \"grown teeth\" conveys an unsettling, almost predatory quality, subverting that expectation rather than describing literal damage or unfamiliarity.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"stem": "Which claim is best supported by the results described in the passage?", "passage": "The following text is adapted from a study on sleep and memory consolidation.<br><br>Researchers asked two groups of participants to memorize a list of word pairs. One group napped for ninety minutes afterward, while the other group stayed awake watching a documentary of similar length. When tested twelve hours later, the group that napped correctly recalled 85 percent of the word pairs, compared to 60 percent recalled by the group that stayed awake.", "opts": ["Word pairs are inherently harder to memorize than other types of information.", "A period of sleep shortly after learning new information can improve later recall of that information compared to staying awake.", "Watching documentaries improves memory more effectively than napping does.", "Memory recall is identical regardless of whether a person sleeps or stays awake after learning."], "ci": 1, "exp": "The napping group recalled substantially more word pairs (85 percent) than the group that stayed awake (60 percent), directly supporting the claim that a nap shortly after learning improves later recall compared to remaining awake.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"stem": "How would the researchers in Text 2 most likely respond to the claim in Text 1 that a four-day workweek would boost overall productivity?", "passage": "Text 1<br>Some economists argue that a four-day workweek would boost productivity, reasoning that well-rested employees make fewer errors and stay focused during the hours they do work, more than offsetting the lost time.<br><br>Text 2<br>Other researchers caution that a shortened workweek assumes tasks can simply be compressed without cost. In fields that depend on continuous coverage, such as healthcare or manufacturing, reducing scheduled hours often just shifts the workload onto remaining shifts or requires costly new hires to fill the gap.", "opts": ["They would argue that employees are already too well-rested to benefit from any schedule change.", "They would argue that the productivity gains Text 1 describes may not apply evenly across all industries, particularly those requiring continuous coverage.", "They would claim that productivity cannot be measured in any workplace.", "They would fully agree, adding that every industry would benefit equally from a shortened workweek."], "ci": 1, "exp": "Text 2 specifically raises industries like healthcare and manufacturing as cases where Text 1's reasoning may break down, implying that the productivity benefits described in Text 1 are not universal across all fields.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "Which choice completes the text with the most logical and precise word or phrase?", "passage": "The following text is adapted from a review of a concert performance.<br><br>The violinist's technical skill was ____; not a single note in the demanding cadenza wavered in pitch or timing, even during the passage's most rapid runs.", "opts": ["erratic", "impeccable", "questionable", "adequate"], "ci": 1, "exp": "\"Impeccable\" precisely conveys flawless technical skill, matching the claim that not a single note wavered in pitch or timing; \"questionable,\" \"adequate,\" and \"erratic\" all suggest imperfection or mere sufficiency, which contradicts the described flawless performance.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"stem": "How does the statement that the printing press \"fundamentally changed what a 'copy' meant\" function in relation to the passage's opening description of hand-copied manuscripts?", "passage": "The following text is adapted from an essay on the invention of the printing press.<br><br>Before Gutenberg, a single copied manuscript could take a scribe months to complete, and errors crept in with each new hand that copied it. The printing press did not merely speed up this process; it fundamentally changed what a \"copy\" meant, allowing hundreds of identical texts to exist where once there had been only slowly diverging near-duplicates.", "opts": ["It contradicts the opening description by denying that hand-copied manuscripts contained any errors.", "It shifts from describing a practical limitation of hand-copying to explaining a deeper, conceptual change the printing press introduced.", "It simply restates the opening description's point about how long manuscripts took to copy.", "It introduces an entirely unrelated topic about the history of paper manufacturing."], "ci": 1, "exp": "The opening description explains the slow, error-prone nature of hand-copying, while the statement about \"what a 'copy' meant\" moves beyond that practical detail to argue that the printing press changed the very concept of a \"copy,\" representing a shift from describing a limitation to explaining a deeper conceptual consequence.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"stem": "Which finding from the passage most directly supports the researcher's claim?", "passage": "The following text is adapted from a report on a city's public transit ridership.<br><br>A transit researcher claims that fare-free bus service substantially increases ridership among low-income residents. In a pilot program, three bus routes serving predominantly low-income neighborhoods eliminated fares for six months. Ridership on those three routes rose by 42 percent, while ridership on comparable routes that still charged fares in similar neighborhoods rose by only 6 percent over the same period.", "opts": ["The 42 percent ridership increase on fare-free routes far exceeded the 6 percent increase on routes that still charged fares in similar neighborhoods.", "The researcher works for the city's transit agency.", "The three routes selected served predominantly low-income neighborhoods.", "The pilot program lasted exactly six months."], "ci": 0, "exp": "The sharp contrast between the 42 percent ridership increase on fare-free routes and the much smaller 6 percent increase on comparable fare-charging routes directly supports the claim that eliminating fares substantially increased ridership, since it isolates the effect of the fare change itself.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"stem": "Based on the two texts, what is one key difference between the two research teams' explanations for coral bleaching?", "passage": "Text 1<br>A team of marine biologists reported that coral bleaching events in the region had become twice as frequent over the past two decades, attributing the trend primarily to rising ocean temperatures caused by climate change.<br><br>Text 2<br>A separate research group studying the same reefs found that local pollution, particularly agricultural runoff, was strongly correlated with bleaching severity at individual reef sites, suggesting that water quality plays a substantial role alongside broader ocean warming trends.", "opts": ["Text 1 emphasizes a broad, region-wide climate cause, while Text 2 highlights a more localized factor tied to specific reef sites.", "Text 1 blames agricultural runoff, while Text 2 blames rising ocean temperatures.", "Text 2 concludes that coral bleaching has actually decreased over the past two decades.", "Both texts agree that pollution is the sole cause of coral bleaching in the region."], "ci": 0, "exp": "Text 1 points to a broad climate-driven cause (rising ocean temperatures across the whole region), while Text 2 identifies a more site-specific factor (local agricultural runoff) affecting individual reefs, showing the two teams emphasize different scales of explanation.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"stem": "What does the passage most strongly suggest about public attitudes toward gas street lighting over time?", "passage": "The following text is adapted from an essay on the history of urban lighting.<br><br>When gas lamps first lined city streets in the early 1800s, some residents petitioned to have them removed, arguing that a well-lit street stripped away the natural cover of night that had long made evening strolls feel private and unremarkable. Within a generation, however, the same streets buzzed with a nightlife that had barely existed before.", "opts": ["Gas lamps were installed against the wishes of city governments everywhere.", "Residents never changed their opinion and continued to oppose gas lamps indefinitely.", "Nightlife had already been fully developed before gas lamps were introduced.", "Initial resistance rooted in a loss of nighttime privacy gave way to widespread embrace once lighting enabled new evening activity."], "ci": 3, "exp": "The passage describes initial petitions against the lamps for eliminating nighttime privacy, but then notes that within a generation the same streets \"buzzed with nightlife that had barely existed before,\" implying attitudes shifted as the lighting enabled new social activity.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"stem": "Why does the author most likely include the detail that scientists describe the octopus as \"not as one mind but as nine\"?", "passage": "The following text is adapted from a science journalism article about octopus cognition.<br><br>Researchers once assumed that intelligence required a centralized brain, the kind mammals and birds possess. The octopus complicates this picture: roughly two-thirds of its neurons reside not in its central brain but scattered throughout its eight arms, each capable of independently sensing, tasting, and reacting to its environment. Scientists have taken to describing the octopus not as one mind but as nine &mdash; a central hub surrounded by eight semi-autonomous outposts.", "opts": ["To argue that octopuses are more intelligent than humans in every measurable way.", "To provide a precise anatomical count of the octopus's brain lobes.", "To suggest that scientists cannot agree on how many arms an octopus actually has.", "To vividly underscore how radically the octopus's distributed nervous system challenges conventional assumptions about centralized intelligence."], "ci": 3, "exp": "The vivid \"nine minds\" description dramatizes just how unusual and decentralized the octopus's nervous system is compared to the centralized-brain model the passage says scientists once assumed, reinforcing the paragraph's larger point rather than making a claim about relative intelligence or anatomy counts.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}

  if(!Array.isArray(arr) || arr.length===0) return false;

  return true;
}

}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');

function startTimer(){

function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }

  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
