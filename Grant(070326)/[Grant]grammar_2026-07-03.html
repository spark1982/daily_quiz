<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Grammar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#222;min-height:100vh;}
#app{max-width:700px;margin:0 auto;padding:16px;}
h1{text-align:center;font-size:1.35rem;font-weight:800;color:#185FA5;padding:14px 0 4px;}
.instr{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;min-width:52px;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:6px;}
.timer-bar{background:white;border:1px solid #d0dce8;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:white;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
#att-bar{text-align:center;font-size:0.8rem;color:#888;margin-bottom:8px;}
#att-bar span{font-weight:700;color:#185FA5;}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:20px 18px;margin-bottom:12px;}
.q-num{font-size:0.78rem;color:#888;margin-bottom:8px;}
.topic-tag{display:inline-block;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#e3f0ff;color:#185FA5;margin-bottom:10px;}
.ctx-box{background:#f5f9ff;border-left:3px solid #185FA5;padding:10px 14px;border-radius:4px;font-style:italic;font-size:0.95rem;line-height:1.7;color:#222;margin-bottom:12px;}
.q-text{font-size:0.95rem;line-height:1.5;margin-bottom:14px;color:#333;font-weight:600;}
.opts{display:grid;gap:8px;}
.opt{padding:11px 14px;border:2px solid #d7dde6;border-radius:8px;cursor:pointer;font-size:0.92rem;background:white;text-align:left;line-height:1.45;transition:border-color 0.15s,background 0.15s;}
.opt:hover:not(:disabled){border-color:#185FA5;background:#f0f6ff;}
.opt.correct{border-color:#1D9E75;background:#e6f7f1;color:#0d6b50;font-weight:700;}
.opt.wrong{border-color:#E24B4A;background:#fdf0f0;color:#b03030;}
.opt:disabled{cursor:default;}
.exp{margin-top:12px;padding:11px;background:#f5f9ff;border-left:3px solid #185FA5;border-radius:4px;font-size:0.86rem;line-height:1.55;color:#333;display:none;}
.nav-btns{display:flex;gap:8px;margin-top:8px;}
.nav-btns button{flex:1;padding:10px;border:1.5px solid #d7dde6;border-radius:8px;background:white;cursor:pointer;font-size:0.9rem;color:#444;}
.nav-btns button:hover:not(:disabled){border-color:#185FA5;color:#185FA5;}
.nav-btns button:disabled{opacity:0.4;cursor:not-allowed;}
.results{background:white;border-radius:12px;padding:28px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.score-big{font-size:3rem;font-weight:900;color:#185FA5;}
.score-lbl{color:#888;font-size:0.9rem;margin-bottom:16px;}
.stats-row{display:flex;justify-content:center;gap:28px;margin-bottom:22px;}
.stat-n{font-size:1.5rem;font-weight:800;}
.stat-lbl{font-size:0.75rem;color:#888;}
.res-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;}
.btn-copy{background:#7b61ff;color:white;}
.btn-retry{background:#1D9E75;color:white;}
.btn-fresh{background:#e8ecf0;color:#444;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-ov.show{display:flex;}
.modal-box{background:white;border-radius:14px;padding:24px;max-width:360px;width:90%;text-align:center;}
.modal-box h3{color:#185FA5;margin-bottom:10px;font-size:1.05rem;}
.modal-box p{font-size:0.88rem;color:#555;margin-bottom:18px;line-height:1.5;}
.modal-acts{display:flex;gap:10px;}
.modal-acts button{flex:1;padding:10px;border:none;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;}
.modal-acts .cancel{background:#e8ecf0;color:#444;}
.modal-acts .confirm{background:#E24B4A;color:white;}
</style>
</head>
<body>
<div id="app">
  <h1>[Grant] Grammar</h1>
  <div class="instr">Choose the best answer for each grammar question.</div>
  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>
  <div class="timer-bar">
    <div class="timer-setup" id="timerSetup">
      <label for="timerMin">Set Time Limit:</label>
      <input type="number" id="timerMin" min="1" max="180" value="20"> min
      <button class="timer-start-btn" onclick="startTimer()">Start</button>
    </div>
    <div class="timer-running" id="timerRunning" style="display:none;">
      <span class="timer-label">Time Left</span>
      <span class="timer-display" id="timerDisplay">20:00</span>
    </div>
  </div>
  <div id="att-bar">Total Attempts: <span id="attCount">0</span></div>
  <div id="qcard"></div>
  <div id="freshModal" class="modal-ov">
    <div class="modal-box">
      <h3 id="freshTitle">Start Fresh?</h3>
      <p id="freshText">All progress will be cleared. This cannot be undone.</p>
      <div class="modal-acts">
        <button class="cancel" onclick="closeFreshModal()">Cancel</button>
        <button class="confirm" onclick="confirmFresh()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>
<script>
var DATE='20260702';
var QUIZ_KEY='quiz_grantgrammar_20_'+DATE+'_v1';
var ATT_KEY='quiz_grantgrammar_att_'+DATE+'_v1';
var ORDER_KEY=QUIZ_KEY+'_order_v1';

var RAW_QUESTIONS=[
  {topic:'Common and Proper Nouns',
   ctx:'My aunt visited the Grand Canyon last summer.',
   q:'Which word in the sentence is a proper noun?',
   opts:['aunt','visited','Grand Canyon','summer'],ci:2,
   exp:'"Grand Canyon" names a specific place and must be capitalized, making it a proper noun. "Aunt" and "summer" are common nouns because they name general people or times, not a specific one.'},
  {topic:'Possessive Nouns',
   ctx:'',
   q:'Which sentence uses a possessive noun correctly?',
   opts:['The dogs bone was buried in the yard.','The dog\'s bone was buried in the yard.','The dogs\' bone was buried in the yard.','The dog\'s\' bone was buried in the yard.'],ci:1,
   exp:'"Dog\'s" is the correct singular possessive form, showing the bone belongs to one dog. "Dogs" has no apostrophe and shows no possession, "dogs\'" is plural possessive for more than one dog, and "dog\'s\'" is not a real form.'},
  {topic:'Homophones',
   ctx:'_____ bringing their own lunch to the field trip.',
   q:'Which choice correctly completes the sentence?',
   opts:['Their','There','They\'re','Thier'],ci:2,
   exp:'"They\'re" is the contraction of "they are," which fits the sentence. "Their" shows possession, "there" refers to a place, and "thier" is simply misspelled.'},
  {topic:'Article Usage',
   ctx:'She wanted to adopt _____ orange kitten from the shelter.',
   q:'Which article correctly completes the sentence?',
   opts:['a','an','the','no article needed'],ci:1,
   exp:'"An" is used before words that begin with a vowel sound. "Orange" begins with a vowel sound, so "an orange kitten" is correct.'},
  {topic:'Double Negatives',
   ctx:'',
   q:'Which sentence avoids a double negative?',
   opts:['I don\'t have no homework tonight.','I don\'t have any homework tonight.','I don\'t got no homework tonight.','I ain\'t got no homework tonight.'],ci:1,
   exp:'"I don\'t have any homework tonight" uses only one negative word, which is correct Standard English. The other choices each pair "don\'t" or "ain\'t" with a second negative word like "no," creating a double negative.'},
  {topic:'Object Pronouns',
   ctx:'The coach handed the whistle to _____ before the game started.',
   q:'Which pronoun correctly completes the sentence?',
   opts:['he','him','himself','his'],ci:1,
   exp:'"Him" is the object form of the pronoun, needed because it follows the preposition "to." "He" is a subject pronoun, "himself" is reflexive, and "his" shows possession.'},
  {topic:'Antecedent Agreement',
   ctx:'Each of the girls brought _____ own sleeping bag to the campout.',
   q:'Which pronoun correctly completes the sentence?',
   opts:['their','her','they','them'],ci:1,
   exp:'"Each" is singular, so the pronoun that refers back to it must also be singular. Since "each" refers to individual girls, the singular "her" agrees correctly. "Their," "they," and "them" are all plural and do not match the singular "each."'},
  {topic:'Adjective Order',
   ctx:'',
   q:'Which sentence places the adjectives in the correct order?',
   opts:['She wore a beautiful long red scarf.','She wore a red long beautiful scarf.','She wore a long beautiful red scarf.','She wore a red beautiful long scarf.'],ci:0,
   exp:'English adjective order typically places opinion words like "beautiful" before size words like "long," which come before color words like "red." "A beautiful long red scarf" follows this order correctly.'},
  {topic:'Semicolons',
   ctx:'',
   q:'Which sentence uses a semicolon correctly?',
   opts:['I love pizza; and pasta.','I love pizza; my sister prefers tacos.','I love pizza, my sister; prefers tacos.','I love pizza; my sister prefers, tacos.'],ci:1,
   exp:'A semicolon can join two independent clauses that are closely related, without using a conjunction. "I love pizza; my sister prefers tacos" correctly joins two complete thoughts this way. The other choices misuse the semicolon or add unnecessary commas.'},
  {topic:'Quotation Marks',
   ctx:'',
   q:'Which sentence punctuates the dialogue correctly?',
   opts:['Maria said, "I finished my homework already."','Maria said "I finished my homework already."','Maria said, I finished my homework already.','"Maria said, I finished my homework already."'],ci:0,
   exp:'A comma should follow the speaker tag "Maria said," and the exact words spoken belong inside quotation marks. The other choices are missing the comma, missing the quotation marks, or place them in the wrong spot.'},
  {topic:'Compound Subjects',
   ctx:'Marcus and his brother _____ building a treehouse this weekend.',
   q:'Which verb correctly completes the sentence?',
   opts:['is','are','was','has'],ci:1,
   exp:'When two subjects are joined by "and," they form a compound subject and are treated as plural. "Marcus and his brother" need the plural verb "are."'},
  {topic:'Compound Predicates',
   ctx:'The dog barked at the mail carrier and chased its tail in excitement.',
   q:'What are the two verbs that make up the compound predicate in this sentence?',
   opts:['dog and barked','barked and chased','mail carrier and tail','barked and excitement'],ci:1,
   exp:'A compound predicate has one subject performing two or more actions. Here, the single subject "dog" both "barked" and "chased," making these the two verbs of the compound predicate.'},
  {topic:'Collective Nouns',
   ctx:'The _____ of geese flew south for the winter.',
   q:'Which collective noun correctly completes the sentence?',
   opts:['pack','flock','herd','school'],ci:1,
   exp:'A group of geese is called a "flock." "Pack" is used for wolves or dogs, "herd" for cattle or deer, and "school" for fish.'},
  {topic:'Conjunctive Adverbs',
   ctx:'Jasmine practiced the piano every day; _____, she still made mistakes during the recital.',
   q:'Which conjunctive adverb correctly completes the sentence?',
   opts:['moreover','however','therefore','meanwhile'],ci:1,
   exp:'"However" signals a contrast between Jasmine\'s daily practice and the fact that she still made mistakes. "Moreover" would add similar information, "therefore" would show a result, and "meanwhile" would show something happening at the same time, none of which fit the contrast here.'},
  {topic:'Correlative Conjunctions',
   ctx:'_____ the rain nor the wind could stop the parade from continuing.',
   q:'Which correlative conjunction correctly completes the sentence?',
   opts:['Either','Neither','Both','Whether'],ci:1,
   exp:'"Neither" pairs correctly with "nor" to show that two things, the rain and the wind, both failed to stop the parade. "Either" pairs with "or," "both" pairs with "and," and "whether" pairs with "or" in a different kind of sentence.'},
  {topic:'Prepositional Phrases',
   ctx:'The keys to the front door were hidden under the flowerpot.',
   q:'Which is a prepositional phrase in this sentence?',
   opts:['the keys','under the flowerpot','were hidden','front door'],ci:1,
   exp:'"Under the flowerpot" begins with the preposition "under" and ends with its object, "flowerpot," making it a prepositional phrase that tells where the keys were hidden.'},
  {topic:'Interjections',
   ctx:'Wow, that roller coaster was terrifying!',
   q:'Which word in the sentence is an interjection?',
   opts:['Wow','roller coaster','was','terrifying'],ci:0,
   exp:'"Wow" expresses sudden emotion and is set off from the rest of the sentence, which makes it an interjection.'},
  {topic:'Verb Tense Identification',
   ctx:'By next summer, she will have finished writing her first novel.',
   q:'What verb tense is used in this sentence?',
   opts:['Simple future','Present perfect','Future perfect','Past perfect'],ci:2,
   exp:'"Will have finished" describes an action that will be completed before a specific point in the future ("by next summer"), which is the future perfect tense.'},
  {topic:'Irregular Plural Nouns',
   ctx:'',
   q:'Which sentence uses the correct plural form?',
   opts:['I saw two gooses swimming in the pond.','I saw two geese swimming in the pond.','I saw two geeses swimming in the pond.','I saw two goose swimming in the pond.'],ci:1,
   exp:'"Goose" has an irregular plural form, "geese." Adding -s or -es ("gooses," "geeses") is incorrect, and "goose" alone is singular.'},
  {topic:'Run-on Sentences',
   ctx:'',
   q:'Which choice correctly fixes the run-on sentence: "The bell rang the students rushed to their next class."',
   opts:['The bell rang, the students rushed to their next class.','The bell rang the students, rushed to their next class.','The bell rang, and the students rushed to their next class.','The bell rang students rushed to their next class.'],ci:2,
   exp:'Two independent clauses need to be joined correctly, either with a comma and a coordinating conjunction like "and," or with proper punctuation. "The bell rang, and the students rushed to their next class" fixes the run-on this way. "The bell rang, the students rushed to their next class" is a comma splice missing the conjunction, and the remaining choices are still run-ons.'}
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function identityOrder(){var o=[];for(var i=0;i<RAW_QUESTIONS.length;i++)o.push(i);return o;}
function isValidOrder(arr){if(!Array.isArray(arr)||arr.length!==RAW_QUESTIONS.length)return false;var s=arr.slice().sort(function(a,b){return a-b;});for(var i=0;i<s.length;i++)if(s[i]!==i)return false;return true;}
function loadOrder(){try{var r=localStorage.getItem(ORDER_KEY);if(!r)return null;var a=JSON.parse(r);if(!isValidOrder(a))throw new Error();return a;}catch(e){localStorage.removeItem(ORDER_KEY);return null;}}
function saveOrder(o){try{localStorage.setItem(ORDER_KEY,JSON.stringify(o));}catch(e){}}
function buildQuestions(raw,order){var out=[];for(var i=0;i<order.length;i++)out.push(raw[order[i]]);return out;}
var currentOrder=loadOrder()||identityOrder();
var QUESTIONS=buildQuestions(RAW_QUESTIONS,currentOrder);

function defaultState(){return{cur:0,answers:{},showResults:false,timerStartedAt:null,timerTotalSec:null};}
function saveState(s){try{localStorage.setItem(QUIZ_KEY,JSON.stringify(s));}catch(e){}}
function loadState(){try{var r=localStorage.getItem(QUIZ_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
var state=loadState()||defaultState();

function loadAtt(){try{return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0;}catch(e){return 0;}}
function saveAtt(n){try{localStorage.setItem(ATT_KEY,String(n));}catch(e){}}
function renderAtt(){var el=document.getElementById('attCount');if(el)el.textContent=loadAtt();}

var timerInterval=null;
function formatTime(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function renderTimer(){
  var setup=document.getElementById('timerSetup'),run=document.getElementById('timerRunning'),disp=document.getElementById('timerDisplay');
  if(!setup)return;
  if(!state.timerStartedAt){setup.style.display='flex';run.style.display='none';return;}
  setup.style.display='none';run.style.display='flex';
  var elapsed=(Date.now()-state.timerStartedAt)/1000,rem=state.timerTotalSec-elapsed;
  disp.classList.remove('warn','danger');
  if(rem<=0){disp.textContent="Time's Up";disp.classList.add('danger');stopTimerInterval();return;}
  disp.textContent=formatTime(rem);
  if(rem<=state.timerTotalSec*0.1)disp.classList.add('danger');
  else if(rem<=state.timerTotalSec*0.25)disp.classList.add('warn');
}
function startTimer(){var inp=document.getElementById('timerMin');var m=parseFloat(inp.value)||20;state.timerTotalSec=Math.round(m*60);state.timerStartedAt=Date.now();saveState(state);renderTimer();startTimerInterval();}
function startTimerInterval(){stopTimerInterval();timerInterval=setInterval(renderTimer,1000);}
function stopTimerInterval(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+QUESTIONS.length;
  document.getElementById('prog-fill').style.width=(ans/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel=document.getElementById('dot-panel');if(panel.style.display==='none')return;
  var h='';
  for(var i=0;i<QUESTIONS.length;i++){
    var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===QUESTIONS[i].ci?'#185FA5':'#E24B4A');
    h+='<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
  }
  panel.innerHTML=h;
}
function toggleJump(){
  var p=document.getElementById('dot-panel'),b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}
  else{p.style.display='none';b.textContent='Jump ▾';}
}
function goToQ(i){state.cur=i;state.showResults=false;saveState(state);document.getElementById('dot-panel').style.display='none';document.getElementById('jump-btn').textContent='Jump ▾';render();}
function pick(optIdx){if(state.answers[state.cur]!==undefined)return;state.answers[state.cur]=optIdx;saveState(state);render();}
function goPrev(){if(state.cur>0){state.cur--;saveState(state);render();}}
function goNext(){
  if(state.cur<QUESTIONS.length-1){state.cur++;saveState(state);render();}
  else{if(!state.showResults){var a=loadAtt()+1;saveAtt(a);renderAtt();}state.showResults=true;saveState(state);render();}
}
function render(){
  var c=document.getElementById('qcard');
  if(state.showResults){renderResults();return;}
  var q=QUESTIONS[state.cur],ans=state.answers[state.cur],done=ans!==undefined;
  var isLast=state.cur===QUESTIONS.length-1;
  var ctxH=q.ctx?'<div class="ctx-box">'+q.ctx+'</div>':'';
  var optsH='';
  for(var i=0;i<q.opts.length;i++){
    var cls='opt';
    if(done){if(i===q.ci)cls+=' correct';else if(i===ans)cls+=' wrong';}
    optsH+='<button class="'+cls+'"'+(done?' disabled':'')+' onclick="pick('+i+')">'+q.opts[i]+'</button>';
  }
  var expH=done&&ans!==q.ci?'<div class="exp" style="display:block">'+q.exp+'</div>':'';
  var nextLbl=isLast?'See Results &#8594;':'Next &#8594;';
  c.innerHTML='<div class="card"><div class="q-num">Q'+(state.cur+1)+' of '+QUESTIONS.length+'</div><span class="topic-tag">'+q.topic+'</span>'+ctxH+'<div class="q-text">'+q.q+'</div><div class="opts">'+optsH+'</div>'+expH+'</div><div class="nav-btns"><button '+(state.cur===0?'disabled':'')+' onclick="goPrev()">← Prev</button><button onclick="goNext()">'+nextLbl+'</button></div>';
  updateNav();
}
function renderResults(){
  var correct=0,wrong=0,skip=0;
  for(var i=0;i<QUESTIONS.length;i++){if(state.answers[i]===undefined)skip++;else if(state.answers[i]===QUESTIONS[i].ci)correct++;else wrong++;}
  var pct=Math.round(correct/QUESTIONS.length*100);
  document.getElementById('qcard').innerHTML='<div class="results"><div class="score-big">'+correct+'/'+QUESTIONS.length+'</div><div class="score-lbl">'+pct+'% correct</div><div class="stats-row"><div><div class="stat-n" style="color:#1D9E75">'+correct+'</div><div class="stat-lbl">Correct</div></div><div><div class="stat-n" style="color:#E24B4A">'+wrong+'</div><div class="stat-lbl">Wrong</div></div><div><div class="stat-n" style="color:#888">'+skip+'</div><div class="stat-lbl">Skipped</div></div></div><button class="res-btn btn-copy" onclick="copyRes()">Copy All Results</button><button class="res-btn btn-retry" onclick="retryWrong()">Retry Wrong Ones</button><button class="res-btn btn-fresh" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button><button class="res-btn btn-fresh" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button></div>';
  updateNav();
}
function copyRes(){
  var correct=0,lines=['[Grant] Grammar Results'];
  for(var i=0;i<QUESTIONS.length;i++){var q=QUESTIONS[i],a=state.answers[i],ok=a===q.ci;if(ok)correct++;lines.push('Q'+(i+1)+' ['+q.topic+'] '+(a===undefined?'SKIP':ok?'OK':'WRONG'));}
  lines.push('Score: '+correct+'/'+QUESTIONS.length);
  try{navigator.clipboard.writeText(lines.join('\n'));}catch(e){alert(lines.join('\n'));}
}
function retryWrong(){
  var wrong=[];
  for(var i=0;i<QUESTIONS.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==QUESTIONS[i].ci){wrong.push(i);delete state.answers[i];}}
  if(wrong.length>0){state.cur=wrong[0];state.showResults=false;saveState(state);render();}
}
var pendingFreshMode='original';
function openFreshModalOriginal(){pendingFreshMode='original';document.getElementById('freshTitle').textContent='Start Fresh (Original Order)?';document.getElementById('freshText').textContent='Questions return to their original order and all progress is cleared.';document.getElementById('freshModal').classList.add('show');}
function openFreshModalRandom(){pendingFreshMode='random';document.getElementById('freshTitle').textContent='Start Fresh (Random Order)?';document.getElementById('freshText').textContent='Questions will be reshuffled and all progress is cleared.';document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
