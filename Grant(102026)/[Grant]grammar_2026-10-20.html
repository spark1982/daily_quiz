var TITLE = "[Grant] Grammar";

var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261020";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have seen", "had saw", "NO CHANGE", "saw"], "ci": 3, "exp": "“On our very first morning” names a finished time, so use the simple past: <i>We <b>saw</b> the Lincoln Memorial on our very first morning.</i> (<i>Have saw</i> is never correct — <i>saw</i> never goes with <i>have</i>.)", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Letter to Grandpa</strong><br><b>(1)</b> Our family trip to Washington, D.C., was the best vacation ever. <b>(2)</b> We <u>have saw</u> the Lincoln Memorial on our very first morning. <b>(3)</b> Dad and <u>me</u> counted all the steps up to the giant statue. <b>(4)</b> The space museum was huge. <b>(5)</b> It had a real capsule from the moon missions. <b>(6)</b> After a long lunch at the museum café we rode the subway to the National Zoo. <b>(7)</b> I can’t wait to show you all my pictures, Grandpa!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["myself", "us", "I", "NO CHANGE"], "ci": 2, "exp": "Use <i>I</i> when you are part of the subject. Test it by taking out “Dad and”: <i><b>I</b> counted the steps</i>, not <i>me counted</i>. <i>Dad and <b>I</b> counted all the steps.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Letter to Grandpa</strong><br><b>(1)</b> Our family trip to Washington, D.C., was the best vacation ever. <b>(2)</b> We <u>have saw</u> the Lincoln Memorial on our very first morning. <b>(3)</b> Dad and <u>me</u> counted all the steps up to the giant statue. <b>(4)</b> The space museum was huge. <b>(5)</b> It had a real capsule from the moon missions. <b>(6)</b> After a long lunch at the museum café we rode the subway to the National Zoo. <b>(7)</b> I can’t wait to show you all my pictures, Grandpa!"}, {"stem": "What is the best way to combine sentences 4 and 5?", "opts": ["The space museum was huge, it had a real capsule from the moon missions.", "The space museum was huge, so it had a real capsule from the moon missions.", "The space museum was huge, and it had a real capsule from the moon missions.", "The space museum was huge and, it had a real capsule from the moon missions."], "ci": 2, "exp": "Two complete sentences can be joined with a comma <i>before</i> <i>and</i>. <i>So</i> would wrongly say the museum had the capsule BECAUSE it was huge: <i>The space museum was huge<b>, and</b> it had a real capsule.</i>", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Letter to Grandpa</strong><br><b>(1)</b> Our family trip to Washington, D.C., was the best vacation ever. <b>(2)</b> We <u>have saw</u> the Lincoln Memorial on our very first morning. <b>(3)</b> Dad and <u>me</u> counted all the steps up to the giant statue. <b>(4)</b> The space museum was huge. <b>(5)</b> It had a real capsule from the moon missions. <b>(6)</b> After a long lunch at the museum café we rode the subway to the National Zoo. <b>(7)</b> I can’t wait to show you all my pictures, Grandpa!"}, {"stem": "Where should a comma be added in sentence 6?", "opts": ["After a long lunch at the museum café, we rode the subway to the National Zoo.", "After a long lunch, at the museum café we rode the subway to the National Zoo.", "After a long lunch at the museum café we rode, the subway to the National Zoo.", "After a long lunch at the museum café we rode the subway, to the National Zoo."], "ci": 0, "exp": "Put a comma after a long introductory phrase that comes before the main sentence: <i>After a long lunch at the museum café<b>,</b> we rode the subway.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Letter to Grandpa</strong><br><b>(1)</b> Our family trip to Washington, D.C., was the best vacation ever. <b>(2)</b> We <u>have saw</u> the Lincoln Memorial on our very first morning. <b>(3)</b> Dad and <u>me</u> counted all the steps up to the giant statue. <b>(4)</b> The space museum was huge. <b>(5)</b> It had a real capsule from the moon missions. <b>(6)</b> After a long lunch at the museum café we rode the subway to the National Zoo. <b>(7)</b> I can’t wait to show you all my pictures, Grandpa!"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["turn", "is turning", "has turned", "NO CHANGE"], "ci": 0, "exp": "The subject is <i>leaves</i> (plural), not <i>trees</i>. A plural subject needs a plural verb: <i>The leaves on many trees <b>turn</b> red.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: Why Leaves Change Color</strong><br><b>(1)</b> Every fall, the leaves on many trees <u>turns</u> red, orange, and yellow. <b>(2)</b> During spring and summer, leaves are green because of a chemical called chlorophyll. <b>(3)</b> As the days grow shorter, the trees stop making it. <b>(4)</b> The yellow and orange colors <u>have been</u> hiding in the leaves all along. <b>(5)</b> Red colors come from sugars. <b>(6)</b> The sugars get trapped inside the leaf. <b>(7)</b> A trees’ bright colors usually last only a few weeks."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["has been", "have be", "had being", "NO CHANGE"], "ci": 3, "exp": "This is already correct. The subject <i>colors</i> is plural, so use <i>have</i>, and <i>have been hiding</i> shows the colors were there the whole time: <i>The colors <b>have been</b> hiding in the leaves all along.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Report: Why Leaves Change Color</strong><br><b>(1)</b> Every fall, the leaves on many trees <u>turns</u> red, orange, and yellow. <b>(2)</b> During spring and summer, leaves are green because of a chemical called chlorophyll. <b>(3)</b> As the days grow shorter, the trees stop making it. <b>(4)</b> The yellow and orange colors <u>have been</u> hiding in the leaves all along. <b>(5)</b> Red colors come from sugars. <b>(6)</b> The sugars get trapped inside the leaf. <b>(7)</b> A trees’ bright colors usually last only a few weeks."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Red colors come from sugars, they get trapped inside the leaf.", "Red colors come from sugars that get trapped inside the leaf.", "Red colors come from sugars who get trapped inside the leaf.", "Red colors come from sugars, which they get trapped inside the leaf."], "ci": 1, "exp": "Use <i>that</i> or <i>which</i> (not <i>who</i>) for things, and do not add an extra <i>they</i>: <i>Red colors come from sugars <b>that</b> get trapped inside the leaf.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: Why Leaves Change Color</strong><br><b>(1)</b> Every fall, the leaves on many trees <u>turns</u> red, orange, and yellow. <b>(2)</b> During spring and summer, leaves are green because of a chemical called chlorophyll. <b>(3)</b> As the days grow shorter, the trees stop making it. <b>(4)</b> The yellow and orange colors <u>have been</u> hiding in the leaves all along. <b>(5)</b> Red colors come from sugars. <b>(6)</b> The sugars get trapped inside the leaf. <b>(7)</b> A trees’ bright colors usually last only a few weeks."}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["During spring and summer, leaves are green because of a chemical called chlorophyll.", "As the days grow shorter, the trees stop making it.", "The sugars get trapped inside the leaf.", "A trees’ bright colors usually last only a few weeks."], "ci": 3, "exp": "For ONE tree, add <i>’s</i>: <i>A <b>tree’s</b> bright colors usually last only a few weeks.</i> <i>Trees’</i> is for more than one tree, but the sentence says “a tree.”", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Report: Why Leaves Change Color</strong><br><b>(1)</b> Every fall, the leaves on many trees <u>turns</u> red, orange, and yellow. <b>(2)</b> During spring and summer, leaves are green because of a chemical called chlorophyll. <b>(3)</b> As the days grow shorter, the trees stop making it. <b>(4)</b> The yellow and orange colors <u>have been</u> hiding in the leaves all along. <b>(5)</b> Red colors come from sugars. <b>(6)</b> The sugars get trapped inside the leaf. <b>(7)</b> A trees’ bright colors usually last only a few weeks."}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["played", "have play", "has played", "NO CHANGE"], "ci": 0, "exp": "<i>Yesterday</i> is a finished time, so use the simple past, not <i>have</i>: <i>Yesterday I <b>played</b> the trumpet for the first time.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Band Diary</strong><br><b>(1)</b> Yesterday I <u>have played</u> the trumpet in band class for the first time. <b>(2)</b> Mr. Hall showed us how to press our lips together and buzz. <b>(3)</b> At first, my trumpet <u>sounds</u> like an angry goose. <b>(4)</b> Mr. Hall said we <u>should</u> practice for twenty minutes every day. <b>(5)</b> Because my little brother covers his ears whenever I play. <b>(6)</b> Maybe I will practice in the garage instead. <b>(7)</b> Next week we get to learn a real song!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["will sound", "is sounding", "sounded", "NO CHANGE"], "ci": 2, "exp": "The diary tells about yesterday in the past tense, so do not switch to the present: <i>At first, my trumpet <b>sounded</b> like an angry goose.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Band Diary</strong><br><b>(1)</b> Yesterday I <u>have played</u> the trumpet in band class for the first time. <b>(2)</b> Mr. Hall showed us how to press our lips together and buzz. <b>(3)</b> At first, my trumpet <u>sounds</u> like an angry goose. <b>(4)</b> Mr. Hall said we <u>should</u> practice for twenty minutes every day. <b>(5)</b> Because my little brother covers his ears whenever I play. <b>(6)</b> Maybe I will practice in the garage instead. <b>(7)</b> Next week we get to learn a real song!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["should of", "NO CHANGE", "should to", "shoulds"], "ci": 1, "exp": "This is already correct. After <i>should</i>, use the plain verb: <i>we <b>should</b> practice</i>. (<i>Should of</i> is a mistake for <i>should have</i>.)", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Band Diary</strong><br><b>(1)</b> Yesterday I <u>have played</u> the trumpet in band class for the first time. <b>(2)</b> Mr. Hall showed us how to press our lips together and buzz. <b>(3)</b> At first, my trumpet <u>sounds</u> like an angry goose. <b>(4)</b> Mr. Hall said we <u>should</u> practice for twenty minutes every day. <b>(5)</b> Because my little brother covers his ears whenever I play. <b>(6)</b> Maybe I will practice in the garage instead. <b>(7)</b> Next week we get to learn a real song!"}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Mr. Hall showed us how to press our lips together and buzz.", "Maybe I will practice in the garage instead.", "Next week we get to learn a real song!", "Because my little brother covers his ears whenever I play."], "ci": 3, "exp": "A group of words that starts with <i>because</i> cannot stand alone — it is a fragment. Join it to a complete sentence: <i>Maybe I will practice in the garage <b>because</b> my little brother covers his ears.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Band Diary</strong><br><b>(1)</b> Yesterday I <u>have played</u> the trumpet in band class for the first time. <b>(2)</b> Mr. Hall showed us how to press our lips together and buzz. <b>(3)</b> At first, my trumpet <u>sounds</u> like an angry goose. <b>(4)</b> Mr. Hall said we <u>should</u> practice for twenty minutes every day. <b>(5)</b> Because my little brother covers his ears whenever I play. <b>(6)</b> Maybe I will practice in the garage instead. <b>(7)</b> Next week we get to learn a real song!"}, {"stem": "Where should a comma be added in sentence 2?", "opts": ["“Stay close, to the edge” her brother Leo called.", "“Stay close to the edge,” her brother Leo called.", "“Stay close to the edge” her brother, Leo called.", "“Stay close to the edge” her brother Leo, called."], "ci": 1, "exp": "When the speaker’s words come first, put a comma at the end of the spoken words, inside the closing quotation mark: <i>“Stay close to the edge<b>,</b>” her brother Leo called.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>The Frozen Pond</strong><br><b>(1)</b> Maya laced up her skates and stepped onto the frozen pond. <b>(2)</b> “Stay close to the edge” her brother Leo called. <b>(3)</b> Maya skated very <u>good</u> for her first time on the ice. <b>(4)</b> Then she spotted <u>Leos</u> red mitten lying near a snowbank. <b>(5)</b> He <u>had dropped</u> it when he tied his skates. <b>(6)</b> Maya scooped it up and glided back to him with a proud grin. <b>(7)</b> Leo laughed and told her that she was a natural skater."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["well", "best", "more good", "NO CHANGE"], "ci": 0, "exp": "<i>Good</i> describes a noun; <i>well</i> describes how someone does something. Maya <i>skated</i>, so use <i>well</i>: <i>Maya skated very <b>well</b>.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>The Frozen Pond</strong><br><b>(1)</b> Maya laced up her skates and stepped onto the frozen pond. <b>(2)</b> “Stay close to the edge” her brother Leo called. <b>(3)</b> Maya skated very <u>good</u> for her first time on the ice. <b>(4)</b> Then she spotted <u>Leos</u> red mitten lying near a snowbank. <b>(5)</b> He <u>had dropped</u> it when he tied his skates. <b>(6)</b> Maya scooped it up and glided back to him with a proud grin. <b>(7)</b> Leo laughed and told her that she was a natural skater."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["Leo’s", "Leos’", "Leo is", "NO CHANGE"], "ci": 0, "exp": "The mitten belongs to one person, Leo, so add <i>’s</i>: <i>she spotted <b>Leo’s</b> red mitten.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>The Frozen Pond</strong><br><b>(1)</b> Maya laced up her skates and stepped onto the frozen pond. <b>(2)</b> “Stay close to the edge” her brother Leo called. <b>(3)</b> Maya skated very <u>good</u> for her first time on the ice. <b>(4)</b> Then she spotted <u>Leos</u> red mitten lying near a snowbank. <b>(5)</b> He <u>had dropped</u> it when he tied his skates. <b>(6)</b> Maya scooped it up and glided back to him with a proud grin. <b>(7)</b> Leo laughed and told her that she was a natural skater."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["has dropped", "NO CHANGE", "had drop", "had dropping"], "ci": 1, "exp": "This is already correct. Leo dropped the mitten BEFORE Maya spotted it, so use <i>had</i> + the past participle: <i>He <b>had dropped</b> it when he tied his skates.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>The Frozen Pond</strong><br><b>(1)</b> Maya laced up her skates and stepped onto the frozen pond. <b>(2)</b> “Stay close to the edge” her brother Leo called. <b>(3)</b> Maya skated very <u>good</u> for her first time on the ice. <b>(4)</b> Then she spotted <u>Leos</u> red mitten lying near a snowbank. <b>(5)</b> He <u>had dropped</u> it when he tied his skates. <b>(6)</b> Maya scooped it up and glided back to him with a proud grin. <b>(7)</b> Leo laughed and told her that she was a natural skater."}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Our school is collecting canned food for th  a pizza party, on Friday afternoon, we will count the cans.", "will win a pizza party on Friday afternoon we will count the cans.", "NO CHANGE", "will win a pizza party. On Friday afternoon, we will count the cans."], "ci": 3, "exp": "This is a run-on: two complete sentences joined with only a comma. Split them with a period: <i>…will win a pizza party<b>.</b> On Friday afternoon, we will count the cans.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Notice: Fall Food Drive</strong><br><b>(1)</b> Our school is collecting canned food for the Riverside Food Pantry. <b>(2)</b> Each of the classrooms have a big blue box by the door. <b>(3)</b> Students <u>who</u> bring in five cans will earn a sticker. <b>(4)</b> The class that collects the most cans <u>will win a pizza party, on Friday afternoon we will count the cans.</u> <b>(5)</b> Please bring soup. <b>(6)</b> Please bring beans and peanut butter too. <b>(7)</b> Thank you for helping our neighbors in need this fall!"}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["Please bring soup, please bring beans and peanut butter too.", "Please bring soup, beans and, peanut butter.", "Please bring soup, beans, and peanut butter.", "Please bring soup but beans and peanut butter too."], "ci": 2, "exp": "Combine the items into one list with commas and <i>and</i> before the last item: <i>Please bring soup<b>,</b> beans<b>, and</b> peanut butter.</i> <i>But</i> would wrongly show a contrast.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>Notice: Fall Food Drive</strong><br><b>(1)</b> Our school is collecting canned food for the Riverside Food Pantry. <b>(2)</b> Each of the classrooms have a big blue box by the door. <b>(3)</b> Students <u>who</u> bring in five cans will earn a sticker. <b>(4)</b> The class that collects the most cans <u>will win a pizza party, on Friday afternoon we will count the cans.</u> <b>(5)</b> Please bring soup. <b> var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
