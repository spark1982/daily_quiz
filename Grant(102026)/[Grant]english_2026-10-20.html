var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261020";
var RAW_QUESTIONS = [{"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The statue’s copper skin was shaped over wooden molds.", "The French government paid for the statue’s pedestal.", "The statue was shipped across the Atlantic in 214 crates.", "Gustave Eiffel designed the iron frame inside the statue."], "ci": 1, "exp": "The passage says “Americans had agreed to pay for the pedestal,” so the pedestal was not paid for by France. The other three statements match the second and third paragraphs exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>A Gift Across the Ocean</strong><br><p style=\"margin:0 0 8px;\">In 1865, a French scholar named Édouard de Laboulaye proposed that France give the United States a monument celebrating liberty and the long friendship between the two nations. The sculptor Frédéric-Auguste Bartholdi was enthusiastic about the idea and soon began sketching a robed woman holding a torch high above her head.</p><p style=\"margin:0 0 8px;\">Building such an enormous figure required clever engineering. Bartholdi’s workers hammered thin sheets of copper into shape over wooden molds, while the engineer Gustave Eiffel, who later designed the famous tower in Paris, created an iron skeleton sturdy enough to hold the copper skin steady in fierce harbor winds.</p><p style=\"margin:0 0 8px;\">Americans had agreed to pay for the pedestal, but their fundraising stalled until the newspaper publisher Joseph Pulitzer promised to print the name of every donor, no matter how small the gift. Thousands of ordinary people, including schoolchildren, mailed in their coins. In 1885, the finished statue was taken apart, packed into 214 crates, and shipped across the Atlantic. It was reassembled on its new pedestal and dedicated in October 1886, and for generations of immigrants sailing into New York Harbor, it became the first sign of a new home.</p>"}, {"stem": "Which event happened right after Joseph Pulitzer promised to print the name of every donor?", "opts": ["The statue was dedicated in October 1886.", "Thousands of ordinary people mailed in their coins.", "Workers hammered copper sheets over wooden molds.", "Laboulaye proposed a monument celebrating liberty."], "ci": 1, "exp": "The third paragraph says fundraising stalled “until” Pulitzer made his promise, and then “Thousands of ordinary people, including schoolchildren, mailed in their coins.” The dedication in 1886 came later, after the statue was shipped and rebuilt.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>A Gift Across the Ocean</strong><br><p style=\"margin:0 0 8px;\">In 1865, a French scholar named Édouard de Laboulaye proposed that France give the United States a monument celebrating liberty and the long friendship between the two nations. The sculptor Frédéric-Auguste Bartholdi was enthusiastic about the idea and soon began sketching a robed woman holding a torch high above her head.</p><p style=\"margin:0 0 8px;\">Building such an enormous figure required clever engineering. Bartholdi’s workers hammered thin sheets of copper into shape over wooden molds, while the engineer Gustave Eiffel, who later designed the famous tower in Paris, created an iron skeleton sturdy enough to hold the copper skin steady in fierce harbor winds.</p><p style=\"margin:0 0 8px;\">Americans had agreed to pay for the pedestal, but their fundraising stalled until the newspaper publisher Joseph Pulitzer promised to print the name of every donor, no matter how small the gift. Thousands of ordinary people, including schoolchildren, mailed in their coins. In 1885, the finished statue was taken apart, packed into 214 crates, and shipped across the Atlantic. It was reassembled on its new pedestal and dedicated in October 1886, and for generations of immigrants sailing into New York Harbor, it became the first sign of a new home.</p>"}, {"stem": "The passage says that the Americans’ fundraising “stalled.” What does <b>stalled</b> mean as it is used in the third paragraph?", "opts": ["was handled by a newspaper", "was kept secret from the public", "stopped making progress", "was moved to a different city"], "ci": 2, "exp": "The fundraising “stalled until” Pulitzer helped, and only then did people send coins — so before that, it had stopped moving forward. A newspaper did help, but only after the fundraising had already stalled.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>A Gift Across the Ocean</strong><br><p style=\"margin:0 0 8px;\">In 1865, a French scholar named Édouard de Laboulaye proposed that France give the United States a monument celebrating liberty and the long friendship between the two nations. The sculptor Frédéric-Auguste Bartholdi was enthusiastic about the idea and soon began sketching a robed woman holding a torch high above her head.</p><p style=\"margin:0 0 8px;\">Building such an enormous figure required clever engineering. Bartholdi’s workers hammered thin sheets of copper into shape over wooden molds, while the engineer Gustave Eiffel, who later designed the famous tower in Paris, created an iron skeleton sturdy enough to hold the copper skin steady in fierce harbor winds.</p><p style=\"margin:0 0 8px;\">Americans had agreed to pay for the pedestal, but their fundraising stalled until the newspaper publisher Joseph Pulitzer promised to print the name of every donor, no matter how small the gift. Thousands of ordinary people, including schoolchildren, mailed in their coins. In 1885, the finished statue was taken apart, packed into 214 crates, and shipped across the Atlantic. It was reassembled on its new pedestal and dedicated in October 1886, and for generations of immigrants sailing into New York Harbor, it became the first sign of a new home.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Gustave Eiffel was the most important person in the building of the Statue of Liberty.", "The Statue of Liberty was built in New York and later shipped to France as a gift.", "Joseph Pulitzer became famous because he raised money to build a statue in Paris.", "The Statue of Liberty was a shared effort that needed French design and engineering as well as American donations."], "ci": 3, "exp": "The passage moves from the French idea and design, to Eiffel’s iron skeleton, to Americans paying for the pedestal. Eiffel is only one part of that story, and the statue traveled from France to New York, not the other way.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>A Gift Across the Ocean</strong><br><p style=\"margin:0 0 8px;\">In 1865, a French scholar named Édouard de Laboulaye proposed that France give the United States a monument celebrating liberty and the long friendship between the two nations. The sculptor Frédéric-Auguste Bartholdi was enthusiastic about the idea and soon began sketching a robed woman holding a torch high above her head.</p><p style=\"margin:0 0 8px;\">Building such an enormous figure required clever engineering. Bartholdi’s workers hammered thin sheets of copper into shape over wooden molds, while the engineer Gustave Eiffel, who later designed the famous tower in Paris, created an iron skeleton sturdy enough to hold the copper skin steady in fierce harbor winds.</p><p style=\"margin:0 0 8px;\">Americans had agreed to pay for the pedestal, but their fundraising stalled until the newspaper publisher Joseph Pulitzer promised to print the name of every donor, no matter how small the gift. Thousands of ordinary people, including schoolchildren, mailed in their coins. In 1885, the finished statue was taken apart, packed into 214 crates, and shipped across the Atlantic. It was reassembled on its new pedestal and dedicated in October 1886, and for generations of immigrants sailing into New York Harbor, it became the first sign of a new home.</p>"}, {"stem": "Which sentence best states the main idea of the passage?", "opts": ["Bats are the only animals that can find food in complete darkness.", "Bats use the echoes of their own calls to find and follow prey with great accuracy.", "Engineers invented sonar after studying how dolphins hunt in the ocean.", "Little brown bats eat more mosquitoes than any other animal on Earth."], "ci": 1, "exp": "Most of the passage explains how echolocation works and how “remarkably precise” it is. The passage says dolphins also use echoes, so bats are not the only ones, and it never compares bats with every other mosquito eater.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Seeing with Sound</strong><br><p style=\"margin:0 0 8px;\">On a summer evening, a little brown bat can snatch hundreds of mosquitoes in a single hour, even in complete darkness. Its secret is a skill called echolocation. As it flies, the bat produces rapid, high-pitched calls, most of them far too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo. By sensing how long each echo takes to return, the bat judges how far away an insect is, and by comparing the echoes that reach its left and right ears, it can tell which direction the insect is moving.</p><p style=\"margin:0 0 8px;\">Echolocation is remarkably precise. Some bats can detect a wire thinner than a human hair. As a bat closes in on its prey, it calls faster and faster, until the clicks blur into a sound scientists have nicknamed the “feeding buzz.”</p><p style=\"margin:0 0 8px;\">Bats are not the only creatures that hunt this way. Dolphins send clicks through the water, and engineers modeled early sonar systems for ships on the same principle. Still, bats remain among the most skilled echolocators on Earth, which is one reason scientists are cautious about disturbing the caves where they roost.</p>"}, {"stem": "According to the passage, how does a bat tell which direction an insect is moving?", "opts": ["by sensing how long each echo takes to return", "by calling faster and faster until it hears a buzz", "by flying in circles until the insect comes close", "by comparing the echoes that reach its left and right ears"], "ci": 3, "exp": "The first paragraph says that “by comparing the echoes that reach its left and right ears, it can tell which direction the insect is moving.” Timing the echo tells the bat how FAR away the insect is, not which direction it is going.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Seeing with Sound</strong><br><p style=\"margin:0 0 8px;\">On a summer evening, a little brown bat can snatch hundreds of mosquitoes in a single hour, even in complete darkness. Its secret is a skill called echolocation. As it flies, the bat produces rapid, high-pitched calls, most of them far too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo. By sensing how long each echo takes to return, the bat judges how far away an insect is, and by comparing the echoes that reach its left and right ears, it can tell which direction the insect is moving.</p><p style=\"margin:0 0 8px;\">Echolocation is remarkably precise. Some bats can detect a wire thinner than a human hair. As a bat closes in on its prey, it calls faster and faster, until the clicks blur into a sound scientists have nicknamed the “feeding buzz.”</p><p style=\"margin:0 0 8px;\">Bats are not the only creatures that hunt this way. Dolphins send clicks through the water, and engineers modeled early sonar systems for ships on the same principle. Still, bats remain among the most skilled echolocators on Earth, which is one reason scientists are cautious about disturbing the caves where they roost.</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of “precise” as it is used in the second paragraph?", "opts": ["exact", "inaccurate", "silent", "rapid"], "ci": 1, "exp": "The passage shows echolocation is “precise” because bats can find a wire “thinner than a human hair” — it is very exact. The opposite is <i>inaccurate</i>; <i>exact</i> means almost the SAME as precise.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Seeing with Sound</strong><br><p style=\"margin:0 0 8px;\">On a summer evening, a little brown bat can snatch hundreds of mosquitoes in a single hour, even in complete darkness. Its secret is a skill called echolocation. As it flies, the bat produces rapid, high-pitched calls, most of them far too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo. By sensing how long each echo takes to return, the bat judges how far away an insect is, and by comparing the echoes that reach its left and right ears, it can tell which direction the insect is moving.</p><p style=\"margin:0 0 8px;\">Echolocation is remarkably precise. Some bats can detect a wire thinner than a human hair. As a bat closes in on its prey, it calls faster and faster, until the clicks blur into a sound scientists have nicknamed the “feeding buzz.”</p><p style=\"margin:0 0 8px;\">Bats are not the only creatures that hunt this way. Dolphins send clicks through the water, and engineers modeled early sonar systems for ships on the same principle. Still, bats remain among the most skilled echolocators on Earth, which is one reason scientists are cautious about disturbing the caves where they roost.</p>"}, {"stem": "The word <b>echolocation</b> combines “echo” with a form of the word “locate.” Based on its parts, what does echolocation most likely mean?", "opts": ["finding where things are by using echoes", "making loud sounds to frighten enemies", "repeating the same sound many times", "hearing sounds that are too high for people"], "ci": 0, "exp": "“Echo” is a sound that bounces back, and “locate” means to find where something is. The passage says bats can hear calls “too high for human ears,” but that is a detail about the calls, not the meaning of the word.", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Seeing with Sound</strong><br><p style=\"margin:0 0 8px;\">On a summer evening, a little brown bat can snatch hundreds of mosquitoes in a single hour, even in complete darkness. Its secret is a skill called echolocation. As it flies, the bat produces rapid, high-pitched calls, most of them far too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo. By sensing how long each echo takes to return, the bat judges how far away an insect is, and by comparing the echoes that reach its left and right ears, it can tell which direction the insect is moving.</p><p style=\"margin:0 0 8px;\">Echolocation is remarkably precise. Some bats can detect a wire thinner than a human hair. As a bat closes in on its prey, it calls faster and faster, until the clicks blur into a sound scientists have nicknamed the “feeding buzz.”</p><p style=\"margin:0 0 8px;\">Bats are not the only creatures that hunt this way. Dolphins send clicks through the water, and engineers modeled early sonar systems for ships on the same principle. Still, bats remain among the most skilled echolocators on Earth, which is one reason scientists are cautious about disturbing the caves where they roost.</p>"}, {"stem": "Dev’s notebook pages are “crowded with careful columns of measurements.” What does <b>crowded</b> mean as it is used here?", "opts": ["filled closely with many things", "torn and badly wrinkled", "decorated with colorful stickers", "copied from another student"], "ci": 0, "exp": "The pages hold “columns of measurements and tiny dated sketches,” so they are packed full. Nothing in the story suggests the pages were torn, decorated, or copied.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Poster Problem</strong><br><p style=\"margin:0 0 8px;\">Ruby had already outlined the title of their science-fair poster in tall purple letters when Dev slid into the seat beside her.</p><p style= var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
