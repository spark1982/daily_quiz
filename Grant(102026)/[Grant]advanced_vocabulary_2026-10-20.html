<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Advanced Vocabulary</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Grant] Advanced Vocabulary</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>

</div>

<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261020";
var RAW_QUESTIONS = [{"stem": "Solar panels _____ sunlight into electricity that can power a whole house.", "opts": ["inhabit", "recede", "consult", "convert"], "ci": 3, "exp": "<i>convert</i> (v.) to change something into a different form or use. <i>The old barn was <b>converted</b> into an art studio.</i> Family: conversion (n.), convertible (adj./n.). Sunlight is changed into electricity.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The <b>enthusiastic</b> crowd jumped to its feet, clapping and cheering as the runners crossed the finish line. What does <b>enthusiastic</b> mean in this sentence?", "opts": ["full of excitement and interest", "nervous and worried", "surprised and confused", "proud but serious"], "ci": 0, "exp": "<i>enthusiastic</i> (adj.) full of excitement and strong interest. <i>Maya was so <b>enthusiastic</b> about the science fair that she started her project a month early.</i> Family: enthusiasm (n.), enthusiastically (adv.). Jumping, clapping, and cheering show excitement.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Even after moving to a new town, Marcus kept his <b>allegiance</b> to his old soccer team and cheered for them at every game. What does <b>allegiance</b> mean in this sentence?", "opts": ["a strong fear of trying something new", "loyal support for a person, group, or country", "a written promise to pay back money", "a feeling of being jealous of someone"], "ci": 1, "exp": "<i>allegiance</i> (n.) loyal support for a person, group, or country. <i>Many Americans say the Pledge of <b>Allegiance</b> to show loyalty to their country.</i> Family: ally (n.), loyal (adj.). Marcus keeps cheering for his old team, which shows loyalty.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The town council voted to <b>reject</b> the plan for a new parking lot because it would cost too much. Which word means the <b>OPPOSITE</b> of “reject” as it is used in the sentence?", "opts": ["refuse", "delay", "accept", "discuss"], "ci": 2, "exp": "<i>reject</i> (v.) to refuse to accept or agree to something. <i>The editor <b>rejected</b> the story because it was too long.</i> Family: rejection (n.). The opposite is <i>accept</i>; <i>refuse</i> means almost the SAME as reject.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Saying you are “too tired to play” and then racing around the yard for an hour is a <b>contradiction</b>. What does <b>contradiction</b> mean in this sentence?", "opts": ["a clever plan to get out of work", "a promise that someone keeps", "a reason that explains a choice", "two things that cannot both be true"], "ci": 3, "exp": "<i>contradiction</i> (n.) a situation in which two things cannot both be true. <i>His story was full of <b>contradictions</b>: first he said he was home, then he said he was at the park.</i> Family: contradict (v.), contradictory (adj.). You cannot be too tired to play and also race around for an hour.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The river forms the _____ between the two states, so crossing the bridge means you are in a new state.", "opts": ["summit", "landscape", "tributary", "boundary"], "ci": 3, "exp": "<i>boundary</i> (n.) a line that marks where one area ends and another begins. <i>The fence marks the <b>boundary</b> of our backyard.</i> Family: bound (n.), boundless (adj.). The river is where one state stops and the other starts.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "To give students an <b>incentive</b> to read, the library offered a free pizza coupon for every five books. Which word means the <b>SAME</b> or nearly the same as “incentive” as it is used in the sentence?", "opts": ["encouragement", "punishment", "schedule", "invitation"], "ci": 0, "exp": "<i>incentive</i> (n.) something that encourages a person to do something. <i>A gold star was a good <b>incentive</b> for finishing homework on time.</i> The pizza coupon encourages reading; <i>punishment</i> is close to the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "In the old legend, the knight’s greatest <b>exploit</b> was crossing the frozen mountains alone to rescue the village. Which meaning of <b>exploit</b> is used in this sentence?", "opts": ["to treat someone unfairly to get something for yourself", "to make full use of something, such as a natural resource", "a brave or daring act", "a trick that takes advantage of a weakness in a computer program"], "ci": 2, "exp": "<i>exploit</i> has several meanings. As a noun it can mean a brave, exciting act. As a verb it can mean to use something fully, or to treat someone unfairly. <i>The pilot’s <b>exploits</b> were told in every newspaper.</i> Here it names something the knight did that was daring: “crossing the frozen mountains alone.”", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The author’s novel was <b>adapted</b> into a movie, so some scenes were shortened and new music was added. Which meaning of <b>adapt</b> is used in this sentence?", "opts": ["changed over many generations to survive in a habitat", "got used to a new place or situation", "changed a tool or machine so it can be used in a new way", "rewritten in a new form, such as a movie or play"], "ci": 3, "exp": "<i>adapt</i> (v.) can mean to change to fit a new place, to change over generations to survive, or to rewrite a story in a new form. <i>The class <b>adapted</b> the fairy tale into a short play.</i> Family: adaptation (n.), adaptable (adj.). The novel became a movie, so it was rewritten in a new form.", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "In 1918, a flu <b>epidemic</b> spread through cities so quickly that many schools and theaters were closed. Which word means the <b>SAME</b> or nearly the same as “epidemic” as it is used in the sentence?", "opts": ["outbreak", "cure", "rumor", "shortage"], "ci": 0, "exp": "<i>epidemic</i> (n.) a disease that spreads quickly to many people in an area. <i>Doctors worked to stop the measles <b>epidemic</b> before it reached more towns.</i> Family: epidemic (adj.). An <i>outbreak</i> is a sudden spread of disease; a <i>cure</i> is close to the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Like many <b>immigrants</b> in the early 1900s, Rosa’s great-grandfather arrived at Ellis Island with one suitcase, hoping to build a new life in America. What does <b>immigrant</b> mean in this sentence?", "opts": ["a person who explores lands no one has mapped", "a person who visits a place for a short vacation", "a person who comes to live in a new country", "a person who works on a ship that crosses the ocean"], "ci": 2, "exp": "<i>immigrant</i> (n.) a person who comes to live permanently in a new country. <i>The city’s first bakery was opened by an <b>immigrant</b> from Italy.</i> Family: immigrate (v.), immigration (n.). He came “hoping to build a new life,” so he planned to stay, not just visit.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The museum displays the tools _____, from the oldest stone axes to the newest steel ones.", "opts": ["chronological", "chronologically", "chronology", "chronologies"], "ci": 1, "exp": "<i>chronological</i> (adj.) arranged in the order in which events happened. <i>The timeline lists the presidents in <b>chronological</b> order.</i> Family: chronology (n.), chronologically (adv.). The blank describes HOW the tools are displayed, so it needs an adverb: <i>chronologically</i>.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The new bike lanes had a big <b>impact</b> on the town: twice as many kids now ride their bikes to school. What does <b>impact</b> mean in this sentence?", "opts": ["a sudden crash between two objects", "a high cost to pay", "a long delay", "a strong effect"], "ci": 3, "exp": "<i>impact</i> (n.) a strong effect or influence; it can also mean the force of one thing hitting another. <i>Planting trees had a huge <b>impact</b> on how cool the street felt.</i> Family: impactful (adj.). Here nothing crashed — the bike lanes changed how many kids ride, which is an effect.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The chameleon can <b>conceal</b> itself by changing its color to match the leaves around it. What does <b>conceal</b> mean in this sentence?", "opts": ["protect by fighting back", "hide so it cannot be seen", "warm up in the sunlight", "move quickly from place to place"], "ci": 1, "exp": "<i>conceal</i> (v.) to hide something so others cannot see or find it. <i>Jada <b>concealed</b> the birthday present under her bed.</i> Family: concealment (n.). Matching the color of the leaves makes the chameleon hard to see.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Whales are mammals, not fish, according to the scientific _____ of animals.", "opts": ["classify", "classifies", "classification", "classified"], "ci": 2, "exp": "<i>classification</i> (n.) the act or system of sorting things into groups. <i>The <b>classification</b> of rocks has three main groups.</i> Family: classify (v.), class (n.). After “the scientific” and before “of,” the sentence needs a noun, so the answer is <i>classification</i>.", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Scientists were surprised by the <b>magnitude</b> of the earthquake; it shook buildings more than two hundred miles away. What does <b>magnitude</b> mean in this sentence?", "opts": ["the exact place where something happens", "great size or strength", "a sudden, sharp sound", "the length of time something lasts"], "ci": 1, "exp": "<i>magnitude</i> (n.) great size, strength, or importance. <i>No one understood the <b>magnitude</b> of the problem until the river flooded three towns.</i> Family: magnify (v.), magnificent (adj.). Shaking buildings 200 miles away shows how strong the quake was, not where or how long.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Everyone in the class will _____ one food item to the holiday party, so there will be plenty to share.", "opts": ["retreat", "contribute", "inherit", "prohibit"], "ci": 1, "exp": "<i>contribute</i> (v.) to give something, along with others, to help a group or reach a goal. <i>Each neighbor <b>contributed</b> $5 to buy new swings for the park.</i> Family: contribution (n.), contributor (n.). Each student gives one item so everyone can share.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The park rules <b>restrict</b> dogs to the walking paths, so they cannot run on the soccer fields. Which word means the <b>OPPOSITE</b> of “restrict” as it is used in the sentence?", "opts": ["allow", "limit", "measure", "notice"], "ci": 0, "exp": "<i>restrict</i> (v.) to keep something within certain limits. <i>The library <b>restricts</b> each student to five books at a time.</i> Family: restriction (n.), restrictive (adj.). The opposite is <i>allow</i>; <i>limit</i> means almost the SAME as restrict.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "At the library, books about animals, plants, and weather are all shelved in the science _____.", "opts": ["hazard", "category", "summit", "refuge"], "ci": 1, "exp": "<i>category</i> (n.) a group of things that are alike in some way. <i>Soccer and basketball belong to the same <b>category</b>: team sports.</i> Family: categorize (v.). Books grouped together by subject form a category.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The rover on Mars <b>transmits</b> pictures back to Earth, where scientists study them a few minutes later. What does <b>transmit</b> mean in this sentence?", "opts": ["sends from one place to another", "takes apart carefully", "keeps in a safe place", "makes bigger and clearer"], "ci": 0, "exp": "<i>transmit</i> (v.) to send or pass something from one place or person to another. <i>Radio towers <b>transmit</b> signals to cars all over the city.</i> Family: transmission (n.), transmitter (n.). The pictures go from Mars “back to Earth,” so they are sent.", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
