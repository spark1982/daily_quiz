<script>var TITLE = "[Grant] Grammar";var QUIZ_KEY = "quiz_grantgrammar_24_2026-09-12_v1";var ATT_KEY = "quiz_grantgrammar_24_att_2026-09-12_v1";var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';var RAW_QUESTIONS = [{"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["My uncle, who is a doctor works at st. Luke's hospital.", "My uncle, who is a Doctor, works at St. Luke's Hospital.", "My uncle, who is a doctor, works at St. Luke's Hospital.", "My uncle who is a doctor, works at St. Luke's Hospital."], "ci": 2, "exp": "\"doctor\" used as a general occupation (not a title before a name) is a common noun and is not capitalized. \"St. Luke's Hospital\" is a proper noun and must be capitalized. The nonessential clause is set off by commas on both sides.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "She <span style=\"text-decoration:underline;\">______</span> enough money before she even looked for a new vehicle.", "opts": ["had saved", "has saved", "will have saved", "saved"], "ci": 0, "exp": "\"had saved\" is past perfect — saving happened before she looked for a car.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>study</b> &rsaquo; Past: <b>studied</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["study", "studying", "studyed", "studied"], "ci": 3, "exp": "'study' is a regular verb. Its past participle is 'studied' (base + -ed). Past perfect: had studied.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>tuna</b>?", "opts": ["tunas", "tunes", "tunaes", "tuna"], "ci": 3, "exp": "tuna → tuna (no change)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>ride</b>?", "opts": ["rode", "rided", "ridden", "roded"], "ci": 0, "exp": "The past tense of <b>ride</b> is <b>rode</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["The students completed the assignment on time.", "After the long weekend was finally over.", "Staring out the window at the gray clouds.", "A brand new pair of running shoes."], "ci": 0, "exp": "\"The students completed the assignment on time.\" is a complete sentence — subject: 'The students', predicate: 'completed'. The others are fragments: an 'After' clause, an -ing phrase, and a noun phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "She made him a sandwich.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["a sandwich", "him"], "ci": 0, "exp": "\"A sandwich\" is the direct object (what was made). \"Him\" is the indirect object (who received it).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["easy small square box", "small easy square box", "square easy small box", "easy square small box"], "ci": 0, "exp": "Correct order: opinion (easy) → size (small) → shape (square) → noun\n✔ easy small square box", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "I _____ never felt so nervous in my life.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. \"In my life\" refers to the entire experience up to the present.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "She ________ the book two days ago.", "opts": ["finished", "has finished"], "ci": 0, "exp": "Two days ago is a specific finished time, so use simple past: finished.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["Her passion is <b>sketching</b> landscapes.", "He is <b>sketching</b> a portrait right now.", "They were <b>sketching</b> the old building.", "She will be <b>sketching</b> during the trip."], "ci": 0, "exp": "In \"Her passion is sketching landscapes,\" \"sketching\" renames the subject \"passion\" after the linking verb \"is\" - a subject complement - which makes it a gerund. In the other three sentences, \"sketching\" follows \"is / were / will be\" and is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "He has been living _____ that small apartment near downtown ever since he graduated from college.", "opts": ["at", "in", "on", "by"], "ci": 1, "exp": "\"In\" is used with enclosed spaces such as apartments, rooms, or buildings. \"At\" is used for general locations or addresses, not the interior of a place.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["A number of parents was upset about the new homework policy.", "The number of students have grown every year since the school opened.", "A number of parents were upset about the new homework policy.", "A number of issues was raised at last night's school board meeting."], "ci": 2, "exp": "\"A number of\" is always plural, so \"were\" is correct. \"A number of parents was\" is wrong — use \"were.\" \"The number\" is singular — use \"has grown.\" \"A number of issues was\" is wrong — use \"were.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "He drove me crazy.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["crazy", "me"], "ci": 0, "exp": "\"Crazy\" is the objective complement — it describes the state caused in \"me.\" \"Me\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "The students who studied hard for the final exam received excellent grades from their teacher.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["received", "studied", "received excellent", "gave"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>Parents <b>love</b> their children.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>Their children ______ by parents.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["is loved", "are loved", "are loving", "are love"], "ci": 1, "exp": "The new subject \"their children\" is plural and the action is in the present, so use are + the past participle \"loved\": are loved.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The <b>humming</b> engine idled in the driveway.", "The engine is <b>humming</b> smoothly.", "The generator was <b>humming</b> in the background.", "<b>Humming</b> a tune helps her concentrate."], "ci": 0, "exp": "In \"The humming engine idled in the driveway,\" \"humming\" comes directly before the noun \"engine\" and describes what the engine is doing - this adjective use of an -ing word is a present participle. In \"The engine is humming smoothly\" and \"The generator was humming in the background,\" \"humming\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Humming a tune helps her concentrate,\" \"humming\" (with \"a tune\") is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "He is <u>bake</u> cookies in the oven.", "opts": ["baking", "bakeing", "bakking", "baked"], "ci": 0, "exp": "bake → baking (drop the silent -e, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "red<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["redder / reddest", "reder / redest", "more red / most red", "redd / reddest"], "ci": 0, "exp": "red → redder / reddest (short vowel + single consonant: double the -d)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "The brilliant scientist carefully analyzed the complex data she had collected during her extensive fieldwork.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the ADJECTIVES in this sentence, and only the adjectives?</span>", "opts": ["brilliant, complex", "brilliant", "brilliant, carefully, complex", "brilliant, complex, analyzed"], "ci": 0, "exp": "'Brilliant' describes the scientist; 'complex' describes the data.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "His voice <u>echo</u> through the cave.", "opts": ["echoes", "echos", "echoies", "echoed"], "ci": 0, "exp": "echo → echoes (ends in -o after a consonant, so add -es)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "I hit <u>walls</u>.", "opts": ["Object", "Complement"], "ci": 0, "exp": "\"Walls\" receives the action of \"hit.\" It is a direct object.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The geese's honking could be heard from far away.", "The geeses' pond was frozen in winter.", "The parents forgot to sign there kids forms.", "The winning idea was ours' to celebrate."], "ci": 0, "exp": "<strong>\"geese's\"</strong> is correct — <em>geese</em> is already the plural of <em>goose</em>; the possessive is <em>geese's</em>.<br>• <em>geeses'</em> is wrong — <em>geeses</em> is not a word.<br>• <em>there</em> should be <em>their</em> (possessive adjective).<br>• <em>ours'</em> does not exist; the correct form is <em>ours</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">I have not once forgotten to do my homework.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Not once I have forgotten to do my homework.", "Not once have I forgotten to do my homework.", "Not once did I forget to do my homework.", "Not once had I forgotten to do my homework."], "ci": 1, "exp": "\"Not once\" is a negative expression that triggers inversion. With present perfect: \"Not once + have + I + forgotten...\". The past participle \"forgotten\" follows. The correct form is: Not once have I forgotten to do my homework.", "tag": "Inversion", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));

}

}

var order = loadOrder() || identityOrder();

    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(q.tts);
    u.lang = 'ko-KR';
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak=speak;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }

  var clabel = document.getElementById('context-label');
  if(q.contextLabel){ clabel.style.display='block'; clabel.textContent = q.contextLabel; } else { clabel.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  var ttsBtn = document.getElementById('tts-btn');
  if(ttsBtn){ ttsBtn.style.display = q.tts ? 'inline-block' : 'none'; }

  hintShown = false;
  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(q.hint){
    hintBtn.style.display='inline-block';
    hintBtn.textContent='Show Hint';
    hintBox.innerHTML = q.hint;
    hintBox.classList.remove('show');
  } else {
    hintBtn.style.display='none';
    hintBox.classList.remove('show');
  }

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();

</script>
</body>
</html>
