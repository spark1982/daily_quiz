<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_sionsatgrammar_20_20260907_v1";var ATT_KEY = "quiz_sionsatgrammar_20_att_20260907_v1";var RAW_QUESTIONS = [{"stem": "Which choice provides the best revision of the underlined portion?", "context": "The museum recently acquired a rare fossil. <u>A discovery that excited paleontologists around the world.</u>", "opts": ["Exciting paleontologists around the world, a discovery.", "A discovery that excited paleontologists around the world.", "This discovery excited paleontologists around the world.", "Which excited paleontologists around the world."], "ci": 2, "exp": "The underlined portion lacks a main verb attached to an independent subject, making it a sentence fragment. Replacing \"A discovery that\" with \"This discovery\" supplies a subject and a finite verb, \"excited,\" creating a complete sentence. The original remains a fragment built around the relative pronoun \"that.\" \"Exciting paleontologists around the world, a discovery\" reverses the words but is still not a complete sentence. \"Which excited paleontologists around the world\" is a fragment built around the relative pronoun \"which\" and cannot stand alone.", "tag": "Sentence Fragment", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The committee is responsible <u>of</u> reviewing every grant application submitted this quarter.", "opts": ["with", "of", "for", "to"], "ci": 2, "exp": "The idiomatic expression is \"responsible for,\" meaning accountable for a task. \"responsible of\" is not standard English idiom. \"responsible with\" and \"responsible to\" are also not correct idiomatic pairings with \"responsible\" in this context.", "tag": "Idiomatic Preposition", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The chef prepared three courses for the tasting menu<u>, however the dessert received the most praise</u>.", "opts": [", however the dessert received the most praise", ", however, the dessert received the most praise", "; however the dessert received the most praise", "; however, the dessert received the most praise"], "ci": 3, "exp": "A conjunctive adverb like \"however\" joining two independent clauses requires a semicolon before it and a comma after it: \"; however, the dessert received the most praise.\" The original uses only a comma before \"however,\" creating a comma splice. \"; however the dessert received the most praise\" correctly adds the semicolon but omits the required comma after \"however.\" \", however, the dessert received the most praise\" still uses a comma instead of a semicolon before the conjunctive adverb, so the comma splice remains.", "tag": "Semicolon with Conjunctive Adverb", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "When the manager spoke with the new intern about the missing files, <u>she</u> seemed confused about what had happened.", "opts": ["the intern", "she", "they", "her"], "ci": 0, "exp": "Because both \"the manager\" and \"the new intern\" are female nouns that the pronoun \"she\" could refer to, the reference is ambiguous. Replacing the pronoun with the specific noun \"the intern\" removes the ambiguity. \"they\" does not agree in number with either singular antecedent and remains vague about which person is meant. \"her\" is the wrong case for the subject position and is equally ambiguous.", "tag": "Vague Pronoun Reference", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The <u>storys'</u> unexpected twist left readers stunned and eager for a sequel.", "opts": ["storys", "stories'", "story's", "storys'"], "ci": 2, "exp": "\"Story\" is singular, so its possessive is formed by adding an apostrophe and an s: \"story's.\" \"storys'\" incorrectly pluralizes the noun with just an s and then places the apostrophe after it. \"stories'\" incorrectly treats the noun as plural. \"storys\" omits the apostrophe entirely, failing to show possession.", "tag": "Apostrophe with Singular Possessive", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "During the workshop, participants learned to draft outlines, <u>revising drafts, and how to format citations</u>.", "opts": ["revise drafts, and format citations", "how to revise drafts, and format citations", "revising drafts, and how to format citations", "revising drafts, and formatting citations"], "ci": 0, "exp": "The three items in this list must share the same grammatical form. Since the first item is the infinitive \"to draft outlines,\" the remaining items should continue that infinitive pattern: \"revise drafts, and format citations.\" The original mixes a gerund (\"revising\") with an infinitive phrase (\"how to format\"). \"revising drafts, and formatting citations\" shifts both items to gerunds, breaking parallelism with \"to draft.\" \"how to revise drafts, and format citations\" inconsistently applies \"how to\" to only the second item.", "tag": "Parallel Structure (Verb List)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "My uncle's car, <u>that he bought last year</u>, broke down on the highway.", "opts": ["which he had bought last year", "that he bought last year", "that he had bought last year", "which he bought last year"], "ci": 3, "exp": "Because the clause is set off by commas and adds nonessential information about a car already specifically identified as \"my uncle's car,\" it should use \"which\": \"which he bought last year.\" \"that\" is reserved for essential (restrictive) clauses and should not follow a comma here. \"which he had bought last year\" unnecessarily shifts to the past perfect tense, which is not required by the timeline of the sentence. \"that he had bought last year\" repeats both errors at once.", "tag": "Restrictive vs Nonrestrictive Clause", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "She <u>returned back again</u> to the office to retrieve her forgotten laptop.", "opts": ["returned", "returned again", "returned back", "returned back again"], "ci": 0, "exp": "\"Returned\" already means \"went back,\" so adding \"back again\" is redundant; the concise \"returned\" is correct. \"returned again\" still contains an unnecessary repetition of the idea of going back. \"returned back\" repeats the same redundant meaning with fewer words but is still redundant.", "tag": "Redundancy", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The company announced that <u>it's</u> quarterly earnings had exceeded analysts' expectations.", "opts": ["it's", "its'", "it is", "its"], "ci": 3, "exp": "The possessive form of \"it,\" used to show that the earnings belong to the company, is \"its,\" with no apostrophe. \"it's\" is a contraction of \"it is\" or \"it has\" and does not show possession. \"its'\" is not a standard English word; \"its\" never takes an apostrophe. \"it is\" does not fit grammatically before the noun \"quarterly earnings.\"", "tag": "Its vs It's", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "By the time the fire trucks arrived, the flames <u>spread</u> to the neighboring building.", "opts": ["were spreading", "had spread", "have spread", "spread"], "ci": 1, "exp": "Because the spreading of the flames was completed before another past event (the trucks arriving), the past perfect tense \"had spread\" is required. The simple past \"spread\" does not clearly indicate which action happened first. \"have spread\" is present perfect and does not fit a narrative entirely in the past. \"were spreading\" suggests an ongoing action rather than one already completed before the trucks arrived.", "tag": "Verb Tense Consistency (Past Perfect)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Having practiced the routine for weeks, <u>the audience was impressed by the gymnast's flawless performance</u>.", "opts": ["the gymnast delivered a flawless performance that impressed the audience", "the audience was impressed by the gymnast's flawless performance", "the gymnast's flawless performance impressed the audience, having practiced for weeks", "it was clear the audience was impressed by the gymnast's flawless performance"], "ci": 0, "exp": "The opening phrase \"Having practiced the routine for weeks\" must logically modify the noun immediately following the comma; since it was the gymnast who practiced, \"the gymnast\" must be that noun, as in \"the gymnast delivered a flawless performance that impressed the audience.\" The original illogically implies the audience practiced. Moving \"having practiced for weeks\" to the end still leaves \"the gymnast's flawless performance\" as the noun right after the modifier's original position, and the sentence remains confusingly ordered. Adding \"it was clear that\" still places \"the audience\" as the first noun after the modifier, so the dangling modifier problem remains.", "tag": "Dangling Modifier", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Because of the delay, <u>less</u> passengers boarded the connecting flight than expected.", "opts": ["fewer", "lesser", "least", "less"], "ci": 0, "exp": "\"Passengers\" is a countable noun, so \"fewer\" is required rather than \"less,\" which is reserved for uncountable quantities. \"lesser\" describes degree or importance, not countable amounts, and does not fit here. \"least\" is a superlative form used for the smallest amount among three or more, not a simple comparison of two groups.", "tag": "Less vs Fewer", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The senator<u>&mdash;a former teacher with two decades of classroom experience, championed</u> the new education funding bill.", "opts": [" a former teacher with two decades of classroom experience championed", "&mdash;a former teacher with two decades of classroom experience, championed", "&mdash;a former teacher with two decades of classroom experience&mdash;championed", ", a former teacher with two decades of classroom experience championed"], "ci": 2, "exp": "A nonessential, parenthetical aside set off by an em dash must be closed with a matching em dash: \"&mdash;a former teacher with two decades of classroom experience&mdash;championed.\" The original opens with an em dash but closes with only a comma, mismatching the punctuation. Using a single comma before the aside and none after leaves the interruption improperly bounded. Omitting punctuation entirely fails to mark the aside as nonessential at all.", "tag": "Em Dash for Parenthetical", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "Researchers are studying how sleep deprivation can <u>effect</u> long-term memory and decision-making.", "opts": ["effects", "effect", "affects", "affect"], "ci": 3, "exp": "\"Affect\" is used here as a verb meaning \"to influence,\" which fits the sentence. \"effect\" is normally a noun meaning \"a result\" and does not fit the verb position in this sentence. \"affects\" incorrectly adds a third-person singular ending to a verb whose subject is the plural \"sleep deprivation... memory and decision-making\" construction governed by \"can,\" which requires the base form. \"effects\" is the plural noun form and cannot serve as the verb here.", "tag": "Affect vs Effect", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "<u>Due to the fact that</u> the bridge was closed for repairs, commuters had to find alternate routes.", "opts": ["Owing to the fact that", "Because", "For the reason that", "Due to the fact that"], "ci": 1, "exp": "\"Because\" concisely expresses the same causal relationship as the wordier original phrase. \"Due to the fact that\" and \"Owing to the fact that\" are both needlessly wordy ways of saying \"because.\" \"For the reason that\" is similarly wordy and less direct than the single word \"because.\"", "tag": "Wordiness", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The population of Tokyo is much larger than <u>Seoul</u>.", "opts": ["in Seoul", "Seoul's", "that of Seoul", "Seoul"], "ci": 2, "exp": "The sentence must compare population to population, not population to a city. \"that of Seoul\" logically stands in for \"the population of Seoul,\" making the comparison parallel. \"Seoul\" illogically compares a population to an entire city. \"Seoul's\" is an incomplete possessive missing the noun it should modify. \"in Seoul\" creates an illogical prepositional comparison rather than a direct comparison of populations.", "tag": "Faulty Comparison", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The recipe required just two ingredients, <u>flour and water</u>.", "opts": ["flour and water", "; flour and water", ": flour and water", "flour and water,"], "ci": 2, "exp": "A colon is used after an independent clause to introduce a list, so \": flour and water\" is correct. A comma alone does not properly introduce the list following a complete sentence. A semicolon is used to join two independent clauses, not to introduce a simple list. Adding a trailing comma after \"water\" is unnecessary and nonstandard.", "tag": "Colon Usage", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The committee awarded the scholarship to my sister and <u>I</u>, since we had both volunteered over four hundred hours.", "opts": ["we", "myself", "me", "I"], "ci": 2, "exp": "As the object of the preposition \"to,\" the pronoun must be in the objective case: \"to my sister and me.\" \"I\" is a subjective-case pronoun and cannot serve as an object. \"myself\" is a reflexive pronoun with no antecedent performing the action on itself here. \"we\" is also subjective case and cannot function as an object of a preposition.", "tag": "Pronoun Case (Subjective vs Objective)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The collection of rare stamps, assembled over five decades by her grandfather, <u>are</u> displayed in a glass case in the museum lobby.", "opts": ["is", "were", "are", "have been"], "ci": 0, "exp": "The subject of the verb is the singular noun \"collection,\" not the plural object of the intervening prepositional phrase \"of rare stamps\"; the singular verb \"is\" is required. \"are\" and \"were\" incorrectly agree with the intervening plural noun \"stamps\" rather than the true subject. \"have been\" also fails to agree with the singular subject.", "tag": "Subject-Verb Agreement (Intervening Phrase)", "tagcolor": "#185FA5"}, {"stem": "Which choice provides the best revision of the underlined portion?", "context": "The rain had not stopped for three days, <u>the river began to overflow its banks</u>.", "opts": ["the river began to overflow its banks", "so the river began to overflow its banks", "the river began overflowing, its banks", "the river, beginning to overflow its banks"], "ci": 1, "exp": "The original joins two independent clauses with only a comma, creating a comma splice. Adding the coordinating conjunction \"so\" after the comma correctly links the clauses and shows the cause-and-effect relationship. The original remains a comma splice. \"the river, beginning to overflow its banks\" turns the second clause into a fragment. \"the river began overflowing, its banks\" is not a grammatical clause and still fails to fix the splice.", "tag": "Comma Splice", "tagcolor": "#185FA5"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;

  return true;
}

    return s;
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} return defaultState(); }
}

var timerInterval = null;

function getAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }catch(e){ return 0; } }
function incAttempts(){ try{ localStorage.setItem(ATT_KEY, String(getAttempts()+1)); }catch(e){} }
function updateAttDisplay(){
  var el = document.getElementById('att-display');
  if(el) el.textContent = 'Total Attempts: ' + getAttempts();
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var dispEl = document.getElementById('timerDisplay');
  if(!setupEl||!runningEl||!dispEl) return;
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  dispEl.classList.remove('warn','danger');
  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;


  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
