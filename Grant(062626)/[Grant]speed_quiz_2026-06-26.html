<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>[Grant] Speed Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f4f6fb;color:#1f2533;}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
h1{font-size:1.5rem;margin:0 0 16px;}
.attbar{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#5b6472;background:#eef1f7;border-radius:8px;padding:8px 12px;margin-bottom:16px;}
.attbar b{color:#1f2533;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:10px 14px;background:#fff;border:1px solid #e3e7ee;border-radius:10px;}
#nav-count{font-size:13px;white-space:nowrap;color:#5b6472;font-weight:700;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;margin:0 0 16px;border-radius:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:none;color:#fff;font-size:11px;font-weight:600;cursor:pointer;margin:2px;}
.dot.cur{outline:2px solid #185FA5;outline-offset:2px;}
.card{background:#ffffff;border:1px solid #e3e7ee;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(20,30,60,.06);}
.tag{display:inline-block;background:#eef1f7;color:#185FA5;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:.02em;}
.qtext{font-size:1.05rem;line-height:1.6;margin-bottom:16px;}
.timerrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;background:#f7f8fb;border:1px solid #e3e7ee;border-radius:10px;padding:8px 12px;}
.timernum{font-weight:700;font-size:1.05rem;min-width:54px;}
.timernum.green{color:#1D9E75;}
.timernum.orange{color:#f5a623;}
.timernum.red{color:#E24B4A;}
.pausebtn{margin-left:auto;border:1px solid #e3e7ee;background:#fff;border-radius:8px;padding:6px 14px;font-size:.85rem;cursor:pointer;font-weight:600;color:#1f2533;}
.pausebtn:disabled{opacity:.45;cursor:not-allowed;}
.opt{display:block;width:100%;text-align:left;border:1px solid #e3e7ee;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:9px;font-size:.96rem;cursor:pointer;transition:border-color .15s;}
.opt:hover:not(:disabled){border-color:#185FA5;}
.opt:disabled{cursor:default;}
.opt.correct{border-color:#1D9E75;background:#e9f8f1;font-weight:600;}
.opt.wrong{border-color:#E24B4A;background:#fdecec;}
.opt.timedoutmark{border-color:#f5a623;background:#fff5e6;}
.timeoutnote{margin-top:10px;background:#fff5e6;border-left:3px solid #f5a623;padding:10px 12px;font-size:.88rem;color:#8a5a00;border-radius:0 8px 8px 0;font-weight:600;}
.navrow{display:flex;gap:10px;margin-top:18px;}
.navbtn{flex:1;border:1px solid #e3e7ee;background:#fff;border-radius:10px;padding:10px;font-size:.92rem;font-weight:600;cursor:pointer;color:#1f2533;}
.navbtn:disabled{opacity:.4;cursor:not-allowed;}
.navbtn.primary{background:#185FA5;border-color:#185FA5;color:#fff;}
.result{background:#ffffff;border:1px solid #e3e7ee;border-radius:14px;padding:26px;text-align:center;}
.result h2{margin:0 0 16px;}
.scoregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.scorebox{background:#f7f8fb;border-radius:10px;padding:14px;}
.scorebox .n{font-size:1.5rem;font-weight:700;}
.scorebox .l{font-size:.8rem;color:#5b6472;}
.scorebox.correct .n{color:#1D9E75;}
.scorebox.incorrect .n{color:#E24B4A;}
.scorebox.timedout .n{color:#f5a623;}
.scorebox.skipped .n{color:#8a93a3;}
.resbtns{display:flex;flex-direction:column;gap:10px;}
.resbtn{border:none;border-radius:10px;padding:12px;font-size:.94rem;font-weight:700;cursor:pointer;color:#fff;}
.resbtn.retry{background:#1D9E75;}
.resbtn.copy{background:#7b61ff;}
.resbtn.fresh{background:#8a93a3;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal-box{background:#fff;border-radius:14px;padding:22px;max-width:320px;text-align:center;}
.modal-box p{margin:0 0 18px;font-size:.95rem;color:#1f2533;}
.modal-actions{display:flex;gap:10px;}
.modal-actions button{flex:1;border:none;border-radius:8px;padding:10px;font-weight:700;cursor:pointer;}
.modal-actions .cancel{background:#eef1f7;color:#1f2533;}
.modal-actions .confirm{background:#E24B4A;color:#fff;}
.hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>[Grant] Speed Quiz</h1>
  <div class="attbar" id="attBar"></div>
  <div id="nav-bar">
    <span id="nav-count">0 / 30</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>

  <div id="quizArea">
    <div class="card" id="card"></div>
    <div class="navrow">
      <button class="navbtn" id="prevBtn" onclick="go(-1)">Prev</button>
      <button class="navbtn primary" id="nextBtn" onclick="goNextOrFinish()">Next</button>
    </div>
  </div>

  <div id="resultArea" class="hide"></div>
</div>

<div id="modalRoot"></div>

<script>
var QUESTIONS = [{"tag": "Gauss", "q": "Compute the following series.<br>2 + 3 + 4 + 5 + 6 + 7 + 8", "opts": ["28", "35", "42", "36"], "ci": 1}, {"tag": "Gauss", "q": "Compute the following series.<br>6 + 7 + 8 + 9 + 10 + 11", "opts": ["51", "57", "45", "50"], "ci": 0}, {"tag": "Gauss", "q": "Compute the following series.<br>4 + 6 + 8 + 10 + 12 + 14", "opts": ["48", "60", "54", "42"], "ci": 2}, {"tag": "Gauss", "q": "Compute the following series.<br>1 + 3 + 5 + 7 + 9 + 11", "opts": ["30", "42", "35", "36"], "ci": 3}, {"tag": "Gauss", "q": "John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?", "opts": ["95 coins", "90 coins", "100 coins", "105 coins"], "ci": 0}, {"tag": "Gauss", "q": "Compute the following series.<br>1 + 2 + 3 + 4 + &hellip; + 48 + 49 + 50", "opts": ["1275", "1225", "1250", "1300"], "ci": 0}, {"tag": "Intervals", "q": "Joe puts 5 matchsticks on a table. Each matchstick is 10 cm away from another. How far is the fifth matchstick away from the first one?", "opts": ["40 cm", "50 cm", "30 cm", "45 cm"], "ci": 0}, {"tag": "Intervals", "q": "A sailor tied 7 knots on a rope at regular intervals. The distance from the first knot to the seventh one was 18 m long. What is the distance between every two knots?", "opts": ["2 m", "9 m", "3 m", "6 m"], "ci": 2}, {"tag": "Intervals", "q": "A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?", "opts": ["99 trees", "101 trees", "102 trees", "100 trees"], "ci": 1}, {"tag": "Intervals", "q": "It takes John 8 minutes to saw a log into 3 equal lengths. How long does it take for him to saw the same log into 9 equal lengths?", "opts": ["24 minutes", "16 minutes", "36 minutes", "32 minutes"], "ci": 3}, {"tag": "Intervals", "q": "David uses some coins to form a triangle. There is a coin at every corner. How many coins does he use if there are 6 coins on each side of the triangle?", "opts": ["16 coins", "15 coins", "18 coins", "12 coins"], "ci": 1}, {"tag": "Intervals", "q": "25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?", "opts": ["120 m", "100 m", "130 m", "125 m"], "ci": 0}, {"tag": "Addition & Subtraction Tricks", "q": "Compute the following.<br>24 + 55 + 76 =", "opts": ["145", "165", "150", "155"], "ci": 3}, {"tag": "Addition & Subtraction Tricks", "q": "Compute the following.<br>56 + 66 + 44 =", "opts": ["160", "166", "156", "176"], "ci": 1}, {"tag": "Addition & Subtraction Tricks", "q": "Compute the following.<br>86 + 34 + 14 =", "opts": ["144", "134", "124", "130"], "ci": 1}, {"tag": "Addition & Subtraction Tricks", "q": "Compute the following.<br>78 + 52 + 22 =", "opts": ["152", "150", "142", "162"], "ci": 0}, {"tag": "Addition & Subtraction Tricks", "q": "Compute the following.<br>284 + 118 =", "opts": ["392", "412", "402", "398"], "ci": 2}, {"tag": "Addition & Subtraction Tricks", "q": "Compute the following.<br>514 + 186 =", "opts": ["710", "700", "680", "690"], "ci": 1}, {"tag": "Multiplication Tricks", "q": "Compute the following.<br>24 x 25 =", "opts": ["500", "600", "650", "550"], "ci": 1}, {"tag": "Multiplication Tricks", "q": "Compute the following.<br>28 x 25 =", "opts": ["700", "600", "650", "750"], "ci": 0}, {"tag": "Multiplication Tricks", "q": "Compute the following.<br>36 x 25 =", "opts": ["950", "900", "800", "850"], "ci": 1}, {"tag": "Multiplication Tricks", "q": "Compute the following.<br>16 x 25 =", "opts": ["300", "450", "400", "350"], "ci": 2}, {"tag": "Multiplication Tricks", "q": "Compute the following.<br>63 x 11 =", "opts": ["723", "693", "633", "603"], "ci": 1}, {"tag": "Multiplication Tricks", "q": "Compute the following.<br>27 x 11 =", "opts": ["237", "317", "207", "297"], "ci": 3}, {"tag": "Geometry", "q": "Points A, B, C, D, E lie on a line at unequal intervals, as shown below.<br><svg width=\"200\" height=\"60\" viewBox=\"0 0 200 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"190\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"10\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"10\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"22\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"22\" y=\"46\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"46\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"46\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"94\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"94\" y=\"46\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"190\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"190\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">E</text></svg>How many line segments of different lengths can be measured using any two of these points?", "opts": ["9", "10", "12", "8"], "ci": 1}, {"tag": "Geometry", "q": "Points A, B, C, D, E, F lie on a line at unequal intervals, as shown below.<br><svg width=\"268\" height=\"60\" viewBox=\"0 0 268 60\" style=\"display:block;margin:10px auto;\"><line x1=\"10\" y1=\"30\" x2=\"258\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"10\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"10\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">A</text><circle cx=\"18\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"18\" y=\"46\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">B</text><circle cx=\"34\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"34\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">C</text><circle cx=\"66\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"66\" y=\"46\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">D</text><circle cx=\"130\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"130\" y=\"18\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">E</text><circle cx=\"258\" cy=\"30\" r=\"3\" fill=\"#333\"/><text x=\"258\" y=\"46\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\">F</text></svg>How many line segments of different lengths can be measured using any two of these points?", "opts": ["18", "14", "12", "15"], "ci": 3}, {"tag": "Geometry", "q": "How many squares of all sizes are there in the figure below?<br><svg width=\"130\" height=\"130\" viewBox=\"0 0 130 130\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"110\" height=\"110\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"65\" y1=\"10\" x2=\"65\" y2=\"120\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"65\" x2=\"120\" y2=\"65\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["5", "9", "4", "6"], "ci": 0}, {"tag": "Geometry", "q": "How many squares of all sizes are there in the figure below?<br><svg width=\"170\" height=\"120\" viewBox=\"0 0 170 120\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"150\" height=\"100\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"60\" y1=\"10\" x2=\"60\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"60\" x2=\"160\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["10", "6", "9", "8"], "ci": 3}, {"tag": "Geometry", "q": "How many rectangles of all sizes (including squares) are there in the figure below?<br><svg width=\"170\" height=\"170\" viewBox=\"0 0 170 170\" style=\"display:block;margin:10px auto;\"><rect x=\"10\" y=\"10\" width=\"150\" height=\"150\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"60\" y1=\"10\" x2=\"60\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"160\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"60\" x2=\"160\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"10\" y1=\"110\" x2=\"160\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["36", "27", "42", "30"], "ci": 0}, {"tag": "Geometry", "q": "How many triangles of all sizes are there in the figure below?<br><svg width=\"200\" height=\"180\" viewBox=\"0 0 200 180\" style=\"display:block;margin:10px auto;\"><polygon points=\"100,15 15,165 185,165\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"100\" y1=\"15\" x2=\"75\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"100\" y1=\"15\" x2=\"135\" y2=\"165\" stroke=\"#333\" stroke-width=\"1.5\"/></svg>", "opts": ["3", "4", "6", "9"], "ci": 2}];
var QUIZ_KEY = "quiz_grantspeedquiz_30_20260625_v2";
var ATT_KEY = "quiz_grantspeedquiz_att_20260625_v2";
var GREEN_T = 40*8/15, ORANGE_T = 40*4/15;
var timerInterval = null;

function defaultState(){ return { cur:0, answers:{}, timedOut:{}, timers:{}, showResults:false }; }

function loadState(){
  try{
    var raw = localStorage.getItem(QUIZ_KEY);
    if(!raw) return defaultState();
    var s = JSON.parse(raw);
    if(!s.timers) s.timers = {};
    if(!s.answers) s.answers = {};
    if(!s.timedOut) s.timedOut = {};
    return s;
  }catch(e){ return defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function loadAtt(){
  try{ var raw = localStorage.getItem(ATT_KEY); return raw? JSON.parse(raw): {count:0}; }catch(e){ return {count:0}; }
}
function saveAtt(a){ localStorage.setItem(ATT_KEY, JSON.stringify(a)); }
function bumpAttempts(){ var a=loadAtt(); a.count=(a.count||0)+1; saveAtt(a); renderAttBar(); }
function renderAttBar(){
  var a=loadAtt();
  document.getElementById('attBar').innerHTML = 'Total Attempts: <b>'+(a.count||0)+'</b>';
}

var state = loadState();

function getTimer(i){
  if(!state.timers[i]) state.timers[i] = {remain:40, paused:false, startedAt:null};
  return state.timers[i];
}

function stopTimerInterval(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}

function freezeTimer(i){
  var t = state.timers[i];
  if(!t) return;
  if(t.startedAt!=null){
    var elapsed = (Date.now()-t.startedAt)/1000;
    t.remain = Math.max(0, t.remain-elapsed);
    t.startedAt = null;
  }
}

function timerClass(sec){
  if(sec>GREEN_T) return 'green';
  if(sec>ORANGE_T) return 'orange';
  return 'red';
}

function renderTimerDisplay(sec){
  var el = document.getElementById('timerNum');
  if(!el) return;
  var s = Math.max(0, Math.ceil(sec));
  el.textContent = s + 's';
  el.className = 'timernum ' + timerClass(sec);
}

function tickTimer(){
  var i = state.cur;
  var t = state.timers[i];
  if(!t || t.startedAt==null) return;
  var elapsed = (Date.now()-t.startedAt)/1000;
  var remainNow = t.remain - elapsed;
  if(remainNow<=0){
    t.remain = 0; t.startedAt = null;
    state.timedOut[i] = true;
    saveState();
    stopTimerInterval();
    render();
    return;
  }
  renderTimerDisplay(remainNow);
}

function manageTimerForRender(){
  stopTimerInterval();
  var i = state.cur;
  var t = getTimer(i);
  var answered = state.answers[i]!==undefined;
  var to = !!state.timedOut[i];
  var btn = document.getElementById('pauseBtn');
  if(answered || to){
    renderTimerDisplay(t.remain);
    if(btn){ btn.textContent='Pause'; btn.disabled=true; }
    return;
  }
  if(t.paused){
    renderTimerDisplay(t.remain);
    if(btn){ btn.textContent='Resume'; btn.disabled=false; }
    return;
  }
  if(t.startedAt==null){ t.startedAt = Date.now(); saveState(); }
  if(btn){ btn.textContent='Pause'; btn.disabled=false; }
  tickTimer();
  timerInterval = setInterval(tickTimer, 200);
}

function togglePause(){
  var i = state.cur;
  if(state.answers[i]!==undefined || state.timedOut[i]) return;
  var t = getTimer(i);
  if(t.paused){
    t.paused = false;
    t.startedAt = Date.now();
  }else{
    freezeTimer(i);
    t.paused = true;
  }
  saveState();
  render();
}

function go(d){
  freezeTimer(state.cur);
  stopTimerInterval();
  var ni = state.cur + d;
  if(ni<0 || ni>QUESTIONS.length-1) return;
  state.cur = ni;
  saveState();
  render();
}

function goToQ(i){
  freezeTimer(state.cur);
  stopTimerInterval();
  state.cur = i;
  saveState();
  render();
}

function goNextOrFinish(){
  if(state.cur===QUESTIONS.length-1){
    finishQuiz();
  }else{
    go(1);
  }
}

function pick(k){
  var i = state.cur;
  if(state.answers[i]!==undefined || state.timedOut[i]) return;
  freezeTimer(i);
  state.answers[i] = k;
  stopTimerInterval();
  saveState();
  render();
}

function finishQuiz(){
  freezeTimer(state.cur);
  stopTimerInterval();
  state.showResults = true;
  saveState();
  bumpAttempts();
  render();
}

function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none' || !panel.style.display) return;
  var html = '';
  for(var i=0;i<QUESTIONS.length;i++){
    var bg = '#d7dde6';
    if(state.timedOut[i]) bg = '#f5a623';
    else if(state.answers[i]!==undefined) bg = (state.answers[i]===QUESTIONS[i].ci) ? '#185FA5' : '#E24B4A';
    var curCls = (!state.showResults && i===state.cur) ? ' cur' : '';
    html += '<button class="dot'+curCls+'" style="background:'+bg+'" onclick="goToQ('+i+')">'+(i+1)+'</button>';
  }
  panel.innerHTML = html;
}

function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || !panel.style.display){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}

function updateNav(){
  var attempted = 0;
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]!==undefined || state.timedOut[i]) attempted++;
  }
  document.getElementById('nav-count').textContent = attempted + ' / ' + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = (attempted/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}

function renderCard(){
  var i = state.cur;
  var q = QUESTIONS[i];
  var answered = state.answers[i];
  var to = !!state.timedOut[i];
  var locked = (answered!==undefined) || to;

  var optsHtml = '';
  for(var k=0;k<q.opts.length;k++){
    var cls = 'opt';
    if(locked){
      if(k===q.ci) cls += ' correct';
      else if(answered===k) cls += ' wrong';
    }
    var dis = locked ? 'disabled' : '';
    optsHtml += '<button class="'+cls+'" '+dis+' onclick="pick('+k+')">'+q.opts[k]+'</button>';
  }

  var expHtml = '';
  if(locked && to && answered===undefined){
    expHtml += '<div class="timeoutnote">Time is up! The correct answer is highlighted above.</div>';
  }

  document.getElementById('card').innerHTML =
    '<div class="tag">'+q.tag+'</div>' +
    '<div class="timerrow"><span>Time Left:</span><span class="timernum" id="timerNum">40s</span>' +
    '<button class="pausebtn" id="pauseBtn" onclick="togglePause()">Pause</button></div>' +
    '<div class="qtext">'+q.q+'</div>' +
    optsHtml + expHtml;

  document.getElementById('prevBtn').disabled = (i===0);
  document.getElementById('nextBtn').textContent = (i===QUESTIONS.length-1) ? 'See Results →' : 'Next';
}

function renderResult(){
  var correct=0, incorrect=0, to=0, skipped=0;
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.timedOut[i]){ to++; }
    else if(state.answers[i]!==undefined){
      if(state.answers[i]===QUESTIONS[i].ci) correct++; else incorrect++;
    }else{ skipped++; }
  }
  document.getElementById('resultArea').innerHTML =
    '<div class="result">' +
    '<h2>Results: '+correct+' / '+QUESTIONS.length+'</h2>' +
    '<div class="scoregrid">' +
      '<div class="scorebox correct"><div class="n">'+correct+'</div><div class="l">Correct</div></div>' +
      '<div class="scorebox incorrect"><div class="n">'+incorrect+'</div><div class="l">Incorrect</div></div>' +
      '<div class="scorebox timedout"><div class="n">'+to+'</div><div class="l">Timed Out</div></div>' +
      '<div class="scorebox skipped"><div class="n">'+skipped+'</div><div class="l">Skipped</div></div>' +
    '</div>' +
    '<div class="resbtns">' +
      '<button class="resbtn retry" onclick="retryWrongAndTimedOut()">Retry Wrong &amp; Timed Out</button>' +
      '<button class="resbtn copy" onclick="copyRes('+correct+','+incorrect+','+to+','+skipped+')">Copy All Results</button>' +
      '<button class="resbtn fresh" onclick="askFresh()">Start Fresh</button>' +
    '</div></div>';
}

function retryWrongAndTimedOut(){
  var list = [];
  for(var i=0;i<QUESTIONS.length;i++){
    var wrongAnswered = state.answers[i]!==undefined && state.answers[i]!==QUESTIONS[i].ci;
    var to = !!state.timedOut[i];
    if(wrongAnswered || to){
      list.push(i);
      delete state.answers[i];
      delete state.timedOut[i];
      state.timers[i] = {remain:40, paused:false, startedAt:null};
    }
  }
  if(list.length>0){
    state.cur = list[0];
    state.showResults = false;
    saveState();
    stopTimerInterval();
    render();
  }
}

function copyRes(correct, incorrect, to, skipped){
  var txt = '[Grant] Speed Quiz Results\nCorrect: '+correct+'\nIncorrect: '+incorrect+'\nTimed Out: '+to+'\nSkipped: '+skipped+'\nScore: '+correct+' / '+QUESTIONS.length;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt);
  }
}

function askFresh(){
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-overlay"><div class="modal-box">' +
    '<p>Start fresh? This will clear all your answers and timers for this quiz.</p>' +
    '<div class="modal-actions">' +
      '<button class="cancel" onclick="closeFreshModal()">Cancel</button>' +
      '<button class="confirm" onclick="confirmFresh()">Start Fresh</button>' +
    '</div></div></div>';
}
function closeFreshModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function confirmFresh(){
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

function render(){
  renderAttBar();
  if(state.showResults){
    document.getElementById('quizArea').classList.add('hide');
    var ra = document.getElementById('resultArea');
    ra.classList.remove('hide');
    renderResult();
    updateNav();
    return;
  }
  document.getElementById('quizArea').classList.remove('hide');
  document.getElementById('resultArea').classList.add('hide');
  renderCard();
  updateNav();
  manageTimerForRender();
}

window.toggleJump = toggleJump;

render();
</script>
</body>
</html>
