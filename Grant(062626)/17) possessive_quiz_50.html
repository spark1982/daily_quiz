<style>

#btn-retry{padding:13px;border:none;border-radius:10px;background:#1D9E75;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}

#btn-sf-ok{background:#E24B4A;color:#fff;}

<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->

<p class="instruction">Choose the sentence that uses the possessive form correctly.</p>

<script>
(function(){
var KEY='quiz_grantpossessive_v1';
var ATT_KEY='quiz_grantpossessive_att_v1';
var TOTAL=50;

var questions=[
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The dog wagged it's tail happily.","My sisters car is parked outside.","The cat licked its paw slowly.","Those books are their's to keep."],ci:2,exp:"<strong>\"its\"</strong> (no apostrophe) is the correct possessive pronoun.<br>\u2022 <em>it's</em> = <em>it is</em> (contraction, not possessive).<br>\u2022 <em>sisters car</em> is missing the apostrophe \u2014 should be <em>sister's</em> or <em>sisters'</em>.<br>\u2022 <em>their's</em> does not exist; the correct form is <em>theirs</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The childrens' playground is closed today.","I borrowed my friend's bicycle yesterday.","The mens' locker room is on the left.","Please put the books back in there place."],ci:1,exp:"<strong>\"friend's\"</strong> correctly adds <em>'s</em> to a singular noun.<br>\u2022 <em>childrens'</em> is wrong \u2014 <em>children</em> is already plural; the possessive is <em>children's</em>.<br>\u2022 <em>mens'</em> is wrong \u2014 <em>men</em> is already plural; the possessive is <em>men's</em>.<br>\u2022 <em>there</em> is a location word; the possessive adjective is <em>their</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The womens' meeting starts at nine.","Have you seen Johns new laptop?","She forgot to bring hers notebook.","The students' essays were returned today."],ci:3,exp:"<strong>\"students'\"</strong> correctly marks plural possessive.<br>\u2022 <em>womens'</em> is wrong \u2014 <em>women</em> is already plural; it should be <em>women's</em>.<br>\u2022 <em>Johns</em> is missing the apostrophe \u2014 should be <em>John's</em>.<br>\u2022 <em>hers</em> is a standalone pronoun; it cannot precede a noun. Use <em>her notebook</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["That bicycle over there is her's.","The dogs bone is buried in the yard.","We visited our grandparents' house last summer.","The team lost there best player."],ci:2,exp:"<strong>\"grandparents'\"</strong> correctly places the apostrophe after the plural noun.<br>\u2022 <em>her's</em> does not exist; the correct form is <em>hers</em>.<br>\u2022 <em>dogs</em> is missing the apostrophe \u2014 should be <em>dog's</em>.<br>\u2022 <em>there</em> is a location word; the possessive adjective is <em>their</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["My two brothers bicycle tires are flat.","The fox hid it's cubs in the den.","The principal's announcement surprised everyone.","All the score's were listed on the board."],ci:2,exp:"<strong>\"principal's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>\u2022 <em>brothers</em> is missing the apostrophe \u2014 should be <em>brothers'</em>.<br>\u2022 <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>\u2022 <em>score's</em> incorrectly adds an apostrophe to a simple plural noun."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The boy's shoes were muddy after the game.","All the deers' tracks led into the forest.","They left there homework on the bus.","The babys' toys were scattered on the floor."],ci:0,exp:"<strong>\"boy's\"</strong> correctly marks singular possessive.<br>\u2022 <em>deers'</em> is wrong \u2014 <em>deer</em> is already plural; the possessive is <em>deer's</em>.<br>\u2022 <em>there</em> should be <em>their</em> (possessive adjective).<br>\u2022 <em>babys'</em> is a misspelling \u2014 the correct plural is <em>babies</em>, so the possessive is <em>babies'</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["James' car broke down on the highway.","The sheeps' wool was thick and warm.","She returned the book to it's shelf.","Those mittens are your's to keep."],ci:0,exp:"<strong>\"James'\"</strong> is an accepted possessive for names ending in <em>s</em>.<br>\u2022 <em>sheeps'</em> is wrong \u2014 <em>sheep</em> is already plural; the possessive is <em>sheep's</em>.<br>\u2022 <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>\u2022 <em>your's</em> does not exist; the correct form is <em>yours</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The geeses' feathers floated on the lake.","We heard the neighbors dog barking all night.","The coach praised the team's effort.","He left his keys in the car, but their fine."],ci:2,exp:"<strong>\"team's\"</strong> correctly shows singular possessive.<br>\u2022 <em>geeses'</em> is wrong \u2014 <em>geese</em> is already plural; the possessive is <em>geese's</em>.<br>\u2022 <em>neighbors dog</em> is missing the apostrophe \u2014 should be <em>neighbor's</em>.<br>\u2022 <em>their</em> should be <em>they're</em> (they are) in that context."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The teachers all brought there own supplies.","Mikes report was the best in the class.","The museum's collection includes rare artifacts.","Both of the mens' uniforms need to be cleaned."],ci:2,exp:"<strong>\"museum's\"</strong> correctly uses <em>'s</em> for a singular possessive.<br>\u2022 <em>there</em> should be <em>their</em> (possessive adjective).<br>\u2022 <em>Mikes</em> is missing the apostrophe \u2014 should be <em>Mike's</em>.<br>\u2022 <em>mens'</em> is wrong \u2014 <em>men</em> is already plural; the possessive is <em>men's</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The oxes' cart was loaded with grain.","Each of the girls brought her own lunch.","The company lost most of it's clients.","Is that jacket your's or mine?"],ci:1,exp:"<strong>\"her\"</strong> is the correct possessive adjective with a singular referent (<em>each girl</em>).<br>\u2022 <em>oxes'</em> is wrong \u2014 the correct plural of <em>ox</em> is <em>oxen</em>; the possessive is <em>oxen's</em>.<br>\u2022 <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>\u2022 <em>your's</em> does not exist; the correct form is <em>yours</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The apple's in the basket are fresh.","My boss's office is on the third floor.","The student forgot there pencil.","She is going to there house after school."],ci:1,exp:"<strong>\"boss's\"</strong> correctly forms the possessive of a noun ending in <em>s</em>.<br>\u2022 <em>apple's</em> incorrectly adds an apostrophe to a simple plural noun.<br>\u2022 Both uses of <em>there</em> are wrong \u2014 the possessive adjective is <em>their</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The peoples' voices were heard at the rally.","That red bike is mine's, not yours.","I can't find Sarahs glasses anywhere.","The people's choice award was announced."],ci:3,exp:"<strong>\"people's\"</strong> is correct \u2014 <em>people</em> is already an irregular plural; the possessive is <em>people's</em>.<br>\u2022 <em>peoples'</em> double-marks the plural \u2014 wrong.<br>\u2022 <em>mine's</em> does not exist; the correct form is <em>mine</em>.<br>\u2022 <em>Sarahs</em> is missing the apostrophe \u2014 should be <em>Sarah's</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The library returned it's books to the shelf.","We parked are car in the wrong spot.","The childrens park was newly renovated.","The lawyer reviewed her client's contract."],ci:3,exp:"<strong>\"client's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>\u2022 <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>\u2022 <em>are</em> should be <em>our</em> (possessive adjective).<br>\u2022 <em>childrens park</em> is missing the apostrophe \u2014 should be <em>children's</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The mices' nest was found in the attic.","Put the groceries in there proper place.","Toms car has a broken headlight.","The mice's droppings were found near the wall."],ci:3,exp:"<strong>\"mice's\"</strong> is correct \u2014 <em>mice</em> is already the plural of <em>mouse</em>; the possessive is <em>mice's</em>.<br>\u2022 <em>mices'</em> is wrong \u2014 <em>mices</em> is not a word.<br>\u2022 <em>there</em> should be <em>their</em> (possessive adjective).<br>\u2022 <em>Toms</em> is missing the apostrophe \u2014 should be <em>Tom's</em>."},
  {q:"Which sentence uses the possessive form CORRECTLY?",opts:["The bird cleaned it's feathers carefully.","That new house on the corner is our's.","The three dogs leashes were tangled up.","The girls' soccer team won the championship."],ci:3,exp:"<strong>\"girls'\"</strong> correctly places the apostrophe after the plural noun.<br>\u2022 <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>\u2022 <em>our's</em> does not exist; the correct form is <em>ours</em>.<br>\u2022 <em>dogs leashes</em> is missing the apostrophe \u2014 should be <em>dogs'</em>."},

// Shuffle options per question (stable per session via stored shuffle)
var state={cur:0,answers:{},shuffles:{},showResults:false};

function loadState(){
  try{
    var d=localStorage.getItem(KEY);
    if(d){
      var p=JSON.parse(d);
      if(typeof p.cur==='number'&&p.cur>=0&&p.cur<TOTAL&&p.answers&&p.shuffles){
        state=p;
        return;
      }
    }
  }catch(e){}
  resetState();
}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function resetState(){
  state={cur:0,answers:{},shuffles:{},showResults:false};
  saveState();
}

function getAtt(){try{return parseInt(localStorage.getItem(ATT_KEY)||'0');}catch(e){return 0;}}
function incAtt(){try{localStorage.setItem(ATT_KEY,String(getAtt()+1));}catch(e){}}
function updateAttDisplay(){document.getElementById('att-count').textContent=getAtt();}

function getShuffle(qi){
  if(!state.shuffles[qi]){
    var arr=[0,1,2,3];
    for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
    state.shuffles[qi]=arr;
    saveState();
  }
  return state.shuffles[qi];
}

function answeredCount(){return Object.keys(state.answers).length;}

function render(){
  var quizScreen=document.getElementById('quiz-screen');
  var resultsScreen=document.getElementById('results-screen');
  if(state.showResults){
    quizScreen.style.display='none';
    resultsScreen.style.display='block';
    renderResults();
    updateTopNav();
    return;
  }
  quizScreen.style.display='block';
  resultsScreen.style.display='none';
  var qi=state.cur;
  var q=questions[qi];
  var shuffle=getShuffle(qi);
  var answered=state.answers.hasOwnProperty(qi);
  var chosen=state.answers[qi]; // index into shuffled array

  document.getElementById('q-num').textContent='Question '+(qi+1)+' of '+TOTAL;
  document.getElementById('q-text').textContent=q.q;

  // Find where the correct option ended up in the shuffle
  var correctShuffledIdx=shuffle.indexOf(q.ci);

  var cd=document.getElementById('choices');
  cd.innerHTML='';
  shuffle.forEach(function(origIdx,si){
    var btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=String.fromCharCode(65+si)+'. '+q.opts[origIdx];
    if(answered){
      btn.disabled=true;
      if(si===correctShuffledIdx){btn.classList.add('correct');}
      else if(si===chosen){btn.classList.add('wrong');}
    }
    btn.onclick=(function(sidx){return function(){choose(sidx);};})(si);
    cd.appendChild(btn);
  });

  var ex=document.getElementById('explanation');
  if(answered){ex.innerHTML=q.exp;ex.style.display='block';}
  else{ex.style.display='none';}

  var prevBtn=document.getElementById('btn-prev');
  var nextBtn=document.getElementById('btn-next');
  prevBtn.disabled=(qi===0);
  if(qi===TOTAL-1){
    if(answered){nextBtn.disabled=false;nextBtn.textContent='See Results';}
    else{nextBtn.disabled=true;nextBtn.textContent='See Results';}
  } else {
    nextBtn.disabled=false;
    nextBtn.textContent='Next';
  }

  updateTopNav();
}

function choose(shuffledIdx){
  var qi=state.cur;
  if(state.answers.hasOwnProperty(qi))return;
  state.answers[qi]=shuffledIdx;
  saveState();
  render();
}

function updateTopNav(){
  var ans=answeredCount();
  document.getElementById('nav-counter').textContent=ans+' / '+TOTAL;
  document.getElementById('progress-fill').style.width=Math.round(ans/TOTAL*100)+'%';
  buildDots();
  var rp=document.getElementById('results-pill');
  if(ans===TOTAL){rp.style.display='inline-block';}
  else{rp.style.display='none';}
}

function buildDots(){
  var panel=document.getElementById('dot-panel');
  panel.innerHTML='';
  var rp=document.createElement('button');
  rp.id='results-pill';rp.textContent='Results';
  rp.style.cssText='display:none;padding:5px 14px;border-radius:20px;background:#1D9E75;color:#fff;font-size:0.8rem;font-weight:700;cursor:pointer;border:none;';
  rp.onclick=function(){window.goResults();};
  if(answeredCount()===TOTAL)rp.style.display='inline-block';
  panel.appendChild(rp);
  for(var i=0;i<TOTAL;i++){
    var b=document.createElement('button');
    b.className='dot';
    b.textContent=i+1;
    if(i===state.cur)b.classList.add('current');
    if(state.answers.hasOwnProperty(i)){
      var q=questions[i];
      var sh=getShuffle(i);
      var correctSI=sh.indexOf(q.ci);
      b.classList.add(state.answers[i]===correctSI?'correct':'wrong');
    }
    b.onclick=(function(idx){return function(){state.cur=idx;saveState();render();};})(i);
    panel.appendChild(b);
  }
}

function renderResults(){
  incAtt();
  updateAttDisplay();
  var correct=0,wrong=0,skipped=0;
  for(var i=0;i<TOTAL;i++){
    if(!state.answers.hasOwnProperty(i)){skipped++;}
    else{
      var q=questions[i];var sh=getShuffle(i);var csi=sh.indexOf(q.ci);
      if(state.answers[i]===csi)correct++;else wrong++;
    }
  }
  document.getElementById('results-score').textContent=correct+' / '+TOTAL;
  var grid=document.getElementById('results-grid');
  grid.innerHTML='';
  for(var i=0;i<TOTAL;i++){
    var q=questions[i];
    var row=document.createElement('div');row.className='res-row';
    var qn=document.createElement('span');qn.className='res-qnum';qn.textContent='Q'+(i+1);
    var st=document.createElement('span');st.className='res-status';
    var txt=document.createElement('span');txt.className='res-text';
    var sh=getShuffle(i);var csi=sh.indexOf(q.ci);
    if(!state.answers.hasOwnProperty(i)){
      st.classList.add('skipped');st.textContent='Skipped';
      txt.textContent=q.opts[q.ci];
    } else if(state.answers[i]===csi){
      st.classList.add('correct');st.textContent='Correct';
      txt.textContent=q.opts[q.ci];
    } else {
      st.classList.add('wrong');st.textContent='Wrong';
      var chosenOrigIdx=sh[state.answers[i]];
      txt.innerHTML='You chose: '+q.opts[chosenOrigIdx]+'<br><span class="res-correct-text">Correct: '+q.opts[q.ci]+'</span>';
    }
    var jb=document.createElement('button');jb.className='res-jump-btn';jb.textContent='Review';
    jb.onclick=(function(idx){return function(){state.cur=idx;state.showResults=false;saveState();render();};})(i);
    row.appendChild(qn);row.appendChild(st);row.appendChild(txt);row.appendChild(jb);
    grid.appendChild(row);
  }
}

window.goNext=function(){
  if(state.cur===TOTAL-1){window.goResults();return;}
  state.cur++;saveState();render();
};
window.goPrev=function(){if(state.cur>0){state.cur--;saveState();render();}};
window.goResults=function(){state.showResults=true;saveState();render();};
window.toggleJump=function(){
  var panel=document.getElementById('dot-panel');
  var btn=document.getElementById('btn-jump');
  if(panel.classList.contains('open')){panel.classList.remove('open');btn.textContent='Jump';}
  else{panel.classList.add('open');btn.textContent='Hide';}
};
window.retryWrong=function(){
  var first=-1;
  for(var i=0;i<TOTAL;i++){
    var q=questions[i];var sh=getShuffle(i);var csi=sh.indexOf(q.ci);
    if(!state.answers.hasOwnProperty(i)||state.answers[i]!==csi){
      delete state.answers[i];
      if(first===-1)first=i;
    }
  }
  if(first===-1)first=0;
  state.cur=first;state.showResults=false;saveState();render();
};
window.copyResults=function(){
  var lines=['[Grant] Possessives Quiz Results - June 18, 2026'];
  var correct=0;
  for(var i=0;i<TOTAL;i++){
    var q=questions[i];var sh=getShuffle(i);var csi=sh.indexOf(q.ci);
    var status='Skipped';
    if(state.answers.hasOwnProperty(i)){status=state.answers[i]===csi?'Correct':'Wrong';}
    else{status='Skipped';}
    if(status==='Correct')correct++;
    lines.push('Q'+(i+1)+': '+status);
  }
  lines.push('Score: '+correct+'/'+TOTAL);
  try{navigator.clipboard.writeText(lines.join('\n'));}catch(e){alert(lines.join('\n'));}
};
window.askFresh=function(){document.getElementById('sf-overlay').classList.add('show');};
window.cancelFresh=function(){document.getElementById('sf-overlay').classList.remove('show');};
window.confirmFresh=function(){
  document.getElementById('sf-overlay').classList.remove('show');
  resetState();
  render();
  updateAttDisplay();
};

loadState();
updateAttDisplay();
render();
})();
</script>
</body>
</html>
