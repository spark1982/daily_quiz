<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Advanced Vocabulary</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:#eef2f7;color:#222;}
.wrap{max-width:640px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 18px rgba(0,0,0,0.08);}
.title{text-align:center;font-size:1.25rem;font-weight:900;color:#185FA5;padding:16px 12px 4px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
#qzAttemptsBar{text-align:center;font-size:0.78rem;font-weight:700;color:#888;padding:2px 12px 8px;background:#fff;letter-spacing:0.02em;}
#qzAttemptsBar span{color:#185FA5;margin-left:4px;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:0;padding:10px 14px;background:#fff;border-top:1px solid #e6ebf1;border-bottom:1px solid #e6ebf1;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;font-weight:700;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;margin:0 14px 8px;border-radius:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;margin:2px;}
.timer-bar{background:#fff;border-bottom:1px solid #d0dce8;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-start-btn:active{opacity:0.8;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
.card{padding:18px 16px 20px;}
.tagline{display:inline-block;background:#185FA5;color:#fff;font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:10px;}
.tagline.review{background:#f5a623;}
.extra-box{background:#f5f7fa;border-left:4px solid #185FA5;padding:12px 14px;border-radius:6px;margin-bottom:14px;font-size:0.92rem;line-height:1.55;color:#333;}
.qtext{font-size:1.04rem;font-weight:700;line-height:1.5;margin-bottom:16px;color:#1a1a1a;}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border:1.5px solid #d7dde6;border-radius:10px;background:#fff;font-size:0.96rem;cursor:pointer;color:#222;line-height:1.4;}
.opt:active{opacity:0.85;}
.opt.correct{border-color:#1D9E75;background:#e9faf3;color:#0c6b4d;font-weight:700;}
.opt.wrong{border-color:#E24B4A;background:#fdeceb;color:#9c2b22;font-weight:700;}
.opt.disabled{cursor:default;}
.exp{display:none;background:#fff7e8;border-left:4px solid #f5a623;padding:12px 14px;border-radius:6px;margin-top:6px;font-size:0.92rem;line-height:1.55;color:#5a4521;}
.exp.show{display:block;}
.navrow{display:flex;gap:10px;margin-top:18px;}
.navbtn{flex:1;padding:13px;border:none;border-radius:10px;font-size:0.96rem;font-weight:700;cursor:pointer;background:#185FA5;color:#fff;}
.navbtn:disabled{background:#c7d2de;cursor:not-allowed;}
.navbtn.secondary{background:#eef2f7;color:#185FA5;}
.result{padding:24px 18px;text-align:center;}
.result h2{color:#185FA5;font-size:1.3rem;margin-bottom:4px;}
.scoreline{font-size:2rem;font-weight:900;color:#1D9E75;margin:12px 0;}
.resultbtn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;color:#fff;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:50;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;padding:22px;max-width:300px;text-align:center;}
.modal-box p{font-size:0.96rem;color:#333;margin-bottom:18px;line-height:1.5;}
.modal-row{display:flex;gap:10px;}
.modal-row button{flex:1;padding:11px;border:none;border-radius:8px;font-size:0.92rem;font-weight:700;cursor:pointer;}
.ul{text-decoration:underline;}
.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}
.fr .fn,.fr .fd{display:block;font-size:0.78em;line-height:1.25;padding:0 3px;}
.fr .fb{display:block;border-top:1.5px solid currentColor;min-width:14px;}
.radical{display:inline-flex;align-items:center;vertical-align:middle;}
.radical-index{font-size:0.65em;align-self:flex-start;margin-right:1px;line-height:1;}
.radical-symbol{display:inline-flex;align-items:stretch;}
.radical-symbol::before{content:"\221A";font-size:1.15em;line-height:1;position:relative;top:2px;}
.radical-content{border-top:2.5px solid currentColor;padding:1px 4px 1px 2px;display:inline-block;line-height:1.3;}
.mblock{text-align:center;margin:10px 0;font-size:1.05em;font-style:italic;line-height:2;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">[Grant] Advanced Vocabulary</div>
  <div class="instruction">Choose the word that best completes each sentence.</div>
  <div id="qzAttemptsBar">Total Attempts:<span id="qzAttemptsCount">0</span></div>
  <div class="timer-bar" id="timerBar">
    <div class="timer-setup" id="timerSetup">
      <label for="timerMinutesInput">Set Time Limit:</label>
      <input type="number" id="timerMinutesInput" min="1" max="180" value="20"> min
      <button class="timer-start-btn" onclick="startTimer()">Start</button>
    </div>
    <div class="timer-running" id="timerRunning" style="display:none;">
      <span class="timer-label">Time Left</span>
      <span class="timer-display" id="timerDisplay">20:00</span>
    </div>
  </div>
  <div id="nav-bar">
    <span id="nav-count">0 / 20</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>

  <div class="card" id="quizArea"></div>
  <div class="result" id="resultArea" style="display:none;"></div>

  <div class="modal-overlay" id="freshModal">
    <div class="modal-box">
      <p>Start fresh? This will erase all current answers and progress.</p>
      <div class="modal-row">
        <button style="background:#eef2f7;color:#185FA5;" onclick="closeFreshModal()">Cancel</button>
        <button style="background:#E24B4A;color:#fff;" onclick="confirmFresh()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>

<script>
var QUESTIONS = [{"tag": "New", "q": "Even though he disagreed with the decision, the captain chose to _____ that his teammates had worked hard all season.", "opts": ["ignore", "deny", "dismiss", "acknowledge"], "ci": 3, "exp": "Acknowledge means to admit or recognize something as true. The captain accepting that his teammates worked hard, even while disagreeing, is acknowledging a fact."}, {"tag": "New", "q": "The _____ carefully brushed away centuries of dirt to reveal an ancient clay pot.", "opts": ["accountant", "electrician", "librarian", "archaeologist"], "ci": 3, "exp": "An archaeologist is a scientist who studies past human life by examining artifacts and ruins. Uncovering an ancient pot is exactly this kind of work."}, {"tag": "New", "q": "The invention of the smartphone was a major technological _____ that changed how people communicate.", "opts": ["imitation", "innovation", "regulation", "tradition"], "ci": 1, "exp": "Innovation means a new idea, method, or invention. A device that changed how people communicate represents a new advancement, not a tradition or a copy."}, {"tag": "New", "q": "Scientists still don't fully understand the _____ of lightning forming inside thunderclouds.", "opts": ["routine", "assumption", "coincidence", "phenomenon"], "ci": 3, "exp": "A phenomenon is a fact or event, especially one that is unusual or hard to explain. Lightning forming in storms is a natural event scientists study closely."}, {"tag": "New", "q": "Bright colors and bold patterns are a _____ of her artistic style.", "opts": ["accident", "drawback", "exception", "hallmark"], "ci": 3, "exp": "A hallmark is a distinguishing feature that something is known for. Bright colors and bold patterns being consistently part of her style makes them a hallmark."}, {"tag": "Review", "q": "If the two countries don't begin talking soon, the border dispute could _____ into a larger conflict.", "opts": ["escalate", "conclude", "diminish", "subside"], "ci": 0, "exp": "Escalate means to increase in intensity or seriousness. A small dispute growing into a larger conflict is escalating, the opposite of calming down."}, {"tag": "New", "q": "The coach saw real _____ in the young player, even though she had never competed before.", "opts": ["limitation", "indifference", "potential", "reluctance"], "ci": 2, "exp": "Potential means a capacity for future growth or success that hasn't been fully realized yet. A coach noticing promise in an inexperienced player is seeing potential."}, {"tag": "New", "q": "Ancient Egypt is considered one of the earliest _____ to develop writing and organized government.", "opts": ["outpost", "settlement", "civilization", "expedition"], "ci": 2, "exp": "A civilization is a society with an advanced and organized culture, including systems like writing and government. Ancient Egypt's organized society fits this definition."}, {"tag": "New", "q": "When her explanation confused the class, the teacher asked her to _____ on her answer with an example.", "opts": ["dismiss", "summarize", "object", "elaborate"], "ci": 3, "exp": "To elaborate means to explain something in greater detail. Being asked to clarify a confusing answer with an example means being asked to elaborate."}, {"tag": "New", "q": "Years of careful saving led to a substantial _____ of money in her account.", "opts": ["accumulation", "distribution", "depletion", "donation"], "ci": 0, "exp": "Accumulation means the gradual gathering or build-up of something over time. Money growing over years of saving describes an accumulation, not money being given away or reduced."}, {"tag": "New", "q": "The teacher calculated each student's _____ score by adding up points from all four quizzes.", "opts": ["aggregate", "average", "lowest", "individual"], "ci": 0, "exp": "Aggregate means a total formed by combining separate amounts. Adding up points from four quizzes to get one combined score produces an aggregate score."}, {"tag": "New", "q": "The students will _____ between art class and music class each week.", "opts": ["alternate", "cancel", "combine", "repeat"], "ci": 0, "exp": "To alternate means to take turns or switch back and forth between two things. Switching between art and music week to week is alternating."}, {"tag": "New", "q": "As she got older, her parents gradually gave her more _____ to make her own decisions.", "opts": ["autonomy", "punishment", "supervision", "criticism"], "ci": 0, "exp": "Autonomy means independence or the freedom to govern oneself. Being given more freedom to decide things on her own is gaining autonomy."}, {"tag": "Review", "q": "Cutting down the rainforest can cause serious _____ damage, harming plants and animals that depend on it.", "opts": ["cosmetic", "structural", "ecological", "financial"], "ci": 2, "exp": "Ecological describes anything related to the relationship between living things and their environment. Harm to plants and animals from deforestation is ecological damage."}, {"tag": "Review", "q": "The school's _____ decided to add an extra recess period after listening to student feedback.", "opts": ["faculty", "cafeteria staff", "administration", "student council"], "ci": 2, "exp": "Administration refers to the group that manages and runs an organization. The school officials who make decisions like adding recess are the administration."}, {"tag": "New", "q": "At fourteen, he became an _____ to a local blacksmith, learning to shape metal by hand.", "opts": ["inspector", "customer", "tourist", "apprentice"], "ci": 3, "exp": "An apprentice is a person learning a trade or skill from an experienced worker. Learning to shape metal directly from a blacksmith describes an apprentice."}, {"tag": "New", "q": "She brought an _____ amount of water for the hike, but not enough for the unexpected detour.", "opts": ["adequate", "scarce", "excessive", "unlimited"], "ci": 0, "exp": "Adequate means enough or sufficient for a purpose. The water was enough for the planned hike, just not for the extra, unplanned distance."}, {"tag": "Review", "q": "She added a short _____ in the margin of the textbook to explain a difficult word.", "opts": ["illustration", "annotation", "heading", "summary"], "ci": 1, "exp": "An annotation is a brief note added to a text to explain or comment on it. A short note in the margin explaining a word is an annotation."}, {"tag": "New", "q": "The scientist used a simple experiment to _____ how plants grow toward light.", "opts": ["prevent", "demonstrate", "question", "theorize"], "ci": 1, "exp": "To demonstrate means to show or prove something clearly through evidence. Using an experiment to show how plants grow toward light is demonstrating that fact."}, {"tag": "Review", "q": "Before launching the new product, the team needed official _____ from the company's board.", "opts": ["sponsorship", "feedback", "authorization", "criticism"], "ci": 2, "exp": "Authorization means official permission to do something. Needing the board's approval before launching a product is needing their authorization."}];
var QUIZ_KEY = 'quiz_advvocab_20_20260625_v1';
var ATT_KEY = 'quiz_advvocab_att_20260625_v1';
var EXTRA_FIELD = '';
var EXTRA_CLASS = '';

function fr(n,d){ return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>'; }
function R(idx,inner){ var i = idx ? '<span class="radical-index">'+idx+'</span>' : ''; return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>'; }

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{ var raw = localStorage.getItem(QUIZ_KEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function saveState(s){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(s)); }catch(e){} }

var state = loadState() || defaultState();
var timerInterval = null;

function render(){
  if(state.showResults){ renderResult(); document.getElementById('quizArea').style.display='none'; document.getElementById('resultArea').style.display='block'; updateNav(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultArea').style.display='none';
  var i = state.cur;
  var q = QUESTIONS[i];
  var picked = state.answers[i];
  var html = '';
  if(q.tag){ html += '<span class="tagline'+(q.tag==='Review'?' review':'')+'">'+q.tag+'</span><br>'; }
  if(EXTRA_FIELD && q[EXTRA_FIELD]){ html += '<div class="'+EXTRA_CLASS+'">'+q[EXTRA_FIELD]+'</div>'; }
  html += '<div class="qtext">Q'+(i+1)+'. '+q.q+'</div>';
  for(var k=0;k<q.opts.length;k++){
    var cls='opt';
    if(picked!==undefined){
      cls += ' disabled';
      if(k===q.ci) cls += ' correct';
      else if(k===picked) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+(picked!==undefined?'disabled':'onclick="pick('+k+')"')+'>'+q.opts[k]+'</button>';
  }
  if(picked!==undefined && picked!==q.ci){
    html += '<div class="exp show">'+q.exp+'</div>';
  }
  html += '<div class="navrow">';
  html += '<button class="navbtn secondary" onclick="go(-1)" '+(i===0?'disabled':'')+'>&larr; Prev</button>';
  if(i>=QUESTIONS.length-1){
    html += '<button class="navbtn" onclick="finishQuiz()">Show Results &rarr;</button>';
  } else {
    html += '<button class="navbtn" onclick="go(1)">Next &rarr;</button>';
  }
  html += '</div>';
  document.getElementById('quizArea').innerHTML = html;
  updateNav();
}

function pick(k){
  var i = state.cur;
  if(state.answers[i]!==undefined) return;
  state.answers[i] = k;
  saveState(state);
  render();
}

function go(d){
  var ni = state.cur + d;
  if(ni<0 || ni>QUESTIONS.length-1) return;
  state.cur = ni;
  saveState(state);
  render();
}

function goToQ(i){
  state.cur = i;
  state.showResults = false;
  saveState(state);
  render();
}

function finishQuiz(){
  state.showResults = true;
  saveState(state);
  bumpAttempts();
  render();
}

function renderResult(){
  var correct=0, wrong=0;
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]===undefined) continue;
    if(state.answers[i]===QUESTIONS[i].ci) correct++; else wrong++;
  }
  var pct = Math.round(correct/QUESTIONS.length*100);
  var html = '<h2>Results</h2>';
  html += '<div class="scoreline">'+correct+' / '+QUESTIONS.length+'</div>';
  html += '<div style="color:#555;margin-bottom:18px;">'+pct+'% correct &middot; '+wrong+' incorrect</div>';
  html += '<button id="retryWrongBtn" class="resultbtn" style="background:#1D9E75;" onclick="retryWrong()">Retry Wrong Ones</button>';
  html += '<button class="resultbtn" style="background:#7b61ff;" onclick="copyRes()">Copy All Results</button>';
  html += '<button class="resultbtn" style="background:#888;" onclick="openFreshModal()">Start Fresh</button>';
  document.getElementById('resultArea').innerHTML = html;
}

function retryWrong(){
  var wrongList = [];
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==QUESTIONS[i].ci){
      wrongList.push(i);
      delete state.answers[i];
    }
  }
  if(wrongList.length>0){
    state.cur = wrongList[0];
    state.showResults = false;
    state.timerStartedAt = null;
    state.timerTotalSec = null;
    saveState(state);
    stopTimerInterval();
    renderTimer();
    render();
  }
}

function openFreshModal(){ document.getElementById('freshModal').classList.add('show'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  state = defaultState();
  saveState(state);
  stopTimerInterval();
  closeFreshModal();
  render();
  renderTimer();
}

function copyRes(){
  var correct=0;
  for(var i=0;i<QUESTIONS.length;i++){ if(state.answers[i]===QUESTIONS[i].ci) correct++; }
  var txt = '[Grant] Advanced Vocabulary' + ' - Score: ' + correct + '/' + QUESTIONS.length;
  try{
    navigator.clipboard.writeText(txt);
  }catch(e){}
  var btns = document.querySelectorAll('.resultbtn');
}

function updateNav(){
  var answered = 0;
  for(var i=0;i<QUESTIONS.length;i++){ if(state.answers[i]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = (answered/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}

function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || !panel.style.display){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}

function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none' || !panel.style.display) return;
  var html='';
  for(var i=0;i<QUESTIONS.length;i++){
    var p = state.answers[i];
    var bg = p===undefined ? '#d7dde6' : (p===QUESTIONS[i].ci ? '#185FA5' : '#E24B4A');
    html += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  panel.innerHTML = html;
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(state);
  renderTimer();
  startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function qaGet(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0; }catch(e){ return 0; } }
function qaSet(n){ try{ localStorage.setItem(ATT_KEY, String(n)); }catch(e){} }
function bumpAttempts(){ qaSet(qaGet()+1); renderAttempts(); }
function renderAttempts(){ var el=document.getElementById('qzAttemptsCount'); if(el) el.textContent = qaGet(); }

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.retryWrong = retryWrong;
window.openFreshModal = openFreshModal;
window.closeFreshModal = closeFreshModal;
window.confirmFresh = confirmFresh;
window.copyRes = copyRes;
window.toggleJump = toggleJump;
window.startTimer = startTimer;

render();
renderTimer();
renderAttempts();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
