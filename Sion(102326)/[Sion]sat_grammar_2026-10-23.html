<!DOCTYPE html>
<html lang="en">

<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }

  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }

  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

</style>

<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Sion] SAT Grammar</div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>

  <div class="modal-box">

    <button class="modal-yes" onclick="confirmFresh()">Yes, Start Fresh</button>
    <button class="modal-no" onclick="closeFreshModal()">Cancel</button>
  </div>
</div>

<script>
var TITLE = "[Sion] SAT Grammar";
var QUIZ_KEY = "satgrammar_20";
var INSTRUCTION = "Read each text and choose the answer that best completes or revises it.";
var TODAY_STR = "20261023";
var RAW_QUESTIONS = [{"context": "Honeybee colonies regulate the temperature of their hives with remarkable ______ when the brood nest grows too warm, workers fan their wings and spread droplets of water that cool the air as they evaporate.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["precision:", "precision,", "precision", "precision; and"], "ci": 0, "exp": "The second clause explains how the bees achieve their precision, and a colon correctly introduces such an explanation after an independent clause. A comma creates a comma splice, no punctuation creates a run-on, and a semicolon cannot be followed by &ldquo;and&rdquo; here.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "For more than a century, many European mapmakers drew California as a large island, and the error lingered in some maps even after explorers had sailed to the head of the Gulf of California and found land. ______ in 1747, a royal decree from King Ferdinand VI of Spain declared that California was not an island.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Eventually,", "For instance,", "Similarly,", "Instead,"], "ci": 0, "exp": "The decree is the final event in a long-lasting error, so a transition that signals the end of a long period is logical. &ldquo;For instance&rdquo; would make the decree an example of the error, &ldquo;Similarly&rdquo; signals a parallel, and &ldquo;Instead&rdquo; signals a replacement that the text does not describe.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "By the time the Hubble Space Telescope ______ in 1990, astronomers had spent decades arguing for a large observatory that could orbit above Earth&rsquo;s blurring atmosphere.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["has been launched", "was launched", "is launched", "had launched"], "ci": 1, "exp": "The telescope did not launch something; it was launched, so a passive verb is needed, and the past-tense &ldquo;was launched&rdquo; fits the event in 1990 that comes after the past-perfect &ldquo;had spent.&rdquo; &ldquo;Had launched&rdquo; is active and makes the telescope the launcher.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "The collection of tens of thousands of clay tablets that archaeologists recovered from the ancient library of King Ashurbanipal at Nineveh ______ some of the oldest surviving copies of the <i>Epic of Gilgamesh</i>.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["include", "are including", "includes", "have included"], "ci": 2, "exp": "The subject is the singular noun &ldquo;collection,&rdquo; not &ldquo;tablets&rdquo; or &ldquo;archaeologists,&rdquo; so the verb must be singular: &ldquo;includes.&rdquo; The other choices are plural verbs.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "The mantis shrimp&rsquo;s eyes contain as many as 16 types of color-detecting cells, compared with just three in ______ researchers long assumed that the animal must see an extraordinary range of colors, yet experiments suggest that it actually tells similar colors apart less precisely than people do.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["humans;", "humans,", "humans", "humans, which"], "ci": 0, "exp": "Each side is an independent clause (&ldquo;The mantis shrimp&rsquo;s eyes contain&hellip;&rdquo; and &ldquo;researchers long assumed&hellip;&rdquo;), so a semicolon is needed. A comma alone creates a comma splice, no punctuation creates a run-on, and &ldquo;which&rdquo; leaves the second part ungrammatical.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "While researching a topic, a student has taken the following notes:<br><ul style='margin:6px 0 0 18px;padding:0;'><li>Mary Anning (1799&ndash;1847) was a fossil collector from Lyme Regis, England.</li><li>As a young woman, she helped uncover one of the first ichthyosaur skeletons to be scientifically recognized.</li><li>In 1823, she found the first complete plesiosaur skeleton.</li><li>Leading scientists used her finds in their own research.</li><li>Because she was a woman, she was not allowed to join the Geological Society of London.</li></ul>", "stem": "The student wants to emphasize an obstacle that Anning faced despite her achievements. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Mary Anning, a fossil collector from Lyme Regis, England, found the first complete plesiosaur skeleton in 1823.", "Despite finding the first complete plesiosaur skeleton, Mary Anning was not allowed to join the Geological Society of London because she was a woman.", "Leading scientists used the fossils that Mary Anning found, including an early ichthyosaur skeleton, in their own research.", "Mary Anning lived from 1799 to 1847 and collected fossils in Lyme Regis, England."], "ci": 1, "exp": "Only this choice pairs an achievement (the first complete plesiosaur skeleton) with an obstacle (being barred from the Geological Society because she was a woman). The other choices list achievements or background without any obstacle.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "Many desert plants survive long droughts by storing water in thick, fleshy tissues. The saguaro cactus of the Sonoran Desert, ______ has a pleated trunk that expands like an accordion after a heavy rain, allowing the plant to take in large amounts of water at once.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["however,", "in contrast,", "for example,", "nevertheless,"], "ci": 2, "exp": "The saguaro is a specific case of a desert plant that stores water, so &ldquo;for example&rdquo; is logical. The other choices signal a contrast, but the saguaro supports the first sentence rather than contradicting it.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "While researching a topic, a student has taken the following notes:<br><ul style='margin:6px 0 0 18px;padding:0;'><li>The Arctic tern is a small seabird.</li><li>It breeds in the Arctic during the northern summer.</li><li>It spends the southern summer near Antarctica.</li><li>A 2010 tracking study found that the birds travel an average of about 44,000 miles a year.</li><li>Because it follows summer between the poles, it may see more daylight than any other animal.</li></ul>", "stem": "The student wants to emphasize the length of the Arctic tern&rsquo;s migration to an audience unfamiliar with the bird. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Its average yearly journey of about 44,000 miles was measured in a 2010 tracking study.", "Because the Arctic tern follows summer between the poles, it may see more daylight than any other animal.", "The Arctic tern, a small seabird that breeds in the Arctic and spends the southern summer near Antarctica, travels an average of about 44,000 miles a year.", "The Arctic tern breeds in the Arctic during the northern summer."], "ci": 2, "exp": "For an unfamiliar audience, the sentence must explain what the Arctic tern is and where it travels, and it must state the distance. One choice gives the distance but never identifies the bird (&ldquo;Its&rdquo;), and the other two do not mention the distance at all.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "The Voyager 1 probe&mdash;launched in 1977 to study Jupiter and ______ is now more than 15 billion miles from Earth, farther than any other human-made object.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Saturn,", "Saturn&mdash;", "Saturn", "Saturn;"], "ci": 1, "exp": "The supplementary element begins with a dash after &ldquo;probe,&rdquo; so it must end with a matching dash before the main verb &ldquo;is.&rdquo; A comma would not match the opening dash, and a semicolon cannot separate a subject from its verb.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Although the duck-billed platypus lays eggs like a reptile, ______ young drink milk that the mother releases through patches on her skin, a trait shared with every other mammal.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["their", "its", "it&rsquo;s", "they&rsquo;re"], "ci": 1, "exp": "The pronoun refers to the singular &ldquo;the duck-billed platypus&rdquo; and shows possession, so &ldquo;its&rdquo; is correct. &ldquo;Their&rdquo; is plural, and &ldquo;it&rsquo;s&rdquo; and &ldquo;they&rsquo;re&rdquo; are contractions, not possessives.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
