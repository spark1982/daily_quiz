<style>

  * { box-sizing: border-box; }

  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }

<div class="quiz-wrap">

  <div class="nav-bar">

<script>
var TITLE = "[Debate] Evidence";
var QUIZ_KEY = "sionpfevid_8";
var INSTRUCTION = "Read each card or situation and choose the best answer about using evidence. Evidence marked (practice card) was written for this drill. Do not quote it in a real round.";
var TODAY_STR = "20261023";
var RAW_QUESTIONS = [{"stem": "What is the biggest problem with using this card for this tag?", "opts": ["The card is from 2024, so it is outdated.", "The card shows that projects moved elsewhere, not that innovation was destroyed, and it is about a different industry.", "The card is too short to be read in a round.", "The card supports the Pro side, so it cannot be read by Con."], "ci": 1, "exp": "&ldquo;Firms moved their planned projects&rdquo; is <i>relocation</i>, not destroyed innovation, and crypto mining is not hyperscale data centers. A Pro debater can say the card proves only that a state-level pause shifts building across state lines &mdash; which a <i>national</i> moratorium would not allow. Relocation could still help Con, but only with an accurate tag.", "contextLabel": "A teammate wants to use this card on the Con side:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Tag: &ldquo;Moratoriums destroy innovation.&rdquo;<br>Lindqvist, Energy Policy Brief, 2024 (practice card): &ldquo;After a two-year state pause on new crypto-mining permits, several firms moved their planned projects to neighboring states.&rdquo;</span>", "tag": "Card vs. Tag", "tagcolor": "#185FA5"}, {"stem": "Which tag is fully supported by this card?", "opts": ["Data centers will cause nationwide blackouts by 2030.", "Data centers already use ten percent of U.S. electricity.", "Planned projects could more than double data centers&rsquo; share of U.S. electricity by 2030.", "Data centers use more electricity than any other industry."], "ci": 2, "exp": "Going from about four percent to &ldquo;past ten percent&rdquo; is more than double, and the card says &ldquo;could,&rdquo; so the tag keeps that uncertainty. The card says nothing about blackouts or other industries, and ten percent is a future projection, not today&rsquo;s share.", "contextLabel": "Read the card:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Delacroix, Grid Reliability Quarterly, 2025 (practice card): &ldquo;Data centers used about four percent of U.S. electricity in 2023, and planned hyperscale projects could push that share past ten percent before 2030.&rdquo;</span>", "tag": "Card vs. Tag", "tagcolor": "#185FA5"}, {"stem": "Which response best challenges what this card proves?", "opts": ["The card is from a journal, so it cannot be trusted.", "Business openings may have risen for other reasons, such as a growing regional economy, so the card shows a pattern, not proof that the campuses caused it.", "Four counties is too many to study carefully.", "Business openings are not important to anyone in the round."], "ci": 1, "exp": "&ldquo;Followed by&rdquo; describes timing, not cause. Without a comparison to similar counties that did not get a campus, other factors could explain the growth. Pointing out correlation versus causation attacks the card&rsquo;s warrant directly. The small sample (four counties) is also a fair point, but saying four is &ldquo;too many&rdquo; gets it backward.", "contextLabel": "Your opponent reads:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Haverford, Rural Economy Journal, 2026 (practice card): &ldquo;In the four counties studied, new hyperscale campuses were followed by a rise in local business openings within three years.&rdquo;</span>", "tag": "Using Evidence", "tagcolor": "#E24B4A"}, {"stem": "As Con, which response uses the card&rsquo;s own words most effectively?", "opts": ["The card is wrong because electricity prices never go up.", "The card covers only three fast-growing states and describes rate <i>requests</i>, not approved increases, so it does not show a nationwide harm that a national moratorium is needed to fix.", "Rate increases of eight to twelve percent are too small to matter at all.", "The card should be ignored because Okafor is on the Pro side."], "ci": 1, "exp": "Strong responses read the card closely: &ldquo;three states&rdquo; limits its scope, and &ldquo;asked regulators for&rdquo; means the increases were only proposed. That turns the Pro&rsquo;s evidence into a reason a nationwide pause is too broad. Claiming that prices never rise, or that an author is biased with no proof, is not a real answer.", "contextLabel": "The Pro team reads:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Okafor, Ratepayer Watch, 2026 (practice card): &ldquo;In three states with rapid data center growth, utilities asked regulators for residential rate increases of eight to twelve percent, largely to fund grid expansion.&rdquo;</span>", "tag": "Using Evidence", "tagcolor": "#E24B4A"}, {"stem": "What is the best criticism of this tag?", "opts": ["The tag is fine, because Arizona and Texas are both in the West.", "The card is too old to be used in a 2026 round.", "The card says about a third of planned sites are in water-stressed areas; it does not show that every Western aquifer is being drained.", "The card should give a percent instead of saying &ldquo;a third.&rdquo;"], "ci": 2, "exp": "A tag must not claim more than the card proves. The card is about <i>planned sites</i> in <i>water-stressed areas</i>, not about <i>every</i> aquifer being drained. An opponent can win the point just by reading the card back. A 2025 source is recent, and &ldquo;a third&rdquo; is a precise enough amount.", "contextLabel": "Your partner reads this tag and card:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Tag: &ldquo;Data centers are draining every aquifer in the West.&rdquo;<br>Brannigan, Western Water Review, 2025 (practice card): &ldquo;More than a third of planned hyperscale sites sit in areas already rated under high water stress, including parts of Arizona and Texas.&rdquo;</span>", "tag": "Card vs. Tag", "tagcolor": "#185FA5"}, {"stem": "What does this card still need before it can be read in a round?", "opts": ["nothing, because a web address is a complete citation", "the author or organization, the date, and the author&rsquo;s qualifications", "only the page number where the quote appears", "the name of the debater who found the card"], "ci": 1, "exp": "A card should tell the judge <i>who</i> said it, <i>when</i>, and <i>why they are qualified</i>. A bare web address does not show whether the source is an engineer, a company selling cooling systems, or an anonymous blog, and it gives no date to judge whether the number is current.", "contextLabel": "A teammate printed this card from a website:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">&ldquo;Water use by cooling towers fell 30 percent at sites that switched to closed-loop systems.&rdquo; &mdash; www.coolingfacts.org</span>", "tag": "Citation", "tagcolor": "#1D9E75"}, {"stem": "What is the strongest way to respond?", "opts": ["Point out that their card is more than a decade old and that newer data shows the share has roughly doubled, so their number understates today&rsquo;s demand.", "Tell the judge that their evidence is probably made up.", "Say nothing, because judges always prefer the newer card on their own.", "Argue that two percent and four percent are basically the same."], "ci": 0, "exp": "When two cards conflict, compare them out loud: date, method, or source quality. Here the 2025 card is far more recent in a fast-changing field. Judges do not automatically compare cards for you, and accusing an opponent of fabrication without proof hurts your credibility.", "contextLabel": "Your opponent reads:", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Marsh, Tech Infrastructure Report, 2014 (practice card): &ldquo;Data centers account for roughly two percent of U.S. electricity use.&rdquo;<br>You have: Delacroix, Grid Reliability Quarterly, 2025 (practice card): &ldquo;Data centers used about four percent of U.S. electricity in 2023.&rdquo;</span>", "tag": "Using Evidence", "tagcolor": "#E24B4A"}, {"stem": "Which response follows standard evidence rules?", "opts": ["Hand over only the highlighted sentences that you read in the round.", "Explain the card from memory, since the judge only needs the main idea.", "Decline, because cards stay private until the end of the tournament.", "Hand over the card with its full citation and the original text, including the parts you did not read aloud."], "ci": 3, "exp": "Judges and opponents may ask to see evidence, and you should provide the original text with a full citation so they can check that the card was not cut out of context. Showing only your highlighted lines or paraphrasing it hides the context the judge is asking to check.", "contextLabel": "After the round, the judge asks to see one of your cards.", "context": "<span style=\"font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1rem;color:#1a1a2e;\">Okafor, Ratepayer Watch, 2026 (practice card)</span>", "tag": "Citation", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    else if(TITLE.indexOf('[Debate]')===0) childName='Sion'; // 2026-10-13: [Debate] quizzes are Sion's
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
