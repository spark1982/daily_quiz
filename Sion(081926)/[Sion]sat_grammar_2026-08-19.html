<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:720px;margin:0 auto;}

<script>
(function(){

function fr(n,d){ return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>'; }
function mx(w,n,d){ return w+'&thinsp;'+fr(n,d); }
function R(idx,inner){ var i = idx ? '<span class="radical-index">'+idx+'</span>' : ''; return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>'; }
function escHtml(s){ return String(s); }


var QUIZ_KEY = 'quiz_sionsatgrammar_20_20260819_v1';
var ATT_KEY  = 'quiz_sionsatgrammar_20260819_att_v1';
var ORDER_KEY = 'quiz_sionsatgrammar_20_20260819_order_v1';
var QUIZ_LABEL = '[Sion] SAT Grammar - Results';

var RAW_QUESTIONS = [{"tag": "Modifier Placement", "box": "Volunteers who sorted the donated books _______ that many of the oldest volumes were too fragile to be shelved.", "q": "Which choice completes the text so that the adverb unambiguously modifies the correct verb?", "opts": ["discovered quickly", "quickly discovered", "quickly, discovered", "discovered, quickly,"], "ci": 0, "exp": "Placing \"quickly\" immediately after \"discovered\" unambiguously shows that the discovery, not the sorting, happened quickly. Placing \"quickly\" directly before \"discovered\" creates a squinting modifier that could describe either the sorting that came before it or the discovering that comes after it, so the reader cannot tell which action was quick. The versions with commas around \"quickly\" add unnecessary punctuation that Standard English does not require here."}, {"tag": "Punctuation", "box": "The conference featured speakers from Toronto, Canada; Lyon, France; _______; and Nairobi, Kenya.", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Osaka, Japan", "Osaka, Japan,", "and Osaka, Japan", "Osaka Japan"], "ci": 0, "exp": "Because the items in this list already contain internal commas (city, country), the list must be separated by semicolons, and each item should simply be the city and country joined by a comma, without an extra trailing comma or an inserted \"and.\" \"Osaka, Japan,\" adds an unnecessary trailing comma before the semicolon. \"and Osaka, Japan\" incorrectly inserts \"and\" before an item that is not the final item in the list. \"Osaka Japan\" omits the comma that must separate the city from the country."}, {"tag": "Modifier Placement", "box": "_______, the museum's east wing remained closed to visitors for nearly a year.", "q": "Which choice completes the text so that the introductory phrase logically modifies the noun that follows it?", "opts": ["Damaged by the storm surge that struck the coastline in early spring", "Having damaged the coastline in early spring", "Because of damaging the coastline early in spring", "The storm surge damaged the coastline in early spring, and"], "ci": 0, "exp": "The noun that immediately follows the introductory phrase is \"the museum's east wing,\" so the phrase must describe the wing, not the storm. \"Damaged by the storm surge...\" correctly modifies the wing. \"Having damaged the coastline...\" illogically implies that the wing damaged the coastline, and \"Because of damaging the coastline...\" has the same problem. Inserting \"The storm surge damaged the coastline in early spring, and\" creates a structure that does not connect logically to the main clause as a modifying phrase."}, {"tag": "Apostrophes", "box": "The research team could not determine why the algorithm's performance had declined so sharply, even though _______ underlying code had not been modified in months.", "q": "Which choice completes the text with the correct possessive form?", "opts": ["its", "it's", "its'", "their"], "ci": 0, "exp": "The sentence needs a possessive pronoun referring back to \"the algorithm\" (singular), meaning \"belonging to it.\" \"its\" is the correct possessive form. \"it's\" is a contraction of \"it is,\" which does not fit here. \"its'\" is not a standard English word. \"their\" incorrectly treats \"the algorithm\" as a plural or human antecedent."}, {"tag": "Concision", "box": "The report's conclusions were _______ largely consistent with the earlier findings published the previous year.", "q": "Which choice completes the text with the most concise phrasing?", "opts": ["in fact", "in point of fact", "as a matter of fact", "in actual fact"], "ci": 0, "exp": "\"in fact\" expresses the intended emphasis concisely. \"in point of fact,\" \"as a matter of fact,\" and \"in actual fact\" are all needlessly wordy variations that add no meaning beyond what \"in fact\" already conveys."}, {"tag": "Pronoun Reference", "box": "When the researchers removed the samples from the incubators and placed them on the counter, _______ had already begun to degrade in the warmer air.", "q": "Which choice completes the text so that the pronoun reference is clear and unambiguous?", "opts": ["the samples", "they", "these", "the latter"], "ci": 0, "exp": "Because both \"the samples\" and \"the incubators\" are plural nouns earlier in the sentence, a pronoun like \"they\" or \"these\" could refer to either one, creating ambiguity about what had begun to degrade. Repeating the specific noun \"the samples\" removes any doubt. \"the latter\" is also ambiguous here because the sentence names more than two eligible nouns (\"the researchers,\" \"the samples,\" and \"the incubators\"), so it does not clearly point to a single antecedent."}, {"tag": "Subject-Verb Agreement", "box": "The committee, along with several outside consultants hired to review the budget, _______ prepared to present its findings at Monday's meeting.", "q": "Which choice completes the text with the correct verb form?", "opts": ["is", "are", "have been", "were"], "ci": 0, "exp": "The subject of the sentence is the singular noun \"The committee\"; the phrase \"along with several outside consultants hired to review the budget\" is a nonessential modifier and does not affect subject-verb agreement, so the singular verb \"is\" is required. \"are\" and \"were\" incorrectly treat the subject as plural, and \"have been\" shifts to a plural, present-perfect form that does not agree with the singular subject either."}, {"tag": "Punctuation", "box": "The proposal, _______, was ultimately rejected by the board.", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["which had taken the committee nearly six months to draft", "that had taken the committee nearly six months to draft", "having taken the committee nearly six months to draft", "it had taken the committee nearly six months to draft"], "ci": 0, "exp": "The clause is nonessential extra information about \"the proposal,\" already set off by commas, so it must begin with \"which,\" not the restrictive relative pronoun \"that.\" \"having taken the committee nearly six months to draft\" turns the clause into a participial phrase that no longer functions the same grammatical way, and \"it had taken the committee nearly six months to draft\" inserts a second subject, \"it,\" turning the phrase into an independent clause that cannot be set off by commas this way without creating a comma splice."}, {"tag": "Comparative Construction", "box": "The revised proposal contained _______ errors than the version submitted the previous month.", "q": "Which choice completes the text with the correct comparative form?", "opts": ["far fewer", "far less", "much less", "a lot less"], "ci": 0, "exp": "\"Errors\" is a countable plural noun, so it requires \"fewer\" rather than \"less,\" which is reserved for uncountable quantities. \"far less,\" \"much less,\" and \"a lot less\" all incorrectly pair \"less\" with the countable noun \"errors.\""}, {"tag": "Verb Tense", "box": "Historians note that the treaty, though widely praised at the time it _______ signed, ultimately failed to prevent further conflict in the region.", "q": "Which choice completes the text with the correct verb form?", "opts": ["was", "is", "had been", "would be"], "ci": 0, "exp": "The sentence describes a specific past event, the signing of the treaty, so the simple past tense \"was\" is correct. \"is\" incorrectly shifts to the present tense for an event that clearly happened in the past. \"had been\" incorrectly implies the signing occurred before another past event, but no such earlier reference point is established. \"would be\" incorrectly suggests the signing was a future possibility relative to some other past moment, which contradicts the sentence's meaning."}, {"tag": "Subjunctive Mood", "box": "The board recommended that the new policy _______ implemented before the start of the fiscal year.", "q": "Which choice completes the text with the correct verb form?", "opts": ["be", "is", "will be", "was"], "ci": 0, "exp": "The verb \"recommended\" triggers the subjunctive mood in the clause that follows, which requires the base form of the verb regardless of subject, so \"be\" is correct. \"is,\" \"will be,\" and \"was\" all incorrectly use ordinary indicative verb forms rather than the subjunctive."}, {"tag": "Parallel Structure", "box": "The exhibit not only showcased rare manuscripts from the fifteenth century but also _______ visitors to examine digital reconstructions of damaged pages.", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["allowed", "allowing", "it allowed", "the exhibit allowed"], "ci": 0, "exp": "The correlative pair \"not only...but also\" requires parallel grammatical structure on both sides; since \"not only\" is followed by the past-tense verb \"showcased,\" \"but also\" must be followed by a matching past-tense verb, \"allowed.\" \"allowing\" breaks the parallel verb form, and \"it allowed\" and \"the exhibit allowed\" both insert an unnecessary repeated subject that disrupts the parallel structure of the correlative construction."}, {"tag": "Transitions", "box": "The city's new recycling program reduced landfill waste by nearly thirty percent in its first year. _______, the program's operating costs were nearly double what officials had projected, prompting a review of its long-term funding.", "q": "Which choice completes the text with the most logical transition?", "opts": ["Nonetheless", "As a result", "Similarly", "In addition"], "ci": 0, "exp": "The second sentence describes a drawback that complicates the positive news in the first sentence, so a contrastive transition is needed. \"Nonetheless\" correctly signals that the following information complicates the preceding point. \"As a result\" incorrectly implies the cost overrun was caused by the waste reduction. \"Similarly\" incorrectly suggests the two sentences describe comparable, non-contrasting outcomes. \"In addition\" treats the cost overrun as simply an additional fact rather than a complicating contrast."}, {"tag": "Subject-Verb Agreement", "box": "Each of the applicants who submitted a portfolio before the deadline _______ notified of the committee's decision by email next week.", "q": "Which choice completes the text with the correct verb form?", "opts": ["will be", "will have", "are being", "were"], "ci": 0, "exp": "The subject of the sentence is the singular indefinite pronoun \"Each,\" not the plural noun \"applicants\" in the prepositional phrase that follows it, so a singular verb form is required. \"will be\" correctly pairs a singular subject with a future passive construction. \"will have\" does not form a grammatically complete predicate here. \"are being\" incorrectly uses a plural verb. \"were\" is both plural and in the wrong tense, since the notification is described as happening \"next week,\" a future event."}, {"tag": "Pronoun Case", "box": "The award will be given to _______ the committee judges to have made the most significant contribution to the field.", "q": "Which choice completes the text with the correct pronoun?", "opts": ["whomever", "whoever", "whom", "who"], "ci": 0, "exp": "The pronoun functions as the object of the verb \"judges\" within the clause \"the committee judges [pronoun] to have made the most significant contribution,\" which requires the objective case \"whomever.\" \"whoever\" incorrectly uses the subjective case. \"whom\" and \"who\" are ordinary relative pronouns that do not fit the indefinite structure required here, and \"who\" is additionally incorrect because it is the subjective case."}, {"tag": "Parallel Structure", "box": "The new policy requires employees to submit expense reports weekly, attend quarterly training sessions, and _______ any changes to their contact information within five business days.", "q": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["report", "reporting", "reports", "the reporting of"], "ci": 0, "exp": "The sentence lists three parallel duties joined by \"and,\" each introduced by a base-form verb following \"requires employees to\": \"submit,\" \"attend,\" and the missing verb. Only \"report\" matches this base-form pattern. \"reporting\" and \"the reporting of\" shift to a gerund/noun form that breaks the parallel structure, and \"reports\" incorrectly adds a third-person singular ending that does not fit after \"to.\""}, {"tag": "Verb Tense", "box": "By the time the archaeologists finally reached the burial chamber, looters _______ most of the valuable artifacts decades earlier.", "q": "Which choice completes the text with the most logical verb tense?", "opts": ["had removed", "removed", "have removed", "were removing"], "ci": 0, "exp": "The looting happened before the archaeologists' arrival, and the phrase \"decades earlier\" signals an event completed before another past event, which calls for the past perfect tense \"had removed.\" The simple past \"removed\" does not establish that the looting occurred before the archaeologists' arrival. \"have removed\" incorrectly uses the present perfect, and \"were removing\" incorrectly suggests an ongoing action rather than a completed one."}, {"tag": "Concision", "box": "_______ the bridge had been inspected only weeks earlier, engineers ordered an immediate closure after cracks appeared in the support beams.", "q": "Which choice completes the text with the most concise phrasing?", "opts": ["Although", "Despite the fact that", "In spite of the fact that", "Regardless of the fact that"], "ci": 0, "exp": "\"Although\" expresses the same contrast as the wordier phrases in a single word, making it the most concise option that still conveys the intended meaning. \"Despite the fact that,\" \"In spite of the fact that,\" and \"Regardless of the fact that\" are all needlessly wordy ways of expressing the same contrast that \"Although\" communicates directly."}, {"tag": "Subject-Verb Agreement", "box": "Neither the lead researcher nor her graduate assistants _______ available to comment on the study's unexpected results.", "q": "Which choice completes the text with the correct verb form?", "opts": ["were", "was", "has been", "is"], "ci": 0, "exp": "With \"neither...nor\" constructions, the verb agrees with the nearer subject, which here is the plural \"her graduate assistants,\" so the plural verb \"were\" is correct. \"was,\" \"has been,\" and \"is\" all incorrectly use singular verb forms, which would only be correct if the nearer subject were singular."}, {"tag": "Punctuation", "box": "The lecture hall could seat only two hundred people _______ hundreds of additional students had already lined up outside hoping to find a seat.", "q": "Which choice completes the text with the most effective transition and punctuation?", "opts": [", yet", "; and", ", however", "yet,"], "ci": 0, "exp": "Two independent clauses are being joined here, and the ideas contrast, so a comma followed by the coordinating conjunction \"yet\" is the standard way to join them. \"; and\" incorrectly pairs a semicolon with a coordinating conjunction, which is redundant. \", however\" creates a comma splice because \"however\" is a conjunctive adverb and requires a semicolon, not just a comma, before it when linking two independent clauses. \"yet,\" misplaces the comma after the conjunction instead of before it."}];

function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){ if(!Array.isArray(arr)||arr.length!==RAW_QUESTIONS.length) return false; var s=arr.slice().sort(function(a,b){return a-b;}); for(var i=0;i<s.length;i++) if(s[i]!==i) return false; return true; }
function loadOrder(){ try{ var raw=localStorage.getItem(ORDER_KEY); if(!raw) return null; var arr=JSON.parse(raw); if(!isValidOrder(arr)) throw new Error('bad'); return arr; }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; } }
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }
function buildQuestions(raw, order){ var out=[]; for(var i=0;i<order.length;i++) out.push(raw[order[i]]); return out; }

var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
var timerInterval = null;

function defaultState(){ return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null }; }

function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; }
    else { state = defaultState(); }
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }
function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10) || 0; }catch(e){ return 0; } }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function formatTime(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function renderTimer(){
  var setupEl=document.getElementById('timerSetup'), runningEl=document.getElementById('timerRunning'), displayEl=document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed=(Date.now()-state.timerStartedAt)/1000;
  var remaining=state.timerTotalSec-elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent=formatTime(remaining);
  if(remaining<=state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining<=state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input=document.getElementById('timerMinutesInput');
  var minutes=parseFloat(input.value);
  if(!minutes||minutes<=0) minutes=20;
  state.timerTotalSec=Math.round(minutes*60);
  state.timerStartedAt=Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function resetTimer(){ state.timerTotalSec=null; state.timerStartedAt=null; saveState(); stopTimerInterval(); renderTimer(); }

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel'), b=document.getElementById('jump-btn');
  if(p.style.display==='none'||!p.style.display){ p.style.display='block'; b.textContent='Hide ▴'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump ▾'; }
}
function renderDots(){
  var p=document.getElementById('dot-panel');
  if(p.style.display!=='block') return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#185FA5' : '#E24B4A');
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML=h;
}
function goToQ(i){ state.cur=i; state.showResults=false; saveState(); render(); document.getElementById('dot-panel').style.display='none'; document.getElementById('jump-btn').textContent='Jump ▾'; }

function showResults(){
  state.showResults=true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('attCount').textContent = loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur, q=qs[i];
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  var tagEl=document.getElementById('q-tag-label');
  if(q.tag){ tagEl.style.display='inline-block'; tagEl.textContent=q.tag; tagEl.style.background = (q.tag==='Review') ? '#f5a623' : '#1D9E75'; } else { tagEl.style.display='none'; }
  var bc=document.getElementById('box-ctx');
  if(q.box){ bc.style.display='block'; bc.innerHTML=q.box; } else { bc.style.display='none'; }
  document.getElementById('q-stem').innerHTML=q.q;
  var sh=getShuffle(i), ans=state.answers[i], csi=getCSI(i), html='';
  for(var s=0;s<4;s++){
    var oi=sh[s], cls='opt-btn', dis='';
    if(ans!==undefined){ dis='disabled'; if(s===csi) cls+=' correct'; else if(s===ans) cls+=' wrong'; }
    html+='<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){ eb.style.display='block'; eb.innerHTML=q.exp; } else { eb.style.display='none'; }
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.getElementById('prev-btn').disabled=(i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){ if(state.answers[i]===undefined) sk++; else if(state.answers[i]===getCSI(i)) c++; else w++; }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp; '+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp; '+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i], label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}

function pick(qi,si){ if(state.answers[qi]!==undefined) return; state.answers[qi]=si; saveState(); render(); }
function go(dir){ if(dir===1 && state.cur===qs.length-1){ showResults(); return; } state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir)); saveState(); render(); }
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){ if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){ if(first===-1) first=i; delete state.answers[i]; } }
  resetTimer();
  if(first!==-1){ state.cur=first; state.showResults=false; saveState(); render(); }
  else { render(); }
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){ var a=state.answers[i]; lines.push('Q'+(i+1)+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong')); }
  var txt=lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

function openFreshModal(mode){
  pendingFreshMode=mode;
  var t=document.getElementById('freshModalTitle'), tx=document.getElementById('freshModalText');
  if(mode==='random'){ t.textContent='Start Fresh (Random Order)?'; tx.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.'; }
  else { t.textContent='Start Fresh (Original Order)?'; tx.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.'; }
  document.getElementById('freshModal').style.display='flex';
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').style.display='none'; }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
  renderTimer();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.startTimer=startTimer;

loadState(); saveState(); render(); renderTimer();
if(state.timerStartedAt) startTimerInterval();

})();
</script>
</body>
</html>
