<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] Advanced SAT Reading</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:720px;margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:2px 12px 8px;}
.attbar{text-align:center;font-size:0.8rem;color:#888;margin-bottom:6px;}
.q-tag{display:inline-block;background:#1D9E75;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:6px;}
.box-ctx{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.92rem;color:#222;line-height:1.6;}
.passage-box{background:#f5f7fa;border-radius:10px;padding:14px;margin-bottom:14px;font-size:0.92rem;color:#222;line-height:1.7;}
.q-stem{font-size:1.05rem;font-weight:600;color:#111;margin-bottom:12px;line-height:1.5;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;line-height:1.4;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.5;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#1D9E75;}
.prev-btn:disabled{opacity:0.4;}
.next-btn{background:#1D9E75;color:#fff;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:10px 0;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#1D9E75;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:340px;margin:20px;text-align:center;}
.timer-bar{background:#fff;border:1px solid #d0dce8;border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}
.fr .fn,.fr .fd{display:block;font-size:0.78em;line-height:1.25;padding:0 3px;}
.fr .fb{display:block;border-top:1.5px solid currentColor;min-width:14px;}
.radical{display:inline-flex;align-items:center;vertical-align:middle;}
.radical-index{font-size:0.65em;align-self:flex-start;margin-right:1px;line-height:1;}
.radical-symbol{display:inline-flex;align-items:stretch;}
.radical-symbol::before{content:"\221A";font-size:1.15em;line-height:1;position:relative;top:2px;}
.radical-content{border-top:2.5px solid currentColor;padding:1px 4px 1px 2px;display:inline-block;line-height:1.3;}
.ul{text-decoration:underline;}
.mblock{text-align:center;margin:10px 0;font-size:1.05em;font-style:italic;line-height:2;}
</style>
</head>
<body>

<div class="title-hd">[Sion] Advanced SAT Reading</div>
<div class="instruction">Read each passage and choose the best answer.</div>
<div class="attbar" id="attbar">Total Attempts: <span id="attCount">0</span></div>

<div class="timer-bar" id="timerBar">
  <div class="timer-setup" id="timerSetup">
    <label for="timerMinutesInput">Set Time Limit:</label>
    <input type="number" id="timerMinutesInput" min="1" max="180" value="20"> min
    <button class="timer-start-btn" onclick="startTimer()">Start</button>
  </div>
  <div class="timer-running" id="timerRunning" style="display:none;">
    <span class="timer-label">Time Left</span>
    <span class="timer-display" id="timerDisplay">20:00</span>
  </div>
</div>

<div id="nav-bar">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / N</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>



<div id="quizArea" style="display:none;">
  <div id="tagWrap"><span class="q-tag" id="q-tag-label" style="display:none;"></span></div>
  <div class="q-num" id="q-num"></div>
  <div class="box-ctx" id="box-ctx" style="display:none;"></div>
  <div class="q-stem" id="q-stem"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" id="prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#1D9E75;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="openFreshModalOriginal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:12px;">Start Fresh (Original Order)</button>
  <button onclick="openFreshModalRandom()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh (Random Order)</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <h3 id="freshModalTitle" style="margin:0 0 10px;color:#185FA5;font-size:1.05rem;"></h3>
    <p id="freshModalText" style="font-size:0.95rem;color:#333;"></p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){

function fr(n,d){ return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>'; }
function mx(w,n,d){ return w+'&thinsp;'+fr(n,d); }
function R(idx,inner){ var i = idx ? '<span class="radical-index">'+idx+'</span>' : ''; return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>'; }
function escHtml(s){ return String(s); }


var QUIZ_KEY = 'quiz_sionadvsatreading_12_20260819_v1';
var ATT_KEY  = 'quiz_sionadvsatreading_20260819_att_v1';
var ORDER_KEY = 'quiz_sionadvsatreading_12_20260819_order_v1';
var QUIZ_LABEL = '[Sion] Advanced SAT Reading - Results';

var RAW_QUESTIONS = [{"tag": "Central Ideas and Details", "box": "The garden had been her mother's, and though the roses had long since given way to a tangle of bindweed, Eleanor could not bring herself to clear it. Each unruly vine seemed to hold some fragment of a voice she could no longer quite recall, and to pull the tangle away, she feared, would be to lose the voice entirely.", "q": "Which choice best states the main idea of the text?", "opts": ["Eleanor keeps the overgrown garden because it feels like a fragile connection to her mother's memory.", "Eleanor is too busy to properly maintain her mother's garden.", "Eleanor believes that gardening is an unnecessary and old-fashioned pastime.", "Eleanor plans to plant new roses in place of the bindweed as soon as possible."], "ci": 0, "exp": "The text explains that Eleanor cannot clear the garden because each vine seems to hold a fragment of a voice she fears losing, indicating that the garden's overgrown state is tied to a fragile emotional connection to her mother, not to a lack of time, a dislike of gardening, or a plan to replant it."}, {"tag": "Central Ideas and Details", "box": "It was not wealth that Mr. Ashworth coveted, nor the easy admiration of his neighbors, but rather the quiet certainty of having judged rightly where others had judged in haste. He had watched, over the course of many winters, how swiftly his acquaintances abandoned their convictions the moment fashion demanded it, and he resolved, whatever the cost, never to be counted among them.", "q": "Which choice best states the main idea of the text?", "opts": ["Mr. Ashworth values steadfast, careful judgment over popularity or material success.", "Mr. Ashworth resents his neighbors for their wealth and social standing.", "Mr. Ashworth believes that changing one's opinions is always a sign of weakness.", "Mr. Ashworth wishes to be more easily admired by those around him."], "ci": 0, "exp": "The text states that Ashworth covets neither wealth nor easy admiration, but rather \"the quiet certainty of having judged rightly,\" and that he resolved never to abandon his convictions for fashion, which together point to a main idea about valuing careful, steadfast judgment over popularity or success."}, {"tag": "Command of Evidence: If True", "box": "<svg width=\"280\" height=\"200\" viewBox=\"0 0 280 200\" style=\"display:block;margin:10px auto;\"><line x1=\"40\" y1=\"15\" x2=\"40\" y2=\"165\" stroke=\"#888\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"165\" x2=\"265\" y2=\"165\" stroke=\"#888\" stroke-width=\"1.5\"/><rect x=\"51.2\" y=\"157.5\" width=\"33.8\" height=\"7.5\" fill=\"#185FA5\"/><text x=\"68.1\" y=\"179\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\">0 hr</text><text x=\"68.1\" y=\"153.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#185FA5\">5%</text><rect x=\"107.5\" y=\"127.5\" width=\"33.8\" height=\"37.5\" fill=\"#185FA5\"/><text x=\"124.4\" y=\"179\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\">2 hr</text><text x=\"124.4\" y=\"123.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#185FA5\">25%</text><rect x=\"163.8\" y=\"82.5\" width=\"33.8\" height=\"82.5\" fill=\"#185FA5\"/><text x=\"180.6\" y=\"179\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\">4 hr</text><text x=\"180.6\" y=\"78.5\" font-size=\"10\" text-anchor=\"middle\" fill=\"#185FA5\">55%</text><rect x=\"220.0\" y=\"45.0\" width=\"33.8\" height=\"120.0\" fill=\"#185FA5\"/><text x=\"236.9\" y=\"179\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\">6 hr</text><text x=\"236.9\" y=\"41.0\" font-size=\"10\" text-anchor=\"middle\" fill=\"#185FA5\">80%</text></svg>", "q": "A study measured the percentage of sea turtle hatchlings that crawled away from the ocean after varying levels of nighttime light exposure near the nest site. The results are shown above. If these results are accurate, which statement do they most strongly support?", "opts": ["Greater exposure to artificial light near the nest is associated with a higher percentage of hatchlings crawling away from the ocean.", "Hatchlings exposed to zero hours of artificial light never make navigation errors.", "Artificial light exposure has no measurable effect on hatchling survival rates.", "Beaches with fewer than two hours of light exposure should be prioritized for conservation funding."], "ci": 0, "exp": "The bar chart shows a clear upward trend: as hours of light exposure increase from 0 to 6, the percentage of hatchlings crawling the wrong direction rises from 5% to 80%, directly supporting the idea that greater light exposure is associated with more hatchlings crawling away from the ocean. The chart shows a small nonzero value at 0 hours (not \"never\"), does not measure survival at all, and does not by itself justify a funding recommendation."}, {"tag": "Transitions", "box": "Marine biologists initially hypothesized that a newly discovered fish species was strictly nocturnal, based on early observations in captivity. ______ extended field observations using underwater cameras later revealed that wild populations were frequently active during daylight hours as well, particularly in deeper, dimly lit waters.", "q": "Which choice completes the text with the most logical transition?", "opts": ["Contrary to that prediction,", "Granted,", "Alternatively,", "Similarly,"], "ci": 0, "exp": "The field observations directly contradict the initial captivity-based hypothesis, which \"Contrary to that prediction,\" correctly signals. \"Granted,\" would suggest the writer is conceding a point before returning to defend the original hypothesis, which does not fit. \"Alternatively,\" incorrectly frames the field observations as one option among several rather than as a correction of the earlier claim. \"Similarly,\" incorrectly suggests the new findings agree with the original hypothesis rather than overturning it."}, {"tag": "Command of Evidence: If True", "box": null, "q": "A team of ecologists hypothesizes that increased nighttime artificial lighting near coastal areas disrupts the navigation of hatchling sea turtles, causing them to crawl toward roads instead of the ocean. Which finding, if true, would most strongly support this hypothesis?", "opts": ["In controlled trials, hatchlings released near bright artificial lights consistently crawled toward the lights rather than toward the darker, moonlit ocean horizon.", "Coastal towns with more artificial lighting tend to have higher tourism revenue during hatching season.", "Sea turtle populations have declined by twelve percent over the past two decades across all coastal regions studied.", "Researchers found that many beachgoers expressed concern about the safety of hatchlings near roads."], "ci": 0, "exp": "Only \"In controlled trials, hatchlings released near bright artificial lights consistently crawled toward the lights...\" directly tests the causal mechanism in the hypothesis, showing hatchlings actively choosing artificial light over the ocean. The other choices mention related coastal topics, such as tourism revenue, general population decline, or public opinion, without providing evidence that light exposure specifically causes navigation errors."}, {"tag": "Command of Evidence: Textual Evidence", "box": "Captain Reyes had commanded the vessel for eleven years without once raising his voice, a fact the newer sailors found harder to credit than any of his skill with a sextant. Yet those who had sailed under him longest knew that his silence, far from indicating indifference, was the very instrument of his authority; a single measured word from him carried more weight than another captain's loudest reprimand.", "q": "Which quotation from the text most effectively supports the claim that Captain Reyes's quiet manner made him more, not less, authoritative?", "opts": ["\"a single measured word from him carried more weight than another captain's loudest reprimand\"", "\"Captain Reyes had commanded the vessel for eleven years without once raising his voice\"", "\"a fact the newer sailors found harder to credit than any of his skill with a sextant\"", "\"those who had sailed under him longest knew that his silence...was the very instrument of his authority\""], "ci": 0, "exp": "This quotation gives the specific, concrete comparison that shows how his quiet words carried unusual weight, which is the clearest evidence for the claim. The second quotation only establishes that he was quiet, without showing that this made him more authoritative. The third quotation is about sailors' disbelief regarding his navigational skill, not his authority. The fourth quotation restates the claim itself rather than providing a specific supporting detail."}, {"tag": "Command of Evidence: Textual Evidence", "box": "When the flood finally receded, the villagers did not first rebuild the mill or repair the bridge, but gathered instead at the old schoolhouse to account for every child, every elder, every name. Only when the list was complete did the hammers begin to sound again across the valley.", "q": "Which quotation from the text most effectively supports the claim that the villagers prioritized people over property after the flood?", "opts": ["\"the villagers did not first rebuild the mill or repair the bridge, but gathered instead at the old schoolhouse to account for every child, every elder, every name\"", "\"When the flood finally receded\"", "\"the hammers begin to sound again across the valley\"", "\"every child, every elder, every name\""], "ci": 0, "exp": "This quotation explicitly contrasts the villagers' choice not to rebuild property first with their decision to account for every person, directly supporting the claim. The other quotations are fragments that either simply set the scene, describe rebuilding beginning, or list a detail without the contrastive framing that shows people were prioritized over property."}, {"tag": "Cross-Text Connections", "box": "Text 1: Some literary scholars contend that the isolated setting in the novel functions primarily as a symbol of the protagonist's psychological withdrawal from society.<br><br>Text 2: Close analysis of the author's private letters from the period reveals that the remote coastal setting was modeled directly on a village where the author had recovered from a long illness, suggesting the location may have held a more literal, autobiographical significance for the author, even as its symbolic resonance within the novel remains apparent to most readers.", "q": "Based on Text 2, how would the author of Text 2 most likely respond to the claim in Text 1?", "opts": ["By agreeing that the setting carries symbolic meaning while also suggesting it had a more literal, autobiographical basis than the claim alone implies.", "By arguing that the setting has no symbolic significance whatsoever and is purely autobiographical.", "By confirming that the setting's only purpose is to represent the protagonist's psychological withdrawal.", "By claiming that the author never traveled to any coastal locations during the period in question."], "ci": 0, "exp": "Text 2 explicitly states that the setting's \"symbolic resonance within the novel remains apparent,\" while also adding autobiographical significance, which is a partial addition to Text 1's claim rather than a full rebuttal or a simple confirmation of Text 1 alone. The other choices either deny the symbolism entirely, treat Text 1's claim as the setting's only purpose, or introduce a detail about travel that Text 2 does not support."}, {"tag": "Inferences", "box": null, "q": "A city's transportation department found that after a new express bus line opened, traffic congestion on the parallel highway decreased by eighteen percent, even though the highway's speed limit and lane count remained unchanged. Based on this information, it is reasonable to infer that ______.", "opts": ["at least some drivers who previously used the highway switched to the new express bus line", "traffic congestion on the highway decreased by eighteen percent after the bus line opened", "express bus lines always reduce highway congestion by significant amounts wherever they are built", "the city plans to increase the highway's speed limit in response to the decrease in congestion"], "ci": 0, "exp": "Since congestion dropped without any change to the highway itself, the most reasonable inference is that some drivers shifted from driving to using the new bus line. \"traffic congestion on the highway decreased by eighteen percent after the bus line opened\" merely restates the given statistic rather than inferring a cause. \"express bus lines always reduce highway congestion by significant amounts wherever they are built\" overgeneralizes a single city's result into a universal rule. \"the city plans to increase the highway's speed limit in response to the decrease in congestion\" introduces a future action that the passage never mentions."}, {"tag": "Cross-Text Connections", "box": "Text 1: Some economists argue that raising the minimum wage inevitably leads to significant job losses among low-wage workers, as employers respond to higher labor costs by reducing staff.<br><br>Text 2: A review of minimum wage increases across several U.S. states between 2010 and 2019 found that employment among low-wage workers remained largely stable in most cases, though a small number of studies detected modest job losses in industries with very thin profit margins, such as certain segments of fast food.", "q": "Based on Text 2, how would the author of Text 2 most likely respond to the claim in Text 1?", "opts": ["By suggesting that significant job losses are not the typical outcome, though limited losses may occur in a small number of industries with thin profit margins.", "By insisting that minimum wage increases never lead to any job losses under any circumstances.", "By confirming that minimum wage increases consistently and significantly reduce employment across nearly all industries.", "By arguing that the minimum wage should be eliminated entirely to protect small businesses."], "ci": 0, "exp": "Text 2's review found employment \"largely stable in most cases,\" with only \"modest job losses\" in a \"small number of studies\" within thin-margin industries, which is a limited, partial qualification of Text 1's claim rather than a total rebuttal or full agreement. \"minimum wage increases never lead to any job losses under any circumstances\" overstates Text 2 as an absolute rebuttal, \"minimum wage increases consistently and significantly reduce employment across nearly all industries\" incorrectly claims Text 2 fully agrees with Text 1, and the choice about eliminating the minimum wage introduces a policy opinion that Text 2 never states."}, {"tag": "Inferences", "box": null, "q": "Historians have long debated whether the printing press alone caused the sharp rise in literacy rates across sixteenth-century Europe, or whether other factors were equally responsible. Recent archival research has revealed that literacy rates in several regions began rising measurably before printed books became widely affordable there, suggesting that ______.", "opts": ["factors beyond the availability of printed books likely contributed to early increases in literacy", "literacy rates in several regions rose before printed books became widely affordable", "the printing press had no meaningful effect on literacy rates anywhere in Europe", "printed books were more expensive in the sixteenth century than they had been in earlier centuries"], "ci": 0, "exp": "Because literacy began rising before affordable printed books were available in those regions, something other than book affordability must have contributed to the early increase, which is the logical inference. \"literacy rates in several regions rose before printed books became widely affordable\" merely restates the given fact rather than drawing a conclusion from it. \"the printing press had no meaningful effect on literacy rates anywhere in Europe\" overgeneralizes far beyond what the passage supports, since it only discusses early increases in some regions, not the printing press's effect everywhere. \"printed books were more expensive in the sixteenth century than they had been in earlier centuries\" is not addressed by the passage at all."}, {"tag": "Transitions", "box": "The city's bike-share program reported a forty percent increase in ridership during its first year, exceeding even the most optimistic projections from transportation planners. ______ several of the program's docking stations sat almost entirely empty throughout the winter months, suggesting that ridership gains were concentrated in specific neighborhoods rather than distributed evenly across the city.", "q": "Which choice completes the text with the most logical transition?", "opts": ["In practice, however,", "Granted,", "Fittingly,", "As a further illustration,"], "ci": 0, "exp": "The second sentence complicates the impressive ridership growth described in the first sentence by pointing out uneven usage, which \"In practice, however,\" correctly signals. \"Granted,\" typically precedes a concession before the writer pivots to reasserting their own point, which does not fit here. \"Fittingly,\" incorrectly suggests the empty stations are a logical, expected consequence of the ridership success. \"As a further illustration,\" incorrectly implies the second sentence simply extends the same positive point rather than complicating it."}];

function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){ if(!Array.isArray(arr)||arr.length!==RAW_QUESTIONS.length) return false; var s=arr.slice().sort(function(a,b){return a-b;}); for(var i=0;i<s.length;i++) if(s[i]!==i) return false; return true; }
function loadOrder(){ try{ var raw=localStorage.getItem(ORDER_KEY); if(!raw) return null; var arr=JSON.parse(raw); if(!isValidOrder(arr)) throw new Error('bad'); return arr; }catch(e){ try{localStorage.removeItem(ORDER_KEY);}catch(e2){} return null; } }
function saveOrder(o){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(o)); }catch(e){} }
function buildQuestions(raw, order){ var out=[]; for(var i=0;i<order.length;i++) out.push(raw[order[i]]); return out; }

var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
var timerInterval = null;

function defaultState(){ return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null }; }

function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) { state = s; }
    else { state = defaultState(); }
  }catch(e){ try{localStorage.removeItem(QUIZ_KEY);}catch(e2){} state = defaultState(); }
}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }
function loadAttempts(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10) || 0; }catch(e){ return 0; } }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function formatTime(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function renderTimer(){
  var setupEl=document.getElementById('timerSetup'), runningEl=document.getElementById('timerRunning'), displayEl=document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed=(Date.now()-state.timerStartedAt)/1000;
  var remaining=state.timerTotalSec-elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent=formatTime(remaining);
  if(remaining<=state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining<=state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input=document.getElementById('timerMinutesInput');
  var minutes=parseFloat(input.value);
  if(!minutes||minutes<=0) minutes=20;
  state.timerTotalSec=Math.round(minutes*60);
  state.timerStartedAt=Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }
function resetTimer(){ state.timerTotalSec=null; state.timerStartedAt=null; saveState(); stopTimerInterval(); renderTimer(); }

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel'), b=document.getElementById('jump-btn');
  if(p.style.display==='none'||!p.style.display){ p.style.display='block'; b.textContent='Hide ▴'; renderDots(); }
  else { p.style.display='none'; b.textContent='Jump ▾'; }
}
function renderDots(){
  var p=document.getElementById('dot-panel');
  if(p.style.display!=='block') return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#185FA5' : '#E24B4A');
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML=h;
}
function goToQ(i){ state.cur=i; state.showResults=false; saveState(); render(); document.getElementById('dot-panel').style.display='none'; document.getElementById('jump-btn').textContent='Jump ▾'; }

function showResults(){
  state.showResults=true;
  try{ localStorage.setItem(ATT_KEY, loadAttempts()+1); }catch(e){}
  saveState(); render();
}

function render(){
  document.getElementById('attCount').textContent = loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur, q=qs[i];
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  var tagEl=document.getElementById('q-tag-label');
  if(q.tag){ tagEl.style.display='inline-block'; tagEl.textContent=q.tag; tagEl.style.background = (q.tag==='Review') ? '#f5a623' : '#1D9E75'; } else { tagEl.style.display='none'; }
  var bc=document.getElementById('box-ctx');
  if(q.box){ bc.style.display='block'; bc.innerHTML=q.box; } else { bc.style.display='none'; }
  document.getElementById('q-stem').innerHTML=q.q;
  var sh=getShuffle(i), ans=state.answers[i], csi=getCSI(i), html='';
  for(var s=0;s<4;s++){
    var oi=sh[s], cls='opt-btn', dis='';
    if(ans!==undefined){ dis='disabled'; if(s===csi) cls+=' correct'; else if(s===ans) cls+=' wrong'; }
    html+='<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi){ eb.style.display='block'; eb.innerHTML=q.exp; } else { eb.style.display='none'; }
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.getElementById('prev-btn').disabled=(i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){ if(state.answers[i]===undefined) sk++; else if(state.answers[i]===getCSI(i)) c++; else w++; }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp; '+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp; '+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i], label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}

function pick(qi,si){ if(state.answers[qi]!==undefined) return; state.answers[qi]=si; saveState(); render(); }
function go(dir){ if(dir===1 && state.cur===qs.length-1){ showResults(); return; } state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir)); saveState(); render(); }
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){ if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){ if(first===-1) first=i; delete state.answers[i]; } }
  resetTimer();
  if(first!==-1){ state.cur=first; state.showResults=false; saveState(); render(); }
  else { render(); }
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){ var a=state.answers[i]; lines.push('Q'+(i+1)+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong')); }
  var txt=lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }

function openFreshModal(mode){
  pendingFreshMode=mode;
  var t=document.getElementById('freshModalTitle'), tx=document.getElementById('freshModalText');
  if(mode==='random'){ t.textContent='Start Fresh (Random Order)?'; tx.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.'; }
  else { t.textContent='Start Fresh (Original Order)?'; tx.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.'; }
  document.getElementById('freshModal').style.display='flex';
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').style.display='none'; }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
  renderTimer();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;
window.startTimer=startTimer;

loadState(); saveState(); render(); renderTimer();
if(state.timerStartedAt) startTimerInterval();

})();
</script>
</body>
</html>
