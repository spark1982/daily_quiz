<script>
var TITLE = "[Sion] Algebra 2";
var QUIZ_KEY = "sionalgebra2";
var INSTRUCTION = "Solve each problem and choose the correct answer.";
var TODAY_STR = "20260922";
var RAW_QUESTIONS = [{"stem": "Simplify: (3 + 4i)(2 &minus; 5i)", "opts": ["&minus;14 &minus; 7i", "26 + 7i", "26 &minus; 7i", "26 &minus; 15i"], "ci": 2, "exp": "Use FOIL: (3)(2) + (3)(&minus;5i) + (4i)(2) + (4i)(&minus;5i) = 6 &minus; 15i + 8i &minus; 20i&sup2;. Since i&sup2; = &minus;1, &minus;20i&sup2; = 20. Combine: 6 + 20 &minus; 15i + 8i = 26 &minus; 7i."}, {"stem": "A line is graphed on the coordinate plane below.<br><svg width=\"260\" height=\"260\" viewBox=\"0 0 260 260\" style=\"display:block;margin:10px auto;\"><line x1=\"30\" y1=\"230\" x2=\"30\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"230\" x2=\"230\" y2=\"230\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"50\" y1=\"230\" x2=\"50\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"210\" x2=\"230\" y2=\"210\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"70\" y1=\"230\" x2=\"70\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"190\" x2=\"230\" y2=\"190\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"90\" y1=\"230\" x2=\"90\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"170\" x2=\"230\" y2=\"170\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"110\" y1=\"230\" x2=\"110\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"150\" x2=\"230\" y2=\"150\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"130\" y1=\"230\" x2=\"130\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"130\" x2=\"230\" y2=\"130\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"150\" y1=\"230\" x2=\"150\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"110\" x2=\"230\" y2=\"110\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"170\" y1=\"230\" x2=\"170\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"90\" x2=\"230\" y2=\"90\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"190\" y1=\"230\" x2=\"190\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"70\" x2=\"230\" y2=\"70\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"210\" y1=\"230\" x2=\"210\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"50\" x2=\"230\" y2=\"50\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"230\" y1=\"230\" x2=\"230\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"30\" x2=\"230\" y2=\"30\" stroke=\"#e0e0e0\" stroke-width=\"1\"/><line x1=\"30\" y1=\"130\" x2=\"230\" y2=\"130\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"130\" y1=\"230\" x2=\"130\" y2=\"30\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"30\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-5</text><text x=\"122\" y=\"233\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-5</text><text x=\"50\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-4</text><text x=\"122\" y=\"213\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-4</text><text x=\"70\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-3</text><text x=\"122\" y=\"193\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-3</text><text x=\"90\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-2</text><text x=\"122\" y=\"173\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-2</text><text x=\"110\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-1</text><text x=\"122\" y=\"153\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">-1</text><text x=\"150\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">1</text><text x=\"122\" y=\"113\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">1</text><text x=\"170\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">2</text><text x=\"122\" y=\"93\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">2</text><text x=\"190\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">3</text><text x=\"122\" y=\"73\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">3</text><text x=\"210\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">4</text><text x=\"122\" y=\"53\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">4</text><text x=\"230\" y=\"142\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">5</text><text x=\"122\" y=\"33\" font-size=\"9\" text-anchor=\"middle\" fill=\"#777\">5</text><line x1=\"30\" y1=\"210\" x2=\"210\" y2=\"30\" stroke=\"#185FA5\" stroke-width=\"2.5\"/><circle cx=\"90\" cy=\"150\" r=\"4.5\" fill=\"#E24B4A\"/><circle cx=\"170\" cy=\"70\" r=\"4.5\" fill=\"#E24B4A\"/></svg><br>Which equation represents this line?", "opts": ["y = 2x + 1", "y = &minus;x + 1", "y = x + 1", "y = x &minus; 1"], "ci": 2, "exp": "The two marked points are (&minus;2, &minus;1) and (2, 3). The slope is (3 &minus; (&minus;1)) &divide; (2 &minus; (&minus;2)) = 4&divide;4 = 1. Using point (2,3): y &minus; 3 = 1(x &minus; 2), so y = x + 1, which matches the line's crossing of the y-axis at 1."}, {"stem": "Solve the inequality: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>x &minus; 3</span><span style=\"border-top:1.4px solid #111;\">x + 2</span></span> &le; 0", "opts": ["(&minus;2, 3]", "(&minus;&infin;, &minus;2) &cup; (3, &infin;)", "[&minus;2, 3]", "(&minus;2, 3)"], "ci": 0, "exp": "The expression is zero at x = 3 and undefined at x = &minus;2. Testing each interval shows the expression is negative only between &minus;2 and 3. Since the inequality allows equality, x = 3 is included, but x = &minus;2 must be excluded because the expression is undefined there: (&minus;2, 3]."}, {"stem": "If sin&theta; = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span> and &theta; is in Quadrant II, what is sec&theta;?", "opts": ["&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">3</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">5</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">4</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">4</span></span>"], "ci": 3, "exp": "Using the Pythagorean identity, cos&theta; = &minus;&radic;(1 &minus; sin&sup2;&theta;) = &minus;&radic;(1 &minus; 9&frasl;25) = &minus;&radic;(16&frasl;25) = &minus;4&frasl;5 (negative because cosine is negative in Quadrant II). Since sec&theta; = 1&divide;cos&theta;, sec&theta; = 1 &divide; (&minus;4&frasl;5) = &minus;5&frasl;4."}, {"stem": "A bacteria culture starts with 500 cells and doubles every 3 hours. Using P(t) = 500 &times; 2<sup>t/3</sup>, what is the population after 9 hours?", "opts": ["2000", "8000", "4500", "4000"], "ci": 3, "exp": "After 9 hours, t&divide;3 = 3, so P(9) = 500 &times; 2<sup>3</sup> = 500 &times; 8 = 4000."}, {"stem": "Convert 210&deg; to radians.", "opts": ["6&pi;&frasl;7", "5&pi;&frasl;6", "7&pi;&frasl;12", "7&pi;&frasl;6"], "ci": 3, "exp": "Multiply by &pi;&frasl;180: 210 &times; &pi;&frasl;180 = 210&pi;&frasl;180. Dividing the numerator and denominator by their greatest common factor, 30, gives 7&pi;&frasl;6."}, {"stem": "An ellipse has center (2, &minus;3), a horizontal major axis of length 10, and a minor axis of length 6. What is its standard form equation?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;



loadState();
render();
</script>
</body>
</html>
