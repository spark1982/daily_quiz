<div class="quiz-wrap">

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp";
var INSTRUCTION = "Choose the correct answer for each problem. Two problems are drawn from each of five chapters.";
var TODAY_STR = "20260922";
var RAW_QUESTIONS = [
 {
  "stem": "Let f be a function such that for x &isin; {&minus;1, 0, 1}, f(x<sup>2</sup>) = 2(f(x))<sup>2</sup> &minus; 1. Compute all possible values of f(&minus;1). (ARML)",
  "opts": [
   "&plusmn;1 only",
   "&plusmn;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, &plusmn;1",
   "0, &plusmn;1",
   "&plusmn;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> only"
  ],
  "ci": 1,
  "exp": "Let f(1)=a and f(&minus;1)=b. At x=1: a=2a<sup>2</sup>&minus;1, so a=&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> or 1. At x=&minus;1: b=2b<sup>2</sup>&minus;1... Working through cases gives f(&minus;1) can be &plusmn;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> or &plusmn;1.",
  "tag": "Chapter 2",
  "tagcolor": "#1D9E75"
 },
 {
  "stem": "Compute the unique positive integer n such that<br><br>2&middot;2<sup>2</sup> + 3&middot;2<sup>3</sup> + 4&middot;2<sup>4</sup> + &hellip; + n&middot;2<sup>n</sup> = 2<sup>n+10</sup>.",
  "opts": [
   "513",
   "514",
   "512",
   "511"
  ],
  "ci": 0,
  "exp": "The sum &Sigma;<sub>k=1</sub><sup>n</sup> k&middot;2<sup>k</sup> = (n&minus;1)2<sup>n+1</sup>+2, so subtracting the k=1 term (which is 2) gives &Sigma;<sub>k=2</sub><sup>n</sup> k&middot;2<sup>k</sup> = (n&minus;1)2<sup>n+1</sup>. Setting this equal to 2<sup>n+10</sup> gives (n&minus;1)2<sup>n+1</sup>=2<sup>n+10</sup>, so n&minus;1=2<sup>9</sup>=512, meaning n=513.",
  "tag": "Chapter 5",
  "tagcolor": "#E24B4A"
 },
 {
  "stem": "A sequence of three real numbers forms an arithmetic progression with a first term of 9. If 2 is added to the 2<sup>nd</sup> term and 20 is added to the 3<sup>rd</sup> term, the three resulting numbers form a geometric progression. What is the smallest possible value for the 3<sup>rd</sup> term of the geometric progression? (AMC 12)",
  "opts": [
   "49",
   "&minus;3",
   "9",
   "1"
  ],
  "ci": 3,
  "exp": "Let the arithmetic progression be 9, 9+d, 9+2d. After the changes, the three numbers 9, 11+d, 29+2d form a geometric progression, so (11+d)<sup>2</sup>=9(29+2d). Expanding gives d<sup>2</sup>+4d&minus;140=0, so d=10 or d=&minus;14. If d=10, the geometric progression is 9, 21, 49, with 3rd term 49. If d=&minus;14, the geometric progression is 9, &minus;3, 1, with 3rd term 1. The smallest possible value is 1.",
  "tag": "Chapter 5",
  "tagcolor": "#E24B4A"
 },
 {
  "stem": "If the tens digit of (4A1)<sup>1A4</sup> is 2, compute all possible values for the digit A. Here, 4A1 and 1A4 represent 3-digit numbers. (ARML)",
  "opts": [
   "2 and 7",
   "1 and 9",
   "4 and 6",
   "3 and 8"
  ],
  "ci": 3,
  "exp": "By Binomial Theorem, (4A1)<sup>1A4</sup>=(4A0+1)<sup>1A4</sup>. The tens digit is determined by (1A4)(4A0) mod 100, which reduces to the units digit of 4&middot;A. The tens digit is 2 only when A=3 (units digit 12) or A=8 (units digit 32).",
  "tag": "Chapter 2",
  "tagcolor": "#1D9E75"
 },
 {
  "stem": "There are n identical cars on a circular track. Together they have just enough gas for one car to complete a lap. Is there a car that can complete a lap by collecting gas from the other cars on its way around? (Engel)",
  "opts": [
   "there is",
   "there is not"
  ],
  "ci": 0,
  "exp": "Consider starting with one car that has all the gas. It completes the lap. By a rotational argument (or induction on n), there always exists a starting car such that the running total of gas never runs out. That car can complete the lap by collecting gas from all others.",
  "tag": "Chapter 1",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Find all real roots of<br><br>(2x + 1)(3x + 1)(5x + 1)(30x + 1) = 10.",
  "opts": [
   "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span>",
   "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4 &plusmn; <span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>",
   "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;2 &plusmn; <span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>",
   "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4 &plusmn; <span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>"
  ],
  "ci": 1,
  "exp": "Group the factors as (2x+1)(30x+1)=60x<sup>2</sup>+32x+1 and (3x+1)(5x+1)=15x<sup>2</sup>+8x+1. Letting u=15x<sup>2</sup>+8x, the first group is 4u+1 and the second is u+1, so (4u+1)(u+1)=10, which gives 4u<sup>2</sup>+5u&minus;9=0, or (4u+9)(u&minus;1)=0. Since u=&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span> gives 15x<sup>2</sup>+8x+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">4</span></span>=0 with negative discriminant (no real roots), only u=1 matters: 15x<sup>2</sup>+8x&minus;1=0, so x=<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;8&plusmn;<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">124</span></span></span><span style=\"border-top:1.4px solid #111;\">30</span></span>=<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>&minus;4&plusmn;<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">31</span></span></span><span style=\"border-top:1.4px solid #111;\">15</span></span>.",
  "tag": "Chapter 4",
  "tagcolor": "#7b61ff"
 },
 {
  "stem": "Alice, Betty, and Carol took the same series of exams. For each exam there was one score of x, one score of y, and one score of z, where x, y, and z are distinct positive integers. The total of the scores obtained by each of the girls was: Alice 20, Betty 10, and Carol 9. If Betty placed first in the algebra exam, who placed second in the geometry exam?",
  "opts": [
   "Alice",
   "Carol",
   "Betty",
   "Cannot be determined"
  ],
  "ci": 1,
  "exp": "The answer is Carol.",
  "tag": "Chapter 3",
  "tagcolor": "#f5a623"
 },
 {
  "stem": "Let p(x) be a polynomial with degree n and<br><br>p(k) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>k</span><span style=\"border-top:1.4px solid #111;\">k+1</span></span>,&nbsp;&nbsp;&nbsp;k = 0, 1, &hellip;, n.<br><br>What is p(n + 1)? (USAMO)",
  "opts": [
   "1 if n is odd, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>n</span><span style=\"border-top:1.4px solid #111;\">n+2</span></span> if n is even",
   "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>n</span><span style=\"border-top:1.4px solid #111;\">n+2</span></span> for every n",
   "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>n+2</span><span style=\"border-top:1.4px solid #111;\">n</span></span> if n is even, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>n</span><span style=\"border-top:1.4px solid #111;\">n+2</span></span> if n is odd",
   "1 for every n"
  ],
  "ci": 0,
  "exp": "Let q(x)=(x+1)p(x)&minus;x. Then q(k)=0 for k=0,1,&hellip;,n, so q(x)=C&middot;x(x&minus;1)&hellip;(x&minus;n). Plugging x=&minus;1 into the definition of q gives q(&minus;1)=1, which determines C=<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(&minus;1)<sup>n+1</sup></span><span style=\"border-top:1.4px solid #111;\">(n+1)!</span></span>. Plugging x=n+1 gives (n+2)p(n+1)&minus;(n+1)=C&middot;(n+1)!=(&minus;1)<sup>n+1</sup>. Solving for p(n+1): if n is odd, p(n+1)=1; if n is even, p(n+1)=<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>n</span><span style=\"border-top:1.4px solid #111;\">n+2</span></span>.",
  "tag": "Chapter 4",
  "tagcolor": "#7b61ff"
 },
 {
  "stem": "The sum of the ages of the 33 students in a class is 430 years. Are there 20 students in the class such that the sum of their ages is greater than 260?",
  "opts": [
   "there are",
   "there are not"
  ],
  "ci": 0,
  "exp": "Suppose every group of 20 has sum &le; 260. The 13 remaining students have sum &ge; 430 &minus; 260 = 170, so average age &ge; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>170</span><span style=\"border-top:1.4px solid #111;\">13</span></span> > 13. Then the 20 youngest students have sum &le; 260, but the 20 oldest have sum = 430 minus the 13 youngest. Since the 13 youngest average under <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>430</span><span style=\"border-top:1.4px solid #111;\">33</span></span> &approx; 13, the 20 oldest sum exceeds 260. So there are such 20 students.",
  "tag": "Chapter 1",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Gulliver came to the island country of Lilliput with 7,000,000 dollars. He spent all his money on bottles of milk at 7 dollars per bottle; at the time, an empty bottle cost 1 dollar. When he drank all the milk he returned the empty bottles and immediately used all the money he got back to buy more milk. While doing this, he noticed that both the price of milk and the price of an empty bottle doubled. Then he drank all the milk again, returned the bottles and used all the money again to buy more milk and so on. Every time he went back to the shop for more milk both the price of milk and the price of an empty bottle doubled. How many bottles of milk did Gulliver drink?",
  "opts": [
   "1,000,000 bottles",
   "1,142,857 bottles",
   "1,250,000 bottles",
   "1,166,666 bottles"
  ],
  "ci": 3,
  "exp": "The answer is 1,166,666 bottles.",
  "tag": "Chapter 3",
  "tagcolor": "#f5a623"
 }
];
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;



loadState();
render();
</script>
</body>
</html>
