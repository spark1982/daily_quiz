<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Speed Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#222;min-height:100vh;}
#app{max-width:700px;margin:0 auto;padding:16px;}
h1{text-align:center;font-size:1.35rem;font-weight:800;color:#185FA5;padding:14px 0 4px;}
#att-bar{text-align:center;font-size:0.8rem;color:#888;margin:6px 0 10px;}
#att-bar span{font-weight:700;color:#185FA5;}
#nav-bar{display:flex;align-items:center;gap:8px;margin:8px 0 4px;}
#nav-count{font-size:13px;white-space:nowrap;color:#555;min-width:52px;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:6px;}
.timer-section{display:flex;align-items:center;justify-content:center;gap:14px;background:#f5f9ff;border:1px solid #d0dce8;border-radius:8px;padding:10px 14px;margin-bottom:14px;}
.timer-label{font-size:0.72rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;}
.timer-display{font-size:2rem;font-weight:900;font-family:'Courier New',monospace;color:#185FA5;min-width:56px;text-align:center;transition:color 0.3s;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}
.timer-display.done{color:#1D9E75;font-size:1.1rem;}
.pause-btn{padding:7px 16px;border:2px solid #185FA5;border-radius:8px;background:white;color:#185FA5;font-weight:700;cursor:pointer;font-size:0.85rem;white-space:nowrap;}
.pause-btn.paused{background:#185FA5;color:white;}
.pause-btn:disabled{opacity:0.4;cursor:not-allowed;}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:20px 18px;margin-bottom:12px;}
.q-num{font-size:0.78rem;color:#888;margin-bottom:8px;}
.chapter-tag{display:inline-block;font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:10px;}
.ch-Gauss{background:#FEF3C7;color:#B45309;}
.ch-Intervals{background:#D1FAE5;color:#065F46;}
.ch-AddSub{background:#DBEAFE;color:#185FA5;}
.ch-Multiply{background:#EDE9FE;color:#6D28D9;}
.ch-Geometry{background:#FEE2E2;color:#B91C1C;}
.q-text{font-size:1.05rem;line-height:1.75;margin-bottom:16px;color:#222;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.opt{padding:13px 10px;border:2px solid #d7dde6;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:700;background:white;text-align:center;transition:border-color 0.15s,background 0.15s;}
.opt:hover:not(:disabled){border-color:#185FA5;background:#f0f6ff;}
.opt.correct{border-color:#1D9E75;background:#e6f7f1;color:#0d6b50;}
.opt.wrong{border-color:#E24B4A;background:#fdf0f0;color:#b03030;}
.opt:disabled{cursor:default;}
.timeup-note{font-size:0.82rem;color:#E24B4A;margin-top:-8px;margin-bottom:14px;font-weight:600;}
.nav-btns{display:flex;gap:8px;margin-top:8px;}
.nav-btns button{flex:1;padding:10px;border:1.5px solid #d7dde6;border-radius:8px;background:white;cursor:pointer;font-size:0.9rem;color:#444;}
.nav-btns button:hover:not(:disabled){border-color:#185FA5;color:#185FA5;}
.nav-btns button:disabled{opacity:0.4;cursor:not-allowed;}
.results{background:white;border-radius:12px;padding:28px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.score-big{font-size:3rem;font-weight:900;color:#185FA5;}
.score-lbl{color:#888;font-size:0.9rem;margin-bottom:16px;}
.stats-row{display:flex;justify-content:center;gap:28px;margin-bottom:22px;}
.stat-n{font-size:1.5rem;font-weight:800;}
.stat-lbl{font-size:0.75rem;color:#888;}
.ch-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px;text-align:left;}
.ch-row{padding:8px 12px;background:#f5f7fa;border-radius:8px;font-size:0.85rem;}
.ch-row strong{display:block;font-size:0.75rem;color:#888;margin-bottom:2px;}
.res-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;}
.btn-copy{background:#7b61ff;color:white;}
.btn-retry{background:#1D9E75;color:white;}
.btn-fresh{background:#e8ecf0;color:#444;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-ov.show{display:flex;}
.modal-box{background:white;border-radius:14px;padding:24px;max-width:360px;width:90%;text-align:center;}
.modal-box h3{color:#185FA5;margin-bottom:10px;font-size:1.05rem;}
.modal-box p{font-size:0.88rem;color:#555;margin-bottom:18px;line-height:1.5;}
.modal-acts{display:flex;gap:10px;}
.modal-acts button{flex:1;padding:10px;border:none;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;}
.modal-acts .cancel{background:#e8ecf0;color:#444;}
.modal-acts .confirm{background:#E24B4A;color:white;}
</style>
</head>
<body>
<div id="app">
  <h1>[Grant] Speed Quiz</h1>
  <div id="att-bar">Total Attempts: <span id="attCount">0</span></div>
  <div id="nav-bar">
    <span id="nav-count">0 / 30</span>
    <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    <button onclick="toggleJump()" id="jump-btn">Jump &#9662;</button>
  </div>
  <div id="dot-panel"></div>
  <div id="qcard"></div>
  <div id="freshModal" class="modal-ov">
    <div class="modal-box">
      <h3 id="freshTitle">Start Fresh?</h3>
      <p id="freshText">All progress will be cleared. This cannot be undone.</p>
      <div class="modal-acts">
        <button class="cancel" onclick="closeFreshModal()">Cancel</button>
        <button class="confirm" onclick="confirmFresh()">Start Fresh</button>
      </div>
    </div>
  </div>
</div>
<script>
var DATE='20260728';
var QUIZ_KEY='quiz_grantspeedquiz_30_'+DATE+'_v2';
var ATT_KEY='quiz_grantspeedquiz_att_'+DATE+'_v2';
var ORDER_KEY=QUIZ_KEY+'_order_v1';
var QUESTION_TIME=40;

var SVG5pt='<svg width="320" height="52" viewBox="0 0 320 52" style="display:block;margin:10px auto;"><line x1="15" y1="24" x2="305" y2="24" stroke="#aaa" stroke-width="1.5"/><circle cx="15" cy="24" r="5" fill="#185FA5"/><circle cx="60" cy="24" r="5" fill="#185FA5"/><circle cx="110" cy="24" r="5" fill="#185FA5"/><circle cx="180" cy="24" r="5" fill="#185FA5"/><circle cx="305" cy="24" r="5" fill="#185FA5"/><text x="15" y="46" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">A</text><text x="60" y="46" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">B</text><text x="110" y="46" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">C</text><text x="180" y="46" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">D</text><text x="305" y="46" text-anchor="middle" font-size="13" fill="#333" font-family="sans-serif">E</text></svg>';
var SVG2x2='<svg width="90" height="90" viewBox="0 0 90 90" style="display:block;margin:10px auto;"><rect x="5" y="5" width="80" height="80" fill="none" stroke="#333" stroke-width="2"/><line x1="45" y1="5" x2="45" y2="85" stroke="#333" stroke-width="1.5"/><line x1="5" y1="45" x2="85" y2="45" stroke="#333" stroke-width="1.5"/></svg>';
var SVG4x4='<svg width="150" height="150" viewBox="0 0 150 150" style="display:block;margin:10px auto;"><rect x="5" y="5" width="140" height="140" fill="none" stroke="#333" stroke-width="2"/><line x1="40" y1="5" x2="40" y2="145" stroke="#333" stroke-width="1.5"/><line x1="75" y1="5" x2="75" y2="145" stroke="#333" stroke-width="1.5"/><line x1="110" y1="5" x2="110" y2="145" stroke="#333" stroke-width="1.5"/><line x1="5" y1="40" x2="145" y2="40" stroke="#333" stroke-width="1.5"/><line x1="5" y1="75" x2="145" y2="75" stroke="#333" stroke-width="1.5"/><line x1="5" y1="110" x2="145" y2="110" stroke="#333" stroke-width="1.5"/></svg>';
var SVG3x3='<svg width="140" height="140" viewBox="0 0 140 140" style="display:block;margin:10px auto;"><rect x="5" y="5" width="130" height="130" fill="none" stroke="#333" stroke-width="2"/><line x1="50" y1="5" x2="50" y2="135" stroke="#333" stroke-width="1.5"/><line x1="95" y1="5" x2="95" y2="135" stroke="#333" stroke-width="1.5"/><line x1="5" y1="50" x2="135" y2="50" stroke="#333" stroke-width="1.5"/><line x1="5" y1="95" x2="135" y2="95" stroke="#333" stroke-width="1.5"/></svg>';
var SVGbar1x6='<svg width="274" height="50" viewBox="0 0 274 50" style="display:block;margin:10px auto;"><rect x="5" y="5" width="264" height="40" fill="none" stroke="#333" stroke-width="2"/><line x1="49" y1="5" x2="49" y2="45" stroke="#333" stroke-width="1.5"/><line x1="93" y1="5" x2="93" y2="45" stroke="#333" stroke-width="1.5"/><line x1="137" y1="5" x2="137" y2="45" stroke="#333" stroke-width="1.5"/><line x1="181" y1="5" x2="181" y2="45" stroke="#333" stroke-width="1.5"/><line x1="225" y1="5" x2="225" y2="45" stroke="#333" stroke-width="1.5"/></svg>';
var SVGtriK2='<svg width="170" height="150" viewBox="0 0 170 150" style="display:block;margin:10px auto;"><polygon points="85,10 10,140 160,140" fill="none" stroke="#333" stroke-width="2"/><line x1="85" y1="10" x2="60" y2="140" stroke="#333" stroke-width="1.5"/><line x1="85" y1="10" x2="110" y2="140" stroke="#333" stroke-width="1.5"/></svg>';

var RAW_QUESTIONS=[
  // GAUSS (6)
  {ch:'Gauss',q:'John saves 5 fifty-cent coins in the first week. He saves 6 fifty-cent coins in the second week. In the third week, he saves 7 fifty-cent coins and so on. How many fifty-cent coins can John save altogether by the end of 10 weeks?',opts:['90','95','100','85'],ci:1},
  {ch:'Gauss',q:'There are 10 rows of seats in an auditorium. The first row has 30 seats. The second row has 34 seats. The third row has 38 seats and so on. How many seats are there in the auditorium?',opts:['450','480','500','460'],ci:1},
  {ch:'Gauss',q:'Compute the following series.<br><strong>1 + 2 + 3 + 4 + &hellip; + 48 + 49 + 50</strong>',opts:['1275','1225','1300','1250'],ci:0},
  {ch:'Gauss',q:'Compute the following series.<br><strong>1 + 3 + 5 + 7 + &hellip; + 45 + 47 + 49</strong>',opts:['600','625','650','575'],ci:1},
  {ch:'Gauss',q:'There are 20 teams in the North Volleyball League. Each team must play exactly one match with every other team. How many matches are to be played altogether in the league?',opts:['190','200','380','180'],ci:0},
  {ch:'Gauss',q:'Find the sum of all multiples of 4 that are smaller than or equal to 40.',opts:['200','220','240','210'],ci:1},
  // INTERVALS (6)
  {ch:'Intervals',q:'Joe puts 5 matchsticks on a table. Each matchstick is 10 cm away from another. How far is the fifth matchstick away from the first one?',opts:['50 cm','40 cm','45 cm','35 cm'],ci:1},
  {ch:'Intervals',q:'A road, 500 m long, is to be planted with trees at an interval of 5 m. How many trees can be planted if trees are planted at both ends of the road as well?',opts:['100','101','99','105'],ci:1},
  {ch:'Intervals',q:'25 trees are planted at regular intervals from the beginning of a road to the end of it. The distance between every two trees is 5 m. How long is the road?',opts:['125 m','120 m','100 m','130 m'],ci:1},
  {ch:'Intervals',q:'21 trees are to be planted at regular intervals along a road that is 800 m long. If both ends of the road are planted with trees as well, how far is one tree from another?',opts:['40 m','38 m','42 m','36 m'],ci:0},
  {ch:'Intervals',q:'Each side of a football field is planted with 16 flags. There is one flag at each corner. How many flags are planted altogether in the football field?',opts:['64','60','56','58'],ci:1},
  {ch:'Intervals',q:'It takes Professor Sullivan 11 minutes to stroll past the twelfth lamp post along a quiet road. How many lamp posts would he have strolled past after 30 minutes?',opts:['30','31','32','29'],ci:1},
  // ADD & SUB (6)
  {ch:'AddSub',q:'Compute the following.<br><strong>22 + 78 =</strong>',opts:['98','100','102','90'],ci:1},
  {ch:'AddSub',q:'Compute the following.<br><strong>33 + 47 =</strong>',opts:['70','80','90','84'],ci:1},
  {ch:'AddSub',q:'Compute the following.<br><strong>24 + 47 + 39 =</strong>',opts:['100','110','120','108'],ci:1},
  {ch:'AddSub',q:'Compute the following.<br><strong>55 + 38 + 27 =</strong>',opts:['110','120','130','115'],ci:1},
  {ch:'AddSub',q:'Compute the following.<br><strong>383 + 1,005 =</strong>',opts:['1383','1388','1398','1288'],ci:1},
  {ch:'AddSub',q:'Compute the following.<br><strong>438 - 132 - 206 =</strong>',opts:['104','100','96','110'],ci:1},
  // MULTIPLY (6)
  {ch:'Multiply',q:'Compute the following.<br><strong>4 &times; 5 &times; 25</strong>',opts:['400','500','450','600'],ci:1},
  {ch:'Multiply',q:'Compute the following.<br><strong>25 &times; 32 &times; 4</strong>',opts:['3000','3200','3300','2800'],ci:1},
  {ch:'Multiply',q:'Compute the following.<br><strong>16 &times; 4 &times; 25</strong>',opts:['1500','1600','1700','1400'],ci:1},
  {ch:'Multiply',q:'Compute the following.<br><strong>25 &times; 7 &times; 4</strong>',opts:['650','700','750','600'],ci:1},
  {ch:'Multiply',q:'Compute the following.<br><strong>40 &times; 99</strong>',opts:['3900','3960','4000','3990'],ci:1},
  {ch:'Multiply',q:'Compute the following.<br><strong>50 &times; 999</strong>',opts:['50000','49950','49900','49500'],ci:1},
  // GEOMETRY (6)
  {ch:'Geometry',q:'Points A, B, C, D, and E are placed on a line at unequal spacings. How many line segments of different lengths can be formed?'+SVG5pt,opts:['8','10','12','9'],ci:1},
  {ch:'Geometry',q:'How many squares are there altogether?'+SVG2x2,opts:['4','5','6','8'],ci:1},
  {ch:'Geometry',q:'How many squares are there altogether?'+SVG4x4,opts:['30','16','20','24'],ci:0},
  {ch:'Geometry',q:'How many rectangles are there altogether?'+SVG3x3,opts:['36','30','27','18'],ci:0},
  {ch:'Geometry',q:'How many rectangles are there altogether?'+SVGbar1x6,opts:['21','15','18','24'],ci:0},
  {ch:'Geometry',q:'How many triangles are there altogether?'+SVGtriK2,opts:['3','6','9','10'],ci:1}
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function identityOrder(){var o=[];for(var i=0;i<RAW_QUESTIONS.length;i++)o.push(i);return o;}
function isValidOrder(arr){if(!Array.isArray(arr)||arr.length!==RAW_QUESTIONS.length)return false;var s=arr.slice().sort(function(a,b){return a-b;});for(var i=0;i<s.length;i++)if(s[i]!==i)return false;return true;}
function loadOrder(){try{var r=localStorage.getItem(ORDER_KEY);if(!r)return null;var a=JSON.parse(r);if(!isValidOrder(a))throw new Error();return a;}catch(e){localStorage.removeItem(ORDER_KEY);return null;}}
function saveOrder(o){try{localStorage.setItem(ORDER_KEY,JSON.stringify(o));}catch(e){}}
function buildQuestionsFromOrder(raw,order){var out=[];for(var i=0;i<order.length;i++)out.push(raw[order[i]]);return out;}
var currentOrder=loadOrder()||identityOrder();
var QUESTIONS=buildQuestionsFromOrder(RAW_QUESTIONS,currentOrder);

function defaultState(){return{cur:0,answers:{},showResults:false,timedOut:{}};}
function saveState(s){try{localStorage.setItem(QUIZ_KEY,JSON.stringify(s));}catch(e){}}
function loadState(){try{var r=localStorage.getItem(QUIZ_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
var state=loadState()||defaultState();
if(!state.timedOut)state.timedOut={};

function loadAtt(){try{return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0;}catch(e){return 0;}}
function saveAtt(n){try{localStorage.setItem(ATT_KEY,String(n));}catch(e){}}
function renderAtt(){var el=document.getElementById('attCount');if(el)el.textContent=loadAtt();}

// Per-question timer
var qTimer={startedAt:null,pausedElapsed:0,paused:false,active:false,questionIdx:-1};
var timerTick=null;

function startQTimer(idx){
  qTimer.startedAt=Date.now();
  qTimer.pausedElapsed=0;
  qTimer.paused=false;
  qTimer.active=true;
  qTimer.questionIdx=idx;
  startTick();
}
function freezeQTimer(){
  if(qTimer.active){
    qTimer.pausedElapsed=getQElapsed();
    qTimer.startedAt=null;
    qTimer.active=false;
  }
  updateTimerDisplay();
}
function getQElapsed(){
  if(!qTimer.active||qTimer.paused)return qTimer.pausedElapsed;
  return qTimer.pausedElapsed+(Date.now()-qTimer.startedAt)/1000;
}
function getQRemaining(){return Math.max(0,QUESTION_TIME-getQElapsed());}
function togglePause(){
  if(!qTimer.active)return;
  var btn=document.getElementById('pause-btn');
  if(qTimer.paused){
    qTimer.startedAt=Date.now();
    qTimer.paused=false;
    if(btn){btn.textContent='⏸ Pause';btn.classList.remove('paused');}
    startTick();
  } else {
    qTimer.pausedElapsed=getQElapsed();
    qTimer.paused=true;
    if(btn){btn.textContent='▶ Resume';btn.classList.add('paused');}
    stopTick();
  }
}
function startTick(){stopTick();timerTick=setInterval(updateTimerDisplay,100);}
function stopTick(){if(timerTick){clearInterval(timerTick);timerTick=null;}}
function updateTimerDisplay(){
  var disp=document.getElementById('q-timer');
  if(!disp)return;
  if(!qTimer.active){
    disp.textContent='Done';
    disp.className='timer-display done';
    stopTick();
    return;
  }
  var rem=getQRemaining();
  if(rem<=0){
    disp.textContent='0';
    disp.className='timer-display danger';
    freezeQTimer();
    if(state.answers[state.cur]===undefined && !state.timedOut[state.cur]){
      state.timedOut[state.cur]=true;
      saveState(state);
      render();
    }
    return;
  }
  disp.textContent=Math.ceil(rem);
  disp.className='timer-display'+(rem<=5?' danger':rem<=10?' warn':'');
}

function getChClass(ch){
  if(ch==='Gauss')return 'ch-Gauss';
  if(ch==='Intervals')return 'ch-Intervals';
  if(ch==='AddSub')return 'ch-AddSub';
  if(ch==='Multiply')return 'ch-Multiply';
  return 'ch-Geometry';
}
function getChLabel(ch){
  if(ch==='AddSub')return 'Add & Subtract';
  return ch;
}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+QUESTIONS.length;
  document.getElementById('prog-fill').style.width=(ans/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel=document.getElementById('dot-panel');if(panel.style.display==='none')return;
  var h='';
  for(var i=0;i<QUESTIONS.length;i++){
    var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===QUESTIONS[i].ci?'#185FA5':'#E24B4A');
    h+='<span onclick="goToQ('+i+')" style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:'+bg+';color:#fff;font-size:11px;cursor:pointer;margin:2px;">'+(i+1)+'</span>';
  }
  panel.innerHTML=h;
}
function toggleJump(){
  var p=document.getElementById('dot-panel'),b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}
  else{p.style.display='none';b.textContent='Jump ▾';}
}
function goToQ(i){state.cur=i;state.showResults=false;saveState(state);document.getElementById('dot-panel').style.display='none';document.getElementById('jump-btn').textContent='Jump ▾';render();}
function pick(optIdx){
  if(state.answers[state.cur]!==undefined)return;
  state.answers[state.cur]=optIdx;
  freezeQTimer();
  saveState(state);
  render();
}
function goPrev(){if(state.cur>0){state.cur--;saveState(state);render();}}
function goNext(){
  if(state.cur<QUESTIONS.length-1){state.cur++;saveState(state);render();}
  else{if(!state.showResults){var a=loadAtt()+1;saveAtt(a);renderAtt();}state.showResults=true;saveState(state);render();}
}
function render(){
  var c=document.getElementById('qcard');
  if(state.showResults){renderResults();return;}
  var q=QUESTIONS[state.cur],ans=state.answers[state.cur],done=ans!==undefined;
  var timedOut=!!state.timedOut[state.cur];
  var isLast=state.cur===QUESTIONS.length-1;
  var locked=done||timedOut;

  // Timer management
  if(state.cur!==qTimer.questionIdx){
    stopTick();
    if(!locked){
      startQTimer(state.cur);
    } else {
      qTimer.active=false;
      qTimer.questionIdx=state.cur;
    }
  }

  var timerH='<div class="timer-section"><div><div class="timer-label">Time Left</div><div class="timer-display" id="q-timer">'+QUESTION_TIME+'</div></div><button class="pause-btn" id="pause-btn" onclick="togglePause()"'+(locked?' disabled':'')+'>▬▬ Pause</button></div>';

  var optsH='';
  for(var i=0;i<q.opts.length;i++){
    var cls='opt';
    if(locked){if(i===q.ci)cls+=' correct';else if(i===ans)cls+=' wrong';}
    optsH+='<button class="'+cls+'"'+(locked?' disabled':'')+' onclick="pick('+i+')">'+q.opts[i]+'</button>';
  }
  var timeupNote=(timedOut&&!done)?'<div class="timeup-note">Time is up! The correct answer is highlighted above.</div>':'';
  var nextLbl=isLast?'See Results &#8594;':'Next &#8594;';
  c.innerHTML='<div class="card"><div class="q-num">Q'+(state.cur+1)+' of '+QUESTIONS.length+'</div><span class="chapter-tag '+getChClass(q.ch)+'">'+getChLabel(q.ch)+'</span>'+timerH+'<div class="q-text">'+q.q+'</div>'+timeupNote+'<div class="opts">'+optsH+'</div></div><div class="nav-btns"><button '+(state.cur===0?'disabled':'')+' onclick="goPrev()">&#8592; Prev</button><button onclick="goNext()">'+nextLbl+'</button></div>';
  updateNav();
  updateTimerDisplay();
}
function renderResults(){
  stopTick();
  var chStats={};
  var chapters=['Gauss','Intervals','AddSub','Multiply','Geometry'];
  for(var c=0;c<chapters.length;c++)chStats[chapters[c]]={ok:0,tot:0};
  var correct=0,wrong=0,skip=0,timedOutCount=0;
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i];
    chStats[q.ch].tot++;
    if(state.answers[i]===undefined){
      if(state.timedOut[i])timedOutCount++;else skip++;
    }
    else if(state.answers[i]===q.ci){correct++;chStats[q.ch].ok++;}
    else wrong++;
  }
  var pct=Math.round(correct/QUESTIONS.length*100);
  var chH='<div class="ch-summary">';
  var chLabels={Gauss:'Gauss',Intervals:'Intervals',AddSub:'Add & Sub',Multiply:'Multiply',Geometry:'Geometry'};
  for(var k in chLabels){
    var s=chStats[k];
    chH+='<div class="ch-row"><strong>'+chLabels[k]+'</strong>'+s.ok+'/'+s.tot+'</div>';
  }
  chH+='</div>';
  document.getElementById('qcard').innerHTML='<div class="results"><div class="score-big">'+correct+'/'+QUESTIONS.length+'</div><div class="score-lbl">'+pct+'% correct</div><div class="stats-row"><div><div class="stat-n" style="color:#1D9E75">'+correct+'</div><div class="stat-lbl">Correct</div></div><div><div class="stat-n" style="color:#E24B4A">'+wrong+'</div><div class="stat-lbl">Wrong</div></div><div><div class="stat-n" style="color:#f5a623">'+timedOutCount+'</div><div class="stat-lbl">Timed Out</div></div><div><div class="stat-n" style="color:#888">'+skip+'</div><div class="stat-lbl">Skipped</div></div></div>'+chH+'<button class="res-btn btn-retry" onclick="retryWrong()">Retry Wrong &amp; Timed Out</button><button class="res-btn btn-copy" onclick="copyRes()">Copy All Results</button><button class="res-btn btn-fresh" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button><button class="res-btn btn-fresh" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button></div>';
  updateNav();
}
function copyRes(){
  var correct=0,lines=['[Grant] Speed Quiz Results'];
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i],a=state.answers[i],ok=a===q.ci;
    if(ok)correct++;
    var status=(a===undefined)?(state.timedOut[i]?'TIMED OUT':'SKIP'):(ok?'OK':'WRONG');
    lines.push('Q'+(i+1)+' ['+q.ch+'] '+status);
  }
  lines.push('Score: '+correct+'/'+QUESTIONS.length);
  try{navigator.clipboard.writeText(lines.join('\n'));}catch(e){alert(lines.join('\n'));}
}
function retryWrong(){
  var wrong=[];
  for(var i=0;i<QUESTIONS.length;i++){
    if((state.answers[i]!==undefined&&state.answers[i]!==QUESTIONS[i].ci)||(state.answers[i]===undefined&&state.timedOut[i])){
      wrong.push(i);
      delete state.answers[i];
      delete state.timedOut[i];
    }
  }
  if(wrong.length>0){state.cur=wrong[0];state.showResults=false;saveState(state);render();}
}
var pendingFreshMode='original';
function openFreshModalOriginal(){pendingFreshMode='original';document.getElementById('freshTitle').textContent='Start Fresh (Original Order)?';document.getElementById('freshText').textContent='Questions return to their original order and all answers and timers will be cleared.';document.getElementById('freshModal').classList.add('show');}
function openFreshModalRandom(){pendingFreshMode='random';document.getElementById('freshTitle').textContent='Start Fresh (Random Order)?';document.getElementById('freshText').textContent='Questions will be reshuffled into a new random order, and all answers and timers will be cleared.';document.getElementById('freshModal').classList.add('show');}
function closeFreshModal(){document.getElementById('freshModal').classList.remove('show');}
function confirmFresh(){currentOrder=(pendingFreshMode==='random')?shuffle(identityOrder()):identityOrder();saveOrder(currentOrder);QUESTIONS=buildQuestionsFromOrder(RAW_QUESTIONS,currentOrder);state=defaultState();saveState(state);stopTick();qTimer={startedAt:null,pausedElapsed:0,paused:false,active:false,questionIdx:-1};closeFreshModal();render();}
window.toggleJump=toggleJump;window.goToQ=goToQ;window.pick=pick;window.goPrev=goPrev;window.goNext=goNext;
window.togglePause=togglePause;window.copyRes=copyRes;window.retryWrong=retryWrong;
window.openFreshModalOriginal=openFreshModalOriginal;window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;window.confirmFresh=confirmFresh;
render();renderAtt();
</script>
</body>
