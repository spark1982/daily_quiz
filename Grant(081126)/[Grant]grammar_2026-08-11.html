<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Grammar</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
html{margin:0 auto;}
.wrap{max-width:700px;margin:0 auto;}
.title-hd{text-align:center;font-size:1.5rem;font-weight:800;color:#1D9E75;padding:10px 0 2px;}
.sub-hd{text-align:center;font-size:0.82rem;color:#555;margin-bottom:6px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}
.q-tag{display:inline-block;background:#1D9E75;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:8px;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.word-text{font-size:1.15rem;font-weight:800;color:#111;line-height:1.5;}
.speak-btn{background:#e8edf4;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.opt-btn{display:block;width:100%;padding:12px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;white-space:pre-line;}
.box-ctx{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.9rem;color:#222;line-height:1.6;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#1D9E75;}
.prev-btn:disabled{opacity:0.5;cursor:default;}
.next-btn{background:#1D9E75;color:#fff;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#1D9E75;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:340px;margin:20px;text-align:center;}
.timer-bar{background:#fff;border:1px solid #d0dce8;border-radius:10px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}
.timer-setup input[type="number"]{width:56px;padding:5px 6px;border:1.5px solid #d0dce8;border-radius:6px;font-size:0.9rem;text-align:center;}
.timer-start-btn{background:#185FA5;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
.timer-running{display:flex;align-items:center;gap:8px;}
.timer-label{font-size:0.78rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.02em;}
.timer-display{font-size:1.1rem;font-weight:900;color:#185FA5;font-family:'Courier New',monospace;letter-spacing:0.02em;}
.timer-display.warn{color:#f5a623;}
.timer-display.danger{color:#E24B4A;}

.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}
.fr .fn,.fr .fd{display:block;font-size:0.78em;line-height:1.25;padding:0 3px;}
.fr .fb{display:block;border-top:1.5px solid currentColor;min-width:14px;}
.radical{display:inline-flex;align-items:center;vertical-align:middle;}
.radical-index{font-size:0.65em;align-self:flex-start;margin-right:1px;line-height:1;}
.radical-symbol{display:inline-flex;align-items:stretch;}
.radical-symbol::before{content:"\221A";font-size:1.15em;line-height:1;position:relative;top:2px;}
.radical-content{border-top:2.5px solid currentColor;padding:1px 4px 1px 2px;display:inline-block;line-height:1.3;}
.mblock{text-align:center;margin:10px 0;font-size:1.05em;font-style:italic;line-height:2;}
.ul{text-decoration:underline;font-style:normal;}
.passage-box{background:#f5f7fa;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:0.92rem;color:#222;line-height:1.7;}

</style>
</head>
<body>
<div class="wrap">

<div class="title-hd">[Grant] Grammar</div>
<div class="sub-hd" id="att-display">Total Attempts: 0</div>
<div class="instruction">Choose the best answer to complete each sentence.</div>

<div class="timer-bar" id="timerBar">
  <div class="timer-setup" id="timerSetup">
    <label for="timerMinutesInput">Set Time Limit:</label>
    <input type="number" id="timerMinutesInput" min="1" max="180" value="20"> min
    <button class="timer-start-btn" onclick="startTimer()">Start</button>

  <div class="word-row">
    <span class="word-text" id="q-word"></span>

  </div>

  <div class="nav-row">

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#1D9E75;margin:16px 0 8px;">Results</h2>

  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="openFreshModalOriginal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:12px;">Start Fresh (Original Order)</button>
  <button onclick="openFreshModalRandom()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh (Random Order)</button>
</div>

<div class="modal-overlay" id="freshModal">

    <h3 id="freshModalTitle" style="margin:0 0 10px;color:#185FA5;font-size:1.05rem;">Start Fresh?</h3>
    <p id="freshModalText" style="font-size:0.95rem;color:#444;margin:0 0 16px;">All progress will be cleared.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="closeFreshModal()" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

</div>
<script>
(function(){

var QUIZ_KEY = "quiz_grantgrammar_20_20260810_v1";
var ATT_KEY = "quiz_grantgrammar_20260810_att_v1";
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var QUIZ_LABEL = "[Grant] Grammar - Results";
var TAG_COLORS = {"Abstract Nouns": "#1D9E75", "Adjective Order": "#185FA5", "Adverbs": "#7b61ff", "Capitalization": "#f5a623", "Comma Usage in Compound Sentences": "#E24B4A", "Common and Proper Nouns": "#0aa0a0", "Comparative and Superlative Adjectives": "#c2185b", "Compound Predicates": "#5d4037", "Contractions": "#607d8b", "Coordinating Conjunctions": "#8e44ad", "Helping Verbs": "#1D9E75", "Irregular Verbs": "#185FA5", "Linking Verbs": "#7b61ff", "Possessive Nouns": "#f5a623", "Prepositions": "#E24B4A", "Pronoun Case": "#0aa0a0", "Sentence Fragments and Run-ons": "#c2185b", "Sentence Types": "#5d4037", "Subject-Verb Agreement": "#607d8b", "Verb Tense Consistency": "#8e44ad"};
var TIMER_DEFAULT_MIN = 20;

var RAW_QUESTIONS = [{"tag": "Irregular Verbs", "stem": "Choose the correct sentence.", "opts": ["She swam across the lake yesterday.", "She swimmed across the lake yesterday.", "She has swam across the lake yesterday.", "She swum across the lake yesterday."], "ci": 0, "exp": "The past tense of 'swim' is 'swam'. 'swimmed' is not a word, 'swum' is the past participle and needs a helping verb like 'has', and 'has swam' incorrectly pairs the past tense form with 'has' instead of the participle 'swum'."}, {"tag": "Adverbs", "stem": "Which sentence uses the adverb correctly?", "opts": ["He answered the question quickly and correctly.", "He answered the question quick and correct.", "He answered the question quickly and correct.", "He answered the question quick and correctly."], "ci": 0, "exp": "Adverbs that describe how an action is done usually end in -ly, so both 'quickly' and 'correctly' are needed to describe how he answered."}, {"tag": "Subject-Verb Agreement", "stem": "Choose the correct sentence.", "opts": ["Neither of the boys has finished his homework.", "Neither of the boys have finished his homework.", "Neither of the boys finish his homework.", "Neither of the boys finishing his homework."], "ci": 0, "exp": "'Neither' is singular, so it takes the singular verb 'has', not the plural 'have'."}, {"tag": "Pronoun Case", "stem": "Choose the correct sentence.", "opts": ["My sister and I are going to the museum.", "My sister and me are going to the museum.", "Me and my sister are going to the museum.", "My sister and myself are going to the museum."], "ci": 0, "exp": "'I' is the correct subject pronoun to use with 'my sister' as the subject of the sentence. 'me' is an object pronoun, and 'myself' is a reflexive pronoun that needs an earlier 'I' to refer back to."}, {"tag": "Contractions", "stem": "Which sentence uses the contraction correctly?", "opts": ["It's important to wear a helmet when you ride your bike.", "Its important to wear a helmet when you ride your bike.", "It's important to wear a helmet when you're ride your bike.", "Its' important to wear a helmet when you ride your bike."], "ci": 0, "exp": "'It's' is the contraction for 'it is', which fits the sentence. 'Its' without an apostrophe is a possessive pronoun, and 'Its'' is not a correct form."}, {"tag": "Sentence Types", "stem": "Which of the following is an interrogative sentence?", "opts": ["Did you finish your science project?", "Please turn in your science project.", "I finished my science project last night.", "What an amazing science project that is!"], "ci": 0, "exp": "An interrogative sentence asks a question and ends with a question mark. 'Did you finish your science project?' is the only choice that asks something."}, {"tag": "Capitalization", "stem": "Which sentence uses capitalization correctly?", "opts": ["We are visiting the Grand Canyon this summer with Uncle Mark.", "We are visiting the grand canyon this summer with Uncle Mark.", "We are visiting the Grand Canyon this Summer with uncle Mark.", "we are visiting the Grand Canyon this summer with Uncle Mark."], "ci": 0, "exp": "'Grand Canyon' is a proper noun naming a specific place, so both words are capitalized. 'Uncle Mark' is capitalized because 'Uncle' is used as part of his name here. 'summer' is a season and is not capitalized."}, {"tag": "Comma Usage in Compound Sentences", "stem": "Which sentence uses a comma correctly?", "opts": ["The rain stopped, so we decided to walk to the park.", "The rain stopped so, we decided to walk to the park.", "The rain stopped so we, decided to walk to the park.", "The rain, stopped so we decided to walk to the park."], "ci": 0, "exp": "When two independent clauses are joined by a coordinating conjunction like 'so', a comma is placed before the conjunction, not after it or in the middle of a clause."}, {"tag": "Linking Verbs", "stem": "Choose the sentence that uses a linking verb correctly.", "opts": ["The soup smells delicious tonight.", "The soup smells deliciously tonight.", "The soup smelling delicious tonight.", "The soup smelled deliciously tonight."], "ci": 0, "exp": "'Smells' is a linking verb here, so it should be followed by an adjective, 'delicious', not an adverb like 'deliciously', to describe the soup itself."}, {"tag": "Comparative and Superlative Adjectives", "stem": "Choose the correct sentence.", "opts": ["This is the most difficult puzzle I have ever solved.", "This is the difficultest puzzle I have ever solved.", "This is the more difficult puzzle I have ever solved.", "This is the most difficultest puzzle I have ever solved."], "ci": 0, "exp": "Longer adjectives like 'difficult' form the superlative with 'most' instead of adding '-est'. 'difficultest' and 'most difficultest' are not standard forms, and 'more difficult' is the comparative, not the superlative, form."}, {"tag": "Prepositions", "stem": "Which sentence uses the preposition correctly?", "opts": ["The cat jumped onto the kitchen counter.", "The cat jumped into the kitchen counter.", "The cat jumped between the kitchen counter.", "The cat jumped among the kitchen counter."], "ci": 0, "exp": "'Onto' correctly shows movement to a surface, which fits a cat jumping up onto a counter. 'Into' suggests entering an enclosed space, and 'between' and 'among' require more than one object being compared."}, {"tag": "Abstract Nouns", "stem": "Which underlined word in the sentence below is an abstract noun?<br>Her <span class=\"ul\">honesty</span> impressed everyone at the meeting.", "opts": ["honesty", "meeting", "everyone", "impressed"], "ci": 0, "exp": "An abstract noun names an idea or quality that cannot be seen or touched. 'Honesty' names a quality, while 'meeting' names an event and 'everyone' is a pronoun."}, {"tag": "Helping Verbs", "stem": "Choose the sentence that uses a helping verb correctly.", "opts": ["They have been practicing the song for weeks.", "They has been practicing the song for weeks.", "They have was practicing the song for weeks.", "They having been practicing the song for weeks."], "ci": 0, "exp": "'They' is plural, so it takes the plural helping verb 'have', not 'has'. The main verb 'been practicing' correctly follows 'have' to form the present perfect progressive."}, {"tag": "Sentence Fragments and Run-ons", "stem": "Which of the following is a complete sentence, not a fragment?", "opts": ["Because the storm knocked out the power, we lit candles.", "Because the storm knocked out the power.", "While we waited for the power to come back on.", "Even though the candles gave off very little light."], "ci": 0, "exp": "'Because the storm knocked out the power, we lit candles.' has both a subordinate clause and an independent clause that completes the thought. The other choices are subordinate clauses left without an independent clause, making them fragments."}, {"tag": "Coordinating Conjunctions", "stem": "Which coordinating conjunction best completes the sentence?<br>I wanted to go to the beach, _____ it started raining.", "opts": ["but", "and", "so", "or"], "ci": 0, "exp": "'but' correctly shows the contrast between wanting to go to the beach and the rain preventing it. 'and' would imply both things happened without contrast, 'so' would incorrectly suggest the rain was a result of wanting to go, and 'or' would suggest a choice between two options."}, {"tag": "Verb Tense Consistency", "stem": "Choose the sentence with consistent verb tense.", "opts": ["Yesterday, she cleaned her room, organized her desk, and folded her laundry.", "Yesterday, she cleaned her room, organizes her desk, and folded her laundry.", "Yesterday, she cleans her room, organized her desk, and folds her laundry.", "Yesterday, she cleaned her room, organizing her desk, and folds her laundry."], "ci": 0, "exp": "Since the sentence begins with 'Yesterday', all three verbs describing completed actions should stay in the past tense: 'cleaned', 'organized', and 'folded'."}, {"tag": "Possessive Nouns", "stem": "Choose the sentence with the correct possessive form.", "opts": ["The children's toys were scattered across the floor.", "The childrens' toys were scattered across the floor.", "The childrens toys were scattered across the floor.", "The children toys' were scattered across the floor."], "ci": 0, "exp": "'Children' is already plural without adding 's', so its possessive form adds an apostrophe and an 's': 'children's'. 'childrens'' and 'childrens' are not correct forms of the plural noun."}, {"tag": "Adjective Order", "stem": "Which sentence puts the adjectives in the correct order?", "opts": ["She bought a beautiful old wooden chair at the market.", "She bought a wooden old beautiful chair at the market.", "She bought an old wooden beautiful chair at the market.", "She bought a wooden beautiful old chair at the market."], "ci": 0, "exp": "In English, adjectives typically follow the order opinion, age, and material, so 'beautiful' (opinion), 'old' (age), and 'wooden' (material) should appear in that order before the noun 'chair'."}, {"tag": "Common and Proper Nouns", "stem": "Which sentence correctly distinguishes a common noun from a proper noun?", "opts": ["My favorite teacher, Mrs. Alvarez, teaches at Lincoln Middle School.", "my favorite teacher, mrs. alvarez, teaches at lincoln middle school.", "My favorite Teacher, Mrs. Alvarez, teaches at Lincoln middle school.", "My favorite teacher, mrs. Alvarez, teaches at Lincoln Middle School."], "ci": 0, "exp": "'teacher' and 'school' are common nouns and stay lowercase unless starting a sentence, while 'Mrs. Alvarez' and 'Lincoln Middle School' are proper nouns naming specific people and places and must be capitalized."}, {"tag": "Compound Predicates", "stem": "Choose the sentence that correctly uses a compound predicate.", "opts": ["The dog barked loudly and chased its tail around the yard.", "The dog barked loudly, and it chased its tail around the yard.", "The dog, barked loudly and chased its tail around the yard.", "The dog barked loudly and, it chased its tail around the yard."], "ci": 0, "exp": "A compound predicate joins two verbs that share the same subject without a comma before the conjunction, so 'barked loudly and chased its tail around the yard' correctly shares the subject 'The dog' without an unnecessary comma."}];

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}
function R(idx,inner){var i=idx?'<span class="radical-index">'+idx+'</span>':'';return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>';}


function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var qs = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

var state = {};
function defaultState(){
  return { cur:0, answers:{}, shuffles:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if(s && typeof s.cur==='number' && s.answers && s.shuffles){ state = s; }
    else { state = defaultState(); }
  }catch(e){ localStorage.removeItem(QUIZ_KEY); state = defaultState(); }
}
function saveState(){ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }

function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k];a[k]=a[j];a[j]=t; }
    state.shuffles[i]=a;
  }
  return state.shuffles[i];
}
function getCSI(i){ return getShuffle(i).indexOf(qs[i].ci); }

function loadAttempts(){ return parseInt(localStorage.getItem(ATT_KEY)||'0',10); }

var timerInterval = null;
function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes = TIMER_DEFAULT_MIN;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function updateNav(){
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if(p.style.display==='none' || !p.style.display){
    p.style.display='block'; b.innerHTML='Hide &#9652;'; renderDots();
  } else {
    p.style.display='none'; b.innerHTML='Jump &#9662;';
  }
}
function renderDots(){
  var p = document.getElementById('dot-panel');
  if(p.style.display==='none' || !p.style.display) return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg = state.answers[i]===undefined ? '#d7dde6' : (state.answers[i]===getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}
function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY, loadAttempts()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();
  if(state.showResults){ renderResults(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  renderTimer();

  var i = state.cur;
  var q = qs[i];
  document.getElementById('q-num').textContent = 'Question ' + (i+1) + ' of ' + qs.length;
  document.getElementById('q-word').innerHTML = q.stem;

  var tagEl = document.getElementById('q-tag-label');
  if(tagEl){
    if(q.tag){
      tagEl.style.display='inline-block';
      tagEl.textContent = q.tag;
      tagEl.style.background = TAG_COLORS[q.tag] || '#1D9E75';
    } else {
      tagEl.style.display='none';
    }
  }

  var bx = document.getElementById('box-ctx');
  if(q.box){ bx.style.display='block'; bx.innerHTML = q.box; }
  else { bx.style.display='none'; }

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi = sh[s];
    var cls='opt-btn';
    var dis='';
    if(ans!==undefined){
      dis='disabled';
      if(s===csi) cls+=' correct';
      else if(s===ans) cls+=' wrong';
    }
    html += '<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if(ans!==undefined && ans!==csi && q.exp){
    eb.style.display='block';
    eb.innerHTML = q.exp;
  } else {
    eb.style.display='none';
  }

  document.getElementById('next-btn').textContent = (i===qs.length-1) ? 'See Results \u2192' : 'Next';
  document.querySelector('.prev-btn').disabled = (i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();

  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined) sk++;
    else if(state.answers[i]===getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';

  var html='';
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var label,bg,tc;
    if(a===undefined){ label='Skipped'; bg='#d7dde6'; tc='#555'; }
    else if(a===getCSI(i)){ label='Correct'; bg='#E1F5EE'; tc='#085041'; }
    else { label='Wrong'; bg='#FCEBEB'; tc='#501313'; }
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    if(plainStem.length>60) plainStem = plainStem.slice(0,60)+'...';
    html += '<div class="results-card" onclick="goToQ('+i+')">'+
            '<span style="font-size:0.92rem;font-weight:600;color:#333;">Q'+(i+1)+'. '+plainStem+'</span>'+
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';white-space:nowrap;">'+label+'</span>'+
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si){
  if(state.answers[qi]!==undefined) return;
  state.answers[qi]=si;
  saveState(); render();
}
function go(dir){
  if(dir===1 && state.cur===qs.length-1){ showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length-1, state.cur+dir));
  saveState(); render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==getCSI(i)){
      if(first===-1) first=i;
      delete state.answers[i];
    }
  }
  state.timerStartedAt=null; state.timerTotalSec=null;
  stopTimerInterval();
  if(first!==-1){ state.cur=first; state.showResults=false; }
  saveState(); render();
}
function copyRes(){
  var lines=[QUIZ_LABEL];
  for(var i=0;i<qs.length;i++){
    var a = state.answers[i];
    var plainStem = qs[i].stem.replace(/<[^>]*>/g,'');
    lines.push('Q'+(i+1)+' '+plainStem+': '+(a===undefined?'Skipped':a===getCSI(i)?'Correct':'Wrong'));
  }
  var txt = lines.join('\n');
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  qs = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState();
  stopTimerInterval();
  closeFreshModal();
  render();
}

window.pick=pick; window.go=go; window.goToQ=goToQ; window.toggleJump=toggleJump;
window.retryWrong=retryWrong; window.copyRes=copyRes; window.showResults=showResults;
window.startTimer=startTimer;
window.openFreshModalOriginal=openFreshModalOriginal; window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal; window.confirmFresh=confirmFresh;


loadState(); saveState(); render();

})();
</script>
</body>
</html>
