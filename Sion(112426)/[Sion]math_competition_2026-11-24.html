<head>

<title>[Sion] Math Competition</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }

  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .nav-summary { display:flex; align-items:center; gap:10px; }
  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }

  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }

  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }

  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }
</style>

<div class="quiz-wrap">

    <div class="q-position" id="q-position"></div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261124";
var RAW_QUESTIONS = [{"stem": "A consumer report revealed the following information about three tubes of toothpaste. Bright is 60% more expensive than Fresh and has 25% less volume than Glow. Glow is 25% less expensive than Bright and has 33⅓% more volume than Fresh. Fresh costs $1.00 per unit of volume. What is the number of cents per unit of volume of Glow? (MathCounts)", "opts": ["90 cents", "80 cents", "75 cents", "96 cents"], "ci": 0, "exp": "<b>What we need:</b> The price per unit of volume of Glow, in cents.<br><br><b>Step 1 (pick easy numbers for Fresh).</b> Say Fresh costs $1.00 and holds 1 unit of volume. Then Fresh costs $1.00 per unit, as the problem says.<br><br><b>Step 2 (price of Bright, then Glow).</b> Bright is 60% more expensive than Fresh: 1.00 × 1.60 = $1.60. Glow is 25% less expensive than Bright: 1.60 × 0.75 = $1.20.<br><br><b>Step 3 (volume of Glow).</b> Glow has 33⅓% more volume than Fresh: 1 × <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span> units.<br><br><b>Step 4 (cost per unit).</b> 1.20 ÷ <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 1.20 × <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span> = 0.90, so Glow costs <b>90 cents</b> per unit of volume.<br><br><b>Answer check:</b> Bright's volume is 25% less than Glow's: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span> × 0.75 = 1 unit, so Bright costs $1.60 per unit — consistent with every fact. Exact fraction arithmetic gives 1.2 ÷ <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>9</span><span style=\"border-top:1.4px solid #111;\">10</span></span>.<br><br><b>Trap:</b> Bright's volume information is not needed. Multiplying Glow's price by 0.80 instead of dividing by <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span> gives 96 cents, and using only the 25% discount gives 75 cents.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "A chess player prepares for a tournament by playing some practice games over a period of eight weeks. She plays at least one game per day, but no more than 11 games per week. Is it true that there is a period of consecutive days during which she plays exactly 23 games? (Zeitz)", "opts": ["false", "true"], "ci": 1, "exp": "<b>What we need:</b> Decide whether some block of consecutive days must contain <i>exactly</i> 23 games, no matter how she spreads her games.<br><br><b>Step 1 (running totals).</b> Let <i>S</i><sub>0</sub> = 0 and let <i>S</i><sub><i>i</i></sub> be the total number of games played in the first <i>i</i> days, for <i>i</i> = 1, 2, …, 56 (eight weeks = 56 days). The games played on days <i>i</i> + 1 through <i>j</i> equal <i>S</i><sub><i>j</i></sub> − <i>S</i><sub><i>i</i></sub>. So we want two totals that differ by exactly 23.<br><br><b>Step 2 (range of the totals).</b> She plays at least one game every day, so the totals strictly increase: 1 ≤ <i>S</i><sub>1</sub> &lt; <i>S</i><sub>2</sub> &lt; … &lt; <i>S</i><sub>56</sub>. She plays at most 11 games per week, so <i>S</i><sub>56</sub> ≤ 8 × 11 = 88.<br><br><b>Step 3 (two lists of numbers).</b> Write down the 56 numbers <i>S</i><sub>1</sub>, …, <i>S</i><sub>56</sub> and the 56 numbers <i>S</i><sub>1</sub> + 23, …, <i>S</i><sub>56</sub> + 23. That is 112 numbers, and every one of them is between 1 and 88 + 23 = 111.<br><br><b>Step 4 (Pigeonhole).</b> 112 numbers can take at most 111 different values, so two of them are equal. Two numbers from the first list cannot be equal (the totals strictly increase), and the same is true for the second list. So some <i>S</i><sub><i>j</i></sub> equals some <i>S</i><sub><i>i</i></sub> + 23, which means <i>S</i><sub><i>j</i></sub> − <i>S</i><sub><i>i</i></sub> = 23 with <i>j</i> &gt; <i>i</i>: on days <i>i</i> + 1 through <i>j</i> she played exactly 23 games. The statement is <b>true</b>.<br><br><b>Answer check:</b> The count only works because 2 × 56 = 112 is bigger than 111. A computer test of 5,000 random schedules that follow the rules (at least 1 game a day, at most 11 a week) found a 23-game stretch every time.<br><br><b>Trap:</b> Saying “false” because she could skip around the number 23 — the rule of at least one game every day is exactly what makes the totals all different, so the Pigeonhole argument cannot be avoided.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>What is the remainder when <i>x</i><sup>44</sup> + <i>x</i><sup>33</sup> + <i>x</i><sup>22</sup> + <i>x</i><sup>11</sup> + 1 is divided by <i>x</i><sup>4</sup> + <i>x</i><sup>3</sup> + <i>x</i><sup>2</sup> + <i>x</i> + 1? (PMO)", "opts": ["5", "0", "<i>x</i> + 1", "1"], "ci": 1, "exp": "<b>What we need</b><br>The remainder when <i>P</i>(<i>x</i>) = <i>x</i><sup>44</sup> + <i>x</i><sup>33</sup> + <i>x</i><sup>22</sup> + <i>x</i><sup>11</sup> + 1 is divided by <i>D</i>(<i>x</i>) = <i>x</i><sup>4</sup> + <i>x</i><sup>3</sup> + <i>x</i><sup>2</sup> + <i>x</i> + 1.<br><br><b>Step 1: A key fact about the divisor.</b> (<i>x</i> &minus; 1)(<i>x</i><sup>4</sup> + <i>x</i><sup>3</sup> + <i>x</i><sup>2</sup> + <i>x</i> + 1) = <i>x</i><sup>5</sup> &minus; 1. So every root <i>w</i> of <i>D</i>(<i>x</i>) satisfies <i>w</i><sup>5</sup> = 1 (and <i>w</i> &ne; 1). The divisor has 4 different roots.<br><br><b>Step 2: Reduce the powers.</b> Since <i>w</i><sup>5</sup> = 1, only the remainder of the exponent when divided by 5 matters:<br>44 = 5 &times; 8 + 4, so <i>w</i><sup>44</sup> = <i>w</i><sup>4</sup>;<br>33 = 5 &times; 6 + 3, so <i>w</i><sup>33</sup> = <i>w</i><sup>3</sup>;<br>22 = 5 &times; 4 + 2, so <i>w</i><sup>22</sup> = <i>w</i><sup>2</sup>;<br>11 = 5 &times; 2 + 1, so <i>w</i><sup>11</sup> = <i>w</i>.<br><br><b>Step 3: Plug in a root.</b> <i>P</i>(<i>w</i>) = <i>w</i><sup>4</sup> + <i>w</i><sup>3</sup> + <i>w</i><sup>2</sup> + <i>w</i> + 1 = <i>D</i>(<i>w</i>) = 0.<br><br><b>Step 4: Why that means the remainder is 0.</b> Write <i>P</i>(<i>x</i>) = <i>D</i>(<i>x</i>)&middot;<i>Q</i>(<i>x</i>) + <i>R</i>(<i>x</i>), where <i>R</i> has degree at most 3. At each of the 4 roots, <i>D</i> = 0 and <i>P</i> = 0, so <i>R</i> = 0 there too. A polynomial of degree at most 3 with 4 different roots must be the zero polynomial. So the remainder is <b>0</b>.<br><br><b>Answer check</b><br>Another way: <i>x</i><sup>5</sup> &minus; 1 divides <i>x</i><sup>40</sup> &minus; 1, <i>x</i><sup>30</sup> &minus; 1, <i>x</i><sup>20</sup> &minus; 1, and <i>x</i><sup>10</sup> &minus; 1, so <i>P</i>(<i>x</i>) &minus; <i>D</i>(<i>x</i>) = <i>x</i><sup>4</sup>(<i>x</i><sup>40</sup> &minus; 1) + <i>x</i><sup>3</sup>(<i>x</i><sup>30</sup> &minus; 1) + <i>x</i><sup>2</sup>(<i>x</i><sup>20</sup> &minus; 1) + <i>x</i>(<i>x</i><sup>10</sup> &minus; 1) is a multiple of <i>D</i>(<i>x</i>). Then <i>P</i> is a multiple of <i>D</i> too. A computer polynomial division also gives remainder 0.<br><br><b>Trap</b><br>The choice 5 comes from plugging in <i>x</i> = 1 (which is <b>not</b> a root of the divisor). The choice 1 comes from keeping only the constant term.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>If for three distinct positive numbers <i>x</i>, <i>y</i>, and <i>z</i>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i>&minus;<i>z</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i>+<i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>z</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>, then find the numerical value of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>. (AHSME)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "2", "3"], "ci": 2, "exp": "<b>What we need</b><br>The three fractions <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i>&minus;<i>z</i></span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i>+<i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>z</i></span></span>, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> are all equal. Find the value of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>.<br><br><b>Step 1: Call the common value <i>k</i>.</b> Then <i>y</i> = <i>k</i>(<i>x</i> &minus; <i>z</i>), <i>x</i> + <i>y</i> = <i>k</i><i>z</i>, and <i>x</i> = <i>k</i><i>y</i>.<br><br><b>Step 2: Add the three equations.</b> Left sides: <i>y</i> + (<i>x</i> + <i>y</i>) + <i>x</i> = 2<i>x</i> + 2<i>y</i>. Right sides: <i>k</i>(<i>x</i> &minus; <i>z</i>) + <i>k</i><i>z</i> + <i>k</i><i>y</i> = <i>k</i>(<i>x</i> + <i>y</i>), because &minus;<i>k</i><i>z</i> and +<i>k</i><i>z</i> cancel.<br><br><b>Step 3: Solve for <i>k</i>.</b> 2(<i>x</i> + <i>y</i>) = <i>k</i>(<i>x</i> + <i>y</i>). Since <i>x</i> and <i>y</i> are positive, <i>x</i> + <i>y</i> &ne; 0, so we may divide: <i>k</i> = 2. Therefore <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = 2.<br><br><b>Answer check</b><br>Take <i>y</i> = 2. Then <i>x</i> = 4 (so <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span> = 2). From <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i>&minus;<i>z</i></span></span> = 2 we get <i>x</i> &minus; <i>z</i> = 1, so <i>z</i> = 3. Check: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">4&minus;3</span></span> = 2, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4+2</span><span style=\"border-top:1.4px solid #111;\">3</span></span> = 2, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">2</span></span> = 2. The numbers 4, 2, 3 are distinct and positive, as required.<br><br><b>Trap</b><br><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>y</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i></span></span>, the upside-down ratio. Read carefully which ratio the question asks for.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>You have 8 cubes of size 1 through 8. A tower is to be built using all 8 cubes according to the following rules: <i>a</i>) Any cube may be the bottom cube in the tower. <i>b</i>) The cube immediately on top of a cube with size <i>k</i> must have size at most <i>k</i> + 2. How many different towers can be constructed?", "opts": ["972", "1458", "1512", "1440"], "ci": 1, "exp": "<b>What we need:</b> the number of orders (bottom to top) of cubes 1, 2, …, 8 in which the cube directly on top of cube <i>k</i> always has size at most <i>k</i> + 2.<br><br><b>Step 1 — Build the tower by adding the largest cube last.</b> Let <i>T</i>(<i>n</i>) be the number of good towers that use cubes 1 through <i>n</i>. Take any good tower of cubes 1 through <i>n</i> and lift out cube <i>n</i> (the biggest). The cube that was above it drops onto the cube that was below it. The cube above was smaller than <i>n</i>, and the cube below was at least <i>n</i> &minus; 2. So the new jump is at most (<i>n</i> &minus; 1) &minus; (<i>n</i> &minus; 2) = 1, which is allowed. That means every good tower of 1…<i>n</i> comes from a good tower of 1…(<i>n</i> &minus; 1) by inserting cube <i>n</i>.<br><br><b>Step 2 — Where can cube <i>n</i> be inserted?</b> Cube <i>n</i> may sit directly on top of a cube of size at least <i>n</i> &minus; 2, so only on cube <i>n</i> &minus; 1 or cube <i>n</i> &minus; 2. It may also be the bottom cube (rule a). Anything placed on top of cube <i>n</i> is smaller, so that is always fine. So for <i>n</i> ≥ 3 there are exactly <b>3</b> places, and each gives a different tower: <i>T</i>(<i>n</i>) = 3 · <i>T</i>(<i>n</i> &minus; 1).<br><br><b>Step 3 — Starting values.</b> <i>T</i>(1) = 1. With cubes 1 and 2, both orders work, so <i>T</i>(2) = 2.<br><br><b>Step 4 — Multiply.</b> <i>T</i>(3) = 6, <i>T</i>(4) = 18, <i>T</i>(5) = 54, <i>T</i>(6) = 162, <i>T</i>(7) = 486, <i>T</i>(8) = 1458. In one line: 2 × 3<sup>6</sup> = 2 × 729 = 1458.<br><br><b>Answer check:</b> a computer check of all 8! = 40320 orders finds exactly 1458 good towers. Also <i>T</i>(3) = 6 = 3! makes sense: with cubes 1, 2, 3 no jump is bigger than 2, so every order works.<br><br><b>Trap:</b> 972 = 4 × 3<sup>5</sup> comes from starting the chain with the wrong value (4 towers for three cubes). Remember that being the bottom cube is always allowed.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>In which row of Pascal's triangle do three consecutive entries occur that are in the ratio 3:4:5?", "opts": ["60", "62", "64", "58"], "ci": 1, "exp": "<b>What we need</b><br>Find the row <i>n</i> of Pascal&rsquo;s triangle (the top row is row 0) that has three entries next to each other in the ratio 3 : 4 : 5. Call them <i>C</i>(<i>n</i>, <i>k</i>), <i>C</i>(<i>n</i>, <i>k</i> + 1), <i>C</i>(<i>n</i>, <i>k</i> + 2).<br><br><b>Step 1: Ratio of neighbors.</b> For entries next to each other,<br><i>C</i>(<i>n</i>, <i>k</i> + 1) &divide; <i>C</i>(<i>n</i>, <i>k</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>n</i> &minus; <i>k</i></span><span style=\"border-top:1.4px solid #111;\"><i>k</i> + 1</span></span>.<br>(Going from <i>k</i> to <i>k</i> + 1 multiplies by <i>n</i> &minus; <i>k</i> and divides by <i>k</i> + 1.)<br><br><b>Step 2: First pair, 3 : 4.</b> <i>C</i>(<i>n</i>, <i>k</i>) : <i>C</i>(<i>n</i>, <i>k</i> + 1) = 3 : 4 means <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i> + 1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i> &minus; <i>k</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>.<br>Cross-multiply: 4(<i>k</i> + 1) = 3(<i>n</i> &minus; <i>k</i>), so 4<i>k</i> + 4 = 3<i>n</i> &minus; 3<i>k</i>, which gives <b>7<i>k</i> = 3<i>n</i> &minus; 4</b>.<br><br><b>Step 3: Second pair, 4 : 5.</b> <i>C</i>(<i>n</i>, <i>k</i> + 1) : <i>C</i>(<i>n</i>, <i>k</i> + 2) = 4 : 5 means <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>k</i> + 2</span><span style=\"border-top:1.4px solid #111;\"><i>n</i> &minus; <i>k</i> &minus; 1</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">5</span></span>.<br>Cross-multiply: 5(<i>k</i> + 2) = 4(<i>n</i> &minus; <i>k</i> &minus; 1), so 5<i>k</i> + 10 = 4<i>n</i> &minus; 4<i>k</i> &minus; 4, which gives <b>9<i>k</i> = 4<i>n</i> &minus; 14</b>.<br><br><b>Step 4: Solve the two equations.</b> Multiply the first by 4 and the second by 3:<br>28<i>k</i> = 12<i>n</i> &minus; 16 and 27<i>k</i> = 12<i>n</i> &minus; 42.<br>Subtract: <i>k</i> = 26. Then 3<i>n</i> = 7 &times; 26 + 4 = 186, so <i>n</i> = 62.<br><br><b>Answer check</b><br><i>C</i>(62, 27) &divide; <i>C</i>(62, 26) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>36</span><span style=\"border-top:1.4px solid #111;\">27</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">3</span></span> and <i>C</i>(62, 28) &divide; <i>C</i>(62, 27) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>35</span><span style=\"border-top:1.4px solid #111;\">28</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">4</span></span>. So the three entries are in the ratio 3 : 4 : 5 (a computer check with the exact binomial numbers agrees). The row is <b>62</b>.<br><br><b>Trap</b><br>If you forget that the top row is row 0, or mix up <i>n</i> &minus; <i>k</i> with <i>n</i> &minus; <i>k</i> &minus; 1 in the second ratio, you land on a nearby even number such as 60 or 64.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
