var TITLE = "[Sion] SAT English";
var QUIZ_KEY = "sionsatenglish_10";
var INSTRUCTION = "Read each text carefully and choose the best answer. Use the timer to practice real SAT pacing.";
var TODAY_STR = "20261124";
var RAW_QUESTIONS = [{"stem": "Which choice best uses data from the table to support the student&rsquo;s claim?", "opts": ["Neighborhood D has the most garden plots per 1,000 residents, and Neighborhood A has the fewest.", "Neighborhood C has more garden plots per 1,000 residents than Neighborhood A and a higher percentage of residents who eat vegetables daily, but Neighborhood D, which has the most plots, has a lower percentage than Neighborhood C.", "Neighborhood B has 5 garden plots per 1,000 residents, and 38% of its residents eat vegetables daily.", "The percentage of residents who eat vegetables daily rises from Neighborhood A to Neighborhood B to Neighborhood C."], "exp": "<b>What it asks:</b> data that show <i>both</i> parts of the claim &mdash; a general upward pattern <i>and</i> an exception.<br><br><b>Why the answer is right:</b> A (2 plots, 31%) vs. C (9 plots, 46%) shows the general trend; D (12 plots, 44%) is below C (46%) even though D has more plots, showing the pattern &ldquo;does not hold perfectly.&rdquo;<br><br><b>Why the others fail:</b><br>&bull; <i>D has the most plots, A the fewest</i> &mdash; describes only one column; says nothing about vegetables.<br>&bull; <i>Rises from A to B to C</i> &mdash; supports the trend but leaves out the exception, so it supports only half the claim.<br>&bull; <i>B has 5 plots and 38%</i> &mdash; a single data point cannot show any relationship.<br><br><b>Strategy:</b> When a claim has two parts joined by <i>but</i>, the correct choice must cite data for both parts.", "tag": "Information and Ideas", "tagcolor": "#185FA5", "passage": "A student surveyed four neighborhoods in her city (hypothetical data).<br><br><table style='border-collapse:collapse;font-size:0.9rem;margin:4px 0'><tr><th style='border:1px solid #bbb;padding:3px 8px'>Neighborhood</th><th style='border:1px solid #bbb;padding:3px 8px'>Garden plots per 1,000 residents</th><th style='border:1px solid #bbb;padding:3px 8px'>Residents who eat vegetables daily</th></tr><tr><td style='border:1px solid #bbb;padding:3px 8px'>A</td><td style='border:1px solid #bbb;padding:3px 8px'>2</td><td style='border:1px solid #bbb;padding:3px 8px'>31%</td></tr><tr><td style='border:1px solid #bbb;padding:3px 8px'>B</td><td style='border:1px solid #bbb;padding:3px 8px'>5</td><td style='border:1px solid #bbb;padding:3px 8px'>38%</td></tr><tr><td style='border:1px solid #bbb;padding:3px 8px'>C</td><td style='border:1px solid #bbb;padding:3px 8px'>9</td><td style='border:1px solid #bbb;padding:3px 8px'>46%</td></tr><tr><td style='border:1px solid #bbb;padding:3px 8px'>D</td><td style='border:1px solid #bbb;padding:3px 8px'>12</td><td style='border:1px solid #bbb;padding:3px 8px'>44%</td></tr></table><br>The student claims that neighborhoods with more garden plots per 1,000 residents generally have a higher percentage of residents who eat vegetables daily, but that the pattern does not hold perfectly.", "ci": 1}, {"stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["ameliorate", "commemorate", "exacerbate", "replicate"], "exp": "<b>What it asks:</b> the word that fits what the trees were supposed to do to the heat.<br><br><b>Why the answer is right:</b> The second half says the plan worked because sidewalks became <i>cooler</i>. The planners wanted to make the heat less severe. <i>Ameliorate</i> means to make a bad situation better or less harsh.<br><br><b>Why the others fail:</b><br>&bull; <i>exacerbate</i> (make worse) &mdash; the exact opposite of what the measurements show; this is the classic SAT reversal trap.<br>&bull; <i>commemorate</i> (honor the memory of) &mdash; no one is honoring the heat.<br>&bull; <i>replicate</i> (copy or reproduce) &mdash; the trees are not meant to produce the same heat again.<br><br><b>Strategy:</b> Use the result clause (&ldquo;they were right: … cooler&rdquo;) to fix the direction of the missing word before looking at choices.", "tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "City planners hoped that planting thousands of street trees would &#x5F;&#x5F;&#x5F;&#x5F;&#x5F;&#x5F; the summer heat in neighborhoods with little shade, and early measurements suggest they were right: on the hottest afternoons, shaded sidewalks are now several degrees cooler than before.", "ci": 0}, {"stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It describes the method researchers used to measure octopus intelligence.", "It presents observations that challenge the assumption described in the previous sentence.", "It explains why the biologists’ original assumption was reasonable at the time.", "It offers a conclusion that the final sentence then calls into question."], "exp": "<b>What it asks:</b> the job the underlined sentence does in the paragraph.<br><br><b>Why the answer is right:</b> Sentence 1 states an assumption (octopuses are solitary, so little social behavior). The underlined sentence begins with <i>Yet</i> and reports divers seeing octopuses living and signaling together &mdash; evidence that cuts against that assumption. The last sentence then draws the new conclusion.<br><br><b>Why the others fail:</b><br>&bull; <i>Explains why the assumption was reasonable</i> &mdash; it does the opposite; it undermines the assumption.<br>&bull; <i>Describes a method to measure intelligence</i> &mdash; the sentence reports observations of behavior, not a measurement method, and intelligence is never mentioned.<br>&bull; <i>A conclusion the final sentence questions</i> &mdash; the final sentence builds on the observations; it does not dispute them.<br><br><b>Strategy:</b> Contrast words like <i>Yet</i> or <i>However</i> at the start of a sentence usually signal a counterexample or challenge to what came before.", "tag": "Craft and Structure", "tagcolor": "#E24B4A", "passage": "For decades, many biologists assumed that octopuses, as mostly solitary animals, had little reason to develop complex social behavior. <u>Yet divers off the coast of Australia have described sites where many octopuses live close together, sharing dens and appearing to signal to one another with changes in color and posture.</u> Such observations have led some researchers to suggest that octopus social behavior may be more flexible than once believed.", "ci": 1}, {"passage": "Many visitors assume that a midday hike will leave them energized, but park rangers warn that the relentless desert sun tends to ______ even experienced hikers, leaving them sluggish, dehydrated, and prone to poor decisions.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which choice completes the text with the most logical and precise word or phrase?", "opts": ["enervate", "acclimate", "embolden", "exhilarate"], "ci": 0, "exp": "<b>Clue:</b> <i>but</i> contrasts with &ldquo;energized,&rdquo; and the effect is described: hikers become &ldquo;sluggish, dehydrated, and prone to poor decisions.&rdquo; The blank needs a word meaning &ldquo;drain of energy.&rdquo; <i>Enervate</i> means to weaken or exhaust.<br><br><b>Why the others fail:</b> <i>exhilarate</i> (to make excited and lively) and <i>embolden</i> (to make braver) are the opposite of sluggish; <i>acclimate</i> means to get used to a new climate, which would make hikers <i>better</i> able to handle the heat, not worse.<br><br><b>Vocabulary:</b> enervate (v.) &mdash; to weaken, to drain energy. Watch out: it sounds like &ldquo;energize,&rdquo; but it means nearly the opposite. Related: enervating (adj.). Example: <i>The long, humid afternoon was <b>enervating</b>.</i><br><br><b>Strategy:</b> when a word looks familiar, check it against the sentence&rsquo;s clues instead of trusting how it sounds.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"stem": "The student wants to emphasize the difference in main-span length between the two bridges. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["The Brooklyn Bridge and the Golden Gate Bridge are both suspension bridges.", "The Golden Gate Bridge, a suspension bridge, opened in 1937 with a main span of about 1,280 meters.", "The main span of the Golden Gate Bridge (about 1,280 meters) is more than twice as long as that of the Brooklyn Bridge (about 486 meters).", "The Brooklyn Bridge opened in 1883, more than fifty years before the Golden Gate Bridge opened in 1937."], "exp": "<b>What it asks:</b> a sentence that shows a <i>difference</i> in <i>main-span length</i>.<br><br><b>Why the answer is right:</b> It gives both lengths and compares them directly (1,280 &divide; 486 &asymp; 2.6, so &ldquo;more than twice&rdquo; is accurate).<br><br><b>Why the others fail:</b><br>&bull; <i>Both are suspension bridges</i> &mdash; a similarity, not a difference, and no lengths.<br>&bull; <i>Opening years</i> &mdash; a difference, but in dates rather than length.<br>&bull; <i>Golden Gate only</i> &mdash; gives one length with nothing to compare it to.<br><br><b>Strategy:</b> Underline the goal&rsquo;s key words (&ldquo;difference,&rdquo; &ldquo;main-span length&rdquo;) and eliminate any choice missing either one.", "tag": "Expression of Ideas", "tagcolor": "#f5a623", "passage": "While researching a topic, a student has taken the following notes:<br>&bull; The Brooklyn Bridge opened in 1883.<br>&bull; Its main span is about 486 meters long.<br>&bull; The Golden Gate Bridge opened in 1937.<br>&bull; Its main span is about 1,280 meters long.<br>&bull; Both are suspension bridges.", "ci": 2}, {"stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "Moreover,", "Consequently,", "In contrast,"], "exp": "<b>What it asks:</b> how the second sentence relates to the first.<br><br><b>Why the answer is right:</b> Sentence 1 gives one see-through feature; sentence 2 adds a second, even stronger one (hiding red blood cells while sleeping). Adding a related point calls for <i>Moreover</i>.<br><br><b>Why the others fail:</b><br>&bull; <i>Nevertheless</i> &mdash; signals something surprising despite the first point; the second fact agrees with it.<br>&bull; <i>In contrast</i> &mdash; the two facts point the same way (transparency), not opposite ways.<br>&bull; <i>Consequently</i> &mdash; transparent skin does not cause the frog to store blood cells in its liver.<br><br><b>Strategy:</b> Label the relationship (add / contrast / cause / example) in your own words, then pick the transition with that label.", "tag": "Expression of Ideas", "tagcolor": "#f5a623", "passage": "Glass frogs have transparent skin on their undersides, which lets observers see the frogs&rsquo; beating hearts. &#x5F;&#x5F;&#x5F;&#x5F;&#x5F;&#x5F; when a glass frog sleeps, it pulls most of its red blood cells out of circulation and stores them in its liver, making its body even harder to see.", "ci": 1}, {"stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "are being", "have", "has"], "exp": "<b>What it asks:</b> a verb that agrees with the subject and fits the time frame.<br><br><b>Why the answer is right:</b> The subject is <i>committee</i> (singular); <i>of volunteers who organize the annual river cleanup</i> is a long modifier in between. A singular subject takes <i>has</i>. The later phrase <i>its best total</i> also treats the committee as one unit.<br><br><b>Why the others fail:</b><br>&bull; <i>have</i> &mdash; agrees with the nearby plural <i>volunteers</i>, the classic interrupter trap.<br>&bull; <i>were</i> &mdash; plural, and <i>were collected</i> would make the committee the thing collected.<br>&bull; <i>are being</i> &mdash; plural and passive; it does not make sense with <i>already collected</i>.<br><br><b>Strategy:</b> Cross out prepositional phrases and <i>who</i> clauses to find the true subject.", "tag": "Standard English Conventions", "tagcolor": "#1D9E75", "passage": "The committee of volunteers who organize the annual river cleanup &#x5F;&#x5F;&#x5F;&#x5F;&#x5F;&#x5F; already collected more than two tons of trash this season, its best total in a decade.", "ci": 3}, {"stem": "Which choice most logically completes the text?", "opts": ["hawks rarely hunt voles in fields where the grass has been mowed.", "voles cross open strips only when food is scarce on their own side.", "voles do not recognize hawks as a threat to their safety.", "the voles&rsquo; avoidance of open strips does not depend on whether hawks are currently present nearby."], "exp": "<b>What it asks:</b> the conclusion that the experiment&rsquo;s result supports &mdash; no more and no less.<br><br><b>Why the answer is right:</b> The only thing that differed between the two kinds of fields was whether hawks were nearby. Crossing rates were the same in both, so the presence of hawks <i>right now</i> did not change the behavior. The avoidance must come from something else (for example, an inborn caution or past experience).<br><br><b>Why the others fail:</b><br>&bull; <i>Voles do not recognize hawks as a threat</i> &mdash; too strong. The voles may still fear hawks in general; the result shows only that local hawk presence did not change crossing.<br>&bull; <i>Hawks rarely hunt in mowed fields</i> &mdash; the study measured vole behavior, not hawk hunting.<br>&bull; <i>Cross only when food is scarce</i> &mdash; food was plentiful on both sides and was not varied, so the study cannot speak to scarcity.<br><br><b>Strategy:</b> For experiment inferences, ask &ldquo;What one thing was changed, and did the outcome change?&rdquo; The safest answer states exactly that, without adding new claims.", "tag": "Information and Ideas", "tagcolor": "#185FA5", "passage": "Meadow voles living in tall-grass fields rarely cross mowed strips of open ground, even when food is plentiful on the other side. Ecologists often explain this as a response to hawks, which can easily spot voles in the open. In a hypothetical experiment, researchers placed identical food trays on both sides of mowed strips in two kinds of fields: fields with hawks nesting nearby and fields with no hawks within several kilometers. Voles in both kinds of fields crossed the strips at similarly low rates, which suggests that &#x5F;&#x5F;&#x5F;&#x5F;&#x5F;&#x5F;", "ci": 3}, {"passage": "Stretching roughly 7,000 kilometers along the western edge of South ______ the longest continental mountain range in the world.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["America; the Andes are", "America the Andes, are", "America. The Andes are", "America, the Andes are"], "ci": 3, "exp": "<b>What it asks:</b> how to connect an introductory phrase to the main clause.<br><br><b>Analysis:</b> &ldquo;Stretching roughly 7,000 kilometers along the western edge of South America&rdquo; is a participial phrase, not a complete sentence. It must attach to the main clause with a comma: <i>&hellip; South America, the Andes are the longest continental mountain range in the world.</i><br><br><b>Why the others fail:</b> a semicolon or a period would cut off the opening phrase as if it were a full sentence, leaving a fragment; the last choice drops the needed comma after <i>America</i> and wrongly separates the subject <i>the Andes</i> from its verb <i>are</i> with a comma.<br><br><b>Strategy:</b> semicolons and periods need a complete sentence on <b>both</b> sides. Test the left side &mdash; an <i>-ing</i> phrase alone is never compl isplay:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;border-radius:6px;padding:1px 7px;font-size:0.78rem;font-weight:700;margin-bottom:6px;\">Review &middot; missed last time</span><br>Which choice most logically completes the text?", "opts": ["people living in the settlement probably cleared the forest with fire to make room for crops.", "the lake probably filled with more mud than usual about 1,000 years ago, hiding the tree pollen.", "natural wildfires probably became much more frequent in the region about 1,000 years ago.", "a long drought about 1,000 years ago probably caused the trees around the lake to die off."], "ci": 0, "exp": "<b>What the question asks:</b> the conclusion that best fits <i>all</i> the evidence.<br><br><b>Reasoning:</b> three clues point the same way: trees decline, <i>cereal crops</i> rise, and the charcoal is unusually thick. The last sentence rules out ordinary wildfires, which leave thin charcoal and are followed by regrowth. Crops plus heavy burning near a settlement suggest people cleared the land with fire to farm it.<br><br><b>Why the others fail:</b> a drought does not explain the rise in cereal crops or the thick charcoal; the text gives no evidence about extra mud, and grass pollen <i>rose</i>, so pollen was clearly still being preserved; the text says natural fires leave <i>thin</i> layers and forests regrow, so more natural fires do not match the thick charcoal and the lasting change.<br><br><b>Strategy:</b> an inference answer must explain every clue &mdash; check each choice against each piece of evidence.", "tag": "Information and Ideas", "tagcolor": "#185FA5"}, {"passage": "Although the travel writer admitted that the hotel&rsquo;s rooms were cramped and its elevator unreliable, she went on to ______ its rooftop garden, describing it as the most peaceful spot she had found anywhere in the city.", "stem": "<span style=\"display:inline-block;background:#fff4e0;color:#a5720a;border:1px solid #f5a623;b var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ if(window.SAT_TIMEUP && SAT_TIMEUP() && !(activeSet && activeSet.length)){ wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, "(time's up)")); } else skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

    var q = RAW_QUESTIONS[qi];

    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
</body>
</html>
