<script>
var TITLE = "[Sion] Advanced SAT Reading";
var QUIZ_KEY = "sionadvreading";
var INSTRUCTION = "Read each passage and choose the best answer.";
var TODAY_STR = "20260926";
var RAW_QUESTIONS = [
{"passage": "The committee was not created to write new regulations. Its purpose was narrower: to discharge the duties that the city's original charter had assigned to it, a responsibility its members carried out with scrupulous care for more than two decades.", "stem": "As used in the text, what does the word &ldquo;discharge&rdquo; most nearly mean?", "opts": ["fulfill", "release", "dismiss", "unload"], "ci": 0, "exp": "The committee's purpose was to carry out the duties assigned to it, which the text confirms by saying the members &ldquo;carried out&rdquo; that responsibility. In this context, &ldquo;discharge&rdquo; means to fulfill a duty, not to release, dismiss, or unload something.", "tag": "Words in Context", "tagcolor": "#7b61ff"},
{"passage": "When caterpillars chew the leaves of a tomato plant, the plant releases airborne chemicals, and nearby undamaged tomato plants that are exposed to those chemicals begin producing compounds that make their leaves harder to digest. To learn more, researchers placed damaged and undamaged plants in shared pots so that their roots grew in the same soil, but they separated the plants' leaves with a sealed glass barrier. The undamaged plants did not increase their defenses. These results suggest that ____", "stem": "Which choice most logically completes the text?", "opts": ["tomato plants cannot produce defensive compounds unless caterpillars chew their own leaves.", "the signal that prompts neighboring plants to raise their defenses travels through the air rather than through the soil.", "glass barriers damage tomato plants in ways that prevent them from producing defensive compounds.", "sharing soil makes tomato plants less able to detect caterpillar damage on their neighbors."], "ci": 1, "exp": "The roots still shared soil, yet blocking the air between the leaves stopped the neighbors' response. That points to an airborne signal, not a soil-based one. The text already states that undamaged plants can raise defenses when exposed to the chemicals, so the first choice is contradicted, and nothing suggests the glass harmed the plants.", "tag": "Inferences", "tagcolor": "#f5a623"},
{"passage": "<strong>Text 1</strong><br>Because feathers are so well suited to flight, many early paleontologists concluded that feathers evolved in the ancestors of birds specifically as adaptations for flying. On this view, the first feathers would have appeared only once animals had begun to glide or flap between trees.<br><br><strong>Text 2</strong><br>Fossils uncovered in northeastern China over the past three decades have revealed dozens of dinosaur species covered in simple, filament-like feathers. Many of these animals were large, ground-dwelling, and built in ways that would have made flight impossible. Paleontologist Xu Mei argues that such feathers most likely served first for insulation or display and were only later adapted for flight.", "stem": "Based on the texts, how would Xu Mei (Text 2) most likely respond to the conclusion presented in Text 1?", "opts": ["She would agree with it, since the feathered dinosaurs she describes were all capable of gliding between trees.", "She would argue that it mistakes a later use of feathers for their original purpose, since feathers appear in animals that could not fly.", "She would argue that it underestimates how well suited feathers are to flight.", "She would reject it on the grounds that feathers never became useful for flight at all."], "ci": 1, "exp": "Text 1 claims feathers evolved for flight. Xu Mei points to feathered animals that could not fly and argues feathers served first for insulation or display and were &ldquo;only later adapted for flight.&rdquo; So she would say Text 1 confuses a later function with the original one. She does not deny that feathers became useful for flight, and the animals she describes were ground-dwelling, not gliders.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"},
{"passage": "When the novel first appeared, several critics dismissed its spare, unadorned prose as ____, complaining that the author seemed unable to describe anything in detail. Later readers came to see that restraint as deliberate: each omission forces the reader to supply what the characters themselves cannot bring themselves to say.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["extravagant", "ornate", "digressive", "impoverished"], "ci": 3, "exp": "The critics thought the plain prose showed an inability to describe things in detail, so they saw it as lacking richness: &ldquo;impoverished.&rdquo; &ldquo;Extravagant&rdquo; and &ldquo;ornate&rdquo; describe overly elaborate writing, the opposite of spare prose, and &ldquo;digressive&rdquo; means wandering off topic, which the critics did not complain about.", "tag": "Words in Context", "tagcolor": "#7b61ff"},
{"passage": "Historian Lena Ortiz argues that mail-order catalogs of the 1920s played a major role in spreading city fashions to rural America. Before these catalogs became common, she notes, most rural families made their own clothing or bought it from local tailors whose styles changed slowly.", "stem": "Which finding, if true, would most directly support Ortiz's argument?", "opts": ["Most pages in 1920s mail-order catalogs advertised farm equipment rather than clothing.", "City department stores in the 1920s often sold the same styles that appeared in mail-order catalogs.", "Rural families in the 1920s continued to prefer clothing made by local tailors over catalog clothing.", "Photographs of rural residents from the late 1920s show clothing styles that first appeared in mail-order catalogs a year or two earlier and are rarely seen in rural photographs taken before those catalog editions."], "ci": 3, "exp": "Ortiz claims catalogs carried city fashions to rural areas. Evidence that catalog styles showed up in rural photos shortly after appearing in catalogs, and not before, directly links the catalogs to the spread. The fact that catalogs focused on farm tools or that rural families preferred local tailors would weaken the claim, and city stores are irrelevant to rural spread.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"},
{"passage": "For decades, researchers assumed that honeybees perform the &ldquo;waggle dance,&rdquo; which tells nestmates the direction and distance of food, entirely by instinct. In a 2023 experiment, however, bees raised without any chance to watch experienced dancers produced dances with noticeably larger errors in angle and distance. These errors shrank as the bees gained foraging experience but never fully disappeared. The researchers concluded that the dance is an inborn behavior that social learning helps refine.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It presents a long-held assumption, reports evidence that complicates it, and then offers a revised view.", "It describes a behavior, explains why it is difficult to study, and then calls for new research methods.", "It compares two competing explanations and argues that both are equally supported by the evidence.", "It summarizes an experiment and then argues that its results were caused by errors in measurement."], "ci": 0, "exp": "The text opens with what researchers &ldquo;assumed&rdquo; (the dance is purely instinctive), then describes the 2023 experiment that challenges this, and ends with a revised conclusion that the dance is inborn but refined by social learning.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"},
{"passage": "The following text is from a short story.<br><br>Tomas had rehearsed the apology during the entire walk over, trimming each sentence until nothing in it could be mistaken for an excuse. But when his grandmother opened the door, flour dusting her hands and the radio murmuring in the kitchen behind her, the words dissolved. He held out the cracked teapot instead, as though it might explain itself.", "stem": "The text mainly portrays Tomas as someone who", "opts": ["has prepared carefully for a difficult conversation but finds himself unable to carry it out.", "resents having to apologize for something he does not believe was his fault.", "is confident that his grandmother has already forgiven him.", "cares more about repairing the teapot than about his relationship with his grandmother."], "ci": 0, "exp": "Tomas &ldquo;rehearsed the apology&rdquo; and polished every sentence, yet when the moment arrives &ldquo;the words dissolved,&rdquo; and he simply holds out the teapot. The text shows careful preparation followed by an inability to speak. Nothing suggests resentment, confidence that he is forgiven, or more concern for the teapot than for his grandmother.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"},
{"passage": "In 1847, astronomer Maria Mitchell spotted a faint comet through a telescope on the roof of her family's home in Nantucket, Massachusetts. The discovery won her a gold medal from the king of Denmark and made her famous almost overnight. Within a year she became the first woman elected to the American Academy of Arts and Sciences, and in 1865 she was hired as a professor at the newly founded Vassar College, where she trained a generation of women scientists.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To explain the methods astronomers in the 1800s used to locate comets", "To argue that Vassar College was the most important scientific institution of its time", "To describe how a single discovery opened a series of professional opportunities for a scientist", "To compare Maria Mitchell's achievements with those of European astronomers"], "ci": 2, "exp": "The text begins with Mitchell's comet discovery and then traces what followed: a medal, fame, election to the Academy, and a professorship. Its purpose is to show how one discovery launched her career. It says nothing about observing methods, does not rank Vassar, and makes no comparison to Europeans.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"},
{"passage": "<strong>Text 1</strong><br>In a widely cited study of 40 children, psychologist Rhea Castillo found that bilingual children outperformed monolingual children on tasks requiring them to ignore distracting information. Castillo proposed that constantly managing two languages strengthens the mental control that such tasks demand.<br><br><strong>Text 2</strong><br>Attempts to confirm a bilingual advantage have produced mixed results. A recent analysis combining data from more than 4,000 children found no consistent difference between bilingual and monolingual children on tests of mental control. The authors note that early studies were often small, and that studies reporting an advantage were more likely to be published than those that found none.", "stem": "Based on the texts, how would the authors of the analysis in Text 2 most likely characterize the finding reported in Text 1?", "opts": ["As strong evidence that bilingualism improves mental control in all children", "As a result that may reflect the limitations of a small study and has not held up in much larger samples", "As a finding that is accurate for bilingual children but not for monolingual children", "As a study that measured a different skill from the one tested in larger analyses"], "ci": 1, "exp": "Text 2 reports that an analysis of over 4,000 children found no consistent advantage and notes that early studies were often small and more likely to be published if they found an advantage. That describes Castillo's 40-child result as a possible artifact of a small study that larger samples did not confirm.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"},
{"passage": "Lichens, partnerships between fungi and algae, absorb water and nutrients directly from the air, which makes many species highly sensitive to air pollution. During the nineteenth century, lichens vanished from tree trunks in many industrial cities. After laws reduced sulfur dioxide emissions in the late twentieth century, lichens gradually returned. A recent survey of one city, however, found that its most pollution-sensitive lichen species grew only in large parks located far from major roads. This distribution suggests that ____", "stem": "Which choice most logically completes the text?", "opts": ["pollution-sensitive lichens require more sunlight than is available along major roads.", "the laws that reduced sulfur dioxide emissions had no effect on the city's lichens.", "air quality in some parts of the city may still be too poor for pollution-sensitive lichens to survive.", "lichens returned to the city more quickly than they returned to rural areas."], "ci": 2, "exp": "The text establishes that sensitive lichens disappear where air is polluted. If the most sensitive species now grow only far from major roads, the most logical conclusion is that air near those roads is still too polluted for them. The text says nothing about sunlight or rural areas, and it states that lichens did return after the laws.", "tag": "Inferences", "tagcolor": "#f5a623"},
{"passage": "Researchers hypothesized that songbirds living near busy roads sing at a higher minimum pitch than birds in quiet areas, allowing their songs to be heard over the low-frequency rumble of traffic. To test this, they recorded three species at quiet sites and at noisy roadside sites.<table style=\"border-collapse:collapse;margin:10px 0;font-size:0.88rem;\"><tr><th style=\"border:1px solid #999;padding:4px 8px;\">Species</th><th style=\"border:1px solid #999;padding:4px 8px;\">Minimum song frequency at quiet sites (kHz)</th><th style=\"border:1px solid #999;padding:4px 8px;\">Minimum song frequency at noisy sites (kHz)</th></tr><tr><td style=\"border:1px solid #999;padding:4px 8px;\">Great tit</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">2.9</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">3.4</td></tr><tr><td style=\"border:1px solid #999;padding:4px 8px;\">Song sparrow</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">2.1</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">2.6</td></tr><tr><td style=\"border:1px solid #999;padding:4px 8px;\">European robin</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">2.4</td><td style=\"border:1px solid #999;padding:4px 8px;text-align:center;\">2.7</td></tr></table>", "stem": "Which choice best describes data from the table that support the researchers' hypothesis?", "opts": ["For each of the three species, the minimum song frequency was higher at noisy sites than at quiet sites.", "Great tits had the highest minimum song frequency at both quiet and noisy sites.", "At quiet sites, song sparrows sang at a lower minimum frequency than European robins did.", "The difference between quiet and noisy sites was greatest for the European robin."], "ci": 0, "exp": "The hypothesis compares the same birds in noisy versus quiet places. Every species shows a higher minimum frequency at noisy sites (3.4 vs. 2.9, 2.6 vs. 2.1, 2.7 vs. 2.4). Comparisons between species do not address the hypothesis, and the robin's difference (0.3 kHz) is actually the smallest, not the greatest.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"},
{"passage": "Glass frogs, which live in the rainforests of Central and South America, have skin so translucent that their internal organs are visible from below. Biologists had long puzzled over how the frogs remain nearly transparent while resting, since red blood circulating through the body should be easy to see. <u>A 2022 study offered a surprising answer: while the frogs sleep, they pack nearly 90 percent of their red blood cells into the liver, whose mirror-like surface conceals them.</u> When the frogs wake and become active, the cells flow back into circulation.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It raises a question that the rest of the text attempts to answer.", "It provides a solution to the puzzle described in the previous sentence.", "It challenges an explanation that biologists had previously accepted.", "It offers an example of another animal that uses the same strategy as glass frogs."], "ci": 1, "exp": "The previous sentence describes a puzzle: how the frogs stay transparent despite red blood. The underlined sentence answers it (the frogs store most red blood cells in the reflective liver). It does not raise a new question, the text mentions no earlier accepted explanation, and no other animal is discussed.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}
];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
