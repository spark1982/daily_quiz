{"stem": "Let <i>A</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">2</td><td style=\"padding:1px 6px;text-align:center;\">&minus;1</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">3</td><td style=\"padding:1px 6px;text-align:center;\">4</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span> and <i>B</i> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">1</td><td style=\"padding:1px 6px;text-align:center;\">5</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">&minus;2</td><td style=\"padding:1px 6px;text-align:center;\">0</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span>. What is the product AB?", "opts": ["<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">4</td><td style=\"padding:1px 6px;text-align:center;\">10</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">&minus;5</td><td style=\"padding:1px 6px;text-align:center;\">15</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span>", "<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">17</td><td style=\"padding:1px 6px;text-align:center;\">19</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">&minus;4</td><td style=\"padding:1px 6px;text-align:center;\">2</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span>", "<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">2</td><td style=\"padding:1px 6px;text-align:center;\">&minus;5</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">&minus;6</td><td style=\"padding:1px 6px;text-align:center;\">0</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span>", "<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">0</td><td style=\"padding:1px 6px;text-align:center;\">10</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">11</td><td style=\"padding:1px 6px;text-align:center;\">15</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span>"], "ci": 0, "exp": "Multiply rows of A by columns of <i>B</i>. Row 1: (2)(1) + (&minus;1)(&minus;2) = 4 and (2)(5) + (&minus;1)(0) = 10. Row 2: (3)(1) + (4)(&minus;2) = &minus;5 and (3)(5) + (4)(0) = 15. So AB = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">4</td><td style=\"padding:1px 6px;text-align:center;\">10</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">&minus;5</td><td style=\"padding:1px 6px;text-align:center;\">15</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span>. Matrix multiplication is not commutative, so BA = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">17</td><td style=\"padding:1px 6px;text-align:center;\">19</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">&minus;4</td><td style=\"padding:1px 6px;text-align:center;\">2</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span> is a different matrix, and multiplying matching entries is not matrix multiplication.", "tag": "Matrices - Multiplication", "tagcolor": "#185FA5"},
{"stem": "The equation 9<i>x</i><sup>2</sup> &minus; 4<i>y</i><sup>2</sup> &minus; 36<i>x</i> &minus; 8<i>y</i> &minus; 4 = 0 represents a conic section. Which choice correctly classifies it and gives its center?", "opts": ["A hyperbola with center (&minus;2, 1) that opens left and right", "A hyperbola with center (2, &minus;1) that opens up and down", "A hyperbola with center (2, &minus;1) that opens left and right", "An ellipse with center (2, &minus;1)"], "ci": 2, "exp": "Group and complete the square: 9(<i>x</i><sup>2</sup> &minus; 4<i>x</i> + 4) &minus; 4(<i>y</i><sup>2</sup> + 2<i>y</i> + 1) = 4 + 36 &minus; 4, so 9(<i>x</i> &minus; 2)<sup>2</sup> &minus; 4(<i>y</i> + 1)<sup>2</sup> = 36. Dividing by 36: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(<i>x</i> &minus; 2)<sup>2</sup></span><span style=\"border-top:1.4px solid #111;\">4</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(<i>y</i> + 1)<sup>2</sup></span><span style=\"border-top:1.4px solid #111;\">9</span></span> = 1. The squared terms have opposite signs, so it is a hyperbola; the positive <i>x</i>-term means it opens left and right, and the center is (2, &minus;1).", "tag": "Hyperbolas - Equation & Classification", "tagcolor": "#185FA5"},

    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
