<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:#eef2f7;color:#222;}
.wrap{max-width:640px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 18px rgba(0,0,0,0.08);}
.title{text-align:center;font-size:1.25rem;font-weight:900;color:#185FA5;padding:16px 12px 4px;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:6px 12px 10px;background:#fff;}

#nav-count{font-size:13px;white-space:nowrap;color:#555;font-weight:700;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#jump-btn{font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;margin:0 14px 8px;border-radius:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;cursor:pointer;margin:2px;}
.timer-bar{background:#fff;border-bottom:1px solid #d0dce8;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.timer-setup{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#444;}
.timer-setup label{font-weight:700;}

.passage-box{background:#f5f7fa;border-left:4px solid #185FA5;padding:14px 16px;border-radius:6px;margin-bottom:16px;font-size:0.92rem;line-height:1.6;color:#333;}
.qtext{font-size:1.04rem;font-weight:700;line-height:1.5;margin-bottom:16px;color:#1a1a1a;}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border:1.5px solid #d7dde6;border-radius:10px;background:#fff;font-size:0.96rem;cursor:pointer;color:#222;line-height:1.4;}
.opt:active{opacity:0.85;}
.opt.correct{border-color:#1D9E75;background:#e9faf3;color:#0c6b4d;font-weight:700;}
.opt.wrong{border-color:#E24B4A;background:#fdeceb;color:#9c2b22;font-weight:700;}
.opt.disabled{cursor:default;}
.exp{display:none;background:#fff7e8;border-left:4px solid #f5a623;padding:12px 14px;border-radius:6px;margin-top:6px;font-size:0.92rem;line-height:1.55;color:#5a4521;}
.exp.show{display:block;}
.navrow{display:flex;gap:10px;margin-top:18px;}
.navbtn{flex:1;padding:13px;border:none;border-radius:10px;font-size:0.96rem;font-weight:700;cursor:pointer;background:#185FA5;color:#fff;}
.navbtn:disabled{background:#c7d2de;cursor:not-allowed;}
.navbtn.secondary{background:#eef2f7;color:#185FA5;}
.result{padding:24px 18px;text-align:center;}
.result h2{color:#185FA5;font-size:1.3rem;margin-bottom:4px;}
.scoreline{font-size:2rem;font-weight:900;color:#1D9E75;margin:12px 0;}
.resultbtn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;color:#fff;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:50;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;padding:22px;max-width:300px;text-align:center;}
.modal-box h3{margin:0 0 10px;color:#185FA5;font-size:1.05rem;}

.modal-row{display:flex;gap:10px;}
.modal-row button{flex:1;padding:11px;border:none;border-radius:8px;font-size:0.92rem;font-weight:700;cursor:pointer;}
.ul{text-decoration:underline;}
.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}

.fr .fb{display:block;border-top:1.5px solid currentColor;min-width:14px;}
.radical{display:inline-flex;align-items:center;vertical-align:middle;}
.radical-index{font-size:0.65em;align-self:flex-start;margin-right:1px;line-height:1;}
.radical-symbol{display:inline-flex;align-items:stretch;}
.radical-symbol::before{content:"\221A";font-size:1.15em;line-height:1;position:relative;top:2px;}
.radical-content{border-top:2.5px solid currentColor;padding:1px 4px 1px 2px;display:inline-block;line-height:1.3;}
.mblock{text-align:center;margin:10px 0;font-size:1.05em;font-style:italic;line-height:2;}
</style>

</div>

<script>
var RAW_QUESTIONS = [{"q": "Compute: <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">4</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">8</span></span> = ?", "opts": ["1", "<span class=\"fr\"><span class=\"fn\">7</span><span class=\"fb\"></span><span class=\"fd\">8</span></span>", "<span class=\"fr\"><span class=\"fn\">3</span><span class=\"fb\"></span><span class=\"fd\">4</span></span>", "<span class=\"fr\"><span class=\"fn\">5</span><span class=\"fb\"></span><span class=\"fd\">8</span></span>"], "ci": 1, "exp": "Using a common denominator of 8: <span class=\"fr\"><span class=\"fn\">4</span><span class=\"fb\"></span><span class=\"fd\">8</span></span> + <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">8</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">8</span></span> = <span class=\"fr\"><span class=\"fn\">7</span><span class=\"fb\"></span><span class=\"fd\">8</span></span>. The correct answer is <span class=\"fr\"><span class=\"fn\">7</span><span class=\"fb\"></span><span class=\"fd\">8</span></span>."}, {"q": "Compute: <span class=\"fr\"><span class=\"fn\">5</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> - <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">3</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span> = ?", "opts": ["<span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">3</span></span>", "<span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span>", "<span class=\"fr\"><span class=\"fn\">5</span><span class=\"fb\"></span><span class=\"fd\">6</span></span>", "1"], "ci": 3, "exp": "Using a common denominator of 6: <span class=\"fr\"><span class=\"fn\">5</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> - <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> + <span class=\"fr\"><span class=\"fn\">3</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = <span class=\"fr\"><span class=\"fn\">6</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = 1. The correct answer is 1."}, {"q": "Compute: <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">3</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">4</span></span> - <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = ?", "opts": ["<span class=\"fr\"><span class=\"fn\">5</span><span class=\"fb\"></span><span class=\"fd\">6</span></span>", "<span class=\"fr\"><span class=\"fn\">7</span><span class=\"fb\"></span><span class=\"fd\">12</span></span>", "<span class=\"fr\"><span class=\"fn\">3</span><span class=\"fb\"></span><span class=\"fd\">4</span></span>", "<span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">3</span></span>"], "ci": 2, "exp": "Using a common denominator of 12: <span class=\"fr\"><span class=\"fn\">8</span><span class=\"fb\"></span><span class=\"fd\">12</span></span> + <span class=\"fr\"><span class=\"fn\">3</span><span class=\"fb\"></span><span class=\"fd\">12</span></span> - <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">12</span></span> = <span class=\"fr\"><span class=\"fn\">9</span><span class=\"fb\"></span><span class=\"fd\">12</span></span> = <span class=\"fr\"><span class=\"fn\">3</span><span class=\"fb\"></span><span class=\"fd\">4</span></span>. The correct answer is <span class=\"fr\"><span class=\"fn\">3</span><span class=\"fb\"></span><span class=\"fd\">4</span></span>."}, {"q": "Compute: <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span> &times; <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">3</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = ?", "opts": ["<span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">3</span></span>", "<span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">3</span></span>", "<span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span>", "<span class=\"fr\"><span class=\"fn\">5</span><span class=\"fb\"></span><span class=\"fd\">6</span></span>"], "ci": 2, "exp": "First multiply: <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span> &times; <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">3</span></span> = <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">3</span></span>. Then add: <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">3</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = <span class=\"fr\"><span class=\"fn\">2</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> + <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = <span class=\"fr\"><span class=\"fn\">3</span><span class=\"fb\"></span><span class=\"fd\">6</span></span> = <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span>. The correct answer is <span class=\"fr\"><span class=\"fn\">1</span><span class=\"fb\"></span><span class=\"fd\">2</span></span>."}, {"q": "Compute: 2.5 + 1.75 - 0.5 = ?", "opts": ["3.25", "4.75", "4.25", "3.75"], "ci": 3, "exp": "2.5 + 1.75 = 4.25, and 4.25 - 0.5 = 3.75. The correct answer is 3.75."}, {"q": "Compute: 0.6 &times; 5 + 1.2 = ?", "opts": ["6.0", "4.2", "3.6", "4.8"], "ci": 1, "exp": "0.6 &times; 5 = 3.0, and 3.0 + 1.2 = 4.2. The correct answer is 4.2."}, {"q": "Compute: 10 - 3.25 - 2.5 = ?", "opts": ["4.25", "3.75", "5.25", "4.75"], "ci": 0, "exp": "10 - 3.25 = 6.75, and 6.75 - 2.5 = 4.25. The correct answer is 4.25."}, {"q": "Compute: 1.5 + 2.5 &times; 2 - 1 = ?", "opts": ["5.5", "6.5", "4.5", "7.0"], "ci": 0, "exp": "By order of operations, multiply first: 2.5 &times; 2 = 5.0. Then 1.5 + 5.0 - 1 = 5.5. The correct answer is 5.5."}, {"q": "Compute: -8 + 12 - 5 = ?", "opts": ["1", "-9", "9", "-1"], "ci": 3, "exp": "-8 + 12 = 4, and 4 - 5 = -1. The correct answer is -1."}, {"q": "Compute: -3 &times; 4 + 7 = ?", "opts": ["-5", "5", "19", "-19"], "ci": 0, "exp": "-3 &times; 4 = -12, and -12 + 7 = -5. The correct answer is -5."}, {"q": "Compute: 15 - (-6) + (-9) = ?", "opts": ["30", "12", "-12", "0"], "ci": 1, "exp": "Subtracting a negative is the same as adding: 15 - (-6) = 21. Then 21 + (-9) = 12. The correct answer is 12."}, {"q": "Compute: -4 &times; (-3) - 10 + 2 = ?", "opts": ["4", "-20", "-4", "8"], "ci": 0, "exp": "-4 &times; (-3) = 12 (a negative times a negative is positive). Then 12 - 10 + 2 = 4. The correct answer is 4."}, {"q": "A movie is 2 hours 15 minutes long. How many minutes long is the movie in total? (1 hour = 60 minutes)", "opts": ["145 minutes", "135 minutes", "125 minutes", "215 minutes"], "ci": 1, "exp": "2 hours = 2 &times; 60 = 120 minutes. Adding the extra 15 minutes: 120 + 15 = 135 minutes. The correct answer is 135 minutes."}, {"q": "Jake ran 3 kilometers, then walked 450 meters, then ran another 250 meters. What was his total distance in meters? (1 kilometer = 1,000 meters)", "opts": ["3,000 meters", "3,070 meters", "3,700 meters", "4,000 meters"], "ci": 2, "exp": "3 kilometers = 3 &times; 1,000 = 3,000 meters. Adding the rest: 3,000 + 450 + 250 = 3,700 meters. The correct answer is 3,700 meters."}, {"q": "A pitcher holds 1 liter 250 milliliters of juice. If 400 milliliters are poured out, how many milliliters remain? (1 liter = 1,000 milliliters)", "opts": ["650 milliliters", "750 milliliters", "1,650 milliliters", "850 milliliters"], "ci": 3, "exp": "1 liter 250 milliliters = 1,000 + 250 = 1,250 milliliters. Pouring out 400 milliliters leaves 1,250 - 400 = 850 milliliters. The correct answer is 850 milliliters."}, {"q": "A bag of rice weighs 5 pounds 6 ounces. How many ounces does it weigh in total? (1 pound = 16 ounces)", "opts": ["86 ounces", "96 ounces", "21 ounces", "80 ounces"], "ci": 0, "exp": "5 pounds = 5 &times; 16 = 80 ounces. Adding the extra 6 ounces: 80 + 6 = 86 ounces. The correct answer is 86 ounces."}, {"q": "Compute: 2<sup>3</sup> + 3<sup>2</sup> - 4 = ?", "opts": ["21", "11", "17", "13"], "ci": 3, "exp": "2<sup>3</sup> = 8 and 3<sup>2</sup> = 9. So 8 + 9 - 4 = 13. The correct answer is 13."}, {"q": "Compute: 5<sup>2</sup> &times; 2 - 10 = ?", "opts": ["30", "20", "40", "50"], "ci": 2, "exp": "5<sup>2</sup> = 25. So 25 &times; 2 = 50, and 50 - 10 = 40. The correct answer is 40."}, {"q": "Compute: 3<sup>3</sup> - 2<sup>3</sup> + 1 = ?", "opts": ["19", "28", "20", "36"], "ci": 2, "exp": "3<sup>3</sup> = 27 and 2<sup>3</sup> = 8. So 27 - 8 + 1 = 20. The correct answer is 20."}, {"q": "Compute: 4<sup>2</sup> + 2<sup>3</sup> &times; 3 = ?", "opts": ["64", "30", "22", "40"], "ci": 3, "exp": "4<sup>2</sup> = 16 and 2<sup>3</sup> = 8. By order of operations, multiply first: 8 &times; 3 = 24. Then 16 + 24 = 40. The correct answer is 40."}, {"q": "Solve for x: 2x + 5 = 17", "opts": ["x = 12", "x = 6", "x = 8", "x = 11"], "ci": 1, "exp": "Subtract 5 from both sides: 2x = 12. Then divide both sides by 2: x = 6. The correct answer is x = 6."}, {"q": "Solve for x: 3x - 4 = 2x + 9", "opts": ["x = 5", "x = -13", "x = 13", "x = 2"], "ci": 2, "exp": "Subtract 2x from both sides: x - 4 = 9. Then add 4 to both sides: x = 13. The correct answer is x = 13."}, {"q": "Solve for x: <span class=\"fr\"><span class=\"fn\">x</span><span class=\"fb\"></span><span class=\"fd\">3</span></span> + 2 = 9", "opts": ["x = 27", "x = 7", "x = 21", "x = 33"], "ci": 2, "exp": "Subtract 2 from both sides: <span class=\"fr\"><span class=\"fn\">x</span><span class=\"fb\"></span><span class=\"fd\">3</span></span> = 7. Then multiply both sides by 3: x = 21. The correct answer is x = 21."}, {"q": "Solve for x: 4(x - 2) = 20", "opts": ["x = 7", "x = 5", "x = 3", "x = 18"], "ci": 0, "exp": "Divide both sides by 4: x - 2 = 5. Then add 2 to both sides: x = 7. The correct answer is x = 7."}];
var QUIZ_KEY = 'quiz_grantmath_24_20260627_v1';
var ATT_KEY = 'quiz_grantmath_att_20260627_v1';
var ORDER_KEY = QUIZ_KEY + '_order_v1';
var EXTRA_FIELD = '';
var EXTRA_CLASS = 'extra-box';
var QUIZ_TITLE = '[Grant] Math';

function fr(n,d){ return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>'; }
function R(idx,inner){ var i = idx ? '<span class="radical-index">'+idx+'</span>' : ''; return '<span class="radical">'+i+'<span class="radical-symbol"><span class="radical-content">'+inner+'</span></span></span>'; }

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function identityOrder(){ var o=[]; for(var i=0;i<RAW_QUESTIONS.length;i++) o.push(i); return o; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==RAW_QUESTIONS.length) return false;
  var sorted = arr.slice().sort(function(a,b){return a-b;});
  for(var i=0;i<sorted.length;i++) if(sorted[i]!==i) return false;
  return true;
}
function loadOrder(){
  try{
    var raw = localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr = JSON.parse(raw);
    if(!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  }catch(e){ localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function buildQuestions(raw, order){
  var out=[];
  for(var i=0;i<order.length;i++) out.push(raw[order[i]]);
  return out;
}
var currentOrder = loadOrder() || identityOrder();
var QUESTIONS = buildQuestions(RAW_QUESTIONS, currentOrder);
var pendingFreshMode = 'original';

function defaultState(){
  return { cur:0, answers:{}, showResults:false, timerTotalSec:null, timerStartedAt:null };
}
function loadState(){
  try{ var raw = localStorage.getItem(QUIZ_KEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function saveState(s){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(s)); }catch(e){} }

var state = loadState() || defaultState();
var timerInterval = null;

function render(){
  if(state.showResults){ renderResult(); document.getElementById('quizArea').style.display='none'; document.getElementById('resultArea').style.display='block'; updateNav(); return; }
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultArea').style.display='none';
  var i = state.cur;
  var q = QUESTIONS[i];
  var picked = state.answers[i];
  var html = '';
  if(q.tag){ html += '<span class="tagline'+(q.tag==='Review'?' review':'')+'">'+q.tag+'</span><br>'; }
  if(EXTRA_FIELD && q[EXTRA_FIELD]){ html += '<div class="'+EXTRA_CLASS+'">'+q[EXTRA_FIELD]+'</div>'; }
  html += '<div class="qtext">Q'+(i+1)+'. '+q.q+'</div>';
  for(var k=0;k<q.opts.length;k++){
    var cls='opt';
    if(picked!==undefined){
      cls += ' disabled';
      if(k===q.ci) cls += ' correct';
      else if(k===picked) cls += ' wrong';
    }
    html += '<button class="'+cls+'" '+(picked!==undefined?'disabled':'onclick="pick('+k+')"')+'>'+q.opts[k]+'</button>';
  }
  if(picked!==undefined && picked!==q.ci){
    html += '<div class="exp show">'+q.exp+'</div>';
  }
  html += '<div class="navrow">';
  html += '<button class="navbtn secondary" onclick="go(-1)" '+(i===0?'disabled':'')+'>&larr; Prev</button>';
  if(i>=QUESTIONS.length-1){
    html += '<button class="navbtn" onclick="finishQuiz()">Show Results &rarr;</button>';
  } else {
    html += '<button class="navbtn" onclick="go(1)">Next &rarr;</button>';
  }
  html += '</div>';
  document.getElementById('quizArea').innerHTML = html;
  updateNav();
}

function pick(k){
  var i = state.cur;
  if(state.answers[i]!==undefined) return;
  state.answers[i] = k;
  saveState(state);
  render();
}

function go(d){
  var ni = state.cur + d;
  if(ni<0 || ni>QUESTIONS.length-1) return;
  state.cur = ni;
  saveState(state);
  render();
}

function goToQ(i){
  state.cur = i;
  state.showResults = false;
  saveState(state);
  render();
}

function finishQuiz(){
  state.showResults = true;
  saveState(state);
  bumpAttempts();
  render();
}

function renderResult(){
  var correct=0, wrong=0;
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]===undefined) continue;
    if(state.answers[i]===QUESTIONS[i].ci) correct++; else wrong++;
  }
  var pct = Math.round(correct/QUESTIONS.length*100);
  var html = '<h2>Results</h2>';
  html += '<div class="scoreline">'+correct+' / '+QUESTIONS.length+'</div>';
  html += '<div style="color:#555;margin-bottom:18px;">'+pct+'% correct &middot; '+wrong+' incorrect</div>';
  html += '<button class="resultbtn" style="background:#7b61ff;" onclick="copyRes()">Copy All Results</button>';
  html += '<button id="retryWrongBtn" class="resultbtn" style="background:#1D9E75;" onclick="retryWrong()">Retry Wrong Ones</button>';
  html += '<button class="resultbtn" style="background:#185FA5;" onclick="openFreshModalOriginal()">Start Fresh (Original Order)</button>';
  html += '<button class="resultbtn" style="background:#888;" onclick="openFreshModalRandom()">Start Fresh (Random Order)</button>';
  document.getElementById('resultArea').innerHTML = html;
}

function retryWrong(){
  var wrongList = [];
  for(var i=0;i<QUESTIONS.length;i++){
    if(state.answers[i]!==undefined && state.answers[i]!==QUESTIONS[i].ci){
      wrongList.push(i);
      delete state.answers[i];
    }
  }
  if(wrongList.length>0){
    state.cur = wrongList[0];
    state.showResults = false;
    state.timerStartedAt = null;
    state.timerTotalSec = null;
    saveState(state);
    stopTimerInterval();
    renderTimer();
    render();
  }
}

function openFreshModal(mode){
  pendingFreshMode = mode;
  var titleEl = document.getElementById('freshModalTitle');
  var textEl = document.getElementById('freshModalText');
  if(mode==='random'){
    titleEl.textContent = 'Start Fresh (Random Order)?';
    textEl.textContent = 'Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    titleEl.textContent = 'Start Fresh (Original Order)?';
    textEl.textContent = 'Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  currentOrder = (pendingFreshMode==='random') ? shuffle(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  QUESTIONS = buildQuestions(RAW_QUESTIONS, currentOrder);
  state = defaultState();
  saveState(state);
  stopTimerInterval();
  closeFreshModal();
  render();
  renderTimer();
}

function copyRes(){
  var correct=0;
  for(var i=0;i<QUESTIONS.length;i++){ if(state.answers[i]===QUESTIONS[i].ci) correct++; }
  var txt = QUIZ_TITLE + ' - Score: ' + correct + '/' + QUESTIONS.length;
  try{
    navigator.clipboard.writeText(txt);
  }catch(e){}
}

function updateNav(){
  var answered = 0;
  for(var i=0;i<QUESTIONS.length;i++){ if(state.answers[i]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + QUESTIONS.length;
  document.getElementById('prog-fill').style.width = (answered/QUESTIONS.length*100).toFixed(1)+'%';
  renderDots();
}

function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || !panel.style.display){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}

function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none' || !panel.style.display) return;
  var html='';
  for(var i=0;i<QUESTIONS.length;i++){
    var p = state.answers[i];
    var bg = p===undefined ? '#d7dde6' : (p===QUESTIONS[i].ci ? '#185FA5' : '#E24B4A');
    html += '<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  panel.innerHTML = html;
}

function formatTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function renderTimer(){
  var setupEl = document.getElementById('timerSetup');
  var runningEl = document.getElementById('timerRunning');
  var displayEl = document.getElementById('timerDisplay');
  if(!state.timerStartedAt){ setupEl.style.display='flex'; runningEl.style.display='none'; return; }
  setupEl.style.display='none'; runningEl.style.display='flex';
  var elapsed = (Date.now()-state.timerStartedAt)/1000;
  var remaining = state.timerTotalSec - elapsed;
  displayEl.classList.remove('warn','danger');
  if(remaining<=0){ displayEl.textContent="Time's Up"; displayEl.classList.add('danger'); stopTimerInterval(); return; }
  displayEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) displayEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) displayEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(state);
  renderTimer();
  startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval = setInterval(renderTimer, 1000); }
function stopTimerInterval(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function qaGet(){ try{ return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0; }catch(e){ return 0; } }
function qaSet(n){ try{ localStorage.setItem(ATT_KEY, String(n)); }catch(e){} }
function bumpAttempts(){ qaSet(qaGet()+1); renderAttempts(); }
function renderAttempts(){ var el=document.getElementById('qzAttemptsCount'); if(el) el.textContent = qaGet(); }

window.pick = pick;
window.go = go;
window.goToQ = goToQ;
window.finishQuiz = finishQuiz;
window.retryWrong = retryWrong;
window.openFreshModalOriginal = openFreshModalOriginal;
window.openFreshModalRandom = openFreshModalRandom;
window.closeFreshModal = closeFreshModal;
window.confirmFresh = confirmFresh;
window.copyRes = copyRes;
window.toggleJump = toggleJump;
window.startTimer = startTimer;

render();
renderTimer();
renderAttempts();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
