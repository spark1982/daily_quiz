<script>
var TITLE = "[Sion] Advanced SAT Reading";
var QUIZ_KEY = "sionadvreading";
var INSTRUCTION = "Read each passage and choose the best answer.";
var TODAY_STR = "20261015";
var RAW_QUESTIONS = [{"passage": "<strong>Text 1</strong><br>Ecologists generally regard tamarisk, a shrub introduced to the American Southwest in the 1800s, as a harmful invader. Tamarisk crowds out native willows and cottonwoods along rivers, and many conservation groups have spent decades clearing it from riverbanks in order to restore native habitat.<br><br><strong>Text 2</strong><br>Wildlife biologist Teresa Lund has found that in parts of Arizona the endangered southwestern willow flycatcher now builds many of its nests in tamarisk thickets. Where crews removed tamarisk without first replanting native trees, flycatcher nesting declined sharply. Lund argues that removal projects should restore native vegetation before or while clearing the invader.", "stem": "Based on the texts, how would Lund (Text 2) most likely respond to the conservation groups&rsquo; approach described in Text 1?", "opts": ["She would claim that native willows and cottonwoods are themselves invasive in the Southwest.", "She would argue that tamarisk should be left in place everywhere because it is no longer harmful to rivers.", "She would agree that tamarisk should be removed as quickly as possible regardless of the effects on birds.", "She would caution that clearing tamarisk without first restoring native trees can harm an endangered species that has come to depend on it."], "ci": 3, "exp": "Lund does not deny that tamarisk is an invader; she warns that removing it &ldquo;without first replanting native trees&rdquo; reduced flycatcher nesting and recommends restoring natives first. She neither defends tamarisk everywhere nor endorses removal regardless of consequences.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "Astronomers monitoring a distant star noticed that its brightness dropped by about 1 percent every 3.5 days. Each dip lasted almost exactly two hours, and the amount of dimming was the same every time. Because the pattern repeated on such a precise schedule, the astronomers concluded that the dimming was probably caused not by changes within the star itself but by ______", "stem": "Which choice most logically completes the text?", "opts": ["clouds of dust drifting at random between the star and Earth.", "an object, such as a planet, passing between the star and Earth at regular intervals.", "errors that occurred when the telescope was used on cloudy nights.", "the star gradually using up its fuel and fading over time."], "ci": 1, "exp": "A dip of the same size and length that repeats every 3.5 days points to something orbiting the star and periodically blocking part of its light. Gradual fading would not repeat, random dust would not keep a precise schedule, and weather-related errors would not occur exactly every 3.5 days.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "In a study of vocabulary learning, researchers randomly assigned adult volunteers to two groups and taught both groups the same twenty words from an invented language. Group A practiced the words in a single 60-minute session, while Group B practiced for three 20-minute sessions on separate days. A week later, Group B recalled nearly twice as many words as Group A. Because the groups spent the same total time practicing and used identical materials, the results suggest that ______", "stem": "Which choice most logically completes the text?", "opts": ["words from invented languages are easier to remember than words from real languages.", "the volunteers in Group B were naturally more skilled at learning languages than those in Group A.", "spreading practice across several days, rather than the total amount of practice time, accounted for the difference in recall.", "a single long practice session is the most effective way to remember new vocabulary."], "ci": 2, "exp": "The researchers held time and materials constant and assigned volunteers randomly, so the only meaningful difference between the groups was how practice was scheduled. Random assignment makes natural ability an unlikely explanation, and the study did not compare invented and real languages.", "tag": "Inferences", "tagcolor": "#f5a623"}, {"passage": "Plant ecologists have observed that some annual plants appear to &ldquo;recognize&rdquo; their siblings. The ecologists hypothesize that when a seedling grows beside a closely related plant, it invests less energy in competing for underground resources and more in growing upward, whereas a seedling beside an unrelated plant of the same species competes aggressively below ground.", "stem": "Which finding, if true, would most directly support the ecologists&rsquo; hypothesis?", "opts": ["Seedlings grown beside siblings produced fewer new roots but grew taller than seedlings grown beside unrelated plants of the same species.", "Seedlings produced the same number of roots whether they were grown beside siblings or beside unrelated plants.", "Seedlings grown alone grew taller than seedlings grown beside either siblings or unrelated plants.", "Seedlings grown beside siblings produced more new roots and remained shorter than seedlings grown beside unrelated plants."], "ci": 0, "exp": "The hypothesis predicts two differences for seedlings beside siblings: less root competition and more upward growth. Only the finding of fewer roots and greater height matches both. Equal root numbers would show no recognition, and more roots beside siblings is the opposite of the prediction.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "<strong>Text 1</strong><br>For decades, many researchers argued that the woolly mammoth disappeared mainly because of human hunting. They pointed out that mammoth populations declined in many regions soon after skilled human hunters arrived, and they concluded that hunting pressure was the decisive cause of the species&rsquo; extinction.<br><br><strong>Text 2</strong><br>Geneticist Arjun Mehta and his team analyzed ancient DNA preserved in frozen sediments across the Arctic. They found that mammoths survived in some regions for thousands of years after humans arrived, and that their final declines matched a shift to a wetter climate, which replaced the grasslands mammoths fed on with mossy bogs.", "stem": "Based on the texts, how would Mehta (Text 2) most likely respond to the conclusion of the researchers in Text 1?", "opts": ["By arguing that mammoths did not actually decline in the regions humans reached", "By agreeing that hunting was the decisive cause because humans arrived before the climate changed", "By suggesting that climate-driven changes in habitat may have played a larger role in the extinction than hunting alone", "By claiming that ancient DNA cannot reveal when a species disappeared from a region"], "ci": 2, "exp": "Mehta&rsquo;s findings that mammoths persisted long after humans arrived and declined when grasslands turned to bogs challenge the idea that hunting was &ldquo;the decisive cause.&rdquo; His team relies on ancient DNA, so he would not dismiss that evidence, and he does not deny that declines occurred.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c"}, {"passage": "In her memoir about growing up on a small island off the coast of Maine, Ruth Ellery recalls that her father kept the family&rsquo;s weather log <b>&ldquo;as faithfully as a diary.&rdquo;</b> Each evening he recorded the wind, the tides, and the boats that passed, but he also noted when the first lupines bloomed and which pair of eiders had returned to nest on the rocks below the house.", "stem": "As used in the text, what is the main purpose of the phrase &ldquo;as faithfully as a diary&rdquo;?", "opts": ["To indicate that the log was later published as a book", "To emphasize how consistently and personally the father kept his records", "To contrast the father&rsquo;s careful record keeping with his careless daily habits", "To suggest that the log contained secrets the father hid from his family"], "ci": 1, "exp": "A diary is written regularly and includes personal observations. The rest of the text confirms both qualities: he wrote &ldquo;each evening&rdquo; and noted the lupines and the returning eiders, not just weather data. Nothing suggests secrecy, publication, or carelessness.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Beavers are often described as nature&rsquo;s engineers. By damming streams, they create ponds that store water through dry seasons, filter out sediment, and provide habitat for fish and birds. <u>But the same dams can flood roads, fields, and timberland, which is a major reason beavers were trapped out of much of their former range in the twentieth century.</u> Today, some land managers deliberately relocate beavers to drought-prone watersheds, accepting occasional local flooding in exchange for steadier water supplies downstream.", "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "opts": ["It explains why beavers build dams only in drought-prone watersheds.", "It provides evidence that beaver ponds do not actually store water during dry seasons.", "It concludes the text&rsquo;s argument that beavers should be removed from farmland.", "It introduces a drawback of beaver dams that the final sentence shows land managers now weigh against the dams&rsquo; benefits."], "ci": 3, "exp": "After listing benefits, the underlined sentence presents a cost (flooding). The final sentence then shows managers &ldquo;accepting occasional local flooding&rdquo; for the benefit of steadier water, so the sentence sets up that trade-off. It does not deny the benefits or conclude the text.", "tag": "Craft and Structure", "tagcolor": "#E24B4A"}, {"passage": "Although the novelist&rsquo;s early books sold poorly, she remained ______ about her craft, revising each manuscript for years and refusing to publish anything she considered unfinished.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "opts": ["scrupulous", "boastful", "impulsive", "indifferent"], "ci": 0, "exp": "Revising for years and refusing to publish unfinished work shows extreme care about details, which is what <i>scrupulous</i> means. <i>Indifferent</i> and <i>impulsive</i> describe the opposite behavior, and nothing suggests she bragged.", "tag": "Words in Context", "tagcolor": "#7b61ff"}, {"passage": "Many visitors assume that the Golden Gate Bridge was always meant to be orange, but its famous color began as something of an accident. The steel that arrived in San Francisco in the early 1930s was coated with a reddish primer intended only to protect it from rust until a final coat could be applied. The U.S. Navy proposed painting the finished bridge in black and yellow stripes so that ships could see it. Consulting architect Irving Morrow, however, was struck by how the primer looked against the green hills and gray fog, and he argued that a similar warm shade would both complement the landscape and remain visible. His choice, a color now called International Orange, prevailed.", "stem": "Which choice best states the main purpose of the text?", "opts": ["To explain how a temporary feature of the bridge&rsquo;s construction influenced the color it has today", "To argue that the Navy&rsquo;s proposed stripes would have made the bridge safer for ships", "To describe the engineering challenges of building a bridge in a foggy climate", "To compare Irving Morrow&rsquo;s design choices with those of other architects of the time"], "ci": 0, "exp": "The text traces how the protective primer, meant to be temporary, inspired Morrow to choose a permanent orange. The Navy&rsquo;s idea is mentioned only as the alternative that lost, and the text never discusses engineering problems or other architects.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "For much of the early twentieth century, scientists treated sleep as a passive state in which the brain essentially shut down for the night. In the 1950s, however, researchers recording the electrical activity of sleepers&rsquo; brains discovered recurring periods in which the brain was nearly as active as during waking hours, accompanied by rapid movements of the eyes. Later studies connected these periods with vivid dreaming and, more recently, with the strengthening of newly formed memories. Sleep is now widely understood as an active process that plays an essential role in learning.", "stem": "Which choice best describes the overall structure of the text?", "opts": ["It identifies a problem in sleep research and explains why the problem remains unsolved.", "It presents an earlier view of a phenomenon, describes discoveries that challenged that view, and then states the current understanding.", "It presents a hypothesis, describes an experiment that disproved it, and proposes a new experiment.", "It compares two competing theories about sleep and argues that neither is supported by evidence."], "ci": 1, "exp": "The text moves from the old idea (&ldquo;a passive state&rdquo;) to the 1950s findings and later studies that contradicted it, and ends with today&rsquo;s view (&ldquo;an active process&rdquo;). No new experiment is proposed, and the text endorses the current view rather than rejecting both.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488"}, {"passage": "<table style=\"border-collapse:collapse;font-size:0.9rem;margin-bottom:8px;\"><tr><th style=\"border:1px solid #bbb;padding:4px 8px;\">Neighborhood</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Garden plots added</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Residents eating vegetables daily (before)</th><th style=\"border:1px solid #bbb;padding:4px 8px;\">Residents eating vegetables daily (after)</th></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Elmwood</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">10</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">32%</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">35%</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Riverside</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">40</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">30%</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">44%</td></tr><tr><td style=\"border:1px solid #bbb;padding:4px 8px;\">Oak Hill</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">25</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">34%</td><td style=\"border:1px solid #bbb;padding:4px 8px;\">41%</td></tr></table>A public health researcher studied three neighborhoods that added community garden plots over a two-year period. She concluded that the more garden plots a neighborhood added, the greater the increase in the share of residents who reported eating vegetables every day.", "stem": "Which choice best describes data from the table that support the researcher&rsquo;s conclusion?", "opts": ["In all three neighborhoods, more than 30% of residents reported eating vegetables daily after the plots were added.", "Elmwood added 10 plots, and 35% of its residents reported eating vegetables daily afterward.", "Riverside, which added the most plots, showed the largest increase (from 30% to 44%), while Elmwood, which added the fewest, showed the smallest increase (from 32% to 35%).", "Oak Hill had the highest share of residents eating vegetables daily before any plots were added."], "ci": 2, "exp": "The conclusion links the <i>number of plots added</i> to the <i>size of the increase</i>, so the supporting data must compare both across neighborhoods. Riverside (40 plots, +14 points), Oak Hill (25 plots, +7), and Elmwood (10 plots, +3) follow that pattern. The other choices are accurate but describe only one variable or one neighborhood.", "tag": "Command of Evidence", "tagcolor": "#1D9E75"}, {"passage": "Critics of the city&rsquo;s new recycling program expected the independent review to condemn it. The final report, however, was notably <b>measured</b>: while it acknowledged the program&rsquo;s higher-than-expected costs, it avoided the sweeping judgments offered by critics and credited several modest successes, such as a steady rise in household participation.", "stem": "As used in the text, what does the word &ldquo;measured&rdquo; most nearly mean?", "opts": ["calculated", "restrained", "rhythmic", "brief"], "ci": 1, "exp": "The report is contrasted with &ldquo;sweeping judgments&rdquo;: it notes both costs and successes without exaggerating either, so it is <i>restrained</i>. Although <i>measured</i> can relate to numbers or rhythm, those senses do not fit a balanced, careful tone.", "tag": "Words in Context", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
