<script>
var TITLE = "[Grant] English";
var QUIZ_KEY = "grantenglish_25";
var INSTRUCTION = "Read each passage carefully and choose the best answer. Look back at the passage before you answer.";
var TODAY_STR = "20261030";
var RAW_QUESTIONS = [{"stem": "Which sentence best states the main idea of the passage?", "opts": ["DeWitt Clinton was the most popular governor in New York’s history.", "Irish immigrants did most of the difficult work of digging the Erie Canal.", "The Erie Canal, once mocked as a foolish plan, made shipping cheaper and helped New York grow.", "Building a canal through rock is harder than building a road through a swamp."], "ci": 2, "exp": "The passage moves from the costly problem, to the mocked plan, to the results: costs “plummeted” and towns “flourished.” The detail about Irish immigrants is true but covers only one part of the story.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>Clinton’s Ditch</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods from the Great Lakes to New York City was slow and expensive. Wagons crept along muddy roads, and shipping a ton of flour could cost more than the flour itself. New York governor DeWitt Clinton proposed an ambitious solution: a canal connecting Lake Erie to the Hudson River, which flowed south to the city. Many people mocked the plan as “Clinton’s Ditch,” because the route stretched across 363 miles of forest, swamp, and rock.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, dug the channel with shovels, axes, and horse-drawn plows. At Lockport, crews blasted through a ridge of solid stone and built a staircase of locks that raised boats about 60 feet.</p><p style=\"margin:0 0 8px;\">In 1825, the canal finally opened, and Clinton celebrated by pouring a barrel of Lake Erie water into New York Harbor. Shipping costs plummeted by about 90 percent, and towns along the route, such as Buffalo and Rochester, flourished. Before long, New York City had become the busiest port in the nation.</p>"}, {"stem": "Which of these events happened <b>LAST</b>?", "opts": ["Clinton poured a barrel of Lake Erie water into New York Harbor.", "DeWitt Clinton proposed a canal from Lake Erie to the Hudson River.", "Crews blasted through a ridge of solid stone at Lockport.", "Laborers began digging the canal in 1817."], "ci": 0, "exp": "The third paragraph says that when the canal “finally opened” in 1825, “Clinton celebrated by pouring a barrel of Lake Erie water into New York Harbor.” The Lockport blasting happened during construction, before the opening.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Clinton’s Ditch</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods from the Great Lakes to New York City was slow and expensive. Wagons crept along muddy roads, and shipping a ton of flour could cost more than the flour itself. New York governor DeWitt Clinton proposed an ambitious solution: a canal connecting Lake Erie to the Hudson River, which flowed south to the city. Many people mocked the plan as “Clinton’s Ditch,” because the route stretched across 363 miles of forest, swamp, and rock.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, dug the channel with shovels, axes, and horse-drawn plows. At Lockport, crews blasted through a ridge of solid stone and built a staircase of locks that raised boats about 60 feet.</p><p style=\"margin:0 0 8px;\">In 1825, the canal finally opened, and Clinton celebrated by pouring a barrel of Lake Erie water into New York Harbor. Shipping costs plummeted by about 90 percent, and towns along the route, such as Buffalo and Rochester, flourished. Before long, New York City had become the busiest port in the nation.</p>"}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["The locks at Lockport raised boats about 60 feet.", "The canal connected Lake Erie to the Hudson River.", "Workers used shovels, axes, and horse-drawn plows.", "The canal opened to boats in 1817."], "ci": 3, "exp": "The passage says “Construction began in 1817” and “In 1825, the canal finally opened.” The other three statements match the passage exactly.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>Clinton’s Ditch</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods from the Great Lakes to New York City was slow and expensive. Wagons crept along muddy roads, and shipping a ton of flour could cost more than the flour itself. New York governor DeWitt Clinton proposed an ambitious solution: a canal connecting Lake Erie to the Hudson River, which flowed south to the city. Many people mocked the plan as “Clinton’s Ditch,” because the route stretched across 363 miles of forest, swamp, and rock.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, dug the channel with shovels, axes, and horse-drawn plows. At Lockport, crews blasted through a ridge of solid stone and built a staircase of locks that raised boats about 60 feet.</p><p style=\"margin:0 0 8px;\">In 1825, the canal finally opened, and Clinton celebrated by pouring a barrel of Lake Erie water into New York Harbor. Shipping costs plummeted by about 90 percent, and towns along the route, such as Buffalo and Rochester, flourished. Before long, New York City had become the busiest port in the nation.</p>"}, {"stem": "Read this sentence from the passage: “Shipping costs <b>plummeted</b> by about 90 percent.” What does <b>plummeted</b> mean?", "opts": ["rose slowly but steadily", "became harder to predict", "stayed about the same", "dropped quickly and sharply"], "ci": 3, "exp": "Costs changing “by about 90 percent” after the canal made shipping easier shows a huge, fast drop. “Rose slowly” is the opposite direction, and nothing in the passage says costs stayed the same.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Clinton’s Ditch</strong><br><p style=\"margin:0 0 8px;\">In the early 1800s, moving goods from the Great Lakes to New York City was slow and expensive. Wagons crept along muddy roads, and shipping a ton of flour could cost more than the flour itself. New York governor DeWitt Clinton proposed an ambitious solution: a canal connecting Lake Erie to the Hudson River, which flowed south to the city. Many people mocked the plan as “Clinton’s Ditch,” because the route stretched across 363 miles of forest, swamp, and rock.</p><p style=\"margin:0 0 8px;\">Construction began in 1817. Thousands of laborers, many of them Irish immigrants, dug the channel with shovels, axes, and horse-drawn plows. At Lockport, crews blasted through a ridge of solid stone and built a staircase of locks that raised boats about 60 feet.</p><p style=\"margin:0 0 8px;\">In 1825, the canal finally opened, and Clinton celebrated by pouring a barrel of Lake Erie water into New York Harbor. Shipping costs plummeted by about 90 percent, and towns along the route, such as Buffalo and Rochester, flourished. Before long, New York City had become the busiest port in the nation.</p>"}, {"stem": "According to the passage, in which direction is the Pacific Plate moving?", "opts": ["northwest", "due south", "southeast", "northeast"], "ci": 0, "exp": "The third paragraph says the plate “creeps northwest about three to four inches each year.” Southeast is where the youngest island, the Big Island, lies, not the direction of the plate.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>Islands from a Hot Spot</strong><br><p style=\"margin:0 0 8px;\">The Hawaiian Islands stretch across the Pacific Ocean for about 1,500 miles, yet no collision of continents created them. Deep beneath the Pacific Plate, a column of unusually hot rock rises from far inside Earth. Geologists call this place a hot spot.</p><p style=\"margin:0 0 8px;\">Where the rising rock nears the surface, some of it melts into magma that erupts through the seafloor. Layer upon layer of cooled lava gradually builds a mountain, and after hundreds of thousands of years, its summit breaks through the waves as a new island.</p><p style=\"margin:0 0 8px;\">The hot spot, however, stays in place while the Pacific Plate creeps northwest about three to four inches each year. As the plate moves, each volcano is carried away from its supply of magma. It becomes dormant and slowly erodes, while a new volcano begins to grow above the hot spot. This explains why the oldest large islands, such as Kauai, lie to the northwest, while the Big Island, which still has active volcanoes, lies to the southeast.</p>"}, {"stem": "According to the passage, why does each volcano eventually stop erupting?", "opts": ["The hot spot moves northwest to a new location.", "The moving plate carries it away from its supply of magma.", "Cold ocean water slowly cools the magma inside it.", "Its summit grows too tall to rise above the waves."], "ci": 1, "exp": "The passage says “As the plate moves, each volcano is carried away from its supply of magma. It becomes dormant.” The hot spot itself “stays in place,” so it is the plate, not the hot spot, that moves.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>Islands from a Hot Spot</strong><br><p style=\"margin:0 0 8px;\">The Hawaiian Islands stretch across the Pacific Ocean for about 1,500 miles, yet no collision of continents created them. Deep beneath the Pacific Plate, a column of unusually hot rock rises from far inside Earth. Geologists call this place a hot spot.</p><p style=\"margin:0 0 8px;\">Where the rising rock nears the surface, some of it melts into magma that erupts through the seafloor. Layer upon layer of cooled lava gradually builds a mountain, and after hundreds of thousands of years, its summit breaks through the waves as a new island.</p><p style=\"margin:0 0 8px;\">The hot spot, however, stays in place while the Pacific Plate creeps northwest about three to four inches each year. As the plate moves, each volcano is carried away from its supply of magma. It becomes dormant and slowly erodes, while a new volcano begins to grow above the hot spot. This explains why the oldest large islands, such as Kauai, lie to the northwest, while the Big Island, which still has active volcanoes, lies to the southeast.</p>"}, {"stem": "Which word means the <b>OPPOSITE</b> of “<b>dormant</b>” as it is used in the passage?", "opts": ["active", "ancient", "inactive", "sleeping"], "ci": 0, "exp": "A <i>dormant</i> volcano is quiet and no longer erupting. The passage contrasts it with the Big Island, “which still has active volcanoes,” so the opposite is <i>active</i>. <i>Inactive</i> and <i>sleeping</i> mean nearly the same as dormant.", "tag": "Antonym", "tagcolor": "#185FA5", "passage": "<strong>Islands from a Hot Spot</strong><br><p style=\"margin:0 0 8px;\">The Hawaiian Islands stretch across the Pacific Ocean for about 1,500 miles, yet no collision of continents created them. Deep beneath the Pacific Plate, a column of unusually hot rock rises from far inside Earth. Geologists call this place a hot spot.</p><p style=\"margin:0 0 8px;\">Where the rising rock nears the surface, some of it melts into magma that erupts through the seafloor. Layer upon layer of cooled lava gradually builds a mountain, and after hundreds of thousands of years, its summit breaks through the waves as a new island.</p><p style=\"margin:0 0 8px;\">The hot spot, however, stays in place while the Pacific Plate creeps northwest about three to four inches each year. As the plate moves, each volcano is carried away from its supply of magma. It becomes dormant and slowly erodes, while a new volcano begins to grow above the hot spot. This explains why the oldest large islands, such as Kauai, lie to the northwest, while the Big Island, which still has active volcanoes, lies to the southeast.</p>"}, {"stem": "The word <b>unusually</b> begins with the prefix <i>un-</i>. What does “<b>unusually</b> hot rock” mean?", "opts": ["rock that is not hot at all", "rock that has always been hot", "rock that is hotter than is normal", "rock that is hot only some of the time"], "ci": 2, "exp": "The prefix <i>un-</i> means “not,” so <i>unusually</i> means “in a way that is not usual.” The rock is not normal; it is much hotter than ordinary rock. It does not mean the rock is “not hot.”", "tag": "Word Parts", "tagcolor": "#185FA5", "passage": "<strong>Islands from a Hot Spot</strong><br><p style=\"margin:0 0 8px;\">The Hawaiian Islands stretch across the Pacific Ocean for about 1,500 miles, yet no collision of continents created them. Deep beneath the Pacific Plate, a column of unusually hot rock rises from far inside Earth. Geologists call this place a hot spot.</p><p style=\"margin:0 0 8px;\">Where the rising rock nears the surface, some of it melts into magma that erupts through the seafloor. Layer upon layer of cooled lava gradually builds a mountain, and after hundreds of thousands of years, its summit breaks through the waves as a new island.</p><p style=\"margin:0 0 8px;\">The hot spot, however, stays in place while the Pacific Plate creeps northwest about three to four inches each year. As the plate moves, each volcano is carried away from its supply of magma. It becomes dormant and slowly erodes, while a new volcano begins to grow above the hot spot. This explains why the oldest large islands, such as Kauai, lie to the northwest, while the Big Island, which still has active volcanoes, lies to the southeast.</p>"}, {"stem": "Which word means the <b>SAME</b> or nearly the same as “<b>stalling</b>” as it is used in the story?", "opts": ["hurrying", "complaining", "delaying", "bragging"], "ci": 2, "exp": "Owen has chalked his hands “for the third time” and is staring at the route instead of climbing, so Jada says he is <i>stalling</i>: putting off starting. <i>Hurrying</i> means the opposite.", "tag": "Synonym", "tagcolor": "#185FA5", "passage": "<strong>Just a Tuesday</strong><br><p style=\"margin:0 0 8px;\">Owen chalked his hands for the third time and stared up at the purple route. It was the final climb of the Riverside Youth Bouldering Contest, and every competitor before him had slipped at the same overhang near the top.</p><p style=\"margin:0 0 8px;\">“You’re stalling,” his friend Jada said, nudging him. “You’ve practiced that move a hundred times.”</p><p style=\"margin:0 0 8px;\">“Practicing is different,” Owen muttered. “Nobody was watching then.”</p><p style=\"margin:0 0 8px;\">Coach Ortiz knelt beside him. “Forget the crowd. Climb it the way you’d climb it on a Tuesday afternoon, one hold at a time.”</p><p style=\"margin:0 0 8px;\">Owen nodded and began. His legs trembled at the overhang, and for a moment his fingers started to slide. Instead of lunging, he paused, shifted his hip closer to the wall, and reached deliberately for the next hold. It held. Three moves later, he slapped the top with both hands.</p><p style=\"margin:0 0 8px;\">The gym erupted, but Owen barely heard it. He was grinning at Coach Ortiz, who simply raised one thumb, as if to say, <i>Just a Tuesday.</i></p>"}, {"stem": "What did Owen do right after his fingers started to slide?", "opts": ["He slapped the top of the route with both hands.", "He paused and shifted his hip closer to the wall.", "He lunged quickly for the next hold.", "He chalked his hands one more time."], "ci": 1, "exp": "The passage says, “Instead of lunging, he paused, shifted his hip closer to the wall, and reached deliberately for the next hold.” He chalked his hands before he started, and he slapped the top three moves later.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "<strong>Just a Tuesday</strong><br><p style=\"margin:0 0 8px;\">Owen chalked his hands for the third time and stared up at the purple route. It was the final climb of the Riverside Youth Bouldering Contest, and every competitor before him had slipped at the same overhang near the top.</p><p style=\"margin:0 0 8px;\">“You’re stalling,” his friend Jada said, nudging -old Lena Harlow lived at Seal Ledge Light, a stone tower on a rocky island off the coast of Maine. Each evening at sunset, she climbed eighty-one steps behind her father to light the great lamp. Through the night, they took turns trimming the wick and carrying cans of oil up the spiral stairs so that the beam would never diminish. During winter storms, waves sometimes swept across the island, and the family could not reach the mainland for weeks. Lena knew that if the light went out, a ship could strike the ledge.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Today, most American lighthouses operate without keepers. At Point Avery Light, an LED lamp switches on by itself when a sensor detects darkness, and backup batteries keep it glowing if the power fails. Coast Guard technicians visit only a few times a year to inspect the equipment. Many ships now rely chiefly on GPS, yet the Coast Guard still maintains lighthouses, because electronics can fail and a steady light in the right place remains a dependable guide. Some towers that are no longer needed have become museums where visitors can climb the stairs.</p>"}, {"stem": "In Passage A, what does <b>diminish</b> mean in “so that the beam would never <b>diminish</b>”?", "opts": ["move to a new place", "become weaker or smaller", "flash on and off", "change to a different color"], "ci": 1, "exp": "Lena and her father trimmed the wick and carried oil all night so the light would stay strong. <i>Diminish</i> means to get smaller or weaker.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>Keepers of the Light</strong><br><strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1886, twelve-year-old Lena Harlow lived at Seal Ledge Light, a stone tower on a rocky island off the coast of Maine. Each evening at sunset, she climbed eighty-one steps behind her father to light the great lamp. Through the night, they took turns trimming the wick and carrying cans of oil up the ena knew that if the light went out, a ship could strike the ledge.</p><strong>Passage B</strong><br><p style=\"margin:0 0 8px;\">Today, most American lighthouses operate without keepers. At Point Avery Light, an LED lamp switches on by itself when a sensor detects darkness, and backup batteries keep it glowing if the power fails. Coast Guard technicians visit only a few times a year to inspect the equipment. Many ships now rely chiefly on GPS, yet the Coast Guard still maintains lighthouses, because electronics can fail and a steady light in the right place remains a dependable guide. Some towers that are no longer needed have become museums where visitors can climb the stairs.</p>"}, {"stem": "How is keeping the light in Passage A different from keeping the light in Passage B?", "opts": ["In Passage A the lamp ran on batteries, but in Passage B it burns oil.", "In Passage A a family tended the lamp all night, but in Passage B machines run it and people visit only a few times a year.", "In both passages, keepers live at the lighthouse all year long.", "In Passage A ships used GPS, but in Passage B they depend only on the light."], "ci": 1, "exp": "Passage A describes Lena and her father taking turns “through the night,” while Passage B says the lamp “switches on by itself” and technicians visit “only a few times a year.” Oil belongs to Passage A and batteries to Passage B, not the other way around.", "tag": "Compare Texts", "tagcolor": "#185FA5", "passage": "<strong>Keepers of the Light</strong><br><strong>Passage A</strong><br><p style=\"margin:0 0 8px;\">In 1886, twelve-year-old Lena Harlow lived at Seal Ledge Light, a stone tower on a rocky island off the coast of Maine. Each evening at sunset, she climbed eighty-one steps behind her father to light the great lamp. Through the night, they took turns trimming the wick and carrying cans of oil up the spiral stairs so that the beam would never diminish. During winter storms, waves sometimes swept across the island, var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';

function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
