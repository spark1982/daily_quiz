var TITLE = "[Grant] Grammar";

var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261030";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "has drawn", "will draw", "drew"], "ci": 3, "exp": "Keep the tense the same. The email tells about last weekend (<i>carved</i>, <i>scooped</i>), so use the past tense: <i>then Dad <b>drew</b> a face on each one.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Email to Cousin Theo</strong><br><b>(1)</b> Hi Theo, last weekend my dad and I carved three pumpkins on the back porch. <b>(2)</b> First, we scooped out the slimy seeds, and then Dad <u>draws</u> a face on each one with a marker. <b>(3)</b> By the end of the night, we <u>had ate</u> a whole bowl of roasted pumpkin seeds. <b>(4)</b> My pumpkin's grin turned out <u>real</u> spooky, with sharp, crooked teeth. <b>(5)</b> When the candles were lit the whole porch glowed orange. <b>(6)</b> I will send you a picture tomorrow so you can see them!"}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["had eat", "NO CHANGE", "had eaten", "have ate"], "ci": 2, "exp": "After <i>had</i>, use the past participle. <i>Eat</i> is irregular: eat → ate → eaten. So: <i>we <b>had eaten</b> a whole bowl.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Email to Cousin Theo</strong><br><b>(1)</b> Hi Theo, last weekend my dad and I carved three pumpkins on the back porch. <b>(2)</b> First, we scooped out the slimy seeds, and then Dad <u>draws</u> a face on each one with a marker. <b>(3)</b> By the end of the night, we <u>had ate</u> a whole bowl of roasted pumpkin seeds. <b>(4)</b> My pumpkin's grin turned out <u>real</u> spooky, with sharp, crooked teeth. <b>(5)</b> When the candles were lit the whole porch glowed orange. <b>(6)</b> I will send you a picture tomorrow so you can see them!"}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["really", "NO CHANGE", "realer", "more real"], "ci": 0, "exp": "To describe how spooky the grin was, use the adverb <i>really</i>, not the adjective <i>real</i>. So: <i>turned out <b>really</b> spooky.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>Email to Cousin Theo</strong><br><b>(1)</b> Hi Theo, last weekend my dad and I carved three pumpkins on the back porch. <b>(2)</b> First, we scooped out the slimy seeds, and then Dad <u>draws</u> a face on each one with a marker. <b>(3)</b> By the end of the night, we <u>had ate</u> a whole bowl of roasted pumpkin seeds. <b>(4)</b> My pumpkin's grin turned out <u>real</u> spooky, with sharp, crooked teeth. <b>(5)</b> When the candles were lit the whole porch glowed orange. <b>(6)</b> I will send you a picture tomorrow so you can see them!"}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["When, the candles were lit the whole porch glowed orange.", "When the candles were lit the whole porch, glowed orange.", "When the candles were lit, the whole porch glowed orange.", "When the candles, were lit the whole porch glowed orange."], "ci": 2, "exp": "Put a comma after an opening part that starts with <i>When</i>: <i>When the candles were lit<b>,</b> the whole porch glowed orange.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Email to Cousin Theo</strong><br><b>(1)</b> Hi Theo, last weekend my dad and I carved three pumpkins on the back porch. <b>(2)</b> First, we scooped out the slimy seeds, and then Dad <u>draws</u> a face on each one with a marker. <b>(3)</b> By the end of the night, we <u>had ate</u> a whole bowl of roasted pumpkin seeds. <b>(4)</b> My pumpkin's grin turned out <u>real</u> spooky, with sharp, crooked teeth. <b>(5)</b> When the candles were lit the whole porch glowed orange. <b>(6)</b> I will send you a picture tomorrow so you can see them!"}, {"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["whose", "where", "NO CHANGE", "that"], "ci": 3, "exp": "Use <i>who</i> for people. For animals and things, use <i>that</i> (or <i>which</i>). So: <i>Spiders are animals <b>that</b> make silk.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>Report: How Spiders Build Webs</strong><br><b>(1)</b> Spiders are animals <u>who</u> make silk inside their own bodies. <b>(2)</b> The silk comes out of tiny tubes called spinnerets. <b>(3)</b> A garden spider usually builds a new web every night. <b>(4)</b> Each of the spider's threads are stronger than a steel wire of the same thickness. <b>(5)</b> The spider walks only on the dry threads. <b>(6)</b> Because the sticky ones would trap it too. <b>(7)</b> If a web gets torn, the spider <u>can</u> fix it in less than an hour."}, {"stem": "Which sentence has an error?", "opts": ["Each of the spider's threads are stronger than a steel wire of the same thickness.", "The silk comes out of tiny tubes called spinnerets.", "If a web gets torn, the spider can fix it in less than an hour.", "A garden spider usually builds a new web every night."], "ci": 0, "exp": "With <i>each</i>, the verb must be singular, even though <i>threads</i> comes right before it. So: <i>Each of the spider's threads <b>is</b> stronger than a steel wire of the same thickness.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Report: How Spiders Build Webs</strong><br><b>(1)</b> Spiders are animals <u>who</u> make silk inside their own bodies. <b>(2)</b> The silk comes out of tiny tubes called spinnerets. <b>(3)</b> A garden spider usually builds a new web every night. <b>(4)</b> Each of the spider's threads are stronger than a steel wire of the same thickness. <b>(5)</b> The spider walks only on the dry threads. <b>(6)</b> Because the sticky ones would trap it too. <b>(7)</b> If a web gets torn, the spider <u>can</u> fix it in less than an hour."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["The spider walks only on the dry threads, the sticky ones would trap it too.", "The spider walks only on the dry threads because the sticky ones would trap it too.", "Because the spider walks only on the dry threads the sticky ones would trap it too.", "The spider walks only on the dry threads, so the sticky ones would trap it too."], "ci": 1, "exp": "Sentence 6 is a fragment: it starts with <i>Because</i> and cannot stand alone. Join it to the sentence it explains: <i>The spider walks only on the dry threads <b>because</b> the sticky ones would trap it too.</i> Using <i>so</i> would flip the reason and the result.", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>Report: How Spiders Build Webs</strong><br><b>(1)</b> Spiders are animals <u>who</u> make silk inside their own bodies. <b>(2)</b> The silk comes out of tiny tubes called spinnerets. <b>(3)</b> A garden spider usually builds a new web every night. <b>(4)</b> Each of the spider's threads are stronger than a steel wire of the same thickness. <b>(5)</b> The spider walks only on the dry threads. <b>(6)</b> Because the sticky ones would trap it too. <b>(7)</b> If a web gets torn, the spider <u>can</u> fix it in less than an hour."}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["NO CHANGE", "cans", "could of", "can of"], "ci": 0, "exp": "<i>Can</i> is correct here: it shows the spider is able to fix the web. Helping verbs like <i>can</i> never take an -s, and <i>could of</i> is a mistake for <i>could have</i>.", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>Report: How Spiders Build Webs</strong><br><b>(1)</b> Spiders are animals <u>who</u> make silk inside their own bodies. <b>(2)</b> The silk comes out of tiny tubes called spinnerets. <b>(3)</b> A garden spider usually builds a new web every night. <b>(4)</b> Each of the spider's threads are stronger than a steel wire of the same thickness. <b>(5)</b> The spider walks only on the dry threads. <b>(6)</b> Because the sticky ones would trap it too. <b>(7)</b> If a web gets torn, the spider <u>can</u> fix it in less than an hour."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["\"Take a deep breath before you start\".", "\"Take a deep breath before you start.\"", "\"take a deep breath before you start\".", "NO CHANGE"], "ci": 1, "exp": "A quotation that is a full sentence starts with a capital letter, and the period goes <b>inside</b> the closing quotation mark: <i>said, \"<b>T</b>ake a deep breath before you start<b>.</b>\"</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>Piano Recital Journal</strong><br><b>(1)</b> Today was my first piano recital at Lincoln Music School. <b>(2)</b> My teacher, Ms. Park, said, <u>\"take a deep breath before you start.\"</u> <b>(3)</b> <u>Its</u> hard to play when your hands are shaking! <b>(4)</b> My little brother and <u>I</u> sat in the front row before my turn. <b>(5)</b> When I finished, everyone clapped, and I <u>should</u> finally smile. <b>(6)</b> Next year I want to play a longer, harder song by Mozart for the whole school."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["It is's", "NO CHANGE", "It's", "Its'"], "ci": 2, "exp": "<i>It's</i> means <i>it is</i>. <i>Its</i> (no apostrophe) shows ownership, like <i>its tail</i>. Here the sentence means <i>It is hard to play</i>, so write <i><b>It's</b> hard to play.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Piano Recital Journal</strong><br><b>(1)</b> Today was my first piano recital at Lincoln Music School. <b>(2)</b> My teacher, Ms. Park, said, <u>\"take a deep breath before you start.\"</u> <b>(3)</b> <u>Its</u> hard to play when your hands are shaking! <b>(4)</b> My little brother and <u>I</u> sat in the front row before my turn. <b>(5)</b> When I finished, everyone clapped, and I <u>should</u> fina var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
