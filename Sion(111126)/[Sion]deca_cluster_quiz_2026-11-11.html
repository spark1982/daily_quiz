<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261111";
var RAW_QUESTIONS = [{"stem": "A small company spends $8,000 on new accounting software. In the first year, the software saves the company $9,200 in labor costs. What is the return on investment (ROI) for the first year?", "opts": ["15%", "12%", "87%", "115%"], "ci": 0, "exp": "ROI = (gain − cost) ÷ cost. The net gain is $9,200 − $8,000 = $1,200, and $1,200 ÷ $8,000 = 0.15, or 15%. Choosing 115% divides the total savings by the cost without subtracting the cost."}, {"stem": "A car-insurance agency spends extra time helping a long-time customer, even though this one call will not earn the agency any new money. Which idea best explains why this is a smart business decision?", "opts": ["Diminishing returns: each extra minute of service adds more profit than the last.", "Price discrimination: loyal customers can always be charged more.", "Market saturation: there are no new customers left to find.", "Customer lifetime value: keeping a loyal customer brings revenue for many years and costs less than finding a new one."], "ci": 3, "exp": "Customer lifetime value is the total profit a customer brings over the whole relationship. Keeping an existing customer is usually cheaper than attracting a new one, so service that builds loyalty pays off over time."}, {"stem": "Over one year, prices in a town rise by about 4%, but Leah’s paycheck rises by only 2%. What most likely happened to Leah’s real income?", "opts": ["It stayed the same, because real income only changes when you switch jobs.", "It rose by 6%, because both numbers went up.", "It rose by 2%, because her paycheck got bigger.", "It fell, because her pay can buy fewer goods and services than before."], "ci": 3, "exp": "Real income measures purchasing power, so you compare pay growth with price growth. Prices grew faster (4%) than pay (2%), so Leah can buy less than before: her real income fell by roughly 2%."}, {"stem": "Rosa, who owns a small bakery, tells her flour supplier, \"Because you have been so reliable, I will give you a free wedding cake next month.\" Later she changes her mind. Why can the supplier most likely NOT enforce this promise as a contract?", "opts": ["The promise was made orally, and all contracts must be written.", "The promise lacks consideration because the supplier gave nothing in exchange for the cake.", "The supplier is a business, and businesses cannot receive gifts.", "Rosa is the owner, so she is not personally bound by her promises."], "ci": 1, "exp": "A contract needs consideration: each side gives something of value. Rosa offered a gift and asked for nothing in return, so there is no bargain to enforce. Many oral contracts are valid, so the lack of a written document is not the reason."}, {"stem": "Nina is writing a SWOT analysis for her new bike-repair shop. A large sporting-goods chain plans to open a repair counter two blocks away. Where does this belong in her SWOT analysis?", "opts": ["Strength, because competition always means she is better", "Threat, because it is an outside factor that could hurt her business", "Opportunity, because any new store is good for her", "Weakness, because it is a problem inside her business"], "ci": 1, "exp": "SWOT sorts factors into internal (strengths and weaknesses) and external (opportunities and threats). A new competitor is outside Nina’s control and could take customers, so it is a threat."}, {"stem": "During a team meeting, a coworker presents an idea that Andre developed and does not mention him. Which response shows the strongest emotional intelligence?", "opts": ["Interrupt the meeting to announce that the idea was stolen.", "Complain about the coworker to other team members after the meeting.", "Stay calm in the meeting, then talk with the coworker privately and ask that future updates credit both of them.", "Say nothing ever, because conflict is always harmful at work."], "ci": 2, "exp": "Emotional intelligence includes self-control (not reacting angrily in public) and handling conflict directly and respectfully. A private, specific conversation solves the problem without embarrassing anyone. Staying silent forever leaves the problem unsolved."}, {"stem": "In a role-play, you recommend that a fintech savings app spend most of its budget on short videos on social media. The judge asks, \"Why social media instead of TV ads?\" Which answer is strongest?", "opts": ["\"TV ads are old-fashioned, so no one watches them anymore.\"", "\"Our target market is ages 18 to 30, and most of them use social video daily. Social ads also cost less per view and let us track sign-ups, so we can shift money to what works.\"", "\"Social media is popular, and everyone is on it these days.\"", "\"We could do both, so let’s just double the budget.\""], "ci": 1, "exp": "A strong answer to a judge’s follow-up question connects the choice to the target market and gives specific, measurable reasons (cost, tracking). General claims like \"everyone is on it\" are vague, and doubling the budget avoids the question."}, {"stem": "Marcus buys a new toaster from an appliance store. The store never made any written promises, but the toaster will not heat at all. Which legal idea best supports Marcus’s right to a refund or replacement?", "opts": ["A disclaimer, which requires the store to repair any product it sells", "The doctrine of caveat emptor, which protects buyers from all defects", "An express warranty, because the store clerk smiled when he bought it", "The implied warranty of merchantability, which means goods sold by a merchant must work for their ordinary purpose"], "ci": 3, "exp": "When a merchant sells goods, the law assumes (implies) a promise that the goods are fit for their ordinary use, even if nothing was written. An express warranty requires a specific stated promise, and caveat emptor (\"let the buyer beware\") actually favors sellers."}, {"stem": "Ethan is interested in a career in financial planning. He asks a certified financial planner for a 20-minute meeting to learn about her job. What is the main purpose of this informational interview?", "opts": ["To gather information and advice about the career, not to ask for a job", "To be hired on the spot if he impresses her", "To sell her a product or service", "To test whether she is good at her job"], "ci": 0, "exp": "An informational interview is a short conversation to learn about a career, the skills it needs, and how to enter it. It can build a network, but it is not a job interview."}, {"stem": "A judge’s performance indicator is \"Explain the nature of effective verbal communications.\" You are playing a bank branch supervisor coaching a new teller. Which statement would best address this indicator in the role-play?", "opts": ["\"Verbal communication means talking. It is the opposite of written communication.\"", "\"Speak quickly so the line keeps moving, and members will understand the important parts.\"", "\"Our bank has the best tellers in the county, so members always trust what we say.\"", "\"Effective verbal communication is clear, concise, and suited to the listener. When a member asks about a hold, use plain words instead of banking terms, then check that they understood.\""], "ci": 3, "exp": "A strong role-play answer explains the concept (clear, concise, adapted to the listener) and applies it to the situation (a member asking about a hold). Defining \"talking\" is too shallow, and speaking quickly works against clarity."}, {"stem": "Jada needs to email her manager about a scheduling conflict for Friday’s training. Which subject line is most effective?", "opts": ["\"Question\"", "\"Request: Move my Friday 2 p.m. training to Monday\"", "\"Hi!!! Quick thing about this week\"", "\"URGENT PLEASE READ RIGHT AWAY\""], "ci": 1, "exp": "An effective subject line is specific and tells the reader the purpose and key details before opening the email. Vague or all-caps subject lines are unclear or seem unprofessional."}, {"stem": "A regional bank studies how the top-rated bank in the country handles loan applications so it can copy and improve its own process. What is this practice called?", "opts": ["Benchmarking", "Outsourcing", "Downsizing", "Diversification"], "ci": 0, "exp": "Benchmarking means comparing your processes or results with those of leading organizations to find ways to improve. Outsourcing means hiring another company to do the work."}, {"stem": "A sporting-goods store keeps 40 extra pairs of a popular running shoe in its back room in case a big race causes a sudden rush of buyers. What is this extra inventory called?", "opts": ["Safety stock", "Consignment stock", "Just-in-time inventory", "Obsolete inventory"], "ci": 0, "exp": "Safety stock is extra inventory kept to protect against unexpected demand or late deliveries. Just-in-time inventory works the opposite way by keeping as little stock as possible."}, {"stem": "A judge’s performance indicator is \"Demonstrate a customer service mindset.\" In the role-play, a credit union member is upset about a $35 overdraft fee. Which response best shows this mindset?", "opts": ["\"I understand how frustrating a surprise fee is. Let me look at your account history with you, explain why it was charged, and show you a free low-balance alert so this does not happen again.\"", "\"Fees are how the credit union pays its staff, so every member has to accept them.\"", "\"I will remove every fee you ever get, no matter what, because the member is always right.\"", "\"The fee is in the account agreement you signed, so there is nothing I can do.\""], "ci": 0, "exp": "A customer service mindset means showing empathy, explaining clearly, and helping prevent the problem, while staying within policy. Refusing to engage ignores the member, and promising to remove every fee is a promise the business cannot keep."}, {"stem": "A credit union’s ATMs keep breaking down on busy weekends, and repairs happen only after a machine stops working. Which change would best reduce breakdowns?", "opts": ["Put up signs apologizing for broken machines.", "Close the ATMs on weekends to avoid breakdowns.", "Wait until more ATMs break so they can all be fixed at once.", "Schedule preventive maintenance to service the ATMs regularly before problems occur."], "ci": 3, "exp": "Preventive maintenance is planned, routine service that catches problems before equipment fails. The other choices either accept the breakdowns or remove the service members need."}, {"stem": "A local bank sponsors a youth soccer league, and the newspaper writes a story about the bank’s support without the bank paying for the article. Which part of the promotional mix does the newspaper story represent?", "opts": ["Publicity, a form of public relations", "Sales promotion", "Paid advertising", "Personal selling"], "ci": 0, "exp": "Publicity is unpaid media coverage, and it is part of public relations. Advertising is paid, personal selling is one-on-one, and sales promotions are short-term incentives like coupons."}, {"stem": "In a role-play, you propose that a credit union open a new branch. The judge asks, \"Why is now the right time to expand?\" Which answer is strongest?", "opts": ["\"Because our board probably wants to grow.\"", "\"Membership in that area grew 12% last year, the nearest branch has 20-minute waits, and our reserves can cover the cost. Opening now lets us serve those members before a competitor does.\"", "\"I am not sure, but I think it would be exciting.\"", "\"Expanding is always good for any business.\""], "ci": 1, "exp": "A strong response to a judge uses specific evidence (demand, current problems, financial readiness) and explains why timing matters. Vague or unsure answers do not show strategic thinking."}, {"stem": "A bank’s hiring manager writes: \"Applicants must have a high school diploma, two years of cash-handling experience, and strong attention to detail.\" What is this list called?", "opts": ["A job specification", "A performance appraisal", "An employee handbook", "A job description"], "ci": 0, "exp": "A job specification lists the qualifications a person needs (education, experience, skills). A job description explains the duties of the job itself, and a performance appraisal evaluates someone who already works there."}, {"stem": "Which of these is the best example of a SMART goal for a student preparing for a DECA competition?", "opts": ["\"I will practice two role-plays each week and score at least 80 out of 100 on a practice judge form by January 15.\"", "\"I will become the best DECA member ever.\"", "\"I want to get better at role-plays.\"", "\"I will practice sometimes before the competition.\""], "ci": 0, "exp": "A SMART goal is Specific, Measurable, Achievable, Relevant, and Time-bound. Only the first goal names an action, a measurable score, and a deadline."}, {"stem": "Loan officers at a credit union keep typing dates in different ways (11/12/26, Nov 12, 2026-11-12), which causes errors in reports. Which solution best prevents this problem?", "opts": ["Ask officers to double-check dates when they have extra time.", "Delete all old records that used the wrong format.", "Add a data-validation rule so the date field accepts only one format.", "Print the reports on paper so errors are easier to see."], "ci": 2, "exp": "Data validation controls what can be entered in a field, so mistakes are blocked at the start. Asking people to be more careful is helpful but unreliable, and deleting records destroys useful data."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
