<head>

<title>[Sion] Math Competition</title>
<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f4f6fa; margin:0; padding: 20px 12px 60px; color:#1a1a2e; }
  .quiz-wrap { max-width: 680px; margin: 0 auto; }
  .quiz-title { font-size: 1.4rem; font-weight: 800; text-align:center; margin: 8px 0 2px; color:#111; }
  .instruction { text-align:center; color:#555; font-size:0.92rem; margin-bottom: 14px; min-height: 0; }
  .nav-bar { background:#fff; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

  #nav-count { font-weight:700; font-size:0.85rem; color:#333; white-space:nowrap; }
  .progress-track { flex:1; height:6px; background:#d7dde6; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:#185FA5; border-radius:3px; transition: width .2s; }
  .jump-btn { background:#eef2f7; border:none; border-radius:8px; padding:6px 12px; font-size:0.8rem; font-weight:700; color:#185FA5; cursor:pointer; white-space:nowrap; }
  .dots-panel { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; cursor:pointer; background:#d7dde6; color:#555; border:none; }
  .dot.answered-correct { background:#185FA5; color:#fff; }
  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="quiz-title">[Sion] Math Competition</div>
  <div class="instruction" id="instruction"></div>

  <div class="nav-bar">
    <div class="nav-summary">
      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>
    <div class="dots-panel" id="dots-panel" style="display:none;"></div>
  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

  <div class="quiz-card" id="quiz-card">
    <div class="q-position" id="q-position"></div>
    <div class="passage-box" id="passage-box" style="display:none;"></div>
    <div class="context-label" id="context-label" style="display:none;"></div>
    <div class="context-box" id="context-box" style="display:none;"></div>
    <div class="tag-badge" id="tag-badge" style="display:none;"></div>

      <button class="btn-retry" onclick="startRetry()">Retry Wrong Ones</button>
      <button class="btn-fresh" onclick="openFreshModal()">Start Fresh</button>

  <button class="fresh-btn-bottom" onclick="openFreshModal()">Start Fresh</button>
</div>

  </div>
</div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261111";
var RAW_QUESTIONS = [{"stem": "Pete bought a notebook containing 96 pages, and numbered them from 1 through 192. Victor tore out 25 pages of Pete&rsquo;<i>s</i> notebook, and added the 50 numbers he found on the pages. Could Victor get 1990 as the sum? (Russia)", "opts": ["no", "yes"], "ci": 0, "exp": "<b>What we need</b><br>The notebook has 96 sheets (leaves), and the page numbers go 1 through 192, two per sheet. Victor tears out 25 sheets, so he sees 50 page numbers. Can those 50 numbers add up to 1990?<br><br><b>Step 1: Look at one sheet.</b> The first sheet has pages 1 and 2, the second sheet has pages 3 and 4, and in general sheet number <i>k</i> has pages 2<i>k</i> &minus; 1 and 2<i>k</i>. Their sum is (2<i>k</i> &minus; 1) + 2<i>k</i> = 4<i>k</i> &minus; 1. The key fact is not the exact value but its parity: 4<i>k</i> &minus; 1 is always <b>odd</b> (an even number minus 1).<br><br><b>Step 2: Add 25 sheets.</b> Victor's total is the sum of 25 odd numbers (one for each torn sheet). Odd + odd = even, so every pair of sheets gives an even amount; 25 sheets = 12 pairs + 1 extra sheet, so the total is even + odd = <b>odd</b>.<br><br><b>Step 3: Compare with 1990.</b> 1990 is even, but Victor's sum must be odd. So Victor could not get 1990. The answer is <b>no</b>.<br><br><b>Answer check</b><br>Small example: tear out sheets 1, 2, 3 (pages 1&ndash;6): sum = 3 + 7 + 11 = 21, odd. With 25 sheets the smallest possible sum is 3 + 7 + &hellip; + 99 = 25 &times; 51 = 1275 and the largest is 4(72 + 73 + &hellip; + 96) &minus; 25 = 4 &times; 2100 &minus; 25 = 8375, so 1990 is in range &mdash; size alone cannot rule it out. Only the parity argument does.<br><br><b>Trap</b><br>Thinking each torn page is one number. A sheet always carries two consecutive numbers, and that pairing is what forces the odd total.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "Ben's clock reads 5:37. When is the next time the angle between the hour hand and the minute hand will be the same as it is now?", "opts": ["6:01", "6:49", "6:10", "6:23"], "ci": 3, "exp": "<b>What we need</b><br>Find the angle between the hands at 5:37, then the first later time when the angle is exactly the same.<br><br><b>Step 1: Angle at 5:37.</b> The minute hand moves 6&deg; per minute: 37 &times; 6&deg; = 222&deg; (measured clockwise from 12). The hour hand moves 30&deg; per hour plus 0.5&deg; per minute: 5 &times; 30&deg; + 37 &times; 0.5&deg; = 150&deg; + 18.5&deg; = 168.5&deg;. The minute hand is 222&deg; &minus; 168.5&deg; = 53.5&deg; ahead of the hour hand.<br><br><b>Step 2: How the gap changes.</b> The minute hand gains 6&deg; &minus; 0.5&deg; = 5.5&deg; per minute on the hour hand. The angle between the hands is 53.5&deg; again when the minute hand is 53.5&deg; <i>behind</i> the hour hand, which means it is 360&deg; &minus; 53.5&deg; = 306.5&deg; ahead. (Waiting until it is 53.5&deg; ahead again would take a full 360&deg; lap, which is much later.)<br><br><b>Step 3: Time needed.</b> The lead must grow from 53.5&deg; to 306.5&deg;, an increase of 253&deg;. Time = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>253</span><span style=\"border-top:1.4px solid #111;\">5.5</span></span> = 46 minutes. 5:37 + 46 minutes = <b>6:23</b>.<br><br><b>Answer check</b><br>At 6:23: minute hand 23 &times; 6&deg; = 138&deg;; hour hand 180&deg; + 23 &times; 0.5&deg; = 191.5&deg;. The difference is 191.5&deg; &minus; 138&deg; = 53.5&deg;. &#10003; A computer check of every minute from 5:38 onward also finds 6:23 as the first match.<br><br><b>Trap</b><br>Forgetting that the hour hand also moves during the minutes (using 150&deg; instead of 168.5&deg;), or looking only for the time when the minute hand is ahead by 53.5&deg; again.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Evaluate<br><br><span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 4px;\"><span style=\"font-size:0.68em;\">&infin;</span><span style=\"font-size:1.5em;margin:1px 0;\">&Sigma;</span><span style=\"font-size:0.6em;white-space:nowrap;\"><i>n</i>=3</span></span> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i></span></span>. (Purple Comet)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">72</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">48</span></span>"], "ci": 0, "exp": "<b>What we need</b><br>The exact value of the infinite sum of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i></span></span> for <i>n</i> = 3, 4, 5, &hellip;<br><br><b>Step 1: Factor the denominator.</b> <i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i> = <i>n</i>(<i>n</i><sup>4</sup> &minus; 5<i>n</i><sup>2</sup> + 4) = <i>n</i>(<i>n</i><sup>2</sup> &minus; 1)(<i>n</i><sup>2</sup> &minus; 4) = (<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2). It is a product of five consecutive integers. (This is why the sum starts at <i>n</i> = 3: for <i>n</i> = 1 or 2 the denominator is 0.)<br><br><b>Step 2: Split into a telescoping difference.</b> Let <i>A</i> = (<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1) and <i>B</i> = (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2). Then <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>B</i> &minus; <i>A</i></span><span style=\"border-top:1.4px solid #111;\"><i>AB</i></span></span>. Both <i>A</i> and <i>B</i> contain (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1), so <i>B</i> &minus; <i>A</i> = (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)[(<i>n</i> + 2) &minus; (<i>n</i> &minus; 2)] = 4(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1). Dividing, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2)</span></span>. So each term equals <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span>).<br><br><b>Step 3: Telescope.</b> Write <i>g</i>(<i>n</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)</span></span>. Then <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <i>g</i>(<i>n</i> + 1), and the sum is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>[(<i>g</i>(3) &minus; <i>g</i>(4)) + (<i>g</i>(4) &minus; <i>g</i>(5)) + &hellip;]. Everything cancels except <i>g</i>(3), because <i>g</i>(<i>n</i>) &rarr; 0 as <i>n</i> grows. <i>g</i>(3) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">1 &times; 2 &times; 3 &times; 4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span>.<br><br><b>Step 4: Finish.</b> Sum = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>.<br><br><b>Answer check</b><br>First term (<i>n</i> = 3): <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">1 &times; 2 &times; 3 &times; 4 &times; 5</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span> &asymp; 0.00833; adding <i>n</i> = 4 (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">720</span></span>) and <i>n</i> = 5 (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2520</span></span>) gives about 0.01012, already close to <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span> &asymp; 0.01042. A computer sum of the first 2000 terms agrees with <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span> to 12 decimal places.<br><br><b>Trap</b><br>Stopping at the first term (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span>), or forgetting the factor <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> and answering <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span>-type values such as <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">48</span></span> or <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">72</span></span>.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "The polynomial 1&minus;<i>x</i>+<i>x</i><sup>2</sup>&minus;<i>x</i><sup>3</sup>+&hellip;+<i>x</i><sup>16</sup>&minus;<i>x</i><sup>17</sup> may be written in the form <i>a</i><sub>0</sub>+<i>a</i><sub>1</sub><i>y</i>+<i>a</i><sub>2</sub><i>y</i><sup>2</sup>+<i>a</i><sub>3</sub><i>y</i><sup>3</sup>+&hellip;+<i>a</i><sub>16</sub><i>y</i><sup>16</sup>+<i>a</i><sub>17</sub><i>y</i><sup>17</sup>, where <i>y</i>=<i>x</i>+1 and the <i>a</i><sub><i>i</i></sub>'s are constants. Find the value of <i>a</i><sub>2</sub>. (AIME)", "opts": ["153", "171", "816", "680"], "ci": 2, "exp": "<b>What we need</b><br>Rewrite the polynomial in powers of <i>y</i> = <i>x</i> + 1 and read off the coefficient <i>a</i><sub>2</sub> of <i>y</i><sup>2</sup>.<br><br><b>Step 1: Use the geometric-series formula.</b> The terms 1, &minus;<i>x</i>, <i>x</i><sup>2</sup>, &hellip;, &minus;<i>x</i><sup>17</sup> form a geometric series with first term 1, ratio &minus;<i>x</i>, and 18 terms. So<br>1 &minus; <i>x</i> + <i>x</i><sup>2</sup> &minus; &hellip; &minus; <i>x</i><sup>17</sup> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; (&minus;<i>x</i>)<sup>18</sup></span><span style=\"border-top:1.4px solid #111;\">1 &minus; (&minus;<i>x</i>)</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; <i>x</i><sup>18</sup></span><span style=\"border-top:1.4px solid #111;\">1 + <i>x</i></span></span>.<br><br><b>Step 2: Substitute <i>x</i> = <i>y</i> &minus; 1.</b> The denominator 1 + <i>x</i> becomes <i>y</i>, so the polynomial equals <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &minus; (<i>y</i> &minus; 1)<sup>18</sup></span><span style=\"border-top:1.4px solid #111;\"><i>y</i></span></span>.<br><br><b>Step 3: Find which term of the numerator gives <i>y</i><sup>2</sup>.</b> Dividing by <i>y</i> lowers every power by 1, so <i>a</i><sub>2</sub> is the coefficient of <i>y</i><sup>3</sup> in 1 &minus; (<i>y</i> &minus; 1)<sup>18</sup>. By the binomial theorem, the <i>y</i><sup>3</sup> term of (<i>y</i> &minus; 1)<sup>18</sup> is <i>C</i>(18, 3) &middot; <i>y</i><sup>3</sup> &middot; (&minus;1)<sup>15</sup> = &minus;<i>C</i>(18, 3)<i>y</i><sup>3</sup>. With the minus sign in front, the coefficient becomes +<i>C</i>(18, 3).<br><br><b>Step 4: Compute.</b> <i>C</i>(18, 3) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>18 &times; 17 &times; 16</span><span style=\"border-top:1.4px solid #111;\">3 &times; 2 &times; 1</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4896</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = 816.<br><br><b>Answer check</b><br>Expanding the original polynomial directly in <i>y</i> by computer gives <i>a</i><sub>2</sub> = 816. Also, the constant term 1 cancels: 1 &minus; (<i>y</i> &minus; 1)<sup>18</sup> has constant term 1 &minus; 1 = 0, so the division by <i>y</i> is exact, as it must be.<br><br><b>Trap</b><br>Taking <i>C</i>(18, 2) = 153 (forgetting that dividing by <i>y</i> shifts the power by one), or <i>C</i>(19, 2) = 171 or <i>C</i>(17, 3) = 680 from miscounting the 18 terms.", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Find the remainder when <i>x</i><sup>81</sup> + <i>x</i><sup>49</sup> + <i>x</i><sup>25</sup> + <i>x</i><sup>9</sup> + <i>x</i> is divided by <i>x</i><sup>3</sup> &minus; <i>x</i>.", "opts": ["-5<i>x</i>", "5", "<i>x</i>", "5<i>x</i>"], "ci": 3, "exp": "<b>What we need</b><br>The remainder when <i>f</i>(<i>x</i>) = <i>x</i><sup>81</sup> + <i>x</i><sup>49</sup> + <i>x</i><sup>25</sup> + <i>x</i><sup>9</sup> + <i>x</i> is divided by <i>x</i><sup>3</sup> &minus; <i>x</i>.<br><br><b>Step 1: Form of the remainder.</b> The divisor has degree 3, so the remainder has degree at most 2: write it as <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i>. Then <i>f</i>(<i>x</i>) = (<i>x</i><sup>3</sup> &minus; <i>x</i>)<i>q</i>(<i>x</i>) + <i>ax</i><sup>2</sup> + <i>bx</i> + <i>c</i> for some polynomial <i>q</i>.<br><br><b>Step 2: Plug in the roots of the divisor.</b> <i>x</i><sup>3</sup> &minus; <i>x</i> = <i>x</i>(<i>x</i> &minus; 1)(<i>x</i> + 1) is zero at <i>x</i> = 0, 1, &minus;1, so at those points <i>f</i> equals the remainder.<br>&bull; <i>x</i> = 0: <i>f</i>(0) = 0, so <i>c</i> = 0.<br>&bull; <i>x</i> = 1: <i>f</i>(1) = 1 + 1 + 1 + 1 + 1 = 5, so <i>a</i> + <i>b</i> + <i>c</i> = 5, giving <i>a</i> + <i>b</i> = 5.<br>&bull; <i>x</i> = &minus;1: every exponent (81, 49, 25, 9, 1) is odd, so each term is &minus;1 and <i>f</i>(&minus;1) = &minus;5. So <i>a</i> &minus; <i>b</i> + <i>c</i> = &minus;5, giving <i>a</i> &minus; <i>b</i> = &minus;5.<br><br><b>Step 3: Solve.</b> Adding the two equations: 2<i>a</i> = 0, so <i>a</i> = 0. Then <i>b</i> = 5. The remainder is <b>5<i>x</i></b>.<br><br><b>Answer check</b><br>Another way: <i>x</i><sup>3</sup> &equiv; <i>x</i> (mod <i>x</i><sup>3</sup> &minus; <i>x</i>), so every odd power <i>x</i><sup>2<i>k</i>+1</sup> = <i>x</i> &middot; (<i>x</i><sup>2</sup>)<sup><i>k</i></sup> reduces to <i>x</i> (because <i>x</i><sup>3</sup> = <i>x</i> means <i>x</i><sup>2</sup> acts like 1 when multiplied by <i>x</i>). Five odd-power terms give 5<i>x</i>. Polynomial division by computer also gives 5<i>x</i>.<br><br><b>Trap</b><br>Answering 5 (forgetting that each term reduces to <i>x</i>, not 1), or &minus;5<i>x</i> (using <i>f</i>(&minus;1) with the wrong sign).", "tag": "Chapter 4", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
