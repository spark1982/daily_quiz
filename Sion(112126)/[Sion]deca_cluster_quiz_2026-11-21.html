<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261121";
var RAW_QUESTIONS = [{"stem": "Lakeside Insurance Agency had current assets of $240,000 and current liabilities of $160,000. What is the agency&rsquo;s current ratio?", "opts": ["$80,000", "1.5 : 1", "0.67 : 1", "2.5 : 1"], "ci": 1, "exp": "<b>Current ratio</b> = current assets &divide; current liabilities = $240,000 &divide; $160,000 = 1.5, written 1.5 : 1. Dividing the other way gives 0.67; $80,000 is the difference (working capital), not a ratio."}, {"stem": "A branch manager emails all tellers about a new cash-drawer procedure. Several tellers reply that they are confused because the email uses abbreviations only the operations department understands. What communication barrier caused the problem?", "opts": ["Information overload from too many messages", "Technical jargon the audience did not share", "Emotional resistance to the sender", "Physical distance between sender and receivers"], "ci": 1, "exp": "<b>Jargon</b> is specialized vocabulary that people outside a group do not understand. The tellers were confused specifically by department abbreviations. The other barriers are real but not described in the situation."}, {"stem": "A credit union stores members&rsquo; account information in a database. Which practice best protects the confidentiality of this information?", "opts": ["Giving each employee access only to the data needed for his or her job", "Printing daily copies of all account records for backup", "Sharing one password among all branch staff to save time", "Allowing employees to email files to personal accounts to work from home"], "ci": 0, "exp": "Limiting access based on job need (<b>least-privilege access</b>) protects confidentiality. Shared passwords, piles of printouts, and personal email accounts all increase the chance that private data is exposed."}, {"stem": "Jordan, a bank intern, wants to become a financial analyst. He asks a senior analyst to meet with him monthly to give career advice and feedback on his work. This relationship is best described as", "opts": ["mentoring", "job shadowing for one day", "an informational interview", "networking with a stranger"], "ci": 0, "exp": "<b>Mentoring</b> is an ongoing relationship in which an experienced person guides someone&rsquo;s development. Job shadowing and informational interviews are usually one-time events, and the senior analyst is not a stranger."}, {"stem": "A marketing analyst at an investment firm wants to know why young adults are not opening retirement accounts. She holds a small-group discussion with eight young adults and asks open-ended questions. This research method is called a(n)", "opts": ["experiment", "census", "observation study", "focus group"], "ci": 3, "exp": "A <b>focus group</b> is a guided discussion with a small group to explore attitudes and reasons. An experiment changes a variable and measures results; a census collects data from an entire population; observation records behavior without questioning."}, {"stem": "During a tense team meeting, Marcus notices that he feels his face getting hot after a coworker criticizes his budget report. Before responding, he takes a breath and recognizes that he is feeling defensive. Which emotional-intelligence skill is Marcus demonstrating first?", "opts": ["Motivation", "Self-awareness", "Social skill", "Empathy"], "ci": 1, "exp": "<b>Self-awareness</b> is recognizing your own emotions as they happen. Marcus first identifies his own feeling (defensiveness). Empathy is understanding others&rsquo; feelings; social skill is managing relationships; motivation is inner drive toward goals."}, {"stem": "Which of the following is a characteristic most commonly associated with successful entrepreneurs?", "opts": ["Reluctance to make decisions without a supervisor", "Willingness to take calculated risks", "Desire for a guaranteed, fixed salary", "Preference for avoiding all uncertainty"], "ci": 1, "exp": "Successful entrepreneurs typically accept <b>calculated risks</b>&mdash;risks they have studied and judged worthwhile. Avoiding all uncertainty, needing a supervisor&rsquo;s approval, and wanting a guaranteed salary are more typical of employees than of business founders."}, {"stem": "A judge&rsquo;s performance indicator is &ldquo;Describe the nature of budgets.&rdquo; In the role-play, you are advising the owner of a small accounting firm whose expenses rose unexpectedly last quarter. Which response best addresses the performance indicator?", "opts": ["&ldquo;You should hire an additional accountant so the work gets done faster.&rdquo;", "&ldquo;A budget is a record of what a business already spent last year, so it cannot help with future costs.&rdquo;", "&ldquo;A budget is your plan for expected income and spending over a period. If you compare each month&rsquo;s actual costs to the budget, you&rsquo;ll spot a rise like last quarter&rsquo;s early and can adjust before it hurts your cash.&rdquo;", "&ldquo;Budgets are one of the most important tools in finance, and every business needs one.&rdquo;"], "ci": 2, "exp": "A strong answer <b>describes what a budget is and ties it to the client&rsquo;s situation</b> (monitoring actual vs. planned costs to catch the expense increase). The general praise is too vague, hiring is off-topic, and describing a budget as only a record of past spending is incorrect&mdash;budgets are forward-looking plans."}, {"stem": "A bank wants to know whether its new tellers can actually perform transactions correctly before they work alone at the counter. Which hiring or training practice best meets this goal?", "opts": ["A skills assessment in which candidates process sample transactions", "Reviewing candidates&rsquo; social media profiles", "Checking that candidates live near the branch", "Asking candidates to describe their hobbies"], "ci": 0, "exp": "A <b>skills (performance) assessment</b> directly measures whether a person can do the job tasks. Social media, hobbies, and commuting distance do not show transaction accuracy."}, {"stem": "A judge&rsquo;s performance indicator for a role-play is &ldquo;Explain the role of customer service as a component of selling relationships.&rdquo; The situation involves a bank that is losing small-business customers. Which statement would best address this performance indicator?", "opts": ["&ldquo;When our bankers follow up after every loan and solve problems quickly, owners trust us, and that trust is what keeps them borrowing and opening new accounts with us instead of switching banks.&rdquo;", "&ldquo;Customer service is defined as the assistance a business provides to customers before, during, and after a purchase.&rdquo;", "&ldquo;We should lower our loan interest rates so that small businesses have no reason to leave.&rdquo;", "&ldquo;Customer service is mainly the job of the front desk, so the sales team should focus only on closing new accounts.&rdquo;"], "ci": 0, "exp": "A strong PI response <b>explains the concept and applies it to the situation</b>: service builds trust, and trust sustains the selling relationship with small-business owners. A memorized definition alone does not connect to the bank&rsquo;s problem; cutting rates is a pricing decision, not customer service; and saying service is only the front desk&rsquo;s job misstates the concept."}, {"stem": "Priya works as a loan officer for Harbor Credit Union. When she signs a loan agreement with a member on the credit union&rsquo;s behalf, the credit union&mdash;not Priya personally&mdash;is bound by the agreement. In this relationship, Priya is acting as the credit union&rsquo;s", "opts": ["agent", "guarantor", "creditor", "principal"], "ci": 0, "exp": "In an <b>agency relationship</b>, the <i>agent</i> (Priya) acts on behalf of the <i>principal</i> (the credit union), and the principal is bound by contracts the agent makes within her authority. A guarantor promises to pay someone else&rsquo;s debt; a creditor is owed money."}, {"stem": "In a role-play, you are a bank operations manager who has proposed moving some routine services to self-service kiosks. The judge asks, &ldquo;Won&rsquo;t older customers be upset that they can&rsquo;t see a teller?&rdquo; Which response is best?", "opts": ["&ldquo;We could cancel the kiosk plan if even one customer complains.&rdquo;", "&ldquo;I don&rsquo;t think that will be a problem.&rdquo;", "&ldquo;We&rsquo;ll keep teller windows open for anyone who prefers them, and for the first month an employee will stand by the kiosks to help customers try them, so no one is forced to change.&rdquo;", "&ldquo;Older customers will just have to get used to technology like everyone else.&rdquo;"], "ci": 2, "exp": "A strong reply <b>acknowledges the concern and gives a specific, realistic solution</b> (keep tellers available, offer guided help). Dismissing customers, giving a vague denial, or abandoning the plan at the first complaint all show poor judgment."}, {"stem": "An accounting office notices that its printing paper often runs out before new orders arrive. Which operations practice would best prevent this problem?", "opts": ["Asking employees to bring paper from home", "Setting a reorder point so paper is ordered when supply falls to a certain level", "Ordering paper only after it has completely run out", "Buying a full year&rsquo;s supply every week"], "ci": 1, "exp": "A <b>reorder point</b> triggers a new order early enough that supplies arrive before running out. Waiting until stock is gone causes the problem; the other choices are impractical or wasteful."}, {"stem": "In a role-play, you have recommended that a credit union promote its new car loans through local high-school sports sponsorships. The judge asks, &ldquo;Why would sponsoring high-school games help sell car loans?&rdquo; Which response is best?", "opts": ["&ldquo;The parents and older students at those games are exactly the people buying first cars, and seeing our name at events they care about builds trust in our community, so we&rsquo;ll be the first lender they think of.&rdquo;", "&ldquo;Sponsorships are a popular kind of promotion that many companies use.&rdquo;", "&ldquo;We could also offer every family at the games a free car loan to make it more attractive.&rdquo;", "&ldquo;That&rsquo;s a good question. I&rsquo;d have to research that before giving an answer.&rdquo;"], "ci": 0, "exp": "The best answer to a judge&rsquo;s question is <b>specific, tied to the situation, and confident</b>: it identifies the target audience at the games and explains how the sponsorship builds trust and awareness. A general statement does not answer &ldquo;why,&rdquo; dodging the question loses points, and promising free loans is an unrealistic new commitment."}, {"stem": "An insurance company&rsquo;s leaders decide that within three years they want 40 percent of new policies to be sold online. They then plan the steps, budget, and staff needed to reach that goal. This process is called", "opts": ["quality control", "strategic planning", "operational scheduling", "market research"], "ci": 1, "exp": "<b>Strategic planning</b> sets long-term goals for the whole organization and decides how to reach them. Operational scheduling covers day-to-day tasks; quality control checks output; market research gathers information."}, {"stem": "Two college students start a business that helps teenagers open their first savings accounts through a mobile app. They test a simple version of the app with 30 users before spending money on advanced features. This approach mainly helps the entrepreneurs", "opts": ["guarantee that the business will earn a profit in its first year", "avoid the need to find any customers", "eliminate all competition from established banks", "reduce risk by learning what users need before investing heavily"], "ci": 3, "exp": "Testing a basic version with real users first lets entrepreneurs gather feedback and <b>reduce risk</b> before committing more money. No approach guarantees profit or eliminates competition, and the test itself depends on finding customers."}, {"stem": "A financial firm pays its customer-service representatives a base wage plus a bonus for each account problem they resolve on the first call. This compensation approach is designed mainly to", "opts": ["reduce the total amount the company spends on wages", "reward employees for performance the company wants to encourage", "make all employees&rsquo; pay exactly equal", "replace the need for employee training"], "ci": 1, "exp": "<b>Incentive pay</b> links part of compensation to specific results (first-call resolution), motivating that behavior. It may or may not lower costs, it purposely creates differences in pay, and it does not replace training."}, {"stem": "When the price of gasoline rose sharply, a delivery company found that its customers kept ordering about the same number of deliveries. This suggests that demand for the company&rsquo;s deliveries is", "opts": ["in surplus", "relatively inelastic", "perfectly elastic", "relatively elastic"], "ci": 1, "exp": "Demand is <b>inelastic</b> when quantity demanded changes little as price changes. Customers kept ordering about the same amount despite higher costs passed on to them. Elastic demand would show large drops in quantity; a surplus is a supply-side condition."}, {"stem": "A new financial adviser keeps interrupting clients to explain investment products before they finish describing their goals. Clients often leave meetings looking frustrated. Which emotional-intelligence skill would most help the adviser improve?", "opts": ["Empathy, by listening closely to understand each client&rsquo;s feelings and needs", "Self-regulation, by hiding all of his own emotions during meetings", "Motivation, by setting a higher personal sales target", "Self-awareness, by keeping a journal about his career goals"], "ci": 0, "exp": "The problem is that the adviser does not understand his clients&rsquo; perspectives. <b>Empathy</b>&mdash;tuning in to others&rsquo; feelings and needs&mdash;directly addresses that. Hiding emotions, higher targets, or career journaling do not fix the failure to listen."}, {"stem": "A regional bank divides its market into college students, young families, and retirees, and then designs different account packages for each group. This is an example of", "opts": ["product recall", "market segmentation", "mass marketing", "price discrimination"], "ci": 1, "exp": "<b>Market segmentation</b> divides a market into groups with similar needs and targets each with its own marketing mix. Mass marketing treats everyone the same; the other choices are unrelated."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-14 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* exam-mode 2026-11-14 */
(function(){
  function examActive(){ return !state.reported && !(activeSet && activeSet.length); }
  window.EXAM_ACTIVE = examActive;
  var banner = document.createElement('div'); banner.className = 'exam-banner'; banner.id = 'exam-banner';
  banner.innerHTML = '&#128221; <b>Test mode</b> &mdash; like a real test: no answers or explanations until you finish. You can change your answers until you press Finish.';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(banner, card);
  var _pick = window.pick;
  window.pick = function(idx){
    if(!examActive()) return _pick(idx);
    if(state.showResults) return;
    var qi = activeOrder()[state.cur];
    state.answers[qi] = idx; saveState(); render();
  };
  function maskDots(){
    var ds = document.querySelectorAll('#dots-panel .dot');
    for(var i=0;i<ds.length;i++){ var d=ds[i]; if(d.classList.contains('answered-correct')||d.classList.contains('answered-wrong')){ d.classList.remove('answered-correct','answered-wrong'); d.classList.add('answered-exam'); } }
  }
  function mask(){
    var on = examActive() && !state.showResults;
    banner.style.display = on ? 'block' : 'none';
    if(!on) return;
    var qi = activeOrder()[state.cur];
    var btns = document.querySelectorAll('#options .opt-btn');
    for(var i=0;i<btns.length;i++){ (function(b, idx){
      b.classList.remove('reveal-correct','selected-wrong','selected-correct','exam-selected');
      b.disabled = false;
      b.onclick = function(){ window.pick(idx); };
      if(state.answers[qi] === idx) b.classList.add('exam-selected');
    })(btns[i], i); }
    var eb = document.getElementById('exp-box'); if(eb){ eb.style.display='none'; eb.innerHTML=''; }
    maskDots();
  }
  var _render = window.render;
  window.render = function(){ var r = _render.apply(this, arguments); try{ mask(); }catch(e){} return r; };
  var _tj = window.toggleJump;
  window.toggleJump = function(){ var r = _tj.apply(this, arguments); try{ if(examActive() && !state.showResults) maskDots(); }catch(e){} return r; };
  render();
})();
</script>
