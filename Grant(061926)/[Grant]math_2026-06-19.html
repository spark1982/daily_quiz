<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Math</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.date-hd{text-align:center;font-size:2rem;font-weight:800;color:#1D9E75;padding:6px 0;}
.title-hd{text-align:center;font-size:1.3rem;font-weight:700;margin:4px 0 2px;color:#111;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
.attempts-hd{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;}
.tag-badge{display:inline-block;color:#fff;font-size:0.74rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:10px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.q-text{font-size:1.05rem;font-weight:600;color:#111;margin-bottom:14px;line-height:1.6;}
.opt-btn{display:block;width:100%;padding:11px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#eef6f1;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.6;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#eef6f1;color:#1D9E75;}
.next-btn{background:#1D9E75;color:#fff;}
.prog-track{background:#d7e9e1;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#1D9E75;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#eef6f1;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#eef6f1;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
.fr{display:inline-block;vertical-align:middle;text-align:center;font-style:italic;}
.fr .fn,.fr .fd{display:block;font-size:0.78em;line-height:1.25;padding:0 3px;}
.fr .fb{display:block;border-top:1.5px solid currentColor;min-width:14px;}
</style>
</head>
<body>
<div class="date-hd">2026-06-19</div>
<div class="title-hd">[Grant] Math</div>
<div class="instruction">Solve each problem and choose the correct answer.</div>
<div class="attempts-hd" id="att-display">Total Attempts: 0</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / 20</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #1D9E75;border-radius:14px;background:#fff;color:#1D9E75;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div class="tag-badge" id="tag-badge"></div>
  <div class="q-num" id="q-num"></div>
  <div class="q-text" id="q-text"></div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#1D9E75;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal()" style="display:block;width:100%;padding:13px;background:#eef6f1;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#eef6f1;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){
var QUIZ_KEY='quiz_grantmath_20_20260618_v1';
var ATT_KEY='quiz_grantmath_att_20260618_v1';
var CAT_COLORS={'Fractions':'#6B3FA0','Decimals':'#185FA5','Integers':'#1D7A4A','Unit Conversion':'#C05600','Exponent Rules':'#8B1A1A'};

function fr(n,d){return '<span class="fr"><span class="fn">'+n+'</span><span class="fb"></span><span class="fd">'+d+'</span></span>';}
function mx(w,n,d){return w+'&thinsp;'+fr(n,d);}

var qs=[
 {cat:'Fractions',q:'What is '+fr(2,3)+' + '+fr(1,4)+' &minus; '+fr(1,6)+' ?',
  opts:[fr(3,4),fr(5,6),fr(7,12),mx(1,1,12)],ci:0,
  exp:'Using twelfths: '+fr(8,12)+' + '+fr(3,12)+' &minus; '+fr(2,12)+' = '+fr(9,12)+' = '+fr(3,4)+'.'},
 {cat:'Fractions',q:'What is '+mx(1,3,4)+' &times; '+fr(2,5)+' + '+fr(1,10)+' ?',
  opts:[fr(4,5),fr(7,10),fr(9,10),fr(1,2)],ci:0,
  exp:'Convert '+mx(1,3,4)+' to '+fr(7,4)+'. Then '+fr(7,4)+' &times; '+fr(2,5)+' = '+fr(7,10)+', and '+fr(7,10)+' + '+fr(1,10)+' = '+fr(8,10)+' = '+fr(4,5)+'.'},
 {cat:'Fractions',q:'What is ('+fr(5,6)+' &minus; '+fr(1,2)+') &divide; '+fr(2,3)+' ?',
  opts:[fr(1,2),mx(1,1,2),fr(2,9),fr(1,4)],ci:0,
  exp:fr(5,6)+' &minus; '+fr(1,2)+' = '+fr(5,6)+' &minus; '+fr(3,6)+' = '+fr(2,6)+' = '+fr(1,3)+'. Dividing by '+fr(2,3)+' means multiplying by '+fr(3,2)+': '+fr(1,3)+' &times; '+fr(3,2)+' = '+fr(1,2)+'.'},
 {cat:'Fractions',q:'What is '+mx(2,2,5)+' &divide; '+fr(4,5)+' &minus; '+fr(1,2)+' ? (Express as a mixed number.)',
  opts:[mx(2,1,2),'3','8',mx(1,1,2)],ci:0,
  exp:'Convert '+mx(2,2,5)+' to '+fr(12,5)+'. Dividing by '+fr(4,5)+' means multiplying by '+fr(5,4)+': '+fr(12,5)+' &times; '+fr(5,4)+' = 3. Then 3 &minus; '+fr(1,2)+' = '+mx(2,1,2)+'.'},

 {cat:'Decimals',q:'What is 3.2 &times; 1.5 &minus; 0.4 ?',
  opts:['4.4','4.3','3.52','4.8'],ci:0,
  exp:'3.2 &times; 1.5 = 4.8, and 4.8 &minus; 0.4 = 4.4.'},
 {cat:'Decimals',q:'What is (4.8 + 1.2) &divide; 0.5 ?',
  opts:['12','7.2','3','1.2'],ci:0,
  exp:'4.8 + 1.2 = 6, and 6 &divide; 0.5 = 12.'},
 {cat:'Decimals',q:'What is 6.75 &minus; 2.5 &times; 1.2 ?',
  opts:['3.75','5.1','3.05','4.25'],ci:0,
  exp:'2.5 &times; 1.2 = 3, and 6.75 &minus; 3 = 3.75.'},
 {cat:'Decimals',q:'What is (9.6 &divide; 1.2) + 0.75 &times; 4 ?',
  opts:['11','12.75','5','2.29'],ci:0,
  exp:'9.6 &divide; 1.2 = 8, and 0.75 &times; 4 = 3. So 8 + 3 = 11.'},

 {cat:'Integers',q:'What is (&minus;6)&#x00B2; &minus; 4 &times; (&minus;3) ?',
  opts:['48','&minus;24','24','&minus;96'],ci:0,
  exp:'(&minus;6)&#x00B2; = 36, and 4 &times; (&minus;3) = &minus;12. So 36 &minus; (&minus;12) = 36 + 12 = 48.'},
 {cat:'Integers',q:'What is &minus;3&#x00B3; + 2 &times; (&minus;5) &minus; (&minus;7) ?',
  opts:['&minus;30','&minus;44','&minus;10','&minus;12'],ci:0,
  exp:'&minus;3&#x00B3; = &minus;27, and 2 &times; (&minus;5) = &minus;10. So &minus;27 + (&minus;10) &minus; (&minus;7) = &minus;27 &minus; 10 + 7 = &minus;30.'},
 {cat:'Integers',q:'What is (&minus;15 + 6) &divide; (&minus;3) + 2 &times; (&minus;4) ?',
  opts:['&minus;5','&minus;11','&minus;15','11'],ci:0,
  exp:'(&minus;15 + 6) = &minus;9, and &minus;9 &divide; (&minus;3) = 3. Also 2 &times; (&minus;4) = &minus;8. So 3 + (&minus;8) = &minus;5.'},
 {cat:'Integers',q:'What is 24 &divide; (&minus;4) &minus; (&minus;3)&#x00B2; + 5 ?',
  opts:['&minus;10','8','2','&minus;20'],ci:0,
  exp:'24 &divide; (&minus;4) = &minus;6. Also (&minus;3)&#x00B2; = 9. So &minus;6 &minus; 9 + 5 = &minus;10.'},

 {cat:'Unit Conversion',q:'How many meters are in '+mx(3,3,4)+' kilometers? (1 km = 1,000 m)',
  opts:['3,750 m','375 m','3,075 m','37,500 m'],ci:0,
  exp:mx(3,3,4)+' km = 3.75 km. 3.75 &times; 1,000 = 3,750 m.'},
 {cat:'Unit Conversion',q:'How many minutes are in '+mx(4,1,4)+' hours? (1 hour = 60 minutes)',
  opts:['255 min','240 min','265 min','260 min'],ci:0,
  exp:mx(4,1,4)+' hours = 4.25 hours. 4.25 &times; 60 = 255 minutes.'},
 {cat:'Unit Conversion',q:'How many grams are in '+mx(1,3,5)+' kilograms? (1 kg = 1,000 g)',
  opts:['1,600 g','1,000 g','1,500 g','1,060 g'],ci:0,
  exp:mx(1,3,5)+' kg = 1.6 kg. 1.6 &times; 1,000 = 1,600 g.'},
 {cat:'Unit Conversion',q:'A bottle holds '+mx(3,1,2)+' liters plus an extra 250 mL. What is the total in milliliters? (1 L = 1,000 mL)',
  opts:['3,750 mL','3,500 mL','3,250 mL','600 mL'],ci:0,
  exp:mx(3,1,2)+' L = 3.5 L = 3,500 mL. 3,500 + 250 = 3,750 mL.'},

 {cat:'Exponent Rules',q:'Simplify: m<sup>5</sup> &middot; m<sup>2</sup> &divide; m<sup>4</sup>',
  opts:['m<sup>3</sup>','m<sup>11</sup>','m<sup>7</sup>','m<sup>9</sup>'],ci:0,
  exp:'m&#x2075; &middot; m&#x00B2; = m&#x2077; (add exponents). Then m&#x2077; &divide; m&#x2074; = m&#x00B3; (subtract exponents).'},
 {cat:'Exponent Rules',q:'Simplify: (p<sup>3</sup>)<sup>2</sup> &middot; p &divide; p<sup>4</sup>',
  opts:['p<sup>3</sup>','p<sup>7</sup>','p<sup>2</sup>','p<sup>11</sup>'],ci:0,
  exp:'(p&#x00B3;)&#x00B2; = p&#x2076; (multiply exponents). Then p&#x2076; &middot; p = p&#x2077;. Finally p&#x2077; &divide; p&#x2074; = p&#x00B3;.'},
 {cat:'Exponent Rules',q:'Evaluate: 3<sup>2</sup> + 4<sup>2</sup> &minus; 5',
  opts:['20','17','12','25'],ci:0,
  exp:'3&#x00B2; = 9, and 4&#x00B2; = 16. So 9 + 16 &minus; 5 = 20.'},
 {cat:'Exponent Rules',q:'Simplify: (q<sup>2</sup>)<sup>3</sup> &divide; (q<sup>4</sup> &middot; q)',
  opts:['q','q<sup>2</sup>','1','q<sup>11</sup>'],ci:0,
  exp:'(q&#x00B2;)&#x00B3; = q&#x2076;. The denominator q&#x2074; &middot; q = q&#x2075;. Finally q&#x2076; &divide; q&#x2075; = q.'}
];

var state={};
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');
    if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<qs.length&&s.answers&&s.shuffles){state=s;}
    else resetState();
  }catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}
}
function resetState(){state={cur:0,answers:{},shuffles:{},showResults:false};}
function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}
function getShuffle(i){
  if(!state.shuffles[i]){
    var a=[0,1,2,3];
    for(var k=3;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}
    state.shuffles[i]=a; saveState();
  }
  return state.shuffles[i];
}
function getCSI(i){return getShuffle(i).indexOf(qs[i].ci);}
function loadAtt(){return parseInt(localStorage.getItem(ATT_KEY)||'0',10);}

function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}

function toggleJump(){
  var p=document.getElementById('dot-panel');
  var b=document.getElementById('jump-btn');
  if(p.style.display==='block'){p.style.display='none';b.innerHTML='Jump &#9662;';}
  else{p.style.display='block';b.innerHTML='Hide &#9652;';renderDots();}
}

function renderDots(){
  var p=document.getElementById('dot-panel');
  if(p.style.display!=='block')return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg=state.answers[i]===undefined?'#d7e9e1':(state.answers[i]===getCSI(i)?'#1D9E75':'#E24B4A');
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){
    h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#1D9E75;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML=h;
}

function goToQ(i){
  state.cur=i; state.showResults=false; saveState(); render();
  document.getElementById('dot-panel').style.display='none';
  document.getElementById('jump-btn').innerHTML='Jump &#9662;';
}

function showResults(){
  state.showResults=true;
  localStorage.setItem(ATT_KEY,loadAtt()+1);
  saveState(); render();
}

function render(){
  document.getElementById('att-display').textContent='Total Attempts: '+loadAtt();
  if(state.showResults){renderResults();return;}
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur; var q=qs[i];
  var badge=document.getElementById('tag-badge');
  badge.textContent=q.cat; badge.style.background=CAT_COLORS[q.cat];
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  document.getElementById('q-text').innerHTML=q.q;
  var sh=getShuffle(i); var ans=state.answers[i]; var csi=getCSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi=sh[s]; var cls='opt-btn'; var dis='';
    if(ans!==undefined){dis='disabled ';if(s===csi)cls+=' correct';else if(s===ans)cls+=' wrong';}
    html+='<button class="'+cls+'" '+dis+'onclick="pick('+i+','+s+')">'+q.opts[oi]+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');
  if(ans!==undefined){eb.style.display='block';eb.innerHTML=q.exp;}
  else{eb.style.display='none';}
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.querySelector('.prev-btn').disabled=(i===0);
}

function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]===undefined)sk++;
    else if(state.answers[i]===getCSI(i))c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML=
    '<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;'+
    '<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;'+
    '<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i]; var label,bg,tc;
    if(a===undefined){label='Skipped';bg='#d7e9e1';tc='#555';}
    else if(a===getCSI(i)){label='Correct';bg='#E1F5EE';tc='#085041';}
    else{label='Wrong';bg='#FCEBEB';tc='#501313';}
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;color:#333;">Q'+(i+1)+': '+qs[i].cat+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}

function pick(qi,si){if(state.answers[qi]!==undefined)return;state.answers[qi]=si;saveState();render();}
function go(dir){
  if(dir===1&&state.cur===qs.length-1){showResults();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));
  saveState();render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){
    if(state.answers[i]!==undefined&&state.answers[i]!==getCSI(i)){
      if(first===-1)first=i; delete state.answers[i];
    }
  }
  if(first!==-1){state.cur=first;state.showResults=false;saveState();render();}
}
function copyRes(){
  var lines=['[Grant] Math - Results (2026-06-19)'];
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];
    var label=a===undefined?'Skipped':(a===getCSI(i)?'Correct':'Wrong');
    lines.push('Q'+(i+1)+' ('+qs[i].cat+'): '+label);
  }
  var txt=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fallbackCopy(txt);});}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){document.getElementById('freshModal').style.display='none';localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();}

window.pick=pick;window.go=go;window.goToQ=goToQ;window.toggleJump=toggleJump;
window.retryWrong=retryWrong;window.copyRes=copyRes;window.openFreshModal=openFreshModal;
window.confirmFresh=confirmFresh;window.showResults=showResults;

loadState();saveState();render();
})();
</script>
</body>
</html>
