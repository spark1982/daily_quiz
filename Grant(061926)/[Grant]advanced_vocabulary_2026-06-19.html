<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Grant] Advanced Vocabulary</title>
<style>
*{box-sizing:border-box;}
body{margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;}
.date-hd{text-align:center;font-size:2rem;font-weight:800;color:#185FA5;padding:6px 0;}
.title-hd{text-align:center;font-size:1.3rem;font-weight:700;margin:4px 0 2px;color:#111;}
.instruction{text-align:center;font-size:0.88rem;color:#555;padding:4px 12px 10px;}
.attempts-hd{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;}
.tag-badge{display:inline-block;color:#fff;font-size:0.74rem;font-weight:700;padding:3px 10px;border-radius:12px;margin-bottom:10px;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.word-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.word-text{font-size:2rem;font-weight:800;color:#111;}
.speak-btn{background:#e8edf4;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;}
.q-context{background:#f0f4ff;border-left:4px solid #185FA5;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:0.9rem;color:#333;line-height:1.6;font-style:italic;}
.q-text{font-size:1rem;font-weight:600;color:#111;margin-bottom:14px;}
.opt-btn{display:block;width:100%;padding:11px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#eaf1f7;color:#111;font-size:0.95rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;line-height:1.6;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#eaf1f7;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.prog-track{background:#d6e2ec;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#eaf1f7;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#eaf1f7;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
</style>
</head>
<body>
<div class="date-hd">2026-06-19</div>
<div class="title-hd">[Grant] Advanced Vocabulary</div>
<div class="instruction">Read each word in context, then choose the meaning that fits best.</div>
<div class="attempts-hd" id="att-display">Total Attempts: 0</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / 20</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;">Jump &#9662;</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div class="tag-badge" id="tag-badge"></div>
  <div class="q-num" id="q-num"></div>
  <div class="word-row">
    <span class="word-text" id="q-word"></span>
    <button class="speak-btn" onclick="speakWord()" title="Listen">&#128264;</button>
  </div>
  <div class="q-context" id="q-context"></div>
  <div class="q-text">What does this word most nearly mean?</div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#185FA5;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal()" style="display:block;width:100%;padding:13px;background:#eaf1f7;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#eaf1f7;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){
var QUIZ_KEY   = 'quiz_grantadvvocab_20_20260618_v1';
var ATT_KEY    = 'quiz_grantadvvocab_20_20260618_att_v1';
var TTS_LANG   = 'en-US';
var QUIZ_LABEL = '[Grant] Advanced Vocabulary - Results';

var qs = [
  { tag:'New', stem:'abandon', sent:'The sailors had to abandon the sinking ship and swim to the lifeboats.',
    opts:['to leave behind completely or give up on','to repair something that is broken','to celebrate a major achievement','to carefully plan every detail of an event'],
    ci:0, exp:"Abandon means 'to leave behind completely or give up on,' fitting how the sailors had to leave the ship." },
  { tag:'New', stem:'federation', sent:'The federation of small countries agreed to share resources and defend one another.',
    opts:['a group of states or organizations joined under a central authority','a single nation with no outside allies','a temporary truce between rival armies','a private agreement between two businesses'],
    ci:0, exp:"Federation means 'a group of states or organizations joined under a central authority,' matching how the countries joined together." },
  { tag:'New', stem:'flourish', sent:'With enough sunlight and water, the garden began to flourish within just a few weeks.',
    opts:['to grow or develop successfully; to thrive','to decline slowly over time','to remain exactly the same without change','to disappear completely from view'],
    ci:0, exp:"Flourish means 'to grow or develop successfully; to thrive,' fitting how the garden thrived with sunlight and water." },
  { tag:'New', stem:'abundant', sent:'Fresh fruit was abundant at the market during the summer months.',
    opts:['existing in large quantities; plentiful','very rare and hard to find','expensive and difficult to afford','available only during winter'],
    ci:0, exp:"Abundant means 'existing in large quantities; plentiful,' matching how much fresh fruit was available." },
  { tag:'New', stem:'persuade', sent:'She tried to persuade her parents to let her go on the school trip.',
    opts:['to convince someone to do or believe something','to force someone to act against their will','to ignore someone\'s request completely','to record someone\'s opinion in writing'],
    ci:0, exp:"Persuade means 'to convince someone to do or believe something,' fitting how she tried to convince her parents." },
  { tag:'Review', stem:'universal', sent:'Kindness is often described as a universal value because nearly every culture admires it.',
    opts:['applying to all cases or existing everywhere','limited to only one small group','occurring only one time in history','difficult to explain in simple terms'],
    ci:0, exp:"Universal means 'applying to all cases or existing everywhere,' matching how nearly every culture admires kindness." },
  { tag:'Review', stem:'potential', sent:'Her coach believed she had the potential to become a national champion.',
    opts:['the capacity to develop or achieve something in the future','a mistake that cannot be corrected','a rule that must always be followed','a measurement of physical size'],
    ci:0, exp:"Potential means 'the capacity to develop or achieve something in the future,' fitting the coach's belief in her future success." },
  { tag:'Review', stem:'hierarchy', sent:"In the company's hierarchy, the regional managers report directly to the vice president.",
    opts:['a system in which people or things are ranked above one another','a group of people who all have equal authority','a written agreement between two countries','a method for measuring distance'],
    ci:0, exp:"Hierarchy means 'a system in which people or things are ranked above one another,' matching the ranked reporting structure." },
  { tag:'New', stem:'revolution', sent:'The invention of the printing press sparked a revolution in how information spread across Europe.',
    opts:['a dramatic and wide-reaching change','a small adjustment that affects very few people','a yearly celebration of a historical event','a formal disagreement between neighbors'],
    ci:0, exp:"Revolution means 'a dramatic and wide-reaching change,' fitting how the printing press transformed how information spread." },
  { tag:'Review', stem:'inequality', sent:'The report highlighted the inequality between schools that had modern labs and those that had none.',
    opts:['a lack of fairness or equal opportunity between groups','a strong agreement between two groups','a sudden increase in population','a type of mathematical equation'],
    ci:0, exp:"Inequality means 'a lack of fairness or equal opportunity between groups,' matching the unequal access to labs." },
  { tag:'New', stem:'sustainability', sent:"The farm switched to solar power as part of its plan for long-term sustainability.",
    opts:['the ability to maintain something without depleting resources over time','the speed at which something grows','the total cost of running a business','the process of repairing broken machinery'],
    ci:0, exp:"Sustainability means 'the ability to maintain something without depleting resources over time,' fitting the farm's long-term solar plan." },
  { tag:'New', stem:'mechanism', sent:'Voting is one mechanism citizens use to influence government decisions.',
    opts:['a system or process by which something works or is achieved','a tool used only for building machines','a written law passed by a legislature','a type of natural disaster'],
    ci:0, exp:"Mechanism means 'a system or process by which something works or is achieved,' matching how voting works as a process." },
  { tag:'New', stem:'facilitate', sent:'The new software was designed to facilitate communication between different departments.',
    opts:['to make a process easier','to make a process more complicated','to delay a decision indefinitely','to record information for later use'],
    ci:0, exp:"Facilitate means 'to make a process easier,' fitting how the software helped departments communicate." },
  { tag:'New', stem:'abolition', sent:'The abolition of the unfair tax brought relief to thousands of families.',
    opts:['the act of officially ending a system or practice','the creation of a brand-new system','a gradual increase in cost over time','a formal celebration of a tradition'],
    ci:0, exp:"Abolition means 'the act of officially ending a system or practice,' matching how ending the tax brought relief." },
  { tag:'New', stem:'abolish', sent:'Many countries worked together to abolish a practice that violated basic human rights.',
    opts:['to officially end or get rid of a law, system, or practice','to officially create a new law','to temporarily pause a practice','to celebrate a long-standing tradition'],
    ci:0, exp:"Abolish means 'to officially end or get rid of a law, system, or practice,' fitting how countries worked to end the unjust practice." },
  { tag:'Review', stem:'elaborate', sent:'The teacher asked the student to elaborate on her answer instead of just giving one word.',
    opts:['to explain something in greater detail','to shorten an explanation as much as possible','to disagree with someone\'s opinion','to memorize information without understanding it'],
    ci:0, exp:"Elaborate means 'to explain something in greater detail,' matching the teacher's request for more than one word." },
  { tag:'New', stem:'vulnerable', sent:'Without a fence, the young plants were vulnerable to being eaten by deer.',
    opts:['open to being harmed or affected','completely protected from any danger','extremely confident and self-assured','difficult to notice or find'],
    ci:0, exp:"Vulnerable means 'open to being harmed or affected,' fitting how the unprotected plants could easily be eaten." },
  { tag:'New', stem:'extinction', sent:'Conservationists are working to prevent the extinction of the species by protecting its habitat.',
    opts:['the complete disappearance of a species','a sudden increase in a species\' population','a temporary move to a new habitat','a change in an animal\'s diet'],
    ci:0, exp:"Extinction means 'the complete disappearance of a species,' matching what conservationists are trying to prevent." },
  { tag:'New', stem:'accommodate', sent:'The school added a ramp to accommodate students who use wheelchairs.',
    opts:['to make adjustments in order to fit someone\'s needs','to refuse a reasonable request','to ignore a person\'s needs completely','to charge extra for special services'],
    ci:0, exp:"Accommodate means 'to make adjustments in order to fit someone's needs,' matching why the school added the ramp." },
  { tag:'New', stem:'abstract', sent:'Concepts like justice and freedom are abstract and can be difficult to define.',
    opts:['existing as an idea rather than a physical, concrete object','able to be touched or physically measured','extremely simple and easy to explain','limited to a single specific example'],
    ci:0, exp:"Abstract means 'existing as an idea rather than a physical, concrete object,' fitting how justice and freedom are hard to define physically." }
];

var state = {};

function loadState() {
  try {
    var s = JSON.parse(localStorage.getItem(QUIZ_KEY) || 'null');
    if (s && typeof s.cur === 'number' && s.answers && s.shuffles) {
      state = s;
    } else {
      resetState();
    }
  } catch(e) {
    localStorage.removeItem(QUIZ_KEY);
    resetState();
  }
}

function resetState() {
  state = { cur: 0, answers: {}, shuffles: {}, showResults: false };
}

function saveState() {
  localStorage.setItem(QUIZ_KEY, JSON.stringify(state));
}

function getShuffle(i) {
  if (!state.shuffles[i]) {
    var a = [0, 1, 2, 3];
    for (var k = 3; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1));
      var t = a[k]; a[k] = a[j]; a[j] = t;
    }
    state.shuffles[i] = a;
  }
  return state.shuffles[i];
}

function getCSI(i) {
  return getShuffle(i).indexOf(qs[i].ci);
}

function loadAttempts() {
  return parseInt(localStorage.getItem(ATT_KEY) || '0', 10);
}

function updateNav() {
  var ans = Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent = ans + ' / ' + qs.length;
  document.getElementById('prog-fill').style.width = (ans / qs.length * 100).toFixed(1) + '%';
  renderDots();
}

function toggleJump() {
  var p = document.getElementById('dot-panel');
  var b = document.getElementById('jump-btn');
  if (p.style.display === 'block') {
    p.style.display = 'none'; b.textContent = 'Jump ▾';
  } else {
    p.style.display = 'block'; b.textContent = 'Hide ▴'; renderDots();
  }
}

function renderDots() {
  var p = document.getElementById('dot-panel');
  if (p.style.display !== 'block') return;
  var h = '';
  for (var i = 0; i < qs.length; i++) {
    var bg = state.answers[i] === undefined ? '#d7dde6'
           : (state.answers[i] === getCSI(i) ? '#1D9E75' : '#E24B4A');
    h += '<span class="dot" style="background:' + bg + ';" onclick="goToQ(' + i + ')">' + (i + 1) + '</span>';
  }
  if (Object.keys(state.answers).length === qs.length) {
    h += '<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';
  }
  p.innerHTML = h;
}

function goToQ(i) {
  state.cur = i; state.showResults = false; saveState(); render();
  document.getElementById('dot-panel').style.display = 'none';
  document.getElementById('jump-btn').textContent = 'Jump ▾';
}

function speakWord() {
  var w = qs[state.cur].stem;
  var u = new SpeechSynthesisUtterance(w);
  u.lang = TTS_LANG;
  window.speechSynthesis.speak(u);
}

function showResults() {
  state.showResults = true;
  localStorage.setItem(ATT_KEY, loadAttempts() + 1);
  saveState(); render();
}

function render() {
  document.getElementById('att-display').textContent = 'Total Attempts: ' + loadAttempts();

  if (state.showResults) { renderResults(); return; }

  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  updateNav();

  var i = state.cur;
  var q = qs[i];

  document.getElementById('q-num').textContent = 'Question ' + (i + 1) + ' of ' + qs.length;
  document.getElementById('q-word').textContent = q.stem;
  document.getElementById('q-context').textContent = q.sent;

  var tagEl = document.getElementById('tag-badge');
  tagEl.textContent = q.tag;
  tagEl.style.background = (q.tag === 'Review') ? '#f5a623' : '#185FA5';

  var sh = getShuffle(i);
  var ans = state.answers[i];
  var csi = getCSI(i);
  var html = '';
  for (var s = 0; s < 4; s++) {
    var oi = sh[s];
    var cls = 'opt-btn';
    var dis = '';
    if (ans !== undefined) {
      dis = 'disabled';
      if (s === csi) cls += ' correct';
      else if (s === ans) cls += ' wrong';
    }
    html += '<button class="' + cls + '" ' + dis + ' onclick="pick(' + i + ',' + s + ')">' + escHtml(q.opts[oi]) + '</button>';
  }
  document.getElementById('opts-area').innerHTML = html;

  var eb = document.getElementById('exp-box');
  if (ans !== undefined && ans !== csi) {
    eb.style.display = 'block';
    eb.textContent = q.exp;
  } else {
    eb.style.display = 'none';
  }

  document.getElementById('next-btn').textContent = (i === qs.length - 1) ? 'See Results →' : 'Next';
  document.querySelector('.prev-btn').disabled = (i === 0);
}

function renderResults() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  updateNav();

  var c = 0, w = 0, sk = 0;
  for (var i = 0; i < qs.length; i++) {
    if (state.answers[i] === undefined) sk++;
    else if (state.answers[i] === getCSI(i)) c++;
    else w++;
  }
  document.getElementById('results-summary').innerHTML =
    '<span style="color:#1D9E75;font-weight:700;">' + c + '</span> correct &nbsp;' +
    '<span style="color:#E24B4A;font-weight:700;">' + w + '</span> wrong &nbsp;' +
    '<span style="color:#888;font-weight:700;">' + sk + '</span> skipped';

  var html = '';
  for (var i = 0; i < qs.length; i++) {
    var a = state.answers[i];
    var label, bg, tc;
    if (a === undefined)              { label = 'Skipped'; bg = '#d7dde6'; tc = '#555'; }
    else if (a === getCSI(i))         { label = 'Correct'; bg = '#E1F5EE'; tc = '#085041'; }
    else                              { label = 'Wrong';   bg = '#FCEBEB'; tc = '#501313'; }
    html += '<div class="results-card" onclick="goToQ(' + i + ')">' +
            '<span style="font-size:1rem;font-weight:600;color:#333;">' + escHtml(qs[i].stem) + '</span>' +
            '<span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:' + bg + ';color:' + tc + ';">' + label + '</span>' +
            '</div>';
  }
  document.getElementById('results-cards').innerHTML = html;
}

function pick(qi, si) {
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = si;
  saveState(); render();
}

function go(dir) {
  if (dir === 1 && state.cur === qs.length - 1) { showResults(); return; }
  state.cur = Math.max(0, Math.min(qs.length - 1, state.cur + dir));
  saveState(); render();
}

function retryWrong() {
  var first = -1;
  for (var i = 0; i < qs.length; i++) {
    if (state.answers[i] !== undefined && state.answers[i] !== getCSI(i)) {
      if (first === -1) first = i;
      delete state.answers[i];
    }
  }
  if (first !== -1) {
    state.cur = first; state.showResults = false; saveState(); render();
  }
}

function copyRes() {
  var lines = [QUIZ_LABEL];
  for (var i = 0; i < qs.length; i++) {
    var a = state.answers[i];
    lines.push('Q' + (i + 1) + ' ' + qs[i].stem + ': ' +
      (a === undefined ? 'Skipped' : a === getCSI(i) ? 'Correct' : 'Wrong'));
  }
  var txt = lines.join('\n');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).catch(function() { fallbackCopy(txt); });
  } else {
    fallbackCopy(txt);
  }
}

function fallbackCopy(txt) {
  var ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
}

function openFreshModal()  { document.getElementById('freshModal').style.display = 'flex'; }
function confirmFresh() {
  document.getElementById('freshModal').style.display = 'none';
  localStorage.removeItem(QUIZ_KEY);
  resetState(); saveState(); render();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.pick           = pick;
window.go             = go;
window.goToQ          = goToQ;
window.toggleJump     = toggleJump;
window.speakWord      = speakWord;
window.retryWrong     = retryWrong;
window.copyRes        = copyRes;
window.openFreshModal = openFreshModal;
window.confirmFresh   = confirmFresh;
window.showResults    = showResults;

loadState(); saveState(); render();

})();
</script>
</body>
</html>
