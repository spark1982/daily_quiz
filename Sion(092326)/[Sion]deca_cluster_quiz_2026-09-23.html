<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20260923";
var RAW_QUESTIONS = [
 {
  "stem": "A stock table in a financial newspaper lists Harbor Tech with a 52-week high of $84.20, a 52-week low of $51.10, a dividend of $1.20, and a closing price of $60.00. What is Harbor Tech's dividend yield based on the closing price?",
  "opts": [
   "1.4%",
   "2.0%",
   "5.0%",
   "1.2%"
  ],
  "ci": 1,
  "exp": "Dividend yield equals the annual dividend divided by the price: $1.20 &divide; $60.00 = 0.02, or 2.0%."
 },
 {
  "stem": "Brightpath Credit Union launched a new mobile app. The project team set goals of 5,000 downloads in three months, staying within a $120,000 budget, and launching by March 1. What is the best way to evaluate whether the project succeeded?",
  "opts": [
   "Judge success only by how the app's logo looks",
   "Count how many meetings were held during the project",
   "Compare the actual downloads, costs, and launch date against the goals set at the start",
   "Ask only the project team whether they enjoyed the work"
  ],
  "ci": 2,
  "exp": "Project success is measured by comparing actual results with the original objectives, such as scope, budget, and schedule; enjoyment, meeting counts, or appearance alone do not show whether goals were met."
 },
 {
  "stem": "Greenline Foods, a publicly traded grocery chain, discovers that a manager overstated last quarter's revenue by recording sales that had not yet occurred. Why is correcting this error important to the company's stakeholders?",
  "opts": [
   "Correcting it only matters if the company's stock price has already fallen",
   "Investors, lenders, and regulators rely on accurate reports to make decisions about the company",
   "Stakeholders care only about next year's projections, not past results",
   "Accurate reporting mainly benefits competitors who study the company's reports"
  ],
  "ci": 1,
  "exp": "Stakeholders such as investors, lenders, and regulators base lending, investing, and oversight decisions on financial reports, so misstatements can mislead them regardless of the current stock price."
 },
 {
  "stem": "After her first quarterly review, junior analyst Priya learns that her reports are accurate but often submitted late. What is the most effective way for Priya to use this feedback for personal growth?",
  "opts": [
   "Ignore the comment because the rest of the review was positive",
   "Create a plan to manage her time better, such as setting earlier personal deadlines, and check in with her manager on progress",
   "Explain to her manager that accuracy matters more than deadlines",
   "Ask to be moved to a team with fewer deadlines"
  ],
  "ci": 1,
  "exp": "Feedback is most useful when it is turned into specific actions and follow-up; defending the behavior, ignoring it, or avoiding the challenge does not lead to growth."
 },
 {
  "stem": "During tax season, staff accountant Devon feels overwhelmed and has trouble sleeping. Which strategy is the healthiest way for him to manage his stress?",
  "opts": [
   "Break large tasks into smaller steps, set priorities, and take short breaks while getting regular exercise and rest",
   "Work through the night every day until the season ends",
   "Avoid telling his supervisor so he does not appear weak",
   "Skip meals to have more time for work"
  ],
  "ci": 0,
  "exp": "Healthy stress management combines organization, realistic priorities, rest, and communication; working without rest, hiding problems, or skipping meals tends to increase stress."
 },
 {
  "stem": "The owner of Maple Street Bakery wants to decide whether to open a second location. Why does she need accurate financial information before making this decision?",
  "opts": [
   "It mainly helps her choose the paint colors for the new store",
   "It is required only for businesses that are already bankrupt",
   "It shows whether the business can afford the expansion and how it is likely to affect profits",
   "It replaces the need to study customer demand in the new area"
  ],
  "ci": 2,
  "exp": "Financial information such as cash flow, profits, and costs helps owners judge whether a major investment is affordable and likely to pay off; it supports, rather than replaces, other research."
 },
 {
  "stem": "Two regional banks merge to form one larger bank, and the new company also begins offering insurance and investment services under the same brand. This trend in the finance industry is best described as",
  "opts": [
   "deregulation of the stock market",
   "a decrease in competition caused by new startups",
   "consolidation and convergence of financial services",
   "the separation of banking and insurance into different companies"
  ],
  "ci": 2,
  "exp": "Consolidation occurs when financial firms merge into larger ones, and convergence occurs when banking, insurance, and investment services are offered together by the same company."
 },
 {
  "stem": "Before approving a small-business loan, a loan officer at Crestview Bank reviews the applicant's credit report, debt-to-income ratio, and recent bank statements. What is the main purpose of this review?",
  "opts": [
   "To judge whether the borrower is likely to repay the loan",
   "To calculate the bank's own income tax",
   "To decide which marketing slogan the bank should use",
   "To choose the location of the bank's next branch"
  ],
  "ci": 0,
  "exp": "Analyzing credit history, debt levels, and cash flow helps a lender evaluate the borrower's ability and willingness to repay, which is the key question in approving a loan."
 },
 {
  "stem": "A new state rule requires lenders to explain loan fees in plain language. Clearwater Bank's legal team notes that one confusing fee is technically not covered by the rule's exact wording. Which approach best reflects complying with the spirit and intent of the law?",
  "opts": [
   "Remove all fee information from loan documents to avoid confusion",
   "Wait for a customer complaint before deciding whether to change anything",
   "Explain that fee in plain language too, since the rule's purpose is to help customers understand loan costs",
   "Keep the confusing wording because the rule does not specifically mention that fee"
  ],
  "ci": 2,
  "exp": "Complying with the spirit of a law means honoring its purpose, which here is clear communication of loan costs, rather than searching for technical loopholes or waiting for complaints."
 },
 {
  "stem": "Jordan, a loan officer at Summit Ridge Credit Union, receives dozens of e-mails each morning. Several require him to send documents back to members by Friday. Which e-mail feature would best help him make sure he does not forget these requests?",
  "opts": [
   "Flagging the messages for follow-up with a due date",
   "Replying to all members with a generic thank-you note",
   "Turning off new-message notifications for the week",
   "Moving all of the messages to the deleted-items folder"
  ],
  "ci": 0,
  "exp": "Flagging a message for follow-up, often with a reminder date, keeps action items visible until they are completed; deleting, sending generic replies, or silencing notifications would make it easier to miss the deadlines."
 },
 {
  "stem": "During a strong economy with low unemployment and rising consumer spending, the central bank begins raising interest rates to slow inflation. What is the most likely short-term effect on the bond market?",
  "opts": [
   "Prices of existing bonds tend to rise because interest rates are higher",
   "All companies immediately stop issuing bonds",
   "Prices of existing bonds tend to fall because newer bonds pay higher interest",
   "Bond prices are not affected by changes in interest rates"
  ],
  "ci": 2,
  "exp": "Bond prices move in the opposite direction from interest rates: when new bonds offer higher rates, older bonds with lower rates become less attractive, so their prices fall."
 },
 {
  "stem": "Marcus enjoys helping families plan for retirement and wants a finance career focused on building long-term client relationships. Which career path best fits his interests?",
  "opts": [
   "Insurance claims adjuster for auto accidents",
   "Bank vault technician",
   "Payroll data entry clerk",
   "Financial planner"
  ],
  "ci": 3,
  "exp": "Financial planners help individuals and families set goals such as retirement and build ongoing relationships with clients, which matches Marcus's interests better than the other roles."
 },
 {
  "stem": "Oakmont Wealth Partners is hiring an entry-level client services associate. Which quality would most employers view as especially important for this role?",
  "opts": [
   "A preference for working with as little contact with clients as possible",
   "Knowledge of popular video games",
   "Strong communication skills and dependability",
   "The ability to work only on a flexible schedule chosen by the employee"
  ],
  "ci": 2,
  "exp": "Employers consistently look for communication skills, reliability, and a positive work ethic, especially in client-facing roles; the other traits do not fit the needs of the job."
 },
 {
  "stem": "Leila is preparing a resume for a summer internship at an accounting firm. Which practice would make her resume most effective?",
  "opts": [
   "Listing every job and activity since elementary school",
   "Tailoring it to the internship by highlighting relevant coursework and skills, and proofreading it carefully",
   "Using several decorative fonts and bright colors to stand out",
   "Including personal details such as her age and religion"
  ],
  "ci": 1,
  "exp": "Effective resumes are concise, targeted to the position, and error-free; including every activity, flashy formatting, or unnecessary personal information weakens a resume."
 },
 {
  "stem": "Harborview Bank requires two employees to approve any wire transfer over $10,000 and also buys insurance to cover losses from natural disasters. Which statement best describes these actions?",
  "opts": [
   "The dual approval is an internal risk control, while the insurance transfers an external risk to another party",
   "The dual approval increases risk, while the insurance eliminates all risk",
   "Both actions are examples of avoiding risk entirely",
   "Both actions are marketing strategies designed to attract customers"
  ],
  "ci": 0,
  "exp": "Requiring two approvals is an internal control that reduces the chance of error or fraud within the company, while insurance shifts the financial impact of external events such as disasters to the insurer."
 },
 {
  "stem": "Pioneer Card Services analyzes millions of past transactions to find patterns, such as unusual purchase locations, that often appear before fraud occurs. Which technique is the company using?",
  "opts": [
   "Manual check reconciliation",
   "Data mining",
   "Straight-line depreciation",
   "Double-entry bookkeeping"
  ],
  "ci": 1,
  "exp": "Data mining uses software to search large data sets for hidden patterns and relationships, such as the warning signs of fraud; the other choices are accounting procedures, not pattern-discovery tools."
 },
 {
  "stem": "Evergreen Savings Bank announces that it will fund free financial-literacy workshops at local high schools and reduce paper use in its branches by 40%. These actions are best described as examples of",
  "opts": [
   "vertical integration",
   "corporate social responsibility",
   "price discrimination",
   "market skimming"
  ],
  "ci": 1,
  "exp": "Corporate social responsibility refers to a business's efforts to benefit society and the environment beyond profit-making, such as community education and sustainability programs."
 },
 {
  "stem": "Nadia receives a paycheck and wants to deposit it into her account using her bank's mobile app. The bank's instructions say to sign the back and write \"For mobile deposit only at Cedar Bank.\" What is the purpose of this restrictive endorsement?",
  "opts": [
   "It increases the amount of money printed on the check",
   "It transfers ownership of the check to anyone who finds it",
   "It cancels the check so it cannot be deposited",
   "It limits how the check can be used, reducing the risk that someone else could cash it if it were lost or stolen"
  ],
  "ci": 3,
  "exp": "A restrictive endorsement, such as \"for deposit only,\" limits further use of the check, which protects the payee; a blank endorsement (just a signature) would allow anyone holding the check to cash it."
 },
 {
  "stem": "Shareholders of Northpeak Energy complain that the same person serves as both CEO and chair of the board, and that the board rarely questions management. Which corporate governance improvement would best address their concern?",
  "opts": [
   "Keeping board decisions confidential from shareholders",
   "Reducing the number of board meetings each year",
   "Giving the CEO additional stock options to increase motivation",
   "Appointing an independent board chair and adding more independent directors"
  ],
  "ci": 3,
  "exp": "Good corporate governance depends on independent oversight of management; separating the CEO and chair roles and adding independent directors strengthens that oversight, while the other choices weaken it."
 },
 {
  "stem": "Brightwater Insurance creates a small team of employees who regularly review the company's own processes, test internal controls, and report findings to the board's audit committee. What is the main value of this internal audit function?",
  "opts": [
   "It is mainly used to set sales targets for each department",
   "It replaces the need for any outside auditors to review the financial statements",
   "It guarantees that the company will never make an accounting error",
   "It helps the company find weaknesses in controls and processes before they lead to losses or fraud"
  ],
  "ci": 3,
  "exp": "An internal audit independently evaluates controls, risk management, and processes so problems can be fixed early; it does not replace external audits, set sales targets, or guarantee perfection."
 }
];
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
