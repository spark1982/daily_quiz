<script>
var TITLE = "[Sion] SAT Grammar";
var QUIZ_KEY = "satgrammar";
var INSTRUCTION = "Choose the best revision for the underlined portion, or 'NO CHANGE' if the original is correct.";
var TODAY_STR = "20260923";
var RAW_QUESTIONS = [
 {
  "tag": "Past Perfect Tense",
  "tagcolor": "#185FA5",
  "passage": "When archaeologists finally opened the sealed chamber in 1922, they discovered that tomb robbers <u>already entered</u> it centuries earlier, though much of the treasure remained.",
  "contextLabel": "Which choice establishes the correct sequence of past events?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "already entered",
   "will have already entered",
   "have already entered",
   "had already entered"
  ],
  "ci": 3,
  "exp": "The robbers entered the chamber before the archaeologists discovered it, so the earlier past action requires the past perfect “had already entered.”"
 },
 {
  "tag": "Plural Possessive",
  "tagcolor": "#185FA5",
  "passage": "After reviewing the three <u>researcher's</u> data sets, the editors agreed that the study's findings were consistent across all laboratories.",
  "contextLabel": "Which choice correctly completes the sentence?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "researchers's",
   "researchers'",
   "researcher's",
   "researchers"
  ],
  "ci": 1,
  "exp": "The data sets belong to three researchers, so the plural possessive “researchers'” is needed, with the apostrophe after the plural “s.”"
 },
 {
  "tag": "Punctuation Between Subject and Verb",
  "tagcolor": "#185FA5",
  "passage": "The engineers who designed the Golden Gate Bridge's distinctive orange color<u>, chose</u> it partly because it blended well with the surrounding hills and remained visible in fog.",
  "contextLabel": "Which choice correctly punctuates the underlined portion?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   ": chose",
   " chose",
   "; chose",
   ", chose"
  ],
  "ci": 1,
  "exp": "“The engineers who designed the Golden Gate Bridge's distinctive orange color” is the full subject, and no punctuation should separate a subject from its verb."
 },
 {
  "tag": "Colon for Elaboration",
  "tagcolor": "#185FA5",
  "passage": "The researchers reached a surprising conclusion about the city's pigeons<u>, the birds</u> could recognize individual human faces and avoid people who had chased them.",
  "contextLabel": "Which choice correctly punctuates the underlined portion?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   ": the birds",
   ", the birds",
   " the birds",
   "; and the birds"
  ],
  "ci": 0,
  "exp": "The second clause explains what the surprising conclusion was, and the first clause is complete on its own, so a colon correctly introduces the elaboration. A comma alone creates a comma splice."
 },
 {
  "tag": "Collective Noun Pronoun Agreement",
  "tagcolor": "#185FA5",
  "passage": "After months of debate, the city's planning commission finally released <u>their</u> recommendations for expanding the public transit system.",
  "contextLabel": "Which choice corrects the pronoun-antecedent error?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "its",
   "it's",
   "they're",
   "their"
  ],
  "ci": 0,
  "exp": "“Commission” is a singular collective noun acting as a single unit, so it takes the singular possessive pronoun “its.”"
 },
 {
  "tag": "Transitions: Contrast",
  "tagcolor": "#185FA5",
  "passage": "For decades, scientists assumed that octopuses, as solitary animals, had little capacity for social learning. <u>Consequently,</u> recent studies show that young octopuses can learn to open containers simply by watching other octopuses do it.",
  "contextLabel": "Which choice provides the most logical transition?",
  "stem": "Which choice best revises the underlined transition?",
  "opts": [
   "Consequently,",
   "For instance,",
   "Similarly,",
   "However,"
  ],
  "ci": 3,
  "exp": "The recent findings contradict the earlier assumption that octopuses could not learn socially, so a contrast transition such as “However,” is needed."
 },
 {
  "tag": "Restrictive Clause",
  "tagcolor": "#185FA5",
  "passage": "Only the seeds<u>, that were stored in the coldest section of the vault,</u> remained viable after the power failure.",
  "contextLabel": "Which choice correctly punctuates the underlined portion?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   ", that were stored in the coldest section of the vault,",
   " that were stored in the coldest section of the vault",
   " that were stored, in the coldest section of the vault,",
   ", which were stored in the coldest section of the vault"
  ],
  "ci": 1,
  "exp": "The clause identifies which seeds remained viable, so it is essential (restrictive) information and should not be set off with commas."
 },
 {
  "tag": "Transitions: Result",
  "tagcolor": "#185FA5",
  "passage": "Coffee rust, a fungal disease, spread rapidly across Central American farms between 2012 and 2014, destroying roughly half of the region's coffee plants. <u>Nonetheless,</u> hundreds of thousands of farmworkers lost their jobs during those years.",
  "contextLabel": "Which choice provides the most logical transition?",
  "stem": "Which choice best revises the underlined transition?",
  "opts": [
   "Likewise,",
   "In contrast,",
   "As a result,",
   "Nonetheless,"
  ],
  "ci": 2,
  "exp": "The job losses were caused by the destruction of the coffee plants, so a cause-and-effect transition such as “As a result,” is needed."
 },
 {
  "tag": "Agreement with Intervening Phrase",
  "tagcolor": "#185FA5",
  "passage": "The collection of handwritten letters, travel journals, and unpublished poems that the author left in her attic <u>have</u> recently been donated to a university library.",
  "contextLabel": "Which choice ensures that the verb agrees with its subject?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "have",
   "were",
   "are",
   "has"
  ],
  "ci": 3,
  "exp": "The subject of the sentence is the singular noun “collection”; the long phrase that follows it does not change the subject's number, so the singular verb “has” is required."
 },
 {
  "tag": "Semicolon with Conjunctive Adverb",
  "tagcolor": "#185FA5",
  "passage": "Early electric cars were quiet and easy to start<u>, however, gasoline</u> cars eventually dominated the market because fuel was cheap and plentiful.",
  "contextLabel": "Which choice correctly joins the two independent clauses?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   ", however; gasoline",
   ", however, gasoline",
   "; however, gasoline",
   "; however gasoline"
  ],
  "ci": 2,
  "exp": "Both parts are independent clauses joined by the conjunctive adverb “however,” so a semicolon must come before “however” and a comma after it."
 },
 {
  "tag": "Rhetorical Synthesis",
  "tagcolor": "#185FA5",
  "passage": "While researching a topic, a student has taken the following notes:<br>&bull; The Svalbard Global Seed Vault is located on a remote Norwegian island.<br>&bull; It opened in 2008.<br>&bull; It stores backup copies of seeds from gene banks around the world.<br>&bull; Its purpose is to protect crop diversity in case of disasters.<br>&bull; It holds more than one million seed samples.",
  "contextLabel": "The student wants to emphasize the vault's purpose. Which choice most effectively uses relevant information from the notes to accomplish this goal?",
  "stem": "Which choice most effectively accomplishes the student's goal?",
  "opts": [
   "The Svalbard Global Seed Vault, which opened in 2008, is located on a remote Norwegian island.",
   "More than one million seed samples are held in a vault that opened in 2008.",
   "A seed vault on a remote Norwegian island opened in 2008 and holds many samples.",
   "The Svalbard Global Seed Vault stores backup seeds from gene banks worldwide to protect crop diversity in case of disasters."
  ],
  "ci": 3,
  "exp": "Only the choice that states the vault stores backup seeds “to protect crop diversity in case of disasters” directly emphasizes its purpose; the other choices focus on location, opening date, or size."
 },
 {
  "tag": "Appositive Punctuation",
  "tagcolor": "#185FA5",
  "passage": "In her 1962 book <i>Silent Spring</i>, marine <u>biologist, Rachel Carson,</u> documented the harmful effects of pesticides on birds and other wildlife.",
  "contextLabel": "Which choice correctly punctuates the underlined portion?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "biologist Rachel Carson",
   "biologist Rachel Carson,",
   "biologist, Rachel Carson",
   "biologist, Rachel Carson,"
  ],
  "ci": 0,
  "exp": "“Marine biologist” works as a title directly identifying Rachel Carson, which is essential to the phrase, so no commas should separate the title from the name or the name from the verb."
 },
 {
  "tag": "Dash Consistency",
  "tagcolor": "#185FA5",
  "passage": "The Great Molasses Flood of 1919&mdash;in which a storage tank burst and sent a wave of syrup through Boston's North End<u>, remains</u> one of the strangest disasters in American history.",
  "contextLabel": "Which choice correctly punctuates the underlined portion?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "&mdash;remains",
   "remains",
   ", remains",
   "; remains"
  ],
  "ci": 0,
  "exp": "The interrupting phrase opens with a dash, so it must close with a matching dash before the main verb “remains.”"
 },
 {
  "tag": "Nonrestrictive Clause Punctuation",
  "tagcolor": "#185FA5",
  "passage": "Ada Lovelace's notes on Charles Babbage's Analytical Engine<u> which were published in 1843 include</u> what many historians consider the first computer algorithm.",
  "contextLabel": "Which choice correctly punctuates the underlined portion?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   " which were published in 1843, include",
   "which were published in 1843 include",
   ", which were published in 1843, include",
   ", which were published in 1843 include"
  ],
  "ci": 2,
  "exp": "The clause “which were published in 1843” adds nonessential information about the notes, so it must be set off by a comma on both sides; the main verb “include” then follows the closing comma."
 },
 {
  "tag": "Inverted Sentence Agreement",
  "tagcolor": "#185FA5",
  "passage": "At the center of the ancient city of Petra, carved directly into rose-colored sandstone cliffs, <u>stands</u> dozens of tombs, temples, and monuments built by the Nabataeans.",
  "contextLabel": "Which choice ensures that the verb agrees with its subject?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "is standing",
   "stand",
   "stands",
   "has stood"
  ],
  "ci": 1,
  "exp": "In this inverted sentence the subject comes after the verb: “dozens of tombs, temples, and monuments.” Because that subject is plural, the plural verb “stand” is required."
 },
 {
  "tag": "Pronoun Case",
  "tagcolor": "#185FA5",
  "passage": "The award committee announced that the scholarship would go to the student <u>who</u> the judges had ranked highest in both essay quality and community service.",
  "contextLabel": "Which choice uses the correct pronoun case?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "who",
   "whomever",
   "whose",
   "whom"
  ],
  "ci": 3,
  "exp": "The pronoun functions as the object of “had ranked” (the judges had ranked him or her), so the objective form “whom” is required."
 },
 {
  "tag": "Parallel Structure",
  "tagcolor": "#185FA5",
  "passage": "The new city ordinance requires restaurant owners not only to post calorie counts on their menus but also <u>that they list</u> common allergens next to each dish.",
  "contextLabel": "Which choice best maintains parallel structure in the sentence?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "they should list",
   "that they list",
   "listing",
   "to list"
  ],
  "ci": 3,
  "exp": "The correlative pair “not only... but also” must connect grammatically parallel elements. Because “not only” is followed by “to post,” “but also” must be followed by “to list.”"
 },
 {
  "tag": "Possessive Determiners",
  "tagcolor": "#185FA5",
  "passage": "Each autumn the monarch butterfly begins <u>it's</u> remarkable migration from Canada to the mountain forests of central Mexico, a journey of nearly 3,000 miles.",
  "contextLabel": "Which choice correctly completes the sentence?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "their",
   "it's",
   "its'",
   "its"
  ],
  "ci": 3,
  "exp": "The sentence needs a singular possessive determiner referring to “the monarch butterfly,” which is “its.” “It's” means “it is,” “its'” is not a word, and “their” is plural."
 },
 {
  "tag": "Past Participle Form",
  "tagcolor": "#185FA5",
  "passage": "By the time the expedition reached the summit, the climbers had <u>drank</u> nearly all of the water they had carried up the mountain.",
  "contextLabel": "Which choice uses the correct verb form?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "drank",
   "drink",
   "drunk",
   "drinked"
  ],
  "ci": 2,
  "exp": "After the helping verb “had,” the past participle is required. The past participle of “drink” is “drunk,” not the simple past “drank.”"
 },
 {
  "tag": "Dangling Modifier",
  "tagcolor": "#185FA5",
  "passage": "Having studied the ancient star charts for years, <u>the timing of the eclipse was predicted by the astronomer</u> within a few minutes.",
  "contextLabel": "Which choice corrects the dangling modifier?",
  "stem": "Which choice best revises the underlined portion?",
  "opts": [
   "the eclipse's timing was predicted by the astronomer",
   "the timing of the eclipse was predicted by the astronomer",
   "it was the timing of the eclipse that the astronomer predicted",
   "the astronomer predicted the timing of the eclipse"
  ],
  "ci": 3,
  "exp": "The introductory phrase “Having studied the ancient star charts for years” must describe the person who did the studying, so “the astronomer” must be the subject immediately following the comma."
 }
];
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
