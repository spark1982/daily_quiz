<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }

  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }

  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }

  .opt-btn:hover { border-color:#185FA5; }

  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }

  .rad-sign { display:inline-flex; align-items:center; line-height:1; }

  .rad-body { border-top:2px solid currentColor; padding:1px 5px 1px 1px; display:inline-flex; align-items:center; line-height:1.25; flex-wrap:nowrap; gap:2px; }

</div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp";
var INSTRUCTION = "Choose the correct answer for each problem. Two problems are drawn from each of five chapters.";
var TODAY_STR = "20260923";
var RAW_QUESTIONS = [
 {
  "stem": "Is it true that in any group of 8 people, there are two people in the group who have the same number of friends among the people in the group?",
  "opts": [
   "true",
   "false"
  ],
  "ci": 0,
  "exp": "Each person can have 0 to 7 friends in the group, but 0 friends and 7 friends cannot both occur simultaneously. So there are at most 7 possible values for 8 people, and by Pigeonhole at least two share the same number of friends.",
  "tag": "Chapter 1",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "Find all real roots of x<sup>4</sup> + (2 &minus; x)<sup>4</sup> = 34. (HMMT)",
  "opts": [
   "<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">2</span></span>",
   "2 &plusmn; <span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">2</span></span>",
   "1 &plusmn; <span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">2</span></span>",
   "1 &plusmn; 2"
  ],
  "ci": 2,
  "exp": "Let u=x&minus;1, so x=1+u and 2&minus;x=1&minus;u. Then (1+u)<sup>4</sup>+(1&minus;u)<sup>4</sup>=2(1+6u<sup>2</sup>+u<sup>4</sup>)=34, giving u<sup>4</sup>+6u<sup>2</sup>&minus;16=0. Letting v=u<sup>2</sup>, (v+8)(v&minus;2)=0, so v=2 (v=&minus;8 is rejected). Then u=&plusmn;<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">2</span></span>, so x=1&plusmn;<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">2</span></span>.",
  "tag": "Chapter 4",
  "tagcolor": "#7b61ff"
 },
 {
  "stem": "What is the minimum value of 8x<sup>3</sup> + 36x + <span class=\"frac\"><span class=\"num\">54</span><span class=\"den\">x</span></span> + <span class=\"frac\"><span class=\"num\">27</span><span class=\"den\">x<sup>3</sup></span></span> for positive real numbers x? (MathCounts)",
  "opts": [
   "24<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">6</span></span>",
   "96",
   "48<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">6</span></span>",
   "48"
  ],
  "ci": 2,
  "exp": "The expression is (2x+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">x</span></span>)<sup>3</sup>. By AM-GM, 2x+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">x</span></span> &ge; 2<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">2x&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">x</span></span></span></span>=2<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">6</span></span>. So (2x+<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">x</span></span>)<sup>3</sup>&ge;(2<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">6</span></span>)<sup>3</sup>=48<span style=\"white-space:nowrap;\"><span style=\"padding-right:1px;\">&radic;</span><span style=\"border-top:1.4px solid #111;padding:0 3px;\">6</span></span>.",
  "tag": "Chapter 2",
  "tagcolor": "#1D9E75"
 },
 {
  "stem": "Expanding (1 + 0.2)<sup>1000</sup> by the Binomial Theorem we get<br><br><span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>0</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>0</sup> + <span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>1</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>1</sup> + &hellip; + <span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>1000</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>1000</sup> = A<sub>0</sub> + A<sub>1</sub> + &hellip; + A<sub>1000</sub>,<br><br>where A<sub>k</sub> = <span style=\"display:inline-flex;align-items:center;vertical-align:middle\"><span style=\"font-size:1.4em;line-height:1;font-weight:300\">(</span><span style=\"display:inline-flex;flex-direction:column;align-items:center;font-size:0.82em;line-height:1.3;margin:0 1px\"><span>1000</span><span>k</span></span><span style=\"font-size:1.4em;line-height:1;font-weight:300\">)</span></span>(0.2)<sup>k</sup><br><br>for k = 0, 1, &hellip;, 1000. For which k is A<sub>k</sub> the largest? (AIME)",
  "opts": [
   "165",
   "166",
   "167",
   "200"
  ],
  "ci": 1,
  "exp": "The ratio <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>A<sub>k</sub></span><span style=\"border-top:1.4px solid #111;\">A<sub>k&minus;1</sub></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1001&minus;k</span><span style=\"border-top:1.4px solid #111;\">5k</span></span>. This is &gt; 1 iff k &lt; 166.83. So A<sub>k</sub> increases up to k=166 and decreases after. The largest term is at k=166.",
  "tag": "Chapter 2",
  "tagcolor": "#1D9E75"
 },
 {
  "stem": "A particular online vendor offers discounts for orders of 11 or more shirts, as the table shows. For how many different quantities of shirts would the cost exceed the cost of buying the least number of shirts at the next discount level? (MathCounts)<br><br>Number of Shirts | Discount<br>1–10: no discount<br>11–25: 10% off<br>26–50: 15% off<br>51–100: 20% off<br>101–250: 30% off<br>251 or more: 35% off",
  "opts": [
   "28",
   "33",
   "36",
   "25"
  ],
  "ci": 1,
  "exp": "The answer is 33.",
  "tag": "Chapter 3",
  "tagcolor": "#f5a623"
 },
 {
  "stem": "Pete bought a notebook containing 96 pages, and numbered them from 1 through 192. Victor tore out 25 pages of Pete&rsquo;s notebook, and added the 50 numbers he found on the pages. Could Victor get 1990 as the sum? (Russia)",
  "opts": [
   "yes",
   "no"
  ],
  "ci": 1,
  "exp": "Each physical page has two sides numbered n and n+1 (consecutive integers) summing to 2n+1 (odd). The sum of 25 such pairs is the sum of 25 odd numbers, which is odd. Since 1990 is even, Victor could not get 1990.",
  "tag": "Chapter 1",
  "tagcolor": "#185FA5"
 },
 {
  "stem": "The roots of x<sup>4</sup> &minus; x<sup>3</sup> &minus; x<sup>2</sup> &minus; 1 = 0 are a, b, c, and d. Find<br><br>p(a) + p(b) + p(c) + p(d),<br><br>where p(x) = x<sup>6</sup> &minus; x<sup>5</sup> &minus; x<sup>3</sup> &minus; x<sup>2</sup> &minus; x. (AIME)",
  "opts": [
   "10",
   "3",
   "6",
   "4"
  ],
  "ci": 2,
  "exp": "Dividing p(x) by x<sup>4</sup>&minus;x<sup>3</sup>&minus;x<sup>2</sup>&minus;1 gives quotient x<sup>2</sup>+1 and remainder x<sup>2</sup>&minus;x+1. Since each root satisfies the quartic, p(root)=root<sup>2</sup>&minus;root+1. By Vieta's formulas, the sum of the roots is 1 and the sum of pairwise products is &minus;1, so the sum of the squares of the roots is 1<sup>2</sup>&minus;2(&minus;1)=3. The total is therefore 3&minus;1+4=6.",
  "tag": "Chapter 4",
  "tagcolor": "#7b61ff"
 },
 {
  "stem": "You have 8 cubes of size 1 through 8. A tower is to be built using all 8 cubes according to the following rules: a) Any cube may be the bottom cube in the tower. b) The cube immediately on top of a cube with size k must have size at most k + 2. How many different towers can be constructed?",
  "opts": [
   "972",
   "1458",
   "1512",
   "1440"
  ],
  "ci": 1,
  "exp": "Build the tower one cube at a time by size, tracking how many \"slots\" are available for the next cube. Placing the smallest cubes first, each new cube can go on top of the current tower or be inserted so that a bigger cube ends up directly on top of it as long as the size gap of at most 2 is respected. Careful casework (or a recursive count building up from cube 1 to cube 8) on the number of valid insertion points at each stage gives a running product that totals 1458 distinct towers.",
  "tag": "Chapter 5",
  "tagcolor": "#E24B4A"
 },
 {
  "stem": "Four friends took a multiple-choice test. Their papers are shown below. Each of them has exactly two correct answers. Using their answers, what are the correct answers to questions 1, 2, 3, and 4, in that order? (MathCounts)<br><br>Jerry: 1.A  2.B  3.A  4.C<br>Jim:   1.B  2.A  3.D  4.B<br>John:  1.B  2.A  3.A  4.C<br>Jeremy: 1.A  2.C  3.D  4.A",
  "opts": [
   "A, A, D, C",
   "A, B, D, C",
   "B, A, A, C",
   "B, A, D, C"
  ],
  "ci": 0,
  "exp": "The answer is A, A, D, C.",
  "tag": "Chapter 3",
  "tagcolor": "#f5a623"
 },
 {
  "stem": "Evaluate<br><br><span class=\"bigsum\"><span class=\"bs-sup\">&infin;</span><span class=\"bs-sigma\">&Sigma;</span><span class=\"bs-sub\">n=3</span></span> <span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">n<sup>5</sup> &minus; 5n<sup>3</sup> + 4n</span></span>. (Purple Comet)",
  "opts": [
   "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">96</span></span>",
   "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">48</span></span>",
   "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">120</span></span>",
   "<span class=\"frac\"><span class=\"num\">1</span><span class=\"den\">72</span></span>"
  ],
  "ci": 0,
  "exp": "Factor the denominator: n<sup>5</sup>&minus;5n<sup>3</sup>+4n = n(n<sup>2</sup>&minus;1)(n<sup>2</sup>&minus;4) = (n&minus;2)(n&minus;1)n(n+1)(n+2), the product of 5 consecutive integers. Using the telescoping identity <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">(n&minus;2)(n&minus;1)n(n+1)(n+2)</span></span> = (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)&middot;[<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">(n&minus;2)(n&minus;1)n(n+1)</span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">(n&minus;1)n(n+1)(n+2)</span></span>], the sum from n=3 to &infin; telescopes down to (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>)&middot;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">1&middot;2&middot;3&middot;4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>.",
  "tag": "Chapter 5",
  "tagcolor": "#E24B4A"
 }
];
var REPORT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec";
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return activeSet || order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
