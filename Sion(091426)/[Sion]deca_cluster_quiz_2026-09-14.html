<script>var TITLE = "[Sion] Deca Cluster Quiz";var QUIZ_KEY = "quiz_siondecacluster_20_2026-09-14_v1";var ATT_KEY = "quiz_siondecacluster_20_att_2026-09-14_v1";var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';var RAW_QUESTIONS = [{"stem": "Meridian Robotics, a small manufacturer in Ohio, wants to expand its factory but lacks the capital for new equipment. A state economic development office offers to cover 40% of the equipment cost if Meridian commits to hiring 15 new local workers within a year. What type of government support is being offered?", "opts": ["A matching grant tied to job-creation requirements", "A federal tax refund for prior-year losses", "A private equity investment in exchange for company shares", "A commercial bank line of credit"], "ci": 0, "exp": "The state is providing partial funding (a subsidy) conditioned on a specific public benefit (job creation), which is the structure of a matching grant, not a loan, refund, or equity investment."}, {"stem": "At Castellan Marketing, two senior account managers who are close friends outside of work consistently support each other's proposals in team meetings, even when other staff raise valid concerns. Newer employees have started noticing that decisions seem to favor this pair's ideas regardless of merit. What workplace dynamic does this best illustrate?", "opts": ["A formal mentorship program", "An informal coalition influencing group decisions", "A cross-functional task force", "A standard performance review process"], "ci": 1, "exp": "Two employees consistently aligning to support one another's interests, independent of the merits of each proposal, describes an informal political coalition forming within the workplace."}, {"stem": "A regional bakery chain recently discovered that its customer database still lists former customers' old addresses and phone numbers from three years ago, causing marketing mailers to go to the wrong recipients and wasting printing costs. What is the most direct lesson this situation demonstrates?", "opts": ["Customer records should be updated regularly to remain accurate and useful", "Marketing budgets should always be reduced during slow seasons", "Businesses should stop collecting customer contact information", "Print advertising is always less effective than digital advertising"], "ci": 0, "exp": "The problem stems directly from outdated customer records, showing why businesses must keep customer information current and accurate to avoid wasted resources and errors."}, {"stem": "Harlow Logistics is struggling with high turnover among its warehouse staff. Management is considering offering a quarterly bonus tied to meeting safety and productivity targets rather than raising base pay. What is the primary purpose of this proposed change?", "opts": ["To reduce the total number of employees on payroll", "To motivate employees toward specific performance goals through financial incentives", "To eliminate the need for employee performance reviews", "To comply with a legal minimum wage requirement"], "ci": 1, "exp": "Tying a bonus to specific safety and productivity targets is a financial incentive designed to motivate employees to achieve particular performance outcomes."}, {"stem": "An investor wants to purchase a share of ownership in a publicly traded technology company, while a separate business wants to insure its cargo ships against loss at sea. Which two markets would these parties use, respectively?", "opts": ["The capital market and the insurance market", "The money market and the commodities market", "The commodities market and the capital market", "The money market and the capital market"], "ci": 0, "exp": "Buying company stock (an ownership share) takes place in the capital market, while purchasing coverage against loss is handled through the insurance market."}, {"stem": "A nonprofit organization's board of directors includes the founder' ells a search engine to return only results containing that exact sequence of words, rather than pages with the words scattered separately."}, {"stem": "A project manager at a design firm sorts her task list each morning by placing deadline-sensitive client deliverables at the top and routine internal paperwork at the bottom. What organizing principle is she applying to manage her workload?", "opts": ["Organizing tasks alphabetically by client name", "Organizing tasks by time sensitivity and urgency", "Organizing tasks by the size of the file", "Organizing tasks randomly to avoid bias"], "ci": 1, "exp": "Placing the most time-sensitive items first and less urgent items later demonstrates organizing information and tasks by urgency, a common business practice for prioritizing workload."}, {"stem": "An employee notices a coworker has left a company laptop unlocked and unattended in a coffee shop while stepping away to take a phone call. The employee decides to sit with the laptop until the coworker returns rather than ignoring the situation. What behavior does this best demonstrate?", "opts": ["Taking responsible action to protect company property and information", "Overstepping professional boundaries with a coworker", "Violating the company's confidentiality policy", "Wasting company time on an unrelated task"], "ci": 0, "exp": "Choosing to safeguard an unattended company asset shows responsible, accountable behavior in the workplace, even though it was not the employee's direct task."}, {"stem": "A company fires an employee without giving any explanation or opportunity to respond to the allegations against her, even though the employee handbook outlines a required disciplinary review process. Which legal concept has the company most likely violated?", "opts": ["Due process", "Eminent domain", "Statute of limitations", "Intellectual property rights"], "ci": 0, "exp": "Due process requires fair procedures, such as notice and an opportunity to respond, before significant actions are taken; skipping the handbook's required review process violates this principle."}, {"stem": "A small business owner is deciding whether to reinvest profits into new equipment before year-end because doing so would reduce the amount of taxable income reported for the year. What is this decision primarily influenced by?", "opts": ["The effect of tax laws and regulations on financial transactions", "The company's employee handbook policies", "International trade agreements", "The business's social media marketing strategy"], "ci": 0, "exp": "Timing a purchase to affect taxable income directly demonstrates how tax laws and regulations shape financial decision-making for a business."}, {"stem": "The newly hired financial information manager at a mid-sized retailer is asked to explain her department's role to the executive team. Which description best captures the core purpose of the financial-information management function?", "opts": ["Collecting, organizing, and reporting financial data to support decision-making", "Designing the company's advertising campaigns", "Hiring and training new sales staff", "Negotiating contracts with shipping carriers"], "ci": 0, "exp": "The financial-information management function centers on gathering and organizing financial data and providing accurate reports that support sound business decisions."}, {"stem": "A retail chain's finance team compares this quarter's profit margins to the previous three quarters to determine whether a recent price increase has actually improved profitability. What is this process an example of?", "opts": ["Financial analysis", "Inventory auditing", "Employee performance evaluation", "Market segmentation"], "ci": 0, "exp": "Comparing financial data over multiple periods to evaluate the impact of a business decision is a core application of financial analysis."}, {"stem": "A small office keeps its front door locked after business hours, requires visitors to sign in at a front desk, and stores customer files in a locked cabinet rather than leaving them on open desks. What is the primary purpose of these practices?", "opts": ["To reduce routine security risks to people and information", "To increase the number of customers visiting the office", "To comply with advertising regulations", "To reduce employee salaries"], "ci": 0, "exp": "Locking doors, requiring visitor sign-in, and securing files are routine security precautions designed to protect people, property, and sensitive information."}, {"stem": "A company's controller prepares a detailed internal report breaking down production costs by department so managers can make staffing decisions, while a separate report following standardized rules is prepared for outside investors and regulators. What distinction does this best illustrate?", "opts": ["The difference between managerial accounting and financial accounting", "The difference between a debit and a credit", "The difference between gross profit and net profit", "The difference between a fixed cost and a variable cost"], "ci": 0, "exp": "Internal reports created for management decision-making represent managerial accounting, while standardized reports prepared for external parties following formal rules represent financial accounting."}, {"stem": "A growing e-commerce company needs a system that can track thousands of orders, cross-reference customer purchase histories, and generate custom reports for multiple departments at once. Which capability should the company prioritize when selecting new software?", "opts": ["Advanced database applications that can organize and retrieve large amounts of related data", "A basic word processing program", "A single-user spreadsheet with no data-sharing features", "A printer with faster output speed"], "ci": 0, "exp": "Managing large volumes of interrelated data across multiple departments requires advanced database applications capable of organizing, cross-referencing, and reporting on complex datasets."}, {"s ing promotion"], "ci": 0, "exp": "Keeping extra inventory beyond expected demand is the purpose of safety stock, which protects a business from stockouts caused by supplier delays or unexpected demand increases."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';

  if(remaining<=0){ dispEl.textContent="Time's Up"; dispEl.classList.add('danger'); stopTimerInterval(); return; }
  dispEl.textContent = formatTime(remaining);
  if(remaining <= state.timerTotalSec*0.1) dispEl.classList.add('danger');
  else if(remaining <= state.timerTotalSec*0.25) dispEl.classList.add('warn');
}
function startTimer(){
  var input = document.getElementById('timerMinutesInput');
  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }

  var clabel = document.getElementById('context-label');
  if(q.contextLabel){ clabel.style.display='block'; clabel.textContent = q.contextLabel; } else { clabel.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  var ttsBtn = document.getElementById('tts-btn');
  if(ttsBtn){ ttsBtn.style.display = q.tts ? 'inline-block' : 'none'; }

  hintShown = false;
  var hintBtn = document.getElementById('hint-btn');
  var hintBox = document.getElementById('hint-box');
  if(q.hint){
    hintBtn.style.display='inline-block';
    hintBtn.textContent='Show Hint';
    hintBox.innerHTML = q.hint;
    hintBox.classList.remove('show');
  } else {
    hintBtn.style.display='none';
    hintBox.classList.remove('show');
  }

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results \u2192' : 'Next \u2192';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render(); reportResult();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); reportResult(); }
}
function reportResult(){
  try{
    var correct=0, wrong=0, skipped=0;
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
    }
    var total = order.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0
    };
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();

</script>
</body>
</html>
