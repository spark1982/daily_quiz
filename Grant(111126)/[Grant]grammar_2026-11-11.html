var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261111";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["us", "NO CHANGE", "myself", "I"], "ci": 3, "exp": "Use <i>I</i> when the pronoun is part of the subject. Test it alone: <i>I shared a lane</i>, not <i>me shared a lane</i>. So: <i>Dad and <b>I</b> shared a lane.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday my whole family went bowling at Lucky Lanes. <b>(2)</b> Dad and <u>me</u> shared a lane with my little brother, Sam. <b>(3)</b> Each of the bowling balls in the rack have a different color. <b>(4)</b> Sam picked a bright green one because he said it looked lucky. <b>(5)</b> When the last frame ended Mom bought us all milkshakes. <b>(6)</b> Sam gave <u>his</u> extra fries to Mom and me. <b>(7)</b> I can’t wait to go bowling with you over winter break!"}, {"stem": "Which sentence has an error?", "opts": ["I can’t wait to go bowling with you over winter break!", "Each of the bowling balls in the rack have a different color.", "Sam picked a bright green one because he said it looked lucky.", "Dear Grandpa, last Saturday my whole family went bowling at Lucky Lanes."], "ci": 1, "exp": "The subject is <i>Each</i>, which is singular, so the verb must be <i>has</i>. Ignore the words in between (<i>of the bowling balls in the rack</i>): <i>Each of the bowling balls in the rack <b>has</b> a different color.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday my whole family went bowling at Lucky Lanes. <b>(2)</b> Dad and <u>me</u> shared a lane with my little brother, Sam. <b>(3)</b> Each of the bowling balls in the rack have a different color. <b>(4)</b> Sam picked a bright green one because he said it looked lucky. <b>(5)</b> When the last frame ended Mom bought us all milkshakes. <b>(6)</b> Sam gave <u>his</u> extra fries to Mom and me. <b>(7)</b> I can’t wait to go bowling with you over winter break!"}, {"stem": "Where should a comma be added in sentence 5?", "opts": ["When the last frame, ended Mom bought us all milkshakes.", "When the last frame ended Mom, bought us all milkshakes.", "When, the last frame ended Mom bought us all milkshakes.", "When the last frame ended, Mom bought us all milkshakes."], "ci": 3, "exp": "Put a comma after an opening part that starts with <i>When</i>, right before the main sentence begins: <i>When the last frame ended<b>,</b> Mom bought us all milkshakes.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday my whole family went bowling at Lucky Lanes. <b>(2)</b> Dad and <u>me</u> shared a lane with my little brother, Sam. <b>(3)</b> Each of the bowling balls in the rack have a different color. <b>(4)</b> Sam picked a bright green one because he said it looked lucky. <b>(5)</b> When the last frame ended Mom bought us all milkshakes. <b>(6)</b> Sam gave <u>his</u> extra fries to Mom and me. <b>(7)</b> I can’t wait to go bowling with you over winter break!"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["its", "him", "their", "NO CHANGE"], "ci": 3, "exp": "<i>His</i> is already correct: the fries belong to Sam, one boy, so the matching possessive pronoun is <i>his</i>.", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>Email to Grandpa</strong><br><b>(1)</b> Dear Grandpa, last Saturday my whole family went bowling at Lucky Lanes. <b>(2)</b> Dad and <u>me</u> shared a lane with my little brother, Sam. <b>(3)</b> Each of the bowling balls in the rack have a different color. <b>(4)</b> Sam picked a bright green one because he said it looked lucky. <b>(5)</b> When the last frame ended Mom bought us all milkshakes. <b>(6)</b> Sam gave <u>his</u> extra fries to Mom and me. <b>(7)</b> I can’t wait to go bowling with you over winter break!"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "whose", "where", "who"], "ci": 0, "exp": "<i>Which</i> is already correct. Use <i>which</i> to add information about a thing (the fur). <i>Who</i> is for people, and <i>where</i> is for places.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>How Arctic Foxes Survive Winter</strong><br><b>(1)</b> The arctic fox lives on the frozen tundra, one of the coldest places on Earth. <b>(2)</b> Its thick white fur, <u>which</u> turns brown in summer, works like a warm winter coat. <b>(3)</b> The fox also has fur on the bottoms of its paws. <b>(4)</b> This fur keeps its feet from freezing on the ice. <b>(5)</b> In winter, food is hard to find. <b>(6)</b> The fox follows polar bears. <b>(7)</b> <u>Eating the scraps</u> that the bears leave behind."}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["The fox also has fur on the bottoms of its paws, but this fur keeps its feet from freezing on the ice.", "The fox also has fur on the bottoms of its paws who keeps its feet from freezing on the ice.", "The fox also has fur on the bottoms of its paws, which keeps its feet from freezing on the ice.", "The fox also has fur on the bottoms of its paws, this fur keeps its feet from freezing on the ice."], "ci": 2, "exp": "Use <i>which</i> to join a sentence that tells more about a thing: <i>...on the bottoms of its paws, <b>which</b> keeps its feet from freezing.</i> Joining two sentences with only a comma makes a run-on, and <i>but</i> wrongly signals a contrast.", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>How Arctic Foxes Survive Winter</strong><br><b>(1)</b> The arctic fox lives on the frozen tundra, one of the coldest places on Earth. <b>(2)</b> Its thick white fur, <u>which</u> turns brown in summer, works like a warm winter coat. <b>(3)</b> The fox also has fur on the bottoms of its paws. <b>(4)</b> This fur keeps its feet from freezing on the ice. <b>(5)</b> In winter, food is hard to find. <b>(6)</b> The fox follows polar bears. <b>(7)</b> <u>Eating the scraps</u> that the bears leave behind."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["In winter, food is hard to find, the fox follows polar bears.", "In winter, food is hard to find, but the fox follows polar bears.", "In winter, food is hard to find, so the fox follows polar bears.", "In winter, food is hard to find, or the fox follows polar bears."], "ci": 2, "exp": "The second idea is a result of the first, so use <i>so</i>: <i>Food is hard to find, <b>so</b> the fox follows polar bears.</i> <i>But</i> shows a contrast, <i>or</i> shows a choice, and a comma alone makes a run-on.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>How Arctic Foxes Survive Winter</strong><br><b>(1)</b> The arctic fox lives on the frozen tundra, one of the coldest places on Earth. <b>(2)</b> Its thick white fur, <u>which</u> turns brown in summer, works like a warm winter coat. <b>(3)</b> The fox also has fur on the bottoms of its paws. <b>(4)</b> This fur keeps its feet from freezing on the ice. <b>(5)</b> In winter, food is hard to find. <b>(6)</b> The fox follows polar bears. <b>(7)</b> <u>Eating the scraps</u> that the bears leave behind."}, {"stem": "What is the correct way to write the underlined part in sentence 7?", "opts": ["Eaten the scraps", "And eating the scraps", "It eats the scraps", "NO CHANGE"], "ci": 2, "exp": "Sentence 7 has no subject and no complete verb, so it is a fragment. Add both: <i><b>It eats</b> the scraps that the bears leave behind.</i>", "tag": "Fragments & Run-ons", "tagcolor": "#E24B4A", "passage": "<strong>How Arctic Foxes Survive Winter</strong><br><b>(1)</b> The arctic fox lives on the frozen tundra, one of the coldest places on Earth. <b>(2)</b> Its thick white fur, <u>which</u> turns brown in summer, works like a warm winter coat. <b>(3)</b> The fox also has fur on the bottoms of its paws. <b>(4)</b> This fur keeps its feet from freezing on the ice. <b>(5)</b> In winter, food is hard to find. <b>(6)</b> The fox follows polar bears. <b>(7)</b> <u>Eating the scraps</u> that the bears leave behind."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["decided", "will decide", "deciding", "NO CHANGE"], "ci": 0, "exp": "The journal tells about last Sunday, so keep every verb in the past: <i>built, glued, finished</i>. Use <i>Then Ella <b>decided</b> to add a gumdrop path.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>Gingerbread Day Journal</strong><br><b>(1)</b> Last Sunday, my sister Ella and I built a gingerbread house. <b>(2)</b> First, we glued the walls together with thick white icing. <b>(3)</b> Then Ella <u>decides</u> to add a gumdrop path. <b>(4)</b> By the time we finished, she <u>had ate</u> half of the gumdrops! <b>(5)</b> The roof kept sliding off <u>it’s</u> walls, so we propped it up with candy canes. <b>(6)</b> Mom said our house looked better than the one in the bakerys window. <b>(7)</b> We’re going to share it with our neighbors on Friday."}, {"stem": "What is the correct way to write the underlined part in sentence 4?", "opts": ["NO CHANGE", "had eaten", "had eat", "has ate"], "ci": 1, "exp": "After <i>had</i>, use the past participle. The past participle of <i>eat</i> is <i>eaten</i> (not <i>ate</i>): <i>she <b>had eaten</b> half of the gumdrops.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>Gingerbread Day Journal</strong><br><b>(1)</b> Last Sunday, my sister Ella and I built a gingerbread house. <b>(2)</b> First, we glued the walls together with thick white icing. <b>(3)</b> Then Ella <u>decides</u> to add a gumdrop path. <b>(4)</b> By the time we finished, she <u>had ate</u> half of the gumdrops! <b>(5)</b> The roof kept sliding off <u>it’s</u> walls, so we propped it up with candy canes. <b>(6)</b> Mom said our house looked better than the one in the bakerys window. <b>(7)</b> We’re going to share it with our neighbors on Friday."}, {"stem": "What is the correct way to write the underlined part in sentence 5?", "opts": ["its’", "NO CHANGE", "its", "it is"], "ci": 2, "exp": "<i>It’s</i> means <i>it is</i>. To show that the walls belong to the house, use <i>its</i> with no apostrophe: <i>The roof kept sliding off <b>its</b> walls.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Gingerbread Day Journal</strong><br><b>(1)</b> Last Sunday, my sister Ella and I built a gingerbread house. <b>(2)</b> First, we glued the walls together with thick white icing. <b>(3)</b> Then Ella <u>decides</u> to add a gumdrop path. <b>(4)</b> By the time we finished, she <u>had ate</u> half of the gumdrops! <b>(5)</b> The roof kept sliding off <u>it’s</u> walls, so we propped it up with candy canes. <b>(6)</b> Mom said our house looked better than the one in the bakerys window. <b>(7)</b> We’re going to share it with our neighbors on Friday."}, {"stem": "Which sentence contains an error in grammar or punctuation?", "opts": ["Last Sunday, my sister Ella and I built a gingerbread house.", "First, we glued the walls together with thick white icing.", "Mom said our house looked better than the one in the bakerys window.", "We’re going to share it with our neighbors on Friday."], "ci": 2, "exp": "The window belongs to the bakery, so it needs an apostrophe to show ownership: <i>the <b>bakery’s</b> window.</i> <i>We’re</i> (we are) is already correct.", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>Gingerbread Day Journal</strong><br><b>(1)</b> Last Sunday, my sister Ella and I built a gingerbread house. <b>(2)</b> First, we glued the walls together with thick white icing. <b>(3)</b> Then Ella <u>decides</u> to add a gumdrop path. <b>(4)</b> By the time we finishe var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
