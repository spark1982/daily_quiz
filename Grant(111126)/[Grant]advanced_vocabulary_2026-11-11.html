<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261111";
var RAW_QUESTIONS = [{"stem": "Read the sentence: \"Over millions of years, the slow <b>evolution</b> of whales changed them from land animals into ocean swimmers.\" What does <b>evolution</b> mean in this sentence?", "opts": ["gradual change and development over a long time", "a sudden and violent change", "a scientific test done in a lab", "the way an animal hunts for food"], "ci": 0, "exp": "<i>evolution</i> (n.) slow change and development over a long time. <i>The <b>evolution</b> of phones went from huge boxes to pocket screens.</i> Family: evolve (v.), evolutionary (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The two teams had <b>mutual</b> respect after the close game. Which word means the <b>SAME</b> or nearly the same as “mutual” as it is used in the sentence?", "opts": ["shared", "one-sided", "secret", "sudden"], "ci": 0, "exp": "<i>mutual</i> (adj.) felt or done by both sides. <i>Shared</i> is closest. <i>One-sided</i> means only one side feels it, which is the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"To <b>obtain</b> a library card, you have to fill out a form and show proof of your address.\" What does <b>obtain</b> mean in this sentence?", "opts": ["to describe something in writing", "to return something that was borrowed", "to get something, often by effort or by following steps", "to lose something by accident"], "ci": 2, "exp": "<i>obtain</i> (v.) to get something, usually by doing what is needed. <i>Scientists worked for years to <b>obtain</b> enough data.</i>", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Our school started a recycling club to help with the ______ of paper and plastic. Which form of the word best completes the sentence?", "opts": ["conservative", "conservation", "conserve", "conserved"], "ci": 1, "exp": "<i>conserve</i> (v.) to save something by using it carefully. After \"the\" and before \"of\" you need a noun: <i>conservation</i>. <i>Turn off the lights to <b>conserve</b> energy.</i>", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Read the sentence: \"From the muddy paw prints across the kitchen floor, it was <b>evident</b> that the dog had come inside after the rain.\" What does <b>evident</b> mean in this sentence?", "opts": ["easy to see or understand; clear", "hard to believe; surprising", "kept hidden or secret", "likely to happen later"], "ci": 0, "exp": "<i>evident</i> (adj.) easy to see or understand. <i>Her hard work was <b>evident</b> in her neat notes.</i> Family: evidence (n.), evidently (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After the new factory opened, the small town enjoyed years of <b>prosperity</b>. Which word means the <b>SAME</b> or nearly the same as “prosperity” as it is used in the sentence?", "opts": ["success", "poverty", "population", "struggle"], "ci": 0, "exp": "<i>prosperity</i> (n.) a time of success and having enough money. <i>Success</i> is closest. <i>Poverty</i> and <i>struggle</i> are opposites. Family: prosper (v.), prosperous (adj.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The judges used three ______ to score each poem: creativity, word choice, and rhythm. Which word best completes the sentence?", "opts": ["criteria", "territories", "consequences", "obstacles"], "ci": 0, "exp": "<i>criteria</i> (n., plural of criterion) the standards used to judge something. <i>What <b>criteria</b> will the coach use to pick the team?</i>", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The new rule will <b>restrict</b> phone use during class. Which word means the <b>OPPOSITE</b> of “restrict” as it is used in the sentence?", "opts": ["observe", "allow", "limit", "prevent"], "ci": 1, "exp": "<i>restrict</i> (v.) to keep something within limits. Its opposite is <i>allow</i> (to let something happen). <i>Limit</i> and <i>prevent</i> are close to the same meaning, not the opposite.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"Kindness adds a new <b>dimension</b> to the story, showing a softer side of the villain.\" What does <b>dimension</b> mean in this sentence?", "opts": ["a different world in science fiction", "a part or side of something", "a measurement such as length or width", "the size of a room"], "ci": 1, "exp": "<i>dimension</i> (n.) can mean a measurement like length or width, but here it means a part, side, or aspect of something. Family: dimensional (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Read the sentence: \"Owls hunt at night, <b>whereas</b> hawks hunt during the day.\" What does <b>whereas</b> mean in this sentence?", "opts": ["after that; used to show what comes next", "for example; used to add a detail", "while on the other hand; used to show a difference", "because; used to give a reason"], "ci": 2, "exp": "<i>whereas</i> (conj.) while on the other hand; it joins two facts that are different. <i>Some frogs live in trees, <b>whereas</b> others live in ponds.</i>", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "After the storm, the town needed <b>extensive</b> repairs to its roads and bridges. Which word means the <b>OPPOSITE</b> of “extensive” as it is used in the sentence?", "opts": ["widespread", "limited", "expensive", "thorough"], "ci": 1, "exp": "<i>extensive</i> (adj.) covering a large area or amount. Its opposite is <i>limited</i> (small in amount). <i>Widespread</i> means nearly the same as extensive.", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The rain forest has amazing ______: thousands of kinds of plants, insects, birds, and mammals live there together. Which word best completes the sentence?", "opts": ["territory", "biodiversity", "surplus", "category"], "ci": 1, "exp": "<i>biodiversity</i> (n.) the variety of different kinds of living things in a place. <i>Coral reefs have high <b>biodiversity</b>.</i> A <i>territory</i> is an area of land, not the variety of living things in it.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "With the science fair only two days away, finishing her poster became Maya's top ______. Which word best completes the sentence?", "opts": ["priority", "procedure", "category", "territory"], "ci": 0, "exp": "<i>priority</i> (n.) something that is more important than other things and should be done first. <i>Safety is our first <b>priority</b>.</i> Family: prioritize (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The caterpillar's ______ into a butterfly took about two weeks. Which form of the word best completes the sentence?", "opts": ["transformed", "transforming", "transform", "transformation"], "ci": 3, "exp": "<i>transformation</i> (n.) a complete change. After \"The caterpillar's\" you need a noun. <i>The old barn went through a <b>transformation</b> into a café.</i> Family: transform (v.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Read the sentence: \"At the end of the unit, the teacher gave a short <b>assessment</b> to see how much the class had learned about fractions.\" What does <b>assessment</b> mean in this sentence?", "opts": ["a group project about a book", "a lesson that introduces a new topic", "a reward for good behavior", "a test or careful check of how well someone is doing"], "ci": 3, "exp": "<i>assessment</i> (n.) a careful check or test to judge something. <i>The coach made an <b>assessment</b> of each player's speed.</i> Family: assess (v.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The heat in the desert at noon was so ______ that the hikers had to rest in the shade every few minutes. Which word best completes the sentence?", "opts": ["stable", "modest", "fragile", "intense"], "ci": 3, "exp": "<i>intense</i> (adj.) very strong or extreme. <i>The light was so <b>intense</b> that she had to squint.</i> <i>Modest</i> heat would be mild, so it does not fit the need to rest so often.", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Read the sentence: \"The teacher gave one more <b>illustration</b> of how a lever works by using a seesaw.\" What does <b>illustration</b> mean in this sentence?", "opts": ["a fancy decoration on a page", "a picture drawn for a book", "an example that helps explain something", "a list of steps to follow"], "ci": 2, "exp": "<i>illustration</i> (n.) can mean a picture in a book, but here it means an example that makes an idea clearer. Family: illustrate (v.), illustrator (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Read the sentence: \"Leo liked to <b>boast</b> about his high score until everyone at the lunch table got tired of hearing it.\" What does <b>boast</b> mean in this sentence?", "opts": ["to explain the rules of a game", "to apologize for a mistake", "to talk with too much pride about yourself", "to complain that something is unfair"], "ci": 2, "exp": "<i>boast</i> (v.) to talk proudly, often too proudly, about what you have or can do. <i>He <b>boasted</b> that he could run the fastest.</i> Family: boastful (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Every year at the festival, the family wears traditional clothing to celebrate their Mexican <b>heritage</b>.\" What does <b>heritage</b> mean in this sentence?", "opts": ["a place where people go on vacation", "traditions and history passed down from earlier generations", "a new style that is popular right now", "money saved for the future"], "ci": 1, "exp": "<i>heritage</i> (n.) the traditions, culture, and history passed down from people who lived before you. <i>The old church is part of the town's <b>heritage</b>.</i>", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Before phones had maps, sailors used the stars to <b>navigate</b> across the ocean and reach the right port.\" What does <b>navigate</b> mean in this sentence?", "opts": ["to measure how deep the water is", "to signal other ships from far away", "to repair a ship while at sea", "to find the way and steer a course"], "ci": 3, "exp": "<i>navigate</i> (v.) to find your way and steer where you are going. <i>She used a trail map to <b>navigate</b> the forest.</i> Family: navigation (n.), navigator (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
