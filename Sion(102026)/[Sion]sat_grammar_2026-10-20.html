<style>

  * { box-sizing: border-box; }

  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }

  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }

  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }

<script>
var TITLE = "[Sion] SAT Grammar";
var QUIZ_KEY = "satgrammar_20";
var INSTRUCTION = "Read each text and choose the answer that best completes or revises it.";
var TODAY_STR = "20261020";
var RAW_QUESTIONS = [{"context": "Marine biologist Sylvia ______ who has led more than 100 ocean expeditions and was the first woman to serve as chief scientist of the National Oceanic and Atmospheric Administration, has spent decades campaigning for protected areas in the ocean.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["Earle,", "Earle", "Earle;", "Earle&mdash;"], "ci": 0, "exp": "The clause &ldquo;who has led &hellip; Administration&rdquo; is a supplementary element, and it already ends with a comma. It must begin with a matching comma. A dash would not match the closing comma, a semicolon cannot separate a subject from its verb, and no punctuation leaves the element unbalanced.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "For decades, scientists assumed that the deep ocean floor was nearly lifeless, since sunlight never reaches it. ______ the 1977 discovery of hydrothermal vents near the Gal&aacute;pagos Islands revealed thriving communities of giant tube worms, clams, and bacteria.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Therefore,", "Similarly,", "However,", "For example,"], "ci": 2, "exp": "The second sentence contradicts the assumption described in the first (a &ldquo;nearly lifeless&rdquo; ocean floor versus &ldquo;thriving communities&rdquo;), so a contrasting transition is needed. &ldquo;Therefore&rdquo; signals a result, &ldquo;Similarly&rdquo; signals agreement, and &ldquo;For example&rdquo; would present the discovery as an illustration of the assumption.", "tag": "Transitions", "tagcolor": "#f5a623"}, {"context": "Working as a &ldquo;computer&rdquo; at the Harvard College Observatory in the early 1900s, ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["a link between how bright certain pulsating stars are and how quickly they brighten and dim was discovered by Henrietta Leavitt.", "Henrietta Leavitt&rsquo;s discovery was that the brightness of certain pulsating stars is linked to how quickly they brighten and dim.", "Henrietta Leavitt discovered that the brightness of certain pulsating stars is linked to how quickly they brighten and dim.", "the brightness of certain pulsating stars, Henrietta Leavitt discovered, is linked to how quickly they brighten and dim."], "ci": 2, "exp": "The opening phrase describes the person who was &ldquo;working as a computer,&rdquo; so that person, Henrietta Leavitt, must come immediately after the comma. The other choices place &ldquo;a link,&rdquo; &ldquo;Leavitt&rsquo;s discovery,&rdquo; or &ldquo;the brightness&rdquo; there, creating a dangling modifier.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "The ancient city of Petra, carved into the rose-colored sandstone cliffs of present-day Jordan, relied on an ingenious water ______ channels, dams, and underground cisterns captured the region&rsquo;s rare flash floods and stored the water for the long dry months.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["system,", "system", "system:", "system, which"], "ci": 2, "exp": "The text before the blank is a complete sentence, and what follows is a second complete sentence that explains what the &ldquo;ingenious water system&rdquo; was. A colon correctly introduces that explanation. A comma alone creates a comma splice, no punctuation creates a run-on, and &ldquo;which&rdquo; leaves the second clause without a working subject-verb structure.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "Construction of the Panama Canal took a full decade. By the time the canal finally opened to ships in 1914, workers ______ more than 200 million cubic yards of rock and soil.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["excavate", "had excavated", "have excavated", "will have excavated"], "ci": 1, "exp": "The digging was completed before another past event (the opening in 1914), so the past perfect &ldquo;had excavated&rdquo; is needed. The present &ldquo;excavate&rdquo; and present perfect &ldquo;have excavated&rdquo; do not fit a completed past sequence, and the future perfect points to a time after now.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "While researching a topic, a student has taken the following notes:<br><ul style='margin:6px 0 0 18px;padding:0;'><li>Venus and Mars are the two planets closest to Earth.</li><li>Venus has an extremely thick atmosphere made mostly of carbon dioxide.</li><li>Its surface temperature is about 465&deg;C, hot enough to melt lead.</li><li>Mars has a very thin atmosphere, also made mostly of carbon dioxide.</li><li>Its average surface temperature is about &minus;60&deg;C.</li></ul>", "stem": "The student wants to contrast the atmospheres of Venus and Mars. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["Venus and Mars, the two planets closest to Earth, both have atmospheres made mostly of carbon dioxide.", "Venus has a surface temperature of about 465&deg;C, which is hot enough to melt lead.", "Although the atmospheres of both planets are made mostly of carbon dioxide, Venus&rsquo;s atmosphere is extremely thick, while Mars&rsquo;s is very thin.", "Mars has an average surface temperature of about &minus;60&deg;C, and its atmosphere is made mostly of carbon dioxide."], "ci": 2, "exp": "The goal is a contrast between the two atmospheres. Only this choice sets thick against thin. One choice states only a similarity, and the other two describe a single planet, mostly its temperature.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "The network of underground irrigation tunnels that Persian engineers dug beneath the desert more than 2,500 years ago ______ water to farms and villages in parts of Iran even today.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["carry", "are carrying", "have carried", "carries"], "ci": 3, "exp": "The subject is the singular noun &ldquo;network,&rdquo; not &ldquo;tunnels&rdquo; or &ldquo;engineers,&rdquo; which are inside modifying phrases. A singular subject needs the singular verb &ldquo;carries,&rdquo; and &ldquo;even today&rdquo; calls for the present tense. The other choices are all plural verb forms.", "tag": "Form, Structure, and Sense", "tagcolor": "#1D9E75"}, {"context": "Most metals expand when ______ water, however, behaves unusually: as it cools below about 4&deg;C, it actually expands, which is why ice floats on lakes instead of sinking.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["heated,", "heated", "heated;", "heated, which"], "ci": 2, "exp": "Both &ldquo;Most metals expand when heated&rdquo; and &ldquo;water, however, behaves unusually&rdquo; are independent clauses. A semicolon correctly joins them, and &ldquo;however&rdquo; is set off by commas inside the second clause. A comma alone is a comma splice, no punctuation misreads as &ldquo;heated water,&rdquo; and &ldquo;which&rdquo; makes the sentence ungrammatical.", "tag": "Boundaries", "tagcolor": "#185FA5"}, {"context": "While researching a topic, a student has taken the following notes:<br><ul style='margin:6px 0 0 18px;padding:0;'><li>Mae Jemison was born in 1956 in Decatur, Alabama.</li><li>She earned a medical degree from Cornell University in 1981.</li><li>She served as a Peace Corps medical officer in Sierra Leone and Liberia.</li><li>In 1992, she flew aboard the space shuttle <i>Endeavour</i>.</li><li>She was the first African American woman to travel to space.</li></ul>", "stem": "The student wants to emphasize the range of work Jemison did before her spaceflight. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "opts": ["In 1992, Mae Jemison became the first African American woman to travel to space when she flew aboard the space shuttle <i>Endeavour</i>.", "Mae Jemison, who was born in Decatur, Alabama, in 1956, earned a medical degree from Cornell University in 1981.", "Mae Jemison flew aboard the space shuttle <i>Endeavour</i>, and she was the first African American woman to travel to space.", "Before she flew aboard the space shuttle <i>Endeavour</i> in 1992, Mae Jemison earned a medical degree and served as a Peace Corps medical officer in West Africa."], "ci": 3, "exp": "Only this choice presents more than one kind of work (medicine and Peace Corps service) and places it &ldquo;before&rdquo; the spaceflight. The other choices focus only on the flight itself or mention just one earlier accomplishment.", "tag": "Rhetorical Synthesis", "tagcolor": "#7b61ff"}, {"context": "When the Erie Canal opened in 1825, it slashed the cost of moving goods between the Great Lakes and New York City, with freight rates falling from about $100 per ton to roughly $10. ______ New York City soon overtook Philadelphia and Boston as the busiest port in the United States.", "stem": "Which choice completes the text with the most logical transition?", "opts": ["Nevertheless,", "In contrast,", "Likewise,", "As a result,"], "ci": 3, "exp": "The cheaper shipping described in the first sentence caused New York City&rsquo;s rise, so a cause-and-effect transition is logical. &ldquo;Nevertheless&rdquo; and &ldquo;In contrast&rdquo; signal opposition, and &ldquo;Likewise&rdquo; signals a similar, separate point.", "tag": "Transitions", "tagcolor": "#f5a623"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
