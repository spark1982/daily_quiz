  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }

<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261001";
var RAW_QUESTIONS = [{"stem": "Marcus wants to research a company before buying its stock. Which source would give him the most reliable financial information about the company?", "opts": ["The company&rsquo;s annual report filed with the Securities and Exchange Commission (SEC)", "A stranger&rsquo;s post in an online chat room", "A billboard advertising the company&rsquo;s products", "A rumor he heard at school"], "ci": 0, "exp": "Public companies must file annual reports (Form 10-K) with the SEC, and those reports contain audited financial statements, making them a reliable source of securities information."}, {"stem": "Cedar Lane Bakery budgeted $3,000 for flour in March but actually spent $3,600. What is the $600 difference called, and what should management do?", "opts": ["An unfavorable variance; management should investigate why the cost was higher than planned", "A favorable variance; management should celebrate", "A sunk cost; management should ignore it", "Net income; management should report it as profit"], "ci": 0, "exp": "A variance is the difference between budgeted and actual amounts. Spending more than planned is unfavorable, and variance analysis means finding the cause so it can be corrected."}, {"stem": "Pine Ridge Bikes expects to build 400 bikes next quarter. Its cost accountant estimates the materials, labor, and overhead needed for that level of production. What is she preparing?", "opts": ["A cost budget that plans production costs ahead of time", "An income tax return", "A customer satisfaction survey", "A list of the company&rsquo;s stockholders"], "ci": 0, "exp": "Cost accounting budgets estimate the costs of materials, labor, and overhead for planned production, which helps managers control spending."}, {"stem": "Elena, an office assistant at Granite Tax Services, has five tasks due today, including one client tax filing due by noon. What should she do first?", "opts": ["Start with the easiest task to build momentum", "Work on whatever task the next visitor asks about", "List her tasks, rank them by deadline and importance, and start with the noon filing", "Wait until the afternoon to decide what matters most"], "ci": 2, "exp": "Organizing work means listing tasks and prioritizing by deadline and importance. The filing due at noon has the most urgent deadline and the most serious consequences if it is missed."}, {"stem": "The new manager of a credit union branch wants her team to cut member wait times in half. Which approach would best enlist her team in working toward this shared vision?", "opts": ["Announce the goal by email and punish anyone who misses it", "Keep the goal secret until the end of the year", "Explain why shorter wait times matter to members and invite the team to suggest ideas for reaching the goal", "Tell employees the goal was set by headquarters, so their opinions do not matter"], "ci": 2, "exp": "Leaders enlist others by communicating a vision clearly, explaining why it matters, and involving the team in shaping how to reach it, which builds commitment."}, {"stem": "A new employee at Ironwood Print Shop wants to skip reading the operating instructions for a large paper cutter because he has used a similar machine before. Why is this a mistake?", "opts": ["Operating instructions are written only for managers.", "Following the operating instructions prevents injuries and damage to the machine.", "Reading instructions always slows down production, so it should be avoided.", "Similar machines always work in exactly the same way."], "ci": 1, "exp": "Machines differ in their safety features and settings. Following the manufacturer&rsquo;s operating instructions helps prevent accidents, injuries, and costly equipment damage."}, {"stem": "A supplier offers the purchasing manager at Clearwater Credit Union free concert tickets if he chooses its company for a new printing contract. What is the ethical response?", "opts": ["Decline the tickets and choose the supplier based on price, quality, and service", "Accept the tickets and choose the supplier", "Accept the tickets but tell no one", "Ask the supplier for more expensive tickets"], "ci": 0, "exp": "Ethical operations require fair, unbiased purchasing decisions. Accepting a gift in exchange for a contract creates a conflict of interest."}, {"stem": "Oakridge Hardware replaces its handwritten ledgers with cloud-based accounting software that updates sales and inventory records automatically. What is the main benefit of this technology?", "opts": ["It removes the need to keep any financial records", "It guarantees the store will never lose money", "It lets the store avoid paying taxes", "Faster, more accurate financial information that managers can access when they need it"], "ci": 3, "exp": "Technology in financial-information management reduces manual errors and gives managers timely, accurate data for decisions. It does not eliminate record-keeping or legal obligations."}, {"stem": "A new state law requires all restaurants to stop using plastic foam containers within six months. Which action by Riverbend Grill would best help its employees adapt to the change?", "opts": ["Ignoring the law until inspectors visit", "Training staff on the new containers and explaining why the law was passed", "Asking employees to buy their own containers", "Telling employees the change is temporary"], "ci": 1, "exp": "Businesses help employees adapt to regulatory change by communicating the reason for the change and training them on new procedures before the deadline."}, {"stem": "Harbor Lane Bakery keeps copies of every invoice, payroll record, and tax filing for seven years. What is the main purpose of keeping these business records?", "opts": ["To provide accurate evidence of transactions for taxes, audits, and decision-making", "To make the office look busy to visiting customers", "To replace the need for a business bank account", "To keep competitors from learning the bakery&rsquo;s prices"], "ci": 0, "exp": "Business records document what happened financially, so owners can file taxes, survive audits, and make decisions based on facts rather than memory."}, {"stem": "The owner of Sunrise Coffee Cart writes down how much she expects to earn and spend each month for the next year. What is the main purpose of this budget?", "opts": ["To plan and control how money will be earned and spent", "To guarantee that the business will make a profit", "To record transactions that have already happened", "To calculate how much tax she owes from last year"], "ci": 0, "exp": "A budget is a financial plan for the future. It helps a business set goals and control spending, but it cannot guarantee a profit."}, {"stem": "Priya records Willow Outfitters&rsquo; daily sales and prepares its financial statements. Her coworker Ben uses those statements to decide whether the company should borrow money to open a second store. Which statement best describes their roles?", "opts": ["Both Priya and Ben work in marketing.", "Priya works in finance, and Ben works in accounting.", "Neither job involves money.", "Priya works in accounting, recording and reporting past transactions, while Ben works in finance, using that information to plan future money decisions."], "ci": 3, "exp": "Accounting focuses on recording and reporting what has already happened, while finance uses that information to make decisions about raising and using money in the future."}, {"stem": "An accountant at Summit Gear is asked by her manager to record next month&rsquo;s sales in this quarter so the company looks more profitable to investors. What should she do?", "opts": ["Agree, because the sales will happen eventually", "Agree, but only if the amount is small", "Record the sales in both quarters to be safe", "Refuse, because recording sales in the wrong period misleads investors and is unethical"], "ci": 3, "exp": "Ethical financial-information management requires accurate, honest reporting. Shifting revenue into the wrong period misrepresents the company&rsquo;s performance to investors."}, {"stem": "Jordan puts $200 from his summer job into a savings account so he can use it to buy a bike next spring. Which function of money does this show?", "opts": ["Medium of exchange", "Unit of account", "Standard of deferred trade", "Store of value"], "ci": 3, "exp": "Money serves as a store of value when people keep it to spend later. A medium of exchange is money used directly to buy something now, and a unit of account is money used to measure value."}, {"stem": "Crestview Insurance installs software that flags claims with unusual patterns, such as several claims filed from the same address in one week. How is the company using technology?", "opts": ["To raise every customer&rsquo;s premium automatically", "To advertise new policies on social media", "To replace all of its claims adjusters immediately", "To identify possible fraud and reduce risk"], "ci": 3, "exp": "Pattern-detection software helps a company spot claims that may be fraudulent, which is a way of using technology to manage risk."}, {"stem": "Northfield Furniture spent $12,000 last year on a marketing study for a product it later cancelled. Now the company is deciding whether to launch a different product. How should it treat the $12,000?", "opts": ["As a sunk cost that should not affect the new decision", "As a direct cost of the new product", "As a reason to relaunch the cancelled product", "As future revenue"], "ci": 0, "exp": "A sunk cost has already been spent and cannot be recovered, so it should not influence future decisions. Only costs and benefits that will change with the decision matter."}, {"stem": "While walking through the storage room at Lakeview Bank, an employee notices boxes stacked in front of the emergency exit. What is the best way to describe this situation?", "opts": ["It is acceptable as long as the boxes are labeled.", "It is a workplace hazard that violates safety rules and should be reported and cleared right away.", "It is a problem only during business hours.", "It is the customers&rsquo; responsibility to move the boxes."], "ci": 1, "exp": "Blocked exits are a common safety hazard because they can trap people during a fire or emergency. Safety regulations require exits to stay clear at all times."}, {"stem": "Maple Street Printing has one building that houses both its printing department and its design department. How should the company handle the building&rsquo;s $6,000 monthly rent when calculating each department&rsquo;s costs?", "opts": ["Divide the rent between the departments using a fair basis, such as the square footage each one uses", "Charge the full rent to whichever department makes less money", "Ignore the rent because it is not a real cost", "Charge the rent to customers as a separate fee"], "ci": 0, "exp": "Cost allocation assigns shared (indirect) costs to departments or products using a reasonable basis, such as space, labor hours, or machine hours."}, {"stem": "At Bayside Bank, one document says, &ldquo;Employees must protect customer privacy.&rdquo; Another lists the exact steps for shredding documents that contain account numbers. Which statement is correct?", "opts": ["Both documents are procedures.", "The first is a procedure, and the second is a policy.", "Neither document needs to be followed by employees.", "The first is a policy, a general rule, and the second is a procedure, step-by-step instructions for following the rule."], "ci": 3, "exp": "A policy is a broad guideline that states what the company expects, while a procedure gives specific steps for carrying out a policy."}, {"stem": "A small company in Ohio sells its software to customers in Brazil and borrows money from a bank in Germany. This situation is an example of", "opts": ["a monopoly, because the company controls all software sales.", "financial globalization, in which money and investments flow across national borders.", "inflation, because prices are rising in every country.", "a barter system, because no money is involved."], "ci": 1, "exp": "Financial globalization describes how businesses, investors, and lenders in different countries are connected through cross-border flows of money, credit, and investment."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
