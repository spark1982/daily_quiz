er in a large keelboat and two smaller boats.<br><br>The journey was <u>arduous</u>, demanding exhausting effort day after day. The explorers paddled against strong currents, carried their boats around waterfalls, and nearly starved while crossing the snowy Bitterroot Mountains. Along the way, a Shoshone woman named Sacagawea joined the expedition with her husband. She served as an interpreter, a person who translates between languages, and helped the Corps trade for horses with her own people.<br><br>In November 1805, the explorers finally reached the Pacific Ocean. They returned to St. Louis in September 1806, having traveled about 8,000 miles. Although they never found an all-water route across the continent, Lewis and Clark brought back maps, plant samples, and descriptions of more than 100 animals unknown to scientists. <u>The Corps of Discovery was the bravest group of explorers in American history.</u> Their journals are still studied by historians and scientists today."}, {"stem": "Which choice lists these events in the order they happened?<br>A. The Corps reached the Pacific Ocean.<br>B. The United States purchased the Louisiana Territory.<br>C. The Corps returned to St. Louis.<br>D. The Corps left a camp near St. Louis and traveled up the Missouri River.", "opts": ["D &rarr; B &rarr; A &rarr; C", "B &rarr; A &rarr; D &rarr; C", "B &rarr; D &rarr; C &rarr; A", "B &rarr; D &rarr; A &rarr; C"], "ci": 3, "exp": "The purchase came first (1803). The Corps left the camp near St. Louis in May 1804, reached the Pacific in November 1805, and returned to St. Louis in September 1806.", "tag": "Sequence of Events", "tagcolor": "#185FA5", "passage": "In 1803, the United States purchased the Louisiana Territory from France for about $15 million. This <b>enormous</b> region, which stretched from the Mississippi River to the Rocky Mountains, nearly doubled the size of the young nation. However, few Americans knew what lay inside it. In order to learn more, President Thomas Jefferson organized an expedition, or a long journey made for a specific purpose, to explore the land and search for a water route to the Pacific Ocean.<br><br>Jefferson chose Meriwether Lewis, his personal secretary, to lead the group. Lewis invited William Clark, a <b>skilled</b> mapmaker and former army officer, to share command. Their team, called the Corps of Discovery, included about 45 men. In May 1804, they left a camp near St. Louis and traveled up the Missouri River in a large keelboat and two smaller boats.<br><br>The journey was <u>arduous</u>, demanding exhausting effort day after day. The explorers paddled against strong currents, carried their boats around waterfalls, and nearly starved while crossing the snowy Bitterroot Mountains. Along the way, a Shoshone woman named Sacagawea joined the expedition with her husband. She served as an interpreter, a person who translates between languages, and helped the Corps trade for horses with her own people.<br><br>In November 1805, the explorers finally reached the Pacific Ocean. They returned to St. Louis in September 1806, having traveled about 8,000 miles. Although they never found an all-water route across the continent, Lewis and Clark brought back maps, plant samples, and descriptions of more than 100 animals unknown to scientists. <u>The Corps of Discovery was the bravest group of explorers in American history.</u> Their journals are still studied by historians and scientists today."}, {"stem": "Based on Passage A and Passage B, what is one similarity between the icebox and the electric refrigerator?", "opts": ["Both kept foods like milk, meat, and butter from spoiling.", "Both needed an iceman to deliver ice several times a week.", "Both used an electric motor to pump a refrigerant.", "Both depended on ponds freezing during the winter."], "ci": 0, "exp": "Passage A says the icebox kept &ldquo;milk, meat, and butter from spoiling,&rdquo; and Passage B says that with a refrigerator, &ldquo;milk, meat, and butter could stay fresh for days.&rdquo; Only the icebox needed ice deliveries and frozen ponds, and only the refrigerator used a motor and refrigerant.", "tag": "Paired Passage — Synthesis (Similarities)", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br>Before electric refrigerators, many American families kept food cold with natural ice. In the 1800s, workers in New England waited for ponds and lakes to freeze solid each winter. Then they used horses and large saws to cut the ice into heavy blocks. The blocks were packed in sawdust and stored in thick-walled icehouses, where they could last until summer. An iceman delivered fresh blocks by wagon to homes several times a week. Families placed the ice in a wooden cabinet called an icebox to keep milk, meat, and butter from spoiling. When the ice melted, they needed another delivery.<br><br><strong>Passage B</strong><br>In the 1920s and 1930s, electric refrigerators began to appear in American kitchens. Inside each one, an electric motor pumped a special chemical called a refrigerant through metal coils. As the refrigerant changed from a liquid to a gas, it absorbed heat from inside the cabinet, keeping the food cold. Because the machine produced its own cold, families no longer had to wait for winter or for the iceman&rsquo;s wagon. By the late 1940s, most American homes had a refrigerator, and milk, meat, and butter could stay fresh for days."}, {"stem": "How was keeping food cold with an icebox different from keeping it cold with an electric refrigerator?", "opts": ["An icebox needed ice that was cut in winter and delivered, while a refrigerator produced its own cold with a machine.", "An icebox kept food fresh for months, while a refrigerator kept food fresh for only one hour.", "An icebox was invented in the 1930s, while a refrigerator was used in the 1800s.", "An icebox used a refrigerant, while a refrigerator used blocks of ice."], "ci": 0, "exp": "Passage A explains that ice was cut from frozen ponds and delivered by an iceman. Passage B explains that a refrigerator&rsquo;s motor and refrigerant &ldquo;produced its own cold,&rdquo; so families &ldquo;no longer had to wait for winter or for the iceman&rsquo;s wagon.&rdquo; The other choices mix up or invent details.", "tag": "Paired Passage — Contrast (Differences)", "tagcolor": "#185FA5", "passage": "<strong>Passage A</strong><br>Before electric refrigerators, many American families kept food cold with natural ice. In the 1800s, workers in New England waited for ponds and lakes to freeze solid each winter. Then they used horses and large saws to cut the ice into heavy blocks. The blocks were packed in sawdust and stored in thick-walled icehouses, where they could last until summer. An iceman delivered fresh blocks by wagon to homes several times a week. Families placed the ice in a wooden cabinet called an icebox to keep milk, meat, and butter from spoiling. When the ice melted, they needed another delivery.<br><br><strong>Passage B</strong><br>In the 1920s and 1930s, electric refrigerators began to appear in American kitchens. Inside each one, an electric motor pumped a special chemical called a refrigerant through metal coils. As the refrigerant changed from a liquid to a gas, it absorbed heat from inside the cabinet, keeping the food cold. Because the machine produced its own cold, families no longer had to wait for winter or for the iceman&rsquo;s wagon. By the late 1940s, most American homes had a refrigerator, and milk, meat, and butter could stay fresh for days."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
