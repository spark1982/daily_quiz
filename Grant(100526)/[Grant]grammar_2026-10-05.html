<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_24";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20261005";
var RAW_QUESTIONS = [{"stem": "The rowdy kids <span style=\"text-decoration:underline;\">______</span> to bed an hour before the babysitter arrived.", "opts": ["had gone", "have gone", "will have gone", "went"], "ci": 0, "exp": "\"had gone\" is past perfect — the kids were already in bed before the babysitter came.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The engineer's blueprints were approved last week.", "The plant dropped it's leaves in the fall.", "The best seat in the house is mines.", "The book's on the shelf need to be reorganized."], "ci": 0, "exp": "<strong>\"engineer's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>it's</em> = <em>it is</em>; the possessive is <em>its</em>.<br>• <em>mines</em> does not exist; the correct form is <em>mine</em>.<br>• <em>book's</em> incorrectly adds an apostrophe to a simple plural noun.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>The workers <b>repaired</b> the road.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The road ______ by the workers.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["was repaired", "were repaired", "was repairing", "was repair"], "ci": 0, "exp": "The new subject \"the road\" is singular and the action is in the past, so use was + the past participle \"repaired\": was repaired.", "tag": "Passive Voice", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["tiny antique silver spoon", "antique tiny silver spoon", "silver tiny antique spoon", "tiny silver antique spoon"], "ci": 0, "exp": "Correct order: size (tiny) → age (antique) → material (silver) → noun\n✔ tiny antique silver spoon", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "Despite the heavy rain, the cheerful children played energetically in the muddy puddles outside.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the VERBS in this sentence, and only the verbs?</span>", "opts": ["played", "heavy, played", "played, outside", "(none of these)"], "ci": 0, "exp": "'Played' is the main verb.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "She is <u>shop</u> for new shoes.", "opts": ["shopping", "shoping", "shopng", "shopped"], "ci": 0, "exp": "shop → shopping (short vowel + single consonant: double the -p, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>break</b> &rsaquo; Past: <b>broke</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["breaked", "broke", "breaking", "broken"], "ci": 3, "exp": "'break' is an irregular verb. Its past participle is 'broken'. Past perfect: had broken.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Her constant encouragement and unwavering belief kept the exhausted team highly motivated throughout the project.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>objective complement</b> in this sentence?</span>", "opts": ["highly motivated throughout the project", "the exhausted team"], "ci": 0, "exp": "\"Highly motivated throughout the project\" is the objective complement — it describes the state of \"the exhausted team.\" \"The exhausted team\" is the object.", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>calf</b>?", "opts": ["calfs", "calfes", "calvs", "calves"], "ci": 3, "exp": "calf → calves (-f changes to -ves)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["There was several reasons why the game was canceled last Friday.", "Here comes the players who will represent our school in the competition.", "There were several reasons why the game was canceled last Friday.", "There is many different ways to solve that particular math problem."], "ci": 2, "exp": "\"Several reasons\" is plural, so \"were\" is correct. \"Was\" is singular — wrong for several reasons. \"Players\" is plural — use \"come.\" \"Ways\" is plural — use \"are.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "I showed them my photos.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>direct object</b> in this sentence?</span>", "opts": ["my photos", "them"], "ci": 0, "exp": "\"My photos\" is the direct object (what was shown). \"Them\" is the indirect object (who saw them).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "gentle<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["gentler / gentlest", "gentleer / gentleest", "more gentle / most gentle", "gentlere / gentleste"], "ci": 0, "exp": "gentle → gentler / gentlest (silent -e: drop -e, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["The cursor is <b>blinking</b> on the screen.", "The <b>blinking</b> cursor waited for her to type.", "The light was <b>blinking</b> on the dashboard.", "<b>Blinking</b> rapidly can be a sign of dry eyes."], "ci": 1, "exp": "In \"The blinking cursor waited for her to type,\" \"blinking\" comes directly before the noun \"cursor\" and describes what the cursor is doing - this adjective use of an -ing word is a present participle. In \"The cursor is blinking on the screen\" and \"The light was blinking on the dashboard,\" \"blinking\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Blinking rapidly can be a sign of dry eyes,\" \"blinking\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["My mothers recipe for kimchi is very different from my aunts.", "My mother's recipe for kimchi is very different from my aunt's.", "My mothers' recipe for kimchi is very different from my aunts'.", "My mother's recipe for kimchi is very different from my aunts."], "ci": 1, "exp": "A singular possessive adds apostrophe + s. \"My mother's\" = the recipe belonging to one mother. \"My aunt's\" = something belonging to one aunt. \"My aunts\" without an apostrophe is simply a plural, not a possessive.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">He had scarcely put down his bag when his mother called him.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Scarcely he had put down his bag when his mother called him.", "Scarcely had he put down his bag when his mother called him.", "Scarcely did he put down his bag when his mother called him.", "Scarcely had he put down his bag that his mother called him."], "ci": 1, "exp": "\"Scarcely\" triggers inversion with past perfect: \"Scarcely + had + he + put down...\". The conjunction is \"when\" (not \"that\"). The correct form is: Scarcely had he put down his bag when his mother called him.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "The children were excited _____ their upcoming trip to the national park next summer.", "opts": ["about", "of", "for", "from"], "ci": 0, "exp": "\"Excited about\" is the standard expression for feeling enthusiasm toward an event or thing. \"For\" is sometimes used but \"about\" is the most natural preposition here.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "I ________ this week's report.", "opts": ["did not write yet", "have not written yet"], "ci": 1, "exp": "Yet with present relevance = present perfect: have not written yet.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["<b>Teaching</b> young children requires great patience.", "She is <b>teaching</b> a math class right now.", "He was <b>teaching</b> when the fire drill started.", "They will be <b>teaching</b> a new unit next semester."], "ci": 0, "exp": "In \"Teaching young children requires great patience,\" \"teaching\" is the subject of the sentence - a noun - which makes it a gerund. In the other three sentences, \"teaching\" follows \"is / was / will be\" and describes an action in progress, so it is part of the progressive tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>keep</b>?", "opts": ["kept", "keeped", "keepen", "keepted"], "ci": 0, "exp": "The past tense of <b>keep</b> is <b>kept</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "The scientist <u>classify</u> new insects every year.", "opts": ["classifies", "classifys", "classifes", "classifyes"], "ci": 0, "exp": "classify → classifies (consonant + y: drop -y, add -ies)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "He became <u>angry</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Angry\" follows the linking verb \"became\" and describes the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "She _____ told me about her plan twice already.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" (has) is correct. The telling happened in the past but is relevant to the current situation.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "Although they had trained for months, the team lost the championship by just one point in the final second.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the VERB of this sentence?</span>", "opts": ["lost", "trained", "competed", "played"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["While the bread was rising in the oven.", "An old map of the city from the 1800s.", "The nurse checked the patient's temperature.", "Shivering in the cold morning air."], "ci": 2, "exp": "\"The nurse checked the patient's temperature.\" is a complete sentence — subject: 'The nurse', predicate: 'checked'. The others are fragments: a 'While' clause, a noun phrase, and an -ing phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
