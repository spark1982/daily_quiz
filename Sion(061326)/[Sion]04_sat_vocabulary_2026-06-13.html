<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Vocabulary</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;max-width:700px;margin:0 auto;}
.date-hd{text-align:center;font-size:2rem;font-weight:800;color:#185FA5;padding:6px 0;}
.title-hd{text-align:center;font-size:1.3rem;font-weight:700;margin:4px 0 2px 0;color:#111;}
.attempts-hd{text-align:center;font-size:0.88rem;color:#555;margin-bottom:10px;}
.q-word{font-size:2rem;font-weight:800;color:#185FA5;text-align:center;margin:10px 0 4px;}
.speak-wrap{text-align:center;margin-bottom:6px;}
.speak-btn{background:#e8edf4;border:none;border-radius:20px;padding:6px 18px;font-size:0.88rem;cursor:pointer;color:#185FA5;font-weight:600;}
.tag-review{display:inline-block;background:#f5a623;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:6px;}
.tag-new{display:inline-block;background:#185FA5;color:#fff;border-radius:14px;padding:3px 12px;font-size:0.78rem;margin-bottom:6px;}
.q-context{font-size:0.93rem;color:#444;background:#f5f7fa;border-radius:8px;padding:10px 14px;margin-bottom:10px;font-style:italic;line-height:1.5;}
.q-num{font-size:0.82rem;color:#888;margin-bottom:4px;}
.q-instruction{font-size:0.88rem;color:#666;margin-bottom:8px;}
.opt-btn{display:block;width:100%;padding:11px 14px;margin:6px 0;border:2px solid transparent;border-radius:10px;background:#e8edf4;color:#111111;font-size:0.93rem;text-align:left;cursor:pointer;}
.opt-btn.correct{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.opt-btn.wrong{background:#FCEBEB;border-color:#E24B4A;color:#501313;}
.opt-btn:disabled{cursor:default;}
.exp-box{background:#fff8e1;border-left:4px solid #f5a623;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:0.88rem;color:#444;display:none;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.nav-btn{padding:10px 22px;border-radius:20px;border:none;cursor:pointer;font-size:0.93rem;font-weight:600;}
.prev-btn{background:#e8edf4;color:#185FA5;}
.next-btn{background:#185FA5;color:#fff;}
.prog-track{background:#d7dde6;border-radius:3px;height:6px;flex:1;margin:0 10px;}
.prog-fill{background:#185FA5;border-radius:3px;height:6px;width:0%;transition:width 0.2s;}
#dot-panel{display:none;max-height:170px;overflow-y:auto;padding:8px;background:#f5f7fa;border-radius:8px;margin-bottom:8px;}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;cursor:pointer;margin:2px;color:#fff;}
.results-card{background:#f5f7fa;border-radius:10px;padding:14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:24px;border-radius:16px;max-width:320px;margin:20px;text-align:center;}
</style>
</head>
<body>
<div class="date-hd">2026-06-13</div>
<div class="title-hd">[Sion] SAT Vocabulary</div>
<div class="attempts-hd" id="att-display">Total Attempts: 0</div>

<div id="nav-bar" style="display:flex;align-items:center;gap:8px;margin:10px 0;">
  <span id="nav-count" style="font-size:13px;white-space:nowrap;color:#555;">0 / 15</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <button onclick="toggleJump()" id="jump-btn" style="font-size:12px;padding:4px 10px;border:1px solid #185FA5;border-radius:14px;background:#fff;color:#185FA5;cursor:pointer;white-space:nowrap;">Jump ▾</button>
</div>
<div id="dot-panel"></div>

<div id="quizArea" style="display:none;">
  <div id="q-tag-wrap" style="text-align:center;margin-bottom:4px;"></div>
  <div class="q-num" id="q-num" style="text-align:center;"></div>
  <div class="q-word" id="q-word"></div>
  <div class="speak-wrap"><button class="speak-btn" onclick="speak()">Listen</button></div>
  <div class="q-context" id="q-context"></div>
  <div class="q-instruction">Choose the best meaning for the word above:</div>
  <div id="opts-area"></div>
  <div class="exp-box" id="exp-box"></div>
  <div class="nav-row">
    <button class="nav-btn prev-btn" onclick="go(-1)">Prev</button>
    <button class="nav-btn next-btn" id="next-btn" onclick="go(1)">Next</button>
  </div>
</div>

<div id="resultsArea" style="display:none;">
  <h2 style="text-align:center;color:#185FA5;margin:16px 0 8px;">Results</h2>
  <div id="results-summary" style="text-align:center;font-size:1.1rem;margin-bottom:14px;"></div>
  <div id="results-cards"></div>
  <button onclick="retryWrong()" style="display:block;width:100%;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Retry Wrong Ones</button>
  <button onclick="copyRes()" style="display:block;width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:12px;">Copy All Results</button>
  <button onclick="openFreshModal()" style="display:block;width:100%;padding:13px;background:#e8edf4;color:#111;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;">Start Fresh</button>
</div>

<div class="modal-overlay" id="freshModal">
  <div class="modal-box">
    <p style="font-size:1.05rem;font-weight:600;margin:0 0 16px;">Start fresh? All progress will be lost.</p>
    <button onclick="confirmFresh()" style="background:#E24B4A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;margin-right:8px;">Yes, Start Fresh</button>
    <button onclick="document.getElementById('freshModal').style.display='none';" style="background:#e8edf4;color:#111;border:none;padding:11px 22px;border-radius:8px;font-size:0.95rem;cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
(function(){
var QUIZ_KEY='quiz_satvocab_15_20260613_v1';
var ATT_KEY='quiz_satvocab_attempts_20260613_v1';
var qs=[
 {w:'hubris',tag:'Review',ctx:'The CEO\'s hubris led him to make decisions without consulting his team.',
  opts:["excessive pride or arrogance","extreme caution and care","deep regret for past actions","hidden envy toward others"],ci:0,
  exp:'Hubris means "excessive pride or arrogance." In Greek tragedy, a hero\'s hubris often leads to their downfall.'},
 {w:'terse',tag:'Review',ctx:'Her terse reply — just two words — made it clear she was annoyed.',
  opts:["wordy and elaborate","brief and to the point","vague and unclear","formal in tone"],ci:1,
  exp:'Terse means "brief and to the point." A terse response is short and sometimes blunt.'},
 {w:'tenuous',tag:'Review',ctx:'The detective had only a tenuous connection between the suspect and the crime scene.',
  opts:["extremely strong","clearly visible","very weak or slight","highly organized"],ci:2,
  exp:'Tenuous means "very weak or slight; lacking substance." A tenuous argument barely holds together.'},
 {w:'malleable',tag:'Review',ctx:'Gold is highly malleable — it can be hammered into thin sheets without breaking.',
  opts:["resistant to change","difficult to understand","easily shaped or influenced","highly critical of others"],ci:2,
  exp:'Malleable means "easily shaped, influenced, or changed." The word applies to both physical materials and personalities.'},
 {w:'exacerbate',tag:'Review',ctx:'The heavy rains exacerbated the flooding that had already devastated the town.',
  opts:["to completely resolve","to gradually improve","to make worse","to carefully examine"],ci:2,
  exp:'Exacerbate means "to make a bad situation worse." Synonym: aggravate.'},
 {w:'abstruse',tag:'New',ctx:'The philosopher\'s abstruse arguments were nearly impossible for the general public to follow.',
  opts:["simple and easy to understand","commonly known by everyone","widely popular and accepted","difficult to understand; obscure"],ci:3,
  exp:'Abstruse means "difficult to understand; obscure." Abstruse theories are understood only by experts.'},
 {w:'accede',tag:'New',ctx:'After lengthy negotiations, the company finally acceded to the employees\' request for higher wages.',
  opts:["to firmly refuse a request","to agree or give consent","to formally make an announcement","to secretly plan against"],ci:1,
  exp:'Accede means "to agree to a demand or request." It often implies yielding after resistance.'},
 {w:'accolade',tag:'New',ctx:'Winning the national championship was the greatest accolade of her athletic career.',
  opts:["a harsh and public criticism","a formal written apology","an award or expression of praise","a legal written warning"],ci:2,
  exp:'Accolade means "an award or special praise." Accolades are given in recognition of achievement.'},
 {w:'acquiesce',tag:'New',ctx:'Although he disagreed with the plan, he chose to acquiesce rather than cause conflict.',
  opts:["to argue loudly and publicly","to express great joy","to accept reluctantly without protest","to ask others for help"],ci:2,
  exp:'Acquiesce means "to accept something without protest, often reluctantly." It suggests silent compliance.'},
 {w:'adamant',tag:'New',ctx:'She was adamant that the new policy was unfair and refused to sign it under any circumstances.',
  opts:["easily persuaded by arguments","temporarily uncertain or confused","only mildly interested","refusing to change one\'s mind; unyielding"],ci:3,
  exp:'Adamant means "refusing to change one\'s mind; completely unyielding." Originally referred to a hard stone.'},
 {w:'admonish',tag:'New',ctx:'The coach admonished the player for repeatedly arriving late to morning practice.',
  opts:["to warmly praise in public","to warn or firmly criticize","to completely and permanently ignore","to secretly watch or observe"],ci:1,
  exp:'Admonish means "to warn or firmly criticize someone." It suggests gentle but serious correction.'},
 {w:'adulation',tag:'New',ctx:'The young singer was unprepared for the adulation that greeted her debut performance.',
  opts:["intense public dislike","excessive admiration or praise","a formal written complaint","a balanced and fair judgment"],ci:1,
  exp:'Adulation means "excessive admiration or praise." Fans often shower celebrities with adulation.'},
 {w:'adverse',tag:'New',ctx:'The expedition continued despite adverse weather conditions and limited supplies.',
  opts:["strongly helpful and supportive","widely predicted in advance","harmful or unfavorable","neatly and carefully organized"],ci:2,
  exp:'Adverse means "harmful or unfavorable." Adverse conditions work against you. Do not confuse with "averse" (opposed to).'},
 {w:'affinity',tag:'New',ctx:'From an early age, she had a natural affinity for mathematics and patterns.',
  opts:["a strong and lasting dislike","a formal legal agreement","a natural liking or attraction","a careful and close observation"],ci:2,
  exp:'Affinity means "a natural liking or attraction to someone or something." It suggests a deep, instinctive connection.'},
 {w:'affluent',tag:'New',ctx:'The students came from an affluent neighborhood where most families owned multiple cars.',
  opts:["extremely poor and struggling","wealthy; having a lot of money","highly educated and trained","deeply troubled and unhappy"],ci:1,
  exp:'Affluent means "wealthy; having a great deal of money." Synonyms: prosperous, well-off.'}
];
var state={};
function loadState(){
  try{var s=JSON.parse(localStorage.getItem(QUIZ_KEY)||'null');
    if(s&&typeof s.cur==='number'&&s.cur>=0&&s.cur<qs.length&&s.answers&&typeof s.answers==='object'&&s.shuffles&&typeof s.shuffles==='object'){state=s;}
    else{resetState();}
  }catch(e){localStorage.removeItem(QUIZ_KEY);resetState();}
}
function resetState(){state={cur:0,answers:{},shuffles:{},showResults:false};}
function saveState(){localStorage.setItem(QUIZ_KEY,JSON.stringify(state));}
function getShuffle(i){
  if(!state.shuffles[i]){var a=[0,1,2,3];for(var k=3;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}state.shuffles[i]=a;}
  return state.shuffles[i];
}
function getCorrectSI(i){return getShuffle(i).indexOf(qs[i].ci);}
function loadAttempts(){return parseInt(localStorage.getItem(ATT_KEY)||'0',10);}
function updateAttempts(){localStorage.setItem(ATT_KEY,loadAttempts()+1);}
function speak(){
  var w=qs[state.cur].w;
  if(!window.speechSynthesis)return;
  var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);
}
function updateNav(){
  var ans=Object.keys(state.answers).length;
  document.getElementById('nav-count').textContent=ans+' / '+qs.length;
  document.getElementById('prog-fill').style.width=(ans/qs.length*100).toFixed(1)+'%';
  renderDots();
}
function toggleJump(){
  var p=document.getElementById('dot-panel');var b=document.getElementById('jump-btn');
  if(p.style.display==='none'){p.style.display='block';b.textContent='Hide ▴';renderDots();}
  else{p.style.display='none';b.textContent='Jump ▾';}
}
function renderDots(){
  var p=document.getElementById('dot-panel');if(p.style.display==='none')return;
  var h='';
  for(var i=0;i<qs.length;i++){
    var bg=state.answers[i]===undefined?'#d7dde6':(state.answers[i]===getCorrectSI(i)?'#185FA5':'#E24B4A');
    h+='<span class="dot" style="background:'+bg+';" onclick="goToQ('+i+')">'+(i+1)+'</span>';
  }
  if(Object.keys(state.answers).length===qs.length){h+='<br><span onclick="showResults()" style="display:inline-block;margin-top:6px;background:#185FA5;color:#fff;padding:4px 16px;border-radius:12px;font-size:0.82rem;cursor:pointer;">Results</span>';}
  p.innerHTML=h;
}
function goToQ(i){state.cur=i;state.showResults=false;saveState();render();document.getElementById('dot-panel').style.display='none';document.getElementById('jump-btn').textContent='Jump ▾';}
function showResults(){state.showResults=true;updateAttempts();saveState();render();}
function render(){
  document.getElementById('att-display').textContent='Total Attempts: '+loadAttempts();
  if(state.showResults){renderResults();return;}
  document.getElementById('quizArea').style.display='block';
  document.getElementById('resultsArea').style.display='none';
  updateNav();
  var i=state.cur;var q=qs[i];
  document.getElementById('q-num').textContent='Question '+(i+1)+' of '+qs.length;
  document.getElementById('q-word').textContent=q.w;
  document.getElementById('q-tag-wrap').innerHTML='<span class="tag-'+(q.tag==='Review'?'review':'new')+'">'+q.tag+'</span>';
  document.getElementById('q-context').textContent=q.ctx;
  var sh=getShuffle(i);var ans=state.answers[i];var csi=getCorrectSI(i);
  var html='';
  for(var s=0;s<4;s++){
    var oi=sh[s];var cls='opt-btn';var dis='';
    if(ans!==undefined){dis='disabled';if(s===csi)cls+=' correct';else if(s===ans)cls+=' wrong';}
    html+='<button class="'+cls+'" '+dis+' onclick="pick('+i+','+s+')">'+escHtml(q.opts[oi])+'</button>';
  }
  document.getElementById('opts-area').innerHTML=html;
  var eb=document.getElementById('exp-box');
  if(ans!==undefined&&ans!==csi){eb.style.display='block';eb.textContent=q.exp;}else{eb.style.display='none';}
  document.getElementById('next-btn').textContent=(i===qs.length-1)?'See Results →':'Next';
  document.querySelector('.prev-btn').disabled=(i===0);
}
function renderResults(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultsArea').style.display='block';
  updateNav();
  var c=0,w=0,sk=0;
  for(var i=0;i<qs.length;i++){if(state.answers[i]===undefined)sk++;else if(state.answers[i]===getCorrectSI(i))c++;else w++;}
  document.getElementById('results-summary').innerHTML='<span style="color:#1D9E75;font-weight:700;">'+c+'</span> correct &nbsp;<span style="color:#E24B4A;font-weight:700;">'+w+'</span> wrong &nbsp;<span style="color:#888;font-weight:700;">'+sk+'</span> skipped';
  var html='';
  for(var i=0;i<qs.length;i++){
    var a=state.answers[i];var label,bg,tc;
    if(a===undefined){label='Skipped';bg='#d7dde6';tc='#555';}
    else if(a===getCorrectSI(i)){label='Correct';bg='#E1F5EE';tc='#085041';}
    else{label='Wrong';bg='#FCEBEB';tc='#501313';}
    html+='<div class="results-card" onclick="goToQ('+i+')"><span style="font-size:0.9rem;color:#333;">Q'+(i+1)+': '+escHtml(qs[i].w)+'</span><span style="padding:3px 12px;border-radius:12px;font-size:0.82rem;font-weight:600;background:'+bg+';color:'+tc+';">'+label+'</span></div>';
  }
  document.getElementById('results-cards').innerHTML=html;
}
function pick(qi,si){if(state.answers[qi]!==undefined)return;state.answers[qi]=si;saveState();render();}
function go(dir){
  if(dir===1&&state.cur===qs.length-1){showResults();return;}
  state.cur=Math.max(0,Math.min(qs.length-1,state.cur+dir));saveState();render();
}
function retryWrong(){
  var first=-1;
  for(var i=0;i<qs.length;i++){if(state.answers[i]!==undefined&&state.answers[i]!==getCorrectSI(i)){if(first===-1)first=i;delete state.answers[i];}}
  if(first!==-1){state.cur=first;state.showResults=false;saveState();render();}
}
function copyRes(){
  var lines=['[Sion] SAT Vocabulary - Results (2026-06-13)'];
  for(var i=0;i<qs.length;i++){var a=state.answers[i];lines.push('Q'+(i+1)+' ('+qs[i].w+'): '+(a===undefined?'Skipped':a===getCorrectSI(i)?'Correct':'Wrong'));}
  var txt=lines.join('\n');
  if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(function(){fb(txt);});}else{fb(txt);}
}
function fb(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
function openFreshModal(){document.getElementById('freshModal').style.display='flex';}
function confirmFresh(){document.getElementById('freshModal').style.display='none';localStorage.removeItem(QUIZ_KEY);resetState();saveState();render();}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.pick=pick;window.go=go;window.goToQ=goToQ;window.toggleJump=toggleJump;
window.retryWrong=retryWrong;window.copyRes=copyRes;window.openFreshModal=openFreshModal;
window.confirmFresh=confirmFresh;window.showResults=showResults;window.speak=speak;

loadState();saveState();render();
})();
</script>
</body>
</html>
