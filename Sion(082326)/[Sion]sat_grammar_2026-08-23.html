<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[Sion] SAT Grammar</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 18px 60px 18px;
    background: #f4f6f9;
    color: #1f2530;
  }
  h1 {
    font-size: 26px;
    margin: 10px 0 4px 0;
    color: #14213d;
  }
  .instructions {
    font-size: 15px;
    color: #4a5568;
    margin: 0 0 18px 0;
  }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .attempts {
    font-size: 14px;
    font-weight: 600;
    color: #14213d;
  }
  .timer-widget {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .timer-widget input {
    width: 56px;
    padding: 5px 6px;
    border: 1px solid #d7dde6;
    border-radius: 6px;
    font-size: 14px;
  }
  .timer-widget button {
    background: #14213d;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #timerDisplay {
    font-weight: 700;
    font-size: 16px;
    min-width: 58px;
    display: inline-block;
    color: #14213d;
  }
  #timerDisplay.orange { color: #FF9500; }
  #timerDisplay.red { color: #D93025; }
  .navwrap {
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .navline {
    font-size: 14px;
    font-weight: 600;
    color: #14213d;
    margin-bottom: 8px;
  }
  .progressbar {
    height: 10px;
    width: 100%;
    background: #d7dde6;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progressfill {
    height: 100%;
    background: #185FA5;
    width: 0%;
    transition: width 0.2s ease;
  }
  #toggleDotsBtn {
    background: #eef2f7;
    color: #14213d;
    border: 1px solid #d7dde6;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .dots-panel {
    display: grid;
    grid-template-columns: repeat(auto-fill, 26px);
    gap: 8px;
    margin-top: 12px;
  }
  .dots-panel.hidden { display: none; }
  .dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #d7dde6;
    color: #14213d;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    font-weight: 700;
  }
  .dot.correct { background: #185FA5; color: #ffffff; }
  .dot.wrong { background: #E24B4A; color: #ffffff; }
  .card {
    background: #ffffff;
    border: 1px solid #d7dde6;
    border-radius: 10px;
    padding: 20px;
  }
  .qcount {
    font-size: 13px;
    color: #6b7280;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .context-box {
    background: #f0f4fa;
    border-left: 4px solid #185FA5;
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.55;
    color: #1f2530;
    margin-bottom: 16px;
  }
  .qtext {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
    color: #14213d;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: #ffffff;
    border: 1.5px solid #d7dde6;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14.5px;
    cursor: pointer;
    color: #1f2530;
  }
  .opt:hover { border-color: #185FA5; }
  .opt.selected { border-color: #185FA5; background: #eaf1fb; }
  .opt.correctPick { border-color: #1D9E75; background: #e5f7f0; }
  .opt.wrongPick { border-color: #E24B4A; background: #fbe9e9; }
  .opt.revealCorrect { border-color: #1D9E75; background: #e5f7f0; }
  .opt:disabled { cursor: default; }
  .explanation {
    margin-top: 8px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #f7f8fa;
    border: 1px solid #d7dde6;
    font-size: 14px;
    line-height: 1.5;
    color: #333c48;
    display: none;
  }
  .explanation.show { display: block; }
  .navbtns {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    gap: 10px;
  }
  .navbtns button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
    font-weight: 600;
  }
  #prevBtn { background: #eef2f7; color: #14213d; }
  #nextBtn { background: #185FA5; color: #ffffff; }
  #nextBtn:disabled { background: #b9c6d6; cursor: not-allowed; }
  .resultsBtns {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }
  .resultsBtns button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #ffffff;
  }
  #copyBtn { background: #14213d; }
  #retryBtn { background: #1D9E75; }
  #saveWrongBtn { background: #7b61ff; }
  #freshOrigBtn { background: #34495E; }
  #freshRandBtn { background: #2C3E50; }
  .scoreLine {
    font-size: 20px;
    font-weight: 700;
    color: #14213d;
    margin-bottom: 14px;
  }
  .reviewItem {
    border-bottom: 1px solid #e5e9ef;
    padding: 12px 0;
    font-size: 14px;
  }
  .reviewItem:last-child { border-bottom: none; }
  .reviewItem .rq { font-weight: 600; margin-bottom: 4px; color: #14213d; }
  .reviewItem .rline { margin: 2px 0; }
  .rcorrect { color: #1D9E75; font-weight: 700; }
  .rwrong { color: #E24B4A; font-weight: 700; }
  .hidden { display: none !important; }
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(20,33,61,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-box {
    background: #ffffff;
    border-radius: 10px;
    padding: 22px;
    max-width: 360px;
    width: 90%;
    text-align: center;
  }
  .modal-box p { font-size: 15px; color: #14213d; margin-bottom: 18px; }
  .modal-box button {
    padding: 9px 16px;
    border-radius: 7px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin: 0 6px;
  }
  #modalYesBtn { background: #185FA5; color: #ffffff; }
  #modalNoBtn { background: #eef2f7; color: #14213d; }
</style>
</head>
<body>
<div class="app">
  <h1>[Sion] SAT Grammar</h1>
  <p class="instructions">Choose the best way to revise or complete each passage.</p>

  <div class="topbar">
    <div class="attempts">Total Attempts: <span id="attemptsCount">0</span></div>
    <div class="timer-widget">
      <label for="timeLimitInput">Set Time Limit (min):</label>
      <input type="number" id="timeLimitInput" min="1" max="180" value="20">
      <button onclick="startTimer()">Start</button>
      <span id="timerDisplay">20:00</span>
    </div>
  </div>

  <div class="navwrap" id="navwrap">
    <div class="navline"><span id="answeredCount">0</span>/<span id="totalCount">20</span> answered</div>
    <div class="progressbar"><div class="progressfill" id="progressFill"></div></div>
    <button id="toggleDotsBtn" onclick="toggleDots()">Jump to Question</button>
    <div id="dotsPanel" class="dots-panel hidden"></div>
  </div>

  <div id="quizArea"></div>
  <div id="resultsArea" class="hidden"></div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <p id="modalText">Are you sure?</p>
    <button id="modalYesBtn" onclick="modalConfirmYes()">Yes, Start Fresh</button>
    <button id="modalNoBtn" onclick="modalConfirmNo()">Cancel</button>
  </div>
</div>

<script>
var QUESTIONS = [
  {
    q: "Which choice provides the punctuation needed to set off the nonessential information in the sentence?",
    context: "The archive's founding curator, _____ spent four decades organizing its manuscripts by hand, distrusted the digital cataloguing system installed after her retirement.",
    opts: ["who", "which", "that", "she"],
    ci: 0,
    exp: "\"who\" correctly refers to a person, the curator, in a nonrestrictive clause set off by commas. \"which\" is used for things rather than people, so it does not fit \"the curator.\" \"that\" typically introduces restrictive clauses without surrounding commas, so it does not fit smoothly into a clause already set off by commas. \"she\" leaves no connector linking the clause to \"curator,\" creating a comma splice."
  },
  {
    q: "Which choice most logically introduces the second sentence, given the relationship between the two ideas?",
    context: "The marine biologists had spent three years tagging the migratory whales with satellite trackers. _____, when the tracking data finally arrived, nearly a third of the tags had failed to transmit.",
    opts: ["Moreover,", "Similarly,", "Yet,", "Therefore,"],
    ci: 2,
    exp: "\"Yet,\" correctly signals the contrast between the biologists' extensive multi-year effort and the disappointing outcome that many tags failed. \"Moreover,\" wrongly suggests the failed tags add to, rather than undercut, the effort described in the first sentence. \"Therefore,\" incorrectly implies the tag failures were a logical result of the three years of tagging work rather than a setback to it."
  },
  {
    q: "Which choice most clearly resolves the vague reference created by the underlined pronoun?",
    context: "The city council approved the new zoning ordinance without holding a public hearing, and <u>this</u> angered residents who felt excluded from the process.",
    opts: ["this decision", "this circumstance that happened", "this", "this occurrence"],
    ci: 0,
    exp: "\"this decision\" replaces the vague pronoun with a specific noun that identifies exactly what angered residents, namely the council's choice to skip the hearing. \"this occurrence\" and \"this circumstance that happened\" are still generic nouns that do not specify what actually happened. Leaving the sentence as \"this\" does not resolve the ambiguity at all."
  },
  {
    q: "Which choice provides the punctuation needed to correctly introduce the list that follows?",
    context: "The expedition's supply manifest listed only the essentials_____ dried rations, a satellite phone, and two weeks of fuel.",
    opts: [",", ";", ":", " and"],
    ci: 2,
    exp: "A colon is correct because \"The expedition's supply manifest listed only the essentials\" is a complete independent clause that properly introduces the list that follows. A comma alone is too weak to introduce a list after a complete independent clause in formal writing. A semicolon is reserved for joining two independent clauses, not for introducing a list from a preceding independent clause."
  },
  {
    q: "Which choice best completes the sentence so that the introductory phrase logically modifies the subject that follows?",
    context: "_____, the laboratory's freezer lost power for nearly six hours before anyone noticed.",
    opts: ["Because the backup generator failed unexpectedly", "Having failed unexpectedly", "Failing to activate unexpectedly", "Unexpectedly failing"],
    ci: 0,
    exp: "\"Because the backup generator failed unexpectedly\" supplies its own subject, \"the backup generator,\" so the sentence does not need the introductory phrase to modify \"the laboratory's freezer,\" avoiding a dangling modifier. \"Having failed unexpectedly\" and \"Failing to activate unexpectedly\" both lack a stated subject and would illogically suggest that the freezer itself failed to generate backup power. \"Unexpectedly failing\" has the same problem, leaving no clear actor before the main clause."
  },
  {
    q: "Which choice most logically completes the sentence, given the contrast the writer is making?",
    context: "Local officials had warned that the new ferry route would be unprofitable within its first year of operation. _____, ridership has exceeded projections every quarter since the route launched.",
    opts: ["As a result,", "For instance,", "Instead,", "Consequently,"],
    ci: 2,
    exp: "\"Instead,\" correctly signals that what actually happened, ridership exceeding projections, replaces the officials' original warning of unprofitability. \"As a result,\" and \"Consequently,\" both wrongly imply that the strong ridership was caused by the warning itself rather than contradicting it. \"For instance,\" incorrectly frames the second sentence as an example of the first, when it actually contradicts it."
  },
  {
    q: "Which choice most effectively edits the sentence to eliminate unnecessary wordiness?",
    context: "In spite of the fact that the bridge had already been inspected twice that year, engineers still recommended a third and additional review before the reopening.",
    opts: ["Although the bridge had already been inspected twice that year, engineers still recommended a third review before the reopening.", "In spite of the fact that the bridge had already been inspected twice that year, engineers still recommended a third review before the reopening.", "Although the bridge had already been inspected twice that year, engineers still recommended a third and additional review before the reopening.", "Despite the fact that the bridge had already been inspected twice that year, engineers still recommended a third review before the reopening."],
    ci: 0,
    exp: "\"Although the bridge had already been inspected twice that year, engineers still recommended a third review before the reopening\" replaces the wordy \"in spite of the fact that\" with the concise \"although\" and removes the redundant pairing \"third and additional,\" since a third review is already an additional one. \"In spite of the fact that the bridge had already been inspected twice that year, engineers still recommended a third review before the reopening\" fixes the redundancy but keeps the wordy opening phrase. \"Despite the fact that the bridge had already been inspected twice that year, engineers still recommended a third review before the reopening\" still uses the wordy \"despite the fact that\" instead of the more concise \"despite\" or \"although.\""
  },
  {
    q: "Which choice completes the sentence with a verb that agrees with its subject?",
    context: "The stack of unopened grant applications piled on the director's desk _____ evidence of how quickly the funding cycle had overwhelmed the small office.",
    opts: ["provide", "were providing", "provides", "have provided"],
    ci: 2,
    exp: "\"provides\" agrees with the singular subject \"the stack,\" since \"of unopened grant applications\" is a prepositional phrase modifying \"stack\" rather than part of the subject itself. \"provide\" incorrectly treats the sentence as having a plural subject, likely by agreeing with the nearby plural noun \"applications\" instead of \"stack.\" \"have provided\" both mismatches the singular subject in number and shifts to present perfect tense, which does not fit the sentence's present-tense description."
  },
  {
    q: "Which choice completes the sentence with the verb form that agrees with its subject?",
    context: "Each of the shelters along the coastal trail _____ inspected annually by volunteers before the start of hurricane season.",
    opts: ["are", "have been", "is", "were"],
    ci: 2,
    exp: "\"is\" agrees with the singular subject \"Each,\" since \"of the shelters\" is a prepositional phrase that does not change the subject's number. \"are\" and \"were\" both incorrectly treat the subject as plural, likely by agreeing with the nearby plural noun \"shelters\" instead of \"Each.\" \"have been\" both mismatches the singular subject in number and does not fit the sentence's simple present-tense description of a routine inspection."
  },
  {
    q: "Which choice most effectively completes the sentence while maintaining the parallel structure established earlier in the sentence?",
    context: "The apprenticeship program taught new welders to read blueprints accurately, to operate the equipment safely, and _____.",
    opts: ["to document each repair in detail", "documenting each repair in detail was expected of them", "each repair needed to be documented in detail", "documentation of each repair was required"],
    ci: 0,
    exp: "\"to document each repair in detail\" matches the infinitive form used in \"to read blueprints accurately\" and \"to operate the equipment safely,\" keeping all three items in the list grammatically parallel. \"documenting each repair in detail was expected of them\" abandons the infinitive pattern and turns the third item into an independent clause. \"each repair needed to be documented in detail\" and \"documentation of each repair was required\" both restructure the item into unrelated independent clauses that break the list's parallel structure."
  },
  {
    q: "Which choice best completes the sentence so that the introductory phrase logically modifies the subject that follows?",
    context: "_____, the greenhouse's rarest orchids were moved to a climate-controlled room.",
    opts: ["Once the botanist discovered a crack in the greenhouse's heating pipe,", "Having discovered a crack in the greenhouse's heating pipe,", "Discovering a crack in the greenhouse's heating pipe,", "After discovering a crack in the greenhouse's heating pipe,"],
    ci: 0,
    exp: "\"Once the botanist discovered a crack in the greenhouse's heating pipe,\" supplies its own subject, \"the botanist,\" so the sentence does not need the introductory phrase to modify \"the orchids,\" avoiding a dangling modifier. \"Having discovered a crack in the greenhouse's heating pipe,\" and \"Discovering a crack in the greenhouse's heating pipe,\" both lack a stated subject and would illogically suggest that the orchids themselves discovered the crack. \"After discovering a crack in the greenhouse's heating pipe,\" has the same problem, leaving no clear actor before the main clause."
  },
  {
    q: "Which choice completes the sentence with the correct possessive form?",
    context: "The two research teams published a joint paper crediting the discovery to the _____ combined efforts over eighteen months of fieldwork.",
    opts: ["teams'", "team's", "teams's", "teams"],
    ci: 0,
    exp: "\"teams'\" correctly forms the plural possessive of \"teams,\" showing that the combined efforts belong jointly to both research teams mentioned earlier in the sentence. \"team's\" incorrectly treats the noun as singular, when the sentence has already established that two teams are involved. \"teams's\" is not a standard English possessive form for a plural noun already ending in s."
  },
  {
    q: "Which choice completes the sentence with the pronoun form required by its grammatical role?",
    context: "The scholarship will be awarded to _____ the selection committee believes has demonstrated the strongest commitment to community service.",
    opts: ["who", "whomever", "whom", "whoever"],
    ci: 3,
    exp: "\"whoever\" is correct because it functions as the subject of the verb \"has demonstrated\" within its own clause, not as the object of the earlier verb \"believes.\" \"whom\" and \"whomever\" both incorrectly treat the pronoun as an object rather than the subject of \"has demonstrated.\" \"who\" is close in case but is not the form conventionally used to introduce this type of indefinite noun clause, which requires \"whoever.\""
  },
  {
    q: "Which choice completes the sentence with the verb form appropriate to the hypothetical situation being described?",
    context: "If the museum's insurance policy _____ comprehensive, the board would not have hesitated to lend the painting to the traveling exhibition.",
    opts: ["is", "was", "were", "has been"],
    ci: 2,
    exp: "\"were\" is the subjunctive form required in this hypothetical, contrary-to-fact conditional clause, matching the conditional \"would not have hesitated\" later in the sentence. \"was\" incorrectly uses the ordinary past tense instead of the subjunctive required here. \"is\" and \"has been\" both use tenses that do not match the hypothetical, conditional framing signaled by \"would not have hesitated.\""
  },
  {
    q: "Which choice best maintains the parallel structure established by the correlative conjunction in the sentence?",
    context: "The renovation would not only restore the theater's original chandeliers but also _____ its crumbling plaster ceiling.",
    opts: ["repair", "repairing", "would repair", "the repair of"],
    ci: 0,
    exp: "\"repair\" matches the base verb form \"restore\" that follows \"not only,\" keeping the two halves of the \"not only...but also\" construction grammatically parallel. \"repairing\" shifts unexpectedly into a gerund, breaking the parallel with the earlier verb \"restore.\" \"would repair\" adds an unnecessary modal verb that does not match the plain form \"restore\" used in the first half of the construction, and \"the repair of\" abandons the verb form entirely."
  },
  {
    q: "Which choice most effectively completes the sentence without introducing unnecessary repetition?",
    context: "The final and ultimate decision about the merger rested with the board of directors, not with individual shareholders.",
    opts: ["The final decision about the merger rested with the board of directors, not with individual shareholders.", "The final and ultimate decision about the merger rested with the board of directors, not with individual shareholders.", "The decision, which was both final and ultimate, about the merger rested with the board of directors, not with individual shareholders.", "The final decision that was also ultimate about the merger rested with the board of directors, not with individual shareholders."],
    ci: 0,
    exp: "\"The final decision about the merger rested with the board of directors, not with individual shareholders\" states the outcome without repeating the same idea twice, since \"final\" and \"ultimate\" mean nearly the same thing. \"The final and ultimate decision about the merger rested with the board of directors, not with individual shareholders\" keeps both redundant words. \"The decision, which was both final and ultimate, about the merger rested with the board of directors, not with individual shareholders\" and \"The final decision that was also ultimate about the merger rested with the board of directors, not with individual shareholders\" both restate the redundancy in an even more awkward form."
  },
  {
    q: "Which choice completes the sentence with the verb form that agrees with its subject?",
    context: "Rising above the flooded plain _____ the grain silos that had somehow survived the storm undamaged.",
    opts: ["was", "were", "has been", "is"],
    ci: 1,
    exp: "\"were\" agrees with the plural subject \"the grain silos,\" which appears after the verb in this inverted sentence structure beginning with \"Rising above the flooded plain.\" \"was\" and \"is\" both incorrectly treat the subject as singular. \"has been\" both mismatches the plural subject in number and shifts to present perfect tense, which does not fit the past-tense narrative established by \"survived.\""
  },
  {
    q: "Which choice completes the sentence with the verb tense that best reflects the sequence of events described?",
    context: "By the time the search team reached the summit, the storm _____ for nearly six hours, burying the trail markers under fresh snow.",
    opts: ["had been raging", "has raged", "raged", "rages"],
    ci: 0,
    exp: "\"had been raging\" uses the past perfect progressive to show that the storm had already been in progress for a stretch of time before the search team's arrival, which is itself a past event. \"raged\" only places the storm in the simple past, without clarifying that it had been ongoing before the team arrived. \"has raged\" incorrectly uses the present perfect, which would tie the storm's duration to the present moment rather than to the team's arrival in the past."
  },
  {
    q: "Which choice provides the most effective punctuation for the underlined portion?",
    context: "The nonprofit's records had never been fully digitized <u>archivists, consequently, resorted</u> to searching through decades of paper files by hand.",
    opts: ["digitized; archivists, consequently, resorted", "digitized, archivists consequently resorted", "digitized, archivists, consequently, resorted", "digitized archivists, consequently, resorted"],
    ci: 0,
    exp: "A semicolon correctly joins the two independent clauses, \"The nonprofit's records had never been fully digitized\" and \"archivists, consequently, resorted to searching through decades of paper files by hand,\" while the commas around \"consequently\" correctly set off the interrupting transitional word. Using only a comma before \"archivists\" creates a comma splice, since both sides of the comma are independent clauses. Leaving out all punctuation between \"digitized\" and \"archivists\" creates a run-on sentence."
  },
  {
    q: "Which choice most clearly and logically completes the sentence?",
    context: "When Professor Nakamura submitted a manuscript to Professor Osei for review, _____ had already begun outlining a rebuttal to its central claims.",
    opts: ["she", "he", "her colleague", "the other researcher"],
    ci: 3,
    exp: "\"the other researcher\" clearly identifies that the person outlining the rebuttal is someone other than the professor named as the subject of the main clause, Professor Nakamura, so it can only mean Professor Osei. \"she\" and \"he\" are both ambiguous, since the sentence introduces two professors and a pronoun alone does not indicate which one already had reservations. \"her colleague\" is also ambiguous, since it is unclear whether it refers to Professor Osei as Nakamura's colleague or to some other, unnamed colleague."
  }
];

var STORAGE_STATE = "quiz_sionsatgrammar_20_20260822_v1";
var STORAGE_ATT = "quiz_sionsatgrammar_20260822_att_v1";
var STORAGE_ORDER = "quiz_sionsatgrammar_order_20260822_v1";

var state = null;
var timerInterval = null;
var pendingModalAction = null;

function defaultOrder() {
  var arr = [];
  for (var i = 0; i < QUESTIONS.length; i++) arr.push(i);
  return arr;
}

function defaultState() {
  return {
    order: defaultOrder(),
    answers: new Array(QUESTIONS.length).fill(null),
    current: 0,
    mode: "normal",
    retryQueue: [],
    retryAnswers: {},
    retryCurrent: 0,
    timer: { limitMin: 20, startTs: null, running: false },
    resultsShown: false
  };
}

function loadOrder() {
  try {
    var raw = localStorage.getItem(STORAGE_ORDER);
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr) && arr.length === QUESTIONS.length) return arr;
    }
  } catch (e) {}
  return defaultOrder();
}

function saveOrder(order) {
  try { localStorage.setItem(STORAGE_ORDER, JSON.stringify(order)); } catch (e) {}
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_STATE);
    if (raw) {
      var parsed = JSON.parse(raw);
      var d = defaultState();
      for (var k in d) { if (parsed[k] === undefined) parsed[k] = d[k]; }
      if (!Array.isArray(parsed.answers) || parsed.answers.length !== QUESTIONS.length) {
        parsed.answers = new Array(QUESTIONS.length).fill(null);
      }
      return parsed;
    }
  } catch (e) {}
  return defaultState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_STATE, JSON.stringify(state)); } catch (e) {}
}

function loadAttempts() {
  try {
    var raw = localStorage.getItem(STORAGE_ATT);
    var n = parseInt(raw, 10);
    if (!isNaN(n)) return n;
  } catch (e) {}
  return 0;
}

function saveAttempts(n) {
  try { localStorage.setItem(STORAGE_ATT, String(n)); } catch (e) {}
}

function incrementAttempts() {
  var n = loadAttempts() + 1;
  saveAttempts(n);
  updateAttemptsDisplay();
}

function updateAttemptsDisplay() {
  var el = document.getElementById("attemptsCount");
  if (el) el.textContent = String(loadAttempts());
}

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function activeList() {
  if (state.mode === "retry") {
    return {
      positions: state.retryQueue,
      getAnswer: function (pos) { return state.retryAnswers[pos] || null; },
      setAnswer: function (pos, val) { state.retryAnswers[pos] = val; state.answers[pos] = val; },
      getPointer: function () { return state.retryCurrent; },
      setPointer: function (p) { state.retryCurrent = p; }
    };
  }
  return {
    positions: state.order.map(function (_, i) { return i; }),
    getAnswer: function (pos) { return state.answers[pos]; },
    setAnswer: function (pos, val) { state.answers[pos] = val; },
    getPointer: function () { return state.current; },
    setPointer: function (p) { state.current = p; }
  };
}

function init() {
  state = loadState();
  state.order = loadOrder();
  updateAttemptsDisplay();
  bindTimerResume();
  if (state.resultsShown) {
    renderResults(false);
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  document.getElementById("resultsArea").classList.add("hidden");
  document.getElementById("navwrap").classList.remove("hidden");
  var quizArea = document.getElementById("quizArea");
  quizArea.classList.remove("hidden");

  var al = activeList();
  var posList = al.positions;
  var pointer = al.getPointer();

  if (posList.length === 0) {
    quizArea.innerHTML = "<div class=\"card\"><p>No questions to show.</p></div>";
    return;
  }
  if (pointer >= posList.length) {
    finishRun();
    return;
  }

  var pos = posList[pointer];
  var qIndex = state.order[pos];
  var question = QUESTIONS[qIndex];
  var existing = al.getAnswer(pos);
  var isLast = (pointer === posList.length - 1);

  var html = "";
  html += "<div class=\"card\">";
  html += "<div class=\"qcount\">Question " + (pointer + 1) + " of " + posList.length + "</div>";
  html += "<div class=\"context-box\">" + question.context + "</div>";
  html += "<div class=\"qtext\">" + escapeHtml(question.q) + "</div>";
  html += "<div id=\"optsWrap\">";
  for (var i = 0; i < question.opts.length; i++) {
    var cls = "opt";
    if (existing) {
      if (i === question.ci) cls += " revealCorrect";
      else if (i === existing.picked) cls += " wrongPick";
    }
    html += "<button class=\"" + cls + "\" " + (existing ? "disabled" : "") + " onclick=\"selectOption(" + i + ")\">" + escapeHtml(question.opts[i]) + "</button>";
  }
  html += "</div>";
  html += "<div class=\"explanation" + (existing ? " show" : "") + "\" id=\"expBox\">" + (existing ? escapeHtml(question.exp) : "") + "</div>";
  html += "<div class=\"navbtns\">";
  html += "<button id=\"prevBtn\" onclick=\"prevQuestion()\" " + (pointer === 0 ? "disabled" : "") + ">&larr; Prev</button>";
  var nextDisabled = (!isLast && !existing) ? "disabled" : "";
  var nextLabel = isLast ? "Show Results →" : "Next →";
  html += "<button id=\"nextBtn\" onclick=\"nextQuestion()\" " + nextDisabled + ">" + nextLabel + "</button>";
  html += "</div>";
  html += "</div>";

  quizArea.innerHTML = html;
  updateNav();
  renderDots();
}

function selectOption(i) {
  var al = activeList();
  var posList = al.positions;
  var pointer = al.getPointer();
  var pos = posList[pointer];
  var qIndex = state.order[pos];
  var question = QUESTIONS[qIndex];
  if (al.getAnswer(pos)) return;
  var correct = (i === question.ci);
  al.setAnswer(pos, { picked: i, correct: correct });
  saveState();
  renderQuestion();
}

function nextQuestion() {
  var al = activeList();
  var pointer = al.getPointer();
  al.setPointer(pointer + 1);
  saveState();
  renderQuestion();
}

function prevQuestion() {
  var al = activeList();
  var pointer = al.getPointer();
  if (pointer > 0) {
    al.setPointer(pointer - 1);
    saveState();
    renderQuestion();
  }
}

function jumpTo(pos) {
  var al = activeList();
  var idx = al.positions.indexOf(pos);
  if (idx === -1) return;
  al.setPointer(idx);
  saveState();
  renderQuestion();
}

function toggleDots() {
  var panel = document.getElementById("dotsPanel");
  var btn = document.getElementById("toggleDotsBtn");
  if (panel.classList.contains("hidden")) {
    panel.classList.remove("hidden");
    btn.textContent = "Hide Questions";
  } else {
    panel.classList.add("hidden");
    btn.textContent = "Jump to Question";
  }
}

function renderDots() {
  var al = activeList();
  var posList = al.positions;
  var panel = document.getElementById("dotsPanel");
  var html = "";
  for (var i = 0; i < posList.length; i++) {
    var pos = posList[i];
    var ans = al.getAnswer(pos);
    var cls = "dot";
    if (ans) cls += ans.correct ? " correct" : " wrong";
    html += "<button class=\"" + cls + "\" onclick=\"jumpTo(" + pos + ")\">" + (i + 1) + "</button>";
  }
  panel.innerHTML = html;
}

function updateNav() {
  var al = activeList();
  var posList = al.positions;
  var answeredCount = 0;
  for (var i = 0; i < posList.length; i++) {
    if (al.getAnswer(posList[i])) answeredCount++;
  }
  document.getElementById("answeredCount").textContent = String(answeredCount);
  document.getElementById("totalCount").textContent = String(posList.length);
  var pct = posList.length ? (answeredCount / posList.length) * 100 : 0;
  document.getElementById("progressFill").style.width = pct + "%";
}

function finishRun() {
  incrementAttempts();
  state.resultsShown = true;
  saveState();
  renderResults(true);
}

function renderResults(justFinished) {
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("navwrap").classList.add("hidden");
  var resultsArea = document.getElementById("resultsArea");
  resultsArea.classList.remove("hidden");

  var total = state.order.length;
  var correctCount = 0;
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && state.answers[i].correct) correctCount++;
  }

  var html = "";
  html += "<div class=\"card\">";
  html += "<div class=\"scoreLine\">Score: " + correctCount + " / " + total + "</div>";
  html += "<div class=\"resultsBtns\">";
  html += "<button id=\"copyBtn\" onclick=\"copyAllResults()\">Copy All Results</button>";
  html += "<button id=\"retryBtn\" onclick=\"retryWrongOnes()\">Retry Wrong Ones</button>";
  html += "<button id=\"saveWrongBtn\" onclick=\"saveWrongAnswers()\">틀린 문제 저장</button>";
  html += "<button id=\"freshOrigBtn\" onclick=\"startFreshOriginal()\">Start Fresh (Original Order)</button>";
  html += "<button id=\"freshRandBtn\" onclick=\"startFreshRandom()\">Start Fresh (Random Order)</button>";
  html += "</div>";
  html += "<div id=\"reviewList\">";
  for (var p = 0; p < state.order.length; p++) {
    var qIndex = state.order[p];
    var question = QUESTIONS[qIndex];
    var ans = state.answers[p];
    html += "<div class=\"reviewItem\">";
    html += "<div class=\"rq\">Q" + (p + 1) + ". " + escapeHtml(question.q) + "</div>";
    if (ans) {
      html += "<div class=\"rline\">Your answer: " + escapeHtml(question.opts[ans.picked]) + "</div>";
      html += "<div class=\"rline\">Correct answer: " + escapeHtml(question.opts[question.ci]) + "</div>";
      html += "<div class=\"rline " + (ans.correct ? "rcorrect" : "rwrong") + "\">" + (ans.correct ? "Correct" : "Incorrect") + "</div>";
    } else {
      html += "<div class=\"rline\">Not answered</div>";
    }
    html += "</div>";
  }
  html += "</div>";
  html += "</div>";
  resultsArea.innerHTML = html;
}

function retryWrongOnes() {
  var wrongPositions = [];
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && !state.answers[i].correct) wrongPositions.push(i);
  }
  if (wrongPositions.length === 0) {
    alert("No wrong answers to retry.");
    return;
  }
  state.mode = "retry";
  state.retryQueue = wrongPositions;
  state.retryAnswers = {};
  state.retryCurrent = 0;
  state.resultsShown = false;
  saveState();
  renderQuestion();
}

function saveWrongAnswers() {
  var wrong = [];
  for (var i = 0; i < state.answers.length; i++) {
    var ans = state.answers[i];
    if (ans && !ans.correct) {
      var qIndex = state.order[i];
      var question = QUESTIONS[qIndex];
      wrong.push({ q: question.q, opts: question.opts, ci: question.ci, picked: ans.picked });
    }
  }
  if (wrong.length === 0) {
    alert("No wrong answers to save.");
    return;
  }
  try {
    var payload = { child: "Sion", subject: "[Sion] SAT Grammar", date: "2026-08-22", wrong: wrong };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "sion_sat_grammar_wrong_answers.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) {
    alert("Could not save wrong answers.");
  }
}

function copyAllResults() {
  var lines = [];
  lines.push("[Sion] SAT Grammar Results");
  var correctCount = 0;
  for (var i = 0; i < state.answers.length; i++) {
    if (state.answers[i] && state.answers[i].correct) correctCount++;
  }
  lines.push("Score: " + correctCount + " / " + state.order.length);
  lines.push("");
  for (var p = 0; p < state.order.length; p++) {
    var qIndex = state.order[p];
    var question = QUESTIONS[qIndex];
    var ans = state.answers[p];
    lines.push("Q" + (p + 1) + ": " + question.q);
    if (ans) {
      lines.push("Your answer: " + question.opts[ans.picked]);
      lines.push("Correct answer: " + question.opts[question.ci]);
      lines.push("Result: " + (ans.correct ? "Correct" : "Incorrect"));
    } else {
      lines.push("Not answered");
    }
    lines.push("");
  }
  var text = lines.join("\n");
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        alert("Results copied to clipboard.");
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  } catch (e) {
    try { fallbackCopy(text); } catch (e2) {}
  }
}

function fallbackCopy(text) {
  try {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("Results copied to clipboard.");
  } catch (e) {
    alert("Could not copy results.");
  }
}

function startFreshOriginal() {
  pendingModalAction = "original";
  document.getElementById("modalText").textContent = "Start fresh with questions in the original order? This will reset all progress and the timer.";
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function startFreshRandom() {
  pendingModalAction = "random";
  document.getElementById("modalText").textContent = "Start fresh with questions in random order? This will reset all progress and the timer.";
  document.getElementById("modalOverlay").classList.remove("hidden");
}

function modalConfirmYes() {
  var newOrder = (pendingModalAction === "random") ? shuffleArray(defaultOrder()) : defaultOrder();
  saveOrder(newOrder);
  state = defaultState();
  state.order = newOrder;
  saveState();
  document.getElementById("modalOverlay").classList.add("hidden");
  pendingModalAction = null;
  stopTimerInterval();
  updateTimerDisplay();
  renderQuestion();
}

function modalConfirmNo() {
  document.getElementById("modalOverlay").classList.add("hidden");
  pendingModalAction = null;
}

function startTimer() {
  var input = document.getElementById("timeLimitInput");
  var minutes = parseInt(input.value, 10);
  if (isNaN(minutes) || minutes <= 0) minutes = 20;
  state.timer.limitMin = minutes;
  state.timer.startTs = Date.now();
  state.timer.running = true;
  saveState();
  startTimerInterval();
}

function bindTimerResume() {
  if (state.timer && state.timer.running && state.timer.startTs) {
    startTimerInterval();
  } else {
    updateTimerDisplay();
  }
}

function startTimerInterval() {
  stopTimerInterval();
  tickTimer();
  timerInterval = setInterval(tickTimer, 500);
}

function stopTimerInterval() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function tickTimer() {
  if (!state.timer || !state.timer.running || !state.timer.startTs) {
    updateTimerDisplay();
    return;
  }
  var totalMs = state.timer.limitMin * 60000;
  var elapsed = Date.now() - state.timer.startTs;
  var remaining = totalMs - elapsed;
  var display = document.getElementById("timerDisplay");
  if (remaining <= 0) {
    display.textContent = "Time's Up";
    display.classList.remove("orange");
    display.classList.add("red");
    state.timer.running = false;
    saveState();
    stopTimerInterval();
    return;
  }
  var totalSec = Math.ceil(remaining / 1000);
  var mm = Math.floor(totalSec / 60);
  var ss = totalSec % 60;
  display.textContent = (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
  var ratio = remaining / totalMs;
  display.classList.remove("orange", "red");
  if (ratio <= 0.10) display.classList.add("red");
  else if (ratio <= 0.25) display.classList.add("orange");
}

function updateTimerDisplay() {
  var display = document.getElementById("timerDisplay");
  if (!display) return;
  if (state.timer && state.timer.limitMin) {
    var mm = state.timer.limitMin;
    display.textContent = (mm < 10 ? "0" + mm : mm) + ":00";
  } else {
    display.textContent = "20:00";
  }
  display.classList.remove("orange", "red");
}

function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

window.startTimer = startTimer;
window.selectOption = selectOption;
window.nextQuestion = nextQuestion;
window.prevQuestion = prevQuestion;
window.jumpTo = jumpTo;
window.toggleDots = toggleDots;
window.retryWrongOnes = retryWrongOnes;
window.saveWrongAnswers = saveWrongAnswers;
window.startFreshOriginal = startFreshOriginal;
window.startFreshRandom = startFreshRandom;
window.modalConfirmYes = modalConfirmYes;
window.modalConfirmNo = modalConfirmNo;
window.copyAllResults = copyAllResults;

init();
</script>
</body>
</html>
