<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261119";
var RAW_QUESTIONS = [{"stem": "A particular online vendor offers discounts for orders of 11 or more shirts, as the table shows. For how many different quantities of shirts would the cost exceed the cost of buying the least number of shirts at the next discount level? (MathCounts)\n\nNumber of Shirts | Discount\n1–10: no discount\n11–25: 10% off\n26–50: 15% off\n51–100: 20% off\n101–250: 30% off\n251 or more: 35% off", "opts": ["28", "36", "25", "33"], "ci": 3, "exp": "<b>What we need</b><br>Let the regular price of one shirt be <i>p</i>. For each discount level, find the quantities whose total cost is <b>more</b> than the cost of buying the smallest number of shirts at the <b>next</b> level, then add up how many such quantities there are.<br><br><b>Step 1: Up to 10 shirts (no discount).</b> Next level: 11 shirts at 10% off cost 11 &times; 0.9<i>p</i> = 9.9<i>p</i>. Buying <i>n</i> shirts costs <i>n</i><i>p</i>, and <i>n</i><i>p</i> &gt; 9.9<i>p</i> only for <i>n</i> = 10. &rarr; <b>1</b> quantity.<br><br><b>Step 2: 11&ndash;25 shirts (10% off).</b> Next level: 26 shirts at 15% off cost 26 &times; 0.85<i>p</i> = 22.1<i>p</i>. We need 0.9<i>n</i> &gt; 22.1, so <i>n</i> &gt; 24.56&hellip;, giving <i>n</i> = 25. &rarr; <b>1</b> quantity.<br><br><b>Step 3: 26&ndash;50 shirts (15% off).</b> Next level: 51 &times; 0.8<i>p</i> = 40.8<i>p</i>. We need 0.85<i>n</i> &gt; 40.8, so <i>n</i> &gt; 48, giving <i>n</i> = 49, 50. &rarr; <b>2</b> quantities. (At <i>n</i> = 48 the costs are exactly equal, 40.8<i>p</i>, which does not <i>exceed</i>.)<br><br><b>Step 4: 51&ndash;100 shirts (20% off).</b> Next level: 101 &times; 0.7<i>p</i> = 70.7<i>p</i>. We need 0.8<i>n</i> &gt; 70.7, so <i>n</i> &gt; 88.375, giving <i>n</i> = 89, 90, &hellip;, 100. &rarr; <b>12</b> quantities.<br><br><b>Step 5: 101&ndash;250 shirts (30% off).</b> Next level: 251 &times; 0.65<i>p</i> = 163.15<i>p</i>. We need 0.7<i>n</i> &gt; 163.15, so <i>n</i> &gt; 233.07&hellip;, giving <i>n</i> = 234, &hellip;, 250. &rarr; <b>17</b> quantities.<br><br><b>Step 6: Add.</b> The last level (251 or more) has no next level. Total: 1 + 1 + 2 + 12 + 17 = <b>33</b>.<br><br><b>Answer check</b> A computer compared every quantity from 1 to 250 with the cheapest order at the next level and found exactly 33 quantities that cost more. The price <i>p</i> cancels, so the answer does not depend on the actual shirt price.<br><br><b>Trap</b> Counting <i>n</i> = 48 in Step 3 (equal cost is not &ldquo;exceeding&rdquo;), or using the next level&rsquo;s discount on the current quantity, changes the total; forgetting a whole level (for example the 1&ndash;10 level) gives a smaller count.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "Evaluate<br><br><span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 4px;\"><span style=\"font-size:0.68em;\">&infin;</span><span style=\"font-size:1.5em;margin:1px 0;\">&Sigma;</span><span style=\"font-size:0.6em;white-space:nowrap;\"><i>n</i>=3</span></span> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i></span></span>. (Purple Comet)", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">72</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">48</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span>"], "ci": 0, "exp": "<b>What we need</b><br>The exact value of the infinite sum of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i></span></span> for <i>n</i> = 3, 4, 5, &hellip;<br><br><b>Step 1: Factor the denominator.</b> <i>n</i><sup>5</sup> &minus; 5<i>n</i><sup>3</sup> + 4<i>n</i> = <i>n</i>(<i>n</i><sup>4</sup> &minus; 5<i>n</i><sup>2</sup> + 4) = <i>n</i>(<i>n</i><sup>2</sup> &minus; 1)(<i>n</i><sup>2</sup> &minus; 4) = (<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2). It is a product of five consecutive integers. (This is why the sum starts at <i>n</i> = 3: for <i>n</i> = 1 or 2 the denominator is 0.)<br><br><b>Step 2: Split into a telescoping difference.</b> Let <i>A</i> = (<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1) and <i>B</i> = (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2). Then <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>B</i> &minus; <i>A</i></span><span style=\"border-top:1.4px solid #111;\"><i>AB</i></span></span>. Both <i>A</i> and <i>B</i> contain (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1), so <i>B</i> &minus; <i>A</i> = (<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)[(<i>n</i> + 2) &minus; (<i>n</i> &minus; 2)] = 4(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1). Dividing, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>4</span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)(<i>n</i> + 2)</span></span>. So each term equals <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>(<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>A</i></span></span> &minus; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span>).<br><br><b>Step 3: Telescope.</b> Write <i>g</i>(<i>n</i>) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">(<i>n</i> &minus; 2)(<i>n</i> &minus; 1)<i>n</i>(<i>n</i> + 1)</span></span>. Then <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>B</i></span></span> = <i>g</i>(<i>n</i> + 1), and the sum is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>[(<i>g</i>(3) &minus; <i>g</i>(4)) + (<i>g</i>(4) &minus; <i>g</i>(5)) + &hellip;]. Everything cancels except <i>g</i>(3), because <i>g</i>(<i>n</i>) &rarr; 0 as <i>n</i> grows. <i>g</i>(3) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">1 &times; 2 &times; 3 &times; 4</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span>.<br><br><b>Step 4: Finish.</b> Sum = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> &times; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span>.<br><br><b>Answer check</b><br>First term (<i>n</i> = 3): <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">1 &times; 2 &times; 3 &times; 4 &times; 5</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span> &asymp; 0.00833; adding <i>n</i> = 4 (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">720</span></span>) and <i>n</i> = 5 (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2520</span></span>) gives about 0.01012, already close to <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span> &asymp; 0.01042. A computer sum of the first 2000 terms agrees with <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">96</span></span> to 12 decimal places.<br><br><b>Trap</b><br>Stopping at the first term (<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">120</span></span>), or forgetting the factor <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span> and answering <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span>-type values such as <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">48</span></span> or <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">72</span></span>.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Suppose that a and <i>b</i> are integers such that <i>x</i><sup>2</sup> &minus; <i>x</i> &minus; 1 is a factor of <i>ax</i><sup>3</sup> + <i>bx</i><sup>2</sup> + 1. What is <i>b</i>? (AHSME)", "opts": ["1", "-2", "2", "-1"], "ci": 1, "exp": "<b>What we need</b><br>Integers <i>a</i> and <i>b</i> make <i>x</i><sup>2</sup> &minus; <i>x</i> &minus; 1 a factor of <i>a</i><i>x</i><sup>3</sup> + <i>b</i><i>x</i><sup>2</sup> + 1. Find <i>b</i>.<br><br><b>Step 1: A factor means its roots are roots of the big polynomial.</b> Let &phi; be a root of <i>x</i><sup>2</sup> &minus; <i>x</i> &minus; 1 = 0. Then &phi;<sup>2</sup> = &phi; + 1, and <i>a</i>&phi;<sup>3</sup> + <i>b</i>&phi;<sup>2</sup> + 1 must equal 0.<br><br><b>Step 2: Reduce the powers of &phi;.</b> &phi;<sup>3</sup> = &phi; &middot; &phi;<sup>2</sup> = &phi;(&phi; + 1) = &phi;<sup>2</sup> + &phi; = (&phi; + 1) + &phi; = 2&phi; + 1.<br><br><b>Step 3: Substitute.</b> <i>a</i>(2&phi; + 1) + <i>b</i>(&phi; + 1) + 1 = 0, which groups as (2<i>a</i> + <i>b</i>)&phi; + (<i>a</i> + <i>b</i> + 1) = 0.<br><br><b>Step 4: Both parts must be zero.</b> &phi; = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1 &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">5</span></span></span><span style=\"border-top:1.4px solid #111;\">2</span></span> is irrational, while 2<i>a</i> + <i>b</i> and <i>a</i> + <i>b</i> + 1 are integers. If 2<i>a</i> + <i>b</i> were not 0, then &phi; would equal &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>a</i> + <i>b</i> + 1</span><span style=\"border-top:1.4px solid #111;\">2<i>a</i> + <i>b</i></span></span>, a fraction &mdash; impossible. So 2<i>a</i> + <i>b</i> = 0 and <i>a</i> + <i>b</i> + 1 = 0.<br><br><b>Step 5: Solve.</b> From the first equation, <i>b</i> = &minus;2<i>a</i>. Substituting: <i>a</i> &minus; 2<i>a</i> + 1 = 0, so <i>a</i> = 1 and <i>b</i> = <b>&minus;2</b>.<br><br><b>Answer check</b> With <i>a</i> = 1, <i>b</i> = &minus;2 the polynomial is <i>x</i><sup>3</sup> &minus; 2<i>x</i><sup>2</sup> + 1, and multiplying out (<i>x</i><sup>2</sup> &minus; <i>x</i> &minus; 1)(<i>x</i> &minus; 1) = <i>x</i><sup>3</sup> &minus; <i>x</i><sup>2</sup> &minus; <i>x</i> &minus; <i>x</i><sup>2</sup> + <i>x</i> + 1 = <i>x</i><sup>3</sup> &minus; 2<i>x</i><sup>2</sup> + 1. &#10003;<br><br><b>Trap</b> Solving 2<i>a</i> + <i>b</i> = 0 alone and guessing <i>b</i> = 2 (sign error), or matching only the constant term, gives a wrong choice; none of 2, &minus;1, 1 works for any integer <i>a</i>.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "How many of the first 1000 positive integers can be expressed in the form &lfloor;2<i>x</i>&rfloor;+&lfloor;4<i>x</i>&rfloor;+&lfloor;6<i>x</i>&rfloor;+&lfloor;8<i>x</i>&rfloor;, where <i>x</i> is a real number? (AIME)", "opts": ["500", "700", "600", "660"], "ci": 2, "exp": "<b>What we need</b><br>Let <i>f</i>(<i>x</i>) = &lfloor;2<i>x</i>&rfloor; + &lfloor;4<i>x</i>&rfloor; + &lfloor;6<i>x</i>&rfloor; + &lfloor;8<i>x</i>&rfloor;. Count how many of the integers 1, 2, &hellip;, 1000 are values of <i>f</i>.<br><br><b>Step 1: The pattern repeats every time <i>x</i> goes up by 1.</b> Adding 1 to <i>x</i> adds 2, 4, 6, and 8 to the four floors, so <i>f</i>(<i>x</i> + 1) = <i>f</i>(<i>x</i>) + 20. So it is enough to find which values <i>f</i> takes for <i>x</i> from 0 up to 1; after that, every value just shifts up by 20.<br><br><b>Step 2: Find where <i>f</i> jumps.</b> A floor &lfloor;k<i>x</i>&rfloor; jumps only when <i>k</i><i>x</i> reaches a whole number, i.e. at multiples of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">8</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>. In [0, 1) the jump points are 0, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">8</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">6</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">4</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">8</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">8</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>2</span><span style=\"border-top:1.4px solid #111;\">3</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">4</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">6</span></span>, <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>7</span><span style=\"border-top:1.4px solid #111;\">8</span></span> &mdash; that is 12 points, and <i>f</i> is constant between consecutive jump points.<br><br><b>Step 3: List the values.</b> Plugging in each jump point gives <i>f</i> = 0, 1, 2, 4, 5, 6, 10, 11, 12, 14, 15, 16 (for example, at <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>: 0 + 1 + 2 + 2 = 5). Then at <i>x</i> = 1 the value is 20. So among 1 to 20, exactly these 12 numbers appear: 1, 2, 4, 5, 6, 10, 11, 12, 14, 15, 16, 20. The numbers 3, 7, 8, 9, 13, 17, 18, 19 are skipped, because at some jump points several floors jump together (for example at <i>x</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> all four jump, so <i>f</i> leaps from 6 to 10).<br><br><b>Step 4: Scale up to 1000.</b> Because 1000 = 50 &times; 20, the numbers 1 to 1000 split into 50 blocks of 20, and each block contains exactly 12 values of <i>f</i>. Total: 50 &times; 12 = <b>600</b>.<br><br><b>Answer check</b> A computer checked <i>f</i> at every multiple of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">24</span></span> from 0 to 60 (24 is a common denominator of all jump points); exactly 600 distinct values land in 1&ndash;1000.<br><br><b>Trap</b> 500 comes from thinking only half of each block of 20 is hit (10 per block); 700 and 660 come from miscounting the jump points (for example counting <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span> more than once, or forgetting that several floors can jump at the same point).", "tag": "Chapter 2", "tagcolor": "#1D9E75"}, {"stem": "Pete bought a notebook containing 96 pages, and numbered them from 1 through 192. Victor tore out 25 pages of Pete&rsquo;<i>s</i> notebook, and added the 50 numbers he found on the pages. Could Victor get 1990 as the sum? (Russia)", "opts": ["yes", "no"], "ci": 1, "exp": "<b>What we need</b><br>The notebook has 96 sheets (leaves), and the page numbers go 1 through 192, two per sheet. Victor tears out 25 sheets, so he sees 50 page numbers. Can those 50 numbers add up to 1990?<br><br><b>Step 1: Look at one sheet.</b> The first sheet has pages 1 and 2, the second sheet has pages 3 and 4, and in general sheet number <i>k</i> has pages 2<i>k</i> &minus; 1 and 2<i>k</i>. Their sum is (2<i>k</i> &minus; 1) + 2<i>k</i> = 4<i>k</i> &minus; 1. The key fact is not the exact value but its parity: 4<i>k</i> &minus; 1 is always <b>odd</b> (an even number minus 1).<br><br><b>Step 2: Add 25 sheets.</b> Victor's total is the sum of 25 odd numbers (one for each torn sheet). Odd + odd = even, so every pair of sheets gives an even amount; 25 sheets = 12 pairs + 1 extra sheet, so the total is even + odd = <b>odd</b>.<br><br><b>Step 3: Compare with 1990.</b> 1990 is even, but Victor's sum must be odd. So Victor could not get 1990. The answer is <b>no</b>.<br><br><b>Answer check</b><br>Small example: tear out sheets 1, 2, 3 (pages 1&ndash;6): sum = 3 + 7 + 11 = 21, odd. With 25 sheets the smallest possible sum is 3 + 7 + &hellip; + 99 = 25 &times; 51 = 1275 and the largest is 4(72 + 73 + &hellip; + 96) &minus; 25 = 4 &times; 2100 &minus; 25 = 8375, so 1990 is in range &mdash; size alone cannot rule it out. Only the parity argument does.<br><br><b>Trap</b><br>Thinking each torn page is one number. A sheet always carries two consecutive numbers, and that pairing is what forces the odd total.", "tag": "Chapter 1", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
