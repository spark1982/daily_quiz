<style>

  * { box-sizing: border-box; }

  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }
  .quiz-card, .results-card { background:#fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .passage-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; font-size:0.92rem; line-height:1.6; color:#222; }
  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .tag-badge { display:inline-block; font-size:0.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
  .q-text { font-size:1.05rem; font-weight:600; margin-bottom:16px; line-height:1.5; }
  #options { display:flex; flex-direction:column; gap:10px; }
  .opt-btn { text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid #d7dde6; background:#fafbfc; font-size:0.95rem; cursor:pointer; line-height:1.4; }
  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }

  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }

  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }

  .sat-timer{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#eef3fb;border:1px solid #c9d8ef;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:0.9rem;font-weight:700;color:#185FA5;position:sticky;top:0;z-index:5;}
  .sat-timer .over{color:#E24B4A;}
  .sat-timer button{background:#fff;border:1.5px solid #185FA5;color:#185FA5;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;}
  .sat-pausebox{display:none;text-align:center;background:#fff;border-radius:14px;padding:30px 20px;margin-bottom:16px;box-shadow:0 1px 6px rgba(0,0,0,0.08);font-weight:700;color:#185FA5;}
</style>

<script>
var TITLE = "[Sion] SAT Math";
var QUIZ_KEY = "sionsatmath_10";
var INSTRUCTION = "Choose the correct answer for each problem. A calculator (Desmos) is allowed, as on the real SAT.";
var TODAY_STR = "20261119";
var RAW_QUESTIONS = [{"stem": "In right triangle <i>ABC</i>, angle <i>C</i> is a right angle, sin <i>A</i> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span>, and <i>AB</i> = 39. What is the area of triangle <i>ABC</i>?", "opts": ["540", "195", "270", "468"], "ci": 2, "exp": "<b>What we need:</b> the two legs, then half their product.<br><br><b>Step 1 &mdash; Use the sine ratio.</b> sin <i>A</i> = opposite &divide; hypotenuse = <i>BC</i> &divide; <i>AB</i>. So <i>BC</i> = 39 &middot; <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>5</span><span style=\"border-top:1.4px solid #111;\">13</span></span> = 15.<br><b>Step 2 &mdash; Find the other leg.</b> <i>AC</i><sup>2</sup> = 39<sup>2</sup> &minus; 15<sup>2</sup> = 1521 &minus; 225 = 1296, so <i>AC</i> = 36 (<i>a</i> 5-12-13 triangle scaled by 3).<br><b>Step 3 &mdash; Compute the area.</b> Area = &frac12; &middot; 15 &middot; 36 = 270.<br><br><b>Answer check:</b> 15<sup>2</sup> + 36<sup>2</sup> = 225 + 1296 = 1521 = 39<sup>2</sup>. &#10003;<br><br><b>Traps:</b> 540 forgets the &frac12;. 195 uses 15 and 13 (multiplying a leg by the unscaled 13). 468 multiplies 36 by 13. Both of the last two mix the 5-12-13 ratio with the actual side lengths.", "tag": "Geometry and Trigonometry", "tagcolor": "#E24B4A"}, {"stem": "The function <i>f</i> is defined by <i>f</i>(<i>x</i>) = <i>a</i>(<i>b</i>)<sup><i>x</i></sup>, where <i>a</i> and <i>b</i> are positive constants. The graph of <i>y</i> = <i>f</i>(<i>x</i>) in the <i>xy</i>-plane passes through the points (0, 3) and (2, 48). What is the value of <i>f</i>(3)?", "opts": ["144", "768", "96", "192"], "ci": 3, "exp": "<b>What we need:</b> <i>a</i> and <i>b</i> from two points, then <i>f</i>(3).<br><br><b>Step 1 &mdash; Use <i>x</i> = 0.</b> <i>f</i>(0) = <i>a</i>&middot;<i>b</i><sup>0</sup> = <i>a</i> = 3.<br><b>Step 2 &mdash; Use <i>x</i> = 2.</b> 3<i>b</i><sup>2</sup> = 48, so <i>b</i><sup>2</sup> = 16 and <i>b</i> = 4 (positive).<br><b>Step 3 &mdash; Evaluate.</b> <i>f</i>(3) = 3(4)<sup>3</sup> = 3(64) = 192.<br><br><b>Answer check:</b> the sequence 3, 12, 48, 192 multiplies by 4 each step, matching <i>f</i>(0), <i>f</i>(1), <i>f</i>(2), <i>f</i>(3). &#10003;<br><br><b>Traps:</b> 144 treats the growth as 48 &times; 3 (multiplying by <i>a</i> instead of <i>b</i>). 96 doubles 48 (as if <i>b</i> = 2). 768 is 48 &times; 16, taking two more steps instead of one.<br><br><b>Desmos:</b> enter the points (0, 3) and (2, 48) in a table and fit an exponential model with sliders for <i>a</i> and <i>b</i>; then read the value at <i>x</i> = 3.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "A caterer charges a flat fee of $250 plus $18 per guest for a party. Maya&rsquo;<i>s</i> budget for the caterer is at most $1,600. What is the greatest number of guests Maya can invite while staying within her budget?", "opts": ["88", "76", "75", "74"], "ci": 2, "exp": "<b>What we need:</b> the largest whole number of guests <i>g</i> that keeps the total cost at or below $1,600.<br><br><b>Step 1 &mdash; Write the inequality.</b> 250 + 18<i>g</i> &le; 1600.<br><b>Step 2 &mdash; Isolate the variable.</b> 18<i>g</i> &le; 1350, so <i>g</i> &le; 75.<br><b>Step 3 &mdash; Interpret.</b> 75 is a whole number, so 75 guests is allowed.<br><br><b>Answer check:</b> 75 guests cost 250 + 18(75) = 250 + 1350 = $1,600 (exactly on budget); 76 guests cost $1,618, which is over. &#10003;<br><br><b>Traps:</b> 88 comes from ignoring the $250 fee (1600 &divide; 18 &asymp; 88.9). 74 comes from treating &ldquo;at most&rdquo; as &ldquo;less than.&rdquo; 76 rounds up past the limit.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "3<i>x</i> + <i>k</i><i>y</i> = 12<br>6<i>x</i> &minus; 4<i>y</i> = 24<br><br>In the system of equations above, <i>k</i> is a constant. If the system has infinitely many solutions, what is the value of <i>k</i>?", "opts": ["&minus;4", "4", "&minus;2", "2"], "ci": 2, "exp": "<b>What we need:</b> the value of <i>k</i> that makes the two equations describe the same line.<br><br><b>Step 1 &mdash; Make the <i>x</i>-coefficients match.</b> Multiply the first equation by 2: 6<i>x</i> + 2<i>k</i><i>y</i> = 24.<br><b>Step 2 &mdash; Compare with the second equation.</b> For infinitely many solutions the two equations must be identical. The constants already match (24 = 24), so the <i>y</i>-coefficients must match too: 2<i>k</i> = &minus;4.<br><b>Step 3 &mdash; Solve.</b> <i>k</i> = &minus;2.<br><br><b>Answer check:</b> with <i>k</i> = &minus;2 the first equation is 3<i>x</i> &minus; 2<i>y</i> = 12, and doubling it gives exactly 6<i>x</i> &minus; 4<i>y</i> = 24. &#10003;<br><br><b>Traps:</b> &minus;4 comes from matching &minus;4 directly to <i>k</i> without doubling the first equation. 2 is a sign error. 4 combines both mistakes.<br><br><b>Desmos:</b> graph 3<i>x</i> + <i>k</i><i>y</i> = 12 with a slider for <i>k</i> together with 6<i>x</i> &minus; 4<i>y</i> = 24; the lines coincide only at <i>k</i> = &minus;2.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "The table shows the lunch choices of 170 students in the 9<i>th</i> and 10<i>th</i> grades at a school.<br><table style='border-collapse:collapse;margin:6px auto;font-size:0.92rem'><tr><th style='border:1px solid #999;padding:4px 10px'></th><th style='border:1px solid #999;padding:4px 10px'>Hot lunch</th><th style='border:1px solid #999;padding:4px 10px'>Packed lunch</th><th style='border:1px solid #999;padding:4px 10px'>Total</th></tr><tr><td style='border:1px solid #999;padding:4px 10px'>9<i>th</i> grade</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>48</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>32</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>80</td></tr><tr><td style='border:1px solid #999;padding:4px 10px'>10<i>th</i> grade</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>36</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>54</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>90</td></tr><tr><td style='border:1px solid #999;padding:4px 10px'>Total</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>84</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>86</td><td style='border:1px solid #999;padding:4px 10px;text-align:center'>170</td></tr></table><br>If one of the students who chose a packed lunch is selected at random, what is the probability that the student is in the 10<i>th</i> grade?", "opts": ["<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">85</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">43</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>16</span><span style=\"border-top:1.4px solid #111;\">43</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span>"], "ci": 1, "exp": "<b>What we need:</b> a conditional probability: among packed-lunch students only, the fraction in 10<i>th</i> grade.<br><br><b>Step 1 &mdash; Restrict to the given group.</b> The condition &ldquo;chose a packed lunch&rdquo; means the denominator is the packed-lunch total: 86.<br><b>Step 2 &mdash; Count the favorable outcomes.</b> 10<i>th</i> graders with packed lunch: 54.<br><b>Step 3 &mdash; Divide and simplify.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>54</span><span style=\"border-top:1.4px solid #111;\">86</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">43</span></span>.<br><br><b>Answer check:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">43</span></span> &asymp; 0.628; also <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>32</span><span style=\"border-top:1.4px solid #111;\">86</span></span> for 9<i>th</i> grade plus <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>54</span><span style=\"border-top:1.4px solid #111;\">86</span></span> for 10<i>th</i> grade adds to 1. &#10003;<br><br><b>Traps:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>27</span><span style=\"border-top:1.4px solid #111;\">85</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>54</span><span style=\"border-top:1.4px solid #111;\">170</span></span> uses all 170 students as the denominator. <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\">5</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>54</span><span style=\"border-top:1.4px solid #111;\">90</span></span> uses the 10<i>th</i>-grade total (it answers &ldquo;given 10<i>th</i> grade, packed lunch?&rdquo;). <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>16</span><span style=\"border-top:1.4px solid #111;\">43</span></span> is the 9<i>th</i>-grade share of packed lunches.", "tag": "Problem-Solving and Data Analysis", "tagcolor": "#1D9E75"}, {"stem": "In the <i>xy</i>-plane, line &#8467; passes through the points (&minus;2, 5) and (4, &minus;7). What is the <i>y</i>-coordinate of the <i>y</i>-intercept of line &#8467;?", "opts": ["1", "&minus;1", "&minus;3", "9"], "ci": 0, "exp": "<b>What we need:</b> the value <i>b</i> in <i>y</i> = <i>m</i><i>x</i> + <i>b</i> for the line through the two points.<br><br><b>Step 1 &mdash; Find the slope.</b> <i>m</i> = (&minus;7 &minus; 5) &divide; (4 &minus; (&minus;2)) = &minus;12 &divide; 6 = &minus;2.<br><b>Step 2 &mdash; Substitute a point.</b> Using (&minus;2, 5): 5 = &minus;2(&minus;2) + <i>b</i> = 4 + <i>b</i>.<br><b>Step 3 &mdash; Solve.</b> <i>b</i> = 1.<br><br><b>Answer check:</b> check the other point: &minus;2(4) + 1 = &minus;7. &#10003;<br><br><b>Traps:</b> 9 comes from using a slope of +2 (5 = 2(&minus;2) + <i>b</i>). &minus;3 comes from substituting <i>x</i> = 4 with the wrong <i>y</i>. &minus;1 is a sign slip in the last step.<br><br><b>Desmos:</b> enter the two points and the line <i>y</i> = &minus;2<i>x</i> + <i>b</i> with a slider.", "tag": "Algebra", "tagcolor": "#185FA5"}, {"stem": "(<i>x</i> + <i>a</i>)(2<i>x</i> &minus; 3) = 2<i>x</i><sup>2</sup> + 7<i>x</i> &minus; 15<br><br>The equation above is true for all values of <i>x</i>, where <i>a</i> is a constant. What is the value of <i>a</i>?", "opts": ["7", "3", "5", "&minus;5"], "ci": 2, "exp": "<b>What we need:</b> the constant <i>a</i> that makes the two sides identical polynomials.<br><br><b>Step 1 &mdash; Expand the left side.</b> (<i>x</i> + <i>a</i>)(2<i>x</i> &minus; 3) = 2<i>x</i><sup>2</sup> &minus; 3<i>x</i> + 2<i>a</i><i>x</i> &minus; 3<i>a</i> = 2<i>x</i><sup>2</sup> + (2<i>a</i> &minus; 3)<i>x</i> &minus; 3<i>a</i>.<br><b>Step 2 &mdash; Match the constant terms.</b> &minus;3<i>a</i> = &minus;15, so <i>a</i> = 5.<br><b>Step 3 &mdash; Confirm with the <i>x</i>-terms.</b> 2(5) &minus; 3 = 7, which matches the 7<i>x</i> on the right.<br><br><b>Answer check:</b> (<i>x</i> + 5)(2<i>x</i> &minus; 3) = 2<i>x</i><sup>2</sup> &minus; 3<i>x</i> + 10<i>x</i> &minus; 15 = 2<i>x</i><sup>2</sup> + 7<i>x</i> &minus; 15. &#10003;<br><br><b>Traps:</b> &minus;5 drops the negative sign when matching &minus;3<i>a</i> = &minus;15. 7 copies the <i>x</i>-coefficient instead of solving 2<i>a</i> &minus; 3 = 7. 3 comes from &minus;15 &divide; &minus;5 confusion.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}, {"stem": "The graph of <i>y</i> = <i>x</i><sup>2</sup> + <i>b</i><i>x</i> + <i>c</i>, where <i>b</i> and <i>c</i> are constants, crosses the <i>x</i>-axis at two points that are 8 units apart. The vertex of the graph lies on the line <i>y</i> = 2<i>x</i> &minus; 30. What is the value of <i>c</i>?", "opts": ["7", "65", "49", "33"], "ci": 3, "exp": "<b>What we need:</b> <i>c</i>, using the distance between the zeros and the location of the vertex.<br><br><b>Step 1 &mdash; Use the vertex form.</b> With leading coefficient 1, write <i>y</i> = (<i>x</i> &minus; <i>h</i>)<sup>2</sup> + <i>k</i>. The zeros are where (<i>x</i> &minus; <i>h</i>)<sup>2</sup> = &minus;<i>k</i>, <i>i</i>.<i>e</i>. <i>x</i> = <i>h</i> &plusmn; <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">&minus;<i>k</i></span></span>.<br><b>Step 2 &mdash; Use the 8-unit gap.</b> The zeros are 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">&minus;<i>k</i></span></span> apart, so 2<span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">&minus;<i>k</i></span></span> = 8, <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;white-space:nowrap;line-height:1.25;\"><svg viewBox=\"0 0 10 20\" preserveAspectRatio=\"none\" style=\"width:0.62em;height:auto;align-self:stretch;overflow:visible;flex:none;margin-top:0.7px;\"><path d=\"M0.5,11.5 L2.8,10.2 L5.6,19.3 L10,0\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"/></svg><span style=\"border-top:1.4px solid #111;padding:1px 3px 0 2px;\">&minus;<i>k</i></span></span> = 4, and <i>k</i> = &minus;16. (The vertex is 16 units below the axis.)<br><b>Step 3 &mdash; Use the line.</b> The vertex (<i>h</i>, &minus;16) is on <i>y</i> = 2<i>x</i> &minus; 30, so &minus;16 = 2<i>h</i> &minus; 30 and <i>h</i> = 7.<br><b>Step 4 &mdash; Find <i>c</i>.</b> <i>y</i> = (<i>x</i> &minus; 7)<sup>2</sup> &minus; 16 = <i>x</i><sup>2</sup> &minus; 14<i>x</i> + 49 &minus; 16, so <i>c</i> = 33.<br><br><b>Answer check:</b> <i>x</i><sup>2</sup> &minus; 14<i>x</i> + 33 = (<i>x</i> &minus; 3)(<i>x</i> &minus; 11): zeros 3 and 11 are 8 apart, and the vertex (7, &minus;16) satisfies 2(7) &minus; 30 = &minus;16. &#10003;<br><br><b>Traps:</b> 49 is <i>h</i><sup>2</sup>, forgetting to add <i>k</i> = &minus;16. 65 adds 16 instead of subtracting it (sign error in <i>k</i>). 7 is the <i>x</i>-coordinate of the vertex, not <i>c</i>. A common deeper slip is using half-distance 8 (getting <i>k</i> = &minus;64).<br><br><b>Desmos:</b> graph <i>y</i> = (<i>x</i> &minus; <i>h</i>)<sup>2</sup> &minus; 16 with a slider for <i>h</i> and the line <i>y</i> = 2<i>x</i> &minus; 30; the vertex touches the line at <i>h</i> = 7.", "tag": "Advanced Math", "tagcolor": "#7b61ff"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ if(window.SAT_TIMEUP && SAT_TIMEUP() && !(activeSet && activeSet.length)){ wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, "(time's up)")); } else skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* sat-timer 2026-11-06 */
(function(){
  var PER_Q = 80;
  var LIMIT = PER_Q * RAW_QUESTIONS.length;
  var TK = STORAGE_KEY + '_timer';
  function blank(){ return {el:0, per:{}, up:false}; }
  function load(){ try{ return JSON.parse(localStorage.getItem(TK)) || blank(); }catch(e){ return blank(); } }
  var T = load(), paused = false, last = Date.now();
  function save(){ try{ localStorage.setItem(TK, JSON.stringify(T)); }catch(e){} }
  function retrying(){ return !!(activeSet && activeSet.length); }
  window.SAT_TIMEUP = function(){ return !!T.up; };
  var bar = document.createElement('div'); bar.className = 'sat-timer'; bar.id = 'sat-timer';
  bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function curAnswered(){ if(window.EXAM_ACTIVE && EXAM_ACTIVE()) return false; var q = activeOrder()[state.cur]; return q !== undefined && state.answers[q] !== undefined; } /* sat-timer-pause-on-answer 2026-11-14 */
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && !curAnswered() && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
