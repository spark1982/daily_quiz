<style>

  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }

<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_24";
var INSTRUCTION = "Choose the correct answer for each question.";
var TODAY_STR = "20261003";
var RAW_QUESTIONS = [{"stem": "Which sentence uses the possessive form CORRECTLY?", "opts": ["The runners stretched there legs before the race.", "Julias notes were the most detailed in class.", "The prize was her's after months of training.", "The captain's log recorded every detail of the voyage."], "ci": 3, "exp": "<strong>\"captain's\"</strong> correctly adds <em>'s</em> to the singular noun.<br>• <em>there</em> should be <em>their</em> (possessive adjective).<br>• <em>Julias</em> is missing the apostrophe — should be <em>Julia's</em>.<br>• <em>her's</em> does not exist; the correct form is <em>hers</em>.", "tag": "Possessives", "tagcolor": "#185FA5"}, {"stem": "What is the past tense of <b>feel</b>?", "opts": ["felt", "feeled", "feelt", "felled"], "ci": 0, "exp": "The past tense of <b>feel</b> is <b>felt</b>.", "tag": "Irregular Verbs (Past Tense)", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a gerund (not part of a progressive verb tense)?", "opts": ["They are <b>exploring</b> the old castle.", "We were <b>exploring</b> the cave system yesterday.", "She is excited about <b>exploring</b> new cities.", "He will be <b>exploring</b> the rainforest next month."], "ci": 2, "exp": "In \"She is excited about exploring new cities,\" \"exploring\" is the object of the preposition \"about\" - a noun role - which makes it a gerund. In the other three sentences, \"exploring\" follows \"are / were / will be\" and is part of the progressive verb tense.", "tag": "Gerund vs Participle", "tagcolor": "#185FA5"}, {"stem": "Which sentence correctly matches the verb with the subject?", "opts": ["Where is the keys that I left on the kitchen counter this morning?", "How does the students in your class travel to school each day?", "Why does the teachers assign so much homework every single week?", "Where are the keys that I left on the kitchen counter this morning?"], "ci": 3, "exp": "\"Keys\" is plural, so \"are\" is correct. \"Is\" is singular — wrong for plural keys. \"Students\" is plural — use \"do.\" \"Teachers\" is plural — use \"do.\"", "tag": "Subject-Verb Agreement", "tagcolor": "#185FA5"}, {"stem": "Despite the heavy rain, the cheerful children played energetically in the muddy puddles outside.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which choice lists all the NOUNS in this sentence, and only the nouns?</span>", "opts": ["rain, children, puddles", "children, puddles", "rain, children, puddles, energetically", "rain, puddles"], "ci": 0, "exp": "'Rain', 'children', and 'puddles' are all nouns.", "tag": "Parts of Speech", "tagcolor": "#185FA5"}, {"stem": "<div>Present: <b>become</b> &rsaquo; Past: <b>became</b> &rsaquo; Past Participle: ______</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct past participle form.</div>", "opts": ["becomed", "became", "becoming", "become"], "ci": 3, "exp": "'become' is an irregular verb. Its past participle is 'become'. Past perfect: had become.", "tag": "Past Perfect", "tagcolor": "#185FA5"}, {"stem": "Which of the following is a COMPLETE sentence?", "opts": ["Before the curtain came down on the last act.", "The volcano erupted with tremendous force.", "Balanced carefully on the edge of the wall.", "Somewhere over the rainbow far away."], "ci": 1, "exp": "\"The volcano erupted with tremendous force.\" is a complete sentence — subject: 'The volcano', predicate: 'erupted'. The others are fragments: a 'Before' clause, a participial phrase, and a prepositional phrase.", "tag": "Complete Sentences", "tagcolor": "#185FA5"}, {"stem": "Which group of adjectives is in the correct order?", "opts": ["pretty square Italian tiles", "square pretty Italian tiles", "Italian pretty square tiles", "pretty Italian square tiles"], "ci": 0, "exp": "Correct order: opinion (pretty) → shape (square) → origin (Italian) → noun\n✔ pretty square Italian tiles", "tag": "Adjective Order", "tagcolor": "#185FA5"}, {"stem": "He ________ the door and walked in.", "opts": ["opened", "has opened"], "ci": 0, "exp": "This describes a finished sequence of past actions, so use simple past: opened.", "tag": "Past vs Present Perfect", "tagcolor": "#185FA5"}, {"stem": "Which sentence uses punctuation and capitalization correctly?", "opts": ["No I don't think that's a good idea.", "No, I don't think that's a good idea.", "No I don't think, that's a good idea.", "No; I don't think that's a good idea."], "ci": 1, "exp": "An introductory word like \"No\" (or \"Yes\") used as a response must be followed by a comma. \"Don't\" and \"that's\" are contractions that each need an apostrophe.", "tag": "Punctuation & Capitalization", "tagcolor": "#185FA5"}, {"stem": "Do not worry, because he <span style=\"text-decoration:underline;\">______</span> your laptop by tomorrow afternoon.", "opts": ["had fixed", "has fixed", "will have fixed", "fixes"], "ci": 2, "exp": "\"will have fixed\" is future perfect — the repair will be complete before tomorrow afternoon.", "tag": "Perfect Tense", "tagcolor": "#185FA5"}, {"stem": "What is the plural of <b>wife</b>?", "opts": ["wifes", "wife's", "wives", "wivs"], "ci": 2, "exp": "wife → wives (-fe changes to -ves)", "tag": "Irregular Plurals", "tagcolor": "#185FA5"}, {"stem": "I showed them my photos.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>indirect object</b> in this sentence?</span>", "opts": ["them", "my photos"], "ci": 0, "exp": "\"Them\" is the indirect object (who saw them). \"My photos\" is the direct object (what was shown).", "tag": "Indirect / Direct Object", "tagcolor": "#185FA5"}, {"stem": "I _____ just realized I left my phone at home.", "opts": ["have", "had"], "ci": 0, "exp": "\"Have\" is correct. The realization just happened and affects the present situation.", "tag": "Have vs Had", "tagcolor": "#185FA5"}, {"stem": "Which sentence below uses the bolded -ing word as a present participle (an adjective describing a noun)?", "opts": ["His <b>quivering</b> lip showed he was about to cry.", "Her lip is <b>quivering</b> with emotion.", "His chin was <b>quivering</b> as he spoke.", "<b>Quivering</b> can be a sign of nervousness or cold."], "ci": 0, "exp": "In \"His quivering lip showed he was about to cry,\" \"quivering\" comes directly before the noun \"lip\" and describes what the lip is doing - this adjective use of an -ing word is a present participle. In \"Her lip is quivering with emotion\" and \"His chin was quivering as he spoke,\" \"quivering\" is the main verb paired with \"is / was,\" making it part of the progressive tense. In \"Quivering can be a sign of nervousness or cold,\" \"quivering\" is the subject of the sentence, functioning as a noun, so it is a gerund.", "tag": "Present Participle", "tagcolor": "#185FA5"}, {"stem": "The bus is <u>stop</u> at every corner.", "opts": ["stopping", "stoping", "stopng", "stopped"], "ci": 0, "exp": "stop → stopping (short vowel + single consonant: double the -p, then add -ing)", "tag": "Present Progressive", "tagcolor": "#185FA5"}, {"stem": "simple<br><span style=\"font-weight:400;color:#555;font-size:0.9em;\">Choose the correct comparative and superlative forms.</span>", "opts": ["simpler / simplest", "simpleer / simpleest", "more simple / most simple", "simplere / simpleste"], "ci": 0, "exp": "simple → simpler / simplest (silent -e: drop -e, add -er/-est)", "tag": "Comparative / Superlative", "tagcolor": "#185FA5"}, {"stem": "Her constant encouragement and unwavering belief kept the exhausted team highly motivated throughout the project.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the <b>object</b> in this sentence?</span>", "opts": ["the exhausted team", "highly motivated throughout the project"], "ci": 0, "exp": "\"The exhausted team\" is the object (who was kept). \"Highly motivated throughout the project\" is the objective complement (their condition).", "tag": "Objective Complement", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">Original sentence:</div><div style=\"font-weight:700;color:#185FA5;\">She did not smile until the judge announced her name.</div><div style=\"margin-top:8px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Which sentence correctly inverts this sentence?</div>", "opts": ["Not until the judge announced her name she smiled.", "Not until the judge announced her name had she smiled.", "Not until the judge announced her name did she smiled.", "Not until the judge announced her name did she smile."], "ci": 3, "exp": "With \"Not until + clause\", the main clause inverts: \"Not until the judge announced her name + did + she + smile\". The base form \"smile\" (not \"smiled\") follows \"did\". The correct form is: Not until the judge announced her name did she smile.", "tag": "Inversion", "tagcolor": "#185FA5"}, {"stem": "The book was written _____ a famous author who grew up in a small town in rural Kansas.", "opts": ["by", "from", "with", "for"], "ci": 0, "exp": "\"By\" in passive constructions shows who performed the action. The book was created by the author. \"From\" would incorrectly suggest the book originated from the author's location.", "tag": "Prepositions", "tagcolor": "#185FA5"}, {"stem": "She <u>identify</u> the problem right away.", "opts": ["identifies", "identifys", "identifes", "identifyes"], "ci": 0, "exp": "identify → identifies (consonant + y: drop -y, add -ies)", "tag": "3rd Person Singular", "tagcolor": "#185FA5"}, {"stem": "Although they had trained for months, the team lost the championship by just one point in the final second.<br><span style=\"font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">What is the SUBJECT of this sentence?</span>", "opts": ["the team", "the championship", "months", "the final second"], "ci": 0, "exp": "", "tag": "Subject & Verb Identification", "tagcolor": "#185FA5"}, {"stem": "She is <u>brave</u>.", "opts": ["Object", "Complement"], "ci": 1, "exp": "\"Brave\" follows the linking verb \"is\" and describes the subject. It is a subject complement.", "tag": "Object vs Complement", "tagcolor": "#185FA5"}, {"stem": "<div style=\"font-size:0.85em;color:#888;font-weight:700;\">ACTIVE</div><div>Teachers <b>grade</b> the tests.</div><div style=\"margin-top:8px;font-size:0.85em;color:#888;font-weight:700;\">PASSIVE</div><div>The tests ______ by teachers.</div><div style=\"margin-top:10px;font-weight:400;font-style:italic;color:#555;font-size:0.9em;\">Choose the correct verb form to complete the passive sentence.</div>", "opts": ["is graded", "are graded", "are grading", "are grade"], "ci": 1, "exp": "The new subject \"the tests\" is plural and the action is in the present, so use are + the past participle \"graded\": are graded.", "tag": "Passive Voice", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
