ms:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">4</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">11</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">12 &minus; 11</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">&minus;20 + 22</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span> = <span style=\"display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 3px;\"><span style=\"border-left:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span><table style=\"border-collapse:collapse;display:inline-table;\"><tr><td style=\"padding:1px 6px;text-align:center;\">1</td></tr><tr><td style=\"padding:1px 6px;text-align:center;\">2</td></tr></table><span style=\"border-right:1.6px solid #111;border-top:1.6px solid #111;border-bottom:1.6px solid #111;width:4px;\"></span></span>. Check: 2(1) + 1(2) = 4 and 5(1) + 3(2) = 11.", "tag": "Matrices - Solving Matrix Equations", "tagcolor": "#185FA5"}, {"stem": "Simplify: (2<i>x</i><sup>2</sup> &minus; 3<i>x</i> + 1)(<i>x</i> + 4) &minus; (<i>x</i><sup>3</sup> &minus; 2<i>x</i>)", "opts": ["<i>x</i><sup>3</sup> + 11<i>x</i><sup>2</sup> &minus; 9<i>x</i> + 4", "<i>x</i><sup>3</sup> + 5<i>x</i><sup>2</sup> &minus; 13<i>x</i> + 4", "<i>x</i><sup>3</sup> + 5<i>x</i><sup>2</sup> &minus; 9<i>x</i> + 4", "3<i>x</i><sup>3</sup> + 5<i>x</i><sup>2</sup> &minus; 9<i>x</i> + 4"], "ci": 2, "exp": "Multiply: (2<i>x</i><sup>2</sup> &minus; 3<i>x</i> + 1)(<i>x</i> + 4) = 2<i>x</i><sup>3</sup> + 8<i>x</i><sup>2</sup> &minus; 3<i>x</i><sup>2</sup> &minus; 12<i>x</i> + <i>x</i> + 4 = 2<i>x</i><sup>3</sup> + 5<i>x</i><sup>2</sup> &minus; 11<i>x</i> + 4. Subtract <i>x</i><sup>3</sup> &minus; 2<i>x</i> (remember to distribute the negative): 2<i>x</i><sup>3</sup> &minus; <i>x</i><sup>3</sup> + 5<i>x</i><sup>2</sup> &minus; 11<i>x</i> + 2<i>x</i> + 4 = <i>x</i><sup>3</sup> + 5<i>x</i><sup>2</sup> &minus; 9<i>x</i> + 4. Forgetting to distribute the negative to &minus;2<i>x</i> gives &minus;13<i>x</i>.", "tag": "Polynomial Function Operations", "tagcolor": "#185FA5"}, {"stem": "A farmer has 240 feet of fencing to build a rectangular pen along a straight river. No fence is needed along the river. What is the largest area the pen can have?", "opts": ["14,400 square feet", "6,400 square feet", "7,200 square feet", "3,600 square feet"], "ci": 2, "exp": "Let <i>x</i> be the length of each side perpendicular to the river. The side parallel to the river is 240 &minus; 2<i>x</i>, so <i>A</i>(<i>x</i>) = <i>x</i>(240 &minus; 2<i>x</i>) = &minus;2<i>x</i><sup>2</sup> + 240<i>x</i>. The vertex is at <i>x</i> = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>240</span><span style=\"border-top:1.4px solid #111;\">2(&minus;2)</span></span> = 60, so the sides are 60 ft and 120 ft and the maximum area is 60 &times; 120 = 7,200 square feet. The answer 3,600 square feet comes from fencing all four sides as a square (60 &times; 60).", "tag": "Quadratic Functions - Optimization", "tagcolor": "#185FA5"}, {"stem": "Solve: <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3</span><span style=\"border-top:1.4px solid #111;\"><i>x</i> &minus; 2</span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span><i>x</i></span><span style=\"border-top:1.4px solid #111;\"><i>x</i> + 2</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\"><i>x</i><sup>2</sup> &minus; 4</span></span>", "opts": ["<i>x</i> = &minus;3 or <i>x</i> = 2", "<i>x</i> = &minus;3 only", "no solution", "<i>x</i> = 2 only"], "ci": 1, "exp": "The common denominator is <i>x</i><sup>2</sup> &minus; 4 = (<i>x</i> &minus; 2)(<i>x</i> + 2), so <i>x</i> &ne; 2 and <i>x</i> &ne; &minus;2. Multiply both sides by it: 3(<i>x</i> + 2) + <i>x</i>(<i>x</i> &minus; 2) = 12, which gives <i>x</i><sup>2</sup> + <i>x</i> + 6 = 12, or <i>x</i><sup>2</sup> + <i>x</i> &minus; 6 = 0. Factor: (<i>x</i> + 3)(<i>x</i> &minus; 2) = 0, so <i>x</i> = &minus;3 or <i>x</i> = 2. Since <i>x</i> = 2 makes a denominator zero, it is extraneous. The only solution is <i>x</i> = &minus;3.", "tag": "Rational Equations - Solving", "tagcolor": "#185FA5"}, {"stem": "Solve: 3|2<i>x</i> &minus; 5| + 4 &le; 25", "opts": ["1 &le; <i>x</i> &le; 6", "<i>x</i> &le; &minus;1 or <i>x</i> &ge; 6", "&minus;1 &le; <i>x</i> &le; 6", "&minus;6 &le; <i>x</i> &le; 1"], "ci": 2, "exp": "Subtract 4 and divide by 3: |2<i>x</i> &minus; 5| &le; 7. Rewrite as a compound inequality: &minus;7 &le; 2<i>x</i> &minus; 5 &le; 7. Add 5: &minus;2 &le; 2<i>x</i> &le; 12. Divide by 2: &minus;1 &le; <i>x</i> &le; 6. The choice with &ldquo;or&rdquo; would be the solution to a &ldquo;greater than or equal to&rdquo; inequality.", "tag": "Absolute Value Equations/Inequalities", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}

var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 1;
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult();
  }
}
window.goNext = goNext;

function showResultsNow(){
  state.showResults = true;
  saveState();
  render();
  reportResult();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;

function saveWrong(){
  var ord = activeOrder();
  var wrongAnswers = [];
  ord.forEach(function(qi){
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongAnswers.push({
        question: q.stem.replace(/<[^>]+>/g,''),
        yourAnswer: q.opts[state.answers[qi]].replace(/<[^>]+>/g,''),
        correctAnswer: q.opts[q.ci].replace(/<[^>]+>/g,''),
        explanation: q.exp.replace(/<[^>]+>/g,'')
      });
    }
  });
  var payload = { title: TITLE, wrongAnswers: wrongAnswers };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  a.href = url;
  a.download = 'quiz_' + QUIZ_KEY + '_wrong_' + ds + '_v1.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.copyRes = saveWrong;
window.saveWrong = saveWrong;

function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
