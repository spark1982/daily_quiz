<script>var TITLE = "[Sion] Algebra 2";var QUIZ_KEY = "quiz_algebra2_10_20260824_v1";var ATT_KEY = "quiz_algebra2_10_att_20260824_v1";var RAW_QUESTIONS = [{"stem": "If <i>f</i>(<i>x</i>) = 2<i>x</i> + 3 and <i>g</i>(<i>x</i>) = <i>x</i><sup>2</sup> &minus; 1, what is <i>f</i>(<i>g</i>(2))?", "opts": ["13", "9", "7", "3"], "ci": 1, "exp": "First evaluate the inner function: <i>g</i>(2) = 2<sup>2</sup> &minus; 1 = 4 &minus; 1 = 3. Then plug that result into <i>f</i>: <i>f</i>(3) = 2(3) + 3 = 9.", "tag": "Function Composition", "tagcolor": "#185FA5"}, {"stem": "What is the solution set of the inequality (<i>x</i> &minus; 3)/(<i>x</i> + 2) &le; 0?", "opts": ["&minus;2 &lt; <i>x</i> &le; 3", "&minus;2 &lt; <i>x</i> &lt; 3", "<i>x</i> &le; &minus;2 or <i>x</i> &ge; 3", "&minus;2 &le; <i>x</i> &le; 3"], "ci": 0, "exp": "The expression changes sign at <i>x</i> = &minus;2 (where the denominator is zero, so this value must be excluded) and at <i>x</i> = 3 (where the numerator is zero, so this value is included since the inequality allows equality). Testing each interval shows the expression is negative or zero only when &minus;2 &lt; <i>x</i> &le; 3.", "tag": "Rational Inequalities", "tagcolor": "#1D9E75"}, {"stem": "What are all the real zeros of <i>f</i>(<i>x</i>) = <i>x</i><sup>3</sup> &minus; 4<i>x</i><sup>2</sup> &minus; <i>x</i> + 4?", "opts": ["<i>x</i> = &minus;4, 1, &minus;1", "<i>x</i> = 4, 1, &minus;1", "<i>x</i> = 4, &minus;1 only", "<i>x</i> = 4, 1 only"], "ci": 1, "exp": "Factor by grouping: <i>x</i><sup>3</sup> &minus; 4<i>x</i><sup>2</sup> &minus; <i>x</i> + 4 = <i>x</i><sup>2</sup>(<i>x</i> &minus; 4) &minus; 1(<i>x</i> &minus; 4) = (<i>x</i> &minus; 4)(<i>x</i><sup>2</sup> &minus; 1) = (<i>x</i> &minus; 4)(<i>x</i> &minus; 1)(<i>x</i> + 1). Setting each factor to zero gives <i>x</i> = 4, 1, and &minus;1.", "tag": "Polynomial Functions - Zeros", "tagcolor": "#f5a623"}, {"stem": "An arithmetic sequence has a first term of 7 and a common difference of 4. What is the sum of the first 15 terms?", "opts": ["560", "490", "525", "455"], "ci": 2, "exp": "Use the arithmetic series formula S<sub>n</sub> = (<i>n</i>/2)(2<i>a</i><sub>1</sub> + (<i>n</i> &minus; 1)<i>d</i>). With <i>n</i> = 15, <i>a</i><sub>1</sub> = 7, and <i>d</i> = 4: S<sub>15</sub> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(14 + 14 &times; 4) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(14 + 56) = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>15</span><span style=\"border-top:1.4px solid #111;\">2</span></span>(70) = 525.", "tag": "Sequences & Series", "tagcolor": "#8e44ad"}, {"stem": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;\">\n<line x1=\"20\" y1=\"180\" x2=\"290\" y2=\"180\" stroke=\"#888\" stroke-width=\"1.5\"/>\n<line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"190\" stroke=\"#888\" stroke-width=\"1.5\"/>\n<path d=\"M 40 178 Q 150 -20 260 178\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.5\"/>\n<circle cx=\"150\" cy=\"15\" r=\"4\" fill=\"#E24B4A\"/>\n<text x=\"155\" y=\"15\" font-size=\"12\" fill=\"#E24B4A\">max (2, 69)</text>\n<text x=\"265\" y=\"195\" font-size=\"11\" fill=\"#555\">t (seconds)</text>\n<text x=\"5\" y=\"15\" font-size=\"11\" fill=\"#555\">h (feet)</text>\n</svg>A ball's height in feet after <i>t</i> seconds is modeled by <i>h</i>(<i>t</i>) = &minus;16<i>t</i><sup>2</sup> + 64<i>t</i> + 5. What is the maximum height the ball reaches?", "opts": ["128 feet", "5 feet", "64 feet", "69 feet"], "ci": 3, "exp": "The maximum occurs at the vertex, where <i>t</i> = &minus;<i>b</i>/(2<i>a</i>) = &minus;64/(2 &times; &minus;16) = 2 seconds. Substituting <i>t</i> = 2 into the equation: <i>h</i>(2) = &minus;16(4) + 64(2) + 5 = &minus;64 + 128 + 5 = 69 feet.", "tag": "Quadratic Optimization", "tagcolor": "#E24B4A"}, {"stem": "What is the product (3 + 2<i>i</i>)(4 &minus; 5<i>i</i>)?", "opts": ["22 &minus; 7<i>i</i>", "2 &minus; 7<i>i</i>", "12 &minus; 10<i>i</i>", "22 + 7<i>i</i>"], "ci": 0, "exp": "Use the distributive property (FOIL): (3)(4) + (3)(&minus;5<i>i</i>) + (2<i>i</i>)(4) + (2<i>i</i>)(&minus;5<i>i</i>) = 12 &minus; 15<i>i</i> + 8<i>i</i> &minus; 10<i>i</i><sup>2</sup>. Since <i>i</i><sup>2</sup> = &minus;1, the last term becomes +10. Combine: 12 + 10 = 22, and &minus;15<i>i</i> + 8<i>i</i> = &minus;7<i>i</i>, giving 22 &minus; 7<i>i</i>.", "tag": "Complex Numbers", "tagcolor": "#0e7c86"}, {"stem": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;\">\n<line x1=\"20\" y1=\"100\" x2=\"290\" y2=\"100\" stroke=\"#ccc\" stroke-width=\"1\"/>\n<line x1=\"150\" y1=\"10\" x2=\"150\" y2=\"190\" stroke=\"#ccc\" stroke-width=\"1\"/>\n<line x1=\"50\" y1=\"30\" x2=\"250\" y2=\"150\" stroke=\"#185FA5\" stroke-width=\"2.5\"/>\n<circle cx=\"90\" cy=\"40\" r=\"4\" fill=\"#E24B4A\"/>\n<text x=\"60\" y=\"35\" font-size=\"12\" fill=\"#E24B4A\">(&minus;2, 5)</text>\n<circle cx=\"230\" cy=\"145\" r=\"4\" fill=\"#E24B4A\"/>\n<text x=\"200\" y=\"165\" font-size=\"12\" fill=\"#E24B4A\">(4, &minus;7)</text>\n</svg>A line passes through the points (&minus;2, 5) and (4, &minus;7). What is the slope of the line?", "opts": ["&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">2</span></span>", "&minus;2", "2", "6"], "ci": 1, "exp": "Slope = (<i>y</i><sub>2</sub> &minus; <i>y</i><sub>1</sub>)/(<i>x</i><sub>2</sub> &minus; <i>x</i><sub>1</sub>) = (&minus;7 &minus; 5)/(4 &minus; (&minus;2)) = &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>12</span><span style=\"border-top:1.4px solid #111;\">6</span></span> = &minus;2.", "tag": "Linear Equations & Slope", "tagcolor": "#185FA5"}, {"stem": "Which angle between 0&deg; and 360&deg; is coterminal with 475&deg;?", "opts": ["155&deg;", "115&deg;", "295&deg;", "65&deg;"], "ci": 1, "exp": "To find a coterminal angle within one full rotation, subtract 360&deg;: 475&deg; &minus; 360&deg; = 115&deg;, which falls between 0&deg; and 360&deg;.", "tag": "Coterminal Angles", "tagcolor": "#8e44ad"}, {"stem": "<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:100%;height:auto;\">\n<line x1=\"20\" y1=\"100\" x2=\"290\" y2=\"100\" stroke=\"#ccc\" stroke-width=\"1\"/>\n<line x1=\"60\" y1=\"10\" x2=\"60\" y2=\"190\" stroke=\"#ccc\" stroke-width=\"1\"/>\n<path d=\"M 60 20 Q 220 100 60 180\" fill=\"none\" stroke=\"#185FA5\" stroke-width=\"2.5\"/>\n<circle cx=\"132\" cy=\"100\" r=\"4\" fill=\"#E24B4A\"/>\n<text x=\"138\" y=\"95\" font-size=\"12\" fill=\"#E24B4A\">focus (3, 0)</text>\n<circle cx=\"60\" cy=\"100\" r=\"3\" fill=\"#111\"/>\n<text x=\"35\" y=\"118\" font-size=\"11\" fill=\"#333\">vertex (0,0)</text>\n</svg>A parabola is given by the equation <i>y</i><sup>2</sup> = 12<i>x</i>. What are the coordinates of its focus?", "opts": ["(0, 3)", "(3, 0)", "(12, 0)", "(6, 0)"], "ci": 1, "exp": "The equation is in the standard form <i>y</i><sup>2</sup> = 4<i>px</i>, where the focus of a rightward-opening parabola with vertex at the origin is located at (<i>p</i>, 0). Comparing 4<i>p</i> = 12 gives <i>p</i> = 3, so the focus is at (3, 0).", "tag": "Parabolas", "tagcolor": "#E24B4A"}, {"stem": "What is the domain of the function <i>f</i>(<i>x</i>) = (2<i>x</i> + 1)/(<i>x</i> &minus; 5)?", "opts": ["All real numbers except <i>x</i> = 0", "All real numbers", "All real numbers except <i>x</i> = 5", "All real numbers except <i>x</i> = &minus;5"], "ci": 2, "exp": "A rational function is undefined wherever its denominator equals zero. Setting <i>x</i> &minus; 5 = 0 gives <i>x</i> = 5, so the domain includes every real number except <i>x</i> = 5.", "tag": "Rational Functions", "tagcolor": "#1D9E75"}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function identityOrder(){var o=[];for(var i=0;i<N;i++)o.push(i);return o;}
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length===0) return false;

}
function loadOrder(){

var order = loadOrder() || identityOrder();

}

  try{
    var raw = localStorage.getItem(QUIZ_KEY);

}
function saveState(){ try{ localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }catch(e){} }

function formatTime(sec){

function renderTimer(){

  var minutes = parseFloat(input.value);
  if(!minutes || minutes<=0) minutes=20;
  state.timerTotalSec = Math.round(minutes*60);
  state.timerStartedAt = Date.now();
  saveState(); renderTimer(); startTimerInterval();
}
function startTimerInterval(){ stopTimerInterval(); timerInterval=setInterval(renderTimer,1000); }
function stopTimerInterval(){ if(timerInterval){clearInterval(timerInterval); timerInterval=null;} }
function resetTimer(){
  state.timerTotalSec = null; state.timerStartedAt = null;
  stopTimerInterval(); saveState(); renderTimer();
}

function render(){
  updateAttDisplay();
  var qa = document.getElementById('quiz-area');
  var rs = document.getElementById('results-screen');
  if(state.showResults){
    qa.style.display='none';
    rs.classList.add('show');
    renderResults();
    return;
  }
  qa.style.display='block';
  rs.classList.remove('show');

  var qi = order[state.cur];
  var q = RAW_QUESTIONS[qi];
  document.getElementById('q-num').textContent = 'Q' + (state.cur+1) + ' / ' + order.length;

  var badge = document.getElementById('tag-badge');
  if(q.tag){
    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
