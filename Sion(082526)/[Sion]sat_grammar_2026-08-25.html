<script>var TITLE = "[Sion] SAT Grammar";var QUIZ_KEY = "quiz_satgrammar_20_20260824_v1";var ATT_KEY = "quiz_satgrammar_20_att_20260824_v1";var RAW_QUESTIONS = [{"stem": "Which choice completes the text with the most logical and precise word?", "opts": ["had", "have", "having", "has"], "ci": 0, "exp": "\"had\" is correct because the sentence describes an action completed before another past point of reference (the debate), and \"The committee\" takes a singular verb - \"had finally reached\" matches the past-perfect sequencing the sentence sets up. \"have\" and \"has\" break subject-verb agreement or tense sequencing, and \"having\" leaves the sentence without a finite main verb.", "context": "The committee, after months of contentious debate, ______ finally reached a decision that satisfied almost no one."}, {"stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "have been", "are"], "ci": 1, "exp": "With a \"neither...nor\" construction, the verb agrees with the noun closest to it - here, \"the project manager,\" which is singular, so \"was\" is correct. \"were,\" \"have been,\" and \"are\" all wrongly treat the subject as plural.", "context": "Neither the interns nor the project manager ______ aware that the server migration had already begun."}, {"stem": "Which choice most logically completes the list while maintaining parallel structure?", "opts": ["the light has a golden quality", "the light is golden", "having golden light", "there is golden light present"], "ci": 1, "exp": "\"the light is golden\" mirrors the grammatical pattern of the two preceding clauses (\"the trails are quiet,\" \"the air is cool\") - subject plus a form of \"to be\" plus an adjective. \"the light has a golden quality\" and \"there is golden light present\" shift to a different structure, and \"having golden light\" breaks parallelism entirely by switching to a participle.", "context": "Marta prefers hiking in the early morning, when the trails are quiet, the air is cool, and ______."}, {"stem": "Which choice completes the text with the most logical transition?", "opts": ["therefore, forces", "forces", "however, forces", "nonetheless forces"], "ci": 1, "exp": "No transition word is needed here because the sentence is simply describing what the protagonist does - there is no contrast or causal link to a prior idea that would justify \"therefore,\" \"however,\" or \"nonetheless.\" The plain verb \"forces\" is correct; the other options insert unearned logical relationships.", "context": "The novel's protagonist, a woman haunted by her own choices, ______ the reader to question whether redemption is ever truly possible."}, {"stem": "Which choice most logically and precisely completes the sentence?", "opts": ["it", "they", "this data", "the findings, which"], "ci": 2, "exp": "\"this data\" is precise because \"data\" is the noun that becomes inconclusive, and the earlier part of the sentence contains multiple possible antecedents (\"researchers,\" \"data,\" \"rainfall patterns\") that make a bare pronoun like \"it\" or \"they\" ambiguous. \"the findings, which\" introduces a relative clause that leaves the sentence without a main verb.", "context": "Although the researchers had collected extensive data on the region's rainfall patterns, ______ proved inconclusive when applied to the broader climate model."}, {"stem": "Which choice best revises the sentence to eliminate the dangling modifier?", "opts": ["Running along the narrow ridge, the storm clouds seemed close enough for the hikers to touch.", "Running along the narrow ridge, the hikers felt the storm clouds seemed close enough to touch.", "As the hikers ran along the narrow ridge, the storm clouds seemed close enough to touch.", "The storm clouds, running along the narrow ridge, seemed close enough to touch."], "ci": 2, "exp": "The original sentence illogically implies that the storm clouds were running along the ridge. \"As the hikers ran along the narrow ridge, the storm clouds seemed close enough to touch\" fixes this by giving the introductory clause its own explicit subject (\"the hikers\"), so the modifier no longer dangles. The other revisions either keep the clouds as the one running or awkwardly nest the modifier without resolving the ambiguity.", "context": "Running along the narrow ridge, the storm clouds seemed close enough to touch."}, {"stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["donors", "donors'", "donor's", "donors's"], "ci": 1, "exp": "\"donors'\" is the correct plural possessive - three collections belonging to multiple donors. \"donors\" lacks the needed possessive apostrophe, \"donor's\" incorrectly treats the noun as singular, and \"donors's\" is not a standard English possessive form.", "context": "The museum's new wing, which houses artifacts from three separate ______ collections, opens to the public next spring."}, {"stem": "Which choice most effectively combines the underlined ideas while eliminating wordiness?", "opts": ["the act of announcing and making public", "announcing and publicly revealing", "publicly announcing", "the process of making a public announcement of"], "ci": 2, "exp": "\"publicly announcing\" conveys the same idea as the other, wordier options in the fewest words, which is the goal when a sentence contains redundant phrasing. \"the act of announcing and making public,\" \"announcing and publicly revealing,\" and \"the process of making a public announcement of\" all pad the sentence with synonymous, repetitive language.", "context": "Because the two companies had already begun merging their supply chains, executives decided that ______ the merger formally, at this point, would create more disruption than benefit."}, {"stem": "Which choice completes the text with the most grammatically appropriate verb form?", "opts": ["were", "was", "is", "be"], "ci": 2, "exp": "This is a real, open condition about the future (not a hypothetical contrary-to-fact statement), so the indicative \"is\" is correct: \"If the pilot program is successful...\" The subjunctive \"were\" would only be appropriate for a hypothetical that is false or unlikely, \"was\" does not fit the present-tense sequencing the rest of the sentence sets up, and \"be\" is not a finite verb form here.", "context": "If the pilot program ______ successful, the district plans to expand it to all twelve elementary schools by next fall."}, {"stem": "Which choice completes the text so that the sentence is logical and grammatically correct?", "opts": ["the other", "another", "other", "others"], "ci": 0, "exp": "Because exactly two scientists are being contrasted, \"the other\" correctly refers to the second, specific person in the pair. \"another\" implies an additional, unspecified person beyond the two already mentioned, \"other\" cannot stand alone as a pronoun here, and \"others\" incorrectly implies more than two people are involved.", "context": "The two scientists disagreed sharply about the results: one insisted the data supported the hypothesis; ______ argued that the sample size was too small to support any conclusion."}, {"stem": "Which choice completes the text with the most logical verb?", "opts": ["being", "is", "are", "was, and remains,"], "ci": 1, "exp": "\"The report's central claim\" is a singular subject, so it needs the singular present-tense verb \"is.\" \"being\" leaves the sentence without a finite verb, \"are\" incorrectly treats the subject as plural, and \"was, and remains,\" awkwardly inserts a compound tense construction that the rest of the sentence does not support.", "context": "The report's central claim ______ that municipal budgets, rather than climate alone, determine how quickly cities recover from flooding."}, {"stem": "Which choice completes the text with the most logical transition?", "opts": ["for example", "similarly", "by contrast", "as a result"], "ci": 2, "exp": "\"by contrast\" correctly signals the shift from one group's praise to another group's criticism. \"for example\" would wrongly suggest the second clause illustrates the first, \"similarly\" would suggest agreement rather than disagreement, and \"as a result\" would falsely imply a causal relationship between the two opinions.", "context": "Some critics praise the film for its ambition; other reviewers, ______, find its pacing unbearably slow."}, {"stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["were", "was", "have been", "are"], "ci": 1, "exp": "\"Every one\" is a singular subject regardless of the plural noun \"applicants\" that follows in the prepositional phrase, so the singular verb \"was\" is required. \"were,\" \"have been,\" and \"are\" all incorrectly treat the subject as plural.", "context": "Every one of the applicants, despite having submitted polished portfolios, ______ required to complete an additional written exam."}, {"stem": "Which choice completes the text with the most logical verb form?", "opts": ["had been", "has being", "was being", "were"], "ci": 0, "exp": "\"had been\" correctly places this diagnosis before the technician's explanation in time, matching the past-perfect sequencing implied by \"unlike the ones reported last month.\" \"has being\" is not a grammatical verb form, \"was being\" describes an ongoing past action rather than a completed diagnosis, and \"were\" fails to agree with the singular subject \"the machine's error.\"", "context": "The technician explained that the machine's error, unlike the ones reported last month, ______ traced to a single faulty component rather than a systemic design flaw."}, {"stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "opts": ["are", "is", "were", "have been"], "ci": 1, "exp": "The subject is the singular noun \"transparency\"; the phrase \"not efficiency\" is a parenthetical aside that does not change the number of the subject, so the singular verb \"is\" is correct. \"are\" and \"have been\" wrongly treat the subject as plural, and \"were\" introduces an unwarranted subjunctive or past-tense form.", "context": "The company's founder insists that transparency, not efficiency, ______ the value that should guide every decision."}, {"stem": "Which choice completes the text with the most precise word?", "opts": ["testifies to", "testifies about", "is testified by", "gives testimony on"], "ci": 0, "exp": "\"testifies to\" is the standard idiomatic phrase meaning \"serves as evidence of.\" \"testifies about\" and \"gives testimony on\" are non-idiomatic in this context, and \"is testified by\" awkwardly reverses the logical relationship between the fact and the structural integrity it demonstrates.", "context": "The city's oldest bridge has withstood floods, earthquakes, and even a direct hit from a runaway barge, a fact that ______ its structural integrity."}, {"stem": "Which choice completes the text with the most precise and idiomatic phrase?", "opts": ["consistent to", "consistent from", "consistent with", "consistent about"], "ci": 2, "exp": "\"consistent with\" is the correct, idiomatic preposition pairing for describing agreement between two things. \"consistent to,\" \"consistent from,\" and \"consistent about\" are not standard idiomatic constructions in English.", "context": "The professor argued that the two studies, though conducted a decade apart, arrived at conclusions that were remarkably ______ each other."}, {"stem": "Which choice completes the text with the most logical transition?", "opts": ["consequently", "nevertheless", "for instance", "in other words"], "ci": 0, "exp": "\"consequently\" correctly signals that the vote to reject the proposal followed logically from the careful review. \"nevertheless\" would wrongly suggest the vote contradicted expectations set up by the review, \"for instance\" would incorrectly frame the vote as an example, and \"in other words\" would falsely suggest the vote merely restates the review.", "context": "The board members reviewed the proposal carefully; ______, they voted unanimously to reject it."}, {"stem": "Which choice completes the text with the most logical word given the rest of the sentence?", "opts": ["therefore", "somehow", "consequently", "thus"], "ci": 1, "exp": "\"somehow\" fits because the sentence sets up a surprising contrast: despite diverging interests, the twins still collaborate, and \"somehow\" captures that note of surprise without asserting a false logical cause. \"therefore,\" \"consequently,\" and \"thus\" all incorrectly imply that the collaboration is a direct logical result of the diverging interests, which contradicts the sentence's meaning.", "context": "The twins, whose research interests diverged sharply after college, ______ still collaborate on projects that combine economics and psychology."}, {"stem": "Which choice completes the text with the most precise verb?", "opts": ["complimented", "complemented", "complimenting", "complements"], "ci": 1, "exp": "\"complemented\" (meaning \"completed or enhanced\") is the correct word for poems that add to and complete the sculptures' themes. \"complimented\" means \"praised,\" which does not fit the context, \"complimenting\" is not a finite verb that matches \"poems that,\" and \"complements\" incorrectly shifts to present tense and singular form.", "context": "Reviewers praised the exhibit for pairing sculptures with poems that ______ their themes rather than simply describing them."}];var N = RAW_QUESTIONS.length;var ORDER_KEY = QUIZ_KEY + '_order_v1';
function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));

function formatTime(sec){

function renderTimer(){

    badge.style.display='inline-block';
    badge.textContent = q.tag;
    badge.style.background = q.tagcolor || '#185FA5';
  } else { badge.style.display='none'; }

  var pbox = document.getElementById('passage-box');
  if(q.passage){ pbox.style.display='block'; pbox.innerHTML = q.passage; } else { pbox.style.display='none'; }
  var cbox = document.getElementById('context-box');
  if(q.context){ cbox.style.display='block'; cbox.innerHTML = q.context; } else { cbox.style.display='none'; }

  document.getElementById('q-text').innerHTML = q.stem;

  var answered = state.answers[qi];
  var optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML = optText;
    btn.disabled = answered !== undefined;
    if(answered !== undefined){
      if(idx === q.ci) btn.classList.add(answered===idx ? 'correct' : 'revealed');
      else if(answered === idx) btn.classList.add('wrong');
    }
    btn.onclick = function(){ chooseAnswer(idx); };
    optDiv.appendChild(btn);
  });

  var expDiv = document.getElementById('exp-box');
  if(answered !== undefined && answered !== q.ci){
    expDiv.style.display='block';
    expDiv.innerHTML = q.exp;
  } else {
    expDiv.style.display='none';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = (state.cur >= order.length-1) ? 'Show Results →' : 'Next →';

  updateNav();
}

function updateNav(){
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  document.getElementById('nav-count').textContent = answered + ' / ' + order.length;
  document.getElementById('prog-fill').style.width = (answered/order.length*100).toFixed(1)+'%';
  renderDots();
}
function renderDots(){
  var panel = document.getElementById('dot-panel');
  if(panel.style.display==='none') return;
  var html='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var bg = state.answers[qi]===undefined ? '#d7dde6' : (state.answers[qi]===RAW_QUESTIONS[qi].ci ? '#185FA5' : '#E24B4A');
    html += '<button class="dot" style="background:'+bg+';" onclick="goToQ('+pos+')">'+(pos+1)+'</button>';
  }
  var answered=0;
  for(var k=0;k<order.length;k++){ if(state.answers[order[k]]!==undefined) answered++; }
  if(answered===order.length){
    html += '<br><button class="results-pill" onclick="showResultsNow()">Results</button>';
  }
  panel.innerHTML = html;
}
function toggleJump(){
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display==='none' || panel.style.display===''){
    panel.style.display='block'; btn.innerHTML='Hide &#9652;'; renderDots();
  } else {
    panel.style.display='none'; btn.innerHTML='Jump &#9662;';
  }
}
function goToQ(pos){
  state.cur = pos; state.showResults=false; saveState(); render();
}
function showResultsNow(){
  state.showResults = true; incAttempts(); saveState(); render();
}
function chooseAnswer(idx){
  var qi = order[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState(); render();
}
function goPrev(){
  if(state.cur>0){ state.cur--; saveState(); render(); }
}
function goNext(){
  if(state.cur < order.length-1){ state.cur++; saveState(); render(); }
  else { state.showResults=true; incAttempts(); saveState(); render(); }
}
function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]===undefined){ skipped++; continue; }
    if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else wrong++;
  }
  document.getElementById('results-score').textContent = correct+' correct, '+wrong+' wrong, '+skipped+' skipped - out of '+order.length;
  var grid = document.getElementById('results-grid');
  grid.innerHTML='';
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var card = document.createElement('div');
    if(state.answers[qi]===undefined){
      card.className='r-card skipped';
      card.textContent='Q'+(pos+1)+' Skip';
    } else {
      var ok = state.answers[qi]===RAW_QUESTIONS[qi].ci;
      card.className='r-card '+(ok?'correct':'wrong');
      card.textContent='Q'+(pos+1)+' '+(ok?'OK':'X');
    }
    (function(p){ card.onclick=function(){ state.showResults=false; state.cur=p; saveState(); render(); }; })(pos);
    grid.appendChild(card);
  }
}
function retryWrong(){
  var wrong=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    if(state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci){
      wrong.push(qi);
    }
  }
  if(wrong.length===0) return;
  wrong.forEach(function(qi){ delete state.answers[qi]; });
  order = wrong;
  saveOrder(order);
  state.cur=0; state.showResults=false;
  saveState(); render(); renderTimer();
}
function copyRes(){
  var lines=[TITLE+' Results'];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    var s='Q'+(pos+1)+': ';
    if(a===undefined) s+='Skipped';
    else s += (a===RAW_QUESTIONS[qi].ci ? 'Correct' : 'Wrong');
    lines.push(s);
  }
  var text = lines.join('\n');
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(function(){}); }
    else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
  }catch(e){}
}
function saveWrongAnswers(){
  var wrongItems=[];
  for(var pos=0; pos<order.length; pos++){
    var qi = order[pos];
    var a = state.answers[qi];
    if(a!==undefined && a!==RAW_QUESTIONS[qi].ci){
      var q = RAW_QUESTIONS[qi];
      wrongItems.push({ question: q.stem, yourAnswer: q.opts[a], correctAnswer: q.opts[q.ci], explanation: q.exp });
    }
  }
  var blob = new Blob([JSON.stringify({title:TITLE, wrongAnswers:wrongItems}, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a2 = document.createElement('a');
  a2.href = url; a2.download = QUIZ_KEY + '_wrong.json';
  document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
  URL.revokeObjectURL(url);
}
function openFreshModal(mode){
  pendingFreshMode = mode;
  var t = document.getElementById('freshModalTitle');
  var m = document.getElementById('freshModalText');
  if(mode==='random'){
    t.textContent='Start Fresh (Random Order)?';
    m.textContent='Questions will be reshuffled into a new random order, and all progress will be cleared. This cannot be undone.';
  } else {
    t.textContent='Start Fresh (Original Order)?';
    m.textContent='Questions will return to their original order, and all progress will be cleared. This cannot be undone.';
  }
  document.getElementById('freshModal').classList.add('show');
}
function openFreshModalOriginal(){ openFreshModal('original'); }
function openFreshModalRandom(){ openFreshModal('random'); }
function closeFreshModal(){ document.getElementById('freshModal').classList.remove('show'); }
function confirmFresh(){
  order = (pendingFreshMode==='random') ? shuffleArr(identityOrder()) : identityOrder();
  saveOrder(order);
  state = defaultState();
  saveState();
  resetTimer();
  closeFreshModal();
  render();
  renderTimer();
}

window.startTimer=startTimer;
window.toggleJump=toggleJump;
window.goToQ=goToQ;
window.showResultsNow=showResultsNow;
window.chooseAnswer=chooseAnswer;
window.goPrev=goPrev;
window.goNext=goNext;
window.retryWrong=retryWrong;
window.copyRes=copyRes;
window.saveWrongAnswers=saveWrongAnswers;
window.openFreshModalOriginal=openFreshModalOriginal;
window.openFreshModalRandom=openFreshModalRandom;
window.closeFreshModal=closeFreshModal;
window.confirmFresh=confirmFresh;

render();
renderTimer();
if(state.timerStartedAt) startTimerInterval();
</script>
</body>
</html>
