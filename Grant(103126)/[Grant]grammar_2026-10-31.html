<script>
var TITLE = "[Grant] Grammar";
var QUIZ_KEY = "grantgrammar_edit_20";
var INSTRUCTION = "Read each short draft. Choose the best way to fix it, or choose NO CHANGE if it is already correct.";
var TODAY_STR = "20261031";
var RAW_QUESTIONS = [{"stem": "What is the correct way to write the underlined part in sentence 1?", "opts": ["drove", "NO CHANGE", "has driven", "will drive"], "ci": 0, "exp": "The trip happened <i>last weekend</i>, so use the past tense: <i>Last weekend, my family <b>drove</b> to Carlsbad Caverns.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>A Letter to Uncle Dan</strong><br>Dear Uncle Dan,<br><b>(1)</b> Last weekend, my family <u>drives</u> to Carlsbad Caverns in New Mexico. <b>(2)</b> We <u>had never seen</u> a cave that big before our trip. <b>(3)</b> The trail into the cave was steep. <b>(4)</b> It was also slippery. <b>(5)</b> At the bottom, we saw huge rock formations that looked like giant icicles. <b>(6)</b> We loved the Big Room, and <u>it's</u> ceiling seemed as high as the sky. <b>(7)</b> I hope you can come with us on our next big trip!<br>Love,<br>Ethan"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["have never seen", "NO CHANGE", "had never saw", "has never seen"], "ci": 1, "exp": "It is already correct. <i>Had</i> + the past participle <i>seen</i> shows something that was true up to a past time (before the trip). <i>Saw</i> is the past tense, not the past participle.", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>A Letter to Uncle Dan</strong><br>Dear Uncle Dan,<br><b>(1)</b> Last weekend, my family <u>drives</u> to Carlsbad Caverns in New Mexico. <b>(2)</b> We <u>had never seen</u> a cave that big before our trip. <b>(3)</b> The trail into the cave was steep. <b>(4)</b> It was also slippery. <b>(5)</b> At the bottom, we saw huge rock formations that looked like giant icicles. <b>(6)</b> We loved the Big Room, and <u>it's</u> ceiling seemed as high as the sky. <b>(7)</b> I hope you can come with us on our next big trip!<br>Love,<br>Ethan"}, {"stem": "What is the best way to combine sentences 3 and 4?", "opts": ["The trail into the cave was steep, it was also slippery.", "The trail into the cave was steep, but it was slippery.", "Because the trail into the cave was steep, it was also slippery.", "The trail into the cave was steep and slippery."], "ci": 3, "exp": "Both sentences describe the trail, so join the two describing words with <i>and</i>: <i>The trail into the cave was steep <b>and</b> slippery.</i> <i>But</i> shows a contrast, and <i>because</i> says one thing caused the other, which is not what the writer meant.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>A Letter to Uncle Dan</strong><br>Dear Uncle Dan,<br><b>(1)</b> Last weekend, my family <u>drives</u> to Carlsbad Caverns in New Mexico. <b>(2)</b> We <u>had never seen</u> a cave that big before our trip. <b>(3)</b> The trail into the cave was steep. <b>(4)</b> It was also slippery. <b>(5)</b> At the bottom, we saw huge rock formations that looked like giant icicles. <b>(6)</b> We loved the Big Room, and <u>it's</u> ceiling seemed as high as the sky. <b>(7)</b> I hope you can come with us on our next big trip!<br>Love,<br>Ethan"}, {"stem": "What is the correct way to write the underlined part in sentence 6?", "opts": ["NO CHANGE", "its'", "it is", "its"], "ci": 3, "exp": "<i>It's</i> means <i>it is</i>. To show that the ceiling belongs to the room, use <i>its</i> with no apostrophe: <i>We loved the Big Room, and <b>its</b> ceiling seemed as high as the sky.</i>", "tag": "Apostrophes & Confused Words", "tagcolor": "#a5720a", "passage": "<strong>A Letter to Uncle Dan</strong><br>Dear Uncle Dan,<br><b>(1)</b> Last weekend, my family <u>drives</u> to Carlsbad Caverns in New Mexico. <b>(2)</b> We <u>had never seen</u> a cave that big before our trip. <b>(3)</b> The trail into the cave was steep. <b>(4)</b> It was also slippery. <b>(5)</b> At the bottom, we saw huge rock formations that looked like giant icicles. <b>(6)</b> We loved the Big Room, and <u>it's</u> ceiling seemed as high as the sky. <b>(7)</b> I hope you can come with us on our next big trip!<br>Love,<br>Ethan"}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "which", "when", "who"], "ci": 0, "exp": "It is already correct. <i>Where</i> introduces a place (the hive): <i>back to the hive, <b>where</b> other bees store it.</i>", "tag": "Relative Pronouns & Adverbs", "tagcolor": "#0d9488", "passage": "<strong>How Honeybees Make Honey</strong><br><b>(1)</b> Honeybees make honey from nectar, the sweet juice inside flowers. <b>(2)</b> The bees carry the nectar back to the hive, <u>where</u> other bees store it in wax cells. <b>(3)</b> The busy workers in each hive <u>flaps</u> their wings to dry out the nectar. <b>(4)</b> Honey almost never spoils so scientists have found jars of it in ancient Egyptian tombs. <b>(5)</b> In a good summer, a strong hive works real hard and makes more honey than it needs. <b>(6)</b> Beekeepers take only the extra honey and leave the rest for winter."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["NO CHANGE", "is flapping", "flap", "has flapped"], "ci": 2, "exp": "The subject is <i>workers</i> (plural), not <i>hive</i>, so the verb must be plural: <i>The busy workers in each hive <b>flap</b> their wings.</i>", "tag": "Subject-Verb Agreement", "tagcolor": "#f5a623", "passage": "<strong>How Honeybees Make Honey</strong><br><b>(1)</b> Honeybees make honey from nectar, the sweet juice inside flowers. <b>(2)</b> The bees carry the nectar back to the hive, <u>where</u> other bees store it in wax cells. <b>(3)</b> The busy workers in each hive <u>flaps</u> their wings to dry out the nectar. <b>(4)</b> Honey almost never spoils so scientists have found jars of it in ancient Egyptian tombs. <b>(5)</b> In a good summer, a strong hive works real hard and makes more honey than it needs. <b>(6)</b> Beekeepers take only the extra honey and leave the rest for winter."}, {"stem": "Where should a comma be added in sentence 4?", "opts": ["Honey almost never spoils, so scientists have found jars of it in ancient Egyptian tombs.", "Honey, almost never spoils so scientists have found jars of it in ancient Egyptian tombs.", "Honey almost never spoils so, scientists have found jars of it in ancient Egyptian tombs.", "Honey almost never, spoils so scientists have found jars of it in ancient Egyptian tombs."], "ci": 0, "exp": "When <i>so</i> joins two complete sentences, put a comma before it: <i>Honey almost never spoils<b>,</b> so scientists have found jars of it in ancient Egyptian tombs.</i>", "tag": "Commas", "tagcolor": "#d6336c", "passage": "<strong>How Honeybees Make Honey</strong><br><b>(1)</b> Honeybees make honey from nectar, the sweet juice inside flowers. <b>(2)</b> The bees carry the nectar back to the hive, <u>where</u> other bees store it in wax cells. <b>(3)</b> The busy workers in each hive <u>flaps</u> their wings to dry out the nectar. <b>(4)</b> Honey almost never spoils so scientists have found jars of it in ancient Egyptian tombs. <b>(5)</b> In a good summer, a strong hive works real hard and makes more honey than it needs. <b>(6)</b> Beekeepers take only the extra honey and leave the rest for winter."}, {"stem": "Which sentence has an error?", "opts": ["Honeybees make honey from nectar, the sweet juice inside flowers.", "The bees carry the nectar back to the hive, where other bees store it in wax cells.", "In a good summer, a strong hive works real hard and makes more honey than it needs.", "Beekeepers take only the extra honey and leave the rest for winter."], "ci": 2, "exp": "<i>Real</i> describes a noun; to describe how hard the hive works, use <i>really</i>: <i>a strong hive works <b>really</b> hard and makes more honey than it needs.</i>", "tag": "Modifiers", "tagcolor": "#2f9e44", "passage": "<strong>How Honeybees Make Honey</strong><br><b>(1)</b> Honeybees make honey from nectar, the sweet juice inside flowers. <b>(2)</b> The bees carry the nectar back to the hive, <u>where</u> other bees store it in wax cells. <b>(3)</b> The busy workers in each hive <u>flaps</u> their wings to dry out the nectar. <b>(4)</b> Honey almost never spoils so scientists have found jars of it in ancient Egyptian tombs. <b>(5)</b> In a good summer, a strong hive works real hard and makes more honey than it needs. <b>(6)</b> Beekeepers take only the extra honey and leave the rest for winter."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "had taken", "has taken", "have took"], "ci": 1, "exp": "After <i>had</i>, use the past participle. The past participle of <i>take</i> is <i>taken</i>: <i>By noon, we <b>had taken</b> twelve bags to the curb.</i>", "tag": "Perfect Tenses", "tagcolor": "#1D9E75", "passage": "<strong>My Leaf-Raking Journal</strong><br><b>(1)</b> On Saturday, I helped my neighbor, Mr. Ortiz, rake the leaves in his yard. <b>(2)</b> By noon, we <u>had took</u> twelve bags to the curb. <b>(3)</b> Mr. Ortiz said I <u>can</u> jump in the last pile before we bagged it. <b>(4)</b> Me and him laughed when the crunchy leaves stuck in my hair. <b>(5)</b> My arms were sore. <b>(6)</b> I felt proud of our work. <b>(7)</b> Next weekend, we will rake his big front yard together."}, {"stem": "What is the correct way to write the underlined part in sentence 3?", "opts": ["could", "NO CHANGE", "can't", "could of"], "ci": 0, "exp": "The sentence tells what Mr. Ortiz <i>said</i> in the past, so <i>can</i> changes to <i>could</i>: <i>Mr. Ortiz said I <b>could</b> jump in the last pile.</i> (<i>Could of</i> is never correct; the words are <i>could have</i>.)", "tag": "Modals & Prepositions", "tagcolor": "#1c7ed6", "passage": "<strong>My Leaf-Raking Journal</strong><br><b>(1)</b> On Saturday, I helped my neighbor, Mr. Ortiz, rake the leaves in his yard. <b>(2)</b> By noon, we <u>had took</u> twelve bags to the curb. <b>(3)</b> Mr. Ortiz said I <u>can</u> jump in the last pile before we bagged it. <b>(4)</b> Me and him laughed when the crunchy leaves stuck in my hair. <b>(5)</b> My arms were sore. <b>(6)</b> I felt proud of our work. <b>(7)</b> Next weekend, we will rake his big front yard together."}, {"stem": "Which sentence has an error?", "opts": ["Me and him laughed when the crunchy leaves stuck in my hair.", "On Saturday, I helped my neighbor, Mr. Ortiz, rake the leaves in his yard.", "I felt proud of our work.", "Next weekend, we will rake his big front yard together."], "ci": 0, "exp": "The people doing the laughing are subjects, so use subject pronouns, and name yourself last: <i><b>He and I</b> laughed when the crunchy leaves stuck in my hair.</i>", "tag": "Pronouns", "tagcolor": "#7b61ff", "passage": "<strong>My Leaf-Raking Journal</strong><br><b>(1)</b> On Saturday, I helped my neighbor, Mr. Ortiz, rake the leaves in his yard. <b>(2)</b> By noon, we <u>had took</u> twelve bags to the curb. <b>(3)</b> Mr. Ortiz said I <u>can</u> jump in the last pile before we bagged it. <b>(4)</b> Me and him laughed when the crunchy leaves stuck in my hair. <b>(5)</b> My arms were sore. <b>(6)</b> I felt proud of our work. <b>(7)</b> Next weekend, we will rake his big front yard together."}, {"stem": "What is the best way to combine sentences 5 and 6?", "opts": ["My arms were sore, so I felt proud of our work.", "My arms were sore I felt proud of our work.", "My arms were sore, but I felt proud of our work.", "Because my arms were sore, I felt proud of our work."], "ci": 2, "exp": "Sore arms and feeling proud are a contrast, so use <i>but</i> with a comma: <i>My arms were sore<b>, but</b> I felt proud of our work.</i> <i>So</i> and <i>because</i> wrongly say the sore arms caused the pride.", "tag": "Conjunctions & Combining", "tagcolor": "#8e44ad", "passage": "<strong>My Leaf-Raking Journal</strong><br><b>(1)</b> On Saturday, I helped my neighbor, Mr. Ortiz, rake the leaves in his yard. <b>(2)</b> By noon, we <u>had took</u> twelve bags to the curb. <b>(3)</b> Mr. Ortiz said I <u>can</u> jump in the last pile before we bagged it. <b>(4)</b> Me and him laughed when the crunchy leaves stuck in my hair. <b>(5)</b> My arms were sore. <b>(6)</b> I felt proud of our work. <b>(7)</b> Next weekend, we will rake his big front yard together."}, {"stem": "What is the correct way to write the underlined part in sentence 2?", "opts": ["NO CHANGE", "will happen", "has happened", "happened"], "ci": 3, "exp": "The story is told in the past (<i>poured</i>), so keep the past tense: <i>Lucy poured vinegar into the top, but nothing <b>happened</b>.</i>", "tag": "Verb Tense & Shifts", "tagcolor": "#185FA5", "passage": "<strong>The Volcano That Wouldn't Erupt</strong><br><b>(1)</b> Lucy and her brother Sam built a clay volcano for the science fair. <b>(2)</b> On the big day, Lucy poured vinegar into the top, but nothing <u>happens</u>. <b>(3)</b> &ldquo;We forgot the baking soda&rdquo; Sam whispered. <b>(4)</b> Lucy quickly handed the box to <u>him</u>, and he shook some into the volcano. <b>(5)</b> Suddenly, red foam bubbled over the sides. <b>(6)</b> <u>Spilling onto the table and the judge's shoes.</u> <b>(7)</b> Luckily, the judge laughed and gave them a blue ribbon anyway."}, {"stem": "Where should a comma be added in sentence 3?", "opts": ["&ldquo;We forgot the baking soda&rdquo;, Sam whispered.", "&ldquo;We forgot the baking soda&rdquo; Sam, whispered.", "&ldquo;We forgot the baking soda,&rdquo; Sam whispered.", "&ldquo;We, forgot the baking soda&rdquo; Sam whispered."], "ci": 2, "exp": "When a quotation comes before words like <i>Sam whispered</i>, put a comma at the end of the spoken words, <b>inside</b> the closing quotation mark: <i>&ldquo;We forgot the baking soda<b>,</b>&rdquo; Sam whispered.</i>", "tag": "Quotations, Titles & Capitals", "tagcolor": "#495057", "passage": "<strong>The Volcano That Wouldn't Erupt</strong><br><b>(1)</b> Lucy and her brother Sam built a clay volcano for the science fair. <b>(2)</b> On the big d arden Cleanup Day on Saturday, November 7. <b>(2)</b> Students and parents <u>should</u> bring gloves and a rake if they have them. <b>(3)</b> Each of the volunteers is going to get a free pumpkin muffin. <b>(4)</b> The tools for the job is waiting in the shed behind the gym. <b>(5)</b> We will pull weeds. <b>(6)</b> The weeds grow along the fence. <b>(7)</b> The garden will look <u>beautifuller</u> than ever by lunchtime!"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
