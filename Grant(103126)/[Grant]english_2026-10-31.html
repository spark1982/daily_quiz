st Bowl, and new farming methods helped the land recover.", "High wheat prices in the 1920s made farm families on the Great Plains wealthy.", "The federal government forced farm families to leave the Great Plains in the 1930s."], "ci": 1, "exp": "The passage moves from cause (prairie grass plowed up, then &ldquo;a severe drought struck in 1931&rdquo;) to effects (dust storms, families leaving) to the solution (&ldquo;the new methods kept much of the soil from blowing away&rdquo;). Black Sunday is only one detail, and the passage never calls it the worst storm ever.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Dust Bowl</strong><br>During the 1920s, farmers on the southern Great Plains plowed up millions of acres of native prairie grass to plant wheat. Wheat prices were high, and many families enjoyed a brief period of prosperity. The deep roots of the prairie grass, however, had held the soil in place for thousands of years, even through long dry spells.<br><br>When a severe drought struck in 1931, the exposed topsoil dried into fine dust. Strong winds lifted it into enormous black clouds that rolled across Kansas, Oklahoma, and Texas. In 1934, one storm carried dust all the way to the East Coast, where it settled on ships in the Atlantic Ocean. On April 14, 1935, a day later called Black Sunday, a storm grew so dense that people could not see their own hands in front of their faces. Thousands of families abandoned their farms and moved west in search of work.<br><br>In response, the federal government created the Soil Conservation Service in 1935. Its experts taught farmers to plant rows of trees as windbreaks and to plow in curving lines that followed the shape of the land. By the early 1940s, the rains had returned, and the new methods kept much of the soil from blowing away again."}, {"stem": "As it is used in the second paragraph, what does the word <b>abandoned</b> mean?", "opts": ["sold for a high price", "left behind for good", "rented to other farmers", "repaired after a storm"], "ci": 1, "exp": "Families &ldquo;abandoned their farms and moved west in search of work,&rdquo; so they left the farms behind. Nothing in the passage says they sold or rented the land.", "tag": "Word Meaning in Context", "tagcolor": "#185FA5", "passage": "<strong>The Dust Bowl</strong><br>During the 1920s, farmers on the southern Great Plains plowed up millions of acres of native prairie grass to plant wheat. Wheat prices were high, and many families enjoyed a brief period of prosperity. The deep roots of the prairie grass, however, had held the soil in place for thousands of years, even through long dry spells.<br><br>When a severe drought struck in 1931, the exposed topsoil dried into fine dust. Strong winds lifted it into enormous black clouds that rolled across Kansas, Oklahoma, and Texas. In 1934, one storm carried dust all the way to the East Coast, where it settled on ships in the Atlantic Ocean. On April 14, 1935, a day later called Black Sunday, a storm grew so dense that people could not see their own hands in front of their faces. Thousands of families abandoned their farms and moved west in search of work.<br><br>In response, the federal government created the Soil Conservation Service in 1935. Its experts taught farmers to plant rows of trees as windbreaks and to plow in curving lines that followed the shape of the land. By the early 1940s, the rains had returned, and the new methods kept much of the soil from blowing away again."}, {"stem": "According to the passage, why did the topsoil blow away so easily during the drought?", "opts": ["The prairie grass whose roots had held the soil in place had been plowed up.", "The wheat plants had pulled all the water out of the soil.", "Rows of trees planted as windbreaks had blocked the rain.", "Strong winds had already torn the prairie grass out of the ground."], "ci": 0, "exp": "The passage explains that &ldquo;the deep roots of the prairie grass &hellip; had held the soil in place,&rdquo; but farmers had &ldquo;plowed up millions of acres&rdquo; of it. The passage never says the wheat dried out the soil; that is a guess, not a stated cause.", "tag": "Cause & Effect", "tagcolor": "#185FA5", "passage": "<strong>The Dust Bowl</strong><br>During the 1920s, farmers on the southern Great Plains plowed up millions of acres of native prairie grass to plant wheat. Wheat prices were high, and many families enjoyed a brief period of prosperity. The deep roots of the prairie grass, however, had held the soil in place for thousands of years, even through long dry spells.<br><br>When a severe drought struck in 1931, the exposed topsoil dried into fine dust. Strong winds lifted it into enormous black clouds that rolled across Kansas, Oklahoma, and Texas. In 1934, one storm carried dust all the way to the East Coast, where it settled on ships in the Atlantic Ocean. On April 14, 1935, a day later called Black Sunday, a storm grew so dense that people could not see their own hands in front of their faces. Thousands of families abandoned their farms and moved west in search of work.<br><br>In response, the federal government created the Soil Conservation Service in 1935. Its experts taught farmers to plant rows of trees as windbreaks and to plow in curving lines that followed the shape of the land. By the early 1940s, the rains had returned, and the new methods kept much of the soil from blowing away again."}, {"stem": "According to the passage, how can a bat tell that an object is close?", "opts": ["Its echo sounds higher than the echo from a distant object.", "Its echo comes back sooner than the echo from a distant object.", "The bat can see the object's shape in the dark.", "The bat hears the object moving through the air."], "ci": 1, "exp": "The passage states, &ldquo;A close object returns its echo sooner than a distant one.&rdquo; The passage also mentions how loud an echo is, but never says a close echo sounds higher.", "tag": "Fact Retrieval", "tagcolor": "#185FA5", "passage": "<strong>How Bats See with Sound</strong><br>On a summer night, a little brown bat can catch hundreds of mosquitoes in a single hour without bumping into one branch. The bat is not relying on its eyes. Instead, it uses echolocation. As it flies, the bat produces a rapid series of high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how long each echo takes to return, and how loud it is, the bat&rsquo;s brain builds a detailed picture of its surroundings. A close object returns its echo sooner than a distant one. As a bat closes in on an insect, it calls faster and faster, sometimes nearly two hundred times per second, a burst that scientists have nicknamed the &ldquo;feeding buzz.&rdquo;<br><br>Some moths have developed a clever defense. They can hear the calls, and when a bat approaches, they drop toward the ground or make clicking sounds of their own that may confuse the hunter. Still, echolocation is so precise that some bats can detect a wire thinner than a human hair."}, {"stem": "According to the passage, which statement is <b>NOT</b> true?", "opts": ["Most bat calls are too high for people to hear.", "A bat calls about two hundred times per second during its whole flight.", "Some moths make clicking sounds when a bat comes near.", "A bat calls faster as it gets closer to an insect."], "ci": 1, "exp": "The passage says a bat calls &ldquo;sometimes nearly two hundred times per second&rdquo; only &ldquo;as a bat closes in on an insect&rdquo; &mdash; not during its whole flight. The other three statements match the passage.", "tag": "NOT True", "tagcolor": "#185FA5", "passage": "<strong>How Bats See with Sound</strong><br>On a summer night, a little brown bat can catch hundreds of mosquitoes in a single hour without bumping into one branch. The bat is not relying on its eyes. Instead, it uses echolocation. As it flies, the bat produces a rapid series of high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how long each echo takes to return, and how loud it is, the bat&rsquo;s brain builds a detailed picture of its surroundings. A close object returns its echo sooner than a distant one. As a bat closes in on an insect, it calls faster and faster, sometimes nearly two hundred times per second, a burst that scientists have nicknamed the &ldquo;feeding buzz.&rdquo;<br><br>Some moths have developed a clever defense. They can hear the calls, and when a bat approaches, they drop toward the ground or make clicking sounds of their own that may confuse the hunter. Still, echolocation is so precise that some bats can detect a wire thinner than a human hair."}, {"stem": "What can the reader infer about moths that can hear bat calls?", "opts": ["They hunt mosquitoes in the same way that bats do.", "They can see much better in the dark than bats can.", "They make clicking sounds to find their own food.", "They have a better chance of escaping than moths that cannot hear the calls."], "ci": 3, "exp": "The passage calls their hearing &ldquo;a clever defense&rdquo; that lets them &ldquo;drop toward the ground&rdquo; when a bat approaches, so they are more likely to get away. The clicking sounds are used to &ldquo;confuse the hunter,&rdquo; not to find food.", "tag": "Inference", "tagcolor": "#185FA5", "passage": "<strong>How Bats See with Sound</strong><br>On a summer night, a little brown bat can catch hundreds of mosquitoes in a single hour without bumping into one branch. The bat is not relying on its eyes. Instead, it uses echolocation. As it flies, the bat produces a rapid series of high-pitched calls, most of them too high for human ears to detect. When a call strikes an object, part of the sound bounces back as an echo.<br><br>By comparing how long each echo takes to ter and faster, sometimes nearly two hundred times per second, a burst that scientists have nicknamed the &ldquo;feeding buzz.&rdquo;<br><br>Some moths have developed a clever defense. They can hear the calls, and when a bat approaches, they drop toward the ground or make clicking sounds of their own that may confuse the hunter. Still, echolocation is so precise that some bats can detect a wire thinner than a human hair."}, {"stem": "Which statement best describes a theme of the story?", "opts": ["Winning a prize matters more than enjoying a hobby.", "Old things are always better made than new things.", "Small imperfections can make something more meaningful.", "Hard work always leads to a perfect result."], "ci": 2, "exp": "Nani&rsquo;s mother said &ldquo;a quilt with no mistakes has no story,&rdquo; and Priya turns her own mistake into a story with a gold star. The story does not say old quilts are better made &mdash; the old quilt has a mistake too.", "tag": "Main Idea / Theme", "tagcolor": "#185FA5", "passage": "<strong>The Crooked Star</strong><br>Priya smoothed the quilt across the kitchen table and froze. In the center block, one point of the eight-pointed star tilted sideways like a broken compass needle.<br><br>&ldquo;Nani, look,&rdquo; she groaned. &ldquo;The county fair is Saturday, and the star is crooked. We have to take the whole block apart.&rdquo;<br><br>Her grandmother adjusted her glasses and studied the seam for a long moment. &ldquo;We could,&rdquo; she said. &ldquo;That would take two evenings, and we might stretch the fabric.&rdquo;<br><br>&ldquo;But the judges will notice,&rdquo; Priya insisted, hoping to persuade her. &ldquo;Everything has to be perfect.&rdquo;<br><br>Nani reached into her sewing basket and pulled out a faded quilt, its edges worn soft from decades of use. &ldquo;My mother made this in 1962,&rdquo; she said. &ldquo;Find the mistake.&rdquo;<br><br>Priya searched every row. At last she spotted it: one blue square stitched upsid var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
