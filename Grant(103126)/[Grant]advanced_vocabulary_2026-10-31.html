<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261031";
var RAW_QUESTIONS = [{"stem": "A polar bear's thick fur is an ______ that helps it survive in the freezing Arctic.", "opts": ["adapt", "adaptable", "adapting", "adaptation"], "ci": 3, "exp": "The blank needs a noun after <i>an</i>, so <i>adaptation</i> is correct. <i>adapt</i> (v.) to change to fit a new situation. <i>Camels have <b>adapted</b> to life in the desert.</i> Family: adapt (v.), adaptation (n.), adaptable (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Our neighbor is so <b>reliable</b> that when she promises to feed our cat, we never worry.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>reliable</b>?", "opts": ["unpredictable", "generous", "cheerful", "dependable"], "ci": 3, "exp": "<i>reliable</i> (adj.) able to be trusted to do what is expected. <i>Dependable</i> means the same; <i>unpredictable</i> is close to the opposite. <i>A <b>reliable</b> alarm clock wakes you up every day.</i> Family: rely (v.), reliability (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The new crosswalk had a big <b>impact</b> on safety; after it was painted, there were no more accidents at that corner.<br><br>What does <b>impact</b> mean in this sentence?", "opts": ["a sudden crash or hit", "a rule that everyone must follow", "a strong effect or influence", "a cost that must be paid"], "ci": 2, "exp": "<i>impact</i> (n.) a strong effect or influence on something. <i>Reading every night had a huge <b>impact</b> on her vocabulary.</i> Family: impact (v.), impactful (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Talking about her own nervous first day of school helped the new teacher build a strong ______ with her students.", "opts": ["relate", "related", "relatable", "relationship"], "ci": 3, "exp": "The blank needs a noun after <i>a strong</i>, so <i>relationship</i> is correct. <i>relate</i> (v.) to connect with or understand someone. <i>I can <b>relate</b> to the main character because I have a little sister too.</i> Family: relate (v.), relationship (n.), related (adj.), relatable (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The store promised to ______ customers for the broken toys by giving them their money back.", "opts": ["persuade", "compensate", "isolate", "cultivate"], "ci": 1, "exp": "<i>compensate</i> (v.) to pay or give something to make up for a loss or harm. <i>The airline <b>compensated</b> us with free meals when our flight was late.</i> Family: compensation (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Congress passed new ______ that made it illegal to dump trash into rivers.", "opts": ["innovation", "exhibition", "legislation", "observation"], "ci": 2, "exp": "<i>legislation</i> (n.) laws, or a law, made by a government. <i>The state's new <b>legislation</b> requires bike helmets for kids.</i> Family: legislate (v.), legislature (n.), legislator (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Miami has a lower <b>latitude</b> than Chicago, which is one reason its winters are so much warmer.<br><br>What does <b>latitude</b> mean in this sentence?", "opts": ["how far a place is east or west of a starting line", "how high a place is above the level of the sea", "how far a place is north or south of the equator", "how many people live in a place"], "ci": 2, "exp": "<i>latitude</i> (n.) the distance of a place north or south of the equator, measured in degrees. <i>Places near 0&deg; <b>latitude</b> are hot all year.</i> Related: longitude (east&ndash;west distance)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Families had to <b>evacuate</b> the coastal town the day before the hurricane arrived.<br><br>Which word means the <b>OPPOSITE</b> of <b>evacuate</b> as it is used in the sentence?", "opts": ["leave", "flee", "enter", "abandon"], "ci": 2, "exp": "<i>evacuate</i> (v.) to leave a dangerous place to get to safety. Its opposite here is <i>enter</i> (to go into a place). <i>Leave</i> and <i>flee</i> mean almost the same as evacuate. <i>We <b>evacuated</b> the building during the fire drill.</i> Family: evacuation (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The wolf pack guards its <b>territory</b>, chasing away wolves from other packs that wander into the valley where it hunts.<br><br>What does <b>territory</b> mean in this sentence?", "opts": ["a group of animals that live and travel together", "a trail that animals follow to find water", "an area of land that a person, group, or animal controls", "a safe den where animals sleep in winter"], "ci": 2, "exp": "<i>territory</i> (n.) an area of land that a person, group, animal, or country controls. <i>Before it became a state, Kansas was a U.S. <b>territory</b>.</i> Family: territorial (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The factory owners <b>exploited</b> the young workers, making them work fourteen hours a day for very little pay.<br><br>Which word means the <b>SAME</b> or nearly the same as <b>exploited</b> in this sentence?", "opts": ["protected", "mistreated", "trained", "hired"], "ci": 1, "exp": "<i>exploit</i> (v.) to use someone unfairly for your own gain. <i>Mistreated</i> is closest here; <i>protected</i> is the opposite. <i>Laws now stop companies from <b>exploiting</b> child workers.</i> Family: exploitation (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "In a ______, citizens vote to choose their leaders, and those leaders must follow the same laws as everyone else.", "opts": ["hierarchy", "commerce", "democracy", "diplomacy"], "ci": 2, "exp": "<i>democracy</i> (n.) a government in which the people choose their leaders by voting. <i>The United States is a <b>democracy</b>.</i> Family: democratic (adj.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Our school had an <b>epidemic</b> of forgotten lunchboxes: by Friday, more than forty were piled in the office.<br><br>Which meaning of <b>epidemic</b> is used in this sentence?", "opts": ["a disease that spreads quickly to many people in an area", "a medicine that stops an illness from spreading", "a sickness that lasts for many years", "a sudden, widespread problem that affects many people"], "ci": 3, "exp": "<i>epidemic</i> usually means <i>a disease that spreads quickly to many people</i>. Here it means <i>a sudden, widespread problem</i>, because lunchboxes are not a disease. <i>The city faced an <b>epidemic</b> of flu last winter.</i> Family: epidemiology (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Everyone in the class will <b>contribute</b> a can of food to the food drive, so the shelter will have enough for the holidays.<br><br>Which word means the <b>OPPOSITE</b> of <b>contribute</b> as it is used in the sentence?", "opts": ["withhold", "donate", "provide", "deliver"], "ci": 0, "exp": "<i>contribute</i> (v.) to give something, along with others, to help. Its opposite is <i>withhold</i> (to keep something back instead of giving it). <i>Donate</i> means almost the same as contribute. <i>Many families <b>contributed</b> books to the library sale.</i> Family: contribution (n.), contributor (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "The American ______ began in 1775, when colonists started fighting for independence from Britain.", "opts": ["expedition", "exhibition", "declaration", "revolution"], "ci": 3, "exp": "<i>revolution</i> (n.) a time when people fight to overthrow a government and set up a new one. <i>The American <b>Revolution</b> ended when Britain recognized the United States.</i> Family: revolutionary (adj.), revolt (v.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "In the 1800s, pioneer families loaded their wagons and moved west to the <b>frontier</b>, where there were few towns, roads, or stores.<br><br>What does <b>frontier</b> mean in this sentence?", "opts": ["a busy city full of new businesses", "a wide river that travelers must cross", "a farm that the government gives away", "the edge of settled land, where few people live yet"], "ci": 3, "exp": "<i>frontier</i> (n.) the far edge of a settled area, where wild land begins. <i>Life on the <b>frontier</b> was hard because the nearest doctor might be days away.</i> Family: frontiersman (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The bridge was closed for repairs; <b>therefore</b>, the school bus had to take a longer road through the hills.<br><br>What does <b>therefore</b> mean in this sentence?", "opts": ["even though that happened", "at the same time", "before that happened", "for that reason; as a result"], "ci": 3, "exp": "<i>therefore</i> (adv.) for that reason; as a result. <i>It was raining hard; <b>therefore</b>, the game was moved indoors.</i> Family: (a linking word, like <i>so</i> and <i>as a result</i>)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "At dinner, Grandpa loved to <b>recount</b> stories about growing up on a farm in Iowa.<br><br>Which meaning of <b>recount</b> is used in this sentence?", "opts": ["to count something a second time", "to tell about events in detail", "a new count of the votes after a close election", "to check a total again to find a mistake"], "ci": 1, "exp": "<i>recount</i> has more than one meaning. Here it means <i>to tell about events in detail</i>, because Grandpa is telling stories. It can also mean <i>to count again</i>, or (as a noun) <i>a second count of votes</i>. <i>She <b>recounted</b> her trip to the Grand Canyon.</i> Family: recounting (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "Farmers in the dry valley dig long ditches to <b>irrigate</b> their fields with water from the river, so the corn can grow even when it does not rain.<br><br>What does <b>irrigate</b> mean in this sentence?", "opts": ["to clear land by cutting down plants", "to measure how much rain has fallen", "to protect fields from flooding", "to bring water to land so crops can grow"], "ci": 3, "exp": "<i>irrigate</i> (v.) to supply land or crops with water, usually through pipes or ditches. <i>The farmers <b>irrigate</b> their orchards with water from a nearby lake.</i> Family: irrigation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "With plenty of sunlight and rich soil, the tomato plants began to <b>thrive</b>, growing tall and heavy with fruit.<br><br>What does <b>thrive</b> mean in this sentence?", "opts": ["to need extra water to stay alive", "to change color as the fruit ripens", "to grow strong and healthy", "to grow slowly and stay small"], "ci": 2, "exp": "<i>thrive</i> (v.) to grow, develop, or do very well. <i>Cactuses <b>thrive</b> in hot, dry deserts.</i> Family: thriving (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The smartphone was a major <b>innovation</b>: it put a phone, a camera, and a map into one small device in a way no one had done before.<br><br>What does <b>innovation</b> mean in this sentence?", "opts": ["a product that costs a lot of money", "an old tool that still works well", "a new idea, method, or invention", "a mistake that causes a new problem"], "ci": 2, "exp": "<i>innovation</i> (n.) a new idea, method, or invention. <i>The assembly line was an <b>innovation</b> that made cars cheaper to build.</i> Family: innovate (v.), innovative (adj.), innovator (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
