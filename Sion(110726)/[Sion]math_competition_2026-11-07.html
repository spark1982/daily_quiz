<style>
.q-position{font-size:0.85rem;font-weight:700;color:#185FA5;margin-bottom:8px;}
  * { box-sizing: border-box; }

  .dot.answered-wrong { background:#E24B4A; color:#fff; }
  .results-pill { display:inline-block; margin: 0 auto 14px; padding: 8px 20px; background:#1D9E75; color:#fff; border-radius:20px; font-weight:700; text-align:center; cursor:pointer; width:fit-content; }
  .results-pill-wrap { text-align:center; }

  .context-label { font-size:0.92rem; font-weight:600; color:#333; margin-bottom:8px; line-height:1.4; }
  .context-box { background:#f5f7fa; border-left:4px solid #185FA5; border-radius:8px; padding:14px 16px; margin-bottom:16px; }

  .opt-btn:hover { border-color:#185FA5; }
  .opt-btn.selected-correct { background:#e6f4ec; border-color:#1D9E75; color:#0d6b3f; font-weight:700; }
  .opt-btn.selected-wrong { background:#fbeaea; border-color:#E24B4A; color:#a52a2a; font-weight:700; }
  .opt-btn.reveal-correct { background:#e6f4ec; border-color:#1D9E75; }
  .opt-btn:disabled { cursor:default; }
  .exp-box { margin-top:14px; background:#eef7f2; border-left:4px solid #1D9E75; border-radius:8px; padding:12px 14px; font-size:0.88rem; color:#2d4d3f; line-height:1.5; display:none; }
  .hint-btn { background:#fff8e1;color:#a5720a;border:1.5px solid #f5a623;border-radius:8px;padding:7px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-top:12px;margin-bottom:12px;display:inline-block; }
  .hint-box { background:#fff8e1;border-left:3px solid #f5a623;border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:0.88rem;color:#6b5215;line-height:1.5;display:none; }
  .hint-box.show { display:block; }
  .tts-btn { background:#eef2f7; border:none; border-radius:50%; width:34px; height:34px; font-size:1rem; cursor:pointer; margin-left:8px; vertical-align:middle; }
  .nav-btns { display:flex; justify-content:space-between; margin-top:18px; gap:10px; }
  .nav-btns button { flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; background:#185FA5; color:#fff; }
  .nav-btns button:disabled { background:#c9d2dc; cursor:default; }
  .results-card h2 { text-align:center; margin-top:0; }
  .score-big { text-align:center; font-size:2.2rem; font-weight:800; color:#185FA5; margin: 6px 0 16px; }
  .action-row { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .action-row button { padding:12px; border-radius:10px; border:none; font-weight:700; font-size:0.92rem; cursor:pointer; }
  .btn-retry { background:#f5a623; color:#fff; }
  .btn-save { background:#7b61ff; color:#fff; }
  .btn-fresh { background:#E24B4A; color:#fff; }
  .fresh-btn-bottom { display:block; margin: 6px auto 0; background:none; border:1.5px solid #d7dde6; color:#888; padding:8px 16px; border-radius:20px; font-size:0.8rem; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-box { background:#fff; border-radius:14px; padding:24px; max-width:320px; text-align:center; }
  .modal-box p { font-size:0.95rem; margin-bottom:18px; }
  .modal-box button { padding:10px 16px; border-radius:8px; border:none; font-weight:700; margin:0 6px; cursor:pointer; }
  .modal-yes { background:#E24B4A; color:#fff; }
  .modal-no { background:#eef2f7; color:#333; }

  /* textbook typeface (2026-09-23): Charter-family serif, upright numerals, italic variables */
  body, button, .opt-btn, .q-text, .exp-box, .passage-box { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif; }
  .q-text { font-weight: 400; font-size: 1.12rem; }
  .opt-btn { font-size: 1.02rem; }
  .q-text i, .opt-btn i, .exp-box i { font-style: italic; }

<div class="quiz-wrap">

      <span id="nav-count">0/0</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <button class="jump-btn" id="jump-btn" onclick="toggleJump()">Jump&#9662;</button>
    </div>

  </div>

  <div class="results-pill-wrap"><span class="results-pill" id="results-pill" style="display:none;" onclick="showResultsNow()">Results</span></div>

    <div class="q-position" id="q-position"></div>

<script>
var TITLE = "[Sion] Math Competition";
var QUIZ_KEY = "sionmathcomp_10";
var INSTRUCTION = "Choose the correct answer for each problem. One problem is drawn from each of five chapters.";
var TODAY_STR = "20261107";
var RAW_QUESTIONS = [{"stem": "(MA&Theta;) Let <i>r</i>, <i>s</i>, <i>t</i> be the roots of <i>x</i><sup>3</sup> &minus; 6<i>x</i><sup>2</sup> + 5<i>x</i> &minus; 7 = 0. Find<br><br><span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>r</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>s</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span>.", "opts": ["&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>109</span><span style=\"border-top:1.4px solid #111;\">49</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span>", "&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span>", "<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>25</span><span style=\"border-top:1.4px solid #111;\">49</span></span>"], "ci": 2, "exp": "<b>What we need:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>r</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>s</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> for the roots of <i>x</i><sup>3</sup> &minus; 6<i>x</i><sup>2</sup> + 5<i>x</i> &minus; 7 = 0, without finding the roots.<br><br><b>Step 1 &mdash; Vieta&rsquo;s formulas.</b> For <i>x</i><sup>3</sup> + <i>a</i><i>x</i><sup>2</sup> + <i>b</i><i>x</i> + <i>c</i>: <i>r</i> + <i>s</i> + <i>t</i> = &minus;<i>a</i>, <i>r</i><i>s</i> + <i>r</i><i>t</i> + <i>s</i><i>t</i> = <i>b</i>, <i>r</i><i>s</i><i>t</i> = &minus;<i>c</i>. Here <i>a</i> = &minus;6, <i>b</i> = 5, <i>c</i> = &minus;7, so <i>r</i> + <i>s</i> + <i>t</i> = 6, <i>r</i><i>s</i> + <i>r</i><i>t</i> + <i>s</i><i>t</i> = 5, <i>r</i><i>s</i><i>t</i> = 7.<br><br><b>Step 2 &mdash; Use a common denominator.</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>r</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>s</i><sup>2</sup></span></span> + <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>t</i><sup>2</sup></span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(<i>s</i><i>t</i>)<sup>2</sup> + (<i>r</i><i>t</i>)<sup>2</sup> + (<i>r</i><i>s</i>)<sup>2</sup></span><span style=\"border-top:1.4px solid #111;\">(<i>r</i><i>s</i><i>t</i>)<sup>2</sup></span></span>.<br><br><b>Step 3 &mdash; Rewrite the numerator with Vieta values.</b> For any three numbers, <i>p</i><sup>2</sup> + <i>q</i><sup>2</sup> + <i>w</i><sup>2</sup> = (<i>p</i> + <i>q</i> + <i>w</i>)<sup>2</sup> &minus; 2(<i>pq</i> + <i>pw</i> + <i>qw</i>). With <i>p</i> = <i>r</i><i>s</i>, <i>q</i> = <i>r</i><i>t</i>, <i>w</i> = <i>s</i><i>t</i>: the sum of pairwise products is <i>r</i><i>s</i>&middot;<i>r</i><i>t</i> + <i>r</i><i>s</i>&middot;<i>s</i><i>t</i> + <i>r</i><i>t</i>&middot;<i>s</i><i>t</i> = <i>r</i><i>s</i><i>t</i>(<i>r</i> + <i>s</i> + <i>t</i>). So the numerator is (<i>r</i><i>s</i> + <i>r</i><i>t</i> + <i>s</i><i>t</i>)<sup>2</sup> &minus; 2<i>r</i><i>s</i><i>t</i>(<i>r</i> + <i>s</i> + <i>t</i>) = 5<sup>2</sup> &minus; 2 &middot; 7 &middot; 6 = 25 &minus; 84 = &minus;59.<br><br><b>Step 4 &mdash; Divide.</b> The denominator is (<i>r</i><i>s</i><i>t</i>)<sup>2</sup> = 7<sup>2</sup> = 49, so the sum is <b>&minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span></b>.<br><br><b>Answer check:</b> Finding the three roots numerically (one real, two complex) and adding <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\"><i>x</i><sup>2</sup></span></span> directly gives &minus;1.20408&hellip;, and 59 &divide; 49 = 1.20408&hellip;. A negative answer is possible because two of the roots are complex.<br><br><b>Trap:</b> <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>25</span><span style=\"border-top:1.4px solid #111;\">49</span></span> comes from forgetting the &minus;2<i>r</i><i>s</i><i>t</i>(<i>r</i> + <i>s</i> + <i>t</i>) term, and <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>59</span><span style=\"border-top:1.4px solid #111;\">49</span></span> (positive) comes from a sign slip in 25 &minus; 84.", "tag": "Chapter 4", "tagcolor": "#7b61ff"}, {"stem": "Initially, 9 of the 100 squares in a 10 &times; 10 grid are infected. During each unit time interval, each square which has 2 or more infected neighbors (<i>a</i> neighbor being a square which shares an edge) also becomes infected. Is it possible that all 100 squares will eventually become infected?", "opts": ["impossible", "possible"], "ci": 0, "exp": "<b>What we need:</b> whether 9 starting infected squares can ever spread to all 100 squares of a 10 &times; 10 grid, when a square becomes infected once at least 2 of its edge-neighbors are infected.<br><br><b>Step 1 &mdash; Find a quantity that cannot go up.</b> Look at the <b>perimeter</b> of the infected region: the total length of all edges that separate an infected square from a healthy square or from the outside of the board (each square has side 1).<br><br><b>Step 2 &mdash; What happens when one square gets infected.</b> A new square has 4 edges. If <i>k</i> of its neighbors are already infected, then <i>k</i> of its edges were already on the perimeter (they belonged to infected neighbors) and now become interior, so they disappear from the perimeter. Its other 4 &minus; <i>k</i> edges become new perimeter. The change is (4 &minus; <i>k</i>) &minus; <i>k</i> = 4 &minus; 2<i>k</i>. The rule says <i>k</i> &ge; 2, so the change is 4 &minus; 2<i>k</i> &le; 0. The perimeter never increases.<br><br><b>Step 3 &mdash; Squares infected at the same moment.</b> If several squares become infected in the same time step, add them one at a time. Each one already had at least 2 infected neighbors before the step, and adding other squares first can only give it more infected neighbors, so each single addition still changes the perimeter by 4 &minus; 2<i>k</i> &le; 0.<br><br><b>Step 4 &mdash; Compare start and finish.</b> At the start, 9 squares have perimeter at most 9 &times; 4 = 36 (exactly 36 only if no two share an edge). If all 100 squares were infected, the region would be the whole board, whose perimeter is 4 &times; 10 = 40. Getting from at most 36 to 40 would need the perimeter to increase, which never happens. So it is <b>impossible</b>.<br><br><b>Answer check:</b> The argument also shows why 10 squares are enough in some cases: the 10 squares on a diagonal have perimeter 40, and they really do infect the whole board (a computer simulation confirms this). With only 9 squares, 20,000 random starting sets never infected more than 81 squares.<br><br><b>Trap:</b> Trying a few starting patterns and failing does not prove anything. The perimeter (an invariant that only moves one way) is what makes the answer certain.", "tag": "Chapter 1", "tagcolor": "#185FA5"}, {"stem": "Rooster, Raven, and Cuckoo took part in a singing contest. Each judge voted for one of the three participants. Woodpecker counted 59 judges, with 15 judges voting for Rooster or Raven, 18 voting for Raven or Cuckoo, and 20 voting for Cuckoo or Rooster. Woodpecker counted poorly. However, each of the four numbers he counted above differed from reality by no more than 13. How many judges voted for Raven? (Moscow)", "opts": ["13 judges", "9 judges", "15 judges", "11 judges"], "ci": 0, "exp": "<b>What we need:</b> the true number of votes for Raven, when every number Woodpecker counted (59, 15, 18, 20) might be off by up to 13.<br><br><b>Step 1 &mdash; Name the true counts.</b> Let <i>R</i>, <i>V</i>, <i>C</i> be the true votes for Rooster, Raven, and Cuckoo. The true totals are: judges <i>R</i> + <i>V</i> + <i>C</i>; &ldquo;Rooster or Raven&rdquo; <i>R</i> + <i>V</i>; &ldquo;Raven or Cuckoo&rdquo; <i>V</i> + <i>C</i>; &ldquo;Cuckoo or Rooster&rdquo; <i>C</i> + <i>R</i>.<br><br><b>Step 2 &mdash; Turn &ldquo;off by at most 13&rdquo; into inequalities.</b><br><i>R</i> + <i>V</i> + <i>C</i> &ge; 59 &minus; 13 = 46,<br><i>R</i> + <i>V</i> &le; 15 + 13 = 28,<br><i>V</i> + <i>C</i> &le; 18 + 13 = 31,<br><i>C</i> + <i>R</i> &le; 20 + 13 = 33.<br><br><b>Step 3 &mdash; Add the three pair totals.</b> (<i>R</i> + <i>V</i>) + (<i>V</i> + <i>C</i>) + (<i>C</i> + <i>R</i>) = 2(<i>R</i> + <i>V</i> + <i>C</i>). From the upper bounds, this is at most 28 + 31 + 33 = 92. From the lower bound, it is at least 2 &times; 46 = 92. So it equals exactly 92, and every inequality must be an equality: <i>R</i> + <i>V</i> + <i>C</i> = 46, <i>R</i> + <i>V</i> = 28, <i>V</i> + <i>C</i> = 31, <i>C</i> + <i>R</i> = 33.<br><br><b>Step 4 &mdash; Solve for Raven.</b> <i>V</i> = (<i>R</i> + <i>V</i> + <i>C</i>) &minus; (<i>C</i> + <i>R</i>) = 46 &minus; 33 = <b>13 judges</b>. (Also <i>R</i> = 46 &minus; 31 = 15 and <i>C</i> = 46 &minus; 28 = 18.)<br><br><b>Answer check:</b> 15 + 13 + 18 = 46 (counted 59, off by 13); 15 + 13 = 28 (counted 15, off by 13); 13 + 18 = 31 (counted 18, off by 13); 18 + 15 = 33 (counted 20, off by 13). Every count is off by exactly 13, which is allowed. A computer search over all possible vote counts finds no other value for Raven.<br><br><b>Trap:</b> Solving the counted numbers as if they were exact gives fractions or negative votes. The key is that the error bound forces every count to be off by the maximum amount.", "tag": "Chapter 3", "tagcolor": "#f5a623"}, {"stem": "A sequence of three real numbers forms an arithmetic progression with a first term of 9. If 2 is added to the 2<sup>nd</sup> term and 20 is added to the 3<sup>rd</sup> term, the three resulting numbers form a geometric progression. What is the smallest possible value for the 3<sup>rd</sup> term of the geometric progression? (AMC 12)", "opts": ["1", "49", "9", "&minus;3"], "ci": 0, "exp": "<b>What we need:</b> the smallest possible third term of the geometric progression made from the arithmetic progression 9, 9 + <i>d</i>, 9 + 2<i>d</i>.<br><br><b>Step 1 &mdash; Write both progressions.</b> Arithmetic progression with first term 9 and common difference <i>d</i>: 9, 9 + <i>d</i>, 9 + 2<i>d</i>. Add 2 to the second term and 20 to the third: 9, 11 + <i>d</i>, 29 + 2<i>d</i>. These form a geometric progression.<br><br><b>Step 2 &mdash; Use the geometric-progression rule.</b> In a geometric progression the middle term squared equals the product of its neighbors: (11 + <i>d</i>)<sup>2</sup> = 9(29 + 2<i>d</i>).<br><br><b>Step 3 &mdash; Solve.</b> Left side: 121 + 22<i>d</i> + <i>d</i><sup>2</sup>. Right side: 261 + 18<i>d</i>. So <i>d</i><sup>2</sup> + 4<i>d</i> &minus; 140 = 0, which factors as (<i>d</i> &minus; 10)(<i>d</i> + 14) = 0. Thus <i>d</i> = 10 or <i>d</i> = &minus;14.<br><br><b>Step 4 &mdash; Find each third term.</b> <i>d</i> = 10: AP 9, 19, 29 &rarr; GP 9, 21, 49 (ratio <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>7</span><span style=\"border-top:1.4px solid #111;\">3</span></span>); third term 49. <i>d</i> = &minus;14: AP 9, &minus;5, &minus;19 &rarr; GP 9, &minus;3, 1 (ratio &minus;<span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>1</span><span style=\"border-top:1.4px solid #111;\">3</span></span>); third term 1. The smaller value is <b>1</b>.<br><br><b>Answer check:</b> 21<sup>2</sup> = 441 = 9 &times; 49 and (&minus;3)<sup>2</sup> = 9 = 9 &times; 1, so both are true geometric progressions.<br><br><b>Trap:</b> 49 is the other valid third term (not the smallest). &minus;3 is the second term of the GP, and 9 is the first term &mdash; neither is the third term.", "tag": "Chapter 5", "tagcolor": "#E24B4A"}, {"stem": "Compute <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(10<sup>4</sup>+324)(22<sup>4</sup>+324)&hellip;(58<sup>4</sup>+324)</span><span style=\"border-top:1.4px solid #111;\">(4<sup>4</sup>+324)(16<sup>4</sup>+324)&hellip;(52<sup>4</sup>+324)</span></span>. (AIME)", "opts": ["373", "372", "374", "376"], "ci": 0, "exp": "<b>What we need:</b> the value of <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>(10<sup>4</sup>+324)(22<sup>4</sup>+324)&hellip;(58<sup>4</sup>+324)</span><span style=\"border-top:1.4px solid #111;\">(4<sup>4</sup>+324)(16<sup>4</sup>+324)&hellip;(52<sup>4</sup>+324)</span></span>.<br><br><b>Step 1 &mdash; Factor <i>n</i><sup>4</sup> + 324.</b> Note 324 = 4 &middot; 81 = 4 &middot; 3<sup>4</sup>. Use the Sophie Germain identity <i>a</i><sup>4</sup> + 4<i>b</i><sup>4</sup> = (<i>a</i><sup>2</sup> &minus; 2<i>ab</i> + 2<i>b</i><sup>2</sup>)(<i>a</i><sup>2</sup> + 2<i>ab</i> + 2<i>b</i><sup>2</sup>) with <i>a</i> = <i>n</i>, <i>b</i> = 3:<br><i>n</i><sup>4</sup> + 324 = (<i>n</i><sup>2</sup> &minus; 6<i>n</i> + 18)(<i>n</i><sup>2</sup> + 6<i>n</i> + 18) = ((<i>n</i> &minus; 3)<sup>2</sup> + 9)((<i>n</i> + 3)<sup>2</sup> + 9).<br>(Check: (<i>n</i> &minus; 3)<sup>2</sup> + 9 = <i>n</i><sup>2</sup> &minus; 6<i>n</i> + 18, and the product expands back to <i>n</i><sup>4</sup> + 324.)<br><br><b>Step 2 &mdash; Write every factor as <i>m</i><sup>2</sup> + 9.</b> Numerator (<i>n</i> = 10, 22, 34, 46, 58): (7<sup>2</sup>+9)(13<sup>2</sup>+9), (19<sup>2</sup>+9)(25<sup>2</sup>+9), (31<sup>2</sup>+9)(37<sup>2</sup>+9), (43<sup>2</sup>+9)(49<sup>2</sup>+9), (55<sup>2</sup>+9)(61<sup>2</sup>+9).<br>Denominator (<i>n</i> = 4, 16, 28, 40, 52): (1<sup>2</sup>+9)(7<sup>2</sup>+9), (13<sup>2</sup>+9)(19<sup>2</sup>+9), (25<sup>2</sup>+9)(31<sup>2</sup>+9), (37<sup>2</sup>+9)(43<sup>2</sup>+9), (49<sup>2</sup>+9)(55<sup>2</sup>+9).<br><br><b>Step 3 &mdash; Cancel (telescoping).</b> The numerator uses <i>m</i> = 7, 13, 19, &hellip;, 55, 61 and the denominator uses <i>m</i> = 1, 7, 13, &hellip;, 49, 55. Everything from 7 to 55 appears once on top and once on the bottom and cancels. What is left is <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>61<sup>2</sup> + 9</span><span style=\"border-top:1.4px solid #111;\">1<sup>2</sup> + 9</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3721 + 9</span><span style=\"border-top:1.4px solid #111;\">1 + 9</span></span> = <span style=\"display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;line-height:1.05;margin:0 2px;\"><span>3730</span><span style=\"border-top:1.4px solid #111;\">10</span></span> = <b>373</b>.<br><br><b>Answer check:</b> Multiplying out all ten original factors exactly (with a computer) and dividing gives exactly 373.<br><br><b>Trap:</b> 374 or 372 come from an off-by-one slip in the leftover factor (for example, using 61<sup>2</sup> + 9 = 3731 or forgetting the 9 in 1<sup>2</sup> + 9).", "tag": "Chapter 2", "tagcolor": "#1D9E75"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
