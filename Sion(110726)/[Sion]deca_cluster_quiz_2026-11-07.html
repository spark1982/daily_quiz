<script>
var TITLE = "[Sion] Deca Cluster Quiz";
var QUIZ_KEY = "siondecacluster_20";
var INSTRUCTION = "Choose the best answer for each question.";
var TODAY_STR = "20261107";
var RAW_QUESTIONS = [{"stem": "Maya manages the front desk at Oak Ridge Insurance. Her boss tells her she may sign routine supply orders up to $500 for the office. A supplier later asks whether the office is bound by an order Maya signed. Which legal relationship gives Maya the power to bind the business?", "opts": ["A partnership, because any employee who signs orders becomes a co-owner", "An agency relationship, because the owner authorized her to act on the business's behalf", "A franchise, because she is using the company's name and brand", "A bailment, because the supplier temporarily holds the company's property"], "ci": 1, "exp": "In an agency relationship, a principal (the business) authorizes an agent (Maya) to act for it. Contracts the agent signs within her authority bind the principal. Signing orders does not make her a partner, and bailment and franchising are unrelated arrangements."}, {"stem": "Which of the following would be counted in the United States' gross domestic product (GDP) for this year?", "opts": ["A used car bought from a neighbor this year", "Unpaid work a parent does caring for a child at home", "A new house built and sold in Ohio this year", "Shares of stock purchased on the stock exchange"], "ci": 2, "exp": "GDP counts the market value of final goods and services newly produced within the country during the year. Used goods were counted when first produced, stock purchases are transfers of ownership, and unpaid household work is not a market transaction."}, {"stem": "A small accounting firm has revenue of $250,000 and a cost of services of $150,000. What is its gross profit margin?", "opts": ["67%", "60%", "25%", "40%"], "ci": 3, "exp": "Gross profit = $250,000 − $150,000 = $100,000. Gross profit margin = $100,000 ÷ $250,000 = 40%. The 60% figure is the cost share, and 67% divides profit by cost instead of by revenue."}, {"stem": "A bank keeps all customer files on one server in its main office. Which practice best protects the data if the office floods?", "opts": ["Installing antivirus software on every employee computer", "Requiring stronger passwords that change every 60 days", "Saving every file twice on the same office server", "Keeping regular backups stored at a separate, off-site location or in the cloud"], "ci": 3, "exp": "Off-site or cloud backups survive a disaster that destroys the main location. Antivirus software and strong passwords protect against attacks, not floods, and two copies on the same server are lost together."}, {"stem": "Which of the following is an example of strategic planning rather than tactical or operational planning?", "opts": ["Choosing the radio stations for next month's savings promotion", "Setting this week's teller work schedule at the main branch", "Deciding to expand the credit union into two new states over the next five years", "Deciding how many deposit slips to order for the lobby"], "ci": 2, "exp": "Strategic planning sets long-term direction for the whole organization, usually three to five years out. Weekly schedules and supply orders are operational, and choosing a month's advertising outlets is tactical."}, {"stem": "Harbor State Bank wants to know which of its checking customers are likely to also want an auto loan this year. Which tool is designed mainly for tracking customer interactions and using that history to build relationships?", "opts": ["A general ledger accounting system", "A payroll processing system", "A customer relationship management (CRM) system", "An inventory management system"], "ci": 2, "exp": "A CRM system stores each customer's contacts, purchases, and service history so the business can personalize offers and follow-ups. Ledgers record financial transactions, inventory systems track goods, and payroll systems pay employees."}, {"stem": "Devon works in a loan office and is asked to review a loan application from his cousin's company. What is the most ethical action?", "opts": ["Review it carefully but make sure to be extra fair to his cousin", "Review it but avoid mentioning the relationship to keep things simple", "Tell his supervisor about the relationship and ask that someone else review the application", "Approve it quickly, since he already knows the family is trustworthy"], "ci": 2, "exp": "This is a conflict of interest. The ethical step is to disclose it and step away so the decision is impartial. Promising to be fair, approving based on family trust, or hiding the relationship all leave the conflict in place."}, {"stem": "Lena plans a budgeting app for college students. Which evidence would best show that a real market opportunity exists?", "opts": ["Lena and her friends all agree that the app is a great idea", "Budgeting apps for adults already exist in the app stores", "Lena has strong coding skills and can build the app quickly", "Two hundred students signed up for a waiting list and 40 paid a deposit"], "ci": 3, "exp": "A real opportunity is shown when target customers act on their interest, such as joining a waiting list or paying a deposit. Friends' opinions are biased, existing adult apps do not prove student demand, and the founder's skills show ability, not demand."}, {"stem": "Which statement best describes the marketing concept?", "opts": ["A business should rely mainly on aggressive selling to persuade reluctant buyers", "A business should identify and satisfy customer needs while still earning a profit", "A business should make as many products as possible and sell them at the lowest price", "A business should focus on product features that its engineers find most interesting"], "ci": 1, "exp": "The marketing concept puts customer needs at the center of all business decisions, with profit as the result. Mass production at low cost, hard selling, and engineering-driven features are older production, selling, and product orientations."}, {"stem": "Jordan feels annoyed when a coworker keeps taking credit for shared work. Which response is assertive rather than passive or aggressive?", "opts": ["Leaving the coworker off the next project without explaining the reason", "Telling the coworker privately, \"I'd like both our names on the report since we wrote it together.\"", "Saying nothing and doing more of the work alone next time to avoid trouble", "Telling the whole team at the meeting that the coworker steals other people's ideas"], "ci": 1, "exp": "Assertive communication states your needs clearly and respectfully, usually directly with the person involved. Staying silent is passive; public accusation is aggressive; quietly excluding someone is passive-aggressive."}, {"stem": "A regional bank installs smart ATMs and video-teller machines, and many tellers lose their jobs. Their skills no longer match the jobs that are open in the area. What type of unemployment is this?", "opts": ["Frictional unemployment", "Structural unemployment", "Cyclical unemployment", "Seasonal unemployment"], "ci": 1, "exp": "Structural unemployment happens when changes in technology or the economy create a mismatch between workers' skills and available jobs. Frictional is a short gap between jobs, cyclical comes from recessions, and seasonal follows the time of year."}, {"stem": "[Role-play skill] At the end of a role-play about a branch reorganization, the judge asks: \"What would you do if your manager rejected your plan in front of the team?\" Which answer would most impress the judge?", "opts": ["\"I'd ask my coworkers to support the plan so she sees that the team disagrees with her.\"", "\"I'd explain right there that she had misunderstood, so the team knows the plan was actually good.\"", "\"I'd accept it and not bring it up again, because the manager is always right about these things.\"", "\"I'd stay calm, thank her for the feedback, and ask to meet afterward to learn her concerns, then revise the plan using what she says.\""], "ci": 3, "exp": "Emotional intelligence includes self-control and handling criticism constructively: staying calm, seeking to understand, and improving. Arguing in public, giving up completely, or building pressure against the manager show weaker self-management and teamwork."}, {"stem": "Summit Credit Union has high employee turnover. HR wants to find out why employees are leaving. Which practice gives the most direct information?", "opts": ["Shortening the probation period for new employees", "Posting more job openings on online job boards", "Conducting exit interviews with employees who resign", "Raising the starting wage for all new hires right away"], "ci": 2, "exp": "Exit interviews ask departing employees why they are leaving, which identifies causes of turnover. Raising wages or shortening probation are possible solutions, and posting more jobs only replaces workers; none of them collects the reasons first."}, {"stem": "[Role-play skill] A judge's performance indicator is \"Interpret business policies to customers/clients.\" A customer asks a bank teller to cash a $2,000 check from another bank immediately, but policy places a two-day hold on large outside checks. Which statement would best address the indicator?", "opts": ["\"That's just how the bank works, so you will need to come back in two days to get your money.\"", "\"I'll make an exception this one time because you have been a loyal customer for many years.\"", "\"For checks over $1,000 from other banks we hold the funds two days to confirm they clear; I can release $225 today and show you how to track the rest.\"", "\"Policy is the set of rules a business follows, and our rules say I cannot do that for you today.\""], "ci": 2, "exp": "Interpreting a policy means explaining what it is, why it exists (protecting customers and the bank from bad checks), and what the customer can still do. Quoting the definition, breaking policy, or giving a curt refusal does not interpret it."}, {"stem": "A bank officer needs a list of every customer whose certificate of deposit matures next month. Which tool is best suited for this task?", "opts": ["A word-processing document of customer notes", "A query on the bank's customer database", "A presentation slide showing deposit totals", "An email sent to every customer asking them"], "ci": 1, "exp": "A database query filters stored records by a condition (maturity date next month) and returns exactly the matching customers. Word documents and slides are not built to search records, and asking customers is slow and unreliable."}, {"stem": "Which part of a business plan gives a short overview of the whole plan and is usually read first by lenders and investors?", "opts": ["The financial statements", "The executive summary", "The appendix of supporting documents", "The marketing plan"], "ci": 1, "exp": "The executive summary briefly describes the business, its opportunity, its strategy, and the financing request. It is often written last but placed first because readers use it to decide whether to read the rest."}, {"stem": "Valley Print Shop switches to just-in-time (JIT) inventory, ordering paper only when jobs come in. What is the main risk of this approach?", "opts": ["Storage costs will rise because more paper must be kept in the warehouse", "The shop will have to buy paper in much larger quantities", "A supplier delay could stop production because little backup stock is on hand", "Paper on hand will become outdated because it sits too long"], "ci": 2, "exp": "JIT keeps inventory very low to cut storage costs, so the business depends on on-time deliveries; a delay can halt work. Higher storage costs, bulk buying, and old stock are problems of holding too much inventory, the opposite of JIT."}, {"stem": "Ridgeway Tax Prep has fixed costs of $12,000 per season. Each return is sold for $40, and the variable cost per return is $25. How many returns must the business complete to break even?", "opts": ["480 returns", "300 returns", "800 returns", "1,200 returns"], "ci": 2, "exp": "Break-even units = fixed costs ÷ (price − variable cost) = $12,000 ÷ ($40 − $25) = $12,000 ÷ $15 = 800 returns. Dividing by the $40 price (300) or the $25 cost (480) skips the contribution margin."}, {"stem": "[Role-play skill] A judge's performance indicator is \"Defend ideas objectively.\" You are a credit-union analyst proposing a new mobile check-deposit limit, and the judge (branch manager) says the limit seems too risky. Which response best addresses the performance indicator?", "opts": ["\"I understand the concern. Our fraud data shows losses under 0.1% at similar limits, so I'd start with a 90-day pilot and review the numbers.\"", "\"Objectivity means using facts instead of feelings, so I think my idea is correct and the limit should stay.\"", "\"Many other credit unions already do this, so we should do it too, and members will be happy.\"", "\"If you think it is too risky, I can just drop the idea so that we avoid any conflict.\""], "ci": 0, "exp": "Defending an idea objectively means acknowledging the concern and supporting your position with evidence, not emotion, then offering a reasonable way to test it. Defining the term without applying it, appealing to what others do, or abandoning the idea do not show the skill."}, {"stem": "[Role-play skill] In a role-play as a bank branch supervisor, the judge asks: \"How will you handle your top-performing teller who keeps arriving 15 minutes late?\" Which answer is best?", "opts": ["\"Because she is our best performer, I would let the lateness go so we don't risk losing her.\"", "\"I'd write her up immediately, since the policy is the same for everyone and there's nothing to discuss.\"", "\"I'd meet with her privately, share the specific dates, explain how it affects coverage, ask what's causing it, and agree on a plan with a follow-up date.\"", "\"I'd send a message to all tellers reminding everyone that being on time is required.\""], "ci": 2, "exp": "A strong answer addresses the issue directly and privately with specific facts, listens for causes, and sets clear expectations with follow-up. Ignoring it is unfair, a group message avoids the person, and jumping to discipline skips understanding."}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
