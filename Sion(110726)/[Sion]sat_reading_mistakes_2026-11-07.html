<script>
var TITLE = "[Sion] SAT reading mistakes";
var QUIZ_KEY = "sionreviewwrong33_5";
var INSTRUCTION = "Review these questions you missed before.";
var TODAY_STR = "20261107";
var RAW_QUESTIONS = [{"stem": "Which choice best states the function of the underlined sentence (\"When a basketball player connects on a free throw, his or her brain is using a motor memory to complete the task.\") in the text as a whole?", "opts": ["It begins with an analogy meant to explain the process that creates motor memories.", "It shows an example that contradicts the results on the function of the brain.", "It details a metaphor that explains how the brain can behave subconsciously in a beneficial manner.", "It illustrates a better understanding of the complicated findings on motor memory."], "ci": 0, "exp": "The opening sentence introduces a familiar, concrete example (a free throw) before explaining the underlying research on motor memory, functioning as an accessible illustration meant to explain the process discussed in the rest of the passage.", "tag": "Text Structure and Purpose", "tagcolor": "#0d9488", "passage": "When a basketball player connects on a free throw, his or her brain is using a motor memory to complete the task. UC San Francisco researchers have found that these types of memories are synchronized during sleep. The brain can take experiences created during the day and subconsciously sort through them at night to determine which choices created the desired results, locking on to them as the best action."}, {"stem": "Based on the texts, how would the author of Text 2 most likely respond to the claim in Text 1: that encountering extraterrestrial life is now a testable hypothesis?", "opts": ["It is farfetched, as there is no method of exploring places where life might exist.", "It is fallacious, as the only planet with a detectable biosphere is Earth.", "It is plausible, as many planets could contain life in subsurface regions.", "It is inconceivable, as there is no evidence that extraterrestrial life exists."], "ci": 0, "exp": "Text 2 emphasizes that we cannot send probes to sample distant systems directly and might not detect biospheres even if life exists, reflecting deep skepticism about our current ability to actually test/confirm the hypothesis, closest to choice A's framing of it as farfetched given the lack of a reliable method.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: Astronomers from the University of California-Berkeley worked out there could be as many as 40 billion Earth-sized exoplanets in the so-called \"habitable zone\" around their star, where temperatures are mild enough for liquid water to exist on the surface. There's even a potentially Earth-like world orbiting our nearest neighboring star, Proxima Centauri. At just four light years away, that system might be close enough for us to reach using current technology. The ancient question, \"Are we alone?\" has graduated from being a philosophical musing to a testable hypothesis. We should be prepared for an answer.<br><br>Text 2: Our observations suggest increasingly that earth-size planets orbiting within the habitable zone may be common in the galaxy. But are any of them inhabited? With no ability to send probes there to sample, we will have to derive the answer from the light and other radiation that come to us from these faraway systems. We also might not be able to detect biospheres even if they exist. Life has flourished on Earth for perhaps 3.5 billion years, but the atmospheric \"biosignatures\" that, today, would supply good evidence of life to distant astronomers have not been present for all of that time."}, {"stem": "Based on the texts, how would the author of Text 1 most likely respond to the claim in Text 2 that Tesla produced ball lightning?", "opts": ["By doubting the accuracy of the report", "By claiming that such results are irreplicable", "By conceding that the argument in Text 1 is flawed", "By agreeing that such a demonstration is possible"], "ci": 0, "exp": "Text 1 stresses that no controlled experiment can capture all the relevant variables of true ball lightning, so its author would likely doubt whether Tesla's lab-produced balls are accurately the same natural phenomenon, matching choice A.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: Ball lightning is a rare atmospheric effect that has been reported multiple times over the centuries, but which has not been scientifically explained. Part of the problem is that the event is unpredictable, so it is impossible to set up a controlled experiment that incorporates all of the relevant variables. Eyewitness accounts vary, but describe balls of light associated with lightning storms that travel in unpredictable trajectories for several seconds before exploding or vanishing, often amid the odor of sulfur.<br><br>Text 2: The Serbian-American inventor Nikola Tesla, apparently out of curiosity, decided to recreate the effect known as ball lightning. He managed to produce balls of light with the same appearance as ball lightning multiple times in laboratory settings, but it is unclear whether such balls actually form in the same fashion as the actual phenomenon does."}, {"stem": "Based on the texts, if the author of Text 1 and the author of Text 2 were aware of each other's findings, they would most likely agree with which statement?", "opts": ["Efforts to destroy parasitic infections must be increased.", "The frequency of parasitic infections is increasing.", "Endemic countries are at risk of intestinal parasites.", "Protozoan parasites can frequently cause gastrointestinal infections, resulting in diarrhea."], "ci": 3, "exp": "Text 1 states protozoan parasites commonly cause gastrointestinal infections, and Text 2 specifies that a common protozoan parasite (G. intestinalis) is the most prevalent cause of diarrhea; combined, both authors would agree that protozoan parasites frequently cause gastrointestinal infections resulting in diarrhea.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: Based on a study conducted by Dr Heath Grayson and his team, parasitic infections, caused by intestinal helminths and protozoan parasites, are among the most prevalent infections in humans in developing countries. In developed countries, protozoan parasites more commonly cause gastrointestinal infections compared to helminths. Intestinal parasites cause significant morbidity and mortality in endemic countries.<br><br>Text 2: Studies have shown that the most common protozoan parasites are G. intestinalis, Entamoeba histolytica, and Cryptosporidium spp. G. intestinalis is the most prevalent parasitic cause of gastrointestinal diseases like diarrhea in the developed world, and this infection is also very common in developing countries."}, {"stem": "What would the author of Text 2 most likely respond to the author of Text 1?", "opts": ["With understanding because Wegener's theory was correct", "With disagreement because scientists did not accept Wegener's theory of continental drift", "With hesitance because alternate theories disproved Wegener's theory", "With appreciation because Wegener was one of the earliest geologists"], "ci": 3, "exp": "Text 2 corrects only Wegener's specific proposed mechanism (earth's rotation) while affirming the underlying concept that continents move, consistent with viewing Wegener favorably as an early pioneer of the idea, matching choice D, rather than claiming his whole theory was disproved.", "tag": "Cross-Text Connections", "tagcolor": "#d6336c", "passage": "Text 1: \"Continental drift\" describes one of the earliest ways geologists thought continents moved over time. Today, the theory of continental drift has been replaced by the science of plate tectonics. The theory of continental drift is most associated with the scientist Alfred Wegener. In the early 20th century, Wegener published a paper explaining his theory that the continental landmasses were \"drifting\" across the earth, sometimes plowing through oceans and into each other. He called this movement continental drift.<br><br>Text 2: One of the elements lacking in the theory of continental drift was the mechanism for how it works -- why did the continents drift and what patterns did they follow? Wegener suggested that perhaps the rotation of the earth caused the continents to shift towards and apart from each other. (It doesn't.) Today, we know that the continents rest on massive slabs of rock called tectonic plates. The plates are always moving and interacting in a process called \"plate tectonics.\""}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ if(window.SAT_TIMEUP && SAT_TIMEUP() && !(activeSet && activeSet.length)){ wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, "(time's up)")); } else skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(origNum(qi)); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }
function origNum(qi){ var i = order.indexOf(qi); return i >= 0 ? i + 1 : 0; } /* keep-orig-num 2026-11-11 */

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + origNum(ord[state.cur]) + ' / ' + order.length + ((activeSet && activeSet.length) ? '  (retry ' + (state.cur + 1) + ' of ' + ord.length + ')' : '');

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = origNum(qi);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return (state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci) || (state.answers[qi]===undefined && window.SAT_TIMEUP && SAT_TIMEUP()); });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;


function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
<script>
/* sat-timer 2026-11-06 */
(function(){
  var PER_Q = 60;
  var LIMIT = PER_Q * RAW_QUESTIONS.length;
  var TK = STORAGE_KEY + '_timer';
  function blank(){ return {el:0, per:{}, up:false}; }
  function load(){ try{ return JSON.parse(localStorage.getItem(TK)) || blank(); }catch(e){ return blank(); } }
  var T = load(), paused = false, last = Date.now();
  function save(){ try{ localStorage.setItem(TK, JSON.stringify(T)); }catch(e){} }
  function retrying(){ return !!(activeSet && activeSet.length); }
  window.SAT_TIMEUP = function(){ return !!T.up; };
  var bar = document.createElement('div'); bar.className = 'sat-timer'; bar.id = 'sat-timer';
  bar.innerHTML = '<span id="sat-total"></span><span id="sat-q"></span><button id="sat-pause" onclick="satPause()">Pause</button>';
  var nav = document.querySelector('.nav-bar'); nav.parentNode.insertBefore(bar, nav);
  var pbox = document.createElement('div'); pbox.className = 'sat-pausebox'; pbox.id = 'sat-pausebox';
  pbox.innerHTML = 'Paused<br><br><button onclick="satPause()" style="background:#185FA5;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;">Resume</button>';
  var card = document.getElementById('quiz-card'); card.parentNode.insertBefore(pbox, card);
  function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  function curAnswered(){ if(window.EXAM_ACTIVE && EXAM_ACTIVE()) return false; var q = activeOrder()[state.cur]; return q !== undefined && state.answers[q] !== undefined; } /* sat-timer-pause-on-answer 2026-11-14 */
  function running(){ return !T.up && !state.showResults && !retrying() && !paused && !curAnswered() && document.visibilityState !== 'hidden'; }
  function draw(){
    var show = !retrying() && !state.showResults;
    bar.style.display = show ? 'flex' : 'none';
    var left = LIMIT - T.el;
    var tot = document.getElementById('sat-total');
    tot.textContent = 'Time left ' + fmt(left) + ((!T.up && curAnswered()) ? ' \u00b7 paused (read the explanation)' : ''); tot.className = left < 60 ? 'over' : '';
    var qi = activeOrder()[state.cur], used = T.per[qi] || 0;
    var qs = document.getElementById('sat-q');
    qs.textContent = 'This question ' + fmt(used) + ' / ' + fmt(PER_Q); qs.className = used > PER_Q ? 'over' : '';
    document.getElementById('sat-pause').textContent = paused ? 'Resume' : 'Pause';
    pbox.style.display = (paused && show) ? 'block' : 'none';
    if(paused && show) card.style.display = 'none';
    var det = document.getElementById('score-detail');
    if(T.up && state.showResults && !retrying() && det && det.textContent.indexOf("Time's up") < 0) det.textContent = "Time's up! Unanswered questions count as wrong. " + det.textContent;
  }
  function timeUp(){
    T.up = true; T.el = LIMIT; save(); paused = false;
    if(!state.showResults) showResultsNow();
    draw();
  }
  function tick(){
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    if(dt > 5 || dt < 0) dt = 0;
    if(running()){
      T.el += dt;
      var qi = activeOrder()[state.cur];
      if(state.answers[qi] === undefined) T.per[qi] = (T.per[qi] || 0) + dt;
      save();
      if(T.el >= LIMIT){ timeUp(); return; }
    }
    draw();
  }
  window.satPause = function(){ paused = !paused; last = Date.now(); if(!paused) render(); draw(); };
  var _pick = window.pick;
  window.pick = function(i){ if(T.up && !retrying()) return; if(paused) return; return _pick(i); };
  var _fresh = window.confirmFresh;
  window.confirmFresh = function(){ T = blank(); save(); paused = false; last = Date.now(); var r = _fresh.apply(this, arguments); draw(); return r; };
  var _render = window.render;
  if(typeof _render === 'function'){ window.render = function(){ var r = _render.apply(this, arguments); try{ draw(); }catch(e){} return r; }; }
  document.addEventListener('visibilitychange', function(){ last = Date.now(); });
  if(!T.up && T.el >= LIMIT && !state.showResults) timeUp();
  window.__satTimer = { tick: tick, get T(){ return T; }, LIMIT: LIMIT };
  setInterval(tick, 500);
  draw();
})();
</script>
