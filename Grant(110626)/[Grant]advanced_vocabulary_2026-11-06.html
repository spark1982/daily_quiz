<script>
var TITLE = "[Grant] Advanced Vocabulary";
var QUIZ_KEY = "grantvocab_20";
var INSTRUCTION = "Choose the best answer. Read the sentence carefully — the words around the bold word are clues.";
var TODAY_STR = "20261106";
var RAW_QUESTIONS = [{"stem": "After the votes were counted again, the losing candidate decided to <b>concede</b> the election and congratulate the winner. Which word means the <b>SAME</b> or nearly the same as <i>concede</i>?", "opts": ["deny", "demand", "admit", "delay"], "ci": 2, "exp": "<i>concede</i> (v.) to admit that something is true, often that you have lost. <i>Max had to <b>concede</b> that his sister won the race fairly.</i> \"Deny\" is the opposite: saying something is not true. Family: concession (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Grandpa's old radio made a <b>peculiar</b> buzzing sound that none of us had ever heard before, so we unplugged it right away. What does <b>peculiar</b> mean in this sentence?", "opts": ["very loud", "calm and pleasant", "strange or unusual", "old and broken"], "ci": 2, "exp": "<i>peculiar</i> (adj.) strange or unusual; different from what you expect. <i>The soup had a <b>peculiar</b> taste, so I checked the date on the can.</i> The clue is \"none of us had ever heard before.\" Family: peculiarity (n.), peculiarly (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The bakery became so popular that the owners decided to <b>expand</b> into the empty shop next door. What does <b>expand</b> mean in this sentence?", "opts": ["close for a while", "move to another town", "grow larger", "sell the business"], "ci": 2, "exp": "<i>expand</i> (v.) to become bigger or to make something bigger. <i>A balloon <b>expands</b> when you blow air into it.</i> Taking over the shop next door makes the bakery bigger. Family: expansion (n.), expandable (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "Read the sentence: \"Learning to play the violin well takes years of <b>discipline</b>.\" What does <i>discipline</i> mean in this sentence?", "opts": ["training that teaches soldiers to obey orders", "a subject or field of study, such as science", "control over yourself to keep working at something", "punishment for breaking a rule"], "ci": 2, "exp": "<i>discipline</i> has several meanings. Here it means self-control that keeps you practicing even when it is hard. <i>It takes <b>discipline</b> to practice every single day.</i> It can also mean punishment, a field of study, or strict training. Family: disciplined (adj.), self-discipline (n.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "The dark clouds and sudden wind <b>indicate</b> that a storm is coming, so the coach ended practice early. What does <b>indicate</b> mean in this sentence?", "opts": ["stop from happening", "show or point to", "cause to happen", "keep secret"], "ci": 1, "exp": "<i>indicate</i> (v.) to show or be a sign of something. <i>A green light <b>indicates</b> that you may go.</i> The clouds do not cause the storm; they are a sign that it is coming. Family: indication (n.), indicator (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The <b>hostile</b> dog growled and showed its teeth at every visitor. Which word means the <b>OPPOSITE</b> of <i>hostile</i>?", "opts": ["fierce", "friendly", "nervous", "unfriendly"], "ci": 1, "exp": "<i>hostile</i> (adj.) unfriendly and ready to fight or attack. <i>The two teams were <b>hostile</b> after the argument.</i> The opposite is <i>friendly</i>. \"Unfriendly\" and \"fierce\" are close to the <i>same</i> meaning. Family: hostility (n.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "I could not find my library book, so I checked the shelf where I had left it the ______ night. Which word best completes the sentence?", "opts": ["permanent", "frequent", "previous", "rural"], "ci": 2, "exp": "<i>previous</i> (adj.) coming just before, in time or order. <i>I finished my homework on the <b>previous</b> page.</i> The night before is the previous night. Family: previously (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The new library was a <b>significant</b> improvement for our town; twice as many people visit it now. Which word means the <b>SAME</b> or nearly the same as <i>significant</i>?", "opts": ["recent", "important", "minor", "expensive"], "ci": 1, "exp": "<i>significant</i> (adj.) large or important enough to matter. <i>There was a <b>significant</b> drop in the temperature overnight.</i> \"Minor\" is the opposite (small and not important). Family: significance (n.), significantly (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Read the sentence: \"The new stadium has a <b>capacity</b> of 40,000 fans.\" What does <i>capacity</i> mean in this sentence?", "opts": ["a state of being completely full", "a job or role someone has", "a person's ability to learn or do something", "the largest amount something can hold"], "ci": 3, "exp": "<i>capacity</i> has several meanings. Here it means the most that something can hold: the stadium holds up to 40,000 people. <i>The bottle has a <b>capacity</b> of one liter.</i> It can also mean a person's ability (\"a capacity to learn\") or a role (\"in her capacity as coach\"). Family: capable (adj.)", "tag": "Multiple Meanings", "tagcolor": "#7b61ff"}, {"stem": "After a month of lessons, Jada became a ______ swimmer who could swim two laps without stopping. Which word best completes the sentence?", "opts": ["hostile", "reluctant", "competent", "fragile"], "ci": 2, "exp": "<i>competent</i> (adj.) able to do something well enough. <i>A <b>competent</b> cook can follow any recipe.</i> Being able to swim two laps shows skill. Family: competence (n.), competently (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "The <b>frigid</b> wind made our cheeks sting as we waited for the bus. Which word means the <b>OPPOSITE</b> of <i>frigid</i>?", "opts": ["icy", "damp", "freezing", "sweltering"], "ci": 3, "exp": "<i>frigid</i> (adj.) extremely cold. <i>We wore three layers on the <b>frigid</b> morning.</i> The opposite is <i>sweltering</i> (very hot). \"Icy\" and \"freezing\" mean almost the <i>same</i> as frigid. Family: frigidly (adv.)", "tag": "Antonym / Synonym", "tagcolor": "#E24B4A"}, {"stem": "Owls can <b>perceive</b> the tiny rustle of a mouse moving under the snow, even in total darkness. What does <b>perceive</b> mean in this sentence?", "opts": ["catch and eat", "frighten away", "notice or become aware of", "pay no attention to"], "ci": 2, "exp": "<i>perceive</i> (v.) to notice something by seeing, hearing, or feeling it. <i>Dogs can <b>perceive</b> sounds that people cannot hear.</i> The owl notices the sound first; catching the mouse would come later. Family: perception (n.), perceptive (adj.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The <b>approximate</b> length of the trail is three miles, but the park ranger said it might be a little longer. What does <b>approximate</b> mean in this sentence?", "opts": ["printed on an official sign", "close to correct but not exact", "measured exactly", "much too long"], "ci": 1, "exp": "<i>approximate</i> (adj.) almost correct, but not exact. <i>The <b>approximate</b> time of the trip is two hours.</i> The clue is \"it might be a little longer,\" so three miles is not exact. Family: approximately (adv.), approximation (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "We need a ______ backpack that will not rip, even when it is stuffed with heavy books. Which word best completes the sentence?", "opts": ["humid", "fragile", "feeble", "durable"], "ci": 3, "exp": "<i>durable</i> (adj.) strong and able to last a long time. <i>These <b>durable</b> boots lasted three winters.</i> A backpack that \"will not rip\" is durable; fragile means it breaks easily. Family: durability (n.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Running the mile in under eight minutes is the only ______ for joining the track team. Which form of the word fits the sentence?", "opts": ["qualifying", "qualified", "qualification", "qualify"], "ci": 2, "exp": "<i>qualify</i> (v.) to meet the rules or skills needed for something. After \"the only,\" the sentence needs a noun, so use <i>qualification</i> (n.), a skill or rule you must meet. <i>A lifeguard needs a swimming <b>qualification</b>.</i> Family: qualify (v.), qualified (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "Winning the state championship was the team's ______ goal, the one they had worked toward all season. Which word best completes the sentence?", "opts": ["gradual", "ultimate", "preliminary", "vertical"], "ci": 1, "exp": "<i>ultimate</i> (adj.) final and most important. <i>Our <b>ultimate</b> goal is to finish the whole puzzle.</i> The goal they worked toward \"all season\" is the final, biggest one. Preliminary means coming first, before the main part. Family: ultimately (adv.)", "tag": "Fill in the Blank", "tagcolor": "#1D9E75"}, {"stem": "Mrs. Lee was <b>generous</b> with her time, staying after school every day to help anyone who needed it. What does <b>generous</b> mean in this sentence?", "opts": ["always in a hurry", "willing to give more than is expected", "strict about following rules", "proud of what she can do"], "ci": 1, "exp": "<i>generous</i> (adj.) happy to give money, time, or help to others. <i>My <b>generous</b> neighbor shared her whole basket of apples.</i> Staying every day to help others shows she gives a lot. Family: generosity (n.), generously (adv.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The settlers faced every <b>hardship</b> of prairie life: freezing winters, failed crops, and months without seeing a neighbor. What does <b>hardship</b> mean in this sentence?", "opts": ["a reward for working very hard", "a difficult situation that causes suffering", "a rule that everyone has to follow", "a long trip to a new place"], "ci": 1, "exp": "<i>hardship</i> (n.) something that makes life hard and causes suffering. <i>Losing their crops to the drought was a terrible <b>hardship</b> for the family.</i> The word has <i>hard</i> in it, but it is not a reward for hard work. Family: hard (adj.), hardships (n., plural)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}, {"stem": "The ______ of the first public library in our town happened in 1890. Which form of the word fits the sentence?", "opts": ["establishment", "established", "establishing", "establish"], "ci": 0, "exp": "<i>establish</i> (v.) to start or create something that will last. After \"The ... of,\" the sentence needs a noun, so use <i>establishment</i> (n.). <i>The <b>establishment</b> of the park took five years.</i> Family: establish (v.), established (adj.)", "tag": "Word Family", "tagcolor": "#f5a623"}, {"stem": "The long climb up the mountain began to <b>exhaust</b> the hikers, and they stopped to rest every few minutes. What does <b>exhaust</b> mean in this sentence?", "opts": ["make angry", "make lost", "make very tired", "make very excited"], "ci": 2, "exp": "<i>exhaust</i> (v.) to make someone very tired. <i>Running laps in the heat will <b>exhaust</b> you.</i> The hikers need to rest often, which shows they are worn out. Family: exhausted (adj.), exhaustion (n.)", "tag": "Meaning in Context", "tagcolor": "#185FA5"}];
var STORAGE_KEY = 'quiz_' + QUIZ_KEY + '_' + TODAY_STR;
var ORDER_KEY = STORAGE_KEY + '_order';
var ACTIVE_KEY = STORAGE_KEY + '_active';
var REPORT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzRYITi7Q4ttOMcqHPBQ_mfc1m-Oyk_ne-7OKeRGbR_WFEUAe9oCKiC9E7f3ymZWR6i/exec';
function wrongTxt(s){ s = (s===undefined || s===null) ? '' : String(s); return /^\s*</.test(s) ? s : '<span>' + s + '</span>'; }
function wrongDetail(qi, yourAnswer){
  var q = RAW_QUESTIONS[qi];
  var qtext = (q.passage ? q.passage + '<br><br>' : '') + (q.contextLabel ? q.contextLabel + '<br>' : '') + (q.context ? q.context + '<br>' : '') + q.stem;
  return { question: wrongTxt(qtext), yourAnswer: wrongTxt(yourAnswer), correctAnswer: wrongTxt(q.opts[q.ci]), explanation: wrongTxt(q.exp) };
}
function quizDateStr(){ return (typeof TODAY_STR !== 'undefined') ? TODAY_STR : ((String(QUIZ_KEY).match(/\d{8}/) || [''])[0]); }
function reportResult(){
  try{
    var ao = activeOrder();
    var correct=0, wrong=0, skipped=0;
    var wrongPositions=[];
    var wrongDetails=[];
    for(var pos=0; pos<ao.length; pos++){
      var qi = ao[pos];
      if(state.answers[qi]===undefined){ skipped++; continue; }
      if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++; else { wrong++; wrongPositions.push(pos+1); wrongDetails.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[state.answers[qi]])); }
    }
    var total = ao.length;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var payload = {
      child: childName,
      quizTitle: TITLE,
      quizKey: QUIZ_KEY,
      attemptNumber: getAttempts(),
      correct: correct, wrong: wrong, skipped: skipped, total: total,
      scorePercent: total>0 ? Math.round((correct/total)*1000)/10 : 0,
      wrongNumbers: wrongPositions.join(','),
      quizDate: quizDateStr()
    };
    var firstKey = STORAGE_KEY + '_wrongsent';
    if(!(activeSet && activeSet.length) && !localStorage.getItem(firstKey)){
      payload.wrongAnswers = wrongDetails;
      localStorage.setItem(firstKey, '1');
    }
    fetch(REPORT_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(function(){});
  }catch(e){}
}
/* progress-report 2026-10-27 */
var _lastProgressSig = '';
function reportProgress(){
  try{
    if(state.showResults) return;
    if(!(!(activeSet && activeSet.length) && !localStorage.getItem(STORAGE_KEY + '_wrongsent'))) return;
    var answered=0, correct=0, wd=[];
    for(var pos=0; pos<order.length; pos++){
      var qi = order[pos]; var a = state.answers[qi];
      if(a===undefined){ wd.push(wrongDetail(qi, '(not answered)')); continue; }
      answered++;
      if(a===RAW_QUESTIONS[qi].ci) correct++; else wd.push(wrongDetail(qi, RAW_QUESTIONS[qi].opts[a]));
    }
    if(answered===0) return;
    var sig = answered + '/' + correct; if(sig===_lastProgressSig) return; _lastProgressSig = sig;
    var childName = 'Unknown';
    if(TITLE.indexOf('[Sion]')===0) childName='Sion';
    else if(TITLE.indexOf('[Grant]')===0) childName='Grant';
    else if(TITLE.indexOf('[Both]')===0) childName='Both';
    else if(TITLE.indexOf('[Review]')===0) childName='Review';
    var body = JSON.stringify({ type:'progress', child: childName, quizTitle: TITLE, quizKey: QUIZ_KEY, quizDate: quizDateStr(),
      answered: answered, total: order.length, correct: correct, wrongAnswers: wd });
    fetch(REPORT_ENDPOINT, { method:'POST', mode:'no-cors', keepalive: body.length < 60000,
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportProgress(); });
window.addEventListener('pagehide', reportProgress);


var ATTEMPTS_KEY = STORAGE_KEY + '_attempts';

var order = [];
var activeSet = null; // when in retry mode, holds subset of original indices
var state = { answers:{}, cur:0, showResults:false };
var hintShown = false;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = {answers:{},cur:0,showResults:false}; } }
  var rawOrder = localStorage.getItem(ORDER_KEY);
  if(rawOrder){ try{ order = JSON.parse(rawOrder); }catch(e){ order=null; } }
  if(!order || !order.length){
    order = RAW_QUESTIONS.map(function(_,i){return i;});
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  }
  var rawActive = localStorage.getItem(ACTIVE_KEY);
  if(rawActive){ try{ activeSet = JSON.parse(rawActive); }catch(e){ activeSet = null; } }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getAttempts(){
  var a = localStorage.getItem(ATTEMPTS_KEY);
  return a ? parseInt(a,10) : 0; // 2026-10-24: start at 0 so the first finish reports attempt 1 (was 1 → first finish reported 2)
}
function incAttempts(){
  var a = getAttempts() + 1;
  localStorage.setItem(ATTEMPTS_KEY, String(a));
}

function activeOrder(){ return (activeSet && activeSet.length) ? activeSet : order; }

function render(){
  document.getElementById('instruction').textContent = INSTRUCTION;
  var ord = activeOrder();
  if(state.showResults){
    document.getElementById('quiz-card').style.display='none';
    document.getElementById('results-card').style.display='block';
    renderResults();
  } else {
    document.getElementById('quiz-card').style.display='block';
    document.getElementById('results-card').style.display='none';
    renderQuestion();
  }
  updateNav();
}

function renderQuestion(){
  hintShown = false;
  var ord = activeOrder();
  var qi = ord[state.cur];
  var q = RAW_QUESTIONS[qi];
  var qpEl = document.getElementById('q-position');
  if(qpEl) qpEl.textContent = 'Q' + (state.cur + 1) + ' / ' + ord.length;

  var pb = document.getElementById('passage-box');
  if(q.passage){ pb.style.display='block'; pb.innerHTML = q.passage; } else { pb.style.display='none'; pb.innerHTML=''; }

  var cl = document.getElementById('context-label');
  if(q.contextLabel){ cl.style.display='block'; cl.textContent = q.contextLabel; } else { cl.style.display='none'; cl.textContent=''; }

  var cb = document.getElementById('context-box');
  if(q.context){ cb.style.display='block'; cb.innerHTML = q.context; } else { cb.style.display='none'; cb.innerHTML=''; }

  var tb = document.getElementById('tag-badge');
  if(q.tag){ tb.style.display='inline-block'; tb.textContent = q.tag; tb.style.background = q.tagcolor || '#185FA5'; } else { tb.style.display='none'; }

  var qt = document.getElementById('q-text');
  qt.innerHTML = q.stem + (q.tts ? ' <button class="tts-btn" onclick="speak(' + qi + ')" title="Listen">&#128266;</button>' : '');

  var opts = document.getElementById('options');
  opts.innerHTML = '';
  var answered = state.answers[qi] !== undefined;
  q.opts.forEach(function(optText, idx){
    var btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = optText;
    if(answered){
      btn.disabled = true;
      if(idx === q.ci) btn.className += ' reveal-correct';
      if(idx === state.answers[qi] && idx !== q.ci) btn.className += ' selected-wrong';
      if(idx === state.answers[qi] && idx === q.ci) btn.className += ' selected-correct';
    } else {
      btn.onclick = function(){ pick(idx); };
    }
    opts.appendChild(btn);
  });

  var hb = document.getElementById('hint-btn');
  var hx = document.getElementById('hint-box');
  if(q.hint){
    hb.style.display='inline-block'; hb.textContent='Show Hint';
    hx.innerHTML = q.hint; hx.classList.remove('show');
  } else {
    hb.style.display='none'; hx.classList.remove('show');
  }

  var eb = document.getElementById('exp-box');
  if(answered){
    eb.style.display='block';
    eb.innerHTML = '<strong>Explanation:</strong> ' + q.exp;
  } else {
    eb.style.display='none'; eb.innerHTML='';
  }

  document.getElementById('prev-btn').disabled = (state.cur === 0);
  var ord2 = activeOrder();
  var isLast = (state.cur === ord2.length - 1);
  document.getElementById('next-btn').textContent = isLast ? 'Finish' : 'Next';
}

function toggleHint(){
  hintShown = !hintShown;
  var b=document.getElementById('hint-btn'), x=document.getElementById('hint-box');
  if(hintShown){ x.classList.add('show'); b.textContent='Hide Hint'; }
  else { x.classList.remove('show'); b.textContent='Show Hint'; }
}
window.toggleHint = toggleHint;

function pick(idx){
  var ord = activeOrder();
  var qi = ord[state.cur];
  if(state.answers[qi] !== undefined) return;
  state.answers[qi] = idx;
  saveState();
  render();
}
window.pick = pick;

function prevQ(){
  if(state.cur > 0){ state.cur--; saveState(); render(); }
}
window.prevQ = prevQ;
window.go = prevQ;

function goNext(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    var ord = activeOrder();
  if(state.cur < ord.length - 1){
    state.cur++;
    saveState();
    render();
  } else {
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
    state.showResults = true;
    incAttempts();
    saveState();
    render();
    reportResult(); state.reported = true; saveState();
  }
}
window.goNext = goNext;

function showResultsNow(){
  if(state.showResults) return; // 2026-10-14: ignore double taps / Results tap on the results screen (prevented duplicate result emails)
    if(state.reported){ state.showResults=true; saveState(); render(); return; } /* no-resend-after-review 2026-10-28 */
  state.showResults = true;
  incAttempts(); // 2026-10-24: count a finish from the Results pill too
  saveState();
  render();
  reportResult(); state.reported = true; saveState();
}
window.showResultsNow = showResultsNow;

function goToQ(pos){
  state.cur = pos;
  state.showResults = false;
  saveState();
  render();
}
window.goToQ = goToQ;

function renderResults(){
  var ord = activeOrder();
  var correct=0, wrong=0, skipped=0;
  ord.forEach(function(qi){
    if(state.answers[qi]===undefined) skipped++;
    else if(state.answers[qi]===RAW_QUESTIONS[qi].ci) correct++;
    else wrong++;
  });
  var total = ord.length;
  document.getElementById('score-big').textContent = correct + ' / ' + total;
  document.getElementById('score-detail').textContent = 'Correct: ' + correct + '  Wrong: ' + wrong + '  Skipped: ' + skipped;
}

function updateNav(){
  var ord = activeOrder();
  var answeredCount = 0;
  ord.forEach(function(qi){ if(state.answers[qi]!==undefined) answeredCount++; });
  document.getElementById('nav-count').textContent = answeredCount + '/' + ord.length;
  var pct = ord.length ? Math.round(answeredCount/ord.length*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('results-pill').style.display = (answeredCount === ord.length && ord.length>0 && !state.showResults) ? 'inline-block' : 'none';
  renderDots();
}

function renderDots(){
  var panel = document.getElementById('dots-panel');
  if(panel.style.display === 'none') { buildDots(); return; }
  buildDots();
}
function buildDots(){
  var panel = document.getElementById('dots-panel');
  var ord = activeOrder();
  panel.innerHTML = '';
  ord.forEach(function(qi, pos){
    var d = document.createElement('button');
    d.className = 'dot';
    d.textContent = (pos+1);
    if(state.answers[qi]!==undefined){
      d.className += (state.answers[qi]===RAW_QUESTIONS[qi].ci) ? ' answered-correct' : ' answered-wrong';
    }
    d.onclick = function(){ goToQ(pos); };
    panel.appendChild(d);
  });
}

function toggleJump(){
  var panel = document.getElementById('dots-panel');
  var btn = document.getElementById('jump-btn');
  if(panel.style.display === 'none'){
    panel.style.display = 'flex';
    btn.innerHTML = 'Hide&#9652;';
    buildDots();
  } else {
    panel.style.display = 'none';
    btn.innerHTML = 'Jump&#9662;';
  }
}
window.toggleJump = toggleJump;

function startRetry(){
  var ord = activeOrder();
  var wrongIdx = ord.filter(function(qi){ return state.answers[qi]!==undefined && state.answers[qi]!==RAW_QUESTIONS[qi].ci; });
  if(!wrongIdx.length) return;
  activeSet = wrongIdx;
  localStorage.setItem(ACTIVE_KEY, JSON.stringify(activeSet));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  render();
}
window.startRetry = startRetry;



function openFreshModal(){ document.getElementById('fresh-modal').style.display='flex'; }
window.openFreshModal = openFreshModal;
function closeFreshModal(){ document.getElementById('fresh-modal').style.display='none'; }
window.closeFreshModal = closeFreshModal;
function confirmFresh(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(ORDER_KEY);
  localStorage.removeItem(ACTIVE_KEY);
  activeSet = null;
  order = RAW_QUESTIONS.map(function(_,i){return i;});
  localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  state = { answers:{}, cur:0, showResults:false };
  saveState();
  document.getElementById('fresh-modal').style.display='none';
  render();
}
window.confirmFresh = confirmFresh;

function speak(qi){
  try{
    var q = RAW_QUESTIONS[qi];
    var text = q.tts || q.stem.replace(/<[^>]+>/g,'');
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
window.speak = speak;

loadState();
render();
</script>
</body>
</html>
