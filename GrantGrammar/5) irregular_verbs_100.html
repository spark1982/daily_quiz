<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->
<!-- ===== Universal Total Attempts Counter (auto-injected) ===== -->
<style>
  #qzAttemptsBar { background: #f5f8fc; border-bottom: 1px solid #d0dce8; padding: 6px 12px; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.82rem; color: #4a6fa5; font-weight: 700; letter-spacing: 0.01em; }

</style>
<div id="qzAttemptsBar">Total Attempts:<span id="qzAttemptsCount">0</span></div>
<script>
(function(){
  var QA_KEY = 'qzAttempts_' + location.pathname;
  function qaGet(){ try { return parseInt(localStorage.getItem(QA_KEY)||'0',10) || 0; } catch(e){ return 0; } }
  function qaSet(n){ try { localStorage.setItem(QA_KEY, String(n)); } catch(e){} }
  function qaRenderCount(){
    var el = document.getElementById('qzAttemptsCount');
    if (el) el.textContent = qaGet();
  }
  function qaIsVisible(el){
    if (!el) return false;
    var r = el.getBoundingClientRect();
    if (r.width < 80 || r.height < 30) return false;
    var cs = window.getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden';
  }
  function qaResultsShowing(){
    var els = document.querySelectorAll('[id*="result" i],[class*="result" i],[id*="score" i],[class*="score" i]');
    for (var i=0;i<els.length;i++){ if (qaIsVisible(els[i])) return true; }
    return false;
  }
  var qaWasShowing = false;
  function qaCheck(){
    var showing = qaResultsShowing();
    if (showing && !qaWasShowing) {
      qaSet(qaGet()+1);
      qaRenderCount();
    }
    qaWasShowing = showing;
  }
  qaRenderCount();
  setInterval(qaCheck, 800);
  function qaObserve(){
    if (!document.body) return;
    var mo = new MutationObserver(function(){ qaCheck(); });
    mo.observe(document.body, { attributes: true, childList: true, subtree: true });
  }
  if (document.body) qaObserve();
  else document.addEventListener('DOMContentLoaded', qaObserve);
  setTimeout(qaCheck, 1500);
})();
</script>
<!-- ===== End Universal Total Attempts Counter ===== -->

  {g:"Group F: Big Change", b:"teach",       o:["taught","teached","teacht","taughted"]},
  {g:"Group F: Big Change", b:"fight",       o:["fought","fighted","foughted","fightted"]},
  {g:"Group F: Big Change", b:"seek",        o:["sought","seeked","seeked","seeken"]},
  {g:"Group F: Big Change", b:"stand",       o:["stood","standed","standen","standted"]},
  {g:"Group F: Big Change", b:"understand",  o:["understood","understanded","understandted","understanden"]},
  {g:"Group F: Big Change", b:"tell",        o:["told","telled","telld","telt"]},
  {g:"Group F: Big Change", b:"wear",        o:["wore","weared","worn","weard"]},
  // Group G — Other Essentials
  {g:"Group G: Other Essentials", b:"break",  o:["broke","breaked","broken","broked"]},
  {g:"Group G: Other Essentials", b:"wake",   o:["woke","waked","woken","wokened"]},
  {g:"Group G: Other Essentials", b:"choose", o:["chose","choosed","chosen","chosed"]},
  {g:"Group G: Other Essentials", b:"freeze", o:["froze","freezed","frozen","frozed"]},
  {g:"Group G: Other Essentials", b:"steal",  o:["stole","stealed","stolen","stoled"]},
  {g:"Group G: Other Essentials", b:"meet",   o:["met","meeted","meted","mett"]},
  {g:"Group G: Other Essentials", b:"feed",   o:["fed","feeded","feedted","fedd"]},
  {g:"Group G: Other Essentials", b:"lead",   o:["led","leaded","leadted","ledd"]},
  {g:"Group G: Other Essentials", b:"read",   o:["read","readed","reded","readded"]},
  {g:"Group G: Other Essentials", b:"bite",   o:["bit","bited","bitten","bitted"]},
  {g:"Group G: Other Essentials", b:"hide",   o:["hid","hided","hidden","hidded"]},
  {g:"Group G: Other Essentials", b:"slide",  o:["slid","slided","slidden","slidded"]},
  {g:"Group G: Other Essentials", b:"shoot",  o:["shot","shooted","shotten","shootted"]},
  {g:"Group G: Other Essentials", b:"forget", o:["forgot","forgeted","forgotten","forgetted"]},
  {g:"Group G: Other Essentials", b:"shake",  o:["shook","shaked","shaken","shookted"]},
  {g:"Group G: Other Essentials", b:"tear",   o:["tore","teared","torn","tored"]},
];

const STORAGE_KEY = 'quiz_irregular_verbs_100_v1';
let state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
let QUESTIONS = [];
function getList() { return state.retryMode ? state.retryList : QUESTIONS.map((_, i) => i); }

function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (typeof s.answers !== 'object' || typeof s.shuffles !== 'object') throw new Error();
    if (s.retryMode && !Array.isArray(s.retryList)) throw new Error();
    const listLen = s.retryMode ? s.retryList.length : VERBS.length;
    if (typeof s.cur !== 'number' || s.cur < 0 || s.cur >= listLen) throw new Error();
    state = s;
  } catch(e) {
    localStorage.removeItem(STORAGE_KEY);
    state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
  }
}

const ORDER_KEY = STORAGE_KEY + '_order_v1';
function identityOrder() { return Array.from({length: VERBS.length}, (_, i) => i); }
function isValidOrder(arr) {
  if (!Array.isArray(arr) || arr.length !== VERBS.length) return false;
  const sorted = arr.slice().sort((a, b) => a - b);
  for (let i = 0; i < sorted.length; i++) if (sorted[i] !== i) return false;
  return true;
}
function loadOrder() {
  try {
    const raw = localStorage.getItem(ORDER_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    if (!isValidOrder(arr)) throw new Error('bad order');
    return arr;
  } catch(e) { localStorage.removeItem(ORDER_KEY); return null; }
}
function saveOrder(order) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch(e) {} }
function shuffleOrder(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let currentOrder = loadOrder() || identityOrder();
let pendingFreshMode = 'original';

function buildQuestions() {
  return currentOrder.map(vi => {
    const v = VERBS[vi];
    // o[0] = correct, o[1..3] = wrong; ci always 0 before shuffle
    return { g: v.g, b: v.b, options: v.o, ci: 0 };
  });
}

function getShuffle(qi) {
  if (!state.shuffles[qi]) {
    const n = QUESTIONS[qi].options.length;
    let arr = Array.from({length: n}, (_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    state.shuffles[qi] = arr;
    saveState();
  }
  return state.shuffles[qi];
}

function buildDotNav() {
  // ── progress bar & count ──
  const list = getList();
  const _answered = list.filter(i => state.answers[i] !== undefined).length;
  const _total = list.length;
  document.getElementById('nav-count').textContent = _answered + ' / ' + _total;
  document.getElementById('prog-fill').style.width = (_total > 0 ? (_answered/_total*100).toFixed(1) : 0) + '%';
  const nav = document.getElementById('dot-panel');
  if (nav.style.display !== 'block') return;
  nav.innerHTML = '';
  for (let pos = 0; pos < list.length; pos++) {
    const i = list[pos];
    const d = document.createElement('button');
    d.className = 'dot';
    d.textContent = pos + 1;
    if (state.answers[i] !== undefined) {
      const shuffle = getShuffle(i);
      d.classList.add(state.answers[i] === shuffle.indexOf(QUESTIONS[i].ci) ? 'correct' : 'wrong');
    }
    if (!state.showResults && pos === state.cur) d.classList.add('current');
    d.addEventListener('click', () => { state.showResults = false; state.cur = pos; saveState(); render(); });
    nav.appendChild(d);
  }
  if (state.showResults) {
    const pill = document.createElement('button');
    pill.className = 'dot results-pill';
    pill.textContent = 'Results';
    pill.addEventListener('click', () => { state.showResults = true; saveState(); render(); });
    nav.appendChild(pill);
  }
}

function render() {
  try {
    buildDotNav();
    const qa = document.getElementById('quizArea');
    const ra = document.getElementById('resultsArea');
    if (state.showResults) {
      qa.style.display = 'none';
      ra.style.display = 'block';
      showResults();
    } else {
      ra.style.display = 'none';
      qa.style.display = 'block';
      showQuestion();
    }
  } catch(e) {
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('quizArea').innerHTML = '<p style="color:red;padding:20px;">An error occurred. Please refresh.</p>';
  }
}

function showQuestion() {
  const list = getList();
  const pos = state.cur;
  const qi = list[pos];
  const q = QUESTIONS[qi];
  const shuffle = getShuffle(qi);
  const answered = state.answers[qi] !== undefined;
  const chosenIdx = state.answers[qi];
  const correctShuffledIdx = shuffle.indexOf(q.ci);
  const isLast = pos === list.length - 1;

  let optHtml = '';
  shuffle.forEach((origIdx, shuffledIdx) => {
    let cls = '';
    if (answered) {
      if (shuffledIdx === chosenIdx) cls = shuffledIdx === correctShuffledIdx ? 'correct' : 'wrong';
      else if (shuffledIdx === correctShuffledIdx) cls = 'reveal';
    }
    optHtml += `<button class="option-btn ${cls}" onclick="choose(${shuffledIdx})" ${answered ? 'disabled' : ''}>${q.options[origIdx]}</button>`;
  });

  const expDisplay = (answered && chosenIdx !== correctShuffledIdx) ? 'block' : 'none';

  document.getElementById('quizArea').innerHTML = `
    <div class="type-badge">${q.g}</div>
    <div id="qNum">Question ${pos + 1} / ${list.length}</div>
    <div id="qText">What is the past tense of <b>${q.b}</b>?</div>
    <div id="options">${optHtml}</div>
    <div id="explanation" style="display:${expDisplay}">The past tense of <b>${q.b}</b> is <b>${q.options[0]}</b>.</div>
    <div id="navRow">
      <button class="nav-btn" id="prevBtn" onclick="go(-1)" ${pos === 0 ? 'disabled style="opacity:0.4"' : ''}>← Prev</button>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">${isLast ? 'See Results →' : 'Next →'}</button>
    </div>
  `;
}

function choose(shuffledIdx) {
  const list = getList();
  const qi = list[state.cur];
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = shuffledIdx;
  saveState();
  render();
}

function go(dir) {
  const list = getList();
  const next = state.cur + dir;
  if (next < 0) return;
  if (next >= list.length) { state.showResults = true; saveState(); render(); return; }
  state.cur = next;
  saveState();
  render();
}

function showResults() {
  const list = getList();
  let correct = 0;
  for (let pos = 0; pos < list.length; pos++) {
    const i = list[pos];
    const ans = state.answers[i];
    if (ans === undefined) continue;
    if (ans === getShuffle(i).indexOf(QUESTIONS[i].ci)) correct++;
  }
  let gridHtml = '';
  for (let pos = 0; pos < list.length; pos++) {
    const i = list[pos];
    const ans = state.answers[i];
    const q = QUESTIONS[i];
    const correctAns = q.options[0];
    let status, cls, correctText = '';
    if (ans === undefined) { status = 'Skipped'; cls = 'skipped'; correctText = correctAns; }
    else if (ans === getShuffle(i).indexOf(q.ci)) { status = 'Correct ✓'; cls = 'correct'; }
    else { status = 'Wrong ✗'; cls = 'wrong'; correctText = correctAns; }
    gridHtml += `<div class="result-card ${cls}" onclick="jumpTo(${pos})">
      <div class="rc-num">Q${pos+1}: ${q.b}</div>
      <div class="rc-status">${status}</div>
      ${correctText ? `<div class="rc-answer">✔ ${correctText}</div>` : ''}
    </div>`;
  }
  document.getElementById('resultsArea').innerHTML = `
    <div id="resultsTitle" style="text-align:center;font-weight:800;font-size:1.2rem;margin-bottom:6px;">${state.retryMode ? 'Retry Results' : 'Results'}</div>
    <div id="resultsScore">${correct} / ${list.length} Correct</div>
    <div id="resultsGrid">${gridHtml}</div>
    <button id="copyBtn" onclick="copyResults()">Copy All Results</button>
    <button id="retryWrongBtn" onclick="retryWrong()">Retry Wrong Ones</button>
    <button id="startFreshBtn" onclick="openModal('original')" style="margin-bottom:12px;">Start Fresh (Original Order)</button>
    <button id="startFreshRandomBtn" onclick="openModal('random')" style="display:block;width:100%;padding:13px;background:#fff;color:#E24B4A;border:2px solid #E24B4A;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">Start Fresh (Random Order)</button>
  `;
}

function jumpTo(pos) { state.cur = pos; state.showResults = false; saveState(); render(); }

function copyResults() {
  const list = getList();
  let text = 'Irregular Verbs Past Tense Quiz\n', correct = 0;
  for (let pos = 0; pos < list.length; pos++) {
    const i = list[pos];
    const ans = state.answers[i];
    const q = QUESTIONS[i];
    let status;
    if (ans === undefined) status = 'Skipped';
    else if (ans === getShuffle(i).indexOf(q.ci)) { correct++; status = 'Correct'; }
    else status = 'Wrong (Correct: ' + q.options[0] + ')';
    text += `Q${pos+1} ${q.b}: ${status}\n`;
  }
  text += `\nScore: ${correct} / ${list.length}`;
  try { navigator.clipboard.writeText(text).then(() => alert('Copied!')); }
  catch(e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Copied!'); }
}

function openModal(mode) {
  pendingFreshMode = mode;
  document.getElementById('modalTitle').textContent = mode === 'random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
  document.getElementById('modalText').textContent = mode === 'random'
    ? 'Questions will be reshuffled into a new random order, and all progress will be reset.'
    : 'Questions will return to their original order, and all progress will be reset.';
  document.getElementById('modal').classList.add('active');
}
document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('modal').classList.remove('active'));
document.getElementById('modalConfirm').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('active');
  currentOrder = (pendingFreshMode === 'random') ? shuffleOrder(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  localStorage.removeItem(STORAGE_KEY);
  state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
  saveState();
  QUESTIONS = buildQuestions();
  render();
});

loadState();
QUESTIONS = buildQuestions();
render();

function retryWrong() {
  var list = getList();
  var wrong = [];
  for (var pos = 0; pos < list.length; pos++) {
    var i = list[pos];
    if (state.answers[i] !== undefined && state.answers[i] !== getShuffle(i).indexOf(QUESTIONS[i].ci)) {
      wrong.push(i);
    }
  }
  if (wrong.length === 0) return;
  wrong.forEach(function(i) { delete state.answers[i]; });
  state.retryMode = true;
  state.retryList = wrong;
  state.cur = 0;
  state.showResults = false;
  saveState();
  render();
}

function toggleJump() {
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if (panel.style.display !== 'block') {
    panel.style.display = 'block';
    btn.textContent = 'Hide ▴';
    buildDotNav();
  } else {
    panel.style.display = 'none';
    btn.textContent = 'Jump ▾';
  }
}
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;

</script>
