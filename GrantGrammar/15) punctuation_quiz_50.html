<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>

<script>
(function() {
  const QUIZ_ID = 'grantpunct50';
  const LS_KEY = 'quiz_' + QUIZ_ID + '_v2';
  const ATT_KEY = 'quiz_' + QUIZ_ID + '_att_v2';

  const questions = [
    // ── Q1–10: original questions ──
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'My teacher, Mrs. johnson, assigned us a project on the american revolution.',
        'My teacher, Mrs. Johnson, assigned us a project on the American Revolution.',
        'My Teacher, Mrs. Johnson, assigned us a project on the American Revolution.',
        'My teacher, mrs. Johnson, assigned us a project on the American revolution.'
      ],
      ci: 1,
      exp: '"Mrs. Johnson" is a title with a proper name — both words are capitalized. "American Revolution" is a proper noun and must be capitalized. "teacher" at the start is a common noun and stays lowercase.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        '"Look out!" she screamed, "the bridge is going to collapse!"',
        '"Look out!" She screamed, "the bridge is going to collapse!"',
        '"Look out!" she screamed. "The bridge is going to collapse!"',
        '"Look out"! she screamed. "The bridge is going to collapse!"'
      ],
      ci: 2,
      exp: 'After a complete exclamatory quote, the dialogue tag begins with a lowercase letter ("she screamed"). A period ends the tag, and the next quoted sentence starts with a capital letter. The exclamation mark goes inside the closing quotation mark.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'Before leaving for school, jake packed his lunch, his homework, and his gym shoes.',
        'Before leaving for school Jake packed his lunch, his homework, and his gym shoes.',
        'Before leaving for school, Jake packed his lunch, his homework, and his gym shoes.',
        'Before leaving for school, Jake packed his lunch his homework and his gym shoes.'
      ],
      ci: 2,
      exp: 'An introductory phrase ("Before leaving for school") must be followed by a comma. Items in a series of three or more must be separated by commas. "Jake" is a proper noun and is capitalized.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'The package, which arrived on monday, contained books, a map and an old compass.',
        'The package, which arrived on Monday, contained books, a map, and an old compass.',
        'The package which arrived on Monday contained books, a map, and an old compass.',
        'The package, which arrived on Monday, contained books a map and an old compass.'
      ],
      ci: 1,
      exp: '"Monday" is a proper noun and must be capitalized. A nonessential clause ("which arrived on Monday") must be set off by commas on both sides. A serial comma is needed before "and" in a list of three items.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'Dr. Martinez asked, "have you taken your medication today?"',
        'Dr. Martinez asked, "Have you taken your medication today"?',
        'Dr. Martinez asked, "Have you taken your medication today?"',
        'Dr. martinez asked, "Have you taken your medication today?"'
      ],
      ci: 2,
      exp: 'A direct question inside quotation marks begins with a capital letter. The question mark belongs inside the closing quotation mark because it is part of the quoted question. "Dr. Martinez" — both the title and the name — are capitalized.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'We visited Paris, France and london, England on our trip last Summer.',
        'We visited Paris, France, and London, England on our trip last summer.',
        'We visited Paris, France, and London, England, on our trip last summer.',
        'We visited Paris France and London England on our trip last summer.'
      ],
      ci: 1,
      exp: 'City and country names are proper nouns and must be capitalized. A comma separates city from country. A serial comma goes after "London, England" before "and." "Summer" is a common noun and should not be capitalized.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'Its important to remember that the sun rises in the east.',
        "It's important to remember that the sun rises in the East.",
        "It's important to remember that the Sun rises in the east.",
        "It's important to remember that the sun rises in the east."
      ],
      ci: 3,
      exp: '"It\'s" (with an apostrophe) means "it is" — the correct form here. "The sun" is not capitalized unless used as a formal astronomical name. "East" as a general direction is lowercase (unlike "the East" as a named region).'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'After the storm passed the children who had stayed inside rushed outside to play.',
        'After the storm passed, the children who had stayed inside, rushed outside to play.',
        'After the storm passed, the children who had stayed inside rushed outside to play.',
        'After the storm passed, the children, who had stayed inside rushed outside to play.'
      ],
      ci: 2,
      exp: 'An introductory adverb clause ("After the storm passed") is followed by a comma. "who had stayed inside" is a restrictive relative clause — it identifies which children — so it should NOT be set off by commas.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'The coach yelled, "don\'t give up, we can still win this game!"',
        'The coach yelled, "Don\'t give up, we can still win this game!"',
        'The coach yelled "Don\'t give up, we can still win this game!"',
        'The coach yelled, "Don\'t give up; we can still win this game"!'
      ],
      ci: 1,
      exp: 'A direct quote introduced by "yelled," begins with a capital letter. A comma after the dialogue verb is required before the opening quotation mark. The exclamation mark belongs inside the closing quotation mark because it is part of the quote.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'Yoshida-san, our japanese exchange student, speaks three languages: English, japanese, and Korean.',
        'Yoshida-san, our Japanese exchange student, speaks three languages: English, Japanese, and Korean.',
        'Yoshida-san, our Japanese exchange student speaks three languages: English, Japanese, and Korean.',
        'Yoshida-san, our Japanese exchange student, speaks three languages; English, Japanese, and Korean.'
      ],
      ci: 1,
      exp: '"Japanese," "English," and "Korean" are proper adjectives or nouns derived from country names — all must be capitalized. The nonessential phrase "our Japanese exchange student" is correctly set off by commas. A colon (not a semicolon) introduces a list.'
    },
    // ── Q11–50: new questions ──
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'The senator said "I will fight for lower taxes" at the rally.',
        'The senator said, "I will fight for lower taxes," at the rally.',
        'The senator said, "I will fight for lower taxes", at the rally.',
        'The senator said, "i will fight for lower taxes," at the rally.'
      ],
      ci: 1,
      exp: 'A comma introduces a direct quote after a dialogue verb. The first word of a direct quote is capitalized. The comma at the end of the quote goes inside the closing quotation mark, not outside.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'My favorite subjects are math, science and english.',
        'My favorite subjects are Math, Science, and English.',
        'My favorite subjects are math, science, and English.',
        'My favorite subjects are Math, science, and English.'
      ],
      ci: 2,
      exp: 'General school subjects like math and science are common nouns and are not capitalized. However, "English" is always capitalized because it is derived from a proper noun (England). A serial comma is needed before "and."'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'We need to buy: eggs, milk, butter, and flour.',
        'We need to buy eggs, milk, butter, and flour.',
        'We need to buy eggs milk butter and flour.',
        'We need to buy — eggs, milk, butter, and flour.'
      ],
      ci: 1,
      exp: 'A colon should not be placed directly after a verb. When a list follows a verb naturally (like "buy"), no colon is needed. Commas are required to separate list items, and a serial comma goes before "and."'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        "Won't you please help me carry these boxes inside?",
        "Wont you please help me carry these boxes inside?",
        "Won't you please help me carry these boxes inside.",
        "Won't you please help me carry these boxes, inside?"
      ],
      ci: 0,
      exp: '"Won\'t" is a contraction of "will not" and requires an apostrophe. The sentence is a question, so it ends with a question mark. No comma is needed before "inside."'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'The book, "Charlotte\'s Web," was written by E.B. White.',
        'The book "Charlotte\'s Web" was written by E.B. White.',
        'The book "charlotte\'s web" was written by E.B. White.',
        'The book, "Charlotte\'s Web", was written by E.B. White.'
      ],
      ci: 1,
      exp: 'Titles of books are placed in quotation marks (or italics) with major words capitalized. When a title in quotation marks is the direct object of the sentence, no introductory comma is needed. The period goes inside the closing quotation mark at end of sentence.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'Although she was tired she stayed up to finish her report.',
        'Although she was tired, she stayed up to finish her report.',
        'Although she was tired; she stayed up to finish her report.',
        'Although, she was tired, she stayed up to finish her report.'
      ],
      ci: 1,
      exp: 'An introductory subordinate clause ("Although she was tired") must be followed by a comma. A semicolon cannot connect a subordinate clause to a main clause. No comma goes after "Although."'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        "The students who studied hardest earned the best grades.",
        "The students, who studied hardest, earned the best grades.",
        "The students who studied hardest, earned the best grades.",
        "The students, who studied hardest earned the best grades."
      ],
      ci: 0,
      exp: '"Who studied hardest" is a restrictive clause — it identifies which students — so no commas should be used. Adding commas would imply that all students studied hardest, changing the meaning.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'I have lived in three states: ohio, texas, and California.',
        'I have lived in three states: Ohio, Texas, and California.',
        'I have lived in three states; Ohio, Texas, and California.',
        'I have lived in three states, Ohio, Texas, and California.'
      ],
      ci: 1,
      exp: 'State names are proper nouns and must always be capitalized. A colon is correct here because it follows a complete clause and introduces a list. A semicolon is not used to introduce a list.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'She whispered, "please don\'t tell anyone what I said."',
        'She whispered, "Please don\'t tell anyone what I said."',
        'She whispered "Please don\'t tell anyone what I said."',
        'She whispered, "Please don\'t tell anyone what I said".'
      ],
      ci: 1,
      exp: 'A direct quote after a dialogue verb starts with a capital letter. A comma follows the dialogue verb before the opening quotation mark. The period at the end of the quoted sentence goes inside the closing quotation mark.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'Theyre going to the park aren\'t they?',
        "They're going to the park, aren't they?",
        "They're going to the park aren't they?",
        "Theyre going to the park, aren't they?"
      ],
      ci: 1,
      exp: '"They\'re" is a contraction of "they are" and needs an apostrophe. "Aren\'t" also needs an apostrophe. A tag question ("aren\'t they?") is set off from the main clause with a comma.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'The museum, which opened in 1987 displays artifacts from ancient egypt.',
        'The museum, which opened in 1987, displays artifacts from Ancient Egypt.',
        'The museum which opened in 1987, displays artifacts from ancient Egypt.',
        'The museum, which opened in 1987, displays artifacts from ancient egypt.'
      ],
      ci: 1,
      exp: 'A nonessential clause ("which opened in 1987") must be set off by commas on both sides. "Ancient Egypt" refers to a specific historical civilization and is a proper noun — both words are capitalized.'
    },
    {
      q: "Which sentence uses punctuation and capitalization correctly?",
      options: [
        'My uncle, who is a doctor works at st. Luke\'s hospital.',
        'My uncle, who is a Doctor, works at St. Luke\'s Hospital.',
        'My uncle, who is a doctor, works at St. Luke\'s Hospital.',

  const total = questions.length;

  const ORDER_KEY = LS_KEY + '_order_v1';
  function identityOrder() { return Array.from({length: total}, (_, i) => i); }
  function isValidOrder(arr) {
    if (!Array.isArray(arr) || arr.length !== total) return false;
    const seen = new Set();
    for (const v of arr) {
      if (typeof v !== 'number' || v < 0 || v >= total || seen.has(v)) return false;
      seen.add(v);
    }
    return true;
  }
  function loadOrder() {
    try {
      const raw = localStorage.getItem(ORDER_KEY);
      if (!raw) return null;
      const arr = JSON.parse(raw);
      return isValidOrder(arr) ? arr : null;
    } catch(e) { return null; }
  }
  function saveOrder(order) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch(e) {} }
  function shuffleOrder(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  let currentOrder = loadOrder() || identityOrder();
  let pendingFreshMode = 'original';
  function Q(i) { return questions[currentOrder[i]]; }

  let state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
  function getList() { return state.retryMode ? state.retryList : Array.from({length: total}, (_, i) => i); }

  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      const retryMode = !!s.retryMode;
      const retryList = Array.isArray(s.retryList) ? s.retryList : [];
      const listLen = retryMode ? retryList.length : total;
      if (typeof s.cur !== 'number' || s.cur < 0 || s.cur >= listLen) { localStorage.removeItem(LS_KEY); return; }
      if (typeof s.answers !== 'object' || typeof s.shuffles !== 'object') { localStorage.removeItem(LS_KEY); return; }
      state = s;
      state.retryMode = retryMode;
      state.retryList = retryList;
    } catch(e) { localStorage.removeItem(LS_KEY); }
  }

  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
  }

  function getAttempts() {
    try { return parseInt(localStorage.getItem(ATT_KEY) || '0'); } catch(e) { return 0; }
  }

  function setAttempts(n) {
    try { localStorage.setItem(ATT_KEY, String(n)); } catch(e) {}
  }

  function getShuffled(qi) {
    if (state.shuffles[qi]) return state.shuffles[qi];
    const indices = [0,1,2,3];
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    state.shuffles[qi] = indices;
    saveState();
    return indices;
  }

  function countAnswered() {
    return Object.keys(state.answers).length;
  }

  function updateNav() {
    const list = getList();
    let ans = 0;
    for (let k = 0; k < list.length; k++) { if (state.answers[list[k]] !== undefined) ans++; }
    document.getElementById('answered-count').textContent = ans + ' / ' + list.length;
    document.getElementById('progress-fill').style.width = (ans / list.length * 100) + '%';
    document.getElementById('att-display').textContent = 'Total Attempts: ' + getAttempts();
    document.getElementById('results-pill').style.display = (ans === list.length && !state.showResults) ? 'inline-block' : 'none';
    renderDots();
  }

  function renderDots() {
    const list = getList();
    const panel = document.getElementById('dot-panel');
    panel.innerHTML = '';
    for (let pos = 0; pos < list.length; pos++) {
      const i = list[pos];
      const d = document.createElement('div');
      d.className = 'dot';
      d.textContent = pos + 1;
      if (state.answers[i] !== undefined) {
        const shuffled = getShuffled(i);
        d.classList.add(shuffled[state.answers[i]] === Q(i).ci ? 'correct' : 'wrong');
      }
      d.onclick = (function(p){ return function(){ goTo(p); }; })(pos);
      panel.appendChild(d);
    }
  }

  window.toggleDots = function() {
    const panel = document.getElementById('dot-panel');
    panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
  };

  window.goResults = function() {
    state.showResults = true;
    saveState();
    if (!state.retryMode) {
      const att = getAttempts() + 1;
      setAttempts(att);
    }
    render();
  };

  function render() {
    try {
      if (state.showResults) {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        renderResults();
      } else {
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
        renderQuestion();
      }
      updateNav();
      renderBottomNav();
    } catch(e) {
      document.getElementById('quiz-area').style.display = 'block';
      document.getElementById('quiz-area').innerHTML = '<p style="color:red;padding:20px;">Error rendering quiz. Please refresh.</p>';
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function renderQuestion() {
    const list = getList();
    const pos = state.cur;
    const qi = list[pos];
    const q = Q(qi);
    const shuffled = getShuffled(qi);
    const answered = state.answers[qi] !== undefined;
    const selectedShuffleIdx = state.answers[qi];

    let html = '<div class="q-number">Question ' + (pos+1) + ' of ' + list.length + '</div>';
    html += '<div class="q-text">' + q.q + '</div>';
    html += '<span id="qIdentity" style="display:none">' + currentOrder[qi] + '</span>';
    html += '<div class="options">';

    shuffled.forEach(function(origIdx, si) {
      let cls = 'opt-btn';
      let disabled = '';
      if (answered) {
        disabled = 'disabled';
        if (si === selectedShuffleIdx) {
          cls += (origIdx === q.ci) ? ' correct-ans' : ' wrong-ans';
        } else if (origIdx === q.ci) {
          cls += ' correct-ans';
        }
      }
      html += '<button class="' + cls + '" ' + disabled + ' onclick="window.selectOpt(' + qi + ',' + si + ')">' + escHtml(q.options[origIdx]) + '</button>';
    });

    html += '</div>';
    if (answered) {
      html += '<div class="explanation">' + q.exp + '</div>';
    }

    document.getElementById('quiz-area').innerHTML = html;
  }

  window.selectOpt = function(qi, si) {
    if (state.answers[qi] !== undefined) return;
    state.answers[qi] = si;
    saveState();
    render();
  };

  function renderBottomNav() {
    const list = getList();
    const nav = document.getElementById('bottom-nav');
    nav.innerHTML = '';
    if (state.showResults) {
      nav.style.display = 'none';
      return;
    }
    nav.style.display = 'flex';

    const prevBtn = document.createElement('button');
    prevBtn.className = 'nav-btn';
    prevBtn.textContent = 'Prev';
    prevBtn.style.background = '#e8edf4';
    prevBtn.style.color = '#555';
    prevBtn.onclick = function() { goTo(state.cur - 1); };
    if (state.cur === 0) prevBtn.disabled = true;
    nav.appendChild(prevBtn);

    const allDone = list.every(function(i) { return state.answers[i] !== undefined; });

    if (allDone) {
      const resBtn = document.createElement('button');
      resBtn.className = 'nav-btn';
      resBtn.textContent = 'Results';
      resBtn.style.background = '#1D9E75';
      resBtn.style.color = '#fff';
      resBtn.onclick = function() { window.goResults(); };
      nav.appendChild(resBtn);
    } else {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'nav-btn';
      nextBtn.style.color = '#fff';
      nextBtn.style.background = '#1D9E75';
      nextBtn.textContent = 'Next';
      const isLastQ = state.cur === list.length - 1;
      const lastAnswered = state.answers[list[state.cur]] !== undefined;
      nextBtn.disabled = isLastQ && !lastAnswered;
      nextBtn.onclick = function() {
        if (isLastQ) { window.goResults(); } else { goTo(state.cur + 1); }
      };
      nav.appendChild(nextBtn);
    }
  }

  function goTo(i) {
    const list = getList();
    if (i < 0 || i >= list.length) return;
    state.cur = i; state.showResults = false; saveState(); render();
  }
  window.goTo = goTo;

  function renderResults() {
    const list = getList();
    let correct = 0;
    for (let k = 0; k < list.length; k++) {
      const i = list[k];
      if (state.answers[i] !== undefined) {
        const shuffled = getShuffled(i);
        if (shuffled[state.answers[i]] === Q(i).ci) correct++;
      }
    }
    const pct = Math.round(correct / list.length * 100);
    const att = getAttempts();

    let html = '<div class="results-card">';
    html += '<div class="results-heading">' + (state.retryMode ? 'Retry Results' : 'Results') + '</div>';
    html += '<div class="results-score">' + correct + ' / ' + list.length + '</div>';
    html += '<div class="results-pct">' + pct + '% correct</div>';

    for (let k = 0; k < list.length; k++) {
      const i = list[k];
      const q = Q(i);
      const shuffled = getShuffled(i);
      const userOrigIdx = state.answers[i] !== undefined ? shuffled[state.answers[i]] : undefined;
      const isCorrect = userOrigIdx === q.ci;
      html += '<div class="results-item">';
      html += '<div class="ri-q">Q' + (k+1) + ': ' + q.q + '</div>';
      if (userOrigIdx !== undefined) {
        if (isCorrect) {
          html += '<div class="ri-correct">Your answer: ' + escHtml(q.options[userOrigIdx]) + '</div>';
        } else {
          html += '<div class="ri-wrong">Your answer: ' + escHtml(q.options[userOrigIdx]) + '</div>';
          html += '<div class="ri-correct">Correct: ' + escHtml(q.options[q.ci]) + '</div>';
        }
      } else {
        html += '<div class="ri-wrong">Not answered</div>';
        html += '<div class="ri-correct">Correct: ' + escHtml(q.options[q.ci]) + '</div>';
      }
      html += '<div class="ri-exp">' + q.exp + '</div>';
      html += '</div>';
    }
    html += '</div>';

    html += '<button class="res-btn" style="background:#1D9E75;color:#fff;" onclick="window.retryWrong()">Retry Wrong Ones</button>';
    html += '<button class="res-btn" style="background:#185FA5;color:#fff;" onclick="window.copyResults()">Copy All Results</button>';
    html += '<button class="res-btn" id="startFreshBtn" style="background:#e8edf4;color:#333;" onclick="window.openModal(\'original\')">Start Fresh (Original Order)</button>';
    html += '<button class="res-btn" id="startFreshRandomBtn" style="background:#e8edf4;color:#333;" onclick="window.openModal(\'random\')">Start Fresh (Random Order)</button>';

    document.getElementById('results-screen').innerHTML = html;
    document.getElementById('att-display').textContent = 'Total Attempts: ' + att;
  }

  window.retryWrong = function() {
    const list = getList();
    const wrongQs = [];
    for (let k = 0; k < list.length; k++) {
      const i = list[k];
      if (state.answers[i] !== undefined) {
        const shuffled = getShuffled(i);
        if (shuffled[state.answers[i]] !== Q(i).ci) wrongQs.push(i);
      }
    }
    if (wrongQs.length === 0) return;
    wrongQs.forEach(function(i) { delete state.answers[i]; });
    state.retryMode = true;
    state.retryList = wrongQs;
    state.cur = 0;
    state.showResults = false;
    saveState();
    render();
  };

  window.copyResults = function() {
    const list = getList();
    let text = '[Grant] Punctuation & Capitalization Results\n';
    let correct = 0;
    for (let k = 0; k < list.length; k++) {
      const i = list[k];
      const q = Q(i);
      const shuffled = getShuffled(i);
      const userOrigIdx = state.answers[i] !== undefined ? shuffled[state.answers[i]] : undefined;
      const isCorrect = userOrigIdx === q.ci;
      if (isCorrect) correct++;
      text += '\nQ' + (k+1) + ': ' + (isCorrect ? 'Correct' : 'Wrong');
      if (!isCorrect) text += '\n  Correct: ' + q.options[q.ci];
    }
    text += '\n\nScore: ' + correct + ' / ' + list.length;
    try {
      navigator.clipboard.writeText(text).catch(function() { alert('Copy failed. Please copy manually.'); });
    } catch(e) { alert('Copy failed. Please copy manually.'); }
  };

  window.openModal = function(mode) {
    pendingFreshMode = mode;
    document.getElementById('modalTitle').textContent = mode === 'random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
    document.getElementById('modalText').textContent = mode === 'random' ? 'Questions will be reshuffled into a new random order, and all progress will be reset.' : 'Questions will return to their original order, and all progress will be reset.';
    document.getElementById('modal-overlay').classList.add('active');
  };
  window.closeModal = function() { document.getElementById('modal-overlay').classList.remove('active'); };
  window.confirmFresh = function() {
    localStorage.removeItem(LS_KEY);
    currentOrder = (pendingFreshMode === 'random') ? shuffleOrder(identityOrder()) : identityOrder();
    saveOrder(currentOrder);
    state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
    closeModal();
    render();
  };

  loadState();
  render();
})();
</script>
</body>
</html>
