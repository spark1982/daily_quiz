<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>

<script>
(function () {

    { q: "Which sentence correctly matches the verb with the subject?",
      o: ["The students in the front row raises their hands every time.",
          "The teacher, along with her assistants, prepare the lab materials.",

          "Many of the answers on the test was incorrect."],

      e: "\"Each\" is singular, so \"practices\" is correct. \"Students\" is plural \u2014 \"raises\" should be \"raise.\" \"Teacher\" is singular but \"prepare\" is plural \u2014 should be \"prepares.\" \"Answers\" is plural \u2014 \"was\" should be \"were.\""

    // Q2

          "Both of the windows in the bedroom face the backyard."],
      ci: 3,
      e: "\"Both\" is plural, so \"face\" is correct. \"Box\" is singular \u2014 use \"was,\" not \"were.\" With neither...nor, the verb matches the closer subject (\"dogs\" is plural) \u2014 use \"eat.\" \"Crowd\" is singular \u2014 use \"cheers.\""
    },
    // Q3
    { q: "Which sentence correctly matches the verb with the subject?",

    // Q4
    { q: "Which sentence correctly matches the verb with the subject?",

    // Q7

    // Q9

  var ORDER_KEY = QUIZ_KEY + '_order_v1';
  function identityOrder(){ var a=[]; for(var i=0;i<TOTAL;i++) a.push(i); return a; }
  function isValidOrder(arr){
    if(!Array.isArray(arr) || arr.length!==TOTAL) return false;
    var seen={};
    for(var i=0;i<arr.length;i++){
      var v=arr[i];
      if(typeof v!=="number" || v<0 || v>=TOTAL || seen[v]) return false;
      seen[v]=true;
    }
    return true;
  }
  function loadOrder(){
    try{
      var raw=localStorage.getItem(ORDER_KEY);
      if(!raw) return null;
      var arr=JSON.parse(raw);
      return isValidOrder(arr) ? arr : null;
    }catch(e){ return null; }
  }
  function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
  function shuffleOrderArr(arr){ return shuffle(arr); }
  var currentOrder = loadOrder() || identityOrder();
  var pendingFreshMode = "original";
  function Q(i) { return questions[currentOrder[i]]; }

  function loadState() {
    try {
      var raw = localStorage.getItem(QUIZ_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      var retryMode = !!s.retryMode;
      var retryList = Array.isArray(s.retryList) ? s.retryList : [];
      var listLen = retryMode ? retryList.length : TOTAL;
      if (typeof s.cur !== 'number' || s.cur < 0 || s.cur >= listLen) throw 0;
      if (typeof s.answers !== 'object' || typeof s.shuffles !== 'object') throw 0;
      s.retryMode = retryMode;
      s.retryList = retryList;
      return s;
    } catch(e) {
      localStorage.removeItem(QUIZ_KEY);
      return null;
    }
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function defaultState() {
    var sh = {};
    for (var i = 0; i < TOTAL; i++) sh[i] = shuffle([0,1,2,3]);
    return { cur: 0, answers: {}, shuffles: sh, showResults: false, retryMode: false, retryList: [] };
  }
  function getList() {
    if (state.retryMode) return state.retryList;
    var l = []; for (var i = 0; i < TOTAL; i++) l.push(i); return l;
  }

  function normShuffles(s) {
    for (var i = 0; i < TOTAL; i++) {
      var ki = String(i);
      if (!s.shuffles[i] && s.shuffles[ki]) s.shuffles[i] = s.shuffles[ki];
      if (!s.shuffles[i]) s.shuffles[i] = shuffle([0,1,2,3]);
    }
    return s;
  }

  function save() { localStorage.setItem(QUIZ_KEY, JSON.stringify(state)); }
  function getAtt() { return parseInt(localStorage.getItem(ATT_KEY) || '0', 10); }
  function incAtt() { var n = getAtt() + 1; localStorage.setItem(ATT_KEY, String(n)); return n; }
  function updAtt() { document.getElementById('att-num').textContent = getAtt(); }

  var state = loadState() || defaultState();
  normShuffles(state);
  var dotsOpen = false;

  function answered() { return Object.keys(state.answers).length; }

  function updateNav() {
    var list = getList();
    var ac = 0; for (var k = 0; k < list.length; k++) { if (state.answers[list[k]] !== undefined) ac++; }
    document.getElementById('answered-count').textContent = ac + ' / ' + list.length;
    document.getElementById('progress-fill').style.width = Math.round(ac / list.length * 100) + '%';
    var panel = document.getElementById('dot-panel');
    panel.innerHTML = '';
    for (var pos = 0; pos < list.length; pos++) {
      var i = list[pos];
      var d = document.createElement('div');
      d.className = 'dot';
      d.textContent = pos + 1;
      if (state.answers[i] !== undefined) {
        var sh = state.shuffles[i];
        d.className = 'dot ' + (sh[state.answers[i]] === Q(i).ci ? 'correct' : 'wrong');
      }
      (function(p){ d.onclick = function(){ window.goTo(p); if(dotsOpen) window.toggleDots(); }; })(pos);
      panel.appendChild(d);
    }
    document.getElementById('results-pill').style.display = ac === list.length ? 'block' : 'none';
  }

  window.toggleDots = function() {
    dotsOpen = !dotsOpen;
    var p = document.getElementById('dot-panel');
    p.style.display = dotsOpen ? 'flex' : 'none';
    document.getElementById('jump-btn').textContent = dotsOpen ? 'Hide' : 'Jump';
  };

  function render() {
    var qs = document.getElementById('quiz-screen');
    var rs = document.getElementById('results-screen');
    var bn = document.getElementById('bottom-nav');
    if (state.showResults) {
      qs.style.display = 'none'; bn.style.display = 'none'; rs.style.display = 'block';
      renderResults(); updateNav(); return;
    }
    rs.style.display = 'none'; qs.style.display = 'block'; bn.style.display = 'flex';
    renderQuestion(); updateNav();
  }

  function renderQuestion() {
    var list = getList();
    var pos = state.cur;
    var i = list[pos];
    var q = Q(i);
    var sh = state.shuffles[i];
    var ans = state.answers[i];
    var answered = ans !== undefined;
    var html = '<div id="question-box"><div id="q-num">Question ' + (pos+1) + ' of ' + list.length + '</div><div id="q-text">' + q.q + '</div><span id="qIdentity" style="display:none">' + currentOrder[i] + '</span></div>';
    for (var si = 0; si < 4; si++) {
      var orig = sh[si];
      var cls = 'opt-btn';
      if (answered) {
        if (orig === q.ci) cls = 'opt-btn reveal-correct';
        if (si === ans && orig !== q.ci) cls = 'opt-btn wrong-pick';
        if (si === ans && orig === q.ci) cls = 'opt-btn correct-pick';
      }
      html += '<button class="' + cls + '"' + (answered ? ' disabled' : '') + ' onclick="window.pick(' + si + ')">' + q.o[orig] + '</button>';
    }
    html += '<div id="explanation" style="display:' + (answered ? 'block' : 'none') + '">' + (answered ? q.e : '') + '</div>';
    document.getElementById('quiz-screen').innerHTML = html;

    var isLast = pos === list.length - 1;
    var nextLabel = isLast ? (answered ? 'See Results' : 'Next') : 'Next';
    var nextonclick = isLast && answered ? 'window.goResults()' : (!isLast ? 'window.goTo(' + (pos+1) + ')' : '');
    var nextDis = (!answered && !(!isLast)) || (isLast && !answered) ? ' disabled' : '';
    if (!isLast) nextDis = '';
    if (isLast && !answered) nextDis = ' disabled';
    if (isLast && answered) nextDis = '';

    document.getElementById('bottom-nav').innerHTML =
      '<button class="nav-btn"' + (pos === 0 ? ' disabled' : '') + ' onclick="window.goTo(' + (pos-1) + ')">Prev</button>' +
      '<button class="nav-btn next"' + nextDis + ' onclick="' + nextonclick + '">' + nextLabel + '</button>';
  }

  window.pick = function(si) {
    var list = getList();
    var i = list[state.cur];
    if (state.answers[i] !== undefined) return;
    state.answers[i] = si; save(); render();
  };

  window.goTo = function(pos) {
    var list = getList();
    if (pos < 0 || pos >= list.length) return;
    state.cur = pos; state.showResults = false; save(); render();
  };

  window.goResults = function() {
    state.showResults = true; if (!state.retryMode) { incAtt(); } updAtt(); save(); render();
  };

  function renderResults() {
    var list = getList();
    var correct = 0, wrong = 0, skipped = 0, grid = '';
    for (var k = 0; k < list.length; k++) {
      var i = list[k];
      var sh = state.shuffles[i]; var ans = state.answers[i]; var q = Q(i);
      var status, label;
      if (ans === undefined) { status = 'skipped'; label = 'Skipped'; skipped++; }
      else if (sh[ans] === q.ci) { status = 'correct'; label = 'Correct'; correct++; }
      else { status = 'wrong'; label = 'Wrong'; wrong++; }
      grid += '<div class="res-card ' + status + '" onclick="window.goTo(' + k + ')"><div class="rc-num">Q' + (k+1) + '</div><div class="rc-status">' + label + '</div></div>';
    }
    document.getElementById('results-screen').innerHTML =
      '<div id="results-heading">' + (state.retryMode ? 'Retry Results' : 'Results') + '</div>' +
      '<div style="text-align:center;font-size:0.9rem;color:#555;margin-bottom:12px;">Correct: ' + correct + ' / ' + list.length + '   Wrong: ' + wrong + '   Skipped: ' + skipped + '</div>' +
      '<div id="results-grid">' + grid + '</div>' +
      '<div id="results-btns">' +
        '<button class="res-btn" id="btn-retry" onclick="window.retryWrong()">Retry Wrong Ones</button>' +
        '<button class="res-btn" id="btn-copy"  onclick="window.copyResults()">Copy All Results</button>' +
        '<button class="res-btn" id="btn-fresh" onclick="window.openModal(\'original\')">Start Fresh (Original Order)</button>' +
        '<button class="res-btn" id="btn-fresh-random" onclick="window.openModal(\'random\')">Start Fresh (Random Order)</button>' +
      '</div>';
  }

  window.retryWrong = function() {
    var list = getList();
    var wrong = [];
    for (var k = 0; k < list.length; k++) {
      var i = list[k];
      var sh = state.shuffles[i]; var ans = state.answers[i];
      if (ans !== undefined && sh[ans] !== Q(i).ci) wrong.push(i);
    }
    if (wrong.length === 0) return;
    wrong.forEach(function(i){ delete state.answers[i]; });
    state.retryMode = true; state.retryList = wrong; state.cur = 0;
    state.showResults = false;
    save(); render();
  };

  window.copyResults = function() {
    var list = getList();
    var lines = ['[Grant] Subject-Verb Agreement - Results'];
    for (var k = 0; k < list.length; k++) {
      var i = list[k];
      var sh = state.shuffles[i]; var ans = state.answers[i];
      var s = ans === undefined ? 'Skipped' : (sh[ans] === Q(i).ci ? 'Correct' : 'Wrong');
      lines.push('Q' + (k+1) + ': ' + s);
    }
    navigator.clipboard.writeText(lines.join('\n')).catch(function(){});
  };

  window.openModal  = function(mode) {
    pendingFreshMode = mode;
    document.getElementById('modalTitle').textContent = mode === 'random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
    document.getElementById('modalText').textContent = mode === 'random' ? 'Questions will be reshuffled into a new random order, and all progress will be reset.' : 'Questions will return to their original order, and all progress will be reset.';
    document.getElementById('modal-overlay').classList.add('show');
  };
  window.closeModal = function() { document.getElementById('modal-overlay').classList.remove('show'); };
  window.confirmFresh = function() {
    localStorage.removeItem(QUIZ_KEY);
    currentOrder = (pendingFreshMode === 'random') ? shuffleOrderArr(identityOrder()) : identityOrder();
    saveOrder(currentOrder);
    state = defaultState(); normShuffles(state); save();
    document.getElementById('modal-overlay').classList.remove('show');
    render();
  };

  updAtt(); render();
})();
</script>
</body>
</html>
