<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->
<!-- ===== Universal Total Attempts Counter (auto-injected) ===== -->
<style>
  #qzAttemptsBar { background: #f5f8fc; border-bottom: 1px solid #d0dce8; padding: 6px 12px; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.82rem; color: #4a6fa5; font-weight: 700; letter-spacing: 0.01em; }
  #qzAttemptsBar span { color: #185FA5; font-weight: 900; margin-left: 4px; }
</style>
<div id="qzAttemptsBar">Total Attempts:<span id="qzAttemptsCount">0</span></div>
<script>
(function(){
  var QA_KEY = 'qzAttempts_' + location.pathname;
  function qaGet(){ try { return parseInt(localStorage.getItem(QA_KEY)||'0',10) || 0; } catch(e){ return 0; } }
  function qaSet(n){ try { localStorage.setItem(QA_KEY, String(n)); } catch(e){} }
  function qaRenderCount(){
    var el = document.getElementById('qzAttemptsCount');
    if (el) el.textContent = qaGet();
  }
  function qaIsVisible(el){
    if (!el) return false;
    var r = el.getBoundingClientRect();
    if (r.width < 80 || r.height < 30) return false;
    var cs = window.getComputedStyle(el);
    return cs.display !== 'none' && cs.visibility !== 'hidden';
  }
  function qaResultsShowing(){
    var els = document.querySelectorAll('[id*="result" i],[class*="result" i],[id*="score" i],[class*="score" i]');
    for (var i=0;i<els.length;i++){ if (qaIsVisible(els[i])) return true; }
    return false;
  }
  var qaWasShowing = false;
  function qaCheck(){
    var showing = qaResultsShowing();
    if (showing && !qaWasShowing) {
      qaSet(qaGet()+1);
      qaRenderCount();
    }
    qaWasShowing = showing;
  }
  qaRenderCount();
  setInterval(qaCheck, 800);
  function qaObserve(){
    if (!document.body) return;
    var mo = new MutationObserver(function(){ qaCheck(); });
    mo.observe(document.body, { attributes: true, childList: true, subtree: true });
  }
  if (document.body) qaObserve();
  else document.addEventListener('DOMContentLoaded', qaObserve);
  setTimeout(qaCheck, 1500);
})();
</script>
<!-- ===== End Universal Total Attempts Counter ===== -->

<script>
const STORAGE_KEY = 'quiz_5thpattern_oc_50_v1';

// Each entry has two questions: one asking for the object, one for the objective complement.
// options[0] = correct answer, options[1] = distractor. ci = 0 before shuffle.
const QUESTIONS = [
  // 1-2
  { sentence: 'They made him a leader.',        ask: 'object',      options: ['him', 'a leader'],   ci: 0, explanation: '"Him" is the object (who was affected). "A leader" is the objective complement (what he became).' },
  { sentence: 'They made him a leader.',        ask: 'complement',  options: ['a leader', 'him'],   ci: 0, explanation: '"A leader" is the objective complement — it describes what "him" became. "Him" is the object.' },
  // 3-4
  { sentence: 'She called him smart.',          ask: 'object',      options: ['him', 'smart'],      ci: 0, explanation: '"Him" is the object (who was called). "Smart" is the objective complement (the quality assigned to him).' },
  { sentence: 'She called him smart.',          ask: 'complement',  options: ['smart', 'him'],      ci: 0, explanation: '"Smart" is the objective complement — it describes "him." "Him" is the object.' },
  // 5-6
  { sentence: 'We elected her president.',      ask: 'object',      options: ['her', 'president'],  ci: 0, explanation: '"Her" is the object (who was elected). "President" is the objective complement (the role she was given).' },

  // 7-8
  { sentence: 'He found the room empty.',       ask: 'object',      options: ['the room', 'empty'], ci: 0, explanation: '"The room" is the object (what was found). "Empty" is the objective complement (its condition).' },

  // 9-10

  { sentence: 'The long years of dedicated service rendered the old professor an indispensable member of the faculty.', ask: 'complement', options: ['an indispensable member of the faculty', 'the old professor'], ci: 0, explanation: '"An indispensable member of the faculty" is the objective complement — it describes the status earned by "the old professor." "The old professor" is the object.' },
  // 39-40
  { sentence: 'Her constant encouragement and unwavering belief kept the exhausted team highly motivated throughout the project.', ask: 'object',     options: ['the exhausted team', 'highly motivated throughout the project'], ci: 0, explanation: '"The exhausted team" is the object (who was kept). "Highly motivated throughout the project" is the objective complement (their condition).' },
  { sentence: 'Her constant encouragement and unwavering belief kept the exhausted team highly motivated throughout the project.', ask: 'complement', options: ['highly motivated throughout the project', 'the exhausted team'], ci: 0, explanation: '"Highly motivated throughout the project" is the objective complement — it describes the state of "the exhausted team." "The exhausted team" is the object.' },
  // 41-42
  { sentence: 'The board of directors appointed the experienced financial analyst the new chief executive officer of the company.', ask: 'object',     options: ['the experienced financial analyst', 'the new chief executive officer of the company'], ci: 0, explanation: '"The experienced financial analyst" is the object (who was appointed). "The new chief executive officer of the company" is the objective complement (the role assigned).' },
  { sentence: 'The board of directors appointed the experienced financial analyst the new chief executive officer of the company.', ask: 'complement', options: ['the new chief executive officer of the company', 'the experienced financial analyst'], ci: 0, explanation: '"The new chief executive officer of the company" is the objective complement — it names the role given to "the experienced financial analyst." "The experienced financial analyst" is the object.' },
  // 43-44
  { sentence: 'The documentary about ocean pollution left many viewers deeply troubled and uncertain about the future.', ask: 'object',     options: ['many viewers', 'deeply troubled and uncertain about the future'], ci: 0, explanation: '"Many viewers" is the object (who was left). "Deeply troubled and uncertain about the future" is the objective complement (their emotional state).' },
  { sentence: 'The documentary about ocean pollution left many viewers deeply troubled and uncertain about the future.', ask: 'complement', options: ['deeply troubled and uncertain about the future', 'many viewers'], ci: 0, explanation: '"Deeply troubled and uncertain about the future" is the objective complement — it describes the state left in "many viewers." "Many viewers" is the object.' },
  // 45-46
  { sentence: 'The citizens of the small town elected the retired schoolteacher their new mayor by a landslide.', ask: 'object',     options: ['the retired schoolteacher', 'their new mayor'], ci: 0, explanation: '"The retired schoolteacher" is the object (who was elected). "Their new mayor" is the objective complement (the role assigned by the vote).' },
  { sentence: 'The citizens of the small town elected the retired schoolteacher their new mayor by a landslide.', ask: 'complement', options: ['their new mayor', 'the retired schoolteacher'], ci: 0, explanation: '"Their new mayor" is the objective complement — it names the role the town gave to "the retired schoolteacher." "The retired schoolteacher" is the object.' },
  // 47-48
  { sentence: 'Critics considered the debut novel of the young author one of the most important literary works of the decade.', ask: 'object',     options: ['the debut novel of the young author', 'one of the most important literary works of the decade'], ci: 0, explanation: '"The debut novel of the young author" is the object (what was considered). "One of the most important literary works of the decade" is the objective complement (the judgment assigned).' },
  { sentence: 'Critics considered the debut novel of the young author one of the most important literary works of the decade.', ask: 'complement', options: ['one of the most important literary works of the decade', 'the debut novel of the young author'], ci: 0, explanation: '"One of the most important literary works of the decade" is the objective complement — it states the critical judgment of "the debut novel." "The debut novel of the young author" is the object.' },
  // 49-50
  { sentence: 'The series of unexpected failures in the lab drove the research team nearly desperate for a solution.', ask: 'object',     options: ['the research team', 'nearly desperate for a solution'], ci: 0, explanation: '"The research team" is the object (who was driven). "Nearly desperate for a solution" is the objective complement (the resulting state).' },
  { sentence: 'The series of unexpected failures in the lab drove the research team nearly desperate for a solution.', ask: 'complement', options: ['nearly desperate for a solution', 'the research team'], ci: 0, explanation: '"Nearly desperate for a solution" is the objective complement — it describes the state the failures caused in "the research team." "The research team" is the object.' },
];

function seededShuffle(arr, seed) {
  let a = [...arr], s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    let j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Q1-30 (indices 0-29): easy sentences, shuffled within this section
// Q31-50 (indices 30-49): hard sentences, shuffled within this section
// Within each section, no two questions from the same sentence appear back-to-back.
function shuffleSection(arr) {
  const group = i => Math.floor(i / 2);
  const shuffle = () => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  };
  shuffle();
  let maxPasses = 1000;
  while (maxPasses-- > 0) {
    let conflict = -1;
    for (let i = 0; i < arr.length - 1; i++) {
      if (group(arr[i]) === group(arr[i + 1])) { conflict = i; break; }
    }
    if (conflict === -1) break;
    const ci = conflict + 1;
    let swapped = false;
    for (let j = 0; j < arr.length; j++) {
      if (j === ci || j === ci - 1) continue;
      const jPrev = j > 0 ? j - 1 : -1;
      const jNext = j < arr.length - 1 ? j + 1 : -1;
      const newAtCI = arr[j], newAtJ = arr[ci];
      const ciPrevOk = conflict === 0 || group(newAtCI) !== group(arr[conflict]);
      const ciNextOk = ci === arr.length - 1 || group(newAtCI) !== group(arr[ci + 1]);
      const jPrevOk  = jPrev < 0 || jPrev === ci || group(newAtJ) !== group(arr[jPrev]);
      const jNextOk  = jNext < 0 || jNext === ci || group(newAtJ) !== group(arr[jNext]);
      if (ciPrevOk && ciNextOk && jPrevOk && jNextOk) {
        [arr[ci], arr[j]] = [arr[j], arr[ci]];
        swapped = true; break;
      }
    }
    if (!swapped) shuffle();
  }
  return arr;
}

function buildQuestionOrder() {
  const easy = shuffleSection(Array.from({ length: 30 }, (_, i) => i));
  const hard = shuffleSection(Array.from({ length: 20 }, (_, i) => i + 30));
  return [...easy, ...hard];
}

const ORDER_KEY = STORAGE_KEY + '_order_v1';
function identityOrder() { return Array.from({length: QUESTIONS.length}, (_, i) => i); }
function isValidOrder(arr) {
  if (!Array.isArray(arr) || arr.length !== QUESTIONS.length) return false;
  const seen = new Set();
  for (const v of arr) {
    if (typeof v !== 'number' || v < 0 || v >= QUESTIONS.length || seen.has(v)) return false;
    seen.add(v);
  }
  return true;
}
function loadOrder() {
  try {
    const raw = localStorage.getItem(ORDER_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    return isValidOrder(arr) ? arr : null;
  } catch(e) { return null; }
}
function saveOrder(order) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch(e) {} }
let currentOrder = loadOrder() || identityOrder();
let pendingFreshMode = 'original';

function getShuffled(qi, seed) {
  const origIdx = currentOrder[qi];
  const q = QUESTIONS[origIdx];
  const idxMap = seededShuffle([0, 1], seed + qi * 37);
  return { labels: idxMap.map(i => q.options[i]), ci: idxMap.indexOf(q.ci) };
}

let state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
function getList() { return state.retryMode ? state.retryList : QUESTIONS.map((_, i) => i); }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      return;
    }
    const s = JSON.parse(raw);
    if (typeof s.answers !== 'object' || s.answers === null ||
        typeof s.shuffles !== 'object' || s.shuffles === null ||
        (s.retryMode && !Array.isArray(s.retryList))) {
      localStorage.removeItem(STORAGE_KEY);
      return;
    }
    const listLen = s.retryMode ? s.retryList.length : QUESTIONS.length;
    if (typeof s.cur !== 'number' || s.cur < 0 || s.cur >= listLen) {
      localStorage.removeItem(STORAGE_KEY);
      return;
    }
    state = s;
  } catch(e) { localStorage.removeItem(STORAGE_KEY); }
}

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function getSeed(qi) {
  if (!state.shuffles[qi]) state.shuffles[qi] = Math.floor(Math.random() * 900000) + 100000;
  return state.shuffles[qi];
}

function renderDotNav() {
  // ── progress bar & count ──
  const list = getList();
  const _answered = list.filter(qi => state.answers[qi] !== undefined).length;
  const _total = list.length;
  document.getElementById('nav-count').textContent = _answered + ' / ' + _total;
  document.getElementById('prog-fill').style.width = (_total > 0 ? (_answered/_total*100).toFixed(1) : 0) + '%';
  const nav = document.getElementById('dot-panel');
  if (nav.style.display !== 'block') return;
  nav.innerHTML = '';
  for (let pos = 0; pos < list.length; pos++) {
    const qi = list[pos];
    const d = document.createElement('button');
    d.className = 'dot';
    d.textContent = pos + 1;
    if (state.answers[qi] !== undefined) {
      const { ci } = getShuffled(qi, getSeed(qi));
      d.classList.add(state.answers[qi] === ci ? 'correct' : 'wrong');
    }
    if (!state.showResults && pos === state.cur) d.classList.add('current');
    d.onclick = () => { state.showResults = false; state.cur = pos; saveState(); render(); };
    nav.appendChild(d);
  }
  if (state.showResults) {
    const pill = document.createElement('button');
    pill.className = 'dot results-pill';
    pill.textContent = 'Results';
    pill.onclick = () => { state.showResults = true; saveState(); render(); };
    nav.appendChild(pill);
  }
}

function render() {
  try {
    renderDotNav();
    const qa = document.getElementById('quizArea');
    const ra = document.getElementById('resultsArea');
    if (state.showResults) {
      qa.style.display = 'none'; ra.style.display = 'block'; renderResults();
    } else {
      qa.style.display = 'block'; ra.style.display = 'none'; renderQuestion();
    }
  } catch(e) {
    document.getElementById('quizArea').style.display = 'block';
    document.getElementById('quizArea').innerHTML = '<p style="color:red;padding:20px">Error rendering quiz. Please refresh.</p>';
  }
}

function renderQuestion() {
  const list = getList();
  const pos = state.cur;
  const qi = list[pos];
  const q = QUESTIONS[currentOrder[qi]];
  const { labels, ci } = getShuffled(qi, getSeed(qi));
  const answered = state.answers[qi] !== undefined;
  const selectedIdx = state.answers[qi];
  const isLast = pos === list.length - 1;
  const askLabel = q.ask === 'object' ? 'object' : 'objective complement';

  let btnsHtml = labels.map((label, idx) => {
    let cls = 'opt-btn';
    if (answered) {
      if (idx === selectedIdx && idx === ci) cls += ' correct-ans';
      else if (idx === selectedIdx && idx !== ci) cls += ' wrong-ans';
      else if (idx !== selectedIdx && idx === ci) cls += ' reveal-ans';
    }
    return `<button class="${cls}" onclick="selectAnswer(${qi},${idx})" ${answered ? 'disabled' : ''}>${label}</button>`;
  }).join('');

  const expStyle = (answered && selectedIdx !== ci) ? 'display:block' : 'display:none';

  document.getElementById('quizArea').innerHTML = `
    <div class="q-header">
      <span class="type-badge">5th Pattern</span>
      <span class="q-num">Q${pos + 1} / ${list.length}</span>
    </div>
    <div class="sentence-box">${q.sentence}</div>
    <p class="question-prompt">What is the <b>${askLabel}</b> in this sentence?</p>
    <div class="options">${btnsHtml}</div>
    <div class="explanation" style="${expStyle}">${q.explanation}</div>
    <div class="nav-row">
      <button class="nav-btn" onclick="goTo(${pos-1})" ${pos===0?'disabled':''}>← Prev</button>
      <span class="counter">${list.filter(i => state.answers[i] !== undefined).length} / ${list.length} answered</span>
      ${isLast
        ? `<button class="nav-btn" onclick="showResults()">See Results →</button>`
        : `<button class="nav-btn" onclick="goTo(${pos+1})">Next →</button>`}
    </div>
    <div style="text-align:center;margin-top:16px">
      <button style="background:#888;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:0.85rem;font-weight:700;cursor:pointer;margin-right:8px;" onclick="openModal('original')">Start Fresh (Original Order)</button>
      <button style="background:#888;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:0.85rem;font-weight:700;cursor:pointer;" onclick="openModal('random')">Start Fresh (Random Order)</button>
    </div>
  `;
}

function selectAnswer(qi, idx) {
  if (state.answers[qi] !== undefined) return;
  state.answers[qi] = idx; saveState(); render();
}

function goTo(pos) {
  const list = getList();
  if (pos < 0 || pos >= list.length) return;
  state.cur = pos; state.showResults = false; saveState(); render();
}

function showResults() { state.showResults = true; saveState(); render(); }

function renderResults() {
  const list = getList();
  let correct = 0;
  for (let pos = 0; pos < list.length; pos++) {
    const qi = list[pos];
    if (state.answers[qi] === undefined) continue;
    const { ci } = getShuffled(qi, getSeed(qi));
    if (state.answers[qi] === ci) correct++;
  }

  let gridHtml = '';
  for (let pos = 0; pos < list.length; pos++) {
    const qi = list[pos];
    const { ci } = getShuffled(qi, getSeed(qi));
    const origIdx = currentOrder[qi];
    let cls, statusText, ansText = '';
    if (state.answers[qi] === undefined) {
      cls = 'skipped'; statusText = 'Skipped'; ansText = `✔ ${QUESTIONS[origIdx].options[0]}`;
    } else if (state.answers[qi] === ci) {
      cls = 'correct'; statusText = 'Correct';
    } else {
      cls = 'wrong'; statusText = 'Wrong'; ansText = `✔ ${QUESTIONS[origIdx].options[0]}`;
    }
    gridHtml += `<div class="result-card ${cls}" onclick="jumpTo(${pos})">
      <div class="rc-q">Q${pos+1}</div>
      <div>${statusText}</div>
      ${ansText ? `<div class="rc-ans">${ansText}</div>` : ''}
    </div>`;
  }

  document.getElementById('resultsArea').innerHTML = `
    <h2>${state.retryMode ? 'Retry Results' : 'Results'}</h2>
    <div class="score-box">${correct} / ${list.length} Correct</div>
    <div class="result-grid">${gridHtml}</div>
    <div class="bottom-btns">
      <button class="copy-btn" onclick="copyResults()">Copy All Results</button>
      <button id="retryWrongBtn" onclick="retryWrong()">Retry Wrong Ones</button>
      <button class="fresh-btn" id="startFreshBtn" onclick="openModal('original')">Start Fresh (Original Order)</button>
      <button class="fresh-btn" id="startFreshRandomBtn" onclick="openModal('random')">Start Fresh (Random Order)</button>
    </div>
  `;
}

function jumpTo(pos) { state.cur = pos; state.showResults = false; saveState(); render(); }

function copyResults() {
  const list = getList();
  let lines = ['5th Pattern: Object & Objective Complement Quiz\n'];
  for (let pos = 0; pos < list.length; pos++) {
    const qi = list[pos];
    const { ci } = getShuffled(qi, getSeed(qi));
    const origIdx = currentOrder[qi];
    const status = state.answers[qi] === undefined ? 'Skipped' : state.answers[qi] === ci ? 'Correct' : 'Wrong';
    lines.push(`Q${pos+1}: ${status} (Answer: ${QUESTIONS[origIdx].options[0]})`);
  }
  navigator.clipboard.writeText(lines.join('\n')).catch(()=>{});
}

function openModal(mode) {
  pendingFreshMode = mode;
  document.getElementById('modalTitle').textContent = mode === 'random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
  document.getElementById('modalText').textContent = mode === 'random' ? 'Questions will be reshuffled into a new random order, and all progress will be reset.' : 'Questions will return to their original order, and all progress will be reset.';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function confirmFresh() {
  localStorage.removeItem(STORAGE_KEY);
  state = { cur: 0, answers: {}, shuffles: {}, showResults: false, retryMode: false, retryList: [] };
  currentOrder = (pendingFreshMode === 'random') ? buildQuestionOrder() : identityOrder();
  saveOrder(currentOrder);
  closeModal(); render();
}

loadState();
render();

function retryWrong() {
  var list = getList();
  var wrong = [];
  for (var pos = 0; pos < list.length; pos++) {
    var qi = list[pos];
    if (state.answers[qi] !== undefined && state.answers[qi] !== getShuffled(qi, getSeed(qi)).ci) {
      wrong.push(qi);
    }
  }
  if (wrong.length === 0) return;
  wrong.forEach(function(qi) { delete state.answers[qi]; });
  state.retryMode = true;
  state.retryList = wrong;
  state.cur = 0;
  state.showResults = false;
  saveState();
  render();
}

function toggleJump() {
  var panel = document.getElementById('dot-panel');
  var btn = document.getElementById('jump-btn');
  if (panel.style.display !== 'block') {
    panel.style.display = 'block';
    btn.textContent = 'Hide ▴';
    renderDotNav();
  } else {
    panel.style.display = 'none';
    btn.textContent = 'Jump ▾';
  }
}
window.toggleJump = toggleJump;
window.retryWrong = retryWrong;

</script>
</body>
