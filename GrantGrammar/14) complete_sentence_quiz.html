<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>

  {text:"Which of the following is a COMPLETE sentence?",options:["Before the fog rolled in off the ocean.","The wolves communicated through howls.","Tumbling down the grassy slope together.","A brand-new bicycle with a shiny bell."],ci:1,explain:"\"The wolves communicated through howls.\" is a complete sentence — subject: 'The wolves', predicate: 'communicated'. The others are fragments: a 'Before' clause, an -ing phrase, and a noun phrase."},
  {text:"Which of the following is a COMPLETE sentence?",options:["If the situation does not improve soon.","A pile of damp towels on the bathroom floor.","Listening to the sound of the falling rain.","The students wrote letters to the mayor."],ci:3,explain:"\"The students wrote letters to the mayor.\" is a complete sentence — subject: 'The students', predicate: 'wrote'. The others are fragments: an 'If' clause, a noun phrase, and an -ing phrase."}
];

var TOTAL = ALL_Q.length;

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var ORDER_KEY = STORAGE_KEY + "_order_v1";
function identityOrder(){ var a=[]; for(var i=0;i<TOTAL;i++) a.push(i); return a; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==TOTAL) return false;
  var seen={};
  for(var i=0;i<arr.length;i++){
    var v=arr[i];
    if(typeof v!=="number" || v<0 || v>=TOTAL || seen[v]) return false;
    seen[v]=true;
  }
  return true;
}
function loadOrder(){
  try{
    var raw=localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr=JSON.parse(raw);
    return isValidOrder(arr) ? arr : null;
  }catch(e){ return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function shuffleOrder(arr){ return shuffle(arr); }
var currentOrder = loadOrder() || identityOrder();
var pendingFreshMode = "original";
function Q(i){ return ALL_Q[currentOrder[i]]; }

var state={cur:0,answers:{},shuffles:{},showResults:false,retryMode:false,retryList:[]};

function getList(){
  if(state.retryMode) return state.retryList;
  var l=[];for(var i=0;i<TOTAL;i++)l.push(i);return l;
}

function defaultShuffles(){var sh={};for(var i=0;i<TOTAL;i++){sh[i]=shuffle([0,1,2,3]);}return sh;}
function normalizeShuffles(sh){var out={};for(var i=0;i<TOTAL;i++){var v=sh[i]||sh[String(i)];out[i]=Array.isArray(v)&&v.length===4?v:shuffle([0,1,2,3]);}return out;}

function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    var s=JSON.parse(raw);
    var retryMode=!!s.retryMode;
    var retryList=Array.isArray(s.retryList)?s.retryList:[];
    var listLen=retryMode?retryList.length:TOTAL;
    if(typeof s.cur!=='number'||s.cur<0||s.cur>=listLen)return false;
    if(!s.answers||typeof s.answers!=='object')return false;
    if(!s.shuffles||typeof s.shuffles!=='object')return false;
    state=s;state.shuffles=normalizeShuffles(s.shuffles||{});
    state.retryMode=retryMode;state.retryList=retryList;
    return true;
  }catch(e){try{localStorage.removeItem(STORAGE_KEY);}catch(e2){}return false;}
}

function getAttempts(){try{return parseInt(localStorage.getItem(ATT_KEY)||'0',10)||0;}catch(e){return 0;}}
function incrementAttempts(){try{localStorage.setItem(ATT_KEY,String(getAttempts()+1));}catch(e){}}

function render(){
  updateAtt();updateNav();
  var qa=document.getElementById('quiz-area');
  var ra=document.getElementById('results-area');
  if(state.showResults){qa.style.display='none';ra.style.display='block';renderResults();return;}
  qa.style.display='block';ra.style.display='none';renderQuestion();
}

function updateAtt(){document.getElementById('att-display').textContent='Complete Sentence Quiz | Total Attempts: '+getAttempts();}

function updateNav(){
  var list=getList();
  var answered=0;
  for(var k=0;k<list.length;k++){if(state.answers[list[k]]!==undefined)answered++;}
  document.getElementById('answered-count').textContent=answered+' / '+list.length;
  document.getElementById('prog-fill').style.width=(answered/list.length*100)+'%';
  var panel=document.getElementById('dot-panel');
  panel.innerHTML='';
  for(var pos=0;pos<list.length;pos++){
    var qi=list[pos];
    var d=document.createElement('button');
    d.className='dot';d.textContent=pos+1;
    (function(p){d.onclick=function(){window.goTo(p);};})(pos);
    if(state.answers[qi]!==undefined){
      var sh=state.shuffles[qi];var csi=sh.indexOf(Q(qi).ci);
      if(state.answers[qi]===csi)d.classList.add('correct');else d.classList.add('wrong');
    }
    panel.appendChild(d);
  }
  var pill=document.getElementById('results-pill');
  pill.style.display=answered===list.length?'block':'none';
}

function renderQuestion(){
  var list=getList();var pos=state.cur;var qi=list[pos];
  var q=Q(qi);var sh=state.shuffles[qi];
  document.getElementById('q-meta').textContent='Question '+(pos+1)+' / '+list.length;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('qIdentity').textContent=String(currentOrder[qi]);
  var container=document.getElementById('options');container.innerHTML='';
  var userAns=state.answers[qi];var csi=sh.indexOf(q.ci);
  sh.forEach(function(origIdx,shuffIdx){
    var btn=document.createElement('button');btn.className='opt-btn';
    btn.textContent=q.options[origIdx];
    if(userAns!==undefined){
      btn.disabled=true;
      if(shuffIdx===csi)btn.classList.add('correct');
      else if(shuffIdx===userAns)btn.classList.add('wrong');
    }
    (function(si){btn.onclick=function(){window.selectAnswer(si);};})(shuffIdx);
    container.appendChild(btn);
  });
  var eb=document.getElementById('explain-box');
  if(userAns!==undefined){
    eb.style.display='block';
    eb.className=(userAns===csi)?'correct':'wrong';
    eb.textContent=q.explain;
  }else{eb.style.display='none';eb.className='';}
  document.getElementById('prev-btn').disabled=(pos===0);
  document.getElementById('next-btn').textContent=(pos===list.length-1)?'See Results':'Next';
}

function renderResults(){
  var list=getList();
  var correct=0,wrong=0,skipped=0;
  for(var k=0;k<list.length;k++){
    var qi=list[k];
    if(state.answers[qi]===undefined){skipped++;continue;}
    var sh=state.shuffles[qi];var csi=sh.indexOf(Q(qi).ci);
    if(state.answers[qi]===csi)correct++;else wrong++;
  }
  var h2=document.querySelector('#results-area h2');
  if(h2)h2.textContent=state.retryMode?'Retry Results':'Results';
  document.getElementById('score-line').textContent=correct+' correct, '+wrong+' wrong, '+skipped+' skipped out of '+list.length;
  var grid=document.getElementById('res-grid');grid.innerHTML='';
  for(var k=0;k<list.length;k++){
    var qi=list[k];
    var q=Q(qi);var sh=state.shuffles[qi];var csi=sh.indexOf(q.ci);var ua=state.answers[qi];
    var card=document.createElement('div');var status,label;
    if(ua===undefined){status='skipped';label='Skipped';}
    else if(ua===csi){status='correct';label='Correct';}
    else{status='wrong';label='Wrong';}
    card.className='res-card '+status;
    var html='<div class="rc-label">Q'+(k+1)+' - '+label+'</div>';
    html+='<div class="rc-q">'+q.text+'</div>';
    if(ua!==undefined){
      html+='<div class="rc-ans">Your answer: '+q.options[sh[ua]]+'</div>';
      if(status==='wrong'){html+='<div class="rc-correct">Correct: '+q.options[q.ci]+'</div>';}
    }
    card.innerHTML=html;grid.appendChild(card);
  }
  document.getElementById('retry-btn').style.display=wrong>0?'block':'none';
}

window.selectAnswer=function(shuffledIdx){
  var list=getList();var qi=list[state.cur];if(state.answers[qi]!==undefined)return;
  state.answers[qi]=shuffledIdx;saveState();render();
};
window.goTo=function(pos){
  var list=getList();
  if(pos<0||pos>=list.length)return;
  state.showResults=false;state.cur=pos;saveState();render();
};
window.goPrev=function(){window.goTo(state.cur-1);};
window.nextQ=function(){
  var list=getList();
  if(state.cur===list.length-1){if(!state.retryMode)incrementAttempts();state.showResults=true;saveState();render();}
  else{window.goTo(state.cur+1);}
};
window.goResults=function(){if(!state.retryMode)incrementAttempts();state.showResults=true;saveState();render();};
window.toggleDots=function(){
  var panel=document.getElementById('dot-panel');var btn=document.getElementById('jump-btn');
  if(panel.style.display==='flex'){panel.style.display='none';btn.textContent='Jump';}
  else{panel.style.display='flex';btn.textContent='Hide';}
};
window.retryWrong=function(){
  var list=getList();
  var wrong=[];
  for(var k=0;k<list.length;k++){
    var qi=list[k];
    var ua=state.answers[qi];if(ua===undefined)continue;
    var sh=state.shuffles[qi];var csi=sh.indexOf(Q(qi).ci);
    if(ua!==csi)wrong.push(qi);
  }
  if(wrong.length===0)return;
  wrong.forEach(function(qi){delete state.answers[qi];});
  state.retryMode=true;
  state.retryList=wrong;
  state.cur=0;
  state.showResults=false;saveState();render();
};
window.copyResults=function(){
  var list=getList();
  var lines=['[Grant] Complete Sentence Quiz - Results'];
  for(var k=0;k<list.length;k++){
    var qi=list[k];
    var q=Q(qi);var sh=state.shuffles[qi];var csi=sh.indexOf(q.ci);var ua=state.answers[qi];
    var status=ua===undefined?'Skipped':(ua===csi?'Correct':'Wrong');
    lines.push('Q'+(k+1)+': '+status);
    if(ua!==undefined&&ua!==csi){lines.push('  Your: '+q.options[sh[ua]]);lines.push('  Correct: '+q.options[q.ci]);}
  }
  try{navigator.clipboard.writeText(lines.join('\n'));}
  catch(e){var ta=document.createElement('textarea');ta.value=lines.join('\n');document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
};
window.openModal=function(mode){
  pendingFreshMode=mode;
  document.getElementById('modalTitle').textContent = mode==='random' ? 'Start Fresh (Random Order)?' : 'Start Fresh (Original Order)?';
  document.getElementById('modalText').textContent = mode==='random' ? 'Questions will be reshuffled into a new random order, and all progress will be reset.' : 'Questions will return to their original order, and all progress will be reset.';
  document.getElementById('modal-overlay').classList.add('show');
};
window.closeModal=function(){document.getElementById('modal-overlay').classList.remove('show');};
window.confirmFresh=function(){
  window.closeModal();
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  currentOrder = (pendingFreshMode==="random") ? shuffleOrder(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  state={cur:0,answers:{},shuffles:normalizeShuffles(defaultShuffles()),showResults:false,retryMode:false,retryList:[]};saveState();render();
};

var loaded=loadState();
if(!loaded){state.shuffles=normalizeShuffles(defaultShuffles());saveState();}
render();
})();
</script>
