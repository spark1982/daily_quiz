<!-- ===== Universal Quiz Timer (auto-injected) ===== -->
<style>
  #qzTimerBar { background: #ffffff; border-bottom: 1px solid #d0dce8; padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-family: 'Segoe UI', Arial, sans-serif; }
  #qzTimerSetup { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #444; }
  #qzTimerSetup label { font-weight: 700; }
  #qzTimerInput { width: 56px; padding: 5px 6px; border: 1.5px solid #d0dce8; border-radius: 6px; font-size: 0.9rem; text-align: center; }
  #qzTimerStartBtn { background: #185FA5; color: #ffffff; border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  #qzTimerStartBtn:active { opacity: 0.8; }
  #qzTimerRunning { display: none; align-items: center; gap: 8px; }
  #qzTimerLabel { font-size: 0.78rem; font-weight: 700; color: #888888; text-transform: uppercase; letter-spacing: 0.02em; }
  #qzTimerDisplay { font-size: 1.1rem; font-weight: 900; color: #185FA5; font-family: 'Courier New', monospace; letter-spacing: 0.02em; }
  #qzTimerDisplay.qz-warn { color: #f5a623; }
  #qzTimerDisplay.qz-danger { color: #E24B4A; }
</style>
<div id="qzTimerBar">
  <div id="qzTimerSetup">
    <label for="qzTimerInput">Set Time Limit:</label>
    <input type="number" id="qzTimerInput" min="1" max="180" value="20"> min
    <button id="qzTimerStartBtn" type="button">Start</button>
  </div>
  <div id="qzTimerRunning">
    <span id="qzTimerLabel">Time Left</span>
    <span id="qzTimerDisplay">20:00</span>
  </div>
</div>
<script>
(function(){
  var QZ_KEY = 'qzTimer_' + location.pathname;
  var qz = { totalSec: null, startedAt: null };
  try {
    var raw = localStorage.getItem(QZ_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p.totalSec === 'number' && typeof p.startedAt === 'number') qz = p;
    }
  } catch(e) {}
  var qzInterval = null;

  function qzSave() { try { localStorage.setItem(QZ_KEY, JSON.stringify(qz)); } catch(e) {} }
  function qzFormat(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  function qzRender() {
    var setupEl = document.getElementById('qzTimerSetup');
    var runEl = document.getElementById('qzTimerRunning');
    var disp = document.getElementById('qzTimerDisplay');
    if (!setupEl || !runEl || !disp) return;
    if (!qz.startedAt) {
      setupEl.style.display = 'flex';
      runEl.style.display = 'none';
      return;
    }
    setupEl.style.display = 'none';
    runEl.style.display = 'flex';
    var elapsed = (Date.now() - qz.startedAt) / 1000;
    var remaining = qz.totalSec - elapsed;
    disp.classList.remove('qz-warn', 'qz-danger');
    if (remaining <= 0) {
      disp.textContent = "Time's Up";
      disp.classList.add('qz-danger');
      qzStopInterval();
      return;
    }
    disp.textContent = qzFormat(remaining);
    if (remaining <= qz.totalSec * 0.1) disp.classList.add('qz-danger');
    else if (remaining <= qz.totalSec * 0.25) disp.classList.add('qz-warn');
  }
  function qzStartInterval() {
    qzStopInterval();
    qzInterval = setInterval(qzRender, 1000);
  }
  function qzStopInterval() {
    if (qzInterval) { clearInterval(qzInterval); qzInterval = null; }
  }
  function qzStart() {
    var input = document.getElementById('qzTimerInput');
    var minutes = parseFloat(input.value);
    if (!minutes || minutes <= 0) minutes = 20;
    qz.totalSec = Math.round(minutes * 60);
    qz.startedAt = Date.now();
    qzSave();
    qzRender();
    qzStartInterval();
  }

  var btn = document.getElementById('qzTimerStartBtn');
  if (btn) btn.addEventListener('click', qzStart);
  qzRender();
  if (qz.startedAt) qzStartInterval();

  function qzResetTimer() {
    qz.totalSec = null;
    qz.startedAt = null;
    qzSave();
    qzStopInterval();
    qzRender();
  }
  var qzRetryRe = /retry|restart|reset|start\s*fresh|try\s*again|\uB2E4\uC2DC\s*\uC2DC\uC791|\uCC98\uC74C\uBD80\uD0B0/i;
  document.addEventListener('click', function(ev) {
    var el = ev.target, depth = 0;
    while (el && depth < 4) {
      if (el.id === 'qzTimerBar' || el.id === 'qzAttemptsBar') return;
      var isClickable = el.tagName === 'BUTTON' || el.tagName === 'A' ||
        (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) ||
        (el.getAttribute && el.getAttribute('role') === 'button');
      if (isClickable) {
        var txt = (el.textContent || el.value || '').trim();
        if (txt.length > 0 && txt.length < 40 && qzRetryRe.test(txt)) {
          qzResetTimer();
          return;
        }
      }
      el = el.parentElement;
      depth++;
    }
  }, true);
})();
</script>
<!-- ===== End Universal Quiz Timer ===== -->

  { s:"The judge", v:"sentenced", o:"the criminal", pBefore:"The criminal", pAfter:"by the judge.",

    options:["was corrected","were corrected","was correcting","was correct"], ci:0,

  { s:"Bees", v:"pollinate", o:"the flowers", pBefore:"The flowers", pAfter:"by bees.",
    options:["is pollinated","are pollinated","are pollinating","are pollinate"], ci:1,
    explanation:'The new subject "the flowers" is plural and the action is in the present, so use are + the past participle "pollinated": are pollinated.' }
];

var N = QUESTIONS.length;
var KEY = "quiz_passivevoice_50_v1";
var ATTEMPTS_KEY = "quiz_passivevoice_attempts_v1";
var ORDER_KEY = KEY + "_order_v1";

function identityOrder(){ var a=[]; for(var i=0;i<N;i++) a.push(i); return a; }
function isValidOrder(arr){
  if(!Array.isArray(arr) || arr.length!==N) return false;
  var seen={};
  for(var i=0;i<arr.length;i++){
    var v=arr[i];
    if(typeof v!=="number" || v<0 || v>=N || seen[v]) return false;
    seen[v]=true;
  }
  return true;
}
function loadOrder(){
  try{
    var raw=localStorage.getItem(ORDER_KEY);
    if(!raw) return null;
    var arr=JSON.parse(raw);
    return isValidOrder(arr) ? arr : null;
  }catch(e){ return null; }
}
function saveOrder(order){ try{ localStorage.setItem(ORDER_KEY, JSON.stringify(order)); }catch(e){} }
function shuffleOrder(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var currentOrder = loadOrder() || identityOrder();
var pendingFreshMode = "original";

var jumpOpen = false;

function fresh(){ return { cur:0, answers:{}, shuffles:{}, showResults:false }; }

function loadState(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return fresh();
    var s = JSON.parse(raw);
    if(typeof s.cur !== "number" || s.cur < 0 || s.cur >= N) throw 0;
    if(typeof s.answers !== "object" || s.answers === null) throw 0;
    if(typeof s.shuffles !== "object" || s.shuffles === null) throw 0;
    s.showResults = !!s.showResults;
    return s;
  }catch(e){
    localStorage.removeItem(KEY);
    return fresh();
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function getAttempts(){ var v = parseInt(localStorage.getItem(ATTEMPTS_KEY),10); return isNaN(v)?0:v; }
function setAttempts(v){ try{ localStorage.setItem(ATTEMPTS_KEY, String(v)); }catch(e){} }

var state = loadState();
var retry = null;            // {list, cur, answers, shuffles}
var view = state.showResults ? "results" : "quiz";  // quiz | results | retry | retryResults

function shuffleArr(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function getShuffle(store, qi){
  if(!store[qi]){ store[qi] = shuffleArr([0,1,2,3]); if(store===state.shuffles) save(); }
  return store[qi];
}

function session(){
  if(view==="retry" || view==="retryResults"){
    return { list:retry.list, cur:retry.cur, answers:retry.answers, shuffles:retry.shuffles, isRetry:true };
  }
  return { list:currentOrder, cur:state.cur, answers:state.answers, shuffles:state.shuffles, isRetry:false };
}

function answeredCount(sess){
  var c=0; for(var i=0;i<sess.list.length;i++){ if(sess.answers[sess.list[i]]!==undefined) c++; } return c;
}

function toggleJump(){ jumpOpen=!jumpOpen; render(); }

function renderNav(sess){
  var total = sess.list.length;
  var ans = answeredCount(sess);
  document.getElementById("navCount").textContent = (view==="results"||view==="retryResults") ? "Results" : (ans + " / " + total);
  document.getElementById("barFill").style.width = (total? Math.round(ans/total*100):0) + "%";

  var jb = document.getElementById("jumpBtn");
  jb.textContent = jumpOpen ? "Hide" : "Jump";

  var rb = document.getElementById("resBtn");
  rb.style.display = (state.showResults && view==="quiz") ? "block" : "none";

  var dotsEl = document.getElementById("dots");
  dotsEl.style.display = jumpOpen ? "flex" : "none";
  dotsEl.innerHTML = "";
  for(var p=0;p<sess.list.length;p++){
    var qi = sess.list[p];
    var b = document.createElement("button");
    b.className = "dot";
    b.textContent = (p+1);
    var a = sess.answers[qi];
    if(a!==undefined){ b.className += (a===QUESTIONS[qi].ci) ? " correct" : " wrong"; }
    if(p===sess.cur && (view==="quiz"||view==="retry")) b.className += " cur";
    (function(pp){ b.onclick=function(){ jumpTo(pp); }; })(p);
    dotsEl.appendChild(b);
  }
}

function jumpTo(p){
  if(view==="results"){ view="quiz"; }
  if(view==="retryResults"){ view="retry"; }
  if(view==="quiz"){ state.cur=p; save(); }
  else if(view==="retry"){ retry.cur=p; }
  render();
}

function diagramHTML(q, answered){
  var blank = answered
    ? '<span id="pB" class="blank filled">' + q.options[q.ci] + '</span>'
    : '<span id="pB" class="blank">&nbsp;</span>';
  var active = '<span id="aS">' + q.s + '</span> '
             + '<span id="aV" class="vb">' + q.v + '</span> '
             + '<span id="aO">' + q.o + '</span>.';
  var passive = '<span id="pS">' + q.pBefore + '</span> '
              + blank + ' '
              + '<span id="pBy">' + q.pAfter + '</span>';
  return '<div class="diagram" id="diagram">'
    + '<svg class="arrow-overlay" id="arrowSvg"></svg>'
    + '<div class="sline"><span class="lbl">ACTIVE</span><span class="stext">' + active + '</span></div>'
    + '<div class="gap"></div>'
    + '<div class="sline"><span class="lbl">PASSIVE</span><span class="stext">' + passive + '</span></div>'
    + '</div>';
}

function drawArrows(){
  var d = document.getElementById("diagram");
  var svg = document.getElementById("arrowSvg");
  if(!d || !svg) return;
  var dr = d.getBoundingClientRect();
  var W = d.clientWidth, H = d.clientHeight;
  function c(id){
    var el = document.getElementById(id); if(!el) return null;
    var r = el.getBoundingClientRect();
    return { x:(r.left+r.right)/2 - dr.left, top:r.top - dr.top, bottom:r.bottom - dr.top };
  }
  var aS=c("aS"), aV=c("aV"), aO=c("aO"), pS=c("pS"), pB=c("pB"), pBy=c("pBy");
  if(!aS||!aV||!aO||!pS||!pB||!pBy) return;
  function line(x1,y1,x2,y2){
    return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)
      +'" stroke="#185FA5" stroke-width="2.4" marker-end="url(#ah2)"></line>';
  }
  var inner = '<defs><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">'
    + '<path d="M0,0 L10,5 L0,10 z" fill="#185FA5"></path></marker></defs>';
  // subject (top-left) -> by-phrase (bottom-right)
  inner += line(aS.x, aS.bottom + 3, pBy.x, pBy.top - 5);
  // object (top-right) -> new subject (bottom-left)
  inner += line(aO.x, aO.bottom + 3, pS.x, pS.top - 5);
  // verb (top-center) -> blank (bottom-center): vertical
  inner += line(aV.x, aV.bottom + 3, pB.x, pB.top - 6);
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);
  svg.innerHTML = inner;
}

function renderQuiz(sess){
  var qi = sess.list[sess.cur];
  var q = QUESTIONS[qi];
  var sel = sess.answers[qi];
  var answered = sel!==undefined;
  var order = getShuffle(sess.shuffles, qi);

  var html = '';
  html += '<div id="quizCard">';
  html += '<div class="qnum">Question ' + (sess.cur+1) + ' of ' + sess.list.length + (sess.isRetry?' (Retry)':'') + '</div>';
  html += '<div class="qtext">Choose the correct verb form to complete the passive sentence.</div>';
  html += diagramHTML(q, answered);
  html += '<div class="opts">';
  for(var d=0; d<order.length; d++){
    var oi = order[d];
    var cls = "opt";
    if(answered){
      if(oi===q.ci) cls += " correct";
      else if(oi===sel) cls += " wrong";
    }
    html += '<button class="' + cls + '" ' + (answered?'disabled':'') + ' onclick="pick(' + oi + ')">' + q.options[oi] + '</button>';
  }
  html += '</div>';

  var ex = (answered && sel!==q.ci) ? ' show' : '';
  html += '<div class="explain' + ex + '">' + q.explanation + '</div>';

  // nav buttons
  var isLast = (sess.cur === sess.list.length-1);
  html += '<div class="navbtns">';
  html += '<button class="navbtn prev" ' + (sess.cur===0?'disabled':'') + ' onclick="goPrev()">Prev</button>';
  if(isLast){
    html += '<button class="navbtn next" onclick="goResults(' + (sess.isRetry?'true':'false') + ')">See Results &rarr;</button>';
  } else {
    html += '<button class="navbtn next" onclick="goNext()">Next</button>';
  }
  html += '</div>';
  html += '</div>';

  var qa = document.getElementById("quizArea");
  qa.innerHTML = html;
  qa.style.display = "block";
  document.getElementById("resultsScreen").className = "";
  document.getElementById("resultsScreen").style.display = "none";
  if(window.requestAnimationFrame){ requestAnimationFrame(function(){ requestAnimationFrame(drawArrows); }); }
  else { setTimeout(drawArrows, 30); }
}

function pick(oi){
  var sess = session();
  var qi = sess.list[sess.cur];
  if(sess.answers[qi]!==undefined) return;
  sess.answers[qi] = oi;
  if(!sess.isRetry) save();
  render();
}
function goPrev(){
  var sess = session();
  if(sess.cur>0){ if(sess.isRetry) retry.cur--; else { state.cur--; save(); } render(); }
}
function goNext(){
  var sess = session();
  if(sess.cur < sess.list.length-1){ if(sess.isRetry) retry.cur++; else { state.cur++; save(); } render(); }
}

function goResults(isRetry){
  if(isRetry){ view="retryResults"; render(); return; }
  try{ setAttempts(getAttempts()+1); }catch(e){}
  state.showResults = true; save();
  view="results"; jumpOpen=false; render();
}

function renderResults(){
  var correct=0, wrong=0, skipped=0;
  for(var i=0;i<N;i++){
    var a = state.answers[i];
    if(a===undefined) skipped++;
    else if(a===QUESTIONS[i].ci) correct++;
    else wrong++;
  }
  var html = '';
  html += '<div class="score">' + correct + ' / ' + N + '</div>';
  html += '<div class="score-sub">Correct: ' + correct + '  |  Wrong: ' + wrong + '  |  Skipped: ' + skipped + '</div>';
  html += '<div class="grid">';
  for(var j=0;j<N;j++){
    var aa = state.answers[j];
    var st, lab;
    if(aa===undefined){ st="s"; lab="Skipped"; }
    else if(aa===QUESTIONS[j].ci){ st="c"; lab="Correct"; }
    else { st="w"; lab="Wrong"; }
    html += '<div class="gcard ' + st + '" onclick="jumpFromResults(' + j + ')">'
         + '<div class="gn">Q' + (j+1) + '</div><div class="gs">' + lab + '</div></div>';
  }
  html += '</div>';
  html += '<div class="actbtns">';
  html += '<button class="actbtn copy" onclick="copyAll()">Copy All Results</button>';
  html += '<button class="actbtn retry" onclick="startRetry()">Retry Wrong Questions</button>';
  html += '<button class="actbtn fresh" id="startFreshBtn" onclick="openModal(\'original\')">Start Fresh (Original Order)</button>';
  html += '<button class="actbtn fresh" id="startFreshRandomBtn" onclick="openModal(\'random\')">Start Fresh (Random Order)</button>';
  html += '</div>';

  document.getElementById("quizArea").style.display = "none";
  var rs = document.getElementById("resultsScreen");
  rs.innerHTML = html;
  rs.className = "show";
  rs.style.display = "block";
}

function jumpFromResults(j){ view="quiz"; state.cur=j; save(); render(); }

function startRetry(){
  var list=[];
  for(var i=0;i<N;i++){ var a=state.answers[i]; if(a!==undefined && a!==QUESTIONS[i].ci) list.push(i); }
  if(list.length===0){ return; }
  retry = { list:list, cur:0, answers:{}, shuffles:{} };
  view="retry"; jumpOpen=false; render();
}

function renderRetryResults(){
  var correct=0;
  for(var i=0;i<retry.list.length;i++){ var qi=retry.list[i]; if(retry.answers[qi]===QUESTIONS[qi].ci) correct++; }
  var total = retry.list.length;
  var html='';
  html += '<div class="score">' + correct + ' / ' + total + '</div>';
  html += '<div class="score-sub">Retry round complete</div>';
  html += '<div class="grid">';
  for(var j=0;j<retry.list.length;j++){
    var qi2=retry.list[j]; var aa=retry.answers[qi2];
    var st,lab;
    if(aa===undefined){ st="s"; lab="Skipped"; }
    else if(aa===QUESTIONS[qi2].ci){ st="c"; lab="Correct"; }
    else { st="w"; lab="Wrong"; }
    html += '<div class="gcard ' + st + '"><div class="gn">Q' + (qi2+1) + '</div><div class="gs">' + lab + '</div></div>';
  }
  html += '</div>';
  html += '<div class="actbtns">';
  html += '<button class="actbtn retry" onclick="backToMain()">Back to Results</button>';
  html += '</div>';

  document.getElementById("quizArea").style.display="none";
  var rs=document.getElementById("resultsScreen");
  rs.innerHTML=html; rs.className="show"; rs.style.display="block";
}
function backToMain(){ retry=null; view="results"; render(); }

function copyAll(){
  var correct=0;
  for(var i=0;i<N;i++){ if(state.answers[i]===QUESTIONS[i].ci) correct++; }
  var lines=["Passive Voice Quiz - Results","Score: " + correct + " / " + N, ""];
  for(var j=0;j<N;j++){
    var q=QUESTIONS[j]; var a=state.answers[j];
    var full = q.pBefore + " " + q.options[q.ci] + " " + q.pAfter;
    var mark;
    if(a===undefined) mark="SKIPPED";
    else if(a===q.ci) mark="CORRECT";
    else mark="WRONG (you: " + q.options[a] + ")";
    lines.push((j+1) + ". " + mark + " - " + full);
  }
  var text=lines.join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flashCopy, fallbackCopy.bind(null,text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.top="-9999px"; ta.setAttribute("readonly","");
  document.body.appendChild(ta); ta.focus(); ta.setSelectionRange(0,ta.value.length);
  try{ document.execCommand("copy"); flashCopy(); }catch(e){}
  document.body.removeChild(ta);
}
function flashCopy(){
  var b=document.querySelector(".actbtn.copy"); if(!b) return;
  var old=b.textContent; b.textContent="Copied!";
  setTimeout(function(){ b.textContent=old; },1200);
}

function openModal(mode){
  pendingFreshMode = mode;
  document.getElementById("modalTitle").textContent = mode === "random" ? "Start Fresh (Random Order)?" : "Start Fresh (Original Order)?";
  document.getElementById("modalText").textContent = mode === "random" ? "Questions will be reshuffled into a new random order, and all progress will be reset." : "Questions will return to their original order, and all progress will be reset.";
  document.getElementById("overlay").className="overlay show";
}
function closeModal(){ document.getElementById("overlay").className="overlay"; }
function doFresh(){
  localStorage.removeItem(KEY);
  state = fresh(); retry=null; view="quiz"; jumpOpen=false;
  currentOrder = (pendingFreshMode === "random") ? shuffleOrder(identityOrder()) : identityOrder();
  saveOrder(currentOrder);
  closeModal(); render();
}

function render(){
  try{
    document.getElementById("attempts").textContent = "Total Attempts: " + getAttempts();
    var sess = session();
    renderNav(sess);
    if(view==="results"){ renderResults(); }
    else if(view==="retryResults"){ renderRetryResults(); }
    else { renderQuiz(sess); }
  }catch(e){
    var qa=document.getElementById("quizArea");
    qa.style.display="block";
    qa.innerHTML='<div style="padding:20px;text-align:center;color:#501313;background:#FCEBEB;border-radius:12px;">Something went wrong rendering this screen. Tap below to restart.<br><br><button class="actbtn fresh" onclick="doFresh()">Restart</button></div>';
  }
}

var _rt;
window.addEventListener("resize", function(){
  clearTimeout(_rt);
  _rt = setTimeout(function(){
    if((view==="quiz"||view==="retry") && document.getElementById("diagram")) drawArrows();
  }, 120);
});

render();
</script>
